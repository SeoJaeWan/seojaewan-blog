# @codocs [[콘텐츠 원천:갱신 방식]]
# 글 동기화. Notion의 공개 글을 저장소의 글 JSON(apps/web/content/notion.json)으로 내보내, 바뀌었으면 한 번의 실행에서
# 운영 글 빌드로 검사하고 PR을 만들어 바로 병합한다. 병합되면 배포(젠킨스)가 main을 보고 다시 배포한다.
# 시작: Notion 웹훅(Cloudflare Worker가 repository_dispatch로 중계, tools/notion-webhook), 하루 한 번 예약(놓친 웹훅 대비), 수동 실행.
# 초안(비공개 행)만 바뀐 이벤트는 내보내기 결과가 같아 "바뀐 것 없음"으로 끝난다.
# 운영 글 빌드가 실패하면 PR을 열지 않고 notify로 카카오톡을 보낸다. 병합 전에 다른 워크플로의 검사를 기다리지 않는다
# (ci.yml은 이 브랜치의 PR과 병합된 main push에서 돌지 않는다).
#
# 토큰: 글 동기화의 push·PR 만들기·병합은 모두 워크플로의 기본 GITHUB_TOKEN으로 한다(PAT 없음, CONTENT_SYNC_TOKEN 불필요).
# GITHUB_TOKEN이 만든 push·PR 이벤트는 다른 워크플로를 부르지 않는데, 이 구조에서는 그것이 바로 필요한 성질이다.
# 병합 뒤 main push에서 돌릴 워크플로가 없고(배포는 젠킨스가 main을 2분마다 직접 확인한다), PR이 열릴 때 도는 검사
# 워크플로(Figma·모션 검사 등)도 이 PR에서는 필요 없다. PAT로 하면 오히려 그것들이 불필요하게 시작한다.
# 필요한 최소 권한은 contents: write(브랜치 push, 병합), pull-requests: write(PR 만들기·닫기)다.
# 단 저장소 설정 Settings > Actions > General > Workflow permissions의
# "Allow GitHub Actions to create and approve pull requests"가 켜져 있어야 GITHUB_TOKEN이 PR을 만들 수 있다(사람이 켠다).
#
# 저장소 비밀값(사람이 등록한다)
# - NOTION_TOKEN: Notion 연동 seojaewan-blog의 토큰(읽기 전용)
# - ALERT_SECRET: notify의 blog 서비스 비밀값(없으면 알림 스크립트가 경고만 남긴다)
# 저장소 변수(Settings > Secrets and variables > Actions > Variables)
# - ALERT_URL: notify의 바깥에서 닿는 주소. 호스티드 러너는 미니 PC 안쪽 주소(10.88.0.1)에 닿지 않는다. 바깥 주소는 아직 정해지지 않았다.
name: Content sync

on:
  # @codocs [[콘텐츠 원천:갱신 방식]]
  # Notion 웹훅을 받은 Cloudflare Worker(tools/notion-webhook)가 이 이름으로 부른다. Worker의 DISPATCH_EVENT_TYPE과 같아야 한다
  repository_dispatch:
    types: [notion-content-changed]
  schedule:
    # 하루 한 번 03:43(UTC). 놓친 웹훅을 줍는다. 정각은 GitHub 예약 작업이 몰려 늦어지기 쉬워 피했다
    - cron: '43 3 * * *'
  workflow_dispatch:

# 한 번에 하나만 돈다. 앞의 실행을 끊지 않고 기다린다(push 도중에 끊기지 않게).
# Notion은 글을 쓰는 동안 이벤트를 여러 번 보내지만, 대기 실행은 하나로 접히므로(진행 중 하나 + 대기 하나) 마지막 상태를 한 번 더 내보낸다.
concurrency:
  group: content-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # 동기화 PR의 고정 브랜치. 브랜치 이름 규칙(종류/짧은-설명)을 따른다
  SYNC_BRANCH: chore/notion-content-sync
  # 글 JSON을 두는 폴더. 배포가 "글 JSON만 바뀐 병합"을 이 폴더로 알아본다
  CONTENT_PATH: apps/web/content
  # @codocs [[알림 프로세스:결정]]
  ALERT_URL: ${{ vars.ALERT_URL }}
  # 저장소 규칙의 커밋 작성자([[Git 작업 규칙:커밋]])
  GIT_AUTHOR_NAME: Ing-yeo_Developer
  GIT_AUTHOR_EMAIL: 52366178+SeoJaeWan@users.noreply.github.com
  GIT_COMMITTER_NAME: Ing-yeo_Developer
  GIT_COMMITTER_EMAIL: 52366178+SeoJaeWan@users.noreply.github.com
  # Git 훅(lint-staged, 증분 타입 검사)은 사람의 커밋용이다. 동기화 커밋은 같은 실행의 운영 글 빌드가 검사한다
  HUSKY: 0

jobs:
  sync:
    name: Content sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Check secrets
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::저장소 비밀값 NOTION_TOKEN이 없다. Settings > Secrets and variables > Actions에 등록한다."
            exit 1
          fi

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 운영 글 빌드가 앱 전체와 디자인 시스템을 빌드하므로 전체를 설치한다
      - run: pnpm install --frozen-lockfile

      - name: Export Notion content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: pnpm --filter @seojaewan/web export:notion-content

      - name: Check changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- "$CONTENT_PATH")" ]; then
            echo "글 JSON이 main과 같다. 할 일이 없다."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- "$CONTENT_PATH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 초안만 바뀐 이벤트이거나 Notion이 다시 main과 같아진 경우다. 앞선 병합 실패로 남은 동기화 PR이 있으면 닫는다
      - name: Close stale sync PR
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/content-sync-pr.sh close-stale

      # @codocs [[콘텐츠 원천:읽는 곳]]
      # 깨진 글이 병합되지 않게 하는 유일한 검사다. 빌드는 저장소에 커밋한 글 JSON(운영 글)을 읽는다.
      # 방금 내보낸 파일이 작업 폴더에 있으므로 병합 전의 글로 빌드한다
      - name: Build with production content
        id: build
        if: steps.changes.outputs.changed == 'true'
        env:
          CONTENT_SOURCE: notion
        run: pnpm build

      - name: Commit, open PR and merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/content-sync-pr.sh publish

      - name: Alert on failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = failure ]; then
            bash scripts/notify-alert.sh '글 동기화가 멈췄다: 글 빌드 실패' \
              '운영 글로 빌드가 실패해 PR을 열지 않았다. Notion 글을 고치면 다음 동기화가 다시 확인한다. 실행 기록을 확인한다.' "$RUN_URL"
          else
            bash scripts/notify-alert.sh '글 동기화가 실패했다' \
              'GitHub Actions 글 동기화(Content sync)가 실패했다. 실행 기록을 확인한다.' "$RUN_URL"
          fi
