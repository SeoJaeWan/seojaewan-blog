# @codocs [[콘텐츠 원천:갱신 방식]]
# 글 동기화. 운영 Notion의 공개 글을 1시간마다 저장소의 글 JSON(apps/web/content/notion.json)으로 내보낸다.
# 바뀌었으면 고정 브랜치에 커밋해 PR을 만들거나 갱신한다(scripts/content-sync-pr.sh).
# 초안(비공개 행)만 바뀌었거나 결과가 같으면 아무것도 하지 않는다. 실패하면 notify로 카카오톡을 보낸다.
# 병합은 content-sync-merge.yml이 PR의 검사 결과를 보고 한다. 실패한 검사의 알림도 그쪽이 보낸다.
# 그쪽이 놓친 PR은 이 워크플로가 시작할 때(merge-ready) 같은 스크립트로 병합한다. 늦어도 다음 시간에는 병합된다.
#
# 저장소 비밀값(사람이 등록한다)
# - CONTENT_SYNC_TOKEN: push, PR 만들기, 병합용 Fine-grained PAT(Contents·Pull requests 쓰기). 기본 GITHUB_TOKEN으로 만든
#   PR에는 다른 워크플로(CI)가 돌지 않아 따로 쓴다.
# - NOTION_TOKEN: Notion 연동 seojaewan-blog의 토큰(읽기 전용)
# - ALERT_SECRET: notify의 blog 서비스 비밀값
name: Content sync

on:
  schedule:
    # 매시 17분(UTC). 정각은 GitHub 예약 작업이 몰려 늦어지기 쉽다
    - cron: '17 * * * *'
  workflow_dispatch:

# 한 번에 하나만 돈다. 앞의 실행을 끊지 않고 기다린다(push 도중에 끊기지 않게)
concurrency:
  group: content-sync
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  # 동기화 PR의 고정 브랜치. 브랜치 이름 규칙(종류/짧은-설명)을 따른다
  SYNC_BRANCH: chore/notion-content-sync
  # 글 JSON을 두는 폴더. 배포가 "글 JSON만 바뀐 병합"을 이 폴더로 알아본다
  CONTENT_PATH: apps/web/content
  # @codocs [[알림 프로세스:결정]]
  ALERT_URL: http://10.88.0.1:8790/notify
  # 저장소 규칙의 커밋 작성자([[Git 작업 규칙:커밋]])
  GIT_AUTHOR_NAME: Ing-yeo_Developer
  GIT_AUTHOR_EMAIL: 52366178+SeoJaeWan@users.noreply.github.com
  GIT_COMMITTER_NAME: Ing-yeo_Developer
  GIT_COMMITTER_EMAIL: 52366178+SeoJaeWan@users.noreply.github.com
  # Git 훅(lint-staged, 증분 타입 검사)은 사람의 커밋용이다. 동기화 커밋은 PR의 CI가 검사한다
  HUSKY: 0

jobs:
  # 필수 검사가 모두 통과한 채 열려 있는 동기화 PR을 병합한다. 내보내기 전에 해야 다음 작업이 병합된 main에서 시작한다
  merge-ready:
    name: Merge ready sync PR
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts

      - name: Merge if ready
        env:
          GH_REPO: ${{ github.repository }}
          # 읽기는 GITHUB_TOKEN(Fine-grained PAT에는 Checks 권한이 없다), 병합은 PAT(main push의 CI가 돌게)
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: |
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::error::저장소 비밀값 CONTENT_SYNC_TOKEN이 없다. Settings > Secrets and variables > Actions에 등록한다."
            exit 1
          fi
          bash scripts/content-sync-merge.sh

      - name: Alert on failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify-alert.sh '글 동기화 PR 병합 작업이 실패했다' \
            'Content sync의 Merge ready sync PR 작업이 실패했다. 실행 기록을 확인한다.' "$RUN_URL"

  sync:
    name: Content sync
    needs: merge-ready
    # 병합 확인이 실패해도 동기화는 한다
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          # 동기화 브랜치를 push하는 토큰이다. 비밀값이 없을 때도 알림 스크립트를 쓰도록 기본 토큰으로 받고 다음 단계에서 멈춘다
          token: ${{ secrets.CONTENT_SYNC_TOKEN || github.token }}

      - name: Check secrets
        env:
          CONTENT_SYNC_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          missing=()
          [ -n "$CONTENT_SYNC_TOKEN" ] || missing+=(CONTENT_SYNC_TOKEN)
          [ -n "$NOTION_TOKEN" ] || missing+=(NOTION_TOKEN)
          [ -n "$ALERT_SECRET" ] || missing+=(ALERT_SECRET)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::저장소 비밀값이 없다: ${missing[*]}. Settings > Secrets and variables > Actions에 등록한다."
            exit 1
          fi

      # 한 머신의 runner들이 기본 설치 위치(~/setup-pnpm)를 함께 쓰지 않게 job마다 따로 설치한다
      - uses: pnpm/action-setup@v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile --filter @seojaewan/web...

      - name: Export Notion content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: pnpm --filter @seojaewan/web export:notion-content

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
        run: bash scripts/content-sync-pr.sh

      - name: Alert on failure
        if: failure()
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify-alert.sh '글 동기화가 실패했다' \
            'GitHub Actions 글 동기화(Content sync)가 실패했다. 실행 기록을 확인한다.' "$RUN_URL"
