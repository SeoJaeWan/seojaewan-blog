# @codocs [[콘텐츠 원천:갱신 방식]]
# 글 동기화 PR의 병합. GitHub Free 비공개 저장소라 ruleset(필수 검사)과 자동 병합(auto-merge)이 동작하지 않아,
# 동기화 브랜치에서 검사 워크플로 하나가 끝날 때마다 필수 검사 6개를 확인해 모두 성공이면 병합한다.
# 실패한 워크플로가 있으면 병합하지 않고 notify로 카카오톡을 보낸다(scripts/content-sync-merge.sh).
# 검사가 끝나기를 기다리며 runner를 붙잡지 않는다. 끝날 때마다 잠깐 돌고 끝난다(runner가 셋뿐이라 CI와 다투지 않게).
# 이 경로가 놓친 PR(일시적인 API 오류 등)은 매시 동기화 작업(content-sync.yml)이 시작할 때 같은 스크립트로 병합한다.
# workflow_run 실행은 기본 브랜치(main)에서 돈다. 실행 목록의 head_branch도 main이므로 동기화 브랜치로 걸러 찾으면 안 나온다.
name: Content sync merge

on:
  workflow_run:
    # 필수 검사 6개를 내는 워크플로. 이름은 각 워크플로의 name이다
    workflows: [CI, Figma generated, Figma parity, Motion check]
    types: [completed]

# 끝난 워크플로마다 따로 줄을 세운다. 한 그룹에 묶으면 대기 중인 실행이 새 실행에 밀려 취소되어(concurrency의 pending은
# 하나뿐이다) 그 워크플로의 실패 알림을 잃는다. 두 실행이 함께 병합하려 해도 GitHub는 한 번만 병합하고, 스크립트는 이미
# 병합된 PR을 성공으로 본다.
concurrency:
  group: content-sync-merge-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  merge:
    name: Content sync merge
    # 동기화 브랜치의 PR 검사만 본다. 새 push로 취소된 실행(cancelled)은 그 뒤 실행이 다시 부른다
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'chore/notion-content-sync' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts

      - name: Merge or alert
        env:
          SYNC_BRANCH: chore/notion-content-sync
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_REPO: ${{ github.repository }}
          # 읽기는 GITHUB_TOKEN으로 한다. Fine-grained PAT에는 Checks 권한이 없어 check run 목록이 403이다
          GH_TOKEN: ${{ github.token }}
          # 병합은 PAT로 한다. main push의 CI가 돌게 하기 위해서다(GITHUB_TOKEN이 만든 이벤트는 워크플로를 부르지 않는다)
          MERGE_TOKEN: ${{ secrets.CONTENT_SYNC_TOKEN }}
          # @codocs [[알림 프로세스:결정]]
          ALERT_URL: http://10.88.0.1:8790/notify
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: |
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::error::저장소 비밀값 CONTENT_SYNC_TOKEN이 없다. Settings > Secrets and variables > Actions에 등록한다."
            exit 1
          fi
          bash scripts/content-sync-merge.sh

      - name: Alert on failure
        if: failure()
        env:
          ALERT_URL: http://10.88.0.1:8790/notify
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify-alert.sh '글 동기화 PR 병합 작업이 실패했다' \
            'Content sync merge 워크플로가 실패했다. 실행 기록을 확인한다.' "$RUN_URL"
