# @codocs [[피그마 연동:CI]]
# 생성 파일 검사. 토큰 생성 확인([[피그마 연동:토큰 검사]])과 자산 생성 확인([[피그마 연동:자산]])을 한다.
# on: paths를 쓰지 않고 늘 시작해, 첫 단계에서 git diff로 범위를 본다. 토큰과 자산을 따로 판단하고,
# 해당이 없으면 의존성 설치 없이 통과로 끝난다(필수 검사가 "대기 중"에 걸리지 않게 하기 위해서다).
# 토큰 범위: figma/tokens.json, src/tokens.css, 토큰 변환 스크립트
# 자산 범위: figma/assets/, src/assets/, 자산 생성기 스크립트
# 이 워크플로 파일이 바뀌면 둘 다 검사한다
# CI는 PR 브랜치에 커밋하지 않고 실패만 한다.
name: Figma generated

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: figma-generated-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  figma-generated:
    # ruleset의 필수 검사 이름과 같아야 한다
    name: Figma generated
    runs-on: ubuntu-latest
    env:
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 바뀐 파일을 보려면 기준 브랜치와의 merge-base가 필요하다
          fetch-depth: 0

      # 범위: git diff만으로 정한다. 의존성 설치 전에 한다
      - name: Affected range
        id: range
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD)
          else
            files=$(git diff --name-only HEAD^1 HEAD)
          fi
          echo "바뀐 파일:"
          echo "$files"
          ds=packages/design-system
          tokens=false
          assets=false
          if grep -qE "^($ds/figma/tokens\.json|$ds/src/tokens\.css|$ds/scripts/tokens/|\.github/workflows/figma-generated\.yml$)" <<< "$files"; then
            tokens=true
          fi
          if grep -qE "^($ds/figma/assets/|$ds/src/assets/|$ds/scripts/assets/|\.github/workflows/figma-generated\.yml$)" <<< "$files"; then
            assets=true
          fi
          echo "토큰 검사: $tokens, 자산 검사: $assets"
          {
            echo "tokens=$tokens"
            echo "assets=$assets"
            if [ "$tokens" = true ] || [ "$assets" = true ]; then echo "any=true"; else echo "any=false"; fi
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.range.outputs.any == 'true'

      - uses: actions/setup-node@v7
        if: steps.range.outputs.any == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.range.outputs.any == 'true'
        run: pnpm install --frozen-lockfile

      # @codocs [[피그마 연동:자산]]
      # 코드 자산(src/assets/)이 figma/assets/에서 다시 만든 결과와 같은지 확인한다. CI는 고치지 않고 실패만 한다
      - name: Generated assets check
        if: steps.range.outputs.assets == 'true'
        run: pnpm --filter @seojaewan/design-system generate:assets --check

      # @codocs [[피그마 연동:토큰 검사]]
      # src/tokens.css가 figma/tokens.json에서 다시 만든 결과와 같은지 확인한다. CI는 고치지 않고 실패만 한다
      - name: Generated tokens check
        if: steps.range.outputs.tokens == 'true'
        run: pnpm --filter @seojaewan/design-system generate:tokens --check
