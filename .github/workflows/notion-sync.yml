# Notion 콘텐츠 sync 트리거. Canonical pipeline은 Workbench Local Work Memory를 따른다.
# cron 폴링 → 변경 있을 때만 커밋 → push가 Vercel 배포 트리거.
# 변경 없으면 sync가 API 3콜로 종료하고 커밋도 배포도 없다.
name: Notion Sync

on:
  schedule:
    # 주 1회 — 월요일 00:17 UTC(KST 월 09:17). 정각은 GitHub cron 지연이 심해 피한다.
    # 즉시 발행은 workflow_dispatch 수동 실행.
    - cron: "17 0 * * 1"
  # 즉시 발행 수동 버튼
  workflow_dispatch:
  # 3단계(웹훅 글루) 대비 — Vercel route handler가 호출할 이벤트
  repository_dispatch:
    types: [notion-sync]

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 버전은 package.json packageManager에서 읽는다

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_BLOG_DATABASE_ID: ${{ secrets.NOTION_BLOG_DATABASE_ID }}
          NOTION_PROJECT_DATABASE_ID: ${{ secrets.NOTION_PROJECT_DATABASE_ID }}
          NOTION_ABOUT_DATABASE_ID: ${{ secrets.NOTION_ABOUT_DATABASE_ID }}

      - name: Commit & push if changed
        run: |
          git add apps/web/content/notion
          # 이미지 자산 디렉터리는 만료형(file) 이미지를 처음 받을 때 생긴다
          if [ -d apps/web/public/notion ]; then
            git add apps/web/public/notion
          fi
          if git diff --cached --quiet; then
            echo "콘텐츠 변경 없음 — 커밋/배포 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(content): sync notion content"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
