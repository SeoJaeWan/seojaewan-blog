# @codocs [[테스트 작성 규칙:E2E]]
# 행위 표 결과 페이지. `main` push마다 모든 행위 케이스를 trace와 함께 돌려, 결과(통과·실패)와 trace zip을
# 표 데이터에 붙인 정적 페이지(tools/behavior-cases)를 GitHub Pages에 올린다. trace는 trace.playwright.dev 뷰어가
# Pages 주소로 연다. 필수 검사가 아니라 실패해도 다른 CI와 병합을 막지 않는다.
# E2E가 실패해도 결과 페이지는 만들어 올리고, 마지막에 이 작업을 실패로 표시한다.
name: Behavior cases

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포는 하나씩 하고, 진행 중인 배포는 끊지 않는다(GitHub Pages 예시와 같다).
concurrency:
  group: behavior-cases-pages
  cancel-in-progress: false

permissions: {}

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  report:
    name: Behavior cases report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @seojaewan/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # 모든 케이스의 trace를 남긴다. 실패해도 결과 페이지를 만들도록 다음 단계로 넘어간다.
      - name: Run behavior cases
        id: cases
        continue-on-error: true
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tools/behavior-cases/results.json
        run: pnpm exec playwright test --trace on --reporter=json,line

      - name: Build report page
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm --filter @seojaewan/behavior-cases build:report --results results.json --run-url "$RUN_URL"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: tools/behavior-cases/report

      - name: Fail when cases failed
        if: steps.cases.outcome != 'success'
        run: exit 1

  deploy:
    name: Deploy behavior cases
    needs: report
    # 케이스가 실패해도 결과 페이지는 올린다.
    if: ${{ !cancelled() && needs.report.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
