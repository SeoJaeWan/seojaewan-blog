# @codocs [[Git 작업 규칙:CI]]
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build:storybook

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @seojaewan/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # @codocs [[피그마 일치 검사:CI 비교]]
  # 피그마 이미지와 Storybook 스크린샷을 비교한다. PR은 main 대비 영향받는 컴포넌트만, main push는 전체를 비교한다.
  figma-parity:
    name: Figma parity
    # PR에서 영향받는 컴포넌트만 비교한다. main 병합 뒤 전체 비교는 두지 않는다
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 비교 범위를 정하려면 기준 브랜치와의 merge-base가 필요하다
          fetch-depth: 0

      - name: Check Figma export
        id: figma
        run: |
          if [ -f packages/design-system/figma/export.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "figma/export.json이 아직 없어 피그마 일치 검사를 건너뛴다."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.figma.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.figma.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.figma.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.figma.outputs.present == 'true'
        run: pnpm --filter @seojaewan/design-system exec playwright install --with-deps chromium

      - name: Figma parity (affected)
        if: steps.figma.outputs.present == 'true'
        run: pnpm --filter @seojaewan/design-system test:parity --affected --base origin/${{ github.base_ref }}

      # 임시 실험: Chromium 글꼴 렌더링 인자별로 비교 결과를 모은다.
      - name: Figma parity font experiments
        if: always() && steps.figma.outputs.present == 'true'
        working-directory: packages/design-system
        run: |
          run_experiment() {
            name=$1; channel=$2; shift 2
            channel_flag=""
            if [ -n "$channel" ]; then channel_flag="--experiment-channel=$channel"; fi
            node scripts/parity/run-parity.ts --no-build $channel_flag "--experiment-args=$*" > "exp-$name.log" 2>&1 || true
            mkdir -p "experiments/$name"
            if [ -d parity-results ]; then cp -r parity-results/. "experiments/$name/"; rm -rf parity-results; fi
            cp "exp-$name.log" "experiments/$name/run.log"
          }
          run_experiment default ""
          run_experiment hinting-none "" --font-render-hinting=none --disable-lcd-text
          run_experiment hinting-none-subpixel "" --font-render-hinting=none --disable-lcd-text --enable-font-subpixel-positioning
          run_experiment hinting-slight "" --font-render-hinting=slight --disable-lcd-text
          run_experiment new-headless chromium --font-render-hinting=none --disable-lcd-text
          run_experiment new-headless-default chromium

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: figma-parity-experiments
          path: packages/design-system/experiments/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: figma-parity-results
          path: packages/design-system/parity-results/
          if-no-files-found: ignore
          retention-days: 7
