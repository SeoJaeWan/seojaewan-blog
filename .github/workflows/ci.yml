# @codocs [[Git 작업 규칙:CI]]
# `Branch name` 작업은 PR 브랜치 이름을 검사한다([[Git 작업 규칙:브랜치]]). 늘 시작해 `main` push에서도 `main`을 검사한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # @codocs [[콘텐츠 원천:읽는 곳]]
  # CI와 E2E는 Notion이 아니라 저장소의 fixture를 읽는다(빌드와 앱 실행 모두)
  CONTENT_SOURCE: fixture

jobs:
  branch-name:
    # ruleset의 필수 검사 이름과 같아야 한다
    name: Branch name
    runs-on: [self-hosted, linux]
    env:
      # PR이면 PR 브랜치, `main` push면 `main`. 값을 스크립트 안에 풀어 쓰지 않고 환경 변수로 넘긴다.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      # 한 머신의 runner들이 기본 설치 위치(~/setup-pnpm)를 함께 쓰지 않게 job마다 따로 설치한다
      - uses: pnpm/action-setup@v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      # 종류 목록을 commitlint 설정에서 읽으므로 루트 의존성만 설치한다
      - run: pnpm install --frozen-lockfile --filter seojaewan-blog

      - run: node scripts/check-branch-name.mjs "$BRANCH"

  verify:
    name: Lint, typecheck, test, build
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7.0.1

      # 한 머신의 runner들이 기본 설치 위치(~/setup-pnpm)를 함께 쓰지 않게 job마다 따로 설치한다
      - uses: pnpm/action-setup@v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 스토리 테스트(`storybook-*` project)가 Chromium에서 돈다
      - name: Install Playwright browsers
        run: pnpm --filter @seojaewan/web exec playwright install chromium

      - name: Unit and storybook tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # 디자인 시스템 카탈로그와 앱 조립 스토리
      - name: Build Storybook
        run: pnpm build:storybook

  e2e:
    name: E2E
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7.0.1

      # 한 머신의 runner들이 기본 설치 위치(~/setup-pnpm)를 함께 쓰지 않게 job마다 따로 설치한다
      - uses: pnpm/action-setup@v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @seojaewan/web exec playwright install chromium

      # 한 머신에서 job이 동시에 돌아 runner마다 다른 포트로 앱을 띄운다(scripts/runner-port.mjs)
      - name: Pick E2E port
        run: echo "E2E_PORT=$(node scripts/runner-port.mjs 4100)" >> "$GITHUB_ENV"

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
