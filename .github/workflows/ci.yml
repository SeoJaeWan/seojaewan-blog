# @codocs [[Git 작업 규칙:CI]]
# @codocs [[배포 환경:CI]] GitHub 호스티드 러너(`ubuntu-latest`)에서 돈다. job마다 깨끗한 머신이라 pnpm은 기본 위치에 설치한다.
# `Branch name` 작업은 PR 브랜치 이름을 검사한다([[Git 작업 규칙:브랜치]]). 늘 시작해 `main` push에서도 `main`을 검사한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # @codocs [[콘텐츠 원천:읽는 곳]]
  # CI와 E2E는 Notion이 아니라 저장소의 fixture를 읽는다(빌드와 앱 실행 모두)
  CONTENT_SOURCE: fixture

jobs:
  branch-name:
    # ruleset의 필수 검사 이름과 같아야 한다
    name: Branch name
    runs-on: ubuntu-latest
    env:
      # PR이면 PR 브랜치, `main` push면 `main`. 값을 스크립트 안에 풀어 쓰지 않고 환경 변수로 넘긴다.
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      # 루트 의존성만 설치하므로 pnpm 캐시를 쓰지 않는다. 이 job이 일부만 담은 저장소를 같은 키로 먼저 저장하지 않게 하기 위해서다
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      # 종류 목록을 commitlint 설정에서 읽으므로 루트 의존성만 설치한다
      - run: pnpm install --frozen-lockfile --filter seojaewan-blog

      - run: node scripts/check-branch-name.mjs "$BRANCH"

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # changeset 검사가 `main`과 갈라진 지점을 찾아야 해서 전체 기록을 받는다
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @codocs [[Git 작업 규칙:Changesets]]
      # 앱이나 패키지를 바꾼 PR에 changeset이 있는지 본다. `main` push에서는 건너뛴다(버전 PR 병합 포함).
      # 글 동기화·Renovate·버전 PR 브랜치와 문서만 바꾼 PR은 스크립트가 통과시킨다.
      - name: Changeset check
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/check-changeset.mjs "$BRANCH" origin/main

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 스토리 테스트(`storybook-*` project)가 Chromium에서 돈다
      - name: Install Playwright browsers
        run: pnpm --filter @seojaewan/web exec playwright install --with-deps chromium

      - name: Unit and storybook tests
        run: pnpm test

      # @codocs [[콘텐츠 원천:읽는 곳]]
      # 이 빌드는 fixture가 아니라 저장소에 커밋한 글 JSON(운영 글)으로 한다. 글 동기화 PR이 깨진 글을 병합하지 못하게 하려는 것이다.
      # E2E는 fixture로 빌드한다(e2e 작업).
      - name: Build
        run: pnpm build
        env:
          CONTENT_SOURCE: notion

      # 디자인 시스템 카탈로그와 앱 조립 스토리
      - name: Build Storybook
        run: pnpm build:storybook

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @seojaewan/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
