# @codocs [[Git 작업 규칙:CI]]
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # 토큰 값 비교(tokens.css ↔ tokens.json)도 여기서 돈다
      - name: Unit and component tests
        run: pnpm test

      # @codocs [[피그마 일치 검사:자산]]
      # 코드 자산(src/assets/)이 figma/assets/에서 다시 만든 결과와 같은지 확인한다. CI는 고치지 않고 실패만 한다
      - name: Generated assets check
        run: pnpm --filter @seojaewan/design-system generate:assets --check

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build:storybook

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @seojaewan/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
