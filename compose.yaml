# @codocs [[배포 환경:배포(CD)]]
# 블로그와 이미지 서버. 공용 젠킨스의 배포 스크립트(deploy/deploy-changed.mjs)가 바뀐 서비스만 빌드하고 바꾼다.
# 공통 규칙은 local-server 저장소의 .codocs/foundation/project-deploy.yaml(프로젝트 배포)을 따른다.
name: seojaewan-blog

services:
  web:
    image: seojaewan-blog/web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Docker의 포트 공개는 ufw를 건너뛰므로 127.0.0.1에만 연다
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3

  images:
    image: seojaewan-blog/images:latest
    build:
      context: .
      dockerfile: apps/images/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:3100:3100'
    # 비밀값(NOTION_TOKEN, ALERT_SECRET)은 배포 스크립트가 실행 계정의 /run/secrets에서 읽어 이 파일로 넣고, 끝나면 지운다.
    # compose secrets(파일 bind)는 쓰지 않는다. 젠킨스 실행 계정이 컨테이너라 그 안의 경로를 Docker 엔진이 보지 못하기 때문이다.
    env_file:
      - path: .deploy-secrets/images.env
        required: false
    environment:
      ALERT_URL: http://10.88.0.1:8790/notify
    # 남아야 하는 이미지 저장본. 확인용으로만 IMAGE_DATA_DIR로 바꾼다.
    volumes:
      - type: bind
        source: ${IMAGE_DATA_DIR:-/srv/seojaewan-blog/images}
        target: /srv/seojaewan-blog/images
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
