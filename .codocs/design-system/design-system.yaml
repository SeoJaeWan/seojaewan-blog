_codocs:
  id: design-system
  name: 디자인 시스템
  parent:
    - seojaewan 블로그
개요: |
  블로그 화면을 이루는 토큰과 컴포넌트를 어디서 출발해 무엇을 담고, 피그마에서 어떻게 관리하는지 안내하는 목차다.
  피그마가 디자인의 기준이고, `packages/design-system`은 피그마와 대응하는 코드다. 둘이 같은지는 [[피그마 일치 검사]]로 확인한다.
출발점: |
  Microsoft가 피그마 커뮤니티에 공개한 공식 Windows UI kit(CC BY 4.0)을 기준으로 한다.
  재현 정확도가 [[제품 정의:목적]]의 포트폴리오 목적에 중요하고, 값을 추측하지 않고 공식 값에서 가져올 수 있기 때문이다.

  커뮤니티 파일은 피그마 MCP가 직접 읽을 수 없어 "서재완" 팀에 사본을 두고 비교에 쓴다: [Windows UI kit (Community) 사본](https://www.figma.com/design/JmgCvyrvh9p9xMWKe4ZAAI).
  이 UI kit은 앱 컨트롤과 그림자·재질·표면 스타일을 담고 있고, 작업 표시줄·Start·탐색기 같은 바탕화면 셸은 없다. 셸 요소는 Windows 11 화면을 기준으로 만든다.

  이전 구현(`legacy/window-blog-v1` 태그)은 블로그에 맞춰 바꾼 부분을 참고하는 데만 쓴다. 이전에 추측한 값의 오차가 따라오지 않게 하기 위해서다.
범위: |
  디자인 시스템에는 기본 컨트롤과 Windows 화면 요소의 격모습 컴포넌트를 담는다. 목록은 [[컴포넌트 목록]]에서 확인한다.

  Windows 화면 요소(창 프레임, Taskbar, Start 등)가 블로그 격모습의 대부분이어서, 이것까지 담아야 피그마 일치 검사가 의미가 있다. 공식 UI Kit에도 이 요소들이 컴포넌트로 있어 피그마와 1:1로 대응된다.

  디자인 시스템은 "창이 어떻게 생겼는가"만 알고 "어떤 창이 열려 있는가"는 모른다. 동작과 상태(창 순서, 드래그, 열린 앱 목록)는 앱의 `features/`에 둔다([[저장소 구성:의존 방향]]).
피그마 파일: |
  파일: [seojaewan 블로그 · Windows 11 디자인 시스템](https://www.figma.com/design/XV9Y1UT5UH4tC5hSqLVipZ) (팀: 서재완)

  | 페이지 | 내용 |
  |---|---|
  | 00 · Foundations | 토큰(Variables), 서체, 간격, 모서리, 그림자, 재질 효과, 아이콘 |
  | 01 · Components | 기본 컨트롤과 Windows 화면 요소. 상태별 변형 포함. 피그마 플러그인이 내보내는 대상이다 |
  | 02 · Screens | 컴포넌트를 조립한 화면 가운데 고유한 디자인 요소나 상태가 있는 것([[디자인 시스템:Screens]]) |
  | 03 · Verification | 일치 검사 결과 기록, 서체 확인 |

  피그마의 설명(description)에는 그 컴포넌트·스타일·변수를 무엇에, 어디에 쓰는지만 한 문장으로 쓴다. 구현 방식, 제약, 바뀐 이력은 이 `.codocs` 문서에 둔다. 두 곳에 같은 내용을 두면 한쪽만 고쳐져 어긋나기 때문이다.

  공식 UI Kit을 라이브러리로 연결해 그대로 쓰지 않고, UI Kit에서 값과 구조를 가져와 이 파일의 Variables와 컴포넌트로 다시 만든다.
  Variables 이름 체계와 플러그인 내보내기 대상을 우리가 통제하고, UI Kit이 업데이트돼도 우리 컴포넌트가 바뀌지 않게 하기 위해서다.
문서: |
  - 모드, 강조색, 서체, 재질 효과, 아이콘, 토큰 이름 체계: [[디자인 기반]]
  - 어떤 컴포넌트를 만드는지: [[컴포넌트 목록]]
컴포넌트 조립 규칙: |
  기본 컴포넌트를 고치면 그것을 쓰는 모든 곳이 자동으로 바뀌게 만든다.

  - 큰 컴포넌트는 작은 컴포넌트의 인스턴스로 조립한다. 예: WindowFrame의 창 버튼은 CaptionButtonGroup 인스턴스, Taskbar는 TaskbarButton·SystemTray 인스턴스, MessageBox의 버튼은 Button 인스턴스다.
  - Screens는 컴포넌트 인스턴스로만 만든다. 인스턴스를 떼어내어(detach) 직접 고치지 않는다.
  - 쓰는 곳마다 달라야 하는 부분(문구, 아이콘, 표시 여부, 상태)은 컴포넌트 속성(텍스트, 불리언, 인스턴스 교체, 변형)으로 열어 둔다. 아이콘 자리는 인스턴스 교체 속성으로 연다([[피그마 일치 검사:아이콘 자리]]).
  - 재사용을 위해 컴포넌트를 바꿔야 하면 복사본을 만들지 않고 원본 컴포넌트를 고친다.

  컴포넌트로 나누는 기준:
  - 같은 모양이 두 번 이상 나오면 컴포넌트로 만든다. 예: Start 메뉴·검색의 묶음 머리글(SectionHeader), 목록 묶음(ListGroup), 타일 격자(TileGrid).
  - 큰 컴포넌트는 이름을 붙일 수 있는 영역 단위로 나눈다. 예: ExplorerContent = ExplorerAddressRow + ExplorerCommandBar + NavigationPane + 항목 슬롯 + ExplorerStatusBar, StartMenu의 아래 줄 = StartMenuFooter.
  - 트리거와 팝업은 한 컴포넌트(Popover)로 묶는다. 열린 모습은 그 컴포넌트의 `Open` 변형에만 두고, 트리거를 담은 부모 컴포넌트는 닫힌 상태만 갖는다. 예: StartMenu에는 전원 메뉴 변형이 없고, 전원 메뉴는 PowerButton `State=Open`이다([[피그마 일치 검사:팝업]]).
  - 바꿔 끼운 인스턴스도 레이어 이름은 자리 이름을 유지한다(`leading icon` 등).
  - 비슷해 보여도 쓰는 곳의 모양과 동작이 다르면 합치지 않는다. 예: Chrome 탭(BrowserTab)과 탐색기 탭(ExplorerTab)은 따로 둔다.

  코드의 `packages/design-system`도 같은 방식으로 작은 컴포넌트를 조립해 큰 컴포넌트를 만든다. 그래야 피그마의 중첩 구조와 코드 구조가 대응한다.
Screens: |
  02 · Screens에는 컴포넌트만 보아서는 알 수 없는 디자인이 있는 화면만 둔다. 고유한 디자인 요소나 상태가 있는 화면(예: 여러 창이 겹친 모습, 스냅 레이아웃, Snap Assist, 모바일 배치)과 각 화면의 기본 모습이다. 화면을 구현할 때 기준으로 쓴다.

  - 동작 전·후만 보여 주는 화면(끌기 전·후, 결과 위치만 다른 화면, 같은 구성에 글자만 다른 화면)은 두지 않는다. 그 동작은 화면별 기능 문서에 "이 화면은 ~를 지원한다", "~하면 ~된다"로 적는다([[화면별 기능]]).
  - 화면 흐름 프로토타입(클릭으로 화면을 오가는 연결, 오버레이, 열기·닫기 애니메이션 장면)은 두지 않는다. 동작은 코드(Storybook과 앱)에서 확인하고, 움직임 값은 [[디자인 기반:모션]]을 따른다.
  - 컴포넌트 변형 사이 전환(Rest → Hover 등)은 컴포넌트에 그대로 두고 일치 검사가 비교한다([[피그마 일치 검사:상태 전환]]).
  - 메뉴나 팝업이 열린 화면은 그 트리거를 `Open` 상태로 둔다([[피그마 일치 검사:팝업]]).
