_codocs:
  id: design-system
  name: 디자인 시스템
  parent:
    - seojaewan 블로그
개요: |
  디자인의 결과물은 피그마다. 이 문서는 피그마에서 코드를 만드는 방법과, 피그마만으로는 알 수 없어 코드가 정하는 것을 정한다.
  피그마 파일을 읽는 법, 피그마에서 내보내는 것과 생성 규칙, 동작과 조립을 쓰는 규칙, 생성한 결과를 검증하는 방법이다.

  피그마가 UI를 JSON 스키마로 내보내고, 코드는 그 스키마에서 모습을 만들며, 사람은 동작과 조립을 쓴다.
  - 내보내는 것은 Foundations(토큰, 자산)와 컴포넌트(Controls·Shell·Blog)까지다([[디자인 시스템:내보낼 대상]]). Patterns와 Screens는 내보내지 않고, 사람이 조립을 쓸 때 그림으로 본다([[디자인 시스템:조립]]).
  - 컴포넌트의 모습(스킨)은 피그마에서 생성하고, 동작은 종류마다 코드로 한 번 만들고, 조립은 사람이 앱에서 디자인 시스템의 컴포넌트로 쓴다([[디자인 시스템:세 겹]]). 동작의 구현(클릭, 포커스, 접근성)은 피그마에서 오지 않는다.
  - 피그마 구조와 코드 구조를 맞추는 것은 컴포넌트까지다. 조립의 구조는 코드가 정한다.

  기계가 보장하는 것과 사람이 보는 것을 나눈다.
  - 기계가 보장한다: 토큰([[디자인 시스템:토큰 생성]], [[디자인 시스템:토큰 검사]], [[디자인 시스템:토큰 사용 강제]]), 자산([[디자인 시스템:자산]]), 컴포넌트의 모습·구조·움직임. 생성한 컴포넌트가 피그마와 같은지는 피그마가 계산한 값과 브라우저가 계산한 값을 레이어마다 견줘 확인한다([[디자인 시스템:생성 결과 검증]]).
  - 사람이 본다: 조립의 모습과 움직임의 느낌. 조립은 피그마의 Patterns·Screens 그림을 보고 맞춘다.
출발점: |
  Microsoft가 피그마 커뮤니티에 공개한 공식 Windows UI kit(CC BY 4.0)을 기준으로 한다.
  재현 정확도가 [[제품 정의:목적]]의 포트폴리오 목적에 중요하고, 값을 추측하지 않고 공식 값에서 가져올 수 있기 때문이다.

  이 UI kit은 앱 컨트롤과 그림자·재질·표면 스타일을 담고 있고, 작업 표시줄·Start·탐색기 같은 바탕화면 셸은 없다. 셸 요소는 Windows 11 화면을 기준으로 만든다.

  이전 구현(`legacy/window-blog-v1` 태그)은 블로그에 맞춰 바꾼 부분을 참고하는 데만 쓴다. 이전에 추측한 값의 오차가 따라오지 않게 하기 위해서다.
범위: |
  디자인 시스템에는 기본 컨트롤과 Windows 화면 요소(창 프레임, Taskbar, 셸 표면 등)의 컴포넌트를 담는다. 담는 것은 생성한 스킨, 동작의 종류, 자산을 그리는 것뿐이다([[디자인 시스템:세 겹]]).

  디자인 시스템은 "창이 어떻게 생겼고 어떻게 눌리는가"만 알고 "어떤 창이 열려 있는가"는 모른다. 데이터를 가져오지 않고 앱 코드에 기대지 않는다. 내용을 채운 조립과 앱의 상태(창 순서, 드래그, 열린 앱 목록)는 앱(`apps/web`)의 `shell/`·`features/`·`shared/`에 둔다([[디자인 시스템:조립]], [[저장소 구성:의존 방향]]).
  바탕화면 아이콘을 늘어놓는 배치도 앱이 정한다. 아이콘 하나(DesktopFileItem)만 컴포넌트이고, 아이콘을 채우는 배치는 앱 코드(CSS grid 등)다.
세 겹: |
  코드는 스킨, 동작, 조립의 세 겹으로 나눈다.

  | 겹 | 맡는 것 | 만드는 곳 |
  |---|---|---|
  | 스킨 | 모양. 기능을 모른다 | 피그마 스키마에서 생성한다 |
  | 동작 | 어디서 쓰든 같은 움직임(누르기, 포커스, 키보드, 접근성) | 종류마다 코드로 한 번 만든다([[디자인 시스템:동작의 종류]]) |
  | 조립 | 쓰는 곳마다 달라지는 것과 그 화면의 기능 | 사람이 앱에서 쓴다([[디자인 시스템:조립]]) |

  - 스킨과 동작은 디자인 시스템 안에 따로 둔다. 서로를 import하지 않는다. 스킨이 바뀌어도 동작을 다시 만들지 않기 위해서다.
  - 디자인 시스템의 컴포넌트는 스킨과 동작을 합친 것이고, 생성기가 만든다([[디자인 시스템:동작의 종류]]). 조립은 합친 컴포넌트를 가져다 쓴다.
  - 스킨과 동작은 상태 표시(CSS의 말, aria 속성, data 속성)로만 만난다. 스킨은 표시가 붙으면 어떻게 보이는지만 알고, 동작은 언제 붙일지만 안다([[디자인 시스템:상태]]).
  - 멈춘 화면 한 장으로 그릴 수 있으면 디자인이고 피그마에서 온다. 피그마의 상태별 그림과 변형 사이 전환은 스킨이다. 전환의 계기(누르면, 올리면)는 읽지 않는다.
  - 어디서 쓰든 같은 동작은 동작의 종류에 두고, 쓰는 곳마다 달라지는 것은 조립에 둔다. 누가 무엇을 여는가는 피그마에 적지 않고 조립의 코드에서 사람이 쓴다.
  - 디자인 시스템에는 생성한 스킨, 동작의 종류, 자산을 그리는 것(`asset`, `image-asset`)만 둔다. 손으로 쓴 모습은 두지 않는다.

  생성:
  - 플러그인은 JSON만 내보낸다. 코드로 바꾸는 규칙은 저장소의 생성 스크립트 한 곳에만 둔다.
  - JSON은 미리 코드 파일로 생성한다. 실행할 때 JSON을 해석하지 않는다.
  - 생성은 PR의 CI가 하고, 생성 파일은 그 PR에 커밋한다([[디자인 시스템:CI]]). 생성 파일은 손으로 고치지 않는다.
피그마 파일: |
  파일: [seojaewan 블로그 · Windows 11 디자인 시스템](https://www.figma.com/design/XV9Y1UT5UH4tC5hSqLVipZ) (팀: 서재완)
  파일 키는 플러그인 설정(`tools/figma-plugin/src/plugin-config.ts`)에 두고, 플러그인은 다른 파일에서 내보내는 것을 막는다. 저장소에 키를 적는 파일을 따로 두지 않는다.

  | 페이지 | 담는 것 |
  |---|---|
  | `Cover`, `Read me` | 파일 표지와 안내 |
  | `Foundations` | 변수·스타일과 자산. 내보낸다 |
  | `Controls` | 기본 컨트롤 컴포넌트. 디자이너가 시안을 그릴 때 직접 꺼내 놓고 상태를 바꿔 쓰는 것. 내보낸다 |
  | `Shell` | 화면 영역 컴포넌트. 작업 표시줄, 탐색 창, 명령 모음처럼 화면의 정해진 한 자리를 차지하는 판·줄·패널. 내보낸다 |
  | `Blog` | 글 화면의 블록 컴포넌트. 내보낸다 |
  | `Patterns` | 조립과 그 프로토타입([[디자인 시스템:조립]]). 내보내지 않는다 |
  | `Screens` | 조립 인스턴스로 만든 화면. 상태와 위치만 정하고, 화면을 구현할 때 그림으로 본다. 내보내지 않는다 |

  어떤 컴포넌트가 있고 무엇에 쓰는지는 그 컴포넌트의 description에 있다.
  컴포넌트를 감싼 틀(섹션, 표, 이름·설명 글자, 배경판)은 보여 주기 위한 문서용 레이어라 코드로 옮기지 않는다. 변형·속성·슬롯은 피그마 오른쪽 패널의 컴포넌트 속성에서 읽는다.

  피그마에서 읽을 곳:
  - 값 하나의 뜻과 쓰임은 그 변수·스타일의 description에 있다.
  - 컴포넌트의 설명은 컴포넌트 설명 칸(description)에 있다. 피그마가 속성으로 가지지 못한 규칙은 codocs에 있다.
  - Dev Mode 주석에는 기계가 읽는 이름표만 둔다. 동작의 종류를 적는 `Interaction` 분류 주석이다([[디자인 시스템:동작의 종류]]). 설명 문장은 주석에 적지 않는다.
  - 재생 설정 Loop, 변형 사이 전환, 글자 말줄임, 프레임 스크롤, 변수 연결로 나타낸 것은 그 기능에서 읽는다([[디자인 시스템:구조 검사]]의 "피그마 기능으로 읽는 것").

  공식 UI Kit을 라이브러리로 연결하지 않고 값과 구조를 가져와 이 파일의 Variables와 컴포넌트로 다시 만든다. Variables 이름과 내보내기 대상을 우리가 통제하고, UI Kit이 바뀌어도 우리 컴포넌트가 바뀌지 않게 하기 위해서다.
내보낼 대상: |
  플러그인이 내보내는 것은 토큰, 자산, 컴포넌트 셋이다.

  - 토큰: Foundations의 변수와 스타일 전부([[디자인 시스템:토큰 생성]]).
  - 자산: Foundations의 자산 컴포넌트([[디자인 시스템:자산]]).
  - 컴포넌트: Controls, Shell, Blog 세 페이지 안의 컴포넌트(세트와 변형이 없는 컴포넌트) 모두. 페이지는 이름으로 찾고, 컴포넌트를 감싼 틀의 모양은 보지 않는다.
  - Patterns와 Screens는 읽지 않는다.

  컴포넌트를 읽는 법:
  - 컴포넌트 안의 레이어는 모두 내용으로 읽고, 이름으로 거르지 않는다. 문서용 레이어는 컴포넌트 바깥에 둔다.
  - 숨긴 레이어는 그것을 켜고 끄는 속성으로 그린다.
  - 이름이 겹치는 컴포넌트나 속성에 묶이지 않은 숨긴 레이어처럼 읽을 수 없는 것은 내보내기를 막는다([[디자인 시스템:구조 검사]]).
스키마: |
  플러그인은 컴포넌트 하나(세트이거나 변형이 없는 컴포넌트)마다 스키마 파일 하나와 검증 자료 파일 하나를 내보낸다.

  - 스키마에는 피그마의 사실을 그대로 적는다. CSS나 클래스 이름으로 풀어 적지 않는다.
  - 컴포넌트 안의 인스턴스는 펼치지 않고 참조(컴포넌트 이름, 속성 값, 놓인 방식, 덮어쓰기)로 적는다.
  - 값은 변수나 스타일에 연결돼 있으면 그 이름만 적고, 연결되지 않은 값은 숫자 그대로 적는다. 가까운 토큰으로 바꿔 적지 않는다.
  - 글자는 스타일 이름 하나와 기본 글자만 적는다. 글꼴 구간은 적지 않는다.
  - 변형은 변형마다 전체를 적는다. 기본 변형과의 차이로 적지 않는다.
  - 컴포넌트마다 동작의 종류 이름을 적는다([[디자인 시스템:동작의 종류]]).
  - 피그마가 계산한 레이어의 자리·크기와 모습의 최종 값은 스키마 본문과 나눠 검증 자료로 적는다([[디자인 시스템:생성 결과 검증]]). 생성 스크립트는 검증 자료를 읽지 않고, 생성 결과를 대조할 때만 쓴다.

  파일 자리:
  - 피그마에서 온 자료와 거기서 만든 생성 파일은 같은 폴더에 둔다. `figma/` 폴더를 따로 두지 않는다.
  - 컴포넌트는 `packages/design-system/src/components/<이름>/`에 스키마 `<이름>.json`, 검증 자료 `<이름>.layout.json`, 생성 파일(이름에 `.gen`)을 둔다. 생성 파일은 스킨과, 스킨에 동작을 합친 컴포넌트로 나눈다.
  - 토큰은 `src/tokens/`에, 자산은 `src/assets/`에 같은 꼴로 둔다.
  - 플러그인은 피그마에서 온 자료 파일만 쓰고 생성 파일은 쓰지 않는다.
컴포넌트 입력: |
  생성한 컴포넌트가 받는 입력(props)은 피그마의 사실에서 온다.

  | 피그마 | 입력 |
  |---|---|
  | 구조가 다른 변형 | 변형 속성 |
  | 값만 바뀌는 상태 | 상태 속성(아래 `State` 축 규칙) |
  | 글자 | 글자 속성 |
  | 레이어 켜고 끄기 | boolean 속성 |
  | 아이콘 바꾸기 | 인스턴스 교체 속성([[디자인 시스템:아이콘 자리]]) |
  | 자식 받기 | SLOT 노드 |

  이름:
  - 피그마 속성 이름은 낙타 표기의 코드 이름이 되고, 값은 소문자와 하이픈으로 정규화한다(`Variant` → `variant`, `Two line` → `two-line`). 속성 키의 `#id`는 뗀다.
  - 켜고 끄는 속성은 [[코드 작성 규칙:식별자 이름]]의 접두어를 따르고, 접두어가 없으면 `is`를 붙인다(`Checked` → `isChecked`).
  - 글자 속성이나 인스턴스 교체 속성이 켜고 끄는 속성과 같은 레이어에 묶였으면 입력 하나로 합친다. 값을 주면 보이고 주지 않으면 보이지 않는다(`Has shortcut` + `Shortcut` → `shortcut`, `Has icon` + `Icon` → `icon`).
  - `State` 축과 동작이 스스로 아는 축(`Filled`는 값이 있는지)은 입력으로 내지 않는다. 앱만 아는 상태 낱말은 낱말 표에 적은 코드 이름의 입력이 된다(`Cut` → `isCut`, `Rename` → `isRenaming`, [[디자인 시스템:상태]]).
  - `Device` 축은 입력으로 내지 않는다([[디자인 시스템:기기 변형]]).

  안쪽 부품을 바깥에 여는 법:
  - 안에 고정으로 놓인 버튼은 `on` + 레이어 이름으로 된 입력 하나로 연다. 레이어 이름 끝의 `button`은 뗀다(`close button` → `onClose`).
  - 버튼이 아닌 부품은 `on` + 레이어 이름 + 그 종류의 사건 이름으로 연다(`rename field` → `onRenameChange`). 사건 이름은 종류의 문서에 적는다([[디자인 시스템:동작의 종류]]).
  - 안쪽 부품에 주는 값은 피그마에 노출된 속성에서 읽는다([[디자인 시스템:컴포넌트 조립 규칙]]).
  - 같은 부품이 한 컴포넌트 안에 여럿 박혀 있을 때, 눌림만 있으면 입력 하나로 묶고 어느 것인지를 함께 알려 준다(SnapLayoutOption의 구역). 부품마다 다른 값이 필요하면 박아 두지 않고 슬롯으로 연다(JumpList의 글자).

  코드 컴포넌트의 이름과 입력은 피그마에서 생성돼 늘 같다. 그래서 조립을 쓸 때는 피그마의 컴포넌트 이름과 속성 이름을 이 규칙대로 옮긴다.
동작의 종류: |
  동작은 종류마다 코드로 한 번 만든다. 종류의 목록과 종류마다의 규칙(사건 이름, 상태 낱말 표, 실행 중에 덮는 값)은 `.codocs/design-system/behaviors/`에 종류별 문서로 적는다.

  나누는 법:
  - 종류는 WAI-ARIA APG의 역할 이름으로 나눈다(`button`, `menuitem` 등). 실제로 다르게 움직이는 것끼리 나누기 위해서다. 상자와 항목이 함께 움직이는 것은 짝으로 둔다(`menu`와 `menuitem`, `tree`와 `treeitem`, `listbox`와 `option`).
  - 움직임이 없어도 태그나 역할을 표시해야 하는 컴포넌트는 종류로 둔다. 그 종류는 태그와 고정된 표시만 돌려준다(`separator`, `progressbar`, `checkbox`, `heading`, `listitem`, `table`, `figure`, `code`, 장식). 스킨은 태그와 역할을 모른다. 그림뿐인 컴포넌트는 종류가 없고 `div`로 낸다.
  - 컴포넌트 세트에는 주로 쓰이는 종류 하나를 적는다. 놓인 자리에 따라 다르게 움직이는 컴포넌트는 그 자리의 조립이 스킨에 다른 종류를 직접 잇는다. 예: ListItem은 `button`(주소창 추천에서는 `option`), MenuItem은 `menuitem`(검색 대표 카드에서는 `button`), SectionTitle과 SectionHeader는 종류가 없다(눌리는 자리에서는 `button`).
  - 주소창 추천이나 탐색 창 트리 같은 고유 동작도 종류 하나로 둔다. 트리거와 팝업을 묶어 자리를 잡는 것(`popover`)과 넘치는 내용을 스크롤하는 것(`scroll-area`)도 종류다.
  - 새 컴포넌트는 있는 종류를 고른다. 맞는 종류가 없으면 같은 계약으로 새 종류를 만든다.

  피그마:
  - 종류가 있는 컴포넌트 세트에 `Interaction` 분류의 Dev Mode 주석으로 종류를 낱말 하나로 적는다. 그림뿐인 컴포넌트에는 적지 않는다.
  - 종류 밖의 것은 적지 않고 변형과 구조에서 읽는다. 상태(`State` 값), 글자가 들어가는 레이어(글자 속성에 묶인 레이어), 표시 레이어(켜진 변형에만 있는 레이어), 켜짐과 꺼짐(값이 둘뿐인 변형 축, `on`/`off` 쌍)이다.
  - 컴포넌트 안에서 도는 움직임은 그 레이어에 걸린 키프레임에서 읽고, 주석으로 잇지 않는다([[디자인 시스템:모션 견본]]).
  - 적힌 종류와 구조가 어긋나면 내보내기를 막는다([[디자인 시스템:구조 검사]]).

  코드:
  - 동작은 전부 직접 만든다. 종류는 모두 같은 계약을 따른다. 입력을 받아 상태 이름과 레이어 역할별 속성을 돌려준다.
  - 종류는 기본 요소와 공용 조각(위치 잡기, 포커스 관리, 묶음 안 이동, 닫기, 남겼다 떼기, 글자 찾기 등)만 쓴다.
  - 동작은 `packages/design-system/src/behaviors/`에 두고, 동작 등록부(종류 이름 → 동작 구현)에 올린다.
  - 생성기는 컴포넌트에 적힌 종류를 등록부에서 찾아, 그 동작을 불러 스킨에 넘기는 합친 컴포넌트 파일을 만든다. 합치는 코드를 손으로 쓰지 않고, 컴포넌트마다 손으로 쓰는 파일을 두지 않는다.
  - 새 종류는 그 종류를 쓰는 컴포넌트를 내보내기 전에 먼저 만들어 `main`에 넣는다([[디자인 시스템:구조 검사]]).
  - 스킨을 여러 벌 두고 고르는 장치는 두지 않는다.
상태: |
  피그마의 상태 변형은 스킨의 CSS로 옮긴다. 상태를 켜는 것은 동작과 조립이다([[디자인 시스템:세 겹]]).

  - 상태는 CSS에 준비된 말(`:hover`, `:active`, `:focus-visible`, `:disabled`, `:focus-within`)이나 aria 속성(`aria-selected`, `aria-expanded`, `aria-busy` 등)으로 옮긴다. 둘 다 없을 때만 data 속성을 붙인다(현재 항목, 잘라냄, 이름 바꾸는 중, 편집 중, 불러오기 실패, 창 비활성). 올림·누름·포커스를 코드가 상태로 들지 않는다.
  - 올림은 마우스가 있는 기기에서만 건다(`@media (hover: hover)`).
  - 피그마의 상태 이름은 공백으로 쪼갠 낱말로 읽는다(`Selected unfocused current` → `Selected`, `unfocused`, `current`). 낱말마다 옮길 조건과 코드 이름을 동작의 종류에 한 번 적고, 생성기가 낱말의 조건을 겹쳐 CSS를 낸다. 적은 순서가 겹칠 때의 우선순위다. 표에 없는 낱말은 내보내기를 막는다([[디자인 시스템:구조 검사]]).
  - 상태별 값은 기본 상태와의 차이만 CSS 규칙으로 낸다.
  - 레이어가 생기고 사라지는 상태는 모두 그려 두고 CSS로 보이고 숨긴다.

  변형 사이 전환:
  - 변형 사이에 걸린 전환을 읽는다(어느 변형에서 어느 변형으로, 시간, 이징. 계기 종류는 보지 않는다). 도착하는 상태와 두 변형 사이에 값이 다른 속성에 `transition`을 건다.
  - 기본 상태로 돌아올 때는 기본 상태에 걸린 전환을 쓴다. 전환이 걸리지 않은 상태로 갈 때는 즉시 바뀐다.
  - 동작 줄이기에서는 걸지 않는다([[디자인 시스템:동작 줄이기]]).
컴포넌트 조립 규칙: |
  컴포넌트는 틀이다. 어느 화면에서든 같은 모양과 구성이면 컴포넌트이고, 쓰는 곳마다 달라지는 것(메뉴 항목, 목록 항목, 경로, 탭, 글 내용, 동작 목록)은 슬롯이나 속성으로 연다.

  - 변형은 컴포넌트가 스스로 가진, 끝이 정해진 축(상태, 크기, 종류, 기기, 재질, 움직임)에만 둔다. 앱이 쓰지 않는 변형은 두지 않는다. Hover·Pressed 같은 CSS 상태와 화면 크기로 고르는 Device 변형은 앱이 쓰는 것으로 본다.
  - 슬롯은 디자이너가 내용을 바꿔 끼우는 자리에만 둔다. 스크롤 영역, 격자 배치, 위치 잡기, 바탕 깔기 같은 감싸는 동작은 피그마에서 컴포넌트로 감싸지 않고 코드가 맡는다. 예: Toc는 `Items` 슬롯만 두고, 넘치면 세로로 스크롤하는 것은 `scroll-area` 동작이 맡는다.
  - 무엇이 몇 개 들어갈지 모르는 자리는 슬롯, 자리가 정해진 부품의 값(문구, 아이콘, 표시 여부, 상태)은 컴포넌트 속성(텍스트, 불리언, 인스턴스 교체, 변형)이다. 안쪽 부품의 속성은 중첩 인스턴스 속성 노출로 바깥에 보인다.
  - 슬롯에는 실제 컴포넌트를 기본 내용으로 넣는다. 비어 있는 HUG 슬롯은 피그마가 100×100으로 그려 컴포넌트 단독 모습을 비교할 수 없기 때문이다. 실제 내용을 채우는 것은 조립과 화면이다.
  - 글자 속성의 기본값은 그 자리를 설명하는 일반 문구다(예: "제목", "항목 이름").
  - 다른 바탕을 감싸는 컴포넌트는 안쪽 바탕 위에 쌓고, 안쪽 바탕의 슬롯을 자기 슬롯으로 따로 열지 않는다. 조립이 안쪽 바탕의 슬롯을 바로 채운다. 피그마는 중첩 인스턴스의 슬롯을 바깥 슬롯으로 다시 열 수 없기 때문이다. 예: Menu는 Flyout 위에 쌓고, 조립(`Menu/*`)이 Flyout의 `Content` 슬롯에 항목을 넣는다.
  - `Material` 변형은 재질 바탕을 직접 칠하는 컴포넌트(Flyout, WindowFrame 등)만 가진다. 감싸는 컴포넌트와 조립은 안쪽 바탕의 `Material`을 노출해 바꾼다.
  - 큰 컴포넌트는 작은 컴포넌트의 인스턴스로, 이름을 붙일 수 있는 영역 단위로 만든다. 예: WindowFrame = WindowTitle + 창 버튼(CaptionButton) + Content 슬롯.
  - 같은 모양을 두 곳 이상에서 쓰면 컴포넌트로 만든다. 비슷해 보여도 쓰는 곳의 모양과 동작이 다르면 합치지 않는다.
  - 컴포넌트는 조립을 쓰지 않는다. 슬롯 기본 내용으로도 쓰지 않는다.
  - 컴포넌트는 바깥 여백을 갖지 않는다. 코드의 `className`은 바깥 배치(여백, 위치, 크기, 정렬)에만 쓰고 생김새는 덮어쓰지 않는다. 값은 [[디자인 시스템:토큰 사용 강제]]를 따른다.
  - 컴포넌트는 자기가 놓일 곳을 모른다. 다른 컴포넌트를 안에 놓는 방식(채움, 고정, 내용 맞춤)은 바깥 컴포넌트가 정한다. 루트와 안쪽의 크기를 옮기는 법은 [[디자인 시스템:크기 변수]]에 있다.
    - 쓰는 곳마다 크기가 다른 바탕(Flyout 등)은 내용에 맞춘다(HUG). 너비는 담는 내용이나 감싸는 컴포넌트가 정한다(Flyout은 너비가 없고 Menu가 메뉴 너비를 가진다). 어디서 쓰든 크기가 같은 바탕(Tooltip `Variant=Balloon`)은 고정한다.
    - 부모가 크기를 정하는 컴포넌트(목록 항목, 구분선, 주소창, 탐색기의 줄 등)는 피그마 원본의 폭·높이가 기본값이고, 쓰는 곳이 너비를 주거나 부모를 채운다.
    - Windows가 정한 크기(창 버튼, 작업 표시줄 버튼, 탭, 고정 앱 타일 등)는 고정 크기다.
  - 상태 때문에 안 보이는 것을 그려 놓고 숨기지 않는다. 상태에 따라 있고 없는 것은 그 상태의 변형에만 그리고, 쓰는 곳이 켜고 끄는 것은 불리언 속성이다. 칠 없이 자리만 차지하는 것은 칠 없는 빈 프레임이다(NavigationItem `Expand=None`의 `chevron space`).
  - 인스턴스의 모양(칠, 글자색, 선, 효과, 불투명도)을 직접 덮어쓰지 않는다. 쓰는 곳에 따라 달라야 하면 그 컴포넌트에 변형이나 속성을 연다. 코드는 `className`으로 모양을 바꿀 수 없어 직접 덮어쓴 모습을 옮길 길이 없기 때문이다. 예: 비활성 창의 제목 색은 WindowTitle `State=Inactive`, Chrome 도구 모음의 아이콘 색은 IconButton `Variant=Chrome`이다. 덮어쓰면 내보내기를 막는다([[디자인 시스템:구조 검사]]).
  - 한 곳에서만 쓰고 안쪽 부품마다 다른 앱 기능에 이어지는 묶음은 컴포넌트가 아니라 조립이다. 컴포넌트에는 재질 바탕과 자리만 남는다. 예: Taskbar는 재질 바탕, 높이, 위쪽 선과 가운데·오른쪽 자리만 갖고, 시작 버튼·검색·앱 버튼·시계는 `Taskbar/Default` 조립이 채운다. 탐색기 본문도 `Explorer/Content` 조립이 주소 줄·명령 모음·탐색 창·상태 줄을 놓는다. 여러 곳에서 같은 방식으로 쓰는 컴포넌트(WindowFrame 등)는 컴포넌트로 두고 고정 부품의 동작만 입력으로 연다([[디자인 시스템:컴포넌트 입력]]).
  - 기능이 늘 때마다 입력이 늘어나는 자리는 슬롯으로 열어 조립이 채운다. 바깥 컴포넌트가 쓰지 않는 입력을 여러 단계 나르기만 하게 되면, 그 묶음은 조립으로 만든다.

  코드의 컴포넌트는 이 피그마 컴포넌트에서 생성한다. 피그마 슬롯은 SLOT 노드에서 생성한 자리 입력이고, 자리 입력에는 기본 내용을 두지 않고 쓰는 곳이 채운다. 피그마 슬롯 기본 내용과 같은 내용은 생성한 스토리가 슬롯에 넣는다([[디자인 시스템:스토리 규칙]]). 노출한 중첩 인스턴스의 속성은 바깥 입력을 안쪽 컴포넌트로 넘기는 구조로 생성한다. 슬롯 안 자식이 부모 채움(FILL)이면 슬롯을 여는 컴포넌트의 자리 요소가 그 자식을 채우고, 쓰는 곳은 넣는 자식에 채움 클래스를 주지 않는다.
코드 전용 컴포넌트: |
  디자인 시스템에는 피그마에 없는 컴포넌트를 두지 않는다([[디자인 시스템:세 겹]]). 코드 구조 때문에 필요한 감싸기와 배치는 아래 자리에 둔다.

  | 하는 일 | 두는 곳 |
  |---|---|
  | 배치만 하는 감싸개(타일 격자, 열 나누기, 머리글이 있는 목록 묶음, 카드 바탕) | 앱의 조립. 여러 조립이 함께 쓰면 앱의 `shared/`([[저장소 구성:앱 폴더 구조]]) |
  | 트리거와 팝업을 묶고 팝업 자리를 잡기 | 동작의 종류 `popover`([[디자인 시스템:팝업]]) |
  | 넘치는 내용을 감싸 스크롤하고 Scrollbar를 겹쳐 그리기 | 동작의 종류 `scroll-area`([[디자인 시스템:겹쳐 놓기]]) |
  | 여러 컴포넌트에 같은 모양으로 놓이는 묶음(메뉴 구분선 등) | 피그마 컴포넌트로 만들어 생성한다 |

  - 모양이 있는 것(Scrollbar, SelectionMarquee, 화면 영역 등)은 다른 컴포넌트 안에서만 써도 피그마에 있다.
아이콘 자리: |
  컴포넌트 안에서 쓰는 곳마다 바꿔 끼우는 아이콘은 인스턴스 교체(INSTANCE_SWAP) 속성으로 연다.

  - 레이어 이름은 자리 이름이다(`icon`, `leading icon`, `chevron`, `location icon` 등). 같은 컴포넌트를 여럿 담는 자리도 역할 이름을 쓴다(`minimize button`, `close button`).
  - 속성 이름은 입력 이름이 된다(`Icon` → `icon`, `Close icon` → `closeIcon`, [[디자인 시스템:컴포넌트 입력]]).
  - 속성의 선호값(preferred values)에 그 자리에 쓸 수 있는 자산이 있다.
  - 아이콘은 언제나 속성으로 바꿔 끼운다. 안쪽 아이콘 레이어의 원본 컴포넌트를 직접 바꾸지 않는다.
  - 속성으로 연 아이콘 자리는 모두 필수 입력이다. 코드에 기본값을 두지 않는다. 빠뜨린 아이콘이 기본값으로 조용히 그려지는 실수를 타입 검사로 잡기 위해서다. 생성한 스토리만 피그마 기본 인스턴스를 넣는다.
  - 어디서나 같은 아이콘은 속성으로 열지 않고 컴포넌트 안에 박아 둔다. 박힌 아이콘은 입력이 아니다.
  - 켜고 끄는 속성이 함께 묶인 자리는 아이콘을 주면 보이고 주지 않으면 보이지 않는다([[디자인 시스템:컴포넌트 입력]]).
  - 아이콘의 크기는 자산이 자기 크기로 정한다([[디자인 시스템:자산]]). 쓰는 곳은 아이콘에 크기 클래스를 주지 않고 색 클래스만 준다.
팝업: |
  트리거(버튼, 메뉴 항목, 입력창)와 그 옆에 뜨는 팝업(메뉴, 툴팁, 플라이아웃)의 규칙이다.

  - 트리거와 팝업 사이 간격은 `spacing/xs`다. 툴팁만 트리거와 12 띄운다. 이 간격은 툴팁 동작의 종류가 갖고, 스킨에는 들어가지 않는다.
  - 작업 표시줄에서 여는 메뉴·창 미리보기는 작업 표시줄 위 끝에서 `spacing/md` 띄운다([[작업 표시줄:우클릭 메뉴]], [[작업 표시줄:창 미리보기]]).
  - 특정 트리거와 특정 팝업 내용을 묶은 것은 조립이다. 예: `Start/PowerButton`(전원 IconButton + `Menu/Power`), DropDownButton + 보기 메뉴, 작업 표시줄 앱 버튼 + 우클릭 메뉴.
  - 하위 메뉴는 마우스가 한 항목에 400ms(Windows 기본 `MenuShowDelay`) 머물면 연다. 하위 메뉴 항목이면 그 하위 메뉴를 열고, 일반 항목이면 열린 하위 메뉴를 닫는다. 처음 열 때도 같다. 다른 하위 메뉴로 바뀔 때는 옛 하위 메뉴를 닫고 새 하위 메뉴를 여는 것이 한 번에 일어나, 그 사이에 하위 메뉴가 없는 순간이 없다. 열린 하위 메뉴 안으로 들어가면 지나온 항목으로 바뀌지 않는다. 클릭과 키보드(→, Enter)는 기다리지 않고 바로 연다. 400ms는 Windows 기본값이라 코드 상수다.

  피그마:
  - 트리거와 팝업을 묶는 틀은 피그마에 없다. 팝업 위치를 잡는 것은 동작의 종류 `popover`가 맡는다.
  - 조립에는 열린 팝업이 그려져 있을 수 있다. 열린 메뉴는 그 메뉴 조립의 인스턴스다.
  - 팝업이 열리는 흐름은 트리거의 프로토타입 오버레이(누르면, 올리면 → Open overlay)로 해당 `Menu/...` 조립을 띄워 나타낸다. 하위 메뉴도 그 항목에 오버레이로 하위 메뉴 조립(`Menu/ViewSubmenu` 등)을 띄운다. 피그마에 트리거가 없는 우클릭은 누르기로 연결하고, 실제 트리거는 조립의 설명 칸에 있다.

  코드:
  - 트리거와 팝업은 `popover` 종류로 묶는다. `popover`는 트리거, 팝업, 붙는 자리(`placement`), 열림 상태를 가진다. 붙는 자리는 팝업이 트리거의 어느 쪽에 어느 끝을 맞춰 붙는지다(`bottom-start`, `bottom-center`, `bottom-end`, `top-center`, `top-end`, `right-start`). 필요할 때 더한다.
  - 열린 팝업은 트리거를 담은 부모의 크기와 배치를 바꾸지 않는 자리에 둔다.
  - 열림 동작과 항목은 `play` 동작 스토리로 확인한다.
조립: |
  조립은 컴포넌트 인스턴스를 조합해 내용을 채운 것이다. 피그마 `Patterns` 페이지에 있고, 앱(`apps/web`의 `shell/`·`features/`·`shared/`)의 컴포넌트에 대응한다.
  피그마 조립은 "큰 UI가 이렇게 보여야 한다"는 그림과 프로토타입이다. 플러그인은 조립을 읽지 않는다. 사람이 디자인 시스템의 컴포넌트로 조립을 쓰고 그 화면의 기능을 넣으며, 구조는 코드가 스스로 정한다.

  피그마 읽기:
  - 조립은 피그마 컴포넌트다. 슬롯을 채우는 조합은 쓰는 화면 수와 상관없이 모두 조립이다. 예: `Taskbar/Default`, `Desktop/Scene`, `Window/Chrome`, `Explorer/Content`, `Start/Menu`, `Search/Panel`.
  - 이름은 `영역/이름` 형식의 영어이고 한국어 설명은 description에 있다. 조립 이름이 앱 코드의 이름이다([[디자인 시스템:스토리 규칙]]).
  - 같은 자리에 들어가는 대안끼리는 변형이고, 자리가 다르면 따로 있다. 재질은 조립의 변형이 아니다.
  - 조립에는 바탕 칠, 덧칠, 구분선, 열린 상태가 직접 그려져 있을 수 있다. 컴포넌트 밖에서 그린 것은 조립의 코드가 그린다.
  - 조립 프레임 안은 실제로 화면에 나오는 것이고, 프레임 밖(설명 글, 배경판)은 보여 주기용이다. 프레임 안의 보여 주기용(호버 커서 그림 등)은 조립의 설명 칸에 "표시용"으로 적혀 있고 구현하지 않는다.
  - 간격과 색은 토큰 값이 기본이다.
  - 조립 프레임은 코드 구조(스크롤 영역을 나누는 방법 등)가 아니라 의도한 배치대로 그려져 있다. 실행 중에만 드러나는 것은 피그마 기능(글자 말줄임, 프레임 스크롤)이나 조립의 설명 칸으로 나타낸다.
  - "언제 열리고 움직이는가"는 조립의 프로토타입으로 눌러 볼 수 있다(버튼 누름 → 창이 열린 프레임, After delay → 이미지를 받은 모습, On drag → 순서 바꿈, 트리거 → 메뉴 오버레이). 키보드 포커스일 때만, 끄는 동안 유지 같은 정확한 조건은 화면별 기능 문서와 코드가 맡는다.
  - 창 축소 화면(작업 표시줄 창 미리보기, Snap Assist)은 `Window/*` 조립 인스턴스를 줄여 넣은 것이다. 코드는 실제 창 컴포넌트를 그대로 그리고 CSS `scale`로 줄인다. 줄이는 비율은 창 크기에 따라 실행 중에 정해진다.
  - 같은 앱의 창은 기기와 상관없이 같은 방법으로 만든다. 예: `Window/Explorer`의 `Device=Desktop`·`Mobile`은 둘 다 WindowFrame 위에 만든다.

  코드:
  - 조립은 앱의 컴포넌트다. 피그마 속성은 props, 피그마 슬롯은 자리 prop(`children`이나 `ReactNode` prop)이다.
  - 조립이 쓰는 디자인 시스템 컴포넌트의 이름과 입력은 피그마 이름을 이름 규칙대로 옮긴다([[디자인 시스템:컴포넌트 입력]]).
  - 놓인 자리에 따라 달라지는 동작은 조립이 정한다. 예: 스킨에 다른 동작의 종류를 잇는다([[디자인 시스템:동작의 종류]]).
  - 안쪽 컴포넌트의 빈 자리(슬롯)는 바깥 컴포넌트가 prop으로 받아 넘긴다. 예: SearchResults는 안쪽 BestMatchCard를 `card` prop으로 통째로 받는다(카드의 속성과 슬롯을 다시 열지 않는다).
  - 큰 조립은 영역의 자리만 갖고, 안에 들어갈 조립은 쓰는 쪽이 넣는다.
  - 개수가 정해지지 않은 목록(메뉴 항목, 결과 목록)은 배열 prop으로 받는다.
  - 구조가 같은 조립 여럿(예: 우클릭 메뉴들)은 코드 컴포넌트 하나에 데이터만 다른 스토리 여럿으로 둔다.
  - 메뉴 항목 목록은 항목을 만드는 함수 하나를 실제 기능과 조립 스토리가 함께 쓴다. 그래야 조립 스토리가 실제 메뉴(글자·아이콘·순서·구분선·분기)를 그린다. 둘 이상의 기능이 쓰는 항목 정의는 `shared/`에 둔다.
  - 조립의 구조(감싸기, 슬롯, 배치, 스크롤 영역 등)는 코드가 스스로 정한다. 피그마 레이어 구조를 그대로 옮기지 않는다.
  - 조립의 크기는 변수 없는 숫자일 수 있지만, 여백·간격과 그 밖의 시각 값은 토큰 클래스로 옮긴다([[디자인 시스템:토큰 사용 강제]]).
  - 조립마다 앱 Storybook에 스토리를 둔다. 조립 스토리의 데이터를 피그마 조립과 똑같이 맞추지 않는다. 기능은 `play` 동작 스토리로 확인한다.
  - 지금 화면에서 쓰지 않는 조립도 앱 코드의 짝이라 남긴다.

  확인:
  - 조립은 피그마와 자동으로 견주지 않는다. 조립을 이루는 컴포넌트는 하나하나 견주고([[디자인 시스템:생성 결과 검증]]), 조립이 만든 상자의 간격과 자리는 사람이 피그마의 Patterns·Screens를 그림으로 보고 맞춘다.
커서: |
  Windows 화면과 웹 페이지 영역의 커서를 나눈다.

  - Chrome 창 안의 글 페이지(웹 페이지 영역)에서 누를 수 있는 요소는 손가락 커서(`cursor: pointer`)다. 목차 항목과 목차 접기·펼치기, 이전·다음 카드, 검색 결과 줄, 새 탭 바로가기, 코드 복사 버튼, 본문 링크가 해당한다. 실제 웹 페이지와 같다.
  - Windows 화면(작업 표시줄, Start, 메뉴, 탐색기, 창 버튼, Chrome 탭·도구 모음)은 실제 Windows처럼 화살표(`default`) 그대로이고, 누를 수 있다는 것은 호버 배경으로 알린다. 그래서 누를 수 있는데 호버 배경이 없는 요소를 두지 않는다.
  - 이 규칙은 누를 수 있다는 표시에 관한 것이다. 글자 입력칸, 크기 조절, 끌기 중 옮길 수 없는 곳([[항목 조작:끌기]])의 커서는 따로 정한 대로 둔다.
겹쳐 놓기: |
  요소를 다른 요소 위에 겹쳐 놓는 경우를 넷으로 나눈다.

  1. 장식: 포커스 테두리처럼 컴포넌트 모양에 딸린 장식은 겹쳐 놓은 레이어가 아니라 그 레이어의 선이나 효과 스타일이다. 코드는 [[디자인 시스템:컨트롤 테두리 구현]], [[디자인 시스템:포커스 구현]]으로 그린다.
  2. 실행 중에 정해지는 값: 창과 바탕화면 아이콘의 위치, 선택 상자(SelectionMarquee)의 위치와 크기, 스크롤바 막대의 위치와 길이는 실행 중에 정한다. 피그마의 값은 처음 값이다([[디자인 시스템:크기 변수]]).
     넘치는 영역은 `scroll-area` 동작이 감싸 브라우저 스크롤바를 숨기고 Scrollbar를 겹쳐 그린다. Scrollbar는 내용이 넘치면 가는 선이 늘 보이고(스크롤하는 동안도), 스크롤바 칸에 마우스를 올렸을 때만 두꺼운 막대와 위·아래 화살표로 펼친다. 끄는 동안은 칸 밖이어도 펼친 채다. 실제 Windows와 같고, 피그마 Scrollbar `State=Expanded`가 이 펼친 모습이다.
     예외로 Chrome 창 안 웹 페이지(글 페이지 영역, 코드 블록·수식의 가로 스크롤 포함)는 꾸미지 않은 브라우저 기본 스크롤바를 쓴다. 실제 브라우저 스크롤바가 곧 실제 Chrome 스크롤바이기 때문이다. 목차는 글 페이지 안이지만 디자인한 UI 부품이라 `scroll-area`를 쓴다([[Chrome:글 화면]]).
  3. 진짜 겹침(배지, 검색창 밑줄 등): 자동 배치 안의 절대 위치(ABSOLUTE) 자식이다. 제약은 왼쪽·위(MIN), 오른쪽·아래(MAX), 양쪽 늘이기(STRETCH), 가운데(CENTER)만 쓰고, 양쪽 늘이기 축의 크기는 부모에서 나온다. 예: SearchBox `bottom border`는 가로 양쪽 늘이기, 세로 아래, 거리 0이고, 루트가 내용 자르기를 켜 둥근 끝에서 밑줄이 일자로 잘린다.
  4. 트리거에 붙는 팝업: [[디자인 시스템:팝업]]을 따른다.
크기 변수: |
  피그마의 크기를 코드로 옮기는 규칙이다. 크기 변수를 새로 만들지 않는다.

  - 숫자를 직접 쓸 수 있는 값은 크기(너비, 높이, 최소·최대)와 움직임(길이, 이징, 늦춤, 배율)이다. 색, 간격, 모서리, 선, 글자는 토큰만 쓴다([[디자인 시스템:토큰 사용 강제]]).
  - 컴포넌트 루트에 고정으로 적힌 크기는 기본값으로 낸다. 쓰는 쪽이 준 값이 언제나 이긴다.
  - 컴포넌트 안쪽의 고정 크기는 피그마에 적힌 그대로 낸다. 숫자면 숫자로, 변수에 묶였으면 그 토큰으로 낸다.
  - 실행 중에 동작이 정하는 크기(스크롤 막대의 손잡이 길이 등)는 피그마의 값을 처음 값으로만 쓰고 동작이 덮는다. 어떤 값이 여기에 드는지는 동작의 종류마다 적는다([[디자인 시스템:동작의 종류]]).
  - 자산의 크기는 [[디자인 시스템:자산]]을 따른다.
  - 조립과 화면 안의 크기는 숫자일 수 있다. 간격·여백은 그대로 토큰이다([[디자인 시스템:조립]]).
  - 앱이 쓰는 크기 값은 앱이 갖고, 디자인 시스템 토큰으로 두지 않는다. 여러 곳이나 계산 코드가 함께 읽는 값(창 기본 크기, 패널 기본 크기, 글 본문 폭, 창 축소 화면 크기, 창 크기 조절 손잡이)은 앱의 CSS 변수(`apps/web/src/app/globals.css`의 `:root`)로 두고, 구간마다 다른 값은 미디어 쿼리로 바꾼다. 이름은 `--size-`로 시작하지 않는다. 한 곳에서만 쓰는 값은 그 조립에 숫자로 쓴다.
  - 앱이 컴포넌트의 크기(작업 표시줄 높이 등)를 계산에 쓸 때는 값을 따로 갖지 않고 화면의 요소에서 잰다.
  - 절대 위치 자식의 양쪽 늘이기 축 크기는 부모에서 나온다([[디자인 시스템:겹쳐 놓기]]).
  - 배율(`scaleFactor`가 1이 아님) 인스턴스는 원본 크기에 CSS `scale`을 건다.
  - 선 두께는 크기가 아니라 `stroke-width/*`다.
  - 코드와 피그마 어디에서도 쓰지 않는 토큰은 지운다. 피그마 쪽은 컴포넌트·조립·화면에서 쓰는지로 센다. 토큰 생성이 요구하는 화면 경계값은 쓰는 곳이 없어도 남긴다([[디자인 시스템:토큰 생성]]).
기기 변형: |
  화면 구간에 따라 달라지는 모양은 미디어 쿼리로 낸다. 구간의 뜻과 경계값은 [[반응형:기준]]에 있다.

  - `Laptop` 모드는 토큰 값만 바꾼다. 노트북 조건의 `@media` 안에서 변수 값을 덮고([[디자인 시스템:토큰 생성]]), 스킨은 노트북인지 모른다.
  - `Device` 변형은 미디어 쿼리로 낸다. `Desktop` 변형을 기본으로 내고, `Mobile` 변형은 차이만 모바일 조건의 `@media` 안에 낸다.
  - 미디어 쿼리로 읽는 축은 `Device` 하나뿐이다. 다른 축은 폭과 관련이 있어도 보통 변형으로 읽어 입력으로 내고, 조립이 값을 고른다(ImageViewer의 `Layout`은 창의 폭으로 갈린다). `Device`는 입력으로 내지 않는다.
  - `Device` 변형끼리 레이어가 다르면 상태와 같이 모두 그려 두고 미디어 쿼리로 보이고 숨긴다. 구조가 다르다고 막지 않는다.
  - 모바일에서 달라지는 동작은 동작과 조립이 맡는다.
토큰 생성: |
  피그마의 모든 변수와 스타일(색, 간격, 크기, 반경, 선 두께, 불투명도, 서체, 그림자, 그라데이션, 글자 스타일, 재질)을 플러그인이 `tokens.json`으로 내보내고, 생성 스크립트가 `tokens.css`와 `token-names.ts`를 만든다. 원본과 생성 파일의 자리는 [[디자인 시스템:스키마]]의 "파일 자리"를, 생성하는 때는 [[디자인 시스템:토큰 검사]]를 따른다.

  - 생성 스크립트는 `packages/design-system/scripts/tokens/`에 둔다(`generate:tokens`).
  - `tokens.json`은 W3C 디자인 토큰 형식(DTCG)이다. 토큰마다 `$value`와 `$type`을 두고, 다른 토큰을 가리키는 값은 경로로 남긴다. 글자 스타일과 효과·칠 스타일도 같은 파일에 넣는다.

  이름:
  - CSS 변수 이름은 `--`에 피그마 경로를 `-`로 이은 것이다. 스타일도 같다. 소문자로 바꾸고, 공백과 괄호는 `-`로 바꾸고, 이어진 `-`는 하나로 줄인다. 예: `spacing/sm` → `--spacing-sm`, `Surface/Flyout (Acrylic)` → `--surface-flyout-acrylic`.
  - 색은 이름 첫 마디가 종류가 아니므로 컬렉션 이름을 앞에 붙인다. 예: `Color` 컬렉션의 `Black/60` → `--color-black-60`, 클래스 `text-color-black-60`. 피그마의 색 변수 이름은 바꾸지 않는다.
  - 서로 다른 토큰이 같은 CSS 이름이 되면 생성이 실패한다. 피그마에서 이름을 고친다.
  - 피그마 변수의 code syntax(Web)는 이 CSS 이름으로 `var(--<이름>)`처럼 둔다. 피그마 MCP와 Dev Mode가 이 값을 변수 이름으로 보여 주므로, 다르면 구현할 때 없는 이름을 읽게 된다. 변수 이름을 바꾸면 code syntax도 함께 바꾼다.
  - 다른 변수가 속한 그룹의 이름이기도 한 변수(`White`와 `White/70`)는 그 그룹의 `$root` 토큰으로 내보내고, 별칭은 `{<그룹 경로>.$root}`로 쓴다. CSS 이름은 그룹 이름 그대로(`--color-white`)다.
  - 클래스는 `@theme`의 변수와 `@utility`로 만든다. 이름공간은 CSS 이름의 첫 마디다.
    - 클래스는 유틸리티 + 변수 경로 전체다(`p-spacing-sm`, `rounded-radius-control`). 색과 스타일도 원래 이름 전체를 쓴다(`text-color-black-60`, `shadow-elevation-flyout`).
    - 경로 이름 변수(`--spacing-sm`)는 `:root`에 두고, 클래스는 @theme의 별칭 `--<이름공간>-<경로 전체>: var(--<경로 전체>)`(`--spacing-spacing-sm`)가 만든다. Tailwind 기본 유틸리티와 `@utility`가 그대로 읽으므로 음수(`-top-spacing-sm`), 구간 변형(`laptop:`), lint, `cn`이 따로 작업 없이 된다.
    - 경로 이름 변수가 코드 이름(code syntax)이다. 값을 바꾸는 `@media`는 이 변수를 덮는다.

  | 피그마 | 이름공간(별칭 앞부분) | 클래스 예 | 값 |
  |---|---|---|---|
  | `Color` 컬렉션 | `--color` | `text-color-black-60`, `bg-color-white-70`, `border-color-black-60`, `inner-border-color-black-60` | 색 |
  | `spacing/*` | `--spacing` | `p-spacing-sm`, `-top-spacing-sm` | px |
  | `size/*` | `--size` | `w-size-<이름>` | px |
  | `radius/*` | `--radius` | `rounded-radius-control` | px |
  | `stroke-width/*` | `--stroke-width` | `border-stroke-width-default`, `outline-stroke-width-default`, `inner-border-w-stroke-width-default` | px |
  | `opacity/*` | `--opacity` | `opacity-opacity-cut` | % |
  | `font/weight/*` | `--font-weight` | `font-font-weight-semibold` | 숫자 |
  | `font/family/*`, `font/size/*`, `font/line-height/*` | 없음(`:root`) | 글자 스타일이 쓴다 | |
  | `breakpoint/*` | 클래스 없음(`:root`) | `laptop:`, `mobile:` | px |

  코드 전용 묶음: 피그마에 두지 않고 코드에만 있는 변수 묶음이다. CSS 이름과 클래스는 아래 표를 따른다.

  | 묶음 | 이름공간 | 클래스 예 | 값 |
  |---|---|---|---|
  | `blur/*` | `--blur` | `blur-blur-acrylic` | px |
  | `rotate/*` | `--rotate` | `rotate-rotate-half`, `-rotate-rotate-quarter` | deg |
  | `layer/*`(겹쳐 놓는 순서) | `--z-index` | `z-layer-window` | 숫자 |
  | `line-clamp/*` | `--line-clamp` | `line-clamp-line-clamp-two` | 숫자 |
  | `ratio/*` | `--aspect` | `aspect-ratio-wide` | 숫자 |
  | `position/*` | `--inset`, `--translate` | `top-position-half`, `-translate-y-position-half` | % |
  | `grid/*` | `--grid-column-start`, `--grid-row-start` | `col-start-grid-start` | 숫자 |
  | `border-spacing/*` | `--border-spacing` | `border-spacing-border-spacing-none` | px |
  | `shrink/*` | `--shrink`와 `@utility shrink-*` | `shrink-shrink-none` | 숫자 |
  | `flex/*` | `--flex`와 `@utility flex-*` | `flex-flex-fill` | 숫자 |

  - 색의 안쪽 선 고리(`inner-border-color-*`, [[디자인 시스템:컨트롤 테두리 구현]])는 Tailwind 기본 유틸리티가 없어 `--color-*`를 읽는 `@utility inner-border-*`를 더한다.
  - `shrink`와 `flex`는 Tailwind 기본 유틸리티가 테마를 읽지 않아 `@utility`를 더한다. 기본 유틸리티(`shrink-0`, `flex-1`, `flex`)와 함께 있어도 된다.
  - 문자 변수: STRING 변수는 `font/family/*`, `font/weight/*`에만 쓴다. 그 밖의 이름은 내보내기를 막는다. FLOAT 변수의 `$type`도 이름으로 정한다.

  스타일:

  | 피그마 | CSS 변수 | 클래스 |
  |---|---|---|
  | 글자 스타일(`Body Strong` 등) | 없음 | `type-body-strong`(연결된 서체·크기·굵기·줄 높이·자간 변수를 함께 건다). 기울임과 글자 장식이 있는 스타일은 `font-style: italic`, `text-decoration-line: underline`·`line-through`도 함께 건다. `tokens.json`에는 `$extensions.com.seojaewan`의 `fontStyle`·`textDecoration`으로 담고, 기본값(normal·none)이면 적지 않는다. 피그마 글꼴 스타일 이름 끝의 `Italic`은 기울임으로, 앞부분은 굵기로 읽는다 |
  | 효과 스타일(그림자만) | `--<이름>`(상자), `--shadow-text-<이름>`(글자) | `shadow-<이름>`(상자), `text-shadow-<이름>`(글자) |
  | 효과 스타일(배경 블러만) | `--<이름>` | `backdrop-blur-<이름>` |
  | 효과 스타일 `Surface/*`(그림자 + 배경 블러) | `--surface-<이름>-shadow`, `--surface-<이름>-backdrop-blur` | `surface-<이름>`(둘을 함께 건다) |
  | 칠 스타일(그라데이션) | `--<이름>` | `border-gradient-<이름>`([[디자인 시스템:컨트롤 테두리 구현]]) |

  옮기는 방법:
  - 별칭은 실제 값으로 풀지 않고 `var()` 참조로 남긴다. 스타일이나 다른 변수가 어느 원색을 가리키는지 CSS에서도 보이게 하기 위해서다.
  - 선형 그라데이션은 피그마 칠의 방향(`gradientTransform`)을 CSS 각도(소수 첫째 자리로 반올림)로 옮긴다. 위에서 아래 방향은 `to bottom`이다. 정지점 위치는 CSS 그라데이션 선(상자 모서리를 지나는 선)에 맞춰 옮긴다. 정사각형 상자에서는 피그마와 같고, 정사각형이 아닌 상자에서는 근사다(위아래·좌우 방향은 어느 상자에서나 같다). 방향 정보가 없는 `tokens.json`은 위에서 아래로 읽는다.
  - 방사형은 `gradientTransform`의 역변환으로 가운데와 두 손잡이를 구해 `radial-gradient(ellipse <가로>% <세로>% at <x>% <y>%, ...)`로 옮긴다. 정규화 좌표에서 축이 기울어진 타원은 생성이 실패한다.
  - 각도형은 `conic-gradient(from <첫 손잡이 각도>deg at <x>% <y>%, ...)`로 옮긴다. 정사각형 상자에서는 피그마와 같고 아니면 근사다. 뒤집힌 각도형은 생성이 실패한다.
  - 다이아몬드 그라데이션은 대응하는 CSS가 없어 구조 검사가 막고, 칠 스타일에 있으면 생성도 실패한다.
  - 그라데이션 정지점 사이 색은 피그마가 투명도를 곱하지 않고 섞고, CSS는 투명도를 곱한 값으로 섞는다. 투명도와 RGB가 모두 다른 두 정지점 사이는 피그마 방식으로 계산한 중간 정지점을 넣는다.
  - 재질은 배경 블러 효과 스타일과 반투명 바탕색 변수로 나눠 옮긴다([[디자인 시스템:재질 구현]]).
  - 그림자만 있는 효과 스타일은 상자용 `shadow-*`와 글자용 `text-shadow-*`를 함께 만든다. 피그마에서 글자 레이어에 건 그림자는 글자 모양을 따라가므로 `text-shadow-*`를 쓴다. 퍼짐(spread)이 있는 그림자는 text-shadow로 옮길 수 없어 `text-shadow-*`를 만들지 않는다. `--text-shadow-*`는 글자 크기 이름공간(`--text-*`)과 겹치므로 글자용 변수는 `--shadow-text-<이름>`이다.
  - Tailwind 기본 테마 값(색상, 간격, 서체, 글자 크기, 줄 높이, 반경, 그림자, 블러, 이징, 애니메이션, 구간)은 `tokens.css` 맨 앞의 `--*: initial`로 지우고 디자인 토큰 이름으로만 쓴다. Tailwind는 `initial`보다 앞에 정의된 같은 이름공간 변수를 지우므로, 지우기가 토큰보다 먼저 와야 한다.
  - 토큰은 세 블록에 나눠 둔다.
    - `@theme`: Tailwind 기본 테마 값 지우기와 기본 서체(`--default-font-family`)만 둔다.
    - `:root`: 클래스로 쓰지 않는 변수(글자 스타일만 쓰는 서체 값, 경로 이름 변수 등)를 둔다. Tailwind는 `@theme` 안의 변수로만 클래스를 만들므로, 여기 둔 변수는 컴포넌트가 클래스로 쓸 수 없다.
    - `@theme static`: 클래스가 읽는 변수를 둔다. `static`은 유틸리티에서 쓰지 않은 변수도 CSS에 남겨, 손으로 쓴 CSS와 인라인 스타일이 `var()`로 참조할 수 있게 한다.
  - 규칙이 없는 변수 묶음이나 스타일 종류(예: `font/stretch/*`)를 만나면 생성이 실패한다. 이 섹션에 규칙을 먼저 정한다.

  화면 크기:
  - 경계값은 `breakpoint/mobile/width`, `breakpoint/laptop/width`, `breakpoint/laptop/height` 셋이고, 하나라도 빠지면 생성이 실패한다. 값은 "이 값 미만"이라 CSS에서는 1을 뺀다. 구간의 뜻은 [[반응형:기준]]에 있다.
  - 경계값이 있으면 블록 형식 `@custom-variant` `laptop:`·`mobile:`을 만든다. 한 줄 형식은 쉼표에서 잘려 깨진다. 모바일 판정이 먼저라 노트북 조건은 모바일 폭을 뺀다(`(min-width: 768px) and (max-width: 1599px), (min-width: 768px) and (max-height: 899px)`). 그래서 어느 창 크기든 `pc | laptop | mobile` 가운데 하나에만 든다.
  - 변수 모드: 컬렉션의 기본 모드 값이 토큰 값이고, 다른 모드에서 값이 다른 변수는 `$extensions.com.seojaewan.modes`에 담는다. `Laptop` 모드 값은 노트북 조건의 `@media` 안 `:root`로 경로 이름 변수를 덮는다([[디자인 시스템:기기 변형]]). 다른 모드 이름은 규칙이 없어 생성이 실패한다.
  - 클래스는 `:root` 값이 바뀌면 따라가므로 컴포넌트에 구간별 분기를 두지 않는다. 실행 중 계산에 쓰는 값(창 기본 크기)은 앱의 CSS 변수에서 읽는다([[디자인 시스템:크기 변수]]).
  - 생성 스크립트가 `token-names.ts`도 함께 만든다. `TOKEN_NAMES`(@theme 이름공간마다 든 토큰 이름, `cn`이 쓴다)와 `BREAKPOINTS`(경계값 px, 패키지 진입점이 내보낸다)다.

  앱 CSS 연결:
  - 앱은 디자인 시스템의 `tokens.css`를 가져다 쓰고, `@source`로 디자인 시스템 소스를 읽어 해당 소스의 클래스도 생성한다.
토큰 사용 강제: |
  토큰은 `tokens.css`에서만 정의하고, 코드는 토큰 클래스만 쓴다. 토큰에 없는 값이 필요하면 피그마부터 고친다. 크기와 움직임은 예외로 숫자를 쓸 수 있다([[디자인 시스템:크기 변수]]).

  - Stylelint의 `at-rule-disallowed-list`로 `@theme`, `@utility`, `@custom-variant`를 막고, `overrides`로 `tokens.css`만 풀어 준다. 다른 CSS에서 토큰을 새로 정의하거나 덮어쓰지 못하게 하기 위해서다.
  - class 안의 값은 ESLint `better-tailwindcss`가 막는다. 모르는 클래스(`no-unknown-classes`)는 lint 오류다. 임의 값(`bg-[#fff]`, `p-[13px]`)은 크기와 움직임 밖에서 lint 오류다.
  - JSX `style={{ … }}` 자리에 바로 쓴 객체(조건식·논리식이 고른 객체 포함)의 값 자리에 리터럴(문자열·숫자)을 쓰면 lint 오류다. 끌기 위치처럼 실행 중에 계산하는 값(변수·식)만 허용한다. 변수에 담아 넘긴 객체(`style={widthStyle}`)는 검사에서 빠지므로, 리터럴 값을 담은 style 객체를 변수로 만들지 않는다.
  - 토큰이 될 수 없는 CSS 기능(예: `scrollbar-width: none`)은 디자인 시스템의 `reset.css`(`theme.css`가 불러온다)에 속성 선택자로 둔다(`[data-scrollbar-hidden]`). 컴포넌트는 그 속성만 단다.
  - 토큰 이름의 첫 마디가 Tailwind 기본 이름공간과 겹치면(예: `--text-*`는 글자 크기 이름공간이다) Tailwind 기본 유틸리티가 그 변수를 다른 속성으로 읽은 클래스를 함께 만든다. 이런 클래스는 `no-restricted-classes`로 막는다. 목록은 `tokens.css`를 Tailwind에 넣어 보고 자동으로 모으며, 테스트가 지킨다.
  - 크기와 움직임 밖의 값은 클래스에 숫자를 직접 쓰지 않는다. 숫자로 끝나는 클래스 가운데 Tailwind 기본 숫자 클래스(`shrink-0`, `rotate-180`, `z-10`, `aspect-3/2`, `mask-l-from-50%`), 투명도 덧붙임(`bg-x/50`), 토큰에 없는 이름을 `no-restricted-classes`로 막고, 변형이 붙어도 같다. `tokens.css` 토큰 이름에서 나온 클래스는 이름이 숫자로 끝나도(`text-color-black-60`, `bg-color-white-70`) 허용한다. `rounded-full`, `w-full`처럼 숫자가 아닌 기본 클래스는 해당하지 않는다.
  - 움직임은 생성한 스킨이 갖는다([[디자인 시스템:모션 클래스]]). 조립이 만든 상자의 움직임만 조립이 쓰고, 길이·이징·늦춤·배율은 숫자로 쓴다.
  - 클래스는 `cn`으로 조합한다. 조건부 클래스를 합치고 같은 속성의 클래스가 겹치면 뒤의 것을 남기며, 컴포넌트는 기본 클래스 뒤에 사용처의 `className`을 넘겨 사용처가 덮어쓸 수 있게 한다. `cn`은 생성한 이름 목록(`token-names.ts`)으로 디자인 토큰 이름을 안다. 앱도 패키지가 내보낸 `cn`을 쓴다.
  - lint는 JSX `className`과 이름이 `ClassName`으로 끝나는 속성, `cn`의 인자, 이름이 `ClassName`·`CLASS_NAME`(복수 포함)으로 끝나는 변수의 값(문자열, 배열, 객체), 객체 속성 `className`의 값(`{ className: '…' }`)을 `.ts`·`.tsx`에서 검사한다(`*.test.*`는 뺀다). 클래스 문자열은 이 다섯 중 한 곳에 쓴다. `.join()` 앞의 배열은 lint가 읽지 못해 `className` 안의 `.join()`을 `no-restricted-syntax`로 막는다.
  - `@utility`로 만든 클래스를 lint가 아는 클래스로 보는지, `cn` 안의 모르는 클래스를 막는지는 테스트로 지킨다.
서체 구현: |
  서체와 글자 스타일의 이름과 뜻은 피그마 글자 스타일·변수의 description에 있다.

  - 글꼴은 Pretendard 하나다. 라틴과 한글을 모두 Pretendard로 그린다.
  - 코드 서체는 `font-family: 'NanumGothicCoding'` 하나로 두고 Pretendard를 대체로 두지 않는다. 한글이 든 고정폭 서체 하나로 코드의 라틴과 한글을 모두 그린다. 코드 글자 스타일 둘(`Code`, `Code/Inline`)만 이 서체를 쓴다.
  - 모든 서체는 웹 폰트로 제공한다(`@fontsource/nanum-gothic-coding` 등). 토큰 값이 피그마 서체 이름으로 오므로, 생성하는 `@font-face` 이름을 피그마 이름에 맞춘다.
  - 기울임은 Pretendard Regular를 브라우저가 기울여 그리는 것을 허용한다. Pretendard에는 기울임 글꼴이 없다.
  - 밑줄·취소선이 있는 글자는 글자에 직접 넣지 않고 그 장식이 든 글자 스타일 클래스(`type-body-large-link` 등)를 쓴다.
  - 글자 레이어 하나에는 글자 스타일 하나만 쓴다([[디자인 시스템:구조 검사]]). 어느 낱말이 굵은지는 내용이 정한다.
  - 피그마와 Chromium의 글자 기준선 차이의 영향과 허용 범위는 [[한계:글자 기준선]]에 있다.
재질 구현: |
  재질의 값은 피그마 Material 변수·스타일에 있다. 재질은 배경 흐림과 반투명 바탕색 한 겹이다.

  - Acrylic과 Mica는 같은 요소에 바탕색 클래스(`bg-*`)와 배경 블러 클래스(`backdrop-blur-material-*`)를 건다. 의사 요소나 쌓임 순서 제약이 없다.
  - 코드는 색 변수의 투명도를 쓴다. 피그마는 변수 색을 연결할 때 그 투명도를 칠 불투명도로 옮겨 오고, 그린 결과에는 칠 불투명도만 적용된다. 그래서 피그마에서 연결한 뒤 칠 불투명도를 따로 바꾸지 않아야 코드와 같다.
  - 같은 재질 위에서 밝기를 나누는 덧칠(반투명 흰색)과 띠 사이 구분선은 컴포넌트가 아니라 조립에 직접 그린다([[디자인 시스템:조립]]).
  - 피그마 배경 블러와 브라우저 `backdrop-filter`는 계산 방식이 달라 같은 값도 모습이 조금 다르다.
  - 그림자와 배경 블러는 효과 스타일로만 쓴다. 그림자는 투명한 부분 뒤에 표시하지 않는다(showShadowBehindNode 끔, [[디자인 시스템:구조 검사]]). CSS `box-shadow`도 요소 안쪽에는 그림자를 그리지 않으므로 반투명 표면 안쪽에 그림자가 비치지 않는다.
컨트롤 테두리 구현: |
  테두리의 모양은 피그마 컨트롤 테두리 칠 스타일과 그 description에 있다.

  - 생성 스크립트가 이 스타일을 CSS 그라데이션 값으로 옮긴다([[디자인 시스템:토큰 생성]]). 피그마 정지점 위치는 노드 높이 대비 비율이라 CSS에서도 같은 비율(`to bottom`, 90.58% 등)로 둔다. 그래서 피그마와 같은 높이의 컨트롤에서 같은 결과가 나온다.
  - 코드에서는 `border-gradient-*` 유틸리티로 그린다(예: `border-gradient-elevation-control-border`). 요소의 `::before`를 고리 모양으로 가리고 그라데이션을 칠한다. 고리 두께는 피그마 선 두께 변수에 대응하는 `inner-border-w-<두께 토큰>`(예: `inner-border-w-stroke-width-default`)으로 함께 정한다.
  - 피그마 안쪽 선(inside stroke)처럼 요소 크기 안에, 자식 위에 그린다. 피그마는 프레임의 선을 절대 위치 자식(예: SearchBox의 포커스 아래 선)보다도 위에 그리므로 `::before`는 `z-index: 1`이다. `::before`가 요소에 맞춰지도록 요소에 `relative` 같은 위치 지정이, 고리가 요소 밖의 형제를 덮지 않도록 쌓임 맥락(`isolate`)이 있어야 한다.
  - 단색 안쪽 선은 같은 방식의 `inner-border-*` 유틸리티로 색 토큰 이름으로 그린다(예: `inner-border-color-black-60`). 두께는 그라데이션 선과 같이 `inner-border-w-<두께 토큰>`으로 정한다. Pressed·Disabled처럼 상태에 따라 그라데이션 선과 단색 선을 바꾸는 컨트롤이 같은 자리에 그리게 하기 위해서다.
  - 피그마에서 선이 레이아웃에 들어가는 프레임(strokes included in layout, 예: Flyout)은 CSS `border`와 같으므로 `border`를 쓴다.
포커스 구현: |
  포커스 선의 모양은 피그마 포커스 선 변수·스타일과 그 description에 있다.

  - 코드는 바깥쪽 선을 Tailwind outline 유틸리티로 그린다. 색은 `outline-<색 토큰>`, 두께는 `outline-<두께 토큰>`이다(예: `outline-color-black-89 outline-stroke-width-focus-outer`). Tailwind v4에는 `outline-w-*`가 없고 outline 유틸리티가 색과 두께를 모두 받는다. CSS outline은 레이아웃 크기를 바꾸지 않고 요소 바깥에 그려져 피그마 바깥쪽 선과 같다.
  - `ExplorerFileItem`·`DesktopFileItem`·`FileRow`의 포커스 선은 피그마에서 크기에 넣지 않고 안쪽에 겹치는 단색 선이라 outline이 아니라 `focus-visible:inner-border-*`로 그린다([[디자인 시스템:컨트롤 테두리 구현]]). 브라우저 기본 외곽선은 `outline-none`으로 끈다.
회전 구현: |
  - 정지 회전은 90도 단위로 쓴다([[디자인 시스템:구조 검사]]).
  - 피그마는 반시계 방향이 양수이고 CSS는 시계 방향이 양수라 부호가 반대다(피그마 90° → CSS -90°). 생성기는 레이어의 회전과 회전 키프레임([[디자인 시스템:모션]])의 부호를 뒤집어 그대로 낸다. 변수와 짝짓지 않는다.
  - 손으로 쓰는 코드(조립)의 회전은 코드 전용 `rotate/*` 토큰(`rotate-rotate-half` 등, [[디자인 시스템:토큰 생성]])을 쓴다.
모션 견본: |
  피그마에서 움직임을 찾는 곳이다. 움직임은 움직이는 컴포넌트 안에 키프레임으로 걸려 있다.

  - 컴포넌트의 움직임은 그 컴포넌트의 `Motion` 축에 둔다. 값 하나가 움직임 하나이고, `None`이 가만히 있는 모습이다. `Motion` 변형은 기본 모습에만 둔다.
  - 컴포넌트를 통째로 움직이는 것은 내용 전체를 감싼 `motion` 레이어에 건다. 피그마는 컴포넌트 자체에 키프레임을 걸지 못하게 막기 때문이다. 생성기는 이 레이어의 움직임을 컴포넌트 전체의 움직임으로 읽고, 레이어는 코드에 만들지 않는다.
  - 안쪽 부품 하나만 움직이는 것은 그 레이어에 그대로 건다. 자산 안쪽의 움직임은 자산 원본에 건다. 인스턴스 안쪽 레이어에는 키프레임을 걸 수 없기 때문이다. 예: ProgressRing의 호는 자산 원본 `progress-ring/Arc`, 검색 돋보기 강조는 자산 원본 `icon-color/Search Focus`에 있다.
  - hover·pressed·focus 전환은 변형 사이 전환이다([[디자인 시스템:상태]]).
  - 반복 여부는 재생 설정 Loop다.
  - 움직임은 움직이는 상자마다 따로 본다. 컴포넌트인 상자의 움직임은 그 컴포넌트의 `Motion`에 두고, 조립이 만든 상자의 움직임만 조립이 쓴다. Patterns에 그린 움직임은 읽지 않는다.
  - 움직임이 언제 시작되는지는 조립의 프로토타입이 보여 주고, 정확한 조건은 화면별 기능 문서가 정한다.

  ProgressRing의 호 자산 `progress-ring/Arc`는 끝점을 잇지 않은 열린 원 경로(선, 둥근 끝)이고, 회전(`ROTATION`)과 경로 트림(`PATH_TRIM_START`·`PATH_TRIM_END`) 키프레임이 걸려 있다. 키프레임 기본값(baseValue)은 멈춘 호 모습이다. 코드로 옮기는 방법은 [[디자인 시스템:모션]]에 있다.
모션 클래스: |
  움직임을 트는 표시와 스킨이 갖는 CSS의 꼴이다. 움직임의 모양은 스킨이 갖고, 언제 트는지는 동작과 조립이 정한다.

  - 움직임을 트는 표시는 `data-motion` 속성 하나다. 값은 `Motion` 축의 값 이름을 소문자로 쓴 것이고(`Open`은 `open`), 속성이 없으면 `None`이다.
  - 스킨은 `[data-motion='<값>']`일 때의 `@keyframes`와 `animation`만 갖고, 동작과 조립은 이 속성만 바꾼다. 움직임마다 다른 클래스(`motion-*`)는 두지 않는다.
  - `@keyframes`는 속성마다 하나씩 만든다. 이름은 `<컴포넌트>-<Motion 값>-<속성>`이다(`window-frame-open-scale`). 한 상자의 속성들은 `animation`에 쉼표로 나란히 건다.
  - 반복은 Loop가 켜져 있으면 무한, 꺼져 있으면 한 번이다.
  - 처음과 끝 모습은 재생 전후에도 유지한다(`animation-fill-mode: both`).
  - 값은 키프레임의 숫자를 그대로 쓴다([[디자인 시스템:모션]]). 조립이 때를 맞추려고 쓰는 시간은 앱이 자기 상수로 갖는다.
  - 이동과 배율의 키프레임 값은 CSS 변수로 내고 키프레임의 숫자를 기본값으로 둔다. 변수는 키프레임마다 하나이고, 이름은 `--<컴포넌트>-<Motion 값>-<속성>-<위치>`다. 위치는 키프레임의 백분율이다(`translate: var(--window-frame-minimize-translate-100, 0px 480px)`).
  - 실행 중에 정해지는 값(창이 줄어드는 자리, 옮기기 전의 자리, 메뉴의 높이)은 동작이나 조립이 움직이는 요소에 이 변수를 넣어 덮는다. 덮지 않으면 키프레임의 숫자로 움직이고, 검증은 덮지 않은 값으로 견준다([[디자인 시스템:생성 결과 검증]]).
  - 여러 상자가 함께 움직이는 장면은 조립이 각 상자의 움직임을 같은 때에 틀어 만든다. 장면을 묶은 움직임은 따로 두지 않는다.

  사라지는 요소(창 닫기, 패널·메뉴 닫기):
  - 사라지는 움직임은 동작이 건다. 닫으라는 신호가 오면 요소를 바로 빼지 않고 `data-motion`을 사라지는 값으로 바꾼 뒤, 그 요소의 애니메이션이 끝나면 뺀다. 기다릴 애니메이션이 없거나 애니메이션이 없는 환경(jsdom)이면 바로 뺀다.
  - 나타나는 움직임은 다 나타난 뒤 속성을 뗀다.
  - 저장소에서는 바로 지우고, 화면에서만 애니메이션이 끝날 때까지 남긴다. 그래서 "맨 앞 창을 닫으면 최근 창이 앞으로" 같은 규칙([[창 동작:창 조작]])이 바로 적용된다.
  - 창이 열리는 도중에 닫으면 닫기 애니메이션이 처음부터 시작된다([[한계:열리는 도중 닫기]]).

  최대화·복원·스냅은 FLIP 방식이다.
  1. 이전 위치·크기를 잰다.
  2. 창을 바로 새 상태로 바꾼다.
  3. transform으로 이전 자리·크기에 맞춘다.
  4. transform을 없애는 애니메이션을 재생한다.

  움직이는 동안 내용이 늘어나는 영향은 [[한계:최대화·스냅 중 내용 늘어남]]에 있다.

  창을 드래그하거나 크기 조절하는 동안에는 움직임을 끈다.
동작 줄이기: |
  동작 줄이기는 Windows의 "애니메이션 효과"를 끈 것과 같은 기준이다. 멈추면 정보가 사라지는 움직임만 남기고, 나머지 움직임은 움직임 없이 바로 바뀐다(스켈레톤 반짝임, 검색창 페이드, hover·pressed 색 전환 포함).

  - 동작 줄이기 설정(`prefers-reduced-motion: reduce`)은 `[data-motion]`에 한 번 건다. 변형 사이 전환도 걸지 않는다([[디자인 시스템:상태]]).
  - 남기는 움직임은 이 섹션에 적는다. 진행 표시(ProgressRing)는 꼭 필요한 움직임으로 보고(WCAG 2.3.3 예외) 느리게 하지 않고 그대로 돌린다.
  - 재부팅 화면을 보여 주는 시간은 필요한 로딩이라 그대로 둔다.
피그마 플러그인: |
  비공개 개발용 플러그인으로 `tools/figma-plugin`에 있다([[저장소 구성:구성]]). 화면은 [[디자인 시스템:플러그인 화면]]에 있다.

  - 사람이 열어서 실행했을 때만 동작한다.
  - 내보내기 대상은 토큰 / 자산 / 컴포넌트다([[디자인 시스템:내보낼 대상]]). 토큰만 따로 골라 내보낼 수 있다.
  - 내보내기 전에 검사하고, 위반이 있는 대상은 파일을 만들지 않는다([[디자인 시스템:구조 검사]]).
  - JSON과 자산 원본만 내보내고 코드로 바꾸지 않는다([[디자인 시스템:세 겹]]).
  - 내보내는 것:
    - 토큰: `tokens.json`([[디자인 시스템:토큰 생성]])
    - 자산: 원본 SVG와 래스터([[디자인 시스템:자산]])
    - 컴포넌트: 컴포넌트마다 스키마와 검증 자료([[디자인 시스템:스키마]], [[디자인 시스템:생성 결과 검증]])
  - 읽는 것: 변수의 컬렉션·모드·별칭·쓰임 범위·코드 이름과 모든 모드 값, 글자·효과·칠 스타일, description, 컴포넌트 속성 정의와 변형, 인스턴스 덮어쓰기, 자동 배치 값, 슬롯, `Interaction` 주석, 키프레임과 재생 설정 Loop, 변형 사이 전환, 최대 줄 수와 말줄임, 프레임 스크롤 방향, 선이 레이아웃에 들어가는지, 자산 경로와 색, 최소·최대 크기, 피그마가 계산한 레이어의 자리·크기와 모습의 값. description은 평문이다(`descriptionMarkdown`은 변수·스타일에서 오류가 난다). Variables는 플러그인 API로 읽는다. REST API의 Variables 엔드포인트는 Enterprise 플랜 전용이다.
  - 변형 속성 정의에는 설명(`description`)을 쓰지 않는다. 변형 속성에 쓰면 오류 없이 속성 이름이 지워져 변형 이름이 깨진다.
  - 피그마 MCP(`use_figma`)로 플러그인을 돌리지 않는다. `use_figma`의 한도(코드 5만 자, 반환값 48,000바이트, `fetch` 없음)를 넘기 때문이다.

  PR:
  - 브랜치는 토큰 `feat/figma-tokens`, 자산 `feat/figma-assets`, 컴포넌트 `feat/figma-<컴포넌트>`다. 같은 대상을 다시 내보내면 열린 PR의 브랜치에 이어서 커밋하고, 열린 PR이 없으면 `main`에서 새로 만든다.
  - 토큰 PR은 `tokens.json`만, 자산 PR은 자산 원본만, 컴포넌트 PR은 그 컴포넌트의 스키마와 검증 자료만 바꾼다.
  - 컴포넌트 PR의 본문은 `main`의 스키마와 견줘 새로 생긴 변형, 바뀐 변형, 사라진 변형을 표로 적는다. 변형 이름은 피그마의 그 변형으로 가는 링크다. 그림은 넣지 않는다.
  - 토큰은 다른 대상을 내보낼 때도 매번 읽어 `main`의 `tokens.json`과 비교하고, 다르면 토큰 PR을 열거나 갱신한다. 같으면 열지 않는다.
  - 바뀐 파일만 올린다. 파일의 git blob SHA-1을 플러그인에서 계산해 저장소의 것과 같으면 올리지 않는다.
  - PR을 열 때 changeset을 함께 올린다([[디자인 시스템:PR 흐름]]).
  - GitHub 요청은 한 함수로 보낸다. 5xx, 429, 한도 초과 403, 네트워크 실패는 1초·2초·4초 간격으로 최대 세 번 다시 시도하고 4xx는 다시 시도하지 않는다. PR을 만드는 요청이 실패하면 같은 head로 열린 PR이 있는지 보고, 있으면 그 PR을 쓴다.
  - 저장소와 기준 브랜치는 플러그인 코드에 고정한다. 이 저장소에만 권한이 있는 GitHub fine-grained 토큰(Contents·Pull requests 읽기/쓰기, Metadata 읽기)을 플러그인 로컬 저장소에 보관한다. 토큰은 붙여 넣어 쓴다. OAuth 로그인은 자체 서버가 있어야 하기 때문이다.
플러그인 화면: |
  플러그인 화면은 내보낼 대상을 빨리 고르고 결과를 한눈에 보는 데 맞춘다.

  - 배치: 머리줄에 제목과 ⚙ 설정 버튼, 그 아래 선택 도구줄(이름 붙여넣기 선택, 선택 해제, 목록 안 찾기), 스크롤되는 대상 목록, 아래 고정줄(고른 수·열릴 PR 수와 내보내기 버튼)이다. 내보내는 동안과 끝난 뒤에는 목록 자리가 진행·결과 화면으로 바뀌고 "목록으로 돌아가기"로 돌아간다.
  - 설정: GitHub 토큰 입력(가림·보기, 입력하면 바로 저장), 연결 확인, 토큰 만들기 링크와 필요한 권한, 토큰 지우기, 읽기 전용 저장소·파일 키, 이 문서로 가는 링크다. 토큰이 없으면 설정 화면부터 열고 내보내기 버튼 옆에 안내를 보인다.
  - 대상 목록: 토큰은 한 줄로 `main`의 `tokens.json`과 비교한 추가·변경·이름 변경·삭제 개수를 보이고, 펼치면 바뀐 토큰 이름을 보인다. 자산은 한 줄이다. 컴포넌트는 페이지(Controls·Shell·Blog)로 묶고, 묶음 안은 피그마 캔버스에 놓인 순서다. 묶음은 접고 펼칠 수 있고 체크박스(일부만 고르면 반쯤 찬 표시)와 "고른 수 / 전체 수"를 둔다. 항목은 이름, 변형 수, 상태(저장소에 폴더가 없으면 "새로 만듦")를 보인다. 목록 안 찾기는 이름에 글자가 든 항목만 남기고 걸린 묶음을 펼친다. GitHub 토큰이 없으면 토큰 비교와 상태는 "설정 필요"다.
  - 바뀐 대상을 자동으로 찾아 고르는 기능은 두지 않는다. 구조 지문을 따로 기록해야 하는데, 이름 붙여넣기 선택으로 충분하기 때문이다.
  - 진행과 결과: 진행 막대와 지금 하는 일 한 줄, 접어 둔 로그를 보인다. 끝나면 PR을 토큰·자산·컴포넌트로 묶어 새 PR인지 이어 커밋했는지와 링크를 보인다. 검사 위반은 대상별로 묶고, 줄마다 그 레이어를 선택하고 화면을 옮기는 "피그마에서 보기"를 둔다.

  이름 붙여넣기 선택:
  - 한 줄에 하나, 또는 쉼표로 잇는다. `토큰`(또는 `tokens`)은 토큰, `자산`(또는 `assets`)은 자산, 컴포넌트는 이름이다.
  - 대소문자를 구분하지 않고, 줄 앞의 `-`·`*`·번호, 이름을 감싼 백틱, 앞뒤 공백, 빈 줄과 `#`으로 시작하는 줄은 무시한다.
  - 선택을 누르면 지금 선택을 지우고 붙여넣은 대상만 고른다. 고른 수와 찾지 못한 이름을 보여 주고, 고른 항목이 든 묶음을 펼친다.
  - AI 작업 세션은 내보낼 대상을 보고할 때 이 형식의 복사용 목록을 함께 준다. 쉼표로 이은 한 줄을 코드 블록에 담고, 토큰 → 자산 → 컴포넌트 순서로 적는다. 예: `토큰, 자산, Flyout, Menu`
구조 검사: |
  플러그인은 내보내기 전에 변형마다 검사하고, 어긋난 것이 하나라도 있으면 그 컴포넌트를 내보내지 않는다. 피그마 값이 모두 토큰이고 CSS로 그릴 수 있어야 생성한 스킨이 피그마와 같아지기 때문이다.

  막는 것은 세 묶음이다.
  1. 토큰 없는 값. 색, 간격, 모서리, 선, 글자, 효과가 변수나 스타일에 묶여 있지 않으면 막는다. 효과는 효과 스타일로, 그라데이션은 칠 스타일로만 쓴다. 크기와 움직임은 숫자를 허용한다([[디자인 시스템:크기 변수]]).
  2. CSS로 그릴 수 없는 기능. 노이즈·텍스처·점진 블러 효과, 블렌드가 들어간 칠과 효과, 투명한 부분 뒤에도 표시하는 그림자, 점선, 가변 두께·브러시 선, 모서리 스무딩, 마스크, 자산이 아닌 원·타원·호·별·다각형·선·불리언·벡터, 이름 있는 자산에 없는 이미지, 빠진 글꼴, OpenType 기능, 다이아몬드 그라데이션, 이미지 칠의 맞춤 방식 `CROP`·`TILE`.
  3. 모양 덮어쓰기. 인스턴스 안 레이어의 칠·선·효과·불투명도가 원본과 값이 다르면 막는다. 덮어쓰기 기록만으로는 막지 않는다(값이 같아도 기록이 남는다). 자산 인스턴스의 색과 자산 인스턴스 전체의 불투명도는 허용한다. 글자 바꾸기, 아이콘 교체, 불리언, 변형 고르기처럼 원본이 속성으로 연 것도 허용한다([[디자인 시스템:컴포넌트 조립 규칙]]).

  읽을 수 없는 구조도 막는다.
  - 이름이 같은 컴포넌트가 둘 이상이다([[디자인 시스템:내보낼 대상]]).
  - 숨긴 레이어가 켜고 끄는 속성에 묶여 있지 않다.
  - 입력이나 동작의 역할이 되는 레이어끼리 이름이 같다. 그 밖의 레이어와 슬롯 안의 견본 내용은 이름이 겹쳐도 막지 않는다. 클래스 이름은 레이어의 자리로 짓는다.
  - 글자 레이어 하나에 글자 스타일이 둘 이상 섞여 있다. 스킨은 글의 기본 스타일만 정하고, 어느 낱말이 굵은지는 내용이 정한다.
  - 적힌 동작의 종류와 구조가 어긋난다. 등록부에 없는 종류, 종류가 요구하는 레이어가 없는 변형이다([[디자인 시스템:동작의 종류]]).
  - 상태 이름에 낱말 표에 없는 낱말이 있다([[디자인 시스템:상태]]).
  - 옮기는 속성 밖의 속성에 키프레임이 걸려 있다([[디자인 시스템:모션]]).

  허용하는 것: 90도 단위 회전([[디자인 시스템:회전 구현]]), 자동 배치 안의 절대 위치([[디자인 시스템:겹쳐 놓기]]), 배율을 준 인스턴스, 줄바꿈 배치.
  - 크기를 줄인 인스턴스(`scaleFactor`가 1이 아님)는 인스턴스 자체만 검사하고 안쪽은 건너뛴다. 안쪽은 원본 쪽에서 따로 검사받고, 줄인 값은 코드에서 CSS `scale`로 만들어진다.

  - 토큰 내보내기는 값이 없는 변수 모드, 다이아몬드 그라데이션, 이름 규칙이 없는 문자 변수를 막는다([[디자인 시스템:토큰 생성]]).
  - 알림(막지 않음): 파일에서 사용처가 0인 변수·스타일을 알려 준다. 단계 이름 묶음(`spacing/*`)은 알리지 않는다. Screens까지 센다.
  - 메시지: 위반마다 위치(컴포넌트 / 변형 / 레이어 경로), 이유, 고칠 방법을 쓰고, 한 대상의 위반은 모두 한 번에 보여 준다.

  피그마 기능으로 읽는 것: 피그마가 가진 정보는 속성으로 가져온다. 주석에는 기계가 읽는 이름표만 둔다([[디자인 시스템:피그마 파일]]).

  | 정보 | 읽는 곳 |
  |---|---|
  | 반복 여부 | 재생 설정 Loop(`playbackSettings.loop`). 켜면 무한 반복, 끄면 한 번이다 |
  | 상태 사이 전환의 시간·이징 | 변형 사이 전환(`reactions`)의 목적지·시간·이징 |
  | 재생 시작 조건(트리거) | 읽지 않는다. 조립의 프로토타입이 사람에게 보여 주고, 정확한 조건은 화면별 기능 문서와 코드가 맡는다 |
  | 말줄임, 목록 스크롤 | 글자 말줄임 설정, 프레임 스크롤 설정 |
  | 동작의 종류 | 컴포넌트 세트의 `Interaction` 주석 |
  | 실행 중에 동작이 정하는 값 | 읽지 않는다. 동작의 종류 문서에 있다([[디자인 시스템:동작의 종류]]) |
  | 동작 줄이기에서 남기는 움직임 | 읽지 않는다. [[디자인 시스템:동작 줄이기]]에 있다 |
자산: |
  자산은 피그마 Foundations의 자산 컴포넌트이고, 컴포넌트와 화면은 그 인스턴스를 쓴다. 코드는 같은 이름의 자산을 쓴다.

  - 묶음은 원본 컴포넌트가 놓인 구역으로 정한다. `Foundations / Icons` 아래의 컴포넌트는 Icons다(그 아래는 `size/<세트>/<크기>`로 나눈다). `Foundations / Assets` 아래의 컴포넌트는 그것이 든 `group/<묶음>` 프레임의 이름이 묶음이다.
  - 칠과 테두리 색이 다른 도형은 칠 자산과 테두리 자산 둘을 겹쳐 쓴다.
  - 사각형은 CSS로 그린다. 원과 타원은 다른 도형과 같이 자산으로 둔다([[디자인 시스템:구조 검사]]).
  - 이미지는 이름 있는 Images 자산으로만 쓴다. 플러그인은 이미지 해시로 자산 이름을 찾고, 이름 있는 자산에 없는 이미지는 막는다.
  - 자산은 자기 크기를 쓴다. 놓인 크기가 원본과 다를 때만 놓인 자리에 그 크기를 적는다.
  - 그림 자산은 피그마에 큰 원본 하나를 둔다. 여러 자리에 여러 크기로 놓이는 작은 그림(파일, 앱)은 파일 하나를 모든 자리에서 쓴다. 한 자리에 한 번 놓이는 큰 사진(배경화면)만 크기별로 여러 벌을 쓰고, 그 크기별 그림은 디자인 시스템이 만들지 않고 쓰는 앱이 `next/image`로 받는다.

  | 묶음 | 내보내는 원본 | 코드 |
  |---|---|---|
  | Icons, Shapes(한 가지 색) | SVG. id를 내용 기반 이름으로 바꾸고 색을 `currentColor`로 바꾼다 | 자산 이름 + 글자 색 클래스 |
  | Illustrations(여러 색) | SVG. id만 바꾼다 | 자산 이름 |
  | Images(래스터) | 이미지 칠 하나면 원본 바이트, 아니면 PNG(배율 1). 확장자는 바이트의 실제 형식이다(JPEG `.jpg`, PNG `.png`) | 확장자 없는 자산 이름(`images/<자산>`). 생성기가 만든 WebP를 쓴다 |

  원본과 생성:
  - 원본(SVG, 래스터)은 `src/assets/`에 생성물과 함께 둔다([[디자인 시스템:스키마]]). 래스터 원본의 형식이 바뀌면 확장자만 다른 예전 파일은 지운다. SVG 안의 id는 내용으로 정해지는 이름으로 바꿔, 같은 모양이면 파일도 같게 한다.
  - 생성기(`packages/design-system/scripts/assets/`, `generate:assets`)는 SVG를 `Asset` 컴포넌트가 이름으로 그릴 데이터(`src/assets/asset-data.ts`)로 풀고, 래스터 원본을 WebP로 줄이며 가로·세로를 `image-data.ts`에 적는다. 피그마는 WebP로 내보내지 못하기 때문이다.
  - 아이콘은 글자 색 클래스로 칠하므로 `<svg>`로 직접 그린다. SVG를 `<img>`로 넣으면 `currentColor`가 글자 색을 따르지 않기 때문이다. 번들러 플러그인(SVGR)은 쓰지 않는다.
  - 아이콘 패키지(`@fluentui/react-icons`)를 따로 쓰지 않는다. 피그마가 아이콘을 줄여 쓰거나 경로를 바꾸면 패키지 아이콘과 달라진다.
  - 래스터 자산의 파일은 원본 그대로 두고, 놓인 자리에서 자르거나 맞추는 것은 CSS가 한다. 생성기는 피그마 이미지 칠의 맞춤 방식을 `object-fit`으로 낸다(`FILL`은 `cover`, `FIT`은 `contain`). 원본과 다른 비율로 놓는 것을 막지 않는다. `CROP`과 `TILE`은 내보내기를 막는다([[디자인 시스템:구조 검사]]).
  - 래스터 자산은 생성기(`sharp`)가 WebP로 바꾼다. PNG 원본은 무손실, JPEG 원본은 손실(품질 80)로 바꾼다. `sharp`는 정확한 버전으로 고정해 Windows와 Linux에서 같은 바이트가 나오게 한다.
  - 생성기는 SVG를 속성 표가 아니라 규칙으로 옮긴다. 요소는 그대로 옮기고, 하이픈 속성 이름은 낙타 표기로 바꾼다(`stroke-dasharray` → `strokeDasharray`). `xlink:href` 같은 이름공간 속성만 예외 표로 둔다. 입력이 피그마가 내보낸 정적 SVG이므로 모르는 태그를 막지 않는다.
  - `<mask>`의 `style="mask-type:alpha"` 또는 `luminance` 단일 선언은 SVG presentation attribute(`maskType`)로 옮긴다. 그 밖의 문자열 `style`은 React 속성으로 넘길 수 없어 생성이 실패한다.
  - 여러 색 자산의 SVG는 그라데이션(`linearGradient`, `radialGradient`)을 그대로 옮긴다. SVG 안의 ID에는 요소마다 다른 접두어를 붙이고, `id`·`url(#…)`·`href="#…"`에 모두 붙인다. 한 화면에 같은 자산이 둘 있어도 ID가 겹치지 않게 하기 위해서다.
  - 경로 트림이 걸린 벡터는 플러그인이 벡터 경로와 트림 기본값으로 요소를 직접 만든다([[디자인 시스템:모션]]). 트림 벡터와 SVG 요소의 짝을 확실히 정할 수 없으면(트림 벡터나 선 요소가 하나가 아님, 벡터가 아님, 경로가 여럿) 이유와 함께 내보내기를 막는다.
  - 패키지는 `getImageAsset(name)`으로 이미지 주소·너비·높이를 내보낸다. `ImageAsset`은 원본 너비·높이를 달아 클래스가 없으면 원본 비율을 지킨다. 앱의 큰 이미지(바탕화면 배경)는 `next/image`로 그린다.
  - 생성은 PR의 CI가 하고 그 PR에 커밋한다([[디자인 시스템:CI]]). 자산은 픽셀로 비교하지 않고, 컴포넌트 안에서 어느 자산인지와 크기, 색만 견준다([[디자인 시스템:생성 결과 검증]]).
토큰 검사: |
  `tokens.json`이 원본이고 `tokens.css`와 `token-names.ts`는 거기서 만든 생성 파일이다([[디자인 시스템:토큰 생성]]).

  - 플러그인은 `tokens.json`만 올리고 `tokens.css`는 만들지 않는다.
  - 생성 파일은 PR의 CI가 만들어 그 PR에 커밋한다([[디자인 시스템:CI]]). 생성 파일을 다시 만들어 저장소의 파일과 견주는 검사는 두지 않는다.
  - 플러그인이 변수와 스타일을 통째로 내보내므로 피그마에서 지운 토큰은 생성 파일에서도 사라진다. 사라진 토큰의 클래스를 쓰는 코드는 lint가 잡는다([[디자인 시스템:토큰 사용 강제]], [[디자인 시스템:PR 흐름]]).
생성 결과 검증: |
  생성한 컴포넌트가 피그마와 같은지는 피그마가 계산한 값과 브라우저가 계산한 값을 레이어마다 견줘 확인한다. 픽셀로는 비교하지 않는다([[디자인 시스템:검토한 대안]]).

  검증 자료(`<이름>.layout.json`):
  - 변형마다 보이는 레이어별로 피그마가 돌려준 값을 적는다. 자리와 크기(x, y, 폭, 높이), 배경색, 글자색, 선 색과 두께, 모서리, 불투명도, 그림자, 그라데이션의 색 단계, 글자 크기·줄 높이·굵기, 이미지의 맞춤 방식이다.
  - 플러그인은 단위만 바꾼다(자리는 변형의 왼쪽 위 기준으로, 색은 네 채널을 0~255로, 이미지의 맞춤 방식은 CSS 이름으로). 값을 계산하거나 추론하지 않는다. 피그마가 최종 값을 주지 않는 항목은 넣지 않는다. 그라데이션의 방향이 그렇다.
  - 숨긴 레이어는 넣지 않는다.

  견주는 법:
  - 생성기는 변형마다 스토리를 만든다([[디자인 시스템:스토리 규칙]]). 레이어와 요소는 생성기가 레이어의 자리로 지은 클래스로 짝짓는다. 생성기가 컴포넌트마다 레이어와 선택자의 짝 표를 생성 파일로 내고, 테스트만 이 표를 읽는다. 요소에 검사용 속성을 붙이지 않는다.
  - 스토리 테스트가 변형마다 스토리를 그려 레이어별로 브라우저가 계산한 값(`getBoundingClientRect`, `getComputedStyle`)을 검증 자료와 견준다. 하나라도 다르면 실패하고, 어느 레이어의 어느 값이 다른지 낸다.
  - 내용에 맞춰지는 글자는 폭을 검증 자료의 값으로 고정하고 견준다. 피그마의 글자 폭은 브라우저 폭을 올림한 값이라([[한계:HUG 글자 폭 올림]]) 그대로 두면 글자와 그 옆 레이어가 1픽셀 미만씩 어긋난다. 고정한 뒤에는 자리와 크기에 허용 오차를 두지 않는다(반올림 차이 0.02픽셀까지만).
  - 상태 변형(hover, pressed, 포커스)은 테스트가 브라우저에 그 상태로 그리라고 지시해 켠다(CDP의 `CSS.forcePseudoState`). 변형마다 요소를 새로 그린다.
  - 움직임도 같은 테스트에서 견준다. 검증 자료에 `Motion` 변형마다 레이어별, 속성별로 키프레임(시간, 값, 이징 곡선의 숫자)과 반복 여부를 피그마가 돌려준 그대로 적는다. 플러그인은 단위만 바꾼다(초를 밀리초로, 회전의 부호, 선 그리기의 비율). 테스트는 `data-motion`을 켜고 `getAnimations()`로 키프레임 값, 시간, 이징, 반복 횟수를 읽어 견준다([[디자인 시스템:모션]]).
  - 글자의 획 모양과 자산 안쪽 그림은 견주지 않는다. 서체 파일과 자산 파일이 정한다. 자산은 어느 자산인지와 크기, 색만 견준다.

  이 테스트는 모든 PR에서 도는 `pnpm test`의 스토리 테스트에 둔다([[테스트 작성 규칙:스토리 테스트]]). 코드만 바꾼 PR의 모습 회귀도 여기서 걸린다.
  조립은 이 검증의 대상이 아니다([[디자인 시스템:조립]]).
스토리 규칙: |
  디자인 시스템 컴포넌트의 스토리는 생성하고, 앱 조립의 스토리는 사람이 쓴다.

  컴포넌트:
  - 생성기는 컴포넌트마다 변형 하나에 스토리 하나를 만든다. 생성 파일이라 손으로 고치지 않는다. 모든 컴포넌트가 이 스토리를 갖는다.
  - 스토리의 입력은 그 변형의 피그마 값이다. 입력 이름과 값은 [[디자인 시스템:컴포넌트 입력]]을 따른다.
  - 슬롯에는 피그마 슬롯 기본 내용과 같은 컴포넌트를 넣는다([[디자인 시스템:컴포넌트 조립 규칙]]). 스토리에 맨숫자 상자를 넣지 않는다.
  - [[디자인 시스템:생성 결과 검증]]은 생성기가 낸 짝 표로 레이어와 요소를 짝짓는다.
  - `Hover`·`Pressed`·`Focused`는 컴포넌트에 강제로 상태를 주는 입력을 만들지 않고, 테스트가 브라우저에 그 상태를 켠다([[디자인 시스템:생성 결과 검증]]).
  - 생성한 스토리에는 `play`를 넣지 않는다. 동작은 동작 스토리로 본다([[테스트 작성 규칙:스토리 테스트]]).

  조립:
  - 조립은 앱 Storybook의 스토리로 짝짓는다. 스토리 제목은 `Patterns/` 뒤에 피그마 조립 이름을 그대로 쓴다(`Menu/Folder` → `Patterns/Menu/Folder`). 구조가 같은 조립 여럿은 코드 컴포넌트 하나에 스토리를 여럿 둔다([[디자인 시스템:조립]]).
  - 조립 스토리가 조립을 감쌀 때 쓰는 폭은 스토리가 직접 갖는다.
PR 흐름: |
  피그마 작업을 마치면 플러그인으로 내보내고([[디자인 시스템:피그마 플러그인]]), PR의 CI가 생성하고 검증하며([[디자인 시스템:CI]]), 사람이 시점을 골라 스킬로 PR을 처리하고([[디자인 시스템:스킬]]), 사람이 코드와 검증 결과를 보고 병합한다.

  | 경우 | 생기는 PR | 병합 순서 |
  |---|---|---|
  | 컴포넌트만 바뀜 | 컴포넌트 PR 하나 | 상관없음 |
  | 토큰만 바뀜 | 토큰 PR 하나 | 상관없음 |
  | 새 토큰을 쓰는 컴포넌트 | 토큰 PR + 컴포넌트 PR | 토큰 먼저 |
  | 토큰 이름 변경·삭제 | 토큰 PR 하나. 옛 이름을 쓰는 코드도 같은 PR에서 고친다 | 상관없음 |
  | 자산이 바뀜 | 자산 PR 하나. 이름이 바뀌거나 지워진 자산을 쓰는 코드도 같은 PR에서 고친다 | 상관없음 |
  | 새 자산을 쓰는 컴포넌트 | 자산 PR + 컴포넌트 PR | 자산 먼저 |

  - 피그마에서 지운 토큰은 토큰 PR에서 사라진다([[디자인 시스템:토큰 검사]]). 사라진 토큰의 클래스를 쓰는 코드는 lint가 알려 주고, 같은 PR에서 코드를 고친다.
  - 컴포넌트 PR이 아직 없는 토큰을 쓰면 lint가 모르는 클래스로 실패한다. 토큰 PR을 병합한 뒤 컴포넌트 PR에 `main`을 받아 온다.
  - 피그마 쪽 변경은 항상 PR로만 들어오므로 정기적인 전체 비교는 두지 않는다.

  changeset:
  - 플러그인이 PR을 열 때 changeset을 함께 올린다. changeset이 없으면 CI의 뒤 작업이 시작하지 않아 생성이 돌지 못하기 때문이다([[Git 작업 규칙:CI]]).
  - 대상은 `@seojaewan/design-system`, 종류는 `patch`이고, 설명은 무엇을 다시 내보냈는지 한 줄이다.
  - 스킬이 앱을 고치거나 쓰는 방법이 바뀌면 스킬이 그 changeset에 앱을 더하거나 종류를 올린다.
  - `feat/figma-*` 브랜치를 changeset 검사에서 빼지 않는다([[Git 작업 규칙:Changesets]]).
스킬: |
  플러그인 PR을 처리하는 일은 자동으로 돌리지 않고, 사람이 시점을 골라 AI에게 스킬로 맡긴다. 같은 절차와 같은 제한을 매번 지키게 하기 위해서다.

  스킬은 플러그인이 여는 브랜치와 하나씩 짝짓는다([[디자인 시스템:피그마 플러그인]]).

  | 스킬 | 브랜치 | 하는 일 |
  |---|---|---|
  | `figma-token-pr` | `feat/figma-tokens` | 바뀐 토큰 정리, 이름이 바뀌거나 지워진 토큰을 쓰는 코드 고치기 |
  | `figma-asset-pr` | `feat/figma-assets` | 이름이 바뀌거나 지워진 자산을 쓰는 코드 고치기 |
  | `figma-component-pr` | `feat/figma-<컴포넌트>` | CI가 생성한 스킨·스토리와 검증 결과 확인, 옛 컴포넌트와 옛 내보내기 자료 지우기, 앱과 이 컴포넌트를 품은 옛 컴포넌트가 새 컴포넌트를 쓰도록 고치기, changeset 맞추기 |

  구현 자료의 순서: 내보낸 스키마와 CI의 검증 결과 → `.codocs`(동작·코드·접근성) → 그래도 모르는 것만 피그마 MCP. 스키마와 MCP가 다르면 스키마를 따르고, 차이와 MCP로 메운 것을 보고한다.

  - 스킬은 `.claude/skills/<이름>/SKILL.md`에 둔다. 절차만 담고 규칙은 `@codocs \[[문서:섹션]]` 링크로 가리킨다([[codocs 연결 규칙]]). 실행할 때 링크된 섹션을 codocs로 읽는다.
  - 다음은 하지 않는다: 피그마에서 온 자료 고치기, 생성 파일 손으로 고치기, 병합.
  - 스킬이 로컬에서 돌리는 확인은 두지 않는다. 피그마에서 온 것의 확인은 CI에서만 돈다([[디자인 시스템:CI]]).
  - 다음이 필요하면 멈추고 보고한다: 맞는 동작의 종류가 없음, 생성 스크립트 고치기, `.codocs` 고치기, PR에 예상 밖 파일이 있음.
  - 끝나면 사람이 모습을 봐야 할 곳을 보고한다.
  - 코드만 바꾸는 PR은 일반 개발 작업이라 스킬을 두지 않는다.
CI: |
  피그마 PR의 생성은 PR의 CI가 한다. CI는 피그마에서 온 자료(`tokens.json`, 자산 원본, 스키마)로 생성 파일을 만들어 그 PR에 커밋한다.
  피그마에서 온 것의 확인은 CI의 `pnpm test`에서만 돈다. 생성 결과 검증([[디자인 시스템:생성 결과 검증]])이 여기서 돈다.
  일반 CI(포맷·lint·타입·테스트·빌드·Storybook 빌드·E2E)는 [[Git 작업 규칙:CI]]에 있다.
모션: |
  피그마의 키프레임을 스킨의 CSS 움직임으로 생성하는 규칙이다. 움직임을 찾는 곳은 [[디자인 시스템:모션 견본]], 트는 표시와 CSS의 꼴은 [[디자인 시스템:모션 클래스]]에 있다.

  - 움직임의 길이, 이징, 늦춤, 배율은 토큰으로 두지 않는다. 키프레임과 변형 사이 전환에 걸린 값이 유일한 기준이고, 생성기는 키프레임에 적힌 숫자를 `@keyframes`와 `animation`에 그대로 낸다. 시간·이징 기준 표는 두지 않는다.
  - 옮기는 속성은 아래 표의 투명도, 배율, 이동, 회전, 선 그리기 시작·끝이다. 다른 속성에 키프레임이 걸려 있으면 내보내기를 막는다([[디자인 시스템:구조 검사]]).
  - 키프레임 이징은 이전 키프레임에서 그 키프레임까지의 곡선이라, 첫 키프레임의 이징은 쓰지 않는다.

  | 피그마 항목 | CSS | 옮기는 방법 |
  |---|---|---|
  | `OPACITY` | `opacity` | 그대로 |
  | `SCALE_XY`, `SCALE_X`, `SCALE_Y` | `scale` | x·y 성분 |
  | `TRANSLATION_XY`, `TRANSLATION_X`, `TRANSLATION_Y` | `translate` | px. %는 요소 크기로 바꾼다 |
  | `ROTATION` | `rotate` | 부호를 뒤집는다. 피그마는 반시계 방향이 +다([[디자인 시스템:회전 구현]]) |
  | `PATH_TRIM_START` | `stroke-dashoffset` | 선 길이를 1로 본 비율 |
  | `PATH_TRIM_END` | `stroke-dasharray`, `stroke-dashoffset` | 선 길이를 1로 본 비율 |

  경로 트림이 걸린 자산은 `pathLength="1"`과 `stroke-dasharray`로 내보낸다. 트림 값이 CSS로 1:1로 옮겨지고 경로 길이가 원 크기에 묶이지 않는다. 피그마는 실행 환경에 따라 트림을 경로에 구워 내보내기도 해서, 플러그인이 피그마에 저장된 값으로 이 꼴을 직접 만든다([[디자인 시스템:자산]]).
  - 경로는 벡터의 `vectorPaths`(트림 전 전체 경로)를 자산 컴포넌트 좌표로 옮긴 것이고, 숫자는 피그마 SVG와 같은 유효 6자리다.
  - 보이는 범위는 트림 키프레임 기본값(`baseValue`)이다. `stroke-dasharray="<끝-시작> 1"`, 시작이 0이 아니면 `stroke-dashoffset="-<시작>"`이다.
  - 선 속성(색, 두께, 끝 모양, 이음)은 피그마가 내보낸 그 요소의 것을 그대로 쓴다.

  확인:
  - 움직임은 컴포넌트의 검증이 함께 본다([[디자인 시스템:생성 결과 검증]]).
  - 사람은 실제 움직임의 느낌을 본다.
검토한 대안: |
  코드 구현과 도구에서 고르지 않은 방법과 이유다.

  - 레이어별 자동 판정(코드 요소에 `data-figma`로 짝을 지어 이긴 CSS 선언을 판정): 규칙과 분류표가 컴포넌트마다 늘고 코드가 검사기에 맞춘 모양이 되어 뺐다.
  - 픽셀 비교(피그마 PNG ↔ Storybook 스크린샷): 피그마와 브라우저는 그리는 엔진이 달라 같아 보이는 것도 픽셀로는 다르게 나온다. 엄격하면 정상이 모두 실패하고 느슨하면 1px 실수를 놓친다.
  - 인지 비교(SSIM 등): 정상과 실수의 간격이 글자 가장자리 번짐 정도라 환경이 바뀌면 뒤집힌다.
  - 피그마 SVG·Figma Sites HTML·Dev Mode 코드를 기준으로 쓰기: 변환에서 디자인 일부를 잃는다.
  - 이미지 자산을 원본과 다른 비율로 놓으면 내보내기를 막기: 피그마의 맞춤 방식을 `object-fit`으로 옮기면 같은 모습이 된다([[디자인 시스템:자산]]).
  - 내용 맞춤 축의 크기를 정하는 자식이 없으면 내보내기를 막기: 브라우저가 어떻게 그릴지를 플러그인이 미리 짐작하게 된다. 크기가 다르면 생성 결과 검증이 잡는다([[디자인 시스템:생성 결과 검증]]).
  - 조립과 화면까지 생성하기: 좌표와 직접 값을 그대로 옮기면 절대 위치와 임의 값이 늘어 코드가 딱딱해지고, 있는 컴포넌트를 재사용하지 않는다. 생성은 컴포넌트까지다.
  - 플러그인이 코드를 만들기: 코드로 바꾸는 규칙이 플러그인과 저장소 두 곳에 생긴다.
  - Code Connect로 피그마와 코드 컴포넌트를 잇기: 연결만 하고 구현을 대신하지 않는다. 코드 컴포넌트의 이름과 입력은 피그마에서 생성돼 늘 같아 이을 것이 없다.
  - Style Dictionary로 `tokens.css` 만들기: 변환 대부분이 이 프로젝트의 규칙이라 도구가 맡는 부분이 작다.
  - `tokens.css`를 손으로 쓰기: 다시 만들어 비교하는 것만으로 같음을 보장할 수 없다.
  - Figma REST API로 CI가 매번 자료를 받기: CI에 피그마 토큰이 필요하고, Variables는 Enterprise 플랜이 아니면 읽을 수 없다.
  - 토큰을 피그마 MCP로만 읽기: 토큰 변경이 PR에 남지 않는다.
  - 모션 값(시간, 이징, 배율)을 토큰으로 두기: 피그마 키프레임의 시간에는 변수를 연결할 수 없어 같은 값이 변수와 키프레임 두 곳에 생긴다.
  - 코드 기준 회귀 테스트(Chromatic 등)를 컴포넌트에 쓰기: 기준이 이전 코드라 처음 만든 컴포넌트가 피그마와 달라도 잡지 못한다.
  - 조립을 피그마와 자동으로 견주거나 조립 구조를 코드 구조와 1:1로 내보내기: 디자인을 코드 구조에 맞춰 그리게 된다.
  - 컴포넌트마다 `tokens.json`을 나누기: 한 컴포넌트만 다시 내보내면 이름 하나에 값이 둘이 된다.
  - 모든 글자의 기준선을 하나의 CSS 보정으로 맞추기: 피그마는 줄에 든 서체로, Chromium은 첫 서체로 기준선을 정해 한 값으로 두 경우를 맞출 수 없다([[한계:글자 기준선]]).
  - CSS `border`나 배경 두 겹으로 그라데이션 테두리 그리기: `border`는 둥근 모서리를 지키는 그라데이션을 칠할 수 없고, 배경 두 겹은 컴포넌트 배경색과 섞인다.
  - CSS `border`로 피그마 안쪽 선 그리기: 레이아웃 크기를 바꾸고 자식 아래에 그려진다.
  - 창 너비·높이를 직접 움직이기(FLIP 대신): 배치를 매번 다시 계산해 덜 부드럽고, 피그마 키프레임에 너비·높이 항목이 없다.
  - 열리는 도중 닫을 때 키프레임을 이어 재생하기: 열기와 닫기는 서로 다른 `Motion` 값의 키프레임이라 이어지지 않는다.
  - 코드에서 루미너시티 재질 혼합: 의사 요소 층과 쌓임 맥락 제약(`isolate`, `z-index` 금지)이 생긴다.
  - 창 축소 화면을 그림 자산으로 그리기: 실제 창 내용과 달라지고 창 디자인이 바뀔 때마다 다시 만들어야 한다.
