_codocs:
  id: design-system
  name: 디자인 시스템
  parent:
    - seojaewan 블로그
개요: |
  블로그 화면을 이루는 토큰, 컴포넌트, 조립과 그것의 피그마·코드 구현을 안내하는 목차다.
  피그마는 모양, 코드는 구조를 맡는다([[디자인 시스템:피그마 파일]]). `packages/design-system`의 컴포넌트는 피그마 컴포넌트와 대응하고(코드 전용 컴포넌트는 예외, [[컴포넌트 목록:코드 전용 컴포넌트]]), 앱의 조립은 피그마 조립 그림을 기준으로 코드가 구조를 정한다([[디자인 시스템:조립]]). 디자인 결정과 구현 절차를 확인할 문서는 아래 목록에서 찾는다.
출발점: |
  Microsoft가 피그마 커뮤니티에 공개한 공식 Windows UI kit(CC BY 4.0)을 기준으로 한다.
  재현 정확도가 [[제품 정의:목적]]의 포트폴리오 목적에 중요하고, 값을 추측하지 않고 공식 값에서 가져올 수 있기 때문이다.

  커뮤니티 파일은 피그마 MCP가 직접 읽을 수 없어 "서재완" 팀에 사본을 두고 비교에 쓴다: [Windows UI kit (Community) 사본](https://www.figma.com/design/JmgCvyrvh9p9xMWKe4ZAAI).
  이 UI kit은 앱 컨트롤과 그림자·재질·표면 스타일을 담고 있고, 작업 표시줄·Start·탐색기 같은 바탕화면 셸은 없다. 셸 요소는 Windows 11 화면을 기준으로 만든다.

  이전 구현(`legacy/window-blog-v1` 태그)은 블로그에 맞춰 바꾼 부분을 참고하는 데만 쓴다. 이전에 추측한 값의 오차가 따라오지 않게 하기 위해서다.
범위: |
  디자인 시스템에는 기본 컨트롤과 Windows 화면 요소의 컴포넌트를 담는다. 목록과 용도는 피그마 컴포넌트 페이지에서 확인한다([[디자인 시스템:피그마 파일]]).

  Windows 화면 요소(창 프레임, Taskbar, 셸 표면 등)가 블로그 겉모습의 대부분이어서 이것까지 담는다. 공식 UI Kit에도 이 요소들이 컴포넌트로 있어 피그마와 1:1로 대응된다.

  디자인 시스템은 "창이 어떻게 생겼는가"만 알고 "어떤 창이 열려 있는가"는 모른다. 데이터를 가져오지 않고 앱 코드에 기대지 않는다. 내용을 채운 조립과 동작·상태(창 순서, 드래그, 열린 앱 목록)는 앱(`apps/web`)의 `shell/`·`features/`·`shared/`에 둔다([[디자인 시스템:조립]], [[저장소 구성:의존 방향]]).
피그마 파일: |
  파일: [seojaewan 블로그 · Windows 11 디자인 시스템](https://www.figma.com/design/XV9Y1UT5UH4tC5hSqLVipZ) (팀: 서재완)

  페이지 구성:

  | 페이지 | 담는 것 |
  |---|---|
  | `01 · Foundations` | 변수·스타일과 자산. 섹션(Color, Typography, Spacing, Size, Radius & Stroke, Elevation, Materials, Assets, Motion)마다 여러 값에 걸친 짧은 설명 글을 둔다. Motion에는 시간·이징·배율 변수와 동작 줄이기 기준만 둔다([[디자인 기반:모션 견본]]) |
  | `02 · Components` | 컴포넌트 세트만(아래 목록) |
  | `03 · Patterns` | 조립과 그 프로토타입([[디자인 시스템:조립]]) |
  | `04 · Screens` | 화면([[디자인 시스템:Screens]]) |

  - 플러그인은 이름에 든 `Foundations`·`Components`와 노드 ID로 페이지를 찾아 번호가 바뀌어도 된다.
  - 개발자만 보는 페이지는 따로 두지 않는다. 디자이너와 개발자가 같은 페이지를 본다.

  모양과 구조: 피그마는 모양(토큰, 컴포넌트의 모양·변형·상태, 움직임)을 맡고, 코드는 구조(조합, 감싸기, 슬롯, 배치, 실행 중 크기와 동작)를 맡는다. 피그마 구조를 코드 구조와 1:1로 맞추지 않는다. 목차를 스크롤 영역으로 감쌀 수 없는 문제(중첩 슬롯 한계)나 Start 본문 덧칠을 둘 곳이 없는 문제(조립 배치 프레임 칠 금지)가 모두 피그마 구조를 코드 구조와 1:1로 맞추려는 데서 생겼기 때문이다. 이 원칙에 따른 규칙은 [[디자인 시스템:컴포넌트 조립 규칙]](슬롯), [[디자인 시스템:조립]](그림 기준), [[컴포넌트 목록:코드 전용 컴포넌트]], [[피그마 연동:구조 검사]](검사와 보고)에 있다.

  기준의 경계: 피그마는 디자인이 어떻게 생겼는지(값과 그 뜻·쓰임)를 가지고, `.codocs`는 피그마 작성 규칙, 결정과 검토한 대안, 기능 동작, 접근성, 피그마에서 코드로 가는 절차를 가진다. 피그마로 나타낼 수 있는 것은 피그마로 옮기고 문서에서 지운 뒤 그 변수·스타일의 description이나 Foundations 해당 섹션, 해당 노드를 가리킨다. 문서에 숫자를 두는 것은 입력·스크롤 판정 문턱(끌기 4px, 스냅 8·64px, 크기 조절 띠, 목차 현재 위치 32px 등)과 실행 중 값(창 기본·최소 크기 등)뿐이다.

  적는 자리:
  - 값 하나의 뜻과 쓰임은 그 변수·스타일의 description에 쓴다. 디자이너가 값을 고를 때 바로 보이게 하기 위해서다.
  - 여러 값에 걸친 설명(여러 곳에 쓰는 간격, 효과 스타일 묶음, 재질을 쓰는 곳, 자산 묶음 등)은 01 · Foundations 해당 섹션의 짧은 글로 쓴다.
  - 컴포넌트·조립의 description에는 디자이너가 읽는 한두 줄 설명(무엇에, 어디에 쓰는지)만 둔다.
  - 피그마가 속성으로 가지지 못한 규칙 글은 레이어의 Dev Mode 주석에 카테고리를 붙여 단다. 실행 중에 정해지는 값과 프로토타입으로 그릴 수 없는 실제 트리거는 Development, 동작 줄이기에서 남기는 움직임은 Accessibility다([[피그마 연동:구조 검사]]). 섹션에는 주석을 달 수 없어 섹션 안 노드에 단다.
  - 피그마가 가진 기능(재생 설정 Loop, 프로토타입 상호작용, 글자 말줄임, 프레임 스크롤, 변수 연결)으로 나타낼 수 있는 것은 그 기능으로 나타내고 글로 다시 적지 않는다.
  - 구조, 구현 방식, 바뀐 이력은 쓰지 않는다. 구조는 피그마가, 코드는 저장소가 보여 주고, 규칙과 기준은 이 `.codocs` 문서가 가진다. 두 곳에 같은 내용을 두면 한쪽만 고쳐져 어긋나기 때문이다. 캔버스의 섹션 설명 글자도 같다.

  - 모든 페이지의 묶음은 피그마 섹션(SECTION) 노드로 만든다. 화면을 축소해도 묶음 이름이 보이게 하기 위해서다.
  - 컴포넌트는 `02 · Components` 한 페이지(컴포넌트 페이지)에 둔다.
    - 페이지 바로 아래에 묶음 섹션을 두고, 그 안에 컴포넌트 섹션(`Button (버튼)`처럼 영문 (한글))을 둔다. 플러그인이 컴포넌트를 읽는 방법은 [[피그마 연동:피그마 플러그인]]에 있다.
    - 묶음 섹션은 `Controls (기본 컨트롤)`, `Shell (화면 영역)`, `Blog (블로그)`로 나눈다. 기본 컨트롤은 디자이너가 시안을 그릴 때 직접 꺼내 놓고 상태를 바꿔 쓰는 컴포넌트다(한 영역 안에서 되풀이해 놓는 것도 재사용으로 본다). 화면 영역은 화면의 정해진 한 자리(작업 표시줄, 탐색 창, 명령 모음 등)를 차지하는 판·줄·패널이고, 조립이 놓는 큰 판이라 바탕·테두리를 가진다. 블로그는 글 화면의 블록이다.
    - 컴포넌트 섹션 안에는 컴포넌트 세트만 둔다. 속성 표, 축 이름표, 머리(`.page_header`)는 두지 않고 피그마 섹션 이름을 제목으로 쓴다. 속성은 피그마 오른쪽 패널의 컴포넌트 속성이 보여 주기 때문이다.
    - 코드 구조 때문에 생긴 감싸기·배치용 컴포넌트는 피그마에 두지 않고 코드에만 둔다([[컴포넌트 목록:코드 전용 컴포넌트]]). 모양이 있는 것(Scrollbar, SelectionMarquee 등)은 다른 컴포넌트 안에서만 써도 컴포넌트 페이지에 둔다. 모양이 있고 여러 곳에서 쓰는 화면 영역(Taskbar, ShellSurface, NavigationPane, BrowserToolbar 등)도 남긴다.
    - 이름이 점으로 시작하는 컴포넌트는 라이브러리 게시에서 숨고, 플러그인도 내보내지 않는다.

  공식 UI Kit을 라이브러리로 연결해 그대로 쓰지 않고, UI Kit에서 값과 구조를 가져와 이 파일의 Variables와 컴포넌트로 다시 만든다.
  Variables 이름 체계와 플러그인 내보내기 대상을 우리가 통제하고, UI Kit이 업데이트돼도 우리 컴포넌트가 바뀌지 않게 하기 위해서다.
문서: |
  - 값과 모양: 피그마 `01 · Foundations`의 변수·스타일 description과 섹션 설명 글([[디자인 시스템:피그마 파일]])
  - 모양에 대한 결정과 피그마 작성 규칙(토큰 이름, 레이아웃, 크기 변수, 재질, 움직임의 자리 등): [[디자인 기반]]
  - 상태 변형의 이름과 뜻: [[컴포넌트 목록]]
  - 디자인을 코드로 구현·생성하고 내보내기·검증으로 맞추는 방법: [[피그마 연동]]
컴포넌트 조립 규칙: |
  컴포넌트는 틀이다. 어느 화면에서든 같은 모양과 구성이면 컴포넌트이고, 쓰는 곳마다 달라지는 것(메뉴 항목, 목록 항목, 경로, 탭, 글 내용, 동작 목록)은 슬롯이나 속성으로 연다. 기본 컴포넌트를 고치면 그것을 쓰는 모든 곳이 자동으로 바뀌게 만든다.

  - 변형은 컴포넌트가 스스로 가진, 끝이 정해진 축(상태, 크기, 종류, 기기, 재질)에만 둔다. 내용마다 변형을 만들면 변형이 내용 수만큼 늘기 때문이다.
  - 앱이 쓰지 않는 변형은 두지 않는다. 선택지가 하나만 남는 변형 속성은 속성째 없앤다. Hover·Pressed 같은 CSS 상태로 나타나는 변형과 화면 크기로 고르는 Device 변형은 앱이 쓰는 것으로 본다.
  - 슬롯은 디자이너가 내용을 바꿔 끼우는 자리에만 둔다. 스크롤 영역, 격자 배치, 위치 잡기, 바탕 깔기 같은 감싸는 동작은 피그마에서 컴포넌트로 감싸지 않고 코드가 맡는다([[디자인 시스템:피그마 파일]]). 예: Toc는 `Items` 슬롯만 두고, 넘치면 세로로 스크롤한다는 것은 Development 주석에 적는다. 코드의 Toc가 ScrollArea로 감싼다. 넘친 모습 같은 것은 조립에 그림으로 겹쳐 그린다.
  - 무엇이 몇 개 들어갈지 모르는 자리는 슬롯으로 연다. 자리가 정해진 부품의 값(문구, 아이콘, 표시 여부, 상태)은 컴포넌트 속성(텍스트, 불리언, 인스턴스 교체, 변형)으로 연다. 안쪽 부품의 속성은 중첩 인스턴스 속성 노출로 바깥에 보이게 한다.
  - 슬롯에는 실제 컴포넌트를 기본 내용으로 넣는다(피그마 슬롯 기본 내용). 비어 있는 HUG 슬롯은 피그마가 100×100으로 그려 컴포넌트 단독 캡처로 비교할 수 없기 때문이다. 기본 내용이 있으면 크기가 내용에 맞고, 이미 채운 인스턴스에는 영향이 없고, 쓰는 곳에서 지우거나 바꿀 수 있다(피그마에서 시험해 확인했다). 실제 내용을 채우는 것은 조립과 화면이다. 컴포넌트 페이지에는 컴포넌트 밖에 예시 인스턴스를 따로 두지 않는다. 실제 내용을 채운 모습은 03 · Patterns에서 본다.
  - 글자 속성의 기본값은 그 자리를 설명하는 일반 문구다(예: "제목", "메시지 내용", "항목 이름", "앱 이름"). 특정 화면의 문구를 쓰지 않는다.
  - 다른 바탕을 감싸는 컴포넌트는 안쪽 바탕 위에 쌓고, 안쪽 바탕의 슬롯을 자기 슬롯으로 따로 열지 않는다. 조립이 안쪽 바탕의 슬롯을 바로 채운다. 피그마는 중첩 인스턴스의 슬롯을 바깥 슬롯으로 다시 열 수 없기 때문이다([[한계:감싼 바탕의 슬롯 다시 열기]]). 예: Menu는 Flyout 위에 쌓고, 조립(`Menu/*`)이 Flyout의 `Content` 슬롯에 항목을 넣는다.
  - `Material` 변형은 재질 바탕을 직접 칠하는 컴포넌트(Flyout, WindowFrame 등)만 가진다. 감싸는 컴포넌트와 조립은 안쪽 바탕의 `Material`을 노출해 바꾼다. 같은 축을 감싸는 쪽마다 다시 만들면 변형이 겹으로 늘기 때문이다.
  - 큰 컴포넌트는 작은 컴포넌트의 인스턴스로 만든다. 예: WindowFrame의 창 버튼은 CaptionButton 인스턴스, MessageBox의 버튼은 Button 인스턴스다.
  - 큰 컴포넌트는 이름을 붙일 수 있는 영역 단위로 나눈다. 예: WindowFrame = WindowTitle + 창 버튼(CaptionButton) + Content 슬롯.
  - 같은 모양을 두 곳 이상에서 쓰면 컴포넌트로 만든다. 곳마다 따로 그리지 않는다.
  - 비슷해 보여도 쓰는 곳의 모양과 동작이 다르면 합치지 않는다. 예: Chrome 탭(BrowserTab)과 탐색기 탭(ExplorerTab)은 따로 둔다.
  - 컴포넌트 페이지의 컴포넌트는 03 · Patterns의 조립을 쓰지 않는다. 슬롯 기본 내용으로도 쓰지 않는다.
  - 컴포넌트 페이지의 배치 프레임(섹션 안 프레임 등)과 컴포넌트 세트는 내용 자르기(Clip content)를 끈다. 피그마는 노드를 그리고 내보낼 때 조상 프레임이 자르는 범위까지 잘라, 그림자나 노드 밖으로 나온 부분이 PNG에서 빠지기 때문이다. 켜져 있으면 구조 검사가 막는다([[피그마 연동:구조 검사]]).
  - 컴포넌트는 바깥 여백을 갖지 않는다. 바깥 배치는 쓰는 곳이 정한다. 코드의 `className`은 바깥 배치(여백, 위치, 크기, 정렬)에만 쓰고 생김새는 덮어쓰지 않는다. 값은 토큰 클래스만 쓴다.
  - 컴포넌트 루트 크기는 누가 크기를 정하는지에 따라 셋 중 하나로 둔다. 쓰는 곳마다 같은 덮어쓰기를 반복하지 않기 위해서다.
    - 내용을 감싸는 바탕 가운데 쓰는 곳마다 크기가 다른 것(Flyout 등)은 내용에 맞춘다(HUG). 너비는 담는 내용이나 그 바탕을 감싸는 컴포넌트가 정한다. 예: Flyout은 너비가 없고, Menu가 메뉴 너비를 가진다. 어디서 쓰든 크기가 같은 바탕(Tooltip `Variant=Balloon`의 너비 300)은 아래 Windows가 정한 크기처럼 고정한다.
    - 부모가 크기를 정하는 컴포넌트(목록 항목, 구분선, 주소창, 탐색기의 줄 등)는 피그마 원본에서 혼자 보이도록 준 폭·높이를 견본 크기로만 두고, 너비는 쓰는 곳이 정한다(부모 채움(FILL)이나 그 자리의 고정 너비). 견본 크기는 변수 없는 숫자로 두고 따로 표시하지 않는다. 변수에 연결한 크기는 고정 크기, 변수 없는 숫자는 견본 크기로 구분한다([[디자인 기반:크기 변수]]). 코드는 너비를 갖지 않고, 쓰는 곳이 `className`으로 너비를 주거나 부모를 채우게 한다.
    - Windows가 정한 크기(창 버튼, 작업 표시줄 버튼, 탭, 고정 앱 타일 등)는 고정 크기와 크기 변수로 둔다([[디자인 기반:크기 변수]]).
  - 상태 때문에 안 보이는 것을 그려 놓고 숨기지 않는다. 상태에 따라 있고 없는 것은 그 상태의 변형에만 그리고, 쓰는 곳이 켜고 끄는 것은 불리언 속성으로 연다. 어디서도 쓰지 않는 레이어는 지운다. 칠 없이 자리만 차지해야 하는 것은 칠 없는 빈 프레임으로 둔다(예: NavigationItem `Expand=None`의 `chevron space`).
  - 재사용을 위해 컴포넌트를 바꿔야 하면 복사본을 만들지 않고 원본 컴포넌트를 고친다. 인스턴스를 떼어내어(detach) 직접 고치지 않는다.
  - 인스턴스의 모양(칠, 글자색, 선, 효과, 불투명도)을 직접 덮어쓰지 않는다. 쓰는 곳에 따라 달라야 하면 그 컴포넌트에 변형이나 속성을 연다. 코드는 `className`으로 모양을 바꿀 수 없어서, 직접 덮어쓴 모습은 코드로 옮길 길이 없기 때문이다. 예: 비활성 창의 제목 색은 WindowTitle `State=Inactive`, Chrome 도구 모음의 아이콘 색은 IconButton `Variant=Chrome`이다. 속성 이름 짓는 규칙은 [[컴포넌트 목록:속성 이름]]에 있다.
  - 한 곳에서만 쓰고 안쪽 부품마다 다른 앱 기능에 이어지는 묶음은 컴포넌트로 만들지 않고 조립으로 만든다. 컴포넌트에는 재질 바탕과 자리만 남긴다. 예: Taskbar는 재질 바탕, 높이, 위쪽 선과 가운데·오른쪽 자리만 갖고, 시작 버튼·검색·앱 버튼·시계는 `Taskbar/Default` 조립이 채운다. 조립은 앱 코드라 부품마다 동작 prop을 바로 넘길 수 있다. 탐색기 본문도 같다. 주소 줄·명령 모음·탐색 창·상태 줄이 각각 다른 앱 기능에 이어지므로 `Explorer/Content` 조립이 이 컴포넌트들을 놓는다. 여러 곳에서 같은 방식으로 쓰는 컴포넌트(WindowFrame 등)는 컴포넌트로 두고, 고정 부품의 동작만 prop으로 연다.
  - 바깥 컴포넌트는 자리가 정해진 안쪽 부품의 동작과 값을 prop으로 받아 넘긴다. 기능이 늘 때마다 prop이 늘어나는 자리는 슬롯으로 열어 조립이 채운다. 바깥 컴포넌트가 쓰지 않는 prop을 여러 단계 나르기만 하게 되면, 그 묶음은 컴포넌트가 아니라 조립으로 만든다. prop 전달 자체보다 prop이 불어나거나 깊어지는 것이 경계를 잘못 그었다는 신호이기 때문이다.

  코드의 `packages/design-system`도 같은 방식으로 작은 컴포넌트를 조립해 큰 컴포넌트를 만든다. 피그마에 없는 감싸기·배치용 컴포넌트(ScrollArea 등)는 코드 구조로 더한다([[컴포넌트 목록:코드 전용 컴포넌트]]). 피그마 슬롯은 코드의 자리 prop(`children`이나 `ReactNode` prop)이다. 코드의 자리 prop에는 기본 내용을 두지 않고 쓰는 곳이 채운다. 피그마 슬롯 기본 내용과 같은 내용은 `Figma` 스토리가 슬롯에 넣는다([[피그마 연동:스토리 규칙]]). 피그마에서 노출한 중첩 인스턴스의 속성은 코드에서도 부모 prop을 그 중첩 컴포넌트로 넘기는 구조로 맞춘다. 피그마에서 슬롯 안 자식이 부모 채움(FILL)이면 슬롯을 여는 컴포넌트의 자리 요소가 그 자식을 채운다(세로 자리는 `[&>*]:min-h-size-none [&>*]:flex-flex-fill`, 고정 자리는 `[&>*]:size-full`). 쓰는 곳은 넣는 자식에 채움 클래스를 주지 않는다.
아이콘 자리: |
  컴포넌트 안에서 쓰는 곳마다 바꿔 끼우는 아이콘은 인스턴스 교체(INSTANCE_SWAP) 속성으로 연다.

  - 레이어 이름은 자리 이름이다(`icon`, `leading icon`, `chevron`, `location icon` 등). 아이콘을 바꿔 끼워도 바뀐 자산 이름으로 바꾸지 않는다.
  - 같은 컴포넌트를 여럿 담는 자리도 역할 이름을 쓴다(`minimize button`, `close button`).
  - 속성 이름은 코드 prop 이름이 된다(`Icon` → `icon`, `Close icon` → `closeIcon`).
  - 속성의 선호값(preferred values)에 그 자리에 쓸 수 있는 자산을 넣어 둔다.
  - 아이콘은 언제나 속성으로 바꿔 끼운다. 안쪽 아이콘 레이어의 원본 컴포넌트를 직접 바꾸면 크기 변수 연결이 빠진다([[한계:피그마 API 덮어쓰기 함정]]).
  - 코드의 기본값: 쓰는 곳마다 다른 아이콘(앱 아이콘, 파일·폴더 아이콘)은 필수 prop으로 두고, `Figma` 스토리가 피그마 기본 인스턴스를 넣는다. 어디서나 같은 기능 아이콘(닫기, 꺾쇠, 돋보기)은 피그마 기본 인스턴스를 코드 기본값으로 둔다. 빠뜨린 아이콘이 기본값으로 조용히 그려지는 실수를 타입 검사로 잡기 위해서다.
  - 코드의 아이콘 자리는 자리 크기 변수(`size-size-icon-*`, `size-size-avatar-profile`)를 가진 상자이고, 바로 아래 자식을 `[&>*]:size-full [&>*]:object-contain`으로 채운다. `img`·`ImageAsset`·`Asset`이 모두 같다. 쓰는 곳은 아이콘에 크기 클래스를 주지 않고 색 클래스만 준다.
팝업: |
  트리거(버튼, 메뉴 항목, 입력창)와 그 옆에 뜨는 팝업(메뉴, 툴팁, 플라이아웃)의 규칙이다.

  - 트리거와 팝업 사이 간격은 `spacing/xs` 하나로 통일한다(툴팁 포함).
  - 작업 표시줄에서 여는 메뉴·창 미리보기는 작업 표시줄 위 끝에서 `spacing/md` 띄운다([[작업 표시줄:우클릭 메뉴]], [[작업 표시줄:창 미리보기]]).
  - 특정 트리거와 특정 팝업 내용을 묶은 것은 조립이다. 예: `Start/PowerButton`(전원 IconButton + `Menu/Power`), DropDownButton + 보기 메뉴, 작업 표시줄 앱 버튼 + 우클릭 메뉴, AddressBar + 추천 목록, 작업 표시줄 앱 버튼 + TaskbarPreviewList.
  - 트리거 컴포넌트는 `Open` 변형 없이 `Rest` 모양 그대로 둔다. 마우스를 올려 여는 창 미리보기만 트리거가 `Hover`다([[컴포넌트 목록:상태]]).

  피그마:
  - 트리거와 팝업을 묶는 틀(`Popover`)은 피그마에 두지 않는다. 팝업 위치를 잡는 것은 코드가 맡는 구조다([[컴포넌트 목록:코드 전용 컴포넌트]]).
  - 조립에는 열린 팝업도 그릴 수 있다([[디자인 시스템:조립]]). 열린 메뉴는 그 메뉴 조립의 인스턴스로 놓는다.
  - 팝업이 열리는 흐름은 트리거에 프로토타입 오버레이(누르면, 올리면 → Open overlay)로 해당 `Menu/...` 조립을 띄워 나타낸다. 하위 메뉴도 그 항목에 오버레이로 하위 메뉴 조립을 띄운다. 하위 메뉴 내용 자체는 `Menu/ViewSubmenu`·`Menu/SortSubmenu` 같은 별도 조립이다. 피그마에 트리거가 없는 우클릭·입력으로 여는 것(작업 표시줄 앱 우클릭 메뉴, Chrome 입력 제안)은 누르기로 연결하고, 실제 트리거는 그 트리거 레이어의 Development 주석에 적는다.

  코드:
  - 트리거와 팝업은 코드 전용 `Popover` 틀로 묶는다. `Popover`는 트리거, 팝업, 붙는 자리(`placement`), 열림 상태를 가진다. 붙는 자리는 팝업이 트리거의 어느 쪽에 어느 끝을 맞춰 붙는지다(`bottom-start`, `bottom-center`, `bottom-end`, `top-center`, `top-end`, `right-start`). 필요할 때 더한다.
  - 열린 팝업은 원래 떠 있는 요소라 `Popover` 안의 절대 위치 자식으로 둔다. 트리거를 담은 부모의 크기와 배치가 팝업 때문에 바뀌지 않게 하기 위해서다.
  - 열림 동작과 항목은 `play` 동작 스토리로 확인한다.
조립: |
  조립은 컴포넌트 인스턴스를 조합해 내용을 채운 것이다. 피그마 03 · Patterns 페이지에 두고, 앱(`apps/web`의 `shell/`·`features/`·`shared/`)의 컴포넌트에 대응한다.
  컴포넌트가 내용까지 알면 내용마다 변형이 늘고 같은 구조를 여러 벌 그리게 되어, 내용은 컴포넌트 밖의 이 층에 둔다.

  피그마 조립은 앱 코드 구조를 내보내는 곳이 아니라 "큰 UI가 이렇게 보여야 한다"는 그림 기준과 프로토타입이다. 코드는 이 그림을 기준으로 구조를 스스로 정한다([[디자인 시스템:피그마 파일]]). 조립은 구조 검사를 받지 않고, 내보내기는 그림과 보고만 낸다([[피그마 연동:구조 검사]], [[피그마 연동:피그마 플러그인]]).

  피그마:
  - 조립은 피그마 컴포넌트로 만든다. 슬롯을 채우는 조합은 쓰는 화면 수와 상관없이 모두 조립이다. 예: `Taskbar/Default`, `Desktop/Scene`(배경화면 + 아이콘 + 작업 표시줄), `Window/Chrome`, `Explorer/Content`(탐색기 창 본문), `Start/Menu`와 `Search/Panel`(ShellSurface를 바로 쓰는 Start와 검색 패널).
  - 이름은 `영역/이름` 형식의 영어로 쓰고, 한국어 설명은 description에 적는다. 조립 이름이 앱 코드의 이름이다([[피그마 연동:스토리 규칙]]).
  - 같은 자리에 들어가는 대안끼리는 변형으로 묶고, 자리가 다르면 따로 둔다. 재질은 조립의 변형으로 두지 않는다.
  - 디자이너는 인스턴스를 자유롭게 놓고, 바탕을 칠하고, 열린 상태도 그린다. 예: Start 본문 덧칠과 띠 사이 구분선은 조립에 직접 그린다([[디자인 기반:재질 효과]]). 부품은 디자인 시스템 인스턴스로 쓰고 떼어 내지 않는다. 컴포넌트 밖에서 그린 것은 내보내기 보고에 따로 나온다.
  - 조립 프레임 안은 실제로 화면에 나오는 것이고, 프레임 밖(설명 글, 배경판)은 보여 주기용이라 내보내지 않는다. 프레임 안에 둔 보여 주기용(호버 커서 그림 등)은 Development 주석으로 "표시용"이라고 적는다. 내보내기 보고가 따로 분류한다.
  - 간격과 색은 컴포넌트 안이든 조립의 배치든 토큰 값을 쓰는 것이 기본이다. 1px 미세 조정보다 일관성을 앞세우고, 같은 값이 되풀이해 필요하면 새 토큰을 제안한다. 내보내기 보고는 Foundations에 없는 값을 가까운 토큰과 함께 알려 준다.
  - 조립 프레임은 코드 구조(스크롤 영역을 나누는 방법 등)에 맞춰 쪼개지 않고 의도한 배치대로 그린다. 실행 중에만 드러나는 것 가운데 피그마 기능으로 나타낼 수 있는 것은 그 기능으로 그린다(긴 글자는 글자 말줄임, 넘치는 목록은 프레임 스크롤). 그럴 수 없는 것(스크롤바 위치, 데이터로 정해지는 값 등)은 그 레이어의 Development 주석에 적는다([[디자인 시스템:피그마 파일]]).
  - "언제 열리고 움직이는가"는 조립의 프로토타입으로 눌러 볼 수 있게 그린다. 버튼 누름 → 창이 열린 프레임, After delay → 이미지를 받은 모습, On drag → 순서 바꿈, 트리거 → 메뉴 오버레이([[디자인 시스템:팝업]])처럼 연결한다. 플러그인은 트리거를 읽지 않는다. 키보드 포커스일 때만, 끄는 동안 유지 같은 정확한 조건은 화면별 기능 문서와 코드가 맡는다.
  - 요소 전체가 움직이는 것과 여러 곳이 함께 쓰는 움직임은 이 프로토타입 흐름이 도착하는 프레임 안 인스턴스에 키프레임으로 건다([[디자인 기반:모션 견본]]).
  - 창 축소 화면(작업 표시줄 창 미리보기, Snap Assist)은 `Window/*` 조립 인스턴스를 줄여 넣는다. 코드는 실제 창 컴포넌트를 그대로 그리고 CSS `scale`로 줄인다. Windows의 축소 화면이 실제 창 내용이고, 줄이는 비율은 창 크기에 따라 실행 중에 정해지기 때문이다. 그림 자산으로 그리는 방식은 실제 내용과 달라지고 창 디자인이 바뀔 때마다 다시 만들어야 해서 고르지 않았다.
  - 조립과 화면의 크기(조립 루트, 프레임, 인스턴스에서 덮어쓴 크기. 고정·최소·최대 크기 모두)는 변수 없는 숫자로 둘 수 있다([[디자인 기반:크기 변수]]). 여백·간격과 그 밖의 시각 값은 위 토큰 기본 규칙을 따른다. 앱 코드가 토큰 클래스로 옮기는 값이기 때문이다([[피그마 연동:토큰 사용 강제]]).
  - 같은 앱의 창은 기기와 상관없이 같은 방법으로 만든다. 예: `Window/Explorer`의 `Device=Desktop`·`Mobile`은 둘 다 WindowFrame 위에 만든다.
  - 지금 화면에서 쓰지 않는 조립도 앱 코드의 짝이라 남긴다.

  코드:
  - 조립은 앱의 컴포넌트다. 디자인 시스템 패키지에 두지 않는다.
  - 피그마 속성은 props, 피그마 슬롯은 자리 prop(`children`이나 `ReactNode` prop)이다.
  - 안쪽 컴포넌트의 빈 자리(슬롯)는 바깥 컴포넌트가 prop으로 받아 넘긴다. 예: SearchResults는 안쪽 BestMatchCard를 `card` prop으로 통째로 받는다(카드의 속성과 슬롯을 다시 열지 않는다).
  - 큰 조립은 영역의 자리만 갖고, 안에 들어갈 조립은 쓰는 쪽이 넣는다.
  - 개수가 정해지지 않은 목록(메뉴 항목, 결과 목록)은 배열 prop으로 받는다.
  - 구조가 같은 조립 여럿(예: 우클릭 메뉴들)은 코드 컴포넌트 하나에 데이터만 다른 스토리 여럿으로 둔다.
  - 메뉴 항목 목록은 항목을 만드는 함수 하나를 실제 기능과 조립 스토리가 함께 쓴다. 그래야 조립 스토리가 실제 메뉴(글자·아이콘·순서·구분선·분기)를 그린다. 둘 이상의 기능이 쓰는 항목 정의는 `shared/`에 둔다.
  - 조립의 구조(감싸기, 슬롯, 배치, 스크롤 영역 등)는 코드가 스스로 정한다. 피그마 레이어 구조를 그대로 옮기지 않는다.
  - 조립마다 앱 Storybook에 스토리를 둔다. 조립 스토리의 데이터를 피그마 조립과 똑같이 맞추지 않는다. 기능은 `play` 동작 스토리로 확인하고, 생김새는 캡처 표에서 피그마 그림과 나란히 보지만 참고용이다([[피그마 연동:캡처 표]]).
Screens: |
  04 · Screens에는 앱마다 기본 화면 하나와, 여러 요소가 함께 놓여야 알 수 있는 화면만 둔다. 예: 겹친 창, 스냅된 창, 작업 표시줄 미리보기, 모바일 배치. 화면을 구현할 때 기준으로 쓴다.

  - 화면은 조립 인스턴스로 만들고 상태와 위치만 정한다.
  - 섹션과 화면 번호는 빈 곳 없이 매기고, 섹션은 바탕화면, 작업 표시줄, Start, 검색, 탐색기, Chrome, 창 동작, 다시 시작, 모바일 순서로 놓는다.
  - 화면에는 열린 팝업(메뉴 등)을 그릴 수 있다. 열린 팝업 조립 인스턴스를 화면의 자동 배치 밖에 겹쳐 놓아, 화면의 배치가 팝업 때문에 바뀌지 않게 한다. 우클릭 메뉴도 화면 위에 Menu 조립을 놓는다([[디자인 시스템:팝업]]).
  - 동작 전·후만 보여 주는 화면(끌기 전·후, 결과 위치만 다른 화면, 같은 구성에 글자만 다른 화면)은 두지 않는다. 그 동작은 화면별 기능 문서에 적는다([[화면별 기능]]).
  - 화면 흐름 프로토타입(클릭으로 화면을 오가는 연결, 화면 사이 열기·닫기 애니메이션 장면)은 화면에 두지 않는다. 트리거와 움직임의 프로토타입은 조립에 둔다([[디자인 시스템:조립]]). 동작은 코드(Storybook과 앱)에서 확인하고, 움직임 값은 [[디자인 기반:모션]]을 따른다.
  - 컴포넌트 변형 사이 전환(Rest → Hover 등)은 컴포넌트에 둔다([[디자인 기반:모션]]).
커서: |
  Windows 화면과 웹 페이지 영역의 커서를 나눈다.

  - Chrome 창 안의 글 페이지(웹 페이지 영역)에서 누를 수 있는 요소는 손가락 커서(`cursor: pointer`)다. 목차 항목과 목차 접기·펼치기, 이전·다음 카드, 검색 결과 줄, 새 탭 바로가기, 코드 복사 버튼, 본문 링크가 해당한다. 실제 웹 페이지와 같다.
  - Windows 화면(작업 표시줄, Start, 메뉴, 탐색기, 창 버튼, Chrome 탭·도구 모음)은 실제 Windows처럼 화살표(`default`) 그대로이고, 누를 수 있다는 것은 호버 배경으로 알린다. 그래서 누를 수 있는데 호버 배경이 없는 요소를 두지 않는다.
  - 이 규칙은 누를 수 있다는 표시에 관한 것이다. 글자 입력칸, 크기 조절, 끌기 중 옮길 수 없는 곳([[항목 조작:끌기]])의 커서는 따로 정한 대로 둔다.
검토한 대안: |
  - 커서를 어디서나 `pointer`로 통일: Windows 화면이 실제 Windows와 달라져서 고르지 않았다([[디자인 시스템:커서]]).
