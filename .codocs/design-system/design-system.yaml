_codocs:
  id: design-system
  name: 디자인 시스템
  parent:
    - seojaewan 블로그
개요: |
  블로그 화면을 이루는 토큰, 컴포넌트, 조립을 어디서 출발해 무엇을 담고, 피그마에서 어떻게 관리하는지 안내하는 목차다.
  피그마가 디자인의 기준이고, `packages/design-system`과 앱의 조립 컴포넌트는 피그마와 대응하는 코드다. 피그마에서 코드로 옮기고 같은지 확인하는 방법은 [[피그마 연동]]에 있다.
출발점: |
  Microsoft가 피그마 커뮤니티에 공개한 공식 Windows UI kit(CC BY 4.0)을 기준으로 한다.
  재현 정확도가 [[제품 정의:목적]]의 포트폴리오 목적에 중요하고, 값을 추측하지 않고 공식 값에서 가져올 수 있기 때문이다.

  커뮤니티 파일은 피그마 MCP가 직접 읽을 수 없어 "서재완" 팀에 사본을 두고 비교에 쓴다: [Windows UI kit (Community) 사본](https://www.figma.com/design/JmgCvyrvh9p9xMWKe4ZAAI).
  이 UI kit은 앱 컨트롤과 그림자·재질·표면 스타일을 담고 있고, 작업 표시줄·Start·탐색기 같은 바탕화면 셸은 없다. 셸 요소는 Windows 11 화면을 기준으로 만든다.

  이전 구현(`legacy/window-blog-v1` 태그)은 블로그에 맞춰 바꾼 부분을 참고하는 데만 쓴다. 이전에 추측한 값의 오차가 따라오지 않게 하기 위해서다.
범위: |
  디자인 시스템에는 기본 컨트롤과 Windows 화면 요소의 컴포넌트를 담는다. 목록은 [[컴포넌트 목록]]에서 확인한다.

  Windows 화면 요소(창 프레임, Taskbar, 셸 표면 등)가 블로그 겉모습의 대부분이어서 이것까지 담는다. 공식 UI Kit에도 이 요소들이 컴포넌트로 있어 피그마와 1:1로 대응된다.

  디자인 시스템은 "창이 어떻게 생겼는가"만 알고 "어떤 창이 열려 있는가"는 모른다. 데이터를 가져오지 않고 앱 코드에 기대지 않는다. 내용을 채운 조립과 동작·상태(창 순서, 드래그, 열린 앱 목록)는 앱의 `features/`에 둔다([[디자인 시스템:조립]], [[저장소 구성:의존 방향]]).
피그마 파일: |
  파일: [seojaewan 블로그 · Windows 11 디자인 시스템](https://www.figma.com/design/XV9Y1UT5UH4tC5hSqLVipZ) (팀: 서재완)

  | 페이지 | 내용 |
  |---|---|
  | 00 · Foundations | 토큰(Variables), 글자·효과·칠 스타일, 간격과 크기 견본, 재질 효과, 자산 |
  | 01 · Components | 기본 컨트롤과 Windows 화면 요소의 틀. 상태별 변형 포함([[디자인 시스템:컴포넌트 조립 규칙]]) |
  | 02 · Patterns | 컴포넌트를 조합해 내용을 채운 조립. 앱 코드의 컴포넌트에 대응한다([[디자인 시스템:조립]]) |
  | 03 · Screens | 조립을 놓고 상태와 위치를 정한 화면([[디자인 시스템:Screens]]) |

  - 모든 페이지의 묶음은 피그마 섹션(SECTION) 노드로 만든다. 화면을 축소해도 묶음 이름이 보이게 하기 위해서다.
  - 피그마의 설명(description)에는 그 컴포넌트·조립·스타일·변수를 무엇에, 어디에 쓰는지만 한 문장으로 쓴다. 구조, 구현 방식, 바뀐 이력은 쓰지 않는다. 구조는 피그마가, 코드는 저장소가 보여 주고, 규칙과 기준은 이 `.codocs` 문서가 가진다. 두 곳에 같은 내용을 두면 한쪽만 고쳐져 어긋나기 때문이다.

  공식 UI Kit을 라이브러리로 연결해 그대로 쓰지 않고, UI Kit에서 값과 구조를 가져와 이 파일의 Variables와 컴포넌트로 다시 만든다.
  Variables 이름 체계와 플러그인 내보내기 대상을 우리가 통제하고, UI Kit이 업데이트돼도 우리 컴포넌트가 바뀌지 않게 하기 위해서다.
문서: |
  - 모드, 강조색, 서체, 레이아웃, 재질 효과, 자산, 토큰 이름 체계: [[디자인 기반]]
  - 어떤 컴포넌트가 있는지: [[컴포넌트 목록]]
컴포넌트 조립 규칙: |
  컴포넌트는 틀이다. 어느 화면에서든 같은 모양과 구성이면 컴포넌트이고, 쓰는 곳마다 달라지는 것(메뉴 항목, 목록 항목, 경로, 탭, 글 내용, 동작 목록)은 슬롯이나 속성으로 연다. 기본 컴포넌트를 고치면 그것을 쓰는 모든 곳이 자동으로 바뀌게 만든다.

  - 변형은 컴포넌트가 스스로 가진, 끝이 정해진 축(상태, 크기, 종류, 기기, 재질)에만 둔다. 내용마다 변형을 만들면 변형이 내용 수만큼 늘기 때문이다.
  - 무엇이 몇 개 들어갈지 모르는 자리는 슬롯으로 연다. 자리가 정해진 부품의 값(문구, 아이콘, 표시 여부, 상태)은 컴포넌트 속성(텍스트, 불리언, 인스턴스 교체, 변형)으로 연다. 안쪽 부품의 속성은 중첩 인스턴스 속성 노출로 바깥에 보이게 한다.
  - 컴포넌트는 자기 정의 안에서 슬롯을 채우지 않는다. 슬롯은 언제나 비어 있고, 채우는 것은 조립과 화면이다. 01 · Components에는 예시 인스턴스를 두지 않는다. 채운 모습은 02 · Patterns에서 본다.
  - 글자 속성의 기본값은 그 자리를 설명하는 일반 문구다(예: "제목", "메시지 내용", "항목 이름", "앱 이름"). 특정 화면의 문구를 쓰지 않는다.
  - 다른 바탕을 감싸는 컴포넌트는 안쪽 바탕 위에 쌓고, 안쪽 바탕의 슬롯을 자기 슬롯으로 따로 열지 않는다. 조립이 안쪽 바탕의 슬롯을 바로 채운다. 피그마는 중첩 인스턴스의 슬롯을 바깥 슬롯으로 다시 열 수 없기 때문이다([[한계:감싼 바탕의 슬롯 다시 열기]]). 예: Menu는 Flyout(`Padding=Compact`) 위에 쌓고, 조립(`Menu/*`)이 Flyout의 `Content` 슬롯에 항목을 넣는다.
  - `Material` 변형은 재질 바탕을 직접 칠하는 컴포넌트(Flyout, ShellSurface, WindowFrame 등)만 가진다. 감싸는 컴포넌트와 조립은 안쪽 바탕의 `Material`을 노출해 바꾼다. 같은 축을 감싸는 쪽마다 다시 만들면 변형이 겹으로 늘기 때문이다.
  - 큰 컴포넌트는 작은 컴포넌트의 인스턴스로 만든다. 예: WindowFrame의 창 버튼은 CaptionButton 인스턴스, MessageBox의 버튼은 Button 인스턴스다.
  - 큰 컴포넌트는 이름을 붙일 수 있는 영역 단위로 나눈다. 예: ExplorerContent = ExplorerAddressRow + ExplorerCommandBar + NavigationPane + 항목 슬롯 + ExplorerStatusBar.
  - 같은 모양을 두 곳 이상에서 쓰면 컴포넌트로 만든다. 곳마다 따로 그리지 않는다.
  - 비슷해 보여도 쓰는 곳의 모양과 동작이 다르면 합치지 않는다. 예: Chrome 탭(BrowserTab)과 탐색기 탭(ExplorerTab)은 따로 둔다.
  - 01 · Components의 컴포넌트는 02 · Patterns의 조립을 쓰지 않는다. 슬롯 예시로도 쓰지 않는다.
  - 컴포넌트는 바깥 여백을 갖지 않는다. 바깥 배치는 쓰는 곳이 정한다. 코드의 `className`은 바깥 배치(여백, 위치, 크기, 정렬)에만 쓰고 생김새는 덮어쓰지 않는다. 값은 토큰 클래스만 쓴다.
  - 컴포넌트 루트 크기는 누가 크기를 정하는지에 따라 셋 중 하나로 둔다. 쓰는 곳마다 같은 덮어쓰기를 반복하지 않기 위해서다.
    - 내용을 감싸는 바탕(Flyout 등)은 내용에 맞춘다(HUG). 너비는 담는 내용이나 그 바탕을 감싸는 컴포넌트가 정한다. 예: Flyout은 너비가 없고, Menu가 메뉴 너비를 가진다.
    - 부모가 크기를 정하는 컴포넌트(목록 항목, 구분선, 주소창, 탐색기의 줄 등)는 피그마 원본의 고정 너비를 미리보기 크기로만 두고, 쓰는 곳의 인스턴스는 부모 채움(FILL)으로 둔다. 코드는 너비를 갖지 않고 부모를 채운다.
    - Windows가 정한 크기(창 버튼, 작업 표시줄 버튼, 탭, 고정 앱 타일 등)는 고정 크기와 크기 변수로 둔다([[디자인 기반:크기 변수]]).
  - 상태 때문에 안 보이는 것을 그려 놓고 숨기지 않는다. 상태에 따라 있고 없는 것은 그 상태의 변형에만 그리고, 쓰는 곳이 켜고 끄는 것은 불리언 속성으로 연다. 어디서도 쓰지 않는 레이어는 지운다. 칠 없이 자리만 차지해야 하는 것은 칠 없는 빈 프레임으로 둔다(예: NavigationItem `Expand=None`의 `chevron space`).
  - 재사용을 위해 컴포넌트를 바꿔야 하면 복사본을 만들지 않고 원본 컴포넌트를 고친다. 인스턴스를 떼어내어(detach) 직접 고치지 않는다.

  코드의 `packages/design-system`도 같은 방식으로 작은 컴포넌트를 조립해 큰 컴포넌트를 만든다. 피그마 슬롯은 코드의 자리 prop(`children`이나 `ReactNode` prop)이다. 피그마에서 노출한 중첩 인스턴스의 속성은 코드에서도 부모 prop을 그 중첩 컴포넌트로 넘기는 구조로 맞춘다.
아이콘 자리: |
  컴포넌트 안에서 쓰는 곳마다 바꿔 끼우는 아이콘은 인스턴스 교체(INSTANCE_SWAP) 속성으로 연다.

  - 레이어 이름은 자리 이름이다(`icon`, `leading icon`, `chevron`, `location icon` 등). 아이콘을 바꿔 끼워도 바뀐 자산 이름으로 바꾸지 않는다.
  - 같은 컴포넌트를 여럿 담는 자리도 역할 이름을 쓴다(`minimize button`, `close button`).
  - 속성 이름은 코드 prop 이름이 된다(`Icon` → `icon`, `Close icon` → `closeIcon`).
  - 속성의 선호값(preferred values)에 그 자리에 쓸 수 있는 자산을 넣어 둔다.
  - 아이콘은 언제나 속성으로 바꿔 끼운다. 안쪽 아이콘 레이어의 원본 컴포넌트를 직접 바꾸면 크기 변수 연결이 빠진다([[한계:피그마 API 덮어쓰기 함정]]).
팝업: |
  트리거(버튼, 메뉴 항목, 입력창)와 그 옆에 뜨는 팝업(메뉴, 툴팁, 플라이아웃)은 `Popover` 틀로 묶는다.

  - `Popover`는 `Trigger` 슬롯, `Popup` 슬롯, `Placement` 변형, `State=Closed`·`Open` 변형을 가진다. `Closed`는 트리거만 보인다.
  - `Placement`는 팝업이 트리거의 어느 쪽에 어느 끝을 맞춰 붙는지다(`Bottom-Start`, `Bottom-Center`, `Bottom-End`, `Top-Center`, `Top-End`, `Right-Start`). 필요할 때 더한다.
  - 트리거와 팝업 사이 간격은 `spacing/4` 하나로 통일한다(툴팁 포함).
  - 열린 팝업은 원래 떠 있는 요소라 `Popover` 안의 절대 위치 자식으로 둔다. 트리거를 담은 부모의 크기와 배치가 팝업 때문에 바뀌지 않게 하기 위해서다. 인스턴스에서 팝업 위치를 덮어쓰지 않고 `Placement`를 바꾼다.
  - 컴포넌트는 `Popover` 틀까지만 가진다. 특정 트리거와 특정 팝업 내용을 묶은 것은 조립이다. 예: `Start/PowerButton`(전원 IconButton + `Menu/Power`), DropDownButton + 보기 메뉴, 작업 표시줄 앱 버튼 + 우클릭 메뉴, AddressBar + 추천 목록, 작업 표시줄 앱 버튼 + TaskbarPreviewList(`Top-Center`).
  - 하위 메뉴가 열린 모습은 부모 메뉴 조립의 변형이다(`Submenu=None`·`View`·`Sort` 등).
  - 팝업을 여는 트리거는 열려 있는 동안 `State=Open`이다([[컴포넌트 목록:상태]]).
조립: |
  조립은 컴포넌트 인스턴스를 조합해 내용을 채운 것이다. 피그마 02 · Patterns 페이지에 두고, 앱(`apps/web`의 `features/`)의 컴포넌트에 대응한다.
  컴포넌트가 내용까지 알면 내용마다 변형이 늘고 같은 구조를 여러 벌 그리게 되어, 내용은 컴포넌트 밖의 이 층에 둔다.

  피그마:
  - 조립은 피그마 컴포넌트로 만든다. 슬롯을 채우는 조합은 쓰는 화면 수와 상관없이 모두 조립이다. 예: `Taskbar/Default`, `Desktop/Scene`(배경화면 + 아이콘 + 작업 표시줄), `Window/Chrome`, `Start/Menu`와 `Search/Panel`(ShellSurface를 바로 쓰는 Start와 검색 패널).
  - 이름은 `영역/이름` 형식의 영어로 쓰고, 한국어 설명은 description에 적는다. 조립 이름이 앱 코드의 이름이다([[피그마 연동:스토리 규칙]]).
  - 같은 자리에 들어가는 대안끼리는 변형으로 묶고, 자리가 다르면 따로 둔다. 재질은 조립의 변형으로 두지 않는다.
  - 부품은 디자인 시스템 인스턴스로만 쓰고 떼어 내지 않는다. 조립에서 직접 만드는 것은 배치 프레임(토큰 연결)과 글자(글자 스타일과 색 토큰)까지이고, 바탕은 Foundations 칠 스타일만 쓴다.
  - 같은 앱의 창은 기기와 상관없이 같은 방법으로 만든다. 예: `Window/Explorer`의 `Device=Desktop`·`Mobile`은 둘 다 WindowFrame 위에 만든다.
  - 지금 화면에서 쓰지 않는 조립도 앱 코드의 짝이라 남긴다.

  코드:
  - 조립은 앱의 컴포넌트다. 디자인 시스템 패키지에 두지 않는다.
  - 피그마 속성은 props, 피그마 슬롯은 자리 prop(`children`이나 `ReactNode` prop)이다.
  - 큰 조립은 영역의 자리만 갖고, 안에 들어갈 조립은 쓰는 쪽이 넣는다.
  - 개수가 정해지지 않은 목록(메뉴 항목, 결과 목록)은 배열 prop으로 받는다.
  - 구조가 같은 조립 여럿(예: 우클릭 메뉴들)은 코드 컴포넌트 하나에 데이터만 다른 스토리 여럿으로 둔다.
  - 조립마다 앱 Storybook에 피그마 조립과 같은 데이터로 스토리를 두고 캡처 표로 피그마와 비교한다([[피그마 연동:캡처 표]]).
Screens: |
  03 · Screens에는 앱마다 기본 화면 하나와, 여러 요소가 함께 놓여야 알 수 있는 화면만 둔다. 예: 겹친 창, 스냅된 창, 작업 표시줄 미리보기, 모바일 배치. 화면을 구현할 때 기준으로 쓴다.

  - 화면은 조립 인스턴스로 만들고 상태와 위치만 정한다.
  - 섹션과 화면 번호는 빈 곳 없이 매기고, 섹션은 바탕화면, 작업 표시줄, Start, 검색, 탐색기, Chrome, 창 동작, 다시 시작, 모바일 순서로 놓는다.
  - 팝업이 열린 화면은 트리거 자리의 조립을 `Open`으로 바꾼다. 열린 팝업 복사본을 화면 위에 따로 겹쳐 놓지 않는다. 우클릭 메뉴는 화면 위에 Menu 조립만 놓는다.
  - 동작 전·후만 보여 주는 화면(끌기 전·후, 결과 위치만 다른 화면, 같은 구성에 글자만 다른 화면)은 두지 않는다. 그 동작은 화면별 기능 문서에 적는다([[화면별 기능]]).
  - 화면 흐름 프로토타입(클릭으로 화면을 오가는 연결, 오버레이, 열기·닫기 애니메이션 장면)은 두지 않는다. 동작은 코드(Storybook과 앱)에서 확인하고, 움직임 값은 [[디자인 기반:모션]]을 따른다.
  - 컴포넌트 변형 사이 전환(Rest → Hover 등)은 컴포넌트에 둔다([[디자인 기반:모션]]).
