_codocs:
  id: design-system
  name: 디자인 시스템
  parent:
    - seojaewan 블로그
개요: |
  디자인의 결과물은 피그마다. 이 문서는 피그마를 보고 코드를 만들 때 피그마만으로는 알 수 없는 것을 정한다.
  피그마 파일을 읽는 법, 피그마를 코드로 옮기는 규칙, 코드에만 있는 것, 피그마에서 내보내 코드로 들여오는 절차다.

  피그마는 모양(토큰, 컴포넌트의 모양·변형·상태, 움직임)을 맡고, 코드는 구조(조합, 감싸기, 슬롯, 배치, 실행 중 크기와 동작)를 맡는다. 피그마 구조를 코드 구조와 1:1로 맞추지 않는다.
  `packages/design-system`의 컴포넌트는 피그마 컴포넌트와 대응하고([[디자인 시스템:코드 전용 컴포넌트]]는 예외), 앱의 조립은 피그마 조립 그림을 기준으로 코드가 구조를 정한다([[디자인 시스템:조립]]).

  기계가 보장하는 것과 사람이 보는 것을 나눈다.
  - 기계가 보장한다: 토큰([[디자인 시스템:토큰 생성]], [[디자인 시스템:토큰 검사]], [[디자인 시스템:토큰 사용 강제]]), 자산([[디자인 시스템:자산]]), 애니메이션의 시간·이징·지연·반복 횟수와 키프레임 값([[디자인 시스템:모션]]).
  - 사람이 본다: 컴포넌트와 조립의 모습, 움직임의 느낌. 구현하는 사람이 플러그인이 내보낸 PNG를 보고 코드와 `Figma` 스토리를 맞춘다. 정확히 같아야 하는 기준은 컴포넌트이고, 조립은 참고용 그림이다.

  피그마의 시각 값은 모두 변수나 스타일에 연결되어 있으므로([[디자인 시스템:구조 검사]]), 코드가 같은 토큰 클래스를 쓰면 값도 같다. 어떤 토큰을 어디에 썼는지는 사람이 모습으로 확인한다.
출발점: |
  Microsoft가 피그마 커뮤니티에 공개한 공식 Windows UI kit(CC BY 4.0)을 기준으로 한다.
  재현 정확도가 [[제품 정의:목적]]의 포트폴리오 목적에 중요하고, 값을 추측하지 않고 공식 값에서 가져올 수 있기 때문이다.

  이 UI kit은 앱 컨트롤과 그림자·재질·표면 스타일을 담고 있고, 작업 표시줄·Start·탐색기 같은 바탕화면 셸은 없다. 셸 요소는 Windows 11 화면을 기준으로 만든다.

  이전 구현(`legacy/window-blog-v1` 태그)은 블로그에 맞춰 바꾼 부분을 참고하는 데만 쓴다. 이전에 추측한 값의 오차가 따라오지 않게 하기 위해서다.
범위: |
  디자인 시스템에는 기본 컨트롤과 Windows 화면 요소(창 프레임, Taskbar, 셸 표면 등)의 컴포넌트를 담는다.

  디자인 시스템은 "창이 어떻게 생겼는가"만 알고 "어떤 창이 열려 있는가"는 모른다. 데이터를 가져오지 않고 앱 코드에 기대지 않는다. 내용을 채운 조립과 동작·상태(창 순서, 드래그, 열린 앱 목록)는 앱(`apps/web`)의 `shell/`·`features/`·`shared/`에 둔다([[디자인 시스템:조립]], [[저장소 구성:의존 방향]]).
  바탕화면 아이콘을 늘어놓는 배치도 앱이 정한다. 아이콘 하나(FileItem)만 컴포넌트이고, 아이콘을 채우는 배치는 앱 코드(CSS grid 등)다.
피그마 파일: |
  파일: [seojaewan 블로그 · Windows 11 디자인 시스템](https://www.figma.com/design/XV9Y1UT5UH4tC5hSqLVipZ) (팀: 서재완)

  | 페이지 | 담는 것 |
  |---|---|
  | `Cover`, `Read me` | 파일 표지와 안내 |
  | `Foundations` | 변수·스타일과 자산 |
  | `Controls` | 기본 컨트롤 컴포넌트. 디자이너가 시안을 그릴 때 직접 꺼내 놓고 상태를 바꿔 쓰는 것 |
  | `Shell` | 화면 영역 컴포넌트. 작업 표시줄, 탐색 창, 명령 모음처럼 화면의 정해진 한 자리를 차지하는 판·줄·패널 |
  | `Blog` | 글 화면의 블록 컴포넌트 |
  | `Patterns` | 조립과 그 프로토타입([[디자인 시스템:조립]]) |
  | `Screens` | 조립 인스턴스로 만든 화면. 상태와 위치만 정하고, 화면을 구현할 때 기준으로 쓴다 |

  어떤 컴포넌트가 있고 무엇에 쓰는지는 그 컴포넌트의 description에 있다.

  컴포넌트가 놓인 구조:
  - `Section / <이름>` 프레임 → `component grid` → `item/<부품>` → `table/<세트>`. `table/<세트>`가 컴포넌트 세트를 담는다.
  - 그 밖의 `label`·`row label` 글자, `backdrop` 사각형, 이름·설명 글자는 보여 주기 위한 문서용 레이어라 코드로 옮기지 않는다. 변형·속성·슬롯은 피그마 오른쪽 패널의 컴포넌트 속성에서 읽는다.

  피그마에서 읽을 곳:
  - 값 하나의 뜻과 쓰임은 그 변수·스타일의 description에 있다.
  - 피그마가 속성으로 가지지 못한 규칙 글은 레이어의 Dev Mode 주석에 카테고리와 함께 있다. 실행 중에 정해지는 값과 프로토타입으로 그릴 수 없는 실제 트리거는 Development, 동작 줄이기에서 남기는 움직임은 Accessibility다.
  - 재생 설정 Loop, 프로토타입 상호작용, 글자 말줄임, 프레임 스크롤, 변수 연결로 나타낸 것은 그 기능에서 읽는다([[디자인 시스템:구조 검사]]의 "피그마 기능으로 읽는 것").
  - 이름이 점(`.`)으로 시작하는 컴포넌트는 내보내지 않는다.

  공식 UI Kit을 라이브러리로 연결하지 않고 값과 구조를 가져와 이 파일의 Variables와 컴포넌트로 다시 만든다. Variables 이름과 내보내기 대상을 우리가 통제하고, UI Kit이 바뀌어도 우리 컴포넌트가 바뀌지 않게 하기 위해서다.
컴포넌트 조립 규칙: |
  컴포넌트는 틀이다. 어느 화면에서든 같은 모양과 구성이면 컴포넌트이고, 쓰는 곳마다 달라지는 것(메뉴 항목, 목록 항목, 경로, 탭, 글 내용, 동작 목록)은 슬롯이나 속성으로 연다.

  - 변형은 컴포넌트가 스스로 가진, 끝이 정해진 축(상태, 크기, 종류, 기기, 재질)에만 둔다. 앱이 쓰지 않는 변형은 두지 않는다. Hover·Pressed 같은 CSS 상태와 화면 크기로 고르는 Device 변형은 앱이 쓰는 것으로 본다.
  - 슬롯은 디자이너가 내용을 바꿔 끼우는 자리에만 둔다. 스크롤 영역, 격자 배치, 위치 잡기, 바탕 깔기 같은 감싸는 동작은 피그마에서 컴포넌트로 감싸지 않고 코드가 맡는다. 예: Toc는 `Items` 슬롯만 두고, 넘치면 세로로 스크롤한다는 것은 Development 주석에 있다. 코드의 Toc가 ScrollArea로 감싼다.
  - 무엇이 몇 개 들어갈지 모르는 자리는 슬롯, 자리가 정해진 부품의 값(문구, 아이콘, 표시 여부, 상태)은 컴포넌트 속성(텍스트, 불리언, 인스턴스 교체, 변형)이다. 안쪽 부품의 속성은 중첩 인스턴스 속성 노출로 바깥에 보인다.
  - 슬롯에는 실제 컴포넌트를 기본 내용으로 넣는다. 비어 있는 HUG 슬롯은 피그마가 100×100으로 그려 컴포넌트 단독 모습을 비교할 수 없기 때문이다. 실제 내용을 채우는 것은 조립과 화면이다.
  - 글자 속성의 기본값은 그 자리를 설명하는 일반 문구다(예: "제목", "항목 이름").
  - 다른 바탕을 감싸는 컴포넌트는 안쪽 바탕 위에 쌓고, 안쪽 바탕의 슬롯을 자기 슬롯으로 따로 열지 않는다. 조립이 안쪽 바탕의 슬롯을 바로 채운다. 피그마는 중첩 인스턴스의 슬롯을 바깥 슬롯으로 다시 열 수 없기 때문이다. 예: Menu는 Flyout 위에 쌓고, 조립(`Menu/*`)이 Flyout의 `Content` 슬롯에 항목을 넣는다.
  - `Material` 변형은 재질 바탕을 직접 칠하는 컴포넌트(Flyout, WindowFrame 등)만 가진다. 감싸는 컴포넌트와 조립은 안쪽 바탕의 `Material`을 노출해 바꾼다.
  - 큰 컴포넌트는 작은 컴포넌트의 인스턴스로, 이름을 붙일 수 있는 영역 단위로 만든다. 예: WindowFrame = WindowTitle + 창 버튼(CaptionButton) + Content 슬롯.
  - 같은 모양을 두 곳 이상에서 쓰면 컴포넌트로 만든다. 비슷해 보여도 쓰는 곳의 모양과 동작이 다르면 합치지 않는다(Chrome 탭 BrowserTab과 탐색기 탭 ExplorerTab).
  - 컴포넌트는 조립을 쓰지 않는다. 슬롯 기본 내용으로도 쓰지 않는다.
  - 컴포넌트를 담는 프레임과 컴포넌트 세트는 내용 자르기(Clip content)를 끈다. 피그마는 조상 프레임이 자르는 범위까지 잘라 내보내, 그림자나 노드 밖으로 나온 부분이 PNG에서 빠지기 때문이다. 켜져 있으면 구조 검사가 막는다([[디자인 시스템:구조 검사]]).
  - 컴포넌트는 바깥 여백을 갖지 않는다. 코드의 `className`은 바깥 배치(여백, 위치, 크기, 정렬)에만 쓰고 생김새는 덮어쓰지 않는다. 값은 토큰 클래스만 쓴다.
  - 컴포넌트 루트 크기는 누가 크기를 정하는지에 따라 셋 중 하나다([[디자인 시스템:크기 변수]]).
    - 쓰는 곳마다 크기가 다른 바탕(Flyout 등)은 내용에 맞춘다(HUG). 너비는 담는 내용이나 감싸는 컴포넌트가 정한다(Flyout은 너비가 없고 Menu가 메뉴 너비를 가진다). 어디서 쓰든 크기가 같은 바탕(Tooltip `Variant=Balloon`)은 고정한다.
    - 부모가 크기를 정하는 컴포넌트(목록 항목, 구분선, 주소창, 탐색기의 줄 등)는 코드에 너비가 없고, 쓰는 곳이 `className`으로 너비를 주거나 부모를 채운다. 피그마 원본의 폭·높이는 견본 크기다.
    - Windows가 정한 크기(창 버튼, 작업 표시줄 버튼, 탭, 고정 앱 타일 등)는 고정 크기와 크기 변수다.
  - 상태 때문에 안 보이는 것을 그려 놓고 숨기지 않는다. 상태에 따라 있고 없는 것은 그 상태의 변형에만 그리고, 쓰는 곳이 켜고 끄는 것은 불리언 속성이다. 칠 없이 자리만 차지하는 것은 칠 없는 빈 프레임이다(NavigationItem `Expand=None`의 `chevron space`).
  - 인스턴스의 모양(칠, 글자색, 선, 효과, 불투명도)을 직접 덮어쓰지 않는다. 쓰는 곳에 따라 달라야 하면 그 컴포넌트에 변형이나 속성을 연다. 코드는 `className`으로 모양을 바꿀 수 없어 직접 덮어쓴 모습을 옮길 길이 없기 때문이다. 예: 비활성 창의 제목 색은 WindowTitle `State=Inactive`, Chrome 도구 모음의 아이콘 색은 IconButton `Variant=Chrome`이다.
  - 한 곳에서만 쓰고 안쪽 부품마다 다른 앱 기능에 이어지는 묶음은 컴포넌트가 아니라 조립이다. 컴포넌트에는 재질 바탕과 자리만 남는다. 예: Taskbar는 재질 바탕, 높이, 위쪽 선과 가운데·오른쪽 자리만 갖고, 시작 버튼·검색·앱 버튼·시계는 `Taskbar/Default` 조립이 채운다. 탐색기 본문도 `Explorer/Content` 조립이 주소 줄·명령 모음·탐색 창·상태 줄을 놓는다. 여러 곳에서 같은 방식으로 쓰는 컴포넌트(WindowFrame 등)는 컴포넌트로 두고 고정 부품의 동작만 prop으로 연다.
  - 바깥 컴포넌트는 자리가 정해진 안쪽 부품의 동작과 값을 prop으로 받아 넘긴다. 기능이 늘 때마다 prop이 늘어나는 자리는 슬롯으로 열어 조립이 채운다. 바깥 컴포넌트가 쓰지 않는 prop을 여러 단계 나르기만 하게 되면, 그 묶음은 조립으로 만든다.

  코드의 `packages/design-system`도 같은 방식으로 작은 컴포넌트를 조립해 큰 컴포넌트를 만든다. 피그마에 없는 감싸기·배치용 컴포넌트는 코드 구조로 더한다([[디자인 시스템:코드 전용 컴포넌트]]). 피그마 슬롯은 코드의 자리 prop(`children`이나 `ReactNode` prop)이다. 코드의 자리 prop에는 기본 내용을 두지 않고 쓰는 곳이 채운다. 피그마 슬롯 기본 내용과 같은 내용은 `Figma` 스토리가 슬롯에 넣는다([[디자인 시스템:스토리 규칙]]). 피그마에서 노출한 중첩 인스턴스의 속성은 코드에서도 부모 prop을 그 중첩 컴포넌트로 넘기는 구조로 맞춘다. 피그마에서 슬롯 안 자식이 부모 채움(FILL)이면 슬롯을 여는 컴포넌트의 자리 요소가 그 자식을 채운다(세로 자리는 `[&>*]:min-h-size-none [&>*]:flex-flex-fill`, 고정 자리는 `[&>*]:size-full`). 쓰는 곳은 넣는 자식에 채움 클래스를 주지 않는다.
코드 전용 컴포넌트: |
  코드 구조 때문에 생긴 감싸기·배치용 컴포넌트는 피그마에 없고 `packages/design-system`에만 있다. 감싸고 배치하는 것은 코드가 맡는 구조이기 때문이다. 모양이 있는 것(Scrollbar, SelectionMarquee, 화면 영역 등)은 다른 컴포넌트 안에서만 써도 피그마에 있다.

  | 컴포넌트 | 하는 일 | 피그마에서는 |
  |---|---|---|
  | LayerSurface | 탐색기 본문 같은 카드 바탕 | 조립에 바탕을 직접 칠한다([[디자인 시스템:조립]]) |
  | ScrollArea | 넘치는 내용을 감싸 스크롤하고 Scrollbar를 겹쳐 그린다 | 스크롤바 모양은 Scrollbar가 맡는다([[디자인 시스템:겹쳐 놓기]]) |
  | TileGrid | 타일을 가로로 늘어놓고 줄바꿈한다 | 자동 배치로 직접 놓는다 |
  | Column, Columns | Notion 열 나누기 블록 | 자동 배치로 직접 놓는다 |
  | ListGroup | 머리글(SectionHeader)과 항목으로 된 목록 묶음 | 자동 배치로 직접 놓는다 |
  | Popover | 트리거와 팝업을 묶고 팝업 자리를 잡는다 | 열린 팝업을 조립에 그리고, 여는 흐름은 프로토타입 오버레이다([[디자인 시스템:팝업]]) |
  | CaptionButtonGroup | 창 버튼(최소화·최대화·닫기) 묶음 | CaptionButton을 직접 놓는다 |
  | MenuSeparator | 메뉴 안 구분선 | Separator를 쓴다 |

  - 코드 전용 컴포넌트는 `Figma` 스토리를 두지 않고 동작 테스트(단위 테스트, 스토리 `play`)로 지킨다([[디자인 시스템:스토리 규칙]]).
아이콘 자리: |
  컴포넌트 안에서 쓰는 곳마다 바꿔 끼우는 아이콘은 인스턴스 교체(INSTANCE_SWAP) 속성으로 연다.

  - 레이어 이름은 자리 이름이다(`icon`, `leading icon`, `chevron`, `location icon` 등). 같은 컴포넌트를 여럿 담는 자리도 역할 이름을 쓴다(`minimize button`, `close button`).
  - 속성 이름은 코드 prop 이름이 된다(`Icon` → `icon`, `Close icon` → `closeIcon`).
  - 속성의 선호값(preferred values)에 그 자리에 쓸 수 있는 자산이 있다.
  - 아이콘은 언제나 속성으로 바꿔 끼운다. 안쪽 아이콘 레이어의 원본 컴포넌트를 직접 바꾸면 크기 변수 연결이 빠진다.
  - 코드의 기본값: 쓰는 곳마다 다른 아이콘(앱 아이콘, 파일·폴더 아이콘)은 필수 prop으로 두고, `Figma` 스토리가 피그마 기본 인스턴스를 넣는다. 어디서나 같은 기능 아이콘(닫기, 꺾쇠, 돋보기)은 피그마 기본 인스턴스를 코드 기본값으로 둔다. 빠뜨린 아이콘이 기본값으로 조용히 그려지는 실수를 타입 검사로 잡기 위해서다.
  - 코드의 아이콘 자리는 자리 크기 변수(`size-size-icon-*`, `size-size-avatar-profile`)를 가진 상자이고, 바로 아래 자식을 `[&>*]:size-full [&>*]:object-contain`으로 채운다. `img`·`ImageAsset`·`Asset`이 모두 같다. 쓰는 곳은 아이콘에 크기 클래스를 주지 않고 색 클래스만 준다.
팝업: |
  트리거(버튼, 메뉴 항목, 입력창)와 그 옆에 뜨는 팝업(메뉴, 툴팁, 플라이아웃)의 규칙이다.

  - 트리거와 팝업 사이 간격은 `spacing/xs` 하나로 통일한다(툴팁 포함).
  - 작업 표시줄에서 여는 메뉴·창 미리보기는 작업 표시줄 위 끝에서 `spacing/md` 띄운다([[작업 표시줄:우클릭 메뉴]], [[작업 표시줄:창 미리보기]]).
  - 특정 트리거와 특정 팝업 내용을 묶은 것은 조립이다. 예: `Start/PowerButton`(전원 IconButton + `Menu/Power`), DropDownButton + 보기 메뉴, 작업 표시줄 앱 버튼 + 우클릭 메뉴.
  - 하위 메뉴는 마우스가 한 항목에 400ms(Windows 기본 `MenuShowDelay`) 머물면 연다. 하위 메뉴 항목이면 그 하위 메뉴를 열고, 일반 항목이면 열린 하위 메뉴를 닫는다. 처음 열 때도 같다. 다른 하위 메뉴로 바뀔 때는 옛 하위 메뉴를 닫고 새 하위 메뉴를 여는 것이 한 번에 일어나, 그 사이에 하위 메뉴가 없는 순간이 없다. 열린 하위 메뉴 안으로 들어가면 지나온 항목으로 바뀌지 않는다. 클릭과 키보드(→, Enter)는 기다리지 않고 바로 연다. 400ms는 Windows 기본값이라 모션 토큰이 아니라 코드 상수다.

  피그마:
  - 트리거와 팝업을 묶는 틀(`Popover`)은 피그마에 없다. 팝업 위치를 잡는 것은 코드가 맡는 구조다.
  - 조립에는 열린 팝업이 그려져 있을 수 있다. 열린 메뉴는 그 메뉴 조립의 인스턴스다.
  - 팝업이 열리는 흐름은 트리거의 프로토타입 오버레이(누르면, 올리면 → Open overlay)로 해당 `Menu/...` 조립을 띄워 나타낸다. 하위 메뉴도 그 항목에 오버레이로 하위 메뉴 조립(`Menu/ViewSubmenu` 등)을 띄운다. 피그마에 트리거가 없는 우클릭은 누르기로 연결하고, 실제 트리거는 그 레이어의 Development 주석에 있다.

  코드:
  - 트리거와 팝업은 코드 전용 `Popover` 틀로 묶는다. `Popover`는 트리거, 팝업, 붙는 자리(`placement`), 열림 상태를 가진다. 붙는 자리는 팝업이 트리거의 어느 쪽에 어느 끝을 맞춰 붙는지다(`bottom-start`, `bottom-center`, `bottom-end`, `top-center`, `top-end`, `right-start`). 필요할 때 더한다.
  - 열린 팝업은 `Popover` 안의 절대 위치 자식으로 둔다. 트리거를 담은 부모의 크기와 배치가 팝업 때문에 바뀌지 않게 하기 위해서다.
  - 열림 동작과 항목은 `play` 동작 스토리로 확인한다.
조립: |
  조립은 컴포넌트 인스턴스를 조합해 내용을 채운 것이다. 피그마 `Patterns` 페이지에 있고, 앱(`apps/web`의 `shell/`·`features/`·`shared/`)의 컴포넌트에 대응한다.
  피그마 조립은 앱 코드 구조를 내보내는 곳이 아니라 "큰 UI가 이렇게 보여야 한다"는 그림 기준과 프로토타입이다. 코드는 이 그림을 기준으로 구조를 스스로 정한다. 조립은 구조 검사를 받지 않고, 내보내기는 그림과 보고만 낸다([[디자인 시스템:피그마 플러그인]]).

  피그마 읽기:
  - 조립은 피그마 컴포넌트다. 슬롯을 채우는 조합은 쓰는 화면 수와 상관없이 모두 조립이다. 예: `Taskbar/Default`, `Desktop/Scene`, `Window/Chrome`, `Explorer/Content`, `Start/Menu`, `Search/Panel`.
  - 이름은 `영역/이름` 형식의 영어이고 한국어 설명은 description에 있다. 조립 이름이 앱 코드의 이름이다([[디자인 시스템:스토리 규칙]]).
  - 같은 자리에 들어가는 대안끼리는 변형이고, 자리가 다르면 따로 있다. 재질은 조립의 변형이 아니다.
  - 조립에는 바탕 칠, 덧칠, 구분선, 열린 상태가 직접 그려져 있을 수 있다. 컴포넌트 밖에서 그린 것은 내보내기 보고에 따로 나온다.
  - 조립 프레임 안은 실제로 화면에 나오는 것이고, 프레임 밖(설명 글, 배경판)은 내보내지 않는다. 프레임 안의 보여 주기용(호버 커서 그림 등)은 Development 주석에 "표시용"으로 적혀 있고 구현하지 않는다.
  - 간격과 색은 토큰 값이 기본이다. 내보내기 보고는 Foundations에 없는 값을 가까운 토큰과 함께 알려 준다.
  - 조립 프레임은 코드 구조(스크롤 영역을 나누는 방법 등)가 아니라 의도한 배치대로 그려져 있다. 실행 중에만 드러나는 것은 피그마 기능(글자 말줄임, 프레임 스크롤)이나 그 레이어의 Development 주석으로 나타낸다.
  - "언제 열리고 움직이는가"는 조립의 프로토타입으로 눌러 볼 수 있다(버튼 누름 → 창이 열린 프레임, After delay → 이미지를 받은 모습, On drag → 순서 바꿈, 트리거 → 메뉴 오버레이). 키보드 포커스일 때만, 끄는 동안 유지 같은 정확한 조건은 화면별 기능 문서와 코드가 맡는다.
  - 창 축소 화면(작업 표시줄 창 미리보기, Snap Assist)은 `Window/*` 조립 인스턴스를 줄여 넣은 것이다. 코드는 실제 창 컴포넌트를 그대로 그리고 CSS `scale`로 줄인다. 줄이는 비율은 창 크기에 따라 실행 중에 정해진다.
  - 같은 앱의 창은 기기와 상관없이 같은 방법으로 만든다. 예: `Window/Explorer`의 `Device=Desktop`·`Mobile`은 둘 다 WindowFrame 위에 만든다.

  코드:
  - 조립은 앱의 컴포넌트다. 피그마 속성은 props, 피그마 슬롯은 자리 prop(`children`이나 `ReactNode` prop)이다.
  - 안쪽 컴포넌트의 빈 자리(슬롯)는 바깥 컴포넌트가 prop으로 받아 넘긴다. 예: SearchResults는 안쪽 BestMatchCard를 `card` prop으로 통째로 받는다(카드의 속성과 슬롯을 다시 열지 않는다).
  - 큰 조립은 영역의 자리만 갖고, 안에 들어갈 조립은 쓰는 쪽이 넣는다.
  - 개수가 정해지지 않은 목록(메뉴 항목, 결과 목록)은 배열 prop으로 받는다.
  - 구조가 같은 조립 여럿(예: 우클릭 메뉴들)은 코드 컴포넌트 하나에 데이터만 다른 스토리 여럿으로 둔다.
  - 메뉴 항목 목록은 항목을 만드는 함수 하나를 실제 기능과 조립 스토리가 함께 쓴다. 그래야 조립 스토리가 실제 메뉴(글자·아이콘·순서·구분선·분기)를 그린다. 둘 이상의 기능이 쓰는 항목 정의는 `shared/`에 둔다.
  - 조립의 구조(감싸기, 슬롯, 배치, 스크롤 영역 등)는 코드가 스스로 정한다. 피그마 레이어 구조를 그대로 옮기지 않는다.
  - 조립의 크기는 변수 없는 숫자일 수 있지만, 여백·간격과 그 밖의 시각 값은 토큰 클래스로 옮긴다([[디자인 시스템:토큰 사용 강제]]).
  - 조립마다 앱 Storybook에 스토리를 둔다. 조립 스토리의 데이터를 피그마 조립과 똑같이 맞추지 않는다. 기능은 `play` 동작 스토리로 확인하고, 생김새는 피그마 그림이 참고용 기준이다.
  - 지금 화면에서 쓰지 않는 조립도 앱 코드의 짝이라 남긴다.
커서: |
  Windows 화면과 웹 페이지 영역의 커서를 나눈다.

  - Chrome 창 안의 글 페이지(웹 페이지 영역)에서 누를 수 있는 요소는 손가락 커서(`cursor: pointer`)다. 목차 항목과 목차 접기·펼치기, 이전·다음 카드, 검색 결과 줄, 새 탭 바로가기, 코드 복사 버튼, 본문 링크가 해당한다. 실제 웹 페이지와 같다.
  - Windows 화면(작업 표시줄, Start, 메뉴, 탐색기, 창 버튼, Chrome 탭·도구 모음)은 실제 Windows처럼 화살표(`default`) 그대로이고, 누를 수 있다는 것은 호버 배경으로 알린다. 그래서 누를 수 있는데 호버 배경이 없는 요소를 두지 않는다.
  - 이 규칙은 누를 수 있다는 표시에 관한 것이다. 글자 입력칸, 크기 조절, 끌기 중 옮길 수 없는 곳([[항목 조작:끌기]])의 커서는 따로 정한 대로 둔다.
겹쳐 놓기: |
  요소를 다른 요소 위에 겹쳐 놓는 경우를 넷으로 나눈다.

  1. 장식: 포커스 테두리처럼 컴포넌트 모양에 딸린 장식은 겹쳐 놓은 레이어가 아니라 그 레이어의 선이나 효과 스타일이다. 코드는 [[디자인 시스템:컨트롤 테두리 구현]], [[디자인 시스템:포커스 구현]]으로 그린다.
  2. 실행 중에 정해지는 값: 창과 바탕화면 아이콘의 위치, 선택 상자(SelectionMarquee)의 위치와 크기, 스크롤바 막대의 위치와 길이는 앱 코드가 실행 중에 정한다. 컴포넌트 원본에는 기본값만 크기 변수로 있다.
     코드는 브라우저 스크롤바를 숨기고 Scrollbar를 겹쳐 그리는 ScrollArea로 넘치는 영역을 감싼다. Scrollbar는 내용이 넘치면 가는 선이 늘 보이고(스크롤하는 동안도), 스크롤바 칸에 마우스를 올렸을 때만 두꺼운 막대와 위·아래 화살표로 펼친다. 끄는 동안은 칸 밖이어도 펼친 채다. 실제 Windows와 같고, 피그마 Scrollbar `State=Expanded`가 이 펼친 모습이다.
     예외로 Chrome 창 안 웹 페이지(글 페이지 영역, 코드 블록·수식의 가로 스크롤 포함)는 꾸미지 않은 브라우저 기본 스크롤바를 쓴다. 실제 브라우저 스크롤바가 곧 실제 Chrome 스크롤바이기 때문이다. 목차는 글 페이지 안이지만 디자인한 UI 부품이라 ScrollArea를 쓴다([[Chrome:글 화면]]).
  3. 진짜 겹침(배지, 검색창 밑줄 등): 자동 배치 안의 절대 위치(ABSOLUTE) 자식이다. 제약은 왼쪽·위(MIN), 오른쪽·아래(MAX), 양쪽 늘이기(STRETCH), 가운데(CENTER)만 쓰고, 양쪽 늘이기 축의 크기는 부모에서 나온다. 예: SearchBox `bottom border`는 가로 양쪽 늘이기, 세로 아래, 거리 0이고, 루트가 내용 자르기를 켜 둥근 끝에서 밑줄이 일자로 잘린다.
  4. 트리거에 붙는 팝업: [[디자인 시스템:팝업]]을 따른다.
크기 변수: |
  피그마의 크기를 코드로 옮길 때, 크기가 변수에 연결돼 있는지로 뜻을 나눈다.

  - 고정 크기: 크기 변수에 연결한 고정(FIXED) 크기다. 고정 크기로 내보내고 코드는 그 토큰 클래스를 쓴다([[디자인 시스템:구조 검사]]).
  - 견본 크기: 컴포넌트 원본(안쪽 레이어 포함)에 변수 없는 숫자로 준 폭·높이다. 부모 채움(FILL) 컴포넌트를 혼자 보이게 하려는 크기라 코드는 이 크기를 갖지 않는다. `Figma` 스토리의 `FigmaFrame`이 `export.json`의 숫자로 이 크기를 준다([[테스트 작성 규칙:스토리 테스트]]). 변수를 빠뜨린 진짜 고정 크기는 구조 검사로 잡지 못한다.
  - 조립과 화면 안의 크기(루트, 프레임, 인스턴스에서 덮어쓴 고정·최소·최대 크기)는 변수 없는 숫자일 수 있다. 간격·여백은 그대로 토큰이다([[디자인 시스템:조립]]).
  - 화면 크기 토큰은 코드가 실제로 쓰는 값(예: `window-rules.ts`가 쓰는 값)만 있다. 스토리에서만 쓰는 크기는 토큰이 아니다.
  - 실행 중에 정해지는 크기(스크롤바 막대 길이, 선택 상자 크기)는 원본에 기본값 변수만 있다([[디자인 시스템:겹쳐 놓기]]).
  - 절대 위치 자식의 양쪽 늘이기 축 크기는 변수에 연결하지 않는다.
  - 배율(`scaleFactor`가 1이 아님) 인스턴스 자체의 크기는 변수에 연결하지 않는다. 크기는 그것을 담는 칸이 변수로 지킨다([[디자인 시스템:구조 검사]]).
  - 선 두께는 크기 변수가 아니라 `stroke-width/*`다.
  - 코드와 피그마 어디에서도 쓰지 않는 토큰은 지운다. 피그마 쪽은 컴포넌트·조립·화면에서 쓰는지로 센다. 토큰 생성이 요구하는 화면 경계값은 쓰는 곳이 없어도 남긴다([[디자인 시스템:토큰 생성]]).
토큰 생성: |
  피그마의 모든 변수와 스타일(색, 간격, 크기, 반경, 선 두께, 불투명도, 서체, 모션, 그림자, 그라데이션, 글자 스타일, 재질)을 변환 스크립트가 `figma/tokens.json`에서 `src/tokens.css`로 만든다. `tokens.css`는 생성 파일이라 손으로 고치지 않는다.

  - 변환 스크립트는 `packages/design-system/scripts/tokens/`에 두고(`generate:tokens`), 변환 핵심은 Node와 피그마 API를 쓰지 않는 함수로 만든다. 플러그인도 같은 함수로 `tokens.css`를 만든다([[디자인 시스템:피그마 플러그인]]).
  - `tokens.json`은 W3C 디자인 토큰 형식(DTCG)이다. 토큰마다 `$value`와 `$type`을 두고, 다른 토큰을 가리키는 값은 경로로 남긴다. 글자 스타일과 효과·칠 스타일도 같은 파일에 넣는다.

  이름:
  - CSS 변수 이름은 `--`에 피그마 경로를 `-`로 이은 것이다. 스타일도 같다. 소문자로 바꾸고, 공백과 괄호는 `-`로 바꾸고, 이어진 `-`는 하나로 줄인다. 예: `spacing/sm` → `--spacing-sm`, `Surface/Flyout (Acrylic)` → `--surface-flyout-acrylic`.
  - 서로 다른 토큰이 같은 CSS 이름이 되면 생성이 실패한다. 피그마에서 이름을 고친다.
  - 피그마 변수의 code syntax(Web)는 이 CSS 이름으로 `var(--<이름>)`처럼 둔다. 피그마 MCP와 Dev Mode가 이 값을 변수 이름으로 보여 주므로, 다르면 구현할 때 없는 이름을 읽게 된다. 변수 이름을 바꾸면 code syntax도 함께 바꾼다.
  - 다른 변수가 속한 그룹의 이름이기도 한 변수(`color/white`와 `color/white/70`)는 그 그룹의 `$root` 토큰(`color.white.$root`)으로 내보내고, 별칭은 `{color.white.$root}`로 쓴다. CSS 이름은 그룹 이름 그대로(`--color-white`)다.
  - 클래스는 `@theme`의 변수와 `@utility`로 만든다. 이름공간은 피그마 경로의 첫 마디다.
    - 클래스는 유틸리티 + 변수 경로 전체다(`p-spacing-sm`, `rounded-radius-control`, `rotate-rotate-half`). 색과 스타일도 원래 이름 전체를 쓴다(`text-color-black-89`, `shadow-elevation-flyout`).
    - 경로 이름 변수(`--spacing-sm`)는 `:root`에 두고, 클래스는 @theme의 별칭 `--<이름공간>-<경로 전체>: var(--<경로 전체>)`(`--spacing-spacing-sm`)가 만든다. Tailwind 기본 유틸리티와 `@utility`가 그대로 읽으므로 음수(`-top-spacing-sm`), 구간 변형(`laptop:`), lint, `cn`이 따로 작업 없이 된다.
    - 경로 이름 변수가 코드 이름(code syntax)이다. 값을 바꾸는 `@media`는 이 변수를 덮는다.

  | 피그마 경로 | 이름공간(별칭 앞부분) | 클래스 예 | 값 |
  |---|---|---|---|
  | `color/*` | `--color` | `text-color-black-89`, `bg-color-white-70`, `border-color-black-6`, `inner-border-color-black-6` | 색 |
  | `spacing/*` | `--spacing` | `p-spacing-sm`, `-top-spacing-sm` | px |
  | `size/*` | `--size` | `w-size-control-height`, `min-w-size-none` | px |
  | `radius/*` | `--radius` | `rounded-radius-control` | px |
  | `stroke-width/*` | `--stroke-width` | `border-stroke-width-default`, `outline-stroke-width-default`, `inner-border-w-stroke-width-default` | px |
  | `opacity/*` | `--opacity` | `opacity-opacity-cut` | % |
  | `blur/*` | `--blur` | `blur-blur-acrylic` | px |
  | `font/weight/*` | `--font-weight` | `font-font-weight-semibold` | 숫자 |
  | `font/family/*`, `font/size/*`, `font/line-height/*` | 없음(`:root`) | 글자 스타일이 쓴다 | |
  | `motion/*`(시간, 이징, 배율, 지연) | 없음(`:root`) | `motion.css`의 모션 클래스가 `var()`로 쓴다([[디자인 시스템:모션 클래스]]) | |
  | `rotate/*`(코드 전용) | `--rotate` | `rotate-rotate-half`, `-rotate-rotate-quarter` | deg |
  | `layer/*`(코드 전용, 겹쳐 놓는 순서) | `--z-index` | `z-layer-window` | 숫자 |
  | `line-clamp/*`(코드 전용) | `--line-clamp` | `line-clamp-line-clamp-two` | 숫자 |
  | `ratio/*`(코드 전용) | `--aspect` | `aspect-ratio-wide` | 숫자 |
  | `position/*`(코드 전용) | `--inset`, `--translate` | `top-position-half`, `-translate-y-position-half` | % |
  | `grid/*`(코드 전용) | `--grid-column-start`, `--grid-row-start` | `col-start-grid-start` | 숫자 |
  | `border-spacing/*`(코드 전용) | `--border-spacing` | `border-spacing-border-spacing-none` | px |
  | `shrink/*`(코드 전용) | `--shrink`와 `@utility shrink-*` | `shrink-shrink-none` | 숫자 |
  | `flex/*`(코드 전용) | `--flex`와 `@utility flex-*` | `flex-flex-fill` | 숫자 |
  | `breakpoint/*`(코드 전용) | 클래스 없음(`:root`) | `laptop:`, `mobile:` | px |

  - 색의 안쪽 선 고리(`inner-border-color-*`, [[디자인 시스템:컨트롤 테두리 구현]])는 Tailwind 기본 유틸리티가 없어 `--color-*`를 읽는 `@utility inner-border-*`를 더한다.
  - `shrink`와 `flex`는 Tailwind 기본 유틸리티가 테마를 읽지 않아 `@utility`를 더한다. 기본 유틸리티(`shrink-0`, `flex-1`, `flex`)와 함께 있어도 된다.
  - 문자 변수: STRING 변수는 `font/family/*`, `font/weight/*`, `motion/*`, 코드 전용 묶음에만 쓴다. 코드 전용 묶음과 `motion/*`의 값은 `$type: string`으로 담아 CSS에 그대로 옮긴다. 그 밖의 이름은 내보내기를 막는다. FLOAT 변수의 `$type`도 이름으로 정한다. 코드 전용 묶음은 `number`이고 단위는 위 표를 따른다.

  스타일:

  | 피그마 | CSS 변수 | 클래스 |
  |---|---|---|
  | 글자 스타일(`Body Strong` 등) | 없음 | `type-body-strong`(연결된 서체·크기·굵기·줄 높이·자간 변수를 함께 건다). 기울임과 글자 장식이 있는 스타일은 `font-style: italic`, `text-decoration-line: underline`·`line-through`도 함께 건다. `tokens.json`에는 `$extensions.com.seojaewan`의 `fontStyle`·`textDecoration`으로 담고, 기본값(normal·none)이면 적지 않는다. 피그마 글꼴 스타일 이름 끝의 `Italic`은 기울임으로, 앞부분은 굵기로 읽는다 |
  | 글자 스타일 `Hangul/*` | 없음 | 만들지 않는다. 같은 이름의 라틴 스타일과 연결 변수가 같아야 하고, 다르면 생성이 실패한다([[디자인 시스템:서체 구현]]) |
  | 효과 스타일(그림자만) | `--<이름>`(상자), `--shadow-text-<이름>`(글자) | `shadow-<이름>`(상자), `text-shadow-<이름>`(글자) |
  | 효과 스타일(배경 블러만) | `--<이름>` | `backdrop-blur-<이름>` |
  | 효과 스타일 `Surface/*`(그림자 + 배경 블러) | `--surface-<이름>-shadow`, `--surface-<이름>-backdrop-blur` | `surface-<이름>`(둘을 함께 건다) |
  | 칠 스타일(그라데이션) | `--<이름>` | `border-gradient-<이름>`([[디자인 시스템:컨트롤 테두리 구현]]) |

  옮기는 방법:
  - 별칭은 실제 값으로 풀지 않고 `var()` 참조로 남긴다. 스타일이나 다른 변수가 어느 원색을 가리키는지 CSS에서도 보이게 하기 위해서다.
  - 라틴 서체 변수에는 `font/family/korean`을 이어 붙인다. 코드 서체(`font/family/code`)는 한글이 든 서체라 이어 붙이지 않는다([[디자인 시스템:서체 구현]]).
  - 선형 그라데이션은 피그마 칠의 방향(`gradientTransform`)을 CSS 각도(소수 첫째 자리로 반올림)로 옮긴다. 위에서 아래 방향은 `to bottom`이다. 정지점 위치는 CSS 그라데이션 선(상자 모서리를 지나는 선)에 맞춰 옮긴다. 정사각형 상자에서는 피그마와 같고, 정사각형이 아닌 상자에서는 근사다(위아래·좌우 방향은 어느 상자에서나 같다). 방향 정보가 없는 `tokens.json`은 위에서 아래로 읽는다.
  - 방사형은 `gradientTransform`의 역변환으로 가운데와 두 손잡이를 구해 `radial-gradient(ellipse <가로>% <세로>% at <x>% <y>%, ...)`로 옮긴다. 정규화 좌표에서 축이 기울어진 타원은 생성이 실패한다.
  - 각도형은 `conic-gradient(from <첫 손잡이 각도>deg at <x>% <y>%, ...)`로 옮긴다. 정사각형 상자에서는 피그마와 같고 아니면 근사다. 뒤집힌 각도형은 생성이 실패한다.
  - 다이아몬드 그라데이션은 대응하는 CSS가 없어 구조 검사가 막고, 칠 스타일에 있으면 생성도 실패한다.
  - 그라데이션 정지점 사이 색은 피그마가 투명도를 곱하지 않고 섞고, CSS는 투명도를 곱한 값으로 섞는다. 투명도와 RGB가 모두 다른 두 정지점 사이는 피그마 방식으로 계산한 중간 정지점을 넣는다.
  - 이징 변수(`EASING` 타입)는 곡선 값을 CSS `cubic-bezier(x1, y1, x2, y2)`로, 직선(LINEAR)은 `linear`로 옮긴다.
  - 재질은 배경 블러 효과 스타일과 반투명 바탕색 변수로 나눠 옮긴다([[디자인 시스템:재질 구현]]).
  - 그림자만 있는 효과 스타일은 상자용 `shadow-*`와 글자용 `text-shadow-*`를 함께 만든다. 피그마에서 글자 레이어에 건 그림자는 글자 모양을 따라가므로 `text-shadow-*`를 쓴다. 퍼짐(spread)이 있는 그림자는 text-shadow로 옮길 수 없어 `text-shadow-*`를 만들지 않는다. `--text-shadow-*`는 글자 크기 이름공간(`--text-*`)과 겹치므로 글자용 변수는 `--shadow-text-<이름>`이다.
  - Tailwind 기본 테마 값(색상, 간격, 서체, 글자 크기, 줄 높이, 반경, 그림자, 블러, 이징, 애니메이션, 구간)은 `tokens.css` 맨 앞의 `--*: initial`로 지우고 디자인 토큰 이름으로만 쓴다. Tailwind는 `initial`보다 앞에 정의된 같은 이름공간 변수를 지우므로, 지우기가 토큰보다 먼저 와야 한다.
  - 토큰은 세 블록에 나눠 둔다.
    - `@theme`: Tailwind 기본 테마 값 지우기와 기본 서체(`--default-font-family`)만 둔다.
    - `:root`: 클래스로 쓰지 않는 변수(글자 스타일만 쓰는 서체 값, 경로 이름 변수 등)를 둔다. Tailwind는 `@theme` 안의 변수로만 클래스를 만들므로, 여기 둔 변수는 컴포넌트가 클래스로 쓸 수 없다.
    - `@theme static`: 클래스가 읽는 변수를 둔다. `static`은 유틸리티에서 쓰지 않은 변수도 CSS에 남겨, 손으로 쓴 CSS와 인라인 스타일이 `var()`로 참조할 수 있게 한다.
  - 규칙이 없는 변수 묶음이나 스타일 종류(예: `font/stretch/*`)를 만나면 생성이 실패한다. 이 섹션에 규칙을 먼저 정한다.

  화면 크기:
  - 경계값은 `breakpoint/mobile/width`, `breakpoint/laptop/width`, `breakpoint/laptop/height` 셋이고, 하나라도 빠지면 생성이 실패한다. 값은 "이 값 미만"이라 CSS에서는 1을 뺀다. 구간의 뜻은 [[반응형:기준]]에 있다.
  - 경계값이 있으면 블록 형식 `@custom-variant` `laptop:`·`mobile:`을 만든다. 한 줄 형식은 쉼표에서 잘려 깨진다. 모바일 판정이 먼저라 노트북 조건은 모바일 폭을 뺀다(`(min-width: 768px) and (max-width: 1599px), (min-width: 768px) and (max-height: 899px)`). 그래서 어느 창 크기든 `pc | laptop | mobile` 가운데 하나에만 든다.
  - 변수 모드: 컬렉션의 기본 모드 값이 토큰 값이고, 다른 모드에서 값이 다른 변수는 `$extensions.com.seojaewan.modes`에 담는다. `Laptop` 모드 값은 노트북 조건의 `@media` 안 `:root`로 경로 이름 변수를 덮는다. 다른 모드 이름은 규칙이 없어 생성이 실패한다.
  - 클래스는 `:root` 값이 바뀌면 따라가므로 컴포넌트에 구간별 분기를 두지 않는다. 실행 중 계산에 쓰는 값(창 기본 크기)은 숫자로 옮기지 않고 `:root` 변수에서 읽는다.
  - `generate:tokens`와 플러그인이 `src/token-names.ts`를 함께 만든다. `TOKEN_NAMES`(@theme 이름공간마다 든 토큰 이름, `cn`이 쓴다)와 `BREAKPOINTS`(경계값 px, 패키지 진입점이 내보낸다)다. 손으로 고치지 않는다.

  앱 CSS 연결:
  - 앱은 디자인 시스템의 `tokens.css`를 가져다 쓰고, `@source`로 디자인 시스템 소스를 읽어 해당 소스의 클래스도 생성한다.
토큰 사용 강제: |
  토큰은 `tokens.css`에서만 정의하고, 코드는 토큰 클래스만 쓴다. 토큰에 없는 값이 필요하면 피그마부터 고친다.

  - Stylelint의 `at-rule-disallowed-list`로 `@theme`, `@utility`, `@custom-variant`를 막고, `overrides`로 `tokens.css`만 풀어 준다. 다른 CSS에서 토큰을 새로 정의하거나 덮어쓰지 못하게 하기 위해서다.
  - class 안의 값은 ESLint `better-tailwindcss`가 막는다. 모르는 클래스(`no-unknown-classes`)와 임의 값(`bg-[#fff]`, `p-[13px]`)은 lint 오류다.
  - JSX `style={{ … }}` 자리에 바로 쓴 객체(조건식·논리식이 고른 객체 포함)의 값 자리에 리터럴(문자열·숫자)을 쓰면 lint 오류다. 끌기 위치처럼 실행 중에 계산하는 값(변수·식)만 허용한다. 변수에 담아 넘긴 객체(`style={widthStyle}`)는 검사에서 빠지므로, 리터럴 값을 담은 style 객체를 변수로 만들지 않는다.
  - 토큰이 될 수 없는 CSS 기능(예: `scrollbar-width: none`)은 디자인 시스템의 `reset.css`(`theme.css`가 불러온다)에 속성 선택자로 둔다(`[data-scrollbar-hidden]`). 컴포넌트는 그 속성만 단다.
  - 토큰 이름의 첫 마디가 Tailwind 기본 이름공간과 겹치면(예: `--text-*`는 글자 크기 이름공간이다) Tailwind 기본 유틸리티가 그 변수를 다른 속성으로 읽은 클래스를 함께 만든다. 이런 클래스는 `no-restricted-classes`로 막는다. 목록은 `tokens.css`를 Tailwind에 넣어 보고 자동으로 모으며, 테스트가 지킨다.
  - 클래스에 숫자 값을 직접 쓰지 않는다. 숫자로 끝나는 클래스 가운데 Tailwind 기본 숫자 클래스(`shrink-0`, `rotate-180`, `z-10`, `w-1/2`, `aspect-3/2`, `mask-l-from-50%`), 투명도 덧붙임(`bg-x/50`), 토큰에 없는 이름을 `no-restricted-classes`로 막고, 변형이 붙어도 같다. `tokens.css` 토큰 이름에서 나온 클래스는 이름이 숫자로 끝나도(`text-color-black-89`, `bg-color-white-70`) 허용한다. `rounded-full`, `w-full`처럼 숫자가 아닌 기본 클래스는 해당하지 않는다. 숫자가 필요하면 피그마에 이름 있는 변수를 더한다.
  - 움직임은 `motion-*` 클래스로만 준다([[디자인 시스템:모션 클래스]]). `duration-`·`ease-`·`delay-`·`transition`·`animate-`로 시작하는 클래스를 `no-restricted-classes`로 막고, `motion-*` 클래스를 쓰라고 알린다. Tailwind 기본 유틸리티(`duration-150`)는 숫자를 그대로 ms로 쓰기 때문이다.
  - 클래스는 `cn`으로 조합한다. 조건부 클래스를 합치고 같은 속성의 클래스가 겹치면 뒤의 것을 남기며, 컴포넌트는 기본 클래스 뒤에 사용처의 `className`을 넘겨 사용처가 덮어쓸 수 있게 한다. `cn`은 생성한 이름 목록(`src/token-names.ts`)으로 디자인 토큰 이름을 안다. 앱도 패키지가 내보낸 `cn`을 쓴다.
  - lint는 JSX `className`과 이름이 `ClassName`으로 끝나는 속성, `cn`의 인자, 이름이 `ClassName`·`CLASS_NAME`(복수 포함)으로 끝나는 변수의 값(문자열, 배열, 객체), 객체 속성 `className`의 값(`{ className: '…' }`)을 `.ts`·`.tsx`에서 검사한다(`*.test.*`는 뺀다). 클래스 문자열은 이 다섯 중 한 곳에 쓴다. `.join()` 앞의 배열은 lint가 읽지 못해 `className` 안의 `.join()`을 `no-restricted-syntax`로 막는다.
  - `@utility`로 만든 클래스를 lint가 아는 클래스로 보는지, `cn` 안의 모르는 클래스를 막는지는 테스트로 지킨다.
서체 구현: |
  서체와 글자 스타일의 이름과 뜻은 피그마 글자 스타일·변수의 description에 있다.

  - 웹에서는 `font-family: 'Open Sans', 'Pretendard'`로 둔다. Open Sans에는 한글이 없으므로 브라우저가 글자마다 라틴은 Open Sans, 한글은 Pretendard로 그린다. 피그마는 서체에 없는 글자를 다른 서체로 대신 그리지 못해 한글용 `Hangul/*` 글자 스타일이 따로 있지만, 코드는 라틴 스타일의 `type-*` 하나로 표현한다.
  - 코드 서체는 `font-family: 'NanumGothicCoding'` 하나로 두고 Pretendard를 대체로 두지 않는다. 한글이 든 고정폭 서체 하나로 코드의 라틴과 한글을 모두 그린다.
  - 모든 서체는 웹 폰트로 제공한다(`@fontsource/nanum-gothic-coding` 등). 토큰 값이 피그마 서체 이름으로 오므로, 생성하는 `@font-face` 이름을 피그마 이름에 맞춘다. Open Sans Italic도 제공해 브라우저가 기울임을 흉내 내지 않게 한다.
  - Pretendard에는 기울임 글꼴이 없어 `theme.css`의 `font-synthesis-style: none`으로 브라우저가 한글을 기울여 흉내 내는 것을 막는다.
  - 밑줄·취소선이 있는 글자는 글자에 직접 넣지 않고 그 장식이 든 글자 스타일 클래스(`type-body-large-link` 등)를 쓴다.
  - 피그마와 Chromium의 글자 기준선 차이의 영향과 허용 범위는 [[한계:글자 기준선]]에 있다.
재질 구현: |
  재질의 값은 피그마 Material 변수·스타일에 있다. 재질은 배경 흐림과 반투명 바탕색 한 겹이다.

  - Acrylic과 Mica는 같은 요소에 바탕색 클래스(`bg-*`)와 배경 블러 클래스(`backdrop-blur-material-*`)를 건다. 의사 요소나 쌓임 순서 제약이 없다.
  - 코드는 색 변수의 투명도를 쓴다. 피그마는 변수 색을 연결할 때 그 투명도를 칠 불투명도로 옮겨 오고, 그린 결과에는 칠 불투명도만 적용된다. 그래서 피그마에서 연결한 뒤 칠 불투명도를 따로 바꾸지 않아야 코드와 같다.
  - 같은 재질 위에서 밝기를 나누는 덧칠(반투명 흰색)과 띠 사이 구분선은 컴포넌트가 아니라 조립에 직접 그린다([[디자인 시스템:조립]]).
  - 피그마 배경 블러와 브라우저 `backdrop-filter`는 계산 방식이 달라 같은 값도 모습이 조금 다르다.
  - 그림자와 배경 블러는 효과 스타일로만 쓴다. 그림자는 투명한 부분 뒤에 표시하지 않는다(showShadowBehindNode 끔, [[디자인 시스템:구조 검사]]). CSS `box-shadow`도 요소 안쪽에는 그림자를 그리지 않으므로 반투명 표면 안쪽에 그림자가 비치지 않는다.
컨트롤 테두리 구현: |
  테두리의 모양은 피그마 컨트롤 테두리 칠 스타일과 그 description에 있다.

  - 변환 스크립트가 이 스타일을 CSS 그라데이션 값으로 옮긴다([[디자인 시스템:토큰 생성]]). 피그마 정지점 위치는 노드 높이 대비 비율이라 CSS에서도 같은 비율(`to bottom`, 90.58% 등)로 둔다. 그래서 피그마와 같은 높이의 컨트롤에서 같은 결과가 나온다.
  - 코드에서는 `border-gradient-*` 유틸리티로 그린다(예: `border-gradient-elevation-control-border`). 요소의 `::before`를 고리 모양으로 가리고 그라데이션을 칠한다. 고리 두께는 피그마 선 두께 변수에 대응하는 `inner-border-w-<두께 토큰>`(예: `inner-border-w-stroke-width-default`)으로 함께 정한다.
  - 피그마 안쪽 선(inside stroke)처럼 요소 크기 안에, 자식 위에 그린다. 피그마는 프레임의 선을 절대 위치 자식(예: SearchBox의 포커스 아래 선)보다도 위에 그리므로 `::before`는 `z-index: 1`이다. `::before`가 요소에 맞춰지도록 요소에 `relative` 같은 위치 지정이, 고리가 요소 밖의 형제를 덮지 않도록 쌓임 맥락(`isolate`)이 있어야 한다.
  - 단색 안쪽 선은 같은 방식의 `inner-border-*` 유틸리티로 색 토큰 이름으로 그린다(예: `inner-border-color-black-6`). 두께는 그라데이션 선과 같이 `inner-border-w-<두께 토큰>`으로 정한다. Pressed·Disabled처럼 상태에 따라 그라데이션 선과 단색 선을 바꾸는 컨트롤이 같은 자리에 그리게 하기 위해서다.
  - 피그마에서 선이 레이아웃에 들어가는 프레임(strokes included in layout, 예: Flyout)은 CSS `border`와 같으므로 `border`를 쓴다.
포커스 구현: |
  포커스 선의 모양은 피그마 포커스 선 변수·스타일과 그 description에 있다.

  - 코드는 바깥쪽 선을 Tailwind outline 유틸리티로 그린다. 색은 `outline-<색 토큰>`, 두께는 `outline-<두께 토큰>`이다(예: `outline-color-black-89 outline-stroke-width-focus-outer`). Tailwind v4에는 `outline-w-*`가 없고 outline 유틸리티가 색과 두께를 모두 받는다. CSS outline은 레이아웃 크기를 바꾸지 않고 요소 바깥에 그려져 피그마 바깥쪽 선과 같다.
  - `FileItem`·`FileRow`의 포커스 선은 피그마에서 크기에 넣지 않고 안쪽에 겹치는 단색 선이라 outline이 아니라 `focus-visible:inner-border-*`로 그린다([[디자인 시스템:컨트롤 테두리 구현]]). 브라우저 기본 외곽선은 `outline-none`으로 끈다.
회전 구현: |
  쓰는 각도와 쓰는 곳은 코드 전용 변수 `rotate/*`의 description에 있다.

  - 회전은 코드 전용 변수 `rotate/*`(예: `rotate/quarter`, `rotate/half`)로 이름을 얻고, 코드는 `rotate-rotate-half`처럼 쓴다. 변수 값은 CSS 각도(도)다.
  - 피그마는 반시계 방향이 양수이고 CSS는 시계 방향이 양수라 부호가 반대다(피그마 90° → CSS -90°). 플러그인은 노드 회전을 CSS 각도(0~360)로 바꿔 같은 값의 변수와 짝짓는다(피그마 -90° → `rotate/quarter`, 피그마 180° → `rotate/half`).
  - 다른 각도는 대응하는 클래스가 없고 임의 값을 쓸 수 없어 플러그인이 막는다([[디자인 시스템:구조 검사]]).
모션 견본: |
  피그마에서 움직임을 찾는 곳이다. 움직임은 그 움직임이 일어나는 자리에 키프레임으로 걸려 있다. 시간·이징·배율 값은 `Motion` Variables 컬렉션에 있고, 값 하나의 뜻은 그 변수의 description에 있다.

  - 안쪽이 움직이는 것(ProgressRing의 호, 이미지 스켈레톤의 반짝임, 검색 돋보기 강조): 컴포넌트·자산 원본에 건다. 인스턴스 안쪽 레이어에는 키프레임을 걸 수 없기 때문이다. 예: 호는 자산 원본 `progress-ring/Arc`, 돋보기 강조는 자산 원본 `icon-color/Search Focus`에 있다.
  - 요소 전체가 움직이는 것(창·패널·메뉴 열기·닫기)과 여러 곳이 함께 쓰는 움직임(끌어서 순서 바꾸기 등): 조립의 프로토타입 흐름이 도착하는 프레임 안 인스턴스에 건다. 원본 루트에 걸면 그 컴포넌트의 모든 인스턴스에서 늘 재생되기 때문이다. 키프레임은 그 인스턴스에만 걸리고 원본과 다른 인스턴스로 번지지 않는다.
  - hover·pressed·focus 전환은 컴포넌트 변형 사이 프로토타입 전환이다.
  - 반복 여부는 움직임을 담은 프레임의 재생 설정 Loop다(한 번만 도는 움직임은 꺼져 있다).
  - 실행 중 값이 들어간 움직임은 대표값으로 그려져 있고, 실제 값이 무엇으로 정해지는지는 그 레이어의 Development 주석에 있다. 예: 최소화는 작업 표시줄 버튼 자리로 줄어드는 대표 움직임이다.
  - 움직임이 언제 시작되는지는 조립의 프로토타입이 보여 주고, 정확한 조건은 화면별 기능 문서가 정한다.
  - 모션 클래스 이름은 흐름 프레임 이름이고, 원본 안 움직임은 원본의 Development 주석에 적은 `motion-…` 한 줄이다.

  ProgressRing의 호 자산 `progress-ring/Arc`는 끝점을 잇지 않은 열린 원 경로(선, 둥근 끝)이고, 회전(`ROTATION`)과 경로 트림(`PATH_TRIM_START`·`PATH_TRIM_END`) 키프레임이 걸려 있다. 키프레임 기본값(baseValue)은 멈춘 호 모습이라 피그마 PNG와 애니메이션을 끈 코드 그림이 같다. 코드로 옮기는 방법은 [[디자인 시스템:모션]]에 있다.
모션 클래스: |
  모든 움직임은 디자인 시스템 패키지의 `src/motion.css`(손으로 쓰는 파일)에 이름 붙은 `motion-*` 클래스로 두고, 컴포넌트와 앱은 클래스만 붙인다. 어떤 움직임이 있는지는 `motion.css`의 클래스 목록과 모션 스토리(`Motion/<이름>`)가 보여 준다.
  컴포넌트에서 `duration-*`·`ease-*`를 직접 쓰지 않는다. 움직임을 한 곳에서 관리해 피그마의 움직임과 맞추기 위해서다. Stylelint는 `@keyframes`와 `motion-*` 클래스 정의를 `motion.css`에서만 허용한다.

  클래스는 두 종류다. 예외로 검색 돋보기의 정지 배율(`motion-search-box-focus-rest`)은 정지 값만 갖는 클래스다.
  - 상태 전환(hover·pressed·focus): transition 설정(속성·시간·이징)만 갖는다. 바뀐 뒤의 값(색 등)은 컴포넌트가 가진다. 예: `motion-control-state`. 들어갈 때와 나올 때가 다른 전환도 클래스 안에서 처리한다.
  - 그 밖의 움직임(등장·퇴장·이동·반복): 키프레임과 그것을 실행하는 animation을 한 클래스에 둔다. 예: `motion-window-open`, `motion-progress-ring`.

  값:
  - 시간·이징·배율처럼 토큰이 있는 값은 클래스 안에서 `var(--motion-*)`로 쓴다. 키프레임의 구성은 피그마를 보고 손으로 옮긴다([[디자인 시스템:모션]]).
  - 이징은 요소 쪽 `animation-timing-function`(또는 `animation` 줄)에 둔다. `@keyframes` 안 `animation-timing-function`의 `var()`는 Chromium이 무시하고 `ease`로 재생하므로 쓰지 않는다. 그래서 한 animation 안에서 구간마다 다른 이징은 쓸 수 없다. 트랙(항목)끼리 이징이 다르면 `animation`을 쉼표로 여러 개 두고 animation마다 요소 쪽 이징을 쓴다.
  - 실행 중에 정해지는 값(최소화 도착 위치, 최대화·스냅의 이전 위치·크기)은 앱이 CSS 변수로 넘기고 키프레임이 그 변수를 쓴다. 어느 값이 실행 중 값인지는 그 레이어의 Development 주석에 있다.

  최대화·복원·스냅은 FLIP 방식이다.
  1. 이전 위치·크기를 잰다.
  2. 창을 바로 새 상태로 바꾼다.
  3. transform으로 이전 자리·크기에 맞춘다.
  4. transform을 없애는 애니메이션을 재생한다.

  움직이는 동안 내용이 늘어나는 영향은 [[한계:최대화·스냅 중 내용 늘어남]]에 있다.

  사라지는 요소(창 닫기, 패널·메뉴 닫기):
  - 저장소에서는 바로 지우고, 화면에서만 애니메이션이 끝날 때까지 남긴다. 그래서 "맨 앞 창을 닫으면 최근 창이 앞으로" 같은 규칙([[창 동작:창 조작]])이 바로 적용된다.
  - 앱의 공통 훅(예: `usePresence`)이 Base UI처럼 `data-starting-style`·`data-ending-style`을 붙이고, `element.getAnimations()`가 모두 끝나면 요소를 뺀다. 기다릴 애니메이션이 없거나 `getAnimations`가 없는 환경(jsdom)이면 바로 뺀다.
  - Base UI 팝업(메뉴·툴팁·플라이아웃·메시지 상자)도 같은 data 속성으로 같은 클래스를 쓴다.
  - 창이 열리는 도중에 닫으면 닫기 애니메이션이 처음부터 시작된다([[한계:열리는 도중 닫기]]).

  창을 드래그하거나 크기 조절하는 동안에는 움직임을 끈다.
  Start·검색 패널을 올리는 움직임은 패널 자체를 `translateY`로 올린다.
동작 줄이기: |
  동작 줄이기는 Windows의 "애니메이션 효과"를 끈 것과 같은 기준이다. 멈추면 정보가 사라지는 움직임만 남기고, 나머지 움직임은 움직임 없이 바로 바뀐다(스켈레톤 반짝임, 검색창 페이드, hover·pressed 색 전환 포함).

  - 남기는 움직임은 피그마에서 그 움직임에 단 Accessibility 카테고리 주석으로 나타낸다. 무엇을 남기는지는 그 주석이 기준이다. 플러그인이 이 주석을 내보낸 자료에 싣는다([[디자인 시스템:모션]]).
  - 진행 표시(ProgressRing)는 꼭 필요한 움직임으로 보고(WCAG 2.3.3 예외) 느리게 하지 않고 그대로 돌린다.
  - 재부팅 화면을 보여 주는 시간(`motion/delay/boot-screen`)은 필요한 로딩이라 그대로 둔다.
  - `prefers-reduced-motion: reduce`는 `motion.css` 한 곳에서 처리한다.
피그마 플러그인: |
  비공개 개발용 플러그인으로 `tools/figma-plugin`에 있다([[저장소 구성:구성]]). 화면은 [[디자인 시스템:플러그인 화면]]에 있다.

  - 검사·내보내기 핵심(`src/core`)은 피그마 API만 쓰고 GitHub와 UI를 모른다. 플러그인 UI와 피그마 MCP(`use_figma`)가 같은 핵심을 쓰고, MCP에서는 핵심을 스크립트 하나로 묶어 실행한다. AI 작업 세션이 피그마를 고친 뒤 플러그인으로 내보낼 때와 같은 검사 결과를 바로 볼 수 있게 하기 위해서다.
  - 내보내기 대상은 토큰 / 컴포넌트 / 조립 / 애니메이션 넷이다. 토큰만 따로 골라 내보낼 수 있다.
  - 토큰과 컴포넌트는 내보내기 전에 구조 검사를 하고, 위반이 있는 대상은 파일을 만들지 않는다. 조립은 구조 검사를 하지 않고 보고만 한다(아래 "조립 보고").
  - 컴포넌트는 이름에 `Components`가 든 페이지에서 찾는다. 페이지 바로 아래 섹션(SECTION)을 묶음, 그 안 섹션을 컴포넌트 묶음으로 읽고, 섹션 밖에 놓인 컴포넌트는 `묶음 밖`으로 묶는다. 조립은 노드 ID로 정한 조립 페이지에서 찾고 이름의 영역으로 묶는다. 이름이 점(`.`)으로 시작하는 컴포넌트와 코드 전용 컴포넌트 이름은 내보내지 않는다.
  - 내보내는 것:
    - 컴포넌트: 변형 이름, 변형마다 PNG(`figma/components/<컴포넌트>/<변형>.png`)와 PNG 안 노드 위치, 구현 참고용 레이어 트리
    - 조립: 변형 이름, 변형마다 PNG(`apps/web/figma/patterns/<영역>/<이름>/<변형>.png`)와 PNG 안 노드 위치, 조립 보고, 맨 바깥 프레임의 이름·크기 방식·크기(`tree`, 앱 스토리의 `FigmaFrame`이 쓴다)
    - 애니메이션: 움직임마다 `figma/motions/<이름>.json`([[디자인 시스템:모션]])
    - 그 컴포넌트와 조립이 쓰는 자산 파일([[디자인 시스템:자산]])
    - 토큰: `figma/tokens.json`과 같은 변환 함수로 만든 `src/tokens.css`, `src/token-names.ts`([[디자인 시스템:토큰 생성]])
  - 읽는 것: 변수·스타일의 모든 모드 값과 description(`@` 줄만 토큰에 담는다), 컴포넌트·변형 description, 레이어 주석과 그 카테고리(Development, Accessibility), 재생 설정 Loop, 변형 전환(`reactions`), 최대 줄 수와 말줄임, 프레임 스크롤 방향, 잠긴 비율, 선이 레이아웃에 들어가는지, 자산 경로와 색, 최소·최대 크기. description은 평문이다(`descriptionMarkdown`은 변수·스타일에서 오류가 난다). Variables는 플러그인 API로 읽는다. REST API의 Variables 엔드포인트는 Enterprise 플랜 전용이다.
  - PNG에는 그림자와 노드 밖으로 나온 자식까지 담기므로, PNG 안에서 노드가 놓인 위치와 노드 크기를 `export.json`에 함께 적는다.
  - 컴포넌트 `export.json`의 변형 항목에는 레이어·자동 배치·크기 방식·연결된 변수와 스타일(인스턴스 안 포함)·컴포넌트 속성·선이 레이아웃에 들어가는지·자산 경로와 색·줄임과 최대 줄 수·최소·최대 너비·비율·회전과 짝지은 변수를 담은 레이어 트리(`tree`)가 있고, 대상에는 description과 컴포넌트 속성 정의가 있다. 구현하는 사람이 읽는 자료이고 판정에는 쓰지 않는다.
  - 조립 보고(막지 않음): 그림(PNG), 사용한 컴포넌트와 그 변형·속성, 컴포넌트 밖에서 그린 것(바탕, 덧칠, 구분선 등), Foundations에 없는 값과 가까운 토큰, Development 주석으로 "표시용"이라고 적은 것(따로 분류), 움직임. 조립 프레임 안만 보고한다.
  - 다시 내보내면 그 대상 폴더의 PNG를 모두 새로 쓰고, 사라진 변형의 파일은 그 폴더에서만 지운다.
  - 토큰은 다른 대상을 내보낼 때도 매번 읽어 `main`의 `tokens.json`과 비교하고, 다르면 토큰 PR(`feat/figma-tokens`)을 열거나 갱신한다. 토큰 PR에는 바뀐 토큰을 쓰는 컴포넌트의 변형 PNG도 다시 내보내 넣는다. 같은 내보내기에 포함된 컴포넌트의 PNG는 그 컴포넌트 PR에만 넣는다.
  - PR 브랜치는 컴포넌트 `feat/figma-<컴포넌트>`, 조립 `feat/figma-patterns-<영역>`, 애니메이션 `feat/figma-motion-<이름에서 motion-을 뺀 이름>`이다. 같은 대상을 다시 내보내면 열린 PR의 브랜치에 이어서 커밋하고, 열린 PR이 없으면 `main`에서 새로 만든다. 컴포넌트 PR은 `figma/components/<컴포넌트>/`와 쓰는 자산만, 조립 PR은 `apps/web/figma/patterns/<영역>/`과 쓰는 자산만, 애니메이션 PR은 `figma/motions/<이름>.json`만 바꾼다.
  - 컴포넌트·조립 PR 본문은 맨 위 `## 변경`에 대상별 바뀐 변형 수 표를 두고, 그 아래 대상마다 바뀐 변형의 피그마 이미지를 두 개씩 나란히, 이미지 아래에 해당 Figma 노드 링크로 변형 이름을 둔다. 바뀐 변형이 4개를 넘는 대상은 `<details>`로 접는다. 조립 PR에는 조립 보고가 함께 실린다. 애니메이션 PR 본문은 키프레임 표, 토큰 짝 표, 피그마 링크다.
  - GitHub 요청은 한 함수로 보낸다. 5xx, 429, 한도 초과 403, 네트워크 실패는 1초·2초·4초 간격으로 최대 세 번 다시 시도하고 4xx는 다시 시도하지 않는다. PR을 만드는 요청이 실패하면 같은 head로 열린 PR이 있는지 보고, 있으면 그 PR을 쓴다.
  - 플러그인은 사용자가 실행했을 때만 동작한다. 이 저장소에만 권한이 있는 GitHub fine-grained 토큰(Contents·Pull requests 읽기/쓰기, Metadata 읽기)을 플러그인 로컬 저장소에 보관한다.
  - 피그마 파일 키와 PNG 배율은 `packages/design-system/figma/figma.json`에 둔다.
플러그인 화면: |
  플러그인 화면은 내보낼 대상을 빨리 고르고 결과를 한눈에 보는 데 맞춘다.

  - 배치: 머리줄에 제목과 ⚙ 설정 버튼, 그 아래 선택 도구줄(이름 붙여넣기 선택, 선택 해제, 목록 안 찾기), 스크롤되는 대상 목록, 아래 고정줄(고른 수·열릴 PR 수와 내보내기 버튼)이다. 내보내는 동안과 끝난 뒤에는 목록 자리가 진행·결과 화면으로 바뀌고 "목록으로 돌아가기"로 돌아간다.
  - 설정: GitHub 토큰 입력(가림·보기, 입력하면 바로 저장), 연결 확인, 토큰 만들기 링크와 필요한 권한, 토큰 지우기, 읽기 전용 저장소·파일 키, 이 문서로 가는 링크다. 토큰이 없으면 설정 화면부터 열고 내보내기 버튼 옆에 안내를 보인다.
  - 대상 목록: 토큰은 한 줄로 `main`의 `tokens.json`과 비교한 추가·변경·이름 변경·삭제 개수를 보이고, 펼치면 바뀐 토큰 이름을 보인다. 컴포넌트는 "묶음 섹션 > 컴포넌트 섹션" 2단, 조립은 영역, 애니메이션은 움직임 목록이다. 묶음 안은 피그마 캔버스에 놓인 순서다. 묶음은 접고 펼칠 수 있고 체크박스(일부만 고르면 반쯤 찬 표시)와 "고른 수 / 전체 수"를 둔다. 항목은 이름, 변형 수, 상태(저장소에 폴더가 없으면 "새로 만듦")를 보인다. 목록 안 찾기는 이름에 글자가 든 항목만 남기고 걸린 묶음을 펼친다. GitHub 토큰이 없으면 토큰 비교와 상태는 "설정 필요"다.
  - 바뀐 대상을 자동으로 찾아 고르는 기능은 두지 않는다. PNG를 모두 그려 비교하거나 구조 지문을 따로 기록해야 하는데, 이름 붙여넣기 선택으로 충분하기 때문이다.
  - 진행과 결과: 진행 막대와 지금 하는 일 한 줄, 접어 둔 로그를 보인다. 끝나면 PR을 토큰·컴포넌트·조립·애니메이션으로 묶어 새 PR인지 이어 커밋했는지와 링크를 보인다. 구조 검사 위반은 대상별로 묶고, 줄마다 그 레이어를 선택하고 화면을 옮기는 "피그마에서 보기"를 둔다.

  이름 붙여넣기 선택:
  - 한 줄에 하나, 또는 쉼표로 잇는다. `토큰`(또는 `tokens`)은 토큰, 컴포넌트는 이름, 조립은 `영역/이름`(`영역/*`은 그 영역 전체), 애니메이션은 움직임 이름이다.
  - 대소문자를 구분하지 않고, 줄 앞의 `-`·`*`·번호, 이름을 감싼 백틱, 앞뒤 공백, 빈 줄과 `#`으로 시작하는 줄은 무시한다.
  - 선택을 누르면 지금 선택을 지우고 붙여넣은 대상만 고른다. 고른 수와 찾지 못한 이름을 보여 주고, 고른 항목이 든 묶음을 펼친다.
  - AI 작업 세션은 내보낼 대상을 보고할 때 이 형식의 복사용 목록을 함께 준다. 쉼표로 이은 한 줄을 코드 블록에 담고, 토큰 → 컴포넌트 → 조립 → 애니메이션 순서로 적는다. 조립은 피그마 이름(`영역/이름`, `export.json`의 `name`)으로 쓴다. 예: `토큰, Flyout, Menu, Menu/Desktop, Chrome/PostBlocks, motion-flyout-enter`
구조 검사: |
  플러그인은 컴포넌트를 내보내기 전에 변형마다 구조를 검사하고, 위반이 하나라도 있으면 그 대상을 내보내지 않는다. 막는 것은 아래 여덟 가지다. 피그마 값이 모두 토큰이어야 코드가 토큰 클래스만으로 같은 모습을 만들 수 있기 때문이다. 조립은 검사하지 않는다([[디자인 시스템:조립]]).

  1. 변수·스타일에 연결되지 않은 시각 값. 칠, 선, 선 두께, 반경, 여백, 간격, 고정 크기, 불투명도, 글자 스타일이 대상이다. 크기는 변수에 연결돼 있으면 고정 크기로 내보내고, 변수 없는 숫자는 견본 크기로 보아 막지 않고 고정 크기로 내보내지 않는다([[디자인 시스템:크기 변수]]). 효과는 효과 스타일로, 그라데이션은 칠 스타일로만 쓴다. 토큰 클래스로 쓸 수 없는 값(90° 배수가 아닌 회전, 비례 제약)도 막는다. 내용 맞춤(HUG) 축도 그 크기를 정하는 자식(고정 크기나 내용 맞춤 글자)이 없으면 막는다. 최소 너비·높이가 변수에 연결돼 있으면 보지 않는다. 그 축의 최대 크기가 변수에 연결돼 있고 그 축에서 부모 채움인 글자 자식이 있으면 정하는 자식이 있는 것으로 본다(CSS `width: fit-content; max-width`).
  2. CSS로 그릴 수 없는 기능. 노이즈·텍스처·점진 블러 효과, 블렌드가 들어간 칠과 효과, 투명한 부분 뒤에도 표시하는 그림자, 점선, 가변 두께·브러시 선, 모서리 스무딩, 마스크, 자산이 아닌 호·별·다각형·선·불리언·벡터, 이름 있는 자산에 없는 이미지, 빠진 글꼴, OpenType 기능, 다이아몬드 그라데이션.
  3. 인스턴스 모양의 직접 덮어쓰기. 인스턴스 안 레이어의 칠·선·효과·불투명도를 원본과 다르게 바꾼 것을 플러그인 API의 덮어쓰기 기록(`overrides`)으로 찾아 막는다. 글자 바꾸기, 아이콘 교체, 불리언, 변형 고르기처럼 원본이 속성으로 연 것은 허용한다([[디자인 시스템:컴포넌트 조립 규칙]]). 자산 인스턴스의 색과 직접 놓은 인스턴스 전체의 불투명도는 막지 않는다.
  4. 모션 변수 값이 아닌 키프레임 시간·지연과 변수에 연결되지 않은 키프레임 이징([[디자인 시스템:모션]]).
  5. 자르는 조상. 내보내는 변형의 조상 중 내용 자르기가 켜진 프레임이나 컴포넌트 세트가 있으면 막는다. 페이지와 섹션(SECTION 노드)은 자르기가 없어 대상이 아니다.
  6. 이미지 자산 비율. 인스턴스의 비율이 원본과 1% 넘게 다르면 막는다. 두 축 모두 부모가 크기를 정하면(FILL, 양쪽 늘이기) 틀에 맞춰 자르는 그림이라 막지 않는다. 비율이 잠긴 레이어는 한 축이 정해지면 나머지 축이 비율에서 나오므로 그 축의 고정 크기를 막지 않는다.
  7. `@` 줄. 키를 모르거나 값이 없거나 잘못된 줄을 막는다.
  8. 짝이 없는 값. 노드에 변수를 연결할 수 없는 값(회전, 둘 이상의 최대 줄 수, 잠긴 비율)은 같은 값의 코드 전용 변수(`rotate/*`, `line-clamp/*`, `ratio/*`)가 있어야 한다([[디자인 시스템:회전 구현]]). 묶음에 변수가 하나도 없으면 그 묶음은 보지 않는다. 한 줄 말줄임은 `truncate` 클래스라, 이미지 자산의 비율은 자산이 정해 짝이 필요 없다. 변형 전환(`reactions`)의 시간과 이징이 `motion/*` 변수 값이 아니어도 막는다.

  - 토큰 내보내기는 값이 없는 변수 모드, 잘못된 `@` 줄, 다이아몬드 그라데이션, 이름 규칙이 없는 문자 변수를 막는다([[디자인 시스템:토큰 생성]]).
  - 크기를 줄인 인스턴스(`scaleFactor`가 1이 아님)는 인스턴스 자체만 검사하고(3번 포함) 안쪽은 건너뛴다. 안쪽은 원본 쪽에서 따로 검사받고, 줄인 값은 코드에서 CSS `scale`로 만들어진다. 배율 인스턴스 자체의 고정 너비·높이도 검사하지 않는다. 배율이 고정이거나 칸에 맞춘 값이라 결과 크기가 토큰이 아닐 수 있고, 피그마는 배율 인스턴스의 크기를 변수에 연결하면 배율을 1로 되돌리기 때문이다. 크기는 그것을 담는 칸이 변수로 지킨다.
  - 알림(막지 않음): 파일에서 사용처가 0인 변수·스타일을 알려 준다. 코드 전용 변수와 단계 이름 묶음(`spacing/*`, `size/icon/*`)은 알리지 않는다. Screens까지 세고, 키프레임 이징에 연결된 변수도 쓰는 것으로 센다. 키프레임의 배율·투명도·회전 값이 모션 변수 값과 같으면 그 짝을 내보낸 자료와 PR 본문에 적는다.
  - 메시지: 위반마다 위치(컴포넌트 / 변형 / 레이어 경로), 이유, 고칠 방법을 쓰고, 한 대상의 위반은 모두 한 번에 보여 준다.

  피그마 기능으로 읽는 것: 피그마가 가진 정보는 속성으로 가져오고, 가져올 수 없는 것만 글로 적는다.

  | 정보 | 읽는 곳 |
  |---|---|
  | 반복 여부 | 움직임을 담은 프레임의 재생 설정 Loop(`playbackSettings.loop`). 켜면 무한 반복, 끄면 한 번이다 |
  | 재생 시작 조건(트리거) | 읽지 않는다. 조립의 프로토타입이 사람에게 보여 주고, 정확한 조건은 화면별 기능 문서와 코드가 맡는다 |
  | 열리는 메뉴 | 트리거의 프로토타입 오버레이 목적지([[디자인 시스템:팝업]]) |
  | 말줄임, 목록 스크롤 | 글자 말줄임 설정, 프레임 스크롤 설정 |
  | 그 밖의 실행 중 값(데이터로 정해지는 값, 도착 위치·거리, 스크롤바 위치, 우클릭·입력 같은 실제 트리거) | 레이어의 Development 카테고리 주석 |
  | 동작 줄이기에서 남기는 움직임 | 그 움직임 레이어의 Accessibility 카테고리 주석([[디자인 시스템:동작 줄이기]]) |
  | 견본 크기 | 변수 연결 여부(위 1번) |

  - 주석은 레이어 트리의 `annotations`에 카테고리와 함께 실린다.
  - `@` 줄: 위 표로 읽을 수 없는 남은 규칙 글은 변수·스타일·컴포넌트 description의 `@키 값` 줄이다. 값은 내보낸 자료에 그대로 실린다(토큰은 `$extensions.com.seojaewan.directives`, 모션은 json의 `directives`). 키는 `@direction`(왕복: `normal`, `reverse`, `alternate`, `alternate-reverse`) 하나다.
자산: |
  자산은 피그마 Foundations의 자산 컴포넌트이고, 컴포넌트와 화면은 그 인스턴스를 쓴다. 코드는 같은 이름의 자산 파일을 쓴다.

  - 묶음은 원본 컴포넌트가 든 묶음 프레임(`group/<묶음>`)의 이름으로 정한다.
  - 칠과 테두리 색이 다른 도형은 칠 자산과 테두리 자산 둘을 겹쳐 쓴다.
  - 자산으로 두지 않는 완전한 원과 사각형은 CSS(`rounded-*`)로 그린다.
  - 이미지는 이름 있는 Images 자산으로만 쓴다. 플러그인은 이미지 해시로 자산 이름을 찾고, 이름 있는 자산에 없는 이미지는 막는다([[디자인 시스템:구조 검사]]).

  | 묶음 | 내보내는 파일 | 코드 |
  |---|---|---|
  | Icons, Shapes(한 가지 색) | SVG. id를 내용 기반 이름으로 바꾸고 색을 `currentColor`로 바꾼다 | 자산 이름 + 글자 색 클래스 |
  | Illustrations(여러 색) | SVG. id만 바꾼다 | 자산 이름 |
  | Images(래스터) | 이미지 칠 하나면 원본 바이트, 아니면 PNG(배율 1). 확장자는 바이트의 실제 형식이다(JPEG `.jpg`, PNG `.png`) | 확장자 없는 자산 이름(`images/<자산>`). 생성기가 만든 WebP를 쓴다 |

  - 플러그인은 내보내는 컴포넌트와 조립이 쓰는 자산을 `figma/assets/<묶음>/<자산>.<확장자>`로 함께 내보낸다. 래스터 원본의 형식이 바뀌면 확장자만 다른 예전 파일은 지운다. SVG 안의 id는 내용으로 정해지는 이름으로 바꿔, 같은 모양이면 파일도 같게 한다.
  - 코드의 자산 파일은 손으로 복사하지 않고 생성기(`generate:assets`)가 이 파일에서 만든다. 아이콘 패키지(`@fluentui/react-icons`)를 따로 쓰지 않는 것도 이 때문이다. 피그마가 아이콘을 줄여 쓰거나 경로를 바꾸면 패키지 아이콘과 달라진다.
  - 래스터 자산은 생성기(`sharp`)가 `src/assets/images/<자산>.webp`로 바꾼다. PNG 원본은 무손실, JPEG 원본은 손실(품질 80)로 바꾼다. 피그마는 WebP를 내보내지 못하기 때문이다. `sharp`는 정확한 버전으로 고정해 Windows와 Linux에서 같은 바이트가 나오게 한다.
  - 생성기는 SVG를 속성 표가 아니라 규칙으로 옮긴다. 요소는 그대로 옮기고, 하이픈 속성 이름은 낙타 표기로 바꾼다(`stroke-dasharray` → `strokeDasharray`). `xlink:href` 같은 이름공간 속성만 예외 표로 둔다. 입력이 피그마가 내보낸 정적 SVG이고 다시 만들어 바이트를 비교하므로 모르는 태그를 막지 않는다.
  - `<mask>`의 `style="mask-type:alpha"` 또는 `luminance` 단일 선언은 SVG presentation attribute(`maskType`)로 옮긴다. 그 밖의 문자열 `style`은 React 속성으로 넘길 수 없어 생성이 실패한다.
  - 여러 색 자산의 SVG는 그라데이션(`linearGradient`, `radialGradient`)을 그대로 옮긴다. SVG 안의 ID에는 요소마다 다른 접두어를 붙이고, `id`·`url(#…)`·`href="#…"`에 모두 붙인다. 한 화면에 같은 자산이 둘 있어도 ID가 겹치지 않게 하기 위해서다.
  - 경로 트림이 걸린 벡터는 플러그인이 벡터 경로와 트림 기본값으로 요소를 직접 만든다([[디자인 시스템:모션]]). 트림 벡터와 SVG 요소의 짝을 확실히 정할 수 없으면(트림 벡터나 선 요소가 하나가 아님, 벡터가 아님, 경로가 여럿) 이유와 함께 내보내기를 막는다.
  - `generate:assets`는 이미지 주소·너비·높이 지도(`src/assets/image-data.ts`)도 만들고, 패키지는 `getImageAsset(name)`으로 내보낸다. `ImageAsset`은 원본 너비·높이를 달아 클래스가 없으면 원본 비율을 지킨다. 앱의 큰 이미지(바탕화면 배경)는 `next/image`로 그린다.
  - 자산은 픽셀로 비교하지 않는다. `generate:assets --check`가 `figma/assets/`에서 코드 자산을 다시 만들어 `src/assets/`와 바이트가 다르면 실패한다. 스킬이 로컬에서 돌린다([[디자인 시스템:CI]]).
토큰 검사: |
  `generate:tokens --check`가 `tokens.json`에서 `tokens.css`와 `token-names.ts`를 다시 만들어 저장소의 파일과 비교하고, 다르면 실패한다. 토큰 PR 스킬이 로컬에서 돌린다([[디자인 시스템:CI]]).
  플러그인이 만든 파일과 변환 스크립트가 만든 것이 같은 코드에서 나오므로, 실패하면 누군가 생성 파일을 손으로 고쳤거나 변환 스크립트가 바뀐 것이다.
스토리 규칙: |
  피그마 변형 하나를 Storybook 스토리와 args 하나로 짝짓는 규칙이다.

  - 컴포넌트는 `src/components/<컴포넌트>/<컴포넌트>.stories.tsx`에 이름이 `Figma`인 스토리를 하나 두고 args로 변형을 고른다.
  - 조립은 앱 Storybook의 스토리로 짝짓는다. 스토리 제목은 `Patterns/` 뒤에 피그마 조립 이름을 그대로 쓴다(`Menu/Folder` → `Patterns/Menu/Folder`). 구조가 같은 조립 여럿은 코드 컴포넌트 하나에 스토리를 여럿 둔다([[디자인 시스템:조립]]).
  - 피그마 변형 속성 이름은 camelCase arg 이름이 된다(`Variant` → `variant`). 값은 변형 파일 이름과 같은 규칙으로 정규화한 문자열이다(`Accent` → `accent`, `Two line` → `two-line`). `True`·`False`는 boolean이다. 참/거짓 변형 `X`는 `isX` arg가 된다(`Active=True` → `isActive: true`). 이미 `Has`·`Is`·`Can`·`Should`로 시작하는 이름은 접두어를 더 붙이지 않는다(`Has separator=True` → `hasSeparator: true`). 코드 boolean prop 이름 규칙([[코드 작성 규칙:식별자 이름]])에 맞추기 위해서다. `State` 값 하나가 코드에서 boolean prop이 되는 컴포넌트(Toc·Scrollbar의 `State=Expanded` → `isExpanded`)는 `Figma` 스토리가 `state` arg를 prop으로 바꿔 넘긴다.  - 피그마 컴포넌트 속성 이름과 React prop 이름을 맞춘다. 속성 키의 `#id`를 떼고 camelCase로 쓴다(`Has separator` → `hasSeparator`, `Close icon` → `closeIcon`).
  - argTypes `options`에 피그마 변형 값을 모두 넣는다. Storybook은 `options`에 없는 URL args를 조용히 버린다.
  - 상태 재현: `Hover`·`Pressed`·`Focused`는 실제 마우스·키보드로 재현하고, 컴포넌트에 강제로 상태를 주는 prop을 만들지 않는다. 나머지 상태는 args로 재현한다.
  - 부모가 크기를 정하는 컴포넌트는 코드에 너비가 없으므로, `Figma` 스토리를 `FigmaFrame`으로 감싸 피그마 export.json의 크기(크기 방식과 크기 숫자)를 준다. 스토리는 크기를 고르지 않고 `className`·`style`도 쓰지 않는다([[테스트 작성 규칙:스토리 테스트]]).
  - 스토리가 대상 요소에 다는 속성: 가운데가 안쪽 다른 부품의 Hover를 부르는 컴포넌트는 `data-parity-hover`(Hover를 줄 안쪽 요소의 CSS 선택자), 포털로 그리거나 감싸는 요소가 필요한 스토리는 `data-parity-target`(`StoryStage`의 `target`이 단다), 배치 상자보다 그림이 크게 떠 있는 컴포넌트(AddressBar Suggesting)는 `data-parity-box`(피그마 노드에 해당하는 안쪽 요소의 CSS 선택자)다. 대상은 `#storybook-root`의 첫 요소다. 이 속성을 읽는 도구는 저장소에 없다.
  - 코드 전용 컴포넌트를 뺀 모든 컴포넌트가 `Figma` 스토리를 갖는다. 슬롯이 있는 컴포넌트는 피그마 슬롯 기본 내용([[디자인 시스템:컴포넌트 조립 규칙]])과 같은 컴포넌트를 `Figma` 스토리의 슬롯에 넣는다. 스토리에 맨숫자 상자를 넣지 않는다.
PR 흐름: |
  피그마 작업을 마치면 플러그인으로 내보내고([[디자인 시스템:피그마 플러그인]]), 사람이 시점을 골라 스킬로 PR을 처리하고([[디자인 시스템:스킬]]), 사람이 PR의 피그마 이미지와 코드를 보고 병합한다. 애니메이션 PR은 피그마의 움직임과 모션 스토리의 느리게 보기를 나란히 보고 병합한다.

  | 경우 | 생기는 PR | 병합 순서 |
  |---|---|---|
  | 컴포넌트만 바뀜 | 컴포넌트 PR 하나 | 상관없음 |
  | 토큰만 바뀜 | 토큰 PR 하나(영향 컴포넌트 PNG 포함) | 상관없음 |
  | 새 토큰을 쓰는 컴포넌트 | 토큰 PR + 컴포넌트 PR | 토큰 먼저 |
  | 토큰 이름 변경·삭제 | 토큰 PR 하나. 옛 이름을 쓰는 코드도 같은 PR에서 고친다 | 상관없음 |
  | 조립이 바뀜 | 영역마다 조립 PR | 쓰는 토큰·컴포넌트 PR 다음 |
  | 애니메이션이 바뀜 | 움직임마다 애니메이션 PR | 새 모션 토큰이 필요하면 토큰 PR 다음. 키프레임이 걸린 자산이 컴포넌트 PR로 들어오면 그 다음 |

  - 토큰 PR은 생성된 `tokens.css`까지 담아 바로 병합할 수 있다. 토큰 이름이 바뀌거나 지워져 코드가 옛 클래스를 쓰면 lint가 알려 주고, 같은 PR에서 코드를 고친다.
  - 컴포넌트 PR이 아직 없는 토큰을 쓰면 lint가 모르는 클래스로 실패한다. 토큰 PR을 병합한 뒤 컴포넌트 PR에 `main`을 받아 온다.
  - 조립 PR은 앱의 컴포넌트와 스토리를 만들고, 구조는 피그마 조립 그림을 기준으로 코드가 정한다([[디자인 시스템:조립]]). 쓰는 디자인 시스템 컴포넌트가 아직 코드에 없으면 그 컴포넌트 PR을 먼저 병합한다.
  - 애니메이션 PR은 `motion.css`의 클래스와 모션 스토리를 만든다. 컴포넌트에 늘 붙는 움직임(링 회전)과 컴포넌트 안에서 끝나는 상태 연동 움직임(검색 돋보기 강조)은 같은 PR에서 그 컴포넌트에 붙이고, 동작에 따라 붙는 움직임(창 열기·최소화, 패널)은 클래스만 만들고 기능을 구현할 때 붙인다.
  - 피그마 쪽 변경은 항상 PR로만 들어오므로 정기적인 전체 비교는 두지 않는다.
스킬: |
  플러그인 PR을 처리하는 일은 자동으로 돌리지 않고, 사람이 시점을 골라 AI에게 스킬로 맡긴다. 같은 절차와 같은 제한을 매번 지키게 하기 위해서다.

  구현 자료의 순서: 내보낸 자료(컴포넌트는 `export.json`의 레이어 트리, 조립은 조립 보고)와 PNG → `.codocs`(동작·코드·접근성) → 그래도 모르는 것만 피그마 MCP. `export.json`과 MCP가 다르면 `export.json`을 따르고, 차이와 MCP로 메운 것을 보고한다.

  | 스킬 | 쓰는 때 | 하는 일 |
  |---|---|---|
  | `figma-token-pr` | 토큰 PR | 바뀐 토큰 정리, 생성된 `tokens.css` 확인, 이름 변경·삭제로 깨진 코드 고치기, lint 통과 |
  | `figma-component-pr` | 컴포넌트 PR, 조립 PR | 없는 토큰 확인, `generate:assets` 실행과 커밋, 피그마 그림을 보고 구현 |
  | `figma-motion-pr` | 애니메이션 PR | 내보낸 json으로 `motion.css`에 클래스와 모션 스토리 만들기([[디자인 시스템:모션]]) |

  - 스킬은 `.claude/skills/<이름>/SKILL.md`에 둔다. 절차만 담고 규칙은 `@codocs \[[문서:섹션]]` 링크로 가리킨다([[codocs 연결 규칙]]). 실행할 때 링크된 섹션을 codocs로 읽는다.
  - 생성 파일(`tokens.css`, `src/assets/`)은 생성기를 실행만 하고 직접 쓰지 않는다.
  - 다음은 하지 않는다: `figma/` 고치기, 생성 파일 손으로 고치기, 병합.
  - 다음이 필요하면 멈추고 보고한다: 변환 스크립트나 모션 검사 도구 고치기, `.codocs` 고치기, PR에 예상 밖 파일이 있음.
  - 끝나면 사람이 모습을 봐야 할 곳을 보고한다.
  - 코드만 바꾸는 PR은 일반 개발 작업이라 스킬을 두지 않는다.
CI: |
  피그마 전용 워크플로는 없다. 토큰·자산 생성 확인(`generate:tokens --check`, `generate:assets --check`)과 모션 시간·키프레임 검사는 스킬이 로컬에서 돌린다.
  일반 CI(포맷·lint·타입·테스트·빌드·Storybook 빌드·E2E)는 [[Git 작업 규칙:CI]]에 있다.
모션: |
  애니메이션은 피그마에서 움직임이 놓인 자리([[디자인 시스템:모션 견본]])의 키프레임을 내보내고, 그것을 보고 `motion.css`의 모션 클래스를 손으로 만든다([[디자인 시스템:모션 클래스]]). 값은 피그마 변수에서 자동으로 오고, 구성은 키프레임을 보고 손으로 옮긴다.

  | 값 | 피그마에서 | 내보낼 때 |
  |---|---|---|
  | 시간(트랙 전체 길이), 시작 지연 | 숫자만 넣을 수 있다. 피그마가 변수 연결을 지원하지 않는다 | `motion/duration/*`·`motion/delay/*` 변수 값 가운데 하나와 같은지 대조하고, 아니면 막는다 |
  | 이징 | `EASING` 타입 변수(`motion/easing/*`)에 연결한다 | 변수에 연결됐는지만 본다 |
  | 배율·투명도·회전 등 | 숫자 | `motion/*` 변수 값과 같으면 내보낸 자료와 PR 본문에 짝을 적는다. 구현할 때 짝은 `var()`로 쓴다 |
  | 그 밖의 숫자(링의 트림, 회전 -900°, 중간 키프레임 위치, 이동 거리) | 숫자 | 구성이라 검사하지 않고 그대로 옮긴다 |

  - 키프레임 이징은 `EASING` 타입 변수에 곡선을 넣어야 피그마가 그 곡선으로 재생한다. 문자열 변수는 연결은 되지만 피그마가 직선으로 재생한다.
  - 키프레임 이징은 이전 키프레임에서 그 키프레임까지의 곡선이라, 첫 키프레임의 이징은 검사하지 않고 json에도 적지 않는다.

  플러그인은 컴포넌트·자산 원본(이름에 `Components`·`Foundations`가 든 페이지), 조립 흐름(조립 페이지의 최상위 `motion-` 프레임), 옛 견본(Foundations 페이지 `Foundations / Motion` 프레임 바로 아래 `motion-` 프레임)에서 움직임을 읽는다. 같은 이름이면 원본·흐름을 쓰고 옛 견본은 뺀다.
  내보내는 자료는 `figma/motions/<이름>.json`이다.
  - 읽은 자리(`source`: 흐름 `flow`, 원본 `component`, 옛 견본 `sample`)
  - 키프레임이 걸린 노드: 인스턴스면 컴포넌트 이름, 자산 원본이면 자산 이름, 인스턴스가 아닌 레이어면 레이어 이름과 종류 `layer`
  - 트랙마다 항목, 키프레임 시간, 값, 이징과 위 표의 토큰 짝
  - 반복 여부(`iterations`: Loop가 켜져 있으면 `infinite`, 꺼져 있으면 1), Development·Accessibility 주석(`notes`), 남은 `@` 줄 값(`directives`)
  - 움직임 타임라인 길이를 넘는 트랙은 안쪽 컴포넌트가 가진 더 긴 움직임이 잘려 재생되는 것이다. 그 길이까지의 키프레임만 담고 `isTruncated: true`를 적으며, 트랙 길이 변수와 대조하지 않는다.
  - PNG와 영상은 넣지 않는다. 플러그인 API로 영상을 내보낼 수 없기 때문이다.

  경로 트림이 걸린 자산은 `pathLength="1"`과 `stroke-dasharray`로 내보낸다. 트림 값이 CSS로 1:1로 옮겨지고 경로 길이가 원 크기에 묶이지 않는다. 피그마는 실행 환경에 따라 트림을 경로에 구워 내보내기도 해서, 플러그인이 피그마에 저장된 값으로 이 꼴을 직접 만든다([[디자인 시스템:자산]]).
  - 경로는 벡터의 `vectorPaths`(트림 전 전체 경로)를 자산 컴포넌트 좌표로 옮긴 것이고, 숫자는 피그마 SVG와 같은 유효 6자리다.
  - 보이는 범위는 트림 키프레임 기본값(`baseValue`)이다. `stroke-dasharray="<끝-시작> 1"`, 시작이 0이 아니면 `stroke-dashoffset="-<시작>"`이다.
  - 선 속성(색, 두께, 끝 모양, 이음)은 피그마가 내보낸 그 요소의 것을 그대로 쓴다.

  구현:
  - `figma-motion-pr` 스킬([[디자인 시스템:스킬]])이 json의 키프레임과 주석·`directives`를 읽고 `motion.css`에 클래스를 만든다. 토큰 짝은 `var()`, 실행 중 값은 CSS 변수로 쓰고, 나머지는 그대로 옮긴다.
  - 디자인 시스템 Storybook에 `Motion/<이름>` 모션 스토리를 둔다. 피그마와 같은 컴포넌트에 클래스를 걸어 재생하고, 다시 재생과 느리게 보기를 둔다. 실행 중 값은 피그마의 대표값을 쓴다.

  확인:
  - 변형 전환: 플러그인이 변형 전환(`reactions`: 트리거·목적지·전환 종류·시간·이징)을 읽어 `motion/*` 변수 값과 대조하고 레이어 트리에 담는다([[디자인 시스템:구조 검사]]).
  - 모션 시간 검사: Playwright가 모션 스토리에서 `getAnimations()`로 시간·이징·지연·반복 횟수를 읽어 json의 토큰 짝, `iterations`와 같은지 검사한다(`iterations: null`이면 반복을 비교하지 않고, 잘린 트랙은 보지 않는다). 애니메이션을 켜고 도는 유일한 Playwright 검사다([[테스트 작성 규칙:E2E]]). 애니메이션 PR 스킬이 로컬에서 돌린다(`pnpm --filter @seojaewan/figma-parity motion-check`).
  - 키프레임 값 검사: 같은 범위에서 모션 스토리의 `getKeyframes()` 값을 json 키프레임 값과 키프레임 위치마다 비교하고, 다르면 실패한다.
  - 사람은 실제 움직임의 느낌을 본다.

  검사 범위:
  - 화면은 1600×900으로 고정한다. 피그마 움직임은 PC 구간이라 노트북 구간([[반응형:기준]])의 규칙이 섞이지 않게 하기 위해서다.
  - `motion.css`를 바뀌기 전·후로 읽어, 내용이 달라진 클래스와 바뀐 모션 토큰을 쓰는 클래스만 검사한다.
  - 모션 스토리 도우미(`src/motion-story/`의 파일)가 바뀌면 상대 import를 따라가 그 도우미를 쓰는 모션 스토리만 검사한다. 쓰는 곳을 정하지 못하면 전체다. 모든 모션 스토리가 쓰는 재생 도우미(`motion-preview.tsx`)와 모션 검사 도구가 바뀌면 전체다.
  - 결과를 PR 댓글 표로 남기는 코드(`motion-post-comment.ts`, `motion-report.ts`)가 있고, 이를 부르는 워크플로는 없다.

  키프레임 값 검사:
  - 트랙은 변환표의 CSS 속성을 움직이는 요소와 짝짓는다. 그런 요소가 여럿이면 모션 스토리가 요소에 `data-motion-node="<json의 node>"`를 단다. 이 표시는 모션 스토리에만 달고 앱·디자인 시스템 컴포넌트에는 달지 않는다.
  - 피그마에 없는 키프레임 위치나 CSS 속성, 코드에 없는 키프레임, 변환표에 없는 항목, `SET`이 아닌 연산도 실패한다. 변환표에 없는 항목은 이 표와 검사 도구에 규칙을 먼저 더한다.
  - 허용 오차: 투명도·배율·경로 트림 0.001, 이동 0.5px, 회전 0.5°. 내보낸 값의 반올림과 브라우저 계산의 부동소수 차이만 넘기기 위해서다.
  - 실행 중 값: 키프레임 선언에서 `tokens.css`에 없는 CSS 변수를 쓰는 자리는 실행 중 값이다. 값은 비교하지 않고, 그 자리에 변수를 쓰는지와 스토리 대표값의 부호(방향)가 피그마 값과 같은지만 본다. 토큰 변수(`var(--motion-*)`)는 브라우저가 푼 값으로 비교한다.
  - json이 지금 피그마 값과 같은지는 플러그인이 내보낼 때 보장한다.

  | 피그마 항목 | CSS | 옮기는 방법 |
  |---|---|---|
  | `OPACITY` | `opacity` | 그대로 |
  | `SCALE_XY`, `SCALE_X`, `SCALE_Y` | `scale`(없으면 `transform`의 `scale()`) | x·y 성분 |
  | `TRANSLATION_XY`, `TRANSLATION_X`, `TRANSLATION_Y` | `translate`(없으면 `transform`의 `translate()`) | px. %는 요소 크기로 바꾼다 |
  | `ROTATION` | `rotate`(없으면 `transform`의 `rotate()`) | 부호를 뒤집는다. 피그마는 반시계 방향이 +다 |
  | `PATH_TRIM_START` | `stroke-dashoffset` | `-dashoffset / pathLength` |
  | `PATH_TRIM_END` | `stroke-dasharray`, `stroke-dashoffset` | `(dasharray 첫 값 - dashoffset) / pathLength` |
검토한 대안: |
  코드 구현과 도구에서 고르지 않은 방법과 이유다.

  - 레이어별 자동 판정(코드 요소에 `data-figma`로 짝을 지어 이긴 CSS 선언을 판정): 규칙과 분류표가 컴포넌트마다 늘고 코드가 검사기에 맞춘 모양이 되어 뺐다.
  - 픽셀 비교(피그마 PNG ↔ Storybook 스크린샷): 피그마와 Chromium이 글리프 위치·안티앨리어싱·그림자 경계를 다르게 그려, 엄격하면 정상이 모두 실패하고 느슨하면 1px 실수를 놓친다.
  - 인지 비교(SSIM 등): 정상과 실수의 간격이 글자 가장자리 번짐 정도라 환경이 바뀌면 뒤집힌다.
  - 피그마 SVG·Figma Sites HTML·Dev Mode 코드를 기준으로 쓰기: 변환에서 디자인 일부를 잃는다.
  - Style Dictionary로 `tokens.css` 만들기: 변환 대부분이 이 프로젝트의 규칙이라 도구가 맡는 부분이 작다.
  - `tokens.css`를 손으로 쓰기: 다시 만들어 비교하는 것만으로 같음을 보장할 수 없다.
  - CI가 생성 파일을 PR에 자동 커밋: 기본 토큰으로 푸시한 커밋은 CI를 다시 깨우지 않아 별도 시크릿 토큰이 필요하다.
  - Figma REST API로 CI가 매번 자료를 받기: CI에 피그마 토큰이 필요하고, Variables는 Enterprise 플랜이 아니면 읽을 수 없다.
  - 토큰을 피그마 MCP로만 읽기: 토큰 변경이 PR에 남지 않는다.
  - 코드 기준 회귀 테스트(Chromatic 등)를 컴포넌트에 쓰기: 기준이 이전 코드라 처음 만든 컴포넌트가 피그마와 달라도 잡지 못한다.
  - 조립을 피그마 그림과 꼭 맞춰야 하는 기준으로 비교하거나 조립 구조를 코드 구조와 1:1로 내보내기: 디자인을 코드 구조에 맞춰 그리게 된다.
  - 컴포넌트마다 `tokens.json`을 나누기: 한 컴포넌트만 다시 내보내면 이름 하나에 값이 둘이 된다.
  - 키프레임 CSS를 플러그인이 자동 생성: 실행 중 값을 CSS 변수로 받는 자리처럼 json만으로 정할 수 없는 부분이 있다.
  - 모든 글자의 기준선을 하나의 CSS 보정으로 맞추기: 피그마는 줄에 든 서체로, Chromium은 첫 서체로 기준선을 정해 한 값으로 두 경우를 맞출 수 없다([[한계:글자 기준선]]).
  - CSS `border`나 배경 두 겹으로 그라데이션 테두리 그리기: `border`는 둥근 모서리를 지키는 그라데이션을 칠할 수 없고, 배경 두 겹은 컴포넌트 배경색과 섞인다.
  - CSS `border`로 피그마 안쪽 선 그리기: 레이아웃 크기를 바꾸고 자식 아래에 그려진다.
  - 창 너비·높이를 직접 움직이기(FLIP 대신): 배치를 매번 다시 계산해 덜 부드럽고, 피그마 키프레임에 너비·높이 항목이 없다.
  - 열리는 도중 닫을 때 키프레임을 이어 재생하기: 열기와 닫기는 서로 다른 키프레임 클래스라 이어지지 않는다.
  - 코드에서 루미너시티 재질 혼합: 의사 요소 층과 쌓임 맥락 제약(`isolate`, `z-index` 금지)이 생긴다.
  - 창 축소 화면을 그림 자산으로 그리기: 실제 창 내용과 달라지고 창 디자인이 바뀔 때마다 다시 만들어야 한다.
