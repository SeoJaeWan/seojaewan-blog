_codocs:
  id: design-system
  name: 디자인 시스템
  parent:
    - seojaewan 블로그
개요: |
  블로그 화면을 이루는 토큰과 컴포넌트를 어디서 출발해 무엇을 담고, 피그마에서 어떻게 관리하는지 안내하는 목차다.
  피그마가 디자인의 기준이고, `packages/design-system`은 피그마와 대응하는 코드다. 둘이 같은지는 [[피그마 일치 검사]]로 확인한다.
출발점: |
  Microsoft가 피그마 커뮤니티에 공개한 공식 Windows 11 UI Kit을 기준으로 한다.
  재현 정확도가 [[제품 정의:목적]]의 포트폴리오 목적에 중요하고, 값을 추측하지 않고 공식 값에서 가져올 수 있기 때문이다.

  이전 구현(`legacy/window-blog-v1` 태그)은 블로그에 맞춰 바꾼 부분을 참고하는 데만 쓴다. 이전에 추측한 값의 오차가 따라오지 않게 하기 위해서다.
범위: |
  디자인 시스템에는 기본 컨트롤과 Windows 화면 요소의 격모습 컴포넌트를 담는다. 목록은 [[컴포넌트 목록]]에서 확인한다.

  Windows 화면 요소(창 프레임, Taskbar, Start 등)가 블로그 격모습의 대부분이어서, 이것까지 담아야 피그마 일치 검사가 의미가 있다. 공식 UI Kit에도 이 요소들이 컴포넌트로 있어 피그마와 1:1로 대응된다.

  디자인 시스템은 "창이 어떻게 생겼는가"만 알고 "어떤 창이 열려 있는가"는 모른다. 동작과 상태(창 순서, 드래그, 열린 앱 목록)는 앱의 `features/`에 둔다([[저장소 구성:의존 방향]]).
피그마 파일: |
  파일: [seojaewan 블로그 · Windows 11 디자인 시스템](https://www.figma.com/design/XV9Y1UT5UH4tC5hSqLVipZ) (팀: 서재완)

  | 페이지 | 내용 |
  |---|---|
  | 00 · Foundations | 토큰(Variables), 서체, 간격, 모서리, 그림자, 재질 효과, 아이콘 |
  | 01 · Components | 기본 컨트롤과 Windows 화면 요소. 상태별 변형 포함. 피그마 플러그인이 내보내는 대상이다 |
  | 02 · Screens | 컴포넌트를 조립한 화면. 화면 구현의 기준이다 |
  | 03 · Verification | 일치 검사 결과 기록, 서체 확인 |

  공식 UI Kit을 라이브러리로 연결해 그대로 쓰지 않고, UI Kit에서 값과 구조를 가져와 이 파일의 Variables와 컴포넌트로 다시 만든다.
  Variables 이름 체계와 플러그인 내보내기 대상을 우리가 통제하고, UI Kit이 업데이트돼도 우리 컴포넌트가 바뀌지 않게 하기 위해서다.
문서: |
  - 모드, 강조색, 서체, 재질 효과, 아이콘, 토큰 이름 체계: [[디자인 기반]]
  - 어떤 컴포넌트를 만드는지: [[컴포넌트 목록]]
