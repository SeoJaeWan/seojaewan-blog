_codocs:
  id: component-list
  name: 컴포넌트 목록
  parent:
    - 디자인 시스템
개요: |
  디자인 시스템이 제공하는 컴포넌트의 이름과 용도다. 피그마 01 · Components 페이지와 `packages/design-system`의 컴포넌트가 이 목록과 같다.
  변형, 속성, 슬롯 같은 구조는 피그마가 보여 주고, 나누는 기준은 [[디자인 시스템:컴포넌트 조립 규칙]]에 있다. 내용을 채운 조립은 컴포넌트가 아니라 02 · Patterns에 있다([[디자인 시스템:조립]]).
  [[제품 정의:첫 공개 범위]]에 필요한 것에서 뽑았고, 화면별 세부 기능을 정하면서 늘거나 줄 수 있다.
기본 컨트롤: |
  | 컴포넌트 | 용도 |
  |---|---|
  | Button | 다이얼로그와 툴바의 글자 버튼 |
  | IconButton | 아이콘만 있는 버튼 |
  | DropDownButton | 고른 값을 보여 주고 선택 메뉴를 여는 버튼 |
  | SearchBox | 작업 표시줄·Start·탐색기의 검색 입력창 |
  | RenameField | 바탕화면·탐색기의 이름 바꾸기 입력창 |
  | MenuItem | 메뉴의 항목 한 줄 |
  | Menu | 메뉴 항목을 담는 메뉴 바탕 |
  | Separator | 메뉴, 목록, 명령 모음의 구분선 |
  | Popover | 트리거와 그 옆에 뜨는 팝업의 틀([[디자인 시스템:팝업]]) |
  | Tooltip | 짧은 안내 말풍선 |
  | Flyout | 떠 있는 패널의 공통 바탕 |
  | Scrollbar | Windows 11 스타일 얇은 스크롤바 |
  | ScrollArea | 스크롤바를 가진 스크롤 영역 |
  | ListItem | 추천, 검색 결과, 주소창 추천의 목록 항목 한 줄 |
  | SectionHeader | 목록 묶음의 머리글 |
  | SectionTitle | 영역 제목과 그 옆의 동작 |
  | ListGroup | 머리글과 목록 항목을 담는 묶음 |
  | TileGrid | 타일을 가로로 늘어놓고 줄바꿈하는 격자 |
  | MessageBox | 확인·알림 대화 상자 |
  | ProgressRing | 로딩 표시 |
  | EmptyState | 내용이 없거나 찾을 수 없을 때의 안내 |
  | CodeBlock | 글 본문의 코드 블록 |
Windows 화면 요소: |
  | 컴포넌트 | 용도 |
  |---|---|
  | WindowFrame | 모든 앱 창의 틀 |
  | WindowTitle | 창 제목 표시줄과 창 미리보기 머리글의 앱 아이콘과 제목 |
  | CaptionButton | 창의 최소화·최대화·닫기 버튼 하나 |
  | CaptionButtonGroup | 창 버튼 세 개의 묶음 |
  | WindowPreview | 작업 표시줄 창 미리보기와 Snap Assist의 창 축소 화면 |
  | SnapLayoutFlyout | 최대화 버튼에 마우스를 올리면 뜨는 스냅 레이아웃 |
  | SnapLayoutOption | 스냅 레이아웃의 칸 배치 하나 |
  | SnapZone | 스냅 레이아웃의 칸 하나 |
  | SnapPreview | 끌어서 스냅·Snap Assist에서 채울 영역 미리보기 |
  | SelectionMarquee | 빈 곳을 끌어 여러 개를 고르는 사각형 |
  | Taskbar | 작업 표시줄의 재질 바탕과 자리(가운데·오른쪽). 시작 버튼·검색·앱 버튼·시계는 Taskbar/Default 조립이 채운다 |
  | TaskbarButton | 작업 표시줄의 앱 버튼 |
  | TaskbarPreviewList | 작업 표시줄 창 미리보기를 담는 패널 |
  | SystemTray | 작업 표시줄 오른쪽의 시계 영역 |
  | ShellSurface | Start와 검색 패널의 공통 바탕 |
  | StartMenuFooter | Start 아래 줄 |
  | ProfileButton | 프로필 사진과 이름 버튼 |
  | PinnedTile | Start 고정 앱과 새 탭 최신 글의 타일 |
  | SearchResults | Start 검색과 검색 패널이 함께 쓰는 검색 결과 영역 |
  | BestMatchCard | 검색 결과의 최고 일치 카드 |
  | FileItem | 바탕화면과 탐색기 아이콘 보기의 파일·폴더 항목 |
  | FileRow | 탐색기 자세히 보기의 파일·폴더 한 줄 |
  | ColumnHeader | 자세히 보기의 열 머리글 하나 |
  | DetailsHeader | 자세히 보기의 열 머리글 줄 |
  | ExplorerTab | 탐색기 탭 |
  | NavigationItem | 탐색기 왼쪽 목록의 항목 |
  | NavigationPane | 탐색기 왼쪽 목록 |
  | Breadcrumb | 탐색기 주소 표시줄의 경로 |
  | BreadcrumbItem | 경로의 칸 하나 |
  | ExplorerContent | 탐색기 창 본문 |
  | ExplorerAddressRow | 탐색기의 이동 버튼, 경로, 검색 줄 |
  | ExplorerCommandBar | 탐색기 명령 모음 |
  | ExplorerStatusBar | 탐색기 상태 표시줄 |
  | BrowserTab | Chrome 탭 |
  | BrowserTabStrip | Chrome 탭 줄 |
  | BrowserToolbar | Chrome 도구 모음 |
  | AddressBar | Chrome 주소창 |
  | Toc | 글 목차 |
  | TocItem | 글 목차의 항목 |
  | PostNavCard | 글 아래의 이전 글·다음 글 카드 |
  | BootScreen | 다시 시작할 때의 재부팅 화면 |
상태: |
  상태 변형(`State`)의 이름과 뜻이다. 모든 컴포넌트가 모든 상태를 갖지는 않는다. 캡처할 때 상태를 재현하는 방법은 [[피그마 연동:스토리 규칙]]을 따른다.

  | 상태 | 뜻 | 캡처 재현 |
  |---|---|---|
  | `Rest` | 기본 | args |
  | `Hover` | 마우스를 올림 | 실제 마우스 |
  | `Pressed` | 누르는 중 | 실제 마우스 |
  | `Focused` | 키보드 포커스 | 실제 키보드 |
  | `Disabled` | 쓸 수 없음 | args |
  | `Selected` | 선택됨 | args |
  | `Selected focus` | 선택된 채 포커스를 받음 | args |
  | `Rename` | 이름을 바꾸는 중 | args |
  | `Cut` | 잘라냄 | args |
  | `Cut selected` | 잘라낸 채 선택됨 | args |
  | `Inactive` | 창이 활성 상태가 아님 | args |
  | `Active` | 활성 창이거나 지금 고른 탭임 | args |
  | `Expanded` | 펼쳐짐 | args |
  | `Collapsed` | 접힘 | args |
  | `Editing` | 경로 대신 주소를 입력하는 중 | args |
  | `Suggesting` | 입력하는 중이고 추천 목록이 열려 있음 | args |
  | `Closed` | 팝업이 닫혀 트리거만 보임 | args |
  | `Open` | 팝업이나 하위 메뉴가 열려 있음 | args |

  - `Closed`·`Open`은 `Popover`와, 트리거와 팝업을 묶은 조립(예: `Start/PowerButton`, `Taskbar/AppMenu`)이 갖는다. 트리거 컴포넌트(IconButton, Button, DropDownButton, TaskbarButton, 하위 메뉴가 있는 MenuItem)는 `Open` 변형을 갖지 않는다.
  - 팝업이 열려 있어도 트리거는 `Rest` 모양 그대로다. Windows(WinUI)도 팝업이 뜨면 바깥 클릭을 받는 막이 마우스를 가져가 트리거가 평소 모양으로 돌아간다. 코드에서는 열림 상태(`aria-expanded`)로만 구분한다.
  - 예외: 작업 표시줄 앱 버튼은 창 미리보기(`Taskbar/AppPreview`)가 떠 있는 동안 `Hover` 모양이다. 창 미리보기는 마우스를 올려 여는 팝업이라 그동안 마우스가 버튼 위에 있기 때문이다. 우클릭 메뉴(`Taskbar/AppMenu`)가 열렸을 때는 다른 트리거처럼 `Rest` 모양이다.
  - 메뉴가 열린 화면에서는 그 메뉴를 연 트리거를 담은 조립이 `Open`이다([[디자인 시스템:팝업]]).
