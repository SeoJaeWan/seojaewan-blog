_codocs:
  id: component-list
  name: 컴포넌트 목록
  parent:
    - 디자인 시스템
개요: |
  디자인 시스템이 제공하는 컴포넌트 목록이다. 피그마 01 · Components 페이지와 `packages/design-system`의 컴포넌트가 이 목록과 같다.
  [[제품 정의:첫 공개 범위]]에 필요한 것에서 뽑았고, 화면별 세부 기능을 정하면서 변형이 늘거나 줄 수 있다. 모바일 전용 컴포넌트가 필요한지는 모바일 동작을 정할 때 판단한다.

  컴포넌트는 상태별 변형(기본, hover, pressed, disabled, 선택)을 갖는다. 동작과 상태 관리는 담지 않는다([[디자인 시스템:범위]]).
기본 컨트롤: |
  | 컴포넌트 | 쓰이는 곳 |
  |---|---|
  | Button(강조·기본·투명 변형), IconButton | 다이얼로그, 툴바, 창 버튼 |
  | SearchBox | Start 검색, 탐색기 검색 |
  | Menu(MenuItem, 구분선, 하위 메뉴, 단축키 표시) | 우클릭 메뉴, 탐색기 메뉴 |
  | Tooltip | 아이콘 버튼, Taskbar |
  | ScrollArea | Windows 11 스타일 얇은 스크롤바 |
  | Flyout | Start 메뉴, 검색 패널 같은 떠 있는 패널의 공통 바탕 |
  | ProgressRing | 글 로딩 |
Windows 화면 요소: |
  | 컴포넌트 | 쓰이는 곳 |
  |---|---|
  | WindowFrame(제목 표시줄, 최소화·최대화·닫기 버튼) | 모든 앱 창 |
  | Taskbar, TaskbarButton(실행 중·활성 표시) | 작업 표시줄 |
  | StartMenu(고정 앱 그리드, 추천 목록) | Start |
  | DesktopIcon(선택·hover 상태) | 바탕화면 |
  | NavigationItem | 탐색기 왼쪽 목록 |
  | FileItem(아이콘 보기·목록 보기) | 탐색기 본문 |
  | Breadcrumb | 탐색기 주소 표시줄 |
  | BrowserTab, BrowserTabStrip, AddressBar | Chrome |
  | SystemTray(시계) | Taskbar 오른쪽 |
