_codocs:
  id: design-foundations
  name: 디자인 기반
  parent:
    - 디자인 시스템
개요: |
  모든 컴포넌트가 공통으로 따르는 모드, 색, 서체, 재질 효과, 아이콘, 토큰 이름 규칙이다.
  피그마의 00 · Foundations 페이지와 `packages/design-system`의 토큰이 이 규칙을 따른다.
모드: |
  첫 공개는 라이트 모드만 제공한다.
  다만 토큰은 처음부터 Primitive → Semantic → Component 구조로 만든다. 나중에 다크 모드를 더할 때 Semantic 토큰에 모드만 추가하면 되고, 컴포넌트는 고치지 않는다.
토큰 이름: |
  - 3단계다. Primitive(실제 값, 예: `blue-60`) → Semantic(의미) → Component(꼭 필요한 예외에만).
  - Semantic 토큰은 WinUI 테마 리소스 이름 체계를 따른다. 예: `TextFillColorPrimary` → `text-fill/primary`, `AccentFillColorDefault` → `accent-fill/default`, `ControlFillColorDefault` → `control-fill/default`.
  - 공식 UI Kit, Microsoft 문서, WinUI 소스가 같은 이름을 쓰므로 "이 색이 Windows에서 무엇이었는가"를 이름으로 바로 찾을 수 있다.
  - 컴포넌트는 Semantic 토큰만 쓴다. Primitive를 직접 쓰거나 임의 값을 쓰는 것은 lint로 막는다([[기술 스택:스타일링]]).
  - 같은 이름이 피그마 Variables, 토큰 JSON, Tailwind `@theme`에 그대로 쓰인다.
강조색: |
  Windows 라이트 모드 기본 파랑(공식 UI Kit 값)을 쓴다.
  강조색은 선택 상태, 기본 버튼, 포커스 테두리, Taskbar 실행 중 표시에 두루 쓰이며 `accent` 계열 토큰으로만 관리해 나중에 바꾸기 쉽게 한다.
서체: |
  라틴 문자는 Selawik, 한글은 Pretendard를 웹 폰트로 쓴다. CSS에서는 `unicode-range`로 나눠 맡긴다.

  - Windows 11 기본 서체인 Segoe UI Variable은 라이선스상 웹 폰트로 배포할 수 없다.
  - 시스템 서체에 맡기면 OS마다 달라 보이고, Segoe UI가 없는 CI(Linux)에서 대체 서체로 그려져 [[피그마 일치 검사]]가 의미 없어진다. 그래서 피그마, 로컬, CI, 방문자가 모두 같은 웹 폰트를 쓴다.
  - Selawik은 Microsoft가 Segoe UI 대체용으로 공개한 서체로, Segoe UI와 글자 폭이 맞아 Windows 느낌에 가장 가깝다.
  - 두 서체 모두 SIL Open Font License다.
재질 효과: |
  Mica(창 배경에 바탕화면이 흐릿하게 비침)와 Acrylic(뒤 내용이 흐리게 비치는 반투명, Start·메뉴·플라이아웃)을 모든 화면에서 충실하게 재현한다.
  개인 블로그이자 포트폴리오라 성능보다 Windows 11 느낌의 재현을 우선한다.

  - Acrylic: `backdrop-filter: blur()`에 반투명 색과 노이즈 질감을 얹는다.
  - Mica: 흐리게 처리한 배경화면을 창 뒤에 깔아 흉내 낸다.

  피그마 배경 블러와 브라우저 `backdrop-filter`는 계산 방식이 달라 픽셀 비교가 어렵다. 그래서 테스트할 때만 효과를 끄는 스위치를 두고, 피그마 일치 검사는 효과를 뺀 상태로 비교한다. 재질 효과는 Storybook에서 눈으로 확인한다.
아이콘: |
  - UI 아이콘(닫기, 최소화, 검색, 화살표 등): Fluent UI System Icons(MIT). 피그마 라이브러리와 `@fluentui/react-icons`로 피그마와 코드가 같은 아이콘을 쓴다.
  - 앱 아이콘: File Explorer, Chrome 등 실제 로고를 쓴다. Chrome 로고는 Google의 상표이지만 개인 포트폴리오에서 화면을 재현하는 용도로 쓴다.
  - 폴더·문서 같은 파일 아이콘은 Windows 11 계열 아이콘을 쓴다. 구체적인 출처는 컴포넌트를 만들 때 정한다.
