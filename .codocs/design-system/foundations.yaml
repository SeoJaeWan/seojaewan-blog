_codocs:
  id: design-foundations
  name: 디자인 기반
  parent:
    - 디자인 시스템
개요: |
  모든 컴포넌트가 공통으로 따르는 모드, 색, 서체, 재질 효과, 아이콘, 토큰 이름 규칙이다.
  피그마의 00 · Foundations 페이지와 `packages/design-system`의 토큰이 이 규칙을 따른다.
모드: |
  첫 공개는 라이트 모드만 제공한다.
  다만 토큰은 처음부터 Primitive → Semantic → Component 구조로 만든다. 나중에 다크 모드를 더할 때 Semantic 토큰에 모드만 추가하면 되고, 컴포넌트는 고치지 않는다.
토큰 이름: |
  - 3단계다. Primitive(실제 값, 예: `blue-60`) → Semantic(의미) → Component(꼭 필요한 예외에만).
  - Semantic 토큰은 WinUI 테마 리소스 이름 체계를 따른다. 예: `TextFillColorPrimary` → `text-fill/primary`, `AccentFillColorDefault` → `accent-fill/default`, `ControlFillColorDefault` → `control-fill/default`.
  - 공식 UI Kit, Microsoft 문서, WinUI 소스가 같은 이름을 쓰므로 "이 색이 Windows에서 무엇이었는가"를 이름으로 바로 찾을 수 있다.
  - 컴포넌트는 Semantic 토큰만 쓴다. Primitive를 직접 쓰거나 임의 값을 쓰는 것은 lint로 막는다([[기술 스택:스타일링]]).
  - 같은 이름이 피그마 Variables, 토큰 JSON, Tailwind `@theme`에 그대로 쓰인다.
강조색: |
  Windows 라이트 모드 기본 파랑을 쓴다. 버튼 등에 실제로 칠하는 강조 채우기는 `#005FB8`(WinUI의 AccentFillColorDefault)다.
  강조색은 선택 상태, 기본 버튼, 포커스 테두리, 입력창 포커스 테두리, Taskbar 실행 중 표시에 두루 쓰이며 `accent` 계열 토큰으로만 관리해 나중에 바꾸기 쉽게 한다. Windows UI kit은 입력창 포커스 테두리에 `#0067C0`을 쓰지만, 일관성을 위해 강조색 토큰에 묶는다.
서체: |
  라틴 문자(영어, 숫자, 기호)는 Open Sans, 한글은 Pretendard를 쓴다. 피그마와 코드가 같은 서체를 쓴다.

  - 웹에서는 `font-family: 'Open Sans', 'Pretendard'`로 둔다. Open Sans에는 한글이 없으므로 브라우저가 글자마다 라틴은 Open Sans, 한글은 Pretendard로 그린다.
  - 피그마도 같은 결과가 나오게 한다. 한글만 있는 글자는 Pretendard, 라틴만 있는 글자는 Open Sans, 섞인 글자는 문자 범위마다 서체를 나눠 적용한다.
  - 굵기는 Regular, SemiBold, Bold만 쓴다. 피그마가 제공하는 Pretendard가 이 세 굵기뿐이고, 코드도 피그마와 같아야 하기 때문이다.
  - 두 서체 모두 SIL Open Font License이며 웹 폰트로 제공한다. 피그마, 로컬, CI, 방문자가 모두 같은 서체로 보게 해야 [[피그마 일치 검사]]가 의미가 있다.

  검토한 대안:
  - Segoe UI Variable: Windows 11 기본 서체지만 라이선스상 웹 폰트로 배포할 수 없다.
  - 시스템 서체: OS마다 달라 보이고 CI(Linux)에는 Segoe UI가 없다.
  - Selawik: Microsoft가 Segoe UI 대체용으로 공개한 서체로 Windows 느낌에 가장 가깝지만, 피그마 MCP가 실행되는 피그마 서버 환경에 없다. 서버에 서체를 올리는 공유 서체 기능은 Organization·Enterprise 플랜 전용이다. 피그마에서 불러올 수 없는 서체로 쓴 글자는 MCP로 고칠 수 없어 피그마 작업을 자동화할 수 없고, 피그마에서만 다른 서체를 쓰면 글자 모양과 폭이 달라 일치 검사가 깨진다.
  - Open Sans는 Segoe UI를 디자인한 Steve Matteson이 만든 서체라 형태가 비슷하고, 피그마 서버 환경에도 있어 골랐다.
재질 효과: |
  Mica(창 배경에 바탕화면이 흐릿하게 비침)와 Acrylic(뒤 내용이 흐리게 비치는 반투명, Start·메뉴·플라이아웃)을 모든 화면에서 충실하게 재현한다.
  개인 블로그이자 포트폴리오라 성능보다 Windows 11 느낌의 재현을 우선한다.

  - Acrylic: `backdrop-filter: blur()`에 Windows UI kit의 틴트·루미너스 층과 노이즈 질감을 얹는다.
  - Mica: 흐리게 처리한 배경화면을 창 뒤에 깔아 흉내 낸다.
  - 블러 세기와 층 구성은 피그마 Foundations의 값을 따른다. 이 값은 Windows UI kit의 `Blur / Acrylic`, `Blur / Mica`, Acrylic·Mica 배경 스타일과 대조해 맞췄다.
  - 노이즈 질감은 Windows UI kit의 노이즈 이미지(256×256 PNG)를 그대로 쓴다. 피그마에서는 `Material/Acrylic Default`·`Material/Acrylic Base` 스타일의 맨 위 층(바둑판 반복, 불투명도 2%)으로 넣었고, 코드도 같은 이미지와 값을 쓴다. `Material/Fallback/*` 단색 스타일에는 넣지 않는다.

  피그마 배경 블러와 브라우저 `backdrop-filter`는 계산 방식이 달라 픽셀 비교가 어렵다. 그래서 테스트할 때만 효과를 끄는 스위치를 두고, 피그마 일치 검사는 효과를 뺀 상태(컴포넌트의 `Material=Solid` 변형)로 비교한다. 재질 효과는 Storybook에서 눈으로 확인한다.
아이콘: |
  - UI 아이콘(닫기, 최소화, 검색, 화살표 등): Fluent UI System Icons(MIT, github.com/microsoft/fluentui-system-icons). 피그마에는 이 저장소의 SVG 경로를 그대로 넣고, 코드는 `@fluentui/react-icons`를 써서 피그마와 코드가 같은 아이콘을 쓴다.
  - Windows 자산은 Windows 11 PC에 들어 있는 원본에서 가져왔다. 추측하거나 다시 그리지 않기 위해서다.

  | 자산 | 출처 |
  |---|---|
  | 폴더, 문서 아이콘 | Windows 셸이 그리는 아이콘을 256px로 추출 |
  | 휴지통(빈·찬) | `imageres.dll` 아이콘 리소스 55·54를 256px로 추출 |
  | File Explorer 앱 아이콘 | `explorer.exe` 아이콘을 256px로 추출 |
  | Chrome 앱 아이콘 | 설치된 `chrome.exe` 아이콘을 256px로 추출. Google의 상표이지만 개인 포트폴리오에서 화면을 재현하는 용도로 쓴다 |
  | Windows 로고 | 시스템 앱의 `WindowsLogo.svg`(그라데이션 로고) |
  | 외부 링크 아이콘 | Fluent UI System Icons의 `link` 컨러 아이콘 |
  | Bloom 배경 | `C:\Windows\Web\Wallpaper\Windows\img0.jpg` |

  프로필 사진은 아직 임시 이미지다. 아이콘과 배경은 피그마 컴포넌트 원본 하나에 들어 있어, 원본을 바꾸면 쓰는 곳이 모두 바뀐다. 코드는 6단계에서 같은 파일을 저장소의 정적 자산으로 쓴다.
