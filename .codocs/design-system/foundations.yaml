_codocs:
  id: design-foundations
  name: 디자인 기반
  parent:
    - 디자인 시스템
개요: |
  모든 컴포넌트가 공통으로 따르는 모드, 색, 서체, 레이아웃, 간격과 크기, 재질 효과, 테두리, 포커스, 그림자, 회전, 자산, 모션과 토큰 이름의 디자인 결정이다.
  피그마의 00 · Foundations 페이지와 `packages/design-system`의 토큰이 이 규칙을 따른다.
  코드의 재현 방법과 생성·내보내기·검증 절차는 [[피그마 연동]]에서 정한다.
모드: |
  Windows 11 UI는 라이트 모드만 둔다. 다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다. 그래서 Windows UI의 토큰과 컴포넌트에는 모드를 추가하지 않는다. macOS UI를 어떻게 구성할지는 [[미결 사항:다크 모드(macOS UI)]]에 남겨 두었다.
  토큰은 Primitive → Semantic → Component 구조로 만든다([[디자인 기반:토큰 이름]]).
토큰 이름: |
  - 3단계다. Primitive(실제 값) → Semantic(의미) → Component(꼭 필요한 예외에만).
  - Primitive 색은 값 이름이다.
    - 무채색은 `color/white`, `color/gray/100`~`color/gray/1000`(클수록 진함), `color/black`이다. 단계 사이 값은 `color/gray/550`처럼 쓰고, 변수 설명에 원래 색 값을 적는다.
    - 강조색은 Windows 단계 이름(`light-3`~`base`~`dark-3`)을 쓴다. 예: `color/blue/dark-1`.
    - 투명도는 끝에 `/<불투명도%>`를 붙인다. 예: `color/white/70`, `color/gray/500/76`, `color/blue/dark-1/90`.
    - WinUI 밖에서 온 팔레트(Chrome, 탐색기, 배경화면)는 출처 이름 묶음에 출처의 값 그대로 둔다.
  - Semantic 토큰은 WinUI 테마 리소스 이름 체계를 따른다. 예: `TextFillColorPrimary` → `text-fill/primary`, `AccentFillColorDefault` → `accent-fill/default`, `ControlFillColorDefault` → `control-fill/default`. 공식 UI Kit, Microsoft 문서, WinUI 소스가 같은 이름을 쓰므로 "이 색이 Windows에서 무엇이었는가"를 이름으로 바로 찾을 수 있다.
  - Semantic 토큰은 값이 같아도 합치지 않는다. 이름이 쓰임을 나타내고, 나중에 한쪽 값만 바뀔 수 있기 때문이다. 아직 옮겨 오지 않은 WinUI 테마 리소스는 쓸 곳이 생길 때 옮긴다.
  - Component 색은 `<컴포넌트>/<갈래>/<역할>` 꼴이다. 예: `file-item/desktop/*`(바탕화면 항목), `file-item/explorer/*`(탐색기 항목), `chrome/tab-separator`. 00 · Foundations 페이지의 `Color — Component` 프레임에 따로 둔다.
  - 컴포넌트는 Semantic과 Component 토큰만 쓴다. 클래스 사용을 강제하는 방법은 [[피그마 연동:토큰 사용 강제]]에서 정한다.
  - 피그마 경로가 곧 코드 이름의 바탕이다. 코드 이름은 [[피그마 연동:토큰 생성]]의 규칙으로 정해진다.
강조색: |
  Windows 라이트 모드 기본 파랑을 쓴다. 버튼 등에 실제로 칠하는 강조 채우기는 `#005FB8`(WinUI의 AccentFillColorDefault)다.
  강조색은 선택 상태, 기본 버튼, 포커스 테두리, 입력창 포커스 테두리, Taskbar 실행 중 표시에 두루 쓰이며 `accent` 계열 토큰으로만 관리해 나중에 바꾸기 쉽게 한다. Windows UI kit은 입력창 포커스 테두리에 `#0067C0`을 쓰지만, 일관성을 위해 강조색 토큰에 묶는다.
서체: |
  라틴 문자(영어, 숫자, 기호)는 Open Sans, 한글은 Pretendard를 쓴다. 피그마와 코드가 같은 서체를 쓴다.

  - 피그마도 같은 결과가 나오게 한다. 한글만 있는 글자는 Pretendard, 라틴만 있는 글자는 Open Sans, 섞인 글자는 문자 범위마다 서체를 나눠 적용한다.
  - 굵기는 Regular, SemiBold, Bold만 쓴다. 피그마가 제공하는 Pretendard가 이 세 굵기뿐이고, 코드도 피그마와 같아야 하기 때문이다.
  - 두 서체 모두 SIL Open Font License이며 웹 폰트로 제공한다. 피그마, 로컬, CI, 방문자가 모두 같은 서체로 보게 해야 캡처 표의 비교가 의미가 있다([[피그마 연동:캡처 표]]).
  - 글 본문의 코드 블록만 고정폭 서체 Cascadia Mono(Microsoft, SIL Open Font License)를 쓴다. 글자 폭이 같아야 들여쓰기와 줄 맞춤이 맞기 때문이다. Windows Terminal의 기본 서체라 Windows 느낌과도 맞고, 기호를 이어 그리는 합자가 없어 입력할 문자 그대로 보인다. 코드 안의 한글은 Pretendard로 그린다. 피그마 텍스트 스타일은 `Code`와 `Hangul/Code`, 서체 변수는 `font/family/code`다.
  - 글자 스타일은 두 벌이다. 라틴 스타일(`Body`, `Body Strong` 등)과 같은 이름의 한글 스타일(`Hangul/Body` 등)이다. 분리 이유는 [[디자인 기반:검토한 대안]], 영향과 재시도 조건은 [[한계:한글 글자 스타일 두 벌]]에서 확인한다. 두 벌은 같은 크기·굵기·줄 높이·자간 변수에 연결한다. 코드 표현은 [[피그마 연동:서체 구현]]을 따른다.
  - 글 본문의 링크처럼 밑줄이 있는 글자는 밑줄을 글자에 직접 넣지 않고 밑줄이 든 글자 스타일을 쓴다. `Body Large Link`·`Hangul/Body Large Link`는 `Body Large`에 밑줄을 더한 것이다. 링크 색은 칠 변수로 따로 준다.

  서체 선택에서 검토한 대안은 [[디자인 기반:검토한 대안]]에 있다.
레이아웃: |
  컴포넌트 안의 배치는 모두 자동 배치(Auto layout)로 만든다. 방향, 정렬, 줄바꿈이 CSS flex와 1:1로 대응해 코드로 옮길 때 좌표를 재지 않아도 된다.

  - 수동 배치(자동 배치가 아닌 프레임 안에 자식을 두고 x·y로 위치를 정하는 것)는 쓰지 않는다. 자식이 없는 프레임(사각형처럼 쓰는 것)은 괜찮다.
  - 방향(가로·세로), 주축·교차축 정렬, 크기 방식(HUG 내용에 맞춤, FILL 부모 채움, FIXED 고정), 줄바꿈, 내용 자르기만 쓴다. 고정 크기는 [[디자인 기반:크기 변수]]를 따른다.
  - 겹쳐 놓아야 하는 요소는 [[디자인 기반:겹쳐 놓기]]를 따른다.
  - GRID 자동 배치는 쓰지 않는다. 고르지 않은 기능과 이유는 [[디자인 기반:검토한 대안]]에서 확인한다.
  - 바탕화면 아이콘을 위에서 아래로 채우는 배치는 디자인이 아니라 앱이 하는 배치다. 아이콘 하나(FileItem)만 컴포넌트로 두고, 아이콘을 늘어놓는 배치는 앱 코드(CSS grid 등)가 정한다.
  - 슬롯(SLOT, 다른 컴포넌트를 넣는 자리)은 빈 자리다. 칠·선·효과와 자리표시 꾸밈(점선 등)을 넣지 않는다. 이유는 [[디자인 기반:검토한 대안]]에서 확인한다.
겹쳐 놓기: |
  요소를 다른 요소 위에 겹쳐 놓는 경우를 넷으로 나눈다.

  1. 장식: 포커스 테두리처럼 컴포넌트 모양에 딸린 장식은 겹쳐 놓은 레이어가 아니라 그 레이어의 선이나 효과 스타일로 그린다([[디자인 기반:포커스 표현]]).
  2. 실행 중에 정해지는 값: 창과 바탕화면 아이콘의 위치, 선택 상자(SelectionMarquee)의 위치와 크기, 스크롤바 막대의 위치와 길이는 앱 코드가 실행 중에 정한다. 컴포넌트 원본에는 기본값만 크기 변수로 두고, Screens의 인스턴스는 그 값을 덮어써도 된다. 스크롤바 막대 길이는 Screens에서도 덮어쓰지 않는다.
  3. 진짜 겹침(배지, 검색창 밑줄 등): 자동 배치 안의 절대 위치(ABSOLUTE) 자식으로만 둔다. 제약(constraints)은 왼쪽·위(MIN), 오른쪽·아래(MAX), 양쪽 늘이기(STRETCH), 가운데(CENTER)를 쓰고 비례(SCALE)는 쓰지 않는다. 양쪽 늘이기 축의 크기는 부모에서 나오는 크기라 크기 변수에 연결하지 않는다. 예: SearchBox `bottom border`는 가로 양쪽 늘이기, 세로 아래, 거리 0이고, 루트가 내용 자르기를 켜 둥근 끝에서 밑줄이 일자로 잘린다.
  4. 트리거에 붙는 팝업: 메뉴·툴팁·플라이아웃처럼 버튼 옆에 뜨는 것은 [[디자인 시스템:팝업]]을 따른다.
간격 단계: |
  여백과 간격은 Fluent 2와 같은 간격 단계 `spacing/<숫자>`만 쓴다: 0, 2, 4, 6, 8, 10, 12, 16, 20, 24, 32, 40, 48(px). CSS 변수와 클래스 이름으로 옮기는 방법은 [[피그마 연동:토큰 생성]]을 따른다.

  - 피그마에서 여백과 간격은 이 변수에 연결한다.
  - 단계가 더 필요하면 Foundations의 `spacing/*` 변수를 먼저 더하고 토큰을 다시 내보낸다. 숫자를 직접 넣어 우회하지 않는다.
크기 변수: |
  고정(FIXED) 크기는 반드시 크기 변수에 연결한다. 연결 안 된 숫자는 플러그인이 막는다([[피그마 연동:구조 검사]]).

  - 변수를 만들기 전에 정말 고정이어야 하는지 먼저 본다. 내용에 맞춤(HUG)이나 부모 채움(FILL)이 맞으면 그쪽을 쓴다.
  - 크기 변수는 Dimension 컬렉션에 두고 컴포넌트 이름을 붙이지 않는다. 여러 컴포넌트가 함께 쓰는 역할이 있는 것만 역할 이름(`size/icon/*`, `size/control/*`)으로 두고, 나머지는 값 이름 `size/<숫자>`로 쓴다(예: 폭 240 → `size/240`). 컴포넌트마다 변수를 두면 같은 값이 여러 이름으로 흩어지기 때문이다.
  - 같은 값의 변수는 하나만 둔다. 값이 같은 변수가 여럿이면 하나로 합치고 쓰는 곳을 다시 연결한다.
  - 역할 이름(`size/icon/*`, `size/control/*`)은 컴포넌트 작업 중에 새로 만들지 않고, 필요하면 Foundations에서 먼저 정한다.
  - 실행 중에 정해지는 크기(스크롤바 막대 길이, 선택 상자 크기)는 원본에 기본값 변수만 둔다([[디자인 기반:겹쳐 놓기]]).
  - 절대 위치 자식의 양쪽 늘이기 축 크기는 변수에 연결하지 않는다([[디자인 기반:겹쳐 놓기]]).
  - 컴포넌트 루트와 내부, 인스턴스 크기 덮어쓰기 모두 같은 규칙이다.
  - 예외: 배율(`scaleFactor`가 1이 아님) 인스턴스 자체의 크기는 변수에 연결하지 않고 플러그인도 검사하지 않는다. 크기는 그것을 담는 칸이 변수로 지킨다. 배율이 고정(진행 링 0.5·2)일 수도 칸에 맞춘 값(창 축소 화면)일 수도 있어 결과 크기가 토큰이 아닐 수 있고, 피그마가 배율 인스턴스의 크기를 변수에 연결하면 배율을 풀어 버리기 때문이다([[피그마 연동:구조 검사]]).
  - 선 두께는 크기 변수가 아니라 언제나 `stroke-width/*`를 쓴다.
  - 사용처가 0인 크기·색 변수는 지운다. 지우기 전에 Screens까지 포함해 센다.
  - 변수 이름을 바꾸거나 합치기 전에 인스턴스의 크기 덮어쓰기를 기록하고, 바꾼 뒤 되돌린다. 원본 크기를 변수에 연결하면 인스턴스가 덮어쓴 크기가 지워지기 때문이다([[한계:피그마 API 덮어쓰기 함정]]).
  - 크기 견본은 00 · Foundations의 Layout 프레임 한 곳에 둔다([[한계:Layout 안내 프레임 수동 갱신]]).
재질 효과: |
  Mica(창 배경에 바탕화면이 흐릿하게 비침)와 Acrylic(뒤 내용이 흐리게 비치는 반투명, Start·메뉴·플라이아웃)을 모든 화면에서 충실하게 재현한다.
  개인 블로그이자 포트폴리오라 성능보다 Windows 11 느낌의 재현을 우선한다.

  재질은 배경 블러(효과 스타일 `Material/*`)와 반투명 바탕색(색 변수) 두 가지로 만든다. 노이즈 질감은 넣지 않는다. 보이지 않는 층(불투명도 0인 틴트 층)은 두지 않는다. Windows UI에는 다크 모드가 없어 틴트 층이 보일 일이 없기 때문이다([[디자인 기반:모드]]).

  - Acrylic(Menu, Tooltip, Flyout, Scrollbar, ShellSurface, Taskbar 등 잠깐 떠 있는 것): 뒤에 있는 것 전부를 흐리게 하고, 반투명한 거의 흰색 바탕을 일반 섞기로 덮는다. 루미너시티 방식을 고르지 않은 이유는 [[디자인 기반:검토한 대안]], 차이와 재시도 조건은 [[한계:아크릴 일반 섞기]]에서 확인한다.
    - 반투명은 색 변수의 투명도로 정한다. 피그마는 연결할 때 변수 색의 투명도를 칠 불투명도로 옮겨 오고, 그린 결과에는 칠 불투명도만 적용된다(변수 투명도와 곱하지 않는다). 코드와 같은 투명도를 유지하도록 연결한 뒤 칠 불투명도를 따로 바꾸지 않는다.
  - Mica(WindowFrame, 앱 창의 바탕): Acrylic과 같이 배경 블러(효과 스타일 `Material/Mica`)와 반투명 바탕색으로 만든다. 바탕색이 거의 불투명해 창 뒤의 배경화면 색감만 옅게 비친다.
    - 색은 `mica-background-fill/base`(`#F3F3F3`, 불투명도 95%)다. 불투명도 선택 이유는 [[디자인 기반:검토한 대안]], 비교 결과는 [[한계:마이카 일반 섞기]]에 있다.
  - 블러 세기와 바탕색은 피그마 Foundations의 값을 따른다. 이 값은 Windows UI kit의 `Blur / Acrylic`, `Blur / Mica`, Acrylic·Mica 배경 스타일과 대조해 맞췄다.
  - 재질을 직접 칠하는 컴포넌트는 투명 효과를 끈 단색 변형(`Material=Solid`)도 갖는다. 단색은 색 변수다. `Material` 변형을 누가 갖는지는 [[디자인 시스템:컴포넌트 조립 규칙]]에 있다.
  - 코드에서 재질을 그리는 방법과 비교 제약은 [[피그마 연동:재질 구현]]을 따른다.
컨트롤 테두리: |
  WinUI 컨트롤의 1px 테두리는 단색이 아니라 아래쪽 몇 픽셀만 진해지는 세로 그라데이션이다(WinUI의 `ControlElevationBorderBrush` 계열). 버튼이 살짝 떠 보이게 하는 효과라 Windows 느낌에 중요하다.
  피그마에는 `Elevation/Control Border`, `Text Control Border`, `Accent Control Border` 칠 스타일로 두었고(쓰는 곳이 없는 스타일은 두지 않는다), 정지점 색은 Semantic 색 토큰(`control-stroke/*` 등)에 묶여 있다.

  안쪽 선은 요소 크기 안에, 자식보다 위에 그린다. 선이 레이아웃에 포함되는 프레임과 일반 안쪽 선의 코드 구현은 [[피그마 연동:컨트롤 테두리 구현]]에서 정한다.
포커스 표현: |
  키보드 포커스(Focused 상태)는 컨트롤 바깥쪽(OUTSIDE)에 단색 선 한 겹으로 그린다. 색은 `focus-stroke/outer`, 두께는 `stroke-width/focus-outer`(2px)다. Button(Accent, Standard, Subtle)과 IconButton이 같은 방식이다.

  - Focused 상태에서는 입체감 테두리(안쪽 그라데이션 선, [[디자인 기반:컨트롤 테두리]])를 빼고, 그 자리의 선을 바깥쪽 단색 선으로 바꾼다. 선 구성의 제약은 [[디자인 기반:검토한 대안]]에서 확인한다.
  - 포커스 테두리를 별도 레이어나 퍼짐 그림자로 만들지 않는다. 고르지 않은 이유는 [[디자인 기반:검토한 대안]]에서 확인한다.
  - 안쪽 흰 선을 더한 두 겹은 쓰지 않는다([[한계:포커스 테두리 한 겹]]). 바깥쪽 선은 요소의 반경을 그대로 따라가 포커스용 반경 변수가 필요 없다.

  코드에서 바깥쪽 선을 그리는 방법은 [[피그마 연동:포커스 구현]]에서 정한다.
그림자: |
  그림자와 배경 블러는 효과 스타일로만 쓴다. 효과 스타일 이름은 담은 효과로 나눈다.

  | 묶음 | 담는 것 | 예 |
  |---|---|---|
  | `Elevation/*` | 그림자만 | `Elevation/Flyout` |
  | `Material/*` | 배경 블러만 | `Material/Acrylic` |
  | `Surface/*` | 그림자와 배경 블러를 함께 | `Surface/Flyout (Acrylic)` |
  | `Text/*` | 글자 그림자 | |

  - 이 묶음에 맞지 않거나 쓰지 않는 효과 스타일은 두지 않는다.
  - 효과 스타일의 그림자는 "투명한 부분 뒤에도 표시"(showShadowBehindNode)를 끈다. Windows 11과 같게 반투명 표면(Acrylic 플라이아웃·메뉴·툴팁) 안쪽에 그림자가 비치지 않게 하기 위해서다. 켠 그림자는 플러그인이 막는다([[피그마 연동:구조 검사]]).
회전: |
  회전은 90° 배수(90°, -90°, 180°)만 쓴다. 아이콘 화살표 방향을 맞출 때(Scrollbar 화살표, NavigationItem 쉐브론, ColumnHeader 정렬 화살표) 쓴다.

  코드 클래스와 피그마·CSS 사이 회전 방향 변환은 [[피그마 연동:회전 구현]]에서 정한다.
자산: |
  CSS로 그릴 수 없는 모양과 이미지는 모두 00 · Foundations 페이지 `Foundations / Assets` 프레임의 이름 있는 자산 컴포넌트로 두고, 컴포넌트와 화면에서는 그 인스턴스를 쓴다. 원본을 바꾸면 쓰는 곳이 모두 바뀌고, 코드도 같은 이름의 자산 파일을 쓴다([[피그마 연동:자산]]).

  | 묶음 | 담는 것 | 색 |
  |---|---|---|
  | Icons | UI 아이콘(Fluent `ic_fluent_*`) | 한 가지 색. 쓰는 곳의 색 변수로 칠한다 |
  | Shapes | 한 가지 색 특수 도형(진행 링 호 `progress-ring/Arc`, 툴팁 꼬리 `tooltip/Tail fill`·`tooltip/Tail border`) | 한 가지 색. 쓰는 곳의 색 변수로 칠한다. 칠과 테두리 색이 다른 도형은 칠 자산과 테두리 자산 둘로 나눠 겹쳐 쓴다 |
  | Illustrations | 여러 색 벡터(`file/*`, `app/*`, `logo/*`, Fluent 컬러 아이콘 `icon-color/*`) | 자산 안에 둔다 |
  | Images | 래스터 이미지(`avatar/*`, `wallpaper/*`) | 자산 안에 둔다 |

  - 묶음마다 `group/<묶음>` 프레임에 넣는다. 플러그인이 이 프레임 이름으로 내보내는 방식을 정한다.
  - 완전한 원과 사각형은 자산으로 두지 않는다. 코드에서 그리는 방법은 [[피그마 연동:자산]]에서 정한다.
  - 이미지는 이름 있는 Images 자산으로만 쓴다. 배경화면(`wallpaper/Bloom`)도 Images 자산이다. 플러그인은 이미지 해시로 자산 이름을 찾고, 이름 있는 자산에 없는 이미지는 막는다.
  - UI 아이콘은 Fluent UI System Icons(MIT, github.com/microsoft/fluentui-system-icons)의 SVG 경로를 그대로 넣었다. 코드는 피그마에서 내보낸 같은 SVG를 쓴다.
  - Windows 자산은 Windows 11 PC에 들어 있는 원본에서 가져왔다. 추측하거나 다시 그리지 않기 위해서다.

  | 자산 | 출처 |
  |---|---|
  | 폴더, 문서 아이콘 | Windows 셸이 그리는 아이콘을 256px로 추출 |
  | 휴지통(빈·찬) | `imageres.dll` 아이콘 리소스 55·54를 256px로 추출 |
  | File Explorer 앱 아이콘 | `explorer.exe` 아이콘을 256px로 추출 |
  | Chrome 앱 아이콘 | 설치된 `chrome.exe` 아이콘을 256px로 추출. Google의 상표이지만 개인 포트폴리오에서 화면을 재현하는 용도로 쓴다 |
  | Windows 로고 | 시스템 앱의 `WindowsLogo.svg`(그라데이션 로고) |
  | 외부 링크 아이콘 | Fluent UI System Icons의 `link` 컬러 아이콘 |
  | 컬러 돋보기(`icon-color/Search`) | Fluent UI System Icons의 `search` 컬러 아이콘. 그라데이션은 칠 스타일 `Icon Color/Search`(`color/blue/dark-1` → `color/green/light-2` #78BF91)이다 |
  | Bloom 배경 | `C:\Windows\Web\Wallpaper\Windows\img0.jpg` |

  프로필 사진은 아직 임시 이미지다.
모션: |
  창·패널·메뉴의 움직임은 Windows 11 모션 지침(Microsoft Learn의 "Motion in Windows", "Timing and easing")의 값을 따른다.
  값은 피그마 `Motion` Variables 컬렉션에 두고, 움직임의 구성은 아래 동작별 표와 피그마 견본([[디자인 기반:모션 견본]])이 기준이다. 코드는 이 값과 구성으로 `motion.css`의 모션 클래스를 만든다([[피그마 연동:모션 클래스]]).
  피그마에 화면 흐름 프로토타입(화면을 오가는 연결, 화면 사이 열기·닫기 장면)은 두지 않는다([[디자인 시스템:Screens]]). Motion 섹션의 견본은 화면 흐름이 아니라 모션 클래스 하나의 기준이라 이와 다르다.

  | 토큰 | 값 | 근거·쓰는 곳 |
  |---|---|---|
  | `motion/duration/faster` | 83ms | WinUI `ControlFasterAnimationDuration`. hover·pressed 상태 전환, 투명도만 바꾸는 페이드(검색 돋보기 등), 새로 고침 깜빡임 |
  | `motion/duration/fast` | 167ms | WinUI `ControlFastAnimationDuration`. 우클릭 메뉴·플라이아웃·메시지 상자 등장, 창 닫기, Start 글자 목록 열기·닫기, 재부팅 화면 나타남 |
  | `motion/duration/normal` | 250ms | WinUI `ControlNormalAnimationDuration`. 창 열기, Start·검색 패널 올라오기, 최대화·복원·스냅, 재부팅 화면 사라짐 |
  | `motion/duration/slow` | 333ms | Windows 모션 표의 가장 긴 단계. 창 최소화·작업 표시줄에서 복원(이동 거리가 큰 동작) |
  | `motion/easing/direct-entrance` | `cubic-bezier(0, 0, 0, 1)` | Fast Out, Slow In. 들어오는 요소(창 열기, 패널·메뉴 등장)와 Direct exit(창 닫기, 항상 페이드 아웃과 함께) |
  | `motion/easing/point-to-point` | `cubic-bezier(0.55, 0.55, 0, 1)` | 이미 화면에 있는 요소의 위치·크기 변화(최대화·복원, 스냅, 최소화·복원) |
  | `motion/easing/gentle-exit` | `cubic-bezier(1, 0, 1, 1)` | Slow Out, Fast In. 화면 밖으로 나가는 패널(Start·검색 패널 내려가기) |
  | `motion/easing/fade` | `linear` | 투명도만 바꾸는 페이드 |
  | `motion/scale/window-enter` | 0.96 | 창이 열릴 때 시작 배율·닫힐 때 끝 배율. 투명도 0 ↔ 1과 함께. Windows 11 화면을 보고 맞춘 근사값이다 |
  | `motion/scale/window-minimize` | 0.12 | 최소화할 때 창이 작업 표시줄 앱 버튼 위치로 줄어드는 끝 배율(복원할 때 시작 배율). 투명도도 0으로 |
  | `motion/delay/boot-screen` | 2500ms | 다시 시작할 때 재부팅 화면을 보여주는 시간 |
  | `motion/duration/progress-ring` | 2000ms | WinUI ProgressRingIndeterminate 한 주기(2초). ProgressRing 호가 한 주기(회전 + 트림)를 도는 시간. 견본 키프레임 트랙 길이가 이 값과 같아야 한다([[피그마 연동:모션]]) |
  | `motion/easing/progress-ring` | `cubic-bezier(0.167, 0.167, 0.833, 0.833)` | WinUI ProgressRing 원본 곡선. ProgressRing 호의 회전과 트림 |

  이징 변수는 피그마 `EASING` 타입이라 피그마가 키프레임을 그 곡선으로 재생한다. CSS 값으로 옮기는 규칙은 [[피그마 연동:토큰 생성]]에 있다.

  동작별 조합:

  | 동작 | 클래스 | 지속 시간 | 이징 | 내용 | 실행 중 값 |
  |---|---|---|---|---|---|
  | 창 열기 | `motion-window-open` | normal | direct-entrance | 배율 0.96 → 1, 투명도 0 → 1 | 없음 |
  | 창 닫기 | `motion-window-close` | fast | direct-entrance | 배율 1 → 0.96, 투명도 1 → 0 | 없음 |
  | 최소화 | `motion-window-minimize` | slow | point-to-point | 작업 표시줄 앱 버튼 쪽으로 줄며 사라진다 | 도착 위치(작업 표시줄 앱 버튼) |
  | 작업 표시줄에서 복원 | `motion-window-restore` | slow | point-to-point | 최소화의 반대. 앱 버튼 위치에서 커지며 나타난다 | 출발 위치(작업 표시줄 앱 버튼) |
  | 최대화·복원·스냅 | `motion-window-snap` | normal | point-to-point | 위치와 크기를 이어서 바꾼다(FLIP, [[피그마 연동:모션 클래스]]) | 이전 위치·크기 |
  | Start·검색 열기 | `motion-panel-enter` | normal | direct-entrance | 화면 아래에서 미끄러져 올라온다. 작업 표시줄 플라이아웃은 모두 같은 방향으로 올라오고 내려간다 | 없음 |
  | Start·검색 닫기 | `motion-panel-exit` | fast | gentle-exit | 아래로 내려가며 사라진다 | 없음 |
  | 우클릭 메뉴·메시지 상자 | `motion-flyout-enter` | fast | direct-entrance | 페이드로 나타난다 | 없음 |
  | Start 글자 목록 열기 | `motion-start-jump-list-enter` | fast | direct-entrance, 투명도는 fade | 글자 격자가 배율 1.15에서 1로 줄며 페이드 인한다. 목록은 같은 시간 동안 페이드 아웃한다 | 없음 |
  | Start 글자 목록 닫기 | `motion-start-jump-list-exit` | fast | direct-entrance, 투명도는 fade | 글자 격자가 1에서 배율 1.15로 커지며 페이드 아웃한다. 고른 글자로 이동한 목록은 같은 시간 동안 페이드 인한다 | 없음 |
  | 재부팅 화면 나타남 | `motion-boot-screen-enter` | fast | fade | 지금 화면 전체를 덮으며 페이드 인한다 | 없음 |
  | 재부팅 화면 사라짐 | `motion-boot-screen-exit` | normal | fade | 페이드 아웃하며 처음 상태의 바탕화면이 보인다 | 없음 |
  | ProgressRing 회전 | `motion-progress-ring` | progress-ring | progress-ring | 호가 돌며 길이가 늘고 준다(회전 + 경로 트림). 계속 반복한다([[디자인 기반:모션 견본]]) | 없음 |
  | hover·pressed | `motion-control-state` | faster | fade | 상태 색만 바꾼다 | 없음 |
  | 검색 상자 포커스(pill·taskbar 모양) | `motion-search-box-focus-state` | fast | direct-entrance | Rest → Focused 상태 색과 테두리를 바꾼다 | 없음 |
  | 검색 돋보기 | `motion-search-icon-state` | 들어갈 때 faster, 나올 때 즉시 | fade | 회색·컬러 돋보기를 겹쳐 투명도만 바꾼다([[검색:입력칸]]) | 없음 |

  글자 목록의 시작 배율(1.15)처럼 토큰이 아닌 숫자는 견본에서 화면을 보고 정하는 구성이다([[피그마 연동:모션]]).

  컴포넌트 상태 전환(Rest → Hover 등, 검색 돋보기 포함)은 피그마 변형 사이 프로토타입 전환에 이 토큰 값을 쓴다. 코드의 상태 전환 구현은 [[피그마 연동:모션 클래스]]를 따른다.
모션 견본: |
  피그마 00 · Foundations 페이지의 Motion 섹션에 모션 클래스마다 견본 프레임을 하나씩 둔다. 견본 프레임 이름은 클래스 이름(`motion-window-open`)과 같고, 견본마다 각자의 타임라인을 가진다.
  모션 클래스는 토큰·자산처럼 여러 컴포넌트가 함께 쓰는 기반이라 Foundations에 둔다. 견본은 화면 흐름이 아니라 모션 클래스 하나의 기준이다([[디자인 시스템:Screens]]).

  - 요소 전체가 움직이는 것(창·패널·메뉴): 견본 안에 실제 컴포넌트 인스턴스를 놓고 인스턴스 전체에 키프레임을 건다.
  - 안쪽이 움직이는 것(ProgressRing의 호): 키프레임을 자산 원본(`progress-ring/Arc`)에 건다. 원본 키프레임은 모든 인스턴스로 이어지고, 인스턴스 안쪽 레이어에는 키프레임을 걸 수 없기 때문이다. 견본 `motion-progress-ring`에는 ProgressRing 인스턴스만 놓는다.
  - hover·pressed·focus 전환은 Motion 섹션이 아니라 컴포넌트 변형 사이 전환에 둔다([[디자인 기반:모션]]).
  - 실행 중 값이 들어간 움직임은 대표값으로 만든다. 예: 최소화 견본에는 작업 표시줄 버튼 자리를 두고 그 위치로 줄어드는 대표 움직임을 보여 준다.
  - 키프레임의 시간·지연·이징을 넣는 방법과 내보낼 때의 검사는 [[피그마 연동:모션]]을 따른다.

  ProgressRing의 호:
  - 호 자산 `progress-ring/Arc`는 끝점을 잇지 않은 열린 원 경로(선, 둥근 끝)로 그리고, 회전(`ROTATION`)과 경로 트림(`PATH_TRIM_START`·`PATH_TRIM_END`) 키프레임을 건다. 닫힌 도형과 점선에는 트림을 쓸 수 없기 때문이다.
  - 값은 WinUI ProgressRing의 Lottie 애니메이션(회전 + 트림)에서 가져온다.
  - 호 자산을 코드에서 움직일 수 있는 경로로 내보내는 방법은 [[피그마 연동:모션]]에서 정한다.
  - 키프레임 기본값(baseValue)은 멈춘 호 모습으로 둔다. 피그마 PNG에는 기본값이 찍히므로, 애니메이션을 끈 코드 그림과 같아야 캡처 표가 의미가 있다([[피그마 연동:캡처 표]]).
검토한 대안: |+
  규칙에서 고르지 않은 방법과 선택 이유를 모은다. 디자인 규칙은 각 섹션, 영향과 재시도 조건은 연결된 [[한계]] 항목에서 확인한다.

  서체 선택:
  - Segoe UI Variable: Windows 11 기본 서체지만 라이선스상 웹 폰트로 배포할 수 없다.
  - 시스템 서체: OS마다 달라 보이고 CI(Linux)에는 Segoe UI가 없다.
  - Selawik: Microsoft가 Segoe UI 대체용으로 공개한 서체로 Windows 느낌에 가장 가깝지만, 피그마 MCP가 실행되는 피그마 서버 환경에 없다. 서버에 서체를 올리는 공유 서체 기능은 Organization·Enterprise 플랜 전용이다. 피그마에서 불러올 수 없는 서체로 쓴 글자는 MCP로 고칠 수 없어 피그마 작업을 자동화할 수 없고, 피그마에서만 다른 서체를 쓰면 글자 모양과 폭이 달라 피그마와 코드가 같아질 수 없다.
  - Open Sans는 Segoe UI를 디자인한 Steve Matteson이 만든 서체라 형태가 비슷하고, 피그마 서버 환경에도 있어 골랐다.
  - 한글·라틴 글자 스타일을 한 벌로 통일: 피그마는 서체에 없는 글자를 다른 서체로 대신 그리지 못한다. Open Sans에 한글이 없어 한글용 `Hangul/*` 스타일(Pretendard)이 따로 있고, 한글과 영문이 섞인 글자는 구간마다 스타일을 나눠 입힌다. 코드의 서체 대체와 스타일 표현은 [[피그마 연동:서체 구현]]에서 정한다.

  재질:
  - Acrylic·Mica에 루미너시티 혼합 적용: 피그마는 블렌드 모드가 일반이 아닌 칠에 색 변수를 연결하면 블렌드를 일반으로 바꾼다. 루미너시티를 지키면 "시각 값은 모두 변수에 연결한다"를 지킬 수 없다([[피그마 연동:구조 검사]]). 코드 구현에서 검토한 재질 방식은 [[피그마 연동:검토한 대안]]에 있다.
  - 마이카 불투명도 선택: 실제 Windows 마이카와 같은 배경화면 위에서 견본을 비교해, 가까운 값 가운데 배경화면이 조금 비치는 95%를 골랐다. 측정 결과는 [[한계:마이카 일반 섞기]]에 있다.

  테두리:
  - 두 겹 포커스 선·별도 레이어·퍼짐 그림자: 피그마 선은 레이어마다 한 겹, 한 위치만 된다. 겹쳐 놓은 레이어는 크기를 변수에 묶을 수 없다. 퍼짐 그림자로 두 겹을 흉내 내는 방법도 시험했지만, 피그마는 채움이 완전히 투명한 노드(Subtle 버튼)와 내용 자르기를 끈 프레임에서 퍼짐 그림자를 그리지 않는다.

  피그마 기능:
  - GRID 자동 배치, 점선·슬롯 자리표시 꾸밈·노이즈·텍스처: 코드로 같게 그릴 수 없거나(점선 간격, 노이즈), 코드로 옮기는 규칙을 따로 만들어야 하는데 쓰는 곳이 없다(GRID). CSS로 못 그리는 도형은 Foundations 자산으로만 쓴다. 지금 필요한 GRID 배치는 가로 배치와 줄바꿈으로 된다. 슬롯 꾸밈은 코드가 그리지 않는 모양이다.

동작 줄이기: |
  동작 줄이기는 Windows의 "애니메이션 효과"를 끈 것과 같은 기준이다. 코드 적용은 [[피그마 연동:모션 클래스]]에서 정한다.
  - 움직임 없이 바로 바뀌는 것: 창·패널·메뉴·글자 목록의 등장·퇴장, 최소화·최대화·스냅, 재부팅 화면 전환
  - 그대로 두는 것: hover·pressed 색 전환, 검색 돋보기 페이드, ProgressRing 회전(진행 정보라서), 재부팅 화면을 보여주는 시간(`motion/delay/boot-screen`. 보여 주는 시간이라서)
