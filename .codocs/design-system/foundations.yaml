_codocs:
  id: design-foundations
  name: 디자인 기반
  parent:
    - 디자인 시스템
개요: |
  모든 컴포넌트가 공통으로 따르는 디자인 결정과 피그마 작성 규칙이다. 왜 그렇게 정했는지, 피그마에 어떻게 만드는지를 둔다.
  값과 모양, 그 뜻과 쓰임은 피그마 01 · Foundations 페이지의 변수·스타일 description과 섹션 설명 글에 있다([[디자인 시스템:피그마 파일]]). `packages/design-system`의 토큰이 그 값을 따른다.
  코드의 재현 방법과 생성·내보내기·검증 절차는 [[피그마 연동]]에서 정한다.
모드: |
  Windows 11 UI는 라이트 모드만 둔다. 다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다. 그래서 Windows UI의 토큰과 컴포넌트에는 색 모드를 추가하지 않는다. macOS UI를 어떻게 구성할지는 [[미결 사항:다크 모드(macOS UI)]]에 남겨 두었다.
  화면 크기 모드는 예외로 둔다(PC·노트북·모바일 세 구간, [[반응형:기준]]). 어느 구간에 드는지도 그 섹션을 따르고, 코드로 옮기는 방법은 [[피그마 연동:토큰 생성]]을 따른다. 클래스는 `:root` 값이 바뀌면 따라가므로 컴포넌트에 구간별 분기를 두지 않는다. 실행 중 계산에 쓰는 값(창 기본 크기)은 숫자로 옮기지 않고 `:root` 변수에서 읽는다.
  색은 계열·명도 원색 한 층으로 만든다([[디자인 기반:토큰 이름]]). 라이트 모드만 두므로 모드마다 값을 바꿔 줄 의미 층이 필요 없다.
토큰 이름: |
  - 색은 계열·명도 원색 한 층만 둔다. 의미 색 층(Semantic)과 컴포넌트 색 층(Component)을 두지 않고, 컴포넌트가 원색을 바로 쓴다. 고르지 않은 3단계 구성은 [[디자인 기반:검토한 대안]]에 있다.
  - 색 이름은 `color/<계열>/<명도>`다. 예: `color/gray/11`, `color/blue/41`.
    - 명도는 CIELAB L* 기준 1 단위이고, 이름의 숫자는 `round(100 − L*)`다. 0이 가장 밝고 100이 가장 어둡다.
    - 계열은 색상각으로 정한다(gray, blue, cyan, red, orange, yellow …). 경계에 있는 색은 `#e0e5ed`를 `gray`, `#9d5d00`을 `yellow`로 정했다.
    - 불투명한 흰색과 검정은 `color/white`, `color/black`이다.
    - 반투명한 흰색과 검정은 `color/white/<알파%>`, `color/black/<알파%>`다. 예: `color/white/70`, `color/black/6`.
    - 그 밖의 반투명 색은 `color/<계열>/<명도>/<알파%>`다. 예: `#f9f9f980` → `color/gray/2/50`.
    - Chrome·탐색기에서 온 색도 출처 이름이 아니라 계열·명도 이름을 쓴다.
    - 이름을 바꿀 때 값은 그대로 둔다.
    - 예외: `#005fb8`(Windows 강조색)과 `#0853e0`(검색 그라데이션 파랑)은 계산하면 둘 다 `blue/59`라, 그라데이션 파랑만 `color/blue/58`로 둔다.
    - 원색 변수의 범위(scope)는 그 값을 쓰던 예전 의미·컴포넌트 색 범위를 합친 것이다. 변수 설명에는 값만 적는다.
  - 값이 거의 같은 다섯 쌍은 하나로 합쳤다: `#202124`→`#1f1f1f`, `#d3e3fd`→`#cce8ff`, `#f9f9f980`→`#f6f6f680`, `#dfe3e7`→`#dadada`, `#e9eef6`→`#e5f3ff`. 상태를 구분하는 쌍(`#e9eef6`/`#e0e5ed` 등)과 Windows 바탕 층(`#f3f3f3`/`#f9f9f9`/`#ffffff`)은 값이 가까워도 합치지 않는다.
  - 검색 그라데이션(칠 스타일 `Icon Color/Search Focus`)은 끝 색을 원색 변수(`color/blue/…`, `color/cyan/…`)에 연결한다.
  - 명도를 5·10 단위로 한 번 더 줄이는 정리는 나중에 한다([[남은 작업]]).
  - 코드는 원색 클래스를 바로 쓴다. 클래스 사용을 강제하는 방법은 [[피그마 연동:토큰 사용 강제]]에서 정한다.
  - 피그마 경로가 곧 코드 이름의 바탕이다. 코드 이름은 [[피그마 연동:토큰 생성]]의 규칙으로 정해진다.
강조색: |
  강조색의 값과 쓰임은 피그마 강조색 변수의 description에 있다. Windows UI kit은 입력창 포커스 테두리에 `#0067C0`을 쓰지만, 일관성을 위해 강조색 토큰에 묶는다.
서체: |
  서체, 굵기, 글자 스타일, 글 본문 서식의 이름과 뜻은 피그마 글자 스타일·변수의 description과 Foundations `Typography` 섹션 글에 있다.

  - 피그마도 같은 결과가 나오게 한다. 한글만 있는 글자는 Pretendard, 라틴만 있는 글자는 Open Sans, 섞인 글자는 문자 범위마다 서체를 나눠 적용한다.
  - 굵기를 셋으로 둔 것은 피그마가 제공하는 Pretendard가 이 세 굵기뿐이고, 코드도 피그마와 같아야 하기 때문이다.
  - 두 서체 모두 SIL Open Font License이며 웹 폰트로 제공한다. 피그마, 로컬, CI, 방문자가 모두 같은 서체로 보게 해야 피그마와 코드의 모습 비교가 의미가 있다.
  - 코드 블록은 고정폭 서체 Nanum Gothic Coding(NHN, SIL Open Font License 1.1, 피그마 이름 `NanumGothicCoding`)을 쓴다. 글자 폭이 같아야 들여쓰기와 줄 맞춤이 맞는다. 한글이 든 고정폭 서체 하나로 코드의 라틴과 한글을 모두 그려 한 줄에 서체가 섞이지 않는다. 섞이면 피그마가 글자 상자 높이를 1px 더 잡기 때문이다. 한글 폭이 라틴의 정확히 2배라 줄 맞춤도 일정하다. 그래서 코드 서체에는 Pretendard를 대체로 두지 않는다.
  - 글자 스타일을 두 벌로 나눈 이유는 [[디자인 기반:검토한 대안]], 영향과 재시도 조건은 [[한계:한글 글자 스타일 두 벌]]에서 확인한다. 코드 표현은 [[피그마 연동:서체 구현]]을 따른다.
  - 밑줄·취소선이 있는 글자는 글자에 직접 넣지 않고 그 장식이 든 글자 스타일을 쓴다.
  - 코드도 Open Sans Italic 웹 폰트를 함께 제공해 브라우저가 기울임을 흉내 내지 않게 한다.

  서체 선택에서 검토한 대안은 [[디자인 기반:검토한 대안]]에 있다.
레이아웃: |
  컴포넌트 안의 배치는 모두 자동 배치(Auto layout)로 만든다. 방향, 정렬, 줄바꿈이 CSS flex와 1:1로 대응해 코드로 옮길 때 좌표를 재지 않아도 된다.

  - 수동 배치(자동 배치가 아닌 프레임 안에 자식을 두고 x·y로 위치를 정하는 것)는 쓰지 않는다. 자식이 없는 프레임(사각형처럼 쓰는 것)은 괜찮다.
  - 방향(가로·세로), 주축·교차축 정렬, 크기 방식(HUG 내용에 맞춤, FILL 부모 채움, FIXED 고정), 줄바꿈, 내용 자르기만 쓴다. 고정 크기는 [[디자인 기반:크기 변수]]를 따른다.
  - 겹쳐 놓아야 하는 요소는 [[디자인 기반:겹쳐 놓기]]를 따른다.
  - GRID 자동 배치는 쓰지 않는다. 고르지 않은 기능과 이유는 [[디자인 기반:검토한 대안]]에서 확인한다.
  - 바탕화면 아이콘을 위에서 아래로 채우는 배치는 디자인이 아니라 앱이 하는 배치다. 아이콘 하나(FileItem)만 컴포넌트로 두고, 아이콘을 늘어놓는 배치는 앱 코드(CSS grid 등)가 정한다.
  - 슬롯(SLOT, 다른 컴포넌트를 넣는 자리) 자체(슬롯 프레임)에는 칠·선·효과와 자리표시 꾸밈(점선 등)을 넣지 않는다. 슬롯의 기본 내용은 실제 컴포넌트다([[디자인 시스템:컴포넌트 조립 규칙]]). 꾸밈을 넣지 않는 이유는 [[디자인 기반:검토한 대안]]에서 확인한다.
겹쳐 놓기: |
  요소를 다른 요소 위에 겹쳐 놓는 경우를 넷으로 나눈다.

  1. 장식: 포커스 테두리처럼 컴포넌트 모양에 딸린 장식은 겹쳐 놓은 레이어가 아니라 그 레이어의 선이나 효과 스타일로 그린다([[디자인 기반:포커스 표현]]).
  2. 실행 중에 정해지는 값: 창과 바탕화면 아이콘의 위치, 선택 상자(SelectionMarquee)의 위치와 크기, 스크롤바 막대의 위치와 길이는 앱 코드가 실행 중에 정한다. 컴포넌트 원본에는 기본값만 크기 변수로 두고, Screens의 인스턴스는 그 값을 덮어써도 된다. 스크롤바 막대 길이는 Screens에서도 덮어쓰지 않는다. 코드는 브라우저 스크롤바를 숨기고 Scrollbar를 겹쳐 그리는 동작 도구로 넘치는 영역을 감싼다. Scrollbar는 내용이 넘치면 가는 선이 늘 보이고(스크롤하는 동안도), 스크롤바 칸에 마우스를 올렸을 때만 두꺼운 막대와 위·아래 화살표로 펼친다. 끄는 동안은 칸 밖이어도 펼친 채다. 실제 Windows와 같고, 피그마 Scrollbar `State=Expanded`가 이 펼친 모습이다. 넘치는 영역을 감싸는 ScrollArea는 코드 전용이다([[컴포넌트 목록:코드 전용 컴포넌트]]). 예외로 Chrome 창 안 웹 페이지(글 페이지 영역, 코드 블록·수식의 가로 스크롤 포함)의 스크롤은 꾸미지 않은 브라우저 기본 스크롤바를 그대로 쓴다. 실제 브라우저 스크롤바가 곧 실제 Chrome 스크롤바이기 때문이다. 목차는 글 페이지 안이지만 디자인한 UI 부품이라 이 예외에서 빼고 디자인 시스템 ScrollArea를 쓴다([[Chrome:글 화면]]).
  3. 진짜 겹침(배지, 검색창 밑줄 등): 자동 배치 안의 절대 위치(ABSOLUTE) 자식으로만 둔다. 제약(constraints)은 왼쪽·위(MIN), 오른쪽·아래(MAX), 양쪽 늘이기(STRETCH), 가운데(CENTER)를 쓰고 비례(SCALE)는 쓰지 않는다. 양쪽 늘이기 축의 크기는 부모에서 나오는 크기라 크기 변수에 연결하지 않는다. 예: SearchBox `bottom border`는 가로 양쪽 늘이기, 세로 아래, 거리 0이고, 루트가 내용 자르기를 켜 둥근 끝에서 밑줄이 일자로 잘린다.
  4. 트리거에 붙는 팝업: 메뉴·툴팁·플라이아웃처럼 버튼 옆에 뜨는 것은 [[디자인 시스템:팝업]]을 따른다.
간격 단계: |
  여백과 간격은 Fluent 2와 같은 간격 단계 `spacing/*`만 쓴다. 단계는 피그마 Foundations `Spacing` 섹션에 있다. CSS 변수와 클래스 이름으로 옮기는 방법은 [[피그마 연동:토큰 생성]]을 따른다.

  - 피그마에서 여백과 간격은 이 변수에 연결한다.
  - 단계가 더 필요하면 Foundations의 `spacing/*` 변수를 먼저 더하고 토큰을 다시 내보낸다. 숫자를 직접 넣어 우회하지 않는다.
크기 변수: |
  고정(FIXED) 크기는 크기 변수에 연결한다. 변수에 연결한 크기만 고정 크기로 내보낸다([[피그마 연동:구조 검사]]). 크기 변수는 코드가 쓰는 치수만 둔다. `size/<컴포넌트>/*`처럼 컴포넌트의 실제 치수는 한 컴포넌트만 써도 변수로 둔다.

  변수 없는 숫자로 두는 크기:
  - 견본 크기: 피그마에서 부모 채움(FILL) 컴포넌트를 혼자 보이게 하려고 원본 루트에 준 폭·높이다([[디자인 시스템:컴포넌트 조립 규칙]]). 안쪽 레이어의 견본 크기(예: Equation의 `formula`)도 같다. 따로 표시하지 않고, 변수에 연결하지 않은 숫자를 견본 크기로 본다. 변수를 빠뜨린 진짜 고정 크기는 구조 검사로 잡지 못한다([[피그마 연동:구조 검사]]). KRDS도 입력창 원본 폭을 숫자로 둔다. `Figma` 스토리의 `FigmaFrame`은 `export.json`의 숫자로 이 크기를 준다([[테스트 작성 규칙:스토리 테스트]]).
  - 조립 안의 크기: 조립 루트, 프레임, 인스턴스에서 덮어쓴 크기(고정·최소·최대)다. 간격·여백은 그대로 토큰이다([[디자인 시스템:조립]]).
  - 화면 크기(`screen/*`, `shell/*`, `window/mobile-*`, `chrome-page/*`, `explorer/content-*`, `search-body/height` 등): 코드가 실제로 쓰는 값(예: `window-rules.ts`가 쓰는 값)만 토큰으로 둔다.
  - 피그마에서만 쓰는 크기: 조립, 화면의 크기와 그 안에서 움직임을 건 인스턴스의 크기는 숫자다.
  - 스토리에서만 쓰는 크기도 토큰으로 두지 않는다. 스토리가 크기를 주는 방법은 [[테스트 작성 규칙:스토리 테스트]]에 있다.

  - 변수를 만들기 전에 정말 고정이어야 하는지 먼저 본다. 내용에 맞춤(HUG)이나 부모 채움(FILL)이 맞으면 그쪽을 쓴다.
  - 크기 변수는 Dimension 컬렉션에 둔다. 아이콘 크기는 단계 이름(`size/icon/*`), 나머지 크기는 역할 이름이다.
  - 같은 값이라도 역할이 다르면 다른 변수다. 이름이 쓰임을 나타내고 나중에 한쪽 값만 바뀔 수 있기 때문이다. 역할이 같은데 값이 같은 변수는 하나로 합치고 쓰는 곳을 다시 연결한다.
  - 역할 이름(`size/icon/*`, `size/control/*`)은 컴포넌트 작업 중에 새로 만들지 않고, 필요하면 Foundations에서 먼저 정한다.
  - 실행 중에 정해지는 크기(스크롤바 막대 길이, 선택 상자 크기)는 원본에 기본값 변수만 둔다([[디자인 기반:겹쳐 놓기]]).
  - 절대 위치 자식의 양쪽 늘이기 축 크기는 변수에 연결하지 않는다([[디자인 기반:겹쳐 놓기]]).
  - 컴포넌트 루트와 내부, 컴포넌트 안의 인스턴스 크기 덮어쓰기 모두 같은 규칙이다. 조립 안의 크기는 위의 예외다.
  - 예외: 배율(`scaleFactor`가 1이 아님) 인스턴스 자체의 크기는 변수에 연결하지 않고 플러그인도 검사하지 않는다. 크기는 그것을 담는 칸이 변수로 지킨다. 배율이 고정(진행 링 0.5·2)일 수도 칸에 맞춘 값(창 축소 화면)일 수도 있어 결과 크기가 토큰이 아닐 수 있고, 피그마가 배율 인스턴스의 크기를 변수에 연결하면 배율을 풀어 버리기 때문이다([[피그마 연동:구조 검사]]).
  - 선 두께는 크기 변수가 아니라 언제나 `stroke-width/*`를 쓴다.
  - 코드와 피그마 어디에서도 쓰지 않는 토큰은 지운다. 피그마 쪽은 컴포넌트·조립·화면에서 쓰는지로 센다. Foundations의 설명용 견본에만 연결된 토큰은 견본을 숫자로 떼어 모양을 지키고 지운다. 토큰 생성이 요구하는 화면 경계값(`breakpoint/mobile/width`, `breakpoint/laptop/width`, `breakpoint/laptop/height`)만 남긴다([[피그마 연동:토큰 생성]]).
  - 변수 이름을 바꾸거나 합치기 전에 인스턴스의 크기 덮어쓰기를 기록하고, 바꾼 뒤 되돌린다. 원본 크기를 변수에 연결하면 인스턴스가 덮어쓴 크기가 지워지기 때문이다([[한계:피그마 API 덮어쓰기 함정]]).
  - 크기 변수 목록은 01 · Foundations의 `Size` 섹션 한 곳에 둔다([[한계:Size 안내 섹션 수동 갱신]]). 피그마 자동 배치와 코드 클래스의 대응표나 회전처럼 개발자만 보는 내용은 두지 않는다. 대응 규칙은 [[피그마 연동:토큰 생성]], 회전은 [[디자인 기반:회전]]에 있다.
재질 효과: |
  재질의 값은 피그마 Material 칠·효과 변수와 스타일(Foundations `Materials` 섹션)에 있다.
  개인 블로그이자 포트폴리오라 성능보다 Windows 11 느낌의 재현을 우선한다.

  틴트 층(불투명도 0인 층)을 두지 않는 것은 Windows UI에는 다크 모드가 없어 틴트 층이 보일 일이 없기 때문이다([[디자인 기반:모드]]).

  재질은 한 겹(배경 흐림 + 반투명 바탕색)으로 만든다. 값은 실제 Windows 화면과 같은 배경 위에서, 밝은 배경(하늘)과 어두운 배경을 함께 비교해 정한다(2026-11-10 측정). 2026-11-09에는 밝은 배경에서만 맞춰 어두운 배경 앞에서 크게 어두워졌고, 미카는 창 열기 애니메이션이 끝난 뒤에도 남아 창 안 흐림이 동작하지 않던 상태에서 시험했다. 피그마·플러그인·토큰 구조는 그대로 두고 값만 바꾼다.
  - 재질은 셋으로 나눈다. 셸 아크릴(작업 표시줄, Start 위쪽 검색 띠, Start 아래쪽 사용자 띠), 플라이아웃(메뉴, 범주 팝업), 미카(창 제목 줄)다.
  - 같은 재질 위에서 밝기를 나누는 곳은 재질을 새로 깔지 않고 반투명 흰색을 덧칠한다. 예: Start 본문은 셸 아크릴 위 덧칠, 범주 카드는 본문 위 덧칠이다.
  - 셸 아크릴의 띠와 본문 사이는 반투명 검정 구분선으로 나눈다([[Start 메뉴:구성]]). 구분선 색은 새 변수를 만들지 않고 기존 `color/black/6`을 쓴다.
  - 미카는 실제 Windows처럼 창 제목 줄에만 깔고, 창 본문은 불투명한 흰색 층이다.
  - 덧칠과 구분선은 조립에 직접 그린다([[디자인 시스템:조립]]).

  - 피그마는 연결할 때 변수 색의 투명도를 칠 불투명도로 옮겨 오고, 그린 결과에는 칠 불투명도만 적용된다(변수 투명도와 곱하지 않는다). 코드와 같은 투명도를 유지하도록 연결한 뒤 칠 불투명도를 따로 바꾸지 않는다.
  - 루미너시티·컨러 블렌드를 겹친 세 겹 방식을 고르지 않은 이유는 [[디자인 기반:검토한 대안]], 차이와 재시도 조건은 [[한계:아크릴 일반 섞기]]·[[한계:마이카 일반 섞기]]에서 확인한다.
  - `Material` 변형을 누가 갖는지는 [[디자인 시스템:컴포넌트 조립 규칙]]에 있다.
  - 코드에서 재질을 그리는 방법과 비교 제약은 [[피그마 연동:재질 구현]]을 따른다.
컨트롤 테두리: |
  테두리의 모양과 뜻은 피그마 컨트롤 테두리 칠 스타일과 그 description에 있다. 쓰는 곳이 없는 스타일은 두지 않는다.

  안쪽 선은 요소 크기 안에, 자식보다 위에 그린다. 선이 레이아웃에 포함되는 프레임과 일반 안쪽 선의 코드 구현은 [[피그마 연동:컨트롤 테두리 구현]]에서 정한다.
포커스 표현: |
  키보드 포커스(Focused 상태)의 모양은 피그마 포커스 선 변수·스타일과 그 description에 있다.

  - 포커스 테두리를 별도 레이어나 퍼짐 그림자로 만들지 않는다. 고르지 않은 이유와 선 구성의 제약은 [[디자인 기반:검토한 대안]]에서 확인한다.
  - 안쪽 흰 선을 더한 두 겹은 쓰지 않는다([[한계:포커스 테두리 한 겹]]).

  코드에서 바깥쪽 선을 그리는 방법은 [[피그마 연동:포커스 구현]]에서 정한다.
그림자: |
  그림자와 배경 블러는 효과 스타일로만 쓴다. 효과 스타일 묶음은 피그마 Foundations `Elevation` 섹션 글에 있다.

  - 이 묶음에 맞지 않거나 쓰지 않는 효과 스타일은 두지 않는다.
  - 효과 스타일의 그림자는 "투명한 부분 뒤에도 표시"(showShadowBehindNode)를 끈다. Windows 11과 같게 반투명 표면(Acrylic 플라이아웃·메뉴·툴팁) 안쪽에 그림자가 비치지 않게 하기 위해서다. 켠 그림자는 플러그인이 막는다([[피그마 연동:구조 검사]]).
회전: |
  쓰는 각도와 쓰는 곳은 코드 전용 변수 `rotate/*`의 description에 있다.

  코드 클래스와 피그마·CSS 사이 회전 방향 변환은 [[피그마 연동:회전 구현]]에서 정한다.
자산: |
  자산 묶음과 담는 것은 피그마 Foundations `Assets` 섹션 글과 자산 description에 있다. 컴포넌트와 화면에서는 자산의 인스턴스를 쓴다. 원본을 바꾸면 쓰는 곳이 모두 바뀌고, 코드도 같은 이름의 자산 파일을 쓴다([[피그마 연동:자산]]).

  - 칠과 테두리 색이 다른 도형은 칠 자산과 테두리 자산 둘로 나눠 겹쳐 쓴다.
  - 묶음마다 `group/<묶음>` 프레임에 넣는다. 플러그인이 이 프레임 이름으로 내보내는 방식을 정한다.
  - 완전한 원과 사각형은 자산으로 두지 않는다. 코드에서 그리는 방법은 [[피그마 연동:자산]]에서 정한다.
  - 이미지는 이름 있는 Images 자산으로만 쓴다. 배경화면(`wallpaper/Bloom`)도 Images 자산이다. 플러그인은 이미지 해시로 자산 이름을 찾고, 이름 있는 자산에 없는 이미지는 막는다.
  - UI 아이콘은 Fluent UI System Icons(MIT, github.com/microsoft/fluentui-system-icons)의 SVG 경로를 그대로 넣었다. 코드는 피그마에서 내보낸 같은 SVG를 쓴다.
  - 예외: Chrome 창 안의 아이콘은 Material Symbols(Apache 2.0, `ic_material_<이름>_20_outlined`)에서 가져온다. 실제 Chrome이 Google의 Material 계열 아이콘을 쓰기 때문이다. 창 버튼(최소화·최대화·닫기)은 실제 Chrome도 Windows 모양이라 그대로 둔다.
  - Windows 자산은 Windows 11 PC에 들어 있는 원본에서 가져왔다. 추측하거나 다시 그리지 않기 위해서다.

  | 자산 | 출처 |
  |---|---|
  | 폴더, 문서 아이콘 | Windows 셸이 그리는 아이콘을 256px로 추출 |
  | 휴지통(빈·찬) | `imageres.dll` 아이콘 리소스 55·54를 256px로 추출 |
  | File Explorer 앱 아이콘 | `explorer.exe` 아이콘을 256px로 추출 |
  | Chrome 앱 아이콘 | 설치된 `chrome.exe` 아이콘을 256px로 추출. Google의 상표이지만 개인 포트폴리오에서 화면을 재현하는 용도로 쓴다 |
  | Windows 로고 | 시스템 앱의 `WindowsLogo.svg`(그라데이션 로고) |
  | 외부 링크 아이콘 | Fluent UI System Icons의 `link` 컬러 아이콘 |
  | 검색 포커스 돋보기(`icon-color/Search Focus`) | Fluent 돋보기 모양과 칠 스타일 `Icon Color/Search Focus`를 쓴다. 상태별 표현은 [[검색:입력칸]]을 따른다 |
  | Bloom 배경 | `C:\Windows\Web\Wallpaper\Windows\img0.jpg` |

  프로필 사진은 아직 임시 이미지다.
모션: |
  시간·이징·배율 값은 피그마 `Motion` Variables 컬렉션에 두고, 값 하나의 뜻은 그 변수의 description에 있다. 움직임의 구성(키프레임)은 그 움직임이 놓인 자리([[디자인 기반:모션 견본]])가 기준이다. 실행 중 값은 그 레이어의 Development 주석에 있다([[피그마 연동:구조 검사]]). 코드는 이 값과 구성으로 `motion.css`의 모션 클래스를 만든다([[피그마 연동:모션 클래스]]).
  움직임이 언제 시작되는지는 조립의 프로토타입으로 보여 주고([[디자인 시스템:조립]]), 정확한 조건은 화면별 기능 문서가 정한다. Screens에는 화면 흐름 프로토타입을 두지 않는다([[디자인 시스템:Screens]]).

  이징 변수는 피그마 `EASING` 타입이라 피그마가 키프레임을 그 곡선으로 재생한다. CSS 값으로 옮기는 규칙은 [[피그마 연동:토큰 생성]]에 있다.

  검색 돋보기 강조는 SearchBox 안에서 끝나는 상태 연동이라, 창·패널 움직임과 달리 기능 구현을 기다리지 않고 SearchBox에 바로 붙인다([[피그마 연동:PR 흐름]]).

  토큰이 아닌 숫자(토큰에 없는 배율 등)는 움직임을 화면에서 보고 정하는 구성이다([[피그마 연동:모션]]).

  컴포넌트 상태 전환(Rest → Hover 등)은 피그마 변형 사이 프로토타입 전환에 이 토큰 값을 쓴다. 코드의 상태 전환 구현은 [[피그마 연동:모션 클래스]]를 따른다.
모션 견본: |
  움직임은 그 움직임이 일어나는 자리에 키프레임으로 건다. 따로 모아 둔 견본 프레임은 두지 않는다. 01 · Foundations의 `Motion` 섹션에는 시간·이징·배율 변수와 동작 줄이기 기준([[디자인 기반:동작 줄이기]])만 둔다.

  - 안쪽이 움직이는 것(ProgressRing의 호, 이미지 스켈레톤의 반짝임, 검색 돋보기 강조): 컴포넌트·자산 원본에 건다. 원본 키프레임은 모든 인스턴스로 이어지고, 인스턴스 안쪽 레이어에는 키프레임을 걸 수 없기 때문이다. 예: 호는 자산 원본 `progress-ring/Arc`, 돋보기 강조는 자산 원본 `icon-color/Search Focus`에 건다.
  - 요소 전체가 움직이는 것(창·패널·메뉴 열기·닫기)과 여러 곳이 함께 쓰는 움직임(끌어서 순서 바꾸기 등): 조립의 프로토타입 흐름이 도착하는 프레임 안 인스턴스에 건다([[디자인 시스템:조립]]). 원본 루트에 걸면 그 컴포넌트의 모든 인스턴스(조립·화면 포함)에서 늘 재생되기 때문이다. 키프레임은 그 인스턴스에만 걸리고 원본과 다른 인스턴스로 번지지 않는다(2026-11-09 시험으로 확인했다).
  - hover·pressed·focus 전환은 컴포넌트 변형 사이 전환에 둔다([[디자인 기반:모션]]).
  - 반복 여부는 움직임을 담은 프레임의 재생 설정 Loop로 나타낸다(한 번만 도는 움직임은 끈다).
  - 실행 중 값이 들어간 움직임은 대표값으로 만들고, 실제 값이 무엇으로 정해지는지는 그 레이어의 Development 주석에 적는다. 예: 최소화는 작업 표시줄 버튼 자리로 줄어드는 대표 움직임을 보여 준다.
  - 키프레임의 시간·지연·이징을 넣는 방법과 내보낼 때의 검사는 [[피그마 연동:모션]]을 따른다.

  모션 클래스 이름은 흐름 프레임 이름, 원본 안 움직임은 원본의 Development 주석으로 적는다([[피그마 연동:모션]]).
  플러그인은 위 자리에서 움직임을 읽고, 01 · Foundations의 `Foundations / Motion` 프레임에 남은 옛 견본 프레임도 위 자리로 옮기기 전까지 함께 읽는다([[남은 작업]]). 같은 이름이 위 자리에 생기면 옛 견본은 읽지 않는다. 모두 옮긴 뒤 프레임을 지운다.

  ProgressRing의 호:
  - 호 자산 `progress-ring/Arc`는 끝점을 잇지 않은 열린 원 경로(선, 둥근 끝)로 그리고, 회전(`ROTATION`)과 경로 트림(`PATH_TRIM_START`·`PATH_TRIM_END`) 키프레임을 건다. 닫힌 도형과 점선에는 트림을 쓸 수 없기 때문이다.
  - 값은 WinUI ProgressRing의 Lottie 애니메이션(회전 + 트림)에서 가져온다.
  - 호 자산을 코드에서 움직일 수 있는 경로로 내보내는 방법은 [[피그마 연동:모션]]에서 정한다.
  - 키프레임 기본값(baseValue)은 멈춘 호 모습으로 둔다. 피그마 PNG에는 기본값이 찍히므로, 애니메이션을 끈 코드 그림과 같아야 피그마 PNG와 모습을 비교할 수 있다.
검토한 대안: |+
  규칙에서 고르지 않은 방법과 선택 이유를 모은다. 디자인 규칙은 각 섹션, 영향과 재시도 조건은 연결된 [[한계]] 항목에서 확인한다.

  색 층:
  - 3단계(Primitive 원색 → Semantic(WinUI 테마 리소스 이름) → Component 색): 토큰이 너무 많아졌다(471개). Windows UI는 라이트 모드만 두어 의미 층이 모드마다 값을 바꿀 일이 없다. KRDS(범정부 디자인 시스템)의 구성을 참고해 계열·명도 원색 한 층으로 줄였다([[디자인 기반:토큰 이름]]).

  서체 선택:
  - Segoe UI Variable: Windows 11 기본 서체지만 라이선스상 웹 폰트로 배포할 수 없다.
  - 시스템 서체: OS마다 달라 보이고 CI(Linux)에는 Segoe UI가 없다.
  - Selawik: Microsoft가 Segoe UI 대체용으로 공개한 서체로 Windows 느낌에 가장 가깝지만, 피그마 MCP가 실행되는 피그마 서버 환경에 없다. 서버에 서체를 올리는 공유 서체 기능은 Organization·Enterprise 플랜 전용이다. 피그마에서 불러올 수 없는 서체로 쓴 글자는 MCP로 고칠 수 없어 피그마 작업을 자동화할 수 없고, 피그마에서만 다른 서체를 쓰면 글자 모양과 폭이 달라 피그마와 코드가 같아질 수 없다.
  - Open Sans는 Segoe UI를 디자인한 Steve Matteson이 만든 서체라 형태가 비슷하고, 피그마 서버 환경에도 있어 골랐다.
  - Cascadia Mono(코드 서체): Windows Terminal의 기본 서체라 Windows 느낌과 맞고 합자가 없어 처음에 골랐다. 한글이 없어 피그마가 코드 안 한글을 대체 서체로 그렸고, 한 줄에 서체가 섞여 피그마가 글자 상자 높이를 1px 더 잡았다. 그래서 한글이 든 Nanum Gothic Coding으로 바꿨다([[디자인 기반:서체]]).
  - 한글·라틴 글자 스타일을 한 벌로 통일: 피그마는 서체에 없는 글자를 다른 서체로 대신 그리지 못한다. Open Sans에 한글이 없어 한글용 `Hangul/*` 스타일(Pretendard)이 따로 있고, 한글과 영문이 섞인 글자는 구간마다 스타일을 나눠 입힌다. 코드의 서체 대체와 스타일 표현은 [[피그마 연동:서체 구현]]에서 정한다.

  재질:
  - Acrylic·Mica에 루미너시티 혼합 적용: 피그마는 블렌드 모드가 일반이 아닌 칠에 색 변수를 연결하면 블렌드를 일반으로 바꾼다. 루미너시티를 지키면 "시각 값은 모두 변수에 연결한다"를 지킬 수 없다([[피그마 연동:구조 검사]]). 코드 구현에서 검토한 재질 방식은 [[피그마 연동:검토한 대안]]에 있다.
  - 세 겹(흐림 위 루미너시티 층 + 컬러 블렌드 층) 재질: 실제 Windows(WinUI)의 방식이고 2026-11-09 시험에서 실제 화면과 가장 가까웠지만, 피그마 칠·플러그인 내보내기·토큰·코드 네 곳에 모두 새 개념이 들어가 부담이 커서 고르지 않았다. 한 겹의 값만 바꿔도 지금보다 실제에 훨씬 가까웠다([[디자인 기반:재질 효과]]).
  - 마이카 불투명도 95%(처음 값)와 회색 60%·흐림 20px(2026-11-09 값): 11-09 값은 창 안 흐림이 동작하지 않던 상태에서 골라 파란색이 진하게 묻었다. 2026-11-10에 흐림을 고친 뒤 밝은 회색 약 85%·흐림 30px로 바꿨다([[한계:마이카 일반 섞기]]).

  테두리:
  - 두 겹 포커스 선·별도 레이어·퍼짐 그림자: 피그마 선은 레이어마다 한 겹, 한 위치만 된다. 겹쳐 놓은 레이어는 크기를 변수에 묶을 수 없다. 퍼짐 그림자로 두 겹을 흉내 내는 방법도 시험했지만, 피그마는 채움이 완전히 투명한 노드(Subtle 버튼)와 내용 자르기를 끈 프레임에서 퍼짐 그림자를 그리지 않는다.

  피그마 기능:
  - GRID 자동 배치, 점선·슬롯 자리표시 꾸밈·노이즈·텍스처: 코드로 같게 그릴 수 없거나(점선 간격, 노이즈), 코드로 옮기는 규칙을 따로 만들어야 하는데 쓰는 곳이 없다(GRID). CSS로 못 그리는 도형은 Foundations 자산으로만 쓴다. 지금 필요한 GRID 배치는 가로 배치와 줄바꿈으로 된다. 슬롯 꾸밈은 코드가 그리지 않는 모양이다.

동작 줄이기: |
  동작 줄이기는 Windows의 "애니메이션 효과"를 끈 것과 같은 기준이다. 코드 적용은 [[피그마 연동:모션 클래스]]에서 정한다.
  기준: 멈추면 정보가 사라지는 움직임만 남긴다. 나머지 움직임은 움직임 없이 바로 바뀐다(스켈레톤 반짝임, 검색창 페이드 포함).
  - 남기는 움직임은 피그마에서 그 움직임에 Accessibility 카테고리 주석을 달아 나타내고, 기준 한 줄은 01 · Foundations `Motion` 섹션에 둔다. 무엇을 남기는지는 그 주석이 기준이고 여기에 다시 적지 않는다([[디자인 시스템:피그마 파일]]). 플러그인이 이 주석을 읽어 코드의 예외 목록을 만든다([[피그마 연동:모션]]).
  - 진행 표시(ProgressRing)는 일반적으로 꼭 필요한 움직임으로 본다(WCAG 2.3.3 예외). 이 프로젝트는 느리게 하지 않고 그대로 돌린다.
  - hover·pressed 색 전환도 이 기준대로 서서히 바뀌지 않고 바로 바뀐다.
  - 그대로 두는 것: 재부팅 화면을 보여 주는 시간(`motion/delay/boot-screen`. 필요한 로딩이라서)
