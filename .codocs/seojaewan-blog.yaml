_codocs:
  id: seojaewan-blog
  name: seojaewan 블로그
개요: |
  seojaewan 블로그는 Windows 11 데스크톱 경험을 기반으로 한 개인 기술 블로그다.
  방문자는 바탕화면, 작업 표시줄, 파일 탐색기, 브라우저 창으로 이루어진 데스크톱 화면 안에서 글을 찾고 읽는다.

  이 문서는 프로젝트의 범위와 각 주제를 어느 문서에서 확인하는지 안내하는 목차다. 아래 섹션 하나가 `.codocs` 아래 폴더 하나에 대응한다.
  하위 문서는 논의를 거쳐 정한 기획이며, 구현 여부와 진행 상황은 이 문서들이 아니라 작업 관리 도구에서 관리한다.
범위와 기반: |
  `foundation/`. 다른 설계의 전제가 되는 결정이다.

  - 무엇을 만들고 무엇을 만들지 않는지: [[제품 정의]]
  - 글을 어디서 쓰고 사이트에 언제 반영하는지: [[콘텐츠 원천]]
  - 글 속 이미지를 어떻게 제공하는지: [[Notion 이미지 제공]]
  - 어디에 배포하는지: [[배포 환경]]
  - 무엇으로 만드는지: [[기술 스택]]
개발 컨벤션: |
  `development/`. 코드를 쓰고, 검사하고, 기록하는 방식이다. 목차는 [[개발 컨벤션]]에서 확인한다.
진행: |
  `planning/`.

  - 만드는 순서와 단계별 내용: [[구현 순서]]
  - 지금 남은 작업과 차례: [[남은 작업]]
  - 아직 정하지 않았거나 확인하지 못한 것: [[미결 사항]]
  - 작업 중에 묻지 않고 정한 것과 바꾼 문서(사람의 검토를 기다리는 곳): [[임의 작업]]
디자인 시스템: |
  `design-system/`. 토큰과 컴포넌트, 피그마 파일 구성, 디자인의 코드 구현·생성·검증 방법이다. 목차는 [[디자인 시스템]]에서 확인한다.
화면별 기능: |
  `features/`. 화면들이 무엇을 보여주고 방문자가 무엇을 할 수 있는지다. 목차는 [[화면별 기능]]에서 확인한다.
