_codocs:
  id: seo
  name: SEO와 공유 미리보기
  parent:
    - seojaewan 블로그
개요: |
  검색 엔진과 링크 공유(카카오톡 등)가 블로그의 글을 읽고 보여 주는 데 필요한 결정이다. 첫 HTML에 무엇이 들어 있어야 하는지, 메타 정보, 공유 미리보기 이미지, sitemap과 robots, 검색 엔진 등록을 다룬다.
  기능 범위는 [[제품 정의:블로그 기능]]이고, 글 주소는 [[Chrome:글 주소]], 첫 진입 창을 그리는 동작은 [[창 동작:새로고침과 첫 진입]]에서 정한다.
첫 HTML: |
  글 주소로 들어왔을 때 서버가 보내는 첫 HTML에 Chrome 창과 글 제목·본문 글자가 들어 있어야 한다. 시험해 보니 지금(첫 진입 창을 클라이언트가 그릴 때) 첫 HTML에는 바탕화면과 작업 표시줄뿐이고, 제목은 RSC 데이터 안에만 있으며, 본문은 브라우저가 `/api/posts/<slug>`로 따로 받는다. 이러면 검색 엔진과 공유 봇이 본문을 읽지 못한다.

  그래서 글 주소의 첫 진입 창을 서버에서 그린다(SSR). 찾을 수 없음(404) 첫 창은 수화한 뒤 연다. 404의 첫 HTML에도 재부팅 화면과 바탕화면이 들어 있다([[창 동작:새로고침과 첫 진입]]).
  - 글 주소 페이지가 서버에서 본문까지 읽어 넘긴다. 빌드할 때 `generateStaticParams`로 저장소 JSON의 공개 항목 HTML을 모두 만들어 둔다. 글이 바뀌면 JSON이 갱신되고 다시 배포하면서 새로 만들어진다([[콘텐츠 원천:갱신 방식]]).
  - 첫 창은 CSS로 기본 크기·가운데(모바일은 전체화면)에 그리고, 수화한 뒤 같은 요소가 자리를 이어받는다([[창 동작:새로고침과 첫 진입]]).
  - E2E로 첫 HTML에 제목·본문 글자가 있고, 하이드레이션 뒤에도 창 위치가 그대로인지 확인한다.
  - 처음 불러올 때 재부팅 화면이 화면을 덮지만([[창 동작:새로고침과 첫 진입]]) 그 아래 HTML에는 Chrome 창과 제목·본문이 그대로 있다. 같은 글자를 따로 숨겨 둔 SEO 사본(아래 검토한 대안)과 달리, 사람이 곧 보게 될 실제 화면을 잠깐 덮을 뿐이고 스크립트가 없어도 몇 초 뒤 걷힌다.

  검토한 대안:
  - 숨긴 SEO 전용 HTML(예: `aria-hidden`)을 따로 두기: 숨긴 텍스트는 검색 엔진 정책상 문제가 될 수 있고, 페이지에서 찾기(Ctrl+F)로 찾는 글자와 어긋나 쓰지 않는다. 사본 없이 실제 창을 서버에서 그리는 쪽을 골랐다.
  - Notion 내용을 저장소 JSON으로 커밋하는 정적 생성: 처음에는 글을 고칠 때마다 커밋이 필요해 버렸으나 지금은 이 안을 골랐다([[콘텐츠 원천:검토한 대안]]). 위 첫 HTML 방식과 맞고, 글이 바뀔 때마다 다시 배포한다.
메타 정보: |
  - `metadataBase`는 `https://seojaewan.com`이다.
  - `<title>`은 템플릿 `%s | seojaewan`이다. 첫 화면(`/`)은 `seojaewan`이다. `%s`는 항목의 제목이다.
  - description은 Notion의 Summary 속성이다([[콘텐츠 원천:Notion 속성]]). Summary가 비어 있으면 본문 첫 문단의 앞 160자를 쓴다. 첫 문단은 맨 위 층에서 글자가 있는 첫 문단이다. 제목, 목록, 빈 문단은 건너뛴다. 문단 안의 줄바꿈과 겹친 공백은 공백 하나로 줄이고, 코드 포인트로 160자를 센다(이모지를 반으로 자르지 않는다). 말줄임표는 붙이지 않는다. 문단이 없으면 사이트 소개를 쓴다. Summary는 자르지 않는다. 첫 화면의 사이트 소개는 "서재완의 기술 블로그입니다."라는 뜻의 한 줄이다.
  - canonical은 묶음별 경로다(`/posts/<slug>`, `/projects/<slug>`, `/about/<slug>`).
  - `og:type`은 글 주소가 `article`, 첫 화면이 `website`다. `og:locale`은 `ko_KR`, `twitter:card`는 `summary_large_image`다. `og:title`은 템플릿 없이 항목 제목만 쓴다.
  - 공개하지 않은 slug는 404이고 `noindex`다(Next.js가 붙인다). 메타 정보는 빈 값을 돌려 루트 레이아웃 것을 쓴다.
  - 글 주소는 빌드 때 만든 정적 HTML이라, 메타 정보가 브라우저·봇과 상관없이 `<head>`에 들어간다.
공유 미리보기 이미지: |
  OG 이미지를 만드는 생성기(`next/og`)는 쓰지 않고 커버 이미지를 그대로 쓴다. 시험해 보니 `next/og`(satori)에 WebP 이미지를 넣으면 빈 흰 그림이 나오고 PNG만 정상이라, 커버를 쓰려면 원본이 필요했다. 원본을 따로 저장하는 안은 서버 용량 때문에 버렸다([[Notion 이미지 제공:검토한 대안]]).

  - `og:image`는 커버의 WebP `?w=1440`이다([[Notion 이미지 제공:최적화]]). 전체 `https://` 주소로 쓴다.
  - 커버가 없는 항목과 첫 화면(`/`)은 기본 그림 하나(`og-default.png`, 배경화면 Bloom과 seojaewan.com 정도)를 쓴다.
  - `og-default.png`는 1200×630이고 `pnpm --filter @seojaewan/web generate:og-default`(`apps/web/scripts/generate-og-default.ts`)가 만든다. Bloom이나 토큰이 바뀌면 다시 실행해 커밋한다. 기본 그림에만 크기를 적고, 커버는 원본 비율을 알 수 없어 적지 않는다.
  - 카카오톡이 WebP 미리보기를 받는지는 카카오 DevTalk 글(116191)을 근거로 가능하다고 보았다(문제의 원인은 형식이 아니라 접근 차단이었다). 2026-11-08 공개 뒤 실제 카카오톡 미리보기로 확인했다([[배포 환경:공개 절차]]).
  - 카카오 미리보기 봇(User-Agent `facebookexternalhit/1.1;kakaotalk-scrap/1.0`)은 Referer 없이 이미지를 가져가므로, 이미지 서버와 Cloudflare에 Referer 검사와 봇 차단을 두지 않는다.
sitemap과 robots: |
  - `app/sitemap.ts`: 첫 화면과 세 묶음의 공개 항목을 넣는다. `lastModified`는 Notion 페이지의 `last_edited_time`이다([[콘텐츠 원천:Notion 속성]]). 글 JSON에서 읽어 글이 바뀌어 다시 배포할 때 함께 바뀐다. 첫 화면의 `lastModified`는 공개 항목 가운데 가장 늦게 고친 시각이다. 첫 화면 바탕화면 폴더가 그 항목들을 보이기 때문이다. 공개 항목이 없으면 넣지 않는다. sitemap은 웹훅이 아니라 빌드 때 만든다.
  - `app/robots.ts`: 모두 허용하고 `/api/`를 막으며 sitemap 주소를 알린다.
검색 엔진 등록: |
  공개한 뒤 Google Search Console과 네이버 서치어드바이저에 사이트를 등록한다. 사람이 직접 하며, 소유 확인용 메타 태그는 그때 받아 넣는다([[배포 환경:공개 절차]]).
