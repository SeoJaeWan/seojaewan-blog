_codocs:
  id: product-definition
  name: 제품 정의
  parent:
    - seojaewan 블로그
개요: |
  블로그가 무엇이고 첫 공개에 무엇을 담는지에 대한 결정이다.
  화면이나 기능을 더하거나 뺄지 판단할 때 이 문서를 기준으로 삼는다.
컨셉: |
  Windows 11 데스크톱 경험을 기반으로 한 개인 기술 블로그다.
  글 목록 페이지와 글 상세 페이지로 이루어진 일반 블로그가 아니라, 데스크톱 화면에서 폴더를 열어 글을 찾고 브라우저 창에서 글을 읽는다.
목적: |
  두 가지 목적을 함께 가진다.

  - 기술 글 읽기: 방문자가 기술 글을 찾고 편하게 읽을 수 있어야 한다.
  - 포트폴리오: Windows 11 경험을 얼마나 완성도 있게 재현했는지가 그 자체로 결과물이다.

  두 목적 중 어느 한쪽을 위해 다른 쪽을 포기하지 않는다. 데스크톱 재현이 글 읽기를 방해한다면 둘을 함께 만족하는 방법을 찾는다.
첫 공개 범위: |
  첫 공개에 다음 화면과 동작을 모두 포함한다.

  - Desktop: 배경화면, 바탕화면 아이콘, 우클릭 메뉴
  - Taskbar: 실행 중인 앱 표시, 고정
  - Start 메뉴와 검색
  - File Explorer: 폴더로 글 탐색
  - Chrome: 글을 읽는 브라우저 창, 탭, 주소창
  - 창 동작: 드래그, 크기 조절, 최소화·최대화
  - 모바일 대응

  각 화면의 세부 동작은 이후 기능 문서에서 정한다.
블로그 기능: |
  데스크톱 화면과 별개로 블로그로서 다음 기능을 제공한다.

  - SEO: 글마다 메타 태그, OG 이미지, sitemap을 제공해 검색과 공유에 노출되게 한다.
  - 글별 공유 링크: 글마다 고유 주소가 있고, 그 주소로 들어오면 해당 글을 연 상태로 시작한다.
언어: |
  한국어만 제공한다. 화면 문구와 글 모두 한국어다.
  다국어는 첫 공개 범위에 넣지 않는다.
만들지 않는 것: |
  - RSS 피드
  - 댓글
  - 조회수·방문 통계
  - 다국어 전환
