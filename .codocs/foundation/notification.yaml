_codocs:
  id: notification
  name: 알림 프로세스
  parent:
    - seojaewan 블로그
개요: |
  사이트에서 사람이 알아야 할 일(웹훅 갱신 실패, 이미지 서버 무응답, 배포 실패 등)이 생기면 카카오톡으로 알리는 방법에 대한 결정이다.
  알림을 보내는 서비스는 local-server 저장소가 가지고, 이 문서는 블로그가 그 서비스로 알림을 보내는 방법만 정한다.
결정: |
  블로그는 알림 서비스 notify로 보내기만 한다. 이 저장소에 알림 프로세스(`apps/notify`)는 만들지 않는다.

  - notify는 local-server 저장소가 가지고 서울 VPS에서 돈다. 카카오 토큰과 카카오 로그인(콜백 `infra.seojaewan.com/kakao/callback`)도 그쪽이 맡는다. 자세한 내용은 local-server 저장소의 `.codocs/foundation/notify.yaml`(알림 서비스)에 있다.
  - 블로그(웹훅 라우트, 이미지 크기 조회), 이미지 서버(`apps/images`), 젠킨스(배포 실패만)는 `ALERT_URL=http://10.88.0.1:8790/notify`로 보낸다. 요청 형식(헤더, 본문 필드, 응답 코드)은 블로그 문서에 다시 적지 않는다. local-server 저장소의 `.codocs/foundation/notify.yaml` '다른 저장소에서 쓰기' 절을 따른다.
  - 서비스 이름은 `blog`(블로그 컨테이너), `images`(이미지 서버), `jenkins`(배포 실패만)다. 젠킨스는 local-server의 공용 젠킨스이고 성공한 배포는 알리지 않는다(local-server `.codocs/foundation/auto-deploy.yaml`). 메시지 앞에 `[blog]`처럼 붙는다.
  - `ALERT_SECRET`은 서비스마다 local-server가 발급한다. 원문은 Firebat(미니 PC)의 local-server `.local/credentials/notify/<서비스>.secret`(root, 권한 600)에 있고, 배포 때 젠킨스(local-server)가 이 파일을 읽어 `ALERT_SECRET`으로 넣는다.
  - 블로그 컨테이너에서 `10.88.0.1`에 닿는지는 배포 파이프라인 작업 때 시험한다. 같은 절이 첫 컨테이너를 띄울 때 `curl http://10.88.0.1:8790/healthz`로 확인하라고 한다.
  - notify는 VPS에서 따로 떠 있으므로 블로그가 죽어도 알릴 수 있다.
카카오 토큰: |
  카카오 토큰의 운영 규칙(갱신 주기, 재로그인 알림 등)은 local-server 저장소의 `.codocs/foundation/notify.yaml`(알림 서비스)이 정한다. 블로그 문서에는 옮겨 적지 않는다.
선행 조건: |
  끝났다(2026-11-06). local-server의 notify가 서울 VPS에 배포됐고 카카오 연결도 마쳤다. `blog`, `images`, `jenkins` 세 서비스의 비밀값을 발급했고, `blog` 비밀값으로 보낸 시험 알림이 카카오톡에 도착한 것을 확인했다. 웹훅 실패 알림이 실제로 가는지는 해당 기능을 만든 뒤 확인한다.
환경 변수: |
  `ALERT_URL`, `ALERT_SECRET`이다. `ALERT_SECRET` 원문은 사람이 넣지 않고 젠킨스(local-server)가 파일에서 읽는다. 값을 두는 곳은 [[배포 환경:환경 변수]]를 따른다.
검토한 대안: |
  - 블로그 저장소의 `apps/notify`: 서버 감시가 블로그 저장소에 기대게 되어 고르지 않았다. 알림은 local-server의 감시와 한 곳에서 다룬다(2026-11-06, local-server 논의).
