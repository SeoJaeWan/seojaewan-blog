_codocs:
  id: notification
  name: 알림 프로세스
  parent:
    - seojaewan 블로그
개요: |
  사이트에서 사람이 알아야 할 일(웹훅 갱신 실패, 이미지 서버 무응답, 배포 결과 등)이 생기면 카카오톡으로 알리는 방법에 대한 결정이다.
  알림을 보내는 서비스는 local-server 저장소가 가지고, 이 문서는 블로그가 그 서비스로 알림을 보내는 방법만 정한다.
결정: |
  블로그는 알림 서비스 notify로 보내기만 한다. 이 저장소에 알림 프로세스(`apps/notify`)는 만들지 않는다.

  - notify는 local-server 저장소가 가지고 서울 VPS에서 돈다. 카카오 토큰과 카카오 로그인(콜백 `infra.seojaewan.com/kakao/callback`)도 그쪽이 맡는다. 자세한 내용은 local-server 저장소의 `.codocs/foundation/notify.yaml`(알림 서비스)에 있다.
  - 블로그(웹훅 라우트, 이미지 크기 조회), 이미지 서버(`apps/images`), 젠킨스(배포 결과)는 WireGuard 터널 주소 `ALERT_URL=http://10.88.0.1:8790/notify`로 `POST`한다. 본문은 `{title, message, level, link?}`이고, `level`은 `info`, `warn`, `error` 가운데 하나다.
  - `ALERT_SECRET`은 서비스마다 local-server가 발급한다. 원문은 Firebat(미니 PC)의 local-server `.local/credentials/notify/<서비스>.secret`에 있다.
  - 블로그 컨테이너에서 `10.88.0.1`에 닿는지는 배포 파이프라인 작업 때 시험한다.
  - notify는 VPS에서 따로 떠 있으므로 블로그가 죽어도 알릴 수 있다.
카카오 토큰: |
  카카오 토큰의 운영 규칙(갱신 주기, 재로그인 알림 등)은 local-server 저장소의 `.codocs/foundation/notify.yaml`(알림 서비스)이 정한다. 블로그 문서에는 옮겨 적지 않는다.
선행 조건: |
  local-server의 notify가 VPS에 배포되고, 블로그·이미지 서버·젠킨스용 `ALERT_SECRET`이 발급되어야 웹훅 실패 알림과 배포 알림을 실제로 확인할 수 있다. 이 일은 local-server 저장소에서 한다. 그 전에는 알림이 가는지 확인할 수 없다.
환경 변수: |
  `ALERT_URL`, `ALERT_SECRET`이다. 값을 두는 곳은 [[배포 환경:환경 변수]]를 따른다.
검토한 대안: |
  - 블로그 저장소의 `apps/notify`: 서버 감시가 블로그 저장소에 기대게 되어 고르지 않았다. 알림은 local-server의 감시와 한 곳에서 다룬다(2026-11-06, local-server 논의).
