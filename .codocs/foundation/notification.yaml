_codocs:
  id: notification
  name: 알림 프로세스
  parent:
    - seojaewan 블로그
개요: |
  사이트에서 사람이 알아야 할 일(웹훅 갱신 실패, 이미지 서버 무응답, 배포 결과 등)이 생기면 카카오톡으로 알리는 별도 프로세스에 대한 결정이다.
  블로그가 문제를 겪어도 사람이 곧바로 알 수 있게 하려는 것이고, 알리는 쪽과 받는 쪽의 책임을 여기서 나눈다.
결정: |
  알림 프로세스는 이 저장소의 `apps/notify`(`@seojaewan/notify`)다. 블로그와는 별개 프로세스로 같은 미니 PC(리눅스)에서 돌고, 블로그와 서로 import하지 않는다. 이미지 서버 local-server의 일부가 아니며 그렇게 부르지 않는다. 배포는 [[배포 환경:배포(CD)]]에서 정한 대로 앱마다 Dockerfile과 Jenkinsfile로 한다.

  - 블로그(웹훅 라우트, 이미지 크기 조회)와 젠킨스(배포 결과)는 알림 프로세스의 `/notify`에 요청을 보낸다. 요청에는 둘이 공유하는 비밀값(`ALERT_SECRET`)을 실어 아무나 알림을 보내지 못하게 한다.
  - 알림 프로세스는 카카오 "나에게 보내기"로 본인 카카오톡에 보낸다.
  - 알림 프로세스는 블로그와 별도로 떠 있으므로 블로그가 죽어도 알릴 수 있다.
카카오 토큰: |
  카카오 "나에게 보내기"(`talk_message` 동의)에는 사용자 토큰이 필요하다.

  - 토큰은 컨테이너 밖 볼륨의 서버 파일(권한 600)에 둔다. 컨테이너를 교체해도 남는다.
  - 액세스 토큰은 약 12시간, 리프레시 토큰은 60일 유효하다. 3시간마다 갱신하고, 리프레시 토큰이 한 달 미만 남으면 카카오가 새 리프레시 토큰을 주므로 함께 저장한다. 파일은 임시 파일에 쓴 뒤 이름을 바꿔 교체해 쓰다 만 파일이 남지 않게 한다.
  - 갱신이 실패하면 아직 남은 액세스 토큰으로 "다시 로그인 필요" 알림을 보낸다. 리프레시 토큰이 끝나기 전에 사람이 다시 로그인한다.
  - 메시지를 보낼 때 401이 오면 토큰을 한 번 갱신하고 다시 시도한다.
사람이 준비할 것: |
  카카오 개발자 앱을 만들어 `talk_message` 동의를 설정하고, 처음 한 번 로그인해 토큰을 받는다. 키와 토큰은 AI 에이전트에게 주지 않는다.
  실제 발송은 작업 때 앱을 만들어 토큰을 받은 뒤에 시험한다. 그 전에는 발송 부분을 확인할 수 없다.
환경 변수: |
  `KAKAO_REST_API_KEY`, `KAKAO_CLIENT_SECRET`, `ALERT_SECRET`, 토큰 파일 경로다. 값을 두는 곳은 [[배포 환경:환경 변수]]를 따른다.
