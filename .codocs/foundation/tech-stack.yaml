_codocs:
  id: tech-stack
  name: 기술 스택
  parent:
    - seojaewan 블로그
개요: |
  블로그를 무엇으로 만드는지에 대한 결정이다.
  프레임워크, 저장소 구성, 스타일링, 동작 기반 라이브러리, 상태 관리, 글 본문 처리, 테스트·린트 도구를 다룬다.
프레임워크: |
  Next.js App Router로 만든다.
  [[콘텐츠 원천]]의 저장소 JSON 기반 SSG, [[제품 정의:블로그 기능]]의 SEO와 글별 공유 링크, [[배포 환경]]의 자체 배포(standalone 출력)를 모두 지원하기 때문이다.
  글을 저장소 JSON으로 커밋해 SSG로 내므로 Cache Components(`cacheComponents`)와 `'use cache'`, 캐시 태그는 쓰지 않는다. 세 묶음 페이지와 `/api/{posts,projects,about}/[slug]`는 `dynamicParams = false`와 `generateStaticParams`로 빌드 때 만든 것만 내고, 없는 slug는 미리 만든 404다. `partialPrefetching`, 공개 항목이 없는 묶음의 `_none` slug, 빌드 페이지 제한 시간 180초도 Cache Components 때문에 있던 장치라 없앴다.
저장소 구성: |
  pnpm + Turborepo 모노레포다.
  폴더 구성은 [[저장소 구성:구성]], 패키지와 기능 사이의 import 경계는 [[저장소 구성:의존 방향]]에서 정한다.

  디자인 시스템을 피그마와 대응하는 별도 패키지로 두어, Storybook과 토큰 생성을 앱과 따로 실행할 수 있게 한다.
  단일 Next.js 앱 안에 폴더로 두는 방식도 검토했지만, 피그마와의 대응과 경계를 패키지로 강제하는 쪽을 골랐다.
  Turborepo는 패키지 수가 적어도 빌드 순서 관리와 캐시 이점이 있다.
스타일링: |
  디자인 시스템과 앱 모두 Tailwind CSS v4를 쓴다.
  토큰 생성과 앱 CSS 연결은 [[피그마 연동:토큰 생성]], 토큰 클래스 사용과 lint 제약은 [[피그마 연동:토큰 사용 강제]], 모션 클래스 정의 규칙은 [[피그마 연동:모션 클래스]]에서 정한다.
  클래스 조합에는 `clsx`와 디자인 토큰 이름을 아는 `tailwind-merge`를 쓰며, `cn`의 사용 규칙은 [[피그마 연동:토큰 사용 강제]]에 있다.

  디자인 시스템을 CSS Modules로, 앱을 Tailwind로 나누는 방식도 검토했다. 스타일링을 하나로 통일하고, 피그마 MCP가 넘겨주는 React + Tailwind 출력과 맞추기 위해 둘 다 Tailwind를 골랐다.
동작 기반 라이브러리: |
  메뉴, 다이얼로그, 탭 같은 컴포넌트의 키보드 조작·포커스·접근성은 Base UI(`@base-ui/react`)에 맡긴다. 어디까지 맡기고 무엇을 직접 만드는지는 [[접근성:역할]]과 [[접근성:직접 만든 부품]]에 있다.
  상태를 `data-*` 속성으로 노출해 Tailwind 변형과 맞고, 이전 프로젝트에서 써 본 경험이 있다.

  Radix UI는 개발이 느려져서, React Aria는 API가 무겁고 익히는 비용이 커서 고르지 않았다.
상태 관리: |
  화면 상태는 Zustand로 관리한다.
  새로고침 뒤에도 남아야 하는 상태는 `persist`로 localStorage에 저장한다. 저장할 상태의 범위는 [[방문자 저장]]과 [[창 동작:새로고침과 첫 진입]]에서 정한다.

  이전 프로젝트는 상태가 Provider에 몰리고 callback이 늘어나는 문제가 있었다.
  상태 규칙은 React 밖에서도 테스트할 수 있게 한다. 상태 규칙과 저장소의 코드 배치, 기능 사이의 상태 연결, 조립과 층 컴포넌트의 역할은 [[저장소 구성:앱 폴더 구조]]에서 정한다.

  Jotai는 여러 창이 얽힌 규칙이 흩어지기 쉽고, Context + useReducer는 창을 드래그할 때 다시 렌더링되는 범위를 관리하기 번거로워 고르지 않았다.
테스트 도구: |
  - Vitest: 상태 규칙과 순수 함수. 훅은 Testing Library의 `renderHook`으로 확인한다.
  - Storybook: 디자인 시스템 카탈로그, 앱의 조립 스토리와 층 컴포넌트의 동작 스토리. 컴포넌트의 키보드·포인터 조작, 접근성, 상태 표시는 스토리 `play`로 확인한다. 조립 스토리는 피그마 조립 그림과 짝짓는 스토리(참고용)이고, 동작 스토리(`Features/...`)는 실제 저장소로 기능을 눌러 본다([[저장소 구성:앱 폴더 구조]]). 디자인 시스템에는 모션 클래스를 재생하는 모션 스토리(`Motion/<이름>`)도 둔다([[피그마 연동:모션]]).
  - `@storybook/addon-vitest`, `@vitest/browser-playwright`: 스토리를 Vitest 브라우저 모드(Chromium)에서 테스트로 돌린다. `@storybook/addon-a11y`: 스토리마다 axe 접근성 검사를 돌린다([[테스트 작성 규칙:스토리 테스트]]).
  - Playwright: 실제 사용 흐름을 확인하는 E2E. 모션 검사도 Playwright를 쓰며, 비교 항목과 절차는 [[피그마 연동:모션]]에서 정한다.
  - Zod: Notion 응답 같은 외부 데이터와 환경 변수 검증

  무엇을 어느 시점에 어떻게 테스트하는지는 [[테스트 작성 규칙]]에서 확인한다.
시각 테스트: |
  피그마와 코드의 모습을 자동으로 비교하는 도구는 지금 없다. 지운 이유는 [[피그마 연동:검토한 대안]]에 있고, 새 방법은 [[피그마 흐름 논의]]에서 정한다. 모션 검사의 실행은 [[피그마 연동:CI]]에 있다.
  자동 시각 판정과 코드 기준 회귀 테스트를 고르지 않은 이유는 [[피그마 연동:검토한 대안]]에서 확인한다.
  화면 단위 시각 검증의 검토 범위는 [[미결 사항:화면 단위 시각 검증]]에 있다.
린트와 포맷: |
  ESLint + Prettier를 쓰고, CSS는 Stylelint로 검사한다. ESLint는 CSS 안의 at-rule을 검사하지 않으므로 CSS 규칙은 Stylelint에 맡긴다.
  토큰 클래스 제약은 [[피그마 연동:토큰 사용 강제]], 패키지·기능의 import 경계는 [[저장소 구성:의존 방향]], 포맷 규칙은 [[코드 작성 규칙:포맷]]에서 정한다.

  Biome은 빠르지만 위 규칙을 걸 플러그인이 부족해 고르지 않았다.
글 본문 처리: |
  글 본문은 앱의 서버 경로가 Notion 블록에서 만들어 브라우저로 보낸다([[코드 작성 규칙:React와 Next.js]]). 코드 문법 강조와 수식은 이때 서버에서 처리해 보낸다.

  - 코드 문법 강조는 Shiki를 쓴다. VS Code와 같은 TextMate 문법으로 강조해 언어별 강조가 정확하다.
  - 수식은 KaTeX를 쓴다. 가볍고 빠르며 서버에서 미리 그려 보낼 수 있다. 위험한 명령을 막고(`trust: false`) 화면 읽기 프로그램을 위해 MathML도 함께 낸다(`output: 'htmlAndMathml'`). KaTeX CSS는 글 본문 컴포넌트 `PostBlocks`가 처음부터 불러온다(일반 import, 지연 불러오기 없음). 수식 블록을 나중에 불러오면 CSS가 늦게 붙어 수식이 깜빡이기 때문이다. KaTeX 글꼴은 수식이 있을 때만 받는다.

  둘 다 서버에서 처리해 보내므로 브라우저에서 강조·수식 계산을 돌리지 않는다. 설치할 때 공식 문서로 버전과 서버에서 쓰는 방법을 확인한다.

  문법 강조 색은 Shiki 내장 `light-plus` 테마(VS Code 기본 밝은 테마)를 쓴다. 직접 만든 테마나 scope 표, 강조 색 토큰은 두지 않는다.
  - 대비가 4.5:1에 못 미치는 색은 Shiki `colorReplacements`로 바꾼다: `#267f99` → `#257c96`(CodeBlock 바탕에서 4.53:1, [[접근성:색 대비]]).
  - 서버 강조기(`highlightCode`)는 글자 조각마다 테마가 준 색(hex, 소문자)을 담아 보낸다. 테마의 기본 글자색인 조각은 색이 없다(null). 이웃한 같은 색 조각은 하나로 합친다. Light+의 글자 모양(굵게·기울임)은 따르지 않는다.
  - 코드 블록(CodeBlock)은 조각의 색을 그대로 `style`로 칠한다. 색 값이 피그마 토큰이 아니라 강조기가 정하므로 토큰 클래스를 쓰지 않는 유일한 자리다. 실행 중에 받은 값이라 `style` 값 lint(리터럴 금지)에 걸리지 않는다. 색 없는 조각은 테마 기본 글자색 `#000000`과 같은 `color/black`으로 칠한다.
  - 피그마 CodeBlock 견본은 `color/black` 한 가지 색 글자로 두고, 코드는 강조기 색으로 칠한다는 것을 그 레이어의 Development 주석에 적는다([[피그마 연동:구조 검사]]). 그래서 `Figma` 스토리는 색 없는 코드로 그리고, 색이 실제 강조 결과인지는 앱 단위 테스트가 지킨다.
검토한 대안: |
  - Prism·highlight.js(코드 문법 강조): Shiki보다 강조가 덜 정확하고 보통 브라우저에서 돌려 고르지 않았다.
  - MathJax(수식): KaTeX보다 무거워 고르지 않았다.
