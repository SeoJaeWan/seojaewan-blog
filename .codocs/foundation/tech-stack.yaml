_codocs:
  id: tech-stack
  name: 기술 스택
  parent:
    - seojaewan 블로그
개요: |
  블로그를 무엇으로 만드는지에 대한 결정이다.
  프레임워크, 저장소 구성, 스타일링, 동작 기반 라이브러리, 상태 관리, 테스트·린트 도구를 다룬다.
프레임워크: |
  Next.js App Router로 만든다.
  [[콘텐츠 원천]]의 ISR과 웹훅 기반 즉시 갱신(on-demand revalidation), [[제품 정의:블로그 기능]]의 SEO와 글별 공유 링크, [[배포 환경]]의 Vercel을 모두 별도 구성 없이 지원하기 때문이다.
저장소 구성: |
  pnpm + Turborepo 모노레포다.

  - `apps/web`: Next.js 블로그 앱
  - `packages/design-system`: 피그마 디자인 시스템과 대응하는 토큰과 컴포넌트

  디자인 시스템을 피그마를 기준으로 관리하므로 별도 패키지로 둔다. 피그마의 Foundations·Components가 이 패키지와 대응하고, Storybook과 토큰 생성을 앱과 따로 실행할 수 있다.
  의존 방향은 `apps/web → packages/design-system`이다. 디자인 시스템은 블로그 도메인(Notion, 글)을 알지 못한다.

  단일 Next.js 앱 안에 폴더로 두는 방식도 검토했지만, 피그마와의 대응과 경계를 패키지로 강제하는 쪽을 골랐다.
  Turborepo는 패키지 수가 적어도 빌드 순서 관리와 캐시 이점이 있고, Vercel과 원격 캐시가 바로 연결된다.
스타일링: |
  디자인 시스템과 앱 모두 Tailwind CSS v4를 쓴다.

  - 토큰은 `packages/design-system`의 `tokens.css` 한 곳에서 정의하고 앱은 그것을 가져다 쓴다. `tokens.css`는 피그마 변수·스타일에서 변환 스크립트가 만든다([[피그마 연동:토큰 생성]]). 다른 CSS에서 `@theme`·`@utility`를 쓰는 것은 Stylelint가 막는다([[피그마 연동:토큰 사용 강제]]).
  - Tailwind 기본 테마 값(색상, 간격, 서체, 글자 크기, 줄 높이, 반경, 그림자, 블러, 이징, 애니메이션)은 `tokens.css` 맨 앞에서 모두 지우고 디자인 토큰 이름으로만 쓴다. `rounded-lg`, `shadow-md`, `animate-spin`처럼 피그마에 없는 값이 섞여 들어가지 않게 하기 위해서다. 애니메이션은 `--animate-*: initial`로 지운다.
  - 움직임은 디자인 시스템의 `motion.css`(손으로 쓰는 파일)에 `motion-*` 클래스로 두고, 컴포넌트는 그 클래스만 붙인다([[디자인 기반:모션 클래스]]). `@keyframes`와 `motion-*` 클래스 정의는 Stylelint가 `motion.css`에서만 허용한다.
  - 토큰 클래스는 `@theme` 변수와 `@utility` + `--value()`로 만든다.
  - 모르는 클래스와 임의 값(`bg-[#fff]`, `p-[13px]`)은 lint로 막는다. 토큰에 없는 값이 필요하면 피그마부터 고친다.
  - 클래스는 `cn`(`clsx` + 디자인 토큰 이름을 아는 `tailwind-merge`)으로 조합한다. 사용처에서 넘긴 `className`이 같은 속성의 기본 클래스를 이기게 하고, lint 플러그인이 기본으로 검사하는 함수 이름이라 조합한 클래스도 검사된다([[피그마 연동:토큰 사용 강제]]).
  - 앱의 CSS는 `@source`로 디자인 시스템 소스를 읽게 한다.

  디자인 시스템을 CSS Modules로, 앱을 Tailwind로 나누는 방식도 검토했다. 스타일링을 하나로 통일하고, 피그마 MCP가 넘겨주는 React + Tailwind 출력과 맞추기 위해 둘 다 Tailwind를 골랐다.
동작 기반 라이브러리: |
  메뉴, 다이얼로그, 탭, 툴팁 같은 컴포넌트의 키보드 조작·포커스·접근성은 Base UI(`@base-ui/react`)에 맡긴다.
  상태를 `data-*` 속성으로 노출해 Tailwind 변형과 맞고, 이전 프로젝트에서 써 본 경험이 있다.

  Radix UI는 개발이 느려져서, React Aria는 API가 무겁고 익히는 비용이 커서 고르지 않았다.
상태 관리: |
  열린 창, 창 순서, 위치·크기, 최소화, 탭, 작업 표시줄 고정, 바탕화면 배치 같은 화면 상태는 Zustand로 관리한다.
  새로고침 뒤에도 남아야 하는 상태는 `persist`로 localStorage에 저장한다.

  이전 프로젝트는 상태가 Provider에 몰리고 callback이 늘어나는 문제가 있었다.
  창 열기·포커스·닫기 같은 규칙을 저장소 안의 순수 함수로 모아 React 밖에서도 테스트할 수 있게 한다.
  각 기능의 층 컴포넌트(저장소를 조립에 잇는 컴포넌트)가 저장소를 직접 읽고 부르며, 기능 사이를 props 콜백으로 잇지 않는다. 조립(피그마 그림대로 그리는 컴포넌트)은 props만 받아 스토리와 캡처가 저장소 없이 돌게 한다([[저장소 구성:앱 폴더 구조]]).

  Jotai는 여러 창이 얽힌 규칙이 흩어지기 쉽고, Context + useReducer는 창을 드래그할 때 다시 렌더링되는 범위를 관리하기 번거로워 고르지 않았다.
테스트 도구: |
  - Vitest: 상태 규칙과 순수 함수
  - Vitest + Testing Library: 컴포넌트의 키보드 조작, 접근성, 상태 표시
  - Storybook: 디자인 시스템 카탈로그와 앱의 조립 스토리. 피그마 캡처 표의 코드 쪽이다. 디자인 시스템에는 모션 클래스를 재생하는 모션 스토리(`Motion/<이름>`)도 둔다([[피그마 연동:모션]]).
  - Playwright: 실제 사용 흐름을 확인하는 E2E. 피그마 캡처도 Playwright로 Storybook 스토리를 찍고, Chromium 캔버스로 차이 그림을 만든다([[피그마 연동:캡처 표]]). 모션 시간 검사도 Playwright가 모션 스토리에서 애니메이션의 시간·이징·지연·반복 횟수를 읽어 한다.
  - Zod: Notion 응답 같은 외부 데이터와 환경 변수 검증

  무엇을 어느 시점에 어떻게 테스트하는지는 [[테스트 작성 규칙]]에서 확인한다.
시각 테스트: |
  시각 확인은 컴포넌트와 조립 단위의 피그마 캡처 표만 둔다. 흐름과 방식은 [[피그마 연동]]에서 확인한다.
  그림을 기계로 판정하지 않는다. 피그마 그림, 코드 그림, 두 그림의 차이 그림을 나란히 놓은 표를 PR마다 사람이 본다. 렌더링 엔진 차이 때문에 정상과 실수를 가를 기준을 찾지 못했기 때문이다([[피그마 연동:검토한 대안]]). 토큰과 자산은 다시 생성해 비교하는 것으로 기계가 보장한다.

  자동 코드 기준 회귀 테스트는 두지 않는다. 동작은 E2E가 지키고, 겉모습은 PR마다 캡처 표에서 사람이 본다. `main`의 캡처는 `parity-captures` 브랜치에 남는다.
  화면 단위 시각 검증은 [[미결 사항]]으로 남겨 두었다.
린트와 포맷: |
  ESLint + Prettier를 쓰고, CSS는 Stylelint로 검사한다.
  Tailwind 모르는 클래스·임의 값 금지와 `packages/design-system`이 `apps/web`을 import하지 못하게 하는 경계 규칙을 ESLint 플러그인으로 강제하고, Prettier로 Tailwind 클래스 순서를 정렬한다. 토큰을 `tokens.css` 밖에서 정의하지 못하게 하는 규칙은 Stylelint가 맡는다. ESLint는 CSS 안의 at-rule을 검사하지 않기 때문이다.

  Biome은 빠르지만 위 규칙을 걸 플러그인이 부족해 고르지 않았다.
