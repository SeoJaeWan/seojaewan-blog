_codocs:
  id: deployment
  name: 배포 환경
  parent:
    - seojaewan 블로그
개요: |
  블로그를 어디에 배포하는지에 대한 결정이다.
결정: |
  Vercel에 배포한다.
  [[콘텐츠 원천]]에서 정한 ISR과 웹훅 기반 즉시 갱신에는 서버 런타임이 필요하며, Vercel은 이를 별도 서버 운영 없이 제공한다.
검토한 대안: |
  - Cloudflare(OpenNext): ISR을 쓰려면 추가 설정이 필요하다.
  - 직접 운영하는 서버: 운영 부담이 생긴다.
Vercel 프로젝트 설정: |
  Vercel 프로젝트는 저장소 주인의 계정으로 직접 연결한다. 연결할 때 다음 값을 쓴다.

  - Root Directory: `apps/web`
  - Framework: Next.js
  - Node: 24.x
  - Include files outside the root directory: 켠다. 앱이 워크스페이스의 `packages/design-system`을 쓰기 때문이다.
  - 설치·빌드 명령: 기본값(`next build`)
  - Turborepo 원격 캐시는 선택으로 연결한다.
