_codocs:
  id: deployment
  name: 배포 환경
  parent:
    - seojaewan 블로그
개요: |
  블로그를 어디에 어떻게 배포하고, 어떻게 공개하는지에 대한 결정이다. 서버, 배포 파이프라인(CI·CD), 도메인과 캐시, 감시, 환경 변수, 공개 절차를 다룬다.
  이 문서는 AI 에이전트가 이 문서만 보고 인프라 작업을 이어갈 수 있게, 무엇을 어디서 하고 무엇은 사람이 직접 하는지도 적는다.
결정: |
  Vercel이 아니라 집의 리눅스 미니 PC에 직접 배포한다. 미니 PC는 AMD 미니 PC(7845 계열)에 RAM 32GB다.
  [[콘텐츠 원천]]에서 글을 저장소 JSON으로 커밋해 완전한 SSG로 내기로 했다. 블로그는 빌드 때 만든 페이지만 내주고 모르는 주소는 미리 만든 404로 보낸다. 글이 바뀌면 다시 배포하므로 ISR과 웹훅 갱신은 쓰지 않는다. 블로그는 지금처럼 Next.js standalone 출력을 Docker 컨테이너로 돌린다.

  배포 흐름과 구성 요소는 아래 섹션에서 정한다. 블로그(`apps/web`)와 이미지 서버(`apps/images`, [[Notion 이미지 제공]])가 앱마다 Dockerfile을 갖고, 저장소 루트에 Jenkinsfile과 Docker Compose 설정을 둔다([[저장소 구성:구성]]). 배포는 local-server가 운영하는 공용 젠킨스가 한다.
검토한 대안: |
  - Vercel: 서버 운영이 필요 없고 미리보기 배포를 기본으로 제공하지만 고르지 않았다. 이유는 둘이다. 이미지를 내려주는 이미지 서버가 꺼지면 이미지가 깨져 어차피 글을 읽는 데 문제가 되므로, Vercel을 써도 가용성이 크게 나아지지 않는다. 또 배포 파이프라인을 직접 만들어 보며 공부하려는 목적이 있다. Vercel을 쓰지 않으므로 미리보기 배포는 없고, 로컬과 CI로 확인한다.
  - Cloudflare(OpenNext): Next.js를 Cloudflare에서 돌리려면 추가 설정이 필요하다.
  - 배포한 버전을 파일(`/srv/seojaewan-blog/deployed/<앱>`)에 적기: 고르지 않았다. 컨테이너를 지우거나 되돌리면 파일과 실제가 어긋난다. 실행 중인 컨테이너의 이미지 라벨을 읽는다([[배포 환경:배포(CD)]]).
  - 버전 브랜치를 local-server처럼 `changeset-release/main`으로 하기: 이 저장소의 브랜치 이름 검사(`종류/설명`)에 맞지 않아 예외를 더해야 한다. 형식에 맞는 `chore/release`로 정했다.
  - 실패했을 때 옛 컨테이너를 그대로 두는 무중단 교체(새 컨테이너를 옆에 띄워 확인한 뒤 바꾸기): 포트가 고정이라 compose만으로는 어렵다. 바꾼 뒤 health check가 실패하면 `previous` 이미지로 되돌린다. 바꾸는 동안 몇 초 끊긴다.
  - 글 반영을 Notion 웹훅과 ISR 즉시 갱신으로 하기: 버렸다. 글을 저장소 JSON으로 커밋해 바뀔 때마다 다시 배포한다([[콘텐츠 원천:결정]]).
  - 서버에서 이미지를 GHCR에 올렸다 받기: 서버에서 직접 빌드하므로 레지스트리를 두지 않는다.
  - 블로그 저장소가 젠킨스를 설치·운영하기: 원래 계획이었다. 2026-11-06에 local-server가 공용 젠킨스를 두기로 해 바꿨다. 서버에서 도는 서비스가 늘어 실행 계정·권한·GitHub 연결을 한 곳에서 관리하는 편이 낫기 때문이다.
  - 공개 전에 Cloudflare Access로 사이트를 막아 두기: 준비 전에는 `seojaewan.com`을 터널에 연결하지 않으면 되어 필요 없다([[배포 환경:공개 절차]]).
배포(CD): |
  공용 젠킨스(local-server가 운영)가 배포한다. 젠킨스 작업 `seojaewan-blog-release`가 2분마다 GitHub에 물어 `refs/heads/main`이 바뀐 것을 알아내고(웹훅은 쓰지 않는다), 실행 계정(라벨 `seojaewan-blog`)에서 이 저장소 루트의 `Jenkinsfile`을 실행한다. 실행 계정·비밀값·포트·데이터 위치·실패 알림 같은 공통 규칙은 local-server 저장소의 `.codocs/foundation/project-deploy.yaml`(프로젝트 배포)을 따르며, 여기에 옮겨 적지 않는다. 포트·데이터·비밀값 이름·notify 클라이언트는 local-server의 `registry/seojaewan-blog.yaml` `deploy` 절에 있고, 바꿀 때는 이 저장소가 그 파일을 PR로 바꾼다. 이 저장소 쪽 파일은 2026-11-06 구현 순서 9단계 7번 PR에서 만들었다.

  배포 경로는 둘이다(2026-11-06 결정).
  - 글 배포 경로: 동기화 작업이 만든 글 PR이 병합되면([[콘텐츠 원천:갱신 방식]]), 글 JSON만 바뀐 병합이므로 Changesets 버전 PR 없이 바로 블로그를 다시 배포한다.
  - 코드 배포 경로: 코드 변경은 Changesets로 모았다가 버전 PR을 머지할 때 배포한다. 버전 PR은 누가 병합해도 된다. 앱이나 패키지를 바꾼 PR에는 changeset을 넣고, CI가 `changeset status`로 빠뜨린 것을 잡는다. Renovate PR은 changeset 없이 머지되고, 다음 배포 때 함께 나간다.
  - 두 경로 모두 바뀐 앱(`apps/web`, `apps/images`)만 배포한다. 글 JSON만 바뀌면 블로그만 배포한다.
  - Changesets 설정(2026-11-06 도입): `.changeset/config.json`에서 `apps/web`, `apps/images`, `packages/design-system`의 버전을 관리하고(`privatePackages: { version: true, tag: false }`, npm publish 없음), `tools/*`는 `ignore`로 뺀다. 내부 의존 갱신은 `patch`라 `packages/design-system`이 바뀌면 `apps/web`도 함께 오른다. PR 검사와 예외는 [[Git 작업 규칙:Changesets]]에서 정한다.

  Jenkinsfile의 흐름(단계마다의 일은 `deploy/` 아래 Node 스크립트가 하고, 판단은 `deploy/release-plan.mjs`에 모아 단위 시험한다):
  1. deploy(`deploy/deploy-changed.mjs`)
     - 젠킨스가 체크아웃한 커밋이 `origin/main`에 있는지 먼저 본다. 배포 판단은 `main`의 커밋으로만 한다.
     - 앱마다 `package.json`의 `version`을 실행 중인 컨테이너의 버전 라벨과 비교한다. 다르면 배포한다(버전 PR 병합).
     - 블로그는 버전이 같아도, 실행 중인 컨테이너를 만든 커밋과 지금 커밋 사이에 `apps/web/content/**`가 바뀌었으면 다시 배포한다(글 동기화 병합). 그 커밋을 모르면 바뀐 것으로 본다.
     - 실행 중인 컨테이너가 없으면(처음 배포, 멈춤·재시작 반복) 배포한다. 그래서 처음에는 두 앱 모두 배포한다.
     - 이미지 서버를 배포해야 하는데 필요한 비밀값 파일(`/run/secrets/project/images-notion-token`, `/run/secrets/notify/images`)이 없으면(owner가 아직 넣지 않은 때) 이미지 서버만 건너뛰고 경고를 남긴다. 실패로 끝내지 않고 알리지도 않으며, 블로그와 버전 PR 단계는 그대로 진행한다. 건너뛴 앱은 배포되지 않은 채라 다음 실행에서 다시 배포 대상이 된다. 파일이 있는데 비었거나 다른 이유로 실패하면 실패로 끝낸다.
     - 고른 앱을 모두 빌드한 뒤에 바꾼다. 빌드가 깨지면 실행 중인 컨테이너는 그대로다. 빌드 전에 지금 이미지에 `previous` 태그를 단다.
     - `docker compose up --detach --wait --no-build --no-deps <서비스>`로 바꾸고 health check를 기다린다(최대 300초). 통과하지 못하면 `previous` 이미지로 되돌려 다시 띄우고 작업을 실패로 끝낸다. 되돌린 컨테이너는 옛 버전 라벨을 가지므로 다음 실행에서 다시 배포를 시도한다.
     - 끝나면 이름을 잃은 이전 빌드 이미지를 지운다(`previous` 하나는 손으로 되돌릴 때를 위해 남긴다).
  2. version PR(`deploy/version-pr.mjs`, GitHub App 자격 증명 `github-app`)
     - `.changeset`에 쌓인 changeset이 없으면 아무것도 하지 않는다.
     - 이번 병합(`HEAD^1..HEAD`)에서 바뀐 파일이 모두 `apps/web/content/**`이면(글 동기화 병합) 건너뛴다. 바뀐 것이 없는데 브랜치를 다시 올려 버전 PR의 CI를 돌리지 않기 위해서다.
     - 따로 만든 worktree에서 버전 브랜치 `chore/release`를 `main`으로 만들고, `pnpm exec changeset version`과 lockfile 맞춤(`pnpm install --lockfile-only`)을 한 커밋(`chore(release): version packages`)으로 만든다. 같은 실행의 배포 판단이 버전 브랜치에 섞이지 않게 하려는 것이다.
     - 이미 올린 `chore/release`와 커밋 내용(tree)이 같으면 올리지 않는다. 다르면 강제로 올린다. 열린 버전 PR이 없으면 만들고(`chore(release): 버전 올리기`), 있으면 본문(버전이 바뀐 패키지와 CHANGELOG)을 갱신한다.
     - 실행 계정에는 pnpm이 없어 `npx --yes pnpm@<packageManager 버전>`으로 쓴다. 버전 커밋의 작성자는 저장소 규칙대로 저장소 주인 계정이다([[Git 작업 규칙:커밋]]).
  3. 실패하면 `post { failure }`가 실행 계정의 `notify-failure`로 카카오톡에 알린다. 성공은 알리지 않는다([[알림 프로세스]]). `post { cleanup }`이 비밀값 파일을 지운다.

  배포한 버전의 기록: 따로 파일을 두지 않고, 이미지 라벨(`org.opencontainers.image.version`, `org.opencontainers.image.revision`)에 빌드한 버전과 커밋을 넣어 실행 중인 컨테이너에서 읽는다. 실제로 돌고 있는 것이 곧 기록이라, 컨테이너가 없거나 되돌린 경우에도 기록이 어긋나지 않는다.

  첫 배포 버전: 배포 파이프라인 PR이 두 앱에 `minor` changeset을 넣었다. 젠킨스의 첫 실행은 컨테이너가 없어 두 앱을 `0.0.0`으로 배포하고, 같은 실행에서 버전 PR(`0.1.0`)을 연다. 그 PR을 머지하면 두 앱이 `0.1.0`으로 다시 배포된다. 그 뒤로는 changeset에 따라 오른다.

  글 배포는 `main`의 커밋으로 빌드하므로, 아직 버전 PR로 묶이지 않은 `apps/web` 코드 변경(Renovate 포함)도 함께 나간다. 글 JSON의 모양이 내보내기 코드와 함께 바뀔 수 있어 배포한 커밋에 글만 얹어 빌드하지 않는다. 버전 라벨은 그대로다.

  구성 파일
  - `compose.yaml`(저장소 루트, 프로젝트 이름 `seojaewan-blog`): 서비스 `web`(이미지 `seojaewan-blog/web`, `127.0.0.1:3000`)과 `images`(이미지 `seojaewan-blog/images`, `127.0.0.1:3100`). 서비스마다 `restart: unless-stopped`와 `healthcheck`를 둔다. Docker의 포트 공개는 ufw를 건너뛰어 방화벽에 구멍을 내므로 `127.0.0.1`에만 연다. cloudflared가 같은 머신에서 돌아 터널 연결에는 문제가 없다. 이 PC의 방화벽(ufw)은 local-server가 정한다(local-server 저장소의 `.codocs/foundation/security.yaml`, 보안과 방화벽).
  - health check: 블로그는 `/api/health`(빌드 때 만든 정적 응답 `{"status":"ok"}`), 이미지 서버는 `/healthz`다. 이미지에 curl이 없어 컨테이너 안의 Node `fetch`로 부른다. local-server 감시(`registry/seojaewan-blog.yaml`)도 같은 주소를 쓴다.
  - `apps/web/Dockerfile`: Node 24(`node:24.18.1-bookworm-slim`, 다이제스트 고정)에서 `pnpm install --filter "@seojaewan/web..."`(디자인 시스템 포함) 뒤 `next build`(`output: 'standalone'`, 빌드 인자 `CONTENT_SOURCE` 기본 `notion`)를 하고, 실행 이미지에는 standalone 출력과 `.next/static`, `public`만 담아 `node` 사용자로 `apps/web/server.js`를 띄운다.
  - `apps/images/Dockerfile`: 같은 Node 24에 `@seojaewan/images`의 실행 의존성만 설치한다(sharp는 lockfile의 linux x64 glibc 바이너리). 고정 uid `10001`(`images`)로 `node src/main.ts`를 바로 실행한다.
  - 두 Dockerfile 모두 저장소 루트를 빌드 문맥으로 쓰고, 루트 `.dockerignore`가 `.git`, `node_modules`, 빌드 결과, `.env*`, `.deploy-secrets`를 뺀다. pnpm 버전은 corepack이 루트 `packageManager`를 따른다. 체크아웃의 파일 권한(umask)과 관계없이 실행 사용자가 읽게 빌드 단계에서 `chmod -R a+rX`한다.
  - 데이터 위치: 이미지 서버 저장본은 호스트 `/srv/seojaewan-blog/images`를 컨테이너의 같은 경로에 bind로 둔다. 이 폴더는 local-server가 `deploy.data`에 따라 Firebat에 만든다. compose의 bind 경로는 실행 계정이 아니라 Firebat 기준으로 풀리므로 호스트 경로로 적는다. 배포 스크립트가 올리기 전에 이 폴더의 주인을 `10001:10001`로 맞춘다(실행 계정 안에서 하면 호스트에 반영되지 않으므로 Docker 엔진에서 `docker run --user 0`으로 한다). 확인용으로만 `IMAGE_DATA_DIR`로 바꾼다. 블로그는 남길 데이터가 없다.
  - 비밀값: 이미지 서버의 `NOTION_TOKEN`은 프로젝트 비밀값 `images-notion-token`, `ALERT_SECRET`은 notify 클라이언트 `images`의 비밀값이다. 프로젝트 비밀값은 owner가 local-server의 infra 화면에서 금고 항목을 골라 넣고, notify 비밀값은 발급 뒤 자동으로 복사된다. 배포 스크립트가 실행 계정의 `/run/secrets/project/images-notion-token`, `/run/secrets/notify/images`를 읽어 `.deploy-secrets/images.env`(권한 600)로 쓰고, compose `env_file`로 넣은 뒤 지운다. `env_file`은 실행 계정 안의 compose CLI가 읽으므로 실행 계정 경로로 적는다. 값은 명령 인자와 로그에 넣지 않는다. compose `secrets`(파일 bind)는 쓰지 않는다. 그 경로는 Firebat 기준(`/var/lib/local-server-projects/seojaewan-blog/...`)으로 풀려야 하고, 두 파일을 한 env 파일로 합쳐 넣는 편이 단순하기 때문이다. `ALERT_URL`(`http://10.88.0.1:8790/notify`)은 비밀값이 아니라 compose에 적는다. 이미지 서버 컨테이너에서 notify(`10.88.0.1:8790/healthz`)에 닿는 것을 2026-11-06에 확인했다.
CI: |
  CI는 GitHub Actions다. 워크플로, 도는 조건, 작업 구조, 캐시, 병합 기준은 [[Git 작업 규칙:CI]]에서 정한다.

  - 모든 워크플로(`ci.yml`, `branch-name.yml`, `content-sync.yml`)가 GitHub 호스티드 러너(`runs-on: ubuntu-latest`)에서 돈다. self-hosted runner를 쓰는 워크플로는 없다. job마다 깨끗한 머신이라 pnpm은 기본 위치에 설치하고, 앱 서버는 기본 포트(3000)로 띄운다.
  - 저장소를 공개(public)로 바꾼다. 공개 저장소에서는 GitHub 호스티드 표준 러너가 무료·무제한이고 4 vCPU다. 비공개 저장소에서는 계정의 월 무료 시간을 쓴다.
  - 공개 전에 미니 PC의 self-hosted runner(`minipc-1`~`minipc-3`)를 저장소에서 뗀다. 공개 저장소에는 self-hosted runner를 두지 않는다.
  - 공개 전환과 runner 떼기는 사람이 한다. 아직 하지 않았다. 2026-11-11의 CI 구조 개편 PR들이 병합된 뒤에 한다. 그때까지 저장소는 비공개이고 runner는 저장소에 달려 있지만, 어느 워크플로도 runner를 쓰지 않는다.
  - 시나리오 케이스 보고서는 GitHub Pages(`gh-pages` 브랜치, 커스텀 도메인 `scenario-cases.seojaewan.com`)로 간다([[테스트 작성 규칙:E2E]]). 무료 계정의 비공개 저장소는 Pages를 쓰지 못하므로 사이트는 공개 전환 뒤에 열린다. 미니 PC의 보고서 폴더, 보고서 서버(8470), Cloudflare 터널의 보고서 호스트, 보고서의 Access는 더 쓰지 않는다(서버 쪽 정리는 사람이 한다, [[배포 환경:인프라 설정의 위치]]).
  - 게시 브랜치 `gh-pages`에는 늘 부모 없는 커밋 하나만 남긴다. `main` 보고서가 약 113MB라 병합마다 기록이 쌓이면 안 되기 때문이다. 사이트 루트는 `main` 보고서이고, PR 실패 보고서는 `failures/pr-<번호>/`에 둔다. 올릴 때마다 브랜치를 받아 자기 자리만 고치고 다른 폴더는 지우지 않으며, 받은 뒤 다른 실행이 먼저 올렸으면(`--force-with-lease` 거절) 다시 받아 처음부터 한다(`scripts/publish-scenario-pages.sh`, `scripts/scenario-pages.mjs`). 사이트 루트에는 `CNAME`과 `.nojekyll`을 둔다. Pages 사이트 한도는 1GB다.
  - 시험용 데이터는 E2E만 `CONTENT_SOURCE=fixture`로 쓰고, `Build` 작업의 빌드는 커밋한 글 JSON으로 한다([[콘텐츠 원천:읽는 곳]]).
  - 앱이나 패키지를 바꾼 PR에는 changeset이 있어야 하고, CI가 `changeset status`로 빠뜨린 것을 잡는다([[배포 환경:배포(CD)]]).
  - 글 동기화: `content-sync.yml` 하나가 GitHub 호스티드 러너에서 `repository_dispatch`(`notion-content-changed`, Cloudflare Worker `tools/notion-webhook/`가 Notion 통합 웹훅을 받아 보낸다), 하루 한 번 예약(03:43 UTC), 수동 실행으로 시작한다. 한 실행에서 Notion 내보내기, 결과가 `main`과 같으면 끝, 운영 글 빌드, 고정 브랜치(`chore/notion-content-sync`)에 push, PR을 열고 바로 merge commit으로 병합한다. push·PR·병합은 기본 `GITHUB_TOKEN`으로 한다. 글 동기화 PR에서는 `ci.yml`이 돌지 않는다. 실패 알림 주소는 저장소 변수 `ALERT_URL`에서 읽고, 바깥 주소는 아직 정해지지 않았다. 자세한 것은 [[콘텐츠 원천:갱신 방식]]에 있다.
  - ruleset의 필수 검사와 auto-merge는 쓰지 않는다([[Git 작업 규칙:CI]]).
도메인과 캐시: |
  - Cloudflare 터널은 Cloudflare DNS를 쓰는 도메인에서만 쓸 수 있으므로 `seojaewan.com`은 Cloudflare DNS에 둔다.
  - `seojaewan.com`은 터널을 거쳐 블로그 컨테이너(`127.0.0.1:3000`)로 간다(프록시 켬). `www`는 터널 hostname과 Cloudflare Redirect Rule("Redirect from WWW to root" 템플릿, 301, query string 유지)로 `seojaewan.com`에 영구 이동한다. 2026-11-08에 공개했다([[배포 환경:공개 절차]]).
  - Cloudflare는 `/_next/static/*`와 이미지만 캐시하고 HTML은 캐시하지 않는다. 다시 배포한 글이 바로 보여야 하기 때문이다.
  - 서버가 다운되면 사이트도 다운이다. 집 서버라 받아들인다.
  - 이미지 서버의 도메인과 캐시는 [[Notion 이미지 제공]]에서 정한다.
감시: |
  감시는 local-server의 `infra`가 맡는다(local-server 저장소의 `.codocs/foundation/infra-map.yaml`, 인프라 지도와 감시). 1분마다 검사하고, 두 번 실패하면 카카오톡으로 알린다. 집 전체가 꺼지면 VPS가 생존 신호가 끊긴 것을 보고 알린다.

  블로그는 local-server 저장소에 `registry/seojaewan-blog.yaml`을 PR로 올려 등록한다. 등록할 대상은 다음과 같다.
  - 블로그 컨테이너(`127.0.0.1` 포트 HTTP)와 `https://seojaewan.com/`(공개 HTTPS)
  - `apps/images` 컨테이너와 `https://images.seojaewan.com`

  self-hosted runner 서비스와 시나리오 케이스 보고서 서버는 더 쓰지 않으므로 감시하지 않는다([[배포 환경:CI]]). 시나리오 케이스 보고서는 GitHub Pages가 내주므로 이 감시에 넣지 않는다.

  2026-11-08에 `registry/seojaewan-blog.yaml`에서 `blog-web`과 `blog-images`를 `active`로 등록했다(local-server PR #99, #101). 이미지 서버는 `/healthz`(http)로 검사하고 공개 검사는 `https://images.seojaewan.com/healthz`다. 등록 파일의 필드 형식은 local-server 저장소가 정한다. infra는 local-server의 자동 배포가 배포하므로 이 저장소에서 따로 배포하지 않는다.
감시의 검토한 대안: |
  - `uptime.yml`(GitHub 호스티드 러너가 1시간마다 `https://seojaewan.com/` 확인): 만들지 않는다. 알림이 메일로 따로 가고, local-server 감시가 더 빠르게 같은 일을 하기 때문이다.
환경 변수: |
  환경 변수의 값은 저장소에 두지 않는다. 저장소에는 값이 빈 `apps/web/.env.example`과 `apps/images/.env.example`을 둔다. Notion 값은 사용자가 직접 넣고 AI 에이전트에게 주지 않는다.

  | 대상 | 변수 |
  |---|---|
  | 블로그 | `CONTENT_SOURCE`(`notion` 또는 `fixture`, 기본 `notion`) 하나다. 블로그는 Notion을 부르지 않고 알림도 보내지 않으므로 `NOTION_TOKEN`·`NOTION_WEBHOOK_SECRET`·`ALERT_URL`·`ALERT_SECRET`은 필요 없다 |
  | GitHub Actions 비밀값 | `NOTION_TOKEN`(`seojaewan-blog` 연동 토큰, 동기화 작업이 Notion을 읽는다), `CONTENT_SYNC_TOKEN`(글 PR을 만드는 Fine-grained PAT, `seojaewan-blog`만, Contents·Pull requests 쓰기), `ALERT_SECRET`(notify 클라이언트 `blog`의 비밀값, 동기화 실패와 동기화 PR 검사 실패 알림용) |
  | 이미지 서버(`apps/images`) | `NOTION_TOKEN`(`seojaewan-images` 연동 토큰), `IMAGE_STORE_DIR`(기본 `/srv/seojaewan-blog/images`), `HOST`(기본 `127.0.0.1`, 컨테이너는 `0.0.0.0`), `PORT`(기본 3100), `ALERT_URL`·`ALERT_SECRET`(둘은 함께 있어야 하고, 둘 다 없으면 로그만 남긴다) |

  이미지 서버의 운영 값은 배포 스크립트가 컨테이너에 넣는다([[배포 환경:배포(CD)]]). `NOTION_TOKEN`은 owner가 local-server의 infra 화면에서 프로젝트 비밀값 `images-notion-token`으로 넣는 값이다. `ALERT_SECRET`은 notify 클라이언트 `images`의 비밀값으로, owner가 local-server에서 발급하고 실행 계정에 들어온다. `HOST`·`PORT`·`IMAGE_STORE_DIR`는 이미지에, `ALERT_URL`은 `compose.yaml`에 적는다. notify 서비스 이름은 이미지 서버 `images`다. `blog`는 컨테이너가 아니라 Actions 비밀값 `ALERT_SECRET`으로 쓴다. 젠킨스 `jenkins`는 local-server의 젠킨스가 쓴다([[알림 프로세스]]). 사람이 넣는 값은 Notion 토큰과 `CONTENT_SYNC_TOKEN`, Actions의 `ALERT_SECRET`이다.

  - 블로그는 환경 변수를 `src/env.ts`의 Zod 스키마로 검증한다. 환경 변수는 검증 모듈 하나에서만 읽는다([[코드 작성 규칙:React와 Next.js]]). 이미지 서버 주소와 Notion 데이터베이스 ID 세 개는 환경 변수가 아니라 코드 상수다.
  - turbo가 strict env 모드라, 작업에 넘길 변수를 `turbo.json`에 적어야 한다. `build`와 `dev`에는 `CONTENT_SOURCE`만, `test:e2e`에는 `CONTENT_SOURCE`·`E2E_PORT`를 넘긴다.
  - 미니 PC: 비밀값은 owner가 local-server의 infra 화면에서 넣어 실행 계정의 `/run/secrets`에 들어오고, 배포 스크립트가 권한 600 env 파일로 컨테이너에 넣은 뒤 지운다([[배포 환경:배포(CD)]]). 이것이 운영의 기준이다.
  - 로컬: `apps/web/.env.local`에 직접 둔다(Vercel이 없으므로 `vercel env pull`은 없다).
  - Actions 비밀값은 저장소 Settings의 Secrets에 사람이 넣는다.
  - 토큰의 종류와 권한은 [[콘텐츠 원천:연동 토큰]]에서 정한다.
접근 제한: |
  Cloudflare Access(로그인으로 막는 기능)는 이 저장소 쪽에서 쓰지 않는다. 젠킨스 관리 화면(`jenkins.seojaewan.com`)의 Access는 local-server가 맡고 예외를 두지 않는다. 블로그 `seojaewan.com`에는 Access를 쓰지 않는다.

  시나리오 케이스 보고서는 GitHub Pages로 옮기면서 Access가 없어진다. 공개 저장소의 Pages라 누구나 볼 수 있다([[배포 환경:CI]]). 미니 PC 보고서에 걸던 Access 앱은 지울 대상이다(사람이 Cloudflare에서 지운다, [[배포 환경:인프라 설정의 위치]]).

  `/github-webhook/` 경로 공개와 `jenkins-webhook` Access 앱(Bypass)은 2026-11-06에 만들었지만, 웹훅을 쓰지 않게 되어 지운다. Notion 통합 웹훅은 터널이 아니라 Cloudflare Worker(`tools/notion-webhook/`)가 받아 글 동기화를 시작한다([[배포 환경:CI]]).
인프라 설정의 위치: |
  터널, Access, GitHub Pages와 같은 인프라 설정은 코드가 아니라 서버와 Cloudflare·GitHub 설정이다. 그 절차와 결과(주소, 서비스 이름, 설정 파일 위치)는 이 문서에 적는다. 값(토큰, 비밀번호)은 적지 않는다. 설정이 끝나면 적을 자리가 이 섹션이다.

  - 시나리오 케이스 보고서 사이트(GitHub Pages): 저장소 Settings > Pages에서 `gh-pages` 브랜치 루트를 내주고, 커스텀 도메인은 `scenario-cases.seojaewan.com`이다(브랜치 루트의 `CNAME`은 CI가 넣는다). DNS는 Cloudflare DNS의 `scenario-cases` 레코드를 GitHub Pages로 돌린다. 저장소 공개 전환 뒤에 사람이 설정한다. 아직 하지 않았다.

  더 쓰지 않는 설정(2026-11-11 CI 구조 개편으로 쓰지 않게 됐다). 아래는 정리하기 전의 상태이고, 정리는 사람이 한다. 아직 하지 않았다.
  - self-hosted runner: `minipc-1`~`minipc-3`, 라벨 `self-hosted, Linux, X64`, 버전 v2.338.2. 폴더는 `~/actions-runners/runner-1`~`3`, systemd 서비스는 `actions.runner.SeoJaeWan-seojaewan-blog.minipc-<n>.service`(사용자 `seojaewan`)다. 지금도 저장소에 달려 있지만 어느 워크플로도 쓰지 않는다. 저장소 공개 전환 전에 사람이 저장소에서 떼고 서비스와 폴더를 지운다. 아직 떼지 않았다([[배포 환경:CI]]).
  - 시나리오 케이스 보고서 폴더: `/home/seojaewan/scenario-cases-report`는 가장 최근 실행을 가리키는 심볼릭 링크다. 실행별 사본은 `/home/seojaewan/scenario-cases-report-builds/`에 있다.
  - 시나리오 케이스 보고서 서버: `scenario-cases-report.service`(유닛 파일은 `~/scenario-cases-report-server/`)가 `python3 -m http.server`로 `127.0.0.1:8470`을 연다. 부팅 시 자동으로 시작한다.
  - 시나리오 케이스 보고서 공개 주소: Cloudflare 터널(local-server 터널, 대시보드에서 관리)의 공개 호스트 이름 `scenario-cases.seojaewan.com`이 `http://127.0.0.1:8470`으로 간다. Service Type은 HTTP다(HTTPS로 두면 502). Cloudflare Access 애플리케이션으로 소유자 이메일만 허용한다. 같은 이름을 GitHub Pages로 돌리려면 이 공개 호스트 이름과 Access 앱을 먼저 지운다.
  - 머신 준비(runner용): Playwright Chromium 시스템 라이브러리 설치(`playwright install-deps chromium`), `corepack enable`. runner를 떼면 이 준비는 필요 없다.

  계속 쓰는 설정:
  - 포트(2026-11-06 정함): 블로그 컨테이너 `127.0.0.1:3000`, 이미지 서버 컨테이너 `127.0.0.1:3100`, 젠킨스(local-server 소유) `127.0.0.1:8090`이다. 8080은 local-server의 Caddy가 `10.88.0.2:8080`에서 쓰고 있어 피했다.
  - 이미지 서버 공개 주소: 같은 터널의 공개 호스트 이름 `images.seojaewan.com`이 `http://127.0.0.1:3100`으로 간다. Access는 걸지 않는다. 방문자와 카카오 미리보기 봇이 받아야 하기 때문이다([[Notion 이미지 제공]]).
  - 젠킨스 공개 주소(local-server 소유): 같은 터널의 `jenkins.seojaewan.com`이 `http://127.0.0.1:8090`으로 간다.
  - 젠킨스의 Cloudflare Access: `jenkins` 앱(local-server 소유)이 `jenkins.seojaewan.com` 전체를 owner 이메일만 허용한다. `jenkins-webhook` 앱(`/github-webhook` Bypass)은 웹훅을 쓰지 않게 되어 지울 대상이다(owner가 Cloudflare에서 지운다).
  - Access 앱을 만들 때 만난 문제: 브라우저 격리 옵션을 켜면 공개 주소에 저장이 안 된다. 같은 주소를 쓰는 앱이 이미 있으면 "destination belongs to another application" 오류가 난다.
  - 2026-11-06에 확인한 상태: `jenkins.seojaewan.com/`은 Access로 302, `images.seojaewan.com`은 서버가 없어 502였다. 2026-11-08에 이미지 서버를 배포해 `images.seojaewan.com/healthz`가 200이다.
  - 머신 준비: 사용자 `seojaewan`을 docker 그룹에 추가.
공개 절차: |
  준비되기 전에는 `seojaewan.com`을 터널에 연결하지 않았다. 연결하지 않으면 접속 자체가 되지 않아 막아 둘 필요가 없다. 공개 전에는 사람이 사이트를 미리 보지 않고, health check와 서버 안의 `curl`로만 확인했다.

  2026-11-08에 공개했다. `seojaewan.com`을 터널(`127.0.0.1:3000`)에 연결했고 Access는 없다. `www`는 [[배포 환경:도메인과 캐시]]대로 넘긴다. 공개 확인에서 첫 화면, `/api/health`, robots, sitemap, og 이미지가 200이고 없는 주소는 404이며, 글 페이지와 본문 이미지, og/twitter 메타, 카카오톡 미리보기가 정상이었다.

  공개는 `seojaewan.com`을 처음 터널에 연결하는 일이다.
  1. 터널에 연결한다.
  2. 확인한다: 사이트 접속, 글 동기화 작업(글을 고치거나 `공개`를 체크하면 PR이 만들어지고, CI를 통과해 워크플로가 병합하고, 다시 배포되는지. 초안만 고친 경우 PR이 없는지), 동기화 실패와 글 PR CI 실패 때 카카오톡 알림(notify는 준비됐다, [[알림 프로세스:선행 조건]]), 카카오톡으로 링크를 공유했을 때의 미리보기([[SEO와 공유 미리보기:공유 미리보기 이미지]]).
  3. 문제가 있으면 고치거나 터널 연결을 끊는다.
  4. 확인되면 Google Search Console과 네이버 서치어드바이저에 등록한다(아직 하지 않았다, 사람이 한다. [[SEO와 공유 미리보기:검색 엔진 등록]]).

