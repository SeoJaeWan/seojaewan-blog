_codocs:
  id: notion-blocks
  name: Notion 블록
  parent:
    - seojaewan 블로그
개요: |
  글 본문에 들어오는 Notion 블록을 무엇까지 받고 어떻게 그리는지 정한다.
지원 블록: |
  지원하는 블록: 제목, 문단, 목록(글머리·번호·할 일), 인용, 콜아웃, 코드, 이미지, 구분선, 토글, 표, 북마크(링크 카드), 수식, 열 나누기(`column_list`/`column`).
  열 나누기: 넓은 창에서는 열을 가로로 나란히 놓고, 각 열의 너비는 Notion의 `width_ratio`를 따른다(없으면 똑같이 나눈다). 좁은 창과 모바일에서는 위에서 아래로 차례로 쌓는다(왼쪽 열 다음 오른쪽 열). 넓은 창과 좁은 창은 [[Chrome:글 화면]]의 창 너비 기준으로 가른다. 열 안의 제목도 목차에 들어간다.
  코드 문법 강조와 수식은 서버에서 본문을 만들 때 처리해 보낸다([[기술 스택:글 본문 처리]]). 잘못된 식은 식 글자를 코드 서체로 보이고 서버 로그에 경고를 남긴다. 글자 사이의 인라인 수식은 지원하지 않는다.
모양: |
  블록의 종류와 짜임(콜아웃의 아이콘과 글, 토글의 꺾쇠와 제목)은 Notion을 따르고, 색·모서리·선·글꼴은 디자인 시스템 토큰을 쓴다. 글 화면의 다른 부품(코드 블록, 목차, 이전·다음 글 카드)과 어울리게 하기 위해서다.

  - Notion의 색 지정(콜아웃 배경색, 글자색, 형광펜)은 따르지 않고 한 가지 모양으로 그린다. Notion 색을 모두 받으면 토큰이 크게 늘어나는데 기술 글에서는 거의 쓰지 않기 때문이다.
  - 콜아웃 아이콘은 Notion 아이콘(이모지)을 따르지 않고 한 가지로 고정한다.
  - 글에서 가장 높은 제목 단계를 `h2`로 그린다. 글 제목이 `h1`이라 제목 2부터 쓰는 글도 단계가 건너뛰지 않게 하기 위해서다. 맨 위 블록과 열 안의 블록을 보고, 토글 안의 제목은 찾는 범위에 넣지 않는다.
  - 목록 표시는 Notion과 같다. 번호는 단계마다 `1.`·`a.`·`i.`, 글머리표는 `•`·`◦`·`▪`다.
  - 글자 서식은 굵게, 기울임, 밑줄, 취소선, 인라인 코드, 링크만 지원한다. 글자 스타일은 [[디자인 기반:서체]]를 따른다. 서식이 한 조각에 여럿 걸리면 Notion처럼 모두 겹쳐 그린다(굵게+기울임 등). 피그마 글자 스타일(Body Large Strong·Italic·Underline·Strikethrough)이 각각 굵기, 기울임, 밑줄, 취소선 하나만 바꾸므로 코드는 그 속성을 겹친다.
  - 인라인 코드의 모양은 피그마 글 본문 서식 글자 스타일과 그 색 변수의 description에 있다. 배경 상자를 두지 않는 것은 피그마는 글자 일부에 배경을 칠할 수 없어, 배경을 두면 피그마와 코드가 달라지고 캡처 표로 비교할 수 없기 때문이다.
  - 북마크 제목은 API가 주지 않아 캡션을 쓰고, 없으면 주소를 쓴다. 설명은 비운다.
  - 하위 블록을 품지 못하는 블록(문단, 제목, 인용, 콜아웃, 코드)의 하위 블록은 그 블록 바로 뒤에 놓는다.
  - 블로그 주소(`seojaewan.com`, `www` 포함) 링크는 사이트 안 경로로 바꾼다.
지원하지 않는 블록: |
  지원하지 않는 블록이 글에 들어오면 그 자리에 "지원하지 않는 블록(유형 이름)" 안내 상자를 보여주고 서버 로그에 경고를 남긴다.
  `child_page`·`child_database`도 지원하지 않는 블록으로 다룬다.
  조용히 버리면 빠진 내용을 알 수 없고, 오류로 멈추면 글 동기화([[콘텐츠 원천:갱신 방식]])와 빌드가 실패해 새 글이 반영되지 않기 때문이다.
