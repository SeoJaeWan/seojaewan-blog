_codocs:
  id: notion-image-delivery
  name: Notion 이미지 제공
  parent:
    - seojaewan 블로그
개요: |
  Notion 글에 들어있는 이미지(본문 이미지와 페이지 커버)를 블로그에서 어떻게 제공하는지에 대한 결정이다.
  Notion이 돌려주는 이미지 URL은 약 1시간 뒤 만료되지만, [[콘텐츠 원천:갱신 방식]]으로 만든 페이지는 그보다 오래 캐시될 수 있다. 이 원문 URL을 그대로 쓰면 방문자가 깨진 이미지를 보게 된다.
결정: |
  이미지는 이 저장소의 이미지 서버(`apps/images`)가 저장하고 Cloudflare를 CDN으로 삼아 제공한다. 이미지 서버는 Firebat(미니 PC)에서 Docker 컨테이너로 돌고, 블로그와 같은 공용 젠킨스 파이프라인으로 배포한다([[배포 환경:배포(CD)]]).

  - 저장소: 컨테이너 밖 볼륨 `/srv/seojaewan-blog/images`(Firebat 호스트, 컨테이너 안에서도 같은 경로)에 Notion 블록 ID(커버는 페이지 ID) 기준으로 저장한다. 프로젝트 데이터는 `/srv/<저장소 이름>/` 아래에 둔다는 local-server의 공통 규칙(local-server 저장소 `.codocs/foundation/project-deploy.yaml`)을 따른다([[배포 환경:배포(CD)]]). 원본은 따로 저장하지 않고 WebP 크기별 사본만 둔다([[Notion 이미지 제공:최적화]]).
  - 공개 주소: `images.seojaewan.com`을 Cloudflare 터널에서 이미지 서버 컨테이너 포트로 연결한다. 포트 `127.0.0.1:3100`과 터널은 준비됐다([[배포 환경:인프라 설정의 위치]]).
  - 캐시: 응답에 변하지 않는 리소스(`immutable`)와 긴 캐시 기간을 주어 Cloudflare 엣지가 응답하고 이미지 서버까지 오는 요청을 줄인다.
  - 오류 응답: 잘못된 주소·폭과 없는 이미지는 4xx를 `max-age=60`으로 답한다. 가져오기 실패는 502를 `no-store`로 답하고 notify로 알린다(같은 제목은 10분에 한 번, [[알림 프로세스]]). 모든 응답에 `nosniff`와 CSP를 붙여, SVG를 바로 열어도 스크립트가 돌지 않게 한다.
  - 블로그: Notion 이미지 URL을 아래 고정 주소로 바꾸어 그린다. Notion의 만료 URL은 화면에 나가지 않는다.
  - 접근 제한: 이미지 서버와 Cloudflare에는 Referer 검사와 봇 차단을 두지 않는다. 카카오톡 미리보기 봇은 Referer 없이 이미지를 가져가므로([[SEO와 공유 미리보기:공유 미리보기 이미지]]), 막으면 공유 미리보기에 이미지가 나오지 않는다.
가져오는 시점: |
  저장된 이미지가 없을 때 요청 시점에 가져온다.
  요청한 이미지가 없으면, 이미지 서버가 Notion API로 그 블록(커버는 페이지)의 새 URL을 받아 이미지를 내려받고 저장한 뒤 응답한다. 새 URL을 받는 Notion 호출은 이미지·버전마다 처음 한 번뿐이다. 저장한 이미지는 지우지 않고 유지한다.

  요청한 버전이 지금 Notion의 버전과 다르면 404(짧은 캐시)로 답하고 저장하지 않는다. 옛 주소에 새 그림을 담으면 `immutable` 캐시와 맞지 않기 때문이다. 이미 저장한 옛 버전은 그대로 준다.

  별도 동기화 작업이 필요 없고, Notion에 새 이미지를 넣으면 바로 보인다.
  글을 공개하는 순간에는 블로그가 글을 다시 만들면서 이미지 크기를 묻는데([[Notion 이미지 제공:크기]]), 이때 아직 저장되지 않은 이미지를 이미지 서버가 가져와 저장한다. 그래서 방문자가 오기 전에 이미지가 미리 준비된다.
검토한 대안: |
  - 미리 동기화: 글 반영과 이미지 동기화의 순서가 어긋나면 이미지가 잠깐 깨질 수 있어 고르지 않았다.
  - Vercel Blob에 복사: 저장 용량과 동기화 로직이 필요하다.
  - 블로그 앱 안의 이미지 프록시 경로: 별도 저장소가 필요 없지만 원본을 보관하지 않아, CDN 캐시가 비면 매번 Notion API를 호출한다.
  - `next/image` 최적화(서버가 요청 때 변환): 캐시가 만료된 뒤 원본 URL도 만료돼 있으면 깨져서 단독 해결책이 아니다. Vercel의 이미지 최적화에 기대는 방식이라 자체 배포로 옮기면서 쓰지 않고, 이미지 서버가 저장할 때 변환해 두는 쪽을 골랐다.
  - 원본을 따로 저장하고 요청 때 변환: 서버 용량이 늘고, 공유 미리보기 이미지를 위해 원본(`?w=original`)을 내려주는 안도 검토했지만 카카오톡이 WebP를 받을 수 있다고 보아 버렸다. 폭 기준을 바꾸면 Notion에서 다시 가져와 만든다.
조건: |
  - 이미지 서버는 집 서버(Firebat)에서 돌아 꺼질 수 있다. Cloudflare에 캐시된 이미지는 계속 보이지만, 캐시에 없는 이미지는 서버가 꺼진 동안 깨진다. Cloudflare 무료 플랜은 캐시 보존 기간을 보장하지 않아 이 위험을 완전히 없앨 수는 없다.
  - 이미지 서버에도 Notion 토큰이 필요하다. 블로그와 별도 연동 `seojaewan-images`를 쓰고, 읽기 권한만 준다([[콘텐츠 원천:연동 토큰]]). 블로그와 별도 프로세스와 credential로 분리한다.
  - 이미지 서버의 소스는 이 저장소의 `apps/images`다. local-server가 2026-11-06에 이미지 서버를 다루지 않기로 했고, 이미지 주소와 크기 헤더 같은 계약을 블로그 코드와 한 저장소에서 시험하기 위해서다.
주소: |
  `https://images.seojaewan.com/notion/<블록 ID>/<버전>` (본문 이미지)
  `https://images.seojaewan.com/notion/cover/<페이지 ID>/<버전>` (커버)

  - 용도가 드러나는 호스트 이름이고, Notion 외의 이미지(배경화면 등)를 둘 때는 `/wallpaper/...`처럼 경로로 나눈다.
  - 확장자는 경로에 넣지 않고 응답의 `Content-Type`으로 알린다. Notion에서 이미지 형식이 바뀌어도 주소가 그대로다.
  - Notion에 올린 이미지든 외부 주소의 이미지든, 본문 이미지든 커버든 모두 같은 길을 지난다.
  - 버전은 그림이 바뀌면 주소가 새로 되게 하려는 값이다. 본문 이미지는 블록 `last_edited_time`에서 숫자와 `T`·`Z`만 남긴 값이다(예: `20261106T023300Z`). 커버는 커버 주소의 SHA-256 앞 12자다. Notion에 올린(file) 커버는 서명 쿼리가 요청마다 바뀌므로 쿼리를 뺀 주소를 줄인다. 같은 주소의 이미지는 바뀌지 않으므로 `immutable` 캐시와 맞는다.
크기: |
  이미지를 그릴 때 `width`·`height`를 알면 이미지가 로드되기 전에 자리를 잡아 화면이 밀리지 않는다.

  - 이미지 크기는 글을 내보낼 때(동기화 작업) 이미지 서버에 물어 글 JSON의 `imageSizes`에 넣는다([[콘텐츠 원천:읽는 곳]]). 빌드와 블로그는 이미지 서버를 부르지 않는다.
  - 이미지마다 HEAD 요청으로 묻는다. 이미지 서버는 저장할 때 읽어 둔 크기를 `X-Image-Width`·`X-Image-Height` 헤더로 준다. 저장본이 없으면 이때 가져와 저장한다.
  - 이미 받은 크기는 다시 묻지 않고 이전 JSON의 값을 쓴다. 주소에 버전이 있어 같은 주소의 크기는 바뀌지 않기 때문이다.
  - 이미지 블록의 모양에 `width`·`height`(알 수 없으면 null)를 더하고([[Notion 블록]]), `<img width height loading="lazy">`로 그린다.
  - 글 본문(`PostBody`)에 커버(주소와 크기, 없으면 null)도 담는다.
  - 응답이 없거나 실패 상태이거나 크기 머리가 없으면 실패로 보고 `imageSizes`에 null을 넣고 경고 로그만 남긴다. 크기 없이 그리고, 빌드도 null 크기에는 다시 경고하지 않는다. 내보내기는 실패시키지 않고 notify로도 알리지 않는다. 이미지 서버가 없는 동안 매시간 알림이 가지 않게 하기 위해서다.
  - 요청마다 10초에 끊고 동시에 4개까지 보낸다. 저장본이 없으면 이미지 서버가 그때 Notion에서 받아 변환하므로 넉넉히 두었고, 집 서버가 한꺼번에 떠안지 않게 동시 수를 묶었다.
  - `fixture` 모드([[콘텐츠 원천:읽는 곳]])에는 이미지 서버가 없어 크기를 묻지 않는다. 모든 이미지와 커버를 저장소 안의 시험 이미지(`notion-test-image.png`)와 그 원본 크기로 그린다.
로딩 표시: |
  이미지를 받는 동안 이미지 자리에 옅은 회색 스켈레톤을 깔고 은은하게 반짝인다. 반짝임은 받는 동안 계속 되풀이한다. 본문 이미지, 커버, 이미지 크게 보기([[Chrome:글 화면]])에 적용하고 바탕화면 배경은 제외한다.

  - 크기를 알면 그 비율로, 크기를 모르는(null) 이미지는 16:9 자리를 잡는다([[Notion 이미지 제공:크기]]).
  - 다 받으면 짧게 서서히 나타나며 스켈레톤을 치운다.
  - 그릴 때 이미 받아진 이미지(캐시에 있어 `img.complete`인 이미지)는 스켈레톤 없이 바로 보인다. 탭을 바꾸거나 창을 다시 열 때 번쩍이는 것을 막기 위해서다.
  - 받기에 실패하면 반짝임을 멈추고 회색 칸으로 남긴다. 깨진 이미지 아이콘은 보이지 않는다.
  - 반짝임과 서서히 나타나는 움직임의 값은 피그마의 움직임이 정한다([[디자인 기반:모션 견본]]). 피그마 Figure는 스켈레톤의 모양(색, 반짝임, 반경)만 보여 주고, 실제 크기는 위 규칙대로 코드가 정한다. 크기 계산을 위한 레이어를 피그마에 두지 않는다.
최적화: |
  이미지 서버가 저장할 때 WebP로 폭 720과 1440 두 벌을 만든다.

  - 폭의 출처는 글 본문 폭 토큰 `--size-post-width`의 1배와 2배다. 토큰이 바뀌면 이 폭도 함께 바꾼다.
  - 원본보다 큰 폭은 만들지 않는다. 원본 폭이 정한 폭보다 작으면 그 폭에는 원본 폭의 WebP를 주므로, 두 폭이 같은 파일을 함께 쓸 수 있다. GIF·SVG는 변환하지 않고 원본 그대로 둔다.
  - 요청은 정한 폭만 받는다(`?w=720`, `?w=1440`). 폭이 없으면 가장 큰 것을 준다.
  - 블로그는 `srcset`(720w·1440w)과 `sizes="(max-width: 767px) 100vw, 720px"`로 그린다. 767은 모바일 경계다.
  - 형식은 WebP 하나로 고정한다. Cloudflare 무료 플랜의 캐시가 같은 주소의 형식별 응답을 구분하는 데 제약이 있기 때문이다.
  - 공유 미리보기 이미지는 커버의 `?w=1440`을 쓴다([[SEO와 공유 미리보기:공유 미리보기 이미지]]).
