_codocs:
  id: minipc-cleanup
  name: 미니 PC 정리
  parent:
    - seojaewan 블로그
개요: |
  2026-11-11 CI 구조 개편으로 미니 PC에서 더 쓰지 않게 된 것(self-hosted runner, 시나리오 케이스 보고서 서버와 폴더)을 지우는 작업의 순서다. 미니 PC에서 도는 세션이 이 문서대로 한다.
  이 문서는 그 세션이 처음부터 다시 조사하지 않게 지울 것, 지우면 안 되는 것, 확인 방법을 모은다. 정리가 끝나 [[배포 환경]]에 반영하면 이 문서를 지운다.
  아래의 이름과 경로는 [[배포 환경:인프라 설정의 위치]]에 적힌 기록이고, 이 문서를 쓸 때 서버에서 직접 확인하지는 못했다. 그래서 지우기 전에 "먼저 확인"의 명령으로 실제 상태를 본다. 기록과 다르면 지우지 말고 사람에게 차이를 보고한다.
이미 끝난 것: |
  서버 밖의 설정은 끝났다. 다시 하지 않는다.
  - 2026-11-12: self-hosted runner 셋(`minipc-1`~`minipc-3`)을 GitHub 저장소에서 뗐다(저장소의 runner 0개). 저장소를 공개로 바꿨다. 모든 워크플로가 GitHub 호스티드 러너에서 돈다.
  - 2026-11-14: 시나리오 케이스 보고서가 GitHub Pages로 옮겨졌다. `https://scenario-cases.seojaewan.com/`이 GitHub Pages에서 200으로 열린다. Cloudflare DNS의 `scenario-cases` 레코드는 `seojaewan.github.io`를 가리키고, local-server 터널의 `scenario-cases` 공개 호스트 이름과 Access 앱 `control`의 `scenario-cases` 대상은 지웠다.
  그래서 미니 PC의 runner 서비스와 보고서 서버(8470)로 들어오는 요청은 더 없다.
건드리지 않는 것: |
  같은 미니 PC에서 아래는 계속 쓴다. 멈추거나 지우지 않는다.
  - 블로그 컨테이너 `web`(`127.0.0.1:3000`)과 이미지 서버 컨테이너 `images`(`127.0.0.1:3100`), 저장소 루트의 `compose.yaml`.
  - cloudflared(local-server 터널)와 그 설정. `seojaewan.com`, `www`, `images`, `jenkins`, `cli`, `cli2`, `infra`가 이 터널을 쓴다.
  - 젠킨스, notify(`10.88.0.1:8790`), local-server가 맡은 것 전부(방화벽, 감시).
  - Playwright Chromium 시스템 라이브러리와 corepack 설정. runner용으로 깔았지만 지워서 얻는 것이 없고 다른 것이 쓸 수 있어 그대로 둔다.
  이름이 아래 "지울 것"과 정확히 같지 않은 서비스나 폴더는 지우지 않는다.
먼저 확인: |
  지우기 전에 실제 상태를 본다. 결과를 작업 보고에 적는다.
  ```sh
  systemctl list-units --all 'actions.runner.*' --no-pager
  systemctl list-unit-files 'actions.runner.*' 'scenario-cases-report*' --no-pager
  systemctl --user list-unit-files 'scenario-cases-report*' --no-pager
  systemctl cat scenario-cases-report.service
  ls -la ~/actions-runners ~/scenario-cases-report-server ~/scenario-cases-report ~/scenario-cases-report-builds
  du -sh ~/actions-runners ~/scenario-cases-report-builds
  ss -ltnp | grep 8470
  ```
  기록된 상태는 이렇다.
  - runner 서비스 셋: `actions.runner.SeoJaeWan-seojaewan-blog.minipc-1.service`~`minipc-3.service`(사용자 `seojaewan`). 폴더는 `~/actions-runners/runner-1`~`runner-3`.
  - 보고서 서버: `scenario-cases-report.service`가 `python3 -m http.server`로 `127.0.0.1:8470`을 연다. 유닛 파일은 `~/scenario-cases-report-server/`에 있다. 시스템 서비스인지 사용자 서비스인지는 기록에 없으므로 위 명령으로 확인한다.
  - 보고서 폴더: `~/scenario-cases-report`는 심볼릭 링크이고 실행별 사본은 `~/scenario-cases-report-builds/`에 있다.
지울 것: |
  차례대로 한다. `sudo`가 필요한 명령에서 권한이 없으면 멈추고 사람에게 알린다.
  1. runner 서비스를 멈추고 지운다. runner는 이미 저장소에서 떼어져 있어 `config.sh remove`(토큰 필요)는 하지 않는다. 폴더마다 `svc.sh`로 지운다.
     ```sh
     for n in 1 2 3; do
       (cd ~/actions-runners/runner-$n && sudo ./svc.sh stop; sudo ./svc.sh uninstall)
     done
     ```
     `svc.sh`가 없거나 실패하면 systemd로 직접 한다.
     ```sh
     for n in 1 2 3; do
       sudo systemctl disable --now actions.runner.SeoJaeWan-seojaewan-blog.minipc-$n.service
       sudo rm -f /etc/systemd/system/actions.runner.SeoJaeWan-seojaewan-blog.minipc-$n.service
     done
     sudo systemctl daemon-reload
     ```
  2. runner 폴더를 지운다: `rm -rf ~/actions-runners`. 폴더 안의 `.credentials`와 `.runner`는 떼어진 runner의 등록 정보라 함께 지워진다. 내용을 출력하거나 다른 곳에 복사하지 않는다.
  3. 보고서 서버를 멈추고 지운다. "먼저 확인"에서 본 종류에 맞춘다.
     ```sh
     # 시스템 서비스일 때
     sudo systemctl disable --now scenario-cases-report.service
     sudo rm -f /etc/systemd/system/scenario-cases-report.service
     sudo systemctl daemon-reload
     # 사용자 서비스일 때
     systemctl --user disable --now scenario-cases-report.service
     rm -f ~/.config/systemd/user/scenario-cases-report.service
     systemctl --user daemon-reload
     ```
     그다음 `rm -rf ~/scenario-cases-report-server`.
  4. 보고서 폴더를 지운다: `rm -f ~/scenario-cases-report`(링크), `rm -rf ~/scenario-cases-report-builds`.
  5. runner가 남긴 것이 더 있는지 본다. 있으면 지우지 말고 목록만 보고한다(사람이 정한다).
     ```sh
     ls -la ~ | grep -i -E 'runner|scenario'
     ls /etc/systemd/system | grep -i -E 'runner|scenario'
     ```
끝난 뒤 확인: |
  ```sh
  systemctl list-units --all 'actions.runner.*' 'scenario-cases-report*' --no-pager   # 아무것도 없어야 한다
  systemctl --failed --no-pager                                                      # 지운 서비스가 실패로 남지 않아야 한다
  ss -ltnp | grep 8470                                                               # 아무것도 없어야 한다
  docker compose -p seojaewan-blog ps                                                # web, images가 healthy
  curl -s -o /dev/null -w '%{http_code}\n' https://seojaewan.com/api/health          # 200
  curl -s -o /dev/null -w '%{http_code}\n' https://images.seojaewan.com/healthz      # 200
  curl -s -o /dev/null -w '%{http_code}\n' https://scenario-cases.seojaewan.com/     # 200 (GitHub Pages)
  ```
  local-server의 감시 목록에 runner 서비스나 보고서 서버가 남아 있으면 지운 뒤 경보가 난다. 남아 있는지 보고, 있으면 local-server 저장소에서 빼야 한다고 보고한다(이 저장소에서 고치지 않는다).
문서 반영: |
  정리가 끝나면 문서를 실제 상태에 맞춘다. `docs/` 브랜치의 PR 하나로 한다([[Git 작업 규칙]]).
  - [[배포 환경:CI]]: "공개 전환과 runner 떼기는 사람이 한다. 아직 하지 않았다"로 시작하는 항목을 끝난 사실(2026-11-12 공개 전환, runner 0개)로 고친다.
  - [[배포 환경:인프라 설정의 위치]]: 보고서 사이트 항목의 "아직 하지 않았다"를 끝난 사실(2026-11-14)로 고친다. "더 쓰지 않는 설정" 묶음은 지운 날짜와 함께 지웠다고 줄이거나 없앤다.
  - [[남은 작업]] 8번: 끝난 줄(runner 떼기와 공개 전환, Pages와 도메인)을 지운다. Worker 배포와 Notion 웹훅 등록, 알림 주소, CI 시간 측정은 이 작업의 범위가 아니므로 그대로 둔다.
  - 이 문서(`minipc-cleanup.yaml`)를 지운다.
  문서와 서버의 실제 상태가 달랐던 곳은 PR 본문에 적는다.
