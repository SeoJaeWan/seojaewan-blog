_codocs:
  id: desktop-review
  name: 바탕화면 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10에 구현한 바탕화면을 실제 Windows 11 바탕화면과 비교해 찾은 차이와, 사람과 논의해 정한 해결이다.
  바탕화면 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 지우고, 마지막 PR에서 이 문서를 지운다. 피그마 작업은 피그마 세션이 한다([[피그마 작업 검수:10. 바탕화면 피그마 작업]]).
  메뉴 바탕의 투명도(옛 6번)는 [[피그마 작업 검수:1. 재질 값]]으로 옮겼다. 12·13번은 [[파일 탐색기 검수]]에서 옮겨 왔다. 아이콘 항목의 선택 바탕을 한 세션이 고치게 하기 위해서다.
  모든 항목을 `feat/desktop-review`에서 끝냈다. 다른 문서나 코드가 가리키는 섹션만 "끝남"으로 남겨 두었다.
세션 사이 약속: |
  공통 약속은 [[피그마 작업 검수:세션 사이 약속]]을 따른다. 이 문서에만 해당하는 것은 다음이다.
  - 맡은 컴포넌트 PR: `FileItem`(`feat/figma-file-item`), `RenameField`(`feat/figma-rename-field`, 피그마가 바뀔 때만), 메뉴 단추 줄 부품(`MenuCommandButton` `feat/figma-menu-command-button`, `MenuCommandBar` `feat/figma-menu-command-bar`), `Menu`(`feat/figma-menu`). 조립 PR은 `feat/figma-patterns-desktop`이다.
  - 같은 파일을 고치는 다른 세션: 항목 메뉴(`getItemMenuEntries`)에 파일 탐색기 세션이 더한 "즐겨찾기에 고정" 줄([[파일 탐색기 검수:14. 즐겨찾기]])은 이 브랜치가 `main`을 병합하며 단추 줄로 바꾼 뒤의 목록에서 "새 창에서 열기"와 "시작 화면에 고정" 사이에 맞췄다.
비교 방법: |
  - 실제 화면: 사람이 녹화한 영상 세 개. 바탕화면 조작(아이콘 우클릭, 빈 곳 메뉴와 보기·새로 만들기 하위 메뉴, 이름 바꾸기, 끌기), 파일 탐색기 보기 메뉴, 잘라낸 뒤의 붙여넣기 메뉴다. 영상에서 프레임을 뽑아 1:1로 확대해 봤다.
  - 구현: 개발 서버(1920×1080)에서 영상과 같은 조작을 Playwright로 재현해 캡처했다.
  - 배경화면이 다른 것(실제는 Windows 추천 배경, 구현은 Bloom)은 [[바탕화면:배경화면]]에서 정한 대로라 차이로 세지 않았다.
  - 12·13번의 영상은 [[파일 탐색기 검수:비교 방법]]의 것이다.
1. 이름 바꾸기 입력창의 줄 바꿈: |
  끝남(`feat/desktop-review`). 아이콘 보기의 이름 바꾸기 입력창은 줄이 바뀌는 textarea다. 규칙은 [[항목과 폴더:폴더 이름]]과 `RenameField`·`FileItem` 코드에 있다. 코드가 이 섹션을 가리키고 있어 남긴다.
2. 이름 바꾸는 동안의 선택 바탕: |
  끝남(`feat/desktop-review`). 바탕화면에서 이름을 바꾸는 동안 선택·호버 바탕을 그리지 않는다. `FileItem` 코드가 이 섹션을 가리키고 있어 남긴다.
3. 끄는 복제본의 선택 바탕: |
  끝남(`feat/desktop-review`). 끄는 복제본은 잘라낸 채 선택된 모습(`State=Cut selected`)이고 탐색기 복제본은 늘 파랗다([[항목 조작:끌기]], [[파일 탐색기:조작]]). `FileItem` 코드가 이 섹션을 가리키고 있어 남긴다.
4. 마우스를 올렸을 때 이름 펼침: |
  차이가 아니다. 처음 비교에서는 Windows가 마우스를 올리면 잘린 이름을 펼치는 것처럼 보였다. 0.1~0.2초 간격으로 다시 보니 녹화 시작부터 포커스가 있던 아이콘의 펼친 이름이었고, 마우스만 올렸을 때는 이름이 잘린 채 연한 호버 바탕만 생겼다. 구현과 같다.
5. 아이콘 메뉴의 단추 줄: |
  끝남(`feat/desktop-review`). 단추 줄 배치와 툴팁은 [[바탕화면 우클릭 메뉴:아이콘]]에 있다. [[파일 탐색기 검수]]가 이 섹션을 가리키고 있어 남긴다.
7. 보기 하위 메뉴의 아이콘과 단축키: |
  끝남(`feat/desktop-review`). [[파일 탐색기 검수]]가 이 섹션을 가리키고 있어 남긴다.
8. 새로 만들기와 폴더 아이콘: |
  끝남(`feat/desktop-review`). 원 안 + 아이콘 자산(`ic_fluent_add_circle_20_regular`)은 #895로 들어왔고, 탐색기 명령 모음도 같은 자산을 쓴다([[파일 탐색기 검수:10. 명령 버튼 모양과 주소 줄 구분선]]).
10. 붙여넣기 표시: |
  끝남(`feat/desktop-review`). 빈 곳 메뉴의 붙여넣기는 붙여넣을 것이 있을 때만 단추 줄에 보인다([[항목 조작:잘라내기와 붙여넣기]], [[바탕화면 우클릭 메뉴:빈 곳]]). [[파일 탐색기 검수]]가 이 섹션을 가리키고 있어 남긴다.
12. 탐색기 항목의 포커스 테두리: |
  끝남(`feat/desktop-review`). 탐색기 목록의 현재 항목에 1px 선을 늘 그린다([[파일 탐색기:조작]], [[컴포넌트 목록:상태]]). 바탕화면 아이콘은 그리지 않는다. 다른 문서와 `FileItem`·`FileRow` 코드가 이 섹션을 가리키고 있어 남긴다.
13. 포커스가 없는 선택은 회색: |
  끝남(`feat/desktop-review`). 항목 목록(`role="listbox"`)에 포커스가 없으면 선택 바탕과 현재 항목 선이 회색이다([[파일 탐색기:조작]], [[컴포넌트 목록:상태]]). 다른 문서와 `FileItem`·`FileRow` 코드가 이 섹션을 가리키고 있어 남긴다.
