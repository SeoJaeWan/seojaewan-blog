_codocs:
  id: desktop-review
  name: 바탕화면 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10에 구현한 바탕화면을 실제 Windows 11 바탕화면과 비교해 찾은 차이와, 사람과 논의해 정한 해결이다.
  바탕화면 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 지우고, 마지막 PR에서 이 문서를 지운다. 피그마 작업은 피그마 세션이 한다([[피그마 작업 검수:10. 바탕화면 피그마 작업]]).
  메뉴 바탕의 투명도(옛 6번)는 [[피그마 작업 검수:1. 재질 값]]으로 옮겼다. 12·13번은 [[파일 탐색기 검수]]에서 옮겨 왔다. 아이콘 항목의 선택 바탕을 한 세션이 고치게 하기 위해서다.
  아직 코드·문서·피그마는 아무것도 바꾸지 않았다.
세션 사이 약속: |
  공통 약속은 [[피그마 작업 검수:세션 사이 약속]]을 따른다. 이 문서에만 해당하는 것은 다음이다.
  - 맡은 컴포넌트 PR: `FileItem`(`feat/figma-file-item`), `RenameField`(`feat/figma-rename-field`, 피그마가 바뀔 때만), 메뉴 단추 줄 부품(새 컴포넌트, 브랜치 이름은 피그마 세션이 정한 컴포넌트 이름을 따른다), `Menu`(`feat/figma-menu`). 조립 PR은 `feat/figma-patterns-desktop`이다.
  - 기다릴 PR: 피그마 세션의 `feat/figma-tokens`(13번의 회색 선택 색), `feat/figma-menu-item`(7번), `feat/figma-file-row`(12·13번의 자세히 보기 행).
  - 먼저 병합해 줄 PR: 없다.
  - 같은 파일을 고치는 다른 세션: 항목 메뉴(`getItemMenuEntries`)에는 파일 탐색기 세션이 "즐겨찾기에 고정" 줄을 더한다([[파일 탐색기 검수:14. 즐겨찾기]]). 12·13번은 탐색기 목록 코드(`explorer-body`)를 고치는데 파일 탐색기 세션도 같은 파일을 고친다([[파일 탐색기 검수:3. 위로·뒤로·앞으로 이동 뒤의 선택]]).
비교 방법: |
  - 실제 화면: 사람이 녹화한 영상 세 개. 바탕화면 조작(아이콘 우클릭, 빈 곳 메뉴와 보기·새로 만들기 하위 메뉴, 이름 바꾸기, 끌기), 파일 탐색기 보기 메뉴, 잘라낸 뒤의 붙여넣기 메뉴다. 영상에서 프레임을 뽑아 1:1로 확대해 봤다.
  - 구현: 개발 서버(1920×1080)에서 영상과 같은 조작을 Playwright로 재현해 캡처했다.
  - 배경화면이 다른 것(실제는 Windows 추천 배경, 구현은 Bloom)은 [[바탕화면:배경화면]]에서 정한 대로라 차이로 세지 않았다.
  - 12·13번의 영상은 [[파일 탐색기 검수:비교 방법]]의 것이다.
1. 이름 바꾸기 입력창의 줄 바꿈: |
  - 차이: Windows는 입력창이 아이콘 칸 너비 안에서 글자 단위로 줄을 바꾸며 아래로 길어지고, 짧은 이름이면 글자 너비만 차지한다. 구현은 한 줄로 옆으로 늘어나 긴 이름이면 화면 왼쪽 밖으로 잘린다.
  - 원인: `RenameField`가 `<input type="text">`이고 `field-sizing-content`·`whitespace-nowrap`로 최대 너비 없이 옆으로 늘어난다.
  - 정한 해결: 아이콘 보기(`FileItem`)의 입력창만 줄이 바뀌는 `<textarea>`로 그린다(`RenameField`에 여러 줄 방식을 더함). 자세히 보기(`FileRow`)는 Windows도 한 줄이라 지금 input을 둔다.
  - Enter는 지금처럼 확정이고 줄 바꿈 문자는 입력되지 않게 막는다. 붙여넣은 글자의 줄 바꿈은 쓸 수 없는 문자 빼기와 같은 자리에서 뺀다. 이름은 최대 255자([[항목과 폴더:폴더 이름]])라 높이는 제한하지 않는다(Windows도 아래로 계속 길어진다).
  - 피그마: [[피그마 작업 검수:10. 바탕화면 피그마 작업]]
2. 이름 바꾸는 동안의 선택 바탕: |
  - 차이: Windows는 바탕화면에서 이름을 바꾸는 동안 아이콘 쪽 선택 바탕이 없고 흰 입력창만 보인다. 구현은 선택 바탕과 입력창이 함께 보인다.
  - 원인: 앱이 `isSelected`와 `isRenaming`을 함께 넘기는데, `FileItem`의 바탕 조건이 `isSelected`를 먼저 봐서 피그마 `State=Rename`(바탕화면은 바탕 없음)의 갈래에 닿지 않는다.
  - 정한 해결: 바탕을 정할 때 `isRenaming`을 먼저 본다. 바탕화면에서 이름을 바꾸는 중이면 선택·호버 바탕을 그리지 않는다. 탐색기는 지금처럼 선택 바탕을 깐다.
3. 끄는 복제본의 선택 바탕: |
  - 차이: Windows 복제본은 회색 반투명 선택 상자째로 끌린다. 구현은 아이콘과 이름만 흐리게 끌린다.
  - 원인: `ItemDragGhost`가 `FileItem`을 `isCut`으로만 그린다.
  - 정한 해결: 복제본을 피그마 `FileItem`의 `State=Cut selected`(`isSelected` + `isCut`)로 그린다. 탐색기 복제본도 같은 컴포넌트라 파란 선택 바탕이 깔린다(Windows 탐색기와 같다).
  - 복제본은 목록 밖에 그려지므로, 13번의 "포커스 없는 회색"이 되지 않게 탐색기 복제본은 파랑으로 그린다.
  - 문서: [[항목 조작:끌기]]의 "반투명한 복제본"을 "선택된 모습의 반투명한 복제본"으로 고친다(허락받음).
4. 마우스를 올렸을 때 이름 펼침: |
  차이가 아니다. 처음 비교에서는 Windows가 마우스를 올리면 잘린 이름을 펼치는 것처럼 보였다. 0.1~0.2초 간격으로 다시 보니 녹화 시작부터 포커스가 있던 아이콘의 펼친 이름이었고, 마우스만 올렸을 때는 이름이 잘린 채 연한 호버 바탕만 생겼다. 구현과 같다.
5. 아이콘 메뉴의 단추 줄: |
  - 차이: Windows 파일 메뉴는 자주 쓰는 명령을 아이콘 단추 줄(아이콘 아래 글자, 단축키 글자 없음)로 모으고, 목록의 `열기`에 `Enter`를 붙인다. 구현(피그마 `Menu/Folder·Post·Link·…`)은 모든 명령이 목록 한 줄씩이고 잘라내기·이름 바꾸기·삭제에 단축키 글자가 붙는다.
  - 정한 해결: 잘라내기·이름 바꾸기·삭제를 단추 줄로 올리고 `열기`에 `Enter`를 붙인다. 메뉴 항목은 [[바탕화면 우클릭 메뉴:아이콘]] 그대로이고 배치만 바꾼다. 복사·공유는 정한 메뉴에 없어 넣지 않는다.
    - 폴더: 단추 [잘라내기, 이름 바꾸기, 삭제], 목록 [열기 Enter, 새 창에서 열기, 시작 화면에 고정]
    - 글: 단추 [잘라내기, 삭제], 목록 [열기 Enter, 새 창에서 열기, 링크 복사, 시작 화면에 고정]
    - 외부 링크: 단추 [잘라내기, 삭제], 목록 [열기 Enter, 링크 복사, 시작 화면에 고정]
    - 휴지통: 단추로 올릴 명령이 없어 지금처럼 목록만
    - 여러 개 선택: 단추 [잘라내기, 삭제], 목록 [열기 Enter]
  - 단추에 마우스를 올리면 `이름 (단축키)` 툴팁을 띄운다(`잘라내기 (Ctrl+X)`, `이름 바꾸기 (F2)`, `삭제 (Delete)`). 10번 녹화에서 확인했다.
  - 메뉴가 화면 아래쪽에 걸려 위로 열리면 단추 줄을 메뉴 맨 아래로 옮긴다. 단추 줄이 늘 우클릭한 자리 가까이 있다(10번 녹화의 탐색기 아이콘 메뉴에서 확인).
  - 탐색기 항목 메뉴도 같은 `getItemMenuEntries`를 써서 함께 바뀐다(Windows 탐색기도 같은 모양). 탐색기 쪽 검수에 있던 같은 결정은 이 섹션으로 합쳤다.
  - 폴더 목록의 "새 창에서 열기"와 "시작 화면에 고정" 사이에는 파일 탐색기 세션이 "즐겨찾기에 고정 / 즐겨찾기에서 제거"를 더한다([[파일 탐색기 검수:14. 즐겨찾기]]).
  - 피그마: [[피그마 작업 검수:10. 바탕화면 피그마 작업]]
7. 보기 하위 메뉴의 아이콘과 단축키: |
  - 차이: Windows 보기 하위 메뉴는 줄마다 선택 표시(● ✓), 아이콘, 오른쪽 단축키가 있다. 구현은 글자만 있다. 탐색기 보기 하위 메뉴도 같다(`Ctrl+Shift+1~8`, 탐색기 영상에서 확인).
  - 원인: 피그마 `MenuItem`의 `Radio on/off`·`Toggle on/off` 변형에 아이콘·단축키 자리가 없고, 코드 타입(`MenuPopupRadioOption`, `MenuPopupCheckbox`)에도 없다. 단축키로 보기를 바꾸는 동작도 없다.
  - 정한 해결:
    - 피그마 `MenuItem`의 Radio·Toggle 변형에 아이콘·단축키 자리를 더하고, 바탕화면·탐색기 보기 하위 메뉴에 Windows 아이콘을 넣는다.
    - 바탕화면: 큰 `Ctrl+Shift+2`, 보통 `Ctrl+Shift+3`, 작은 `Ctrl+Shift+4`. 아이콘 자동 정렬에도 아이콘.
    - 탐색기: 큰 `Ctrl+Shift+2`, 보통 `Ctrl+Shift+3`, 자세히 `Ctrl+Shift+6`. 그 창에 포커스가 있을 때만 동작한다.
    - 단축키는 메뉴에 보이는 대로 실제로 동작하게 만든다. 모바일은 단축키 글자를 숨긴다(다른 메뉴의 단축키도 모바일에서 같은지 작업 때 확인).
  - 맡는 세션: `MenuItem`의 피그마와 디자인 시스템 코드는 피그마 세션이 한다([[피그마 작업 검수:8. MenuItem]]). 바탕화면 세션은 메뉴 항목 구성, 단축키 동작, 탐색기 보기 하위 메뉴까지 앱 코드를 맡는다. 탐색기 쪽 검수에 있던 같은 결정은 이 섹션으로 합쳤다.
  - 문서: [[항목 조작:단축키]]와 [[파일 탐색기]]에 보기 단축키를 더한다(허락받음).
8. 새로 만들기와 폴더 아이콘: |
  - 차이: Windows는 빈 곳 메뉴의 `새로 만들기`가 원 안 + 아이콘, 하위 메뉴 `폴더`가 노란 컬러 폴더다. 구현은 두 곳 모두 + 붙은 선 폴더(`folderAdd`)다.
  - 정한 해결: `새로 만들기`는 Fluent `ic_fluent_add_circle_20_regular`(자산에 없어 피그마 아이콘 자산에 더해 내보낸다), `폴더`는 이미 있는 컬러 자산 `images/file-folder`(`MenuItem`이 이미지 자산을 받는다).
  - 원 안 + 아이콘 자산은 이 섹션이 주인이다. 탐색기 명령 모음도 같은 자산을 쓴다([[파일 탐색기 검수:10. 명령 버튼 모양과 주소 줄 구분선]]).
  - 피그마: [[피그마 작업 검수:10. 바탕화면 피그마 작업]], [[피그마 작업 검수:13. 자산]]
9. 하위 메뉴 전환 지연: |
  - 차이: Windows는 열린 하위 메뉴가 있을 때 다른 항목에 약 400ms(기본 `MenuShowDelay`) 머물러야 바뀌고, 옛 하위 메뉴를 닫고 새 하위 메뉴를 여는 것이 한 번에 일어난다. 구현은 Base UI 기본값(여는 지연 100ms, 닫는 지연 0ms)이라 닿는 즉시 바뀐다.
  - 시험: `Menu.SubmenuTrigger`에 `delay={400} closeDelay={600}`을 넣어 보니 옛 하위 메뉴가 닫힌 뒤 새 지연을 세어, 약 300~400ms 동안 하위 메뉴가 없는 빈 구간이 생겼다. 속성 조합으로는 Windows처럼 한 번에 바뀌지 않는다. 시험한 변경은 되돌렸다.
  - 정한 해결: `MenuPopup`이 타이머 하나로 "400ms 머문 항목"을 고르고, 그 항목의 하위 메뉴만 열린 상태로 넘긴다(Base UI `SubmenuRoot`의 `open` 제어). 키보드(→, Enter)와 클릭으로 열 때는 바로 연다. 400ms는 Windows 기본값이라 모션 토큰이 아니라 코드 상수로 둔다.
  - 문서: 하위 메뉴는 400ms 머물면 바뀐다는 규칙을 메뉴 공통 규칙이 있는 문서에 더한다(허락받음, 자리는 작업 때 정한다).
10. 붙여넣기 표시: |
  - 차이: 구현은 붙여넣을 것이 없으면 흐린 `붙여넣기 Ctrl+V`를 목록에 보인다. Windows는 붙여넣을 것이 없으면 붙여넣기가 없다.
  - 녹화로 확인한 Windows 동작: 잘라낸 뒤 빈 곳을 우클릭하면 메뉴에 단추 줄이 생기고 `붙여넣기` 단추 하나만 있다(목록은 그대로). 마우스를 올리면 툴팁 `붙여넣기 (Ctrl+V)`. 탐색기 빈 곳 메뉴도 같고, 메뉴가 위로 열리면 단추 줄이 맨 아래로 간다.
  - 정한 해결: 붙여넣기를 5번의 단추 줄에 두고 붙여넣을 것이 있을 때만 보인다. 빈 곳 메뉴는 붙여넣을 것이 없으면 단추 줄 자체가 없다. 탐색기 빈 곳 메뉴도 함께 바꾼다.
  - 피그마: [[피그마 작업 검수:10. 바탕화면 피그마 작업]]
  - 문서: [[바탕화면 우클릭 메뉴:빈 곳]]과 [[파일 탐색기:우클릭 메뉴]]에 "붙여넣기는 붙여넣을 것이 있을 때만 단추 줄에 보인다"를 더한다(허락받음).
11. 실행 취소: |
  - 차이: Windows 빈 곳 메뉴에는 마지막 조작에 따라 `이동 취소`·`이름 바꾸기 취소`·`삭제 취소`(`Ctrl+Z`)가 있다. 문서에는 넣는다는 말도 뺀다는 말도 없었다.
  - 정한 해결: 넣지 않는다. 모든 조작의 기록과 되돌리기가 필요하지만 블로그 방문에 필요하지 않다.
  - 문서: [[바탕화면 우클릭 메뉴:빈 곳]]과 [[파일 탐색기:우클릭 메뉴]]의 두지 않는 항목에 실행 취소를 이유와 함께 더한다(허락받음).
12. 탐색기 항목의 포커스 테두리: |
  [[파일 탐색기 검수]]에서 옮겨 왔다.
  - 차이: Windows 탐색기는 마우스로 항목을 눌러도 그 항목에 1px 진한 테두리가 붙는다(아이콘·자세히 보기 모두). 구현은 `:focus-visible`에만 그려 키보드로 옮길 때만 보인다.
  - 바탕화면은 다르다: Windows 바탕화면 아이콘은 클릭 뒤 테두리가 없다(둘째 영상 17~22초를 4배 확대). 바탕화면은 지금 그대로 둔다. 나누는 기준은 기기가 아니라 바탕화면·탐색기(`FileItem`의 `surface`)이고, 모바일도 탐색기면 같다.
  - 테두리는 DOM 포커스가 아니라 "그 목록의 현재 항목"(`tabbableId`)에 늘 붙는다. 포커스가 목록을 떠나도 남는다(13번).
  - 정한 해결: `FileItem`(explorer)·`FileRow`에 현재 항목 여부(`isCurrent`)를 받아 1px 안쪽 선을 그린다. 색은 13번의 포커스 유무를 따른다.
  - 맡는 세션: `FileItem`의 컴포넌트 PR과 탐색기 목록에서 값을 넘기는 앱 코드는 바탕화면 세션이, `FileRow`의 피그마와 디자인 시스템 코드는 피그마 세션이 한다([[피그마 작업 검수:5. FileRow]]).
  - 피그마: [[피그마 작업 검수:10. 바탕화면 피그마 작업]]
  - 문서: [[컴포넌트 목록:상태]]의 Focused 정의(키보드 포커스)를 탐색기 항목에 한해 "현재 항목"으로 고치고, [[파일 탐색기:조작]]의 선택 설명에 더한다(논의에서 방향과 함께 동의받음).
13. 포커스가 없는 선택은 회색: |
  [[파일 탐색기 검수]]에서 옮겨 왔다.
  - 차이: Windows는 항목 영역에 포커스가 있을 때만 선택 바탕이 파랗다. 같은 창의 주소창·검색창으로 포커스가 가거나(첫 영상 64초), 다른 창이 앞에 오거나(둘째 영상 13초), 우클릭 메뉴가 열리면(첫 영상 4초) 회색 바탕 + 회색 테두리가 된다. 구현은 늘 파랗다.
  - 정한 해결: 항목이 이미 있는 목록 역할(`role="listbox"`)을 기준으로 `in-[[role=listbox]:focus-within]:`로 파랑, 그 밖에는 회색을 그린다. 목록에 클래스를 따로 걸지 않는다(`Figma` 스토리는 `className`을 쓰지 못해 클래스 이름표를 붙일 수 없기 때문이다). 창 활성 여부를 따로 알 필요가 없다.
  - 끄는 복제본은 예외다(3번).
  - 피그마: `FileItem`·`FileRow`에 "포커스 없는 선택" 상태를 더한다([[피그마 작업 검수:10. 바탕화면 피그마 작업]], [[피그마 작업 검수:5. FileRow]]). 회색 선택 바탕·테두리 색 변수는 토큰 PR로 들어온다([[피그마 작업 검수:4. 그 밖의 토큰]]).
  - 12번과 한 덩어리로 작업한다. 탐색 창의 같은 규칙은 [[파일 탐색기 검수:4. 탐색 창의 선택과 포커스]]에 있다.
작업 순서: |
  시작 전에 작업 범위를 끝까지 점검해 물을 것을 먼저 모은다.
  1. 바로 할 수 있는 것: 1·2·3·9번 코드, 7번의 단축키 동작, 문서 변경(허락받음).
  2. 토큰 PR(`feat/figma-tokens`) 뒤: 13번의 회색 선택 색.
  3. 컴포넌트·조립 PR 뒤: 5·8·10번(단추 줄 부품, `Menu`, 메뉴 조립), 7번의 메뉴 모양(`feat/figma-menu-item` 병합 확인 뒤), 12·13번(`FileItem` 컴포넌트 PR 처리, 자세히 보기 행은 `feat/figma-file-row` 병합 확인 뒤).
  4. 다른 영역 세션의 PR을 기다리는 것: 없다.
