  id: open-questions
  name: 미결 사항
  parent:
    - seojaewan 블로그
개요: |
  아직 정하지 않았거나 확인하지 못한 것을 모아 둔다. 정해지면 해당 문서에 반영하고 여기서 지운다.
  정했지만 이상적이지 않아 나중에 풀고 싶은 것은 [[한계]]에 둔다.
화면 단위 시각 검증: |
  03 · Screens의 화면(간격, 겹침, 모바일 배치)을 시각적으로 검증할지 정하지 않았다. 컴포넌트와 조립은 캡처 표로 확인한다([[피그마 연동:캡처 표]]).
  후보는 화면 단위 캡처 표, 코드 기준 회귀 테스트, 둘 다 두지 않기다. 화면을 구현하는 단계에서 조립 사이 배치 문제가 자주 생기는지 보고 정한다.
다크 모드(macOS UI): |
  다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다([[디자인 기반:모드]]).
  macOS UI를 같은 디자인 시스템 패키지에 둘지 따로 둘지, 토큰 구조와 피그마 파일을 어떻게 나눌지, 전환을 어떻게 보여 줄지는 그 작업을 시작할 때 정한다.
창 축소 화면: |
  작업 표시줄 창 미리보기와 Snap Assist의 축소 화면 안은 `Window/*` 조립 전체를 약 0.13배로 줄여 그렸다. 줄인 값(글자 1.6~3.8px, 0.5px 간격, 스타일 없는 효과)이 토큰에 연결되지 않아 `Taskbar/PreviewList`, `Taskbar/AppPreview`, `Window/SnapAssist` 조립이 구조 검사를 통과하지 못한다. 글자 스타일을 연결하면 원래 크기로 돌아가 축소 화면이 깨진다.
  축소 화면을 무엇으로 그릴지(창 모습을 줄인 그림 자산, 코드에서 CSS로 줄이기 등) 정한다.
조립의 연결 안 된 값: |
  아래 조립은 아직 구조 검사를 통과하지 못한다. 조립 PR을 내보내기 전에 고친다.

  | 조립 | 값 |
  |---|---|
  | `Chrome/Page`, `Window/Chrome` | 목차 간격 8, 목차 항목 높이 20, 본문 최대 너비 720 |
  | `Window/Explorer` | 경로 간격 4 |
  | `Start/Body` | BestMatchCard 동작 영역 간격 8, 너비 240 |
피그마 플러그인 고칠 것: |
  플러그인에서 찾은 문제다.

  - 큰 내보내기 거절: 컴포넌트를 한꺼번에 내보내면 GitHub API가 트리가 너무 크다며 422로 거절한다. 레이어 정보를 빼고도 남으면 커밋을 여러 번에 나눠 올린다.
  - 사용처 0 알림: 글자 일부 구간에만 입힌 글자 스타일을 사용처로 세지 않아, 쓰는 스타일을 안 쓴다고 알린다.
  - 바꿔 끼운 아이콘의 크기 연결: `Icon` 속성으로 바꿔 끼운 아이콘이 원본에서 물려받은 크기 변수 연결을 읽지 못하고 연결 안 된 고정 크기로 잘못 보는 경우가 있다([[한계:피그마 API 덮어쓰기 함정]]).
