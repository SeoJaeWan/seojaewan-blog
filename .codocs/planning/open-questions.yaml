  id: open-questions
  name: 미결 사항
  parent:
    - seojaewan 블로그
개요: |
  아직 정하지 않았거나 확인하지 못한 것을 모아 둔다. 정해지면 해당 문서에 반영하고 여기서 지운다.
  정했지만 이상적이지 않아 나중에 풀고 싶은 것은 [[한계]]에 둔다.
피그마 일치 검사 검증: |
  새 판정 방식([[피그마 일치 검사:비교 규칙]])이 실제로 동작하는지 확인한다.

  - 이긴 선언 읽기: CDP `CSS.getMatchedStylesForNode`로 이긴 선언의 변수 이름을 정확히 고를 수 있는지 Button으로 먼저 시험한다. Tailwind v4의 `@layer`, `:hover` 같은 상태 변형과 섞일 때도 맞아야 한다. 안 되면 "값 일치 + 요소의 클래스 목록에 토큰 이름 포함"으로 물러선다.
  - 틀린 버전: Button, MenuItem, Flyout, SearchBox에서 정상 버전은 모두 통과하고, 일부러 틀린 버전(여백 토큰, 이웃 상태의 색 토큰, 값이 같은 다른 토큰, 반경 토큰, 다른 아이콘, 그림자 스타일 없음, 글자 한 자 더, 다른 CSS가 덮어쓴 색, 숨겨야 할 레이어가 보임, 전환 시간 다름)은 모두 실패하는지 확인한다.
  - 자산 바이트 안정성: 같은 SVG 자산을 다시 내보내도 바이트가 같은지, 이미지 자산(`noise/Acrylic`)이 원본 바이트 경로로 내보내지는지 확인한다.

  모두 맞으면 이 항목을 지운다.
화면 단위 시각 검증: |
  컴포넌트를 조립한 화면(간격, 겹침, 모바일 배치)을 시각적으로 검증할지 정하지 않았다.
  후보는 화면 단위 피그마 일치 검사, 코드 기준 회귀 테스트, 둘 다 두지 않기다. 화면을 구현하는 단계에서 조립 문제가 자주 생기는지 보고 정한다.
다크 모드(macOS UI): |
  다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다([[디자인 기반:모드]]).
  macOS UI를 같은 디자인 시스템 패키지에 둘지 따로 둘지, 토큰 구조와 피그마 파일을 어떻게 나눌지, 전환을 어떻게 보여 줄지는 그 작업을 시작할 때 정한다.
