_codocs:
  id: open-questions
  name: 미결 사항
  parent:
    - seojaewan 블로그
개요: |
  아직 정하지 않았거나 확인하지 못한 것을 모아 둔다. 정해지면 해당 문서에 반영하고 여기서 지운다.
피그마 일치 허용 오차: |
  피그마와 브라우저는 렌더링 엔진이 달라 픽셀이 완전히 같을 수 없다. 엔진 차이는 통과하면서 실제 문제(패딩 1px, 색 토큰 오류, 모서리 반경 차이)는 잡는 허용 오차가 있는지 확인하지 못했다.

  [[구현 순서:6단계 디자인 시스템 코드화]]를 시작할 때 검증한다. 피그마 플러그인으로 내보낸 컴포넌트 몇 개와 같은 컴포넌트의 Storybook 스크린샷을 CI에서 비교하고, 일부러 틀린 버전(패딩, 색, 반경)도 함께 비교한다.
  픽셀만 비교하는 방식과, 픽셀에 색 차이(ΔE)·스타일 속성 비교를 더한 방식을 함께 시험한다. 정상 버전은 통과하고 틀린 버전은 모두 실패하는 기준이 있으면 [[피그마 일치 검사]]에 반영한다. 없으면 비교 방식을 다시 정한다.
화면 단위 시각 검증: |
  컴포넌트를 조립한 화면(간격, 겹침, 모바일 배치)을 시각적으로 검증할지 정하지 않았다.
  후보는 화면 단위 피그마 일치 검사, 코드 기준 회귀 테스트, 둘 다 두지 않기다. 화면을 구현하는 단계에서 조립 문제가 자주 생기는지 보고 정한다.
