  name: 미결 사항
  parent:
    - seojaewan 블로그
개요: |
  아직 정하지 않았거나 확인하지 못한 것을 모아 둔다. 정해지면 해당 문서에 반영하고 여기서 지운다.
  정했지만 이상적이지 않아 나중에 풀고 싶은 것은 [[한계]]에 둔다.
화면 단위 시각 검증: |
  04 · Screens의 화면(간격, 겹침, 모바일 배치)을 시각적으로 검증할지 정하지 않았다. 컴포넌트와 조립은 캡처 표로 피그마 그림과 비교한다(조립은 참고용, [[피그마 연동:캡처 표]]).
  후보는 화면 단위 캡처 표, 코드 기준 회귀 테스트, 둘 다 두지 않기다. 화면을 구현하는 단계에서 조립 사이 배치 문제가 자주 생기는지 보고 정한다.
다크 모드(macOS UI): |
  다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다([[디자인 기반:모드]]).
  macOS UI를 같은 디자인 시스템 패키지에 둘지 따로 둘지, 토큰 구조와 피그마 파일을 어떻게 나눌지, 전환을 어떻게 보여 줄지는 그 작업을 시작할 때 정한다.
피그마 캡처 표의 쓸모: |
  2026-11-10부터 `figma-parity.yml`을 GitHub에서 비활성화했다(`gh workflow disable`, 파일은 그대로). [[피그마 연동:CI]]와 [[피그마 연동:캡처 표]]에 적힌 PR 댓글 캡처 표는 지금 만들어지지 않는다.
  - 비활성화한 이유: 캡처 표는 사람이 병합 전에 컴포넌트 모습이 피그마와 같은지 보는 자료인데, 실제로 사람이 거의 보지 않았다. 피그마와의 비교는 피그마 PR 스킬 안에서 에이전트가 로컬 캡처(`pnpm --filter @seojaewan/figma-parity capture`)로 하고 있었다. 또 실행마다 같은 그림을 아티팩트로 올려 GitHub Actions 저장 한도가 찼고(남은 343개 2.8GB 중 65%가 버전 PR의 전체 캡처, 버전만 바뀐 `package.json`도 전체 범위로 봄), 업로드가 실패하면 캡처 실패 판정 단계까지 건너뛰었다.
  - 정할 것: 피그마와의 비교를 어디서 할지(작업 흐름 안 로컬 캡처로 옮기기, 기계 판정, 지금 구조를 고쳐 다시 켜기), 코드만 바꾼 PR의 회귀를 누가 볼지, 정한 뒤 [[피그마 연동]]의 CI·캡처 표 섹션과 `figma-component-pr` 스킬, `parity-report-cleanup.yml`을 맞추기.
