  id: open-questions
  name: 미결 사항
  parent:
    - seojaewan 블로그
개요: |
  아직 정하지 않았거나 확인하지 못한 것을 모아 둔다. 정해지면 해당 문서에 반영하고 여기서 지운다.
피그마 일치 검사 검증: |
  픽셀 허용 오차를 찾던 질문은 비교 방식을 바꿔 닫았다. 피그마와 브라우저를 그림으로 비교하면 정상과 실수를 가르는 허용 오차를 찾을 수 없었고, 지금은 같은 이름을 썼는지와 브라우저 계산값으로 비교해 허용 오차가 없다([[피그마 일치 검사]]).

  남은 것은 새 방식이 실제로 틀린 버전을 모두 잡는지 확인하는 일이다. Button, MenuItem, Flyout, SearchBox를 새 플러그인으로 다시 내보내 정상 버전이 모두 통과하는지 보고, 일부러 틀린 버전(여백 토큰, 이웃 상태의 색 토큰, 반경 토큰, 다른 아이콘, 그림자 스타일 없음, 글자 한 자 더, 다른 CSS가 덮어쓴 색, 숨겨야 할 레이어가 보임)이 모두 실패하는지 확인한다.
  모두 맞으면 이 항목을 지운다. 잡지 못하는 경우가 있으면 [[피그마 일치 검사:비교 규칙]]에 규칙을 더한다.
화면 단위 시각 검증: |
  컴포넌트를 조립한 화면(간격, 겹침, 모바일 배치)을 시각적으로 검증할지 정하지 않았다.
  후보는 화면 단위 피그마 일치 검사, 코드 기준 회귀 테스트, 둘 다 두지 않기다. 화면을 구현하는 단계에서 조립 문제가 자주 생기는지 보고 정한다.
다크 모드(macOS UI): |
  다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다([[디자인 기반:모드]]).
  macOS UI를 같은 디자인 시스템 패키지에 둘지 따로 둘지, 토큰 구조와 피그마 파일을 어떻게 나눌지, 전환을 어떻게 보여 줄지는 그 작업을 시작할 때 정한다.
