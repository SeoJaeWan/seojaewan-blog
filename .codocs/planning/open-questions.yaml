  id: open-questions
  name: 미결 사항
  parent:
    - seojaewan 블로그
개요: |
  아직 정하지 않았거나 확인하지 못한 것을 모아 둔다. 정해지면 해당 문서에 반영하고 여기서 지운다.
  정했지만 이상적이지 않아 나중에 풀고 싶은 것은 [[한계]]에 둔다.
피그마 일치 검사 검증: |
  픽셀 허용 오차를 찾던 질문은 비교 방식을 바꿔 닫았다. 피그마와 브라우저를 그림으로 비교하면 정상과 실수를 가르는 허용 오차를 찾을 수 없었고, 지금은 같은 이름을 썼는지와 브라우저 계산값으로 비교해 허용 오차가 없다([[피그마 일치 검사]]).

  남은 것은 새 방식이 실제로 틀린 버전을 모두 잡는지 확인하는 일이다. Button, MenuItem, Flyout, SearchBox를 새 플러그인으로 다시 내보내 정상 버전이 모두 통과하는지 보고, 일부러 틀린 버전(여백 토큰, 이웃 상태의 색 토큰, 반경 토큰, 다른 아이콘, 그림자 스타일 없음, 글자 한 자 더, 다른 CSS가 덮어쓴 색, 숨겨야 할 레이어가 보임)이 모두 실패하는지 확인한다.
  모두 맞으면 이 항목을 지운다. 잡지 못하는 경우가 있으면 [[피그마 일치 검사:비교 규칙]]에 규칙을 더한다.
화면 단위 시각 검증: |
  컴포넌트를 조립한 화면(간격, 겹침, 모바일 배치)을 시각적으로 검증할지 정하지 않았다.
  후보는 화면 단위 피그마 일치 검사, 코드 기준 회귀 테스트, 둘 다 두지 않기다. 화면을 구현하는 단계에서 조립 문제가 자주 생기는지 보고 정한다.
다크 모드(macOS UI): |
  다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다([[디자인 기반:모드]]).
  macOS UI를 같은 디자인 시스템 패키지에 둘지 따로 둘지, 토큰 구조와 피그마 파일을 어떻게 나눌지, 전환을 어떻게 보여 줄지는 그 작업을 시작할 때 정한다.
피그마 일치 검사 규칙 분류 점검: |
  피그마 구조를 정리하면서 플러그인 검사와 비교 규칙이 늘었고, 규칙이 주관적이거나 이 프로젝트에만 맞는 것이 되어 가는지 점검해야 한다.

  할 일: 플러그인 구조 검사와 비교 도구의 규칙을 모두 나열하고 셋으로 나눈다.
  1. 피그마 ↔ 웹 대응: 피그마 표현을 CSS로 옮기는 데 꼭 필요한 규칙(예: 자동 배치 → flex, 변수 → 토큰 클래스)
  2. 디자인 시스템 컨벤션: 우리가 정한 작성 규칙(예: 크기 변수 이름, 자리 이름, 숨김 레이어 원칙)
  3. 피그마 API 한계·버그를 피하는 규칙(예: 숨긴 노드의 크기 방식, 바꿔 끼운 아이콘의 크기 연결)

  3번은 줄일 수 있는 만큼 줄이고, 2번은 문서 근거가 있는지 확인한다. 묶음 코드 작업([[구현 순서:6단계 디자인 시스템 코드화]]) 전에 한다.
피그마 구조 정리 남은 결정: |
  피그마 컴포넌트 분해와 위반 정리 중 나온 질문 가운데 아직 정하지 않은 것이다.

  | 항목 | 질문 |
  |---|---|
  | 스냅된 창 | 스냅된 창은 모서리가 각지고 창 버튼은 최대화 모양이다([[창 동작:스냅]]). 지금은 WindowFrame `Maximized=True`에 안쪽 CaptionButtonGroup만 `Maximized=False`로 맞췄다. WindowFrame에 `Snapped` 상태를 둘지 |
  | TaskbarPreviewList 패널 | 패널 바탕(Acrylic Base, 여백 4, 가로)이 Flyout(Acrylic Default, 여백 16, 세로)과 달라 Flyout을 쓰지 못했다. Flyout에 바탕 변형을 더할지, 표면 전용 컴포넌트를 둘지, 그대로 둘지 |
  | ChromePage 검색 결과 제목 | 제목이 Subtitle 크기라 SectionTitle을 쓰지 못했다. SectionTitle(또는 SectionHeader)에 크기 변형을 둘지 |
  | 검색 결과 없음 | SearchResults의 가운데 글자 하나를 EmptyState로 바꿀지(아이콘·제목·코드 숨김과 가운데 정렬이 필요하다) |
  | PostNavCard 좁은 화면 | 좁은 화면의 다음 글은 왼쪽 정렬이라 지금 인스턴스에서 정렬을 덮어쓴다. 정렬 변형이나 속성을 둘지 |
  | ListGroup 간격 | 주소창 추천(`spacing/0`)과 Chrome 검색 결과(`spacing/8`)가 기본 `spacing/2`를 덮어쓴다. 간격 변형이나 속성을 둘지 |
  | AddressBar hover 칠 | `State=Hover`에 칠 두 겹(주소창 칠 + 반투명 subtle 칠)이 스타일 없이 있다. 칠 스타일을 만들지, 겹침을 레이어로 나눌지, 단색 변수 하나로 합칠지. 이것이 남은 마지막 구조 위반이라 AddressBar는 아직 내보내지 못한다 |
  | `app-chrome.svg`의 `<pattern>` | Chrome 앱 아이콘을 내보낸 SVG에 `<pattern>` 요소가 들어 있다. 이 자산을 어떻게 내보내고 코드에서 쓸지 |
  | PinnedTile 너비 | 너비 변수가 95(Start 데스크톱), 89(모바일), 96(원본, Chrome 새 탭) 셋이다. 95와 96을 하나로 맞출지 |
  | FileItem 위치·날짜 너비 | `location-width`와 `date-width`가 모두 180이다. 뜻이 달라 따로 두었는데 합칠지 |
  | BreadcrumbItem 구분자 기본값 | `Show separator` 기본값이 true라 `Current=True` 변형에도 구분자가 보인다. 기본값을 false로 하고 앞 항목에서 켤지, 코드처럼 마지막 항목만 끌지. Breadcrumb `Show second crumb`·`Show third crumb` 대신 슬롯이나 목록으로 둘지 |
  | TaskbarPreview 닫기 | 닫기 버튼을 `State=Hover` 변형에만 두었다. `Show close` BOOLEAN으로 바꿀지 |
  | 고정 높이 | 탭 줄(41), 주소창 줄(36), 도구 모음(46)은 HUG로 바꾸면 모양이 바뀌어 고정 + 크기 변수로 두었다. 높이를 줄여도 되면 HUG로 바꿀지 |
피그마 플러그인 고칠 것: |
  피그마 구조 정리 중 플러그인에서 찾은 문제다.

  - 큰 내보내기 거절: 컴포넌트를 한꺼번에 내보내면 GitHub API가 트리가 너무 크다며 422로 거절한다. 커밋을 여러 번에 나눠 올린다.
  - 사용처 0 알림: 글자 일부 구간에만 입힌 글자 스타일을 사용처로 세지 않아, 쓰는 스타일을 안 쓴다고 알린다.
  - 바꿔 끼운 아이콘의 크기 연결: 원본에서 물려받은 크기 변수 연결을 읽지 못하고 연결 안 된 고정 크기로 잘못 보는 경우가 있다([[한계:피그마 API 덮어쓰기 함정]]).
