  name: 미결 사항
  parent:
    - seojaewan 블로그
개요: |
  아직 정하지 않았거나 확인하지 못한 것을 모아 둔다. 정해지면 해당 문서에 반영하고 여기서 지운다.
  정했지만 이상적이지 않아 나중에 풀고 싶은 것은 [[한계]]에 둔다.
화면 단위 시각 검증: |
  03 · Screens의 화면(간격, 겹침, 모바일 배치)을 시각적으로 검증할지 정하지 않았다. 컴포넌트와 조립은 캡처 표로 확인한다([[피그마 연동:캡처 표]]).
  후보는 화면 단위 캡처 표, 코드 기준 회귀 테스트, 둘 다 두지 않기다. 화면을 구현하는 단계에서 조립 사이 배치 문제가 자주 생기는지 보고 정한다.
다크 모드(macOS UI): |
  다크 모드는 Windows의 다크 테마가 아니라 macOS UI로 전환하는 별도 화면으로 제공할 계획이다([[디자인 기반:모드]]).
  macOS UI를 같은 디자인 시스템 패키지에 둘지 따로 둘지, 토큰 구조와 피그마 파일을 어떻게 나눌지, 전환을 어떻게 보여 줄지는 그 작업을 시작할 때 정한다.
토큰 이름과 Tailwind 이름공간: |
  토큰 CSS 이름은 피그마 경로를 그대로 잇는다([[피그마 연동:토큰 생성]]). 경로의 첫 마디가 Tailwind 테마 이름공간과 겹치면(예: `text-fill/*` → `--text-*`는 글자 크기 이름공간, `font/size/*` → `--font-*`는 서체 이름공간) Tailwind가 그 변수로 뜻이 다른 유틸리티(`text-fill-primary`가 글자 크기)를 함께 만든다. 이런 클래스는 lint가 아는 클래스로 보아 막지 못한다.

  토큰 변환 스크립트를 만들 때 Tailwind 공식 문서와 시험으로 실제 동작을 확인하고, 막는 방법(겹치는 묶음의 변수를 `@theme` 밖에 두기, lint 규칙 더하기 등)을 정한다. `@utility`로 만든 클래스를 lint가 인식하는지도 같은 때 확인한다([[피그마 연동:토큰 사용 강제]]).
피그마 구조 정리 남은 결정: |
  피그마 컴포넌트를 정리하면서 나온 질문 가운데 아직 정하지 않은 것이다.

  | 항목 | 질문 |
  |---|---|
  | 스냅된 창 | 스냅된 창은 모서리가 각지고 그림자가 없으며 창 버튼은 최대화 모양이다([[창 동작:스냅]]). WindowFrame에 `Snapped` 상태를 둘지, 조립(`Window/*`)에서 안쪽 값을 바꿀지 |
  | PostNavCard 좁은 화면 | 좁은 화면의 다음 글은 왼쪽 정렬이라 지금 인스턴스에서 정렬을 덮어쓴다. 정렬 변형이나 속성을 둘지 |
  | ListGroup 간격 | 주소창 추천(`spacing/0`)과 Chrome 검색 결과(`spacing/8`)가 기본 `spacing/2`를 덮어쓴다. 간격 변형이나 속성을 둘지 |
  | AddressBar hover 칠 | `State=Hover`에 칠 두 겹(주소창 칠 + 반투명 subtle 칠)이 스타일 없이 있다. 칠 스타일을 만들지, 겹침을 레이어로 나눌지, 단색 변수 하나로 합칠지. 이것이 남은 마지막 구조 위반이라 AddressBar는 아직 내보내지 못한다 |
  | `app-chrome.svg`의 `<pattern>` | Chrome 앱 아이콘을 내보낸 SVG에 `<pattern>` 요소가 들어 있다. 이 자산을 어떻게 내보내고 코드에서 쓸지 |
  | PinnedTile 너비 | 너비가 95(Start 데스크톱), 89(모바일), 96(Chrome 새 탭) 셋이다. 95와 96을 하나로 맞출지 |
  | BreadcrumbItem 구분자 기본값 | `Show separator` 기본값이 true라 마지막 칸에도 구분자가 보인다. 기본값을 false로 하고 앞 칸에서 켤지, 코드처럼 마지막 칸만 끌지 |
  | WindowPreview 닫기 | 닫기 버튼을 `State=Hover` 변형에만 두었다. `Show close` 불리언으로 바꿀지 |
  | 고정 높이 | 탭 줄(41), 주소창 줄(36), 도구 모음(46)은 HUG로 바꾸면 모양이 바뀌어 고정 + 크기 변수로 두었다. 높이를 줄여도 되면 HUG로 바꿀지 |
피그마 플러그인 고칠 것: |
  플러그인에서 찾은 문제다.

  - 큰 내보내기 거절: 컴포넌트를 한꺼번에 내보내면 GitHub API가 트리가 너무 크다며 422로 거절한다. 레이어 정보를 빼고도 남으면 커밋을 여러 번에 나눠 올린다.
  - 사용처 0 알림: 글자 일부 구간에만 입힌 글자 스타일을 사용처로 세지 않아, 쓰는 스타일을 안 쓴다고 알린다.
  - 바꿔 끼운 아이콘의 크기 연결: `Icon` 속성으로 바꿔 끼운 아이콘이 원본에서 물려받은 크기 변수 연결을 읽지 못하고 연결 안 된 고정 크기로 잘못 보는 경우가 있다([[한계:피그마 API 덮어쓰기 함정]]).
