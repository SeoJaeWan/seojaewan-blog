_codocs:
  id: file-explorer-review
  name: 파일 탐색기 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10에 구현한 파일 탐색기를 실제 Windows 11 파일 탐색기와 비교해 찾은 차이와, 사람과 논의해 정한 해결이다.
  파일 탐색기 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 지우고, 마지막 PR에서 이 문서를 지운다. 피그마 작업은 피그마 세션이 한다([[피그마 작업 검수:12. 파일 탐색기 피그마 작업]]).
  옮긴 항목: 탐색기 항목의 포커스 테두리와 회색 선택(옛 1·2번)은 [[바탕화면 검수:12. 탐색기 항목의 포커스 테두리]], [[바탕화면 검수:13. 포커스가 없는 선택은 회색]]으로, 자세히 보기 행 높이와 열 너비(옛 5·6번)는 [[피그마 작업 검수:5. FileRow]]로, 우클릭 메뉴 모양(옛 12번)은 같은 결정인 [[바탕화면 검수:5. 아이콘 메뉴의 단추 줄]], [[바탕화면 검수:7. 보기 하위 메뉴의 아이콘과 단축키]], [[바탕화면 검수:10. 붙여넣기 표시]]로, 제목 표시줄 재질과 창 열기 애니메이션(옛 13번의 일부)은 [[피그마 작업 검수:1. 재질 값]], [[피그마 작업 검수:2. 창 열기 애니메이션]]으로 옮겼다. 14번은 [[작업 표시줄 검수]]에서 옮겨 왔다.
  아직 코드·문서·피그마는 아무것도 바꾸지 않았다. 항목마다 적은 문서 변경은 논의에서 방향과 함께 동의받았다.
세션 사이 약속: |
  공통 약속은 [[피그마 작업 검수:세션 사이 약속]]을 따른다. 이 문서에만 해당하는 것은 다음이다.
  - 맡은 컴포넌트 PR: `ColumnHeader`(`feat/figma-column-header`), `Breadcrumb`(`feat/figma-breadcrumb`), `BreadcrumbItem`(`feat/figma-breadcrumb-item`), `ExplorerCommandBar`(`feat/figma-explorer-command-bar`), `ExplorerAddressRow`(`feat/figma-explorer-address-row`), `ExplorerStatusBar`(`feat/figma-explorer-status-bar`), `ExplorerTab`(`feat/figma-explorer-tab`), `NavigationPane`(`feat/figma-navigation-pane`). 조립 PR은 `feat/figma-patterns-explorer`다.
  - 기다릴 PR: 피그마 세션의 `feat/figma-navigation-item`(4·14번), `feat/figma-file-row`(5번), `feat/figma-icon-button`(8·11번).
  - 먼저 병합해 줄 PR: `feat/explorer-favorites-store`(14번의 목록과 저장). 작업 표시줄 세션이 기다린다([[작업 표시줄 검수:9. 탐색기 점프 목록]]). 맨 먼저 한다.
  - 같은 파일을 고치는 다른 세션: 탐색기 목록 코드(`explorer-body`)는 바탕화면 세션도 고친다([[바탕화면 검수:12. 탐색기 항목의 포커스 테두리]]). 항목 메뉴(`getItemMenuEntries`)는 바탕화면 세션이 단추 줄로 바꾼다([[바탕화면 검수:5. 아이콘 메뉴의 단추 줄]]).
비교 방법: |
  - 실제 화면: 사람이 녹화한 영상 네 개.
    - 첫 영상(96초): 아이콘·자세히 보기, 항목·빈 곳 우클릭 메뉴와 보기·정렬 하위 메뉴, 주소창 편집, 경로 꺾쇠 목록, 위로, 탭 추가·끌기·닫기, 최대화·이전 크기
    - 둘째 영상(24초): 바탕화면 아이콘 선택과 비활성 창
    - 셋째 영상(23초): 뒤로·앞으로를 오갈 때의 선택
    - 넷째 영상(10초): 주소창 `×` 버튼
  - 영상에서 0.5~1초 간격으로 프레임을 뽑아 1:1과 4배로 확대해 봤다. 색은 프레임에서 픽셀을 샘플링했다.
  - 구현: Storybook `Features/Shell/Shell`(1920×1080)에서 Blog 폴더를 열고 영상과 같은 조작을 Playwright로 재현해 캡처했다.
  - 실제의 홈·갤러리·내 PC·세부 정보·복사·공유, 새 탭이 `홈`으로 열리는 것, 탭을 창 밖으로 끌어내는 것, 보기 다섯 가지는 [[파일 탐색기]]에서 두지 않기로 해 차이로 세지 않았다.
3. 위로·뒤로·앞으로 이동 뒤의 선택: |
  - 차이(셋째 영상, 첫 영상 66초):
    - 위로: 방금 있던 폴더가 선택되고 현재 항목이 된 채로 상위 폴더를 보인다.
    - 뒤로·앞으로: 그 기록 칸을 떠날 때의 선택을 그대로 되살린다(뒤로 간 곳에서 고른 `Claude Setup.exe`, 앞으로 간 곳에서 고른 `README.md`가 다시 선택됨). 방금 있던 폴더를 고르는 것이 아니다.
    - 새로 이동(더블클릭·주소창·탐색 창): 선택 없음. 구현과 같다.
  - 구현: 어떤 이동이든 선택이 빈다.
  - 원인: 선택은 `explorer-body`만 들고 있고, `goUp`·뒤로·앞으로는 위치만 바꾼다.
  - 정한 해결: 탭 기록 칸에 `selection?: { ids, focusId }`를 둔다. 위치를 떠날 때 지금 선택을 현재 칸에 적고, 뒤로·앞으로로 돌아오면 꺼내 쓴다. `goUp`은 새 칸의 첫 선택을 `[방금 있던 폴더]`로 넣는다. `explorer-body`는 위치가 바뀔 때 그 값으로 선택과 현재 항목을 채운다.
  - 문서: [[파일 탐색기:탭]]의 뒤로·앞으로 기록 설명에 위 세 규칙을 더한다.
4. 탐색 창의 선택과 포커스: |
  - 차이: Windows 탐색 창도 탐색기 항목([[바탕화면 검수:12. 탐색기 항목의 포커스 테두리]], [[바탕화면 검수:13. 포커스가 없는 선택은 회색]])과 같다. 트리에 포커스가 있으면 선택 칸이 파랑 + 1px 진한 테두리, 없으면 회색 + 회색 테두리다(첫 영상 58·63초). 구현은 선택 칸이 늘 회색이고, 키보드로 움직이면 브라우저 기본 외곽선(2px 검은 둥근 선)이 나온다(`NavigationItem`에 포커스 스타일이 없음).
  - 정한 해결: 칸이 이미 있는 트리 역할(`role="tree"`)을 기준으로 `in-\[[role=tree]:focus-within]:`로 파랑·회색을 고르고 현재 칸에 1px 선을 그린다. 트리에 클래스를 따로 걸지 않는다([[바탕화면 검수:13. 포커스가 없는 선택은 회색]]과 같은 방식). 브라우저 기본 외곽선은 지운다.
  - 맡는 세션: `NavigationItem`의 피그마와 디자인 시스템 코드(같은 상태 더하기)는 피그마 세션이 한다([[피그마 작업 검수:7. NavigationItem]]). 색 변수는 [[피그마 작업 검수:4. 그 밖의 토큰]]의 것을 함께 쓴다. 파일 탐색기 세션은 현재 칸(`isCurrent`)을 넘기는 탐색 창 코드를 맡는다.
5. 자세히 보기 행의 빈 오른쪽: |
  행 높이(28px)와 선택 범위(마지막 열 끝까지), 열 값과 열 제목의 어긋남은 [[피그마 작업 검수:5. FileRow]]로 옮겼다. 피그마 세션이 한다.
  - 확인할 것: 행의 빈 오른쪽(마지막 열 밖)을 눌렀을 때 Windows가 빈 곳 누르기(선택 해제·끄는 사각형)로 다루는지는 영상으로 확인하지 못했다. 작업 때 녹화로 확인한다. `feat/figma-file-row`가 병합된 뒤 파일 탐색기 세션이 확인하고 동작을 맞춘다.
7. 정렬 화살표 위치: |
  - 차이: Windows는 정렬한 열 칸의 위쪽 끝 가운데에 작은 `^`가 겹쳐 있고 글자 자리는 그대로다. 구현은 글자 줄 오른쪽 끝에 있어 정렬한 열만 글자 자리가 16px 줄어든다.
  - 정한 해결: 화살표를 칸 위쪽 가운데에 절대 위치로 겹쳐 그린다. 내림차순은 지금처럼 뒤집은 모양이다.
  - 피그마: [[피그마 작업 검수:12. 파일 탐색기 피그마 작업]]
8. 주소창 편집 모양과 글자 크기: |
  - 차이(첫 영상 21·64초, 넷째 영상):
    - 편집 모드에 아이콘이 없다. 구현은 폴더 아이콘이 남는다.
    - 입력이 있을 때만 오른쪽에 `×`가 있고, 누르면 입력을 비우고 커서는 입력칸에 남는다. 비면 `×`가 사라진다. 밖을 누르면 경로 마디로 돌아간다. 구현에는 `×`가 없다.
    - 경로 마디와 입력칸 글자가 약 14px이다(`바탕 화면` 폭 61px). 구현은 `type-caption`(약 12px, 48px)이다.
  - 정한 해결: 편집 모드에서 아이콘을 숨기고, 입력이 있을 때만 `×`(`IconButton`, 이름 `지우기`)를 보인다. 경로 마디와 입력칸을 `type-body`로 바꾼다.
  - 고칠 컴포넌트: 탐색기 주소 줄은 `ExplorerAddressRow` 안의 `Breadcrumb`(`State=Editing`이 입력칸)와 `BreadcrumbItem`(경로 마디)이다. 처음 검수에는 `AddressBar`라고 적었지만 `AddressBar`는 Chrome 주소창 컴포넌트다. `×` 버튼의 `IconButton`은 피그마 세션이 맡는다([[피그마 작업 검수:6. IconButton]]).
  - 피그마: [[피그마 작업 검수:12. 파일 탐색기 피그마 작업]]
9. 경로 꺾쇠 목록: |
  - 차이: Windows 경로 마디 사이의 `>`는 버튼이고, 누르면 `⌄`로 바뀌며 왼쪽 마디 폴더의 하위 폴더 목록을 펼친다(첫 영상 24초). 하위 폴더가 있으면 마지막 마디 뒤에도 `>`가 붙는다(58초). 구현의 `>`는 장식이다.
  - 정한 해결:
    - 각 `>`를 `MenuButton`으로 바꿔, 왼쪽 마디의 하위 폴더를 그 위치에 기억한 정렬로 `MenuPopup`에 보인다. 고르면 같은 탭에서 이동하고 기록에 남긴다. 열린 동안 꺾쇠는 `⌄`다.
    - 마지막 마디 뒤 `>`는 하위 폴더가 있을 때만 그린다.
    - 맨 앞 아이콘 뒤 `>`는 탐색 창의 최상위 칸(바탕 화면·휴지통)을 보인다. 우리 구조에 맞춰 정한 동작이다.
    - 모바일은 경로를 한 칸으로만 보이므로([[파일 탐색기:모바일]]) 넣지 않는다.
  - 문서: [[파일 탐색기:구성]]이나 [[파일 탐색기:주소창 편집]]에 규칙을 더한다.
10. 명령 버튼 모양과 주소 줄 구분선: |
  - 차이: Windows는 `정렬 ⌄`·`보기 ⌄`처럼 메뉴를 여는 버튼에 꺾쇠가 있고, `새로 만들기`는 원 안 `+` 아이콘이다. 주소 줄과 명령 모음 사이에 1px 구분선이 있다. 구현은 꺾쇠가 없고 `+`이며 구분선이 없다.
  - 정한 해결:
    - `정렬`·`보기`를 `DropDownButton`으로 바꿔 꺾쇠를 붙인다.
    - `새로 만들기`는 아이콘만 원 안 `+`(`ic_fluent_add_circle_20_regular`)로 바꾸고, 꺾쇠와 메뉴는 두지 않는다. 만들 것이 폴더뿐이라 [[파일 탐색기:조작]]의 바로 만들기를 유지한다.
    - 주소 줄 아래에 1px 구분선을 그린다.
  - 원 안 `+` 아이콘 자산은 [[바탕화면 검수:8. 새로 만들기와 폴더 아이콘]]이 주인이다. 여기서는 쓰기만 한다.
  - 피그마: [[피그마 작업 검수:12. 파일 탐색기 피그마 작업]]
11. 상태 표시줄: |
  - 차이: Windows는 `2개 항목`이라 옆의 `1개 항목 선택함`과 어순이 같다. 지금 보기인 버튼에 바탕·테두리가 있고, 아이콘은 `자세히`가 가로줄, `큰 아이콘`이 네모 하나다. 구현은 `항목 N개`(`explorer-body.tsx`), 켜짐 표시 없음, 글머리 목록과 4칸 격자 아이콘이다.
  - 정한 해결: `N개 항목`으로 바꾸고, `ExplorerStatusBar`가 지금 보기를 받아 해당 버튼을 켜짐으로 그린다. 보통 아이콘 보기면 둘 다 꺼짐이다. 아이콘은 가로줄·네모로 바꾼다(Fluent 후보 `text_align_justify`, `square`, 자산 유무는 작업 때 확인).
  - 맡는 세션: `IconButton`의 켜짐 상태(없으면 더한다)는 피그마 세션이 맡는다([[피그마 작업 검수:6. IconButton]]).
  - 피그마: [[피그마 작업 검수:12. 파일 탐색기 피그마 작업]], [[피그마 작업 검수:13. 자산]]
  - 문서: [[파일 탐색기:구성]]의 상태 표시줄에 `N개 항목` 표기를 적는다.
13. 고른 탭과 바탕 화면 아이콘: |
  제목 표시줄 재질 값과 창 열기 애니메이션은 [[피그마 작업 검수:1. 재질 값]], [[피그마 작업 검수:2. 창 열기 애니메이션]]으로 옮겼다. 남은 것은 둘이다.
  - 고른 탭: Windows의 고른 탭은 불투명(`rgb(243,243,243)`)이다(첫 영상 58초 샘플링). 고른 탭(`ExplorerTab` 선택, 지금 `bg-color-white-70`)을 불투명으로 바꾼다.
  - 아이콘 차이: Windows는 탭·경로·탐색 창 모두 같은 바탕 화면 아이콘이다. 구현은 탐색 창만 모니터 선 아이콘이고 탭·경로는 폴더 아이콘이다. 위치 아이콘을 고르는 함수 하나를 두고 세 곳이 함께 쓴다(바탕 화면·휴지통·폴더).
  - 피그마: [[피그마 작업 검수:12. 파일 탐색기 피그마 작업]]
14. 즐겨찾기: |
  [[작업 표시줄 검수]]에서 옮겨 왔다. 실제 탐색기 탐색 창의 "즐겨찾기"는 작업 표시줄 탐색기 버튼의 "고정됨" 점프 목록과 같은 목록이다. 우리도 같은 구성으로 새로 만든다. 점프 목록은 [[작업 표시줄 검수:9. 탐색기 점프 목록]]에 있고 작업 표시줄 세션이 만든다. 영상은 [[작업 표시줄 검수:비교 방법]]의 ②·③이다.
  - 목록과 저장: 처음 항목은 Project, Blog, About 묶음 폴더(`project`, `blog`, `about`) 순서다. 항목은 고유 ID로 따라가 이름을 바꾸면 바뀐 이름으로 보이고 다른 곳으로 옮겨도 남는다. 휴지통에 있는 폴더는 숨기고 복원하면 다시 보인다. 방문자가 고정·제거·순서 바꾸기를 할 수 있고 방문자 저장소에 남긴다(Start 고정과 같다). 폴더만 고정할 수 있다.
  - 순서: "목록과 저장"(화면 없는 코드)만 브랜치 `feat/explorer-favorites-store`의 첫 PR로 맨 먼저 병합한다. 작업 표시줄 세션이 이 PR을 기다린다. 아래 나머지는 그 뒤에 한다.
  - 탐색 창: 맨 위에 즐겨찾기 항목(오른쪽 압정 아이콘이 늘 보임), 구분선, 지금의 바탕화면 트리와 휴지통 순서다. 즐겨찾기가 비면 칸과 구분선을 숨긴다. 즐겨찾기 항목을 누르면 그 폴더로 가고 선택된 칸으로 보인다. 압정 아이콘이 붙는 `NavigationItem`은 피그마 세션이 맡는다([[피그마 작업 검수:7. NavigationItem]]).
  - 즐겨찾기로 끌기: 모양은 [[항목 조작:끌기]]와 같다(반투명 복제본, 4px 넘게 움직이면 시작). 항목 사이에 놓을 자리에는 가로선과 "즐겨찾기에 고정" 툴팁을 보이고, 놓으면 이미 있는 폴더는 순서를 바꾸고 다른 폴더는 그 자리에 고정한다(폴더를 옮기지는 않는다). 글·외부 링크는 항목 사이에서 `not-allowed` 커서와 "🚫 즐겨찾기에 고정" 툴팁을 보이고 놓아도 아무 일도 없다. 항목 위에 놓으면 지금 규칙대로 "○○(으)로 이동"이다. 탐색기 내용 영역, 바탕화면, 다른 탐색기 창에서 끌어 올 수 있다.
  - 폴더 우클릭 메뉴: 탐색기·바탕화면 폴더 메뉴의 "새 창에서 열기" 다음, "시작 화면에 고정" 앞에 "즐겨찾기에 고정 / 즐겨찾기에서 제거"를 둔다. 글과 외부 링크에는 두지 않는다. 바탕화면 세션의 메뉴 변경([[바탕화면 검수:5. 아이콘 메뉴의 단추 줄]])과 같은 파일이라 순서를 정하지 않고, 나중에 병합하는 쪽이 `main`을 받아 맞춘다.
  - 넣는 방법이 탐색 창 끌기와 우클릭 메뉴 둘뿐인 이유는 [[작업 표시줄 검수:9. 탐색기 점프 목록]]의 "실제와 다르게 하지 않는 것"에 있다.
  - 피그마: [[피그마 작업 검수:12. 파일 탐색기 피그마 작업]]
  - 문서: [[파일 탐색기:탐색 창]](즐겨찾기), [[파일 탐색기:우클릭 메뉴]](즐겨찾기 메뉴), [[고정]](즐겨찾기 고정 대상과 처음 목록), [[방문자 저장]](즐겨찾기 저장). 새 기능이라 기능 문서를 먼저 고치고(허락받음) 구현한다.
작업 순서: |
  시작 전에 작업 범위를 끝까지 점검해 물을 것을 먼저 모은다.
  1. 맨 먼저: 14번의 목록과 저장을 `feat/explorer-favorites-store`로 병합한다. 다른 세션이 기다린다.
  2. 바로 할 수 있는 것: 3번, 9번의 코드, 11번의 `N개 항목` 문구, 13번의 위치 아이콘 함수, 문서 변경.
  3. 토큰 PR(`feat/figma-tokens`) 뒤: 따로 없다. 4번의 색 변수는 `feat/figma-navigation-item`에 담겨 온다.
  4. 컴포넌트·조립 PR 뒤: 7·8·10·11번과 13번의 고른 탭(자기 컴포넌트 PR 처리), 4번(`feat/figma-navigation-item` 병합 확인 뒤), 5번의 확인(`feat/figma-file-row` 병합 확인 뒤), 14번의 탐색 창·끌기·폴더 메뉴.
  5. 다른 영역 세션의 PR을 기다리는 것: 없다.
