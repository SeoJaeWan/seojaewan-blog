_codocs:
  id: file-explorer-review
  name: 파일 탐색기 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10에 구현한 파일 탐색기를 실제 Windows 11 파일 탐색기와 비교해 찾은 차이와, 사람과 논의해 정한 해결이다.
  파일 탐색기 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 "끝남"과 PR 번호로 줄이고(다른 검수 문서가 섹션 링크로 가리킨다), 마지막 PR에서 이 문서를 지운다. 피그마 작업은 피그마 세션이 했다([[피그마 작업 검수:12. 파일 탐색기 피그마 작업]]).
  옮긴 항목: 탐색기 항목의 포커스 테두리와 회색 선택(옛 1·2번)은 [[바탕화면 검수:12. 탐색기 항목의 포커스 테두리]], [[바탕화면 검수:13. 포커스가 없는 선택은 회색]]으로, 자세히 보기 행 높이와 열 너비(옛 5·6번)는 [[피그마 작업 검수:5. FileRow]]로, 우클릭 메뉴 모양(옛 12번)은 같은 결정인 [[바탕화면 검수:5. 아이콘 메뉴의 단추 줄]], [[바탕화면 검수:7. 보기 하위 메뉴의 아이콘과 단축키]], [[바탕화면 검수:10. 붙여넣기 표시]]로, 제목 표시줄 재질과 창 열기 애니메이션(옛 13번의 일부)은 [[피그마 작업 검수:1. 재질 값]], [[피그마 작업 검수:2. 창 열기 애니메이션]]으로 옮겼다. 14번은 작업 표시줄 검수(끝나 지웠다)에서 옮겨 왔다.
  남은 것이 없다.
세션 사이 약속: |
  공통 약속은 [[피그마 작업 검수:세션 사이 약속]]을 따른다.
  맡은 컴포넌트·조립 PR은 모두 병합했다: `ExplorerTab`(#880), `ColumnHeader`(#883), `ExplorerStatusBar`(#891), `DropDownButton`(#873), `BreadcrumbChevron`(#890), `BreadcrumbItem`(#889), `Breadcrumb`(#888), `ExplorerAddressRow`(#887), 조립 Explorer(#899). `ExplorerCommandBar`·`NavigationPane`은 컴포넌트 PR 없이 조립과 앱 코드에서 고쳤다. 즐겨찾기 목록과 저장(`feat/explorer-favorites-store`, #906)은 맨 먼저 병합했다.
비교 방법: |
  - 실제 화면: 사람이 녹화한 영상 네 개.
    - 첫 영상(96초): 아이콘·자세히 보기, 항목·빈 곳 우클릭 메뉴와 보기·정렬 하위 메뉴, 주소창 편집, 경로 꺾쇠 목록, 위로, 탭 추가·끌기·닫기, 최대화·이전 크기
    - 둘째 영상(24초): 바탕화면 아이콘 선택과 비활성 창
    - 셋째 영상(23초): 뒤로·앞으로를 오갈 때의 선택
    - 넷째 영상(10초): 주소창 `×` 버튼
  - 영상에서 0.5~1초 간격으로 프레임을 뽑아 1:1과 4배로 확대해 봤다. 색은 프레임에서 픽셀을 샘플링했다.
  - 구현: Storybook `Features/Shell/Shell`(1920×1080)에서 Blog 폴더를 열고 영상과 같은 조작을 Playwright로 재현해 캡처했다.
  - 실제의 홈·갤러리·내 PC·세부 정보·복사·공유, 새 탭이 `홈`으로 열리는 것, 탭을 창 밖으로 끌어내는 것, 보기 다섯 가지는 [[파일 탐색기]]에서 두지 않기로 해 차이로 세지 않았다.
3. 위로·뒤로·앞으로 이동 뒤의 선택: |
  끝남(#899). 규칙은 [[파일 탐색기:탭]]에 있다.
4. 탐색 창의 선택과 포커스: |
  끝남(`NavigationItem` #879, 앱 #899). 규칙은 [[파일 탐색기:탐색 창]]에 있다.
5. 자세히 보기 행의 빈 오른쪽: |
  끝남(행 높이와 선택 범위 #882, 앱은 고칠 것 없음). 행 높이(28px)와 선택 범위(마지막 열 끝까지), 열 값과 열 제목의 어긋남은 [[피그마 작업 검수:5. FileRow]]로 옮겼다. 실제 Windows 녹화로 확인하니 행의 마지막 열 오른쪽 빈 곳을 누르면 빈 곳 누르기로 처리돼 선택이 풀린다. 우리 코드는 행 너비가 열 합(`w-fit`)이고 행 밖 누르기는 선택을 비워(`handleAreaPointerDown`) 이미 같아 고칠 것이 없다.
7. 정렬 화살표 위치: |
  끝남(#883).
8. 주소창 편집 모양과 글자 크기: |
  끝남(#888, #887, 앱 #909). 규칙은 [[파일 탐색기:주소창 편집]]에 있다.
9. 경로 꺾쇠 목록: |
  끝남(#890, #889, 앱 #909). 규칙은 [[파일 탐색기:구성]]에 있다.
10. 명령 버튼 모양과 주소 줄 구분선: |
  끝남(#873, #887, 앱 #899).
11. 상태 표시줄: |
  끝남(#891, 앱 #899). 규칙은 [[파일 탐색기:구성]]에 있다.
13. 고른 탭과 바탕 화면 아이콘: |
  끝남(#880, 앱 #899·#909).
14. 즐겨찾기: |
  끝남(목록과 저장 #906, 탐색 창·끌기·폴더 메뉴 #899). 규칙은 [[고정:즐겨찾기 고정]], [[방문자 저장:저장하는 것]], [[파일 탐색기:탐색 창]], [[파일 탐색기:우클릭 메뉴]]에 있다.
작업 순서: |
  모든 항목이 끝났다. 다른 세션의 PR을 기다리는 것도 없다.
