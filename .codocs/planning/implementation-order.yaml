_codocs:
  id: implementation-order
  name: 구현 순서
  parent:
    - seojaewan 블로그
개요: |
  블로그를 어떤 순서로 만들고, 각 단계가 무엇을 하는지에 대한 결정이다.
  진행 상황은 이 문서가 아니라 PR에서 관리한다([[Git 작업 규칙:작업 단위]]).
순서 원칙: |
  피그마 작업을 화면까지 먼저 끝내고, 그다음에 코드로 옮긴다.
  화면까지 피그마에서 그려본 뒤 코드로 옮기면 코드로 옮기는 시점에 디자인이 거의 확정돼 있어, 코드를 다시 고칠 일이 줄기 때문이다.

  또 화면별 기능을 디자인 시스템보다 먼저 정한다. 피그마 컴포넌트를 만들 때 어떤 상태와 변형이 필요한지 알고 시작하기 위해서다.
1단계 환경 구성: |
  모노레포, TypeScript, ESLint·Prettier, husky·commitlint, Vitest, Storybook, Playwright, CI, Vercel 연결, AGENTS.md를 구성한다.
  규칙은 [[개발 컨벤션]]과 [[기술 스택]]을 따른다.
2단계 화면별 기능 문서: |
  Desktop, Taskbar, Start·검색, File Explorer, Chrome, 창 동작, 모바일의 세부 동작을 `.codocs`에 정의한다.
  범위는 [[제품 정의:첫 공개 범위]]를 따른다.
3단계 피그마 Foundations와 Components: |
  공식 Windows 11 UI Kit을 기준으로 피그마에 토큰(Variables)과 컴포넌트를 만든다.
  규칙은 [[디자인 기반]], 대상은 [[컴포넌트 목록]]을 따르고, 2단계에서 정한 기능에 필요한 상태와 변형을 포함한다.
4단계 피그마 Verification: |
  피그마 디자인 시스템 자체가 제대로 만들어졌는지 확인한다. 코드와 비교하는 단계가 아니다.
  예: 컴포넌트가 Variables에 연결돼 있는지, 상태 변형이 빠짐없는지, 긴 텍스트와 폭 변화에 대응하는지.
  문제가 없다고 판단되면 다음 단계로 넘어간다.
5단계 피그마 Screens: |
  3단계 컴포넌트의 인스턴스로 화면별 Screens를 피그마에 만든다([[디자인 시스템:컴포넌트 조립 규칙]]).
  화면을 그리면서 실제로 필요한 화면 요소가 드러나면 피그마 컴포넌트로 만들고 [[컴포넌트 목록]]을 고친다.

  Screens에는 고유한 디자인 요소나 상태가 있는 화면만 둔다([[디자인 시스템:Screens]]). 동작은 화면별 기능 문서에 적고, 6단계 이후 코드(Storybook과 앱)에서 확인한다. 화면 흐름 프로토타입과 애니메이션 장면은 두지 않는다.

  - 컴포넌트 상호작용: 버튼·아이콘의 hover·pressed 상태 전환(Interactive components)은 컴포넌트에 둔다.
  - 움직임의 지속 시간과 이징 값은 Windows 모션 지침에서 모션 토큰으로 만들어, 6단계 이후 코드가 쓴다([[디자인 기반:모션]]).
6단계 디자인 시스템 코드화: |
  피그마를 기반으로 `packages/design-system`에 foundations(토큰)와 components를 만든다. Screens에서 나온 화면 요소 컴포넌트도 포함한다.
  기능에 쓰기 전에 먼저 [[피그마 일치 검사]]로 피그마와 비교한다. 피그마 플러그인과 CI 비교도 이 단계에서 만든다.

  처음 만드는 컴포넌트 몇 개로 [[미결 사항:피그마 일치 검사 검증]]을 먼저 확인한다. 틀린 버전을 잡지 못하는 경우가 있으면 비교 규칙을 보강하고, 나머지 컴포넌트로 넘어간다.

  나머지 컴포넌트는 묶음으로 나눠 옮긴다. 묶음마다 플러그인으로 내보내고, `main`에서 PR 하나를 열어 같은 PR에서 코드를 고친다([[피그마 일치 검사:피그마 플러그인]]). 병합은 ①부터 ⑤까지 차례로 한다.

  | 묶음 | 컴포넌트 |
  |---|---|
  | ① 기본 컨트롤과 토큰 | 토큰 전체, IconButton, RenameField, Tooltip, ProgressRing, ListItem, DropDownButton, Menu, MenuSeparator, Popover 등 |
  | ② 창 | WindowFrame, CaptionButton, Scrollbar, ScrollArea, MessageBox 등 |
  | ③ 작업 표시줄·Start·검색 | Taskbar, TaskbarButton, TaskbarPreview(List), SystemTray, StartMenu, PinnedTile, SearchPanel, SearchResults 등 |
  | ④ 탐색기·바탕화면 | DesktopIcon, SelectionMarquee, ExplorerTab, NavigationItem, FileItem, ColumnHeader, DetailsHeader, Breadcrumb, ExplorerContent와 그 영역 컴포넌트 |
  | ⑤ Chrome·스냅·재부팅 | BrowserTab, BrowserTabStrip, BrowserToolbar, AddressBar, ChromeWindow, ChromePage, Snap*, BootScreen 등 |

  묶음 작업 전에 먼저 할 것:
  1. 일치 검사 규칙 분류 점검([[미결 사항:피그마 일치 검사 규칙 분류 점검]])
  2. 슬롯 내용 검사([[피그마 일치 검사:슬롯 내용]])를 플러그인과 비교 도구에 넣는 PR을 `main`에 병합한다.
7단계 기능 구현: |
  디자인 시스템 컴포넌트를 활용해 2단계 문서의 기능을 `apps/web`에 구현한다.
8단계 E2E: |
  핵심 사용 흐름을 E2E로 검증한다([[테스트 작성 규칙:E2E]]).
9단계 콘텐츠와 공개: |
  Notion 연동([[콘텐츠 원천]]), 이미지 서버([[Notion 이미지 제공]]), SEO와 글별 공유 링크([[제품 정의:블로그 기능]])를 만들고 공개한다.
