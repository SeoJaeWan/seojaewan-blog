_codocs:
  id: implementation-order
  name: 구현 순서
  parent:
    - seojaewan 블로그
개요: |
  블로그를 어떤 순서로 만들고, 각 단계가 무엇을 하는지에 대한 결정이다.
  진행 상황은 이 문서가 아니라 PR에서 관리한다([[Git 작업 규칙:작업 단위]]).
순서 원칙: |
  피그마 작업을 화면까지 먼저 끝내고, 그다음에 코드로 옮긴다.
  화면까지 피그마에서 그려본 뒤 코드로 옮기면 코드로 옮기는 시점에 디자인이 거의 확정돼 있어, 코드를 다시 고칠 일이 줄기 때문이다.

  또 화면별 기능을 디자인 시스템보다 먼저 정한다. 피그마 컴포넌트를 만들 때 어떤 상태와 변형이 필요한지 알고 시작하기 위해서다.
1단계 환경 구성: |
  모노레포, TypeScript, ESLint·Prettier, husky·commitlint, Vitest, Storybook, Playwright, CI, AGENTS.md를 구성한다.
  규칙은 [[개발 컨벤션]]과 [[기술 스택]]을 따른다.
2단계 화면별 기능 문서: |
  Desktop, Taskbar, Start·검색, File Explorer, Chrome, 창 동작, 모바일의 세부 동작을 `.codocs`에 정의한다.
  범위는 [[제품 정의:첫 공개 범위]]를 따른다.
3단계 피그마 Foundations와 Components: |
  공식 Windows 11 UI Kit을 기준으로 피그마에 토큰(Variables)과 컴포넌트를 만든다.
  규칙은 [[디자인 기반]], 대상은 [[컴포넌트 목록]]을 따르고, 2단계에서 정한 기능에 필요한 상태와 변형을 포함한다.
4단계 피그마 점검: |
  피그마 디자인 시스템 자체가 제대로 만들어졌는지 확인한다. 코드와 비교하는 단계가 아니다.
  예: 컴포넌트가 Variables에 연결돼 있는지, 상태 변형이 빠짐없는지, 긴 텍스트와 폭 변화에 대응하는지.
  문제가 없다고 판단되면 다음 단계로 넘어간다.
5단계 피그마 Screens: |
  컴포넌트를 조합한 조립(03 · Patterns)과 그것으로 만든 화면(04 · Screens)을 피그마에 만든다([[디자인 시스템:조립]], [[디자인 시스템:Screens]]).
  화면을 그리면서 실제로 필요한 화면 요소가 드러나면 피그마 컴포넌트로 만들고 [[컴포넌트 목록]]을 고친다.

  동작은 화면별 기능 문서에 적고, 6단계 이후 코드(Storybook과 앱)에서 확인한다. 화면 흐름 프로토타입과 화면 사이 애니메이션 장면은 두지 않는다. 01 · Foundations의 Motion 프레임 견본은 화면 흐름이 아니라 모션 클래스 하나의 기준이라 이와 다르다([[디자인 기반:모션 견본]]).

  - 컴포넌트 상호작용: 버튼·아이콘의 hover·pressed 상태 전환(Interactive components)은 컴포넌트에 둔다.
  - 움직임의 지속 시간과 이징 값은 Windows 모션 지침에서 모션 토큰으로 만들어, 6단계 이후 코드가 쓴다([[디자인 기반:모션]]).
6단계 디자인 시스템 코드화: |
  피그마를 기반으로 `packages/design-system`에 foundations(토큰)와 components를 만든다. 흐름은 [[피그마 연동]]을 따른다.

  먼저 디자인 시스템 재구성을 마친다. 내용을 변형으로 가진 컴포넌트를 그대로 코드로 옮기면 나중에 코드까지 다시 고쳐야 하기 때문이다.
  1. 피그마를 [[디자인 시스템:컴포넌트 조립 규칙]]과 [[디자인 시스템:조립]]의 층 구조로, 토큰을 [[디자인 기반:토큰 이름]]과 [[디자인 기반:크기 변수]]의 이름 규칙으로 맞춘다. 크기 변수 정리는 화면을 조립으로 다시 만들기 전에 한다.
  2. 플러그인, 토큰 변환 스크립트, Stylelint, 캡처 도구와 CI를 [[피그마 연동]]대로 바꾼다.
  3. 토큰 PR을 먼저 병합한다. 이름이 바뀐 토큰을 쓰는 코드(Button, MenuItem, Flyout, SearchBox)도 이 PR에서 고친다([[피그마 연동:PR 흐름]]).
  4. 코드가 있는 네 컴포넌트(Button, MenuItem, Flyout, SearchBox)의 컴포넌트 PR을 처리한다.

  나머지 컴포넌트는 코드로 만들 차례가 되면 묶음마다 플러그인으로 내보낸다. 컴포넌트마다 PR이 하나씩 열리고, 토큰이 바뀌었으면 토큰 PR이 따로 열린다. PR은 스킬로 처리한다([[피그마 연동:스킬]]). 병합은 ①부터 ⑤까지 묶음 차례로 하고, 묶음 안에서는 토큰 PR을 먼저 병합한다.

  | 묶음 | 컴포넌트 |
  |---|---|
  | ① 기본 컨트롤 | IconButton, DropDownButton, RenameField, Separator, Popover, Tooltip, Scrollbar, ListItem, SectionHeader, SectionTitle, ListGroup, TileGrid, Menu, MessageBox, ProgressRing, EmptyState, CodeBlock |
  | ② 창 | WindowFrame, WindowTitle, CaptionButton, CaptionButtonGroup, WindowPreview |
  | ③ 작업 표시줄·Start·검색 | Taskbar, TaskbarButton, TaskbarPreviewList, SystemTray, ShellSurface, StartMenuFooter, ProfileButton, PinnedTile, SearchResults, BestMatchCard |
  | ④ 탐색기·바탕화면 | FileItem, FileRow, SelectionMarquee, ExplorerTab, NavigationItem, NavigationPane, ColumnHeader, DetailsHeader, Breadcrumb, BreadcrumbItem, ExplorerAddressRow, ExplorerCommandBar, ExplorerStatusBar |
  | ⑤ Chrome·스냅·재부팅 | BrowserTab, BrowserTabStrip, BrowserToolbar, AddressBar, Toc, TocItem, PostNavCard, SnapLayoutFlyout, SnapLayoutOption, SnapZone, SnapPreview, BootScreen |

  모션 토대는 첫 애니메이션 PR보다 먼저 만든다. 피그마 이징 변수를 `EASING` 타입으로 옮기고(토큰 PR), `motion.css`와 Stylelint 예외, Tailwind 기본 애니메이션 지우기, 토큰 변환의 이징 규칙, 자산 생성기 규칙, 플러그인의 애니메이션 내보내기, 모션 스토리와 시간 검사, CI 나누기를 [[피그마 연동:모션 클래스]], [[피그마 연동:모션]], [[피그마 연동:CI]]대로 만든다. 애니메이션 PR은 견본마다 열리고, 병합 순서는 [[피그마 연동:PR 흐름]]을 따른다.
7단계 기능 구현: |
  디자인 시스템 컴포넌트를 활용해 2단계 문서의 기능을 `apps/web`에 구현한다.

  피그마 조립은 기능을 구현하기 전에 영역마다 조립 PR로 먼저 내보내고, 앱 컴포넌트와 조립 스토리를 만든다. 피그마 그림과는 조립 PR 본문에서 사람이 비교하고, 기능은 `play` 동작 스토리로, 배치 변화는 캡처 표로 확인한다([[디자인 시스템:조립]], [[피그마 연동:PR 흐름]]). 동작(창 이동, 저장소, 열고 닫기)은 그 조립 위에 붙인다. 조립이 쓰는 디자인 시스템 컴포넌트는 그보다 먼저 6단계 묶음에서 코드로 만든다.

  모션 클래스를 만들고 기능에 붙이는 시점은 [[피그마 연동:PR 흐름]]에서 정한다.

  남은 기능은 다음 순서로 구현한다.

  | 순서 | 기능 | 내용 |
  |---|---|---|
  | ㄱ | 이미 만든 기능의 빈틈 | 재부팅 중 `inert`와 다시 시작 뒤 포커스, Start 패널 높이 잘림, Start 목록 줄 열기, 화면 크기 변경 시 창 위치, 작업 표시줄 hover 미리보기와 모바일 미리보기 폭 |
  | ㄴ | 창 | 드래그와 크기 조절 |
  | ㄷ | 작업 공간 상태 | 항목 배치, `persist`, 휴지통 규칙 |
  | ㄹ | 바탕화면 | 아이콘 선택·드래그·자동 정렬, 우클릭 메뉴, 휴지통·외부 링크 열기 |
  | ㅁ | 탐색기 | 폴더 이동, 선택, 정렬·보기, 우클릭, 창 사이 드래그, 탭 |
  | ㅂ | Start·검색 | 고정, 검색 동작 |
  | ㅅ | 작업 표시줄 | 앱 버튼 우클릭 메뉴 |
  | ㅇ | Chrome | 탭, 주소창, 글 보기. 탭이 많을 때 탭 줄 배치도 이때 정한다 |

  작업 공간 상태(ㄷ)가 바탕화면·탐색기·Start가 함께 쓰는 기반이라 먼저 한다.
8단계 E2E: |
  핵심 사용 흐름을 E2E로 검증한다([[테스트 작성 규칙:E2E]]).
9단계 콘텐츠와 공개: |
  Notion 연동([[콘텐츠 원천]]), 이미지 서버([[Notion 이미지 제공]]), SEO와 항목별 공유 링크([[SEO와 공유 미리보기]]), 알림 보내기([[알림 프로세스]]), 자체 배포([[배포 환경]])를 만들고 공개한다.

  이 단계의 작업은 미니 PC(배포 서버)에서 AI 에이전트가 문서만 보고 이어서 한다. 아래 순서로 하고, 각 일은 해당 문서가 기준이다. 사람이 직접 하는 일은 AI 에이전트가 대신하지 않고 표시해 둔다.

  | 순서 | 일 | 하는 곳 |
  |---|---|---|
  | 1 | CI 이전: 저장소 비공개 전환, self-hosted runner 설치, 워크플로 `runs-on` 변경, 시나리오 케이스 보고서를 미니 PC로 옮기고 Cloudflare 터널과 Access 뒤에서 열기, 캡처 표 댓글 그림이 비공개 저장소에서 보이는지 PR로 시험([[배포 환경:CI]]) | 미니 PC. 비공개 전환과 Cloudflare 설정은 사람 |
  | 2 | (완료 2026-11-06, PR #659) 블로그 fixture와 변환: Notion API 응답 JSON fixture, 가짜 Notion 클라이언트, `CONTENT_SOURCE`([[콘텐츠 원천:읽는 곳]]), 환경 변수 검증(`CONTENT_SOURCE`·`NOTION_TOKEN`), Notion 읽기 클라이언트(API `2025-09-03`), 세 묶음 변환 | 미니 PC. fixture를 받을 시험용 Notion 페이지는 사람이 만들었다 |
  | 3 | (완료 2026-11-06, PR #662) 첫 진입 창 SSR([[SEO와 공유 미리보기:첫 HTML]]) | 미니 PC |
  | 4 | Notion 연결과 SEO: 세 묶음 주소, 메타·공유 이미지·sitemap·robots, 이미지 `srcset`과 크기. 2번에서 넘어온 것: 캐시 태그와 `revalidateTag`, `/projects`·`/about` 라우트와 작업 공간의 Project·About 폴더 연결, 이미지 `width`·`height`. 4a(Notion 캐시, 웹훅, 세 묶음 주소)는 완료(2026-11-06, PR #665)했으나 캐시와 웹훅은 9번에서 걷어낸다([[콘텐츠 원천:결정]]), 4c(이미지 `srcset`과 크기)는 완료(PR #664), 4b(SEO)는 진행 중 | 미니 PC |
  | 5 | (완료 2026-11-06, PR #661) 이미지 서버 `apps/images`(이 저장소): 저장, WebP 720·1440, 크기 헤더([[Notion 이미지 제공]]). 2~4와 동시에 할 수 있다. 실제 Notion 이미지는 7번 배포 때 운영 토큰으로 확인한다 | 미니 PC |
  | 6 | (선행 조건, 완료 2026-11-06) local-server의 notify 배포와 카카오 연결, 블로그·이미지 서버·젠킨스용 `ALERT_SECRET` 발급. 동기화 실패 알림을 실제로 확인할 수 있다([[알림 프로세스:선행 조건]]) | local-server 저장소 |
  | 7 | 배포 파이프라인(공용 Jenkins에 붙는다). 선행 조건: local-server의 젠킨스 구현(local-server `.codocs/foundation/auto-deploy.yaml`의 구현 순서). 블로그가 맡는 일: 루트 `Jenkinsfile`, Docker Compose 설정(블로그 `127.0.0.1:3000`, 이미지 서버 `127.0.0.1:3100`, 볼륨 `/srv/seojaewan-images`, 환경 변수 파일), 두 앱의 Dockerfile(블로그는 standalone), `apps/images/.env.example`, 젠킨스가 준비되면 owner에게 실행 계정과 GitHub App 설치 요청하기. 배포 대상을 고르는 방법(바뀐 앱만 배포하는 기준)과 글 배포 경로는 9번과 함께 구현 PR에서 정한다([[배포 환경:배포(CD)]]) | 미니 PC. 젠킨스 설치·Access·GitHub 연결은 local-server 저장소 |
  | 8 | 공개: 터널 연결과 확인, 재부팅한 뒤 runner·보고서 서버·터널·컨테이너가 스스로 뜨는지 확인(커널 업데이트 적용 포함), 검색 엔진 등록([[배포 환경:공개 절차]]) | 미니 PC. 검색 엔진 등록은 사람. 글 동기화 작업이 도는지 확인한다 |
  | 9 | 글 JSON 동기화와 SSG 전환([[콘텐츠 원천:결정]], 2026-11-06 결정). 작업은 다섯이다. (a) 4a의 일부 걷어내기: 캐시(`cacheComponents`, `'use cache'`, 태그), 웹훅 라우트와 `NOTION_WEBHOOK_SECRET`, `revalidateTag`. (b) 글 동기화 작업: GitHub Actions 예약 작업(self-hosted runner, 1시간마다)이 Notion 공개 글을 확인해 바뀌었으면 글 JSON을 갱신하는 PR을 만들고 자동 병합, 초안만 바뀌면 PR 없음, 동기화 실패와 글 PR CI 실패는 notify([[콘텐츠 원천:갱신 방식]]). (c) SSG 전환: 빌드는 저장소 JSON만 읽고 모르는 주소는 미리 만든 404, `CONTENT_SOURCE`·fixture와 JSON의 관계 정리, 이미지 크기를 JSON에 넣기([[콘텐츠 원천:읽는 곳]], [[Notion 이미지 제공:크기]]). (d) Changesets 도입: 앱·패키지를 바꾼 PR에 changeset, CI의 `changeset status`, 버전 PR 병합 때 배포. (e) 7번(배포 파이프라인)을 글 JSON만 바뀐 병합은 바로 블로그 배포, 코드는 버전 PR 병합 때 바뀐 앱만 배포로 맞춰 구현([[배포 환경:배포(CD)]]). 파일 경로, 워크플로 이름, JSON 모양은 구현 PR에서 정한다 | 미니 PC. 아래 사람이 할 일 |

  감시는 `registry/seojaewan-blog.yaml` 등록으로 한다. 등록 PR은 local-server 저장소에서 따로 진행 중이다. infra 재배포(`sudo ./deploy/deploy.sh infra`)는 실제 구성이 끝난 뒤 마지막에 owner가 한다([[배포 환경:감시]]).

  사람이 직접 하는 일(토큰·비밀번호를 AI 에이전트에게 주지 않는다):
  - 끝난 일(2026-11-06): Notion 연동 두 개와 연결, 속성 정리, 초안 옮기기, fixture 시험 페이지([[콘텐츠 원천:데이터베이스]], [[콘텐츠 원천:읽는 곳]]). 저장소 비공개 전환. 알림 비밀값 발급([[알림 프로세스:선행 조건]]). 이미지 서버 터널([[배포 환경:인프라 설정의 위치]]). 젠킨스 터널과 Access는 local-server가 갖는다.
