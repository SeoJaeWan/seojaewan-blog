_codocs:
  id: known-limitations
  name: 한계
  parent:
    - seojaewan 블로그
개요: |
  코드 구현에서 정했지만 이상적이지 않아 나중에 풀고 싶은 것을 모은다.
  항목마다 포기한 것, 영향, 다시 시도할 조건을 적는다. 풀리면 담당 문서를 고치고 여기서 지운다.
글자 기준선: |
  - 포기한 것: 코드 글자의 세로 위치를 피그마와 모든 경우에 맞추는 것.
  - 영향: 글자 스타일에 따라 코드 글자가 피그마보다 1~2px 위나 아래에 그려진다. 모습을 비교할 때 글자 위치 1~2px 차이는 이 한계로 보고 넘긴다.
  - 다시 시도할 조건: CSS가 줄 안의 실제 서체로 기준선을 정하는 방법을 제공하거나, 피그마가 기준선 계산 방식을 바꿀 때.
  - 관련: [[디자인 시스템:서체 구현]]
HUG 글자 폭 올림: |
  - 포기한 것: 한글이 든 HUG 컴포넌트의 폭을 피그마와 똑같이 맞추는 것.
  - 이유: 피그마는 자동 크기(HUG) 글자 노드의 폭·높이를 정수로 올린다(예: 실제 글자 폭 36.31 → 37). 브라우저는 소수 그대로 둔다. 피그마에서 이 올림을 끌 수 없다. 제품 코드에 올림을 흉내 내면 일부 컴포넌트는 더 어긋난다.
  - 영향: 한글이 든 HUG 컴포넌트의 폭이 1px 안팎 다르고, 이런 컴포넌트가 쌓이는 조립(명령 모음)은 2px쯤 어긋난다. 모습을 비교할 때 이 한계로 보고 넘긴다.
  - 다시 시도할 조건: 피그마가 글자 노드 크기를 소수로 두거나 올림을 끌 수 있게 할 때.
  - 관련: [[한계:글자 기준선]]
열리는 도중 닫기: |
  - 포기한 것: 창이 열리는 도중에 닫으면 열던 모습에서 이어서 닫히는 것.
  - 영향: 열리는 도중에 닫으면 닫기 애니메이션이 처음부터(배율 1, 투명도 1에서) 시작된다. 창 열기는 250ms라 이 사이에 닫는 경우는 드물다.
  - 다시 시도할 조건: 열리는 도중 닫는 모습이 실제로 어색하다고 판단될 때.
  - 관련: [[디자인 시스템:모션 클래스]]
최대화·스냅 중 내용 늘어남: |
  - 포기한 것: 최대화·복원·스냅하는 동안 창 내용이 제 비율로 보이는 것.
  - 영향: 움직이는 동안(250ms) 글자와 아이콘이 잠깐 늘어나 보인다.
  - 다시 시도할 조건: 피그마 키프레임이 너비·높이를 지원할 때.
  - 관련: [[디자인 시스템:모션 클래스]]
