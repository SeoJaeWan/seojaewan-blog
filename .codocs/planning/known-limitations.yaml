_codocs:
  id: known-limitations
  name: 한계
  parent:
    - seojaewan 블로그
개요: |
  정했지만 이상적이지 않아 나중에 풀고 싶은 것을 모아 둔다. 아직 정하지 않은 것은 [[미결 사항]]에 둔다.
  결정의 자세한 내용은 원래 문서에 있고, 여기에는 요약과 링크만 둔다. 항목마다 무엇을 포기했는지, 왜 그랬는지, 영향이 얼마인지, 무엇이 바뀌면 다시 시도할 수 있는지를 적는다.
  풀리면 원래 문서를 고치고 여기서 지운다.
아크릴 일반 섞기: |
  - 포기한 것: 실제 Windows 아크릴은 밝기 층을 루미너시티 방식으로 섞어 배경화면 색감을 머금는다. 우리는 일반 섞기(반투명 색을 덮기)를 쓴다.
  - 이유: 피그마는 블렌드 모드가 일반이 아닌 칠에 색 변수를 연결하면 블렌드를 일반으로 바꾼다. 루미너시티를 지키면 "시각 값은 모두 변수에 연결한다"를 지킬 수 없다. 코드도 루미너시티를 쓰려면 의사 요소 층과 쌓임 맥락 제약(`isolate`, `z-index` 금지)이 생긴다.
  - 영향: 같은 배경화면 위에서 `Material/Acrylic Default`(메뉴, 툴팁, 플라이아웃)는 평균 색 차이 약 3으로 거의 같다. `Material/Acrylic Base`(작업 표시줄, 시작 메뉴, 검색 창)는 파랑 채널이 약 10 낮아 배경 색감이 덜 묻어난다. 불투명도로는 보정되지 않았고, Windows UI kit 값을 그대로 두기 위해 색은 바꾸지 않았다.
  - 다시 시도할 조건: 피그마가 블렌드 칠에 변수 연결을 지원할 때.
  - 관련: [[디자인 기반:재질 효과]]
마이카 미구현: |
  - 포기한 것: 앱 창의 마이카 재질을 아직 코드로 만들지 않았다.
  - 이유: 마이카는 뒤를 흐리게 하는 것이 아니라 배경화면 색감만 비치는 재질이라, 흐린 배경화면을 창 바탕에 까는 방식으로 만들기로 했다. 창 컴포넌트를 만들 때(컴포넌트 묶음 ②) 함께 구현한다.
  - 영향: 그때까지 생성기는 마이카 유틸리티를 만들지 않는다. 마이카를 쓰는 컴포넌트는 지금 범위에 없다.
  - 관련: [[디자인 기반:재질 효과]]
포커스 테두리 한 겹: |
  - 포기한 것: Windows 포커스 테두리는 두 겹(바깥 진한 선 + 안쪽 흰 선)이다. 우리는 바깥쪽 단색 선 한 겹을 쓴다.
  - 이유: 피그마 선은 레이어마다 한 겹, 한 위치만 된다. 퍼짐 그림자로 두 겹을 흉내 내면 피그마가 배경이 완전히 투명한 노드(Subtle 버튼)에서 그리지 않는다. 겹쳐 놓는 FocusRect 부품은 위치 비교가 필요해 지웠다.
  - 영향: 밝은 배경에서는 차이가 작다. 어두운 배경에서는 안쪽 흰 선이 없어 포커스가 덜 보일 수 있다. Windows UI는 라이트 모드만 둬서 지금은 해당하지 않는다.
  - 다시 시도할 조건: 피그마가 한 레이어에 여러 위치의 선을 지원하거나, 투명 노드의 퍼짐 그림자를 그릴 때.
  - 관련: [[디자인 기반:포커스 표현]]
그림 비교 불가: |
  - 포기한 것: 피그마 화면과 코드 화면을 그림으로 비교해 같다고 판정하는 것.
  - 이유: 피그마와 브라우저는 그리는 엔진이 달라 같은 디자인도 픽셀이 다르고, 피그마 출력을 브라우저용으로 바꾸는 경로(SVG, Sites, Dev Mode 코드)는 디자인 일부를 잃는다. 차이를 너그럽게 보는 인지 비교(SSIM 등)도 정상과 실수의 간격이 글자 번짐 정도라 판정 기준을 세울 수 없었다. 그래서 같은 이름(변수, 스타일, 선택지, 자산)을 썼는지로 비교한다.
  - 영향: 생성 유틸리티(재질, 그라데이션 테두리 등)가 피그마와 같은 모습을 그리는지는 이름 비교로 확인되지 않는다. 생성기를 만들 때 비교 이미지로 한 번 확인한다.
  - 다시 시도할 조건: 피그마 디자인을 손실 없이 브라우저로 그리는 공식 경로가 생길 때.
  - 관련: [[피그마 일치 검사:검토한 대안]]
피그마 PNG 판정 제외: |
  - 포기한 것: 피그마가 내보낸 변형 PNG를 판정에 쓰는 것.
  - 이유: 같은 디자인도 내보낼 때마다 PNG 바이트가 조금씩 달라진다.
  - 영향: PNG는 PR 댓글에서 사람이 보는 용도로만 쓰고, export 해시에도 넣지 않는다.
  - 관련: [[피그마 일치 검사:export.json 계약]]
겹쳐 놓기 거리 값 찾기: |
  - 포기한 것: 겹쳐 놓은 요소의 거리도 다른 숫자처럼 디자이너가 변수에 직접 연결하는 것.
  - 이유: 피그마는 절대 위치 요소의 위치를 변수에 연결하는 기능이 없다.
  - 영향: 플러그인이 거리 값(예: 4px)으로 간격 단계의 숫자 이름 토큰(`spacing/4`)을 찾는다. 값으로 이름을 짐작하는 방식이라, 같은 값의 다른 토큰을 뜻했어도 구분하지 못한다.
  - 다시 시도할 조건: 피그마가 위치 변수 연결을 지원할 때.
  - 관련: [[피그마 일치 검사:겹쳐 놓기]], [[디자인 기반:간격 단계]]
글자 서체 비교의 공백 제외: |
  - 포기한 것: 글자마다 실제로 그린 서체를 비교할 때 공백까지 비교하는 것.
  - 이유: 한글과 영문이 섞인 글자에서 공백의 서체는 피그마에서 디자이너가 어느 구간에 넣었느냐에 따라 달라지고, 브라우저는 서체 목록 순서대로 정한다.
  - 영향: 공백 폭의 작은 차이는 비교에서 빠진다.
  - 관련: [[피그마 일치 검사:글자]]
한글 글자 스타일 두 벌: |
  - 포기한 것: 같은 의미의 글자 스타일을 하나만 두는 것.
  - 이유: 피그마는 서체에 없는 글자를 다른 서체로 대신 그리지 못한다. Open Sans에 한글이 없어 한글용 `Hangul/*` 스타일(Pretendard)이 따로 있고, 한글과 영문이 섞인 글자는 구간마다 스타일을 나눠 입힌다. 브라우저는 서체 목록으로 알아서 대신 그려 코드는 `type-*` 하나로 쓴다.
  - 영향: 디자이너가 섞인 글자의 구간을 나눠야 한다. 비교는 스타일 이름이 아니라 글자마다 실제 서체로 한다.
  - 다시 시도할 조건: 피그마가 대체 서체를 지원할 때.
  - 관련: [[디자인 기반:서체]], [[피그마 일치 검사:글자]]
쓰지 않는 피그마 기능: |
  - 포기한 것: 점선, GRID 자동 배치, 호·별·다각형 같은 도형을 직접 그리는 것, 슬롯 자리표시 꾸밈.
  - 이유: 코드로 같게 그릴 수 없거나(점선 간격), 비교 대응을 따로 만들어야 하는데 쓰는 곳이 없다(GRID). CSS로 못 그리는 도형은 Foundations 자산으로만 쓴다.
  - 영향: 필요해지면 그때 규칙을 만들어 연다.
  - 관련: [[디자인 기반:레이아웃]], [[디자인 기반:자산]], [[피그마 일치 검사:구조 검사]]
Layout 안내 프레임 수동 갱신: |
  - 포기한 것: 피그마 Foundations / Layout 프레임의 크기 변수 목록이 변수와 함께 자동으로 바뀌는 것.
  - 이유: 목록은 만든 시점의 변수 이름과 값을 글자로 적은 것이다.
  - 영향: 크기 변수를 바꾸면 이 목록도 손으로 고친다.
  - 관련: [[디자인 기반:크기 변수]]
애니메이션 비교 범위: |
  - 포기한 것: 움직임 도중의 중간 모양, 키프레임 애니메이션(Start 올라오기, 창 열기·최소화 등), 화면 단위 움직임, CSS로 부드럽게 바뀌지 않는 역할(안쪽 선 색, 자산 바꿈)의 전환, 피그마보다 코드가 더 움직이는 것을 비교하는 것.
  - 이유: 이름으로 대응되는 것은 "어떤 속성이 어떤 시간·이징으로 바뀌는가"까지다. 중간 프레임은 엔진마다 다르게 그리고, 키프레임과 화면 움직임은 컴포넌트 변형 사이 전환이 아니라 앱 코드가 정한다.
  - 영향: Button Hover → Pressed의 선 색은 전환 없이 바로 바뀌고, SearchBox 돋보기는 그림이 바로 바뀐다. 창·패널 움직임이 [[디자인 기반:모션]]의 값을 따르는지는 사람이 확인한다.
  - 다시 시도할 조건: 화면 단위 검증을 정할 때([[미결 사항:화면 단위 시각 검증]]).
  - 관련: [[피그마 일치 검사:상태 전환]]
피그마 MCP 제약: |
  - 포기한 것: 피그마 MCP로 버전 기록 저장(`saveVersionHistoryAsync`)과 Inspect CSS(`getCSSAsync`)를 쓰는 것.
  - 이유: 피그마 MCP 환경에서 지원하지 않는다.
  - 영향: 피그마를 크게 고치기 전에는 사람이 피그마에서 버전을 저장한다. MCP로 고친 내용은 바꾸기 전 값을 기록해 되돌릴 수 있게 한다.
  - 관련: [[피그마 일치 검사:피그마 플러그인]]
