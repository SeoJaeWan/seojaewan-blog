_codocs:
  id: known-limitations
  name: 한계
  parent:
    - seojaewan 블로그
개요: |
  정했지만 이상적이지 않아 나중에 풀고 싶은 것을 모아 둔다. 아직 정하지 않은 것은 [[미결 사항]]에 둔다.
  결정의 자세한 내용은 원래 문서에 있고, 여기에는 요약과 링크만 둔다. 항목마다 무엇을 포기했는지, 왜 그랬는지, 영향이 얼마인지, 무엇이 바뀌면 다시 시도할 수 있는지를 적는다.
  풀리면 원래 문서를 고치고 여기서 지운다.
아크릴 일반 섞기: |
  - 포기한 것: 실제 Windows 아크릴은 밝기 층을 루미너시티 방식으로 섞어 배경화면 색감을 머금는다. 우리는 일반 섞기(반투명 색을 덮기)를 쓴다.
  - 이유: 피그마는 블렌드 모드가 일반이 아닌 칠에 색 변수를 연결하면 블렌드를 일반으로 바꾼다. 루미너시티를 지키면 "시각 값은 모두 변수에 연결한다"를 지킬 수 없다([[피그마 연동:구조 검사]]). 코드도 루미너시티를 쓰려면 의사 요소 층과 쌓임 맥락 제약(`isolate`, `z-index` 금지)이 생긴다.
  - 영향: 같은 배경화면 위에서 `Material/Acrylic Default`(메뉴, 툴팁, 플라이아웃)는 평균 색 차이 약 3으로 거의 같다. `Material/Acrylic Base`(작업 표시줄, 시작 메뉴, 검색 창)는 파랑 채널이 약 10 낮아 배경 색감이 덜 묻어난다. 불투명도로는 보정되지 않았고, Windows UI kit 값을 그대로 두기 위해 색은 바꾸지 않았다.
  - 다시 시도할 조건: 피그마가 블렌드 칠에 변수 연결을 지원할 때.
  - 관련: [[디자인 기반:재질 효과]]
  - 함께 뺀 것: Windows 아크릴의 노이즈 질감도 넣지 않는다. 재질은 배경 블러와 반투명 바탕색뿐이다([[디자인 기반:재질 효과]]).
마이카 일반 섞기: |
  - 포기한 것: 실제 Windows 마이카는 `#F3F3F3` 층을 루미너시티와 색 섞기 두 겹으로 얹어 배경화면 색감을 머금는다. 우리는 흐린 배경화면 위에 `#F3F3F3` 95% 층 하나를 일반 섞기로 얹는다.
  - 이유: 아크릴과 같다. 피그마는 블렌드 칠에 색 변수를 연결하지 못한다([[한계:아크릴 일반 섞기]]).
  - 영향: 같은 배경화면 위 견본에서 Windows UI kit의 마이카 값과 평균 색 차이가 약 7.8이고, 파랑 채널이 약 7 낮아 배경화면의 파란 기운이 덜 묻어난다. 불투명도 95~100%가 가장 가까웠고(97%가 최소), 배경화면이 조금 비치는 95%를 골랐다.
  - 다시 시도할 조건: 피그마가 블렌드 칠에 변수 연결을 지원할 때.
  - 관련: [[디자인 기반:재질 효과]]
포커스 테두리 한 겹: |
  - 포기한 것: Windows 포커스 테두리는 두 겹(바깥 진한 선 + 안쪽 흰 선)이다. 우리는 바깥쪽 단색 선 한 겹을 쓴다.
  - 이유: 피그마 선은 레이어마다 한 겹, 한 위치만 된다. 퍼짐 그림자로 두 겹을 흉내 내면 피그마가 배경이 완전히 투명한 노드(Subtle 버튼)에서 그리지 않는다. 겹쳐 놓은 레이어는 크기를 변수에 묶을 수 없다.
  - 영향: 밝은 배경에서는 차이가 작다. 어두운 배경에서는 안쪽 흰 선이 없어 포커스가 덜 보일 수 있다. Windows UI는 라이트 모드만 둬서 지금은 해당하지 않는다.
  - 다시 시도할 조건: 피그마가 한 레이어에 여러 위치의 선을 지원하거나, 투명 노드의 퍼짐 그림자를 그릴 때.
  - 관련: [[디자인 기반:포커스 표현]]
그림 비교 불가: |
  - 포기한 것: 피그마 화면과 코드 화면을 그림으로 비교해 기계가 같다고 판정하는 것.
  - 이유: 피그마와 브라우저는 그리는 엔진이 달라 같은 디자인도 픽셀이 다르고, 피그마 출력을 브라우저용으로 바꾸는 경로(SVG, Sites, Dev Mode 코드)는 디자인 일부를 잃는다. 차이를 너그럽게 보는 인지 비교(SSIM 등)도 정상과 실수의 간격이 글자 번짐 정도라 판정 기준을 세울 수 없었다.
  - 영향: 컴포넌트와 조립의 모습은 PR마다 사람이 캡처 표(피그마, 코드, 차이 그림)를 보고 확인한다. 차이 그림에는 엔진 차이로 생기는 글자 가장자리와 모서리의 밝은 선도 나와, 사람이 디자인 차이와 구분해야 한다. 재질의 흐림 모습은 같은 배경색 위에서 찍어 표로 확인되지 않는다. 토큰과 자산은 다시 생성해 비교하므로 기계가 보장한다.
  - 다시 시도할 조건: 피그마 디자인을 손실 없이 브라우저로 그리는 공식 경로가 생길 때.
  - 관련: [[피그마 연동:캡처 표]], [[피그마 연동:검토한 대안]]
한글 글자 스타일 두 벌: |
  - 포기한 것: 같은 의미의 글자 스타일을 하나만 두는 것.
  - 이유: 피그마는 서체에 없는 글자를 다른 서체로 대신 그리지 못한다. Open Sans에 한글이 없어 한글용 `Hangul/*` 스타일(Pretendard)이 따로 있고, 한글과 영문이 섞인 글자는 구간마다 스타일을 나눠 입힌다. 브라우저는 서체 목록으로 알아서 대신 그려 코드는 `type-*` 하나로 쓴다.
  - 영향: 디자이너가 섞인 글자의 구간을 나눠야 한다. 두 벌은 같은 변수에 연결해 두고, 토큰 생성은 라틴 스타일로만 `type-*` 클래스를 만든다([[피그마 연동:토큰 생성]]).
  - 다시 시도할 조건: 피그마가 대체 서체를 지원할 때.
  - 관련: [[디자인 기반:서체]]
쓰지 않는 피그마 기능: |
  - 포기한 것: 점선, GRID 자동 배치, 호·별·다각형 같은 도형을 직접 그리는 것, 슬롯 자리표시 꾸밈, 노이즈·텍스처 효과.
  - 이유: 코드로 같게 그릴 수 없거나(점선 간격, 노이즈), 코드로 옮기는 규칙을 따로 만들어야 하는데 쓰는 곳이 없다(GRID). CSS로 못 그리는 도형은 Foundations 자산으로만 쓴다.
  - 영향: 필요해지면 그때 규칙을 만들어 연다.
  - 관련: [[디자인 기반:레이아웃]], [[디자인 기반:자산]], [[피그마 연동:구조 검사]]
Layout 안내 프레임 수동 갱신: |
  - 포기한 것: 피그마 Foundations / Layout 프레임의 크기 변수 목록이 변수와 함께 자동으로 바뀌는 것.
  - 이유: 목록은 만든 시점의 변수 이름과 값을 글자로 적은 것이다.
  - 영향: 크기 변수를 바꾸면 이 목록도 손으로 고친다.
  - 관련: [[디자인 기반:크기 변수]]
피그마 MCP 제약: |
  - 포기한 것: 피그마 MCP로 버전 기록 저장(`saveVersionHistoryAsync`)과 Inspect CSS(`getCSSAsync`)를 쓰는 것.
  - 이유: 피그마 MCP 환경에서 지원하지 않는다.
  - 영향: 피그마를 크게 고치기 전에는 사람이 피그마에서 버전을 저장한다. MCP로 고친 내용은 바꾸기 전 값을 기록해 되돌릴 수 있게 한다.
  - 관련: [[피그마 연동:피그마 플러그인]]
피그마 API 덮어쓰기 함정: |
  - 포기한 것: 피그마 컴포넌트 구조를 바꿀 때 인스턴스에서 덮어쓴 값이 저절로 남는 것.
  - 이유: 피그마 플러그인 API에 다음 동작이 있다.
    - 원본 컴포넌트의 너비·높이를 변수에 연결하면, 그 축에서 인스턴스가 덮어쓴 크기와 크기 방식(FILL 등)이 지워지고 원본 값으로 돌아간다. 배율로 줄인 인스턴스(작업 표시줄 미리보기)는 남는다.
    - 프레임을 인스턴스로 바꾸거나 레이어를 옮기면, 그 아래에서 화면이 덮어쓴 글자·아이콘·보이기·속성·크기가 초기화된다.
    - 아이콘을 `Icon` 인스턴스 교체 속성으로 바꿔 끼우면 크기 변수 연결이 남는다. 중첩된 아이콘 레이어의 원본 컴포넌트를 직접 바꾸면 크기 변수 연결이 빠지고, 인스턴스 안쪽 레이어에는 API로 변수를 연결해도 오류 없이 무시된다.
    - 글자 내용(`characters`)을 다시 쓰면 첫 글자의 글자 스타일이 전체에 적용된다. 한글 구간이 Open Sans가 되어 보이지 않으므로 `Hangul/*` 스타일을 다시 입혀야 한다.
    - 중첩 인스턴스 안쪽 레이어에는 부모 컴포넌트 속성을 연결할 수 없다. 그래서 부모 속성 대신 노출한 중첩 인스턴스(WindowTitle 등)의 속성을 쓴다([[디자인 시스템:컴포넌트 조립 규칙]]).
    - BOOLEAN 속성의 기본값은 컴포넌트 세트 전체가 하나다. 변형마다 기본값을 다르게 둘 수 없다.
  - 영향: 구조를 바꾸는 피그마 작업은 바꾸기 전에 01·02·03 페이지의 덮어쓴 값을 기록하고, 바꾼 뒤 되돌리고, 전·후 화면을 비교한다. 글자를 고친 뒤에는 한글 구간이 Open Sans로 남은 곳이 없는지 확인한다. 아이콘은 언제나 `Icon` 속성으로 바꿔 끼운다. 플러그인 검사는 속성으로 바꿔 끼운 아이콘의 크기 연결을 바르게 읽어야 한다([[미결 사항:피그마 플러그인 고칠 것]]).
  - 다시 시도할 조건: 피그마가 이 동작을 고칠 때.
  - 관련: [[디자인 기반:크기 변수]], [[디자인 시스템:아이콘 자리]]
감싼 바탕의 슬롯 다시 열기: |
  - 포기한 것: 다른 바탕을 감싸는 컴포넌트가 안쪽 바탕의 슬롯을 자기 이름의 슬롯으로 다시 여는 것. 예: Menu의 `Items` 슬롯.
  - 이유: 피그마는 안쪽 인스턴스의 슬롯 안에 둔 슬롯을 일반 프레임으로 바꾸고, 그 자리에 슬롯 속성을 연결하지 못하게 한다.
  - 영향: 조립은 한 단계 더 안쪽에 있는 바탕의 슬롯(Flyout `Content`, ShellSurface 본문 등)을 바로 채운다.
  - 다시 시도할 조건: 피그마가 중첩 인스턴스의 슬롯 안에 슬롯을 두는 것을 지원할 때.
  - 관련: [[디자인 시스템:컴포넌트 조립 규칙]], [[디자인 시스템:조립]]
