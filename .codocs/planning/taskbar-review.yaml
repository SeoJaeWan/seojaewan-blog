_codocs:
  id: taskbar-review
  name: 작업 표시줄 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10에 구현한 작업 표시줄을 실제 Windows 11 작업 표시줄과 비교해 찾은 차이와, 사람과 논의해 정한 해결이다.
  작업 표시줄 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 지우고, 마지막 PR에서 이 문서를 지운다. 피그마 작업은 피그마 세션이 한다([[피그마 작업 검수:11. 작업 표시줄 피그마 작업]]).
  재질 불투명도(옛 1번)는 [[피그마 작업 검수:1. 재질 값]]으로, 9번의 즐겨찾기 본체는 [[파일 탐색기 검수:14. 즐겨찾기]]로 옮겼다.
  아직 코드·문서·피그마는 아무것도 바꾸지 않았다.
세션 사이 약속: |
  공통 약속은 [[피그마 작업 검수:세션 사이 약속]]을 따른다. 이 문서에만 해당하는 것은 다음이다.
  - 맡은 컴포넌트 PR: `WindowPreview`(`feat/figma-window-preview`), `SearchBox`(`feat/figma-search-box`). 조립 PR은 `feat/figma-patterns-taskbar`다.
  - 기다릴 PR: 피그마 세션의 `feat/figma-tokens`(4번의 메뉴 폭), `feat/figma-icon-button`(5번, 닫기 버튼을 `IconButton` 변형으로 정했을 때), `feat/figma-menu-item`(9번의 압정 해제 버튼, `MenuItem` 변형으로 정했을 때). 파일 탐색기 세션의 `feat/explorer-favorites-store`(9번).
  - 먼저 병합해 줄 PR: 없다.
비교 방법: |
  - 실제 화면: 사람이 녹화한 영상 세 개(1920×1080). ① 작업 표시줄 전체(122초: 앱 끌기, 앱·빈 곳 우클릭, 창 미리보기, 호버) ② 탐색기 탐색 창 즐겨찾기(60초: 고정·제거·끌기) ③ 탐색기·Chrome 점프 목록(63초: 호버, 항목 우클릭, 항목 클릭, 작업 표시줄로 끌기). 프레임을 0.5~2초 간격으로 뽑아 2~4배로 확대해 봤다.
  - 구현: 개발 서버(1920×1080)를 Playwright로 열어 같은 동작을 재현해 캡처하고 치수를 쟀다. 색은 구현의 배경화면을 영상 프레임으로 바꿔 같은 배경 위에서 픽셀 값을 비교했다.
  - 맞는 것: 작업 표시줄 높이 48px, 버튼 40px·간격 44px, 실행·활성 표시 크기, 검색칸 크기, 시계 글자, 메뉴·미리보기를 작업 표시줄 위 끝에서 12px 띄우는 간격, 메뉴의 버튼 가운데 정렬·줄 높이·아이콘 들여쓰기, 미리보기 축소 화면 높이.
  - 빈 곳·시계 우클릭 메뉴(작업 관리자, 작업 표시줄 설정), 알림 종, 앱 배지, 다른 앱의 점프 목록은 [[작업 표시줄:구성]]·[[작업 표시줄:우클릭 메뉴]]에서 두지 않기로 해 차이로 세지 않았다.
2. 앱 우클릭 메뉴 구분선: |
  - 차이: 실제는 앱 이름·고정·창 닫기 사이에 구분선이 없고, 위에 점프 목록이 있을 때만 그 목록과 앱 묶음 사이에 구분선이 있다. 구현은 앱 이름 바로 아래에 구분선이 있다.
  - 정한 해결: `app-menu-entries.ts`에서 앱 이름 아래 `MENU_SEPARATOR`를 빼고, 점프 목록(9·10번)이 있을 때 목록과 앱 묶음 사이에만 둔다. 피그마 `Menu/TaskbarApp`의 구분선도 같이 고친다([[피그마 작업 검수:11. 작업 표시줄 피그마 작업]]).
3. 고정 해제 문구: |
  - 차이: 실제는 앱 메뉴·점프 목록 모두 "작업 표시줄에서 제거", 구현은 "작업 표시줄에서 고정 해제"다.
  - 정한 해결: `menu-items.ts`의 `taskbarPinMenuItem` 문구를 "작업 표시줄에서 제거"로 바꾼다. 작업 표시줄 앱 메뉴와 Start "모두" 목록 메뉴가 함께 바뀐다. "시작 화면에서 고정 해제"는 실제 문구라 그대로 둔다. 이 문구를 확인하는 스토리·테스트도 고친다.
4. 작업 표시줄 메뉴 너비: |
  - 차이: 실제 작업 표시줄 앱 메뉴·점프 목록은 내용과 상관없이 약 294px로 일정하다(293~295px). 구현은 모든 메뉴가 `size/menu/width` 250px다.
  - 정한 해결: 피그마 Foundations에 `size/menu/taskbar-width`(294px)를 더하고 작업 표시줄 메뉴 조립(앱 메뉴·점프 목록)만 이 폭을 쓴다. 다른 메뉴는 250px 그대로 둔다(작업 표시줄 검수 범위 밖).
  - 맡는 세션: 토큰은 피그마 세션이 토큰 PR로 넣는다([[피그마 작업 검수:4. 그 밖의 토큰]]). 작업 표시줄 세션은 토큰 PR이 병합된 뒤 작업 표시줄 메뉴에 이 폭을 적용한다.
5. 미리보기 카드 호버와 닫기 버튼: |
  - 차이: 실제 카드는 호버하면 밝아진다(`#f3f7fb` → `#fbfdfe`, 흰색 약 70% 덧칠). 구현은 검정 4%를 덧칠해 어두워진다. 실제 닫기 버튼은 호버하면 빨간 바탕 `#c42b1c`에 흰 X이고, 구현은 `IconButton subtle`이라 회색이다.
  - 정한 해결: 피그마 `WindowPreview`의 Hover를 `color/white/70` 덧칠로, 닫기 버튼을 창 제목 줄 닫기와 같은 빨강 호버(`color/red/56`, 누름 `color/red/56/90`)로 바꾼다. `IconButton`에 빨강 변형을 더할지 `CaptionButton`을 쓸지는 피그마 구조를 보고 피그마 세션이 정한다([[피그마 작업 검수:6. IconButton]]).
6. 미리보기 카드 폭과 축소 화면: |
  - 차이: 실제는 축소 화면 높이(약 106~108px)가 일정하고 카드 폭이 창 비율을 따른다(넓은 창 약 208px, OBS 약 158px, 카카오톡 약 100px). 축소 화면은 창 그림이 칸을 가득 채우고 회색 여백·테두리·둥근 모서리·그림자가 없다. 구현은 카드 폭이 208px 고정이고 축소 화면 칸에 회색 바탕·안쪽 테두리·둥근 모서리가 있어 창 그림 둘레에 여백이 보인다.
  - 정한 해결: 카드 폭 = 축소 화면 높이(`size/window-preview/thumbnail-height`) × 창 비율 + 좌우 여백, 최대 `size/window-preview/width`(208px)로 한다. 축소 화면 칸의 바탕·테두리·둥글기를 빼고 창 그림이 칸을 꽉 채우게 줄인다. 제목은 지금처럼 말줄임으로 자른다. 피그마 `WindowPreview`부터 고친다([[피그마 작업 검수:11. 작업 표시줄 피그마 작업]]).
  - 문서: [[작업 표시줄:창 미리보기]]에 카드 폭 규칙을 더하고, [[작업 표시줄:모바일]]의 "카드를 원래 너비로 놓은 너비"를 각 카드의 비율 폭으로 읽게 고친다.
7. 끌어서 순서 바꿀 때 버튼 모양: |
  - 차이: 실제는 끄는 아이콘이 바탕 판 없이 따라오고, 끄는 동안 그 앱의 실행 표시가 사라졌다가 놓으면 돌아온다. 구현은 끄는 버튼에 호버 바탕이 남고(포인터가 버튼 위에 있어 `:hover`가 풀리지 않음) 실행 표시도 그대로다(`taskbar-apps-layer.tsx`가 끌기 중 표시를 바꾸지 않음. 화면은 개발 서버가 꺼져 코드로만 확인).
  - 정한 해결: 끄는 동안 그 버튼의 호버·눌림 바탕을 끄고 실행 표시를 숨긴다. 바탕은 [[항목 조작:순서 바꾸기 끌기]]("끌기를 시작하면 눌림 바탕이 사라진다")를 지키지 않은 버그라 문서는 그대로다.
  - 문서: 실행 표시를 숨기는 규칙을 [[작업 표시줄:고정과 순서]]에 더한다.
8. 시작 로고와 검색 돋보기: |
  - 차이: 실제 시작 로고는 24px 칸을 거의 채운다(약 23px). 구현은 약 19px다. 실제 검색 돋보기는 굵고 거의 검정이며 검색칸 왼쪽 끝에서 약 10px, 글자는 약 36px에서 시작한다. 구현은 가는 선(`ic_fluent_search_16_regular`), 검정 61%, 아이콘 16px·글자 39px 안쪽이다.
  - 원인: 자산 `logo-windows.svg`가 48×48 칸에 사방 4px 여백을 두어 로고가 80%만 차지한다. 작업 표시줄 검색칸이 `px-spacing-lg`(16px)를 쓴다.
  - 정한 해결: 피그마 로고 자산 프레임을 로고에 맞게 여백 없이 줄여 다시 내보내고, 같은 자산을 쓰는 재부팅 화면 로고는 인스턴스 크기를 줄여 지금 보이는 크기를 지킨다. `SearchBox` taskbar 변형은 아이콘을 `ic_fluent_search_16_filled`, 색을 `color/black/89`로, 왼쪽 여백을 `spacing/md`(12px)로 바꾼다(12 + 아이콘 16 + 간격 8 = 36px). 호버·포커스의 색 돋보기 강조는 그대로 둔다.
  - 피그마: [[피그마 작업 검수:11. 작업 표시줄 피그마 작업]], [[피그마 작업 검수:13. 자산]]
9. 탐색기 점프 목록: |
  실제 탐색기 앱 메뉴 위에는 "고정됨" 점프 목록이 있고, 이 목록은 탐색기 탐색 창의 "즐겨찾기"와 같은 목록이다. 우리도 같은 구성으로 새로 만든다.
  목록 자체(항목, 저장, 고정·제거·순서)와 탐색 창·끌기·폴더 메뉴는 [[파일 탐색기 검수:14. 즐겨찾기]]에 있고 파일 탐색기 세션이 만든다. 작업 표시줄 세션은 그 목록을 읽어 점프 목록만 만든다.
  - 점프 목록 모양: 머리글 "고정됨", 폴더 아이콘과 이름. 목록이 비면 머리글과 구분선을 함께 숨긴다. 그 아래 구분선, 앱 묶음(앱 이름 · 작업 표시줄에서 제거 · 창 닫기).
  - 점프 목록 항목: 호버하면 줄 전체가 칠해지고 오른쪽 끝에 압정 해제 버튼이 따로 나온다(누르면 목록에서 뺀다). 누르면 그 폴더를 연 새 탐색기 창을 띄운다(창이 열려 있어도 새 창). 우클릭하면 우클릭한 자리에 메뉴 "열기 / 구분선 / 이 목록에서 고정 해제"를 띄우고 점프 목록은 닫지 않는다.
  - 실제와 다르게 하지 않는 것: Windows 11은 작업 표시줄 탐색기 버튼에 폴더를 끌어 놓아 고정할 수 없다(🚫). 그래서 넣는 방법은 탐색 창 끌기와 우클릭 메뉴 둘뿐이다.
  - 순서: 이 항목은 맨 뒤에 한다. 파일 탐색기 세션의 `feat/explorer-favorites-store`(즐겨찾기 목록과 저장)가 병합된 것을 확인한 뒤 시작한다.
  - 피그마: [[피그마 작업 검수:11. 작업 표시줄 피그마 작업]], [[피그마 작업 검수:8. MenuItem]]
  - 문서: [[작업 표시줄:우클릭 메뉴]](점프 목록). 새 기능이라 기능 문서를 먼저 고치고(허락받음) 구현한다.
10. Chrome 점프 목록과 앱 이름: |
  - 실제: 머리글 "작업" 아래 "새 창(N) / 새 시크릿 창(I)", 구분선, "Google Chrome / 작업 표시줄에서 제거 / 창 닫기". 기록이 있으면 "자주 방문" 칸이 "작업" 위에 나온다.
  - 정한 해결: 맨 위에 "자주 방문"을 두고 [[Chrome:새 탭 페이지]]와 같은 Blog 최신 글 6개(Project·About과 휴지통에 있는 글 제외, 휴지통에 넣으면 다음 글이 채움)를 글 아이콘과 함께 보인다. 누르면 그 글을 Chrome 맨 앞 창의 새 탭으로 열고, 창이 없으면 새 창으로 연다. 고정·제거는 두지 않고 보여 주기만 한다. 그 아래 "작업"에는 "새 창"만 둔다(시크릿 창 기능이 없음. 앱 이름과 같은 동작). 키보드 밑줄 표시 (N)은 붙이지 않는다.
  - 앱 이름: `taskbar-apps.ts`의 Chrome 이름을 "Google Chrome"으로 바꾼다. 작업 표시줄 툴팁·메뉴·Start 등 이 이름을 쓰는 곳이 모두 바뀐다. [[Chrome 검수]]에는 겹치는 항목이 없다.
  - 피그마: [[피그마 작업 검수:11. 작업 표시줄 피그마 작업]]
  - 문서: 새 기능이라 기능 문서를 먼저 고치고(허락받음) 구현한다.
작업 순서: |
  시작 전에 작업 범위를 끝까지 점검해 물을 것을 먼저 모은다.
  1. 바로 할 수 있는 것: 2번의 코드, 3·7번, 10번의 앱 이름, 문서 변경.
  2. 토큰 PR(`feat/figma-tokens`) 뒤: 4번.
  3. 컴포넌트·조립 PR 뒤: 5·6번(`WindowPreview`), 8번(`SearchBox`, 로고 자산), 10번의 Chrome 점프 목록.
  4. 다른 영역 세션의 PR을 기다리는 것(맨 뒤): 9번. `feat/explorer-favorites-store` 병합을 확인한 뒤 한다.
