_codocs:
  id: taskbar-review
  name: 작업 표시줄 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10에 구현한 작업 표시줄을 실제 Windows 11 작업 표시줄과 비교해 찾은 차이와, 사람과 논의해 정한 해결이다.
  작업 표시줄 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 지우고, 마지막 PR에서 이 문서를 지운다. 피그마 작업은 피그마 세션이 한다([[피그마 작업 검수:11. 작업 표시줄 피그마 작업]]).
  재질 불투명도(옛 1번)는 [[피그마 작업 검수:1. 재질 값]]으로, 9번의 즐겨찾기 본체는 [[파일 탐색기 검수:14. 즐겨찾기]]로 옮겼다.
  2·3·7번과 10번의 앱 이름은 `fix/taskbar-review` PR에서, 4·5·6·8·10번은 컴포넌트 PR(`WindowPreview`, `SearchBox`)과 조립 PR(`feat/figma-patterns-taskbar`)에서 끝내 지웠다. 남은 것은 9번뿐이다.
세션 사이 약속: |
  공통 약속은 [[피그마 작업 검수:세션 사이 약속]]을 따른다. 이 문서에만 해당하는 것은 다음이다.
  - 맡은 컴포넌트 PR과 조립 PR은 모두 병합했다.
  - 기다릴 PR: 없다. 9번이 기다리던 `feat/figma-menu-item`(압정 해제 버튼)과 `feat/explorer-favorites-store`(즐겨찾기 목록과 저장)는 병합됐다.
  - 먼저 병합해 줄 PR: 없다.
비교 방법: |
  - 실제 화면: 사람이 녹화한 영상 세 개(1920×1080). ① 작업 표시줄 전체(122초: 앱 끌기, 앱·빈 곳 우클릭, 창 미리보기, 호버) ② 탐색기 탐색 창 즐겨찾기(60초: 고정·제거·끌기) ③ 탐색기·Chrome 점프 목록(63초: 호버, 항목 우클릭, 항목 클릭, 작업 표시줄로 끌기). 프레임을 0.5~2초 간격으로 뽑아 2~4배로 확대해 봤다.
  - 구현: 개발 서버(1920×1080)를 Playwright로 열어 같은 동작을 재현해 캡처하고 치수를 쟀다. 색은 구현의 배경화면을 영상 프레임으로 바꿔 같은 배경 위에서 픽셀 값을 비교했다.
  - 맞는 것: 작업 표시줄 높이 48px, 버튼 40px·간격 44px, 실행·활성 표시 크기, 검색칸 크기, 시계 글자, 메뉴·미리보기를 작업 표시줄 위 끝에서 12px 띄우는 간격, 메뉴의 버튼 가운데 정렬·줄 높이·아이콘 들여쓰기, 미리보기 축소 화면 높이.
  - 빈 곳·시계 우클릭 메뉴(작업 관리자, 작업 표시줄 설정), 알림 종, 앱 배지, 다른 앱의 점프 목록은 [[작업 표시줄:구성]]·[[작업 표시줄:우클릭 메뉴]]에서 두지 않기로 해 차이로 세지 않았다.
9. 탐색기 점프 목록: |
  실제 탐색기 앱 메뉴 위에는 "고정됨" 점프 목록이 있고, 이 목록은 탐색기 탐색 창의 "즐겨찾기"와 같은 목록이다. 우리도 같은 구성으로 새로 만든다.
  목록 자체(항목, 저장, 고정·제거·순서)와 탐색 창·끌기·폴더 메뉴는 [[파일 탐색기 검수:14. 즐겨찾기]]에 있고 파일 탐색기 세션이 만든다. 작업 표시줄 세션은 그 목록을 읽어 점프 목록만 만든다.
  - 점프 목록 모양: 머리글 "고정됨", 폴더 아이콘과 이름. 목록이 비면 머리글과 구분선을 함께 숨긴다. 그 아래 구분선, 앱 묶음(앱 이름 · 작업 표시줄에서 제거 · 창 닫기).
  - 점프 목록 항목: 호버하면 줄 전체가 칠해지고 오른쪽 끝에 압정 해제 버튼이 따로 나온다(누르면 목록에서 뺀다). 누르면 그 폴더를 연 새 탐색기 창을 띄운다(창이 열려 있어도 새 창). 우클릭하면 우클릭한 자리에 메뉴 "열기 / 구분선 / 이 목록에서 고정 해제"를 띄우고 점프 목록은 닫지 않는다.
  - 실제와 다르게 하지 않는 것: Windows 11은 작업 표시줄 탐색기 버튼에 폴더를 끌어 놓아 고정할 수 없다(🚫). 그래서 넣는 방법은 탐색 창 끌기와 우클릭 메뉴 둘뿐이다.
  - 구조: 앱 메뉴 앞에 점프 목록을 붙이는 자리(`getAppJumpList`, `getAppMenuEntries`의 `jumpList`)와 머리글 묶음(메뉴 항목 `kind: 'group'`)은 10번에서 만들었다. 탐색기는 `getAppJumpList`의 `file-explorer` 자리에 목록을 넣는다.
  - 피그마: [[피그마 작업 검수:11. 작업 표시줄 피그마 작업]], [[피그마 작업 검수:8. MenuItem]]. 그림은 `menu/taskbar-jump-list-explorer`다.
  - 문서: [[작업 표시줄:우클릭 메뉴]](점프 목록). 새 기능이라 기능 문서를 먼저 고치고(허락받음) 구현한다.
작업 순서: |
  시작 전에 작업 범위를 끝까지 점검해 물을 것을 먼저 모은다.
  1. 9번. 기다릴 PR이 없어 바로 할 수 있다. 끝나면 이 문서를 지운다.
