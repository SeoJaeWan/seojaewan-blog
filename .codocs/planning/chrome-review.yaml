_codocs:
  id: chrome-review
  name: Chrome 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10에 구현한 Chrome 창의 크롬(탭 줄·도구 모음·주소창)을 실제 Windows Chrome과 비교해 찾은 차이와, 사람과 논의해 정한 해결이다.
  Chrome 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 지우고, 마지막 PR에서 이 문서를 지운다. 피그마 작업은 피그마 세션이 한다([[피그마 작업 검수:9. Chrome 피그마 작업]]).
  아직 코드·문서·피그마는 아무것도 바꾸지 않았다.
세션 사이 약속: |
  공통 약속은 [[피그마 작업 검수:세션 사이 약속]]을 따른다. 이 문서에만 해당하는 것은 다음이다.
  - 맡은 컴포넌트 PR: `BrowserTab`(`feat/figma-browser-tab`), `BrowserTabStrip`(`feat/figma-browser-tab-strip`), `BrowserToolbar`(`feat/figma-browser-toolbar`), `AddressBar`(`feat/figma-address-bar`). 조립 PR은 `feat/figma-patterns-chrome`이다.
  - 기다릴 PR: 피그마 세션의 `feat/figma-icon-button`(2·7번).
  - 먼저 병합해 줄 PR: 없다.
비교 방법: |
  - 실제 화면: 사람이 녹화한 영상(55초). 새 탭, 탭 추가, 주소창 입력과 추천 목록, 검색 결과, 창 최대화·복원, 비활성 창이다. 영상에서 2초 간격으로 프레임을 뽑아 2~4배로 확대해 봤다.
  - 구현: 개발 서버(1920×1080)에서 Chrome 창을 열어 탭 추가, 최대화, 주소창 포커스·입력, + 호버, 비활성 창을 Playwright로 재현해 캡처하고 치수를 쟀다.
  - 녹화한 Chrome은 사용자 지정 테마(복숭아색)라 색은 비교하지 않고 모양과 치수만 봤다.
  - 맞는 것: 탭 줄 높이 40px, 탭 너비 약 240px, 탭 위 여백 6px, 뒤로·앞으로·새로고침 위치, 주소창 높이(실제 35, 구현 36), 창 버튼 간격 46px, 비활성 창의 흐린 창 버튼, 주소창 포커스의 2px 테두리, 탭 사이 구분선과 활성 탭 옆 구분선 숨김.
  - 북마크 별, 확장 프로그램, 프로필, Gemini, AI 모드는 [[Chrome:구성]]에서 두지 않기로 해 차이로 세지 않았다.
1. 활성 탭 아래 모서리 곡선: |
  - 차이: 실제 활성 탭은 아래 양 끝이 바깥으로 오목하게 휘어 도구 모음과 이어진다. 구현은 위만 둥글고 아래가 직각이라 탭이 탭 줄 위에 따로 얹힌 것처럼 보인다.
  - 원인: 피그마 `BrowserTab` `State=Active`부터 위만 둥근 사각이고, 코드(`rounded-t-radius-overlay bg-color-white`)가 그대로 옮겼다.
  - 정한 해결: 피그마 `BrowserTab` `State=Active`의 아래 양옆, 탭 밖에 오목한 모서리 조각 두 개를 그린다(칠은 탭 바탕과 같고 반지름은 위 모서리와 같다). 코드는 가상 요소 두 개를 원형 그라디언트로 칠한다. 활성 탭 왼쪽 탭은 이미 구분선을 그리지 않아 겹치지 않는다.
  - 확인할 것: 임의 값 클래스가 lint를 통과하는지. 막히면 토큰으로 나타낼 방법을 찾는다.
2. 새 탭(+) 버튼 호버 모양: |
  - 차이: 실제는 호버하면 원형 바탕(지름 약 28px), 구현은 32px 둥근 사각(모서리 4px)이다. 실제는 도구 모음의 뒤로·앞으로·새로고침·⋮도 원형이다.
  - 원인: +와 도구 모음 버튼이 모두 `IconButton` `Variant=Chrome`인데, 모든 변형이 같은 `rounded-radius-control`(4px)을 쓴다.
  - 정한 해결: 피그마 `IconButton` `Variant=Chrome`의 반지름만 원형으로 바꾼다. 크기는 32px 그대로 둔다(실제 28px과의 차이가 작고, 바꾸면 탭 줄·도구 모음 배치를 다시 맞춰야 한다).
  - 맡는 세션: `IconButton`은 다른 검수도 함께 고쳐 피그마와 디자인 시스템 코드를 모두 피그마 세션이 한다([[피그마 작업 검수:6. IconButton]]). Chrome 세션은 `feat/figma-icon-button`이 병합된 뒤 Chrome 창에서 모양을 확인한다.
3. 아이콘 선 두께: |
  - 차이: 탭 ×, +, 뒤로·앞으로·새로고침, ⋮ 아이콘이 실제가 더 굵다(20px에서 2px에 가까움). 색은 구현의 `#474747`이 실제와 같다.
  - 원인: [[디자인 기반:자산]]이 UI 아이콘을 모두 Fluent UI System Icons로 정했다. Fluent는 Windows 아이콘이라 선이 가늘고, 실제 Chrome은 Google의 Material 계열 아이콘을 쓴다.
  - 정한 해결: Chrome 창 안의 아이콘만 Material Symbols(Apache 2.0)에서 가져온다. `BrowserToolbar`(뒤로·앞으로·새로고침·⋮), `BrowserTabStrip`(+), `BrowserTab`(×)을 바꾸고, 6·7·8번의 새 아이콘(돋보기, ⌄, 문서)도 여기서 가져온다. 창 버튼(최소화·최대화·닫기)은 실제 Chrome도 Windows 모양이라 그대로 둔다.
  - 피그마: [[피그마 작업 검수:9. Chrome 피그마 작업]], [[피그마 작업 검수:13. 자산]]
  - 문서: [[디자인 기반:자산]]에 "Chrome 창 안의 아이콘은 Material Symbols" 예외를 더한다(허락받음).
4. 도구 모음 아래 구분선: |
  - 차이: 실제는 도구 모음과 페이지 사이에 연한 1px 선이 있다. 구현은 없어서 흰 도구 모음과 흰 페이지가 경계 없이 이어진다.
  - 원인: 피그마 `BrowserToolbar`에 아래 선이 없고, 코드는 바탕색만 칠한다.
  - 정한 해결: 피그마 `BrowserToolbar`에 아래쪽 1px 안쪽 선을 넣는다. 색은 탭 구분선 계열의 이미 있는 색 변수를 쓴다. 안쪽 선이라 높이는 그대로이고 데스크톱·모바일 Chrome 창 모두에 들어간다.
5. 주소창 추천 목록 모양: |
  - 차이: 실제는 입력하면 입력 줄과 추천 목록이 틈 없는 한 장의 카드로 합쳐지고 그림자도 하나다. 구현은 입력칸(그림자 있음)과 추천 목록(그림자 있음)이 약 4px 떨어진 두 상자다.
  - 원인: 조립 `Chrome/AddressSuggestions`가 `AddressBar`(Suggesting, 자기 바탕·그림자)를 트리거로 두고 그 아래에 `Flyout`을 따로 붙인다.
  - 정한 해결: 피그마 `AddressBar` `Suggesting`의 바탕·그림자를 없애 투명한 입력 줄로 하고, 조립의 열린 모습은 Flyout 한 장이 입력 줄까지 감싸는 그림으로 그린다. 코드는 Flyout을 주소창 높이만큼 위로 올려 그만큼 위 안쪽 여백을 두고, 주소창을 그 위 층에 둔다. 입력칸은 지금의 `input` 하나 그대로라 포커스와 접근성 구조는 바뀌지 않는다.
  - 확인할 것: 실제의 고른 줄 왼쪽 강조 막대가 `ListItem` Selected 모양에 이미 있는지 작업 때 확인해 맞춘다. 첫 줄을 미리 고르지 않는 것은 [[Chrome:주소창]] 그대로 둔다.
6. 새 탭에서 빈 주소창: |
  - 차이: 실제는 새 탭의 빈 주소창에 검색 엔진 아이콘과 안내 문구를 보인다. 사이트 정보 아이콘은 주소가 있을 때만 나온다. 구현은 (i) 아이콘만 있고 문구가 없어 빈 막대처럼 보인다.
  - 원인: `AddressBar`에 안내 문구 속성이 없고, 아이콘은 입력 중이면 돋보기·아니면 (i) 두 가지뿐이다.
  - 정한 해결: 피그마 `AddressBar`에 글자 속성 `Placeholder`를 열고 주소가 빈 모양(돋보기 + 흐린 안내 문구)을 그린다. 문구는 새 탭 검색창과 같은 "글 검색 또는 URL 입력"이다([[Chrome:새 탭 페이지]]에서 둘이 같이 동작한다). G 로고는 상표라 쓰지 않는다. 실제 Chrome도 Google이 아닌 검색 엔진이면 돋보기를 보인다.
  - 문서: [[Chrome:주소창]]의 "새 탭 페이지에서는 비어 있다"를 "비어 있고 돋보기와 안내 문구 '글 검색 또는 URL 입력'을 보인다"로 고친다(허락받음).
7. 탭 검색(⌄) 버튼: |
  - 차이: 실제 Windows Chrome은 탭 줄 맨 왼쪽에 ⌄ 버튼(약 28px, 둥근 사각 바탕)이 있어 탭이 그만큼(약 40px) 오른쪽에서 시작한다. 구현에는 없다.
  - 원인: [[Chrome:구성]]의 탭 표시줄이 "탭 + 새 탭 버튼"뿐이고, 두지 않는 목록에도 없어 정하지 않은 채 빠졌다.
  - 정한 해결: 버튼을 둔다. 탭 검색은 북마크·프로필과 달리 이 창이 가진 탭 기능이고, 모든 실제 Chrome 창 왼쪽 위에 늘 보인다. 누르면 열린 탭 목록 메뉴를 열고, 탭을 누르면 그 탭으로 옮긴다. 실제의 검색칸과 최근에 닫은 탭은 두지 않는다. `MenuButton`·`MenuPopup`으로 만든다.
  - 피그마: [[피그마 작업 검수:9. Chrome 피그마 작업]]
  - 문서: [[Chrome:구성]]에 탭 검색 버튼과 메뉴 동작을 더한다(허락받음).
8. 탭 파비콘: |
  - 차이: 실제 탭 파비콘은 진해서 흰 활성 탭 위에서도 또렷하다. 구현은 흰 종이 그림이라 흰 활성 탭 위에서 거의 사라지고 회색 탭 위에서도 흐리다.
  - 원인: 탭 파비콘이 탐색기용 문서 아이콘(`images/file-document`, 256px 래스터)을 16px로 줄여 쓴다.
  - 정한 해결: Material Symbols `description`(진한 회색 선, 도구 모음 아이콘과 같은 색)으로 바꾼다. "탭 아이콘은 페이지와 상관없이 글 아이콘"이라는 [[Chrome:구성]] 규칙은 그대로다. 주소창 추천 목록의 글 줄 아이콘도 같은 자산을 쓰므로 함께 바꾼다.
  - 피그마: [[피그마 작업 검수:9. Chrome 피그마 작업]]
작업 순서: |
  시작 전에 작업 범위를 끝까지 점검해 물을 것을 먼저 모은다.
  1. 바로 할 수 있는 것: 문서 변경(3·6·7번, 허락받음), 7번의 탭 목록 메뉴 동작 가운데 그림과 상관없는 코드.
  2. 토큰 PR(`feat/figma-tokens`) 뒤: 해당 없음. 4번의 선은 이미 있는 색 변수를 쓴다.
  3. 컴포넌트·조립 PR 뒤: 1·3·4·5·6·7·8번. 피그마 세션이 연 자기 컴포넌트 PR과 조립 PR의 코드를 처리한다. 2번과 7번의 ⌄ 버튼은 `feat/figma-icon-button` 병합을 확인한 뒤 한다.
  4. 다른 영역 세션의 PR을 기다리는 것: 없다.
