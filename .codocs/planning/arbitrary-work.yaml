  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  2026-10-26 작업에서 생긴 아래 항목이 검토를 기다린다. 이어서 할 일은 [[남은 작업]]에 있다.
2026-10-26 작업: |
  | 영역 | 정한 것 |
  |---|---|
  | 코드 구조 | `desktop`을 `DesktopWallpaper`·`DesktopIcons`로 나눴다(배경화면은 작업 표시줄 뒤까지 깔려 한 덩어리면 DOM이 바뀜) |
  | 코드 구조 | 메뉴 스토리는 메뉴마다 `components/menu-<이름>/`, `ViewOptions` 메뉴는 Start "보기:" 메뉴라 `start-menu`로 |
  | lint | 순환 import 검사는 `shared`에만 건다(앱 전체면 lint 시간 +22%). `import type`만의 순환은 검사하지 않는다 |
  | 검사 도구 | 브랜치 이름 검사에서 `renovate/…`는 예외(Renovate PR이 막히지 않게) |
  | 검사 도구 | 모션 값 검사 허용 오차: 투명도·배율·트림 0.001, 이동 0.5px, 회전 0.5° |
  | 자산 | WebP 품질 80(배경화면 PSNR 42.8dB, 1:1 비교에서 차이가 보이지 않음) |
  | 피그마 | 새 이름 `color/search-gradient/cyan`·`blue`, `motion/duration/slower`, 칠 스타일 `Icon Color/Search Focus` |
  | 피그마 | 변형 `View=Default`/`View=Recycle bin`, `Folder=Recycle Bin`(기존 `Location=Recycle Bin` 표기). 휴지통 창은 데스크톱 변형만(모바일은 Blog에만 있는 관례) |
  | 피그마 | `SearchBox` `State=Pressed`는 Focused 모습에 아이콘만 0.8배. 모션 견본 설명은 자산 `icon-color/Search Focus`의 description에 적음 |
  | 피그마 | `MessageBox`를 새 조립 영역으로 만듦 |
  | 디자인 시스템 | `BrowserTabStrip` 탭 사이 간격 없음(피그마에 정보가 없음) |
