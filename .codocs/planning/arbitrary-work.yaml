_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.
CI 구조 개편(2026-11-11): |
  `ci/restructure-workflows` PR에서 스스로 정한 것이다. 정한 결정은 [[Git 작업 규칙:CI]], [[배포 환경:CI]], [[테스트 작성 규칙:E2E]]에 반영했다.

  워크플로 구조
  - `ci.yml` 맨 앞에 `Scope` 작업을 더했다. 돌지 않는 브랜치 판정을 스크립트(`scripts/ci-scope.mjs`)로 하고 단위 시험하려면 작업이 하나 필요하다. `Changeset`과 네 작업이 이 결과를 본다. 의존성 없는 스크립트라 러너에 깔린 Node로 돌리고 setup-node를 쓰지 않는다.
  - `main` push 판정: 병합 커밋 제목 `Merge pull request #N from <owner>/<branch>`에서 소유자 뒤 첫 `/` 다음을 브랜치로 읽는다(`git log`로 실제 꼴 확인). 제목이 이 꼴이 아니면 돈다.
  - 작업 이름: `Scope`, `Changeset`, `Static checks`(포맷·lint·타입), `Test`, `Build`, `E2E`, `Publish report`. `branch-name.yml`의 작업 이름은 `Branch name` 그대로 두었다.
  - 네 작업의 조건은 `!cancelled() && Scope가 true && Changeset이 success 또는 skipped`다. `main` push에서 건너뛴 `Changeset` 때문에 뒤 작업까지 건너뛰지 않게 하려는 것이다.
  - `Changeset` 작업은 루트 의존성만 설치하고(`--filter seojaewan-blog`) pnpm 캐시를 쓰지 않는다(`Branch name`과 같은 이유).
  - `docs/` 파일 검사는 `Branch name` 작업 안의 단계(`Docs branch files`)로 두었다. PR의 병합 커밋(`HEAD`)과 첫 부모(`HEAD^1`, 기준 브랜치)를 `git diff --no-renames`로 비교한다(`fetch-depth: 2`). 이름 변경은 옛 경로와 새 경로가 모두 나온다.
  - E2E 리포터는 명령 인자(`--reporter=github,html,json`)로 설정의 리포터(github, html)에 JSON을 더했다. JSON 경로는 `PLAYWRIGHT_JSON_OUTPUT_NAME`, html 보고서는 `PLAYWRIGHT_HTML_OPEN=never`로 연다. `turbo.json`의 `PLAYWRIGHT_*` 통과로 넘어간다. `apps/web` 설정은 바꾸지 않았다.
  - PR의 E2E는 `--trace on`을 주지 않는다. CI 설정이 `retries: 2`, `trace: 'on-first-retry'`라 실패한 케이스는 다시 돌 때 trace가 남는다. 실패 보고서는 그 trace를 담는다.
  - E2E 결과(JSON)가 없으면(fixture 빌드 실패 등) 보고서를 만들지 않고 올리지도 않는다. PR이 이 경우면 이전 실패 폴더도 그대로 둔다.

  캐시
  - Playwright 준비는 `Test`와 `E2E`가 함께 쓰므로 복합 액션(`.github/actions/setup-playwright`)으로 묶었다. 키는 `playwright-<OS>-<Playwright 버전>`이고 버전은 `playwright --version`에서 읽는다.
  - turbo 캐시는 turbo를 쓰는 작업(`Static checks`의 타입 검사, `Build`, `E2E`의 fixture 빌드)에만 둔다. `Test`는 vitest를 바로 돌려 turbo를 쓰지 않는다. 키는 작업마다 나눴다(`turbo-<작업>-<커밋>`). 나란히 도는 작업이 같은 키를 다투지 않게 하려는 것이다.
  - turbo 2.11의 캐시 폴더는 저장소 루트의 `.turbo/cache`다. 로컬에서 확인했다. git worktree에서는 본 저장소의 `.turbo/cache`에 쓴다(worktree 루트에는 생기지 않는다). CI는 일반 체크아웃이라 `.turbo/cache`가 맞다.
  - 새로 쓴 액션 버전: `actions/cache@v6.1.0`, `actions/download-artifact@v8.0.2`(2026-11-11 `gh api .../releases/latest`로 확인).

  보고서 게시
  - 게시는 `E2E` 뒤의 따로 된 작업 `Publish report`가 한다. 작업 단위로만 줄(`concurrency`)을 세울 수 있어 E2E와 나눴다. 보고서는 아티팩트(`scenario-cases-report`, 1일 보관)로 넘긴다.
  - GitHub의 `concurrency`는 기다리는 실행을 하나만 둔다. 게시가 셋 이상 겹치면 먼저 기다리던 게시가 취소된다(그 PR의 실패 보고서가 올라가지 않고 작업이 취소로 끝난다). 그래서 줄과 함께 `--force-with-lease`로 올리고, 거절되면 브랜치를 다시 받아 처음부터 한다(최대 5번). 이 덕에 줄이 없어도 다른 폴더를 지우지 않는다.
  - 알고 두는 한계: 게시가 셋 이상 겹쳐 대기하던 게시가 취소되는 경우는 드물고 다음 push에서 다시 올라가므로 그대로 둔다(2026-11-11 정함).
  - 브랜치는 `git commit-tree`로 부모 없는 커밋을 만들어 바꾼다(작성자 `github-actions[bot]`). 체크아웃이 남긴 자격 증명으로 올린다.
  - peaceiris/actions-gh-pages 같은 게시 액션은 쓰지 않았다. 부모 없는 커밋(`force_orphan`)과 다른 폴더 남기기를 함께 쓰는 것, 다른 실행이 먼저 올렸을 때 다시 하기, 7일 지난 폴더 지우기를 이 저장소 규칙대로 하려면 어차피 스크립트가 필요하다.
  - 사이트 루트에 `.nojekyll`을 둔다. trace 파일 이름이 `_`로 시작해(`_boot-on-load_1_.zip`) Jekyll이 빼 버리기 때문이다.
  - 실행 기록은 `E2E` 작업이 GitHub API로 `gh-pages`의 `history.json`을 받아 읽는다. 게시 작업에서 보고서를 다시 만들지 않으려는 것이다.
  - 통과한 PR은 GitHub API로 `failures/pr-<번호>`가 있는지 먼저 보고, 있을 때만 브랜치를 받아 지운다. 통과할 때마다 113MB를 받지 않으려는 것이다.
  - 실패 폴더의 올린 때는 폴더 안 `published.json`(`{ pr, publishedAt }`)에 적는다. 이 파일을 읽지 못한 폴더도 7일 지난 것으로 보고 지운다.
  - 실행 요약에는 PR 실패 보고서 주소와 함께 `main` 보고서 주소도 적는다.

  보고서 도구(`tools/scenario-cases`)
  - `build:report`에 `--only-failed`, `--pr`, `--no-history`, `--trace-viewer`를 더했다. 설정은 `table.json`의 `report`(`traceViewer`, `isFailedOnly`, `pr`)로 화면에 넘긴다.
  - "실패한 케이스만 담는" 보고서는 trace만 실패한 케이스의 것을 담고, 표와 통과·실패 수는 모든 케이스로 둔다. 통과율이 0%로 잘못 보이지 않게 하려는 것이다. 화면은 "실패만" 거르기를 켜고 열고, 제목에 PR 번호(PR 링크)와 `main` 보고서 링크를 보인다.
  - Trace Viewer를 복사한 까닭을 적은 주석(Access 때문에 외부 뷰어를 못 쓴다)은 Access가 없어져 "보고서를 만든 Playwright와 같은 버전의 뷰어로 같은 사이트에서 연다"로 바꿨다.

  그 밖
  - `scripts/check-changeset.mjs`는 Windows에서 `pnpm`을 부르도록 `shell: process.platform === 'win32'`를 더했다(로컬 시험용, CI 동작은 같다). `ci.yml`이 돌지 않는 글 동기화·버전 PR의 예외도 스크립트에 남겼다(결정대로).
  - `turbo.json`의 `test:e2e`에서 `E2E_PORT`를 뺐다. `apps/web/playwright.config.ts`는 `E2E_PORT` 읽기를 그대로 두고 주석만 "Playwright를 바로 실행할 때 쓴다, turbo는 넘기지 않는다"로 고쳤다. `webServer`의 포트 충돌 주석도 미니 PC 얘기를 뺐다. 이 때문에 `@seojaewan/web` patch changeset을 넣었다.
  - [[Git 작업 규칙:CI]]에서 ruleset·GitHub Pro 대안, 최신 `main` 재검사(strict) 줄을 지웠다. ruleset을 쓰지 않으므로 맞지 않게 됐다.
