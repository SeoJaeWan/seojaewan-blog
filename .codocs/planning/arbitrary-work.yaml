_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.
"#304 토큰 PR: 옛 토큰 이름을 쓰는 코드 고침": |
  `file-item/*/stroke-selected-focus`가 `stroke-focus`로 바뀌어, `file-item.tsx`와 `file-row.tsx`의 `border-file-item-*-stroke-selected-focus` 클래스를 `border-file-item-*-stroke-focus`로 고쳤다. 새 이름이 옛 이름에서 `selected-`만 빠진 것이라 대응이 분명해 사람에게 묻지 않고 정했다. 토큰 이름이 바뀌면 같은 PR에서 코드를 고친다는 [[피그마 연동:PR 흐름]]을 따랐다. 고치기 전 로컬 `pnpm lint`는 이 옛 클래스를 잡지 못하고 통과했다. 문서는 lint가 알려 준다고 하므로([[피그마 연동:PR 흐름]]) 실제 검사와 어긋나는지 따로 확인이 필요하다.
"#304 토큰 PR: cn.ts 토큰 이름 목록에 size 712 추가": |
  새 토큰 `size/712`(`--size-712`)가 생겨 `cn.test.ts`(tokens.css와 이름 목록이 같은지 확인)가 실패했다. 손으로 관리하는 `packages/design-system/src/cn.ts`의 `TOKEN_NAMES.size`에 `'712'`를 정렬 위치에 더했다. 이 목록은 생성 파일이 아니고 코드 주석이 `tokens.css`와 같아야 한다고 정하므로([[피그마 연동:토큰 사용 강제]]) 고치는 것이 맞다고 보았다. 토큰 PR이 이 목록까지 고쳐야 한다는 내용은 [[피그마 연동:PR 흐름]]에 없으므로, 문서에 적을지 검토가 필요하다.
"#281 Bookmark: 링크 아이콘 색을 text-fill-primary로 둠": |
  Bookmark의 `link icon`은 속성 없이 `ic_fluent_link_20_regular` 인스턴스를 16px로 쓰고, 피그마가 칠 변수를 따로 주지 않아 색이 어느 변수인지 MCP 결과로 알 수 없었다. 자산 설명이 "Glyph fill bound to text-fill/primary"라서 `text-text-fill-primary`로 정했고, 로컬 캡처 차이 그림에서 아이콘이 일치함을 확인했다. 글 본문 블록이라 [[Chrome:Notion 블록]]의 "색은 디자인 시스템 토큰"을 따랐다. 아이콘 자리를 속성으로 열지는 않았다. 피그마에 속성이 없고 쓰는 곳마다 바뀌지 않는 기능 아이콘이기 때문이다([[디자인 시스템:아이콘 자리]]).
"#284 CodeBlock: 코드를 children 슬롯으로 받고 Parity는 빈 자리 100을 넣음": |
  CodeBlock의 `code` 문자열 prop을 없애고 강조된 코드를 `children`으로 받게 했다([[남은 작업:1. 7단계 마무리]], [[기술 스택:글 본문 처리]]). 복사 단추는 그려진 `<code>`의 글자(`textContent`)를 복사한다. 코드 색은 `code-syntax-text`를 기본으로 두고, 강조는 쓰는 곳이 `text-code-syntax-*` span으로 칠한다. 앱의 `post-blocks.tsx`와 `post-body.tsx`는 문법 강조가 아직 없어(Shiki는 이 PR 범위가 아님) 코드 문자열을 그대로 children으로 넣는다.
  `Parity` 스토리는 피그마 CodeBlock 변형(`default`)과 같게 Code 슬롯을 비운 채 높이 100의 빈 자리를 넣는다. 피그마 PNG(`figma/components/code-block/default.png`)가 견본 코드가 없는 빈 슬롯이고 [[디자인 시스템:컴포넌트 조립 규칙]]이 컴포넌트에 예시를 채우지 않게 하므로, 견본 코드를 넣으면 차이 그림이 코드 줄 때문에 어긋난다. 높이 100은 피그마 슬롯의 고정 높이이고 같은 값의 크기 토큰이 없어 스토리 안에서만 인라인 style로 줬다. 견본 코드를 `code-syntax` 클래스로 칠한 모습은 `Highlighted` 스토리로 따로 두었다. 사람이 `Parity`를 견본 코드로 바꿀지, `size/100` 토큰을 더할지 검토가 필요하다.
"#283 Checkbox: 읽기 전용 표시로 구현": |
  [[Chrome:Notion 블록]]이 할 일 목록을 지원 블록으로만 적고 눌러 바꾸는지는 정하지 않는다. 피그마 Checkbox 컴포넌트 설명이 "글 본문 할 일 목록의 읽기 전용 체크 표시"라서, 코드도 `onChange`와 `<input>` 없이 `role="checkbox"`, `aria-checked`, `aria-readonly`를 단 `div`로 만들었다. 글에 적힌 상태만 보여 주는 블록이라 상호작용을 넣을 이유가 없다고 보았다. 나중에 상호작용이 필요하면 문서에서 먼저 정해야 한다.
"#283 Checkbox: 체크 표시 자산과 색": |
  피그마 `checkmark` 인스턴스는 `ic_fluent_checkmark_20_regular`를 16으로 줄여 쓰고 글리프 색이 `text-on-accent-fill-primary`다. 코드는 같은 자산(`icons/ic_fluent_checkmark_20_regular.svg`)을 `size-icon-16`과 `text-text-on-accent-fill-primary`로 그렸다. 자산 파일이 이미 있어 `generate:assets`는 바뀐 것이 없었다. 체크 표시는 자리가 하나로 정해져 있어 [[디자인 시스템:아이콘 자리]]의 교체 속성(prop)으로 열지 않고 컴포넌트 안에 고정했다. 로컬 캡처 차이 그림에는 체크 표시 가장자리의 옅은 엔진 차이만 남았다([[피그마 연동:캡처 표]]).
"#286 ExplorerAddressRow: 검색 줄의 포커스와 닫기 prop": |
  피그마 `Device=Mobile, Search=Open`의 검색 상자는 SearchBox `State=Focused`(강조색 아래 선)로 그려져 있다. Focused는 캡처 도구가 Tab 키로 재현하는 상태 변형이지만 여기서는 `Search` 변형 안에 들어 있어 도구가 포커스를 주지 않는다. [[파일 탐색기:폴더 안 검색]]이 검색 줄로 바뀌면 검색 상자에 포커스를 준다고 정하므로, 컴포넌트가 `search="open"`으로 그려질 때 입력칸에 한 번 포커스를 주게 했다(ref 콜백). 포커스를 강제로 주는 prop은 만들지 않았다([[피그마 연동:스토리 규칙]]). ← 버튼은 피그마 레이어 이름이 `back`이지만 동작이 검색 닫기라 접근성 이름을 "검색 닫기", prop을 `onSearchClose`로 두었다. Esc 처리와 열고 닫는 상태 연결은 나중 기능 작업으로 남겼다. desktop에는 `Search=Open` 변형이 없어 `search` 값을 무시한다. 새 prop은 기본값(`search="closed"`)이 기존 모습이라 앱 코드는 고치지 않았다.
"#285 Equation: 수식을 children 슬롯으로 받고 빈 슬롯은 스토리 자리 표시로 맞춤": |
  피그마 Equation은 720 너비에 위아래 8 여백과 100x100 `Formula` 슬롯 하나이고, 내보낸 PNG에는 수식 그림이 없는 빈 슬롯이다. 수식은 서버가 KaTeX로 그려 보내므로([[기술 스택:글 본문 처리]]) 이 PR 범위가 아니라고 보아, 코드는 `children`으로 받는 `Equation`만 만들었다. `equation/Quadratic Formula` 자산의 생성 코드는 이 PR에서 만들지 않았다. 조립에서 그 그림을 쓰는 PR이 [[남은 작업]]대로 만든다.
"#285 Equation: Parity 스토리의 빈 슬롯 크기를 인라인 스타일로 줌": |
  피그마의 빈 `Formula` 슬롯은 100x100인데 `size/100` 토큰이 없다(`size-96` 다음이 `size-104`). 컴포넌트는 슬롯 크기를 갖지 않고(수식 크기가 내용으로 정해지므로) `Parity` 스토리가 `style={{ width: 100, height: 100 }}` 빈 상자를 children으로 넣어 피그마 높이 116에 맞췄다. 토큰 클래스만 쓰는 규칙([[피그마 연동:토큰 생성]])의 예외이고 스토리 안으로 한정했다. 로컬 캡처 차이 그림은 전부 검정이다.
"#288 Figure: 이미지를 필수 image prop(ReactNode)으로 받고 Parity는 wallpaper/Bloom을 넣음": |
  피그마 Figure의 `image`는 인스턴스 교체 속성이고 기본값이 `wallpaper/Bloom`이다. 글마다 달라지는 이미지라 [[디자인 시스템:아이콘 자리]]의 필수 prop 규칙을 따라 코드에서 필수 `image: ReactNode`로 받고, `Parity` 스토리가 `ImageAsset`(`images/wallpaper-bloom`)을 넣는다. `src` 문자열 prop 대신 ReactNode로 한 것은 피그마 속성과 이름·종류를 맞추고, 실제 Notion 이미지 주소 제공([[Notion 이미지 제공]], 9단계)과 `next/image` 같은 이미지 요소 선택을 쓰는 곳에 남기기 위해서다. 틀은 안쪽 이미지를 너비 100%, `object-cover`, `rounded-overlay`로 잘라 그린다. 피그마의 이미지 칸은 720x420 고정이지만 코드는 이미지 높이를 따르므로, `Parity` 스토리가 높이 420을 인라인 style로 준다(같은 크기 토큰이 없음, 스토리 안으로 한정). 캡션은 `caption`(기본 "캡션")과 `showCaption`(기본 true)이다. 이미지를 눌러 크게 보기([[Chrome:글 화면]])를 여는 동작은 나중 기능 작업으로 남기고 `onClick` 등은 만들지 않았다(`figure` 요소 props는 그대로 넘어간다). 로컬 캡처 차이 그림에는 이미지 윤곽의 옅은 리샘플링 차이와 캡션 글자 가장자리만 남았다([[피그마 연동:캡처 표]]).
"#287 ExplorerTab: Rest 오른쪽 구분선을 선택되지 않은 탭에 항상 그림": |
  피그마 `State=Rest`에 1x16 `separator` 레이어가 새로 생겼다(오른쪽 끝 x=219, 세로 가운데, 색 `divider-stroke/default`). 새 PNG와 옛 PNG는 이 선 한 줄만 다르고, Hover·Selected PNG에는 선이 없다. 코드에 같은 선을 더했다. 선택되지 않은 탭에만 `bg-divider-stroke-default`로 그리고 `group-hover:hidden`으로 Hover에서 숨긴다. BrowserTab의 구분선과 같은 방식이다. 피그마 MCP 메타데이터로는 이 선을 켜고 끄는 컴포넌트 속성이 있는지 알 수 없어, 속성(`showSeparator`)은 만들지 않고 상태로만 정했다. 속성이 있다면 BrowserTab처럼 prop으로 여는 검토가 필요하다([[디자인 시스템:컴포넌트 조립 규칙]]). 로컬 캡처 차이 그림에는 구분선이 사라지고 글자와 닫기 아이콘 가장자리의 엔진 차이만 남았다([[피그마 연동:캡처 표]]).
"#290 FileRow: 포커스 선을 focused prop과 안쪽 고리로 그림": |
  피그마가 `Selected focus` 변형을 지우고 `Focused`를 새로 두었다. 새 PNG는 선택 바탕 없이 1px 선만 겹친다. 나머지 12개 변형의 PNG는 옛 PNG와 아이콘 가장자리 몇 픽셀만 다르다(크기도 모두 840x32). FileItem과 같은 결정을 따랐다(이 문서의 `#289 FileItem: 포커스 선을 focused prop과 안쪽 고리로 그림` 섹션, [[컴포넌트 목록:상태]]). 문서는 코드가 `:focus-visible` 외곽선으로 그리고 포커스 prop을 두지 않는다고 정하지만, 그 전환은 [[남은 작업]]의 나중 코드 작업이라 기존 `focused` prop을 그대로 두었다. `focused`는 선택과 상관없이 선을 그리고, 선은 `border` 대신 `inner-border-w-default inner-border-file-item-explorer-stroke-focus`(::before 고리)로 그려 크기에 넣지 않는다. 루트에 `relative`를 더했고, Tab으로 포커스를 받아도 브라우저 기본 외곽선이 겹치지 않게 `outline-none`도 더했다(FileItem과 같다). 캡처 도구는 `state=focused`를 Tab 키로 재현하므로([[피그마 연동:스토리 규칙]]) `Parity` 스토리가 `tabIndex={0}`을 주고 선은 `focused` prop으로 그린다. 앱은 이미 선택된 항목에만 `focused`를 넘기므로 앱 코드는 고치지 않았다. `Window/Explorer` 조립 캡처에는 `focused` FileRow가 없어 바뀌지 않는다.
"#289 FileItem: 포커스 선을 focused prop과 안쪽 고리로 그림": |
  피그마가 `Selected focus` 변형을 지우고 `Focused`를 새로 두었다. 새 PNG는 노드 크기가 Rest와 같고(+2 없음), 선택 바탕 없이 1px 선만 겹친다([[컴포넌트 목록:상태]]). 문서는 코드가 `:focus-visible` 외곽선으로 그리고 포커스 prop을 두지 않는다고 정하지만, 그 전환은 [[남은 작업]]의 나중 코드 작업이라 이 PR에서는 기존 `focused` prop을 그대로 두었다. 바꾼 것은 둘이다. `focused`는 선택과 상관없이 선을 그리고, 선은 `border` 대신 `inner-border-w-default inner-border-file-item-*-stroke-focus`(::before 고리)로 그려 크기에 넣지 않는다. 루트에 `relative`를 더했다. 캡처 도구는 `state=focused`를 Tab 키로 재현하고 대상이 포커스를 받지 못하면 실패하므로([[피그마 연동:스토리 규칙]]), `Parity` 스토리가 `tabIndex={0}`을 주고 선은 `focused` prop으로 그린다. 앱은 이미 선택된 항목에만 `focused`를 넘기므로 앱 코드는 고치지 않았다.
"#289 FileItem: Window/Explorer 조립 캡처의 1px 어긋남을 둠": |
  포커스 선이 크기에 들어가지 않게 되어, 선택·포커스된 첫 항목이 있는 `Window/Explorer` `device=desktop,folder=blog,selection=single` 조립 캡처에서 그 항목의 아이콘·이름이 피그마 조립 PNG보다 1px 위에 있고 바탕이 2px 짧다. 조립 PNG가 옛 FileItem(`Selected focus`, +2)으로 내보낸 것이라서다. 새 컴포넌트 디자인을 따르는 것이 맞다고 보아 앱이나 조립 코드로 옛 크기를 되살리지 않았다. 조립을 다시 내보내면 맞아질 것으로 보며, 확인이 필요하다([[피그마 연동:캡처 표]]). `Explorer/Content`와 `Desktop/Scene` 조립 캡처는 바뀌지 않았다.
"#292 PostCover: 이미지를 필수 image prop(ReactNode)으로 받고 높이 240을 컴포넌트가 가짐": |
  피그마 PostCover는 720x240 틀 하나에 `image` 인스턴스(기본 `wallpaper/Bloom`, 모서리 `radius/overlay`)가 가득 찬 변형 `default` 하나뿐이다. Figure와 같은 계열이라 같은 결정을 따랐다. 글마다 달라지는 이미지라 [[디자인 시스템:아이콘 자리]]의 필수 prop 규칙대로 필수 `image: ReactNode`로 받고, `Parity` 스토리가 `ImageAsset`(`images/wallpaper-bloom`)을 넣는다. 실제 Notion 이미지 제공([[Notion 이미지 제공]], 9단계)은 이 PR 범위가 아니다. 틀은 안쪽 이미지를 `size-full`, `object-cover`로 채우고 `rounded-overlay`로 잘라 그린다([[Chrome:Notion 블록]]).
  [[디자인 시스템:컴포넌트 조립 규칙]]의 크기 규칙에서 너비는 부모가 정하므로 코드는 너비를 갖지 않고 `Parity` 스토리가 피그마 원본 너비 720(`w-720`)으로 감싼다. 높이 240은 커버 이미지 비율을 정하는 디자인 값이라 컴포넌트가 `h-240`으로 갖는다(Figure는 이미지 높이를 따르지만 PostCover는 피그마에서 높이가 고정이다). `Parity` 스토리에 인라인 style은 필요하지 않았다. 로컬 캡처 차이 그림은 거의 검정이고 이미지 윤곽의 옅은 리샘플링 차이만 남았다([[피그마 연동:캡처 표]]). `generate:assets`는 바뀐 것이 없었다.
"#291 MenuZoomItem: -·+ 버튼은 IconButton `subtle`을 쓰고 메뉴 항목으로 만들지 않음": |
  피그마 `zoom out button`·`zoom in button`은 패딩 8, 투명 바탕, 아이콘 16이고 안쪽 아이콘만 `subtract`·`add`로 바뀐 IconButton `Style=Subtle` 인스턴스다. 코드는 같은 모습의 `IconButton variant="subtle"`에 `icon`을 넘기는 구조로 맞췄다([[디자인 시스템:컴포넌트 조립 규칙]]의 작은 컴포넌트 인스턴스). 줄 전체는 Base UI `Menu.Item`이 아니라 `role="group"`인 일반 `div`다. `Menu.Item`은 누르면 메뉴를 닫지만 [[Chrome:확대/축소]]는 −·+를 눌러도 메뉴가 닫히지 않아야 하기 때문이다. 대신 ↑↓ 키로 이 줄 안의 버튼에 닿는지(roving focus)는 확인하지 않았다. 메뉴 조립에 넣는 기능 작업에서 확인이 필요하다.
"#291 MenuZoomItem: prop 범위와 루트 너비 240": |
  피그마 속성(`label`, `value`, `icon` 인스턴스 교체)을 `label`(기본 "확대/축소"), `value`(필수), `icon`(기본 `zoom_in_20_regular`, 어디서나 같은 기능 아이콘이라 [[디자인 시스템:아이콘 자리]]대로 기본값을 둠)로 열었다. 배율 동작은 나중 기능 작업이라 `onZoomOut`·`onZoomIn` 콜백과, 끝 단계(50%·200%)에서 버튼을 끄는 `isZoomOutDisabled`·`isZoomInDisabled`만 열었다([[Chrome:확대/축소]]). 루트는 MenuItem 행과 같이 `w-240`을 가진다. 부모가 크기를 정하는 컴포넌트는 너비를 갖지 않는다는 규칙([[디자인 시스템:컴포넌트 조립 규칙]])이 있으나, 메뉴 항목 줄은 MenuItem이 이미 `w-240`을 가지고 나란히 놓이므로 같은 방식을 따랐다. 로컬 캡처 차이 그림에는 글자와 아이콘 가장자리의 옅은 엔진 차이만 남았다([[피그마 연동:캡처 표]]).
"#296 Toggle: 펼침 상태를 제어와 비제어 모두 받음": |
  [[Chrome:Notion 블록]]이 토글을 "꺾쇠와 제목"으로만 적고 펼침 상태를 누가 가지는지 정하지 않는다. 글 본문에서 읽는 사람이 눌러 펼치므로 `isExpanded`(제어)를 주지 않으면 `defaultExpanded`에서 시작해 스스로 바꾸는 비제어로 동작하게 했고, `onExpandedChange`로 새 상태를 알린다. NavigationItem(`expand` + 콜백)과 Popover(`open`)는 상태를 쓰는 곳이 정하므로 그 관례는 제어 쪽에 두었다. 제목 줄은 `aria-expanded`와 펼친 동안만 `aria-controls`를 가진 `button`이다. 피그마 `State` 변형 두 개는 `Parity` 스토리의 `state` arg를 `isExpanded`로 옮겨 맞췄다.
"#296 Toggle: 접힌 동안 내용을 그리지 않고 꺾쇠는 고정 자산으로 둠": |
  피그마 Collapsed 변형에는 `Content` 슬롯이 없으므로 [[디자인 시스템:컴포넌트 조립 규칙]]의 "상태 때문에 안 보이는 것을 그려 놓고 숨기지 않는다"에 따라 코드도 접힌 동안 `children`을 그리지 않는다. 꺾쇠는 `ic_fluent_chevron_right_16_regular`를 접힘은 그대로, 펼침은 90도 돌려 쓰고(피그마 `chevron` 인스턴스의 회전과 같다) 색은 자산 설명대로 `text-text-fill-primary`다. 쓰는 곳마다 바뀌지 않는 기능 아이콘이라 [[디자인 시스템:아이콘 자리]]대로 속성으로 열지 않고 고정했다. 자산은 이미 있어 `generate:assets`는 바뀐 것이 없었다. `get_design_context`가 변형 노드에서 오류를 내 메타데이터, 변수, 안쪽 노드 조회와 PNG로 확인했다. 로컬 캡처 차이 그림에는 제목 글자 가장자리의 옅은 엔진 차이와 글자 세로 위치 1px 안팎 차이만 남았다([[피그마 연동:캡처 표]]).
"#295 TableCell: type에 따라 th/td로 그리고 내용은 children으로 받음": |
  피그마 TableCell은 `Type=Body|Header` 변형 둘이고 칸 내용(`text`) 하나뿐이다. 칸 내용은 서식이 섞인 글이라 `children`으로 받았다([[Chrome:Notion 블록]]). 의미 요소는 `type="header"`이면 `th`, `body`(기본값)이면 `td`로 그렸다. 머리 칸을 `td`로 그리면 표의 머리 정보가 스크린 리더에 전달되지 않기 때문이다. `th`의 `scope`(열 머리인지 줄 머리인지)는 표 전체 구조에서 정할 일이라 기본값을 두지 않고 쓰는 곳이 넘기게 했다(다음 PR #294 Table이 정한다). `th`는 브라우저 기본이 가운데 정렬이라 `text-left`로 맞췄다. 너비는 갖지 않고 표와 쓰는 곳이 정한다([[디자인 시스템:컴포넌트 조립 규칙]]). 피그마 선은 오른쪽·아래쪽 1px(`divider-stroke/default`)이고 레이아웃에 들어가므로 CSS border로 그렸고, 머리 칸 바탕은 `subtle-fill-secondary`다. 칸은 `tr` 안에서만 유효한 요소라 `Parity` 스토리는 `table`>`tbody`>`tr`로 감싸고 `data-parity-target`으로 칸을 캡처 대상으로 삼았다. 가운데 배치는 칸 위치를 반 픽셀로 만들어 선이 1px 어긋나므로 스토리를 `layout: 'padded'`로 두었다([[피그마 연동:스토리 규칙]]).
"#295 TableCell: 본문 칸도 글자를 Body Strong(SemiBold)으로 그림": |
  피그마 PNG와 `get_variable_defs`가 두 변형 모두 `font/weight/semibold`를 쓰고, 본문 칸의 글자도 SemiBold로 그려져 있다(차이 그림에서 Regular로 그렸을 때 글자 전체가 어긋났다). 일반 본문은 Regular일 것이라는 추측 대신 피그마를 따라 두 변형 모두 `type-body-strong`으로 구현했다. 머리 칸과 본문 칸의 구분은 바탕색(`subtle-fill-secondary`)뿐이다. 본문 칸을 Regular로 바꿀 의도였다면 피그마를 고쳐야 한다([[디자인 기반:서체]]). 로컬 캡처 차이 그림에는 글자 가장자리의 옅은 엔진 차이와 오른쪽 아래 모서리 한 픽셀(CSS 테두리 모서리 이음)만 남았다([[피그마 연동:캡처 표]]).
"#297 UnsupportedBlock: 유형 이름을 typeName prop으로 받고 안내 글을 컴포넌트가 만듦": |
  피그마 UnsupportedBlock은 변형 `default` 하나이고 `message` 글자 레이어 하나(기본 "지원하지 않는 블록(유형 이름)")만 있으며 컴포넌트 속성은 없다. 유형 이름만 쓰는 곳마다 바뀌므로([[Chrome:Notion 블록]]) 코드는 `typeName`(기본 "유형 이름", [[디자인 시스템:컴포넌트 조립 규칙]]의 일반 문구 기본값)을 받고 "지원하지 않는 블록(…)" 틀은 컴포넌트가 만든다. 글 전체를 `message`로 받으면 쓰는 곳마다 같은 틀을 반복하기 때문이다. 서버 로그 경고는 이 PR 범위가 아니라 만들지 않았다. 너비는 갖지 않고 `Parity` 스토리가 피그마 원본 너비 720(`w-720`)으로 감싼다. 아이콘(`ic_fluent_warning_24_regular`을 16으로 줄여 씀)은 쓰는 곳마다 바뀌지 않는 기능 아이콘이라 [[디자인 시스템:아이콘 자리]]의 교체 속성으로 열지 않고 고정했다. 피그마 MCP가 아이콘 색 변수를 알려 주지 않아, Callout처럼 자산 설명(`text-fill/primary`)을 따를지 글자색(`text-fill-secondary`)을 따를지 정해야 했다. 캡처 차이 그림에서 `text-text-fill-secondary`가 일치해 글자와 같은 색으로 정했다.
"#297 UnsupportedBlock: warning 아이콘 자산을 이 PR에서 생성함": |
  이 PR과 다음 조립 PR(#298)이 같은 `figma/assets/icons/ic_fluent_warning_24_regular.svg`를 담고 이 PR이 먼저 병합되므로, `generate:assets`를 여기서 실행해 바뀐 `src/assets/asset-data.ts`를 커밋했다([[피그마 연동:자산]]). 이전 CI의 `Figma generated`와 자산 테스트 실패 원인은 이 생성 파일 누락 하나였다. 로컬 캡처 차이 그림에는 글자와 아이콘 가장자리의 옅은 엔진 차이만 남았다(차이 최댓값 55/255, 40을 넘는 픽셀 21개, [[피그마 연동:캡처 표]]).
"#294 Table: 행은 children 슬롯으로 받고 tbody 안에 둠": |
  피그마 Table은 변형 없이 720 너비 틀 하나이고 왼쪽·위 1px 선(`divider-stroke/default`)과 `Rows` 슬롯 하나뿐이다. 슬롯은 [[디자인 시스템:컴포넌트 조립 규칙]]대로 코드의 `children`(행 `tr`과 `TableCell`)으로 열고, 컴포넌트가 `table`>`tbody`를 그려 그 안에 넣는다. `tr`을 `table` 바로 아래에 두면 DOM 중첩 경고가 나고, rows 데이터 prop은 칸 내용이 서식 섞인 글이라([[Chrome:Notion 블록]]) 맞지 않기 때문이다. 머리 행도 `tbody`의 `tr`에 `th scope="col"`로 넣게 되며, `thead`가 필요하면 후속 작업에서 연다. 칸의 오른쪽·아래 선과 이어지도록 틀은 왼쪽·위 선만 갖는다.
"#294 Table: border-separate와 너비 w-full, Parity 스토리의 빈 행 높이": |
  Tailwind preflight는 `table`을 `border-collapse: collapse`로 둔다. 이 상태에서는 칸이 없는 빈 표의 테두리가 그려지지 않았고(로컬 캡처에서 코드 그림이 비었다), 칸 선과 합쳐지는 방식도 피그마의 레이아웃(틀 선 + 칸 오른쪽·아래 선)과 달라진다. 그래서 `border-separate border-spacing-0`으로 두었다. 너비는 부모가 정하므로 `w-full`(부모 채움)만 갖고, `Parity` 스토리가 피그마 원본 너비 720(`w-720`)으로 감싼다([[디자인 시스템:컴포넌트 조립 규칙]]). 빈 슬롯의 피그마 높이 100은 크기 토큰에 없어 스토리의 빈 `tr`에 인라인 style(`height: 100`)로 맞췄다(다른 스토리의 슬롯 자리 표시와 같은 방식). 로컬 캡처 차이 그림은 완전히 검정이다([[피그마 연동:캡처 표]]).
"#298 Chrome 조립: 본문 블록 스키마를 지원 블록 전체로 넓힘": |
  `Chrome/PostBlocks`를 앱의 `PostBlocks`가 블록 데이터로 그리게 하려고 `shared/utils/post-body`의 `PostBlock`을 [[Chrome:Notion 블록]]의 지원 블록 전체로 넓혔다. 글자 조각에 `annotations`(굵게·기울임·밑줄·취소선·인라인 코드), 글머리·번호·할 일 목록(`children`으로 들여쓴 하위 블록), 인용, 콜아웃, 이미지(`url`, `caption`), 구분선, 토글(`children`), 표(`hasColumnHeader`, `rows`), 북마크(`url`, `title`, `description`), 수식(`expression`), 지원하지 않는 블록 자리(`unsupported`, `typeName`)를 더했다. 하위 블록 때문에 스키마가 스스로를 가리켜, 타입을 손으로 적고 스키마를 `z.ZodType<PostBlock>`으로 맞췄다. 이전에 "9단계 전까지 디자인이 없는 블록은 받지 않는다(임시)"던 스키마 테스트는 디자인이 생겨 지웠고, 모르는 블록 종류는 여전히 받지 않는다(서버가 `unsupported`로 바꿔 보내야 한다). Notion 응답을 이 모양으로 바꾸는 서버 변환과 서버 로그 경고는 나중 작업이다. 코드 강조는 Shiki 결과가 들어갈 자리로 `highlighted`(줄마다 `{ text, syntax }` 조각, `syntax`는 `code-syntax/*` 토큰 이름)를 두었다([[기술 스택:글 본문 처리]]). Shiki를 붙일 때 이 모양을 그대로 쓸지 확인이 필요하다.
"#298 Chrome 조립: 이미지와 수식은 renderImage·renderEquation 자리로 그림": |
  Notion 이미지 제공([[Notion 이미지 제공]])은 9단계이고 KaTeX 처리는 나중 작업이라, `PostBlocks`가 `renderImage`·`renderEquation`(선택) prop을 받게 했다. 없으면 이미지는 임시 이미지(배경화면 Bloom), 수식은 식 글자를 코드 서체로 보인다. 앱 Next.js lint가 `<img>`를 막아 이미지 주소를 바로 그리지 않았다. Parity 스토리는 피그마처럼 Bloom을 이미지 칸 높이(PostBlocks 420, Chrome/Page wide 420·narrow 212)로, 수식은 새 자산 `images/equation-quadratic-formula`(200×56)로 넣는다. 이미지 칸 높이는 크기 토큰에 없어 스토리 안에서만 인라인 style로 줬다(#288 Figure와 같다). 새 래스터 자산을 쓰려고 손으로 관리하는 `ImageAsset`의 주소 목록과 그 테스트에 `images/equation-quadratic-formula`를 더했다.
"#298 Chrome 조립: 글자 서식·콜아웃·토글·표의 세부 모양": |
  글자 서식은 서식마다 있는 글자 스타일(`type-body-large-strong`·`-italic`·`-underline`·`-strikethrough`)을 쓰고, 한 조각에 서식이 여럿이면 인라인 코드, 굵게, 기울임, 밑줄, 취소선 차례로 하나만 쓴다(글자 스타일이 한 조각에 하나라서다). 기울임은 Open Sans Italic 웹 폰트가 아직 없어(남은 작업) 브라우저가 기울여 그리고, 캡처에 그 차이가 남는다. 콜아웃 아이콘은 Notion 아이콘(이모지)을 따르지 않고 피그마처럼 `ic_fluent_info_24_regular`로 고정했다(한 가지 모양, [[Chrome:Notion 블록]]). 토글 내용은 피그마 조립의 슬롯 여백대로 24 들여 쓰고, 처음 펼쳐 둘 토글은 Notion 데이터에 없는 화면 상태라 `expandedToggleIndexes` prop(맨 위 블록 차례)으로 받는다. 표의 본문 칸은 피그마 조립이 글자를 Body(Regular)로 덮어써, TableCell(#295, 두 변형 모두 Body Strong)은 그대로 두고 조립에서 본문 칸 글자를 `type-body`로 감쌌다. 컴포넌트와 조립 중 어느 쪽이 맞는지 피그마 확인이 필요하다. 번호 목록 표시는 단계마다 `1.`·`a.`·`i.`, 글머리표는 `•`·`◦`·`▪`로 정했다(Notion과 같다).
"#298 Chrome 조립: 제목 단계가 글자 크기를 정하고 Chrome/Page 견본 제목은 제목 2로 둠": |
  제목 1·2·3을 `Title`·`Subtitle`·`Body Large Strong`으로 그리게 되어([[남은 작업:1. 7단계 마무리]]), 이전처럼 모든 제목을 Subtitle로 그리지 않는다. Chrome/Page `Page=Post`의 "use 훅" 같은 제목은 20px이라 스토리 데이터(`postPageBlocks`)에서 제목 2로 두었다. 임시 글 본문(`content/temporary-post-bodies`) 중 제목 1을 쓰는 글은 실제 화면에서 28px 제목이 된다.
"#298 Chrome 조립: Chrome/Page 글 화면에 커버와 새 본문을 쓰고 Window 스토리는 그대로 둠": |
  `ChromePage`의 글 화면에 `cover`(선택, ReactNode) prop을 더해 제목 위에 PostCover를 그린다(narrow는 피그마대로 높이 140). 실제 글 탭은 커버 데이터가 아직 없어 넘기지 않는다. 새 탭 페이지의 검색창은 새 조립 `ChromeNewTabSearch`(닫힌 모습)로 바꿨다. Chrome/Page 스토리는 커버, 강조된 코드, 그림이 든 새 본문을 `PostBlocks`로 그린다. `Window/Chrome`과 창 축소 화면(SnapAssist 등) 스토리는 아직 예전 피그마 PNG와 짝이라 예전 본문 도우미(`shared/stories/post-body`)를 그대로 쓰게 두었다. Window 조립 PR(#303)에서 PNG가 바뀌면 같은 본문으로 맞춰야 한다.
"#298 Chrome 조립: 찾기 막대와 새 탭 검색의 포커스, 이미지 크게 보기의 닫기": |
  피그마 `Chrome/FindBar`와 `Chrome/NewTabSearch` `State=Open`의 검색 상자는 포커스된 모습이다. 포커스를 강제로 주는 prop은 만들지 않고([[피그마 연동:스토리 규칙]]), 찾기 막대는 열릴 때, 새 탭 검색은 추천 목록을 열 때 입력칸에 포커스를 준다([[Chrome:페이지에서 찾기]], #286과 같은 방식). 찾기 키 입력·강조·확대 같은 실제 동작은 나중 기능 작업으로 남기고 값·콜백 prop만 열었다. `ChromeImageViewer`는 이미지를 ReactNode로 받아 크기를 쓰는 곳이 정하게 했고(스토리는 피그마의 800×500, 남은 너비×220), 닫기 버튼·Esc·이미지 밖 바탕 누르기로 `onClose`를 부른다. 포커스 가두기와 원래 이미지로 포커스 돌리기는 여는 쪽 기능 작업에서 붙인다([[Chrome:글 화면]]).
"#300 MessageBox 조립: 폴더 이름 상자 둘은 shared, 휴지통 글 상자는 chrome에 둠": |
  `MessageBox/ReservedName`과 `MessageBox/DuplicateFolderName`은 바탕화면과 탐색기가 폴더 이름 바꾸기에서 함께 쓰므로 `MessageBoxEmptyRecycleBin`과 같이 `shared/components`에 두었다. `MessageBox/TrashedPost`는 Chrome만 쓰므로 `features/chrome/components`에 두었다([[저장소 구성:앱 폴더 구조]], [[Chrome:휴지통에 있는 글]], [[작업 공간:폴더 이름]]). 세 조립 모두 글자를 `*_MESSAGE` 상수로 내보내 나중에 `MessageBoxDialog`로 띄우는 코드가 같은 값을 쓰게 했다. 띄우는 동작은 다음 코드 작업이라 만들지 않았다.
"#300 MessageBox 조립: 폴더 이름 상자의 제목은 피그마의 이름 바꾸기를 따름": |
  [[작업 공간:폴더 이름]]은 두 상자의 본문과 버튼만 정하고 제목은 적지 않는다. 피그마 두 조립의 제목이 모두 "이름 바꾸기"라 코드도 그대로 썼다. 제목을 문서에 적을지는 확인이 필요하다. 휴지통에 있는 글 상자는 `buttons="two"`, 강조 `복원`, 기본 `취소`로 문서와 피그마가 같다. 로컬 캡처 차이 그림에는 글자와 버튼 글자 가장자리의 옅은 엔진 차이만 남았다([[피그마 연동:캡처 표]]).
"#299 Menu 조립: MenuPopup에 확대/축소 줄(zoom) 항목 종류를 더함": |
  피그마 Menu/ChromeMore와 Menu/ChromeMoreMobile의 마지막 줄이 값 글자 대신 −·+ 버튼이 달린 `MenuZoomItem`으로 바뀌었다. `MenuPopupEntry`에 `kind: 'zoom'`(`value`, `onZoomOut`, `onZoomIn`, `isZoomOutDisabled`, `isZoomInDisabled`)을 더하고 `MenuPopup`이 디자인 시스템 `MenuZoomItem`으로 그리게 했다. 두 조립의 스토리 데이터는 `{ kind: 'zoom', value: '100%' }`로 바꿨다. 항목이 메뉴 항목이 아니라 일반 버튼 줄이라 기존 `command` 종류의 변형으로 두지 않고 따로 열었다([[디자인 시스템:조립]]). 실제 Chrome ⋮ 메뉴(`chrome-window-layer`)에 연결해 배율을 바꾸는 동작과 [[Chrome:확대/축소]] 구현은 나중 코드 작업으로 남겼다.
"#299 Menu 조립: 메뉴 스토리는 처음 포커스를 옮기지 않음": |
  확대/축소 줄이 생기자 `MenuStory`의 팝업이 열릴 때 Base UI가 안쪽에서 처음 포커스를 받을 수 있는 첫 버튼(−)에 포커스를 옮겨, 코드 캡처에만 포커스 링이 그려졌다. `MenuStory`가 `initialFocus: false`를 넘기게 했다. Base UI 1.9.0은 `Menu.Popup`이 실행 중에 이 속성을 받지만 타입 선언에는 없어, 속성 객체로 펼쳐 넘겼다. 실제 메뉴(`MenuPopup`의 기본 동작)는 바꾸지 않았다. 실제 Chrome ⋮ 메뉴를 키보드로 열 때 처음 포커스가 어디 가야 하는지는 [[Chrome:확대/축소]]를 연결할 때 확인이 필요하다([[피그마 연동:스토리 규칙]]).
"#299 Menu 조립: 바뀐 메뉴의 새 항목은 스토리 데이터에만 더함": |
  피그마 Menu/Desktop에 `붙여넣기`(Ctrl+V), Menu/Folder·Menu/Link·Menu/Multiple에 `잘라내기`(Ctrl+X)가 생겼다. 항목 위치와 아이콘은 새 PNG를 따라 스토리 데이터(`story-data.ts`)에만 더했다. 실제 우클릭 메뉴(`desktop-menu-entries.ts`)와 스토리가 같은 함수를 쓰게 바꾸고 새 항목을 동작에 연결하는 일은 이 PR 범위가 아니라 나중 코드 작업으로 남겼다([[디자인 시스템:조립]]).
"#299 Menu 조립: 탐색기 휴지통 메뉴와 Start 모두 목록 메뉴 스토리를 만듦": |
  새 조립 Menu/RecycleBinEmpty(`submenu=none`·`sort`), Menu/RecycleBinSortSubmenu, Menu/StartListApp, Menu/StartListPost의 스토리와 데이터를 만들었다. 휴지통 두 조립은 탐색기에서 여는 메뉴라 `features/file-explorer/components/`에, 두 조립이 함께 쓰는 정렬 하위 메뉴 데이터는 `features/file-explorer/stories/recycle-bin-submenu-data/`에 두었다. Start 두 조립은 `features/start-menu/components/`에 두었다([[저장소 구성:앱 폴더 구조]]의 메뉴 조립 규칙). 기존 `Menu/ExplorerEmpty` 등과 같이 컴포넌트 파일 없이 스토리와 `story-data.ts`만 있다. 휴지통 정렬 선택지의 값(`original-location`, `deleted`)과 `작업 표시줄에 고정` 아이콘(`pin`)은 피그마 PNG에서 글자와 모양만 알 수 있어 스스로 정했다. 실제 휴지통·Start 모두 목록의 우클릭에 연결하는 일은 나중 코드 작업으로 남겼다.
"#302 Start 조립: 피그마 변경은 PNG 안 노드 위치뿐이라 코드는 바꾸지 않음": |
  옛 PNG·`export.json`과 비교하니 Start/Body 변형 7개의 바뀐 점은 노드 위치 `y` 36 → 0(PNG 위쪽 여백 36px 제거)뿐이고 노드 크기와 속성은 같다. 로컬 캡처(`--target Start/Body`, 10개 변형 0개 실패)의 차이 그림에는 글자·아이콘 가장자리의 옅은 엔진 차이와 스크롤바 선만 남아, 조립 모습은 이미 피그마와 맞는다고 보고 코드를 바꾸지 않았다([[피그마 연동:캡처 표]]). 캡처 도구와 `figma/`는 건드리지 않았다.
"#302 Start 조립: 영역 이름표와 처음 보기·패널 높이 하한은 다음 코드 작업으로 남김": |
  "고정됨"·"모두" 영역 이름표(화면 읽기 프로그램용)는 눈에 보이는 조립 모습이 아니라 캡처로 확인되지 않고, 처음 보기를 범주로 바꾸는 동작([[Start 메뉴:모두]])과 Start·검색 패널 높이 하한([[Start 메뉴:구성]])은 동작이라, 이 PR 범위 지시에 따라 만들지 않고 다음 코드 작업으로 남겼다.
"#301 Search 조립: 결과 모바일 PNG의 스크롤 막대 위치만 바뀌어 코드를 고치지 않음": |
  `Search/Body`의 `view=results,device=mobile` PNG는 오른쪽 스크롤 막대의 막대(thumb)가 위에서 44px에 있던 것이 40px로 올라간 20픽셀만 달라졌고, 나머지는 같다. 새 위치 40(길이 80)은 코드 `Scrollbar`의 피그마 기본값과 이미 같아 코드를 고치지 않았다. 로컬 캡처 차이 그림에는 막대 길이·위치 차이가 남는다. 피그마는 조립 안의 Scrollbar 인스턴스를 기본값(40, 80)으로 두지만, 코드 `ScrollArea`는 실제 내용 길이와 스크롤 위치로 막대를 재서 그리기 때문이다. 이는 동작이라 조립 모습에 맞추려고 `ScrollArea`나 캡처 도구를 바꾸지 않고 그대로 두었다.
