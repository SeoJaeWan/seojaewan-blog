_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.
"코드 강조 light-plus 전환 (결정 B7, 코드 쪽)": |
  - 강조 색을 Shiki 내장 `light-plus`로 바꿨다. 직접 만든 테마(`code-highlight-theme.ts`)와 `CODE_SYNTAXES`·`CodeSyntax`를 지웠고, 글자 조각(`CodeToken`·`CodeBlockToken`)은 `syntax` 갈래 이름 대신 `color`(hex 또는 null)를 가진다. 테마 기본 글자색(`#000000`)인 조각은 null로 보낸다.
  - CodeBlock이 조각의 색을 `style={{ color }}`로 칠한다. 이 값은 실행 중에 받는 값이라 기존 style 값 lint가 막지 않아 lint 예외를 따로 두지 않았다(규칙 예외 경로 없음).
  - 코드 글자 기본색은 `text-code-syntax-text` 대신 `text-text-fill-primary`로 했다. `code-syntax/*`와 `color/vscode/*` 토큰은 지우지 않았고 코드가 더 이상 쓰지 않는다.
  - 캡처용 스토리(CodeBlock `Figma`·`Copy`, Chrome/PostBlocks, Chrome/Page)는 색 없는 코드로 그린다. PostBlocks·Chrome/Page 견본 데이터는 `highlighted`를 두지 않고(손으로 칠한 조각 삭제), 단위 테스트가 실제 강조 결과의 색과 코드 일치를 본다. CodeBlock 견본은 색 있는 `lines`(실제 강조 결과와 같은지 테스트)와 색 없는 `plainLines`를 함께 둔다.
  - 열린 문제: Light+ 원색 중 `#267f99`(타입 이름)가 CodeBlock 바탕 `#f9f9f9`에서 대비 4.35:1이라 [[접근성:색 대비]]의 4.5:1에 못 미친다. 색 있는 코드를 그리는 스토리에서 axe 위반이 나서 `Copy` 스토리도 색 없는 코드로 그렸다. 실제 앱 글에서는 이 색이 보인다. 대비를 고칠지, 이 색만 예외로 둘지는 정하지 않았다.
"BreadcrumbItem PR #515: 글자 label HUG와 말줄임 동작 스토리": |
  - 피그마 `label`이 내용 맞춤(HUG)이 되어 이름 전체가 보인다. 코드는 이미 "이름만큼 넓어지다 최대 너비(`size/breadcrumb-item/max-width`)에서 …로 줄임"이라 컴포넌트는 바꾸지 않았다. `Figma` 스토리 여섯 변형 캡처의 차이 그림에는 글자 가장자리 차이만 남았다.
  - 줄임 동작을 보는 스토리가 없어 `Truncated` 동작 스토리를 더했다. 피그마에는 줄임 변형이 없어 캡처가 맡지 못하므로 [[테스트 작성 규칙:테스트 지침]] 5번(`play`)으로 두었다. 최대 너비를 넘는 긴 이름에서 글자 상자가 넘치고 `text-overflow: ellipsis`인지 본다. 새 크기 토큰이나 감싸는 상자는 쓰지 않았다.
  - PR 브랜치에 `main`(토큰 PR #522)을 받아 합쳤다.
"Breadcrumb PR #514: 안쪽 BreadcrumbItem 글자 HUG 반영": |
  - `export.json`에서 안쪽 BreadcrumbItem의 `label`이 FILL·줄임에서 HUG·줄임 없음으로 바뀐 것만 반영됐다. 기본 내용(`바탕 화면`·`Blog`)의 글자와 크기는 그대로고 Breadcrumb 코드는 안쪽 항목의 크기를 정하지 않아 코드를 바꾸지 않았다. 캡처 차이 그림에는 글자 가장자리 차이만 남았다.
  - 줄임 동작은 BreadcrumbItem 쪽(#515 `Truncated` 스토리)이 맡아 이 PR에는 스토리를 더하지 않았다.
"ExplorerAddressRow PR #513: 안쪽 BreadcrumbItem 글자 HUG 반영": |
  - `export.json`에서 안쪽 BreadcrumbItem `label`의 FILL·줄임이 HUG·줄임 없음으로 바뀐 것(네 곳)만 반영됐다. ExplorerAddressRow 코드는 안쪽 항목의 크기를 정하지 않아 코드와 스토리를 바꾸지 않았다. 세 변형(desktop, mobile 닫힘·열림) 캡처의 차이 그림에는 글자 가장자리 차이만 남았다.
  - 로컬 `pnpm test`에서 `unit-scenario-cases`의 행위 정의 읽기 테스트가 5초 제한으로 시간 초과했다. 다른 작업자가 같은 컴퓨터를 쓰는 부하 때문이고 `pnpm test:unit`만 돌리면 통과한다. 이 PR이 건드린 파일과 상관없다.
"Menu 조립 PR #516: 구분선 MenuSeparator 인스턴스 반영": |
  - `export.json`에서 메뉴 구분선(`separator` 프레임)이 `MenuSeparator` 인스턴스로 바뀐 것과 안쪽 값 일부만 반영됐다. 앱 `menu-popup.tsx`가 이미 MenuSeparator를 쓰고 있고 메뉴 항목 목록 함수와 스토리는 그대로라 코드를 바꾸지 않았다.
  - 서른 변형 캡처의 차이 그림에서 구분선 자리는 검정이다. 남은 차이는 단축키 글자(`Ctrl+X`, `F2`, `Delete`)의 1px 세로·가로 어긋남과 글자 가장자리뿐이라 [[한계:글자 기준선]]·[[한계:HUG 글자 폭 올림]]으로 보고 넘겼다.
  - PR 브랜치에 `main`을 받아 합쳤다. 스토리 테스트는 로컬에서 돌리지 않고 CI 결과로 확인한다(제품 코드 변경 없음).
"Explorer 조립 PR #521: emptyHugSlot 표시 삭제": |
  - `Explorer/Content` `export.json`에서 변형의 옛 `emptyHugSlot` 표시 두 줄이 없어진 것이 전부다. 캡처 도구가 이미 이 표시를 읽지 않으므로(`variant-name.ts`) 코드와 스토리를 바꾸지 않았다.
  - `device=desktop`·`device=mobile` 두 변형 캡처의 차이 그림에는 글자 가장자리와 상태 표시줄 글자의 1px 세로 어긋남([[한계:글자 기준선]])만 남았다.
"Taskbar 조립 PR #520: AppMenu 구분선 MenuSeparator 인스턴스 반영": |
  - `export.json`에서 `Taskbar/AppMenu`의 구분선이 `MenuSeparator` 인스턴스로 바뀌고 Flyout 속성에서 `Padding`이 빠진 것만 반영됐다. 앱 메뉴 코드(`menu-popup.tsx`)가 이미 MenuSeparator·252 HUG 너비를 쓰고 있어 코드와 스토리를 바꾸지 않았다.
  - `state=closed`·`state=open` 두 변형 캡처의 차이 그림에는 글자 가장자리 외 차이가 없다(구분선 자리 검정).
"Window 조립 PR #519: 안쪽 BreadcrumbItem·RenameField 변경 반영": |
  - `export.json`에서 `Window/Explorer`의 안쪽 BreadcrumbItem `label`이 FILL·줄임에서 HUG·줄임 없음으로, RenameField의 `State=Rest` 속성이 없어진 것만 반영됐다. 코드는 이미 같은 모양(#514·#515·#482)이라 앱 코드와 스토리를 바꾸지 않았다.
  - 여섯 변형(desktop 다섯, mobile 하나) 캡처의 차이 그림에는 글자 가장자리와 글자 1~2px 어긋남(탐색 창 항목, 명령 모음 글자 폭 누적)만 남아 [[한계:글자 기준선]]·[[한계:HUG 글자 폭 올림]]으로 보고 넘겼다.
"스토리 스타일 금지 ②: 디자인 시스템 슬롯과 아이콘 자리": |
  - 디자인 시스템 스토리 32개 파일을 바꾸고 `storyStylePendingFiles`에서 지웠다(code-block·motion-story와 앱 스토리는 다른 PR).
  - 아이콘 자리: 아이콘 슬롯을 여는 컴포넌트 13개(BestMatchCard, Breadcrumb, BrowserTab의 favicon·closeIcon, Callout, ExplorerTab, FileItem, FileRow, ListItem, NavigationItem의 icon·chevron, PinnedTile, ProfileButton, TaskbarButton, WindowTitle)가 모두 같은 방식으로 자식 크기를 정한다. 슬롯 상자는 피그마 아이콘 자리 크기 변수(`size-size-icon-*`, `size-size-avatar-profile`)를 갖고, 바로 아래 자식을 `[&>*]:size-full [&>*]:object-contain`으로 채운다. `img`·`ImageAsset`(원본 `width`·`height` 속성을 CSS가 덮는다)·`Asset`(svg) 모두 같다. Figure·PostCover가 이미 쓰던 `[&>*]:` 방식이라 같은 모양을 골랐다. WindowFrame·WindowPreview·TaskbarPreviewList는 WindowTitle을 거쳐 같다.
  - BrowserTab `closeIcon`·NavigationItem `chevron` 기본값의 `size-size-icon-sm`은 자리가 정하므로 지웠다. NavigationItem `icon` 자리는 한 가지 색 아이콘을 `text-text-fill-primary`로 칠한다(피그마 `item icon`의 자산 색이 text-fill/primary). 스토리가 아이콘에 색 클래스를 줄 수 없어 Callout 아이콘 자리처럼 자리가 색을 갖게 했다.
  - 앱 코드에서 아이콘 자식의 크기 클래스를 지웠다(`size-full`·`object-contain`·자리와 같은 `size-size-icon-sm`, 13개 파일 31곳). 색 클래스(`text-text-fill-primary`)는 남겼다. 아이콘을 만드는 함수(renderItemIcon, DesktopIconImage, TaskbarAppIcon 등)가 그린 아이콘은 모두 디자인 시스템 아이콘 자리(끌기 복제본 FileItem 포함)에만 들어감을 확인했다.
  - 슬롯 안 자식 채움(규칙 3): Flyout·Menu·Popover의 MenuSeparator `w-full`은 Flyout 내용 자리(세로 flex, 기본 stretch)가 이미 채워 지웠다(스토리와 앱 `menu-popup.tsx`). SearchResults의 ListGroup `w-full shrink-shrink-none`도 결과 자리(세로 flex, stretch)가 채우고, 넘침 없는 ListGroup은 최소 높이가 내용이라 줄지 않아 지웠다(스토리와 앱 `search-body.tsx`). BestMatchCard는 자기 너비(258, Windows가 정한 크기)를 갖지만 SearchResults 안에서는 피그마 FILL이라, SearchResults가 카드 자리 요소를 두고 `[&>*]:min-w-size-none [&>*]:flex-flex-fill`로 카드를 자리 너비로 늘린다(flex 기준 크기 0이 `width`를 이긴다). 데스크톱 자리는 남는 너비, 모바일 자리는 `w-full`이다. 앱의 카드 `className`을 지웠다.
  - FigmaFrame `node`: Flyout·Popover의 MenuItem(피그마 FIXED `size/menu/width`)은 그 노드(`Content/item 열기`, `Popup/Flyout/Content/item …`)로, StartMenuFooter의 ProfileButton(HUG 형제 옆 FILL)은 `Content/ProfileButton`으로, Taskbar의 SearchBox(FIXED)·SystemTray(높이 FIXED)는 `Center/검색`·`Right/SystemTray`로 준다. 앱의 같은 클래스(ProfileButton `min-w-size-none flex-flex-fill`, SearchBox 너비)는 컴포넌트가 정할 수 없는 자리라 남겼다. NavigationPane의 항목 노드 이름(`nav/바탕 화면`)은 경로 구분자 `/`를 담아 `node`로 고를 수 없어, 크기가 같은 NavigationItem export.json(루트)으로 감쌌다.
  - BrowserTabStrip의 `Tabs.Root className="contents"`·`Tabs.List className="flex"`는 채움이 아니라 탭 줄 자체의 배치다. 피그마 기본 내용이 탭 하나라 클래스 없이도(블록 감싸기) 같은 그림이어서 스토리에서 지웠다. 앱의 탭 줄(`contents`, `flex … overflow-x-auto`)은 여러 탭을 가로로 늘어놓고 스크롤하는 앱 동작이라 남겼다(#483 항목의 `contents` 감싸기를 바꾼 것이다).
  - WindowPreview·TaskbarPreviewList 스토리의 `thumbnail={<div className="size-full" />}`는 피그마 빈 슬롯을 흉내 낸 가짜 상자라 지웠다. 축소 화면 자리 크기는 WindowPreview가 갖는다.
  - 글자 스타일(규칙 6): 피그마 Callout·Quote·Toggle의 `Content` 슬롯 글자는 늘 Body Large(Callout 굵은 글자는 Body Large Strong)다. 내용 자리가 `type-body-large text-text-fill-primary`를 갖게 하고(Callout은 `[&_strong]:font-font-weight-semibold`도), 스토리의 `<p>`·`<strong>` 클래스를 지웠다. 앱 `post-blocks.tsx`는 Quote·Callout에 RichText를 담은 `<p>` 하나만 넣으므로 그 `<p>` 클래스를 지웠다(RichText 굵은 글자는 원래 `font-font-weight-semibold`). Toggle에는 제목·목록·코드 같은 다른 블록도 들어가지만 그 블록은 저마다 글자 스타일을 가져, 자리의 기본 글자를 Body Large로 둬도 앱 그림이 같다. 앱 Toggle 쪽 코드는 바꾸지 않았다.
  - 여러 인스턴스 늘어놓기(규칙 5): ListItem `TwoLine`·`Selected`는 ListItem을 담는 ListGroup(`showHeader={false}`)에, TaskbarButton `Indicators`는 Taskbar `center` 자리에, SnapLayoutOption `Layouts`는 네 레이아웃을 담는 SnapLayoutFlyout에 넣었다. SnapLayoutFlyout은 layout을 늘 주므로 "layout을 주지 않으면 half" 확인은 `DefaultLayout` 스토리로 나눴다.
  - 크기 감싸기(규칙 1): 너비 상자·`className` 크기를 FigmaFrame으로 바꿨다. 동작 스토리도 예전에 같은 크기로 감쌌던 파일(FileRow, WindowFrame, NavigationItem, ScrollArea, Taskbar)은 meta 데코레이터로, 예전에 감싸지 않던 파일(ListItem, Toggle, WindowTitle)은 `Figma` 스토리에만 데코레이터를 달았다. ExplorerAddressRow는 desktop에 `search=open` 변형이 없어 `device`만 넘기는 `FigmaFrame`으로 감쌌다. ScrollArea는 감싸는 요소가 첫 요소가 되므로 ScrollArea에 `data-parity-target`을 달아 `data-parity-hover`가 계속 대상에 있게 했고, 동작 스토리는 루트를 스크롤 요소의 부모로 찾는다. FileRow 동작 스토리는 `data-testid`를 줄 자체에 단다. ImageAsset 스토리 args의 `className`을 지웠다(원본 크기로 그려지고 확인 내용은 주소와 alt뿐이다).
  - 캡처 473개 변형의 코드 그림을 바꾸기 전과 비교해 8개가 달랐다. `callout`은 굵은 글자(66픽셀)가 스토리의 `type-body-large-strong`에서 앱과 같은 상속 글자+semibold로 바뀐 것이고, 피그마와의 차이(차이 32 초과)가 467에서 446픽셀로 줄었다. `navigation-item` `expand=expanded` 네 변형(각 4픽셀, 차이 32 이하)은 회전한 꺾쇠의 가장자리로, 컴포넌트를 `main`으로 되돌리고 찍어도 같아 FigmaFrame 감싸기 때문이고 피그마와의 차이는 같다. `breadcrumb-item`(4픽셀)·`navigation-pane`(16픽셀)은 다른 영역 결과에서도 나오는 흔들림, `patterns/message-box/reserved-name`은 기준이 PR #523 전이라 생긴 폭 차이다.
  - 모든 스토리(386개) 화면은 앱 스토리에 흔들림(바꾸기 전부터, 또는 다른 영역 결과에도 같은 몇 픽셀) 밖의 차이가 없다. 디자인 시스템 동작 스토리의 차이는 의도한 것이다: 가짜 아이콘(`<i>아이콘</i>`, `<span>앱</span>`, 빈 `svg`)과 원본 크기 이미지가 이제 아이콘 자리 크기로 그려진다(FileRow·NavigationItem·ListItem·TaskbarButton·WindowPreview 동작 스토리), 늘어놓기를 실제 담는 컴포넌트로 바꿨다(ListItem `TwoLine`·`Selected`, TaskbarButton `Indicators`, SnapLayoutOption `Layouts`, 새 `DefaultLayout`), Toggle `Open`의 내용 글자가 Body Large가 됐다, ImageAsset `Default`가 원본 크기로 그려진다.
"BrowserTabStrip PR #483: Figma 스토리 되살림": |
  - 피그마 `Tabs` 슬롯 기본 내용(선택된 BrowserTab 하나: `React 19 훅 정리`, `file/Document` 파비콘, 구분선 있음)과 같은 탭으로 `Figma` 스토리를 다시 만들었다. 탭은 tablist 안에서만 쓰므로 앱처럼 Base UI `Tabs.Root`(`contents`)·`Tabs.List`로 감쌌다.
  - `Default`의 "Tabs 슬롯에 넣은 내용을 그린다" 단계는 넘긴 값이 그대로 나오는지만 보는 검사라 [[테스트 작성 규칙:테스트 지침]] 4번대로 지우고, 새 탭 버튼 배선 단계만 남겼다. 슬롯의 `탭 자리` 글자 상자도 지웠다.
"1px 우회 제거와 SearchResults 카드 구조, 구조 검사 HUG 축": |
  - `min-w-size-hairline`·`min-h-size-hairline`(선 두께 토큰 1px)을 flex 자식이 줄어들게 하려는 우회로 쓰던 곳 34곳(21개 파일: 디자인 시스템 컴포넌트·스토리, 앱 start-menu·file-explorer)을 `min-w-size-none`·`min-h-size-none`(`--size-none: 0px`)으로 바꿨다. 피그마의 그 자리는 FILL이고 최소 크기 값이 없다. `taskbar-button`의 `hairline`은 최소 크기가 아니라 다른 쓰임이라 그대로 뒀다.
  - `SearchResults`는 안쪽 BestMatchCard의 `icon`·`title`·`meta`와 `Actions` 슬롯(`actions`)을 자기 prop으로 다시 열지 않고, 카드 하나를 `card` prop(`ReactNode`)으로 받는다. 피그마 SearchResults의 속성은 `Device`와 `Results` 슬롯뿐이고 BestMatchCard는 그 안에 놓인 인스턴스이기 때문이다. 카드 크기 클래스(데스크톱은 `shrink-shrink-none`, 모바일은 `w-full`)는 쓰는 곳이 카드에 준다. 쓰는 곳은 `search-body`와 `Figma` 스토리다. `card`는 피그마에 없는 코드 쪽 자리라 필수 prop으로 뒀고 기본 내용은 없다.
  - 플러그인 구조 검사에 "내용 맞춤(HUG) 축을 정하는 자식이 없는" 경우를 더했다. 자식이 모두 그 축에서 부모 채움(FILL)이거나 절대 위치이면 막는다. 단, 부모 채움 자식이어도 안쪽이 크기를 정하면(고정 크기, 내용 맞춤 글자, 또는 그런 자식으로 정해지는 채움 틀) 정해진 것으로 본다. 처음에는 직접 자식만 보았으나 MenuItem 높이처럼 채움 틀 안의 글자 높이가 정하는 경우가 오탐으로 걸려 안쪽까지 본다. 쌓는 방향(주축)은 자식이 모두, 가로지르는 방향은 하나만 정하면 된다. 부모 채움 글자의 너비는 저장된 값이라 정하지 못한 것으로 본다. 최소 너비·높이가 변수에 연결돼 있으면 검사하지 않는다.
  - [[피그마 연동:구조 검사]] 문서는 고치지 않았다. 새 검사는 1번(고정 크기를 변수에 연결) 항목의 한 갈래로 읽히지만 "막는 것은 여덟 가지뿐"에 따라 명시하려면 문서 문구를 바꿔야 해서 허락을 받고 고친다.
"RenameField PR #482: State=Rest 삭제 정리": |
  - `shouldSelectOnMount` prop은 `State=Rest` 변형(선택하지 않은 모습)만을 위한 것이었고 앱과 FileItem·FileRow는 넘기지 않아(기본값 true) 지웠다. 마운트하면 늘 포커스를 주고 이름 전체를 선택한다. 앱 동작은 그대로다.
  - 그 prop만 보던 `NotSelected` 스토리를 지웠다. 선택·입력을 보는 `Default`, ref 합치기와 키 입력을 보는 `Controlled`는 남겼다.
  - 로컬 E2E는 돌리지 않았다. 앱 E2E가 3000번 포트를 고정으로 쓰는데 다른 작업자가 같은 컴퓨터에서 동시에 작업 중이라 다른 worktree의 서버를 시험할 수 있어서다. 이름 바꾸기를 지나는 E2E(`desktop-new-folder` 등)는 CI의 E2E 결과로 확인했다.
"NavigationPane PR #481: Figma 스토리 되살림": |
  - 피그마 `items` 슬롯 기본 내용(NavigationItem 여섯: 바탕 화면·Blog·React·Next.js·TypeScript·휴지통)과 같은 항목으로 `Figma` 스토리를 다시 만들었다. 아이콘은 앱 탐색 창과 같게 바탕 화면은 `ic_fluent_desktop_20_regular`(`text-text-fill-primary`), 폴더는 `images/file-folder`, 휴지통은 `images/file-recycle-bin-full`이다.
  - 항목 너비는 피그마 원본 너비 240인 `w-size-navigation-item-width`를 항목마다 줬다. 탐색 창이 HUG라 항목이 너비를 정한다. 앱(`explorer-window-layer.tsx`)은 같은 자리에 값이 같은(240) `w-size-search-box-width`를 쓰고 있어 `w-size-navigation-item-width`로 바꿨다. 값이 같아 모양은 바뀌지 않는다.
  - treeitem이 tree 안에 있어야 하므로 스토리에서 `NavigationPane`에 앱과 같은 `role="tree"`·`aria-label="탐색 창"`을 줬다.
  - 넘긴 항목이 그려지는지만 보던 `Default` 스토리는 [[테스트 작성 규칙:테스트 지침]] 4번대로 지웠다.
"ExplorerAddressRow PR #479: 슬롯 기본 내용과 스토리 정리": |
  - 모든 스토리의 Items 슬롯에 피그마 Breadcrumb 기본 내용(`BreadcrumbItem` 바탕 화면·Blog)을 meta `args.items`로 넣었다. 동작 스토리가 쓰던 `경로 칸` 글자 상자는 지웠다.
  - [[테스트 작성 규칙:테스트 지침]] 4번(넘긴 값이 그대로 나오는지만 보는 검사)과 1번(모양은 캡처)에 따라 정리했다. `Disabled`(비활성 prop이 버튼에 넘어감), `Searching`(`searchValue`가 입력값이 됨) 스토리와, `Default`의 "desktop은 버튼 넷·검색 상자·경로를 그린다"·"`searchPlaceholder`로 안내 글자를 바꾼다" 단계, `Mobile`의 "뒤로·검색 버튼만 그린다" 단계를 지웠다. 버튼·검색 입력이 동작을 부르는 배선 검사와 모바일 검색 열기(포커스), desktop이 `search`를 무시하는 검사는 남겼다.
"Breadcrumb PR #480: 변형 정리와 스토리": |
  - `State=Editing`을 지우며 코드의 `editing`·`address` prop과 주소 입력창 분기를 지웠다. 앱은 이 prop을 쓰지 않았다(주소 입력은 아직 구현하지 않음). 루트에 `relative`가 필요하던 아래 파란 선도 함께 없앴다.
  - 스토리는 `Figma` 하나만 남겼다. `Default`(위치 아이콘과 넘긴 경로 칸이 그려지는지)는 넘긴 값이 그대로 나오는지만 보는 검사라 [[테스트 작성 규칙:테스트 지침]] 4번대로 지웠고, `Editing`은 변형과 함께 지웠다.
  - `Figma` 스토리의 Items 슬롯에는 `export.json` 기본 내용대로 `BreadcrumbItem` 둘(`바탕 화면` 구분자 있음, `Blog` 현재 위치·구분자 없음)을 넣었다.
  - 컴포넌트 JSDoc의 연결을 상태 섹션에서 [[디자인 시스템:컴포넌트 조립 규칙]]으로 바꿨다(상태 변형이 없어졌다).
"Flyout PR #467: Padding 삭제와 슬롯 기본 내용 스토리에서 정한 것": |
  - `Figma` 스토리의 Content 슬롯은 피그마 슬롯 기본 내용대로 메뉴 항목 넷(열기, 새 창에서 열기, 이름 바꾸기 `F2`, 삭제 `Delete`)과 구분선이다. Base UI 메뉴 밖이라 항목은 `MenuItem standalone`(버튼)으로 그렸고, 구분선은 `MenuPopup`의 구분선과 같은 배치 프레임(위 2·아래 6 여백) 안의 `Separator`다.
  - Flyout은 HUG지만 슬롯 기본 내용이 모두 FILL이라 피그마 폭 320은 내용이 정하지 않는다. 그래서 스토리는 지난 토큰 이름 바꾸기 때처럼 `w-size-search-box-wide-width`(320)로 감쌌다. 역할이 맞는 크기 토큰은 아니다.
  - `padding` prop을 지우며 Flyout은 옛 `compact` 모양(위아래 `spacing/2xs`, 좌우 0)만 남겼다. 옛 기본값이 `default`라 `padding`을 넘기지 않던 곳(모션 견본 `motion-flyout-enter`)은 이제 compact 여백으로 그린다. 앱에서 `padding`을 넘기지 않고 Flyout을 쓰는 곳은 없었다.
  - 옛 `Default`·`Acrylic` 스토리는 `Figma` 스토리가 두 재질을 다루므로 지웠다. `Default`의 `play`는 넘긴 역할·이름이 그대로 나오는지만 보는 검사라 옮기지 않았다.
  - [[디자인 시스템:컴포넌트 조립 규칙]]의 예 "Menu는 Flyout(`Padding=Compact`) 위에 쌓고"에서 지워진 속성 이름을 뺐다.
"컴포넌트 테스트 전환(묶음 C): 상태 속성 data-state·data-placement·data-indicator를 더함": |
  클래스로 확인하던 상태 모양을 [[테스트 작성 규칙:스토리 테스트]]의 결정대로 상태 속성으로 바꾸기 위해, 속성이 없던 컴포넌트에 더했다. `WindowTitle`에 `data-state`(`active`·`inactive`), `WindowFrame`에 `data-state`와 `data-placement`(`normal`·`maximized`·`snapped`), `Toc`에 `data-state`(`expanded`·`collapsed`), `TaskbarButton`에 `data-indicator`(`none`·`running`·`active`)를 붙였다. 값은 prop 값을 그대로 쓴다. `aria-*`로 나타낼 수 있는 상태가 아니고(창 활성 여부, 배치, 목차 접힘, 표시줄 종류), 같은 저장소의 `data-window-state` 같은 `data-*` 관례가 있어 `data-*`로 정했다. 문서에 이 속성 이름을 정해 둔 곳은 없으므로 이름이 맞는지 검토가 필요하다.
"컴포넌트 테스트 전환(묶음 C): 고정·변형 모양 확인은 빼고, 몇 가지는 스토리용으로 바꿈": |
  묶음 C 25개 컴포넌트의 테스트 101개 중 30개는 고정 모양(클래스) 확인이거나 `Parity` 스토리의 변형 인자(material, device, kind, align)가 캡처로 맡는 것이라 뺐다. 대응표는 작업 중에 썼고 PR에는 남기지 않았다. 스토리로 옮기며 바꾼 것은 다음과 같다. `SnapPreview`의 role을 `presentation`에서 `img`로 바꿨다(`aria-label`을 단 `presentation`은 역할 충돌로 보일 수 있어 미리 피했고, 실제로 걸리는지는 시험하지 않았다). `TaskbarPreviewList`는 빈 `list`가 `aria-required-children`에 걸릴 수 있어 미리 `listitem`을 넣었다(시험하지 않았다). `WindowPreview`의 닫기 버튼은 CSS `:hover`일 때만 보이고 합성 이벤트는 `:hover`를 만들지 않아, 숨은 요소는 역할 이름이 비므로 `getByLabelText`로 찾았다. `TaskbarButton`의 아이콘은 역할이 없는 장식이라 `data-testid`로 찾았다(최후 수단).
"웹 앱 컴포넌트 테스트 → play(B 묶음): 풀지 못한 것": |
  - 색 대비: 창 둘이 열린 상태에서 뒤 창이 앞으로 오면 Chrome 2의 비활성 제목(`text-text-fill-tertiary`)이 axe `color-contrast`에 걸린다. 색은 사람이 판단할 문제라 코드를 고치지 않고, `TwoWindows`의 `play`를 맨 앞 창을 다시 누르는 것으로 끝내 끝 모습에서 드러나지 않게 했다. 위반 자체는 남아 있다.
  - shell 스토리 `DesktopAndTaskbar`, `StartMenu`, `RestartWithOpenWindow`: Chrome 새 탭 검색칸이 `role="searchbox"`인데 `aria-expanded`를 가졌고(`aria-allowed-attr`), 탭 목록(`tablist`) 안에 닫기 버튼이 있다(`aria-required-children`). 모두 다른 묶음이 맡은 Chrome 코드의 문제라 고치지 않고 `shell/story-data.ts`의 `WINDOW_STORY_A11Y`로 그 스토리에서만 규칙을 껐다. 외부 라이브러리 때문이 아니므로 규칙상 임시이며, Chrome 쪽을 고치면 지운다. `WindowPreview`의 label-content-name-mismatch는 검사 전에 미리보기를 닫아 피했다.
  - 못 옮긴 검사: "쓰는 곳이 넘긴 창 내용(`renderWindow`)이 미리보기 축소 화면에 들어간다"(`getAllByText('창 내용 chrome')`). 공통 `renderStoryWindow`는 축소 화면 글자가 카드 이름과 달라 `label-content-name-mismatch`가 걸린다. `WithWindows`는 카드 제목과 개수만 확인한다. 살릴 방법을 정해야 한다.
  - 스토리 파일을 통째로 돌릴 때 앞 스토리가 axe로 실패하면 뒤 스토리가 이유 없이 실패한다(원인은 앞 실패의 잔여 상태로 보임).
"Scrollbar PR #506: 손잡이 기본 위치 토큰": |
  - 피그마 손잡이(thumb)는 절대 위치라 `export.json`에 위치 변수가 없다. PNG에서 잰 위치 10px에 맞는 토큰 `spacing/md-nudge`(10px)를 골라 `top-spacing-md-nudge`로 썼다. 길이는 이미 `size/scrollbar/thumb-length`(119.4444)를 쓰고 있어 그대로다. 실행 중 계산(`scroll-thumb.ts`)은 바꾸지 않았다.
"ScrollArea PR #507: 폴더 옮김, 키보드 포커스, Hover 캡처 위치": |
  - 캡처 도구가 `src/components/scroll-area/scroll-area.stories.tsx`에서 `Figma` 스토리를 찾으므로 `scroll-area.tsx`·스토리와 ScrollArea만 쓰는 `scroll-thumb.ts`(+테스트)를 `scrollbar/`에서 `scroll-area/`로 옮겼다. `index.ts`와 SearchResults의 import도 바꿨다.
  - 스크롤 영역의 키보드 포커스는 "넘치는데 안에 포커스할 요소가 없을 때만" 영역에 `tabIndex=0`을 준다(`scroll-focus.ts`의 `needsScrollFocus`, 단위 테스트). 늘 주면 시작 메뉴·탐색기처럼 항목에 포커스가 닿는 곳에 Tab 차례가 하나 더 생겨 [[접근성:Tab]]의 묶음 규칙과 어긋나기 때문이다. axe `scrollable-region-focusable`도 안에 포커스할 요소가 있으면 통과한다(시험 결과). 포커스 고리는 루트가 내용을 잘라 영역에 그리면 보이지 않으므로 루트에 `has-[>[data-scrollbar-hidden]:focus-visible]:` 변형으로 그렸다(버튼과 같은 `outline-*-focus-outer` 토큰).
  - Hover 캡처 위치는 저장소 관례(`data-parity-target`)를 따라 캡처 대상의 속성 `data-parity-hover`(안쪽 요소의 CSS 선택자)로 정했다. 도구(`story-page.ts`의 `pointerTarget`)는 이 속성이 있으면 그 요소 가운데에 마우스를 올린다(단위 테스트 `story-page.test.ts`). ScrollArea `Figma` 스토리는 `[data-state]`(스크롤바)를 적었다. [[피그마 연동:스토리 규칙]]의 Hover 문장에 이 경우를 더했다.
  - 동작 스토리는 `Overflow`(넘치면 막대 보임·올리면 펼침·내리면 접힘·스크롤하면 막대 이동·포커스할 항목이 없으면 Tab이 영역에 닿음)와 `FitsContent`(넘치지 않으면 숨김·포커스 받지 않음)다. 둘 다 `Figma`와 같은 크기 토큰(`w-size-list-item-width`·`h-size-scrollbar-length`)과 ListItem 목록을 쓰고, 버튼 8개를 넣던 옛 `Overflow`와 `w/h-size-scrollbar-length` 정사각형의 `Default`는 지웠다. 방향키 스크롤은 합성 키 사건으로 일어나지 않아 포커스까지만 본다.
  - children을 줄지 않는 틀로 감싼 뒤 쓰는 곳(시작 본문·메뉴, 검색 본문·패널, 탐색기 본문·창, SearchResults) 30개 변형의 코드 캡처가 바꾸기 전과 바이트까지 같았다.
"SearchResults PR #512: 모바일 HUG와 스크롤을 쓰는 곳으로": |
  - 피그마 모바일 루트와 안쪽 `scroll` 틀이 모두 높이 HUG가 되어, 코드의 모바일 SearchResults에서 ScrollArea를 걷어내고 두 프레임을 한 `div`(세로 간격 16, 반경 `radius/control`)로 그렸다. 너비는 그대로 쓰는 곳이 정한다.
  - 쓰는 곳 `search-body`의 결과 화면은 같은 PR에서 모바일만 `ScrollArea`(`size-full rounded-radius-control` + 받은 className)로 감싸고 SearchResults에는 `w-full`을 줬다. 옛 SearchResults 안의 ScrollArea와 같은 구성이라 `contentClassName`(여백)은 주지 않았다. 조립 PR이 이 자리를 다시 바꿀 수 있다.
  - 바꾸기 전후로 시작·검색·탐색기 조립과 SearchResults 데스크톱 29개 변형의 코드 캡처가 바이트까지 같았고, 달라진 것은 SearchResults `Device=Mobile` 단독 캡처(높이 465 → 내용 611)뿐이다. `Figma` 스토리는 이미 모바일에 너비만 주고 있어 고치지 않았다.
"캡처 도구: SHA 주소, 캡처 화면 고정, 빈 HUG 제외": |
  - 캡처와 모션 검사의 화면을 `tools/figma-parity/src/capture-viewport.ts`의 1600×900으로 고정했다(두 `playwright*.config.ts`가 읽는다). 요청은 캡처 설정이었으나 모션 검사도 같은 `Desktop Chrome` 기본 화면(1280×720)을 쓰므로 함께 고쳤다. 전체 캡처 493개를 고치기 전후로 비교하니 크기가 바뀐 그림은 없고 373개는 픽셀까지 같았다. 나머지 120개는 글자·가장자리·이미지 크기 조정의 아주 작은 픽셀 차이였다(같은 설정으로 두 번 돌려도 3개가 달랐다).
  - `emptyHugSlot` 표시는 변형 항목의 불리언으로 읽고(`VariantEntry.emptyHugSlot`, 표시가 없으면 false), 불리언이 아니면 `export.json` 읽기가 실패하게 했다. 표에서는 그 변형의 코드 칸에 `조립에서 확인`을 쓰고(`CaptureRow.emptyHugSlot`), 캡처 실패로 세지 않으며 `parity-captures`에도 올리지 않는다. 그 대상 폴더를 다시 쓸 때 옛 캡처는 지워진다. 피그마 그림 파일은 폴더에 그대로 두고 `export.json`이 가리키는 파일 검사도 그대로다.
  - 문서는 [[피그마 연동:캡처 표]]에 화면 조건 줄을, [[피그마 연동:스토리 규칙]]에 빈 HUG 슬롯 처리를, [[피그마 연동:CI]]에 SHA 주소의 이유를 더했다. [[남은 작업]]에서는 캡처 도구 줄, 스토리 규칙 문서 고침 줄, CI 문서 고침 줄을 지웠다(스토리 규칙 줄은 "`Figma` 스토리를 두지 않고 조립 캡처로 확인"까지 새 문단에 담았기 때문이다). 9번 묶음 문구도 "캡처 도구는 끝남"으로 고쳤다.
  - SHA 주소가 실제로 새 그림을 보여 주는지는 한 PR에서 CI를 두 번 돌려 봐야 안다(논의의 남은 일). 이 PR에서는 단위 테스트로 주소 모양만 확인했다.
  - 고치지 않고 보고만 하는 것: 앱 E2E(`apps/web/playwright.config.ts`)는 `Desktop Chrome` 기본 1280×720이고 `window.test.ts`·`start-menu.test.ts`가 1280×720·1280×200 등을 직접 정한다. 스토리 테스트(`vitest.storybook.config.ts` 둘)는 Vitest 브라우저 기본 화면을 쓴다. 노트북 구간이 생기면 이 둘은 노트북 코드를 돌리게 되므로 값을 정해야 한다.
"토큰 클래스 이름 바꾸기: 역할을 고른 곳": |
  스토리 감싸기처럼 역할이 뚜렷하지 않은 크기는 실제 쓰임이 가까운 변수로 옮겼다. Flyout 스토리의 `w-320`은 Chrome 새 탭 검색 추천을 따라 `w-size-search-box-wide-width`, 빈 자리 `h-16`은 `h-spacing-lg`다. Popover 스토리의 트리거는 `h-size-control-height`·`w-size-button-min-width`, 빈 슬롯은 `size/popover/slot`이다. `sample-jump-list`의 `w-400`은 안에 든 ListItem 너비, `chrome-post-tab` 스토리의 `w-720`은 글 폭으로 보았다. `post-blocks`의 할 일 표시 칸도 목록 표시와 같은 `size-size-post-block-marker`로 두었다. 맞는 역할이 없는 값(스토리 캔버스, 모션 견본의 무대)은 그대로 두고 코드 전용 변수 후보로 보고했다.
"코드 일괄 작업: ItemListRow가 속성과 ref를 넘김": |
  `ItemListRow`가 div 속성과 `ref`(`useImperativeHandle`)를 줄에 넘기고 `onClick`·`onKeyDown`은 열기와 함께 부른다. 모두 목록 줄이 `ContextMenuArea`의 `area`가 된다. Shift+F10은 브라우저가 보내는 `contextmenu`를 포커스한 줄에 보내는 것으로, 길게 누르기는 `touchstart` 500ms로 스토리에서 시험했다(실제 키 입력은 사람이 한 번 확인).
"마지막 맞춤: PinnedTile 테두리를 안쪽 선으로": |
  전체 캡처에서 새 탭 타일의 `React 19 훅 정리`가 코드에서만 잘렸다. 피그마 Rest·Pressed는 선이 없어 글자 폭이 87인데, 코드는 투명 테두리 자리를 늘 둬 85였다. 피그마 Hover는 선이 자리를 차지하지만(`strokesIncludedInLayout`) 그대로 옮기면 가리킬 때 글자가 잘리므로, 선을 `inner-border`로 그려 자리를 차지하지 않게 했다. 그래서 Hover의 글자 폭만 피그마(85)와 다른 87이다.
"스토리 스타일 금지 ⑧: 마무리(노드 이름 배열, 남은 예외)": |
  - FigmaFrame `node`가 이름 배열도 받는다(`['items', 'nav/바탕 화면']`). 피그마 노드 이름에 `/`가 들어 있으면 문자열 경로로 고를 수 없어서다(#526 NavigationPane 보고). NavigationPane 스토리는 NavigationItem export.json으로 대신 감싸던 것을 자기 export.json의 `items` 안 노드로 바꿨다(크기가 같아 그림이 같다).
  - #527이 감싸는 요소를 `grid w-fit`으로 바꾸면서 교차축 채움(`align-self: stretch`)이 늘어나지 않게 되어, 그 축 크기를 `auto`로 준다(#527 병합 때 고쳤다). 이 변경으로 #526에서 4픽셀 달랐던 `navigation-item` expanded 네 변형도 바꾸기 전 캡처와 같아졌다.
  - #525가 앱 테스트도 `@seojaewan/design-system/story`를 가져오게 해서 [[저장소 구성:디자인 시스템 패키지 구조]]의 "스토리만 가져온다"를 "스토리와 테스트만 가져온다"로 맞췄다. [[테스트 작성 규칙:스토리 테스트]]의 `node` 설명에 이름 배열을 더했다.
  - `storyStylePendingFiles`에는 결정이 필요한 두 파일만 남아 주석을 "결정을 기다리는 스토리"로 바꿨다: `Patterns/Chrome/ImageViewer`(⑥), `Patterns/Explorer/Content`의 빈 탐색 창 상자(⑦). 정해지면 목록을 없앤다.
"마지막 맞춤: 빈 HUG 단독 스토리를 지운 범위": |
  전 변형이 빈 HUG인 17개(BestMatchCard, BrowserTabStrip, Callout, CodeBlock, Equation, Flyout, ListGroup, Menu, NavigationPane, Popover, Quote, SearchResults, StartMenuFooter, Table, Taskbar, TaskbarPreviewList, TileGrid)의 `Figma` 스토리를 지웠다. `Figma`만 있던 Callout, Equation, NavigationPane, TileGrid에는 내용을 채운 `Default`(TileGrid는 `Center`도)를 새로 뒀다. 파일을 지우면 카탈로그에서 빠지기 때문이다.
  일부 변형만 빈 HUG인 4개는 `Figma` 스토리를 뒀다. 표시 없는 변형(Breadcrumb `Editing`, ExplorerAddressRow `Mobile`·`Open`, Toc `Collapsed`, Toggle `Collapsed`)을 단독 캡처가 아직 찍기 때문이다.
"마지막 맞춤: 조립 캡처에 없는 빈 HUG 변형": |
  조립 `export.json`의 인스턴스 속성으로 빈 HUG 변형이 어느 조립에서 찍히는지 세었다. 42개 중 아래 6개는 어떤 조립에도 없다. 조립 캡처는 피그마 조립 그림이 있어야 찍히고 `figma/`는 고치지 않으므로, 조립 스토리를 더해도 비교되지 않는다. 그래서 앱 코드가 쓰지 않는 네 변형은 디자인 시스템에 내용을 채운 일반 스토리만 뒀다.

  | 변형 | 앱 사용 | 처리 |
  |---|---|---|
  | Flyout `Acrylic`·`Default` | 없음(모두 `Compact`) | `Acrylic` 스토리 |
  | Flyout `Solid`·`Default` | 없음 | 기존 `Default` 스토리 |
  | Taskbar `Solid` | 없음 | `Solid` 스토리 |
  | TaskbarPreviewList `Solid` | 없음 | `Solid` 스토리 |
  | Popover `Bottom-Center`·`Closed` | 있음(SnapLayoutMenu) | 스토리 없음. 닫히면 트리거만 그려 배치와 상관없고, 다른 닫힌 변형이 조립에서 찍힌다 |
  | Popover `Right-Start`·`Closed` | 있음(MenuPopup) | 위와 같다 |

  나머지 빈 HUG 변형은 모두 조립에서 찍힌다.
"PR #484 Toc: 동작 확인용 임시 스토리를 지우고 Figma 스토리만 둠": |
  `Toc`의 `Figma` 스토리 슬롯에 피그마 `Items` 기본 내용과 같은 `TocItem` 4개(`use 훅` 활성, `useActionState`, `useOptimistic`, `마이그레이션`)를 넣고 빈 슬롯 주석을 지웠다. 접힌 변형은 슬롯을 그리지 않으므로 같은 렌더를 쓴다. `Default`(제목 `titleProps`·children 전달 확인)와 `Collapsed`(children이 안 그려짐 확인) 스토리는 `<span>항목</span>` 가짜 내용으로 넘긴 값이 그대로 나오는지만 보는 검사라 [[테스트 작성 규칙:테스트 지침]]의 4번에 따라 지웠다. 앱 쪽 `Toc` 사용(`chrome-page`)은 prop이 그대로라 고치지 않았다. 캡처는 두 변형 모두 글자 가장자리 말고 차이가 없다.
"스토리 스타일 금지 ④: CodeBlock 실제 코드 강조": |
  - 코드 조각을 칠하는 일을 `CodeBlock`이 맡게 했다. `children` 대신 줄마다의 글자 조각 `lines`(`CodeBlockToken[][]`, 조각은 `text`와 `syntax` 갈래 이름 또는 null)를 받아 `code-syntax` 색 span으로 그린다. 갈래별 클래스 표(`CODE_SYNTAX_CLASS_NAMES`)와 줄 그리기는 앱 `post-blocks.tsx`의 `renderCodeLines`에서 그대로 옮겼다. 앱은 `lines={block.highlighted ?? toPlainCodeLines(block.code)}`로 넘긴다(강조하지 않은 코드는 줄마다 색 없는 조각 하나). 앱의 `CodeToken`이 `CodeBlockToken`에 들어가는지는 타입 검사가 본다. 앱 그림은 DOM 글자가 같아 바뀌지 않는다.
  - 스토리 내용은 디자인 시스템 스토리 데이터 `components/code-block/story-data.ts`의 `codeBlockStorySample`이다. 코드(`code`)와 언어 이름(`label`)은 export.json에서 읽고(Code 슬롯의 `code` 글자, Language 속성 기본값 `언어`), 강조 결과(`lines`)는 앱 강조기 결과를 옮긴 것이다. 디자인 시스템은 강조기(Shiki)를 가질 수 없고(새 패키지), 앱 강조기는 서버 전용이라 스토리에서 돌릴 수 없어 데이터로 두고, 앱 단위 테스트(`content/code-highlight/code-highlight.test.ts`의 "스토리의 강조된 코드는 실제 강조 결과다")가 `highlightCode(code, language)`와 같은지 확인한다. 스토리 데이터는 `src/story.ts`로 연다.
  - 강조 언어와 표시 이름을 나눴다. `label`(`언어`)은 머리에 보이는 이름이고 `language`(`tsx`)는 강조에 쓴 Shiki 언어다. 피그마 코드가 JSX를 쓰는 TypeScript이고 Chrome/Page 견본(같은 코드)도 `tsx`라 골랐다. `ts`로 강조하면 JSX를 비교식으로 읽어 피그마와 더 달라진다.
  - 앱 테스트가 `@seojaewan/design-system/story`를 가져오도록 boundaries 정책에서 이 진입점을 테스트 파일에도 열었다(`no-restricted-imports`는 이미 테스트를 뺐다). [[저장소 구성:디자인 시스템 패키지 구조]]의 `story.ts` 설명("스토리만 가져온다")과 다르니 문서 반영이 필요하다.
  - 앱 스토리 데이터의 손으로 칠한 강조 결과 두 곳(`post-blocks/story-data.ts`의 `sampleCodeLines`, `chrome-page/story-data.ts`의 `postCodeLines`)도 실제 강조 결과로 바꾸고 같은 테스트로 확인한다. 앱 스토리 파일은 고치지 않았다.
  - `Figma`·`Copy` 스토리는 `figmaFrame(codeBlockExport)` 데코레이터로 너비를 받고 같은 견본을 그린다. `Copy`는 견본 코드가 복사되는지 본다(`const a = 1;` 가짜 코드를 지웠다).
  - 피그마와 실제 강조 결과가 다르다(검정인 `punctuation`과 기본 글자색의 차이는 같은 색이라 뺐다). CodeBlock·Chrome/Page `Page=Post`(같은 코드): 1행 `post`가 피그마 `variable`, 실제 `variable-constant`(`const` 이름). 2행 `{post}`의 `{`·`}`가 피그마 `punctuation`, 실제 `keyword`(JSX 식 괄호). Chrome/PostBlocks: `count`가 `variable`→`variable-constant`, `{post.title}`의 `{`·`}`가 `punctuation`→`keyword`, 정규식의 `/` 둘이 `regexp`→`string`, `\n`이 `escape`→`regexp`, `"slug"`가 `key-value`→`string`, `$slug`가 `variable-navy`→`variable`, `@`가 `invalid`→기본 글자색. tsx 강조로는 피그마 견본의 `key-value`·`variable-navy`·`invalid` 색이 나오지 않는다. 어느 쪽을 맞출지 정하지 않았다.
  - 캡처는 위 글자 색만큼 달라졌다: code-block(피그마와의 차이 32 초과 1008→1063픽셀), `patterns/chrome/page` 두 변형·`patterns/window/chrome` 세 변형(각 +55), `patterns/chrome/post-blocks`(11130→11306), `patterns/window/snap-assist`(줄인 창이라 12픽셀). 나머지 다른 그림은 바꾸기 전에도 흔들리던 것이거나 차이 32 이하 몇 픽셀이다.
"PR #485 CodeBlock: Figma 스토리에 코드 2줄 기본 내용을 넣고 Highlighted를 대신함": |
  피그마 `Code` 슬롯 기본 내용(`const post = use(fetchPost(slug));` / `return <Article post={post} />;`)의 글자별 색(`code-syntax/*`)을 같은 토큰 클래스의 span으로 옮겨 `Figma` 스토리에 넣었다. 언어 글자는 피그마 기본값 `언어`다. 예전 `Highlighted` 스토리(`const count = 1;` 가짜 코드)는 같은 일을 하는 임시 스토리라 지웠다. 동작 스토리 `Copy`는 복사 단추 동작을 보므로 남겼다. 컴포넌트 코드는 `children`에 기본값이 없어 바꾸지 않았다.
"PR #486 Equation: Figma 스토리의 슬롯에 수식 자산을 크기 변수로 넣음, 제품 슬롯은 그대로": |
  피그마 `Formula` 슬롯 기본 내용인 수식 자산 인스턴스(`images/equation-quadratic-formula`)를 `ImageAsset`으로 `Figma` 스토리에 넣고, 크기는 피그마와 같은 변수 클래스(`w-size-equation-width`·`h-size-equation-height`, PC 194×50)로 줬다. 자산이 KaTeX 렌더 그림(390×100)으로 바뀌어 `generate:assets`를 다시 돌렸고 `equation-quadratic-formula.webp`와 `image-data.ts`의 크기(400×112 → 390×100)가 바뀌었다. `Equation` 컴포넌트 코드는 `children` 슬롯 그대로 두었다. 제품은 `PostBlocks`가 서버에서 KaTeX로 그린 HTML을 같은 슬롯에 넣으므로 컴포넌트가 이미지나 KaTeX를 직접 알 필요가 없고, 기본 내용은 스토리가 넣는 것이 규칙이기 때문이다. `x = 1` 글자만 넣던 `Default` 스토리는 넘긴 값이 나오는지만 보는 임시 스토리라 지웠다. 차이 그림에 수식 가장자리가 남는다(같은 390×100 그림을 194×50으로 줄이는 엔진의 리샘플링 차이로 위치와 크기는 같다).
"PR #487 Quote: Figma 스토리에 글 본문 글자를 넣고 임시 Default 스토리를 지움": |
  `Quote`의 `Figma` 스토리를 새로 만들어 피그마 `Content` 슬롯 기본 내용 `인용 블록의 글이다. 출처나 강조할 문장을 담는다.`를 `type-body-large text-text-fill-primary` 문단으로 넣고, 너비는 피그마 노드 폭(720)과 같은 `w-size-post-width`로 줬다. `인용 글`만 넣어 값이 나오는지 보던 `Default` 스토리는 임시 스토리라 지웠다. 컴포넌트 코드는 바꾸지 않았다. 차이 그림에는 글자 가장자리만 남고 왼쪽 막대와 여백은 같다.
"PR #488 Callout: Figma 스토리에 글 본문 글자를 넣고 임시 Default 스토리를 지움": |
  `Callout`의 `Figma` 스토리를 새로 만들어 피그마 기본 `icon`(`ic_fluent_info_24_regular`)과 `Content` 슬롯 기본 내용 `콜아웃은 아이콘과 함께 눈에 띄게 보여 줄 글을 담는다. 글자 서식도 쓸 수 있다.`를 넣었다. 앞부분은 `type-body-large`, `글자 서식`은 피그마 `Body Large Strong`이라 `<strong className="type-body-large-strong">`으로 칠했다(앱의 굵게 클래스 `font-font-weight-semibold`가 아니라 글자 스타일 클래스를 쓴 것은 피그마가 굵기만이 아니라 스타일을 걸었기 때문이다). 너비는 `w-size-post-width`다. `콜아웃 글`만 넣던 `Default` 스토리는 임시 스토리라 지웠다. 컴포넌트 코드는 바꾸지 않았다.
"PR #489 Toggle: 내용 영역의 들여쓰기와 간격을 컴포넌트가 가짐": |
  `Figma` 스토리의 `Content` 슬롯에 피그마 기본 내용 `토글을 펼치면 보이는 글이다.`(`type-body-large`)를 넣었다. 슬롯을 채우자 `export.json`의 `Content` 슬롯이 왼쪽 안쪽 여백 `spacing/2xl`(24)과 블록 사이 간격 `spacing/sm`을 가진 것이 드러났다. 코드의 내용 영역에는 이 값이 없고 `PostBlocks`가 토글 안쪽을 `pl-spacing-2xl gap-spacing-xs` 감싸개로 따로 들였다. 피그마가 컴포넌트에 둔 값이라 `Toggle`의 내용 영역에 `flex flex-col gap-spacing-sm pl-spacing-2xl`을 옮기고, `PostBlocks`의 감싸개를 지웠다. 그래서 앱의 토글 안쪽 블록 사이 간격이 `spacing/xs`에서 `spacing/sm`으로 바뀐다(피그마 값이다). 정렬은 예전 감싸개처럼 늘이기(stretch)로 두었다. 임시 확인 스토리(`Default`·`Open`·`Controlled`)는 동작을 보는 것이라 남겼다. `Chrome/PostBlocks` 조립 캡처는 이 PR과 상관없이 다른 컴포넌트 PR이 병합되기 전이라 곳곳에 글자·모양 차이가 남아 있고, 토글 부분의 위치와 들여쓰기는 맞는다.
"PR #490 Table: Figma 스토리에 표 줄 3개를 넣고 임시 Default 스토리를 지움": |
  `Table`의 `Figma` 스토리를 새로 만들어 피그마 `Rows` 슬롯 기본 내용(머리 줄 `훅`·`하는 일`, 본문 줄 `use`·`Promise와 Context를 렌더링 중에 읽는다`, `useActionState`·`폼 제출 결과와 대기 상태를 다룬다`)을 `TableCell`로 넣었다. 너비는 `w-size-post-width`다. 접근성 이름은 피그마에 없어 `aria-label="훅 비교"`를 임의로 달았다(axe가 요구하는 것은 아니고 스크린 리더용 이름이다). 값이 나오는지만 보던 `Default` 스토리(행·칸 역할 확인)는 임시 스토리라 지웠다. 컴포넌트 코드는 바꾸지 않았다. 차이 그림에는 두 칸 사이 세로 선이 1px 남는다. 피그마 칸 너비가 359.5라 반 픽셀 위치를 엔진이 다르게 맞추는 것으로 보인다.
"PR #493 window 조립: 코드 서체 교체 뒤 다시 내보낸 그림만 받음": |
  피그마 코드 서체가 Nanum Gothic Coding으로 바뀌어 `Window/Chrome` 세 변형과 `Window/SnapAssist` 그림이 다시 내보내졌다. 코드 서체는 토큰 PR #495에서 이미 바뀌었고, 이 조립들이 지운 prop(Flyout `padding`, `material` 등)을 쓰지 않아(typecheck 통과) 코드는 바꾸지 않고 `main`만 받아 왔다. 캡처 차이 그림에는 글자 가장자리만 남는다. `Window/SnapAssist`의 창 제목(`React 19 훅 정리 - Chrome`)은 코드가 1px 위에 있어 밝게 보이고([[한계:글자 기준선]]), 축소 화면 안은 줄인 글자의 가장자리 차이뿐이다.
"조립 PR #492 chrome: RichText 컴포넌트와 인라인 코드 글자 스타일": |
  - 글 블록들이 `PostBlocks` 안의 함수(`renderRichText`·`renderAnnotatedText`)로 글자 조각을 그리던 것을 `RichText` 컴포넌트로 옮겼다. 자리는 `features/chrome/components/post-blocks/components/rich-text/`다. 앱 코드에서 쓰는 곳이 `PostBlocks` 하나라 그 칸 아래에 두었다([[저장소 구성:앱 폴더 구조]]). 문단·제목·목록·인용·콜아웃·토글 제목·표 칸이 모두 이것을 쓴다.
  - 인라인 코드는 `type-code`(줄 높이 20) 대신 `type-code-inline`(피그마 `Code/Inline`, 줄 높이 16)과 `text-post-inline-code`로 그린다. 감싸는 요소를 `span`에서 `code`로 바꿨고, `Annotations` 스토리의 확인도 `code`를 찾게 고쳤다.
  - 단위 테스트는 컴포넌트 테스트 파일(`*.test.tsx`)을 두지 않는다는 규칙([[테스트 작성 규칙:테스트 종류]])에 맞춰, 서식을 고르는 순수 함수(`getRichTextMarks`: 서식별로 감쌀 요소와 겹치는 차례)와 링크가 가는 곳을 정하는 함수(`getRichTextLinkTarget`)를 `rich-text/utils/rich-text-format/`으로 빼서 `.test.ts`로 서식마다 확인했다. 겹쳐 그린 결과(굵게+기울임+밑줄+취소선, 굵은 코드, 표 칸)는 원래 있던 `Patterns/Chrome/PostBlocks`의 `Annotations` 스토리 `play`가 본다.
  - Notion 색 지정(글자색·형광펜)은 [[Notion 블록:모양]]대로 받지 않고 그리지 않는다. 스키마에도 색 필드가 없다.
  - 표 칸 링크를 고르던 불리언 인자(`isBodyLarge`)를 `RichText`의 `linkSize`(`body-large`·`inherit`) prop으로 바꿨다.
  - 1px 어긋남: 같은 브랜치에서 인라인 코드만 `type-code`로 돌려 캡처하면 서식 문단이 1px 높아져 코드 그림이 1886px(피그마 1885px)이 되고, 그 아래가 모두 1px 내려간다. `type-code-inline`에서는 1885px로 같고 문단 아래 모든 줄 묶음이 어긋남 없이(위아래로 옮겨 봐도 0이 가장 맞음) 맞는다. 원인은 줄 높이 20인 코드 서체 인라인 상자가 본문 줄 상자(24)를 1px 넘긴 것이었다. 위 "마지막 맞춤: 고치지 않은 캡처 차이"의 PostBlocks 코드 줄 높이(201/200)도 이번 내보내기에서 피그마 코드 글자 상자가 200이 되어 풀렸다(한글 구간이 `Hangul/Code`가 아니라 `Code` 스타일로 바뀜). 검토 기록이라 그 항목은 고치지 않았다.
  - 남은 차이: 제목 2(`글자 서식과 목록`)와 북마크 글자, `Chrome/Page`의 글 제목·검색 결과 제목이 1px 위아래로 보인다([[한계:글자 기준선]]). 밑줄과 링크 밑줄은 선의 세로 위치가 엔진마다 달라 밝게 보인다. 나머지는 글자 가장자리다.
  - 이 PR의 `export.json`·PNG는 지금 피그마와 같다(`Chrome/PostBlocks` 1837 높이, 코드 글자 371×200, 수식 194×50을 피그마 MCP 메타데이터로 확인). 수식 자산(`equation-quadratic-formula.png`)은 이미 `main`에 있어 `generate:assets`가 바꾼 파일이 없다.
"마지막 맞춤: 고치지 않은 캡처 차이": |
  전체 캡처 493개 변형(단독 451개, 조립에서 확인 42개)의 차이 그림 중 남은 것은 코드로 고치지 않았다.
  - 어두운 바탕의 밝은 글자가 코드에서 더 굵어 보인다(accent 버튼, 바탕화면 아이콘 이름). 글자 스타일은 피그마와 같아 글자를 그리는 엔진의 차이로 봤다.
  - 한글 글자 폭이 소수라 피그마가 올림한 HUG 폭과 0.5~1px 다르다(Breadcrumb, DropDownButton, SectionHeader). 명령 모음(Explorer/Commands)은 이 차이가 쌓여 오른쪽 끝이 2px쯤 어긋난다.
  - 하위 메뉴 그림자가 피그마 조립 그림에서만 진하다(Menu/Desktop 등 5개 조립). 위 메뉴와 같은 효과 스타일이고 코드도 같은 토큰이라, 피그마가 중첩을 그린 결과로 봤다.
  - PostBlocks의 코드 줄 높이: 피그마 글자 상자는 10줄에 201, 코드는 200이다. 코드 블록 위쪽 전체가 1px 어긋나 보이는 원인이다.
"조립 PR #491 menu: 하위 메뉴를 조립 최상위로 옮긴 그림 반영": |
  - 피그마가 Menu/Desktop·ExplorerEmpty·RecycleBinEmpty의 하위 메뉴를 부모 Flyout 밖(조립 최상위의 절대 위치 형제)으로 옮겨 하위 메뉴 그림자가 한 번만 그려진다. 코드(`MenuPopup`의 Popover 하위 메뉴)는 원래 그림자를 한 번 그려 코드는 바꾸지 않았고, 주석만 피그마 구조에 맞췄다.
  - 하위 메뉴 영역에서 피그마와 코드 색이 8 넘게 다른 픽셀 가운데 글자 밖(그림자 쪽)이 4,000~4,700개에서 320~640개로 줄었다(변형 5개). 남은 것은 둥근 모서리와 흐림 가장자리의 엔진 차이로 보았다. 위 "마지막 맞춤: 고치지 않은 캡처 차이"의 하위 메뉴 그림자 항목은 이것으로 풀렸지만 검토 기록이라 고치지 않았다.
  - [[디자인 시스템:팝업]]의 하위 메뉴 줄에 "하위 메뉴는 Popover `Popup` 슬롯이 아니라 조립 최상위의 형제로 둔다"는 문장과 이유를 더했다(바로 위 줄의 "열린 팝업은 `Popover` 안의 절대 위치 자식"과 달라졌기 때문이다).
  - 이번에 컴포넌트에서 지운 prop(Flyout `padding`, Menu `material` 등)은 메뉴 조립 코드가 쓰지 않아 고친 것이 없다.
"조립 PR #494 explorer: 빈 슬롯 크기 기록만 바뀜": |
  - `export.json`에서 Breadcrumb `Items` 빈 슬롯 크기 기록이 100×100에서 114×24로 바뀌고 Breadcrumb `State` 속성이 빠졌다(두 변형). PNG는 그대로이고 두 변형 모두 여전히 빈 HUG(`emptyHugSlot`)라 캡처 도구가 찍지 않는다. 그래서 코드는 바꾸지 않고 `Patterns/Explorer/Content` 스토리 주석의 크기만 고쳤다. 지운 prop(Breadcrumb `editing` 등)은 이 조립 코드가 쓰지 않았다.
  - 스토리는 피그마 조립처럼 자리(Commands, items, Items)를 비운 채 둔다([[피그마 연동:스토리 규칙]]의 "데이터는 피그마 조립과 같다"). 실제 앱 데이터로 채우지 않았다.
"MenuSeparator PR #511: 새 컴포넌트와 바꾼 곳": |
  - 디자인 시스템에 `MenuSeparator`를 만들었다. 위 `spacing/2xs`·아래 `spacing/sm-nudge` 여백 안에 가로 `Separator`(`w-full`)를 둔다. 피그마에서 루트 너비는 FILL이라 코드 루트는 너비를 갖지 않고, 쓰는 곳이 `className="w-full"`로 메뉴 안쪽을 채운다. 속성이 없어 prop은 div 속성(`children` 제외)뿐이다.
  - `Figma` 스토리는 놓이는 자리인 메뉴 너비 `w-size-menu-width`(250)를 준다. 1px 선이 반 픽셀에 놓이지 않도록 Separator 스토리처럼 `layout: 'padded'`를 썼다.
  - 같은 감싸기를 쓰던 곳 넷을 바꿨다: 앱 `MenuPopup`의 구분선 줄, Flyout·Menu·Popover `Figma` 스토리.
  - Chrome 주소창 추천(`chrome-address-suggestions`)과 새 탭 검색 추천(`chrome-new-tab-search`)의 같은 여백 프레임은 `px-spacing-sm`이 더 있고 안에 구분선이 아니라 추천 목록(`listbox`)이 들어 있어 바꾸지 않았다.
"Flyout PR #509: 감싸는 너비를 지우고 항목에 메뉴 너비": |
  - 피그마 Flyout 너비가 320(맨숫자)에서 252(메뉴 항목 `size/menu/width` 250 + 테두리)로 바뀌어, `Figma` 스토리의 `w-size-search-box-wide-width`(320) 감싸기와 `data-parity-target`을 지웠다. Flyout이 스토리 루트의 첫 요소라 표시가 필요 없다. 메뉴 항목 넷에 `w-size-menu-width`를 주고 구분선(`MenuSeparator`)은 `w-full`로 그 너비를 채운다. 위 "Flyout PR #467"의 320 감싸기 항목은 이것으로 바뀌었다.
  - 모션 스토리 `motion-flyout-enter`도 같은 원칙으로 감싸는 너비를 지우고(여백 `p-spacing-2xl`은 그대로) 항목에 `w-size-menu-width`를 줬다. 모션 시간 검사는 통과했다.
  - Flyout 컴포넌트 코드는 바꾸지 않았다.
"Menu PR #510: 코드 변경 없음": |
  - 이 PR의 `export.json` 변경은 구분선이 `MenuSeparator` 인스턴스가 된 것뿐이다. `Figma` 스토리의 구분선은 #511에서 이미 `MenuSeparator`로 바꿨다.
  - 슬롯 항목은 피그마에서 FILL로 덮어써 Menu 안쪽 248을 채운다(메뉴 너비 250 항목이 넘치지 않게). 코드 스토리의 `MenuItem standalone`은 원래 `w-full`이라 같아 스토리도 고치지 않았다. 캡처 차이는 글자 가장자리뿐이다.
"Popover PR #508: 팝업 Flyout 감싸기 지움": |
  - 피그마 기본 팝업(Flyout)이 252(메뉴 항목 `size/menu/width` 250 + 테두리)가 되어, `Figma` 스토리 Popup 슬롯의 `w-size-search-box-wide-width`(320) 감싸기를 지우고 메뉴 항목 넷에 `w-size-menu-width`를 줬다. 구분선은 `w-full`. 위 "Popover PR #466"의 320 감싸기 항목은 이것으로 바뀌었다.
  - Popover 컴포넌트 코드는 바꾸지 않았다. 열린 변형 6개의 차이 그림에는 글자 가장자리와 팝업 테두리·그림자의 옅은 선만 남았다.
"Tooltip PR #505: label HUG, 코드 변경 없음": |
  - 피그마 `Type=Default`의 `label`이 FILL·높이 맞춤에서 HUG·너비와 높이 맞춤(`WIDTH_AND_HEIGHT`)으로 바뀌었다. 코드 Tooltip은 글자를 `inline-flex` 바탕에 바로 넣어 이미 글자 폭으로 너비가 정해지므로(HUG) 코드와 스토리를 바꾸지 않았다.
  - 피그마 글자는 이제 줄을 바꾸지 않지만, 코드는 바탕의 `max-w-size-tooltip-max-width`에 닿으면 줄을 바꾸는 동작을 그대로 뒀다. 긴 글자가 최대 너비를 넘어 삐져나오지 않게 하기 위해서다. 기본 글자("도움말")에서는 둘이 같다.
  - 차이 그림에는 한글 글자 가장자리만 남았다([[한계:HUG 글자 폭 올림]]).
"Menu PR #468: 슬롯 기본 내용 스토리와 쓰지 않는 material prop": |
  - `Figma` 스토리의 children(Flyout Content 슬롯)은 피그마 슬롯 기본 내용대로 Flyout과 같은 메뉴 항목 넷과 구분선이다. Base UI 메뉴 밖이라 항목은 `MenuItem standalone`으로 그렸다. 너비는 Menu가 가진 `size/menu/width`라 감싸지 않았다.
  - 옛 `Default` 스토리(children에 넣은 항목이 메뉴 안에 있는지 보는 `play`)는 `Figma` 스토리가 다루므로 지웠다.
  - 피그마 Menu는 안쪽 Flyout의 `Material`을 노출하지 않고(속성 정의가 비어 있다) 앱에서도 넘기는 곳이 없어, 코드 Menu의 `material` prop을 지웠다. Menu는 늘 Flyout 기본값(아크릴)이다. 이 PR에서 피그마가 바뀐 것은 아니고 전부터 그랬다.
"8단계 E2E: 핵심 흐름을 5~10개보다 많이 둠": |
  [[테스트 작성 규칙:E2E]]는 핵심 흐름 5~10개를 두라고 하지만, 8단계에서 흐름을 영역별로 나눠 15개를 더해 E2E가 41개가 됐다. 흐름 하나가 문서 섹션 하나씩에 대응하게 쓰다 보니 넘었다. 실제 CI에서 13초 안에 도는 크기다. 5~10개로 줄일지 문서를 41개 수준으로 고칠지 검토가 필요하다.
"Popover PR #466: 슬롯 기본 내용 스토리": |
  - 변형(Placement 6 × State 2)은 그대로라 컴포넌트 코드는 고치지 않았다. `Figma` 스토리를 다시 만들어 Trigger에는 전원 버튼(`IconButton` Subtle, `ic_fluent_power_20_regular`, 이름 "전원"), Popup에는 Flyout(아크릴)에 메뉴 항목 넷과 구분선을 넣었다.
  - 팝업 상자는 내용 너비(`w-max`)라 Flyout이 내용 폭으로 줄어든다. 피그마 원본 너비 320을 맞추려고 Flyout 스토리처럼 `w-size-search-box-wide-width`로 감쌌다.
  - 옛 `Default`·`Open` 스토리(닫히면 팝업이 없고 열리면 보이는지)는 `Figma` 스토리의 `state` 변형이 다루므로 지웠다.
"8단계 E2E: 모바일 길게 누르기와 터치 끌기는 E2E에 넣지 않음": |
  모바일 입력(길게 누르기 메뉴, 선택 없음)은 Playwright 기본 설정이 터치 장치가 아니라 합성 이벤트로 흉내 내야 해서 믿기 어렵다고 보고, 모바일은 폭 390 화면의 열기·전환·검색 흐름만 넣었다. 길게 누르기는 스토리 `play`가 맡는다.
"Tooltip PR #463: Material 삭제": |
  - 피그마에서 `Material` 속성이 지워져 코드의 `material` prop과 `TooltipMaterial` 타입, 재질 분기를 지웠다. `Type=Default`는 아크릴(칠 `Material/Acrylic Default`, 효과 `Surface/Tooltip (Acrylic)`), `Type=Balloon`은 전처럼 단색이다. 앱에서 `material`을 넘기는 곳은 없었다.
  - `Figma` 스토리의 args에서 `material`을 뺐다. Tooltip은 슬롯이 없어 스토리 내용은 그대로다.
  - `Default`(tooltip 역할과 글자)·`Balloon`(div 속성 넘김과 메시지) 동작 스토리는 지워진 변형만 보던 스토리가 아니라 그대로 두었다.
"피그마 플러그인: PR 본문 표, 페이지 읽기, 조립 구조 검사": |
  - PR 본문: 접는 기준 "변형 4개 초과"는 이번에 바뀌어 본문에 그림이 실리는 변형 수로 센다(대상의 전체 변형 수가 아님). 접은 대상은 `## 이름` 제목을 두지 않고 `<summary>`의 이름이 제목을 대신한다. 바뀐 변형이 없는 대상은 표에 0으로만 적고 그림 칸을 만들지 않는다.
  - PR 본문: 예전 본문에 있던 사라진 변형과 이름이 바뀌어 지운 이전 폴더, 조립 PR의 영역은 표 아래 목록으로 남겼다. 이미지 주소의 경로는 `encodeURI`로, 이름과 링크는 HTML 특수 문자를 바꿔 넣는다. 이미지에는 `alt`를 두지 않는다(변형 이름이 두 번 나오지 않게).
  - 페이지 읽기: 과도기의 `02 · Components` 페이지는 이름이 아니라 지금 쓰던 페이지 ID(`COMPONENTS_PAGE_ID`)로 알아본다. 그 페이지의 묶음은 지금처럼 영역 섹션, 새 컴포넌트 페이지의 묶음은 페이지 이름이다. 구분선 페이지는 앞뒤 공백을 뺀 이름이 `-`로만 된 페이지다. 문서용 컴포넌트는 앞 공백을 뺀 이름이 `.`으로 시작하는 컴포넌트 세트·단독 컴포넌트이고 조립 목록에서도 뺀다.
  - 구조 검사: 배치 프레임 검사는 노드 종류가 FRAME인 것만 본다(RECTANGLE·GROUP은 보지 않음). 숨긴 칠·선·효과는 보지 않는다. 조립 루트의 크기 예외는 고정 너비·높이의 변수 연결만 건너뛰고, 최소·최대 크기와 내용 맞춤 축 검사는 그대로다. 조립 안쪽 프레임과 인스턴스에서 덮어쓴 크기(`Chrome/Page`의 `top space`, `Start/Menu`·`Search/Panel`의 ShellSurface)는 예외가 아니다.
"인라인 style lint: 규칙을 거는 범위와 구현": |
  - `style` 값 제한은 `no-restricted-syntax`로 구현했다. JSX `style={{ … }}`의 속성 값이 문자열·숫자 리터럴, 음수 리터럴(`-1`), 식이 없는 템플릿이면 막는다. `style={조건 ? { … } : …}`·`style={조건 && { … }}`처럼 조건식·논리식이 고른 객체도 본다. 변수에 담아 넘긴 객체(`style={panelStyle}`)는 보지 않는다.
  - 범위는 토큰 클래스 검사와 같게 앱·디자인 시스템 소스(`*.test.*` 제외)로 했다. `no-restricted-syntax`는 블록마다 목록을 통째로 바꾸므로, default export 예외 파일(스토리, Next.js 예약 파일)에는 `files: \[[범위, 예외 파일]]`로 따로 걸었다.
  - 객체 `className` 키 값은 better-tailwindcss 셀렉터 설정으로 넣었다(플러그인 4.9.1의 `objectValues` 매처와 `path`). 함수 인자(`callee`), 변수 초기값(`variable`), JSX 속성 값(`attribute`)의 객체에서 경로가 `className`으로 끝나는 값을 검사한다. 셀렉터 종류에 `objectKey`는 없고, 매처가 함수 호출·함수 경계를 넘지 않아 `return { className: '…' }`처럼 이 셋 밖의 객체는 여전히 검사하지 않는다(지금 저장소에는 없다).
  - [[피그마 연동:토큰 사용 강제]]의 "lint는 … 넷 중 한 곳에 쓴다" 문단은 객체 `className` 키와 `style` 값 제한을 아직 적지 않았다. 문서를 고치지 않았으므로 반영이 필요하다.
"스토리 스타일 금지 ①: 도우미, 스토리 공개 경로, lint": |
  - 도우미는 `packages/design-system/src/story/`(`figma-frame.tsx`, `figma-frame-style.ts`, `story-stage.tsx`)에 두고 진입점 `src/story.ts`를 `package.json` `exports`의 `./story`로 열었다. 앱은 `@seojaewan/design-system/story`를 스토리 파일(`*.stories.tsx`, `story-*`)에서만 가져온다. 다른 앱 코드는 `no-restricted-imports`가, 스토리 밖의 디자인 시스템 진입은 boundaries가 막는다.
  - FigmaFrame은 스토리가 export.json을 직접 import해 받는다(`figmaFrame(listItemExport)`). 스토리 제목으로 export.json을 저절로 찾는 방법은 export.json이 모두 10MB라 미리 읽어 두면 무겁고, 미리 읽지 않으려면 두 Storybook preview에 비동기 loader를 따로 둬야 해서 고르지 않았다. 대신 데코레이터가 제목(`Components/<이름>`·`Patterns/<이름>`)과 export.json의 `name`이 다르면 오류를 내 다른 대상의 크기를 쓰지 못하게 했다.
  - 앱 스토리가 `apps/web/figma`의 export.json을 가져오게 `@figma/*` 별칭을 앱 `tsconfig.json`과 앱 Storybook Vite 설정에 더했다. 앱은 `../` import를 막아 다른 길이 없다. import 정렬은 이 별칭을 외부 패키지 묶음에 넣는다(simple-import-sort 기본 동작).
  - FigmaFrame 규칙: 스토리 args로 변형을 고르고, args에 없는 변형 속성은 아무 값이나 맞는 것으로 본다. 맞은 변형끼리 크기가 다르면 오류를 낸다. FIXED 축은 연결한 크기 변수를 CSS 변수 style(`width: var(--size-…)`)로 주고 `flex-shrink: 0`을 더한다. HUG 축은 비운다. FILL은 루트에는 없고(전체 473개 변형 확인) 안쪽 노드에서 부모 방향에 따라 주축은 `flex: 1 1 0`과 최소 크기 0, 교차축은 `align-self: stretch`로 준다. 감싸는 요소는 `inline-grid`라 자식이 그 크기로 늘어난다.
  - 합의한 범위에 더해 FigmaFrame에 `node`(노드 이름 경로, 예: `Content/ProfileButton`)를 두었다. 슬롯 안 자식이 고정 크기(Flyout의 MenuItem `size/menu/width`, Taskbar의 SearchBox)이거나 같은 줄에 HUG 형제가 있는 채움(StartMenuFooter의 ProfileButton)이라 슬롯을 여는 컴포넌트가 정할 수 없는 곳을, 쓰는 곳 클래스 없이 피그마 값으로 주기 위해서다.
  - StoryStage의 `target`은 대상을 `inline-flex`로 감싼다. 예전 스토리는 블록 `flex`라 MessageBox 조립에서 대상이 화면 폭으로 늘어나 캡처 코드 그림이 1664px였는데, 이제 피그마 노드 폭(640px)으로 찍힌다. `padded`는 예전 메시지 상자 스토리와 같은 블록 `p-spacing-5xl`, `top-center`는 대상이 늘어나지 않게 `items-start`를 더했다.
  - lint는 `*.stories.tsx`(디자인 시스템과 앱)에서 JSX `className`·`style`·`*ClassName` 속성, 객체의 `className`·`*ClassName` 키, `*ClassNames`·`*CLASS_NAMES` 변수를 오류로 막는다. 도우미 파일은 `*.stories.tsx`가 아니라 걸리지 않는다. 모션 견본 스토리(`motion-story/*.stories.tsx`)는 경로 단위 블록에서 `motionClassName` 속성과 `className={motionClassName}`만 허용한다.
  - 경고 없이 바로 오류로 켜려고, 아직 바꾸지 않은 스토리 97개 파일을 `storyStylePendingFiles` 목록(임시 경로 예외)에 넣었다. 영역별 PR이 스토리를 바꾸면서 목록에서 지우고, 마지막 PR이 목록을 없앤다. 한 PR에서 102개 파일과 컴포넌트 고침(슬롯 채움, 아이콘 자리, 코드 강조)을 모두 바꾸면 캡처 확인과 검토가 어려워 나눴다.
  - 시범으로 Bookmark·Toc(FigmaFrame), `Patterns/Desktop/Scene`(앱, `@figma` 별칭), `Patterns/Start/PowerButton`(StoryStage `bottom-end`), `Patterns/MessageBox/ReservedName`(StoryStage `padded`) 다섯 파일을 바꿨다.
  - 캡처 473개 변형의 코드 그림 md5를 바꾸기 전과 비교했다. 같지 않은 것은 셋이다. `patterns/message-box/reserved-name`은 위의 대상 폭 변화다. `navigation-pane`(16픽셀, 차이 32 이하)과 `patterns/chrome/page` wide(4픽셀)는 이 PR이 건드리지 않은 스토리로, 글자 가장자리 흔들림이다. 두 Storybook의 모든 스토리(385개)를 1600×900으로 찍어 비교한 결과도 바꾸기 전 두 번 찍을 때부터 흔들리던 스토리(시계·재생 중 상태) 밖에는 차이가 없다.
"Scrollbar PR #464: Orientation 삭제": |
  - 피그마에서 `Orientation` 속성이 지워져(세로만) 코드의 `orientation` prop과 `ScrollbarOrientation` 타입, 가로 분기(가로 화살표 회전, 가로 막대 크기)를 지웠다. `ScrollArea`가 넘기던 `orientation="vertical"`도 뺐다.
  - `Figma` 스토리의 args에서 `orientation`을 뺐다. 슬롯이 없어 스토리 내용은 그대로다.
  - `Default`(rest)·`Expanded` 스토리는 `data-state`가 prop대로 붙는지만 보는 변형 스토리라 `Figma` 스토리가 다루므로 지웠다.
  - 가로 막대로 막대 위치·길이(`thumbOffset`·`thumbLength`)를 보던 `Horizontal` 스토리는 세로로 바꿔 `ThumbPosition`으로 이름을 바꿨다(`offsetTop`·`offsetHeight`).
"인라인 style lint: 토큰이 없는 값의 처리": |
  - 스토리의 빈 슬롯 미리보기 크기(Breadcrumb·ExplorerAddressRow·Explorer/Content의 Items 100×100, Toc·Toggle 슬롯 높이 100, NavigationPane items 높이 192)는 피그마 내보내기에서 토큰이 아닌 숫자라 맞는 토큰이 없다. 이 슬롯이 보이는 변형은 모두 빈 HUG라 단독 캡처하지 않으므로 빈 요소를 지웠다. NavigationPane items 너비 240은 NavigationItem 너비(`w-size-navigation-item-width`)로 남겼다.
  - NavigationPane `Default` 스토리의 너비 248은 토큰이 없고 실제 자리(탐색기 본문)도 너비를 주지 않아 지웠다(내용 HUG).
  - ExplorerCommandBar 빈 슬롯 높이 32는 피그마 트리의 `size/control/height`로, ExplorerAddressRow·Toc 감싸기 너비는 `w-size-explorer-content-width`·`w-size-window-mobile-content-width`·`w-size-toc-width`로 바꿨다(값이 같다).
  - `DragToFolder` 스토리의 끌어 놓을 탐색기 본문(고정 200×200)은 실제 자리인 탐색기 본문 크기 `size/explorer/content-*`(798×458)로 바꿨다. 스토리 테스트는 그대로 통과한다.
  - 이름 바꾸기 말풍선 간격 `BALLOON_OFFSET = 8`(탐색기·바탕화면)은 이름 있는 피그마 변수는 없지만, Tooltip이 꼬리를 `-top-spacing-sm`(8)에 두므로 같은 `mt-spacing-sm` 클래스로 바꾸고 상수를 지웠다. 탐색기는 `top-full mt-spacing-sm`, 바탕화면은 계산한 `top`에 `mt-spacing-sm`을 더한다. 주석에 적힌 꼬리 높이 8은 실제 토큰(`size/tooltip/tail-height`) 9와 다르다.
  - `scrollbar-width: none`은 디자인 시스템 `src/reset.css`의 `[data-scrollbar-hidden]`으로 옮겼다. 모션 견본 무대 배율은 `motion.css`의 `motion-stage-half`이고, 움직임이 아니라 동작 줄이기 목록에는 넣지 않았다.
"스토리 스타일 금지 ③: 디자인 시스템 크기 스토리": |
  - 크기만 주던 디자인 시스템 스토리 21개(AddressBar·BrowserToolbar·ColumnHeader·EmptyState·Equation·ExplorerCommandBar·ExplorerStatusBar·Figure·MenuItem·MenuSeparator·PostCover·PostNavCard·Scrollbar·SearchBox·SectionTitle·SelectionMarquee·Separator·SnapPreview·TableCell·Table·UnsupportedBlock)의 감싸는 `div`와 `className` 크기를 모두 meta `decorators: [figmaFrame(export.json)]`로 바꿨다. `previewWidthClassNames`(ExplorerStatusBar·SearchBox)는 지웠다. 동작 스토리도 같은 데코레이터로 감싼다. 기기·모양 같은 변형은 스토리 args가 고른다.
  - 동작 스토리가 피그마 변형과 다른 값을 쓰면 args로 맞췄다. SearchBox `Default`는 `appearance: 'pill'`, Separator `Vertical`은 `orientation: 'vertical'`을 args로 주고(전에는 render에서 하드코딩해 데코레이터가 가로 너비를 줄 뻔했다), Scrollbar `ThumbPosition`은 `thumbOffset`·`thumbLength`를 args로 받는다. Scrollbar 막대 찾기는 `firstElementChild` 대신 `[data-state]` 요소로 바꿨다(감싸는 요소가 생겼기 때문).
  - Equation: 수식 이미지의 `h/w-size-equation-*`는 슬롯 안 FIXED 자식이라 `<FigmaFrame node="Formula/formula">`로 준다. 글 폭은 데코레이터가 준다.
  - ExplorerCommandBar: 피그마 `Commands` 슬롯은 가로, 간격 4, 높이 `size/control/height` 고정이고 늘 비어 있다. 이 배치를 쓰는 앱이 같은 상자를 매번 만들고 스토리는 가짜 빈 `div`를 넣었으므로, 슬롯을 여는 컴포넌트가 `flex h-size-control-height items-center gap-spacing-xs`를 갖게 고쳤다. 앱 `explorer-content.tsx`의 같은 모양 상자와 주석을 지우고 `commands`를 바로 넣고, 스토리는 자식 없이 그린다(분류 규칙 3).
  - MenuItem: 열린 메뉴 팝업의 `w-size-menu-width`는 `Menu.Popup` 안을 `<FigmaFrame source={MenuItem export.json}>`으로 감싸 준다(루트가 `size/menu/width` 고정). 팝업의 `outline-none`은 스토리에서 뺐다(스타일 금지). 팝업으로 처음 포커스가 가서 생기는 포커스 링은 앱 `MenuStory`처럼 `initialFocus: false`로 막는다. 동작 스토리는 args 없이 감싼다(모든 변형 너비가 같다).
  - PostNavCard `Default`는 두 카드를 `flex flex-col gap`으로 늘어놓던 가짜 상자라 `Default`(이전 글)와 `Next`(다음 글) 스토리 둘로 나눴다(분류 규칙 5, 피그마에 두 카드를 담는 컴포넌트가 없다). 확인하던 글은 그대로다.
  - TableCell: 감싸던 `w-size-table-cell-width table-fixed border-spacing-…`는 `figmaFrame(TableCell)`이 너비를 주고 표는 맨 `<table>`로 둔다. 프리플라이트가 `border-collapse: collapse`라 간격 클래스는 필요 없다. Table `Figma`는 데코레이터가 글 폭을 준다.
  - FigmaFrame 감싸는 요소를 `inline-grid`에서 `grid w-fit`으로 바꿨다. 블록 안의 `inline-grid`는 줄 상자 때문에 아래에 글줄 내림 틈(약 3px)이 생겨, 가운데 배치 스토리 화면이 위아래로 밀렸다(캡처는 대상 요소만 찍어 같았다). 블록 수준이라도 너비는 내용에 맞고(`w-fit`) 고정 너비 변수는 그대로 이긴다.
  - 동작 스토리가 이제 같은 피그마 너비로 감싸이므로 화면이 달라진 스토리가 있다: SearchBox `Default`(pill 너비)·`Disabled`(기본 너비 240), TableCell `Body`·`Header`(240), UnsupportedBlock 동작 스토리 둘(720), PostNavCard `Default`(354, 카드 하나로 나눔). 피그마 너비와 같아진 것이다.
  - 이 21개를 `eslint.config.mjs`의 `storyStylePendingFiles`에서 지웠다.
"캡처 도구: 여백 계산에서 안 보이는 상자 제외, 대상을 정수 위치에 놓음": |
  - 여백에 쓰는 자손 상자(`readOverflowExtents`)에서 가로·세로가 모두 1px 이하인 상자를 뺐다(전에는 둘 다 0일 때만). Base UI 메뉴의 포커스 가드(1×1 `position: fixed` SPAN, 뷰포트 (0,0))가 대상 밖에 있다고 여백을 수천 px로 키웠기 때문이다. 속성(fixed, aria-hidden, Base UI 전용 속성)으로 거르면 너무 좁거나 정당한 팝업까지 빠져 크기로 정했다. 한 방향만 얇은 상자(선 등)는 그대로 센다.
  - `<svg>` 안 도형은 `overflow`가 `visible`이 아닌 가장 가까운 바깥 `<svg>`들의 상자로 잘라서 잰다(KaTeX 근호 `<path>`가 폭 8726px인데 `<svg>`가 잘라 보여 주는데 잘리기 전 상자로 여백이 8000px 넘게 커졌다). 일반 HTML `overflow` 조상 잘림까지 하면 캡처 31개의 크기가 바뀌어 SVG만 처리했다.
  - 판정은 브라우저 밖의 순수 함수(`paintedBox`, `overflowExtents`)로 옮겨 단위 테스트를 더했다. 브라우저에서는 상자들만 모아 온다.
  - 찍기 전에 `<html>`에 `translate`를 줘 대상의 왼쪽 위를 가장 가까운 정수 픽셀에 놓는다(`integerShift`). 레이아웃(크기·배치)을 바꾸지 않고, 포털로 그린 팝업이 대상과 함께 움직이게 하려고 대상 요소가 아니라 문서 루트를 골랐다. 스토리 루트만 옮기면 포털 팝업이 소수 위치에 남는다. 옮기는 거리는 반올림이라 0.5px 이하다.
  - 전체 캡처 451개(단독) 전후 비교: 크기가 바뀐 것은 17개. 16개는 정수 위치 덕분에 코드 그림이 1px 작아져 피그마 노드 크기와 같아진 것(Breadcrumb 항목, DropDownButton, MessageBox, SectionHeader, SystemTray), 1개는 `patterns/start/power-button` open이 640×640에서 500×500으로 줄었다(포커스 가드 제외). 차이 그림의 밝기 합(abs)은 22개가 달라졌고 21개가 줄었다(SectionHeader 20290→4854, DropDownButton rest 21997→7959). 하나는 늘었다: `patterns/chrome/post-blocks`가 3988534→4542653이다. 안쪽 줄 높이가 소수로 쌓여 이미지 아래 가장자리가 정수 위치로 옮기면 피그마보다 1px 위에 놓이는데, 전에는 소수 위치 덕에 우연히 맞았다. accent 버튼 등 이미 정수 위치였던 대상은 그대로다.
  - 고치지 않고 보고만 하는 것: [[피그마 연동:캡처 표]]의 범위 줄은 "노드 밖으로 나온 자식"만 말하고 1px 이하 상자·`<svg>` 잘림 제외, 정수 위치 맞춤을 적지 않았다.
"캡처 도구: emptyHugSlot 분기 삭제, 정수 위치 맞춤을 상대 위치로": |
  - [[피그마 연동:스토리 규칙]]대로 모든 변형을 단독 캡처한다. 캡처 도구의 `VariantEntry.emptyHugSlot`·`CaptureRow.emptyHugSlot`·"조립에서 확인" 줄·`parity-captures` 제외와, 플러그인이 내보낼 때 적던 `emptyHugSlot: true`(`hasEmptyHugSlot`)를 지웠다. 플러그인 구조 검사에는 빈 HUG 슬롯을 다루는 분기가 없어 고칠 것이 없었다.
  - 예전 내보내기에 남은 `emptyHugSlot`은 읽을 때 무시한다(막지 않는다). 문서상 그 표시는 아무 뜻이 없고, 막으면 아직 표시가 남은 `apps/web/figma/patterns/explorer/content/export.json`(플러그인 출력이라 손으로 고치지 않음) 때문에 캡처가 실패하기 때문이다. 다음에 내보내면 표시가 빠진다.
  - 플러그인 `dist`는 이 작업의 worktree에서 빌드했다. 사람이 쓰는 저장소 폴더의 `tools/figma-plugin/dist`는 병합된 `main`을 받은 뒤 `pnpm --filter ./tools/figma-plugin build`로 다시 만들어야 한다(dist는 git이 무시한다).
  - 반 픽셀 번짐의 원인: Chromium은 소수 위치의 상자를 가까운 정수 픽셀로 맞춰 그린다(417.5 → 418). 그 위에 `<html>`의 `translate`로 0.5px를 더하면 이미 맞춰 그린 선이 418.5로 밀려 두 픽셀에 반씩 번진다. 위치만 다른 1px 선 상자로 재현하니 소수 부분 0.16·0.25·0.4·0.5에서 선이 각각 (214,40)·(191,63)·(153,101)·(127,127)로 번졌고, 0.5에서 두 줄이 같은 진하기가 된다. 0.5가 아닌 소수에서도 덜 번졌을 뿐 같았다. 실제 StartMenuFooter(높이 65)를 가운데 배치로 찍으면 위 선이 230 한 줄에서 243·238 두 줄이 되었다.
  - 고친 것: `snapToPixel`이 `<html>`을 `position: relative`와 `left`·`top`으로 옮긴다. 레이아웃 좌표가 옮겨지므로 Chromium이 정수 위치에 맞춰 그리고, 문서 루트가 기준인 포털 팝업도 함께 움직인다. 같은 재현에서 모든 소수 위치가 번지지 않았다.
  - 가운데 배치를 피하려고 `layout: 'padded'`로 바꿨던 StartMenuFooter, SearchResults, BestMatchCard, PinnedTile 스토리를 기본 배치로 돌렸다. 다른 이유로 padded가 필요한 것은 없었다. 돌린 뒤 이 넷의 7개 변형은 padded 때와 차이 그림 밝기 합이 같다(BestMatchCard 118671→118686, SearchResults desktop 371691→371690 외에는 픽셀까지 같음). 고치기 전 도구로 가운데 배치를 찍으면 SearchResults desktop 1731676, BestMatchCard 396441이었다.
  - 전체 캡처 468개 전후(둘 다 emptyHugSlot 분기를 지운 뒤): 크기가 바뀐 것은 없고 445개는 같다. 차이 밝기 합이 16개 줄었다(Flyout 543093→194652, Menu 521097→187290, MessageBox buttons=one 945655→381516, BreadcrumbItem 6개 약 6%, TocItem active=true 22984→16004, SystemTray hover 20508→17436, `patterns/chrome/post-blocks` 14818362→14454965 등). 7개 늘었다: DropDownButton 5개가 2% 남짓, Tooltip `type=default`가 18393→30540이다. Tooltip은 전에는 상자 테두리가 번져 글자 폭 차이([[한계:HUG 글자 폭 올림]])가 흐리게 가려졌고, 이제 테두리는 맞고 글자 차이가 그대로 보인다.
"스토리 테스트 부하 대응: 화면 크기 값과 선불러오기 방법": |
  [[테스트 작성 규칙:스토리 테스트]]의 스토리 테스트가 CPU 부하에서 15초 제한을 넘기지 않게 한 수정에서 스스로 정한 것이다.
  - 화면 크기: `vitest.storybook.config.ts`의 `test.browser.viewport`를 1600×900으로 두었다. `BREAKPOINTS`를 쓰려 했으나, 패키지 진입점은 Vite 설정 로더가 읽지 못하고(확장자 없는 import), 앱에서 상위 폴더 파일을 직접 가리키면 lint가 막고(`no-restricted-imports`, 인라인 예외도 꺼져 있다), 디자인 시스템 안에서 `./src/token-names`를 쓰면 로더 경고가 매번 나서 두 패키지 모두 값을 직접 적고 주석으로 `BREAKPOINTS`와 같은 값임을 밝혔다.
  - 선불러오기: 의존 패키지(`react-dom/client`, `axe-core`)는 Vitest의 `optimizeDeps.include`로 미리 묶게 했다. `axe-core`는 pnpm 구조상 `@storybook/addon-a11y > axe-core`로 적었다. 앱 소스인 `katex-html` 지연 조각은 묶을 의존이 아니라 우리 모듈이라 `apps/web/vitest.storybook.setup.ts`(`setupFiles`)에서 먼저 `import()`한다.
  - 정리: `.storybook/preview.ts`의 `beforeEach`가 `animation-play-state: paused !important`를 가진 `<head>`의 `<style>`을 지운다. Storybook `pauseAnimations`(`storybook/dist/preview/runtime.js`)가 넣는 멈춤 스타일은 속성이나 id가 없어 내용으로만 구별된다.
  - 시험: 디자인 시스템 Button의 첫 스토리에 alt 없는 `<img>`를 넣으면 그 스토리 하나만 실패하고(`image-alt`) 뒤 두 스토리는 통과함을 확인하고 되돌렸다. 연쇄 실패를 직접 재현한 CPU 부하 시험은 하지 않았다.
"상태 속성 제거와 임시 역할 스토리 정리, Delete 키 힌트": |
  - 위 "컴포넌트 테스트 전환(묶음 C)"에서 더한 `data-state`(WindowTitle·WindowFrame·Toc)와 `data-placement`(WindowFrame)를 지웠다. 스토리가 넘긴 값을 되돌려 보는 용도뿐이었고 제품 코드·CSS 선택자·E2E는 읽지 않았다. `data-indicator`(TaskbarButton)는 `taskbar-apps-layer.tsx`가 선택 표시로 쓰므로 남겼다. 이 항목이 말한 속성 이름 검토는 필요 없어졌다.
  - 그 속성만 보던 스토리(WindowTitle·WindowFrame의 `Inactive`)를 지우고, `Default`·`Maximized`·`Toc`의 속성 확인 줄만 뺐다. SnapPreview `Default`, TaskbarPreviewList `Default`의 `play`, TaskbarButton `Default`의 아이콘 확인 단계와 `data-testid`를 지웠다.
  - [[접근성:역할]]이 말하는 Delete 닫기에 `aria-keyshortcuts="Delete"`를 달았다. 요청에는 Chrome 탭과 창 미리보기 카드만 있었으나 같은 Delete 처리가 있는 탐색기 탭(`ExplorerTab`)과 Snap Assist 카드에도 같이 달았다. 탭은 div 속성이 바깥 상자로 가서 `role="tab"`인 `Tabs.Tab`에 닿지 않으므로 `BrowserTab`·`ExplorerTab` 컴포넌트에 직접 넣었고, 카드는 포커스를 받는 `Button`(쓰는 곳)에 달았다.
  - `aria-keyshortcuts`는 스토리 `play`에서 확인하지 않는다. 넘긴 값이 그대로 나오는지만 보는 검사라서다. Delete로 닫히는 동작은 `chrome-window-layer.stories.tsx`와 `taskbar-apps-layer.stories.tsx`의 `play`가 이미 확인한다(탐색기 탭과 Snap Assist 카드 쪽은 확인하는 스토리가 있는지 따로 찾지 않았다).
"E2E 행위 표 ①: 정의 형식, 행위 묶기, 조건 고르기, 터치 케이스": |
  - 정의 파일은 `apps/web/e2e/behaviors/<행위 id>.behavior.ts`이고, 같은 폴더에 형식(`define-behavior.ts`)·읽기(`load-behaviors.ts`)·Playwright `test`(`behavior-test.ts`)·터치(`touch-input.ts`)·휠(`wheel-scroll.ts`)·공통 단계(`app-steps.ts`)를 둔다. 앱 ESLint가 `../` import를 막아(`apps/web/**`) 도우미를 정의 파일과 한 폴더에 두었고, 정의 파일만 `.behavior.ts` 이름으로 골라 읽는다. 행위 id는 파일 이름이다.
  - 행위 표 도구가 Node로 정의를 바로 읽도록(타입 지우기) 정의 쪽 import는 `.ts` 확장자를 쓴다. 그래서 `apps/web/tsconfig.json`에 `allowImportingTsExtensions`를 켰다. 정의 파일은 `@seojaewan/design-system`처럼 Node가 바로 못 읽는 것을 import하지 않는다.
  - 시험은 `e2e/behaviors.test.ts` 하나가 모든 정의를 읽어 케이스마다 만든다. 제목은 `영역 › 행위 이름 › #번호 목적 [행위id#번호]`이고, 끝의 `[행위id#번호]`로 케이스 하나만 고른다. 케이스의 `docs`는 시험 annotation(`codocs`)으로도 붙인다.
  - 조건 키는 영어(`input`), 보이는 이름은 `label`로 한국어다. 타입은 기준값이 값 목록에 없거나, 케이스가 없는 조건·값을 바꾸거나, 1번 케이스에 `change`가 있거나, `docs`가 비면 막는다. `change`가 기준값과 같거나 비어 있는 것은 타입으로 막지 못해 표 도구가 표시한다.
  - 행위는 26개다. 기존 시험 41개를 한 시험이 한 케이스가 되게 옮겼고, 시험의 확인 줄은 그대로 두었다(같은 단계를 `app-steps.ts`의 `restart`·`openBlogFolder`·`dragMouse`로 묶은 것만 바꿨다). 예외로 `responsive.test.ts`의 "노트북/PC 기본 크기"는 서로 다른 화면 두 번이라 `window-default-size` 행위의 PC(1번)·노트북(2번) 두 케이스로 나눴다. 그래서 옮긴 케이스는 42개다.
  - 기존 시험이 한 번에 여러 조건을 지나가는 경우가 많아, 1번 케이스의 기준값을 그 시험이 실제로 하는 값으로 정했다(예: `desktop-new-folder`의 "그 뒤" 기준값은 `Delete로 휴지통`, `taskbar-pinning`은 `다시 시작`). 한 시험이 새로고침과 다시 시작을 함께 지나가면 앞의 것 하나만 바꾼 값으로 적었다. 그래서 지나가지만 "빠진 값"으로 보이는 값이 있다(`start-pinning`의 다시 시작, `chrome-address-bar`의 뒤로 등).
  - 둘 이상을 바꾼 케이스가 많다(옮긴 시험 가운데 여럿과 터치 6개 모두). 터치는 모바일에서만 있는 입력이라 `입력: 터치`와 `화면: 모바일`을 함께 바꾼다.
  - 조건 값은 기능 문서의 표와 목록에서 뽑았다. 문서에 그대로 없는 값은 PR 보고에 적었다.
  - 터치 케이스 6개(Pixel 7, `hasTouch`): 바탕화면 탭으로 열기, 바탕화면 길게 누르기 메뉴 → 따라오는 클릭이 외부 링크 새 탭을 열지 않음 → 잘라내기 → 탐색기 빈 곳 길게 누르기 → 붙여넣기, 바탕화면 터치 끌기로 옮겨지지 않음, 탐색기 폴더 탭으로 들어가기, 탐색기 길게 누르기 메뉴(새 탭에서 열기 없음) → 잘라내기 → 붙여넣기, 탐색기 터치 끌기로 옮겨지지 않음. 장치 설정의 `defaultBrowserType`·`screen`은 describe 안에서 쓸 수 없거나 타입에 없어 나머지 값만 쓴다.
  - 동작 표시(`page.screencast.showActions`)는 동작마다 표시 시간만큼 걸린다. 기본 500ms로 켜니 로컬 전체 E2E가 13초에서 31초로 늘어, 시험은 100ms로 두고 실행해보기만 500ms로 늘린다(`BEHAVIOR_CASES_ACTION_MS`). `slowMo`는 `BEHAVIOR_CASES_SLOW_MO`로 실행해보기에서만 켠다. 두 값은 `playwright.config.ts`가 읽는다(ESLint가 그 밖에서 `process.env`를 막는다).
  - 손가락 표시는 모든 시험에 `addInitScript`로 넣는다. 터치 이벤트가 없으면 보이지 않는다.
  - 휠 함수(`wheelScroll`)는 만들었지만 지금 휠을 쓰는 케이스는 없다.
  - 위 "8단계 E2E" 두 항목(5~10개보다 많이 둠, 길게 누르기와 터치 끌기는 E2E에 넣지 않음)은 이 PR과 바뀐 [[테스트 작성 규칙:E2E]]로 지난 내용이 됐지만, 사람이 검토할 항목이라 지우지 않았다.
"스토리 스타일 금지 ⑤: 모션 견본 스토리": |
  - 모션 스토리 13개(`src/motion-story/*.stories.tsx`)에서 `className`을 모두 없앴다. 남은 것은 lint가 경로 단위로 허용한 `motionClassName` 속성과 `className={motionClassName}`(Flyout)뿐이다.
  - 견본 둘레 여백(`p-spacing-2xl`, 검색 돋보기만 `p-spacing-lg`)은 스토리에서 지우고 모션 견본 도우미 `motion-preview.tsx`의 무대가 갖게 했다. 피그마 모션 견본 프레임이 모두 같은 `spacing/2xl` 안쪽 여백을 가져(검색 돋보기 견본도 `get_design_context`로 확인) 모든 모션 스토리에 같은 무대 역할이다. StoryStage `padded`(`p-spacing-5xl`)는 메시지 상자 그림자가 나갈 여백이라 값과 뜻이 달라, 새 배치를 만들지 않고 모션 무대에 두었다. 이 도우미는 모션 스토리 전용이라 일반 스토리 도우미(`story/`)로 옮기지 않았다.
  - 검색 돋보기 스토리는 `size-size-icon-2xl`(48)과 `p-spacing-lg`를 썼는데, 피그마 견본은 돋보기 64x64(`size-icon-3xl`)에 여백 `spacing/2xl`이다. 그래서 크기와 여백이 피그마와 달랐다. 도우미 `sample-search-icon.tsx`(`SampleWindow` 등과 같은 견본 도우미)가 자산 크기를 64로 주고 스토리는 `motionClassName`만 넘긴다. 모션 json에는 크기가 없어 피그마 견본 노드 크기를 근거로 했다. 모션 시간·키프레임 검사 결과는 같다.
  - Flyout 모션 스토리의 MenuItem `w-size-menu-width`는 MenuItem `export.json`의 `FigmaFrame`(루트 FIXED 폭 `size/menu/width`)으로 바꿨다.
  - 위 둘로 모션 스토리 화면의 견본 위치와 돋보기 크기가 바뀐다(여백 통일, 64px). 움직임과 시간 값은 같다.
"토큰 PR #495: 스토리 크기 토큰 삭제 대응, 코드 서체 교체에서 정한 것": |
  - PR 브랜치가 옛 `main`(#460)에서 갈라져 있어, 코드 서체 토큰 생성이 바뀐 지금 `main`을 병합 커밋으로 받아 왔다. 플러그인 커밋은 다시 쓰지 않았다.
  - `@fontsource/nanum-gothic-coding`은 `@fontsource/cascadia-mono`가 있던 `dependencies`에 5.3.0으로 넣었다. 패키지의 family 이름은 `Nanum Gothic Coding`이라, `generate-fonts.ts`의 웹 폰트 항목에 `family`(선택)를 더해 생성하는 `@font-face` 이름을 `'NanumGothicCoding'`으로 바꿨다. 이름이 토큰 값과 같은지 `font-face-css.test.ts`가 확인한다.
  - 탐색기 본문 동작 스토리의 본문 밖 놓을 곳 넷은 모두 폴더 그림의 `NavigationItem`으로 그리고 `role="tree"`(이름 "본문 밖의 놓을 곳")로 감쌌다. "바탕 화면"도 폴더 그림이다.
  - `motion-flyout-enter` 견본의 Flyout 내용은 홀로 두는 메뉴 항목 셋(`MenuItem standalone`: 열기, 이름 바꾸기, 삭제)이다. `ScrollArea` `Overflow`의 버튼 이름은 `항목 1`~`항목 8`이고 사이를 `gap-spacing-xs`로 띄웠다.
  - 메뉴가 뜰 공간 스토리 중 전원 버튼만 `p-spacing-lg` 여백을 두고, `Taskbar/AppMenu`·`Taskbar/AppPreview`·`Window/SnapLayoutMenu`는 여백 없이 캔버스 전체(`h-screen`)에 두었다.
  - lint 시험(`token-classes-lint.test.ts`)의 "숫자로 끝나지 않는 토큰 이름" 예는 `size/story/*` 대신 `size/icon/2xl`·`3xl`로 바꿨다.
  - 새 크기 변수 `size/equation/width`·`height`는 아직 내보낸 컴포넌트·조립이 쓰지 않아 코드에서도 쓰지 않았다. 수식 그림 자산 `images/equation-quadratic-formula`는 피그마 조립이 쓰는 자산이라 남겼다(스토리는 더 쓰지 않는다).
  - 위 "색 대비" 항목의 비활성 창 제목(`text-fill-tertiary`)은 이 PR에서 값이 56%로 바뀌어 대비가 고쳐졌다([[접근성:색 대비]]). `TwoWindows`의 `play`는 그대로 두었고, 끝 모습 밖의 상태를 axe로 다시 확인하지는 않았다. 옛 항목은 사람이 검토할 기록이라 고치지 않았다.
"조립 PR #517 start: 본문이 패널 폭을 채우고 여백을 안에서 준다": |
  - 피그마 `Start/Menu`의 `body` 프레임에 가로 여백이 없어져, `StartMenuPanel`의 패널 좌우 여백(`px-spacing-3xl`·`px-spacing-lg`)을 없애고 검색 입력칸을 `search row` 줄(자기 좌우 여백 32·16)로 감쌌다. 본문(`Start/Body`)은 패널 폭(638·388)을 채운다.
  - `StartBody`의 스크롤 영역을 오른쪽으로 넓히던 음수 여백(`-mr-spacing-2xl`·`-mr-spacing-md`)과 그만큼의 오른쪽 안쪽 여백을 지우고, 피그마 `ScrollArea` > `Content` 슬롯 여백대로 `contentClassName`에 좌우 여백(데스크톱 `px-spacing-3xl`, 모바일 `px-spacing-lg`)을 줬다. 스크롤바는 ScrollArea 기본 자리(가장자리에서 2)에 놓인다. 글자 격자(`View=JumpList`, 목록 위에 겹쳐 여는 격자 포함)는 바탕 프레임에 같은 좌우 여백과 아래 24를 줬다.
  - 검색 결과 화면(`View=Results`)은 `SearchBody`를 그대로 쓰므로 `SearchBody`에 `contentClassName` prop을 더했다. 스크롤하는 화면(입력 전, 모바일 결과)은 ScrollArea 내용 칸에, 데스크톱 결과는 SearchResults를 담는 바탕에, 결과 없음은 안내 바탕에 준다. 피그마 모바일 결과는 아래 24가 스크롤되는 칸 안에 있어 Start는 `px-* pb-spacing-2xl`을 이 prop으로 넘긴다. 검색 패널 쪽 여백은 #518에서 맞춘다.
  - `Start/Body` `Figma` 스토리가 감싸는 크기를 `size/shell/content-width`·`mobile-content-width`(638·388)로 바꿨다.
  - 캡처 표에서 글자 가장자리 외에 남는 차이는 스크롤바 막대 길이다. 피그마는 막대 길이 기본값(`size/scrollbar/thumb-length`)을 그리고 코드는 실제 내용 비율로 정한다([[디자인 기반:겹쳐 놓기]]의 실행 중에 정해지는 값).
"조립 PR #518 search: 검색 본문이 패널 폭을 채우고 여백을 안에서 준다": |
  - 피그마 `Search/Panel`의 `padding` 프레임에 가로 여백이 없어져, `SearchPanel`의 패널 좌우 여백을 없애고 위아래 32만 남겼다. 모바일 검색 입력칸은 `search row` 줄(자기 좌우 여백 16)로 감쌌다.
  - `Search/Body`가 패널 폭(638·388)을 채우고 자기 좌우 여백(32·16)을 가져, `SearchBody`가 기기별 좌우 여백을 직접 갖게 했다. 입력 전 화면과 모바일 결과는 ScrollArea 내용 칸에, 데스크톱 결과는 SearchResults를 담는 바탕에, 결과 없음은 안내 바탕에 준다. 피그마 입력 전 화면에는 ScrollArea가 없지만 코드는 넘칠 때 스크롤하려고 그대로 두었다(넘치지 않아 스크롤바가 보이지 않는다).
  - #517에서 더한 `contentClassName`은 좌우 여백에 더하는 여백이 됐다. Start 결과 화면은 아래 24(`pb-spacing-2xl`)만 넘긴다.
  - `Search/Body` `Figma` 스토리가 감싸는 크기를 `size/shell/content-width`·`mobile-content-width`(638·388)로 바꿨다.
  - 캡처 표에서 글자 가장자리 외에 남는 차이는 모바일 결과의 스크롤바 막대 길이다(피그마는 기본값, 코드는 실제 내용 비율. [[디자인 기반:겹쳐 놓기]]).
"E2E 행위 표 ②: 표 도구와 Pages 결과 페이지": |
  - `tools/behavior-cases`는 앱의 읽기 함수(`apps/web/e2e/behaviors/load-behaviors.ts`)를 Node가 타입을 지우며 바로 import해 정의를 읽는다. [[저장소 구성:의존 방향]]은 `tools/`가 패키지의 공개 코드와 빌드 결과만 쓴다고 하지만, 행위 표는 E2E 정의 파일을 읽는 것이 목적이라([[저장소 구성:구성]]) 이 예외를 두었다. 검토가 필요하다.
  - 표 데이터는 순수 함수(`build-table.ts`)가 만들고 단위 테스트로 본다. 빠진 값, 영역 합계, 둘 이상 바꾼 케이스(×2 표시), 고칠 점(근거 없음, 문서에 없는 링크, 기준값과 같은 change, 바꾼 것이 없는 케이스)을 낸다. 영역 차례는 바탕화면 → 탐색기 → Start → 검색 → 작업 표시줄 → 창 → Chrome → 공통으로 정했다.
  - 코드 근거는 케이스 문서 링크와 같은 `@codocs` 주석이 달린 `apps/web/src`·`packages/design-system/src`의 TS 파일(스토리·테스트 제외)에서, 주석 묶음 다음 첫 줄의 선언 이름과 그 줄 번호, 주석의 첫 설명 줄(80자까지)을 뽑는다. 선언 이름을 못 찾으면 비워 둔다.
  - codocs 문서는 YAML 파서 패키지를 새로 들이지 않고, codocs 문서 꼴(`_codocs` 메타데이터 + `섹션: |` 블록)만 읽는 작은 파서로 읽는다. 문서 이름은 `_codocs.name`, 섹션 첫 줄은 빈 줄을 건너뛴 첫 줄이다.
  - 화면은 HTML·CSS·JS 세 파일(`tools/behavior-cases/page/`)이고 같은 폴더의 `table.json`을 읽는다. 로컬 서버(`pnpm cases`, 127.0.0.1:4173, `BEHAVIOR_CASES_PORT`로 바꿈)는 그 JSON을 요청마다 새로 만든다. 왼쪽은 영역(전체 포함)과 행위 링크, 오른쪽은 영역별 행위 카드다. 열 머리에 기준값을 함께 적고, 바뀐 칸만 진하게 칠한다. 빠진 값 줄은 "–"와 그 값만 보인다. 디자인 시스템과 무관한 내부 도구라 색은 CSS 변수로 두고 밝은·어두운 모드를 따른다. 토큰 lint(better-tailwindcss, style 값 제한)는 `apps/web/src`·`packages/design-system/src`에만 걸려 있어 따로 뺄 설정은 없었다. Stylelint는 이 CSS에도 돌지만 막는 at-rule을 쓰지 않는다.
  - 실행해보기는 서버가 `playwright test --grep "\[행위id#번호\]" --trace on --retries 0 --workers 1`을 `slowMo` 300ms, 동작 표시 500ms로 돌리고, 끝나면 `playwright show-trace`로 Trace Viewer 창을 연다. 한 번에 하나만 돌린다. 앱 빌드(`apps/web/.next/BUILD_ID`)가 없으면 돌리지 않고 빌드하라고 알린다. 결과는 `tools/behavior-cases/runs/`(git 제외)에 둔다.
  - 결과 페이지: `behavior-cases.yml`이 `main` push(와 수동 실행)마다 앱을 빌드하고 모든 케이스를 `--trace on`으로 돌려 JSON 보고서를 만들고, `build:report`가 trace zip을 `traces/`에 옮겨 담은 정적 페이지를 만들어 GitHub Pages에 올린다. 페이지의 "trace 보기"는 `https://trace.playwright.dev/?trace=<Pages의 zip 주소>`다. 케이스가 실패해도 페이지는 올리고 작업만 실패로 표시한다. 필수 검사(ruleset)에 넣지 않았다. 배포 동시 실행은 끊지 않고 차례로 한다.
  - Pages 액션은 지금 나온 최신(`configure-pages@v6`, `upload-pages-artifact@v5`, `deploy-pages@v5`)을 썼다.
  - 루트 `pnpm cases` 스크립트와, ESLint의 `process.env` 허용 목록(`configFiles`)에 `tools/behavior-cases/src/**`를 더했다.
"PR #471 WindowFrame: Material=Solid 삭제": |
  `WindowFrame`의 `material` 값에서 `solid`와 그 분기(바탕 칠 `bg-material-fallback-mica-base`, 활성·비활성 그림자 표의 `solid` 줄)를 지우고 `Figma` 스토리의 `MATERIALS`를 `mica`·`chrome`으로 줄였다. `material="solid"`를 쓰는 앱 코드는 없어 앱은 고치지 않았다. `solid` 분기만 쓰던 토큰 클래스가 없어져도 `chrome`이 같은 그림자 클래스를 쓰므로 남는 토큰은 건드리지 않았다.
  Content·Title bar content 슬롯은 `export.json`에서 모든 변형이 비어 있어(기본 내용 없음, FILL) `Figma` 스토리는 슬롯을 계속 비워 둔다. 임시 스토리로 정리할 것도 없었다(남은 스토리는 모두 동작 `play`다).
"스토리 스타일 금지 ⑦: 앱 Start·작업 표시줄·탐색기 스토리": |
  - 앱 Start 메뉴·작업 표시줄·파일 탐색기 스토리 15개 파일을 바꾸고 `storyStylePendingFiles`에서 지웠다. `Patterns/Explorer/Content`(`explorer-content.stories.tsx`) 하나는 탐색 창 빈 자리 문제(아래)로 목록에 남겼다.
  - 크기(규칙 1): 기기·검색 모양별 크기 묶음(`SIZE_CLASS_NAMES`, `WIDTH_CLASS_NAMES`)과 `className` 크기를 meta `decorators: [figmaFrame(@figma/patterns/... export.json)]`로 바꿨다(Search/Body·Search/Panel·Start/Body·Start/Menu·Taskbar/Default·Explorer/Content). 동작 스토리도 같은 데코레이터로 감싼다. Start/Body `ListJump`·`OpenFromList`는 전에 높이만 줬고 `CategoryHeaders`는 크기가 없었는데 이제 피그마 본문 크기(638×569)로 그리고, `CategoryHeaders`는 args `view: 'category'`로 변형을 고른다. Taskbar/Default 동작 스토리는 화면 폭(`w-full`) 대신 고른 검색 모양의 피그마 너비(1280, 390)로 그린다.
  - Window/Explorer는 바깥 요소가 창 층의 누르기 처리(`onPointerDown`)를 대신하므로 데코레이터 대신 그 안에 `<FigmaFrame source={Window/Explorer} args={args}>`를 두었다(데코레이터는 바깥 요소를 감싸 창이 높이를 받지 못한다). 동작 스토리 `Behavior/FileExplorer/ExplorerWindowLayer`는 창 층이 넘기던 `controls.className` 크기를 `FigmaFrame`(Window/Explorer, `device`만 넘김)으로, `Behavior/FileExplorer/ExplorerBody`의 본문 상자는 `FigmaFrame`(Explorer/Content)으로 바꿨다. 모바일 동작 스토리는 전에 화면 폭(`w-full`, mobile1 320)이었는데 이제 피그마 모바일 너비(390·388)라 화면보다 넓다.
  - 무대(규칙 2): 층 동작 스토리의 `fixed …`를 StoryStage로 바꿨다. StartMenuLayer는 `fill`, TaskbarAppsLayer는 `bottom`, 앱 버튼 조립(Taskbar/AppMenu·AppPreview)은 `bottom-center` + `target`, Start/ViewMenu는 메뉴가 아래로 열리므로 `top-center` + `target`(layout `fullscreen`)이다. 전에는 `padded` 레이아웃의 왼쪽 위였다.
  - TaskbarLayer는 `bottom` 무대(가로 flex 가운데 맞춤) 안에서 작업 표시줄이 내용 폭으로 줄어(양쪽 빈 칸과 시계 칸이 0) 전처럼 화면 폭이 되지 않는다. 화면 폭 아래 배치가 StoryStage에 없고 도우미는 고치지 않기로 해, `FigmaFrame`(Taskbar/Default)으로 피그마 너비를 준다. 너비 변형을 고르려고 스토리 args에 `search`(기본 `box`, `Mobile`은 `button`)를 더했다.
  - 슬롯 채움(규칙 3): SearchPanel·StartMenuPanel의 본문 자리와 ExplorerWindow의 탭 내용 자리가 넣은 자식을 채운다(피그마 Search/Body·Start/Body·Explorer/Content가 FILL/FILL). 본문 자리는 세로 flex라 너비는 늘고, `[&>*]:min-h-size-none [&>*]:flex-flex-fill`로 높이를 채운다. ExplorerWindow는 WindowFrame(디자인 시스템) 내용 자리가 가운데 맞춤이라 같은 클래스를 가진 자리 요소를 하나 두고 그 안에 자식을 넣는다. WindowFrame을 고치면 Chrome 창(다른 작업자 영역)도 바뀌어 앱 컴포넌트에서 맞췄다. 앱 `start-menu-layer.tsx`(6곳)·`explorer-body.tsx`와 스토리·도우미의 `min-h-size-none w-full flex-flex-fill`을 지웠다.
  - 창 축소 화면 WindowThumbnail이 넣은 창을 원래 크기로 채운다(`[&>*]:size-full`). 작업 표시줄 미리보기(`taskbar-apps-layer.tsx`)와 도우미 `story-preview-list.tsx`의 `size-full`을 지웠다. 이를 위해 `WindowFrameControls.className`을 선택 속성으로 바꿨다. `features/window`의 `window-snap-assist.tsx`·`snap-assist.stories.tsx`(다른 작업자 영역)는 같은 `size-full`을 아직 넘기며, 결과는 같다.
  - 쓰는 곳이 없어진 `className` 속성을 지웠다: StartBody·SearchBody(와 안쪽 SearchBodyResults)·TaskbarDefault·ExplorerContent. 넘기던 곳은 모두 채움이나 크기였다.
  - StartBody 목록 보기 루트에 `min-h-size-none`을 더했다. FigmaFrame(grid) 안에서 루트가 내용 높이보다 줄지 않아(격자 항목의 자동 최소 높이) 본문이 569를 넘어 늘어나고 스크롤바가 사라졌다. 본문은 안의 ScrollArea로 스크롤하므로 루트가 줄 수 있어야 한다. 앱 Start 메뉴 본문 자리에서는 같은 값을 자리가 이미 준다.
  - 확인: 피그마 캡처 473개 변형의 코드 그림은 현재 main(#524~#527 병합 뒤)과 `navigation-pane`(16픽셀, 차이 32 이하, 전부터 흔들림) 밖에는 같다. 모든 스토리 화면의 차이는 위 의도한 것(Start/Body 동작 스토리 셋, Start/ViewMenu 위치, Taskbar/Default 동작 스토리 너비, ExplorerBody 동작 스토리 열한 개, ExplorerWindowLayer `Mobile`, TaskbarLayer 셋)과 바꾸기 전부터 흔들리던 스토리(시계·Chrome·Shell 등)뿐이다.
  - Menu/ViewOptions: 항목 `itemClassName="w-full"`은 MenuItem 행이 이미 `w-full`이라(피그마 모든 메뉴 조립에서 MenuItem은 FILL) 아무 일도 하지 않아 지우고, `MenuPopup`·`MenuButton`·`ContextMenuArea`·`MenuStory`의 `itemClassName` 속성도 지웠다. 메뉴 바탕 너비(피그마 Menu 인스턴스의 `size/menu/view-options-width`)는 스토리가 팝업 안 Menu에 FigmaFrame을 둘 수 없고(MenuStory가 포털로 그린다) Menu가 자기 너비를 가져 감싸도 채우지 않아, `MenuPopup`의 `className`을 이름 있는 너비 `width?: 'default' | 'view-options'`로 바꿨다. 앱 `StartViewMenu`와 스토리가 같은 `width="view-options"`를 넘긴다. `className`을 넘기던 곳은 이 하나뿐이었다.
  - 아이콘(규칙 4): 스토리와 도우미(`story-explorer-window-parts.tsx`)의 아이콘 `size-full object-contain`, 바탕 화면 아이콘의 `size-size-icon-sm`을 지웠다(색 `text-text-fill-primary`는 남김). Start/Menu 프로필 사진의 `size-full`도 ProfileButton 사진 자리가 채워 지웠다. 도우미의 NavigationItem 너비 `w-size-search-box-width`는 값이 같은 `w-size-navigation-item-width`(앱 탐색 창과 같은 변수)로 바꿨다.
  - 늘어놓기(규칙 5): ExplorerBody 동작 스토리의 `flex flex-col gap` 틀을 없앴다. 위치 버튼 둘과 본문은 블록 흐름으로 두고, 본문 밖 놓을 곳(NavigationItem 넷)은 이를 담는 실제 컴포넌트 NavigationPane(`role="tree"`)에 넣었다. 그래서 놓을 곳이 가로 한 줄에서 세로 목록이 됐다(모두 화면 안이라 끌기 확인은 같다).
  - 남긴 것: Explorer/Content 스토리의 `navigation={<div className="w-size-navigation-item-width" />}`. 피그마 조립의 탐색 창 `items` 자리는 비어 있지만 피그마가 빈 HUG 자리를 240×192로 그려(Window/Explorer에서 같은 자리를 채우는 NavigationItem 너비), 지우면 탐색 창이 8px로 줄어 캡처가 피그마와 크게 달라진다. 자리는 HUG라 FigmaFrame `node`로 크기를 줄 수 없고, 같은 너비의 NavigationItem 노드는 이름(`nav/Blog`)에 `/`가 있어 `node` 경로로 고를 수 없다(FigmaFrame 도우미 한계, #526 항목과 같다). 이 파일만 `storyStylePendingFiles`에 남기고, 빈 HUG 자리를 어떻게 다룰지(캡처에서 빼기, 도우미가 `/` 든 이름 고르기 등) 정해야 한다.
"컴포넌트 PR #470 TileGrid: Figma 스토리 되살림": |
  - `Figma` 스토리를 다시 만들고 `align` 변형마다 `tiles` 슬롯에 `export.json` 기본 내용과 같은 PinnedTile을 넣었다(Start 8개: File Explorer·Chrome·Blog·GitHub·이력서·사이드 프로젝트·React·React 19 훅 정리, Center 6개: 글 문서 아이콘). 아이콘은 앱의 `renderItemIcon`과 같이 이미지는 `ImageAsset`, 링크는 `Asset`(`illustrations/file-link.svg`)으로 그렸다. 감싸는 너비는 `w-size-new-tab-grid-width`(576)다.
  - 빈 HUG 때 대신 둔 `Default`(글자 하나 넣고 보이는지만 확인)·`Center` 스토리를 [[테스트 작성 규칙:테스트 지침]]대로 지웠다. 모양은 캡처가, 실제 배치는 시작 메뉴·새 탭 스토리가 맡는다.
  - 컴포넌트 주석의 "피그마 원본 너비 574"를 토큰 이름(`size/new-tab/grid-width`, 지금 576)으로 바꿨다. 코드의 `overflow-clip`은 `export.json`에 자르기 정보가 없어 그대로 두었다.
"컴포넌트 PR #475 PinnedTile: Hover 글자 폭과 Default 스토리": |
  - 피그마 Hover의 `strokesIncludedInLayout`이 꺼져 Hover도 글자 폭 87이 되었다. 코드는 이미 `inner-border`로 그려 고친 것이 없고, 캡처 표 세 변형 모두 테두리 차이가 없음을 확인했다. 위 "마지막 맞춤: PinnedTile 테두리를 안쪽 선으로"의 Hover 85·87 차이는 지난 내용이 됐지만 검토 기록이라 고치지 않았다. 컴포넌트 주석의 "피그마 Rest와 같은 87px"만 "피그마와 같은 87px"로 고쳤다.
  - 컴포넌트만 보던 `Default` 스토리를 지웠다. 이름·아이콘·`onClick`이 넘긴 대로 나오는지만 보는 검사라 [[테스트 작성 규칙:테스트 지침]]의 4번에 걸리고, 고정 타일을 눌러 여는 동작은 `start-menu-layer.stories.tsx`의 `OpenItems`가 이미 본다.
"스토리 스타일 금지 ⑥: 앱 Chrome·창·바탕화면 스토리": |
  - 앱 Chrome·창·바탕화면·메시지 상자 스토리 13개 파일을 바꾸고 `storyStylePendingFiles`에서 지웠다. `Patterns/Chrome/ImageViewer`(`chrome-image-viewer.stories.tsx`) 하나는 이미지 크기 문제(아래)로 바꾸지 않고 목록에 다시 넣었다.
  - 크기(규칙 1): 기기·모양별 크기 묶음(`SIZE_CLASS_NAMES`)과 `className` 크기를 `figmaFrame(@figma/patterns/... export.json)`으로 바꿨다(Chrome/FindBar·Chrome/Page·Chrome/PostBlocks·Window/Chrome·Window/SnapAssist). `Behavior/Chrome/ChromePostTab`은 전에 `h-screen w-size-post-width`(720×화면 높이)였는데 이제 args `layout`에 맞는 Chrome/Page 크기(wide 1278×712, narrow 388×720)로 그린다. PostBlocks 동작 스토리 둘(`Structure`·`Annotations`)도 meta 데코레이터로 글 폭(720)이 됐다.
  - 바탕: 피그마 Chrome/PostBlocks 루트 칠이 `chrome/page-fill`이라 PostBlocks 루트가 `bg-chrome-page-fill`을 갖는다(스토리의 감싸는 바탕을 지웠다). 앱에서는 같은 바탕의 ChromePage 안에만 들어가 그림이 같다.
  - 무대(규칙 2): 메시지 상자 셋(TrashedPost·DuplicateFolderName·EmptyRecycleBin)은 `padded` + `target`, Window/SnapLayoutMenu는 `top-center` + `target`, 층 동작 스토리(WindowLayer·DesktopIconsLayer·ChromeWindowLayer)는 `fill`이다. 메시지 상자 캡처 대상이 피그마 노드 폭(640)이 됐다(ReservedName과 같다). WindowLayer `CancelDrag`의 "창 층 빼기" 버튼은 `fill`(세로 flex) 안이라 화면 폭으로 늘어난다(누르는 동작은 같다).
  - 슬롯 채움(규칙 3): ChromeWindow가 탭 내용 자리 요소를 두고 자식을 `[&>*]:min-h-size-none [&>*]:flex-flex-fill`로 채운다(WindowFrame 내용 자리가 가운데 맞춤이라 #528 ExplorerWindow와 같은 방식). ChromePageArea의 탭 내용 자리도 같은 클래스로 채운다. 앱 `chrome-window-layer.tsx`·`chrome-post-tab.tsx`가 ChromePage에 넘기던 `min-h-size-none w-full flex-flex-fill`과 ChromePageArea 루트의 같은 클래스, 스토리의 같은 클래스를 지웠다. 창 층 WindowView의 창 자리도 `[&>*]:size-full`로 앱 창을 채우게 하고 `window-view.tsx`·`window-snap-assist.tsx`의 `controls.className: 'size-full'`을 지웠다. WindowThumbnail 채움은 #528이 먼저 넣어 그대로 받았다. 이제 `WindowFrameControls.className`을 넘기는 곳이 없다(속성은 남김).
  - ChromeWindow 루트에 `min-h-size-none min-w-size-none`을 더했다. FigmaFrame(grid) 안에서 창 틀(`overflow-clip`, 스크롤 상자가 아님)의 자동 최소 높이가 긴 글 내용 높이가 되어 창이 800을 넘어 늘어났다(Window/Chrome 스토리, ChromeWindowLayer 두 창). 창은 쓰는 곳이 준 자리 안에서 내용을 자르므로 최소 크기를 0으로 둔다(#528 StartBody와 같은 이유).
  - ChromeWindowLayer 스토리의 창 자리 상자(`flex min-h-size-none flex-flex-fill`)와 `controls.className: 'h-full w-full'`은 `<FigmaFrame source={Window/Chrome} node="window">`로 바꿨다. 피그마 Window/Chrome의 `window`(창 틀) 노드가 세로 부모 안 가로·세로 FILL이라 전처럼 화면을 창 수로 나눠 채운다.
  - DesktopIconsLayer `DragToFolder`의 탐색기 창 본문 대신 상자(`fixed` 오른쪽 아래, 탐색기 내용 크기)는 무대로 만들 수 없다(놓을 곳 찾기가 `elementFromPoint` 맨 위 요소라 위치 지정된 층이어야 한다). 실제 창 층(`WindowLayer`)에 창 하나를 열고, 그 창을 빈 WindowFrame(창 층 스토리의 `renderStoryWindow`와 같은 모양)에 놓을 곳 속성(`data-drop-target` Blog)과 `data-testid="explorer-body"`를 단 것으로 그린다. 창 자리는 창 층 기본 위치(가운데)다. 확인 내용은 같다.
  - SnapAssist 스토리의 앱 아이콘 `size-full object-contain`은 #526 아이콘 자리 채움으로 지웠다.
  - 남긴 것: Chrome/ImageViewer. 피그마 `image`는 wide에서 FIXED 800×500(`size/image-viewer/image-*`), narrow에서 FILL×222.5(변수 없음)인데, [[Chrome:글 화면]]과 앱(`VIEWER_IMAGE_CLASS_NAME`)은 "영역 안에 맞추되 원본보다 키우지 않는다"라 원본(3840×2400)이 wide에서 약 1011×632가 된다. 맞춤 규칙을 ChromeImageViewer로 옮기고 스토리 크기를 지우면 wide 캡처 차이(차이 32 초과)가 404에서 346040픽셀로 커졌다. FigmaFrame `node`(stage/image)는 감싸는 요소만 800×500이고 안의 이미지(`width` 속성)는 채우지 못하고, narrow는 고정 높이에 변수가 없어 `node`로 줄 수 없다. 피그마 이미지 크기를 견본으로 볼지(캡처에서 이미지 크기 빼기), 앱 규칙에 맞춰 피그마를 고칠지 정해야 해서 컴포넌트와 스토리를 main 그대로 두었다.
  - 확인: 피그마 캡처 473개 변형의 코드 그림은 현재 main(#524~#527, 이 작업 전 상태)과 비교해 메시지 상자 셋(대상 폭 1664→640, 피그마와의 차이는 같음)과 `patterns/chrome/page` post·wide(4픽셀, 차이 32 이하, 전부터 흔들림) 밖에는 같다(ImageViewer는 main 그대로라 따로 찍어 같음을 확인). 모든 스토리 화면의 차이는 위 의도한 것(ChromePostTab 넷, PostBlocks 동작 둘, DragToFolder, CancelDrag)과 #528이 만든 차이(ExplorerBody·ExplorerWindowLayer·Start/Body·Start/ViewMenu·Taskbar/Default), 바꾸기 전부터 흔들리던 스토리(Shell·TaskbarLayer·시계, Chrome/Page·Window/Chrome 4~6픽셀 등)뿐이다.
"시나리오 케이스 ①: 이름, 정의 필드, 케이스 나누기": |
  - 정의 파일 이름·위치(`apps/web/e2e/behaviors/*.behavior.ts`, `defineBehavior`)는 바꾸지 않았다. 정의 단위는 조건·값·케이스를 가진 "행위"이고 [[테스트 작성 규칙:E2E]]도 "행위 정의"로 부른다. "시나리오 케이스"는 그 케이스와 화면의 이름이라 도구 폴더(`tools/scenario-cases`), 패키지(`@seojaewan/scenario-cases`), 워크플로(`scenario-cases.yml`, 이름 `Scenario cases`), 환경 변수(`SCENARIO_CASES_SLOW_MO`·`SCENARIO_CASES_ACTION_MS`·`SCENARIO_CASES_PORT`)만 바꿨다. 위 "E2E 행위 표 ①·②"의 옛 이름은 검토 기록이라 고치지 않았다.
  - 실행 함수는 `check(기대 결과, 확인 함수)`를 받는다. `behaviors.test.ts`가 그 이름의 `test.step`으로 감싸고, `expected`에 없는 이름이면 실패, 끝까지 확인하지 않은 기대 결과가 있어도 실패한다. 확인 함수는 동기여도 된다(값을 이미 잰 `expect`). 다음 동작 전에 화면을 기다리기만 하는 `expect`(메뉴가 뜰 때까지 등)는 `check` 밖에 두었다.
  - 26개 행위의 `scenario`·`expected`는 run 코드를 읽고 하위 에이전트(Sonnet 넷)가 나눠 썼다. 확인 순서·내용은 바꾸지 않았다. 바탕화면·탐색기 일부 문장은 시안의 손으로 쓴 문장을 run 코드에 맞춰 고쳐 썼다.
  - 화면 크기 조건(PC·노트북·모바일)이 없던 행위 전부에 더했다(`chrome-address-bar`, `recycle-restore`, `search-open`, `start-pinning`, `taskbar-pinning`, `window-maximize`, `window-screen-resize`, `window-snap`, `explorer-mobile-search`). `window-default-size`의 화면 구간(PC·노트북)에는 모바일을 더했다.
  - `noCase`는 문서상 그 행위에서 성립하지 않는 값에만 적었다(6개): `explorer-mobile-search`의 PC·노트북([[파일 탐색기:구성]], [[파일 탐색기:폴더 안 검색]]), `window-default-size`·`window-maximize`·`window-screen-resize`·`window-snap`의 모바일([[창 동작:모바일]], 스냅은 [[스냅:모바일]]도). 할 수 있지만 아직 케이스가 없는 값(노트북, 키보드 등)과, 다른 조건과 짝을 지어야만 성립하지 않는 값(`search-open`의 '모바일 검색 버튼'은 모바일 화면에서만, `start-pinning`·`taskbar-pinning`의 모바일 끌기 등)은 이유를 적지 않고 빠진 값으로 두었다.
  - 모바일 전용 행위는 `explorer-mobile-search` 하나였다. 화면 크기 기준을 모바일, 입력 방식 기준을 터치로 하고 Pixel 7 장치에서 `touch.tap`으로 돈다. `setViewportSize`(390)로 모바일을 만들던 케이스(`url-entry`#3, `explorer-open-post` 모바일)도 Pixel 7 장치로 바꾸고 기대 너비를 412로 맞췄다.
  - 케이스를 나눈 것: `desktop-cut-paste` 1번을 두 방향으로(바탕화면 → 탐색기 / 탐색기에서 잘라 창을 닫고 바탕화면에 붙임, 새 케이스는 처음 잘라낸 곳·붙이기 전에 두 조건이 함께 다름). 그래서 붙이기 전에 기준은 '바로 붙임'이다. `desktop-open-item` 2번(휴지통)이 Blog 창 내용도 확인하던 것을 1번으로 옮겼다. `explorer-browse` 1번(옮기는 법 여럿과 탭)을 폴더 더블클릭·뒤로/앞으로·탐색 창·위치 칸·탭 열고 닫기 다섯으로 나누고 탭 기준을 '탭 하나'로 했다. `explorer-open-post` 1번을 처음 엶·다시 엶으로 나누고 같은 글 기준을 '처음 엶'으로 했다. `start-pinning` 바탕화면 케이스를 고정·새로고침·다시 시작 셋으로 나눴다. `taskbar-pinning` 1번에서 새로고침을 빼고 '창 없이 해제 → 새로고침' 케이스를 더했다. 원래 1번이 지나가던 '창을 열었다 닫음 + 새로고침' 조합은 지금 어느 케이스도 돌지 않는다.
  - 값을 고친 것: `start-open-item`·`taskbar-app-button`의 입력 '클릭'을 '마우스 클릭'으로, `start-open-item`에 '터치 탭'을 더했다. `window-screen-resize`는 기준 화면 PC에 맞춰 1800×1000에서 시작해 폭 800으로 줄였다(전에는 노트북 구간인 1280×720). `start-open-close`의 화면 높이 '낮음' 케이스는 1280×300으로 돌아 화면 크기 PC와 어긋나지만 그대로 두었다. 검토가 필요하다.
"시나리오 케이스 ②: 화면, 필름 띠, 실행 기록, 이번 PR": |
  - 로컬 도구와 Pages 보고서가 같은 `page/` 세 파일(HTML·CSS·JS)을 쓴다. 모양은 회색조에 강조색 하나(링크·선택)이고 색은 상태에만 쓴다(실패 빨강, 빠짐 주황, 통과 초록 점). 카드·그림자·둥근 꼬리표 없이 줄과 여백으로 나눴다. 조건 × 값 지도는 행위 안에서 값 칸 너비를 같게 맞췄고, 조건 이름 옆에 조건 키를 고정폭 글자로 보인다.
  - 빠진 값 제안은 도구가 만든다. 제안 시나리오는 "기준 케이스에서 ○○만 '값'으로 바꿔 한다 — 기준 시나리오"이고, 근거 문장은 그 행위 케이스들의 근거 섹션 문장 가운데 값 전체가 든 문장, 없으면 값의 낱말이 많이 든 짧은 문장이다. 못 찾으면 비운다. 붙일 뼈대는 케이스와 `noCase` 두 가지를 보인다.
  - 여러 행위에서 함께 빠진 값은 조건 이름과 값이 같은 것을 두 행위 이상에서 묶는다. 실패 목록은 영역·함께 빠진 값 거르기만 따르고 검색·결과 거르기는 케이스 목록과 같게 따른다.
  - 필름 띠: trace zip을 새 패키지 없이 `node:zlib`로 읽는 작은 zip 리더(`zip.ts`)로 연다. trace의 `screencast-frame` 가운데 4장을 고르게 고르고, 실패하면 처음 오류가 난 시각까지에서 고르고 마지막 장을 실패 지점으로 표시한다. 이미지는 보고서를 만드는 단계에서 Playwright Chromium 캔버스로 320×200 안에 줄인다(JPEG 품질 0.7). 로컬에서 57케이스 보고서를 만들어 보니 228장, 1.8MB였다.
  - 실행 기록: 보고서에 `history.json`(최근 10번, 케이스 결과는 `행위id/케이스id` 열쇠)을 남기고, 다음 실행이 `configure-pages`의 주소에서 내려받아 이어 쌓는다. 처음이거나 읽지 못하면 이번 실행부터 쌓는다. 화면은 요약에 최근 실행, 케이스에 최근 5번을 보인다. gh-pages 가지를 따로 두지 않았다.
  - 이번 PR: Pages 보고서는 `main`에서만 만들어 넣지 않았다. PR마다 보고서를 따로 올리는 일은 무거워 하지 않았다. 대신 로컬 화면이 `origin/main`과 갈라진 곳부터 지금 작업 트리까지 바뀐 파일(커밋 안 한 것·새 파일 포함)로 영향받는 케이스를 계산해 "이번 PR만" 거르기와 표시를 붙인다. 정의 파일이나 정의 도우미(`behaviors/`의 다른 파일, `behaviors.test.ts`)가 바뀌었거나, 근거 섹션의 문서 파일 또는 그 섹션에 `@codocs`로 연결된 제품 코드가 바뀌면 영향받는다.
  - 로컬 화면의 마지막 실행 칸은 비워 두고(실행해보기만 있다), 실행해보기 결과에도 기대 결과별 확인(단계)을 붙였다.
  - 배포 뒤 필름 띠 그림에 지연 불러오기(`loading="lazy"`)를 걸어 두니 불러오기 전에 너비가 0으로 접혀 세로줄로 보였다. 그림은 케이스를 펼칠 때만 그리므로 지연 불러오기를 뺐다(후속 PR).
  - 배포 뒤 첫 실행 기록(#497 병합 커밋)이 다음 실행의 기록에 남지 않았다. Pages 응답 캐시(10분) 때문에 옛 응답을 받은 것으로 보고, 기록을 받을 때 실행마다 다른 쿼리와 `Cache-Control: no-cache`를 붙였다(후속 PR).
"시나리오 케이스 ③: 시안대로 다시 구현, 케이스 나누기": |
  - 행위 제목의 "→ 결과들"은 케이스 `result`를 잇지 않고 행위 필드 `summary`로 두었다. 케이스가 대여섯 개인 행위는 이으면 한 줄을 넘는다. 바탕화면·탐색기 10개 행위의 `summary`·`result`는 시안(spec.js) 문장 그대로, 나머지는 run과 기대 결과를 보고 지었다.
  - `requires`는 행위 필드 `[{ when: { 조건: 값 }, then: { 조건: 값, ... } }]`로, `when`은 조건 하나다. 연쇄로 따라가고, 케이스·이유·빠진 값 줄 모두에 적용한다. `combine`은 케이스 필드 `{ change, reason }`이다. 같은 케이스 줄은 `requires`로 채워진 값에만 생긴다.
  - `requires`와 `combine`을 가른 기준: 상대 값만 바꾼 경우가 그 케이스와 사실상 같으면(터치 ⇔ 모바일, 폴더 한 번 터치 ⇔ 터치) `requires`, 한쪽으로만 따라오는 것(탐색기 창을 닫음 → 처음 잘라낸 곳 탐색기, 모바일 → 같은 창의 폴더, 화면 높이 낮음 → 노트북, 다시 엶 → Chrome 있음, 새로고침 → 돌아갈 자리 비어 있음, 새로고침·다시 시작 → 고정, 새로고침 → 창 기록 이동 없음)은 이유와 함께 `combine`으로 두어 상대 값이 빠진 값으로 남게 했다. 시안이 바탕화면·탐색기에서 같은 케이스와 빠진 값을 가른 것과 같다.
  - 시안대로 두었지만 검토가 필요한 의존: `explorer-cut-paste`의 터치 → 이어서 쓰는 명령 '없음', `explorer-drag`의 터치 → 옮긴 뒤 찾기 '안 찾음'. 터치 케이스가 그 단계를 하지 않을 뿐 할 수 없는 것은 아니라, 엄밀히는 의존이 아니다.
  - `start-open-close` 낮은 화면은 1280×300 대신 1600×300으로 돌린다(같은 기대 결과가 성립함을 시험). 앱의 노트북 판정(폭 1599 이하 또는 높이 899 이하)으로 이 크기도 노트북이라, 화면 크기 노트북을 `combine`으로 엮었다.
  - `window-snap`은 다른 창이 있어도 스냅 뒤 최대화 버튼을 누를 수 있어(Snap Assist가 닫힘, 시험함) '최대화 후 복원'을 다른 창 있음(기준)으로 돌린다. 그래서 다른 창 '없음'은 새로 빠진 값이 되었다. 최대화 버튼이 Snap Assist를 닫는 것은 지금 앱 동작에 기댄 것이다.
  - `recycle-restore` 새로고침 케이스는 같은 이름 폴더를 만들면 새로고침 뒤 "React"와 "React (2)"가 함께 보여(시험함) 돌아갈 자리를 '비어 있음'으로 엮고, 휴지통에 보낸 동안 검색은 기준대로 한다.
  - `chrome-address-bar` 휴지통 글 주소 케이스는 복원 뒤 뒤로를 눌러 창 기록 이동을 기준(뒤로)에 맞췄다(새 확인은 더하지 않음). 새로고침 케이스는 뒤로까지 하면 새로고침 뒤 Chrome 창이 없어(시험함) 창 기록 이동 '없음'을 엮었다.
  - `explorer-open-post` 모바일 케이스의 검색 패널 확인 셋(시안은 근거에서 뺐다)은 줄이지 않고 그대로 두었다. `explorer-browse`는 케이스 순서를 조건·값 순서로 바꿔 번호가 바뀌었다.
  - 빠진 값 줄의 결과 칸은 비운다. 시안의 손으로 쓴 예상 결과는 정의에 없는 내용이라 옮기지 않았다.
  - 화면에서 없앤 것에 맞춰 도구 코드도 지웠다: 빠진 값 제안(`suggest.ts`), 필름 띠(`trace-film.ts`, `zip.ts`), 이번 PR 거르기(`changed-files.ts`), 케이스별 최근 실행. `history.json`은 실행 기록 링크와 다음 기능을 위해 그대로 쌓는다. 화면은 어두운 모드 색도 둔다.
  - 저장소의 행위 정의 전체가 "기준 + 조건 하나씩" 규칙(바꾼 조건 하나, 기준값과 같은 change 없음, 없는 값 없음, combine 이유)을 지키는지 도구 단위 테스트가 본다.
"토큰 PR #522: size/search-results/mobile-height 삭제 반영": |
  - 지운 변수 `size/search-results/mobile-height`의 클래스(`h-size-search-results-mobile-height`)는 SearchResults `Figma` 스토리의 모바일 크기 상자만 썼다. 피그마 SearchResults 모바일이 높이를 내용에 맞추게 바뀌어, 대신할 토큰 없이 높이 클래스를 지우고 너비(`w-size-shell-mobile-body-width`)만 남겼다. 컴포넌트(모바일의 `ScrollArea size-full`)와 스크롤 시험은 다음 SearchResults 컴포넌트 PR에 맡기고 고치지 않았다.
  - `size/scrollbar/thumb-length` 값(80 → 119.4444)과 새 변수(`font/line-height/code-inline`, `size/shell/content-width`, `size/shell/mobile-content-width`), 새 글자 스타일 `Code/Inline`(`type-code-inline`)은 코드에서 고칠 곳이 없다. `type-code-inline`을 쓰는 코드는 다른 PR이 만든다.
  - 전체 `pnpm test`에서 `unit-scenario-cases`의 `read-behaviors.test.ts` 저장소 규칙 테스트가 5초 제한에 걸려 한 번 실패했다. 이 PR과 관계없는 파일이고 그 프로젝트만 다시 돌리니 통과해 부하로 인한 시간 초과로 보고 손대지 않았다.
"컴포넌트 PR #477 SearchResults: Figma 스토리 되살림": |
  - `Figma` 스토리를 다시 만들고 `device` 변형마다 `Results` 슬롯에 `export.json` 기본 내용과 같은 ListGroup 넷(최고 일치: Two-line·Selected "리액트 19 훅 정리"/"글", 폴더: "리액트", 글: 두 항목, 외부 링크: "리액트 스터디 노트")을 넣었다. 안쪽 BestMatchCard는 기본값(제목·부가 정보, 문서 아이콘)에 동작 MenuItem 둘(열기, 링크 복사, `standalone`)을 넣었다. 동작 목록은 앱 `search-body.tsx`와 같이 `flex flex-col items-start gap-spacing-sm` 상자로 감쌌다(BestMatchCard `Actions` 슬롯 상자가 아직 블록이라서다).
  - 크기는 변형마다 `h-size-search-results-height w-size-shell-body-width`, `h-size-search-results-mobile-height w-size-shell-mobile-body-width`로 감쌌다. 배치는 `padded`다(높이 545·465가 홀수라 가운데 배치에서 반 픽셀에 놓여 선과 글자가 번졌다).
  - 자리 글자를 넣던 `Default`·`Mobile` 스토리를 [[테스트 작성 규칙:테스트 지침]]대로 지웠다. 넘긴 글자가 나오는지와 넘치지 않을 때 스크롤바가 숨는지만 보았다(뒤의 것은 ScrollArea의 동작이다).
  - 코드는 피그마에 없는 BestMatchCard 속성(`icon`·`title`·`meta`)과 `Actions` 슬롯(`actions`)을 SearchResults prop으로 다시 연다. [[디자인 시스템:컴포넌트 조립 규칙]]의 "안쪽 바탕의 슬롯을 자기 슬롯으로 따로 열지 않는다"와 어긋나 보이지만 이 PR 전부터 있던 구조라 고치지 않고 보고만 한다.
"컴포넌트 PR #469 ListGroup: Figma 스토리와 동작 스토리 정리": |
  - `Figma` 스토리를 다시 만들고 `items` 슬롯에 `export.json` 기본 내용과 같은 Compact ListItem 둘("리액트 서버 컴포넌트 이해하기", "리액트 쿼리 캐시 전략", `images/file-document`)을 넣었다. 머리글 글자는 SectionHeader 기본값 "머리글"이라 넘기지 않았다. 컴포넌트 속성 `Show header`는 `showHeader` arg로 열었다. 너비는 `w-size-shell-body-width`(574)다. 기본 내용의 ListItem 속성에 `Show subtitle: true`·`Subtitle`이 있으나 Compact라 부제가 그려지지 않아 넘기지 않았다.
  - 자리 글자(`<span>항목</span>`)를 넣던 `Default`·`HeaderClickable`·`HeaderHidden` 스토리를 [[테스트 작성 규칙:테스트 지침]]대로 지웠다. `Default`·`HeaderHidden`은 넘긴 글자와 불리언이 그대로 나오는지만 보았고, `HeaderClickable`이 보던 머리글 누르기 배선은 앱 `start-body.stories.tsx`의 글자 머리글 스토리가 실제 ListGroup으로 본다.
  - 컴포넌트 주석의 "피그마 원본 너비 574"를 토큰 이름(`size/shell/body-width`)으로 바꿨다.
"컴포넌트 PR #476 StartMenuFooter: Content 슬롯 가로 배치와 Figma 스토리": |
  - 피그마 `Content` 슬롯은 가로 자동 배치(세로 가운데)인데 코드의 슬롯 상자는 블록이라, 앱이 안에 `flex w-full items-center` 상자를 하나 더 두고 있었다. 슬롯 상자를 `flex items-center`로 바꾸고 `start-menu-panel.tsx`의 덧상자를 지웠다(ProfileButton은 그대로 부모 채움).
  - `Figma` 스토리를 다시 만들고 슬롯에 `export.json` 기본 내용과 같은 ProfileButton(`images/avatar-profile`, "서재완", 부모 채움)과 전원 IconButton(`subtle`, `ic_fluent_power_20_regular`, 이름 "전원" — 앱 `StartPowerButton`과 같다)을 넣었다. 너비는 `w-size-start-menu-footer-width`(638)다. 내용 글자 하나만 확인하던 `Default` 스토리는 [[테스트 작성 규칙:테스트 지침]]대로 지웠다.
  - 스토리 배치를 `padded`로 두었다(PinnedTile과 같은 이유). 기본 `centered`에서는 높이 65가 y=.5에 놓여 위 선과 아래 가장자리가 두 줄로 번졌다. 캡처 도구의 정수 위치 맞춤(`integerShift`)이 꼭 0.5만큼 옮길 때는 효과가 없는 것으로 보이나, 도구는 고치지 않았다.
"컴포넌트 PR #478 BestMatchCard: Actions 슬롯 세로 배치와 Figma 스토리": |
  - 피그마 `Actions` 슬롯은 세로 자동 배치(간격 `spacing/sm`)인데 코드의 슬롯 상자는 블록이라, 쓰는 곳(앱 `search-body.tsx`)이 `flex flex-col items-start gap-spacing-sm` 상자를 따로 두고 있었다. 슬롯 상자를 `flex flex-col gap-spacing-sm`으로 바꾸고 앱의 덧상자를 조각(`<>`)으로 바꿨다. MenuItem은 원래 `w-full`이라 `items-start`를 빼도 모양이 같다. SearchResults `Figma` 스토리의 같은 덧상자도 지웠다.
  - `Figma` 스토리를 다시 만들고 슬롯에 `export.json` 기본 내용과 같은 MenuItem 둘(열기 `ic_fluent_open_20_regular`, 링크 복사 `ic_fluent_link_20_regular`, `standalone`)을 넣었다. 제목·부가 정보는 기본값이라 넘기지 않고, 아이콘은 `ImageAsset`(`images/file-document`)이다. 배치는 `padded`다(높이 255가 홀수라서다).
  - 자리 단추를 넣던 `WithAction` 스토리를 [[테스트 작성 규칙:테스트 지침]]대로 지웠다. 넘긴 글자·구분선·단추가 나오는지만 보았다.
"PR #474 ShellSurface: Material 속성 삭제": |
  `ShellSurface`의 `material` prop과 `ShellSurfaceMaterial` 타입, `solid` 분기를 지우고 아크릴 칠·효과(`material-acrylic-base surface-shell-acrylic`)를 상수 하나로 고정했다. Start·검색 패널 조립의 `material="acrylic"`도 지웠다. `Default` 동작 스토리는 `material="solid"`를 쓰고 있어 속성만 뺐다(동작 확인은 같다). Content 슬롯은 모든 변형에서 비어 있어 `Figma` 스토리는 슬롯을 비운 채 둔다.
  [[디자인 시스템:컴포넌트 조립 규칙]]의 `Material` 변형 예 목록에서 ShellSurface를 빼 "(Flyout, WindowFrame 등)"으로 고쳤다(허락받은 작은 문서 맞춤).
"PR #472 Taskbar: Material 속성 삭제와 Figma 스토리 다시 만들기": |
  `Taskbar`의 `material` prop과 `TaskbarMaterial` 타입, `solid` 분기를 지우고 `material-acrylic-base`를 바로 건다. 조립이 쓰지 않아 있던 `Solid` 동작 스토리도 지웠다. `Default`·`Empty` 동작 스토리는 슬롯 prop의 동작을 보므로 남겼다.
  지웠던 `Figma` 스토리를 다시 만들었다. 슬롯은 `export.json`의 기본 내용과 같게 가운데에 시작 버튼(`logo-windows`)·검색상자(`appearance=taskbar`, 문구 "검색")·파일 탐색기·Chrome(`TaskbarButton`), 오른쪽에 `SystemTray`(오후 3:24, 2026-10-20)를 넣었다. 너비는 `w-size-taskbar-width`, 아이콘 라벨은 접근성 이름("시작", "파일 탐색기", "Chrome")이다. 앱 아이콘은 다른 `Figma` 스토리처럼 `ImageAsset`을 쓴다. 코드 `Taskbar`의 `center`·`right`에는 기본값을 두지 않았다.
"PR #473 TaskbarPreviewList: Material 속성 삭제와 Figma 스토리 다시 만들기": |
  `TaskbarPreviewList`의 `material` prop과 `TaskbarPreviewListMaterial` 타입, `solid` 분기를 지우고 `material-acrylic-base surface-shell-acrylic`을 바로 건다. 조립이 쓰지 않아 있던 `Solid` 스토리도 지웠고, `Default` 스토리는 `children` 자리와 div 속성을 보여 주는 것이라 남겼다.
  지웠던 `Figma` 스토리를 다시 만들었다. `Previews` 슬롯에는 `export.json`의 기본 내용과 같은 `WindowPreview`(`State=Rest`) 둘을 넣고, 앱 아이콘은 파일 탐색기 이미지 자산을 썼다. `WindowPreview`의 thumbnail 슬롯은 피그마에서 비어 있어 `WindowPreview`의 `Figma` 스토리와 같이 칠 없는 빈 내용만 넣었다. 코드 `TaskbarPreviewList`의 `children`에는 기본값을 두지 않았다. 창 제목 "창 제목"은 `WindowPreview`가 `title`을 주지 않으면 그리는 글자라 따로 넘기지 않았다.
