  `fix/taskbar-review` PR에서 작업 표시줄 검수(마지막 PR에서 지웠다)의 2·3·7번과 10번의 앱 이름을 고치며 규칙으로 정한 것이다.
  - 앱 우클릭 메뉴(`getAppMenuEntries`)에서 앱 이름 아래 구분선만 뺐다. 점프 목록(9·10번)이 들어오면 목록과 앱 묶음 사이 구분선을 그때 더한다.
  - 끄는 동안 버튼 모양은 `TaskbarAppItem`의 `isDragging`으로 준다. 실행 표시는 `none`으로, 호버·눌림 바탕과 테두리는 클래스로 꺼서 디자인 시스템 `TaskbarButton`은 바꾸지 않았다. 놓거나 끌기가 취소되면 돌아온다.
  - "Google Chrome"으로 바꾼 곳은 `taskbar-apps.ts`의 `label`뿐이다. 이 이름은 작업 표시줄 버튼 접근성 이름과 앱 우클릭 메뉴의 앱 이름 줄에만 쓰여, 그 이름을 찾는 스토리·E2E만 따라 고쳤다. Start 목록·타일의 제목(`Chrome`)과 Chrome 창 제목(`새 탭 - Chrome`)은 따로 정의돼 바뀌지 않았다.
  - E2E 조건 값 `Chrome`(앱 조건의 값 이름)과 창 제목 확인은 그대로 두었다.
  - [[작업 표시줄:우클릭 메뉴]]의 "작업 표시줄에서 고정 해제" 문구는 이 PR에서 허락받지 않은 문서라 고치지 않았다. 코드는 "작업 표시줄에서 제거"다. 사람이 맞출 곳이다. → 조립 PR(`feat/figma-patterns-taskbar`)에서 허락받아 "작업 표시줄에서 제거"로 맞췄다.

  조립 PR(`feat/figma-patterns-taskbar`)에서 4·6·10번을 마치며 정한 것이다.
  - 메뉴 너비: 메뉴 항목 데이터가 아니라 메뉴를 여는 쪽이 고르게 했다. `MenuPopup`의 `width`에 `taskbar`(`w-size-menu-taskbar-width`)를 더하고, `ContextMenuArea`가 `width`를 받아 넘기며, 작업 표시줄 앱 버튼(`TaskbarAppItem`)만 `taskbar`를 준다. 그래서 점프 목록이 있든 없든 작업 표시줄 앱 메뉴는 모두 294다.
  - 점프 목록 머리글: 피그마가 Content 안에 직접 그린 머리글(`header 자주 방문`)을 메뉴 항목 종류 `kind: 'group'`(머리글 + 항목)으로 만들어 Base UI `Menu.Group`·`Menu.GroupLabel`로 그렸다. 보조 기술에는 머리글이 이름인 메뉴 묶음이다. 모양은 피그마 변수대로 높이 32(`py-spacing-sm` + Caption 16), 왼쪽 `px-spacing-lg`, `type-caption`, `text-color-black-61`이다. 피그마 글꼴은 `Hangul/Caption`인데 같은 크기·굵기·줄 높이의 `type-caption`을 썼다(한글은 같은 Pretendard로 그려진다).
  - 점프 목록 구조: 앱마다 점프 목록을 만드는 자리 `getAppJumpList(app)`(작업 표시줄 앱 층)를 두고, `getAppMenuEntries`가 받은 `jumpList`를 앱 묶음 위에 붙이며 사이에 구분선 하나를 넣는다. 목록이 비면 구분선도 없다. 9번 탐색기는 `file-explorer` 자리에 목록을 넣으면 된다. 메뉴 폴더의 `-entries` 파일 하나만 import할 수 있는 경계 규칙 때문에 `getChromeJumpListEntries`도 `app-menu-entries.ts`에 두었다.
  - Chrome 점프 목록의 글: 새 탭 페이지와 같은 `getLatestPosts`를 쓰고, 개수(6)는 두 곳이 함께 쓰도록 `CHROME_LATEST_POST_COUNT`로 `workspace-rules`에 옮겼다. 글을 고르면 다른 입구(바탕화면·탐색기·Start)와 같은 `useOpenItem`으로 연다. 그래서 가장 최근에 쓴 Chrome 창(최소화된 창 포함)의 새 탭으로 열고 복원·맨 앞으로 가져오며, 모바일은 그 창의 고른 탭에서 열고, 최근 항목에도 넣는다. "자주 방문"에 글이 하나도 없으면 그 칸(머리글 포함)을 숨기고 "작업"만 둔다.
  - "새 창" 아이콘은 피그마대로 Chrome 앱 아이콘(`images/app-chrome`), 글 아이콘은 새 탭 페이지와 같은 `images/file-document`다. "새 창"은 앱 이름 줄과 같은 `open-new` 동작이다.
  - 카드 폭 계산: 카드 너비는 `WindowPreview`가 `aspectRatio`로 CSS에서 정하고, 앱은 같은 규칙의 `getPreviewCardWidth`·`getPreviewThumbnailBox`(`window-geometry`)로 축소 화면 자리를 구해 `WindowThumbnail` 배율을 정한다. 창 비율은 창이 화면에서 차지한 크기(최대화·스냅이면 그 자리, 모바일은 작업 영역)로 구한다. 모바일 축소 화면 크기도 전에는 창의 원래 자리였는데 화면에 보이는 크기(작업 영역)로 바로잡았다.
  - 모바일 목록: 카드마다 비율 폭으로 놓은 합이 화면 폭(좌우 12 여백)을 넘으면 전처럼 같은 너비로 줄인다. 모바일 창은 모두 작업 영역 크기라 카드가 모두 같은 비율이고, 세로 화면에서는 카드가 좁다(320×520 작업 영역이면 약 82.5).
  - Snap Assist: 같은 `WindowPreview`를 쓰므로 앱이 창 비율을 넘기게 했다. Snap Assist 조립 스토리(`Window/SnapAssist`)는 피그마 그림이 아직 고정 폭이라 `aspectRatio` 없이 둔다.
  - 조립 스토리 `Taskbar/PreviewList`: 피그마 새 그림처럼 1024×640 창을 108 높이에 맞춰(0.16875) 비율 폭 188.8 카드로 그린다.
  - 피그마 `Menu/TaskbarJumpListChrome`에는 "자주 방문"과 "작업" 사이에도 구분선이 있지만, 맡긴 일과 검수 2번 규칙(점프 목록과 앱 묶음 사이에만 구분선)을 따라 넣지 않았다. 캡처 표에서 "작업" 아래가 9px 위로 올라간 차이로 보인다.
  - `WindowPreview`의 `@codocs` 연결은 지운 검수 섹션 대신 규칙을 옮긴 [[작업 표시줄:창 미리보기]]로 바꿨다.

  탐색기 점프 목록 PR(`feat/taskbar-explorer-jump-list`)에서 9번을 마치며 정한 것이다.
  - 고정 항목: 메뉴 항목 종류 `kind: 'pinned'`(`MenuPopupPinned`)를 `MenuPopup`에 더했다. 디자인 시스템 `MenuItem`은 바꾸지 않고, 압정 해제 버튼은 피그마 `hover · Menu/TaskbarJumpListExplorer`의 `unpin`대로 `IconButton` subtle과 `ic_fluent_pin_off_20_regular`를 줄 오른쪽 끝(`right-spacing-xs`, 줄과 같은 높이라 `top-spacing-none`)에 겹쳐 그렸다. 항목 열쇠는 폴더 id다(같은 이름 폴더가 둘이어도 갈린다).
  - 줄 칠하기: 버튼이 Base UI 메뉴 항목 밖이라 포인터가 버튼으로 가면 Base UI 강조가 풀린다. 그래서 줄을 묶음 호버(`group-hover/pinned:[&>span]:bg-color-black-4`)로도 칠했다. 버튼은 마우스를 올린 줄과 키보드로 강조한 줄에만 보인다. 버튼 위에서는 버튼 자신의 호버 바탕(`color/black/4`)이 줄 바탕 위에 겹친다(피그마 그림은 버튼 바탕이 투명인 줄 호버만 그렸다).
  - 키보드: 압정 해제 버튼은 창 미리보기 닫기 버튼처럼 마우스 전용이다(`aria-hidden`, `tabIndex=-1`, 눌러도 포커스를 옮기지 않음). 키보드는 항목 메뉴(Shift+F10·메뉴 키)의 "이 목록에서 고정 해제"를 쓴다. 카드처럼 Delete 단축키를 두지는 않았다. `MenuItem`에 `aria-keyshortcuts`를 달 자리가 없고 항목 메뉴로 키보드 길이 있기 때문이다.
  - 압정 해제 버튼이나 항목 메뉴로 고정을 해제해도 점프 목록은 열어 둔다(검수 9번은 우클릭만 "닫지 않는다"고 정했다). 목록이 비면 그 자리에서 머리글과 구분선이 사라진다.
  - 항목 메뉴: Base UI ContextMenu로 줄을 감싸면 안의 `Menu.Item`이 점프 목록이 아니라 항목 메뉴에 붙어 방향키·고르기·강조가 깨진다(시험해 확인). 그래서 줄 옆에 둔 `Menu.Root`(`modal={false}`)를 우클릭 좌표의 가상 기준점에 연다. 점프 목록 팝업 안에서 열려 Base UI가 같은 팝업 묶음의 자식으로 보므로 점프 목록이 닫히지 않고, Esc는 항목 메뉴만 닫는다. 키보드로 보낸 contextmenu는 좌표가 0이라 줄 왼쪽 아래에 연다. 자리는 아래·시작 맞춤에 간격 0이다(Base UI ContextMenu 기본 간격은 따라 하지 않았다). 폭은 메뉴 기본 폭(`size/menu/width`)이다. 닫히면 포커스를 그 줄로 돌려주고, 줄이 사라졌으면(고정 해제) Base UI에 맡긴다(포커스가 점프 목록 안에 남는 것을 스토리로 확인).
  - 모바일 길게 누르기는 따로 만들지 않고 브라우저가 보내는 contextmenu만 받는다(Android Chrome은 길게 누르면 보내고 iOS Safari는 보내지 않는다). 그래서 기능 문서에는 우클릭과 키보드만 적었다.
  - 항목을 누르거나 항목 메뉴의 열기를 고르면 다른 입구와 같은 `useOpenItem`으로 연다. 폴더는 탐색기 창이 열려 있어도 늘 새 창이고, 최근 항목에도 넣는다.
  - 항목 메뉴가 열린 동안 우클릭한 줄의 강조는 남기지 않는다(Base UI 강조가 항목 메뉴로 옮겨 간다).
  - 동작 스토리는 흉내 낸 포인터 이벤트로 CSS `:hover`가 걸리지 않아, 압정 해제 버튼이 보이는 것은 포커스(키보드 강조)로 확인한다. 실제 마우스 호버·버튼 누르기·우클릭은 빌드한 Storybook에서 Playwright로 한 번 확인했다.
  - 지운 작업 표시줄 검수를 가리키던 링크는 [[작업 표시줄:우클릭 메뉴]]로 바꾸거나 링크 없는 글로 바꿨다. 파일 탐색기 검수 14번의 영상 설명은 지운 문서의 비교 방법에 있던 ②·③의 뜻을 괄호로 옮겨 남겼다. 코드에는 작업 표시줄 검수를 가리키는 `@codocs` 연결이 없어 바꿀 것이 없었다.

  고정 메뉴 문구 정리 PR(`docs/pinning-menu-labels`)에서 정한 것이다.
  - 메뉴 문구는 [[고정:시작 화면 고정]]·[[고정:작업 표시줄 고정]]·[[고정:즐겨찾기 고정]]에만 두고, 메뉴를 나열하는 문서는 `시작 화면 고정 항목`처럼 항목 이름으로 부르고 링크로 참고하게 했다. 바탕화면·탐색기 우클릭 표도 같은 이름으로 바꿨다.
  - 즐겨찾기로 끌 때의 `즐겨찾기에 고정` 툴팁([[파일 탐색기:탐색 창]])은 메뉴 항목이 아니라 끌기 안내 문구라 그대로 뒀다.
  - 탐색기 점프 목록 항목 메뉴의 `이 목록에서 고정 해제`는 점프 목록 전용 문구라 그대로 뒀다.

Chrome 세션: |
  2026-11-10 Chrome 검수 후속([[Chrome 검수]])에서 사람에게 묻지 않고 정한 것이다.
  - #884 BrowserTab: 활성 탭 오목 모서리는 검수 문서의 가상 요소 원형 그라디언트 대신 export.json대로 Shapes 자산(`shapes/browser-tab-corner-left·right`)을 `Asset`으로 탭 밖 아래 양옆에 그렸다. 크기는 견본 크기(8, 변수 없음)라 같은 값의 `size-spacing-sm`으로, 위치는 `right-position-full`·`left-position-full`과 `bottom-spacing-none`으로 두었다. 칠은 탭 바탕과 같은 `text-color-white`다.
  - #884 BrowserTab: 모서리 조각은 탭 밖으로 나오므로 `pointer-events-none`을 주어 옆 탭의 누르기·호버를 막지 않게 했다.
  - #884 BrowserTab: 피그마 기본 파비콘이 아직 `file/Document`라 `Figma` 스토리는 그대로 두었다(검수 8번의 Material `description`은 내보낸 그림에 아직 없다).
  - #885 AddressBar: 피그마 `Filled`는 SearchBox처럼 prop을 두지 않고 입력값으로 정한다. 앞 아이콘은 CSS `:placeholder-shown`(`group-has-placeholder-shown:`)으로 사이트 정보(i)와 돋보기를 바꿔, 제어·비제어 입력 모두 상태 없이 따라간다.
  - #885 AddressBar: `placeholder` 기본값은 url·query처럼 피그마 TEXT 속성 기본값("글 검색 또는 URL 입력")을 그대로 쓴다. `Figma` 스토리는 `isFilled`가 거짓이면 url·query를 비운다.
  - #885 AddressBar: 빈 주소창 동작 스토리 `Empty`는 아이콘을 viewBox(Material 20, Fluent 24)로 구분해 비었을 때 돋보기, 입력하면 사이트 정보 아이콘인지 확인한다.
  - #892 BrowserTabStrip: 탭 검색(⌄) 버튼은 모양과 자리만 그리고, 앱이 메뉴를 붙일 수 있게 BrowserToolbar의 `renderMenuButton`과 같은 방식으로 `renderTabSearchButton`(버튼 요소를 받아 감싸는 함수)과 `onTabSearch`를 열었다. 접근성 이름은 `tabSearchLabel`(기본 "탭 검색")이고, + 버튼 이름도 같은 꼴로 `newTabLabel`(기본 "새 탭")을 열었다. ⌄ 감싸기는 + 감싸기와 같은 `shrink-shrink-none items-start overflow-clip pb-spacing-2xs`다.
  - #893 BrowserToolbar: 아래 1px 안쪽 선은 이 저장소의 한 면 선 방식(`border-b-stroke-width-default border-color-black-22`, LayerSurface의 `border-t-*`와 같다)으로 그렸다. 박스 크기를 border-box로 두므로 높이 46은 그대로이고 선은 안쪽에 들어간다. 데스크톱·모바일 Chrome 창이 같은 `toolbar`를 쓰므로 둘 다에 들어간다.
  - #896 추천 줄과 탭 파비콘의 Material 아이콘 색은 도구 모음 아이콘(`IconButton` Chrome)과 같은 `text-color-gray-70`이다. 탭 검색 메뉴 항목의 글 아이콘은 MenuItem 아이콘 자리가 정하는 색 그대로다.
  - #896 탭 검색 메뉴: 항목 함수 `getChromeTabSearchMenuEntries`(`features/chrome/tab-search-menu/`)를 ⋮ 메뉴처럼 실제 메뉴와 `Patterns/Menu/ChromeTabSearch` 스토리가 함께 쓴다. 열림 상태는 ⋮ 메뉴처럼 Chrome 창 층이 갖고 `ChromeWindow`가 `renderTabSearchButton`으로 `MenuButton`(아래 왼쪽 맞춤)을 붙인다. 닫힌 뒤 포커스는 ⌄ 버튼으로 돌아간다(기본값).
  - #896 Chrome 창 탭 목록: 맨 왼쪽·오른쪽 활성 탭의 모서리 조각이 `overflow-x-auto` 상자에 잘려(앱에서 확인) 탭 목록에 조각 크기만큼 안쪽 여백과 음수 바깥 여백(`px-spacing-sm -mx-spacing-sm`)을 두었다. 늘어난 여백이 ⌄ 버튼 끝을 덮어 누르기를 가로채지 않게 목록은 `pointer-events-none`, 탭은 `pointer-events-auto`다. 탭 줄이 넘쳐 스크롤할 때 고른 탭을 보이게 하는 `useTabStrip`은 목록의 안쪽 여백까지 보이게 바꿨다(탐색기 탭 목록은 여백이 없어 그대로다). 스크롤된 탭은 그 여백(8px)까지 보여 ⌄ 버튼 끝 4px과 겹칠 수 있다.
  - #896 Chrome 검수 문서는 피그마 작업 검수, 남은 작업, 이 문서가 가리키고 있어 지우지 않고, 피그마 세션처럼 1~8번을 "끝남(#PR)"과 한두 줄로 줄였다.
