  | #200 탐색기(병합) | 공통 틀: 조립은 `features/<기능>/<이름>.tsx`, 스토리 제목 `Patterns/<조립 이름>`·export `Parity`, HUG 조립은 `layout: 'padded'`, 스토리 데이터는 `story-data.ts`(`.fixture`를 붙이면 캡처 범위에서 빠져 붙이지 않음) |
  | #200 | 디자인 시스템에 공개 컴포넌트 `ImageAsset`(png 자산)을 더했다. 앱이 디자인 시스템 내부 경로를 import할 수 없어서다. 이름 목록은 손으로 관리하고 테스트가 파일과 대조한다 |
