_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.
피그마 캡처 삭제(2026-11-11): |
  피그마 그림과 코드 그림을 픽셀로 비교하는 캡처를 지우면서([[피그마 연동:검토한 대안]]) 사람에게 묻지 않고 정한 것이다.
  - `tools/figma-parity`: 사전 조사에서 함께 쓴다고 본 `variant-name.ts`는 import를 확인하니 캡처 쪽 함수(`storyTarget`, `findStoryId`)만 쓰고 있어 죽은 코드가 되므로 파일째 지웠다. `story-target.ts`에는 모션 검사가 쓰는 `storyEntries`와 `IndexEntry`만 남기고, 테스트는 `storyEntries` 테스트로 바꿨다(`story-target.fixture.ts`는 지움).
  - `pr-comment.ts`: 캡처 표 댓글 코드와 `COMMENT_MARKER`(`figma-parity`)를 지우고 `paginate`·`marker`·`markerIndex`·`escapeMarkdown`만 남겼다. 기본 숨은 표시 이름이 캡처 댓글이어서 `marker`·`markerIndex`의 `name`은 필수 인자로 바꿨다. 테스트는 `paginate`와 숨은 표시 테스트로 바꿨다.
  - `paths.ts`: 캡처만 쓰던 상수를 지우고, 파일 안에서만 쓰는 상수는 `export`를 뺐다. `capture-viewport.ts`와 `defaultResultsDir`(`parity-results/`)는 모션 검사가 써서 남겼다. `.gitignore`·`.prettierignore`·`.dockerignore`의 `parity-results/`도 모션 결과가 쓰므로 그대로 두었다.
  - `motion-scope.ts`의 `MOTION_CHECK_WORKFLOW_FILE`(`motion-check.yml`)은 워크플로를 지우는 다른 PR의 몫이라 손대지 않았다.
  - `figma-sync`의 `CI` 섹션은 지시한 네 가지만 남겼다. 지우는 섹션에 있던 모션 검사 범위, 모션 검사 PR 댓글 설명, 모션 검사 화면 크기(1600×900)는 사실이 사라지지 않게 `모션` 섹션의 "모션 검사 범위"로 옮기고, 워크플로가 부른다는 문장은 "지금 부르는 워크플로가 없다"로 고쳤다.
  - `figma-sync`의 `스토리 규칙`: 도구가 하던 일(상태 재현, 적용된 args 확인, 웹 폰트 기다리기, 단독 캡처로 비교)을 적은 문장은 지웠다. `data-parity-target`·`data-parity-hover`와 지시 목록에 없는 `data-parity-box`도 같은 처리로 "지금 이 속성을 읽는 도구는 없다"를 적었다. 이 속성들과 `Figma` 스토리를 계속 둘지는 [[피그마 흐름 논의]]가 정한다.
  - `figma-sync`의 `검토한 대안`: 캡처를 지운 결정을 새 항목으로 더하고, 캡처 범위 전제였던 "라벨로 CI를 켜기"는 지웠다. 픽셀 비교 항목 끝 문장은 "사람이 보는 데만 쓰기로 했지만 그 캡처도 지웠다"로 고쳤다.
  - `테스트 작성 규칙`: 캡처 표를 층에서 빼고 "모양은 테스트하지 않는다. 자동으로 확인하는 층은 지금 없다"로 적었다. 모션 검사와 토큰·자산 생성 확인의 실행 칸은 `CI`에서 `로컬(스킬)`로 고쳤다. 동작 스토리를 조립 파일에 함께 두는 규칙은 이유가 캡처 도구였지만 규칙은 두고, "제목이 같은 스토리가 여럿이면 `Figma` 스토리가 피그마와 짝이다"로 이유를 바꿨다.
  - `남은 작업`: 지시에서 "6번"이라 한 캡처 표 빼기 항목은 이 문서에서 5번이어서 5번을 지우고 뒤 번호를 당겼다(코드 전용 컴포넌트 5, 피그마 마무리 6, 내보내기와 코드 7). 문서 안 번호 참조 둘(`6번 뒤에`, `7번을 내보내`)을 맞췄다. "피그마 흐름은 먼저 논의한다"는 한 줄은 피그마 항목들 앞인 `개요`에 두었다.
  - `미결 사항`: `화면 단위 시각 검증`의 "화면 단위 캡처 표" 후보를 "화면 단위 시각 비교"로 고쳤다. 피그마 흐름 논의 한 줄은 같은 섹션 끝에 두었다.
  - `한계`: 캡처 표를 영향의 근거로 적은 세 곳(그림 비교 불가, 글자 기준선, HUG 글자 폭 올림)은 "사람이 모습을 비교할 때 이 한계로 보고 넘긴다"로 뜻을 유지하며 고쳤다. 차이 그림에 밝은 선이 나온다는 구체 문장과 재질 흐림이 표로 확인되지 않는다는 문장은 도구가 없어져 지웠다. 이 고침이 한계의 뜻을 바꾸지 않는지 검토가 필요하다.
  - 스킬: `figma-component-pr`의 캡처 단계(6)는 "자동으로 확인하는 장치는 지금 없다. 플러그인이 내보낸 PNG를 보고 구현하고 `Figma` 스토리를 맞춘다"로 바꾸고, 보고의 "캡처 표에서 사람이 볼 곳"은 "사람이 볼 곳"으로 바꾸었다. 7번의 "캡처 도구나" 문구는 지웠다. `figma-token-pr`의 보고 항목(캡처 범위·캡처 표)은 지웠다.
  - 플러그인: PR 본문(컴포넌트·조립)은 "모습 비교를 자동으로 확인하는 장치는 지금 없다"로, 모션 PR은 "스킬이 로컬에서 모션 검사를 돌려 비교한다"로 고쳤다. 주석 세 곳(`캡처 표로 지킨다`, `캡처 표의 차이로 드러난다`, `CI가 다시 만든 것과 같다`)과 `export-manifest.ts` 머리 주석의 캡처 도구 설명도 사실에 맞게 고쳤다.
  - 앱·패키지의 스토리와 모션 코드 주석: 지운 도구의 동작을 설명하거나 지운 섹션을 가리키던 주석(`캡처 도구가 마우스로 재현한다` 등 35개 파일과 `@codocs [[피그마 연동:캡처 표]]`·`[[피그마 연동:캡처 범위]]`)은 문장을 지우거나 고쳤고, 주석만 바뀌었지만 `.changeset/remove-figma-capture-comments.md`를 넣었다. "캡처 대상", "캡처가 1px 밀리므로 정수 위치에 둔다"처럼 `Figma` 스토리를 그리는 이유로 쓴 일반 표현은 `Figma` 스토리를 둘지 정하는 논의의 결과에 따라 달라져서 남겼다.
