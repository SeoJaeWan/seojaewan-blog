_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.
피그마 캡처 삭제(2026-11-11): |
  피그마 그림과 코드 그림을 픽셀로 비교하는 캡처를 지우면서([[피그마 연동:검토한 대안]]) 사람에게 묻지 않고 정한 것이다.
  - `tools/figma-parity`: 사전 조사에서 함께 쓴다고 본 `variant-name.ts`는 import를 확인하니 캡처 쪽 함수(`storyTarget`, `findStoryId`)만 쓰고 있어 죽은 코드가 되므로 파일째 지웠다. `story-target.ts`에는 모션 검사가 쓰는 `storyEntries`와 `IndexEntry`만 남기고, 테스트는 `storyEntries` 테스트로 바꿨다(`story-target.fixture.ts`는 지움).
  - `pr-comment.ts`: 캡처 표 댓글 코드와 `COMMENT_MARKER`(`figma-parity`)를 지우고 `paginate`·`marker`·`markerIndex`·`escapeMarkdown`만 남겼다. 기본 숨은 표시 이름이 캡처 댓글이어서 `marker`·`markerIndex`의 `name`은 필수 인자로 바꿨다. 테스트는 `paginate`와 숨은 표시 테스트로 바꿨다.
  - `paths.ts`: 캡처만 쓰던 상수를 지우고, 파일 안에서만 쓰는 상수는 `export`를 뺐다. `capture-viewport.ts`와 `defaultResultsDir`(`parity-results/`)는 모션 검사가 써서 남겼다. `.gitignore`·`.prettierignore`·`.dockerignore`의 `parity-results/`도 모션 결과가 쓰므로 그대로 두었다.
  - `motion-scope.ts`의 `MOTION_CHECK_WORKFLOW_FILE`(`motion-check.yml`)과 "워크플로 파일이 바뀌면 전체 검사" 분기, 그 테스트 경우는 PR #936이 워크플로를 지워 죽은 코드가 되므로 지웠다. 나머지 범위 판정은 그대로다.
  - `repository-structure`의 `.fixture` 규칙은 이유였던 캡처 범위가 없어졌지만, `.fixture` 파일을 모션 검사 범위가 그리지 않는 파일로 건너뛰는 이유가 코드(`motion-scope.ts`)에 있어 이유를 모션 검사 범위로 바꿨다.
  - `figma-sync`의 `CI` 섹션은 지시한 네 가지만 남겼다. 지우는 섹션에 있던 모션 검사 범위, 모션 검사 PR 댓글 설명, 모션 검사 화면 크기(1600×900)는 사실이 사라지지 않게 `모션` 섹션의 "모션 검사 범위"로 옮기고, 워크플로가 부른다는 문장은 "지금 부르는 워크플로가 없다"로 고쳤다.
  - `figma-sync`의 `스토리 규칙`: 도구가 하던 일(상태 재현, 적용된 args 확인, 웹 폰트 기다리기, 단독 캡처로 비교)을 적은 문장은 지웠다. `data-parity-target`·`data-parity-hover`와 지시 목록에 없는 `data-parity-box`도 같은 처리로 "지금 이 속성을 읽는 도구는 없다"를 적었다. 이 속성들과 `Figma` 스토리를 계속 둘지는 [[피그마 흐름 논의]]가 정한다.
  - `figma-sync`의 `검토한 대안`: 캡처를 지운 결정을 새 항목으로 더하고, 캡처 범위 전제였던 "라벨로 CI를 켜기"는 지웠다. 픽셀 비교 항목 끝 문장은 "사람이 보는 데만 쓰기로 했지만 그 캡처도 지웠다"로 고쳤다.
  - `테스트 작성 규칙`: 캡처 표를 층에서 빼고 "모양은 테스트하지 않는다. 자동으로 확인하는 층은 지금 없다"로 적었다. 모션 검사와 토큰·자산 생성 확인의 실행 칸은 `CI`에서 `로컬(스킬)`로 고쳤다. 동작 스토리를 조립 파일에 함께 두는 규칙은 이유가 캡처 도구였지만 규칙은 두고, "제목이 같은 스토리가 여럿이면 `Figma` 스토리가 피그마와 짝이다"로 이유를 바꿨다.
  - `남은 작업`: 지시에서 "6번"이라 한 캡처 표 빼기 항목은 이 문서에서 5번이어서 5번을 지우고 뒤 번호를 당겼다(코드 전용 컴포넌트 5, 피그마 마무리 6, 내보내기와 코드 7). 문서 안 번호 참조 둘(`6번 뒤에`, `7번을 내보내`)을 맞췄다. "피그마 흐름은 먼저 논의한다"는 한 줄은 피그마 항목들 앞인 `개요`에 두었다.
  - `미결 사항`: `화면 단위 시각 검증`의 "화면 단위 캡처 표" 후보를 "화면 단위 시각 비교"로 고쳤다. 피그마 흐름 논의 한 줄은 같은 섹션 끝에 두었다.
  - `한계`: 캡처 표를 영향의 근거로 적은 세 곳(그림 비교 불가, 글자 기준선, HUG 글자 폭 올림)은 "사람이 모습을 비교할 때 이 한계로 보고 넘긴다"로 뜻을 유지하며 고쳤다. 차이 그림에 밝은 선이 나온다는 구체 문장과 재질 흐림이 표로 확인되지 않는다는 문장은 도구가 없어져 지웠다. 이 고침이 한계의 뜻을 바꾸지 않는지 검토가 필요하다.
  - 스킬: `figma-component-pr`의 캡처 단계(6)는 "자동으로 확인하는 장치는 지금 없다. 플러그인이 내보낸 PNG를 보고 구현하고 `Figma` 스토리를 맞춘다"로 바꾸고, 보고의 "캡처 표에서 사람이 볼 곳"은 "사람이 볼 곳"으로 바꾸었다. 7번의 "캡처 도구나" 문구는 지웠다. `figma-token-pr`의 보고 항목(캡처 범위·캡처 표)은 지웠다.
  - 플러그인: PR 본문(컴포넌트·조립)은 "모습 비교를 자동으로 확인하는 장치는 지금 없다"로, 모션 PR은 "스킬이 로컬에서 모션 검사를 돌려 비교한다"로 고쳤다. 주석 세 곳(`캡처 표로 지킨다`, `캡처 표의 차이로 드러난다`, `CI가 다시 만든 것과 같다`)과 `export-manifest.ts` 머리 주석의 캡처 도구 설명도 사실에 맞게 고쳤다.
  - 앱·패키지의 스토리와 모션 코드 주석: 지운 도구의 동작을 설명하거나 지운 섹션을 가리키던 주석(`캡처 도구가 마우스로 재현한다` 등 35개 파일과 `@codocs 피그마 연동 문서의 `캡처 표``·``캡처 범위``)은 문장을 지우거나 고쳤고, 주석만 바뀌었지만 `.changeset/remove-figma-capture-comments.md`를 넣었다. "캡처 대상", "캡처가 1px 밀리므로 정수 위치에 둔다"처럼 `Figma` 스토리를 그리는 이유로 쓴 일반 표현은 `Figma` 스토리를 둘지 정하는 논의의 결과에 따라 달라져서 남겼다.
글 동기화 웹훅(2026-11-11): |
  글 동기화를 "웹훅으로 시작해 한 실행에서 검사하고 병합"하는 구조로 바꾸면서 스스로 정한 것이다. 사람이 검토해 그대로 둘지 고른다.
  - 토큰: push·PR 만들기·병합을 PAT(`CONTENT_SYNC_TOKEN`)가 아니라 워크플로의 기본 `GITHUB_TOKEN`(`contents: write`, `pull-requests: write`)으로 한다. 병합 뒤 main push와 PR 열림에서 다른 워크플로가 돌지 않는 것이 이 구조에서 맞고(배포는 젠킨스가 main을 직접 본다), PAT로 하면 PR이 열릴 때 Figma·모션 검사 같은 워크플로가 불필요하게 시작하기 때문이다. 이 때문에 사람이 저장소 설정 "Allow GitHub Actions to create and approve pull requests"를 켜야 한다(개인 계정 저장소는 기본이 꺼져 있다). 이 설정이 어려우면 PAT로 되돌릴 수 있다. 같은 이유로 `CONTENT_SYNC_TOKEN` 비밀값은 더는 쓰지 않으므로 사람이 지워도 된다.
  - `scripts/content-sync-pr.sh`는 하위 명령 둘(`close-stale`, `publish`)로 나누고 병합 단계를 이 스크립트에 넣었다. 운영 글 빌드가 두 단계 사이에 들어가야 해서 워크플로 단계로 나눴고, 병합은 push·PR과 같은 토큰을 쓰는 일이라 스크립트에 모았다. `content-sync-merge.yml`·`content-sync-merge.sh`와 `merge-ready` 작업은 지웠다.
  - 병합은 GitHub가 병합 가능 여부를 비동기로 계산하는 짧은 시간에 실패할 수 있어 5초 간격으로 5번 다시 시도한다. 병합하면 동기화 브랜치를 지운다(다음 실행이 고정 이름으로 다시 만든다). 앞선 병합 실패로 PR이 남아 있으면 다음 실행이 재사용하거나(내용이 바뀌었으면 새 커밋으로 갱신해 병합) 내용이 같아졌으면 닫는다.
  - 예약은 하루 한 번 03:43(UTC, 한국 시간 12:43)이다. 정각을 피하고 시간은 임의로 골랐다.
  - 이벤트 이름(`repository_dispatch`의 event type)은 `notion-content-changed`다. Worker 변수 `DISPATCH_EVENT_TYPE`과 워크플로의 `types`가 같아야 한다.
  - 워크플로는 `pnpm install --frozen-lockfile`로 전체를 설치하고 `actions/setup-node`의 `cache: pnpm`을 쓴다(`ci.yml`의 `verify` 작업과 같다). 운영 글 빌드가 `pnpm build` 전체라 일부만 설치할 수 없다. 작업 제한 시간은 30분으로 정했다.
  - 알림은 실패 단계에 따라 제목을 나눴다(글 빌드 실패인지, 그 밖의 실패인지). `ALERT_URL`은 저장소 변수 `vars.ALERT_URL`이고, `ALERT_SECRET`이 없어도 동기화는 돌고 알림만 건너뛴다. 그래서 `Check secrets` 단계는 `NOTION_TOKEN`만 확인한다.
  - Worker(`tools/notion-webhook`)는 어느 데이터베이스의 페이지인지 가리지 않고 페이지 이벤트 여섯 개(`page.created`, `page.content_updated`, `page.properties_updated`, `page.deleted`, `page.undeleted`, `page.moved`)에 시작한다. Notion 문서에 데이터베이스 행의 `data.parent` 모양이 없어 확인하지 못했고, 글이 아닌 페이지로 시작해도 내보내기 결과가 같으면 끝나기 때문이다. `page.locked`·`page.unlocked`와 데이터 소스·데이터베이스 이벤트는 글 내용이 바뀌지 않아 뺐다.
  - Worker는 본문에 `verification_token`이 있으면 서명 없이 토큰을 로그에 남기고 200으로 답한다. 확인 요청에 서명이 붙는지 문서에 없어서 서명 유무와 관계없이 이 모양이면 확인 요청으로 본다. 이 요청으로는 아무것도 시작하지 않는다. 비밀 값이 없거나 GitHub 호출이 실패하면 5xx로 답해 Notion의 재시도를 받는다.
  - Worker 비밀 값 이름은 `GITHUB_DISPATCH_TOKEN`, `NOTION_VERIFICATION_TOKEN`이다. GitHub API 버전 헤더는 안정 버전 `2022-11-28`을 썼다(문서 예시는 더 새 버전이지만 이 요청에는 차이가 없다). `client_payload`에는 Notion 이벤트 종류와 id만 싣는다(GitHub 실행 기록에서 시작 원인을 보려는 것).
  - 서명 비교는 `crypto.subtle.verify`에 맡긴다. 상수 시간 비교이고 새 의존성이 없다. Notion의 `@notionhq/client`가 서명 확인 함수를 주지만 Worker에 SDK를 넣지 않으려고 쓰지 않았다([[콘텐츠 원천:검토한 대안]]의 `fetch` 원칙과 같다).
  - wrangler는 의존성으로 넣지 않고 README에서 `pnpm dlx wrangler ...`로 안내한다. 새 패키지는 `@types/node`(다른 `tools/*`와 같은 버전)뿐이다. `@seojaewan/notion-webhook`을 `.changeset/config.json`의 `ignore`에 더했고, ESLint에서는 Worker의 default export(`fetch`)를 허용하는 파일로 `tools/notion-webhook/src/worker.ts`를 `defaultExportFiles`에 더했다. 환경 변수 이름이 SCREAMING_CASE라 `Env` 타입은 `Record<'이름', string>`으로 썼다.
  - 고치지 않고 남긴 것: 이번 PR이 건드리지 않는 파일(`git-workflow.yaml`의 `Content sync merge` 서술, `deployment.yaml` `CI` 섹션의 self-hosted·`content-sync-merge.yml` 서술)과 지난 논의 문서(`discussions/2026-11-06/content-as-json.yaml`, `planning/implementation-order.yaml`의 `CONTENT_SYNC_TOKEN` 기록)는 그대로 두었다.
CI 구조 개편(2026-11-11): |
  `ci/restructure-workflows` PR에서 스스로 정한 것이다. 정한 결정은 [[Git 작업 규칙:CI]], [[배포 환경:CI]], [[테스트 작성 규칙:E2E]]에 반영했다.

  워크플로 구조
  - `ci.yml` 맨 앞에 `Scope` 작업을 더했다. 돌지 않는 브랜치 판정을 스크립트(`scripts/ci-scope.mjs`)로 하고 단위 시험하려면 작업이 하나 필요하다. `Changeset`과 네 작업이 이 결과를 본다. 의존성 없는 스크립트라 러너에 깔린 Node로 돌리고 setup-node를 쓰지 않는다.
  - `main` push 판정: 병합 커밋 제목 `Merge pull request #N from <owner>/<branch>`에서 소유자 뒤 첫 `/` 다음을 브랜치로 읽는다(`git log`로 실제 꼴 확인). 제목이 이 꼴이 아니면 돈다.
  - 작업 이름: `Scope`, `Changeset`, `Static checks`(포맷·lint·타입), `Test`, `Build`, `E2E`, `Publish report`. `branch-name.yml`의 작업 이름은 `Branch name` 그대로 두었다.
  - 네 작업의 조건은 `!cancelled() && Scope가 true && Changeset이 success 또는 skipped`다. `main` push에서 건너뛴 `Changeset` 때문에 뒤 작업까지 건너뛰지 않게 하려는 것이다.
  - `Changeset` 작업은 루트 의존성만 설치하고(`--filter seojaewan-blog`) pnpm 캐시를 쓰지 않는다(`Branch name`과 같은 이유).
  - `docs/` 파일 검사는 `Branch name` 작업 안의 단계(`Docs branch files`)로 두었다. PR의 병합 커밋(`HEAD`)과 첫 부모(`HEAD^1`, 기준 브랜치)를 `git diff --no-renames`로 비교한다(`fetch-depth: 2`). 이름 변경은 옛 경로와 새 경로가 모두 나온다.
  - E2E 리포터는 명령 인자(`--reporter=github,html,json`)로 설정의 리포터(github, html)에 JSON을 더했다. JSON 경로는 `PLAYWRIGHT_JSON_OUTPUT_NAME`, html 보고서는 `PLAYWRIGHT_HTML_OPEN=never`로 연다. `turbo.json`의 `PLAYWRIGHT_*` 통과로 넘어간다. `apps/web` 설정은 바꾸지 않았다.
  - PR의 E2E는 `--trace on`을 주지 않는다. CI 설정이 `retries: 2`, `trace: 'on-first-retry'`라 실패한 케이스는 다시 돌 때 trace가 남는다. 실패 보고서는 그 trace를 담는다.
  - E2E 결과(JSON)가 없으면(fixture 빌드 실패 등) 보고서를 만들지 않고 올리지도 않는다. PR이 이 경우면 이전 실패 폴더도 그대로 둔다.

  캐시
  - Playwright 준비는 `Test`와 `E2E`가 함께 쓰므로 복합 액션(`.github/actions/setup-playwright`)으로 묶었다. 키는 `playwright-<OS>-<Playwright 버전>`이고 버전은 `playwright --version`에서 읽는다.
  - turbo 캐시는 turbo를 쓰는 작업(`Static checks`의 타입 검사, `Build`, `E2E`의 fixture 빌드)에만 둔다. `Test`는 vitest를 바로 돌려 turbo를 쓰지 않는다. 키는 작업마다 나눴다(`turbo-<작업>-<커밋>`). 나란히 도는 작업이 같은 키를 다투지 않게 하려는 것이다.
  - turbo 2.11의 캐시 폴더는 저장소 루트의 `.turbo/cache`다. 로컬에서 확인했다. git worktree에서는 본 저장소의 `.turbo/cache`에 쓴다(worktree 루트에는 생기지 않는다). CI는 일반 체크아웃이라 `.turbo/cache`가 맞다.
  - 새로 쓴 액션 버전: `actions/cache@v6.1.0`, `actions/download-artifact@v8.0.2`(2026-11-11 `gh api .../releases/latest`로 확인).

  보고서 게시
  - 게시는 `E2E` 뒤의 따로 된 작업 `Publish report`가 한다. 작업 단위로만 줄(`concurrency`)을 세울 수 있어 E2E와 나눴다. 보고서는 아티팩트(`scenario-cases-report`, 1일 보관)로 넘긴다.
  - GitHub의 `concurrency`는 기다리는 실행을 하나만 둔다. 게시가 셋 이상 겹치면 먼저 기다리던 게시가 취소된다(그 PR의 실패 보고서가 올라가지 않고 작업이 취소로 끝난다). 그래서 줄과 함께 `--force-with-lease`로 올리고, 거절되면 브랜치를 다시 받아 처음부터 한다(최대 5번). 이 덕에 줄이 없어도 다른 폴더를 지우지 않는다.
  - 알고 두는 한계: 게시가 셋 이상 겹쳐 대기하던 게시가 취소되는 경우는 드물고 다음 push에서 다시 올라가므로 그대로 둔다(2026-11-11 정함).
  - 브랜치는 `git commit-tree`로 부모 없는 커밋을 만들어 바꾼다(작성자 `github-actions[bot]`). 체크아웃이 남긴 자격 증명으로 올린다.
  - peaceiris/actions-gh-pages 같은 게시 액션은 쓰지 않았다. 부모 없는 커밋(`force_orphan`)과 다른 폴더 남기기를 함께 쓰는 것, 다른 실행이 먼저 올렸을 때 다시 하기, 7일 지난 폴더 지우기를 이 저장소 규칙대로 하려면 어차피 스크립트가 필요하다.
  - 사이트 루트에 `.nojekyll`을 둔다. trace 파일 이름이 `_`로 시작해(`_boot-on-load_1_.zip`) Jekyll이 빼 버리기 때문이다.
  - 실행 기록은 `E2E` 작업이 GitHub API로 `gh-pages`의 `history.json`을 받아 읽는다. 게시 작업에서 보고서를 다시 만들지 않으려는 것이다.
  - 통과한 PR은 GitHub API로 `failures/pr-<번호>`가 있는지 먼저 보고, 있을 때만 브랜치를 받아 지운다. 통과할 때마다 113MB를 받지 않으려는 것이다.
  - 실패 폴더의 올린 때는 폴더 안 `published.json`(`{ pr, publishedAt }`)에 적는다. 이 파일을 읽지 못한 폴더도 7일 지난 것으로 보고 지운다.
  - 실행 요약에는 PR 실패 보고서 주소와 함께 `main` 보고서 주소도 적는다.

  보고서 도구(`tools/scenario-cases`)
  - `build:report`에 `--only-failed`, `--pr`, `--no-history`, `--trace-viewer`를 더했다. 설정은 `table.json`의 `report`(`traceViewer`, `isFailedOnly`, `pr`)로 화면에 넘긴다.
  - "실패한 케이스만 담는" 보고서는 trace만 실패한 케이스의 것을 담고, 표와 통과·실패 수는 모든 케이스로 둔다. 통과율이 0%로 잘못 보이지 않게 하려는 것이다. 화면은 "실패만" 거르기를 켜고 열고, 제목에 PR 번호(PR 링크)와 `main` 보고서 링크를 보인다.
  - Trace Viewer를 복사한 까닭을 적은 주석(Access 때문에 외부 뷰어를 못 쓴다)은 Access가 없어져 "보고서를 만든 Playwright와 같은 버전의 뷰어로 같은 사이트에서 연다"로 바꿨다.

  그 밖
  - `scripts/check-changeset.mjs`는 Windows에서 `pnpm`을 부르도록 `shell: process.platform === 'win32'`를 더했다(로컬 시험용, CI 동작은 같다). `ci.yml`이 돌지 않는 글 동기화·버전 PR의 예외도 스크립트에 남겼다(결정대로).
  - `turbo.json`의 `test:e2e`에서 `E2E_PORT`를 뺐다. `apps/web/playwright.config.ts`는 `E2E_PORT` 읽기를 그대로 두고 주석만 "Playwright를 바로 실행할 때 쓴다, turbo는 넘기지 않는다"로 고쳤다. `webServer`의 포트 충돌 주석도 미니 PC 얘기를 뺐다. 이 때문에 `@seojaewan/web` patch changeset을 넣었다.
  - [[Git 작업 규칙:CI]]에서 ruleset·GitHub Pro 대안, 최신 `main` 재검사(strict) 줄을 지웠다. ruleset을 쓰지 않으므로 맞지 않게 됐다.
