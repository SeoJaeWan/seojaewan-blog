  - 다시 들어올 때 없어진 폴더는 목록에서 뺀다(Start 고정의 정리와 같은 `cleanReferences`). 휴지통에 든 폴더는 목록에 남기고 보일 때만 숨긴다.
  - 끌어 놓은 자리에 고정하는 것(자리 인자)은 끌기 PR에서 더한다. 이번에는 맨 뒤 고정만 두었다.
  - 컴포넌트 PR(#880, #883, #891, #873, #890, #889, #888, #887): 앞 PR의 코드가 필요한 PR은 그 브랜치를 병합해 쌓고 앞 PR부터 병합했다(#889는 #890 위, #887은 #888 위). CI를 모두 통과한 PR은 파일 탐색기 세션이 병합했다.
  - `ExplorerStatusBar`의 `view` 값 이름은 앱의 `ExplorerViewMode`(`large`, `medium`, `details`)와 같게 했다. 큰 아이콘 버튼 아이콘은 검수 문서 후보(`square`)가 아니라 export의 `laptop`을 따랐다.
  - `DropDownButton`의 `hasIcon`·`icon`은 export에 위치 정보가 없어 `Button`과 같게 글자 앞, 기본 `add` 아이콘으로 했다.
  - `BreadcrumbChevron`의 열림은 `aria-expanded`를 CSS로 읽지 않고 `isOpen` prop으로 받는다. 열린 동안 hover 바탕은 덧씌우지 않는다(피그마에 Open+Hover가 없음). `BreadcrumbItem`의 메뉴 연결은 `BrowserToolbar`의 `renderMenuButton` 방식(`renderSeparator`)을 따랐다.
