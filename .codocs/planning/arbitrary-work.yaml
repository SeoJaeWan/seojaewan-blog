개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  2026-10-25에 시작한 모션 남은 작업(애니메이션 PR → 조립 PR → 모션 클래스 붙이기)에서 생긴 것부터 적는다.
애니메이션 PR: |
  #180~#189, 모두 병합했다.

  | PR | 정한 것 |
  |---|---|
  | #180 최소화 | 도착 위치 실행 중 값 변수 이름을 `--motion-window-taskbar-offset-x`·`-y`로 지었다. 복원도 같은 변수를 쓴다 |
  | #181 복원 | 최소화와 같은 변수를 출발 위치로 쓴다 |
  | #182 스냅 | 실행 중 값 변수는 `--motion-window-snap-from-x`·`-y`·`-from-scale-x`·`-from-scale-y`다. `transform-origin`을 기본값(가운데)으로 두어, 앱의 FLIP 계산은 가운데 기준으로 해야 한다 |
  | #183·#184 패널 | 견본의 720(패널 높이)을 px 대신 `translate: 0 100%`(요소 자기 높이)로 옮겼다. 실제 패널 높이가 달라도 화면 밖으로 빠지게 하려고 |
  | #186·#187 재부팅 화면 | json의 Arc 트랙(회전·트림)은 ProgressRing에 이미 붙은 `motion-progress-ring`과 같아 새로 만들지 않았다. 스토리는 1280x720 BootScreen을 `scale-50`으로 줄여 그린다 |
  | #188·#189 글자 목록 | 목록 페이드를 같은 클래스에 두었다. 클래스는 격자·목록을 감싼 요소에 붙이고, 앱이 격자에 `data-jump-list="grid"`, 목록에 `data-jump-list="list"`를 단다. 스토리는 `TileGrid`+`JumpListLetter`와 `ListItem` 자리표시로 구성했다 |
  | 공통 | 피그마 견본과 모션 스토리를 느리게 보기로 나란히 보는 확인(스킬 8단계)은 하지 않았다. 시간·이징은 모션 시간 검사로만 확인했다 |
조립 PR: |
  처리 순서는 쓰이는 쪽부터다: explorer → chrome → menu → search → start → window → taskbar → desktop(조립끼리 인스턴스로 쓰는 관계를 피그마에서 조사해 정함).

