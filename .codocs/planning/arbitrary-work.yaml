  - 저장은 Start 고정과 같은 작업 공간 저장분(`seojaewan-blog:workspace`)에 넣고, 저장 모양이 바뀌어 저장 버전을 3에서 4로 올렸다(버전 주석의 "모양을 바꾸면 올린다" 규칙). 그래서 이전 버전의 저장분은 한 번 초기 구조로 돌아간다.
