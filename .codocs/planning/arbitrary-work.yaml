_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.
글 동기화 웹훅(2026-11-11): |
  글 동기화를 "웹훅으로 시작해 한 실행에서 검사하고 병합"하는 구조로 바꾸면서 스스로 정한 것이다. 사람이 검토해 그대로 둘지 고른다.
  - 토큰: push·PR 만들기·병합을 PAT(`CONTENT_SYNC_TOKEN`)가 아니라 워크플로의 기본 `GITHUB_TOKEN`(`contents: write`, `pull-requests: write`)으로 한다. 병합 뒤 main push와 PR 열림에서 다른 워크플로가 돌지 않는 것이 이 구조에서 맞고(배포는 젠킨스가 main을 직접 본다), PAT로 하면 PR이 열릴 때 Figma·모션 검사 같은 워크플로가 불필요하게 시작하기 때문이다. 이 때문에 사람이 저장소 설정 "Allow GitHub Actions to create and approve pull requests"를 켜야 한다(개인 계정 저장소는 기본이 꺼져 있다). 이 설정이 어려우면 PAT로 되돌릴 수 있다. 같은 이유로 `CONTENT_SYNC_TOKEN` 비밀값은 더는 쓰지 않으므로 사람이 지워도 된다.
  - `scripts/content-sync-pr.sh`는 하위 명령 둘(`close-stale`, `publish`)로 나누고 병합 단계를 이 스크립트에 넣었다. 운영 글 빌드가 두 단계 사이에 들어가야 해서 워크플로 단계로 나눴고, 병합은 push·PR과 같은 토큰을 쓰는 일이라 스크립트에 모았다. `content-sync-merge.yml`·`content-sync-merge.sh`와 `merge-ready` 작업은 지웠다.
  - 병합은 GitHub가 병합 가능 여부를 비동기로 계산하는 짧은 시간에 실패할 수 있어 5초 간격으로 5번 다시 시도한다. 병합하면 동기화 브랜치를 지운다(다음 실행이 고정 이름으로 다시 만든다). 앞선 병합 실패로 PR이 남아 있으면 다음 실행이 재사용하거나(내용이 바뀌었으면 새 커밋으로 갱신해 병합) 내용이 같아졌으면 닫는다.
  - 예약은 하루 한 번 03:43(UTC, 한국 시간 12:43)이다. 정각을 피하고 시간은 임의로 골랐다.
  - 이벤트 이름(`repository_dispatch`의 event type)은 `notion-content-changed`다. Worker 변수 `DISPATCH_EVENT_TYPE`과 워크플로의 `types`가 같아야 한다.
  - 워크플로는 `pnpm install --frozen-lockfile`로 전체를 설치하고 `actions/setup-node`의 `cache: pnpm`을 쓴다(`ci.yml`의 `verify` 작업과 같다). 운영 글 빌드가 `pnpm build` 전체라 일부만 설치할 수 없다. 작업 제한 시간은 30분으로 정했다.
  - 알림은 실패 단계에 따라 제목을 나눴다(글 빌드 실패인지, 그 밖의 실패인지). `ALERT_URL`은 저장소 변수 `vars.ALERT_URL`이고, `ALERT_SECRET`이 없어도 동기화는 돌고 알림만 건너뛴다. 그래서 `Check secrets` 단계는 `NOTION_TOKEN`만 확인한다.
  - Worker(`tools/notion-webhook`)는 어느 데이터베이스의 페이지인지 가리지 않고 페이지 이벤트 여섯 개(`page.created`, `page.content_updated`, `page.properties_updated`, `page.deleted`, `page.undeleted`, `page.moved`)에 시작한다. Notion 문서에 데이터베이스 행의 `data.parent` 모양이 없어 확인하지 못했고, 글이 아닌 페이지로 시작해도 내보내기 결과가 같으면 끝나기 때문이다. `page.locked`·`page.unlocked`와 데이터 소스·데이터베이스 이벤트는 글 내용이 바뀌지 않아 뺐다.
  - Worker는 본문에 `verification_token`이 있으면 서명 없이 토큰을 로그에 남기고 200으로 답한다. 확인 요청에 서명이 붙는지 문서에 없어서 서명 유무와 관계없이 이 모양이면 확인 요청으로 본다. 이 요청으로는 아무것도 시작하지 않는다. 비밀 값이 없거나 GitHub 호출이 실패하면 5xx로 답해 Notion의 재시도를 받는다.
  - Worker 비밀 값 이름은 `GITHUB_DISPATCH_TOKEN`, `NOTION_VERIFICATION_TOKEN`이다. GitHub API 버전 헤더는 안정 버전 `2022-11-28`을 썼다(문서 예시는 더 새 버전이지만 이 요청에는 차이가 없다). `client_payload`에는 Notion 이벤트 종류와 id만 싣는다(GitHub 실행 기록에서 시작 원인을 보려는 것).
  - 서명 비교는 `crypto.subtle.verify`에 맡긴다. 상수 시간 비교이고 새 의존성이 없다. Notion의 `@notionhq/client`가 서명 확인 함수를 주지만 Worker에 SDK를 넣지 않으려고 쓰지 않았다([[콘텐츠 원천:검토한 대안]]의 `fetch` 원칙과 같다).
  - wrangler는 의존성으로 넣지 않고 README에서 `pnpm dlx wrangler ...`로 안내한다. 새 패키지는 `@types/node`(다른 `tools/*`와 같은 버전)뿐이다. `@seojaewan/notion-webhook`을 `.changeset/config.json`의 `ignore`에 더했고, ESLint에서는 Worker의 default export(`fetch`)를 허용하는 파일로 `tools/notion-webhook/src/worker.ts`를 `defaultExportFiles`에 더했다. 환경 변수 이름이 SCREAMING_CASE라 `Env` 타입은 `Record<'이름', string>`으로 썼다.
  - 고치지 않고 남긴 것: 이번 PR이 건드리지 않는 파일(`git-workflow.yaml`의 `Content sync merge` 서술, `deployment.yaml` `CI` 섹션의 self-hosted·`content-sync-merge.yml` 서술)과 지난 논의 문서(`discussions/2026-11-06/content-as-json.yaml`, `planning/implementation-order.yaml`의 `CONTENT_SYNC_TOKEN` 기록)는 그대로 두었다.
