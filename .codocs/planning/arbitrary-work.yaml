  - 주소창 `×`는 누를 때 포커스를 가져가지 않고 Tab으로 닿지 않는다(`tabIndex={-1}`). 입력칸이 포커스를 잃으면 편집이 끝나기 때문이다. 값을 `value`로 정하는 앱은 `onClear`에서 직접 비운다.
  - 탭 기록 칸은 따로 배열을 두지 않고 `history`를 `{ location, selection? }` 배열로 바꿨다. 탭을 바꾸거나 새 탭을 열 때도 지금 칸에 선택을 적어 돌아오면 되살린다.
