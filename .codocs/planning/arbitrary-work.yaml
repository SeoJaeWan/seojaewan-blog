_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  2026-10-26 작업과 2026-10-28 작업에서 생긴 아래 항목이 검토를 기다린다. 이어서 할 일은 [[남은 작업]]에 있다.
2026-10-26 작업: |
  | 영역 | 정한 것 |
  |---|---|
  | 코드 구조 | `desktop`을 `DesktopWallpaper`·`DesktopIcons`로 나눴다(배경화면은 작업 표시줄 뒤까지 깔려 한 덩어리면 DOM이 바뀜) |
  | 코드 구조 | 메뉴 스토리는 메뉴마다 `components/menu-<이름>/`, `ViewOptions` 메뉴는 Start "보기:" 메뉴라 `start-menu`로 |
  | lint | 순환 import 검사는 `shared`에만 건다(앱 전체면 lint 시간 +22%). `import type`만의 순환은 검사하지 않는다 |
  | 검사 도구 | 브랜치 이름 검사에서 `renovate/…`는 예외(Renovate PR이 막히지 않게) |
  | 검사 도구 | 모션 값 검사 허용 오차: 투명도·배율·트림 0.001, 이동 0.5px, 회전 0.5° |
  | 자산 | WebP 품질 80(배경화면 PSNR 42.8dB, 1:1 비교에서 차이가 보이지 않음) |
  | 피그마 | 새 이름 `color/search-gradient/cyan`·`blue`, 칠 스타일 `Icon Color/Search Focus` |
  | 피그마 | 변형 `View=Default`/`View=Recycle bin`, `Folder=Recycle Bin`(기존 `Location=Recycle Bin` 표기). 휴지통 창은 데스크톱 변형만(모바일은 Blog에만 있는 관례) |
  | 피그마 | 모션 견본 설명은 자산 `icon-color/Search Focus`의 description에 적음 |
  | 피그마 | `MessageBox`를 새 조립 영역으로 만듦 |
  | 디자인 시스템 | `BrowserTabStrip` 탭 사이 간격 없음(피그마에 정보가 없음) |
2026-10-28 작업: |
  | 영역 | 정한 것 |
  |---|---|
  | 다시 시작 | 다시 시작 단계(`idle`이 아닌 동안) 바탕화면 하위 트리를 `inert`로 둔다. 끝나면 포커스를 바탕화면 `main`(`tabIndex=-1`, 포커스 고리 없음)으로 옮긴다 |
  | Start·검색 패널 | 패널 최대 높이는 작업 영역 높이에서 틈을 뺀 값이다. 틈은 데스크톱 12px, 모바일은 패널이 작업 표시줄에 붙어 0이다. 인라인 `maxHeight`로 준다 |
  | Start·검색 패널 | 본문 스크롤은 디자인 시스템 `ScrollArea`를 쓴다. 스크롤 영역을 안쪽 여백(데스크톱 24, 모바일 12)만큼 오른쪽으로 넓히고 내용에 같은 여백을 줘, 피그마처럼 스크롤바가 본문 오른쪽 바깥에 놓이고 내용 너비는 그대로다. 피그마의 스크롤바가 검색 입력칸 옆까지 올라가는 길이는 따르지 않고 본문 높이에서 끝난다 |
  | Start 목록 | 모두 목록의 줄은 `role="button"`, `tabIndex=0`이고 클릭·Enter·Space로 연다. 같은 항목이 고정됨 칸과 목록에 모두 있어 같은 이름의 버튼이 둘로 잡힌다. 버튼 역할에 맞지 않는 `aria-selected`는 `ListItem`이 붙이는 값을 `undefined`로 덮어 뺀다 |
  | 디자인 시스템 | `ListItem`의 `aria-selected`를 `{...divProps}` 앞에 두어 쓰는 쪽이 덮을 수 있게 했다. 기본(`selected`에 따른 `true`·`false`)은 그대로다 |
  | 창 위치 | 화면 크기가 바뀌면 창 전체(제목 표시줄 포함)가 작업 영역 안에 들어오도록 가장 가까운 자리로 옮기고, 작업 영역보다 크면 작업 영역에 맞게 줄인다. 최대화·스냅한 창도 떠 있을 때의 자리(`bounds`)를 같이 보정한다(이전 크기로 복원할 때 밖으로 나가지 않게). 최소 크기는 보지 않는다 |
  | 창 미리보기 | 클릭으로 연 목록도 마우스가 나가면 300ms 뒤 닫힌다(터치는 올리는 동작이 없어 그대로). 마우스를 올려 연 목록을 누르면 닫지 않고 클릭으로 연 것으로 바꾼다. 다른 앱 버튼으로 옮기면 그 버튼의 400ms 뒤에 바뀌고, 그동안 앞의 목록은 둔다 |
  | 창 미리보기 | 목록이 떠 있는 동안 앱 버튼을 `Hover` 모양으로 그린다(클릭으로 연 목록도 같다). 디자인 시스템은 바꾸지 않고, `SnapLayoutMenu`처럼 앱(`TaskbarAppPreview`)이 열림 표시를 달아 그 변형 클래스로 그린다. `aria-expanded`는 버튼 동작이 없는 조립(스토리)에는 달리지 않아 `data-preview-open`을 따로 쓴다. 그래서 [[피그마 연동:스토리 규칙]]의 "강제 상태 prop을 만들지 않는다"와 어긋나지 않고, `Taskbar/AppPreview`의 Open 캡처는 버튼이 `Hover` 모양이다 |
  | 모바일 미리보기 | 목록 판 너비는 카드를 원래 너비(208)로 놓은 너비와 화면 폭에서 좌우 12px을 뺀 폭 중 작은 쪽이고, 카드는 같은 너비로 줄어든다. 카드 안 축소 화면 자리는 카드 너비에서 안쪽 여백 8씩을 뺀 너비, 높이는 108 그대로다. 목록은 작업 표시줄(가까운 위치 기준 조상)을 기준으로 가운데에 띄운다 |
  | 창 끌기 | 제목 표시줄은 누른 뒤 4px 이상 움직여야 끌기를 시작한다(클릭·더블클릭과 구분). 마우스 왼쪽 버튼과 펜만 받고 터치는 받지 않는다. 누를 때 기본 동작을 막아 글자 선택이 시작되지 않게 한다(클릭·더블클릭은 그대로 일어난다) |
  | 창 끌기 | 끄는 동안의 자리는 저장소에 두지 않고 창 요소의 인라인 스타일에 바로 그리며, 놓을 때 저장소에 반영한다. 저장소의 `interaction`은 끌기를 시작할 때(4px을 넘었을 때)와 놓을 때만 바뀐다 |
  | 창 크기 조절 | 핸들은 가장자리마다 창 밖 8px 띠, 모서리마다 창 모서리에 걸친 16px 칸(창 안으로 8px 들어옴)이다. 커서는 방향별 resize 커서다. 핸들은 누르자마자 따라간다(끌기 거리 없음). 이미 최소 크기보다 작은 창(작은 화면에 맞춰 줄인 창)은 그 크기까지만 줄인다 |
  | 화면 밖 | 작업 영역 안에 남기는 제목 표시줄은 가로 200px(창 버튼 셋 138px보다 넓어 버튼이 아닌 잡을 곳이 남는다), 세로 40px(제목 표시줄 높이)이고, 제목 표시줄은 작업 영역 위로 나가지 않는다. 크기 조절도 같은 제한을 지킨다. 화면 크기 변경 보정(`fitBoundsToWorkArea`)은 그대로 창 전체를 안으로 넣는다 |
  | 끌어서 스냅 | 포인터가 작업 영역 왼쪽·오른쪽·위쪽 끝에서 8px 안이면 스냅한다. 왼쪽·오른쪽 끝에서 위·아래 모서리 64px 안이면 그 4분의 1(4분할 칸), 위쪽 끝에서 왼쪽·오른쪽 64px 안이면 위쪽 4분의 1, 나머지 위쪽 끝은 최대화다. 포인터가 작업 영역 밖(작업 표시줄 위, 브라우저 밖)이어도 가까운 끝으로 본다 |
  | 끌어서 스냅 | 미리 보기 판(`SnapPreview`)은 칸 자리를 여백 없이 그대로 채우고, 끄는 창 바로 아래(같은 z-index, DOM 앞)에 움직임 없이 나타나고 사라진다. 끌어서 칸에 스냅해도 스냅 레이아웃처럼 남은 칸이 있으면 Snap Assist를 연다(최대화는 열지 않는다) |
  | 끌어서 스냅 | 끌어서 스냅·최대화해도 떠 있을 때 자리(`bounds`)는 끌기 전 그대로라, 이전 크기로 복원하면 끌기 전 자리로 돌아간다. 놓을 때 FLIP은 끌던 자리에서 시작한다 |
  | 스냅 떼기 | 스냅·최대화한 창은 끌기를 시작하는 순간 떠 있을 때 크기로 떼어, 눌렀던 가로 비율과 위쪽에서의 거리를 지켜 포인터 아래에 놓는다(이 자리가 새 `bounds`). 떼는 순간은 움직임 없이 바로 바뀐다 |
  | 디자인 시스템 | `WindowFrame`에 `onTitleBarPointerDown`을 더했다(창 버튼 위에서 누른 것은 부르지 않는다, 더블클릭과 같은 기준). 생김새는 그대로다 |
  | 테스트 | jsdom에 포인터 붙잡기가 없어 `apps/web/vitest.setup.ts`에 아무것도 붙잡지 않는 `setPointerCapture`·`releasePointerCapture`·`hasPointerCapture`를 둔다 |
  | 코드 구조 | 다시 시작 단계만 갖던 `shared/stores/workspace-store`를 `restart-store`(`useRestartStore`)로 바꾸고, `workspace-store`는 작업 공간(항목 배치·휴지통·방문자별 설정) 저장소로 새로 만들었다. 규칙은 `shared/utils/workspace-rules`, 저장분 검증은 `shared/utils/workspace-storage`다 |
  | 코드 구조 | 외부 링크 설정 파일은 `shared/stores/workspace-store/external-links.ts`에 둔다. `shared/`에는 `data` 종류가 없고, 설정을 읽는 곳이 작업 공간 저장소 하나라 그 대상만 쓰는 부품으로 저장소 폴더에 넣었다 |
  | 코드 구조 | 탐색기·Chrome 창 내용은 각 기능의 층 컴포넌트(`ExplorerWindowLayer`, `ChromeWindowLayer`)가 저장소를 읽어 그리고, 위치 경로·원래 위치·날짜·탭 제목 계산은 그 기능의 `utils`에 둔다. 창 제목도 각 기능이 훅(`useExplorerWindowTitle`, `useChromeWindowTitle`)으로 내보내고, shell은 앱에 맞는 층과 제목 함수를 고르기만 한다 |
  | 항목 id | 글 `post:<slug>`, Notion 폴더 `folder:<경로>`(`React/Hooks`처럼 `/`로 이은 경로), `Blog` 폴더 `blog`, 휴지통 `recycle-bin`, 외부 링크 `link:<설정 id>`, 방문자가 만든 폴더 `crypto.randomUUID()`다. Start 고정 목록에 넣는 앱은 `app:file-explorer`·`app:chrome`이다 |
  | 항목 모델 | 항목마다 상위 폴더 id(바탕화면은 null), 휴지통 기록(원래 상위 폴더·삭제 시각), 날짜(글은 작성일, 방문자 폴더는 만든 시각, Notion 폴더·외부 링크는 없음)를 둔다. 휴지통으로 보내면 상위 폴더 자리에 휴지통 id를 넣고, 하위 항목은 폴더 안에 그대로 둔다 |
  | 저장 | `persist` 열쇠 `seojaewan-blog:workspace`, `version: 1`. 배치만 저장하고 글 제목·작성일과 외부 링크 이름·주소·아이콘은 원본(글 색인, 설정)에서 다시 채운다. 폴더만 이름과 날짜를 저장한다. 저장 범위는 항목 배치·휴지통, 바탕화면 설정(아이콘 크기·자동 정렬·정렬 기준·아이콘 격자 칸 `{ column, row }`), Start 고정 목록·순서와 모두 목록 보기, 작업 표시줄 고정·순서, 탐색기 폴더별 보기·정렬, 최근 연 항목이다 |
  | 저장 | 저장분이 Zod 스키마에 맞지 않거나, JSON이 깨졌거나, 버전이 다르면 초기 구조에서 다시 시작한다. 읽힌 배치의 오류(상위 폴더가 없거나 폴더가 아님, 순환, 휴지통 자리와 기록이 어긋남)는 그 항목을 바탕화면으로 옮겨 고친다. `Blog`가 없으면 바탕화면에 다시 만들고, 휴지통 안에 있으면(휴지통에 보낸 상위 폴더 안에 있어도) 바탕화면으로 꺼낸다. 글·외부 링크 id(`post:`, `link:`)를 차지한 폴더는 버리고, 그 하위 항목은 바탕화면으로 옮긴다 |
  | 수화 | `skipHydration`으로 저장소를 만들 때 저장분을 읽지 않고, Shell이 마운트한 뒤 글 색인을 넘겨 `persist.rehydrate()`로 읽는다. 서버 HTML과 첫 클라이언트 렌더는 글 없이 만든 초기 구조다(바탕화면 항목은 같다) |
  | 처음 값 | 바탕화면은 보통 아이콘, 자동 정렬 켜짐, 이름순이다. Start 모두 목록은 간단히다. 최근 연 항목은 최대 20개를 기억하고 앱·휴지통은 넣지 않는다 |
  | 이동 | 여러 항목 가운데 하나라도 거부되면 아무것도 옮기지 않는다. 휴지통 위로 옮기면 휴지통으로 보낸다. 휴지통 안의 항목은 옮길 수 없고 복원만 된다. 같은 이름 금지는 폴더끼리만 본다(글·외부 링크는 같은 이름이 있어도 된다). 바탕화면을 떠난 항목의 아이콘 칸은 지운다 |
  | 휴지통 | 보낼 항목에 `Blog`, 휴지통, `Blog`를 하위에 둔 폴더가 있으면 모두 거부한다(`protected`). 고른 폴더 안의 고른 항목은 그 폴더와 함께 가므로 따로 보내지 않는다 |
  | 휴지통 | 복원할 자리에 같은 이름의 폴더가 생겼으면 `React (2)`처럼 가장 작은 빈 번호를 붙여 돌려놓는다(Windows는 합칠지 묻는다). 함께 복원하는 폴더가 원래 상위 폴더면 그 폴더를 먼저 복원해 그 안으로 돌려보낸다 |
  | 폴더 이름 | 길이는 UTF-16 단위로 센다. 예약 이름은 첫 `.` 앞부분(끝 공백 제외)을 대소문자 무시로 비교한다. 제어 문자는 문자 코드 0~31이다 |
  | 열기 | 작업 표시줄·Start 앱으로 연 탐색기는 `Blog` 폴더를 본다(새 탭이 `Blog`로 여는 것과 같다). 글을 여는 "가장 최근에 쓴 Chrome 창"은 활성 순서의 가장 뒤(최소화된 창 포함)이고, 그 창을 복원해 맨 앞으로 가져온다 |
  | 창 내용 | 열린 창에 `content`를 둔다. 탐색기는 보고 있는 위치(폴더 id·휴지통 id, 바탕화면 null), Chrome은 탭 목록(새 탭 `{ kind: 'new-tab' }` 또는 글 `{ kind: 'post', slug }`)과 고른 탭 차례다. 탭 id는 아직 두지 않았다 |
  | 탐색기 | 창 제목·탭·위치 칸·검색 안내 글자는 보고 있는 위치 이름이다. 항목은 저장소 차례대로 보통 아이콘으로 그린다(정렬은 탐색기 단계). 휴지통은 자세히 보기이고 원래 위치는 `바탕 화면\Blog`처럼 `\`로 잇고, 삭제한 날짜는 방문자 시간대의 `YYYY-MM-DD`다 |
  | Chrome | 탭 제목은 새 탭이면 "새 탭", 글이면 글 제목이고 창 제목은 고른 탭 기준이다. 새 탭 페이지 최신 글은 휴지통에 없는 글 6개다. 글 화면은 아직 새 탭 페이지 그대로다 |
  | 임시 글 원천 | `content/temporary-posts`에 Notion 속성 모양(title, slug, folder, publishedAt, cover)의 글 10개를 두고 `content/post-schema`(Zod)로 검증해 글 색인으로 바꾼다. `content/post-source`의 `getPostIndex`(`server-only`, async)를 `app/page.tsx`가 읽는다 |
  | 외부 링크 | GitHub와 이력서를 바탕화면에 두고 처음부터 Start에 고정한다. 이력서 주소는 정해지지 않아 임시로 GitHub 프로필 주소를 넣었다 |
  | Start | Start 고정됨·모두 목록은 아직 저장소에 잇지 않았다. 항목 `key`가 제목이라 같은 이름의 글이 겹칠 수 있어 Start·검색 단계에서 id로 바꾸며 잇는다 |
