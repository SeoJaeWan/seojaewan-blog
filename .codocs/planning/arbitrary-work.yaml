  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  2026-10-25에 시작한 모션 남은 작업(애니메이션 PR → 조립 PR → 모션 클래스 붙이기)에서 생긴 것부터 적는다.
문서 변경: |
  | PR | 문서:섹션 | 바꾼 내용 | 이유 |
  |---|---|---|---|
  | #200 | [[구현 순서:7단계 기능 구현]] | "조립은 기능을 구현할 때 영역마다 내보낸다" → "기능을 구현하기 전에 영역마다 먼저 내보내고 … 동작은 그 조립 위에 붙인다" | 실제 순서와 맞춤. 사용자 허락 받음 |
  | #200 | [[저장소 구성:앱 폴더 구조]] | 조립 스토리 데이터는 기능 폴더의 `story-data.ts`에 두고, 여러 기능이 쓰면 `shared/story-data/`로 옮긴다는 규칙 한 줄 추가 | 다음 조립 PR들이 따를 공통 틀이라 문서에 둠 |
애니메이션 PR: |
  #180~#189, 모두 병합했다.

  | PR | 정한 것 |
  |---|---|
  | #180 최소화 | 도착 위치 실행 중 값 변수 이름을 `--motion-window-taskbar-offset-x`·`-y`로 지었다. 복원도 같은 변수를 쓴다 |
  | #181 복원 | 최소화와 같은 변수를 출발 위치로 쓴다 |
  | #182 스냅 | 실행 중 값 변수는 `--motion-window-snap-from-x`·`-y`·`-from-scale-x`·`-from-scale-y`다. `transform-origin`을 기본값(가운데)으로 두어, 앱의 FLIP 계산은 가운데 기준으로 해야 한다 |
  | #183·#184 패널 | 견본의 720(패널 높이)을 px 대신 `translate: 0 100%`(요소 자기 높이)로 옮겼다. 실제 패널 높이가 달라도 화면 밖으로 빠지게 하려고 |
  | #186·#187 재부팅 화면 | json의 Arc 트랙(회전·트림)은 ProgressRing에 이미 붙은 `motion-progress-ring`과 같아 새로 만들지 않았다. 스토리는 1280x720 BootScreen을 `scale-50`으로 줄여 그린다 |
  | #188·#189 글자 목록 | 목록 페이드를 같은 클래스에 두었다. 클래스는 격자·목록을 감싼 요소에 붙이고, 앱이 격자에 `data-jump-list="grid"`, 목록에 `data-jump-list="list"`를 단다. 스토리는 `TileGrid`+`JumpListLetter`와 `ListItem` 자리표시로 구성했다 |
  | 공통 | 피그마 견본과 모션 스토리를 느리게 보기로 나란히 보는 확인(스킬 8단계)은 하지 않았다. 시간·이징은 모션 시간 검사로만 확인했다 |
조립 PR: |
  처리 순서는 쓰이는 쪽부터다: explorer → chrome → menu → search → start → window → taskbar → desktop(조립끼리 인스턴스로 쓰는 관계를 피그마에서 조사해 정함).

  | PR | 정한 것 |
  |---|---|
  | #200 탐색기(병합) | 공통 틀: 조립은 `features/<기능>/<이름>.tsx`, 스토리 제목 `Patterns/<조립 이름>`·export `Parity`, HUG 조립은 `layout: 'padded'`, 스토리 데이터는 `story-data.ts`(`.fixture`를 붙이면 캡처 범위에서 빠져 붙이지 않음) |
  | #200 | 디자인 시스템에 공개 컴포넌트 `ImageAsset`(png 자산)을 더했다. 앱이 디자인 시스템 내부 경로를 import할 수 없어서다. 이름 목록은 손으로 관리하고 테스트가 파일과 대조한다 |
  | #200 | `ExplorerAddressRow` 모바일 검색 아이콘을 피그마 원본대로 16 → 20으로 고쳤다 |
  | #200 | `ExplorerCommands`의 글자 버튼에 `min-w-0`(피그마 인스턴스가 최소 너비 120을 지움). 정렬·보기·새로 만들기는 피그마에서 메뉴를 품지 않은 일반 버튼이라 메뉴는 기능 구현 때 붙인다 |
  | #200 | 캡처 표의 남은 차이: 글자 버튼 너비 소수점 차이(피그마는 정수로 올림)로 1~3px 밀림, 상태 줄 글자 1px(글자 기준선 한계) |
  | #195 Chrome(병합) | `Chrome/Page`는 피그마 변형이 화면 넷(Post, New tab, Search results, Not found) × wide·narrow라, 컴포넌트 하나(`ChromePage`)에 `page`별 props(discriminated union)로 만들었다 |
  | #195 | 글 본문은 `children` 자리로 두고, 스토리에서만 문단·제목·링크·`CodeBlock`으로 피그마와 같은 글을 그린다. `content/`는 만들지 않았다 |
  | #195 | 좁은 창 목차는 접힌 모습(제목만)만 그린다. 펼치기는 기능 구현 때 붙인다. 본문 루트에 `overflow-y-auto`, wide에 `px-16`을 두었다 |
  | #195 | 디자인 시스템 `Toc`의 항목 자리에 피그마와 같은 `flex-col gap-8`을 넣었다(없어서 항목이 붙어 그려졌다) |
  | #195 | 캡처 표의 남은 차이: 한글 제목 가장자리(피그마는 Pretendard 글자 스타일, 코드는 Open Sans 다음 Pretendard 순서), 링크 밑줄 위치·두께(엔진 차이) |
  | #195 | 피그마 검색 결과의 주소가 두 줄 모두 `react-19-hooks`라 그대로 옮겼다(피그마 쪽 오타일 수 있음) |

  확인된 도구 문제(고치지 않음): 캡처 도구(`tools/figma-parity/src/run-capture.ts`의 `designSystemExports()`)가 디자인 시스템 `index.ts`의 `export *`를 읽지 못해, 디자인 시스템 컴포넌트만 바뀐 PR에서 그 컴포넌트를 쓰는 조립이 캡처 범위에 들어가지 않는다.
모션 클래스 붙이기: |
  (진행하며 추가한다)
작업 환경: |
  저장소 밖, 클라우드 컨테이너에서만 바꾼 것이다.

  - Playwright가 Chromium 1248을 찾는데 컨테이너에 1243만 있어 `/opt/pw-browsers`에 1248 이름 링크를 만들었다. 로컬 검사는 1243으로 돌렸고, CI는 따로 통과했다.
  - 커밋 훅이 Node 24를 쓰게 `~/.config/husky/init.sh`에 PATH를 더했다.
  - 권한 요청을 줄이려고 컨테이너의 `~/.claude/settings.json`에 허용 목록을 더했다(저장소에는 넣지 않았다).
