_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.
"#304 토큰 PR: 옛 토큰 이름을 쓰는 코드 고침": |
  `file-item/*/stroke-selected-focus`가 `stroke-focus`로 바뀌어, `file-item.tsx`와 `file-row.tsx`의 `border-file-item-*-stroke-selected-focus` 클래스를 `border-file-item-*-stroke-focus`로 고쳤다. 새 이름이 옛 이름에서 `selected-`만 빠진 것이라 대응이 분명해 사람에게 묻지 않고 정했다. 토큰 이름이 바뀌면 같은 PR에서 코드를 고친다는 [[피그마 연동:PR 흐름]]을 따랐다. 고치기 전 로컬 `pnpm lint`는 이 옛 클래스를 잡지 못하고 통과했다. 문서는 lint가 알려 준다고 하므로([[피그마 연동:PR 흐름]]) 실제 검사와 어긋나는지 따로 확인이 필요하다.
"#304 토큰 PR: cn.ts 토큰 이름 목록에 size 712 추가": |
  새 토큰 `size/712`(`--size-712`)가 생겨 `cn.test.ts`(tokens.css와 이름 목록이 같은지 확인)가 실패했다. 손으로 관리하는 `packages/design-system/src/cn.ts`의 `TOKEN_NAMES.size`에 `'712'`를 정렬 위치에 더했다. 이 목록은 생성 파일이 아니고 코드 주석이 `tokens.css`와 같아야 한다고 정하므로([[피그마 연동:토큰 사용 강제]]) 고치는 것이 맞다고 보았다. 토큰 PR이 이 목록까지 고쳐야 한다는 내용은 [[피그마 연동:PR 흐름]]에 없으므로, 문서에 적을지 검토가 필요하다.
"#281 Bookmark: 링크 아이콘 색을 text-fill-primary로 둠": |
  Bookmark의 `link icon`은 속성 없이 `ic_fluent_link_20_regular` 인스턴스를 16px로 쓰고, 피그마가 칠 변수를 따로 주지 않아 색이 어느 변수인지 MCP 결과로 알 수 없었다. 자산 설명이 "Glyph fill bound to text-fill/primary"라서 `text-text-fill-primary`로 정했고, 로컬 캡처 차이 그림에서 아이콘이 일치함을 확인했다. 글 본문 블록이라 [[Chrome:Notion 블록]]의 "색은 디자인 시스템 토큰"을 따랐다. 아이콘 자리를 속성으로 열지는 않았다. 피그마에 속성이 없고 쓰는 곳마다 바뀌지 않는 기능 아이콘이기 때문이다([[디자인 시스템:아이콘 자리]]).
"#284 CodeBlock: 코드를 children 슬롯으로 받고 Parity는 빈 자리 100을 넣음": |
  CodeBlock의 `code` 문자열 prop을 없애고 강조된 코드를 `children`으로 받게 했다([[남은 작업:1. 7단계 마무리]], [[기술 스택:글 본문 처리]]). 복사 단추는 그려진 `<code>`의 글자(`textContent`)를 복사한다. 코드 색은 `code-syntax-text`를 기본으로 두고, 강조는 쓰는 곳이 `text-code-syntax-*` span으로 칠한다. 앱의 `post-blocks.tsx`와 `post-body.tsx`는 문법 강조가 아직 없어(Shiki는 이 PR 범위가 아님) 코드 문자열을 그대로 children으로 넣는다.
  `Parity` 스토리는 피그마 CodeBlock 변형(`default`)과 같게 Code 슬롯을 비운 채 높이 100의 빈 자리를 넣는다. 피그마 PNG(`figma/components/code-block/default.png`)가 견본 코드가 없는 빈 슬롯이고 [[디자인 시스템:컴포넌트 조립 규칙]]이 컴포넌트에 예시를 채우지 않게 하므로, 견본 코드를 넣으면 차이 그림이 코드 줄 때문에 어긋난다. 높이 100은 피그마 슬롯의 고정 높이이고 같은 값의 크기 토큰이 없어 스토리 안에서만 인라인 style로 줬다. 견본 코드를 `code-syntax` 클래스로 칠한 모습은 `Highlighted` 스토리로 따로 두었다. 사람이 `Parity`를 견본 코드로 바꿀지, `size/100` 토큰을 더할지 검토가 필요하다.
"#283 Checkbox: 읽기 전용 표시로 구현": |
  [[Chrome:Notion 블록]]이 할 일 목록을 지원 블록으로만 적고 눌러 바꾸는지는 정하지 않는다. 피그마 Checkbox 컴포넌트 설명이 "글 본문 할 일 목록의 읽기 전용 체크 표시"라서, 코드도 `onChange`와 `<input>` 없이 `role="checkbox"`, `aria-checked`, `aria-readonly`를 단 `div`로 만들었다. 글에 적힌 상태만 보여 주는 블록이라 상호작용을 넣을 이유가 없다고 보았다. 나중에 상호작용이 필요하면 문서에서 먼저 정해야 한다.
"#283 Checkbox: 체크 표시 자산과 색": |
  피그마 `checkmark` 인스턴스는 `ic_fluent_checkmark_20_regular`를 16으로 줄여 쓰고 글리프 색이 `text-on-accent-fill-primary`다. 코드는 같은 자산(`icons/ic_fluent_checkmark_20_regular.svg`)을 `size-icon-16`과 `text-text-on-accent-fill-primary`로 그렸다. 자산 파일이 이미 있어 `generate:assets`는 바뀐 것이 없었다. 체크 표시는 자리가 하나로 정해져 있어 [[디자인 시스템:아이콘 자리]]의 교체 속성(prop)으로 열지 않고 컴포넌트 안에 고정했다. 로컬 캡처 차이 그림에는 체크 표시 가장자리의 옅은 엔진 차이만 남았다([[피그마 연동:캡처 표]]).
"#286 ExplorerAddressRow: 검색 줄의 포커스와 닫기 prop": |
  피그마 `Device=Mobile, Search=Open`의 검색 상자는 SearchBox `State=Focused`(강조색 아래 선)로 그려져 있다. Focused는 캡처 도구가 Tab 키로 재현하는 상태 변형이지만 여기서는 `Search` 변형 안에 들어 있어 도구가 포커스를 주지 않는다. [[파일 탐색기:폴더 안 검색]]이 검색 줄로 바뀌면 검색 상자에 포커스를 준다고 정하므로, 컴포넌트가 `search="open"`으로 그려질 때 입력칸에 한 번 포커스를 주게 했다(ref 콜백). 포커스를 강제로 주는 prop은 만들지 않았다([[피그마 연동:스토리 규칙]]). ← 버튼은 피그마 레이어 이름이 `back`이지만 동작이 검색 닫기라 접근성 이름을 "검색 닫기", prop을 `onSearchClose`로 두었다. Esc 처리와 열고 닫는 상태 연결은 나중 기능 작업으로 남겼다. desktop에는 `Search=Open` 변형이 없어 `search` 값을 무시한다. 새 prop은 기본값(`search="closed"`)이 기존 모습이라 앱 코드는 고치지 않았다.
"#285 Equation: 수식을 children 슬롯으로 받고 빈 슬롯은 스토리 자리 표시로 맞춤": |
  피그마 Equation은 720 너비에 위아래 8 여백과 100x100 `Formula` 슬롯 하나이고, 내보낸 PNG에는 수식 그림이 없는 빈 슬롯이다. 수식은 서버가 KaTeX로 그려 보내므로([[기술 스택:글 본문 처리]]) 이 PR 범위가 아니라고 보아, 코드는 `children`으로 받는 `Equation`만 만들었다. `equation/Quadratic Formula` 자산의 생성 코드는 이 PR에서 만들지 않았다. 조립에서 그 그림을 쓰는 PR이 [[남은 작업]]대로 만든다.
"#285 Equation: Parity 스토리의 빈 슬롯 크기를 인라인 스타일로 줌": |
  피그마의 빈 `Formula` 슬롯은 100x100인데 `size/100` 토큰이 없다(`size-96` 다음이 `size-104`). 컴포넌트는 슬롯 크기를 갖지 않고(수식 크기가 내용으로 정해지므로) `Parity` 스토리가 `style={{ width: 100, height: 100 }}` 빈 상자를 children으로 넣어 피그마 높이 116에 맞췄다. 토큰 클래스만 쓰는 규칙([[피그마 연동:토큰 생성]])의 예외이고 스토리 안으로 한정했다. 로컬 캡처 차이 그림은 전부 검정이다.
"#288 Figure: 이미지를 필수 image prop(ReactNode)으로 받고 Parity는 wallpaper/Bloom을 넣음": |
  피그마 Figure의 `image`는 인스턴스 교체 속성이고 기본값이 `wallpaper/Bloom`이다. 글마다 달라지는 이미지라 [[디자인 시스템:아이콘 자리]]의 필수 prop 규칙을 따라 코드에서 필수 `image: ReactNode`로 받고, `Parity` 스토리가 `ImageAsset`(`images/wallpaper-bloom`)을 넣는다. `src` 문자열 prop 대신 ReactNode로 한 것은 피그마 속성과 이름·종류를 맞추고, 실제 Notion 이미지 주소 제공([[Notion 이미지 제공]], 9단계)과 `next/image` 같은 이미지 요소 선택을 쓰는 곳에 남기기 위해서다. 틀은 안쪽 이미지를 너비 100%, `object-cover`, `rounded-overlay`로 잘라 그린다. 피그마의 이미지 칸은 720x420 고정이지만 코드는 이미지 높이를 따르므로, `Parity` 스토리가 높이 420을 인라인 style로 준다(같은 크기 토큰이 없음, 스토리 안으로 한정). 캡션은 `caption`(기본 "캡션")과 `showCaption`(기본 true)이다. 이미지를 눌러 크게 보기([[Chrome:글 화면]])를 여는 동작은 나중 기능 작업으로 남기고 `onClick` 등은 만들지 않았다(`figure` 요소 props는 그대로 넘어간다). 로컬 캡처 차이 그림에는 이미지 윤곽의 옅은 리샘플링 차이와 캡션 글자 가장자리만 남았다([[피그마 연동:캡처 표]]).
"#287 ExplorerTab: Rest 오른쪽 구분선을 선택되지 않은 탭에 항상 그림": |
  피그마 `State=Rest`에 1x16 `separator` 레이어가 새로 생겼다(오른쪽 끝 x=219, 세로 가운데, 색 `divider-stroke/default`). 새 PNG와 옛 PNG는 이 선 한 줄만 다르고, Hover·Selected PNG에는 선이 없다. 코드에 같은 선을 더했다. 선택되지 않은 탭에만 `bg-divider-stroke-default`로 그리고 `group-hover:hidden`으로 Hover에서 숨긴다. BrowserTab의 구분선과 같은 방식이다. 피그마 MCP 메타데이터로는 이 선을 켜고 끄는 컴포넌트 속성이 있는지 알 수 없어, 속성(`showSeparator`)은 만들지 않고 상태로만 정했다. 속성이 있다면 BrowserTab처럼 prop으로 여는 검토가 필요하다([[디자인 시스템:컴포넌트 조립 규칙]]). 로컬 캡처 차이 그림에는 구분선이 사라지고 글자와 닫기 아이콘 가장자리의 엔진 차이만 남았다([[피그마 연동:캡처 표]]).
