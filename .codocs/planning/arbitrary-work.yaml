_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  이어서 할 일은 [[남은 작업]]에 있다.

피드백 1차 문서 반영: |
  사용자가 확정한 피드백 결정을 문서에 옮기면서 작업 중에 정한 것이다.
  - 끌어서 순서 바꾸기 규칙의 위치: 작업 표시줄·탐색기 탭·Start 고정됨 세 곳이 함께 따르므로 [[항목 조작:순서 바꾸기 끌기]]에 새 섹션으로 두고 세 문서는 링크한다.
  - Start 고정됨 이동 메뉴: 앞으로 이동은 "그 칸을 화면 맨 앞 칸으로 옮김"으로 풀었다. 칸이 하나뿐이면 이동 메뉴가 없다. 첫 칸이 마지막 칸이기도 한 경우(칸 하나)를 이렇게 정했다.
  - Start 모두 범주 카드: 항목이 3개 이하이면 항목 수만큼 큰 아이콘을 놓고 남은 칸은 묶음 없이 비워 둔다. 빈 칸을 눌러도 펼침 팝업이 열린다. 항목이 없는 범주는 카드를 두지 않는다.
  - 범주 카드의 큰 아이콘과 펼침 팝업의 항목에도 모두 목록 항목과 같은 우클릭(길게 누르기) 메뉴를 적용했다.
  - 파일 탐색기 주소창 편집: 못 찾았을 때 메시지 상자의 제목은 "파일 탐색기", 버튼은 `확인`으로 했다. 새 섹션 "주소창 편집"과 "검토한 대안"(추천 목록)을 만들었다.
  - 창 버튼 높이 규칙은 [[창 동작:창 조작]] 섹션 안의 문단으로 두었다. 새 섹션을 따로 만들지 않았다.
  - 커서 규칙은 [[디자인 시스템:커서]] 새 섹션으로 두었다. 글자 입력칸·크기 조절·끌기 중 `not-allowed` 커서는 이 규칙과 별개라는 문장을 더했다.
  - 열 나누기: 열 안의 블록도 가장 높은 제목 단계를 찾는 범위에 넣었다([[Notion 블록:모양]]). 열은 토글과 달리 늘 보이기 때문이다.
  - 이미지 로딩 표시는 [[Notion 이미지 제공:로딩 표시]] 새 섹션으로 두었다. 반짝임·나타남의 값은 모션 견본이 정한다고 적었다.
  - Chrome 목차 들여 쓰기: 제목 단계마다 들이되, 글에서 가장 높은 제목 단계를 들여 쓰지 않는 상대 단계로 풀었다. 사용자가 말한 `heading_1/2/3` 절대 단계와 다를 수 있어 확인이 필요하다.
  - 모바일 부팅 화면 규칙은 [[반응형:화면 채우기]] 새 섹션으로 두었고, 입력 차이 표의 Start 순서 바꾸기 칸에 이동 메뉴를 가리키는 문장을 더했다.

작업 영역 높이를 innerHeight로 되돌림: |
  `fix/work-area-inner-height` PR에서 작업 중에 정한 것이다.
  - 스토리 화면 크기 도우미(`setStoryScreen`)가 더 이상 읽지 않는 `visualViewport.height` 가짜 값 설정을 뺐다.
  - `use-work-area` 테스트의 `visualViewport` 구독·반올림 시험은 지우고, `visualViewport`가 있어도 `innerHeight`를 쓰는지 보는 시험 하나로 바꿨다.
  - [[반응형:화면 채우기]]에서 `visualViewport`를 말한 문장만 `innerHeight` 기준으로 고쳤다. 인앱 브라우저에서 주소창이 접힐 때 `resize`가 오지 않을 수 있다는 이유 문장은 근거가 없어져 함께 뺐다.

끌어서 순서 바꾸기 모션: |
  `feat/drag-reorder-motion` PR에서 [[항목 조작:순서 바꾸기 끌기]]를 구현하며 정한 것이다.
  - 세 곳(작업 표시줄 고정 앱, 탐색기·Chrome 탭, Start 고정됨)이 공용 훅 `useReorderMotion` 하나를 쓴다. 끄는 항목은 `motion-reorder-lift`를 붙인 채 `translate`로 포인터를 따라오고, 놓거나 취소하면 `motion-reorder-drop`, 자리가 바뀐 나머지는 `motion-reorder-slide`를 FLIP으로 재생한다. 포인터를 놓친 취소도 놓기와 같이 새 자리로 들어간다. (2026-11-09 확인함: 그대로 둔다. 취소 개념이 없다는 규칙을 [[항목 조작:순서 바꾸기 끌기]]에 옮겼다.)
  - 놓일 자리를 찾을 때 항목의 움직이는 모습이 아니라 원래 자리(요소 자신의 `translate`·`scale`을 뺀 자리)로 찾게 바꿨다. 움직이는 모습으로 찾으면 미끄러지는 항목 위에서 순서가 앞뒤로 오가기 때문이다.
  - 끄는 항목을 옆 항목 위에 그리도록 끄는 동안 `z-layer-drag-ghost`를 붙였다. 미끄러지는 옆 항목도 `translate`로 겹 순서가 올라가 끄는 항목을 가리기 때문이다.
  - 미끄러지는 도중 순서가 다시 바뀌면 지금 보이는 자리에서 이어서 미끄러진다. 끌기 밖에서 같은 항목들의 순서가 바뀌어도 미끄러지고, 항목이 더해지거나 빠진 경우는 움직이지 않는다.
  - 끄는 동안 목록 안에서 옮겨진 요소는 CSS 애니메이션이 처음부터 다시 돌아 lift가 다시 커지므로, 옮겨진 뒤 lift를 끝 모습으로 바로 보낸다.
  - 움직임 상태를 `data-reorder-motion`(lift·drop·slide) 속성으로 드러냈다. 동작 스토리가 확인한다.
  - 탭이 움직이려면 탭 id가 필요해 탐색기·Chrome 탭 요소에 `data-tab-id`를 달았다. id가 없는 탭(스토리 데이터)은 끌기만 되고 움직이지 않는다.

Start 고정됨 이동 메뉴: |
  `feat/start-pinned-move` PR에서 [[Start 메뉴:고정됨]]의 이동 메뉴를 연결하며 정한 것이다.
  - 왼쪽·오른쪽으로 이동은 저장한 고정 목록에서 두 항목의 자리만 맞바꾼다(`swapStartPin`). 휴지통에 있어 보이지 않는 항목은 제자리에 남는다. 앞으로 이동은 전처럼 저장 목록의 첫 자리(0)로 옮긴다.
  - 움직임 순서: 옮기는 칸에 `motion-start-pinned-move-exit`를 붙여 사라지기를 기다린 뒤, 숨긴 채(`invisible`) 순서를 바꾸고, 나머지 칸의 `motion-reorder-slide`가 모두 끝나면 `motion-start-pinned-move-enter`로 나타난다. 순서를 바꾸는 시점은 사라짐이 끝난 뒤라 저장소 상태도 그때 바뀐다. (2026-11-09 바로잡음: 나머지 칸은 미끄러지지 않고 교차 페이드한다. [[Start 메뉴:고정됨]])
  - 사라지는 동안 Start가 닫혀도 순서는 바꾼다(메뉴에서 이미 고른 일이라서다). (2026-11-09 확인함: 그대로 둔다. [[Start 메뉴:고정됨]]에 옮겼다.)
  - 메뉴를 그리는 함수(`getPinnedMenuItems`)가 움직임과 함께 순서를 바꾸는 함수(`playMove`)를 받게 했다. 메뉴 항목을 만드는 곳(use-start-lists)은 저장소를 알고, 움직일 칸을 아는 곳(start-body)은 격자를 갖고 있어서다.
  - 진행 상태는 순서 바꾸기 끌기와 같은 `data-reorder-motion` 속성(exit·enter)으로 드러낸다. 숨겨 기다리는 동안은 exit 그대로다.

Start 범주 펼침 팝업: |
  `feat/start-category-popup` PR에서 [[Start 메뉴:모두]]의 범주 카드 펼침 팝업을 띄우며 정한 것이다.
  - 팝업은 Base UI Popover로 띄운다. 바깥 누르기·Esc 닫기를 Base UI가 맡고, Start 패널(비모달 Dialog) 안의 팝업으로 보아 Esc는 팝업만 닫는다. 팝업 안 항목의 우클릭 메뉴는 팝업 안으로 본다.
  - 자리: 팝업 위쪽을 누른 카드 위쪽에 맞추고(카드 높이만큼 위로) 가로는 카드 가운데에 두되, 카드 격자 밖으로 나가면 격자 안으로 민다. (2026-11-09 바로잡음: Start 패널 정가운데에 연다. [[Start 메뉴:모두]])
  - 크기: 너비는 항목 칸 4열과 팝업 좌우 안쪽 여백을 더한 값(데스크톱 412, 피그마 견본과 같다)이고, 카드 격자보다 넓으면 격자 너비다. 최대 높이는 카드 위쪽에서 Start 본문 스크롤 영역 아래 끝까지다. 크기 토큰이 없어 팝업이 그려질 때 칸 너비와 여백을 재서 style로 준다. (2026-11-09 바로잡음: 항목 수와 상관없는 고정 크기이고 넘치면 쪽 단위로 넘긴다. 모바일 너비는 피그마 `Start/CategoryFolder` `Device=Mobile`이고 격자 너비로 자르지 않는다. [[Start 메뉴:모두]])
  - 누르는 곳: 카드 전체(범주 이름 포함)에서 큰 아이콘 버튼을 뺀 곳을 누르면 연다. 카드 전체에 손가락 커서를 준다. (2026-11-09 바로잡음: [[디자인 시스템:커서]]대로 화살표 커서. [[Start 메뉴:모두]])
  - 키보드로 팝업을 여는 방법은 문서에 없어 만들지 않았다. 카드의 큰 아이콘 버튼은 Tab으로 닿지만 묶음·빈 곳에는 키보드로 닿지 않는다. (2026-11-09 바로잡음: 범주 격자는 Tab 한 번, 방향키로 카드 사이, Enter로 팝업을 연다. [[Start 메뉴:모두]])
  - 팝업의 항목을 열면 팝업을 닫고 항목을 연다(Start도 닫힌다).
  - 큰 아이콘의 우클릭 메뉴는 포털이지만 React 트리로 카드까지 클릭이 올라와 팝업이 열렸다. 카드 DOM 안에서 일어난 클릭만 받는다.
  - 팝업이 열린 동안의 Esc는 창(window) 붙잡기 단계에서 먼저 받아 팝업만 닫는다. Base UI Popover만으로는 Start 패널(Dialog)까지 함께 닫히는 경우가 있었다. 팝업 안 우클릭 메뉴가 열려 있으면 메뉴가 Esc를 받도록 넘긴다.
  - 팝업을 연 동안에만 Popover를 그린다.
  - 같은 PR에서 고정됨 메뉴 이동(`feat/start-pinned-move`)을 고쳤다. 앞선 이동으로 미끄러지는 중인 칸을 다시 옮기면, 그 미끄러짐이 끝날 때 이동 중인 상태(`data-reorder-motion`)를 지우던 것을, 옮기기 전에 미끄러짐을 끝내도록 바꿨다. 동작 스토리는 상태가 바뀌는 차례를 DOM 변화로 기록해 확인한다.

탐색기 주소창 편집: |
  `feat/explorer-address-edit` PR에서 [[파일 탐색기:주소창 편집]]을 구현하며 정한 것이다.
  - 빈 곳: 주소 줄에서 버튼(마디, 뒤로·앞으로·위로·새로 고침, 검색)과 입력칸이 아닌 경로 부분(위치 아이콘, 꺾쇠)을 빈 곳으로 본다. 주소 줄 자체의 여백은 넘긴다.
  - 경로 해석: 첫 이름 `바탕 화면`은 적지 않아도 바탕 화면부터 찾는다(`Blog\React`도 된다). 이름 앞뒤 공백과 끝의 `\`는 무시한다. 같은 이름의 폴더가 여럿이면 앞의 것으로 간다. 휴지통 안의 폴더와 폴더가 아닌 항목(글·외부 링크)은 찾지 못한 것으로 본다. (2026-11-09 바로잡음: 글·외부 링크는 열고, 휴지통 안의 항목은 복원 메시지 상자를 띄운다. 나머지 경로 해석은 확인함, 그대로 두고 [[파일 탐색기:주소창 편집]]에 옮겼다.)
  - 빈 입력으로 Enter를 누르면 입력을 버린다. 지금 위치와 같은 경로면 편집만 끝내고 기록을 남기지 않는다. (2026-11-09 확인함: 그대로 둔다.)
  - 찾지 못한 메시지 상자를 띄우는 동안 입력칸이 포커스를 잃어도 입력을 버리지 않는다. 메시지 상자가 닫히면 포커스가 입력칸으로 돌아온다.
  - 입력칸의 접근성 이름은 `주소`다.
  - 모바일은 현재 위치 한 칸을 누르면 편집을 시작한다(같은 위치라 이동은 없다). (2026-11-09 확인함: 그대로 둔다.)

Notion 열 나누기: |
  `feat/notion-columns` PR에서 [[Notion 블록:지원 블록]]의 열 나누기를 구현하며 정한 것이다.
  - 본문 블록 모양: `column_list`가 열(`column`)들을 `children`으로 품고, 열은 `widthRatio`(Notion `width_ratio`, 없으면 null)와 안의 블록을 `children`으로 품는다. 하위 블록을 `children`으로 두어 이미지 크기 채우기·이미지 주소 모으기 같은 기존 처리가 열 안까지 그대로 닿게 했다.
  - 열 나누기 밖에 따로 나온 열은 안의 블록을 그 자리에 둔다. 열 나누기 안에 열이 아닌 블록이 오면 그 블록을 그대로 그린다.
  - 열 너비: 넓은 창에서 열마다 `flex-grow`를 비율로 준다. 비율의 합이 1이 아니어도 너비가 남지 않게 몫의 합을 열 수로 맞추고, 비율이 없는 열은 다른 열들의 평균을 갖는다(모두 없으면 똑같이). 열 사이 간격(디자인 시스템 Columns)을 뺀 너비를 나눈다.
  - 열 안의 블록은 맨 위처럼 그린다(목록 단계를 새로 센다). 열 안 토글은 처음부터 펼쳐 둘 수 없다. (2026-11-09 확인함: 처음 펼쳐 두기는 Storybook 견본에서만 쓰는 기능이라 실제 사이트 영향이 없어 그대로 둔다.)
  - 제목 id: 맨 위 제목은 전처럼 `heading-<차례>`, 열 안 제목은 `heading-<열 나누기 차례>-<열 차례>-<열 안 차례>`다.
  - 넓은 창·좁은 창은 Chrome 글 화면이 쓰는 `layout`을 그대로 받는다.
  - 공유 미리보기 설명은 본문을 읽지 않으므로 열 안의 문단도 영향이 없다([[SEO와 공유 미리보기:메타 정보]]).

목차 상대 단계와 자동 스크롤: |
  `feat/toc-level-scroll` PR에서 [[Chrome:글 화면]]의 목차를 구현하며 정한 것이다.
  - 들여 쓰기는 섹션 아래 목록의 규칙(가장 높은 제목 단계를 들여 쓰지 않는 상대 단계)을 따랐다. 같은 섹션 표의 문장은 "제목 단계에 따라 들여 쓴다(아래 목록)"로 고쳐 문서끼리 맞췄다.
  - 가장 높은 제목 단계는 본문 제목 단계(h2로 그리는 단계)와 같은 범위(맨 위와 열 안)에서 찾는다. 목차 항목은 단계와 함께 만든다(`getTocHeadings`의 `level`).
  - 자동 스크롤은 지금 읽는 위치 항목이 목차 안에서 위나 아래로 가려졌을 때만, 가려진 쪽 끝을 목차 끝에 맞추는 만큼 목차 목록의 `scrollTop`만 바꾼다. `scrollIntoView`는 페이지까지 스크롤해 쓰지 않았다. 움직임 없이 바로 옮긴다. (2026-11-09 바로잡음: 부드럽게 스크롤하고 동작 줄이기에서만 바로 옮긴다. [[Chrome:글 화면]])
  - 좁은 창의 펼친 목차에도 같은 규칙을 쓴다.

이미지 로딩 표시: |
  `feat/image-loading-state` PR에서 [[Notion 이미지 제공:로딩 표시]]를 구현하며 정한 것이다.
  - 받는 동안 디자인 시스템 Figure는 이미지를 그리지 않으므로, 같은 이미지를 숨긴(`invisible`) img로 Figure 위에 겹쳐 받는다. `display: none`이면 늦게 받기(`loading="lazy"`)가 시작되지 않아 자리를 차지하게 두었다. 숨긴 img는 대체 글자를 비우고 보조 기술에서 숨긴다.
  - 다 받으면 Figure 안에 새 img를 그리고 `motion-image-enter`를 붙인다. 숨긴 img가 붙을 때 이미 받아져 있으면(`img.complete`) 그리기 전에 바로 다 받은 상태로 바꿔 스켈레톤과 나타나는 움직임을 건너뛴다. 받아졌는데 크기가 0이면 실패로 본다.
  - 커버와 이미지 크게 보기는 Figure가 아니라 이미지만 그리므로, 받는 동안 캡션 없는 Figure(받는 중·실패 칸)를 스켈레톤으로 쓴다(`LoadingImage`). 커버는 커버 칸을 채우고, 크게 보기는 페이지 영역 너비를 채운다.
  - 크기를 아는 이미지도 스켈레톤 칸은 16:9다. 디자인 시스템 Figure의 받는 중 칸이 16:9 하나뿐이라서다(문서는 크기를 알면 그 비율로 잡는다고 적었다). (2026-11-09 바로잡음: 피그마는 스켈레톤의 모양만, 크기는 코드가 Notion 이미지 크기로 잡고 모르면 16:9다. 아래 "이미지 스켈레톤 비율" PR로 구현했다. [[Notion 이미지 제공:로딩 표시]])
  - 조립 스토리처럼 이미지를 직접 넣는(`renderImage`) 경우는 받기 상태를 따라가지 않고 바로 다 받은 모양이다.
설명을 Summary로만 정함: |
  `fix/description-summary-only` PR에서 [[SEO와 공유 미리보기:메타 정보]]의 설명 규칙을 바꾸며 정한 것이다.
  - 설명은 Summary가 있으면 Summary, 비어 있으면 바로 사이트 소개다. 본문 첫 문단·160자 대체는 코드와 테스트에서 지웠다.
  - 이제 본문 블록을 읽을 일이 없어 `getEntryDescription`·`getEntryMetadata`가 본문 블록을 받지 않게 했고, 글 주소 페이지의 메타 정보도 본문을 읽지 않는다. `DESCRIPTION_MAX_LENGTH`와 공백 줄이는 도우미(`normalizeSpace`)도 지웠다.
  - E2E `seo-read`는 Summary 없는 글·About 항목의 설명이 사이트 소개인지 확인하게 고쳤다.
  - 같은 PR에서 [[Chrome:글 화면]] 표의 목차 들여 쓰기 문장을 "제목 단계에 따라 들여 쓴다(아래 목록)"로 고쳤다(코드는 이미 상대 단계).
이미지 스켈레톤 비율: |
  `fix/image-skeleton-ratio` PR에서 [[Notion 이미지 제공:로딩 표시]]의 "크기를 알면 그 비율로"를 구현하며 정한 것이다. 위 "이미지 로딩 표시"의 "크기를 아는 이미지도 스켈레톤 칸은 16:9다"는 이 PR로 더 이상 맞지 않는다.
  - 디자인 시스템 Figure에 피그마 속성이 아닌 prop `imageSize`(원본 폭·높이)를 더했다. 주면 받는 중·실패 칸을 그 비율로 잡고(JSX `style`의 `aspectRatio`, 실행 중 값), 없으면 지금처럼 16:9(`aspect-ratio-video`)다. 피그마 견본(16:9)은 기본값 그대로 나온다.
  - Figure의 이미지 칸과 받는 중·실패 칸에 `flex-flex-fill`을 붙였다. 쓰는 곳이 Figure 높이를 정하면 칸이 캡션을 뺀 남은 높이를 채우고, 정하지 않으면 내용 높이 그대로라 기본 모양은 바뀌지 않는다.
  - 본문 이미지는 Figure에 `imageSize`를 넘긴다. 다 받은 img도 너비를 채우고 `width`·`height` 비율로 높이가 정해지므로 받는 순간 높이가 바뀌지 않는다.
  - `LoadingImage`의 `placeholderClassName`을 `fit`(`fill`·`contain`)으로 바꿨다. 커버는 `fill`로 커버 칸을 채운다. 커버는 다 받은 이미지도 칸을 채워 잘라 그리므로 이미지 비율을 쓰지 않는다.
  - 크게 보기는 `contain`으로, 다 받은 이미지가 그려질 크기(영역 높이, 원본 높이, 영역 폭에 비율을 곱한 높이 중 가장 작은 값, `getContainedImageHeight`)의 높이와 원본 비율로 자리를 잡는다. 영역 폭을 재려고 크게 보기의 이미지 칸(`stage`)에 `@container`를 붙였다(`100cqw`). 크기를 모르면 영역 너비의 16:9다.
  - 크기 꺼내기(`getPostImageSize`)는 서버 계약 시험도 불러 앱 별칭을 못 쓰는 `post-image.ts`에 두어, `PostImage` 대신 크기 부분만 받는 타입(`PostImageSizeSource`)을 받는다.
  - 이미지를 두 번 받지 않는 것은 기존 구조 그대로다. 숨긴 img와 다 받은 뒤의 img가 같은 `src`·`srcset`·`sizes`라 브라우저가 한 번 받은 것을 다시 쓴다.
  - 동작 스토리 `ImageLoading`에 크기를 아는 세로 이미지와 커버를 더하면서, 화면 밖 이미지는 늦게 받기(`loading="lazy"`)가 시작되지 않아 확인 전에 화면 안으로 옮기게(`scrollIntoView`) 했다.

플러그인 @ 줄을 피그마 기능으로 대신함: |
  [[남은 작업]] 6번의 `@` 줄 정리(컴포넌트 쪽)를 플러그인에 옮기면서 정한 것이다.
  - 더 쓰지 않는 키(`@repeat`·`@trigger`·`@runtime`·`@reduced-motion`·`@sample-size`)가 description에 남아 있으면 막지 않고 "지울 줄" 알림으로 보인다. 피그마에서 줄을 지우는 일(C단계)보다 플러그인을 먼저 바꾸므로, 그 사이 컴포넌트 내보내기가 모르는 키로 막히지 않게 하기 위해서다. 줄을 다 지운 뒤 알림을 오류로 바꿀지는 다시 본다.
  - 옛 모션 견본(`Foundations / Motion`) 주석은 견본을 옮기기 전까지 `@repeat`·`@trigger`·`@runtime`·`@reduced-motion`을 그대로 읽는다(`isLegacySample`). 견본 21개의 재생 설정 Loop가 모두 켜져 있어(2026-11-09 읽기 확인) 지금 Loop로 읽으면 한 번 도는 움직임 19개가 무한 반복으로 나가기 때문이다.
  - 레이어 주석은 `@` 줄로 읽지 않는다. `@` 줄의 자리는 변수·스타일·컴포넌트 description이다([[피그마 연동:구조 검사]]). 주석은 레이어 트리 `annotations`에 `{ text, category }`로 싣는다.
  - 견본 크기: 변수 없는 고정 크기를 막지 않고, 레이어 트리에 `sampleSize`(`width`·`height`)로 적는다. `size`의 숫자와 `sizing`의 `FIXED`는 그대로 둔다. 스토리의 `FigmaFrame`이 이 숫자로 견본 크기를 주기 때문이다([[테스트 작성 규칙:스토리 테스트]]). 배율 인스턴스와 잠긴 비율에서 나오는 축은 적지 않는다.
  - Focused 변형으로 가는 전환에 `@trigger focus-visible`을 요구하던 검사를 없앴다. 트리거는 읽지 않는다.

조립 내보내기를 보고로 바꿈: |
  [[남은 작업]] 6번의 조립 보고를 플러그인에 옮기면서 정한 것이다.
  - 보고는 `export.json` 변형마다 `report`로 싣는다(쓴 컴포넌트 `components`, 컴포넌트 밖에서 그린 것 `drawn`, Foundations에 없는 값 `offToken`, 표시용 `displayOnly`, 움직임 `motion`). 같은 묶음을 플러그인 결과 화면과 PR 본문 "조립 보고"에 보인다. PR 본문은 묶음마다 30줄까지 싣고 나머지는 `export.json`에서 보게 했다(본문 길이 제한).
  - 쓴 컴포넌트는 컴포넌트 이름과 속성(변형 속성 포함)이 같은 것끼리 묶고 놓인 경로를 모은다. 인스턴스 안쪽은 컴포넌트의 것이라 보지 않고 슬롯 안은 조립이 채운 것이라 본다(예전 배치 프레임 검사와 같은 경계).
  - 컴포넌트 밖에서 그린 것: 인스턴스·슬롯이 아닌 노드의 보이는 칠·선·효과, 글자, 자산이 아닌 모양.
  - Foundations에 없는 값: 변수·스타일에 연결되지 않은 단색(가까운 `color/*`, RGBA 거리), 선 두께(`stroke-width/*`), 반경(`radius/*`), 여백·간격(`spacing/*`), 불투명도(`opacity/*`, %로 비교), 스타일 없는 효과·그라데이션, 글자 스타일이 없는 구간. 크기는 조립에서 숫자로 둘 수 있어 보지 않는다. 0은 적지 않는다.
  - "표시용": Development 카테고리 주석에 `표시용`이 든 레이어다. 그 아래는 다른 묶음에 넣지 않는다.
  - 움직임은 키프레임이 걸린 보이는 레이어와 항목 이름만 적는다. 키프레임 값은 애니메이션 내보내기가 맡는다.
  - 조립 description의 `@` 줄 문제는 막지 않고 알림으로 바꿨다.
  - 조립 PR 본문의 캡처 표 안내는 캡처 표 PR에서 함께 고친다.
  - 조립 `export.json`의 레이어 트리(`tree`)는 아직 그대로 둔다. 앱 스토리 5곳이 `FigmaFrame`으로 이 트리의 크기를 읽고 있어 질문으로 남겼다.

조립 캡처 표를 피그마와 비교: |
  [[남은 작업]] 6번의 캡처 표 변경을 캡처 도구에 옮기면서 정한 것이다.
  - 조립도 컴포넌트와 같은 방법(피그마 PNG 크기·노드 위치·여백·배경에 맞춤)으로 `피그마 | 코드 | 차이`를 만든다. 표 제목에 "조립: 참고용"을 붙이고 댓글 머리에 참고용이라고 적는다.
  - 이전 코드 그림(`parity-captures`) 비교는 남길지 정하지 않아 지우지 않고, 조립마다 접은 `이전 코드 | 지금 코드 | 차이` 표로 덧붙였다(`previous.png`, `previous-diff.png`). 지우기로 하면 이 표와 `parity-captures` 읽기를 함께 지운다.
  - 조립의 코드 그림도 피그마 PNG에 맞춘 캔버스로 찍으므로, 병합 뒤 `parity-captures`에 저장되는 조립 그림의 크기가 예전(대상 상자 + 여백)과 달라진다. 차이 그림은 큰 쪽 크기에 맞춰 만든다.

코드 전용 컴포넌트를 내보내기·캡처에서 뺌: |
  [[남은 작업]] 6번의 코드 전용 컴포넌트 처리를 도구에 옮기면서 정한 것이다.
  - 플러그인과 캡처 도구에 [[컴포넌트 목록:코드 전용 컴포넌트]]의 표와 같은 목록을 두었다(플러그인은 피그마 이름, 캡처 도구는 폴더 이름). 두 도구는 패키지가 달라 목록을 함께 쓰지 않는다. 표가 바뀌면 두 목록을 함께 고친다.
  - 플러그인은 피그마에서 지우기(C단계) 전에도 목록에 보이지 않고 내보내지 않는다. 토큰 PR이 변형 PNG를 다시 내보낼 때도 뺀다.
  - 캡처 도구는 `figma/components/`에 폴더가 남아 있어도 캡처하지 않는다. 남은 폴더와 `Figma` 스토리를 지우고 동작 테스트로 바꾸는 일은 디자인 시스템 코드라 이 작업에 넣지 않았다.

움직임을 일어나는 자리에서 읽음: |
  [[남은 작업]] 6번의 움직임 읽는 곳 변경을 플러그인에 옮기면서 정한 것이다. 모션 이름 규칙은 사람이 정했다(흐름 프레임 이름, 원본 Development 주석).
  - 읽는 자리: 컴포넌트·자산 원본(`Components`·`Foundations` 페이지의 컴포넌트 가운데 인스턴스 밖에서 키프레임을 정의한 것, 변형 하나가 타임라인 하나), 조립 흐름 프레임(03 · Patterns 페이지와 그 섹션 바로 아래 프레임 가운데 이름이 `motion-` 꼴이고 키프레임이 있는 것), 옛 견본.
  - 전환기: 피그마의 견본은 C단계에서 옮기므로 그 전까지 옛 견본도 함께 읽는다. 새 자리에 같은 이름이 생기면 옛 견본은 목록에서 뺀다. 옛 견본은 지금처럼 주석의 `@repeat`·`@trigger`를 읽는다(Loop가 모두 기본값이라서). 모션 API를 쓸 수 없는 계정은 새 자리를 읽지 못해 옛 견본만 보인다.
  - 반복은 움직임을 담은 프레임(원본은 컴포넌트)의 재생 설정 Loop로 읽는다(`playbackSettings.loop`, 켜짐 `infinite`, 꺼짐 1). 읽지 못하면 막는다.
  - 원본의 이름은 컴포넌트(변형)를 먼저, 없으면 세트의 Development 주석에서 `motion-…` 꼴의 줄을 찾는다. 이름이 없는 원본은 목록에 `(이름 없음)`으로 보이고 내보내면 막는다.
  - json에 `source`(`sample`·`flow`·`component`)와 `notes`(자리와 움직임 레이어의 Development·Accessibility 주석, `{ path, category, text }`)를 더했다. 원본의 `@` 줄은 컴포넌트 description에서 읽는다. 흐름 프레임은 description이 없어 `@` 줄이 없다.
  - 원본 루트 자신에 건 키프레임의 노드 이름은 인스턴스와 같은 규칙(컴포넌트 세트·자산 이름)이다.
