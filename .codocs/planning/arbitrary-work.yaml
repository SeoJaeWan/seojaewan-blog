_codocs:
  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  2026-10-26 작업과 2026-10-28 작업에서 생긴 아래 항목이 검토를 기다린다. 이어서 할 일은 [[남은 작업]]에 있다.
2026-10-26 작업: |
  | 영역 | 정한 것 |
  |---|---|
  | 코드 구조 | `desktop`을 `DesktopWallpaper`·`DesktopIcons`로 나눴다(배경화면은 작업 표시줄 뒤까지 깔려 한 덩어리면 DOM이 바뀜) |
  | 코드 구조 | 메뉴 스토리는 메뉴마다 `components/menu-<이름>/`, `ViewOptions` 메뉴는 Start "보기:" 메뉴라 `start-menu`로 |
  | lint | 순환 import 검사는 `shared`에만 건다(앱 전체면 lint 시간 +22%). `import type`만의 순환은 검사하지 않는다 |
  | 검사 도구 | 브랜치 이름 검사에서 `renovate/…`는 예외(Renovate PR이 막히지 않게) |
  | 검사 도구 | 모션 값 검사 허용 오차: 투명도·배율·트림 0.001, 이동 0.5px, 회전 0.5° |
  | 자산 | WebP 품질 80(배경화면 PSNR 42.8dB, 1:1 비교에서 차이가 보이지 않음) |
  | 피그마 | 새 이름 `color/search-gradient/cyan`·`blue`, 칠 스타일 `Icon Color/Search Focus` |
  | 피그마 | 변형 `View=Default`/`View=Recycle bin`, `Folder=Recycle Bin`(기존 `Location=Recycle Bin` 표기). 휴지통 창은 데스크톱 변형만(모바일은 Blog에만 있는 관례) |
  | 피그마 | 모션 견본 설명은 자산 `icon-color/Search Focus`의 description에 적음 |
  | 피그마 | `MessageBox`를 새 조립 영역으로 만듦 |
  | 디자인 시스템 | `BrowserTabStrip` 탭 사이 간격 없음(피그마에 정보가 없음) |
2026-10-28 작업: |
  | 영역 | 정한 것 |
  |---|---|
  | 다시 시작 | 다시 시작 단계(`idle`이 아닌 동안) 바탕화면 하위 트리를 `inert`로 둔다. 끝나면 포커스를 바탕화면 `main`(`tabIndex=-1`, 포커스 고리 없음)으로 옮긴다 |
  | Start·검색 패널 | 패널 최대 높이는 작업 영역 높이에서 틈을 뺀 값이다. 틈은 데스크톱 12px, 모바일은 패널이 작업 표시줄에 붙어 0이다. 인라인 `maxHeight`로 준다 |
  | Start·검색 패널 | 본문 스크롤은 디자인 시스템 `ScrollArea`를 쓴다. 스크롤 영역을 안쪽 여백(데스크톱 24, 모바일 12)만큼 오른쪽으로 넓히고 내용에 같은 여백을 줘, 피그마처럼 스크롤바가 본문 오른쪽 바깥에 놓이고 내용 너비는 그대로다. 피그마의 스크롤바가 검색 입력칸 옆까지 올라가는 길이는 따르지 않고 본문 높이에서 끝난다 |
  | Start 목록 | 모두 목록의 줄은 `role="button"`, `tabIndex=0`이고 클릭·Enter·Space로 연다. 같은 항목이 고정됨 칸과 목록에 모두 있어 같은 이름의 버튼이 둘로 잡힌다. 버튼 역할에 맞지 않는 `aria-selected`는 `ListItem`이 붙이는 값을 `undefined`로 덮어 뺀다 |
  | 디자인 시스템 | `ListItem`의 `aria-selected`를 `{...divProps}` 앞에 두어 쓰는 쪽이 덮을 수 있게 했다. 기본(`selected`에 따른 `true`·`false`)은 그대로다 |
  | 창 위치 | 화면 크기가 바뀌면 창 전체(제목 표시줄 포함)가 작업 영역 안에 들어오도록 가장 가까운 자리로 옮기고, 작업 영역보다 크면 작업 영역에 맞게 줄인다. 최대화·스냅한 창도 떠 있을 때의 자리(`bounds`)를 같이 보정한다(이전 크기로 복원할 때 밖으로 나가지 않게). 최소 크기는 보지 않는다 |
  | 창 미리보기 | 클릭으로 연 목록도 마우스가 나가면 300ms 뒤 닫힌다(터치는 올리는 동작이 없어 그대로). 마우스를 올려 연 목록을 누르면 닫지 않고 클릭으로 연 것으로 바꾼다. 다른 앱 버튼으로 옮기면 그 버튼의 400ms 뒤에 바뀌고, 그동안 앞의 목록은 둔다 |
  | 창 미리보기 | 목록이 떠 있는 동안 앱 버튼을 `Hover` 모양으로 그린다(클릭으로 연 목록도 같다). 디자인 시스템은 바꾸지 않고, `SnapLayoutMenu`처럼 앱(`TaskbarAppPreview`)이 열림 표시를 달아 그 변형 클래스로 그린다. `aria-expanded`는 버튼 동작이 없는 조립(스토리)에는 달리지 않아 `data-preview-open`을 따로 쓴다. 그래서 [[피그마 연동:스토리 규칙]]의 "강제 상태 prop을 만들지 않는다"와 어긋나지 않고, `Taskbar/AppPreview`의 Open 캡처는 버튼이 `Hover` 모양이다 |
  | 모바일 미리보기 | 목록 판 너비는 카드를 원래 너비(208)로 놓은 너비와 화면 폭에서 좌우 12px을 뺀 폭 중 작은 쪽이고, 카드는 같은 너비로 줄어든다. 카드 안 축소 화면 자리는 카드 너비에서 안쪽 여백 8씩을 뺀 너비, 높이는 108 그대로다. 목록은 작업 표시줄(가까운 위치 기준 조상)을 기준으로 가운데에 띄운다 |
  | 창 끌기 | 제목 표시줄은 누른 뒤 4px 이상 움직여야 끌기를 시작한다(클릭·더블클릭과 구분). 마우스 왼쪽 버튼과 펜만 받고 터치는 받지 않는다. 누를 때 기본 동작을 막아 글자 선택이 시작되지 않게 한다(클릭·더블클릭은 그대로 일어난다) |
  | 창 끌기 | 끄는 동안의 자리는 저장소에 두지 않고 창 요소의 인라인 스타일에 바로 그리며, 놓을 때 저장소에 반영한다. 저장소의 `interaction`은 끌기를 시작할 때(4px을 넘었을 때)와 놓을 때만 바뀐다 |
  | 창 크기 조절 | 핸들은 가장자리마다 창 밖 8px 띠, 모서리마다 창 모서리에 걸친 16px 칸(창 안으로 8px 들어옴)이다. 커서는 방향별 resize 커서다. 핸들은 누르자마자 따라간다(끌기 거리 없음). 이미 최소 크기보다 작은 창(작은 화면에 맞춰 줄인 창)은 그 크기까지만 줄인다 |
  | 화면 밖 | 작업 영역 안에 남기는 제목 표시줄은 가로 200px(창 버튼 셋 138px보다 넓어 버튼이 아닌 잡을 곳이 남는다), 세로 40px(제목 표시줄 높이)이고, 제목 표시줄은 작업 영역 위로 나가지 않는다. 크기 조절도 같은 제한을 지킨다. 화면 크기 변경 보정(`fitBoundsToWorkArea`)은 그대로 창 전체를 안으로 넣는다 |
  | 끌어서 스냅 | 포인터가 작업 영역 왼쪽·오른쪽·위쪽 끝에서 8px 안이면 스냅한다. 왼쪽·오른쪽 끝에서 위·아래 모서리 64px 안이면 그 4분의 1(4분할 칸), 위쪽 끝에서 왼쪽·오른쪽 64px 안이면 위쪽 4분의 1, 나머지 위쪽 끝은 최대화다. 포인터가 작업 영역 밖(작업 표시줄 위, 브라우저 밖)이어도 가까운 끝으로 본다 |
  | 끌어서 스냅 | 미리 보기 판(`SnapPreview`)은 칸 자리를 여백 없이 그대로 채우고, 끄는 창 바로 아래(같은 z-index, DOM 앞)에 움직임 없이 나타나고 사라진다. 끌어서 칸에 스냅해도 스냅 레이아웃처럼 남은 칸이 있으면 Snap Assist를 연다(최대화는 열지 않는다) |
  | 끌어서 스냅 | 끌어서 스냅·최대화해도 떠 있을 때 자리(`bounds`)는 끌기 전 그대로라, 이전 크기로 복원하면 끌기 전 자리로 돌아간다. 놓을 때 FLIP은 끌던 자리에서 시작한다 |
  | 스냅 떼기 | 스냅·최대화한 창은 끌기를 시작하는 순간 떠 있을 때 크기로 떼어, 눌렀던 가로 비율과 위쪽에서의 거리를 지켜 포인터 아래에 놓는다(이 자리가 새 `bounds`). 떼는 순간은 움직임 없이 바로 바뀐다 |
  | 디자인 시스템 | `WindowFrame`에 `onTitleBarPointerDown`을 더했다(창 버튼 위에서 누른 것은 부르지 않는다, 더블클릭과 같은 기준). 생김새는 그대로다 |
  | 테스트 | jsdom에 포인터 붙잡기가 없어 `apps/web/vitest.setup.ts`에 아무것도 붙잡지 않는 `setPointerCapture`·`releasePointerCapture`·`hasPointerCapture`를 둔다. `scrollIntoView`도 없어 아무것도 하지 않는 함수를 두고, 스크롤을 확인하는 시험은 가짜로 바꿔 건다 |
  | 코드 구조 | 다시 시작 단계만 갖던 `shared/stores/workspace-store`를 `restart-store`(`useRestartStore`)로 바꾸고, `workspace-store`는 작업 공간(항목 배치·휴지통·방문자별 설정) 저장소로 새로 만들었다. 규칙은 `shared/utils/workspace-rules`, 저장분 검증은 `shared/utils/workspace-storage`다 |
  | 코드 구조 | 외부 링크 설정 파일은 `shared/stores/workspace-store/external-links.ts`에 둔다. `shared/`에는 `data` 종류가 없고, 설정을 읽는 곳이 작업 공간 저장소 하나라 그 대상만 쓰는 부품으로 저장소 폴더에 넣었다 |
  | 코드 구조 | 탐색기·Chrome 창 내용은 각 기능의 층 컴포넌트(`ExplorerWindowLayer`, `ChromeWindowLayer`)가 저장소를 읽어 그리고, 위치 경로·원래 위치·날짜·탭 제목 계산은 그 기능의 `utils`에 둔다. 창 제목도 각 기능이 훅(`useExplorerWindowTitle`, `useChromeWindowTitle`)으로 내보내고, shell은 앱에 맞는 층과 제목 함수를 고르기만 한다 |
  | 항목 id | 글 `post:<slug>`, Notion 폴더 `folder:<경로>`(`React/Hooks`처럼 `/`로 이은 경로), `Blog` 폴더 `blog`, 휴지통 `recycle-bin`, 외부 링크 `link:<설정 id>`, 방문자가 만든 폴더 `crypto.randomUUID()`다. Start 고정 목록에 넣는 앱은 `app:file-explorer`·`app:chrome`이다 |
  | 항목 모델 | 항목마다 상위 폴더 id(바탕화면은 null), 휴지통 기록(원래 상위 폴더·삭제 시각), 날짜(글은 작성일, 방문자 폴더는 만든 시각, Notion 폴더·외부 링크는 없음)를 둔다. 휴지통으로 보내면 상위 폴더 자리에 휴지통 id를 넣고, 하위 항목은 폴더 안에 그대로 둔다 |
  | 저장 | `persist` 열쇠 `seojaewan-blog:workspace`, `version: 1`. 배치만 저장하고 글 제목·작성일과 외부 링크 이름·주소·아이콘은 원본(글 색인, 설정)에서 다시 채운다. 폴더만 이름과 날짜를 저장한다. 저장 범위는 항목 배치·휴지통, 바탕화면 설정(아이콘 크기·자동 정렬·정렬 기준·아이콘 격자 칸 `{ column, row }`), Start 고정 목록·순서와 모두 목록 보기, 작업 표시줄 고정·순서, 탐색기 폴더별 보기·정렬, 최근 연 항목이다 |
  | 저장 | 저장분이 Zod 스키마에 맞지 않거나, JSON이 깨졌거나, 버전이 다르면 초기 구조에서 다시 시작한다. 읽힌 배치의 오류(상위 폴더가 없거나 폴더가 아님, 순환, 휴지통 자리와 기록이 어긋남)는 그 항목을 바탕화면으로 옮겨 고친다. `Blog`가 없으면 바탕화면에 다시 만들고, 휴지통 안에 있으면(휴지통에 보낸 상위 폴더 안에 있어도) 바탕화면으로 꺼낸다. 글·외부 링크 id(`post:`, `link:`)를 차지한 폴더는 버리고, 그 하위 항목은 바탕화면으로 옮긴다 |
  | 수화 | `skipHydration`으로 저장소를 만들 때 저장분을 읽지 않고, Shell이 마운트한 뒤 글 색인을 넘겨 `persist.rehydrate()`로 읽는다. 서버 HTML과 첫 클라이언트 렌더는 글 없이 만든 초기 구조다(바탕화면 항목은 같다) |
  | 처음 값 | 바탕화면은 보통 아이콘, 자동 정렬 켜짐, 이름순이다. Start 모두 목록은 간단히다. 최근 연 항목은 최대 20개를 기억하고 앱·휴지통은 넣지 않는다 |
  | 이동 | 여러 항목 가운데 하나라도 거부되면 아무것도 옮기지 않는다. 휴지통 위로 옮기면 휴지통으로 보낸다. 휴지통 안의 항목은 옮길 수 없고 복원만 된다. 같은 이름 금지는 폴더끼리만 본다(글·외부 링크는 같은 이름이 있어도 된다). 바탕화면을 떠난 항목의 아이콘 칸은 지운다 |
  | 휴지통 | 보낼 항목에 `Blog`, 휴지통, `Blog`를 하위에 둔 폴더가 있으면 모두 거부한다(`protected`). 고른 폴더 안의 고른 항목은 그 폴더와 함께 가므로 따로 보내지 않는다 |
  | 휴지통 | 복원할 자리에 같은 이름의 폴더가 생겼으면 `React (2)`처럼 가장 작은 빈 번호를 붙여 돌려놓는다(Windows는 합칠지 묻는다). 함께 복원하는 폴더가 원래 상위 폴더면 그 폴더를 먼저 복원해 그 안으로 돌려보낸다 |
  | 폴더 이름 | 길이는 UTF-16 단위로 센다. 예약 이름은 첫 `.` 앞부분(끝 공백 제외)을 대소문자 무시로 비교한다. 제어 문자는 문자 코드 0~31이다 |
  | 열기 | 작업 표시줄·Start 앱으로 연 탐색기는 `Blog` 폴더를 본다(새 탭이 `Blog`로 여는 것과 같다). 글을 여는 "가장 최근에 쓴 Chrome 창"은 활성 순서의 가장 뒤(최소화된 창 포함)이고, 그 창을 복원해 맨 앞으로 가져온다 |
  | 창 내용 | 열린 창에 `content`를 둔다. 탐색기는 탭 목록(탭마다 id·위치 기록·기록 차례)과 고른 탭, 탐색 창 펼침 기억이다(자세한 모양은 아래 "탐색기 창 내용"). 위치는 폴더 id·휴지통 id, 바탕화면은 null이다. Chrome은 탭 목록(새 탭 `{ kind: 'new-tab' }` 또는 글 `{ kind: 'post', slug }`)과 고른 탭 차례이고, Chrome 탭 id는 아직 두지 않았다 |
  | 탐색기 | 창 제목·탭·위치 칸·검색 안내 글자는 보고 있는 위치 이름이다. 항목의 보기와 차례는 아래 "탐색기 보기와 정렬"을 따른다. 휴지통은 자세히 보기이고 원래 위치는 `바탕 화면\Blog`처럼 `\`로 잇고, 삭제한 날짜는 방문자 시간대의 `YYYY-MM-DD`다 |
  | Chrome | 탭 제목은 새 탭이면 "새 탭", 글이면 글 제목이고 창 제목은 고른 탭 기준이다. 새 탭 페이지 최신 글은 휴지통에 없는 글 6개다. 글 화면은 아직 새 탭 페이지 그대로다 |
  | 임시 글 원천 | `content/temporary-posts`에 Notion 속성 모양(title, slug, folder, publishedAt, cover)의 글 10개를 두고 `content/post-schema`(Zod)로 검증해 글 색인으로 바꾼다. `content/post-source`의 `getPostIndex`(`server-only`, async)를 `app/page.tsx`가 읽는다 |
  | 외부 링크 | GitHub와 이력서를 바탕화면에 두고 처음부터 Start에 고정한다. 이력서 주소는 정해지지 않아 임시로 GitHub 프로필 주소를 넣었다 |
  | Start | Start 고정됨·모두 목록은 작업 공간 저장소의 항목에서 그리고, 항목 `key`는 제목이 아니라 항목 id다(같은 이름의 글이 겹쳐도 구분된다) |
  | 바탕화면 격자 | 칸 크기는 FileItem 너비(큰 112·보통 76·작은 76)와 이름 한 줄인 높이(122·74·58)에 간격 16을 더하고, 가장자리 여백은 8이다(피그마 icons 프레임). 이름이 두 줄이어도 칸은 같다. 칸 수는 작업 영역 크기에서 아이콘이 잘리지 않는 만큼이다. 칸 좌표는 인라인 `left`·`top`으로 놓고, 작업 영역을 모르는 서버 HTML·첫 렌더는 피그마 조립처럼 흘려 놓는다(같은 자리) |
  | 바탕화면 격자 | 자동 정렬을 끄는 순간 지금 자리를 모두 저장한다. 칸이 없는 항목은 격자 순서의 첫 빈 칸에 두고(새 폴더는 만들 때 저장), 같은 칸이 겹치면 앞 항목이 갖는다. 화면이 작아져 저장한 칸이 격자 밖이면 가장 가까운 빈 칸(거리가 같으면 격자 순서가 앞인 칸)에 보이지만 저장한 칸은 바꾸지 않아 화면이 커지면 돌아간다. 끌어 놓으면 그때 보이는 모든 아이콘의 칸을 저장한다. 다른 아이콘이 있는 칸에 놓으면 가장 가까운 빈 칸으로 간다. 자동 정렬을 끈 채 정렬 기준을 고르면 그 차례로 한 번 다시 놓아 저장한다 |
  | 정렬 기준 | 휴지통은 늘 맨 앞이다. 이름은 폴더를 먼저 두고 이름순(숫자는 값으로, 영어가 한글보다 앞), 항목 유형은 폴더·글·외부 링크 차례, 수정한 날짜는 최근 것을 먼저 두고 날짜가 없는 항목(Notion 폴더, 외부 링크)은 뒤에 이름순이다 |
  | 선택 | 누를 때 고르지 않은 아이콘은 그것만 고르고, 고른 아이콘은 함께 끌 수 있게 그대로 둔 뒤 끌지 않고 놓으면 그것만 고른다. Ctrl은 놓을 때 더하거나 빼고, Shift는 누를 때 범위를 고른다. Shift + 방향키는 범위를 넓힌다. 방향키는 그 방향의 가장 가까운 아이콘이고 다른 축으로 벗어난 거리에 2배 무게를 줘 같은 줄을 먼저 고른다. 끄는 사각형을 Ctrl을 누르고 시작하면 더한다. 빈 곳을 우클릭하면 선택을 지우고, 고르지 않은 아이콘을 우클릭하면 그것만 고른다 |
  | 아이콘 끌기 | 끌기 거리는 창 끌기와 같은 4px, 마우스 왼쪽 버튼과 펜만 받는다. 끄는 복제본과 툴팁은 창 위로 끌어도 보이게 body에 포털하고, 툴팁은 포인터 오른쪽 아래 16px에 띄운다. 놓을 곳은 `data-drop-target`(위치 id)·`data-drop-target-name`(이름) 속성으로 찾는다(탐색기 본문·항목·탐색 창 칸도 같은 속성을 단다, 아래 "끌어 옮기기"). 옮기기가 거부되면 안내 없이 제자리다. 놓을 곳이 아닌 곳(작업 표시줄, 창의 제목 표시줄 등)에 놓으면 아무것도 하지 않는다 |
  | 이름 바꾸기 | 잘못된 이름은 Enter와 바깥 클릭 모두 말풍선(Tooltip `Type=Balloon`, 아이콘 아래 8px)으로 이유를 보이고 입력값을 둔 채 입력창에 포커스를 돌려준다(Windows는 빈 이름은 되돌리고 같은 이름은 대화 상자로 묻지만 문서대로 모두 말풍선이다). 문구: 비었음 "폴더 이름을 입력하세요.", 255자 초과 "폴더 이름은 255자보다 길 수 없습니다.", 쓸 수 없는 문자 "파일 이름에는 다음 문자를 사용할 수 없습니다: \ / : * ? " < > \|", 예약 이름 "지정한 장치 이름이 잘못되었습니다.", 끝 공백·마침표 "이름 끝에는 공백이나 마침표를 사용할 수 없습니다.", 같은 이름 "이 위치에 같은 이름의 폴더가 이미 있습니다." 입력창 접근성 이름은 "새 이름"이고, Enter·Esc로 끝내면 포커스를 그 아이콘으로 돌려준다 |
  | 우클릭 메뉴 | Base UI ContextMenu를 쓴다(모바일 길게 누르기 500ms는 Base UI 기본 동작). 메뉴가 닫힌 뒤 포커스는 Base UI가 돌려주지 않고, 포커스를 잃었을 때만 메뉴를 열 때 포커스가 있던 요소로 돌려준다. Base UI가 돌려주는 포커스가 메뉴에서 시작한 이름 바꾸기 입력창보다 늦게 와 입력창을 닫기 때문이다. 이름 바꾸기·새 폴더 이름은 메뉴가 닫힌 뒤 시작한다. 하위 메뉴는 `MenuPopup` 항목의 `entries`로 실제로 여닫는다(스토리의 펼친 모습 `submenu`와 따로). 보기·정렬 기준 항목을 고르면 메뉴를 닫는다 |
  | 우클릭 메뉴 | 보낼 수 없는 항목(`Blog`, 휴지통)이 들어 있으면 삭제를 비활성으로 둔다. 새로 고침은 아이콘을 `motion/duration/faster`(83ms) 동안 감췄다가 다시 보인다(모션 클래스 없이 바로 바뀐다). 디자인에 없는 메뉴 항목은 없다 |
  | 지운 뒤 | Delete나 메뉴의 삭제로 휴지통에 보내면 격자 순서에서 마지막으로 지운 아이콘 다음의 아이콘(없으면 그 앞의 가장 가까운 아이콘)을 고르고 포커스를 옮긴다. 남은 아이콘이 없으면 아이콘 영역에 포커스를 둔다. 메뉴의 삭제는 메뉴가 닫힌 뒤 옮긴다 |
  | 열기 | 여러 개를 고른 채 Enter나 메뉴의 열기는 모두 연다. 더블클릭은 그 아이콘만 연다. 새 창에서 열기는 폴더는 원래대로 새 탐색기 창, 글은 열린 Chrome 창과 상관없이 새 Chrome 창이다(`useOpenItem`의 `isNewWindow`) |
  | 모바일 | 탭하면 그 아이콘만 고르고 연다. 메뉴가 열린 동안 오는 클릭은 무시한다(길게 누른 뒤 따라오는 클릭으로 열지 않게). 늘 자동 정렬이라 보기 하위 메뉴의 아이콘 자동 정렬 항목은 켜진 채 비활성이고, 저장한 설정을 바꾸지 않는다 |
  | 접근성 | 아이콘 영역은 `listbox`("바탕화면 아이콘", 데스크톱은 여러 개 선택), 아이콘은 `option`이고 포커스는 한 아이콘만 Tab으로 닿는다(roving tabIndex). 선택된 아이콘은 펼친 이름이 옆 아이콘을 덮게 위로 올리고, 영역은 `isolate`로 쌓임을 가둬 창 층 위로 올라오지 않게 한다 |
  | 포커스 표시 | 포커스 표시는 FileItem `State=Selected focus`(선택된 채 포커스)로만 그린다. FileItem·피그마에 선택 없이 포커스만 있는 변형이 없어, 선택하지 않은 아이콘에 포커스가 있으면(Ctrl + 클릭으로 뺀 아이콘 등) 표시가 없다 |
  | 코드 구조 | 선택 규칙(`selection-rules`), 말풍선 문구(`folder-name-message`), 포인터·키보드 훅(`use-selection`·`use-marquee-selection`·`use-pointer-drag`·`use-folder-rename`), 우클릭 메뉴(`context-menu-area`)는 바탕화면과 탐색기가 함께 쓰므로 `shared/`에 둔다. 끌기 훅 `use-item-drag`와 끄는 복제본 `item-drag-ghost`, 항목 끌기 저장소도 함께 써서 `shared/`에 있다. 격자 규칙은 `features/desktop/utils/desktop-grid`다 |
  | 코드 구조 | `MessageBoxEmptyRecycleBin`은 탐색기 기능에 있던 조립(스토리 `Patterns/MessageBox/EmptyRecycleBin`)이고 바탕화면 휴지통 비우기가 쓰므로 `shared/components`로 옮겼다. 글자는 `EMPTY_RECYCLE_BIN_MESSAGE`로 내보내 `MessageBoxDialog`에 넘긴다. 스토리 제목은 그대로다 |
  | 디자인 시스템 | `FileItem`에 이름 바꾸기 입력창에 넘길 `renameFieldProps`(값·동작·접근성)를 더했다. 루트에 `outline-none`을 더해 포커스 때 브라우저 기본 외곽선을 그리지 않는다(`MenuItem`·`RenameField`와 같다). 그 밖의 생김새는 그대로다 |
  | 탐색기 창 내용 | 탐색기 창 내용(`OpenWindow.content`)은 보고 있는 위치 하나 대신 탭 목록(탭마다 id `tab-<차례>`, 위치 기록, 기록 차례), 고른 탭 차례, 마지막 탭 차례, 탐색 창 펼침 기억(`treeExpansion`)이다. 저장하지 않는다. 폴더를 열 때는 `createExplorerContent(위치)`로 탭 하나를 만들고, 창 저장소 `setContent`로 바꾼다. 이동 규칙은 `features/file-explorer/utils/explorer-navigation`이다 |
  | 탐색기 기록 | 지금 위치와 같은 곳으로 가면 기록을 늘리지 않는다. 뒤로 간 뒤 다른 곳으로 가면 앞으로 기록을 지운다. 폴더 더블클릭·위치 칸·탐색 창·위로 모두 같은 탭의 기록에 남긴다 |
  | 휴지통에 들어간 위치 | 탭이 보던 폴더(또는 그 상위 폴더)가 휴지통에 들어가면, 휴지통에 보낸 폴더의 원래 상위 폴더로 옮긴다(없는 위치는 바탕화면). 지금 기록 칸을 바꾸고, 바로 앞·뒤 기록과 같아지면 합친다. 기록 속 다른 칸은 그대로 두고, 뒤로·앞으로로 그 칸에 갈 때 같은 규칙으로 바로잡는다. 다른 창에서 일어난 일은 탐색기 층의 effect가 창 내용을 바로잡는다 |
  | 탐색 창 | 기본으로 바탕화면과 현재 위치, 그 조상(현재 폴더 자신 포함)을 펼친다(스토리 데이터와 같다). 휴지통을 볼 때도 바탕화면은 펼친다. 방문자가 펼치거나 접은 칸은 창 안에서 기억하고, 그 칸 안으로 가거나 탭을 고르면 경로의 기억을 지워 다시 펼친다. 하위 폴더 차례는 아래 "탐색 창 정렬"을 따른다. Level 3보다 깊은 폴더는 Level 3으로 그린다. 칸은 클릭·Enter·Space로 가고 꺾쇠·→·←로 펼치고 접는다(`role="tree"`, 이름 "탐색 창"). Tab으로는 칸 하나만 닿는다. 고른 칸(현재 위치)이 보이면 그 칸, 조상을 접어 보이지 않으면 가장 가까운 보이는 조상, 그것도 없으면 첫 칸이다 |
  | 탐색기 탭 | 고른 탭을 닫으면 오른쪽 탭(없으면 왼쪽)을 고르고, 그 탭의 위치와 조상을 탐색 창에서 펼친다(접어 둔 기억을 지운다). 탭 위에서 누른 것은 창 끌기를 시작하지 않고 탭을 끌어 순서를 바꾼다(아래 "탭 순서 바꾸기"). 이벤트 전파는 끊지 않고 `ExplorerWindow`가 제목 표시줄 누르기 콜백을 감싸 `[role="tab"]` 안에서 누른 것만 거르므로, 뒤 창의 탭(×·가운데 클릭 포함)을 눌러도 창이 맨 앞으로 온다. 가운데 버튼으로 누를 때 브라우저 자동 스크롤을 막는다 |
  | 탭 넘침 | 탭은 최소 너비 120(`min-w-120`)까지 고르게 줄고, 넘치면 탭 줄을 가로로 스크롤(스크롤바 숨김)한다. 고른 탭이 가려지면 보이도록 탭 줄을 스크롤한다. `+` 버튼은 탭 줄 밖이라 늘 보인다 |
  | 탐색기 단축키 | 본문(`ExplorerContent` 뿌리)이 포커스를 받는다(`tabIndex=-1`, 포커스 고리 없음). 입력칸에서 누른 Backspace는 뒤로 가지 않고, Alt + ← / →는 입력칸에서도 뒤로·앞으로다 |
  | 탐색기 새로 고침 | 바탕화면 새로 고침처럼 항목을 `motion/duration/faster` 동안 감췄다가 다시 보인다 |
  | 탐색기 스크롤 | 항목 자리와 탐색 창을 디자인 시스템 `ScrollArea`(`material="solid"`)로 감쌌다. 항목 자리는 `listbox`, 이름 "폴더 내용"이다(아래 "탐색기 선택"). 탭을 바꾸면 본문을 새로 그려 스크롤 위치가 처음으로 돌아간다 |
  | 위치 변경 뒤 스크롤 | 같은 탭에서 위치를 옮기면 항목 자리(`ScrollArea`)를 새로 그려 스크롤을 맨 위로 돌린다. `ExplorerContent`의 `itemsKey`에 보는 위치를 넣어 항목 자리의 key로 쓴다. 본문 뿌리는 새로 그리지 않아 포커스와 단축키는 그대로다 |
  | 탐색기 모바일 | 탐색기 본문에서도 폴더를 탭하면 연다(바탕화면 아이콘과 같다). 데스크톱의 한 번 클릭은 선택이다(아래 "탐색기 선택") |
  | 디자인 시스템 | `ExplorerAddressRow`에 `backDisabled`·`forwardDisabled`·`upDisabled`(IconButton 비활성), `BreadcrumbItem`에 `onLabelClick`(구분자는 부르지 않음), `NavigationItem`에 `onChevronClick`(항목 클릭으로 올리지 않음)을 더했다. 생김새는 그대로다 |
  | 탐색기 캡처 | `Window/Explorer`·`Explorer/Content`·`Desktop/Scene`과 바꾼 디자인 시스템 컴포넌트의 캡처는 그대로다. 탐색기 창을 줄여 넣는 `Taskbar/AppPreview`·`Taskbar/PreviewList`는 축소 그림의 글자 가장자리 화소 수십 개가 최대 2/255, `Window/SnapAssist`는 4화소가 최대 17/255 다르다. 탭 줄 가로 스크롤과 `ScrollArea`가 만드는 레이어 때문에 줄인 그림의 안티에일리어싱이 달라진 것이다 |
  | 탐색기 보기와 정렬 | 보기·정렬은 위치마다(바탕화면은 `desktop`, 휴지통은 휴지통 id 열쇠) `setExplorerView`로 기억하고, 휴지통의 정렬도 저장분에서 지우지 않는다. 정렬은 폴더를 늘 앞에 두고(내림차순도), 같으면 이름 오름차순이다. 이름·유형 비교는 바탕화면 정렬과 같은 함수(`shared/utils/item-sort`)다. 수정한 날짜는 항목 날짜(글 작성일, 방문자 폴더를 만든 날)이고, 오름차순은 오래된 것이 앞이며 날짜가 없는 항목(Notion 폴더·외부 링크)은 방향과 상관없이 뒤다. 휴지통은 늘 자세히 보기이고(보기 명령 비활성) 수정한 날짜 대신 삭제한 날짜, 유형 대신 원래 위치로 정렬한다. 자세히 보기 열 제목을 누르면 같은 열은 방향을 뒤집고 다른 열은 오름차순이다. 상태 줄의 두 버튼은 자세히·큰 아이콘이다 |
  | 탐색 창 정렬 | 탐색 창의 하위 폴더는 그 상위 위치(바탕화면 포함)에 기억한 정렬로 늘어놓는다 |
  | 유형 글자 | 자세히 보기 유형 칸은 폴더 "파일 폴더", 글 "블로그 글", 외부 링크 "인터넷 바로 가기"다 |
  | 탐색기 선택 | 바탕화면과 같은 선택 규칙(`shared/hooks/use-selection`)을 쓰고, 표시 순서는 지금 보기의 정렬 차례다. 방향키의 옆 항목은 그려진 자리(줄·칸)로 찾아 아이콘 보기는 격자, 자세히 보기는 위아래다. 끄는 사각형은 항목 자리의 빈 곳에서 시작한다. 상태 줄 선택 글자는 "N개 항목 선택함"이다. 항목 자리는 `listbox`("폴더 내용"), 항목은 `option`이다 |
  | 탐색기 열기 | 폴더 하나는 같은 탭에서 가고, 여러 개를 고른 채 열면 모두 열기 규칙대로 연다(폴더는 새 탐색기 창). 새 창에서 열기는 폴더도 새 창이다. 새 탭에서 열기는 그 폴더를 새 탭으로 열고 그 탭을 고른다. 휴지통 안의 항목은 열지 않는다 |
  | 잘라내기·붙여넣기 | 잘라낸 항목은 탐색기 기능의 저장소(`explorer-clipboard-store`, 저장하지 않고 다시 시작하면 비움)에 두어 다른 탐색기 창에서도 붙여넣는다. 잘라낸 항목은 DS `cut` 모양이다. 붙여넣기는 지금 위치로 옮기고(`moveItems`), 옮길 수 없으면(자기·하위 폴더, 같은 이름 폴더) 명령·메뉴를 비활성으로 둔다. 붙여넣은 뒤 잘라낸 것을 비우고 붙여넣은 항목을 고른다. 그새 휴지통에 들어갔거나 사라진 항목은 빼고 붙인다. 바탕화면에는 붙여넣기가 없다 |
  | 새 폴더·이름 바꾸기 | 명령 모음의 새로 만들기는 바로 새 폴더를 만들고 이름 바꾸기를 시작한다(메뉴의 새로 만들기 > 폴더는 메뉴가 닫힌 뒤). 말풍선은 이름을 바꾸는 항목을 위치 기준 상자로 감싸 그 아래 8px에 띄운다. Enter·Esc로 끝내면 다시 그린 뒤 항목에 포커스를 돌려준다 |
  | 탐색기 메뉴 | 외부 링크 메뉴는 바탕화면 Menu/Link에, 여러 개 메뉴는 Menu/Multiple에 잘라내기를 더했다. 휴지통 안의 항목은 Menu/RecycleItem(복원)이다. 휴지통 빈 곳 메뉴는 정렬 기준만 둔다. 모바일은 새 탭에서 열기가 없다. 명령 모음의 정렬·보기 버튼은 같은 정렬·보기 메뉴를 버튼 아래에 열고, 고르면 닫는다 |
  | 탐색기 명령 | 쓸 수 없는 명령은 Button·IconButton의 비활성 상태로 둔다. 잘라내기는 고른 항목이 없을 때, 붙여넣기는 붙여넣을 수 없을 때, 이름 바꾸기는 폴더 하나를 고르지 않았을 때, 삭제는 보낼 수 없을 때(`Blog` 포함), 복원은 고른 항목 가운데 휴지통에 바로 보낸 항목(휴지통 기록이 있는 항목)이 없을 때, 휴지통 비우기는 비어 있을 때 비활성이다. 복원은 그런 항목만 돌려놓고, 휴지통에 보낸 폴더 안의 항목(검색 결과로 보인다)은 그 폴더와 함께 돌아간다 |
  | 코드 구조 | 바탕화면에 있던 선택·이름 바꾸기·메뉴 기반(`selection-rules`, `folder-name-message`, `use-selection`, `use-marquee-selection`, `use-pointer-drag`, `use-folder-rename`, `context-menu-area`)을 `shared`로 옮겼고, 창 사이 끌기를 붙이며 `use-item-drag`와 끄는 복제본(`item-drag-ghost`)도 옮겼다. 링크 복사는 `shared/utils/item-link`다. 탐색기 항목 조작은 `features/file-explorer/components/explorer-body`가, 탭·이동은 층(`ExplorerWindowLayer`)이 맡는다 |
  | 디자인 시스템 | `FileRow`에 이름 바꾸기 입력창에 넘길 `renameFieldProps`를 더했다(`FileItem`과 같다). 생김새는 그대로다 |
  | 탐색기 조립 | `ExplorerCommands`에 `disabledCommands`·`sortMenu`·`viewMenu`, `ExplorerContent`에 `itemsAreaProps`·`renderItemsArea`를 더했다. 항목 자리는 남는 높이를 채우고(`flex-1`) 위치 기준 상자(`relative`)다. Parity 그림은 그대로다 |
  | 끌어 옮기기 | 탐색기 항목은 같은 창의 폴더, 탐색 창 칸, 다른 탐색기 창 본문(그 창이 보는 위치, 그 창의 폴더 항목 위면 그 폴더), 바탕화면(빈 곳·폴더·휴지통)으로 끌어 옮긴다. 바탕화면 아이콘도 탐색기 창 위에 놓으면 그 위치로 옮긴다. 놓을 곳은 포인터 아래 맨 위 요소에서 가장 가까운 `data-drop-target`이라 창이 겹치면 맨 위 창이 정한다. 바탕화면은 `desktop` id로 놓을 곳이 된다. 옮길 수 없는 곳(자기·하위 폴더, 같은 이름 폴더, 끄는 항목이 이미 있는 위치, 검색 중인 자기 창 본문)은 놓을 곳으로 보지 않아 강조·툴팁이 없고 놓아도 제자리다. 바탕화면 아이콘도 그런 곳 위에 놓으면 빈 곳에 놓은 것으로 보지 않고 제자리에 둔다(놓기 결과의 `rejectedTargetId`). 놓을 곳 강조는 항목 끌기 저장소(`shared/stores/item-drag-store`)를 읽어 바탕화면 아이콘·탐색기 항목·탐색 창 칸이 각자 그린다. 끄는 복제본은 끌기 시작 때 잰 화면 자리에서 시작하고, 탐색기 항목은 지금 아이콘 크기(자세히 보기면 보통 아이콘)의 FileItem으로 그린다. 탐색기 항목을 바탕화면에 놓으면 칸은 정하지 않고(자동 정렬이 꺼져 있으면 첫 빈 칸에 보인다) 옮기기만 한다. 휴지통 안의 항목은 끌 수 없다. 모바일은 끌기가 없다 |
  | 탭 순서 바꾸기 | 탭을 누른 뒤 4px을 넘게 움직이면 끌기를 시작하고, 포인터 가로 자리에 있는 탭 자리로 끄는 동안 바로 옮긴다(첫 탭보다 왼쪽이면 처음, 마지막보다 오른쪽이면 끝). 옮길 때마다 저장소의 지금 창 내용에서 옮기고, 끄는 동안 탭이 닫히거나 열리면 더 옮기지 않는다. 고른 탭은 그대로다. 같은 창 안에서만 옮긴다. 탭 줄 넘침(위 "탭 넘침")과 끌기는 앱을 모르는 `features/file-explorer/hooks/use-tab-strip`에 모아, Chrome 탭이 쓰게 되면 shared로 옮긴다 |
  | 폴더 안 검색 | 검색 상자에 넣는 대로 현재 위치와 그 하위 폴더 전체에서 이름으로 찾는다. 휴지통에서는 휴지통에 보낸 항목과 그 안의 항목에서 찾고, 바탕화면에서는 휴지통 안을 뺀다. 결과는 일치 단계 차례이고, 같은 단계 안에서는 폴더·글·외부 링크 차례로 두어 글은 최신순, 폴더와 외부 링크는 이름순이다. 결과는 늘 자세히 보기(이름·수정한 날짜·유형·위치)이고, 위치 열은 `바탕 화면\Blog\React`처럼 항목이 놓인 위치(휴지통 안이면 `휴지통\…`)다. 검색 중에는 열 제목을 눌러도 정렬하지 않고, 자기 창 본문은 끌어 놓을 곳이 아니다. 검색어를 지우거나 다른 위치로 가면 원래 보기로 돌아가고 검색 상자도 빈다. 다른 위치로 가면 검색어를 비우므로 돌아와도 되살아나지 않는다. 검색 중에 새 폴더를 만들면 검색을 끝낸다. 모바일의 검색 버튼(누르면 검색 상자로 바뀜)은 아직 붙이지 않았다 |
  | 일치 규칙 | 이름 일치(포함·초성·단계)는 `shared/utils/name-match`의 순수 함수이고 탐색기 폴더 안 검색과 Start·검색 패널의 검색이 함께 쓴다. 초성 비교는 검색어가 모두 한글 초성(ㄱ~ㅎ 19자)일 때만이고, 이름의 한글 음절을 초성으로 바꿔 비교한다(다른 글자는 그대로) |
  | 디자인 시스템 | `ExplorerAddressRow`에 검색 상자 입력값 `searchValue`를 더했다(쓰는 곳이 위치를 옮기면 비운다). 생김새는 그대로다 |
  | 탐색기 조립 | `ExplorerContent`에 `searchValue`와 본문 전체를 놓을 곳으로 만드는 `dropTarget`, `ExplorerWindow`에 `onTabMove`를 더했다. Parity 그림은 그대로다 |
  | 검색 코드 구조 | 검색어와 고른 항목은 `shared/stores/search-store`, 일치 단계·정렬·묶음·방향키 규칙은 `shared/utils/search-rules`다. 탐색기 폴더 안 검색의 차례 계산도 그 `rankItems`를 쓴다. Start·검색 화면의 데이터는 `features/start-menu`의 훅(`useStartLists`, `useStartSearch`, `useSearchKeyboard`)과 `utils/start-items`가 작업 공간 저장소의 항목에서 만들고, 방향키가 따라갈 결과 id 차례는 `utils/search-order`가 계산한다 |
  | 검색어 | 작업 표시줄 검색칸, Start 위쪽 검색칸, 모바일 검색 패널 입력칸이 검색어 하나를 함께 쓴다. 검색어는 effect가 아니라 패널을 닫거나 다른 패널로 바꾸는 동작(패널 저장소의 `toggleStart`·`openSearch`·`toggleSearch`·`close`)이 지운다. 이미 열린 검색 패널을 다시 여는 것은 지우지 않는다. 다시 시작해도 지운다. 공백만 있으면 검색어가 없는 것으로 본다. 작업 표시줄 검색칸은 검색 패널이 열린 동안에만 검색어를 보이고, Start가 열려 있으면 비워 둔다(Start 위쪽 칸이 같은 검색어를 쓰므로). Esc로 패널을 닫은 뒤 포커스가 검색칸에 남은 채 이어서 입력하면 검색 패널을 다시 열고 그 글자를 검색어로 둔다 |
  | 검색 키보드 | ↑·↓·Enter는 입력칸마다 달지 않고, 패널이 열려 있는 동안 문서에서 `role="searchbox"` 입력칸이 받은 키를 듣는다(작업 표시줄 검색칸은 다른 기능이 그리기 때문이다). 한글 조합 중이거나 메뉴가 열려 있으면 무시한다. 고른 항목은 화면에 보이는 차례(최고 일치, 폴더, 글, 외부 링크)로 움직이고 처음과 끝에서 멈추며, 검색어가 바뀌면 최고 일치로 돌아간다. Esc는 메뉴(전원·보기·고정 항목)가 열려 있으면 그 메뉴만 닫는다 |
  | 검색 결과 | 최고 일치 카드는 고른 항목이 아니라 늘 최고 일치다. 방향키로 고른 항목은 목록 줄에만 선택 바탕을 깔고(`aria-current`) Enter는 고른 항목을 연다. 고른 줄이 보이는 영역 밖이면 `scrollIntoView({ block: 'nearest' })`로 보이게 한다(`ItemListRow`가 고른 줄이 될 때). 줄은 `role="button"`이고 클릭·Enter·Space로 연다(`ItemListRow`, 모두 목록 줄과 같다). 카드의 링크 복사는 글(공유 링크)과 외부 링크(주소)만이다. 같은 단계 안의 차례는 탐색기 폴더 안 검색과 같다 |
  | 입력 전 화면 | 최근은 `recentItemIds`의 앞 5개(휴지통에 들어간 항목 제외), 추천은 휴지통에 없는 최신 글 6개(모바일 3개)다. 처음 방문하면 추천만 보인다 |
  | 항목 열기 | Start 고정됨·모두 목록·검색에서 항목을 열면 바탕화면과 같은 `useOpenItem`(앱 포함)으로 열고 패널을 닫는다 |
  | Start 고정됨 | 고정 칸 우클릭(모바일 길게 누르기) 메뉴는 `Menu/StartTile` 항목이다: 열기, 맨 앞으로 이동(맨 앞 항목은 고를 수 없다), 링크 복사(글·외부 링크만), 시작 화면에서 고정 해제. 맨 앞은 저장한 고정 목록의 첫 자리다(휴지통에 있어 숨은 항목도 순서에 남는다). 끌어서 순서 바꾸기는 데스크톱(마우스 왼쪽 버튼·펜, 4px)만이고 끄는 동안 포인터 아래 칸 자리로 바로 옮긴다(복제본 없음). 끌기 뒤 따라오는 클릭은 항목을 열지 않는다. 모두 목록 줄에는 우클릭 메뉴를 두지 않는다(문서에 정한 메뉴가 없다) |
  | Start 모두 | `보기:` 메뉴는 `Menu/ViewOptions`(확인 표시 항목 셋: 범주, 그리드, 간단히)이고, 고르면 메뉴를 닫고 `setStartAllView`로 저장한다. 이미 고른 보기를 다시 골라도 그대로다. 범주 보기의 묶음 차례는 폴더·글·외부 링크·앱이고, 모두 목록 항목은 앱 둘과 휴지통 밖의 폴더·글·외부 링크다 |
  | 디자인 시스템·조립 | `StartItem`·`SearchItem`·`SearchRecommendedPost`에 항목 id를 더하고 `SearchResultGroups`의 나머지 결과를 이름 대신 항목 배열로 바꿨다(스토리 데이터에 id를 더했다). `StartBody`에 `getPinnedMenuItems`·`onPinnedMove`·`onViewChange`와 결과 없음 변형, `SearchBody`에 `onItemOpen`·`onCopyLink`·`selectedId`, `StartViewMenu`에 `onOpenChange`를 더했다. 동작 prop을 주지 않으면 그림은 그대로고 생김새 변경은 없다(`Desktop/Scene`·`Search/*`·`Start/*`·`Taskbar/*` 조립 30개 변형의 캡처가 바꾸기 전과 바이트까지 같다) |
  | 작업 표시줄 앱 | 그릴 앱은 고정한 앱과 열린 창이 있는 앱의 합이다. 고정한 앱은 저장한 고정 순서대로, 고정하지 않은 실행 중인 앱은 그 뒤에 처음 연 창의 차례로 둔다. 고정을 해제한 앱은 창을 모두 닫으면 사라진다. 앱의 창을 모두 닫으면 그 앱의 창 미리보기 상태도 지워, 그 앱 창을 다시 열 때 미리보기가 저절로 열리지 않는다 |
  | 작업 표시줄 우클릭 메뉴 | 앱 버튼의 우클릭은 `ContextMenuArea`에 `placement`(쪽·끝 맞춤·간격)를 더해 누른 자리가 아니라 버튼에 붙인다. 피그마 `Top-Center`처럼 버튼 위 가운데이고 간격은 `spacing/4`(4px)다. 모바일 길게 누르기는 [[모바일:차이]]대로 누른 자리 근처에 띄운다(`TaskbarAppPreview`의 `isMenuAtPointer`로 `placement`를 넘기지 않는다). `Taskbar/AppMenu` 조립이 쓰는 `MenuButton`(왼쪽 클릭 트리거)은 조립 스토리용으로 그대로 두고, 앱에서는 `TaskbarAppPreview`가 버튼을 `ContextMenuArea`로 감싼다 |
  | 작업 표시줄 우클릭 메뉴 | 항목은 앱 이름(고르면 새 창: 탐색기는 `Blog`, Chrome은 새 탭 페이지), 구분선, 작업 표시줄에 고정 또는 작업 표시줄에서 고정 해제, 창 닫기다. 창이 둘 이상이면 "모든 창 닫기"(그 앱의 열린 창을 모두 닫는다), 창이 없으면 창 닫기를 숨긴다. 고정과 고정 해제의 아이콘은 피그마 `Menu/TaskbarApp`처럼 같은 핀 아이콘이다(Start 고정 메뉴의 고정 해제는 핀 꺼짐 아이콘이다). 메뉴가 열리면 창 미리보기를 닫고, 열려 있는 동안 버튼은 `Rest` 모양 그대로다 |
  | 작업 표시줄 끌기 | 데스크톱에서 고정한 앱 버튼을 마우스 왼쪽 버튼·펜으로 4px 넘게 끌면 포인터 아래 고정 앱 버튼 자리로 바로 옮긴다(Start 고정 칸 끌기와 같은 방식, 복제본 없음). 고정하지 않은 앱 버튼은 끌 수 없고 그 자리로 옮기지도 않는다. 끄는 동안과 끌기 뒤 따라오는 클릭은 미리보기를 열거나 버튼 동작을 하지 않는다. 모바일은 끌기가 없다 |
  | 끌기 훅 | 아이콘 그림의 브라우저 기본 끌기가 시작되면 포인터 이벤트가 취소돼 끌기가 끊겨, 앱 버튼은 `dragstart`를 막는다. 끄는 도중 순서가 바뀌어 버튼 DOM이 옮겨지면 포인터 붙잡기가 풀리므로, `usePointerDrag`는 이동·놓기를 문서에서 받고 붙잡기가 풀렸을 때 요소가 문서에 있으면 다시 붙잡는다(없으면 취소). 같은 훅을 쓰는 바탕화면 아이콘·끄는 사각형·Start 고정 칸·탐색기 탭 끌기도 같다 |
  | 코드 구조 | 작업 표시줄 앱 이름·아이콘(`taskbarApps`)은 `features/taskbar/data/taskbar-apps`로 옮겨 앱 버튼과 메뉴가 함께 쓴다. 그릴 앱과 메뉴 항목 규칙은 `utils/taskbar-app-rules`, 끌 때 놓일 버튼 찾기는 `utils/taskbar-app-drag`다. `TaskbarAppPreview`에 `menuItems`·`isMenuOpen`·`onMenuOpenChange`·`isMenuAtPointer`·`onButtonPointerDown`을 더했다. 주지 않으면 그림은 그대로다 |
