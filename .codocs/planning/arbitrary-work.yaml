  id: arbitrary-work
  name: 임의 작업
  parent:
    - seojaewan 블로그
개요: |
  사람에게 묻지 않고 작업 중에 정한 것과, 작업하며 바꾼 문서를 모아 둔다. 사람이 검토해 그대로 둘지, 되돌릴지, 원래 문서로 옮길지 고른다.
  검토가 끝난 항목은 원래 문서에 반영하거나 되돌리고 여기서 지운다.
  모션 남은 작업(애니메이션 PR → 조립 PR → 모션 클래스 붙이기)의 검토를 마쳐, 지금은 아래 두 가지만 남아 있다.
피그마 수정 중: |
  피그마 수정이 진행 중이다. 고쳐지면 코드와 스토리를 피그마에 맞추고 여기서 지운다.

  | 항목 | 확인할 것 |
  |---|---|
  | 라디오 전체 선택 | `Menu/SortSubmenu`·`ExplorerSortSubmenu`·`ExplorerViewSubmenu`의 라디오 항목이 모두 골라진 모습. 코드는 그대로 그리려고 항목마다 `RadioGroup`을 따로 뒀다 |
  | React 폴더 창 | `Folder=React` 검색 안내 글자가 "Blog 검색"이고, 탐색 창은 Blog가 선택돼 있다 |
  | SnapLayoutMenu Hover | 피그마가 최대화 버튼·첫 칸을 Hover 모양으로 그렸는데 변형에 State가 없어 코드는 Rest다 |
  | ChromeMore 확대/축소 | 아이콘이 돋보기다 |
  | StartTile 고정 해제 | "시작 화면에서 고정 해제"가 고정과 같은 pin 아이콘이다 |
  | 검색 결과 주소 | 두 줄 모두 `react-19-hooks`다 |
  | 미리보기 명령 모음 | Window/Explorer Selection=Single의 명령 모음 자리가 비어 있어, 스토리에서만 `showCommands`를 끄고 그렸다. 피그마를 고치면 이 옵션을 지운다 |
정리 중: |
  - 배경화면 `wallpaper-bloom.png`: 손으로 넣은 파일 항목을 자산 컴포넌트로 바꾸고 WebP 생성으로 정리 중이다.
  - 캡처 도구의 `export *` 문제: 수정 PR 진행 중이다.
