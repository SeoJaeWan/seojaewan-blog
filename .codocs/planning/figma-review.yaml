_codocs:
  id: figma-review
  name: 피그마 작업 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10 검수([[Chrome 검수]], [[바탕화면 검수]], [[작업 표시줄 검수]], [[파일 탐색기 검수]])에서 정한 해결 가운데 피그마 파일, 토큰, 여러 검수가 함께 고치는 컴포넌트를 모은다. 피그마 파일이 하나이고 토큰 PR 브랜치도 `feat/figma-tokens` 하나라 한 세션(피그마 세션)이 맡는다.
  피그마 세션이 이 문서를 기준으로 작업하고, 끝난 항목은 지우고, 마지막 PR에서 이 문서를 지운다.
  아직 코드·문서·피그마는 아무것도 바꾸지 않았다.
세션 사이 약속: |
  다섯 검수 문서가 함께 따르는 약속이다. 네 영역 검수 문서는 이 섹션을 가리키고 자기 문서에만 해당하는 것만 적는다.
  - 세션은 다섯이다. 피그마 세션(이 문서)과 영역 세션 넷(바탕화면, 작업 표시줄, 파일 탐색기, Chrome)이다. 모두 각자 worktree에서 일한다([[Git 작업 규칙:Git 훅]]). 영역 세션 넷은 병렬이고 서로 기다리지 않는다.
  - 피그마 세션이 맡는 것: 피그마 작업 전부(`use_figma`), 토큰 변경 전부와 토큰 PR, 내보내기, 여러 검수가 함께 고치는 컴포넌트 PR의 디자인 시스템 코드, 애니메이션 PR, 창 열기 애니메이션 수정(2번), 재질 문서 수정(3번).
  - 영역 세션이 맡는 것: 자기 영역의 조립 PR, 한 검수만 고치는 컴포넌트 PR, 앱 코드(`apps/web`), 기능 문서.
  - 내보내기: 피그마 세션이 피그마 작업을 모두 끝낸 뒤 사람에게 허락을 받고 한 번에 직접 한다. 단계마다 나눠 내보내지 않는다. `tools/figma-plugin`의 MCP 진입점(`src/mcp-entry.ts`, `src/mcp-tokens.ts`)을 쓴다. 이 진입점은 플러그인 UI와 달리 파일만 만들고 PR을 열지 않으므로, [[피그마 연동:피그마 플러그인]]의 정해진 브랜치 이름으로 브랜치와 PR을 직접 연다. 이 진입점으로 끝까지 내보내 본 적은 아직 없다.
  - 브랜치 이름 꼴(지난 PR에서 확인): 토큰 `feat/figma-tokens`, 컴포넌트 `feat/figma-<컴포넌트 폴더 이름>`(예: `feat/figma-icon-button`), 조립 `feat/figma-patterns-<영역>`(예: `feat/figma-patterns-taskbar`), 애니메이션 `feat/figma-motion-<이름>`.
  - 컴포넌트 PR 담당:

    | 세션 | 컴포넌트 PR |
    |---|---|
    | 피그마 | `IconButton`(`feat/figma-icon-button`), `NavigationItem`(`feat/figma-navigation-item`), `MenuItem`(`feat/figma-menu-item`), `FileRow`(`feat/figma-file-row`) |
    | 바탕화면 | `FileItem`, `RenameField`, 메뉴 단추 줄 부품(새 컴포넌트), `Menu` |
    | 파일 탐색기 | `ColumnHeader`, `Breadcrumb`, `BreadcrumbItem`, `ExplorerCommandBar`, `ExplorerAddressRow`, `ExplorerStatusBar`, `ExplorerTab`, `NavigationPane` |
    | 작업 표시줄 | `WindowPreview`, `SearchBox` |
    | Chrome | `BrowserTab`, `BrowserTabStrip`, `BrowserToolbar`, `AddressBar` |

    표에 없는 컴포넌트는 한 검수만 고치면 그 영역 세션이, 둘 이상이 고치면 피그마 세션이 맡는다. 작업 중에 새로 겹치면 피그마 세션으로 넘기고 두 문서에 적는다.
  - 병렬 원칙: 다른 세션의 PR이 필요한 항목은, 만드는 쪽이 그 부분만 작은 PR로 맨 먼저 병합하고, 쓰는 쪽은 그 항목을 자기 작업 순서의 맨 뒤로 미룬다.
  - 기다리는 방법: 쓰는 쪽은 그 항목 차례가 되면 `gh pr view <브랜치> --json state`로 병합됐는지 확인한다. 아직이면(PR이 아직 없을 때도) 백그라운드로 병합될 때까지 기다린 뒤 `main`을 받아 시작한다. 피그마 세션의 토큰 PR과 컴포넌트 PR을 기다릴 때도 같다.
  - 같은 문서 섹션(예: [[파일 탐색기:우클릭 메뉴]])이나 같은 코드 파일을 여러 세션이 고치면 순서를 정하지 않고, 나중에 병합하는 쪽이 `main`을 받아 맞춘다.
  - 사람에게 묻지 않고 정한 것은 `임의 작업` 문서(`.codocs/planning/arbitrary-work.yaml`)에 세션마다 자기 이름의 섹션 하나에만 적는다.
  - 여러 영역의 그림이 함께 들어오는 조립 PR: 메뉴 조립(`feat/figma-patterns-menu`)에는 바탕화면·파일 탐색기·작업 표시줄·Chrome의 메뉴 그림이, 창 조립(`feat/figma-patterns-window`)에는 Chrome 창과 탐색기 창 그림이 함께 들어온다. 이 두 PR은 피그마 세션이 그림만 담아 병합하고 앱 코드는 넣지 않는다. 메뉴와 창의 앱 코드는 영역 세션이 각자 자기 PR에서 고치고, 캡처 표가 저장소에 들어온 그림과 비교한다([[피그마 연동:PR 흐름]]). 그림만 든 조립 PR이 CI를 통과하는지는 아직 돌려 보지 않았다.
작업 순서: |
  피그마 작업(1번의 변수, 4~13번)을 모두 끝낸 뒤 한 번에 내보내고, 내보낸 PR을 아래 순서로 처리한다. 영역 세션이 기다리는 토큰 PR을 가장 먼저 병합한다.
  1. 토큰 PR(`feat/figma-tokens`): 1·4번의 토큰, 2번의 창 열기 애니메이션 수정, 3번의 문서 수정을 담아 병합한다.
  2. 겹치는 컴포넌트 넷(5~8번): 컴포넌트 PR에서 디자인 시스템 코드를 구현해 병합한다.
  3. 여러 영역의 그림이 든 조립 PR 둘(메뉴, 창): 그림만 담아 병합한다([[피그마 작업 검수:세션 사이 약속]]).
  4. 나머지 컴포넌트 PR과 영역 조립 PR: 열어만 두고, 코드는 담당 영역 세션이 처리한다([[피그마 작업 검수:세션 사이 약속]]).

  시작 전에 작업 범위를 끝까지 점검해 물을 것을 먼저 모은다. 내보내기 전에 사람에게 허락을 받는다.
1. 재질 값: |
  [[바탕화면 검수]], [[작업 표시줄 검수]], [[파일 탐색기 검수]]가 따로 잰 재질 차이를 하나로 합쳤다.
  - 차이(바탕화면 메뉴): Windows 메뉴는 흰색(`#FCFCFC`)이 약 85% 덮인다(Microsoft `AcrylicBackgroundFillColorDefault`의 밝기 불투명도 0.85). 구현은 흰색 50%라 파란 배경 위에서 메뉴 전체가 파랗게 물든다. 픽셀 측정: Windows는 뒤 배경 `rgb(91,103,116)` → 메뉴 `rgb(226,230,234)`(약 85%). 구현은 뒤 배경 `rgb(60,174,254)` → 메뉴 `rgb(134,164,226)`(약 40~50%).
  - 차이(작업 표시줄): 같은 어두운 배경 위에서 실제는 거의 불투명하고 밝은데, 구현은 회색으로 비친다. 작업 표시줄 실제 `#d8e2eb` / 구현 `#b4b9c0`, 메뉴 실제 `#dee4e9` / 구현 `#a2a9ad`, 미리보기 판 실제 `#f5f6f8` / 구현 `#b9bfc5`.
  - 차이(창 제목 줄): Windows 제목 줄은 배경화면 색을 아주 흐리게 머금은 거의 고른 회색(`rgb(214,220,220)`)이고 뒤의 아이콘·창은 비치지 않는다([[파일 탐색기 검수:비교 방법]]의 첫 영상 58초 샘플링). 구현은 배경화면 선과 휴지통 아이콘이 또렷하게 비친다. 흐림이 동작하지 않는 원인은 2번이다.
  - 원인: 실제 아크릴은 루미너시티 층이 밝기를 잡아 주지만 우리는 한 겹이다([[한계:아크릴 일반 섞기]]). 2026-11-09에는 밝은 배경(하늘)에서 값을 맞춰, 어두운 배경에서 크게 어두워진다. 이 측정은 [[디자인 기반:재질 효과]]의 11-09 결정, [[한계:아크릴 일반 섞기]]의 "플라이아웃은 나란히 놓으면 비슷하다"와 엇갈린다. 미카의 11-09 시험은 흐림이 동작하지 않던 상태였다(2번).
  - 시험(아크릴): 같은 영상 배경에서 Start 검색 띠(하늘), Start 본문·아래 띠(어두운 배경), 메뉴를 불투명도 60·75·85%로 비교했다. 셸 아크릴은 75%에서 어두운 배경 오차가 30~36에서 약 7로 줄고 하늘 앞은 약 8 더 하얘진다. 플라이아웃은 85%가 실제와 거의 같다.
  - 시험(미카, 애니메이션을 끈 상태): 지금 값(회색 60% + 20px)은 파란색이 진하게 묻는다. 밝은 회색 85% + 30px이 실제와 가장 가까웠다.
  - 정한 해결: 피그마 Material 변수 값만 바꾸고 구조는 그대로 둔다. 토큰 PR로 반영한다.

    | 재질 | 코드 변수 | 지금 | 바꿀 값 |
    |---|---|---|---|
    | 플라이아웃 | `--material-acrylic-default` | 흰색 50% | 흰색 85% |
    | 셸 아크릴 | `--material-acrylic-base` | 흰색 60% | 흰색 75% |
    | 미카 | `--material-mica-base`, 흐림 | 회색 60%, 20px | 밝은 회색 약 85%, 30px. 색은 실제 `214,220,220`에 맞춰 피그마에서 조정한다 |

  - 플라이아웃 토큰은 툴팁·스냅 레이아웃·시작 메뉴 폴더·스크롤바도 써서 함께 바뀐다(Windows도 같은 재질이다).
  - 배경화면 이미지를 Mica에 까는 방식은 쓰지 않는다.
  - 고르지 않은 값: 플라이아웃 색 `#FCFCFC`는 85%로 덮으면 흰색과 차이가 3 이하라, 이미 있는 흰색 계열을 쓴다. 셸 아크릴 "`#F3F3F3` 약 90%"는 바탕화면 검수에서 Microsoft 값을 보고 적은 추측이고 시험하지 않아, 시험한 75%를 쓴다.
  - 한계: 실제의 푸른 기는 한 겹 흰색으로 어느 값에서도 나오지 않아 한계로 둔다.
  - 확인할 것: 바꾸기 전에 2026-11-09 시험이 어떤 배경과 값으로 했는지 확인한다.
2. 창 열기 애니메이션: |
  - 원인(시험으로 확인): 창 열기 애니메이션(`motion-window-open`)이 `animation-fill-mode: both`로 끝난 뒤에도 남아, 창이 배경 흐림의 기준(backdrop root)이 된다. 그래서 창 안의 `backdrop-filter`가 아무것도 흐리지 못하고 반투명만 남는다. 흐림 0·20·80px이 똑같았고, 애니메이션을 끄자 흐려졌다(Playwright와 앱 브라우저 창 모두).
  - 정한 해결: 창 열기 애니메이션이 끝난 뒤 효과가 남지 않게 한다(`fill-mode` 조정이나 끝나면 클래스 제거). 다른 창 모션도 같은 문제인지 작업 때 확인한다.
  - 토큰 작업과 함께 한다. 고친 뒤 1번의 새 재질 값을 창 안 메뉴(탐색기 우클릭 메뉴, Chrome ⋮ 메뉴)와 창 제목 줄에서 실제 영상과 다시 비교한다.
  - 1번의 바탕화면 메뉴·작업 표시줄·작업 표시줄 메뉴·미리보기 측정은 창 밖이라 이 문제와 상관없다고 코드를 읽고 판단했다. 화면으로 다시 재지는 않았다.
3. 재질 문서 수정: |
  재질 문서는 피그마 세션만 고친다. 토큰 PR과 함께 한다.
  - [[디자인 기반:재질 효과]]: 값의 근거(2026-11-09 시험)를 이번 측정으로 고친다.
  - [[한계:아크릴 일반 섞기]]: 시험 날짜와 영향 문장을 이번 측정으로 고친다.
  - [[한계:마이카 일반 섞기]]: 2026-11-09 시험은 흐림이 동작하지 않던 상태였다는 것과 새 값을 적는다.
  - [[바탕화면:배경화면]]: "같은 이미지를 창의 Mica 효과에도 쓴다" 줄을 지운다. [[피그마 연동:재질 구현]]과 코드는 뒤를 흐리는 방식이라 문서와 맞지 않았다.
  - [[남은 작업:8. 피그마 마무리]]: "미카 흐림 값(20과 60 중)은 이때 그림으로 정한다" 줄을 30px 결정에 맞게 고치고, "내보내기는 사람이 누른다"를 이번 내보내기 방식([[피그마 작업 검수:세션 사이 약속]])에 맞게 고친다.
4. 그 밖의 토큰: |
  재질(1번)과 함께 토큰 PR 하나로 반영한다.
  - 작업 표시줄 메뉴 폭 `size/menu/taskbar-width`(294px)를 Foundations에 더한다([[작업 표시줄 검수:4. 작업 표시줄 메뉴 너비]]).
  - 포커스 없는 선택의 회색 바탕·테두리 색 변수를 더한다([[바탕화면 검수:13. 포커스가 없는 선택은 회색]]). `FileItem`·`FileRow`·`NavigationItem`이 함께 쓴다.
  - 자세히 보기 행 전용 높이 토큰(28px)을 더한다(5번).
  - 행 전용 너비 변수(`file-row-*-width`)를 지운다(5번). 이름이 지워지는 토큰이라 옛 이름을 쓰는 코드를 같은 PR에서 고친다([[피그마 연동:PR 흐름]]).
5. FileRow: |
  [[파일 탐색기 검수]]의 자세히 보기 행 항목 둘과 [[바탕화면 검수]]의 선택 상태가 `FileRow` 컴포넌트 PR 하나(`feat/figma-file-row`)에 함께 들어와 피그마 세션이 맡는다.
  - 행 높이와 선택 범위
    - 차이: Windows 행 간격은 28px이고, 선택·hover 바탕이 마지막 열 오른쪽 끝까지만 칠해진다. 구현은 `h-size-control-height`(32px)이고 창 너비 끝까지 칠한다.
    - 정한 해결: 행 전용 높이 토큰(28px)을 두고, 행 너비를 열 너비의 합에 맞춘다(`inline-flex w-fit`). 피그마 `FileRow` 높이와 토큰을 먼저 바꾼다.
    - 확인할 것은 [[파일 탐색기 검수:5. 자세히 보기 행의 빈 오른쪽]]에 있다.
  - 열 값과 열 제목의 어긋남
    - 차이: 구현은 `수정한 날짜`·`유형` 값이 열 제목 글자보다 8px 왼쪽에서 시작한다. Windows는 같은 x에서 시작한다([[파일 탐색기 검수:비교 방법]]의 셋째 영상 15.5초).
    - 원인: 열 제목(`ColumnHeader`, `details-header-*-width` 316·188·148, 안쪽 여백 8)과 행(`FileRow`, `file-row-*-width` 300·180·140, 칸 사이 간격 8, 칸 안쪽 여백 없음)이 열 너비를 다른 토큰으로 들고 있다.
    - 정한 해결: 행의 칸도 열 제목과 같은 너비 토큰과 같은 안쪽 여백(`px-spacing-sm`)을 쓰고 칸 사이 간격을 없앤다. 행 전용 너비 토큰(`file-row-*-width`)은 지운다. 피그마 `FileRow`가 열 제목 너비 변수를 쓰게 바꾸고 행 전용 너비 변수를 지운다(토큰 PR, 4번).
  - 선택 상태: 현재 항목 테두리와 포커스 없는 선택을 더한다. 규칙은 [[바탕화면 검수:12. 탐색기 항목의 포커스 테두리]], [[바탕화면 검수:13. 포커스가 없는 선택은 회색]]에 있다.
6. IconButton: |
  세 검수의 변경이 `IconButton` 컴포넌트 PR 하나(`feat/figma-icon-button`)에 함께 들어와 피그마 세션이 맡는다. 결정은 원래 섹션에 있다.
  - `Variant=Chrome`의 반지름을 원형으로: [[Chrome 검수:2. 새 탭(+) 버튼 호버 모양]]
  - 켜짐 상태(없으면 더한다): [[파일 탐색기 검수:11. 상태 표시줄]]
  - 주소창 편집의 `×` 버튼(이름 `지우기`): [[파일 탐색기 검수:8. 주소창 편집 모양과 글자 크기]]. 새 변형이 필요한지 피그마 구조를 보고 정한다.
  - 미리보기 닫기 버튼의 빨강 호버: [[작업 표시줄 검수:5. 미리보기 카드 호버와 닫기 버튼]]. `IconButton`에 빨강 변형을 더할지 `CaptionButton`을 쓸지는 피그마 구조를 보고 피그마 세션이 정한다. `CaptionButton`을 쓰면 이 PR에서 빠진다.
7. NavigationItem: |
  두 검수의 변경이 `NavigationItem` 컴포넌트 PR 하나(`feat/figma-navigation-item`)에 함께 들어와 피그마 세션이 맡는다.
  - 포커스 없는 선택과 현재 칸 상태, 브라우저 기본 외곽선 지우기: [[파일 탐색기 검수:4. 탐색 창의 선택과 포커스]]. 색 변수는 4번의 것을 쓴다.
  - 즐겨찾기 항목의 오른쪽 압정 아이콘: [[파일 탐색기 검수:14. 즐겨찾기]]
8. MenuItem: |
  두 검수의 변경이 `MenuItem` 컴포넌트 PR 하나(`feat/figma-menu-item`)에 함께 들어와 피그마 세션이 맡는다.
  - `Radio on/off`·`Toggle on/off` 변형에 아이콘·단축키 자리를 더한다. 코드 타입(`MenuPopupRadioOption`, `MenuPopupCheckbox`)에도 자리를 더한다: [[바탕화면 검수:7. 보기 하위 메뉴의 아이콘과 단축키]]
  - 점프 목록 항목의 호버 때 오른쪽 끝 압정 해제 버튼: [[작업 표시줄 검수:9. 탐색기 점프 목록]]. `MenuItem` 변형으로 그릴지 조립에서 그릴지는 피그마 구조를 보고 정한다.
9. Chrome 피그마 작업: |
  결정은 [[Chrome 검수]]의 각 섹션에 있다. 여기는 피그마에서 할 일만 모은다. 컴포넌트 PR의 코드는 Chrome 세션이 처리한다(`IconButton`은 6번).
  - `BrowserTab` `State=Active`의 아래 양옆, 탭 밖에 오목한 모서리 조각 두 개를 그린다: [[Chrome 검수:1. 활성 탭 아래 모서리 곡선]]
  - Material Symbols 아이콘을 Assets에 더하고(13번) `BrowserToolbar`(뒤로·앞으로·새로고침·⋮), `BrowserTabStrip`(+), `BrowserTab`(×)의 아이콘 자리를 바꿔 끼운다: [[Chrome 검수:3. 아이콘 선 두께]]
  - `BrowserToolbar`에 아래쪽 1px 안쪽 선을 넣는다: [[Chrome 검수:4. 도구 모음 아래 구분선]]
  - `AddressBar` `Suggesting`의 바탕·그림자를 없애고, 조립 `Chrome/AddressSuggestions`의 열린 모습을 Flyout 한 장이 입력 줄까지 감싸는 그림으로 그린다: [[Chrome 검수:5. 주소창 추천 목록 모양]]
  - `AddressBar`에 글자 속성 `Placeholder`를 열고 주소가 빈 모양(돋보기 + 흐린 안내 문구)을 그린다: [[Chrome 검수:6. 새 탭에서 빈 주소창]]
  - `BrowserTabStrip` 왼쪽에 `IconButton` `Variant=Chrome`(Material Symbols `keyboard_arrow_down`)을 두고 `Menu/ChromeTabSearch` 조립을 그린다: [[Chrome 검수:7. 탭 검색(⌄) 버튼]]
  - `Window/Chrome` 조립의 탭 `Favicon`과 추천 줄 아이콘을 Material Symbols `description`으로 바꿔 끼운다: [[Chrome 검수:8. 탭 파비콘]]
10. 바탕화면 피그마 작업: |
  결정은 [[바탕화면 검수]]의 각 섹션에 있다. 컴포넌트 PR의 코드는 바탕화면 세션이 처리한다(`MenuItem`은 8번, `FileRow`는 5번).
  - `RenameField`는 짧은 이름만 그려 고칠 것이 없다고 보지만 작업 때 확인한다: [[바탕화면 검수:1. 이름 바꾸기 입력창의 줄 바꿈]]
  - 단추 줄 부품(아이콘 + 아래 글자 단추, 툴팁)을 새로 그리고 메뉴 조립(`Menu/Folder·Post·Link·…`)에 위·아래 두 배치로 넣는다: [[바탕화면 검수:5. 아이콘 메뉴의 단추 줄]]. 붙여넣기 단추가 있는 빈 곳 메뉴도 그린다: [[바탕화면 검수:10. 붙여넣기 표시]]
  - 바탕화면·탐색기 보기 하위 메뉴에 Windows 아이콘과 단축키를 넣는다: [[바탕화면 검수:7. 보기 하위 메뉴의 아이콘과 단축키]]
  - `Menu/NewSubmenu`와 빈 곳 메뉴 조립의 아이콘을 바꾼다(`새로 만들기`는 `add_circle`, `폴더`는 `images/file-folder`). 위 두 줄의 메뉴 작업과 한 번에 한다: [[바탕화면 검수:8. 새로 만들기와 폴더 아이콘]]
  - `FileItem`에 현재 항목 테두리와 "포커스 없는 선택" 상태를 더한다: [[바탕화면 검수:12. 탐색기 항목의 포커스 테두리]], [[바탕화면 검수:13. 포커스가 없는 선택은 회색]]
11. 작업 표시줄 피그마 작업: |
  결정은 [[작업 표시줄 검수]]의 각 섹션에 있다. 컴포넌트 PR의 코드는 작업 표시줄 세션이 처리한다(`IconButton`은 6번, `MenuItem`은 8번).
  - `Menu/TaskbarApp`의 앱 이름 아래 구분선을 뺀다: [[작업 표시줄 검수:2. 앱 우클릭 메뉴 구분선]]
  - 작업 표시줄 메뉴 조립(앱 메뉴·점프 목록)이 `size/menu/taskbar-width`를 쓰게 한다: [[작업 표시줄 검수:4. 작업 표시줄 메뉴 너비]]
  - `WindowPreview`의 Hover를 `color/white/70` 덧칠로, 닫기 버튼을 빨강 호버로 바꾼다: [[작업 표시줄 검수:5. 미리보기 카드 호버와 닫기 버튼]]
  - `WindowPreview`의 카드 폭을 창 비율에 맞추고 축소 화면 칸의 바탕·테두리·둥글기를 뺀다: [[작업 표시줄 검수:6. 미리보기 카드 폭과 축소 화면]]
  - 로고 자산 프레임을 여백 없이 줄이고(13번), 재부팅 화면 로고는 인스턴스 크기를 줄여 지금 보이는 크기를 지킨다. `SearchBox` taskbar 변형의 아이콘·색·왼쪽 여백을 바꾼다: [[작업 표시줄 검수:8. 시작 로고와 검색 돋보기]]
  - 탐색기 점프 목록 메뉴 조립을 그린다: [[작업 표시줄 검수:9. 탐색기 점프 목록]]
  - Chrome 점프 목록 메뉴 조립을 그린다: [[작업 표시줄 검수:10. Chrome 점프 목록과 앱 이름]]
12. 파일 탐색기 피그마 작업: |
  결정은 [[파일 탐색기 검수]]의 각 섹션에 있다. 컴포넌트 PR의 코드는 파일 탐색기 세션이 처리한다(`NavigationItem`은 7번, `FileRow`는 5번, `IconButton`은 6번).
  - `ColumnHeader`의 정렬 화살표를 칸 위쪽 가운데로 옮긴다: [[파일 탐색기 검수:7. 정렬 화살표 위치]]
  - `Breadcrumb`(`State=Editing` 포함)·`BreadcrumbItem`의 글자 스타일을 `type-body`로 바꾸고, 편집 모양에서 아이콘을 빼고 `×`를 넣는다: [[파일 탐색기 검수:8. 주소창 편집 모양과 글자 크기]]
  - 경로 꺾쇠 목록은 원래 검수에 피그마 작업이 적혀 있지 않다. 꺾쇠 버튼(`>`·`⌄`)과 목록 조립을 그려야 하는지 작업 때 확인한다: [[파일 탐색기 검수:9. 경로 꺾쇠 목록]]
  - `ExplorerCommandBar`(`정렬`·`보기`에 꺾쇠, `새로 만들기` 아이콘)와 `ExplorerAddressRow`(아래 1px 구분선)를 바꾼다: [[파일 탐색기 검수:10. 명령 버튼 모양과 주소 줄 구분선]]
  - `ExplorerStatusBar`의 보기 버튼 아이콘을 바꾸고 켜짐 모습을 그린다: [[파일 탐색기 검수:11. 상태 표시줄]]
  - `ExplorerTab` 선택의 바탕을 불투명으로 바꾼다: [[파일 탐색기 검수:13. 고른 탭과 바탕 화면 아이콘]]
  - 탐색 창 즐겨찾기 조립과 끌기 툴팁("즐겨찾기에 고정")을 그린다: [[파일 탐색기 검수:14. 즐겨찾기]]
13. 자산: |
  피그마 Assets에 더하거나 고쳐 내보낼 자산이다. 같은 자산을 두 PR이 더해도 같은 바이트라 충돌하지 않는다([[피그마 연동:피그마 플러그인]]).
  - Material Symbols(Apache 2.0): Chrome 창 안의 아이콘. 뒤로·앞으로·새로고침·⋮·+·×와 돋보기, `keyboard_arrow_down`, `description`이다([[Chrome 검수:3. 아이콘 선 두께]]).
  - Fluent `ic_fluent_add_circle_20_regular`: [[바탕화면 검수:8. 새로 만들기와 폴더 아이콘]]이 주인이고 탐색기 명령 모음도 쓴다.
  - 상태 표시줄 보기 아이콘(Fluent 후보 `text_align_justify`, `square`, 자산 유무는 작업 때 확인): [[파일 탐색기 검수:11. 상태 표시줄]]
  - 보기 하위 메뉴의 Windows 아이콘: [[바탕화면 검수:7. 보기 하위 메뉴의 아이콘과 단축키]]
  - Windows 로고(`logo-windows.svg`) 프레임을 여백 없이 줄여 다시 내보낸다: [[작업 표시줄 검수:8. 시작 로고와 검색 돋보기]]
  - `ic_fluent_search_16_filled`: [[작업 표시줄 검수:8. 시작 로고와 검색 돋보기]]
