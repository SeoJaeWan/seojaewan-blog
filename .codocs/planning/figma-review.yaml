_codocs:
  id: figma-review
  name: 피그마 작업 검수
  parent:
    - seojaewan 블로그
개요: |
  2026-11-10 검수([[Chrome 검수]], [[바탕화면 검수]], 작업 표시줄 검수(끝나 지웠다), [[파일 탐색기 검수]])에서 정한 해결 가운데 피그마 파일, 토큰, 여러 검수가 함께 고치는 컴포넌트를 모은다. 피그마 파일이 하나이고 토큰 PR 브랜치도 `feat/figma-tokens` 하나라 한 세션(피그마 세션)이 맡았다.
  피그마 작업, 토큰 PR(#900), 겹치는 컴포넌트 넷(#872, #877, #879, #882), 메뉴·창 조립 그림(#895, #897)은 끝났다. 남은 것은 영역 세션이 처리하는 컴포넌트·조립 PR이다. 영역 세션이 모두 끝나면 이 문서를 지우고, 다른 검수 문서의 링크를 함께 정리한다.
  스스로 정한 것은 [[임의 작업:피그마 세션]]에 있다.
세션 사이 약속: |
  다섯 검수 문서가 함께 따르는 약속이다. 네 영역 검수 문서는 이 섹션을 가리키고 자기 문서에만 해당하는 것만 적는다.
  - 세션은 다섯이다. 피그마 세션(이 문서)과 영역 세션 넷(바탕화면, 작업 표시줄, 파일 탐색기, Chrome)이다. 모두 각자 worktree에서 일한다([[Git 작업 규칙:Git 훅]]). 영역 세션 넷은 병렬이고 서로 기다리지 않는다.
  - 피그마 세션이 맡는 것: 피그마 작업 전부(`use_figma`), 토큰 변경 전부와 토큰 PR, 내보내기, 여러 검수가 함께 고치는 컴포넌트 PR의 디자인 시스템 코드, 애니메이션 PR, 창 열기 애니메이션 수정(2번), 재질 문서 수정(3번).
  - 영역 세션이 맡는 것: 자기 영역의 조립 PR, 한 검수만 고치는 컴포넌트 PR, 앱 코드(`apps/web`), 기능 문서.
  - 내보내기: 피그마 세션이 피그마 작업을 모두 끝낸 뒤 사람에게 허락을 받고 한 번에 직접 한다. 단계마다 나눠 내보내지 않는다. `tools/figma-plugin`의 MCP 진입점(`src/mcp-entry.ts`, `src/mcp-tokens.ts`)을 쓴다. 이 진입점은 플러그인 UI와 달리 파일만 만들고 PR을 열지 않으므로, [[피그마 연동:피그마 플러그인]]의 정해진 브랜치 이름으로 브랜치와 PR을 직접 연다. 이 진입점으로 끝까지 내보내 본 적은 아직 없다.
  - 브랜치 이름 꼴(지난 PR에서 확인): 토큰 `feat/figma-tokens`, 컴포넌트 `feat/figma-<컴포넌트 폴더 이름>`(예: `feat/figma-icon-button`), 조립 `feat/figma-patterns-<영역>`(예: `feat/figma-patterns-taskbar`), 애니메이션 `feat/figma-motion-<이름>`.
  - 컴포넌트 PR 담당:

    | 세션 | 컴포넌트 PR |
    |---|---|
    | 피그마 | `IconButton`(`feat/figma-icon-button`), `NavigationItem`(`feat/figma-navigation-item`), `MenuItem`(`feat/figma-menu-item`), `FileRow`(`feat/figma-file-row`) |
    | 바탕화면 | `FileItem`, `RenameField`, 메뉴 단추 줄 부품(새 컴포넌트), `Menu` |
    | 파일 탐색기 | `ColumnHeader`, `Breadcrumb`, `BreadcrumbItem`, `ExplorerCommandBar`, `ExplorerAddressRow`, `ExplorerStatusBar`, `ExplorerTab`, `NavigationPane` |
    | 작업 표시줄 | `WindowPreview`, `SearchBox` |
    | Chrome | `BrowserTab`, `BrowserTabStrip`, `BrowserToolbar`, `AddressBar` |

    표에 없는 컴포넌트는 한 검수만 고치면 그 영역 세션이, 둘 이상이 고치면 피그마 세션이 맡는다. 작업 중에 새로 겹치면 피그마 세션으로 넘기고 두 문서에 적는다.
  - 병렬 원칙: 다른 세션의 PR이 필요한 항목은, 만드는 쪽이 그 부분만 작은 PR로 맨 먼저 병합하고, 쓰는 쪽은 그 항목을 자기 작업 순서의 맨 뒤로 미룬다.
  - 기다리는 방법: 쓰는 쪽은 그 항목 차례가 되면 `gh pr view <브랜치> --json state`로 병합됐는지 확인한다. 아직이면(PR이 아직 없을 때도) 백그라운드로 병합될 때까지 기다린 뒤 `main`을 받아 시작한다. 피그마 세션의 토큰 PR과 컴포넌트 PR을 기다릴 때도 같다.
  - 같은 문서 섹션(예: [[파일 탐색기:우클릭 메뉴]])이나 같은 코드 파일을 여러 세션이 고치면 순서를 정하지 않고, 나중에 병합하는 쪽이 `main`을 받아 맞춘다.
  - 사람에게 묻지 않고 정한 것은 `임의 작업` 문서(`.codocs/planning/arbitrary-work.yaml`)에 세션마다 자기 이름의 섹션 하나에만 적는다.
  - 여러 영역의 그림이 함께 들어오는 조립 PR: 메뉴 조립(`feat/figma-patterns-menu`)에는 바탕화면·파일 탐색기·작업 표시줄·Chrome의 메뉴 그림이, 창 조립(`feat/figma-patterns-window`)에는 Chrome 창과 탐색기 창 그림이 함께 들어온다. 이 두 PR은 피그마 세션이 그림만 담아 병합하고 앱 코드는 넣지 않는다. 메뉴와 창의 앱 코드는 영역 세션이 각자 자기 PR에서 고치고, 캡처 표가 저장소에 들어온 그림과 비교한다([[피그마 연동:PR 흐름]]). 그림만 든 조립 PR이 CI를 통과하는지는 아직 돌려 보지 않았다.
작업 순서: |
  피그마 작업(1번의 변수, 4~13번)을 모두 끝낸 뒤 한 번에 내보내고, 내보낸 PR을 아래 순서로 처리한다. 영역 세션이 기다리는 토큰 PR을 가장 먼저 병합한다.
  1. 토큰 PR(`feat/figma-tokens`): 1·4번의 토큰, 2번의 창 열기 애니메이션 수정, 3번의 문서 수정을 담아 병합한다.
  2. 겹치는 컴포넌트 넷(5~8번): 컴포넌트 PR에서 디자인 시스템 코드를 구현해 병합한다.
  3. 여러 영역의 그림이 든 조립 PR 둘(메뉴, 창): 그림만 담아 병합한다([[피그마 작업 검수:세션 사이 약속]]).
  4. 나머지 컴포넌트 PR과 영역 조립 PR: 열어만 두고, 코드는 담당 영역 세션이 처리한다([[피그마 작업 검수:세션 사이 약속]]).

  시작 전에 작업 범위를 끝까지 점검해 물을 것을 먼저 모은다. 내보내기 전에 사람에게 허락을 받는다.
1. 재질 값: |
  끝남(#900). 플라이아웃·셸 아크릴·미카의 바탕색과 미카 흐림을 2026-11-10 측정에 맞춰 피그마 Material 변수·스타일에 반영했다. 근거는 [[디자인 기반:재질 효과]], [[한계:아크릴 일반 섞기]], [[한계:마이카 일반 섞기]]에 있다.
2. 창 열기 애니메이션: |
  끝남(#900). 창 열기·복원 모션 클래스는 presence가 `entered`가 되면, 스냅 FLIP 클래스는 `animationend`에서 뗀다. 앱 Storybook에서 창이 열린 뒤와 최대화 뒤에 창 안 `backdrop-filter`가 실제로 흐리는 것을 확인했다(흐림을 끈 화면과 픽셀이 달라짐). 다른 창 모션(닫기·최소화)은 끝나면 창이 사라지거나 숨겨져 상관없다.
  - 남은 것: 새 재질 값을 앱 화면의 창 안 메뉴·제목 줄과 실제 영상에 나란히 놓고 다시 비교하는 일은 하지 않았다. 미카 층 색은 영상의 제목 줄 색에서 계산했다.
3. 재질 문서 수정: |
  끝남(#900). [[디자인 기반:재질 효과]], [[디자인 기반:검토한 대안]], [[한계:아크릴 일반 섞기]], [[한계:마이카 일반 섞기]], [[바탕화면:배경화면]], [[남은 작업:8. 피그마 마무리]]를 고쳤다.
4. 그 밖의 토큰: |
  끝남(#900). `size/menu/taskbar-width`(294), 포커스 없는 선택 색(`color/gray/13` 바탕, `color/gray/39` 테두리), `size/file-row/height`(28)를 더하고 `size/file-row/*-width`를 지웠다.
5. FileRow: |
  끝남(피그마, #882). 행 높이 28, 열 제목 너비 토큰과 칸 안쪽 여백, 행 너비는 열 합, `isCurrent`와 포커스 없는 선택을 그린다. 포커스 유무는 [[바탕화면 검수:13. 포커스가 없는 선택은 회색]]대로 목록 role로 고른다. 앱에서 `isCurrent`를 넘기고 행 너비를 덮는 `w-full`을 빼는 일, [[파일 탐색기 검수:5. 자세히 보기 행의 빈 오른쪽]]의 확인은 영역 세션 몫이다.
6. IconButton: |
  끝남(피그마, #872). `Variant=Chrome`은 원형, 켜짐은 `isChecked`(`aria-pressed`), 미리보기 닫기의 빨강 호버는 `variant="close"`로 더했다(`CaptionButton`은 쓰지 않는다). 주소창 편집 `×`는 Subtle을 그대로 쓴다.
7. NavigationItem: |
  끝남(피그마, #879). 포커스 없는 선택과 현재 칸(`isCurrent`), 즐겨찾기 압정(`hasPin`)을 더하고 브라우저 기본 외곽선을 지웠다. 포커스 유무는 [[파일 탐색기 검수:4. 탐색 창의 선택과 포커스]]대로 트리 role로 고른다.
8. MenuItem: |
  끝남(피그마, #877). Radio·Toggle 변형과 코드 타입(`MenuPopupRadioOption`, `MenuPopupCheckbox`)에 아이콘·단축키 자리를 더했다. 점프 목록 압정 해제 버튼은 MenuItem을 바꾸지 않고 조립에서 그렸다.
9. Chrome 피그마 작업: |
  피그마 작업 끝남. 내보낸 PR: `BrowserTab`(#884), `AddressBar`(#885), `BrowserTabStrip`(#892), `BrowserToolbar`(#893), 조립 Chrome(#896)·Window(#897)·Menu(#895, `Menu/ChromeTabSearch`). 코드는 Chrome 세션이 처리한다.
10. 바탕화면 피그마 작업: |
  피그마 작업 끝남. 내보낸 PR: `FileItem`(#881), `MenuCommandButton`(#875), `MenuCommandBar`(#876), 조립 Menu(#895). 코드는 바탕화면 세션이 처리한다.
11. 작업 표시줄 피그마 작업: |
  피그마 작업 끝남. 내보낸 PR: `WindowPreview`(#878), `SearchBox`(#874), `Taskbar`(#886), `BootScreen`(#894, Windows 로고 자산), 조립 Taskbar(#898)·Menu(#895, 앱 메뉴·점프 목록). 코드는 작업 표시줄 세션이 처리한다.
12. 파일 탐색기 피그마 작업: |
  피그마 작업 끝남. 내보낸 PR: `ExplorerTab`(#880), `ColumnHeader`(#883), `ExplorerAddressRow`(#887), `Breadcrumb`(#888), `BreadcrumbItem`(#889), `BreadcrumbChevron`(#890, 새 컴포넌트), `ExplorerStatusBar`(#891), `DropDownButton`(#873), 조립 Explorer(#899)·Window(#897). 코드는 파일 탐색기 세션이 처리한다.
13. 자산: |
  끝남. Material Symbols(`ic_material_<이름>_20_outlined`), Fluent `add_circle_20_regular`·`search_16_filled`·`laptop_20/16_regular`·`line_horizontal_4_20_regular`, 여러 색 자산 `icon-color/Auto Arrange`, Shapes `browser-tab/Corner left`·`right`를 더하고 `logo/Windows` 프레임을 여백 없이 줄였다. 자산 파일은 그것을 쓰는 컴포넌트·조립 PR에 들어 있다.
