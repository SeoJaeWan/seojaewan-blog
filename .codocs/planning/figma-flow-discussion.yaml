_codocs:
  id: figma-flow-discussion
  name: 피그마 흐름 논의
  parent:
    - seojaewan 블로그
개요: |
  피그마에서 코드로 가는 흐름(내보내기, 생성 파일, 확인 방법)을 다시 정하는 논의의 준비 자료다. 2026-11-11 CI 논의에서 피그마 쪽은 따로 길게 논의하기로 하고 미뤘다.
  이 문서는 그 논의를 맡는 세션이 처음부터 다시 조사하지 않게, 이미 정한 것, 미룬 것, 그때 확인한 사실을 모은다. 논의가 끝나 [[피그마 연동]]과 관련 문서에 반영하면 이 문서를 지운다.
  논의는 아래 "논의할 것"의 순서대로 하나씩 한다.
이미 정한 것: |
  2026-11-11에 정했고 CI 작업에서 처리한다. 다시 논의하지 않는다.
  - 피그마 관련 워크플로 넷(`figma-parity.yml`, `parity-report-cleanup.yml`, `figma-generated.yml`, `motion-check.yml`)을 지운다. 피그마 쪽 CI는 흐름을 다시 정한 뒤에 필요한 것만 새로 둔다.
  - 피그마 그림과 코드 그림을 픽셀로 비교하는 캡처(CI 캡처 표, 스킬의 로컬 캡처, `tools/figma-parity`의 캡처 코드)를 지운다. 피그마와 브라우저의 그리는 엔진이 달라 같아 보이는 것도 픽셀로는 다르게 나와서 비교가 쓸모 있는 판정이 되지 못했고, 캡처 도구 자체의 문제도 여러 세션에서 자주 났다.
  - 지우지 않는 것: 플러그인이 내보내는 PNG와 `export.json`, `Figma` 스토리, 스토리의 `data-parity-target`·`data-parity-hover` 속성, `tools/figma-parity`의 모션 검사 코드, 로컬 생성 스크립트(`generate:tokens`, `generate:assets`).
  - 그래서 지금은 컴포넌트 모습이 피그마와 같은지 기계가 확인하는 장치가 없다. 토큰·자산 생성 확인(`--check`)과 모션 시간 검사도 CI에서 돌지 않고 로컬(스킬)에서만 돈다.
논의할 것: |
  1. 피그마와 코드의 모습을 어떻게 비교할지. 내보내기 방식부터 다시 본다(아래 "모습 비교").
  2. 자산의 원본과 생성 파일(아래 "자산").
  3. 토큰 생성 파일을 커밋할지(아래 "토큰 생성 파일").
  4. 생성 확인과 모션 검사를 어디서 돌릴지(아래 "확인을 돌리는 자리").
  5. 플러그인이 여는 PR의 changeset(아래 "플러그인 PR의 changeset").
  6. 정해 둔 플러그인 수정 둘의 작업(아래 "정해 둔 플러그인 수정").
  7. 남은 흔적 정리(아래 "남은 흔적").
모습 비교: |
  정할 것은 피그마와 코드가 같은 모습인지 무엇으로 확인할지다. 픽셀 비교는 버렸으므로 다른 기준이 필요하다.
  - 사람이 한 말: 이미지 비교는 엔진 차이 때문에 의미 있는 결과가 되지 못한다. 그래서 피그마의 내보내기 방식을 근본부터 다시 고민한다.
  - 후보로 나온 것은 없다. 그림 대신 값(크기, 간격, 색, 글자 속성)을 내보내 코드의 계산된 값과 비교하는 방향을 포함해 처음부터 본다.
  - 함께 정할 것: `Figma` 스토리와 `data-parity-*` 속성을 계속 둘지, 플러그인이 PNG를 계속 내보낼지(저장소에 PNG 591개 약 9.9MB, 가장 큰 것 1.56MB), 코드만 바꾼 PR의 모습 회귀를 누가 볼지, 화면 단위 검증([[미결 사항:화면 단위 시각 검증]]).
자산: |
  사람의 방향: 원본(SVG, PNG)을 하나의 신뢰 파일로 보고, 원본 폴더(`figma/assets/`)를 따로 두지 않고 `src/assets/`로 합친다. 생성 파일이 저장소에 없으면 "커밋된 것과 다시 만든 것이 같은가"를 볼 일도 없다.
  확인한 사실:
  - 지금 생성기(`packages/design-system/scripts/assets/`)가 하는 일은 둘이다. SVG를 `Asset` 컴포넌트가 그릴 데이터(`src/assets/asset-data.ts`, 39KB)로 풀고, 래스터 원본(PNG·JPEG 11개, 1.8MB)을 WebP(346KB)로 줄이며 가로·세로를 `image-data.ts`에 적는다. 피그마는 WebP로 내보내지 못한다.
  - 원본 SVG에는 이미 `fill="currentColor"`가 들어 있다. 생성기는 색을 바꾸지 않는다.
  - SVG를 `<img>`로 넣으면 `currentColor`가 글자 색을 따르지 않는다. 아이콘 57개가 글자 색 클래스로 칠해지므로 `<svg>`로 직접 그려야 하고, 그러려면 SVG 파일을 React가 그릴 꼴로 바꾸는 일은 누군가 해야 한다.
  - `generate:assets --check`는 1.5초가 걸린다.
  정할 것:
  - SVG 변환을 누가 할지. 지금 스크립트를 두고 결과만 커밋하지 않기(빌드·테스트·Storybook·개발 서버·lint·타입 검사 전에 자동 생성), 또는 번들러 플러그인(SVGR)에 맡기고 스크립트를 지우기(Next, Storybook, 테스트 세 곳에 설정이 필요하고 그라데이션 ID 겹침 처리를 다시 맞춰야 한다). 둘 다 시험해 보지 않았다.
  - 래스터를 WebP로 줄이는 일과 크기 값을 어디서 만들지.
  - 내보내기 대상에 "자산"을 더해 자산 PR(`feat/figma-assets`)로 분리하고 바로 병합하게 할지. 사람이 낸 안이고, 토큰 PR처럼 늘 읽어 `main`과 다르면 PR을 열며 컴포넌트·조립 PR보다 먼저 병합하는 꼴을 생각했다.
  - 2026-11-10에 `Figma generated`의 자산 검사가 18번 실패했고 모두 `feat/figma-*` 브랜치였다(플러그인이 원본만 올리고 생성 파일은 스킬이 만들기 전이라서).
토큰 생성 파일: |
  `tokens.json`이 원본이고 `tokens.css`와 `token-names.ts`는 거기서 만든 생성 파일이다. 지금은 플러그인과 저장소의 변환 스크립트(`generate:tokens`)가 같은 변환을 따로 하고, 둘이 같은지를 `generate:tokens --check`(0.7초)로 본다.
  정할 것: 생성 파일을 계속 커밋할지, 자산처럼 커밋하지 않고 필요할 때 만들지.
  - 커밋하지 않으면 플러그인은 `tokens.json`만 올리고 비교할 대상이 없어져 검사도 필요 없다.
  - 걸리는 곳: lint의 토큰 클래스 규칙과 편집기의 Tailwind 자동 완성이 `tokens.css`를 읽는다. 저장소를 처음 받았거나 브랜치를 바꾼 직후에 생성기가 자동으로 돌아야 한다. 토큰 PR에서 `tokens.css`의 변경이 보이지 않게 된다. 실제로 걸어 보지 않았다.
  - 자산을 먼저 바꿔 보고 잘 되면 토큰을 같은 방식으로 옮기자는 의견이 있었다.
확인을 돌리는 자리: |
  워크플로를 지워서 아래 확인은 지금 로컬(스킬)에서만 돈다. 흐름을 정한 뒤 CI에 다시 둘지, 둔다면 어디에 둘지 정한다.
  - 토큰 생성 확인(`generate:tokens --check`), 자산 생성 확인(`generate:assets --check`).
  - 모션 시간·키프레임 검사(`pnpm --filter @seojaewan/figma-parity motion-check`). PR 댓글을 다는 코드(`motion-post-comment.ts`, `motion-report.ts`)는 남아 있지만 부르는 워크플로가 없다.
  - 지운 워크플로는 PR마다 따로 떠서 할 일이 없으면 바로 끝나는 꼴이었다. 2026-11-10 하루에 `Figma generated`는 PR 실행 118번 중 87번, `Motion check`는 117번 중 116번이 할 일 없이 끝났다. 다시 둔다면 따로 뜨는 워크플로가 아니라 `ci.yml` 안의 단계로 둔다([[Git 작업 규칙:CI]]).
  - 캡처 코드를 지운 뒤에도 패키지 이름(`@seojaewan/figma-parity`)과 `capture-viewport.ts`처럼 캡처라는 이름이 남는다. 이름을 바꿀지 함께 정한다.
플러그인 PR의 changeset: |
  2026-11-10의 CI 실패 54번 중 30번이 changeset 검사였고 모두 플러그인이 연 PR이었다. 플러그인은 changeset을 넣지 않고 스킬이 처리하면서 넣기 때문에, 그 전의 푸시는 모두 실패한다.
  새 `ci.yml`은 changeset 검사를 맨 앞에 두어 여기서 실패하면 뒤 검사를 시작하지 않으므로 시간은 덜 쓰지만 실패 표시는 그대로 뜬다. 플러그인이 changeset을 함께 올릴지, 스킬 처리 전의 PR을 검사 대상에서 뺄지 정한다.
정해 둔 플러그인 수정: |
  2026-11-11에 정했고 작업만 남았다. 내보내기 방식 논의에서 바뀌면 다시 본다.
  - MCP 내보내기 진입점을 지운다. `tools/figma-plugin/src/mcp-entry.ts`, `src/mcp-tokens.ts`와 `build.mjs`의 두 묶음 설정(`mcpOptions`, `mcpTokensOptions`)이다. 이유: `use_figma`는 코드 5만 자, 반환값 48,000바이트 한도가 있고 `fetch`가 없어 피그마 밖으로 나가지 못한다. 전체 진입점은 66,558자다. 저장소의 PNG 46개가 35KB를, `export.json` 15개가 48KB를 넘는다. 그래서 내보내기는 사람이 플러그인 화면에서 하고, 피그마 작업만 Claude가 `use_figma`로 한다. [[피그마 작업 검수:세션 사이 약속]]과 [[피그마 연동:피그마 플러그인]]의 MCP 문장을 함께 고친다.
  - 토큰이 `main`과 같아도 빈 토큰 PR이 열리는 버그를 고친다(#903). 원인은 `export-flow.ts`의 `REPO_PREFIXES`에 `TOKEN_NAMES_PATH`가 없어 `main`의 `token-names.ts`를 읽지 못하고 늘 바뀐 것으로 보는 것이다(코드를 읽어 판단했고, 고친 뒤 플러그인을 돌려 확인해야 한다). 토큰 내보내기 경로가 모두 비교 목록에 있는지 보는 단위 테스트를 함께 둔다. `95ab1d03`(2026-11-01) 뒤로 빈 토큰 PR 11개가 닫혔다.
  - 바뀐 파일만 올린다. 지금은 모든 파일을 차례로 blob으로 올린 뒤에 비교한다. git blob SHA-1(`"blob <길이>\0"` + 내용)을 플러그인에서 계산해 저장소의 것과 같으면 올리지 않는다. 플러그인 샌드박스에서 쓸 SHA-1 구현이 필요하다(`sha256.ts`처럼). 그래도 느리면 병렬 업로드를 본다. 피그마의 `exportAsync`는 병목이 아니다(변형 20개 차례로 약 0.5초).
  - 고친 뒤 확인은 사람이 플러그인에서 한다. 토큰을 바꾸지 않고 컴포넌트 하나를 내보내 토큰 PR이 열리지 않는지 본다.
남은 흔적: |
  - 원격 브랜치 `parity-report/pr-<번호>`와 `parity-captures`가 남아 있다. 지울지 사람이 정한다([[임의 작업:조립 이전 코드 그림 비교를 뺌]]).
  - [[남은 작업]]의 피그마 항목(7번 코드 전용 컴포넌트의 `Figma` 스토리 정리, 8번 피그마 마무리, 9번 내보내기와 코드)은 이 논의의 결과에 따라 순서와 내용이 바뀔 수 있다.
