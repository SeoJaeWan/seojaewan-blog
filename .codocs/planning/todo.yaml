개요: |
  피그마 내보내기를 새 방식으로 옮기는 일과 조립을 디자인 시스템으로 옮기는 일에 남은 작업을 모은다. 한 일과 경과는 적지 않고, 끝난 항목은 지운다.
  정한 규칙은 [[디자인 시스템]]과 관련 문서에 있다. 여기에는 규칙을 되풀이하지 않고 작업만 둔다.
지금 상태: |
  피그마 파일(키 `XV9Y1UT5UH4tC5hSqLVipZ`)
  - 페이지: Cover, Read me, Foundations, Controls, Shell, Blog, Patterns, Patterns / Desktop, Patterns / Taskbar, Patterns / Start, Patterns / Search, Patterns / AccessibilityPanel, Screens.
  - 부품은 Controls·Shell·Blog 세 페이지에 있다(36개, 17개, 17개). 페이지 바로 아래가 SECTION 한 단(`Button (버튼)`)이고, 그 안이 `Section / <이름>` 프레임 → `component grid` → `item/<부품>` → `table/<세트>`다. `table/` 안에는 컴포넌트 세트와 함께 문서용 레이어(`label`, `row label`, `backdrop`)가 있고, `item/` 안에는 이름과 설명 글자가 있다.
  - Patterns도 SECTION 한 단 아래 `Section / <영역>` 프레임이고, 그 안이 `zone/조립`, `zone/상태 견본`, `zone/움직임 견본`으로 나뉜다. 조립은 64개다(그중 세트 28개). [[디자인 시스템:조립]]의 피그마 읽기 규칙 가운데 컴포넌트인지와 이름 꼴에 어긋나는 조립은 없다. 상태 견본은 26개다.
  - 변수는 90개이고 컬렉션은 셋이다. `Color`(모드 `Value`, 28개, `Black/60`·`White/100`·`Blue/*` 같은 이름, 코드 이름과 설명 없음), `Dimension`(모드 `PC`, 43개), `Typography`(모드 `PC`·`Laptop`, 19개). 별칭은 없다.
  - `motion/*` 변수와 `Motion` 컬렉션이 없다. 모션 값은 키프레임과 변형 사이 전환에 숫자로 적혀 있다. Foundations의 `Foundations / Motion` 프레임에는 규칙 글만 있고 값 표는 없다.
  - `size/*` 변수가 없다. 간격·색·선·효과는 변수나 스타일에 연결돼 있고, 크기는 숫자다.
  - 글자 스타일은 15개이고 `Hangul/` 쌍이 없다. 글꼴은 Pretendard이고 코드 스타일 둘(`Code`, `Code/Inline`)만 NanumGothicCoding이다.
  - 아이콘 56개는 `Foundations / Icons` → `size/<세트>/<크기>` → `icons` → `cell/<아이콘>` 안에 있다. `group/Icons`는 없고, `group/Shapes`·`group/Illustrations`·`group/Images`는 `Foundations / Assets`에 그대로 있다(5개, 4개, 9개). `Foundations / Color` 아래 색 견본 프레임도 `group/<색>` 이름을 쓴다.
  - 모션 견본은 Patterns의 `zone/움직임 견본` → `items` → `item/motion-…` 아래 `motion-*` 프레임 26개다. 원본에 걸린 키프레임은 자산 `progress-ring/Arc`·`icon-color/Search Focus`와 Blog의 `Figure / State=Loading`이다.
  - State 축이 있는 컴포넌트는 37개이고, 기본 상태를 뺀 상태 값은 93개다.
  - 변형 사이 전환은 Hover 변형이 있는 세트에 모두 걸려 있다. State 축이 있는데 전환이 없는 세트는 ViewSwitchButton, Scrollbar, WindowFrame, WindowTitle, Breadcrumb, Toc, Toggle, Figure다.
  - 슬롯은 Controls에 45개, Shell에 15개, Blog에 11개 있다.
  - 컴포넌트는 70개다(변형이 있는 세트 50개, 변형이 없는 컴포넌트 20개). 세트는 `table/<세트>` 안에, 변형이 없는 컴포넌트는 `item/<부품>` 바로 아래에 있다. 이름이 겹치는 것은 없다. 동작의 종류를 적은 주석이 있는 것은 없다. Blog의 ListBlock, CodeBlock, ImageViewer에는 설명 문장을 적은 주석이 있다.

  저장소
  - 플러그인은 `tools/figma-plugin`이다. 토큰, 컴포넌트, 조립, 자산, 모션을 읽어 GitHub REST로 브랜치와 PR을 만든다. Screens는 내보내지 않는다.
  - 지금까지 내보낸 자료: 컴포넌트 폴더 84개(`packages/design-system/figma/components`), 조립 `export.json` 60개(`apps/web/figma/patterns`), 모션 29개(`packages/design-system/figma/motions`), 디자인 시스템 쪽 PNG 496개.
  - 코드의 색 토큰은 옛 이름(`--color-black-6`, `--color-gray-13` 같은 꼴)이고 피그마의 지금 이름과 다르다. `tokens.json`의 색은 48개, 피그마의 색 변수는 28개이고 이름이 같은 것은 7개다.
  - `tokens.json`에는 피그마에 없는 `motion` 토큰 24개, `size` 토큰 116개, `Hangul/*` 글자 스타일, `font/family/korean`이 남아 있다.
플러그인과 지금 피그마가 어긋나는 곳: |
  플러그인 코드는 옛 피그마 구조를 전제로 한다.
  - 컴포넌트 페이지를 이름에 `Components`가 든 페이지로 찾는다(`component-pages.ts`의 `COMPONENTS_PAGE_KEYWORD`). 지금은 그런 페이지가 없다.
  - 부품 위쪽을 SECTION 두 단(묶음, 컴포넌트)으로 읽는다(`component-pages.ts`). 지금은 SECTION 한 단 아래 `Section / <이름>` 프레임이다.
  - 조립 페이지를 노드 ID `517:16130`으로 찾는다(`plugin-config.ts`의 `PATTERNS_PAGE_ID`). 지금 Patterns 페이지의 ID와 같다.
  - 모션 견본을 페이지·섹션 바로 아래 프레임과 `Foundations / Motion` 프레임 바로 아래에서 찾는다(`read-motion.ts`). 지금 견본은 `zone/움직임 견본` 안쪽에 있고 `Foundations / Motion` 프레임에는 견본이 없어, 하나도 찾지 못한다.
  - 아이콘을 `group/Icons` 프레임으로 알아본다(`core/asset-groups.ts`). 지금은 그 프레임이 없다.
  - `motion/*` 변수를 전제로 키프레임 시간·이징을 검사한다(`check-motion.ts`, `check-structure.ts`). 지금은 그 변수가 없다.
  - 그대로인 것: 변수 이름 접두 `font/`·`rotate/`, `Typography`의 `Laptop` 모드, `breakpoint/*` 변수, 조립 이름을 읽는 방법(`naming.ts`).

  [[디자인 시스템]]의 내보내기 섹션은 새 방식으로 적혀 있고, 플러그인 코드는 위처럼 옛 구조를 전제로 한다. 아래 "플러그인에서 고칠 것"과 함께 고친다.
조사에서 확인한 것: |
  플러그인으로 되는 것(피그마 공식 문서)
  - 변수의 컬렉션·모드·별칭·쓰임 범위·코드 이름, 글자·효과 스타일, 컴포넌트 속성 정의와 변형, 인스턴스 덮어쓰기, 자동 배치 값, 슬롯(슬롯 노드와 설정), 모션(키프레임과 애니메이션 스타일, 베타)을 읽는다.
  - 그림은 PNG·JPG·PDF·SVG·영상·노드 JSON으로 내보내고, `getCSSAsync`로 Inspect의 CSS를 얻는다.
  - manifest에 도메인을 적으면 GitHub API로 직접 보낸다. `Access-Control-Allow-Origin: *`를 허용하는 API만 부를 수 있다.

  플러그인의 한계
  - 사람이 열어서 실행해야 한다. 피그마가 바뀔 때 저절로 도는 방법은 문서에서 찾지 못했다.
  - OAuth 로그인은 자체 서버가 있어야 한다. 토큰을 붙여 넣는 지금 방식은 서버 없이 된다.
  - codegen 플러그인은 Dev Mode 전용이고 선택한 레이어 하나에 코드 조각을 보여 주는 용도다.

  다른 길
  - Variables REST API는 Enterprise 전용이다. Enterprise가 아니면 변수를 읽는 길은 플러그인뿐이다.
  - Code Connect는 피그마 컴포넌트와 코드 컴포넌트를 연결할 뿐 구현을 대신하지 않는다(Professional 이상, Dev 또는 Full 시트).
  - 피그마 자체의 변수 내보내기는 손으로 실행하고, 파일 형식 설명이 도움말에 없다.

  먼저 해 본 사람들과 연구
  - 토큰은 플러그인으로 끝까지 자동화한 사례가 많다. 형식은 DTCG(2025.10 첫 안정판)가 표준이고 지금 `tokens.json`도 이 형식이다.
  - 컴포넌트와 화면을 자동 변환해 그대로 쓰는 사례는 찾지 못했다. 정리된 자료(속성, 구조, 그림)를 내보내고 구현은 사람이나 AI가 한다.
  - 반복되는 문제는 모드 처리, 별칭 해석, 이름 규칙, 피그마에서 지운 것을 코드에서 지우는 일, 출력 차이 검토다.
  - AI에게 좌표와 직접 값을 그대로 주면 절대 위치와 임의 값이 늘어 코드가 딱딱해진다(Figma2Code, arXiv 2604.13648). AI는 있는 컴포넌트를 스스로 재사용하지 않는다(DesignBench, arXiv 2506.06251). 화면 전체보다 컴포넌트 단위가 정확했다는 팀 회고가 있다.
  - 출처: 피그마 Plugin API 문서(`developers.figma.com/docs/plugins`), Variables REST API 문서, Code Connect 문서, Design Tokens 규격 2025.10, 피그마 공식 예제 `figma/variables-github-action-example`, Nathan Curtis "Components as Data".
정한 것: |
  정한 규칙은 [[디자인 시스템]]과 관련 문서에 있다. 여기에는 옮기는 작업만 남긴다.

  옮기는 방법
  - 지금 손으로 쓴 컴포넌트는 고쳐 쓰지 않는다. 지우고, 모습은 생성하고 동작은 종류로 새로 만든다. 옛 코드는 새로 만들 때 참고만 한다.
  - 컴포넌트마다 바꾼다. PR 하나에서 옛 컴포넌트 하나를 지우고, 새 컴포넌트를 올리고, 앱에서 그것을 쓰는 곳을 고친다. main은 늘 빌드되고 테스트가 돈다.
  - 토큰을 맨 먼저 올린다. 옛 토큰과 새 변수를 색 값으로 짝지은 대조표를 만들고, 옛 컴포넌트와 앱이 쓰는 토큰 이름을 새 이름으로 바꾼다.
  - 올리는 순서는 도구(플러그인, 생성기, 검증 테스트), 토큰, 자산, 컴포넌트, 정리다. 도구를 올릴 때는 컴포넌트를 바꾸지 않는다.
  - 컴포넌트는 안쪽부터 올린다. 다른 컴포넌트를 품지 않는 것(44개), 그것을 품는 것(23개), 그 위를 품는 것(3개: Breadcrumb, SnapLayoutFlyout, TaskbarPreviewList) 순서다. 품지 않는 것끼리는 동작을 옮기는 순서를 따른다.
  - 안쪽 컴포넌트를 바꾸는 PR은 그것을 품은 옛 컴포넌트도 새 컴포넌트를 쓰도록 고친다.
  - 자산은 컴포넌트와 나눠 `feat/figma-assets` PR로 먼저 올린다.
  - 피그마에서 온 자료(`figma/tokens.json`, `figma/assets/`)를 [[디자인 시스템:스키마]]의 파일 자리로 옮긴다.
  - 그동안 내보낸 컴포넌트 자료(`packages/design-system/figma/components/<이름>/`)는 그 컴포넌트를 바꾸는 PR에서 함께 지운다. 피그마에 없는 컴포넌트의 남은 자료는 그 컴포넌트를 앱으로 옮기거나 없애는 PR에서 지운다.
  - 그동안 내보낸 모션 자료(`packages/design-system/figma/motions/`)와 `motion.css`의 그 클래스는 움직임을 `Motion` 변형으로 받는 컴포넌트를 바꾸는 PR에서 함께 지운다. 모션 검사 도구(`tools/figma-parity`)는 마지막 모션 자료를 지울 때 캡처 코드와 PR 댓글 코드까지 패키지째 지운다.
  - 그동안 내보낸 조립 자료(`apps/web/figma/patterns/`)는 PR 하나에서 모두 지운다. 앱 스토리가 쓰던 폭은 [[디자인 시스템:스토리 규칙]]대로 스토리로 옮긴다.
  - 플러그인의 PNG 내보내기와 디자인 시스템 쪽 PNG, `Figma` 스토리, 스토리의 `data-parity-target`·`data-parity-hover` 속성을 없앤다.
  - `generate:tokens --check`, `generate:assets --check`, 모션 시간·키프레임 검사(`motion-check`)를 없앤다.
  - 피그마에서 조립인 것은 앱으로 옮긴다: `browser-toolbar`, `browser-tab-strip`, `explorer-command-bar`, `explorer-address-row`, `explorer-status-bar`, `details-header`, `search-results`, `menu-command-bar`, `start-menu-footer`.
  - 배치만 하는 감싸개를 앱으로 옮긴다([[디자인 시스템:코드 전용 컴포넌트]]): `tile-grid`, `column`, `columns`, `list-group`, `layer-surface`.
  - `popover`와 `scroll-area`를 동작의 종류로 만든다.
  - `menu-separator`는 피그마에 MenuSeparator 컴포넌트를 만든 뒤 생성한다. `caption-button-group`은 WindowFrame을 바꿀 때 없앤다(창 버튼 셋이 WindowFrame의 레이어로 생성된다).
  - 이름이 바뀐 것은 피그마 이름의 컴포넌트가 대신한다: `browser-tab`·`explorer-tab`은 Tab, `file-item`은 ExplorerFileItem·DesktopFileItem.
  - 스킬을 [[디자인 시스템:스킬]]대로 고친다. `figma-asset-pr`을 만들고 `figma-motion-pr`을 지운다.

  함께 할 일
  - 코드에서 Open Sans와 `font-synthesis-style: none`을 뺀다([[디자인 시스템:서체 구현]]).
  - 코드만 쓰는 변수 17개(`blur`, `rotate`, `line-clamp`, `layer`, `shrink`, `flex`, `position`, `grid`, `border-spacing`, `ratio`)를 둘 자리를 코드에 만들고, 피그마에서 지운다([[디자인 시스템:토큰 생성]]의 코드 전용 묶음).
  - 모양을 고르는 데 쓰던 `use-device`를 미디어 쿼리로 옮긴다([[디자인 시스템:기기 변형]]). 동작을 가르는 데 쓰는 `use-device`는 둔다.
  - 크기에 숫자를 직접 쓸 수 있게 lint 규칙을 고치고, 코드의 `size` 토큰을 숫자로 바꾼다([[디자인 시스템:크기 변수]]).
  - 컴포넌트마다 종류를 정해 피그마에 적는다(70개 가운데 종류가 있는 것은 50개쯤이다). 종류의 초안은 `button`, `textbox`, `combobox`, `menu`·`menuitem`, `tab`, `tree`·`treeitem`, `listbox`·`option`, `dialog`, `tooltip`, `disclosure`, `group`(묶음 안 이동)과 표시만 하는 `separator`, `progressbar`, `checkbox`, `heading`, `listitem`, `table`, `figure`, `code`, 장식이다. 이때 Blog에 있는 주석 6개(설명 문장 4개, `@sample-size`, `motion-image-skeleton`)를 지운다.
  - 피그마에서 JumpList의 글자들을 슬롯으로 바꾸고, SnapLayoutOption의 구역 레이어 이름을 겹치지 않게 고친다. 코드의 MessageBox 입력 이름(`onPrimaryClick`, `onSecondaryClick`)은 [[디자인 시스템:컴포넌트 입력]]대로 `onPrimary`, `onSecondary`가 된다.
  - `.codocs/design-system/behaviors/`에 동작의 종류별 문서를 만든다([[디자인 시스템:동작의 종류]]). [[파일 탐색기:탐색 창]]의 키 규칙처럼 기능 문서에 흩어진 공통 동작과 [[접근성:직접 만든 부품]] 표를 이때 옮긴다.
  - CI의 기본 토큰으로 올린 커밋에는 워크플로가 다시 돌지 않는다. 생성 커밋에 필수 검사가 붙게 하는 방법을 실제로 걸어 보고 정한다.
  - 동작을 종류별로 직접 만든 것으로 옮긴다. 순서는 버튼·입력란, 도구 모음·탭, 툴팁·팝업, 메뉴, 대화 상자다. 옮기는 동안 Base UI는 검사 전용으로 남겨 같은 검사를 양쪽에 돌려 견주고, 다 옮긴 뒤 뺀다. [[접근성]]의 Base UI 규칙과 직접 만든 부품 표, [[기술 스택:동작 기반 라이브러리]]의 Base UI 문장은 이때 함께 고친다.
  - Patterns의 움직임 견본에 걸린 움직임을 움직이는 컴포넌트의 `Motion` 변형으로 옮긴다(WindowFrame, TaskbarButton, PinnedTile, JumpList, StartCategoryFolder, TaskbarPreviewList, Menu, Figure). StartCategoryFolder의 쪽 넘김은 안쪽 `tile grid` 레이어에 건다.
  - 코드에는 컴포넌트이고 피그마에서는 프레임인 ShellSurface, Flyout, BootScreen을 피그마 컴포넌트로 만들고, 견본의 움직임을 그 `Motion`으로 옮긴다. BootScreen의 나타남과 사라짐은 지금 견본에 걸려 있지 않아 새로 건다.
  - 시작 메뉴의 글자 목록 견본은 JumpList의 `Motion`과 앱 목록의 흐려짐으로 나눈다. 둘을 클래스 하나로 묶은 `motion-start-jump-list-enter`·`exit`과 `data-jump-list` 약속은 없앤다.
  - `tokens.json`의 `motion` 토큰 24개를 없앤다. 앱이 이 토큰을 직접 읽는 곳(`desktop-icons-layer.tsx`, `explorer-body.tsx`, `restart-screen.tsx`, `globals.css`)은 앱의 상수로 바꾼다.
  - Callout의 글 레이어를 글자 스타일 하나(`Body Large`)로 고친다.
  - MenuItem 라디오의 점(`bullet` 타원, 변형 4개)을 아이콘 자산으로 만들어 바꾼다([[디자인 시스템:구조 검사]]).
  - 피그마 색 변수 28개의 code syntax(Web)가 비어 있다. [[디자인 시스템:토큰 생성]]대로 `var(--color-<이름>)`으로 채운다.
  - 토큰을 지금 피그마에서 다시 내보낸다. `tokens.css`의 색 이름과 값이 지금 피그마와 다르다(피그마 색 변수 28개 중 21개가 같은 이름이 없다).
플러그인에서 고칠 것: |
  플러그인을 [[디자인 시스템:피그마 플러그인]]에 맞춰 고친다.
  - 조립 내보내기(조립 읽기, `apps/web/figma/patterns`에 쓰기, 조립 PR), PNG 내보내기, 모션 내보내기(모션 PR), `tokens.css` 변환을 뺀다.
  - 컴포넌트마다 스키마와 검증 자료(`<이름>.layout.json`)를 내보낸다([[디자인 시스템:스키마]], [[디자인 시스템:생성 결과 검증]]).
  - 자산을 `feat/figma-assets` PR로 나눠 연다.
  - PR을 열 때 changeset을 함께 올린다([[디자인 시스템:PR 흐름]]).
  - MCP 내보내기 진입점(`tools/figma-plugin/src/mcp-entry.ts`, `src/mcp-tokens.ts`, `build.mjs`의 두 묶음 설정)을 지운다.
  - 토큰이 `main`과 같아도 빈 토큰 PR이 열린다. `export-flow.ts`의 `REPO_PREFIXES`에 `TOKEN_NAMES_PATH`가 없어 `main`의 `token-names.ts`를 읽지 못하는 것이 원인이다(코드를 읽어 내린 판단이고, 고친 뒤 플러그인을 돌려 확인한다). 토큰 내보내기 경로가 모두 비교 목록에 있는지 보는 단위 테스트를 함께 둔다.
  - 지금은 모든 파일을 차례로 blob으로 올린 뒤에 비교한다. 바뀐 파일만 올리게 고친다.
  - 변형 속성 정의에 설명(`description`)을 쓰는 코드를 뺀다.
피그마에서 고칠 것: |
  피그마 파일 쪽에서 손보는 것이다. 움직임과 새 컴포넌트는 "정한 것"의 "함께 할 일"에 있다.

  고치는 것
  - 상태 이름 `Rest current`(ExplorerFileItem, FileRow)를 `Current`로 바꾼다. 낱말 순서와 대소문자를 다른 값과 맞춘다.
  - NavigationItem에 선택 안 된 현재 칸(`Current`) 변형을 그린다. 지금 코드는 회색 선을 그린다.
  - MenuItem에 하위 메뉴가 열려 있는 동안의 변형을 그린다. 지금 코드는 Hover와 같은 바탕을 유지한다.
  - 메뉴와 명령 줄의 구분선을 감싼 여백 프레임(9곳)을 MenuSeparator 컴포넌트로 만든다. 여백 프레임과 Separator를 묶고, 가로(위 2, 아래 6)와 세로(위아래 6)는 변형으로 둔다. 슬롯 안의 프레임은 이 컴포넌트의 인스턴스로 바꾼다.
  - 동작이 있는 컴포넌트 세트에 종류를 적은 주석을 단다.
  - Blog의 ListBlock, CodeBlock, ImageViewer 세트에서 설명 문장을 적은 주석을 지운다. 종류를 적을 자리와 겹친다.
  - 고정 타일 옮기기 견본 세 개의 주석(지금 없는 `motion/delay/…` 변수를 가리킨다)은 견본을 `Motion` 변형으로 옮길 때 함께 없앤다.

  컴포넌트를 내보낼 때 정할 것
  - 속성으로 열려 있지만 늘 같은 아이콘 자리(NavigationItem의 `Chevron`, Callout의 `Icon`)를 박아 둘지, 열어 두고 쓰는 곳이 넘길지 정한다([[디자인 시스템:아이콘 자리]]).

  그대로 두는 것
  피그마에 그림이 없고 지금 코드에도 없다.
  - Hover뿐인 버튼(ColumnHeader, SnapZone, BreadcrumbChevron, ProfileButton)에 Pressed 변형을 더하지 않는다.
  - MenuCommandButton에 `Disabled` 변형을 더하지 않는다. 앱이 비활성으로 쓰지 않는다.
  - 닫힘 움직임(메뉴, 플라이아웃, 툴팁, 작업 표시줄 메뉴, 미리보기)을 더하지 않는다. 바로 닫힌다.
  - State 축이 있는데 전환이 걸리지 않은 세트(ViewSwitchButton, Scrollbar, WindowFrame, WindowTitle, Breadcrumb, Toc, Toggle, Figure)에 전환을 더하지 않는다. 즉시 바뀐다.
  - 포커스된 채 눌린 모습을 따로 그리지 않는다. Button의 `Pressed`는 바탕과 안쪽 선을, `Focused`는 바깥 선을 바꾸므로 낱말의 조건이 겹치면 바깥 선이 남는다.
  - 바탕화면 항목의 `Rename`은 선택 바탕이 없는 그대로 둔다. 지금 코드도 바탕을 지운다.

  생성기를 만든 뒤 확인할 것
  그림이 없는 조합이라 낱말의 조건을 겹친 결과가 나온다. 지금 코드의 모습과 다르면 그 조합을 그린다.
  - 목록에 포커스가 없을 때의 선택 안 된 현재 항목(ExplorerFileItem, FileRow). 지금 코드는 회색 선을 그린다.
  - 이름을 바꾸는 중인 현재 항목(ExplorerFileItem, FileRow). 이름을 바꾸는 항목은 늘 현재 항목이고 지금 코드는 선을 그린다.
조립과 접근성에서 남은 것: |
  [[디자인 시스템:조립]], [[디자인 시스템:조립의 흐름]], [[접근성]], [[접근성 모드]]와 화면별 기능 문서에는 적혀 있고 코드나 피그마에는 아직 없는 것이다.

  문서에는 있고 코드에는 아직 없는 것
  - 조립 `Desktop`, `Taskbar`, `Start`, `Search`, `Chrome`, `Article`, `Explorer`, `Windows`와 부품 `AccessibilityPanel`이 디자인 시스템 패키지에 없다. `packages/design-system/src/assemblies/` 폴더와, 컴포넌트·동작이 조립을 import하지 못하게 하는 lint 규칙도 없다([[저장소 구성:의존 방향]]). 지금은 앱(`apps/web`의 `shell/`·`features/`)이 부품을 엮고 상태(칸 크기, 자동 정렬, 정렬 기준, 선택, 아이콘 자리, 열린 패널)를 앱의 스토어가 갖는다. 조립이 상태를 갖고 손잡이로 여는 꼴로 옮긴다.
  - 조립을 한 화면에 엮는 코드의 길이 정해지지 않았다. 열린 창의 목록을 누가 갖는지, 알림 상자(MessageBox)를 어디에서 띄우는지, 조립이 서로에게 어떻게 알리는지다([[디자인 시스템:조립]]의 코드).
  - 창 틀(WindowFrame)에 옮기기·크기 바꾸기·최대화를 동작으로 붙이고 `Chrome`과 `Explorer`가 창 틀을 안에서 쓰게 하는 것이 없다. 지금은 앱의 `features/window`가 갖는다.
  - `Chrome`이 브라우저 겹만 갖고 페이지 자리를 슬롯으로 여는 꼴이 아니다. 새 탭·검색 결과·찾을 수 없음을 `Chrome`이 주는 블록으로, 글을 `Article`로 떼어 낸다. 찾기와 확대/축소가 페이지 내용을 모른 채 움직이는지도 그때 확인한다.
  - 배율이 걸렸을 때 페이지 영역 너비를 배율로 나눈 값으로 넓은·좁은 모양을 가르는지 확인하지 않았다([[Chrome:글 화면]]).
  - 탭의 닫기 버튼(×)이 키보드로 닿지 않는다. 지금은 `aria-hidden`이다. 고른 탭 다음 Tab으로 닿게 하고 툴팁에 `닫기 (Delete)`를 적는다([[파일 탐색기:탭]]).
  - 탭 우클릭 메뉴(`왼쪽으로 이동` · `오른쪽으로 이동`)가 Chrome과 탐색기에 없다.
  - ⋮ 메뉴의 확대/축소 줄에서 ←·→로 −와 + 사이를 옮기는 것이 있는지 확인하지 않았다([[Chrome:확대/축소]]).
  - 탐색기 주소창이 Tab으로 닿아 Enter로 입력칸이 되는 것이 없다([[파일 탐색기:주소창 편집]]).
  - 탐색 창 즐겨찾기 칸의 우클릭 메뉴(`열기` · `위로 이동` · `아래로 이동` · `즐겨찾기에서 제거`)가 없다([[파일 탐색기:탐색 창]]).
  - 화면 전체의 Tab 차례에 맨 앞 창 하나만 넣는 처리가 없다([[접근성:Tab]]). 지금 뒤에 있는 창에 Tab이 들어가는지 확인한다.
  - 최대화 버튼에 포커스가 가면 스냅 레이아웃이 뜨고 방향키와 Enter로 칸을 고르는 것이 없다([[스냅:스냅 레이아웃]]).
  - 접근성 모드 앱의 메뉴에 `패널 자리` 하위 메뉴가 없다([[접근성 모드:앱]]).
  - 탐색기 본문이 바탕화면과 같은 키보드 선택(Tab으로 들어오면 포커스만, Shift+방향키가 지나간 것만 고름, Esc로 선택 지우기)을 하는지 확인하지 않았다. [[항목 조작:단축키]]에는 바탕화면만 적혀 있다.
  - Start와 검색 패널이 열리고 닫히는 움직임을 `Taskbar`의 패널 자리가 갖지 않는다.
  - 접근성 모드 앱이 없다. 바탕화면 아이콘, 처음 고정된 작업 표시줄 버튼, Start 모두 목록·범주, 검색 결과, 접근성 패널, 켜짐과 패널 자리의 저장이 모두 없다.
  - 다시 시작이 접근성 모드의 켜짐과 패널의 자리를 남기는 처리가 없다. 지금은 저장분을 전부 지운다([[다시 시작:되돌리는 상태]]).
  - 접근성 패널이 포커스가 있는 곳에 메뉴가 없을 때 단추를 흐리게 하는 것이 없다.
  - 접근성 패널의 단추를 눌러도 열려 있던 것을 닫지 않는 처리가 없다.
  - 바탕화면 아이콘 메뉴의 이동 항목(위·아래·왼쪽·오른쪽, 찬 칸이면 맞바꿈, 열기 다음 자리)이 없다. 휴지통과 접근성 모드 아이콘의 메뉴에도 둔다.
  - 휴지통 아이콘의 칸을 옮길 수 있는지 코드에서 확인하지 않았다. 지금 격자 코드는 휴지통을 늘 맨 앞에 둔다. 자동 정렬이 꺼져 있으면 옮길 수 있게 한다([[휴지통:기본 규칙]]).
  - 작업 표시줄 앱 버튼 메뉴의 `왼쪽으로 이동` · `오른쪽으로 이동`(앱 이름 다음 자리)이 없다.
  - 창 미리보기에서 Tab이 카드마다 여는 버튼과 닫는 버튼을 도는 것이 없다. 지금 닫기 버튼은 `aria-hidden`이고 Tab으로 닿지 않는다.
  - 창 미리보기 카드가 화면 폭을 넘을 때 모든 카드를 같은 비율로 줄이는 것이 없다.
  - 바탕화면에서 Esc로 선택 지우기, 고른 것 없이 Tab으로 들어올 때 첫 아이콘에 포커스만 주기, Shift+방향키가 지나간 것만 고르고 되돌아가면 푸는 것이 코드에 있는지 확인하지 않았다. 없으면 만든다.
  - Start 고정됨이 8열이 아니다(지금 코드의 열 수를 확인해 맞춘다).
  - Start 범주 카드가 포커스를 받지 않는 `div`다. 방향키로 카드 사이를 옮기고 Enter로 펼치게 한다. 글자 머리글과 글자 격자의 방향키·Enter·Esc도 만든다.
  - 줄(ListItem), 고정 타일(PinnedTile), 범주 카드, 창 미리보기 카드, 작업 표시줄 버튼, 메뉴 단추, 글자 머리글의 포커스 모양이 코드에 없거나 피그마와 다르다.
  - 시계(`system-tray.tsx`)에 호버가 남아 있고, 프로필 버튼이 호버와 포커스를 갖는다.
  - 단추 툴팁의 `이름 (단축키)`와 `aria-keyshortcuts`가 [[접근성:키]]의 모든 키에 붙어 있는지 확인하지 않았다.
  - Mac에서 Shift+F10이 듣는지 시험하지 않았다. 듣지 않으면 Mac용 키를 정하고 접근성 패널에 적히는 글자만 바꾼다.
  - 조립을 가리키는 코드 주석(`@codocs \[[디자인 시스템:조립]]`)은 조립을 앱의 컴포넌트로 보던 때에 단 것이다. 조립을 옮길 때 함께 다시 잇는다.
  - 접근성 패널의 모바일 꼴이 없다. 화면 폭을 가득 채운 한 줄, 위·아래 자리, 짧은 단추 글자, 누를 때마다 위아래가 바뀌는 `자리` 단추다([[접근성 모드:모바일]]).
  - 터치에서 패널의 `메뉴` 단추를 탭하면 다음에 탭하는 것의 메뉴가 열리는 처리가 없다([[접근성 모드:모바일]]).
  - 메뉴의 단축키 글자를 화면 크기가 아니라 메뉴를 연 입력으로 가르지 않는다. 지금은 모바일이면 숨긴다([[반응형:입력 차이]]).
  - 모바일에서 바깥 키보드로 데스크톱과 같은 키가 듣는지, 모바일 화면 전체의 Tab 차례(창이 있으면 맨 앞 창 → 작업 표시줄)가 맞는지 확인하지 않았다([[접근성:Tab]]).
  - 모바일에서 즐겨찾기를 숨기지 않는다. 폴더 메뉴의 즐겨찾기 고정 항목과 탐색기 점프 목록의 "고정됨"을 숨기고, 저장된 즐겨찾기는 남긴다([[고정:즐겨찾기 고정]]).
  - 탐색기의 모바일 자세히 보기가 두 줄짜리 줄이 아니다. 열 제목 줄을 없애고 폴더 안·검색 결과·휴지통의 둘째 줄을 그린다([[파일 탐색기:모바일]]).
  - 모바일에서 작업 표시줄 앱 버튼의 순서를 길게 누르기 메뉴의 이동 항목으로 바꾸는 것이 없다. 지금은 모바일 끌기만 막혀 있다([[작업 표시줄:모바일]]).
  - 모바일 탐색기 주소 줄이 뒤로 · 경로 한 칸 · 검색 버튼만 그리는지, 모바일 미리보기 목록이 밖을 탭하면 닫히는지 코드에서 확인하지 않았다.
  - 모바일 메시지 상자의 너비(화면 폭에서 좌우 여백을 뺀 만큼까지)를 확인하지 않았다([[창 동작:모바일]]).

  피그마에서 남은 것
  - 포커스 모습(`State=Focused`)을 TaskbarButton, MenuCommandButton, SectionHeader에 더한다. 창 미리보기 카드의 닫는 버튼에 포커스가 간 모습도 확인해 없으면 더한다.
  - ProfileButton의 Hover를 뺀다.
  - 접근성 모드 앱의 메뉴(`닫기` · `패널 자리`와 그 하위 메뉴)를 견본으로 그린다.
  - 조립의 흐름도에서 글줄로 끊어 둔 곳(알림 상자, 창이 뜨는 것, 창이 닫히는 것, 최소화와 복원, 다시 시작)을 모습과 화살표로 채운다([[디자인 시스템:조립의 흐름]]).
  - 조립마다 키보드 흐름도에 접근성 패널을 거쳐 가는 길을 더하고, 접근성 모드를 켜는 길을 `Desktop`·`Taskbar`·`Start`·`Search`에 그린다.
  - `Windows` 조립과 그 흐름도(맨 앞 창, 스냅과 Snap Assist, 화면 전체의 Tab 차례)를 `Patterns / Windows` 페이지에 그린다.
  - Patterns의 옛 묶음(`Taskbar/Default`, `Desktop/Scene`, `Start/Menu`, `Search/Panel` 등) 가운데 새 조립이 대신하는 것을 지우거나 견본으로 남길지 정한다. 기능 문서가 가리키는 이름(`Start/CategoryFolder`, `Search/Body`, `ShellSurface`·`Start/Menu`의 `Device=Mobile`)도 그때 고친다.
  - 견본 `Menu/Folder`의 고정 항목 글자가 처음 상태(Blog는 처음부터 고정)와 다르다.
  - 고장 난 부품: MenuItem `Variant=Submenu, State=Open`의 Label·Icon 속성 연결, DesktopFileItem `State=Rename`의 이름 속성 연결, WindowPreview가 줄어들 때의 축소 화면과 틀 높이.
  - 쓰는 곳이 없는 ShellSurface의 `Motion`을 정리한다.
  - 흐름도를 그리는 스크립트를 저장소에 둘 자리를 정한다.
  - 조립 여덟에 `Device=Mobile` 모습을 더하고, 조립 페이지의 오른쪽 열에 `모바일 흐름`과 `모바일 키보드 흐름`을 그린다([[디자인 시스템:조립의 흐름]]).
  - 부품 `AccessibilityPanel`에 모바일 꼴(한 줄, 짧은 글자, `메뉴` 단추가 눌린 모습과 안내 글)을 더한다.
  - 모바일의 메뉴, 메시지 상자, 탐색기의 자세히·휴지통·검색 결과 보기, Chrome의 주소 추천·찾는 중·확대 모습이 견본에 없다. 모바일 흐름도를 그릴 때 만든다.
  - 노트북에서 모양이 눌리는 곳(접근성 패널이 Start·검색 패널과 겹치는 정도, Chrome 창의 기본 크기, Start와 검색 패널의 높이)을 `Screens`에 그린다.
  - 모바일 화면(`Screens`의 390×844와 320×568)에 접근성 모드 아이콘과 작업 표시줄 버튼이 없다.

  부품을 재정비할 때 볼 것
  - WindowFrame과 AddressBar에 동작의 흐름도를 붙인다(창 틀: 옮기기·크기 바꾸기·최대화, 주소창: 전체 선택·추천 펼침·줄 고르기·Esc). 창 틀에는 최대화 버튼에 포커스가 가서 스냅 레이아웃이 뜬 모습도 둔다([[디자인 시스템:조립의 흐름]]).
  - `Patterns / AccessibilityPanel` 페이지의 흐름도(자리 옮기기, 닫기, 흐린 단추)를 부품 `AccessibilityPanel` 옆으로 옮긴다. 접근성 패널은 조립이 아니다.
  - Tab의 닫기(×)가 버튼이 아니라 아이콘이라 포커스 선을 아이콘에 직접 걸었다.
  - IconButton(Subtle)의 Disabled가 Rest와 구별되지 않아 보인다(확대/축소 끝 단계의 +, 쓸 수 없는 명령, 바탕 화면에서의 위로 버튼).
  - Figure의 포커스가 불러오기 상태 축에 얹혀 있다.
  - ColumnHeader의 Focused가 정렬된 열(Ascending · Descending)에는 없다.
  - 자세히 보기의 열 너비를 인스턴스에서 바꿀 수 없다. 검색 결과 보기는 줄 폭을 고정해 맞췄다.
  - `ChromePage`와 `Article`의 다섯 영역, `Explorer`의 슬롯 영역이 진짜 슬롯 속성이 아니라 이름 붙인 틀이다.
  - 옛 견본 `Chrome/Page`의 찾을 수 없음 화면에 적힌 주소가 견본의 주소창과 다르다.
  - 탭의 가장 넓은 폭(240)과 줄어드는 규칙이 부품에 어떻게 담겨 있는지 확인한다.
  - 조립이 한 번도 쓰지 않는 부품이 열둘이다. Controls의 Checkbox, Shell의 Taskbar(띠)·Flyout, Blog의 Quote·Callout·Toggle·ListBlock·Equation·Bookmark·Table·TableCell·UnsupportedBlock이다. 조립에 넣을지, 그대로 둘지 정한다.
  - EmptyState, BestMatchCard, ColumnHeader는 옛 견본을 거쳐서만 조립에 쓰인다.
  - 조립이 아직 기대는 옛 견본이 다섯이다. `Window/Explorer`, `Explorer/DetailsHeader`, `Chrome/Page`, `Search/Results`, `Window/Chrome`이다.
  - 부품이 아닌데 조립에 직접 그려진 것이 있다. 작업 표시줄 띠(부품 Taskbar가 있는데 떼어 낸 복사본을 쓴다), Start 패널의 뼈대(`search band`·`body`·`footer`), Chrome의 찾기 막대(Flyout과 옛 견본을 쓰지 않았다), Article의 본문 글자·제목·머리 정보, 즐겨찾기로 끌 때의 가로선이다.
  - 조립이 부품의 모양을 덮어쓴 곳이 있다. 버튼 안 아이콘의 색(탐색기에서 많다), Breadcrumb의 채우기와 선, CaptionButton과 SnapZone의 포커스 테두리(포커스 변형이 없어 선을 덮어썼다), WindowFrame의 그림자다.
  - 포커스 변형이 없는 부품: MenuItem, CaptionButton, SnapZone, ViewSwitchButton, BreadcrumbChevron, PostNavCard, Checkbox, Toc, Toggle.
  - 같은 뜻의 이름이 부품마다 다르다. 키보드 포커스가 `Focused`와 `Current`로, 비활성이 `Disabled`와 `Inactive`로, 종류 축이 `Variant`·`Theme`·`Material`로, 화면 크기 축이 `Device`와 `Layout`으로 갈린다.
  - `Motion` 축이 상태 변형 세트에 섞여 있다(WindowFrame, TaskbarButton, PinnedTile, Menu, Figure 등). 값이 하나뿐인 축도 있다(SystemTray와 ProfileButton의 `State=Rest`).
  - 조립에 한 번도 나오지 않는 변형 값을 정리할지 본다. FileRow의 선택 상태들, WindowFrame의 `Placement=Maximized`, AddressBar의 `Focused`, NavigationItem(변형 84개)의 `Selected`·`Current`다.
  - CloseButton의 기본 아이콘이 ×가 아니라 ⋯이다. Separator와 MenuSeparator의 설명이 같다. SectionHeader와 StartCategoryCard는 눌리는데 동작 종류 주석이 없다.
  - MenuItem에 `패널 자리`에 쓸 아이콘이 없어 아이콘 자리만 두고 그림을 숨겼다.

  정해야 할 것
  - 조립의 스토리를 어느 Storybook에 두는지. [[디자인 시스템:스토리 규칙]]의 조립 부분, [[저장소 구성:앱 폴더 구조]], [[기술 스택]]의 Storybook 줄은 조립을 앱에 두고 앱 Storybook과 `Patterns/` 제목으로 짝짓는 것을 전제로 적혀 있다. 조립의 폴더는 `src/assemblies/`로 정해졌으니([[디자인 시스템:조립]]) 스토리 자리를 정하면 함께 고친다.
  - [[디자인 시스템:동작의 종류]]의 "놓인 자리에 따라 그 자리의 조립이 스킨에 다른 종류를 잇는다"를 그대로 둘지. 종류가 없는데 상태가 있는 컴포넌트(SectionHeader·StartCategoryCard의 Hover, WindowTitle의 Inactive, Scrollbar의 Expanded)도 함께 정한다.
  - [[디자인 시스템:팝업]]의 "Open overlay로 `Menu/...`를 띄운다"와 [[디자인 시스템:조립의 흐름]](변형에서 변형으로)이 다르다. 하위 메뉴의 400ms 지연을 흐름에 어떻게 나타낼지도 함께 정한다.
  - [[디자인 시스템:모션 견본]]의 "`Motion` 변형은 기본 모습에만 둔다", "조립이 만든 상자의 움직임만 조립이 쓴다"와 `Taskbar` 패널 자리의 움직임을 피그마 어디에 두는지.
  - [[디자인 시스템:코드 전용 컴포넌트]]의 배치만 하는 감싸개(`tile-grid`, `column`, `columns`, `list-group`, `layer-surface`)와 "정한 것"의 "피그마에서 조립인 것은 앱으로 옮긴다" 목록이 각각 어느 조립으로 가는지, 앱에 남는지.
  - [[디자인 시스템:크기 변수]]의 앱 CSS 변수(패널 기본 크기, 창 축소 화면 크기 등) 가운데 조립으로 옮길 것.
  - Start 고정됨이 넘칠 때: 문서는 "넘치면 아래로 스크롤"이고 코드는 본문 전체가 한 스크롤이다. 문장을 어느 쪽으로 맞출지.
  - [[검색:결과 화면]]의 "메뉴가 열려 있으면 Esc는 그 메뉴만 먼저 닫는다"가 가리키는 메뉴(검색 패널에는 우클릭 메뉴가 없다).
  - 접근성 모드가 검색 결과의 어느 묶음에 나오는지, 다른 앱(File Explorer, Chrome)도 검색 대상인지. 작업 표시줄에 처음 고정된 세 앱의 차례.
  - Snap Assist 카드의 닫기 버튼도 키보드로 닿게 할지. 탭과 창 미리보기 카드는 닿게 했다([[접근성:역할]]).
  - 접근성 패널의 자리를 데스크톱(네 구석)과 모바일(위·아래)이 따로 기억하는지, 한 값을 나눠 쓰는지.
  - 모바일 탐색기 명령 모음의 `잘라내기` · `이름 바꾸기` · `삭제`. 터치에는 골라 둔 항목이 없어 손가락으로는 늘 비활성이다. 모바일 명령 모음에서 뺄지, 그대로 둘지([[파일 탐색기:모바일]]).
  - 가장 좁은 화면(320)의 작업 표시줄에 접근성 모드 버튼이 들어가는지. 들어가지 않으면 모바일에서 버튼을 처음부터 고정해 둘지.
  - 조립의 흐름도를 e2e 테스트에 잇는 방법. 세트 설명의 `흐름:`·`키보드 흐름:` 줄을 테스트 목록으로 옮기는 길과, 지금 있는 시나리오 도구와의 관계다([[디자인 시스템:조립의 흐름]]).
