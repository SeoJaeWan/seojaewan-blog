_codocs:
  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 임의 작업 검토 마무리: |
  [[임의 작업]]의 항목을 하나씩 검토해 유지·되돌림·문서 반영을 정했다. 남은 논의를 모두 끝낸 뒤 아래 작업을 한 번에 한다. 항목 번호는 검토할 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.

  논의는 모두 끝났다. 결정의 경위는 [[논의 기록]]의 2026-10-29~2026-11-01에 있다. 이 문서의 아래 내용과 [[논의 2026-11-01 테스트 전략]]·[[논의 2026-11-01 코드 폴더 구조]]·[[논의 2026-11-01 문서 구조]]가 일괄 작업의 기준이다.

  진행 규칙:
  - 피그마 작업은 모두 AI가 `use_figma`로 한다. 디자인 판단이 필요한 값은 안을 만들어 확인받는다. 실제 파일에 쓰기 전에 복제본에서 먼저 해 본다. 내보내기는 사람이 하고, AI가 시점과 대상을 알려 준다. 알리기 전에는 내보내지 않는다.
  - 문서 변경, 패키지 4개(`@storybook/addon-vitest`, `@storybook/addon-a11y`, `@vitest/browser-playwright`, `playwright`) 설치, 묶음별 푸시·PR·CI 통과 뒤 병합은 허락받았다. 범위 밖 변경만 묻는다.
  - 일괄 작업이 끝날 때까지 다른 작업은 하지 않는다.

  작업 차례(앞 묶음이 끝나야 다음 묶음을 시작한다):
  1. 기록 정리(끝남)
  2. 문서 구조 이전(끝남)
  3. 동작 문구 고침, 76·33번(끝남)
  4. 테스트 기반(끝남)
  5. `Parity` → `Figma`(끝남)
  6. 폴더 이동(끝남)
  7. 컴포넌트 테스트 → `play`(영역별)(끝남)
  8. 피그마 디자인 수정 6건(피그마는 끝남. 지금 플러그인의 구조 검사가 Figure의 비율 이미지를 막으므로 내보내기는 차례 14에서 함께 한다)
  9. 플러그인 개선(캡처 도구는 끝남). 이 묶음이 병합된 뒤 10이 끝날 때까지 내보내지 않는다
  10. 피그마 변수 전환: 생성기가 옛 규칙과 새 규칙을 함께 쓰게 함 → 새 변수 추가(옛 변수 유지) → 노드 재연결 → code syntax·코드 전용 변수·`@` 줄 → 사람이 내보냄(옛·새 토큰이 함께 들어감)
  11. 영역별 클래스 교체 → 연결 없는 옛 변수 삭제 → 내보내기 → 생성기의 옛 규칙 삭제 → 숫자 lint 켬 → 옛 이름 전체 검색. `ClassNames` 검사는 교체 전에 켠다
  12. 노트북 값과 Screens, 반응형 코드. 앱 E2E(1280×720)와 스토리 테스트(Vitest 기본 화면)의 뷰포트도 정한다. 노트북 구간이 들어오면 지금 값으로는 노트북 코드를 돌리게 된다
  13. 개별 수정, 접근성
  14. 바뀐 컴포넌트·조립 내보내기와 처리: 빈 HUG 컴포넌트, `Figure`, `MenuItem`, `TableCell`, `menu`(Post·TaskbarApp·ChromeMore·ChromeMoreMobile), `chrome`(Page·PostBlocks), `window`(Chrome·SnapAssist), `taskbar`(AppMenu). 개별 수정 중 이 내보내기가 필요한 것(Figure, Zoom, TableCell, pin_off, Menu/Post)은 여기서 한다. `post-blocks` 스토리 데이터를 새 CodeBlock 견본 두 줄과 맞추고 `figma/components/menu-zoom-item`을 정리한다
  15. Guide로 모양 설명을 옮기고 문서에서 지움, 중복 20곳 재확인, [[임의 작업]] 정리, 시험 자원 정리

  시작 전 시험: `p-spacing-sm` 생성 방식과 이름공간 대응(`z`, `rotate`, `shrink`), 옛·새 규칙 공존, 부모 import 금지와 조상 메뉴 보기, `hooks/` 안의 `utils/`, 앱 스토리의 `play`(저장소 초기화, `matchMedia`, 가짜 타이머, 끌기), 앱 axe, 루트 vitest project와 영향 범위 실행, Storybook의 `next/image`, 복제본의 변수 재연결과 덮어쓰기, 실제 파일의 변수 모드.

  정한 것(일괄 작업의 기준):
  - 모양 설명의 기준(원래 논의 1-1): 피그마로 나타낼 수 있는 것은 피그마로 옮기고, 문서에는 동작과 입력·스크롤 판정 문턱(끌기 4px, 스냅 8·64px, 크기 조절 띠, 목차 현재 위치 32px 등)과 실행 중 값(창 기본·최소 크기 등)만 둔다.
  - 캡처 보고서 그림 주소: 댓글 그림 주소에 브랜치 이름 대신 그 실행의 보고 커밋 SHA를 넣는다. 같은 주소면 GitHub가 옛 그림을 보여 주기 때문이다.
  - lint:
    - 코드의 클래스 이름에는 숫자 값이 들어가지 않는다. 모든 값은 피그마 토큰이 붙인 이름으로 온다. `shrink-0`·`rotate-180`·`z-10`·`line-clamp-2`도 예외가 아니다(코드 전용 변수로 이름을 만든다). 숫자로 끝나는 클래스를 막는 lint는 토큰 이름 체계를 바꾼 뒤 켠다.
    - 이름이 `ClassNames`·`CLASS_NAMES`로 끝나는 객체 안의 문자열도 클래스로 검사한다. 이름 규칙을 어긴 객체를 잡는 규칙은 만들지 않는다.
  - 플러그인 구조 검사:
    - 이미지는 Foundations 자산을 원본 비율로 넣는다. 높이는 칸 너비와 자산 비율에서 나오므로 숫자를 정하지 않는다. 이미지 자산 인스턴스의 비율이 바뀌면 막는다.
    - 빈 HUG 슬롯이 있는 컴포넌트는 `Figma` 스토리와 단독 캡처 비교를 없애고, 내용이 채워진 조립 캡처로 확인한다. 플러그인이 `export.json`에 빈 HUG 슬롯을 표시하고 캡처 도구가 그것을 따른다. 피그마가 그리는 100×100은 디자인 값이 아니라 통과용 구성이기 때문이다.
  - 접근성: [[접근성]]에 옮겼다.
  - 반응형:
    - 모양은 PC·노트북·모바일 셋이다. 노트북은 폭 1600 미만 또는 높이 900 미만, 모바일은 폭 768 미만이다(모바일 판정이 먼저). 숫자는 Screens로 확인하며 조정한다.
    - 노트북은 피그마 변수 모드(PC·Laptop)로 간격·크기·글자 값만 바꾼다. 모바일은 지금처럼 `Device=Mobile` 변형이다.
    - 지원하는 가장 작은 크기는 320×568이다. 구간 안에서 작아질 때는 이미 정한 줄어드는 규칙으로 맞추고, 구간마다 가장 작은 크기 Screens를 두어 잘리는 곳을 확인한다.
    - 경계값은 피그마 코드 전용 변수(`breakpoint/mobile/width`, `breakpoint/laptop/width`, `breakpoint/laptop/height`)로 두고, 토큰 생성이 블록 형식 `@custom-variant`(`laptop:`·`mobile:`), 노트북 모드 값의 `@media`, `--breakpoint-*: initial`, TS 상수(`use-device`가 `pc | laptop | mobile`)를 만든다. Tailwind 4.3.3 시험에서 한 줄 형식에 쉼표로 조건을 이으면 깨지고 블록 형식은 되며, lint가 새 변형은 알고 `md:` 같은 기본 구간은 막는 것을 확인했다.
    - Chrome 글 화면(목차, 이미지 크게 보기)은 기기가 아니라 Chrome 창 내용 너비로 넓은·좁은 모양을 가른다. 경계는 피그마 변수로 둔다.
  - 피그마 단일 기준 체계(디자인 정보는 피그마 한 곳에서 관리하고 플러그인이 내보낸다):
    - 적는 자리: 값 하나는 코드 전용 변수(범위 비움). 노드에 변수를 연결할 수 없는 값(회전·최대 줄 수·비율)은 노드에 값으로 두고 플러그인이 같은 값의 코드 전용 변수와 짝지어 이름을 내보낸다(짝이 없으면 막음). 규칙 글은 컴포넌트·변수·스타일 description의 `@키 값` 줄(평문 `description` 기준). 컴포넌트가 아닌 레이어는 주석(섹션에는 달 수 없어 섹션 안 프레임에 단다). 피그마가 가진 정보는 속성으로 가져오고, 가져올 수 없는 것만 `@` 줄에 적는다.
    - 파일 구성: `00 · Guide` 페이지(구성 원칙, Color·Typography·Spacing·Size·Breakpoint·Material·Shadow·Motion·Assets)를 두고 기존 페이지 번호를 하나씩 민다. 가이드는 사람이 읽는 설명이라 내보내지 않고, 가이드 안의 값 글자는 변수에 연결한다. 컴포넌트 하나에 딸린 것은 description에 둔다.
    - 토큰 이름: 클래스는 유틸리티 + 피그마 변수 경로 전체다(`p-spacing-sm`, `rounded-radius-control`, `rotate-rotate-half`). 간격은 none·2xs·xs·sm-nudge·sm·md-nudge·md·lg·xl·2xl·3xl·4xl·5xl(0~48, 쓰지 않는 단계도 남김). 아이콘 크기는 단계 이름, 나머지 크기는 역할 이름이고 같은 값이라도 역할이 다르면 다른 변수다(이름 목록은 일괄 작업 때 피그마 사용처로 초안을 만들어 확인받는다). 기본 색은 `@theme`이 아니라 `:root` 변수로 두어 클래스를 만들지 않는다. 코드 전용 묶음은 회전, 글자 최대 줄 수, 겹침 순서(`layer/*`), 줄어들지 않음(`shrink/none`), 경계값이다.
    - 모션: 키프레임은 지금처럼 읽고, 변형 전환(`reactions`: 트리거·목적지·전환 종류·시간·이징)도 읽어 토큰 값과 대조한다. API로 못 읽는 반복·왕복·재생 시작·유지 조건·포커스 트리거·실행 중 값·동작 줄이기는 `@repeat`·`@direction`·`@trigger`·`@hold`·`@runtime`·`@reduced-motion` 줄로 적는다. 모션 견본은 `@repeat`·`@trigger`, Focused 변형으로 가는 전환이 있는 컴포넌트는 `@trigger focus-visible`이 없으면 막는다. 피그마에 포커스 트리거가 없어 지금 검색 상자 포커스 전환 4건은 `ON_CLICK`으로 들어 있다.
    - 그라데이션: 방사형·각도형은 CSS 변환 규칙과 테스트를 미리 만든다. 다이아몬드는 구조 검사가 막는다.
    - 구현 자료: 플러그인이 변형마다 구현 참고용 레이어 트리(레이어·자동 배치·크기 방식·연결된 변수와 스타일(인스턴스 안 포함)·컴포넌트 속성·선이 레이아웃에 들어가는지·자산 경로·줄임과 최대 줄 수·최소·최대 너비)를 `export.json`에 담는다. 판정에는 쓰지 않는다. 구현은 `export.json`과 PNG → `.codocs`(동작·코드·접근성) → 그래도 모르는 것만 MCP 순서로 보고, `export.json`과 MCP가 다르면 `export.json`을 따르고 차이와 MCP로 메운 것을 보고한다. Bookmark·Toggle 실험에서 뽑기는 오류 없이 됐고(MCP가 오류를 내던 Toggle 포함), 파일만 보고 구현해 틀린 값이 없었다.
    - `.codocs` 경계: 피그마는 디자인이 어떻게 생겼는지(값과 그 뜻·쓰임), `.codocs`는 피그마 작성 규칙·결정과 검토한 대안·기능 동작·접근성·피그마에서 코드로 가는 절차를 가진다. 피그마로 옮긴 내용은 문서에서 지우고 가이드 링크를 남긴다. 옮기는 일은 가이드 페이지를 만든 뒤에 한다.

  피그마에서 할 일(작업 차례 8·10·12·15에 나눠 한다):
  - Figure 이미지를 Foundations 자산의 원본 비율로(10·27번)
  - 확대/축소 줄(MenuZoomItem)을 MenuItem의 `Kind=Zoom` 변형으로 합침(16번)
  - TableCell 본문을 Regular로(21번)
  - Menu/TaskbarApp의 "작업 표시줄에서 고정 해제" 아이콘을 `pin_off`로. 고정 해제는 모두 `pin_off`다(57번)
  - `code-syntax/*`에 Light+ 색 7가지(정규식 `#811f3f`·`#d16969`, 이스케이프 `#ee0000`, 열거형 멤버·`const` 변수 `#0070c1`, JSON 키·CSS 값 `#0451a5`, 잘못된 문법 `#cd3131`, 남색 변수 `#000080`)를 변수로 더하고 CodeBlock 견본에 씀(63번)
  - Menu/Post에 `잘라내기`(Ctrl+X)를 다른 메뉴와 같은 자리로 더함(75번)
  - `00 · Guide` 페이지를 만들고 페이지 번호를 민다. 디자인 문서와 기능 문서의 모양 설명을 가이드·조립·변형·주석으로 옮긴다
  - 변수 이름 바꾸기: 간격 단계 이름, 크기 역할 이름, 아이콘 크기 단계 이름. 인스턴스의 크기 덮어쓰기를 기록하고 되돌린다([[한계:피그마 API 덮어쓰기 함정]])
  - 기존 `code-syntax/*` 13개와 `color/vscode/*` 10개의 code syntax(Web)를 채운다
  - 코드 전용 변수 만들기: 경계값 셋, Chrome 글 화면 경계, 회전(quarter·half·three-quarter), 글자 최대 줄 수, 겹침 순서, `shrink/none`, 그리고 `flex-1`·`min-w-0`·`min-h-0`·`top-1/2`·`col-start-1`·`border-spacing-0`를 대신할 이름(이름은 크기 초안과 함께 확인받는다)
  - code syntax를 변수 이름과 함께 고친다
  - 변수 모드 PC·Laptop을 만들고 노트북 값을 넣는다. 노트북 Screens와 구간마다 가장 작은 크기 Screens를 둔다
  - `@` 줄 채우기: 모션 견본 14개(`@repeat`·`@trigger`, 값은 지금 [[디자인 기반:모션]] 표)와 검색 상자 포커스 전환 4건(`@trigger focus-visible`)

  문서 고침:
  - [[피그마 연동:토큰 생성]]: `TOKEN_NAMES`도 토큰과 함께 생성(2번). 클래스 이름 규칙(유틸리티 + 변수 경로 전체)과 유틸리티 대응표, 모드별 값의 `@media`, `@custom-variant`, 기본 구간 끄기, 경계값 TS 상수, 기본 색은 `:root`, 문자 변수 이름 규칙, 방사형·각도형 변환
  - [[피그마 연동:구조 검사]]: 이미지 자산 비율, 빈 HUG 슬롯 표시, `@` 줄 검사와 필수 줄, 값 짝짓기, 모드 값 빠짐, 다이아몬드 그라데이션
