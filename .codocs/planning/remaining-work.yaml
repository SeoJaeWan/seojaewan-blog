_codocs:
  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 7단계 마무리: |
  [[구현 순서:7단계 기능 구현]]을 마무리한다. 지금 코드가 문서와 다른 곳을 맞추고, 디자인이 없던 화면을 피그마에 그린 뒤 붙인다. 8단계(E2E) 전에 끝낸다.
  1단계(논의한 결정을 문서에 반영)는 끝났다. 아래 단계를 차례로 한다.

  피그마 작업과 내보내기를 코드 작업보다 먼저 한다. 피그마가 필요 없는 코드 작업도 피그마 반영 코드와 같은 영역을 고치는 일이 많아, 피그마 PR 위에서 함께 하면 같은 파일을 한 번만 고치고 피그마 PR과 앱 코드가 부딪히지 않기 때문이다.

  2단계: 피그마 작업. Claude가 피그마 MCP로 [[디자인 시스템]]의 규칙대로 그린다.
  - Chrome: 찾기 막대(⋮ 메뉴의 페이지에서 찾기), 확대 조절(확대/축소), 새 탭 페이지 검색창 추천(주소창 추천과 같은 동작, [[Chrome:새 탭 페이지]])
  - 탐색기: 모바일 주소 줄의 검색 상태(검색 버튼을 누른 뒤, [[모바일:차이]])
  - 글 본문: [[Chrome:Notion 블록]]의 지원 블록 전부, 지원하지 않는 블록 안내 상자, 이미지 크게 보기, 커버, 글자 서식, 코드 문법 강조 색
  - 메뉴: 바탕화면 아이콘 메뉴의 잘라내기와 빈 곳 메뉴의 붙여넣기([[바탕화면:아이콘 우클릭 메뉴]], [[바탕화면:빈 곳 우클릭 메뉴]]), 탐색기 휴지통 빈 곳 메뉴([[파일 탐색기:우클릭 메뉴]]), Start 모두 목록 메뉴([[Start 메뉴:모두]])
  - 메시지 상자 3개: 휴지통에 있는 글(버튼 둘, [[Chrome:휴지통에 있는 글]]), 예약 이름과 같은 이름([[작업 공간:폴더 이름]])
  - `FileItem`·`FileRow` 포커스 상태 정리: `Selected focus`를 없애고 `Focused` 하나로, 선은 레이아웃 크기에 넣지 않음([[컴포넌트 목록:상태]])
  - Start·검색 패널 스크롤바를 본문 높이만큼으로(지금 피그마는 검색칸 옆까지 올라간다)
  - 탭이 여러 개인 Chrome 탭 줄과 탐색기 탭 줄. 탭 사이 간격은 Chrome처럼 0과 구분선이고 변수에 연결한다
  - 자산 `icon-color/Search Focus`의 설명 문장이 한 문장 용도 규칙([[디자인 시스템:피그마 파일]])에 맞는지 확인

  3단계: 사용자 차례. 피그마 플러그인으로 내보낸다. 컴포넌트·조립·토큰 PR이 열린다([[피그마 연동:PR 흐름]]).

  4단계: 코드 작업. 몇 개 PR로 나눈다.
  먼저 3단계에서 열린 PR을 스킬로 처리해 [[피그마 연동:PR 흐름]]의 병합 순서대로 병합한다([[피그마 연동:스킬]]). 그다음 그 위에 아래 작업을 올린다. 같은 영역을 고치는 항목은 한 PR에 묶는다.

  피그마가 필요했던 기능:
  - Chrome 찾기·확대, 모바일 탐색기 검색, 새 탭 페이지 검색 추천
  - Notion 블록 전체와 지원하지 않는 블록 안내 상자, 이미지 크게 보기. 이미지는 [[Notion 이미지 제공]]이 9단계라 그 전까지 임시 이미지로 화면과 크게 보기를 만든다
  - 바탕화면 잘라내기·붙여넣기
  - 휴지통에 있는 글 메시지 상자와 이전·다음 글의 휴지통 글 건너뛰기([[Chrome:휴지통에 있는 글]]), 폴더 이름 메시지 상자 두 개
  - 포커스 표시: `:focus-visible`로 그리고 `focused` prop 지우기
  - 탐색기 휴지통 빈 곳 메뉴, Start 모두 목록 메뉴

  피그마 없이 하는 코드 작업:
  - 휴지통을 메모리에만 두기(저장 범위에서 빼기, [[작업 공간:방문자별 저장]])
  - `Blog`를 휴지통에 넣을 수 있게 하기: 바탕화면·탐색기의 삭제 비활성 풀기, `Blog`를 품은 폴더 막기 지우기, 저장분 복구의 `Blog` 꺼내기 지우기([[작업 공간:휴지통]], [[작업 공간:Notion과 맞추기]])
  - 탐색기를 위치 없이 열 때 "바탕 화면"으로 열기: 작업 표시줄·Start의 탐색기, `+` 새 탭, 작업 표시줄 메뉴의 새 창([[창 동작:열기 규칙]])
  - 화면 크기가 바뀔 때 창을 보이는 동안만 당기고 원래 자리를 기억하기([[창 동작:창 조작]])
  - Start·검색 패널 높이 하한([[Start 메뉴:구성]])
  - 검색어를 둘로 나누기([[검색:입력칸]]), 검색 결과 오른쪽 카드가 고른 항목을 따라가기([[검색:결과 화면]])
  - 목차를 제목 1개부터 보이기([[Chrome:글 화면]]), 없는 글 주소를 그대로 두기([[창 동작:브라우저 주소]]), Start 모두 처음 보기를 범주로([[Start 메뉴:모두]])
  - 옮길 수 없는 곳 위의 `not-allowed` 커서([[바탕화면:아이콘 조작]]), 폴더 이름 입력 규칙([[작업 공간:폴더 이름]])
  - Start "고정됨"·"모두" 영역 이름표([[Start 메뉴:모두]]), 주소 없는 외부 링크 숨기기와 이력서 주소 비우기([[항목 모델:외부 링크]])
  - 메뉴 항목 목록을 만드는 함수를 실제 기능과 스토리가 함께 쓰게 바꾸기: 바탕화면, 탐색기, Start 고정 칸, 작업 표시줄, Chrome ⋮([[디자인 시스템:조립]])
  - 순환 import 검사를 앱 전체와 디자인 시스템으로 넓히기([[저장소 구성:의존 방향]])
  - 바탕화면을 `DesktopWallpaper`·`DesktopIcons`로 나눈 이유(배경화면은 작업 표시줄 뒤까지 깔려 한 덩어리면 DOM이 바뀜)를 코드 주석으로 남기기(없으면)
  - Shiki·KaTeX를 공식 문서로 버전과 서버 사용법을 확인한 뒤 설치하고, 서버 경로에서 본문을 만들 때 처리하기([[기술 스택:글 본문 처리]])
2. E2E: |
  [[구현 순서:8단계 E2E]]를 따른다.
3. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
