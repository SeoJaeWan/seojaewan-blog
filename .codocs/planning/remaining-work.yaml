_codocs:
  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 7단계 마무리: |
  [[구현 순서:7단계 기능 구현]]을 마무리한다. 지금 코드가 문서와 다른 곳을 맞추고, 디자인이 없던 화면을 피그마에 그린 뒤 붙인다. 8단계(E2E) 전에 끝낸다.
  1단계(논의한 결정을 문서에 반영), 2단계(피그마 작업), 3단계(플러그인으로 내보내기)는 끝났다. 아래를 차례로 한다.

  피그마 작업과 내보내기를 코드 작업보다 먼저 했다. 피그마가 필요 없는 코드 작업도 피그마 반영 코드와 같은 영역을 고치는 일이 많아, 피그마 PR 위에서 함께 하면 같은 파일을 한 번만 고치고 피그마 PR과 앱 코드가 부딪히지 않기 때문이다.

  3단계에서 열린 PR(4단계에서 처리):
  - 토큰: #304. 이름이 바뀐 토큰(`file-item/*/stroke-selected-focus` → `stroke-focus`)을 쓰는 코드를 이 PR에서 고친다
  - 컴포넌트: #281~#297(Bookmark, Callout, Checkbox, CodeBlock, Equation, ExplorerAddressRow, ExplorerTab, Figure, FileItem, FileRow, MenuZoomItem, PostCover, Quote, Table, TableCell, Toggle, UnsupportedBlock). 새 자산(`ic_fluent_chevron_up_20_regular`, `equation/Quadratic Formula`)의 생성 코드는 그 자산을 쓰는 PR에서 만든다
  - 조립: #298~#303(Chrome, Menu, MessageBox, Search, Start, Window)
  - MessageBox와 WindowFrame은 그림이 바뀌지 않아 PR이 없다. MessageBox는 버튼 글자 노출만 바뀌었고 코드는 이미 `primaryLabel`·`secondaryLabel`로 받는다

  플러그인 화면 정리: 4단계와 파일이 겹치지 않아 함께 진행한다. [[피그마 연동:플러그인 화면]]의 배치, 설정, 대상 목록, 이름 붙여넣기 선택, 진행·결과 화면이다.

  4단계: 코드 작업. 몇 개 PR로 나눈다.
  먼저 3단계에서 열린 PR을 스킬로 처리해 [[피그마 연동:PR 흐름]]의 병합 순서대로 병합한다([[피그마 연동:스킬]]). 그다음 그 위에 아래 작업을 올린다. 같은 영역을 고치는 항목은 한 PR에 묶는다.

  피그마가 필요했던 기능:
  - Notion 블록 전체와 지원하지 않는 블록 안내 상자. 이미지는 [[Notion 이미지 제공]]이 9단계라 그 전까지 임시 이미지로 화면을 만든다
  - 글 본문 컴포넌트(Checkbox, PostCover, Figure, Equation, Quote, Callout, Toggle, Table, TableCell, Bookmark, UnsupportedBlock)와 조립 `Chrome/PostBlocks`·`Chrome/ImageViewer`. CodeBlock은 코드 문자열 대신 강조된 코드를 자리 prop(children)으로 받는다. 제목은 제목 1·2·3을 글자 스타일 `Title`·`Subtitle`·`Body Large Strong`으로 그리고, 인라인 코드는 `post/inline-code` 글자색으로 그린다([[Chrome:Notion 블록]])
2. E2E: |
  [[구현 순서:8단계 E2E]]를 따른다.
3. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
