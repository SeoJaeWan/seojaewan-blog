  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 컴포넌트·조립 내보내기: |
  바뀐 컴포넌트·조립 내보내기와 처리: 빈 HUG 컴포넌트, `Figure`, `MenuItem`, `TableCell`, `menu`(Post·TaskbarApp·ChromeMore·ChromeMoreMobile), `chrome`(Page·PostBlocks), `window`(Chrome·SnapAssist), `taskbar`(AppMenu). 개별 수정 중 이 내보내기가 필요한 것(Figure, Zoom, TableCell, pin_off, Menu/Post)은 여기서 한다. `post-blocks` 스토리 데이터를 새 CodeBlock 견본 두 줄과 맞추고 `figma/components/menu-zoom-item`을 정리한다.

  시험 자원:
  - 시험용 피그마 파일: https://www.figma.com/design/kAGzeg3UkhiIEk5326Redk (개인 팀 "서재완")
  - worktree: `.claude/worktrees/`의 시험용 폴더
2. E2E: |
  [[구현 순서:8단계 E2E]]를 따른다.
3. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
