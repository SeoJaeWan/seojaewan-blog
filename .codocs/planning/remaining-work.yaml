_codocs:
  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 임의 작업 검토: |
  [[임의 작업]]에 남은 항목을 사람이 검토한다. 시험용 피그마 파일(https://www.figma.com/design/kAGzeg3UkhiIEk5326Redk, 개인 팀 "서재완")을 지울지 정한다. 키가 `pLJOTo7Iog7qr5FbiKFNiH`, `Bpj9jmQTf4SkBHlcDrCd5E`, `tq8xBRGjkJCSum7kwwVd2D`인 시험용 파일도 함께 정한다.
  사람이 정할 결정도 있다. 근거는 각 [[임의 작업]] 항목에 있다.
  - CodeBlock 샘플 색: 실제 강조기 결과가 피그마 손 칠과 9곳 다르다. 피그마 샘플을 고칠지, 샘플 코드를 바꿀지 정한다("스토리 스타일 금지 ④: CodeBlock 실제 코드 강조").
  - `Patterns/Chrome/ImageViewer`: 피그마는 800×500 고정이고 앱 규칙은 "맞추되 원본보다 크지 않게"다. 어느 쪽을 따를지 정한다("스토리 스타일 금지 ⑥: 앱 Chrome·창·바탕화면 스토리").
  - `Patterns/Explorer/Content`: 빈 탐색 창 슬롯 240×192에 크기 변수가 없어 스토리가 아직 손으로 크기를 준다. 캡처에서 뺄지, 피그마에 크기를 줄지 정한다. 스토리 lint 임시 예외 목록에 있다("스토리 스타일 금지 ⑦: 앱 Start·작업 표시줄·탐색기 스토리").
  - Tooltip: 피그마는 줄을 바꾸지 않고 코드는 최대 너비에서 줄바꿈을 둔다. 어느 쪽에 맞출지 정한다("Tooltip PR #505: label HUG, 코드 변경 없음").
  - RichText: Notion 글자색·형광펜을 [[Notion 블록:모양]]대로 그리지 않는다. 그릴지 정한다("조립 PR #492 chrome: RichText 컴포넌트와 인라인 코드 글자 스타일").
2. 시나리오 케이스의 빠진 값 채우기: |
  빠진 값마다 사람과 논의해 케이스를 만들거나 케이스가 없는 이유를 적는다. 목록은 시나리오 케이스 보고서(https://seojaewan.github.io/seojaewan-blog/)가 보여 준다. 지금 빠진 값은 179개다(행위 26개, 케이스 67개, 값 344개 가운데 케이스가 다루는 값 159개(같은 케이스 9개 포함), 이유 있음 6개). 규칙은 [[테스트 작성 규칙:E2E]]을 따른다.
3. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
4. 디자인 시스템 흐름 점검: |
  3번이 끝나면 지금까지 세운 디자인 시스템 흐름 전체를 점검한다. 피그마 작성과 내보내기, 플러그인 PR 처리([[피그마 연동]]), 토큰과 lint로 스타일을 강제하는 장치([[피그마 연동:토큰 사용 강제]]), 테스트 층(단위, 스토리 `play`, axe, 캡처 표, 시나리오 케이스, 모션 검사, [[테스트 작성 규칙:테스트 지침]])과 CI가 대상이다.
  - 규칙이 실제로 지켜지는지, 문서에만 있고 검사하지 않는 규칙이 있는지 본다.
  - 겹치거나 이제 필요 없는 규칙과 검사를 찾아 줄인다.
  - 흐름마다 걸리는 시간(CI 시간, 사람이 하는 단계)을 재고 줄일 곳을 찾는다.
