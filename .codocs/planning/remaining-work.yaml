개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서:7단계 기능 구현]]을 따른다. 진행 이력은 PR에서 관리한다.
1. 피그마 내보낸 PR 처리: |
  플러그인이 연 PR을 스킬(`figma-token-pr`, `figma-component-pr`, `figma-motion-pr`) 절차로 이 순서대로 처리한다. 앞 PR을 병합한 뒤 다음 PR에 `main`을 받아 온다.

  | 순서 | PR | 남은 코드 작업 |
  |---|---|---|
  | 1 | #226 FileRow | `View=Recycle bin` 변형과 `originalLocation`·`deletedDate` prop |
  | 2 | #227 DetailsHeader | 휴지통용 열 구성 |
  | 3 | #228 Menu | 라디오 하위 메뉴 3개를 하나의 `RadioGroup`으로(기본값 이름·오름차순·보통 아이콘), `pin_off`·`zoom_in` 아이콘 |
  | 4 | #229 Chrome | 검색 결과 주소 데이터 |
  | 5 | #230 Window | React 폴더 창 데이터, 휴지통 변형(자세히 보기), SnapLayoutMenu는 메뉴가 열린 동안 최대화 버튼 Hover 유지, SnapAssist 축소 창 명령 모음 |
  | 6 | #231 Taskbar | 축소 창 미리보기에서 명령 모음 표시 |
  | 7 | #232 Desktop | 내보낸 원본과 현재 `images/wallpaper-bloom` 자산 사용을 대조하고 필요한 차이 반영 |
  | 8 | #233 MessageBox | 새 영역. `MessageBox/EmptyRecycleBin` 조립(제목 "휴지통 비우기", 버튼 "확인") |
  | 9 | #234 애니메이션 | `motion-search-box-focus` 모션 클래스와 스토리를 구현하고 필요한 연결을 추가한다. 토큰·SearchBox PR 다음에 최신 `main`을 받아 수정된 검사기로 확인한다 |
2. 기능 구현: |
  [[구현 순서:7단계 기능 구현]]의 ㄱ부터 기능마다 PR로 진행한다. 브랜치 이름은 [[Git 작업 규칙:브랜치]]를 따른다.
3. E2E: |
  [[구현 순서:8단계 E2E]]를 따른다.
4. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
