  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 임의 작업 검토: |
  [[임의 작업]]에 남은 항목을 사람이 검토한다. 시험용 피그마 파일(https://www.figma.com/design/kAGzeg3UkhiIEk5326Redk, 개인 팀 "서재완")을 지울지 정한다.
2. 시나리오 케이스의 빠진 값 채우기: |
  빠진 값마다 사람과 논의해 케이스를 만들거나 케이스가 없는 이유를 적는다. 목록은 시나리오 케이스 보고서(https://seojaewan.github.io/seojaewan-blog/)가 보여 준다. 지금 빠진 값은 179개다(행위 26개, 케이스 67개, 값 344개 가운데 케이스가 다루는 값 159개(같은 케이스 9개 포함), 이유 있음 6개). 규칙은 [[테스트 작성 규칙:E2E]]을 따른다.
3. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
4. 디자인 시스템 흐름 점검: |
  3번이 끝나면 지금까지 세운 디자인 시스템 흐름 전체를 점검한다. 피그마 작성과 내보내기, 플러그인 PR 처리([[피그마 연동]]), 토큰과 lint로 스타일을 강제하는 장치([[피그마 연동:토큰 사용 강제]]), 테스트 층(단위, 스토리 `play`, axe, 캡처 표, 시나리오 케이스, 모션 검사, [[테스트 작성 규칙:테스트 지침]])과 CI가 대상이다.
  - 규칙이 실제로 지켜지는지, 문서에만 있고 검사하지 않는 규칙이 있는지 본다.
  - 겹치거나 이제 필요 없는 규칙과 검사를 찾아 줄인다.
  - 흐름마다 걸리는 시간(CI 시간, 사람이 하는 단계)을 재고 줄일 곳을 찾는다.
5. 색 이름 재정리: |
  색 토큰을 계열·명도 원색 한 층으로 바꾸는 정리([[디자인 기반:토큰 이름]])가 끝나면, 명도를 5·10 단위로 한 번 더 줄인다.
6. 토큰 PR과 모션 PR의 캡처 표 빼기: |
  토큰 PR과 모션 PR에서는 피그마 캡처 표를 만들지 않는다. 토큰은 값 1:1 비교, 모션은 모션 시간 검사, 색 어긋남은 컴포넌트 PR의 피그마 비교가 잡는다. 캡처 도구와 CI, [[피그마 연동]] 문서를 고친다.
