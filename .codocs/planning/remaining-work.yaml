_codocs:
  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
2. 시나리오 케이스의 빠진 값 채우기: |
  빠진 값마다 사람과 논의해 케이스를 만들거나 케이스가 없는 이유를 적는다. 목록은 시나리오 케이스 보고서가 보여 준다(보고서 주소는 `https://scenario-cases.seojaewan.com/`이다. [[배포 환경:CI]]). 지금 빠진 값은 181개다(행위 26개, 케이스 67개, 값 344개 가운데 케이스가 다루는 값 157개(같은 케이스 7개 포함), 이유 있음 6개). 규칙은 [[테스트 작성 규칙:E2E]]을 따른다.
3. 디자인 시스템 흐름 점검: |
  1번이 끝나면 지금까지 세운 디자인 시스템 흐름 전체를 점검한다. 피그마 작성과 내보내기, 플러그인 PR 처리([[피그마 연동]]), 토큰과 lint로 스타일을 강제하는 장치([[피그마 연동:토큰 사용 강제]]), 테스트 층(단위, 스토리 `play`, axe, 캡처 표, 시나리오 케이스, 모션 검사, [[테스트 작성 규칙:테스트 지침]])과 CI가 대상이다.
  - 규칙이 실제로 지켜지는지, 문서에만 있고 검사하지 않는 규칙이 있는지 본다.
  - 겹치거나 이제 필요 없는 규칙과 검사를 찾아 줄인다.
  - 흐름마다 걸리는 시간(CI 시간, 사람이 하는 단계)을 재고 줄일 곳을 찾는다.
4. 색 이름 재정리: |
  색 토큰을 계열·명도 원색 한 층으로 바꾸는 정리([[디자인 기반:토큰 이름]])가 끝나면, 명도를 5·10 단위로 한 번 더 줄인다.
5. 토큰 PR과 모션 PR의 캡처 표 빼기: |
  토큰 PR과 모션 PR에서는 피그마 캡처 표를 만들지 않는다. 토큰은 값 1:1 비교, 모션은 모션 시간 검사, 색 어긋남은 컴포넌트 PR의 피그마 비교가 잡는다. 캡처 도구와 CI, [[피그마 연동]] 문서를 고친다.
6. 플러그인 재구성: |
  2026-11-09 결정([[논의 2026-11-09 피그마 파일 구조 정리]])으로 고친 문서와 지금 플러그인·캡처 도구·스킬이 다른 곳이다. 조립을 피그마에서 고치기(7번) 전에 먼저 한다.
  - 조립 내보내기를 보고로 바꾼다. 구조 검사 없이 그림, 사용 컴포넌트, 컴포넌트 밖에서 그린 것, Foundations에 없는 값(가까운 토큰), "표시용" 주석 분류, 움직임을 내고, 조립 프레임 밖은 내보내지 않는다([[피그마 연동:피그마 플러그인]], [[피그마 연동:구조 검사]]). 조립 배치 프레임 칠 검사를 없앤다.
  - 캡처 표에서 조립도 `피그마 | 코드 | 차이`로 보여 준다(참고용, 판정 없음). 지금의 이전 코드 그림(`parity-captures`) 비교를 함께 남길지도 이때 정한다([[피그마 연동:캡처 표]]).
  - `@trigger`·`@repeat`·`@reduced-motion`·`@runtime`·`@sample-size`를 없애고, 재생 설정 Loop, Development·Accessibility 주석, 프레임 스크롤 설정, 프로토타입 오버레이, 변수 연결 여부로 읽는다([[피그마 연동:구조 검사]]). 피그마의 그 줄들을 지우고, Accessibility 주석에서 `motion.css`의 동작 줄이기 예외 목록을 만든다([[피그마 연동:모션]]).
  - 움직임을 컴포넌트 원본(안쪽 움직임)과 조립 프로토타입 흐름(요소 전체·공통 움직임)에서 읽고, 견본 프레임을 없앤다([[디자인 기반:모션 견본]]). 아직 정하지 않은 것: 조립 흐름으로 옮긴 움직임의 모션 이름 규칙(모션 클래스 이름을 어디서 얻을지)과 `@hold`의 자리. 이 작업에서 시험하며 정한다.
  - 코드 전용 컴포넌트([[컴포넌트 목록:코드 전용 컴포넌트]])를 내보내기와 `Figma` 스토리 규칙에서 빼고, 그 `Figma` 스토리를 동작 테스트로 바꾼다([[피그마 연동:스토리 규칙]]).
  - `figma-component-pr`·`figma-motion-pr` 스킬과 플러그인·캡처 도구 테스트를 위 규칙에 맞춘다.
7. 피그마 마무리: |
  6번 뒤에 피그마를 문서에 맞춘다. 피그마 작업은 Claude가 `use_figma`로 하고, 내보내기는 사람이 누른다.
  - 감싸기·배치용 컴포넌트를 피그마에서 빼고([[컴포넌트 목록:코드 전용 컴포넌트]]), 이들을 쓰던 컴포넌트는 자동 배치나 직접 놓기로 바꾼다. 1단계에 만든 StartMenuHeader는 되돌린다.
  - Toc는 `Items` 슬롯만 두고 "넘치면 세로 스크롤" Development 주석을 단다([[디자인 시스템:컴포넌트 조립 규칙]]).
  - 조립: Start(본문 덧칠·띠 구분선을 직접 그림, 패널 크기, [[Start 메뉴:구성]], [[디자인 기반:재질 효과]]), 검색 패널 크기·자리([[검색:개요]]), 범주 팝업(Start 정가운데, 쪽 넘김, [[Start 메뉴:모두]]), 열린 메뉴·오버레이·트리거 프로토타입([[디자인 시스템:팝업]]), 움직임을 조립 흐름에 걸기(범주 팝업 열기·닫기·쪽 넘김, 패널·메뉴·창 미리보기·창·점프 목록, 끌기([[항목 조작:순서 바꾸기 끌기]]), 고정됨 이동 교차 페이드([[Start 메뉴:고정됨]])).
  - Screens: 바뀐 크기와 열린 팝업 장면([[디자인 시스템:Screens]]).
  - Guide 내용을 변수·스타일 description, Foundations 섹션 글로 옮긴 뒤 Guide 페이지를 지운다([[디자인 시스템:피그마 파일]]). 플러그인 안내 문구 4곳("00 · Guide의 Motion")과 `figma-motion-pr` 스킬의 확인 기준을 함께 고친다.
  - 미카 흐림 값(20과 60 중)은 이때 그림으로 정한다([[디자인 기반:검토한 대안]]).
8. 내보내기와 코드: |
  7번을 내보내 코드를 문서에 맞춘다.
  - 토큰 PR, 컴포넌트 PR, 애니메이션 PR, 조립 PR을 차례로 처리하고 병합한다([[피그마 연동:PR 흐름]]). 범주 펼침 팝업의 자리·크기·쪽 넘김·여닫는 움직임과 다른 카드를 누르면 닫히기만 함([[Start 메뉴:모두]]), Start 고정됨 이동의 교차 페이드([[Start 메뉴:고정됨]]), 누를 때·끄는 동안의 배율([[항목 조작:순서 바꾸기 끌기]]), Start·검색 패널 크기와 작은 화면에서 줄이기·검색 패널 자리([[Start 메뉴:구성]], [[검색:개요]]), Start 띠 구조와 재질 덧칠, 미카 제목 줄과 불투명한 창 본문([[디자인 기반:재질 효과]]), 디자인 시스템 Scrollbar 펼침 조건([[디자인 기반:겹쳐 놓기]])이 이 PR들로 들어온다.
  - 코드만 고칠 것: 범주 카드 커서와 키보드([[Start 메뉴:모두]]), Chrome 페이지 여백, 탐색기 주소창의 글·외부 링크 열기와 휴지통 항목 메시지 상자([[파일 탐색기:주소창 편집]]), 목차 부드러운 스크롤과 Toc를 ScrollArea로 감싸기([[Chrome:글 화면]]), 웹 페이지 스크롤바를 꾸미거나 숨기는 스타일이 없는지 확인([[디자인 기반:겹쳐 놓기]]), 끌기 시작 때 튀는 것([[항목 조작:순서 바꾸기 끌기]]), 작업 표시줄 창 미리보기·우클릭 메뉴와 작업 표시줄 사이 간격, 동작 줄이기에서 hover·pressed 색 전환도 바로 바뀌게 하기([[디자인 기반:동작 줄이기]]).
9. CI 범위: |
  지금 `ci.yml`은 모든 PR에서 전체가 돈다. [[피그마 연동:CI]]의 `ci.yml` 범위대로 바꾼다. 먼저 turbo `--affected`가 lock 파일 변화를 패키지별로 고르는지, 단위 테스트를 바뀐 것만 고를 수 있는지 시험한다.
10. 배포: |
  6~9번이 끝나면 버전 PR을 병합해 배포하고([[배포 환경]]), 배포한 사이트의 주요 화면을 캡처해 확인한다.
