_codocs:
  id: remaining-work
  name: 남은 작업
  parent:
    - seojaewan 블로그
개요: |
  현재 남은 작업을 순서대로 모은다. 완료된 항목은 지운다.
  기능 구현 순서는 [[구현 순서]]를 따른다. 진행 이력은 PR에서 관리한다.
  작업마다 따를 규칙은 다시 적지 않고, 그 규칙이 있는 문서 섹션을 가리킨다.
1. 콘텐츠와 공개: |
  [[구현 순서:9단계 콘텐츠와 공개]]를 따른다.
2. 시나리오 케이스의 빠진 값 채우기: |
  빠진 값마다 사람과 논의해 케이스를 만들거나 케이스가 없는 이유를 적는다. 목록은 시나리오 케이스 보고서가 보여 준다(보고서 주소는 `https://scenario-cases.seojaewan.com/`이다. [[배포 환경:CI]]). 지금 빠진 값은 181개다(행위 26개, 케이스 67개, 값 344개 가운데 케이스가 다루는 값 157개(같은 케이스 7개 포함), 이유 있음 6개). 규칙은 [[테스트 작성 규칙:E2E]]을 따른다.
3. 디자인 시스템 흐름 점검: |
  1번이 끝나면 지금까지 세운 디자인 시스템 흐름 전체를 점검한다. 피그마 작성과 내보내기, 플러그인 PR 처리([[피그마 연동]]), 토큰과 lint로 스타일을 강제하는 장치([[피그마 연동:토큰 사용 강제]]), 테스트 층(단위, 스토리 `play`, axe, 캡처 표, 시나리오 케이스, 모션 검사, [[테스트 작성 규칙:테스트 지침]])과 CI가 대상이다.
  - 규칙이 실제로 지켜지는지, 문서에만 있고 검사하지 않는 규칙이 있는지 본다.
  - 겹치거나 이제 필요 없는 규칙과 검사를 찾아 줄인다.
  - 흐름마다 걸리는 시간(CI 시간, 사람이 하는 단계)을 재고 줄일 곳을 찾는다.
4. 색 이름 재정리: |
  색 토큰을 계열·명도 원색 한 층으로 바꾸는 정리([[디자인 기반:토큰 이름]])가 끝나면, 명도를 5·10 단위로 한 번 더 줄인다.
5. 토큰 PR과 모션 PR의 캡처 표 빼기: |
  토큰 PR과 모션 PR에서는 피그마 캡처 표를 만들지 않는다. 토큰은 값 1:1 비교, 모션은 모션 시간 검사, 색 어긋남은 컴포넌트 PR의 피그마 비교가 잡는다. 캡처 도구와 CI, [[피그마 연동]] 문서를 고친다.
6. 피드백 결정 1단계 피그마 정리: |
  2026-11-09 결정([[논의 2026-11-09 피그마 파일 구조 정리]])으로 고친 문서와 지금 피그마가 다른 곳이다. 2026-11-09 작업 계획 1단계에서 플러그인을 바꾸지 않고 되는 것부터 고치고, 토큰·컴포넌트·조립·애니메이션 PR로 내보내 코드를 맞춘다.
  - Foundations: 재질 값([[디자인 기반:재질 효과]]), 모션 시간·배율 변수, `Layout` 섹션을 `Size`로([[디자인 기반:크기 변수]]), 동작 줄이기 기준 한 줄과 ProgressRing Accessibility 주석([[디자인 기반:동작 줄이기]]).
  - Components: 속성 표·`.page_header`·축 이름표 지우기, 묶음을 기본 컨트롤·화면 영역·블로그로 다시 나누기([[디자인 시스템:피그마 파일]]), TocItem·Toc, MenuItem 체크 표시, `Start/CategoryFolder` 데스크톱·모바일, Start 패널 크기·검색 띠·사용자 띠·검색 상자([[Start 메뉴:구성]]).
  - 움직임: 범주 팝업 열기·닫기·쪽 넘김([[Start 메뉴:모두]]), 패널·메뉴·창 미리보기·창·점프 목록 값, 끌기([[항목 조작:순서 바꾸기 끌기]]), 고정됨 이동 교차 페이드([[Start 메뉴:고정됨]]). 플러그인을 바꾸기 전이라 지금 방식(Foundations 견본)으로 만든다([[디자인 기반:모션 견본]]).
  - Screens·Patterns: 바뀐 크기, 열린 팝업([[디자인 시스템:Screens]]), 오버레이·트리거 프로토타입([[디자인 시스템:조립]], [[디자인 시스템:팝업]]).
7. 피드백 결정 2단계 코드: |
  2026-11-09 작업 계획 2단계다. 지금 코드가 문서와 다른 곳이다. 1단계 PR들이 바꾸는 파일과 겹치면 그 PR 뒤로 미룬다.
  - 범주 카드 커서와 키보드, 범주 펼침 팝업의 자리·크기·쪽 넘김·여닫는 움직임, 다른 카드를 누르면 닫히기만 함([[Start 메뉴:모두]]).
  - Start 고정됨 이동의 교차 페이드([[Start 메뉴:고정됨]]), 끌기 시작 때 튀는 것과 누를 때·끄는 동안의 배율([[항목 조작:순서 바꾸기 끌기]]).
  - Start·검색 패널 크기와 작은 화면에서 줄이기, 검색 패널 자리([[Start 메뉴:구성]], [[검색:개요]]), Start 띠 구조와 재질 덧칠([[디자인 기반:재질 효과]]).
  - 탐색기 주소창의 글·외부 링크 열기와 휴지통 항목 메시지 상자([[파일 탐색기:주소창 편집]]).
  - 목차 부드러운 스크롤과 ScrollArea, 웹 페이지 스크롤바를 꾸미거나 숨기는 스타일 빼기([[Chrome:글 화면]], [[디자인 기반:겹쳐 놓기]]).
  - 디자인 시스템 Scrollbar 펼침 조건([[디자인 기반:겹쳐 놓기]]). Chrome 페이지 여백, 작업 표시줄 창 미리보기·우클릭 메뉴와 작업 표시줄 사이 간격도 피그마 값대로 맞춘다.
8. 피드백 결정 3단계 플러그인 재구성: |
  2026-11-09 작업 계획 3단계다. 지금 플러그인·피그마·스킬이 문서와 다른 곳이다.
  - `@trigger`·`@repeat`·`@reduced-motion`·`@runtime`·`@sample-size`를 없애고, 재생 설정 Loop, Development·Accessibility 주석, 프레임 스크롤 설정, 프로토타입 오버레이, 변수 연결 여부로 읽기([[피그마 연동:구조 검사]]). 피그마의 그 줄들을 지우고, Accessibility 주석에서 `motion.css`의 동작 줄이기 예외 목록 만들기([[피그마 연동:모션]]).
  - 움직임을 컴포넌트 원본과 조립 프로토타입 흐름에서 읽고, 1단계에서 만든 견본을 그 자리로 옮긴 뒤 `Foundations / Motion` 견본 프레임 지우기([[디자인 기반:모션 견본]]). 그 전에 모션 클래스 이름을 어디서 얻을지와 `@hold`를 어디에 둘지 정한다.
  - Guide 내용을 변수·스타일 description, Foundations 섹션 글로 옮긴 뒤 Guide 페이지 지우기([[디자인 시스템:피그마 파일]]). 플러그인 안내 문구 4곳("00 · Guide의 Motion")과 `figma-motion-pr` 스킬의 확인 기준을 함께 고친다.
  - 모양 없는 기술 요소의 목록을 정하고, 피그마에서 뺐을 때 내보내기·캡처 검사·문서("디자인 시스템 컴포넌트는 피그마에서 온다", "모든 컴포넌트가 `Figma` 스토리를 갖는다")가 깨지지 않는지 시험한 뒤 정리한다.
9. 피드백 결정 4단계 CI 범위: |
  2026-11-09 작업 계획 4단계다. 지금 `ci.yml`은 모든 PR에서 전체가 돈다. [[피그마 연동:CI]]의 `ci.yml` 범위대로 바꾼다. 먼저 turbo `--affected`가 lock 파일 변화를 패키지별로 고르는지, 단위 테스트를 바뀐 것만 고를 수 있는지 시험한다.
