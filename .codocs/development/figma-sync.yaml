_codocs:
  id: figma-sync
  name: 피그마 연동
  parent:
    - 개발 컨벤션
개요: |
  피그마 디자인을 코드로 옮기고, 옮긴 결과가 피그마와 같은지 확인하는 방법이다.
  피그마가 디자인의 기준이라는 원칙을 지키고, 한번 맞춘 컴포넌트와 조립이 이후 변경으로 깨지지 않게 지킨다.

  기계가 보장하는 것과 사람이 보는 것을 나눈다.
  - 기계가 보장한다: 토큰과 자산. 토큰은 피그마 변수·스타일에서 변환 스크립트가 `tokens.css`를 만들고([[피그마 연동:토큰 생성]]), CI가 다시 만들어 같은지 본다([[피그마 연동:토큰 검사]]). 컴포넌트는 `tokens.css`의 토큰 클래스만 쓴다([[피그마 연동:토큰 사용 강제]]). 아이콘·이미지는 피그마에서 내보낸 파일에서 생성기가 코드 자산을 만들고, CI가 다시 만들어 바이트가 같은지 본다([[피그마 연동:자산]]).
  - 사람이 본다: 컴포넌트와 조립의 모습. 피그마 그림, 코드 그림, 두 그림의 차이 그림을 나란히 놓은 캡처 표를 PR 댓글로 남기고 사람이 보고 병합한다([[피그마 연동:캡처 표]]). 레이어별 값 판정은 하지 않는다([[피그마 연동:검토한 대안]]).

  피그마의 시각 값은 모두 변수나 스타일에 연결되어 있으므로([[피그마 연동:구조 검사]]), 코드가 같은 토큰 클래스를 쓰면 값도 같다. 어떤 토큰을 어디에 썼는지는 캡처 표에서 모습으로 확인한다.
흐름: |
  1. 피그마 정리: [[디자인 시스템]]과 [[디자인 기반]]의 규칙대로 Foundations, Components, Patterns를 만든다.
  2. 구조 검사와 내보내기: 플러그인이 구조를 검사하고, 통과하면 PR을 연다. 토큰이 바뀌었으면 토큰 PR, 컴포넌트는 하나마다 컴포넌트 PR, 조립은 영역마다 조립 PR이다([[피그마 연동:피그마 플러그인]], [[피그마 연동:PR 흐름]]).
  3. 구현: 사람이 시점을 골라 AI에게 스킬로 PR 처리를 맡긴다([[피그마 연동:스킬]]). 토큰 PR은 생성된 `tokens.css`를 확인하고, 컴포넌트·조립 PR은 피그마 그림을 보고 코드와 스토리를 만든다.
  4. 확인: CI가 토큰과 자산을 다시 만들어 비교하고, 영향받는 컴포넌트와 조립을 캡처해 캡처 표를 PR 댓글로 남긴다([[피그마 연동:캡처 범위]], [[피그마 연동:CI]]).
  5. 병합: 사람이 캡처 표를 보고 병합한다. `main`에 병합되면 영향받은 컴포넌트와 조립을 캡처해 `parity-captures` 브랜치에 저장한다. 다음 플러그인 PR 본문의 "현재 구현" 열이 이 캡처다.

  코드만 바꾼 PR(리팩터링 등)도 영향받는 컴포넌트나 조립이 있으면 같은 캡처 표를 받는다. 피그마 쪽 기준은 저장소에 있는 내보낸 그림이다.
  피그마 쪽 변경은 항상 PR로만 들어오므로 정기적인 전체 비교는 두지 않는다.
토큰 생성: |
  피그마의 모든 변수와 스타일(색, 간격, 크기, 반경, 선 두께, 불투명도, 서체, 모션, 그림자, 그라데이션, 글자 스타일, 재질)을 변환 스크립트가 `figma/tokens.json`에서 `src/tokens.css`로 만든다. `tokens.css`는 생성 파일이라 손으로 고치지 않는다.

  - 변환 스크립트는 `packages/design-system/scripts/tokens/`에 두고(`generate:tokens`), 변환 핵심은 Node와 피그마 API를 쓰지 않는 함수로 만든다. 플러그인도 같은 함수로 `tokens.css`를 만든다([[피그마 연동:피그마 플러그인]]).
  - `tokens.json`은 W3C 디자인 토큰 형식(DTCG)이다. 토큰마다 `$value`와 `$type`을 두고, 다른 토큰을 가리키는 값은 `{color.gray.100}`처럼 경로로 남긴다. 글자 스타일과 효과·칠 스타일도 같은 파일에 넣는다.

  이름:
  - CSS 변수 이름은 `--`에 피그마 경로를 `-`로 이은 것이다. 스타일도 같다. 소문자로 바꾸고, 공백과 괄호는 `-`로 바꾸고, 이어진 `-`는 하나로 줄인다. 예: `color/gray/100` → `--color-gray-100`, `text-fill/primary` → `--text-fill-primary`, `size/icon/16` → `--size-icon-16`, `Surface/Flyout (Acrylic)` → `--surface-flyout-acrylic`.
  - 서로 다른 토큰이 같은 CSS 이름이 되면 생성이 실패한다. 피그마에서 이름을 고친다.
  - 클래스는 `@theme`의 변수와 `@utility`로 만든다. `@utility <접두어>-*` 안에서 `--value(--<이름공간>-*)`로 변수를 고른다. 이름공간은 피그마 경로의 첫 마디다.
    - 값 종류 이름공간(`spacing`, `size`, `radius`, `stroke-width`, `opacity`, `font/*`, `motion/*`)은 클래스에서 이름공간을 빼고 나머지만 쓴다.
    - 색과 스타일은 이름 전체를 쓴다. 묶음 이름(`text-fill`, `accent-fill`, `elevation`)이 쓰임을 나타내기 때문이다.

  | 피그마 | CSS 변수 | 클래스 |
  |---|---|---|
  | `color/gray/100`(Primitive) | `--color-gray-100` | 컴포넌트에서 쓰지 않는다([[기술 스택:스타일링]]) |
  | `text-fill/primary`, `accent-fill/default` 등 Semantic·Component 색 | `--text-fill-primary` | `text-text-fill-primary`, `bg-accent-fill-default`, `border-*`, `outline-*` |
  | `spacing/12` | `--spacing-12` | `p-12`, `gap-12` 등 |
  | `size/icon/16`, `size/control/height`, `size/240` | `--size-icon-16` | `w-icon-16`, `h-control-height`, `size-*`, `min-w-240` 등 |
  | `radius/control` | `--radius-control` | `rounded-control` |
  | `stroke-width/default` | `--stroke-width-default` | `border-default`, `outline-default`, `inner-border-w-default` |
  | `opacity/cut` | `--opacity-cut` | `opacity-cut` |
  | `font/family/base` | `--font-family-base` | `font-base` |
  | `font/weight/semibold`, `font/size/body`, `font/line-height/body` | `--font-weight-semibold` 등 | `font-semibold`, `text-body`, `leading-body` |
  | `motion/duration/fast`, `motion/easing/direct-entrance` | `--motion-duration-fast` 등 | `duration-fast`, `ease-direct-entrance` |
  | `motion/scale/*`, `motion/delay/*` | `--motion-scale-*` 등 | 없음(`var()`로 쓴다) |
  | 글자 스타일 `Body Strong` | 없음 | `type-body-strong`(연결된 서체·크기·굵기·줄 높이·자간 변수를 함께 건다) |
  | 글자 스타일 `Hangul/*` | 없음 | 만들지 않는다. 같은 이름의 라틴 스타일과 연결 변수가 같아야 하고, 다르면 생성이 실패한다([[디자인 기반:서체]]) |
  | 효과 스타일 `Elevation/Flyout`(그림자) | `--elevation-flyout` | `shadow-elevation-flyout` |
  | 효과 스타일 `Material/Acrylic`(배경 블러) | `--material-acrylic` | `backdrop-blur-material-acrylic` |
  | 효과 스타일 `Surface/*`(그림자 + 배경 블러) | `--surface-<이름>-shadow`, `--surface-<이름>-backdrop-blur` | `surface-<이름>`(둘을 함께 건다) |
  | 칠 스타일 `Elevation/Control Border`(그라데이션) | `--elevation-control-border` | `border-gradient-elevation-control-border`([[디자인 기반:컨트롤 테두리]]) |

  쓰는 방법:
  - 별칭은 실제 값으로 풀지 않고 `var()` 참조로 남긴다. Primitive → Semantic → Component 단계가 CSS에서도 보이게 하기 위해서다.
  - 라틴 서체 변수에는 `font/family/korean`을 이어 붙인다([[디자인 기반:서체]]).
  - 그라데이션은 위에서 아래 방향(`to bottom`)만 옮기고, 정지점 위치는 피그마 비율 그대로 둔다. 다른 방향이나 방사형 그라데이션을 만나면 생성이 실패한다.
  - 그라데이션 정지점 사이 색은 피그마가 투명도를 곱하지 않고 섞고, CSS는 투명도를 곱한 값으로 섞는다. 투명도와 RGB가 모두 다른 두 정지점 사이(예: 흰색 8% → 검정 40%)는 피그마 방식으로 계산한 중간 정지점을 넣는다.
  - 재질은 배경 블러 효과 스타일과 반투명 바탕색 변수로 나눠 옮긴다([[디자인 기반:재질 효과]]).
  - Tailwind 기본 테마 값 지우기(`--*: initial`)는 `tokens.css` 맨 앞에 둔다. Tailwind는 `initial`보다 앞에 정의된 같은 이름공간 변수를 지우므로, 지우기가 토큰보다 먼저 와야 한다.
  - 모든 토큰을 `@theme static` 블록 하나에 둔다. `static`은 유틸리티에서 쓰지 않은 변수도 CSS에 남겨, 손으로 쓴 CSS와 인라인 스타일이 `var()`로 참조할 수 있게 한다.
  - 규칙이 없는 변수 묶음이나 스타일 종류(예: `font/stretch/*`, 각도 그라데이션)를 만나면 생성이 실패한다. 이 표에 규칙을 먼저 정한다.
토큰 사용 강제: |
  토큰은 `tokens.css`에서만 정의하고, 코드는 토큰 클래스만 쓴다.

  - Stylelint의 `at-rule-disallowed-list`로 `@theme`과 `@utility`를 막고, `overrides`로 `tokens.css`만 풀어 준다. 다른 CSS에서 토큰을 새로 정의하거나 덮어쓰지 못하게 하기 위해서다.
  - class 안의 값은 ESLint `better-tailwindcss`가 막는다. 모르는 클래스(`no-unknown-classes`)와 임의 값(`bg-[#fff]`, `p-[13px]`)은 lint 오류다. 그래서 토큰에 없는 값은 코드에 들어올 수 없다.
  - `@utility`로 만든 클래스를 lint가 아는 클래스로 보는지는 테스트로 지킨다.
토큰 검사: |
  `tokens.json`이나 `tokens.css`가 바뀌면 CI가 `tokens.json`에서 `tokens.css`를 다시 만들어 저장소의 `tokens.css`와 비교하고, 다르면 실패한다(`generate:tokens --check`).
  플러그인이 만든 `tokens.css`와 변환 스크립트가 만든 것이 같은 코드에서 나오므로, 토큰 PR은 고치지 않고 바로 통과한다. 실패하면 누군가 `tokens.css`를 손으로 고쳤거나 변환 스크립트가 바뀐 것이다.
자산: |
  CSS로 그릴 수 없는 모양과 이미지는 Foundations의 이름 있는 자산 컴포넌트로 두고, 컴포넌트 안에서는 그 인스턴스를 쓴다. 묶음과 원본 위치는 [[디자인 기반:자산]]에서 정한다.

  | 묶음 | 내보내는 파일 | 코드 |
  |---|---|---|
  | Icons, Shapes(한 가지 색) | SVG. id를 내용 기반 이름으로 바꾸고 색을 `currentColor`로 바꾼다 | 자산 이름 + 글자 색 클래스 |
  | Illustrations(여러 색) | SVG. id만 바꾼다 | 자산 이름 |
  | Images(래스터) | 이미지 칠 하나면 원본 바이트, 아니면 PNG(배율 1) | 자산 이름 |

  - 자산은 픽셀로 비교하지 않는다. CI가 `generate:assets --check`로 `figma/assets/`에서 코드 자산을 다시 만들어 보고, `src/assets/`와 바이트가 다르면 실패한다. 피그마와 Chromium은 같은 SVG도 다르게 그리기 때문이다.
  - 묶음은 원본 컴포넌트가 든 묶음 프레임(`group/<묶음>`)의 이름으로 정한다.
  - 플러그인은 내보내는 컴포넌트와 조립이 쓰는 자산을 `figma/assets/<묶음>/<자산>.<svg|png>`로 함께 내보낸다. SVG 안의 id는 내용으로 정해지는 이름으로 바꿔, 같은 모양이면 파일도 같게 한다.
  - 코드의 자산 파일은 손으로 복사하지 않고 이 파일에서 생성기가 만든다. 아이콘 패키지(`@fluentui/react-icons`)를 따로 쓰지 않는 것도 이 때문이다. 피그마가 아이콘을 줄여 쓰거나 경로를 바꾸면 패키지 아이콘과 달라진다.
  - 여러 색 자산의 SVG는 그라데이션(`linearGradient`, `radialGradient`)을 그대로 옮긴다. `Asset` 컴포넌트는 그라데이션 ID 앞에 요소마다 다른 접두어를 붙인다. 한 화면에 같은 자산이 둘 있어도 ID가 겹치지 않게 하기 위해서다.
  - 이미지는 이미지 해시로 자산 이름을 찾는다. 이름 있는 자산에 없는 이미지는 플러그인이 막는다([[피그마 연동:구조 검사]]).
피그마 플러그인: |
  비공개 개발용 플러그인으로 만들고 `tools/figma-plugin`에 둔다([[저장소 구성:구성]]).

  - 검사·내보내기 핵심(`src/core`)은 피그마 API만 쓰고 GitHub와 UI를 모른다. 플러그인 UI와 피그마 MCP(`use_figma`)가 같은 핵심을 쓰고, MCP에서는 핵심을 스크립트 하나로 묶어 실행한다. AI 작업 세션이 피그마를 고친 뒤 플러그인으로 내보낼 때와 같은 검사 결과를 바로 볼 수 있게 하기 위해서다.
  - 내보내기 전에 구조 검사를 한다([[피그마 연동:구조 검사]]). 위반이 있는 대상은 파일을 만들지 않는다.
  - 내보내는 것:
    - 컴포넌트: 변형 이름과 변형마다 PNG(`figma/components/<컴포넌트>/<변형>.png`)
    - 조립: 변형 이름과 변형마다 PNG(`apps/web/figma/patterns/<영역>/<이름>/<변형>.png`)
    - 그 컴포넌트와 조립이 쓰는 자산 파일([[피그마 연동:자산]])
    - 토큰: `figma/tokens.json`과 같은 변환 함수로 만든 `src/tokens.css`([[피그마 연동:토큰 생성]])
  - 레이어 정보는 내보내지 않는다. PNG는 캡처 표의 피그마 열이다.
  - 다시 내보내면 그 대상 폴더의 PNG를 모두 새로 쓰고, 사라진 변형의 파일은 그 폴더에서만 지운다.
  - Variables는 플러그인 API로 읽는다. Figma REST API의 Variables 엔드포인트는 Enterprise 플랜 전용이지만, 플러그인 API는 플랜과 상관없이 읽을 수 있다. 글자·효과·칠 스타일도 따로 읽어 같은 `tokens.json`에 넣는다.
  - 토큰은 내보낼 때마다 읽어 `main`의 `tokens.json`과 비교하고, 다르면 컴포넌트·조립 PR에 넣지 않고 토큰 PR(`feat/figma-tokens`)을 열거나 갱신한다. 토큰 PR에는 바뀐 토큰을 쓰는 컴포넌트의 변형 PNG도 다시 내보내 넣는다. 같은 내보내기에 포함된 컴포넌트의 PNG는 그 컴포넌트 PR에만 넣는다.
  - 컴포넌트 하나마다 PR 하나(`feat/figma-<컴포넌트>`), 조립은 영역마다 PR 하나(`feat/figma-patterns-<영역>`)를 연다. 같은 대상을 다시 내보내면 열린 PR의 브랜치에 이어서 커밋하고, 열린 PR이 없으면 `main`에서 새로 만든다.
  - 컴포넌트 PR은 `figma/components/<컴포넌트>/`와 쓰는 자산만, 조립 PR은 `apps/web/figma/patterns/<영역>/`과 쓰는 자산만 바꾼다. 같은 자산을 두 PR이 더해도 같은 바이트라 충돌하지 않는다.
  - PR 본문에는 바뀐 변형 목록과 `피그마 | 현재 구현` 표를 넣는다. 현재 구현은 `parity-captures` 브랜치의 캡처이고, 처음 구현하는 대상은 빈칸이다.
  - 플러그인은 사용자가 실행했을 때만 동작하므로, 피그마 작업을 마치면 내보내기를 직접 실행한다.
  - 이 저장소에만 권한이 있는 GitHub fine-grained 토큰을 플러그인 로컬 저장소에 보관한다.
  - 피그마 파일 키와 PNG 배율은 `packages/design-system/figma/figma.json`에 둔다.
구조 검사: |
  플러그인은 내보내기 전에 변형마다 구조를 검사하고, 위반이 하나라도 있으면 그 대상을 내보내지 않는다. 막는 것은 두 가지뿐이다.

  1. 변수·스타일에 연결되지 않은 시각 값. 칠, 선, 선 두께, 반경, 여백, 간격, 고정 크기, 불투명도, 글자 스타일이 모두 대상이다. 효과는 효과 스타일로, 그라데이션은 칠 스타일로만 쓴다. 토큰 클래스로 쓸 수 없는 값(90° 배수가 아닌 회전, 비례 제약)도 막는다. 피그마 값이 모두 토큰이어야 코드가 토큰 클래스만으로 같은 모습을 만들 수 있기 때문이다.
  2. CSS로 그릴 수 없는 기능. 노이즈·텍스처·점진 블러 효과, 블렌드가 들어간 칠과 효과, 투명한 부분 뒤에도 표시하는 그림자([[디자인 기반:그림자]]), 점선, 가변 두께·브러시 선, 모서리 스무딩, 마스크, 자산이 아닌 호·별·다각형·선·불리언·벡터, 이름 있는 자산에 없는 이미지, 빠진 글꼴(대체 글꼴로 그려짐), OpenType 기능.

  알림(막지 않음): 파일에서 사용처가 0인 변수·스타일을 알려 준다. Screens까지 세고, 지울 때 참고한다([[디자인 기반:크기 변수]]).

  나머지 작성 규칙(자동 배치, 슬롯은 빈 자리, 아이콘 자리, 팝업 등)은 [[디자인 시스템]]과 [[디자인 기반]]이 정하고 리뷰와 캡처 표로 지킨다.

  메시지 원칙:
  - 위반마다 위치(컴포넌트 / 변형 / 레이어 경로), 이유, 고칠 방법을 쓴다. 디자이너가 메시지만 보고 피그마에서 고칠 수 있어야 한다.
  - 한 대상의 위반은 모두 한 번에 보여 준다.
스토리 규칙: |
  캡처할 때 피그마 변형 하나를 Storybook 스토리와 args 하나로 짝짓는 규칙이다. 짝을 찾지 못하면 캡처 표에 그 변형의 코드 칸이 비고 CI가 실패한다.

  - 컴포넌트는 `src/components/<컴포넌트>/<컴포넌트>.stories.tsx`에 이름이 `Parity`인 스토리를 하나 두고 args로 변형을 고른다.
  - 조립은 앱 Storybook의 스토리로 짝짓는다. 스토리 제목은 `Patterns/` 뒤에 피그마 조립 이름을 그대로 쓴다(`Menu/Folder` → `Patterns/Menu/Folder`). 구조가 같은 조립 여럿은 코드 컴포넌트 하나에 스토리를 여럿 둔다([[디자인 시스템:조립]]).
  - 조립 스토리의 데이터(글자, 항목, 아이콘)는 피그마 조립과 같다. 그림이 같아야 차이 그림이 디자인 차이만 보여 주기 때문이다.
  - 피그마 변형 속성 이름은 camelCase arg 이름이 된다(`Style` → `style`). 값은 변형 파일 이름과 같은 규칙으로 정규화한 문자열이다(`Accent` → `accent`). `True`·`False`는 boolean이다.
  - 피그마 컴포넌트 속성 이름과 React prop 이름을 맞춘다. 속성 키의 `#id`를 떼고 camelCase로 쓴다(`Show icon` → `showIcon`, `Close icon` → `closeIcon`).
  - argTypes `options`에 피그마 변형 값을 모두 넣는다. Storybook은 `options`에 없는 URL args를 조용히 버리므로, 도구는 렌더링 뒤 실제로 적용된 args를 확인하고 다르면 실패한다.
  - 상태는 [[컴포넌트 목록:상태]]의 재현 방법을 따른다. Hover·Pressed·Focused는 컴포넌트에 강제로 상태를 주는 prop을 만들지 않고 도구가 실제 마우스·키보드로 재현한다. Hover는 요소 가운데로 마우스를 옮기고, Pressed는 그 위에서 버튼을 누른 채 찍고, Focused는 Tab 키로 포커스를 옮긴다(`:focus-visible`이 나오게). 나머지 상태는 args로 재현한다.
  - 캡처 대상은 `#storybook-root`의 첫 요소다. 포털로 그리는 것이나 감싸는 요소가 필요한 스토리는 대상 요소에 `data-parity-target`을 단다.
  - 웹 폰트를 모두 받을 때까지(`document.fonts.ready`) 기다리고, 받지 못했으면 실패한다.
캡처 표: |
  피그마와 코드가 같은지 사람이 보는 자료다. 판정하지 않는다.

  - 행은 변형과 상태다. 열은 `피그마 | 코드 | 차이`다.
  - 차이 그림은 피그마 그림과 코드 그림을 같은 크기·같은 배경 위에 놓고 Playwright Chromium의 캔버스에서 `globalCompositeOperation = 'difference'`로 겹친 것이다. 같은 곳은 검정, 다른 곳은 밝게 보인다.
  - 글자 가장자리나 모서리처럼 엔진 차이로 생기는 밝은 선도 차이 그림에 나온다. 기준값을 두지 않고 사람이 디자인 차이인지 본다([[한계:그림 비교 불가]]).
  - 플러그인 PR 본문은 `피그마 | 현재 구현`이다. 이 표가 구현할 내용이다.

  같은 조건으로 캡처한다.

  | 조건 | 내용 |
  |---|---|
  | 배율 | `figma.json`의 `scale`과 같은 `deviceScaleFactor` |
  | 범위 | 피그마는 변형 노드, 코드는 캡처 대상의 테두리 상자에 같은 여백을 둔다. 여백은 24px 이상이고 루트 그림자가 더 크면 그만큼 늘린다. 피그마 PNG는 그림자 영역까지 담겨 있어 그 영역만큼 위치를 옮겨 노드끼리 맞춘다 |
  | 배경 | 피그마 PNG는 배경이 투명이라, 스토리 화면의 배경색을 읽어 두 이미지를 같은 색 위에 놓는다 |
  | 상태 | [[피그마 연동:스토리 규칙]]대로 재현한다 |
  | 재질 | 배경 이미지를 따로 깔지 않고 같은 배경색 위에서 캡처한다. 그래서 뒤를 흐리는 재질의 흐림 모습은 이 표로 확인되지 않는다 |
캡처 범위: |
  - PR마다 바뀐 파일로 캡처할 컴포넌트와 조립을 자동으로 정한다. 사람이 라벨로 켜고 끄지 않는다. 라벨을 잊어 캡처가 빠지는 일이 없게 하기 위해서다.
  - 범위가 있으면 `figma` 라벨을 붙이고, 커밋이 더해져 범위가 사라지면 뗀다. 라벨은 실행 조건이 아니라 결과 표시다.
  - Screens는 캡처하지 않는다([[미결 사항:화면 단위 시각 검증]]).

  범위는 위에서부터 먼저 맞는 규칙을 쓴다.

  | 바뀐 파일 | 범위 |
  |---|---|
  | 아래 어디에도 해당하지 않는 파일(`.codocs`, README 등) | 없음 |
  | `*.test.ts(x)` | 없음 |
  | 디자인 시스템 `src/components/<c>/`의 나머지(코드, `Parity` 스토리) | `<c>`, 그것을 담는 컴포넌트, 그것을 쓰는 조립 |
  | `figma/components/<c>/` | `<c>`와 그것을 담는 컴포넌트 |
  | `apps/web/figma/patterns/<영역>/` | 그 영역의 조립 |
  | 조립 스토리 파일, 그 스토리가 import하는 앱 파일 | 그 조립 |
  | `figma/assets/<자산>`, `src/assets/` | 그 자산을 쓰는 컴포넌트와 조립(코드에서 자산 이름으로 찾는다). 정하지 못하면 전체 |
  | `figma/tokens.json`, `src/tokens.css` | 바뀐 토큰의 클래스를 쓰는 컴포넌트와 조립(별칭을 따라가고, 코드에서 클래스 이름으로 찾는다). 정하지 못하면 전체 |
  | `figma/figma.json`, `theme.css`, 웹 폰트 CSS, `.storybook/`, 패키지 `package.json`·`tsconfig.json`, `pnpm-lock.yaml`, `src/components/` 밖의 디자인 시스템 소스 | 전체 |
  | `tools/figma-parity/`, 캡처 워크플로(`.github/workflows/figma-parity.yml`) | 전체 |

  - 담는 컴포넌트: 그 컴포넌트를 상대 경로로 import하는 컴포넌트를 거슬러 올라가며 함께 캡처한다.
  - 쓰는 조립: 그 컴포넌트를 import하는 조립 스토리를 함께 캡처한다.
  - 기준 커밋은 PR이면 대상 브랜치와의 merge-base, `main` push면 직전 커밋(`github.event.before`)이다.

  한계: 의존 관계는 import만 따라간다. CSS를 통한 영향은 찾지 못해, 컴포넌트 폴더 밖의 디자인 시스템 소스 변경은 전체로 처리한다.
PR 흐름: |
  | 경우 | 생기는 PR | 병합 순서 |
  |---|---|---|
  | 컴포넌트만 바뀜 | 컴포넌트 PR 하나 | 상관없음 |
  | 토큰만 바뀜 | 토큰 PR 하나(영향 컴포넌트 PNG 포함) | 상관없음 |
  | 새 토큰을 쓰는 컴포넌트 | 토큰 PR + 컴포넌트 PR | 토큰 먼저 |
  | 토큰 이름 변경·삭제 | 토큰 PR 하나. 옛 이름을 쓰는 코드도 같은 PR에서 고친다 | 상관없음 |
  | 조립이 바뀜 | 영역마다 조립 PR | 쓰는 토큰·컴포넌트 PR 다음 |

  - 토큰 PR은 생성된 `tokens.css`까지 담아 바로 병합할 수 있다. 토큰 이름이 바뀌거나 지워져 코드가 옛 클래스를 쓰면 lint가 알려 주고, 같은 PR에서 코드를 고친다.
  - 컴포넌트 PR이 아직 없는 토큰을 쓰면 lint가 모르는 클래스로 실패한다. 토큰 PR을 병합한 뒤 컴포넌트 PR에 `main`을 받아 온다.
  - 조립 PR은 앱(`apps/web` `features/`)의 컴포넌트와 스토리를 만든다([[디자인 시스템:조립]]). 쓰는 디자인 시스템 컴포넌트가 아직 코드에 없으면 그 컴포넌트 PR을 먼저 병합한다.
  - 코드만 바뀐 PR은 영향받는 컴포넌트와 조립의 캡처 표를 받는다. 피그마 열은 저장소의 PNG다.
CI: |
  캡처는 일반 CI(`ci.yml`)와 나눈 워크플로(`.github/workflows/figma-parity.yml`)이고, 도구는 `tools/figma-parity`에 둔다([[저장소 구성:구성]]). 저장소의 피그마 그림과 Storybook 스토리를 쓰므로 CI에 피그마 토큰이 필요 없다. PR은 새 커밋이 오면 이전 실행을 멈추고, `main`은 커밋마다 캡처할 범위가 달라 멈추지 않는다.

  PR(초안 포함)에서 단계 순서:

  | 단계 | 내용 | 실패하면 |
  |---|---|---|
  | 0. 범위 | git diff로 [[피그마 연동:캡처 범위]]를 정하고 라벨을 붙이거나 뗀다. Chromium 설치나 Storybook 빌드 없이 한다 | 범위가 없으면 여기서 끝 |
  | 1. 빌드 | 범위에 컴포넌트가 있으면 디자인 시스템 Storybook을, 조립이 있으면 앱 Storybook을 정적으로 빌드한다 | 작업 실패 |
  | 2. 캡처 | 범위 안 대상을 캡처하고 차이 그림을 만들어 `피그마 \| 코드 \| 차이` 표를 PR 댓글로 남긴다([[피그마 연동:캡처 표]]) | 작업 실패 |

  토큰 검사([[피그마 연동:토큰 검사]])와 자산 검사([[피그마 연동:자산]])는 일반 CI의 검사 작업에서 돈다([[Git 작업 규칙:CI]]).

  `main` 병합 때는 범위 안 대상을 캡처해 `parity-captures` 브랜치의 `<컴포넌트>/<변형>.png`와 `patterns/<영역>/<이름>/<변형>.png`에 덮어쓴다. 브랜치가 없으면 이력 없는 브랜치로 만들고, 한 대상의 변형을 모두 캡처했을 때만 그 폴더를 바꾼다.

  - Storybook은 정적으로 빌드해 도구 안의 작은 정적 서버로 띄운다. 개발 서버보다 결과가 매번 같다.
  - 결과는 `parity-results/`에 남기고 CI 아티팩트로 올린다.

  PR 댓글:
  - CI는 결과를 PR 댓글 하나로 남기고(숨은 표시 `<!-- figma-parity -->`), 실행할 때마다 그 댓글을 고친다.
  - 이미지는 `parity-report/pr-<번호>` 브랜치에 올리고 PR이 닫히면 지운다(`parity-report-cleanup` 워크플로). GitHub API로 댓글에 이미지를 직접 올릴 수 없기 때문이다.
  - 댓글이 길이 제한(65,536자, 여유를 두어 60,000자)을 넘으면 번호를 붙인 댓글로 이어 쓴다.
  - 권한은 `contents: write`(보고 브랜치, `parity-captures`)와 `pull-requests: write`(댓글, 라벨)만 준다. 포크에서 온 PR은 쓰기 토큰이 없어 캡처하지 않고 이유를 로그에 남긴다.
  - CI는 PR 브랜치에 커밋하지 않는다. `tokens.css`나 코드 자산이 맞지 않으면 실패만 한다.
스킬: |
  플러그인 PR을 처리하는 일은 자동으로 돌리지 않고, 사람이 시점을 골라 AI에게 스킬로 맡긴다. 같은 절차와 같은 제한을 매번 지키게 하기 위해서다.

  | 스킬 | 쓰는 때 | 하는 일 |
  |---|---|---|
  | `figma-token-pr` | 토큰 PR | 바뀐 토큰 정리, 생성된 `tokens.css` 확인, 이름 변경·삭제로 깨진 코드 고치기, lint 통과 |
  | `figma-component-pr` | 컴포넌트 PR, 조립 PR | 없는 토큰 확인, `generate:assets` 실행과 커밋, 피그마 그림을 보고 구현, 로컬 캡처 표 확인 |

  - 스킬은 `.claude/skills/<이름>/SKILL.md`에 둔다. 절차만 담고 규칙은 `@codocs \[[문서:섹션]]` 링크로 가리킨다([[codocs 연결 규칙]]). 실행할 때 링크된 섹션을 codocs로 읽는다.
  - 생성 파일(`tokens.css`, `src/assets/`)은 생성기를 실행만 하고 직접 쓰지 않는다.
  - 다음은 하지 않는다: `figma/` 고치기, 생성 파일 손으로 고치기, 병합.
  - 다음이 필요하면 멈추고 보고한다: 변환 스크립트나 캡처 도구 고치기, `.codocs` 고치기, PR에 예상 밖 파일이 있음.
  - 끝나면 캡처 표에서 사람이 봐야 할 곳을 보고한다.
  - 코드만 바꾸는 PR은 일반 개발 작업이라 스킬을 두지 않는다.
검토한 대안: |
  - 레이어별 자동 판정: 피그마 레이어 정보(`export.json`)를 내보내고, 코드 요소에 `data-figma`로 짝을 지어 이긴 CSS 선언의 토큰 이름과 계산값, 글자 구간과 서체, 숨김 레이어, 상태 전환을 판정했다. 피그마와 CSS의 뜻이 1:1인 속성만 판정하도록 범위를 좁혀도, 짝짓기·스토리·글자·숨김·팝업·슬롯 규칙과 속성 분류표가 컴포넌트를 더할 때마다 늘었고, 코드가 검사기에 맞춘 모양이 되었다. 시각 값은 구조 검사로 모두 토큰이고 코드는 토큰 클래스만 쓸 수 있어, 남는 실수는 "어느 토큰을 어디에 썼는가"이고 이것은 캡처 표에서 보인다. 복잡도에 비해 얻는 것이 작아 뺐다.
  - 픽셀 비교(피그마 PNG ↔ Storybook 스크린샷, pixelmatch): 엄격한 기준(색 차이 0, 허용 픽셀 0)에서는 정상 48개 변형이 모두 실패했다. 피그마는 글리프를 소수 위치에 두고 Chromium은 정수에 맞추며, 모서리 안티앨리어싱과 그림자 경계도 엔진마다 다르기 때문이다. 정상이 통과하도록 느슨하게 하면 여백 +1px·반경 +1px 실수를 놓쳤다. 피그마 PNG는 같은 디자인을 다시 내보내도 바이트가 달라 기준 이미지가 고정되지 않는다. 그래서 차이 그림은 판정 없이 사람이 보는 데만 쓴다.
  - 인지 비교(pixelmatch 문턱값, SSIM, 차이 덩어리 크기): 정상과 실수의 간격(SSIM 0.04, 회색 바탕 차이 0.26%p)이 글자 가장자리 번짐 정도라 운영체제나 브라우저 설정이 바뀌면 뒤집힌다. 반경 +1·배경 한 단계·글자 하나 바꿈은 어떤 지표로도 잡지 못했고, 문턱값을 사람이 정해야 한다.
  - 피그마 SVG를 Chromium에서 그려 비교, Figma Sites HTML이나 Dev Mode 코드를 기준으로 쓰기: 그라데이션 테두리를 단색으로 바꾸거나 색을 반올림하는 등 변환에서 디자인 일부를 잃어 기준으로 쓸 수 없다.
  - Style Dictionary로 `tokens.css` 만들기: 이름 규칙, `@theme`·`@utility`·`--value()` 구성, 그라데이션 중간 정지점, 재질·그림자·글자 스타일 묶음처럼 변환 대부분이 이 프로젝트의 규칙이라 도구가 맡는 부분이 작다. 도구 설정과 사용자 정의 변환을 함께 관리하는 것보다 변환 스크립트 하나가 단순하다.
  - `tokens.css`를 사람이나 에이전트가 손으로 쓰기: 이름과 값이 `tokens.json`과 어긋나는지 따로 비교해야 하고, 같은 판단을 매번 다시 하게 된다. 변환 규칙을 스크립트로 정하면 다시 만들어 비교하는 것만으로 같음을 보장한다.
  - CI가 생성 파일을 PR에 자동 커밋: 기본 토큰으로 푸시한 커밋은 CI를 다시 깨우지 않아 별도 시크릿 토큰이 필요하다. 플러그인이 `tokens.css`를 함께 커밋하고, 코드 자산 생성은 스킬로 사람이 시점을 골라 한다.
  - Figma REST API로 CI가 매번 자료를 받기: CI에 피그마 토큰이 필요하고, 피그마만 먼저 바뀌면 모든 PR이 실패한다. Variables는 Enterprise 플랜이 아니면 읽을 수 없다.
  - 토큰도 플러그인 대신 피그마 MCP로만 읽기: MCP는 AI 작업 세션 안에서만 쓸 수 있어 토큰 변경이 PR에 남지 않고 CI가 검사할 수 없다.
  - 코드 기준 회귀 테스트(Chromatic 등): 기준이 피그마가 아니라 이전 코드라 처음 만든 컴포넌트가 피그마와 달라도 잡지 못한다.
  - 컴포넌트마다 `tokens.json`을 나누기: 여러 컴포넌트가 함께 쓰는 토큰이 여러 파일에 들어가, 한 컴포넌트만 다시 내보내면 이름 하나에 값이 둘이 된다. 토큰은 전용 PR로 둔다.
  - 라벨로 CI를 켜기: 라벨을 잊으면 캡처가 빠진다. 바뀐 파일로 범위를 정하고 라벨은 결과로 붙인다.
  - 자산을 픽셀로 비교: 피그마와 Chromium은 같은 SVG도 다르게 그린다(49개 중 2개 일치). 파일 사슬로 바이트 일치를 본다.
