_codocs:
  id: repository-structure
  name: 저장소 구성
  parent:
    - 개발 컨벤션
개요: |
  모노레포에 무엇이 어디에 있고, 패키지와 기능이 어떤 방향으로 의존하며, 패키지와 런타임을 어떻게 관리하는지 정한다.
  패키지를 나눈 근거는 [[기술 스택:저장소 구성]]에서 확인한다.
구성: |
  - `apps/web`: Next.js 블로그 앱. 피그마 조립에 대응하는 앱 컴포넌트와 그 스토리를 담는 Storybook도 있다. `src`는 `app → shell → features → shared` 층으로 나눈다([[저장소 구성:앱 폴더 구조]]).
  - `packages/design-system`: 피그마 디자인 시스템과 대응하는 토큰과 컴포넌트. 공개 이름은 `@seojaewan/design-system`이다. 내부 구조는 [[저장소 구성:디자인 시스템 패키지 구조]]에서 정한다.
  - `tools/figma-plugin`: 구조를 검사하고 변형 그림·자산·토큰·애니메이션을 내보내는 피그마 개발용 플러그인([[피그마 연동:피그마 플러그인]]).
  - `tools/figma-parity`: 피그마 그림과 Storybook 스토리를 캡처해 캡처 표와 PR 댓글을 만드는 도구([[피그마 연동:CI]]). 디자인 시스템과 앱의 Storybook을 함께 다루므로 어느 한 패키지에 두지 않는다.
  - `tools/`의 도구는 다른 패키지가 가져다 쓰지 않는 개발 도구라 `apps/`·`packages/`와 나눈다.
  - `.codocs`: 기획·정책·컨벤션 문서
  - `.claude/skills`: 피그마 플러그인 PR을 처리하는 스킬처럼 반복 작업의 절차. 규칙은 옮겨 적지 않고 `.codocs`를 가리킨다([[피그마 연동:스킬]]).
  - `stylelint.config.mjs`: CSS lint 설정. 토큰 관련 제약은 [[피그마 연동:토큰 사용 강제]], 모션 정의 위치는 [[피그마 연동:모션 클래스]]에서 정한다.
  - `AGENTS.md`: AI 에이전트가 작업 전에 codocs 문서를 확인하고 codocs MCP로 찾고 고치도록 안내한다. 프로젝트 지식을 여기에 복제하지 않는다.
앱 폴더 구조: |
  `apps/web/src`는 층으로 나누고, 기능 층 안에서는 기능별로 나눈다. 역할별(`components/`, `stores/`) 폴더에 모두 섞으면 폴더마다 파일이 쌓이고 한 기능을 고칠 때 여러 폴더를 오가야 하고, 기능끼리 얽혀도 import 방향으로 막을 수 없기 때문이다.

  ```
  apps/web/src/
  ├─ app/              # Next.js 라우트만(page, layout, 라우트 핸들러). 로직은 두지 않는다
  ├─ shell/            # 맨 위. 기능의 층을 쌓는 조합, 앱 등록표, 재부팅 화면
  ├─ features/         # 기능. 화면 한 영역을 맡고, 서로 import하지 않는다
  │  ├─ desktop/       # 배경화면과 아이콘(우클릭 메뉴 포함)
  │  ├─ taskbar/
  │  ├─ start-menu/    # Start와 검색
  │  ├─ chrome/        # 글 읽기 창, 탭, 주소창
  │  ├─ file-explorer/
  │  └─ window/        # 모든 앱 창이 공유하는 창 화면(창 층, Snap Assist, 스냅 레이아웃)
  ├─ content/          # Notion 글 가져오기, 변환, 렌더링
  └─ shared/           # 여러 기능이 함께 쓰는 것
     ├─ components/    # 공용 UI(MenuPopup, MenuButton, 창 축소 화면)
     ├─ hooks/         # 공용 훅(화면 방식, 작업 영역)
     ├─ utils/         # 공용 순수 함수. 저장소가 부르는 상태 규칙과 계산도 둔다
     ├─ stores/        # 기능 사이에 오가는 전역 상태(Zustand)
     └─ stories/       # 여러 기능의 스토리가 쓰는 스토리 데이터와 도우미
  ```

  기능 폴더 이름은 예시다. 기능 범위는 [[제품 정의:첫 공개 범위]]를 따르고, 세부 기능 문서를 쓸 때 확정한다.

  층의 역할은 다음과 같다.
  - `shell/`: 바탕화면 영역 위에 각 기능의 층(아이콘, 창, 패널, 작업 표시줄)을 순서대로 쌓는 조합, 앱마다 어떤 창 내용을 창 층에 끼울지 정한 앱 등록표, 재부팅 화면만 맡는다. 비즈니스 로직과 기능 사이의 연결은 두지 않는다.
  - `features/`: 화면 한 영역을 맡는 기능이다. 다른 기능을 import하지 않는다. 기능 사이에 오가는 상태는 각 기능의 층 컴포넌트가 `shared/stores`의 저장소를 읽고 바꾸며 주고받는다.
  - `content/`: Notion 글을 가져오고 변환한다.
  - `shared/`: 여러 기능이 함께 쓰는 것이다. 종류별 폴더 다섯 개로 나눈다.
    - `stores`: 도메인을 아는 전역 상태(Zustand)다. 열린 창, Start·검색 패널, 다시 시작 단계([[작업 공간]])처럼 둘 이상의 기능이 읽고 바꾸는 상태를 둔다. shell에 두면 기능이 shell을 import해야 해 방향이 거꾸로 되고, 한 기능에 두면 다른 기능이 그 기능을 import해야 하기 때문이다.
    - `utils`: React 밖의 공용 순수 함수다. 저장소가 부르는 상태 규칙과 계산(`window-rules`, `panel-rules`)도 여기 둔다.
    - `components`, `hooks`: 공용 UI와 훅이다. 필요하면 `shared/stores`의 저장소를 직접 쓴다.
    - `stories`: 여러 기능의 스토리가 쓰는 스토리 데이터와 스토리 도우미다.

  새 코드의 자리는 다음 질문을 차례로 던져 정한다.
  1. 기능의 층을 쌓거나 앱마다 창 내용을 고르는 일인가 → `shell/`
  2. 둘 이상의 기능이 읽고 바꾸는 상태인가 → `shared/stores`(그 규칙은 `shared/utils`)
  3. 둘 이상의 기능이 쓰는 UI·훅·순수 함수인가 → `shared/components`·`shared/hooks`·`shared/utils`
  4. 셋 다 아니면 화면 한 영역을 맡는 기능의 것이다 → `features/<기능>`

  기능끼리 서로 필요해지면 import하지 않고 함께 필요한 부분을 `shared/`로 내린다. 예: 작업 표시줄의 Start 버튼은 `shared/stores`의 패널 저장소를 바꾸고, Start 메뉴 층이 그 저장소를 읽어 패널을 그린다. 탐색기에서 글을 Chrome으로 열 때 탐색기는 `shared/stores`의 창 저장소로 창을 열고, 무엇을 그릴지는 shell의 앱 등록표가 잇는다. 작업 표시줄 창 미리보기와 Snap Assist가 함께 쓰는 창 축소 화면은 `shared/components`에 둔다.

  기능 폴더(그리고 `shell/`, `shared/`) 안은 다음 규칙을 따른다.
  - 기능 폴더와 `shell/`의 루트에는 공개 진입점(`<기능>.ts`, 예: `features/taskbar/taskbar.ts`)만 둔다. `index` 파일은 두지 않는다. `shared/`는 종류 폴더만 두고 공개 진입점을 두지 않는다. 쓰는 쪽이 대상 파일(`@/shared/<종류>/<대상>/<대상>`)을 바로 import한다.
  - 하위 폴더는 필요한 것만 만든다. 이름은 `shared/`의 종류 폴더와 같다.
    - `components`: 조립과 층 컴포넌트
    - `hooks`
    - `utils`: React 밖의 순수 함수(상태 규칙과 계산)
    - `stores`: 그 기능만 쓰는 Zustand 저장소. 기능 사이에 오가는 상태는 `shared/stores`에 두므로 기능 안에는 보통 없다
    - `data`: 앱이 실제로 쓰는 고정 값
    - `stories`: 기능 안의 여러 컴포넌트의 스토리가 함께 쓰는 스토리 데이터와 스토리 그리기 도우미
  - 각 하위 폴더 안은 대상 하나마다 폴더를 두고, 폴더 이름과 파일 이름을 같게 한다(`components/taskbar-default/taskbar-default.tsx`). 그 대상의 스토리, 테스트, 그 대상만 쓰는 부품을 같은 폴더에 둔다. 두 대상 이상이 쓰게 된 부품은 같은 하위 폴더 아래 자기 폴더로 옮긴다. `data`도 같다.

  ```
  features/taskbar/
  ├─ taskbar.ts                         # 공개 진입점
  ├─ components/
  │  ├─ taskbar-layer/
  │  │  ├─ taskbar-layer.tsx            # 저장소를 읽고 조립에 잇는 층 컴포넌트
  │  │  ├─ taskbar-layer.stories.tsx    # 동작 스토리(Features/Taskbar/TaskbarLayer)
  │  │  └─ taskbar-layer.test.tsx
  │  └─ taskbar-default/
  │     ├─ taskbar-default.tsx          # 조립. props만 받는다
  │     ├─ taskbar-default.stories.tsx  # Parity 스토리(Patterns/Taskbar/Default)
  │     └─ taskbar-default.test.tsx
  ├─ hooks/
  │  └─ use-clock/
  │     ├─ use-clock.ts
  │     └─ use-clock.test.ts
  └─ stories/
     └─ taskbar-app-menu-data/
        └─ taskbar-app-menu-data.ts     # 기능 안 여러 스토리가 쓰는 데이터

  shared/
  ├─ components/
  │  └─ window-thumbnail/
  │     └─ window-thumbnail.tsx         # 창 축소 화면. 작업 표시줄과 창 기능이 쓴다
  ├─ hooks/
  │  └─ use-work-area/
  │     ├─ use-work-area.ts
  │     └─ use-work-area.test.ts
  ├─ utils/
  │  └─ window-rules/
  │     ├─ window-rules.ts              # 창 상태 규칙과 계산
  │     └─ window-rules.test.ts
  ├─ stores/
  │  ├─ window-store/
  │  │  └─ window-store.ts              # window-rules를 부르는 창 저장소
  │  └─ store-reset/
  │     └─ store-reset.ts               # 다시 시작할 때 저장소를 처음 상태로 돌리는 등록표
  └─ stories/
     └─ story-stores/
        └─ story-stores.ts              # 동작 스토리의 저장소 초기화
  ```

  앱의 다른 규칙은 다음과 같다.
  - 피그마 조립([[디자인 시스템:조립]])은 그림을 완성하는 코드 옆에 컴포넌트와 스토리로 둔다. 대부분은 그 영역의 기능 폴더 `components`다. 스토리(`*.stories.tsx`)는 컴포넌트 옆에 둔다.
  - 앱의 스토리는 두 가지다.
    - Parity 스토리: 피그마 조립과 짝짓는 스토리다. 제목은 `Patterns/<조립 이름>`이고([[피그마 연동:스토리 규칙]]) 조립 컴포넌트에 props만 넘겨 저장소 없이 그린다. 피그마 캡처 도구는 이 스토리만 찍는다.
    - 동작 스토리: 층 컴포넌트(저장소를 쓰는 컴포넌트) 옆에 두고 실제 저장소로 동작을 확인하는 스토리다. 제목은 `Features/<기능>/<컴포넌트 이름>`(예: `Features/Taskbar/TaskbarLayer`)이고, shell에는 화면 전체를 그리는 동작 스토리(`Features/Shell/Shell`) 하나를 둔다. 저장소는 모듈에 하나라 스토리마다 `beforeEach`에서 처음 상태로 돌린다(`shared/stories/story-stores`). 조립을 props만 받게 나눈 뒤에도 기능을 실제로 눌러 볼 곳이 있어야 하기 때문이다. 피그마와 짝짓지 않으므로 캡처하지 않는다.
  - 다른 기능의 조립을 품는 피그마 그림은 그것을 엮는 `shell/`에서 완성하고 그 스토리(`Parity`)도 `shell/`에 둔다. 자리를 가진 컴포넌트는 자기 기능에 두고, 자리를 다른 기능의 조립으로 채운 스토리만 `shell/`에 둔다. 예: `Window/SnapAssist`는 컴포넌트를 `features/window`에 두고 Chrome 축소 창을 채운 스토리를 `shell/`에, 작업 표시줄 창 미리보기는 컴포넌트를 `features/taskbar`에 두고 탐색기 축소 창을 채운 스토리를 `shell/`에 둔다. 다른 기능을 배치하는 것 자체가 일인 조립(`Desktop/Scene` = 배경화면 + 아이콘 + 작업 표시줄)은 컴포넌트도 `shell/`의 화면 배치다. 그래서 스토리도 층 규칙의 예외가 없다. 기능의 컴포넌트는 다른 기능의 조립이 들어갈 자리를 갖지 않는다. 예: desktop은 taskbar 자리를 갖지 않고, 작업 표시줄을 바탕화면 아래에 붙이는 배치는 `shell/`이 한다.
  - 앱마다 다른 창 조립(`Window/Chrome`, `Window/Explorer`)은 그 앱의 기능 폴더(`chrome/`, `file-explorer/`)에 두고, `features/window`에는 모든 창이 함께 쓰는 창 화면과 조립(`Window/SnapAssist`, `Window/SnapLayoutMenu`)만 둔다. 창 층은 앱을 모르고, 어떤 앱 창을 끼울지는 shell의 앱 등록표가 넘긴다. 기능끼리는 import하지 않으므로 창 층이 앱 창에 넘기는 속성의 타입(`WindowFrameControls`)은 `shared/utils/window-rules`에 둔다.
  - 메뉴 조립(`Menu/*`)은 공통 부품 `MenuPopup`과 `MenuButton`만 `shared/components`에 두고, 각 메뉴와 그 스토리는 쓰는 기능 폴더에 둔다. 두 기능 이상이 쓰는 메뉴만 `shared/components`에 둔다.
  - 앱 Storybook 설정은 `apps/web/.storybook/`에 둔다.
  - 스토리 데이터(글 제목, 폴더 이름, 자산 이름 등)는 쓰는 범위에 따라 둔다. 한 컴포넌트의 스토리만 쓰면 그 컴포넌트 폴더의 `story-data.ts`, 기능 안의 여러 컴포넌트가 쓰면 그 기능의 `stories/<이름>/`, 여러 기능이 쓰면 `shared/stories/<이름>/`이다. 스토리 데이터는 공개 진입점에 넣지 않는다. 기능끼리는 import하지 않고 shell은 기능을 공개 진입점으로만 import하기 때문이다. 파일 이름에 `.fixture`를 붙이지 않는다. 캡처 범위가 그 이름을 그리지 않는 파일로 보고 건너뛰어, 데이터가 바뀌어도 조립을 다시 캡처하지 않기 때문이다([[피그마 연동:캡처 범위]]).
  - 플러그인이 내보낸 조립 그림은 `apps/web/figma/patterns/<영역>/<이름>/<변형>.png`에 둔다. 플러그인이 덮어쓰는 기준 자료라 손으로 고치지 않고 Prettier 검사에서도 뺀다.
  - 상태 규칙은 순수 함수(`utils`)로 분리하고 Zustand 저장소(`stores`)는 그 함수를 부른다(예: `shared/utils/window-rules` + `shared/stores/window-store`). 근거는 [[기술 스택:상태 관리]]에서 확인한다.
  - `shared/`에는 미리 만들지 않고, 두 기능 이상이 실제로 쓸 때 옮긴다.
디자인 시스템 패키지 구조: |
  ```
  packages/design-system/
  ├─ src/
  │  ├─ index.ts          # 공개 진입점. 컴포넌트 파일을 `export *`로 다시 내보낸다
  │  ├─ theme.css         # 손으로 쓰는 전역 스타일. fonts.css와 tokens.css를 불러온다
  │  ├─ fonts.css         # 웹 폰트(Open Sans, Pretendard, Cascadia Mono) CSS를 불러온다
  │  ├─ open-sans.css     # 웹 폰트 패키지 CSS에서 woff2만 가리키게 생성한다. 손으로 고치지 않는다
  │  ├─ pretendard.css    # 같다
  │  ├─ cascadia-mono.css # 같다
  │  ├─ tokens.css        # figma/tokens.json에서 생성한 토큰과 @utility. 손으로 고치지 않는다
  │  ├─ motion.css        # 손으로 쓰는 motion-* 클래스와 키프레임
  │  ├─ assets/           # figma/assets/에서 생성한 자산 데이터와 이미지. 손으로 고치지 않는다
  │  └─ components/
  │     └─ button/
  │        ├─ button.tsx
  │        ├─ button.stories.tsx
  │        └─ button.test.tsx
  ├─ scripts/             # 패키지 개발 스크립트. Node가 TypeScript를 직접 실행한다
  │  ├─ fonts/            # 웹 폰트 패키지 CSS → woff2 전용 CSS 생성(generate:fonts)
  │  ├─ assets/           # figma/assets/ → src/assets/ 생성(generate:assets)
  │  └─ tokens/           # figma/tokens.json → src/tokens.css 생성(generate:tokens). 플러그인도 같은 변환 함수를 쓴다
  └─ figma/               # 피그마 플러그인이 내보내는 기준 자료. 손으로 고치지 않는다
     ├─ figma.json        # 피그마 파일 키와 PNG 배율
     ├─ tokens.json       # Variables와 글자·효과·칠 스타일
     ├─ components/
     │  └─ button/
     │     └─ style=accent,state=rest.png
     ├─ motions/
     │  └─ motion-progress-ring.json
     └─ assets/
        └─ icons/
           └─ ic_fluent_search_16_regular.svg
  ```

  - 컴포넌트는 폴더 하나에 하나씩 두고 코드, 스토리, 테스트를 함께 둔다.
  - `figma/`는 플러그인이 덮어쓰는 기준 자료라 사람이 고치는 `src/`와 나눈다. 플러그인이 쓴 모양을 그대로 두도록 Prettier 검사에서도 뺀다.
  - 피그마 그림은 컴포넌트마다 `figma/components/<컴포넌트>/` 폴더로 나눈다. 다른 컴포넌트를 내보낸 PR끼리 같은 파일을 건드리지 않게 하기 위해서다. 자산은 묶음마다 `figma/assets/<묶음>/`에, 애니메이션은 견본마다 `figma/motions/<이름>.json`에 둔다.
  - 변형 파일 이름은 피그마 변형 이름과 1:1로 맞춰 Storybook 스토리와 짝짓는다([[피그마 연동:스토리 규칙]]).
  - 생성 파일(웹 폰트 CSS, `tokens.css`, `src/assets/`)은 손으로 고치지 않는다. 원본(`figma/`, 웹 폰트 패키지)을 바꾸고 다시 생성한다. 생성 결과가 원본과 맞는지는 CI가 다시 생성해 확인한다.
  - 스크립트는 이 패키지의 파일만 다루므로 루트 `scripts/`가 아니라 패키지 안에 둔다. 테스트는 소스 옆에 `*.test.ts`로 둔다.
  - 웹 폰트 CSS(`open-sans.css`, `pretendard.css`, `cascadia-mono.css`)는 패키지 CSS가 woff 대체 파일까지 가리켜 빌드에 woff가 딸려 들어가는 것을 막으려고 만든다. 웹 폰트 패키지를 올리면 `generate:fonts`로 다시 만든다.
의존 방향: |
  - `apps/web`은 `@seojaewan/design-system`을 공개 이름으로만 import한다. 패키지 내부 경로는 쓰지 않는다.
  - `packages/design-system`은 앱을 import하지 않는다. 데이터를 가져오지 않고 블로그 도메인(Notion, 글)을 알지 못한다.
  - `apps/web/src`의 import 방향은 `app → shell → features → shared`다. 아래 층은 위 층을 import하지 않는다(`features/`가 `app/`을 import하지 않는 것도 이 방향이다). `app/`과 `shell/`은 기능을 공개 진입점으로만 import한다. 자리를 정하는 법은 [[저장소 구성:앱 폴더 구조]]에서 확인한다.
  - 기능끼리는 공개 진입점으로도 import하지 않는다. 기능 안은 자유롭게 import한다. 기능 사이에 오가는 상태는 `shared/stores`로 주고받는다. 기능끼리 import하면 층 컴포넌트가 서로를 알게 되어 한 기능을 고칠 때 다른 기능이 함께 깨지기 때문이다.
  - 기능과 shell은 `shared/` 안 무엇이든 대상 파일(`@/shared/<종류>/<대상>/<대상>`)로 바로 import한다.
  - `shared/` 안은 종류(`components`, `hooks`, `utils`, `stores`, `stories`) 사이에 방향을 두지 않고 서로 자유롭게 import하며, 순환 import만 막는다. 공용 훅이 저장소를 감싸는 일이 흔하고, 방향보다 순환이 실제 위험이기 때문이다.
  - `tools/`의 도구는 패키지의 공개 코드와 빌드 결과(Storybook 정적 빌드)만 쓰고, 다른 패키지는 `tools/`를 import하지 않는다. 플러그인은 토큰 변환 함수(`packages/design-system/scripts/tokens/`)를 함께 묶어 쓴다.

  `eslint-plugin-boundaries`가 강제한다. 층 사이의 순환은 이 방향 규칙이 막는다.
  같은 층 안의 순환 import는 `eslint-plugin-import-x`의 `no-cycle`이 앱 전체(`shared/`·`features/`·`shell/`)와 디자인 시스템 패키지에서 막는다. 타입만 가져오는 `import type`만으로 생긴 순환은 검사하지 않는다.
패키지 관리: |
  - Node는 24로 고정한다(`engines`, `.nvmrc`, `engine-strict`).
  - pnpm 버전은 `packageManager` 필드로 고정한다.
  - 의존성은 정확한 버전으로 저장한다(`save-exact`). 설치할 때마다 버전이 바뀌지 않게 하기 위해서다.
  - pnpm 설정(`save-exact`, `engine-strict` 등)은 `pnpm-workspace.yaml`에 둔다. pnpm 12는 `.npmrc`의 이 설정을 읽지 않는다.
  - 공개된 지 하루가 지나지 않은 버전은 설치하지 않는다. pnpm 기본 정책이며 Renovate도 같은 기준을 따른다. 갓 나온 버전의 문제가 바로 들어오지 않게 하기 위해서다.
  - 업데이트는 Renovate가 여는 PR로 받는다. 함께 올려야 하는 패키지(React와 React DOM, Storybook 패키지들)는 한 PR로 묶는다. Renovate는 저장소에 Renovate GitHub App을 설치해야 동작한다.
  - 이 PC는 Windows 스마트 앱 컨트롤이 Next.js의 네이티브 컴파일러(Turbopack)를 막아, 로컬에서는 `next dev --webpack`, `next build --webpack`을 쓴다. CI와 Vercel은 기본 빌드를 쓴다.
TypeScript: |
  - `strict`, `noUncheckedIndexedAccess`, `noFallthroughCasesInSwitch`, `noImplicitOverride`를 켠다.
  - TypeScript는 typescript-eslint가 지원하는 범위(6.1 미만)의 버전을 쓴다. ESLint는 `eslint-plugin-react`가 지원하는 9를 쓴다. 두 플러그인이 지원 범위를 넓히면 Renovate PR로 올린다.
  - 타입 작성 규칙은 [[코드 작성 규칙:타입]]에서 확인한다.
검토한 대안: |
  - 순환 import 검사를 `shared/`에만 걸기: lint 시간을 아끼려던 방법이지만, 측정해 보니 앱 전체로 넓혀도 캐시 없는 전체 lint가 30.7초에서 35.4초로 약 15% 느는 데 그쳐 넓혔다.
