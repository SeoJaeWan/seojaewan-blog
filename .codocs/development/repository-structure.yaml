_codocs:
  id: repository-structure
  name: 저장소 구성
  parent:
    - 개발 컨벤션
개요: |
  모노레포에 무엇이 어디에 있고, 패키지와 기능이 어떤 방향으로 의존하며, 패키지와 런타임을 어떻게 관리하는지 정한다.
  패키지를 나눈 근거는 [[기술 스택:저장소 구성]]에서 확인한다.
구성: |
  - `apps/web`: Next.js 블로그 앱
  - `packages/design-system`: 피그마 디자인 시스템과 대응하는 토큰과 컴포넌트. 공개 이름은 `@seojaewan/design-system`이다. 내부 구조는 [[저장소 구성:디자인 시스템 패키지 구조]]에서 정한다.
  - `tools/figma-plugin`: 컴포넌트를 검사하고 레이어 정보·자산·토큰을 내보내는 피그마 개발용 플러그인([[피그마 일치 검사:피그마 플러그인]]). 다른 패키지가 가져다 쓰지 않는 개발 도구라 `apps/`·`packages/`와 나눠 `tools/`에 둔다.
  - `.codocs`: 기획·정책·컨벤션 문서
  - `.claude/skills`: 피그마 플러그인 PR을 처리하는 스킬처럼 반복 작업의 절차. 규칙은 옮겨 적지 않고 `.codocs`를 가리킨다([[피그마 일치 검사:스킬]]).
  - `AGENTS.md`: AI 에이전트가 작업 전에 codocs 문서를 확인하고 codocs MCP로 찾고 고치도록 안내한다. 프로젝트 지식을 여기에 복제하지 않는다.
앱 폴더 구조: |
  `apps/web/src`는 기능별로 나눔다. 기능이 일곱 개나 되어, 역할별(`components/`, `stores/`) 폴더에 모두 섞으면 폴더마다 파일이 쌓이고 한 기능을 고칠 때 여러 폴더를 오가야 하기 때문이다.

  ```
  apps/web/src/
  ├─ app/            # Next.js 라우트만(page, layout, 라우트 핸들러). 로직은 두지 않는다
  ├─ features/
  │  ├─ desktop/     # 바탕화면, 아이콘, 우클릭 메뉴
  │  ├─ taskbar/
  │  ├─ start-menu/  # Start와 검색
  │  ├─ file-explorer/
  │  ├─ chrome/      # 글 읽기 창, 탭, 주소창
  │  └─ window/      # 모든 앱 창이 공유하는 창 동작
  ├─ content/        # Notion 글 가져오기, 변환, 렌더링
  └─ shared/         # 두 기능 이상이 실제로 같이 쓸 때만 둔다
  ```

  기능 폴더 이름은 예시다. 기능 범위는 [[제품 정의:첫 공개 범위]]를 따르고, 세부 기능 문서를 쓸 때 확정한다.

  - 각 기능의 공개 진입점은 기능 이름 파일이다(예: `features/taskbar/taskbar.ts`). `index` 파일은 두지 않는다.
  - 상태 규칙은 순수 함수로 분리하고 Zustand 저장소는 그 함수를 부른다(예: `window-rules.ts` + `window-store.ts`). 근거는 [[기술 스택:상태 관리]]에서 확인한다.
  - `shared/`는 미리 만들지 않고, 두 기능 이상이 실제로 쓸 때 옮긴다.
디자인 시스템 패키지 구조: |
  ```
  packages/design-system/
  ├─ src/
  │  ├─ index.ts          # 공개 진입점
  │  ├─ theme.css         # Tailwind 설정과 손으로 쓰는 전역 스타일. fonts.css와 tokens.css를 불러온다
  │  ├─ fonts.css         # 웹 폰트(Open Sans, Pretendard, Cascadia Mono) CSS를 불러온다
  │  ├─ open-sans.css     # 웹 폰트 패키지 CSS에서 woff2만 가리키게 생성한다. 손으로 고치지 않는다
  │  ├─ pretendard.css    # 같다
  │  ├─ cascadia-mono.css # 같다
  │  ├─ tokens.css        # 토큰과 @utility. figma/tokens.json과 피그마를 보고 직접 쓴다
  │  ├─ assets/           # figma/assets/에서 생성한 자산 데이터와 이미지. 손으로 고치지 않는다
  │  └─ components/
  │     └─ button/
  │        ├─ button.tsx
  │        ├─ button.stories.tsx
  │        └─ button.test.tsx
  ├─ scripts/             # 패키지 개발 스크립트. Node가 TypeScript를 직접 실행한다
  │  ├─ fonts/            # 웹 폰트 패키지 CSS → woff2 전용 CSS 생성(generate:fonts)
  │  ├─ assets/           # figma/assets/ → src/assets/ 생성(generate:assets)
  │  └─ parity/           # 피그마 일치 검사(test:parity), 캡처 표, PR 댓글
  │     └─ rules/         # 결정 사항과 1:1 대응표. 플러그인도 읽는다
  ├─ parity-results/      # 일치 검사 결과. git에 넣지 않는다
  └─ figma/               # 피그마 플러그인이 내보내는 기준 자료. 손으로 고치지 않는다
     ├─ figma.json        # 피그마 파일 키와 PNG 배율
     ├─ tokens.json       # Variables와 글자·효과 스타일
     ├─ components/
     │  └─ button/
     │     ├─ export.json # 변형마다 레이어 정보(이름과 선택지), 숨긴 레이어, BOOLEAN 경우
     │     └─ style=accent,state=rest.png
     └─ assets/
        └─ icons/
           └─ ic_fluent_search_16_regular.svg
  ```

  - 컴포넌트는 폴더 하나에 하나씩 두고 코드, 스토리, 테스트를 함께 둔다. 비교가 실패했을 때 고칠 파일을 바로 찾기 위해서다.
  - `figma/`는 플러그인이 덮어쓰는 기준 자료라 사람이 고치는 `src/`와 나눈다. 플러그인이 쓴 모양을 그대로 두도록 Prettier 검사에서도 뺀다.
  - 피그마 자료는 컴포넌트마다 `figma/components/<컴포넌트>/` 폴더로 나눈다. 다른 컴포넌트를 내보낸 PR끼리 같은 파일을 건드리지 않게 하기 위해서다. 자산은 묶음마다 `figma/assets/<묶음>/`에 둔다. 형식은 [[피그마 일치 검사:export.json 계약]]에서 정한다.
  - 변형 파일 이름은 피그마 변형 이름과 1:1로 맞춰 Storybook 스토리와 짝짓는다. 짝짓는 방법은 [[피그마 일치 검사:스토리 규칙]]에서 정한다.
  - 생성 파일(웹 폰트 CSS, `src/assets/`)은 손으로 고치지 않는다. 원본(`figma/`, 웹 폰트 패키지)을 바꾸고 다시 생성한다. 생성 결과가 원본과 맞는지는 단위 테스트나 CI가 확인한다.
  - 스크립트는 이 패키지의 파일만 다루므로 루트 `scripts/`가 아니라 패키지 안에 둔다. 테스트는 소스 옆에 `*.test.ts`로 둔다.
  - 웹 폰트 CSS(`open-sans.css`, `pretendard.css`, `cascadia-mono.css`)는 패키지 CSS가 woff 대체 파일까지 가리켜 빌드에 woff가 딸려 들어가는 것을 막으려고 만든다. 웹 폰트 패키지를 올리면 `generate:fonts`로 다시 만든다.
의존 방향: |
  - `apps/web`은 `@seojaewan/design-system`을 공개 이름으로만 import한다. 패키지 내부 경로는 쓰지 않는다.
  - `packages/design-system`은 앱을 import하지 않는다. 블로그 도메인(Notion, 글)을 알지 못한다.
  - 기능끼리는 서로의 공개 진입점으로만 import한다.
  - `features/`는 `app/`을 import하지 않는다.

  `eslint-plugin-boundaries`가 강제한다.
패키지 관리: |
  - Node는 24로 고정한다(`engines`, `.nvmrc`, `engine-strict`).
  - pnpm 버전은 `packageManager` 필드로 고정한다.
  - 의존성은 정확한 버전으로 저장한다(`save-exact`). 설치할 때마다 버전이 바뀌지 않게 하기 위해서다.
  - pnpm 설정(`save-exact`, `engine-strict` 등)은 `pnpm-workspace.yaml`에 둔다. pnpm 12는 `.npmrc`의 이 설정을 읽지 않는다.
  - 공개된 지 하루가 지나지 않은 버전은 설치하지 않는다. pnpm 기본 정책이며 Renovate도 같은 기준을 따른다. 갓 나온 버전의 문제가 바로 들어오지 않게 하기 위해서다.
  - 업데이트는 Renovate가 여는 PR로 받는다. 함께 올려야 하는 패키지(React와 React DOM, Storybook 패키지들)는 한 PR로 묶는다. Renovate는 저장소에 Renovate GitHub App을 설치해야 동작한다.
  - 이 PC는 Windows 스마트 앱 컨트롤이 Next.js의 네이티브 컴파일러(Turbopack)를 막아, 로컬에서는 `next dev --webpack`, `next build --webpack`을 쓴다. CI와 Vercel은 기본 빌드를 쓴다.
TypeScript: |
  - `strict`, `noUncheckedIndexedAccess`, `noFallthroughCasesInSwitch`, `noImplicitOverride`를 켠다.
  - TypeScript는 typescript-eslint가 지원하는 범위(6.1 미만)의 버전을 쓴다. ESLint는 `eslint-plugin-react`가 지원하는 9를 쓴다. 두 플러그인이 지원 범위를 넓히면 Renovate PR로 올린다.
  - 타입 작성 규칙은 [[코드 작성 규칙:타입]]에서 확인한다.
