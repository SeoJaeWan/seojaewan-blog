_codocs:
  id: figma-parity-principles
  name: 비교 원리
  parent:
    - 피그마 일치 검사
개요: |
  [[피그마 일치 검사]]가 왜 그림이 아니라 "이름"으로 피그마와 코드를 비교하는지, 실제로 무엇을 맞춰 보는지를 예시로 쉽게 풀어 쓴 설명이다.
  규칙 자체는 피그마 일치 검사 문서가 기준이고, 여기서는 새 규칙을 정하지 않는다.

  한 줄로 줄이면 이렇다: 피그마에서 버튼 배경을 칠할 때 고른 색 이름과, 코드가 버튼 배경에 쓴 색 이름이 같은지 본다. 이름이 같으면 그 이름의 색은 하나뿐이므로 색도 같다.

  다만 이름이나 값을 그대로 옮길 수 없는 것(크기 방식, 안쪽 선, 재질처럼 "어떻게 그리느냐"의 문제)은 기계가 판정하지 않고, 피그마와 코드를 나란히 캡처한 표로 사람이 본다.
두 개의 벽: |
  피그마 화면과 브라우저 화면을 "그림"으로 비교하려고 여러 방법을 시험했고, 모두 두 벽 중 하나에 부딪혔다.

  첫째 벽은 그리는 프로그램이 다르다는 것이다.
  피그마와 브라우저(Chromium)는 화면을 그리는 프로그램(렌더링 엔진)이 다르다. 같은 디자인이라도 글자를 놓는 위치를 다르게 반올림하고(피그마는 47.5px처럼 소수 위치, 브라우저는 정수 위치), 둥근 모서리 가장자리를 부드럽게 칠하는 방식(안티앨리어싱)과 그림자 경계가 다르다.
  그래서 그림을 픽셀 하나하나 비교하면 아무것도 틀리지 않은 버튼도 다르다고 나온다. 기준을 느슨하게 하면 이번에는 "여백 1px 틀림" 같은 진짜 실수가 같은 크기의 엔진 차이에 묻혀 보이지 않는다.
  게다가 피그마는 같은 디자인을 다시 내보내기만 해도 그림이 조금씩 달라져, 기준이 될 그림 자체가 흔들렸다.

  둘째 벽은 옮기면 빠진다는 것이다.
  엔진 차이를 피하려고 한쪽을 다른 쪽 형식으로 옮겨 같은 프로그램에서 그려 보았다(피그마 → SVG 그림 파일, 피그마 → HTML, 피그마 → 코드 생성). 그런데 옮기는 과정에서 정보가 빠졌다. 그라데이션 테두리가 단색이 되고, 색이 반올림되고, 흐림·점선은 표현되지 않았다. 틀린 버전과 맞는 버전이 같은 그림이 되는 경우까지 있었다.

  그림 대신 숫자(위치, 크기, 여백)를 재서 비교하는 방법은 두 벽을 피했지만, 피그마의 숫자와 브라우저의 숫자가 뜻하는 바가 조금씩 달라 짝짓는 규칙에 예외가 끝없이 붙었다.
  자세한 시험 결과는 [[피그마 일치 검사:검토한 대안]]에 있다.
이름으로 비교한다는 것: |
  피그마에서 버튼 배경을 칠할 때 `#005FB8` 같은 색 숫자를 직접 넣지 않고 `accent-fill/default`라는 이름을 고른다. 이렇게 이름 붙여 저장해 둔 값을 피그마에서는 변수(Variable)라고 부르고, 여러 값을 묶은 것(그림자 두 겹, 글자 크기·굵기·줄 높이 묶음)은 스타일(Style)이라고 부른다. 코드 쪽에서는 같은 값을 토큰이라고 부른다.
  코드도 같은 이름에서 만들어진 클래스 `bg-accent-fill-default`를 쓴다. 클래스는 HTML 요소에 붙이는 이름표이고, Tailwind CSS는 이름표마다 "배경을 이 색으로" 같은 스타일을 정해 둔다(유틸리티 클래스).

  비교 도구는 클래스 이름이 아니라, 브라우저가 버튼 배경을 정할 때 실제로 이긴 CSS 선언이 `var(--color-accent-fill-default)`를 가리키는지 본다. "피그마가 고른 이름과 코드가 쓴 이름이 같은가"라는 글자 비교다. 그리는 프로그램도, 형식 옮기기도 끼지 않는다.
  이것이 "색이 같다"는 뜻이 되려면 세 고리가 이어져야 하고, 고리마다 지키는 장치가 있다.

  1. 피그마의 모든 값은 이름에 연결되어 있다. 숫자를 직접 넣은 곳이 있으면 피그마 플러그인이 내보내기를 막는다.
  2. 이름의 값은 한 곳에서 코드로 옮겨진다. 피그마 변수를 내보낸 `tokens.json`을 보고 사람이나 에이전트가 `tokens.css`에 옮기고, CI가 이름과 값이 맞는지 비교한다. 그라데이션·재질처럼 값을 그대로 비교할 수 없는 것은 캡처 표에서 본다.
  3. 코드는 이름만 쓴다. 비교 도구가 요소마다 이긴 선언의 변수 이름을 확인한다.

  마지막으로 브라우저가 실제로 적용한 값(계산값)이 피그마 값과 같은지도 본다. `tokens.css`에 값을 잘못 옮긴 경우를 잡기 위해서다. 그리기 전에 정해지는 값끼리의 비교라 엔진 차이가 없다.

  이 비교는 피그마의 설정과 CSS의 설정이 1:1일 때만 한다. 피그마 "HUG(내용에 맞춤)"처럼 CSS에 같은 개념이 없어 여러 선언을 조합해 흉내 내야 하는 것은, 어떤 조합이 맞는지가 사람의 결정이라 판정하지 않는다. 판정하는 것과 하지 않는 것의 전체 목록은 [[피그마 일치 검사:판정 항목]]에 있다.
버튼 예시: |
  Button의 `Style=Accent, State=Rest` 변형으로 따라가 본다. 값은 설명을 위해 단순하게 줄였다.

  1단계: 피그마 레이어에서 코드에서 확인할 것을 만든다.

  | 레이어 | 피그마에서 고른 것 | 코드에서 확인할 것 |
  |---|---|---|
  | (루트) | 자동 배치 가로, 가운데 정렬 | `display`가 `flex`·`inline-flex`, `flex-direction: row`, `justify-content: center`, `align-items: center` |
  | (루트) | 변수 `accent-fill/default` | `background-color` 선언이 `var(--color-accent-fill-default)`, 계산값 `rgb(0, 95, 184)` |
  | (루트) | 변수 `radius/control` | `border-*-radius` 선언이 `var(--radius-control)`, 계산값 `4px` |
  | (루트) | 변수 `spacing/12`(좌우), `spacing/6`(위아래) | `padding-*` 선언이 `var(--spacing-12)`·`var(--spacing-6)` |
  | (루트) | 칠 스타일 `Elevation/Accent Control Border`, 레이아웃에 포함하지 않은 안쪽 선 | 판정하지 않음. 캡처 표에서 본다 |
  | (루트) | 크기 HUG | 판정하지 않음. 캡처 표에서 본다 |
  | `label` | 글자 스타일 `Body`, 변수 `text-on-accent-fill/primary` | `font-size` 등 선언의 변수와 계산값, `color` 선언이 `var(--color-text-on-accent-fill-primary)` |

  2단계: 코드에서 짝을 찾는다. 루트는 비교 요소이고, 글자는 `<span data-figma="label">`이다. `data-figma`는 "이 요소가 피그마의 이 레이어다"라고 적어 두는 표시다.

  3단계: 비교한다.

  | 확인 | 피그마 | 코드 | 결과 |
  |---|---|---|---|
  | 루트 배경 | `accent-fill/default`, `#005fb8` | 선언 `var(--color-accent-fill-default)`, 계산값 `rgb(0, 95, 184)` | 통과 |
  | 루트 모서리 | `radius/control`, 4px | 선언 `var(--radius-control)`, 계산값 `4px` | 통과 |
  | `label` 짝 | 레이어 있음 | `data-figma="label"` 하나 | 통과 |
  | `label` 글자 | `버튼` | `버튼` | 통과 |
  | `label` 서체 | 글자마다 Pretendard | 브라우저가 실제로 그린 서체도 Pretendard | 통과 |
  | `icon` | 숨김(`Show icon` 꺼짐) | 아이콘 요소가 보이지 않음 | 통과 |

  Hover 변형이면 비교 도구가 실제로 마우스를 올린 뒤 같은 확인을 한다. 그래서 `hover:` 클래스가 빠졌거나 다른 규칙에 밀려 적용되지 않으면 이긴 선언에서 걸린다.
  판정하지 않은 선과 크기는 PR 댓글의 캡처 표에서 피그마와 나란히 보고 사람이 확인한다.
잡히는 실수: |
  | 실수 | 예 | 무엇이 잡나 |
  |---|---|---|
  | 여백을 숫자로 직접 씀 | `px-[13px]` | 임의 값 lint, 그리고 선언이 `--spacing-12`를 참조하지 않음 |
  | 이웃 상태의 색을 씀 | Rest에 `bg-accent-fill-secondary` | 이름이 다름 |
  | 반경 토큰이 틀림 | `rounded-small` | 이름이 다름 |
  | 다른 CSS가 덮어씀 | 전역 CSS가 버튼 배경을 바꿈 | 이긴 선언이 토큰을 참조하지 않음 |
  | 상태 클래스가 적용되지 않음 | `hover:` 변형이 빠짐 | 마우스를 올린 상태의 이긴 선언이 다름 |
  | 피그마에 없는 모양을 더함 | 코드에만 그림자 | 표시 없이 토큰을 쓴 요소라 실패 |
  | 레이어를 빠뜨림 | 아이콘을 그리지 않음 | 짝 요소 없음 |
  | 다른 아이콘 | search 대신 open 아이콘 | 자산 이름이 다름 |
  | 글자가 다름 | `버튼 ` 뒤 공백 | 글자 내용이 다름 |
  | 한글 서체가 바뀜 | 웹 폰트를 받지 못해 시스템 서체로 그림 | 글자별 실제 서체가 다름 |
  | 숨겨야 할 레이어가 보임 | 아이콘 끔인데 아이콘이 보임 | 숨긴 레이어의 요소가 보임 |
  | `tokens.css`에 값을 잘못 옮김 | `#005fb8`을 `#005fb9`로 씀 | 토큰 값 비교와 계산값이 피그마 값과 다름 |
  | 피그마에서 숫자를 직접 넣음 | 여백 13을 변수 없이 입력 | 플러그인이 내보내기를 막음 |
잡지 못하는 것: |
  이름 비교가 맡지 않는 것도 있다. 다른 장치가 맡거나 사람이 본다.

  - 토큰 값 자체가 틀린 경우: 피그마가 기준이라 피그마 값이 Windows와 다르면 코드도 똑같이 다르다. 값은 피그마를 만들 때 Windows UI kit과 대조한다([[디자인 시스템:출발점]]).
  - 1:1이 아닌 것(크기 방식, 안쪽 선, 재질, 줄바꿈 결과, 위치)과 `@utility`가 피그마처럼 그리는지: 예를 들어 `border-gradient-*`가 그라데이션 테두리를 어떻게 그리는지는 이름 비교로 알 수 없다. 판정하지 않고 PR마다 캡처 표로 사람이 본다([[피그마 일치 검사:캡처 표]]).
  - 재질 효과의 혼합 모습: 흐린 배경 위의 실제 모습은 Storybook에서 눈으로 본다([[디자인 기반:재질 효과]]).
  - 실행 중에 정해지는 위치(창 위치, 팝업 위치)와 화면 단위 조립: 컴포넌트 비교 범위 밖이다([[미결 사항:화면 단위 시각 검증]]).
용어: |
  - 렌더링 엔진: 디자인이나 웹 페이지를 화면의 픽셀로 그리는 프로그램. 피그마와 브라우저는 서로 다른 엔진을 쓴다.
  - 안티앨리어싱: 비스듬한 선이나 둥근 모서리가 계단처럼 보이지 않게 가장자리 픽셀을 반투명하게 칠하는 처리. 엔진마다 방식이 달라 픽셀 비교를 어렵게 한다.
  - 변수(Variable)·스타일(Style): 피그마에서 값에 이름을 붙여 저장한 것. 변수는 값 하나(색, 숫자), 스타일은 값 묶음(그림자, 글자 서식)이다.
  - 토큰: 디자인 값에 붙인 이름을 코드 쪽에서 부르는 말. 이 저장소에서는 피그마 변수·스타일과 같은 이름이다([[디자인 기반:토큰 이름]]).
  - 유틸리티 클래스: `bg-accent-fill-default`처럼 스타일 하나를 담은 CSS 클래스. Tailwind CSS가 토큰에서 만든다.
  - 계산값: 브라우저가 모든 CSS 규칙을 적용한 뒤 요소에 실제로 쓰는 최종 값. `getComputedStyle`로 읽는다.
  - 자동 배치(Auto layout): 피그마에서 자식을 방향·정렬·간격 규칙으로 늘어놓는 기능. CSS flex와 거의 1:1로 대응한다.
  - CDP(Chromium DevTools 프로토콜): 개발자 도구가 브라우저 내부 정보를 읽는 통로. 글자를 실제로 그린 서체 이름을 여기서 읽는다.
