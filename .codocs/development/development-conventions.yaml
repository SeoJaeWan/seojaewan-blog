_codocs:
  id: development-conventions
  name: 개발 컨벤션
  parent:
    - seojaewan 블로그
개요: |
  seojaewan 블로그 저장소에서 코드를 쓰고, 검사하고, 기록하는 방식을 안내하는 목차다.
  각 규칙이 무엇이고 어떤 도구·설정 파일로 강제되는지는 하위 문서에서 확인한다.
  작업의 대부분을 AI가 하므로, 규칙은 가능한 한 도구로 강제하고 도구로 강제하지 못하는 것만 리뷰에서 확인한다.
문서: |
  - 무엇이 어디에 있고 패키지와 기능이 어떻게 연결되는지: [[저장소 구성]]
  - 이름, 함수, import·export, JSDoc, 타입, 포맷, React·Next.js 사용 방식: [[코드 작성 규칙]]
  - 무엇을 어떻게 테스트하고 어디서 실행하는지: [[테스트 작성 규칙]]
  - 피그마 디자인을 토큰·자산·컴포넌트 코드로 옮기고 같은지 확인하는 방법: [[피그마 연동]]
  - 커밋, 브랜치, PR, 병합, Git 훅, CI: [[Git 작업 규칙]]
  - 코드와 문서를 어디서 잇는지: [[codocs 연결 규칙]]
강제 방식: |
  규칙 대부분은 TypeScript, ESLint, Prettier, commitlint와 Git 훅(husky)으로 강제한다.
  규칙의 예외는 인라인 주석이 아니라 설정 파일에서 경로 단위로 둔다(`eslint-disable` 주석 금지).

  CI 검사와 필수 검사에 따른 병합 제한은 [[Git 작업 규칙:CI]]에서 정한다.
작업 원칙: |
  - 문서는 먼저 알리고 허락을 받은 뒤 바꾼다. `.codocs` 문서를 고쳐야 하면 고치기 전에 무엇을 왜 바꾸는지 사용자에게 안내하고, 허락을 받은 뒤 고친다. 작업 중 문서와 코드가 다른 점을 발견했을 때도 같다.
  - 문서에서 사실 하나는 한 곳에만 적고, 다른 곳은 그 섹션을 `\[[문서:섹션]]`으로 가리킨다. 규칙(어떻게 하는가)은 그 규칙의 섹션에, 고르지 않은 방법과 이유는 그 문서의 "검토한 대안"에, 아직 풀지 못한 문제는 [[한계]]에 두고, 이유는 다시 쓰지 않고 링크한다. 같은 내용을 여러 곳에 쓰면 결정을 바꿀 때 하나를 빠뜨려 문서끼리 어긋나기 때문이다.
  - 계획을 세우기 전에 작업 범위를 먼저 파악한다. 손댈 대상 전체(같은 컴포넌트의 모든 변형, 영향받는 화면과 코드), 예외 상황, 검사에 걸리는 항목의 원인까지 미리 점검하고, 그 결과를 바탕으로 질문과 결정할 내용을 한 번에 구성한다. 작업 중에 새 질문이 계속 나오면 사용자의 흐름이 끊기기 때문이다.
  - 직접 만들기 전에 보편적인 도구부터 찾는다. 피그마, CI, 테스트, 빌드처럼 외부 도구와 연동하거나 개발용 스크립트를 만들 때는 널리 쓰이는 라이브러리와 공식 기능이 있는지 먼저 검토한다. 이미 설치된 도구가 제공하는 기능을 우선 쓰고, 직접 관리하는 코드는 이 프로젝트에만 있는 규칙으로 줄인다.
    - 새 패키지가 필요하면 설치하기 전에 허락을 받는다.
    - 직접 만들기로 했다면 검토한 도구와 고르지 않은 이유를 해당 문서의 "검토한 대안"에 남긴다.
    - 외부 라이브러리나 도구의 동작을 근거로 답하거나 정할 때는 공식 문서를 먼저 확인하고, 확인한 문서를 함께 밝힌다.
