_codocs:
  id: git-workflow
  name: Git 작업 규칙
  parent:
    - 개발 컨벤션
개요: |
  작업 단위, 브랜치, 커밋, 병합, Git 훅, CI를 정한다.
작업 단위: |
  작업은 PR 단위로 관리한다. GitHub Issues나 Jira는 쓰지 않는다.
  모든 변경은 PR로 `main`에 들어간다.
  PR 본문과 PR 댓글에도 AI 도구가 붙이는 생성 표시(`Generated with ...`)와 세션 링크를 넣지 않는다.
브랜치: |
  `종류/짧은-설명` 형식이다. 예: `feat/taskbar-pin`, `fix/window-drag`, `chore/setup-monorepo`
  종류는 커밋 종류와 같은 단어를 쓴다.
  피그마 플러그인이 여는 브랜치는 이름이 고정이다: 토큰은 `feat/figma-tokens`, 컴포넌트마다 `feat/figma-<컴포넌트>`, 조립은 영역마다 `feat/figma-patterns-<영역>`, 애니메이션은 견본마다 `feat/figma-motion-<이름>`. 같은 대상을 다시 내보내면 열린 PR의 브랜치를 이어 쓴다([[피그마 연동:피그마 플러그인]]).
커밋: |
  - 제목은 영어로, Conventional Commits 형식을 따른다. 예: `feat(design-system): add Button component`
  - 본문은 한국어로 쓴다. 무엇을 왜 바꿨는지 적는다.
  - commitlint가 형식을 검사한다.
  - 커밋 작성자는 저장소 주인 계정(`Ing-yeo_Developer <52366178+SeoJaeWan@users.noreply.github.com>`)으로 한다. AI가 만든 커밋도 같다. AI 도구가 붙이는 공동 작성자·세션 표시(`Co-Authored-By`, `Claude-Session` 등)는 넣지 않는다.
  - 커밋은 하나마다 의미 있는 단위여야 한다. 작업 중에 생긴 잔손질 커밋(오타 수정, wip)은 PR을 올리기 전에 정리한다. 병합할 때 커밋이 그대로 남기 때문이다.
병합: |
  일반 merge commit으로 병합한다. Squash merge는 쓰지 않는다.
  작업 대부분을 AI가 하므로, AI가 만든 커밋 하나하나를 `main` 히스토리에서 볼 수 있게 하기 위해서다.
Git 훅: |
  husky로 두 훅을 둔다.

  - commit-msg: commitlint로 커밋 메시지 형식을 검사한다.
  - pre-commit: 작업한 범위만 검사한다. 바뀐 파일의 lint·포맷(lint-staged), 영향받는 테스트([[테스트 작성 규칙:실행 시점]]), 증분 타입 검사(`tsc --incremental`)다.
    - 검사가 도는 동안 스테이지 내용(index)이 바뀌면 커밋을 멈춘다. git은 훅이 끝난 뒤 index를 다시 읽어 커밋을 만들므로, 그 사이 다른 프로세스(같은 폴더에서 일하는 다른 에이전트 등)가 `git add`한 파일이 섞여 들어가기 때문이다.
    - 같은 폴더에서 여러 에이전트가 동시에 커밋하지 않는다. 동시에 작업해야 하면 각자 별도 worktree를 쓰고, 커밋은 `git commit -- <경로>`처럼 파일을 지정한다.

  커밋마다 전체 검사를 돌리면 AI가 커밋을 자주 만들 때마다 기다려야 하므로, 전체 검사는 CI에 둔다.
CI: |
  PR과 `main` push마다 GitHub Actions에서 실행한다. 워크플로를 나누는 기준과 각 워크플로가 도는 범위는 [[피그마 연동:CI]]에 있다.

  - 검사 작업(`ci.yml`): 포맷 검사, 전체 lint(ESLint와 Stylelint), 타입 검사, 단위·컴포넌트 테스트, Next.js 빌드, 디자인 시스템과 앱의 Storybook 빌드
  - E2E 작업(`ci.yml`)
  - 생성 검사(`figma-generated.yml`): 토큰 생성 확인(`generate:tokens --check`)과 자산 생성 확인(`generate:assets --check`)
  - 피그마 캡처(`figma-parity.yml`): 일반 CI와 나눈 워크플로다. PR(초안 포함)에서 바뀐 파일로 캡처 범위를 정하고, 범위가 있을 때만 캡처 표를 PR 댓글로 남긴다. `main` push에서는 영향받은 컴포넌트와 조립을 캡처해 `parity-captures` 브랜치에 저장한다([[피그마 연동:캡처 범위]], [[피그마 연동:CI]]).
  - 모션 시간 검사(`motion-check.yml`): 바뀐 모션 클래스의 시간·이징·지연·반복 횟수를 내보낸 자료와 비교한다([[피그마 연동:모션]]).

  빌드는 Vercel 미리보기 배포에서도 만들어지지만, Vercel 연결 여부와 상관없이 깨진 빌드를 PR에서 바로 잡기 위해 CI에서도 빌드한다. Storybook 빌드는 디자인 시스템 카탈로그와 앱 조립 스토리가 깨지지 않았는지 확인한다.

  GitHub ruleset(`main: CI 통과 필수`)이 기본 브랜치(`main`)에 다섯 작업(`Lint, typecheck, test, build`, `E2E`, `Figma generated`, `Figma parity`, `Motion check`)의 통과를 요구해, CI가 통과하지 않은 PR은 병합할 수 없다.
  - 관리자 우회는 두지 않는다. `main`에 직접 push하는 커밋도 같은 검사를 통과해야 한다.
  - `Figma generated`, `Figma parity`, `Motion check`는 늘 시작해 검사할 범위가 없으면 통과로 끝나므로([[피그마 연동:CI]]), 생성 파일이 어긋났거나 빌드·캡처·모션 검사가 깨졌을 때만 병합을 막는다.
  - 최신 `main` 기준 재검사(strict)는 요구하지 않는다. `main`이 바뀔 때마다 PR 브랜치를 갱신해야 하기 때문이다.
