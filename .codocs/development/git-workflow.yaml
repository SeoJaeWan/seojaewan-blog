_codocs:
  id: git-workflow
  name: Git 작업 규칙
  parent:
    - 개발 컨벤션
개요: |
  작업 단위, 브랜치, 커밋, 병합, Git 훅, CI를 정한다.
작업 단위: |
  작업은 PR 단위로 관리한다. GitHub Issues나 Jira는 쓰지 않는다.
  모든 변경은 PR로 `main`에 들어간다.
  PR 본문과 PR 댓글에도 AI 도구가 붙이는 생성 표시(`Generated with ...`)와 세션 링크를 넣지 않는다.
브랜치: |
  `종류/짧은-설명` 형식이다. 예: `feat/taskbar-pin`, `fix/window-drag`, `chore/setup-monorepo`
  종류는 커밋 종류와 같은 단어를 쓴다.
  피그마 플러그인이 여는 브랜치의 고정 이름과 재내보내기 시 브랜치 재사용은 [[피그마 연동:피그마 플러그인]]에서 정한다.
  `main`과 Renovate가 여는 `renovate/...` 브랜치는 이 형식 검사에서 제외한다.
  젠킨스가 여는 버전 PR 브랜치 `chore/release`는 이 형식이고, 사람이 쓰지 않는 예약 이름이다([[Git 작업 규칙:Changesets]]).
  `branch-name.yml`의 `Branch name` 작업과 push 훅(pre-push)이 이름을 검사한다. 설명은 소문자·숫자·하이픈이고, 종류 목록은 commitlint 설정(`type-enum`)에서 읽는다. `branch-name.yml`은 모든 PR(버전 PR 포함)에서 돌고 `main` push에서는 돌지 않는다.

  `docs/` 브랜치는 문서만 바꾼다. `docs/` PR에서는 CI(`ci.yml`)가 돌지 않으므로([[Git 작업 규칙:CI]]), 문서가 아닌 파일이 검사 없이 병합되지 않게 `Branch name` 작업이 PR이 바꾼 파일(추가·수정·삭제, 이름 변경은 옛 경로와 새 경로 모두)을 본다(`scripts/check-docs-branch.mjs`). 하나라도 아래 범위 밖이면 실패한다.
  - `.codocs/` 아래 전부
  - `.claude/` 아래 전부
  - 파일 이름이 `AGENTS.md`, `CLAUDE.md`, `README.md`인 파일(어느 폴더든)

  그 밖의 파일을 함께 바꿔야 하면 다른 종류의 브랜치로 올려 CI 검사를 받는다.
커밋: |
  - 제목은 영어로, Conventional Commits 형식을 따른다. 예: `feat(design-system): add Button component`
  - 본문은 한국어로 쓴다. 무엇을 왜 바꿨는지 적는다.
  - commitlint가 형식을 검사한다.
  - 커밋 작성자는 저장소 주인 계정(`Ing-yeo_Developer <52366178+SeoJaeWan@users.noreply.github.com>`)으로 한다. AI가 만든 커밋도 같다. AI 도구가 붙이는 공동 작성자·세션 표시(`Co-Authored-By`, `Claude-Session` 등)는 넣지 않는다.
  - 커밋은 하나마다 의미 있는 단위여야 한다. 작업 중에 생긴 잔손질 커밋(오타 수정, wip)은 PR을 올리기 전에 정리한다. 병합할 때 커밋이 그대로 남기 때문이다.
병합: |
  일반 merge commit으로 병합한다. Squash merge는 쓰지 않는다.
  작업 대부분을 AI가 하므로, AI가 만든 커밋 하나하나를 `main` 히스토리에서 볼 수 있게 하기 위해서다.
Git 훅: |
  husky로 세 훅을 둔다.

  - commit-msg: commitlint로 커밋 메시지 형식을 검사한다.
  - pre-push: 푸시하는 브랜치 이름을 검사한다([[Git 작업 규칙:브랜치]]).
  - pre-commit: 작업한 범위만 검사한다. 바뀐 파일의 lint·포맷(lint-staged), 영향받는 테스트([[테스트 작성 규칙:실행 시점]]), 증분 타입 검사(`tsc --incremental`)다.
    - 검사가 도는 동안 스테이지 내용(index)이 바뀌면 커밋을 멈춘다. git은 훅이 끝난 뒤 index를 다시 읽어 커밋을 만들므로, 그 사이 다른 프로세스(같은 폴더에서 일하는 다른 에이전트 등)가 `git add`한 파일이 섞여 들어가기 때문이다.
    - 같은 폴더에서 여러 에이전트가 동시에 커밋하지 않는다. 동시에 작업해야 하면 각자 별도 worktree를 쓰고, 커밋은 `git commit -- <경로>`처럼 파일을 지정한다.

  커밋마다 전체 검사를 돌리면 AI가 커밋을 자주 만들 때마다 기다려야 하므로, 전체 검사는 CI에 둔다.
CI: |
  GitHub Actions에서 실행한다. 모든 워크플로가 GitHub 호스티드 러너(`runs-on: ubuntu-latest`)에서 돌고, self-hosted runner는 쓰지 않는다. 러너와 저장소 공개는 [[배포 환경:CI]]에 있다.

  워크플로:
  - `branch-name.yml`: 모든 PR(버전 PR 포함)에서 브랜치 이름과 `docs/` 브랜치의 파일 범위를 검사한다([[Git 작업 규칙:브랜치]]). `main` push에서는 돌지 않는다.
  - `ci.yml`: PR과 `main` push의 검사. 아래 도는 조건과 작업 구조를 따른다.
  - `content-sync.yml`: 글 동기화([[배포 환경:CI]]).

  `ci.yml`이 도는 조건(`scripts/ci-scope.mjs`, 맨 앞 `Scope` 작업이 정한다):
  - PR: 브랜치가 `chore/release`(버전 PR), `docs/*`(문서 PR), `chore/notion-content-sync`(글 동기화 PR)이면 돌지 않는다. 그 밖의 PR은 Renovate(`renovate/*`)를 포함해 모두 돈다.
  - `main` push: 위 세 종류가 아닌 PR을 병합한 push에서만 돈다. push 이벤트에는 PR 브랜치 이름이 없어, 병합 커밋 제목(`Merge pull request #N from <owner>/<branch>`)에서 브랜치를 읽는다([[Git 작업 규칙:병합]]). 브랜치를 읽지 못한 push(직접 push 등)는 돈다.
  - 같은 ref에 새 실행이 오면 앞 실행을 취소한다.

  `ci.yml`의 작업 구조:
  1. `Changeset`: changeset 검사([[Git 작업 규칙:Changesets]]). PR에서만 검사하고 `main` push에서는 건너뛴다. 실패하면 뒤 작업은 시작하지 않는다. `main` push에서 건너뛰어도 뒤 작업은 돈다.
  2. 그 뒤 네 작업이 나란히 돈다. 서로 기다리지 않고, 하나가 실패해도 나머지는 끝까지 돈다.
     - `Static checks`: 포맷 검사(`pnpm format:check`), 전체 lint(ESLint와 Stylelint, Node 힙 4GB), 타입 검사
     - `Test`: Chromium 준비 뒤 단위·스토리 테스트(`pnpm test`). 조각으로 나누지 않는다.
     - `Build`: 운영 글 빌드(`pnpm build`, `CONTENT_SOURCE=notion`, [[콘텐츠 원천:읽는 곳]]), 디자인 시스템과 앱의 Storybook 빌드(`pnpm build:storybook`)
     - `E2E`: Chromium 준비 뒤 fixture 빌드와 E2E(`pnpm test:e2e`). worker 수는 지정하지 않는다. 그 결과로 시나리오 케이스 보고서를 만든다([[테스트 작성 규칙:E2E]]).
  3. `Publish report`: `E2E`가 만든 보고서를 GitHub Pages 브랜치(`gh-pages`)에 올린다(`scripts/publish-scenario-pages.sh`). 이 작업만 한 번에 하나씩 돌게 줄을 세운다(`concurrency`). 포크에서 온 PR은 쓰기 권한이 없어 건너뛴다.

  `Test` 조각 나누기와 `E2E` worker 수는 저장소 공개 전환 뒤 실행 시간을 보고 다시 정한다.

  캐시:
  - pnpm 저장소: `actions/setup-node`의 `cache: pnpm`. 루트 의존성만 설치하는 작업(`Branch name`, `Changeset`)은 캐시를 쓰지 않는다. 일부만 담은 저장소를 같은 키로 먼저 저장하지 않게 하기 위해서다.
  - Playwright 브라우저: Playwright 버전을 키로 `actions/cache`(`~/.cache/ms-playwright`, `.github/actions/setup-playwright`). 캐시가 맞으면 시스템 라이브러리만 설치하고(`playwright install-deps`), 아니면 함께 설치한다(`playwright install --with-deps`). 캐시가 맞을 때 시스템 라이브러리 설치를 건너뛸 수 있는지는 공개 전환 뒤 시간을 재어 본다.
  - turbo: `.turbo/cache`를 작업마다 `actions/cache`로 둔다. 키는 커밋마다 새로 저장하고(`turbo-<작업>-<커밋>`), `restore-keys`로 가장 가까운 앞 캐시를 받는다.
  - GitHub 캐시는 PR이 자기 것과 `main`의 것만 읽는다. `main` push 실행이 캐시를 저장하고, 그 뒤의 PR이 그것을 받아 쓴다.

  미리보기 배포가 없으므로([[배포 환경]]) 깨진 빌드를 PR에서 바로 잡기 위해 CI에서 빌드한다. Storybook 빌드는 디자인 시스템 카탈로그와 앱 조립 스토리가 깨지지 않았는지 확인한다.

  ruleset의 필수 검사는 쓰지 않는다. GitHub가 병합을 막지 않으므로, 사람과 AI는 CI 통과를 확인한 뒤 병합한다. 글 동기화 PR은 CI를 돌리지 않고 `content-sync.yml`이 한 실행 안에서 병합한다([[배포 환경:CI]]).

  피그마 관련 CI(토큰·자산 생성 확인, 캡처 표, 모션 검사)는 2026-11-11에 지웠다. 피그마 쪽 확인은 흐름을 다시 정한 뒤에 필요한 것만 둔다([[피그마 흐름 논의]]).
Changesets: |
  배포할 앱의 버전을 Changesets로 관리한다. 배포 흐름은 [[배포 환경:배포(CD)]]에서 정한다.

  - 앱(`apps/web`, `apps/images`)이나 패키지(`packages/*`)를 바꾸는 PR은 `pnpm changeset`으로 만든 `.changeset/*.md`를 함께 넣는다. 바뀐 패키지마다 `patch`(고침), `minor`(새 기능), `major`(쓰는 방법이 바뀜) 중 하나를 고르고, 한 줄로 무엇이 바뀌었는지 적는다.
  - `packages/design-system`이 바뀌면 그것을 쓰는 `apps/web`의 버전도 함께 오른다(내부 의존 갱신, `patch`).
  - 문서(`.codocs`)나 루트 설정(`.github`, `package.json`, `scripts` 등)만 바꾼 PR에는 넣지 않는다. 앱이나 패키지 안의 문서(`*.md`)만 바꿔도 검사가 changeset을 요구하므로 넣는다.
  - 모든 패키지가 private이라 npm에 publish하지 않는다. 설정(`.changeset/config.json`)은 버전만 올리고 태그는 만들지 않는다(`privatePackages`).
  - `tools/*`(`figma-parity`, `figma-plugin`, `scenario-cases`)는 배포 대상이 아니라 버전 관리에서 뺀다(`ignore`).
  - CI(`ci.yml`)의 맨 앞 작업 `Changeset`이 `scripts/check-changeset.mjs`로 PR을 검사하고, 실패하면 뒤 작업을 시작하지 않는다([[Git 작업 규칙:CI]]). 스크립트는 경로 표를 두지 않고 `changeset status --since=origin/main`에 판단을 맡긴다. 새 앱이 생겨도 스크립트를 고치지 않기 위해서다. `changeset status`는 작업 공간 패키지(`ignore` 제외) 안의 파일이 바뀌었는데 새 changeset이 없으면 실패한다. 루트 파일과 `tools/*`만 바꾼 PR은 통과한다(2026-11-11 확인).
  - 검사에서 빼는 PR: 글 동기화 PR(`chore/notion-content-sync`, Changesets 없이 바로 배포한다), Renovate PR(`renovate/*`, changeset 없이 머지되고 다음 배포 때 함께 나간다), 버전 PR(`chore/release`). `main` push에서는 돌지 않는다. 글 동기화 PR과 버전 PR에서는 `ci.yml` 자체가 돌지 않지만, 스크립트에도 예외를 남긴다.
  - 버전 PR은 `changeset version`이 만든다. 버전 PR을 만들고 바뀐 앱만 배포하는 일은 공용 젠킨스가 한다([[배포 환경:배포(CD)]]).
  - 버전 PR 브랜치는 `chore/release` 하나로 고정한다. 브랜치 이름 형식(`종류/설명`)에 맞아 `Branch name` 검사에는 예외가 필요 없고, changeset 검사에서만 뺀다. 젠킨스가 이 브랜치를 강제로 덮어쓰므로 사람이 이 이름으로 작업하지 않는다. local-server가 쓰는 `changeset-release/main`은 이 형식에 맞지 않아 쓰지 않는다.
