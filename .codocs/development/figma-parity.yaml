_codocs:
  id: figma-parity
  name: 피그마 일치 검사
  parent:
    - 개발 컨벤션
개요: |
  디자인 시스템 컴포넌트가 피그마 디자인과 같은지 확인하는 방법이다.
  피그마가 디자인의 기준이라는 원칙을 지키고, 한번 맞춘 컴포넌트가 이후 변경으로 깨지지 않게 지킨다.

  확인은 두 층으로 나눈다.
  - 자동 판정: 피그마에서 설정한 값과 코드에서 설정한 값이 같은지 기계가 판정한다. 렌더링 결과가 아니라 입력값만, 피그마와 CSS의 뜻이 1:1인 속성만 비교한다. 허용 오차와 컴포넌트별 예외가 없다([[피그마 일치 검사:비교 규칙]]).
  - 사람 확인: 1:1로 옮길 수 없거나 빠짐없이 비교할 수 없는 것(크기 방식, 안쪽 선, 재질, 그림자, 줄바꿈 결과, 위치)은 판정하지 않고, 피그마와 코드를 같은 조건으로 캡처한 표를 PR 댓글로 남겨 사람이 본다([[피그마 일치 검사:캡처 표]]).

  그림을 기계로 비교하지 않는다. 두 렌더링 엔진의 차이 때문에 정상과 실수를 가를 기준을 세울 수 없었다. 시험하고 내려놓은 방법은 [[피그마 일치 검사:검토한 대안]]에, 쉬운 설명은 [[비교 원리]]에 있다.

  이름이 같으면 값도 같다는 것은 두 사슬이 보장한다.
  - 피그마의 시각 값은 모두 변수나 스타일에 연결한다. 연결 안 된 값은 플러그인이 내보내기를 막는다([[피그마 일치 검사:구조 검사]]).
  - 변수·스타일은 `figma/tokens.json`을 보고 사람이나 에이전트가 `src/tokens.css`에 옮겨 쓰고, CI가 이름과 값이 맞는지 비교한다([[피그마 일치 검사:토큰 작성]]). 아이콘·이미지는 피그마에서 내보낸 자산 파일에서 생성기가 코드 자산을 만들고, CI가 다시 생성해 차이가 없는지 확인한다([[피그마 일치 검사:자산]]).
흐름: |
  1. 피그마 정리: 컴포넌트를 [[디자인 기반]]의 규칙대로 만든다.
  2. 구조 검사와 내보내기: 플러그인이 컴포넌트를 검사하고, 통과하면 컴포넌트 하나마다 PR 하나를 연다. 토큰이 바뀌었으면 토큰 PR을 따로 연다([[피그마 일치 검사:피그마 플러그인]]).
  3. 작성과 구현: 사람이 AI에게 스킬로 PR 처리를 맡긴다([[피그마 일치 검사:스킬]]). `tokens.css`는 `tokens.json`과 피그마를 보고 고치고, 코드 자산은 자산 생성기로 만들고, 판정 실패 목록대로 컴포넌트 코드를 고친다. 자동으로 돌리지 않고 사람이 시점을 고른다.
  4. 판정: CI가 영향받는 컴포넌트만 자동 판정한다([[피그마 일치 검사:비교 범위]], [[피그마 일치 검사:CI 비교]]). 실패하면 실패 목록을 PR 댓글로 남긴다. 이 목록이 구현할 목록이다.
  5. 캡처 표: 판정이 통과하면 피그마와 코드를 같은 조건으로 캡처한 표를 PR 댓글로 남긴다([[피그마 일치 검사:캡처 표]]).
  6. 병합: 사람이 캡처 표를 보고 병합한다. `main`에 병합되면 영향받은 컴포넌트를 캡처해 `parity-captures` 브랜치에 저장한다. 다음 플러그인 PR 본문의 "현재 구현" 열이 이 캡처다.

  코드만 바꾼 PR(리팩터링 등)도 영향받는 컴포넌트가 있으면 같은 판정과 캡처 표를 받는다. 비교 기준은 저장소의 내보내기 자료다.

  피그마 쪽 변경은 항상 PR로만 들어오므로 정기적인 전체 비교는 두지 않는다.
  경우마다(컴포넌트만, 토큰만, 둘 다) PR이 어떻게 생기고 어떤 순서로 병합하는지는 [[피그마 일치 검사:경우별 흐름]]에 있다.
비교 규칙: |
  판정에 넣는 기준:
  - 렌더링 결과(요소의 실제 위치·크기, 글자 상자, 글리프 위치)가 아니라 입력값(피그마에서 설정한 값과 연결 이름, CSS에서 레이아웃 전에 확정한 선언·계산값)을 비교한다.
  - 피그마 속성과 CSS 속성의 뜻이 1:1이다. 둘 사이에 사람이 정한 번역 규칙이 필요하면 판정에 넣지 않는다.
  - 결과는 같음과 다름 둘뿐이다. 허용 오차와 컴포넌트별 예외를 두지 않는다.
  - 피그마에 값이 없으면 코드도 없어야 한다(칠이 없으면 `background-color`가 투명).

  비교 방식:
  - 이름: 피그마가 연결한 변수·스타일 이름과, 코드에서 그 속성을 정한(이긴) CSS 선언이 참조하는 `var(--…)` 이름이 같은지 본다. 선언은 CDP `CSS.getMatchedStylesForNode`로 읽는다. 클래스 이름은 비교하지 않는다. 그래서 같은 토큰을 어떤 유틸리티로 쓰든(`px-12`, `pl-12 pr-12`) 결과가 같으면 통과한다.
  - 값: 그 요소의 계산값이 피그마 값(`tokens.json`의 값을 CSS 형식으로 바꾼 것)과 같은지 본다. 기대값을 `tokens.css`의 변수에서 가져오지 않는다. `tokens.css`는 사람이 쓰는 파일이라, 거기서 기대값을 가져오면 틀린 값도 스스로 맞다고 판정하기 때문이다. 변수가 없는 속성(전환 시간 등)도 피그마 값과 직접 비교한다.
  - 일치: 문자열이나 파일을 그대로 비교한다.

  변수가 있는 속성은 이름과 값을 모두 본다. 값만 보면 값이 같은 다른 토큰을 쓴 실수(지금은 통과하지만 토큰 하나를 바꾸면 갈라짐)를 놓친다.

  판정하는 항목, 값 변환 방법, 판정하지 않는 항목과 이유는 [[피그마 일치 검사:판정 항목]] 한곳에 둔다. 그 목록에 없는 피그마 속성은 판정하지 않는다.
  판정하지 않는 것은 캡처 표에서 사람이 본다([[피그마 일치 검사:캡처 표]], [[한계:번역 규칙 영역의 사람 확인]]).

  상태(Hover, Pressed, Focused 등)는 [[피그마 일치 검사:스토리 규칙]]대로 실제 상호작용으로 재현한 상태에서 잰다.
판정 항목: |
  기계가 판정하는 항목의 전체 목록이다. 이 목록에 없는 피그마 속성과 CSS 속성은 판정하지 않는다.
  항목은 [[피그마 일치 검사:비교 규칙]]의 기준(렌더링 결과가 아닌 입력값, 피그마와 CSS의 뜻이 1:1)을 모두 만족하고, 값이 같다·이름이 같다·정해진 1:1 대응 중 하나로 빠짐없이 비교할 수 있을 때만 더한다. 일부만 확인할 수 있거나 다른 CSS 방법으로 같은 결과를 만들어 피해 갈 수 있으면 판정하지 않고 "판정하지 않는 것"에 이유와 함께 적는다(캡처 표에서 사람이 본다).

  비교 방식:
  - 이름: 피그마가 연결한 변수·스타일 이름 ↔ 그 CSS 속성을 정한(이긴) 선언이 참조하는 변수 이름. 이름은 [[피그마 일치 검사:토큰 작성]]의 이름 규칙으로 바꾼다.
  - 값: 피그마 값을 아래 "값 변환"으로 바꾼 것 ↔ 계산값.
  - 대응: 피그마 선택지 ↔ 같은 뜻의 CSS 값. 같은 뜻의 CSS 값이 여럿이면(`flex-start`와 `start`) 모두 적는다.
  - 일치: 문자열이나 파일이 같다.

  판정 순서(요소 하나의 속성 하나):
  1. 피그마 쪽: `export.json` 레이어의 칸(예: `fill.variable`)에서 변수·스타일 경로나 선택지를 읽는다. 변수면 `tokens.json`에서 별칭을 끝까지 따라가 값을 얻는다.
  2. 기대 이름: 경로를 이름 규칙으로 CSS 변수 이름 후보로 바꾼다(`accent-fill/default` → `--color-accent-fill-default`). 후보가 여럿인 변수가 있다(`font/line-height/body` → `--leading-body`, `--text-body--line-height`). 후보 중 하나에 닿으면 된다.
  3. 기대 값: 값을 아래 "값 변환"으로 CSS 계산값 모양으로 바꾼다(`#005fb8` → `rgb(0, 95, 184)`).
  4. 요소: [[피그마 일치 검사:짝짓기]]로 레이어와 짝지은 요소를 찾는다.
  5. 이름 읽기: CDP `CSS.getMatchedStylesForNode`로 그 요소에 맞는 규칙을 읽고, 아래 "이긴 선언 읽기"대로 이긴 선언과 변수 사슬을 본다.
  6. 값 읽기: 브라우저 `getComputedStyle(요소)`(의사 요소면 `getComputedStyle(요소, '::placeholder')`)의 그 속성 값을 읽는다.
  7. 결과: 비교 방식마다 아래 통과 조건을 모두 만족하면 통과, 하나라도 어긋나면 실패 줄을 남긴다.
     - 이름: 이긴 선언이 기대 이름 후보 중 하나에 닿는다.
     - 값: 계산값을 같은 모양으로 바꿔 기대 값과 같다.
     - 대응: 계산값이 같은 뜻의 CSS 값 목록에 있다.
     - 일치: 문자열이나 파일이 같다.

  실패 줄 형식:
  - 이름: `<레이어> <역할>: 피그마 <변수·스타일> → 코드 <이긴 선언 이름: 값>`(선언이 없으면 `선언 없음`)
  - 값·대응: `<레이어> <역할>: 피그마 <변수·스타일·선택지> → 코드 <속성> <계산값> (기대 <기대값>)`
  - 루트 레이어는 `(루트)`로 쓴다.

  이긴 선언 읽기:
  CDP `CSS.getMatchedStylesForNode`는 요소에 맞는 규칙을 우선순위가 낮은 것부터(레이어 순서, 선택자 우선순위, 소스 순서) 돌려주고 인라인 스타일을 마지막에 준다. 그 속성을 정할 수 있는 선언 가운데 마지막 것이 이긴 선언이다. `!important`는 쓰지 않으므로 따로 다루지 않는다.

  | 규칙 | 예 |
  |---|---|
  | 단축 속성과 논리 속성도 그 롱핸드를 정한다. 논리 속성은 왼쪽에서 오른쪽 가로 쓰기로 읽는다 | `px-12`가 만든 `padding-inline: var(--spacing-12)`는 `padding-left`와 `padding-right`를 정한다. `rounded-control`의 `border-radius: var(--radius-control)`은 네 모서리를 정한다 |
  | 값이 여럿인 단축 속성은 그 변·모서리의 값만 쓴다(1개: 모두, 2개: 위아래·좌우, 3개: 위·좌우·아래, 4개: 위·오른쪽·아래·왼쪽) | `padding: var(--spacing-6) var(--spacing-12)`에서 `padding-left`는 `var(--spacing-12)`, `padding-top`은 `var(--spacing-6)` |
  | 소스 범위가 없는 선언은 무시한다. CDP가 단축 속성을 펼쳐 덧붙인 롱핸드다 | `padding-inline: var(--spacing-12)`와 함께 오는 빈 `padding-inline-start`는 읽지 않고 `padding-inline`을 읽는다 |
  | 상속되는 속성(`color`, `font-family`, `font-size`, `font-weight`, `font-style`, `line-height`, `letter-spacing`, `text-align`)은 자기 선언이 없거나 값이 `inherit`·`unset`이면 가까운 조상부터 올라가며 이긴 선언을 찾는다 | `label` 요소에 글자 색 선언이 없고 루트 `<button class="text-text-on-accent-fill-primary">`에 있으면 루트의 `color: var(--color-text-on-accent-fill-primary)`가 이긴 선언이다 |
  | `::placeholder` 글자의 색(`color`)과 꾸밈(`text-decoration-line`)은 입력 요소 안의 브라우저 내부 placeholder 요소에서 읽는다. 크기·굵기·줄 높이·자간은 입력 요소 자신에서 읽는다 | SearchBox의 비어 있는 `<input>`은 `placeholder:text-text-fill-secondary`의 선언을 내부 placeholder 요소에서 읽는다 |
  | 변수 사슬은 기대 이름에 닿을 때까지 따라간다. 기대 이름 앞에는 Tailwind 내부 변수(`--tw-*`)만 거칠 수 있다. 기대 이름에 닿으면 그 정의는 따라가지 않는다 | 아래 표 |
  | 정의가 없는 변수는 `@property`의 `initial-value`, 그것도 없으면 `var()` 대체값으로 이어 간다. `@property`의 `inherits: false`인 변수는 조상의 정의를 보지 않는다 | `var(--tw-backdrop-blur,)`는 요소의 `--tw-backdrop-blur` 정의를 읽는다. 정의가 없고 `initial-value`도 없으면 빈 대체값이라 아무 이름에도 닿지 않는다 |

  변수 사슬 예(기대 이름 `--color-accent-fill-default`, Button `Style=Accent` 루트의 `background-color`):

  | 코드 | 이긴 선언과 사슬 | 결과 |
  |---|---|---|
  | `bg-accent-fill-default` | `background-color: var(--color-accent-fill-default)` → 기대 이름 | 통과(그 뒤 `--color-blue-dark-1`은 보지 않음) |
  | Flyout `backdrop-blur-surface-flyout-acrylic`(기대 `--backdrop-blur-surface-flyout-acrylic`) | `backdrop-filter: var(--tw-backdrop-blur,) …` → `--tw-backdrop-blur: blur(var(--backdrop-blur-surface-flyout-acrylic))` → 기대 이름 | 통과(`--tw-*`만 거침) |
  | `button { --color-my-button: var(--color-accent-fill-default); background-color: var(--color-my-button) }` | `background-color: var(--color-my-button)` → `--color-my-button`은 `--tw-*`도 기대 이름도 아님 | 실패(계산값은 같아도 이름 실패) |

  값 변환:
  판단이 아니라 단위 변환이다. 변환마다 방법은 하나다.

  | 피그마 값(`tokens.json`, `export.json`) | CSS 값 | 변환 | 예 |
  |---|---|---|---|
  | 색 `#RRGGBB`·`#RRGGBBAA` | `rgb()`·`rgba()`·`color(srgb …)` | 채널마다 16진수를 0–255 정수로. 투명도는 `AA`(없으면 `FF`)와 계산값 투명도 ×255의 반올림을 비교 | `#005fb8` → `rgb(0, 95, 184)` |
  | 완전히 투명한 색(투명도 0) | 투명도 0인 색 | 두 쪽 모두 투명도가 0이면 채널은 보지 않고 같다 | 칠 없음(`rgba(0, 0, 0, 0)`) ↔ `rgba(255, 255, 255, 0)` 같음 |
  | 길이 `{unit: px, value}` | px | 그대로. 부동소수 표현 차이만 없애도록 소수 셋째 자리에서 반올림 | `spacing/12` 12 → `12px` |
  | 불투명도 변수(0–100) | `opacity`(0–1) | ÷100 | `opacity/cut` 50 → `0.5` |
  | 자간 PERCENT·PIXELS | `letter-spacing`(px) | PERCENT는 글자 크기 × 값 ÷ 100, PIXELS는 그대로. 계산값 `normal`은 `0px`로 본다 | 글자 14px, 2% → `0.28px`. `0%` → `0px` ↔ 계산값 `normal` 같음 |
  | 줄 높이 PIXELS | `line-height`(px) | 그대로 | `font/line-height/body` 20 → `20px` |
  | 글자 굵기 | `font-weight` | 그대로 | `font/weight/regular` 400 → `400` |
  | 시간 `{unit: ms, value}` | `transition-duration` | 계산값(초) ×1000과 비교 | `motion/duration/faster` 83 → `0.083s` |
  | 이징 베지어 `[x1, y1, x2, y2]` | `transition-timing-function` | `cubic-bezier()` 네 값. 계산값이 CSS 이징 이름이면 그 베지어 값으로 바꾼다(`linear` = `0, 0, 1, 1`, `ease` = `0.25, 0.1, 0.25, 1`, `ease-in` = `0.42, 0, 1, 1`, `ease-out` = `0, 0, 0.58, 1`, `ease-in-out` = `0.42, 0, 0.58, 1`) | `motion/easing/fade` `[0, 0, 1, 1]` → `cubic-bezier(0, 0, 1, 1)`, 계산값 `linear`도 같음 |
  | 이징 이름(LINEAR, EASE_IN, EASE_OUT, EASE_IN_AND_OUT, *_BACK) | `transition-timing-function` | 피그마가 정한 베지어 값(대응표) | EASE_IN → `cubic-bezier(0.42, 0, 1, 1)` |
  | 회전(도, 반시계 양수, 90° 배수) | `rotate` + `transform` | 부호를 바꿔 시계 방향 양수로. 계산값 `rotate` 각도와 `transform` 행렬 각도(`atan2(b, a)`)를 더해 0–359로 맞춰 비교 | -90 → 90°. `rotate: 90deg` 또는 `matrix(0, 1, -1, 0, 0, 0)` |

  컴포넌트 판정(속성마다):
  아래 표가 비교 도구(`layer-checks.ts`, `page-checks.ts`, `parity-runner.ts`)가 보는 CSS 속성 전부다. 예는 이 저장소의 Button, MenuItem, Flyout, SearchBox 내보내기 값이고, 네 컴포넌트에 쓰는 곳이 없는 항목은 그렇게 적는다. "피그마" 열은 `export.json` 칸 → `tokens.json` 값이고, "읽는 곳"은 짝지은 요소다.

  색:

  | CSS 속성 | 피그마 | 비교 | 기대 이름·값 | 읽는 곳 | 예 |
  |---|---|---|---|---|---|
  | `background-color` | `fill.variable` → 색 값, 또는 `fill.style`(단색 칠 스타일) → 색 값 | 이름 + 값 | `--color-<경로>`(칠 스타일은 `--color-<스타일>`), `rgb()` | 레이어 요소 | Button Accent 루트 `accent-fill/default` → `#005fb8` → `--color-accent-fill-default`, `rgb(0, 95, 184)` |
  | `background-color` | `fill` 없음 | 값 | 투명 | 레이어 요소 | MenuItem 루트 칠 없음 → `rgba(0, 0, 0, 0)` |
  | `color`(글자) | 구간 `fill.variable` → 색 값 | 이름 + 값 | `--color-<경로>`, `rgb()` | 구간 글자를 직접 담은 요소(상속), placeholder면 의사 요소 | Button Accent `label` `text-on-accent-fill/primary` → `#ffffff` → `--color-text-on-accent-fill-primary`, `rgb(255, 255, 255)` |
  | `color`(자산) | 한 가지 색 자산 `asset.color` → 색 값 | 이름 + 값 | `--color-<경로>`, `rgb()` | 자산 요소(상속) | Button `icon` `text-on-accent-fill/primary` → `rgb(255, 255, 255)` |
  | `outline-color` | OUTSIDE `stroke.paint.variable` → 색 값 | 이름 + 값 | `--color-<경로>`, `rgba()` | 레이어 요소 | Button Focused 루트 `focus-stroke/outer` → `--color-focus-stroke-outer`, `rgba(0, 0, 0, 0.894)` |
  | `border-top-color`, `border-right-color`, `border-bottom-color`, `border-left-color` | 레이아웃에 포함한 INSIDE `stroke.paint.variable` → 색 값 | 이름 + 값(변마다) | `--color-<경로>`, `rgba()` | 레이어 요소 | Flyout 루트 `surface-stroke/flyout` → `--color-surface-stroke-flyout`, `rgba(0, 0, 0, 0.059)` |

  길이:

  | CSS 속성 | 피그마 | 비교 | 기대 이름·값 | 읽는 곳 | 예 |
  |---|---|---|---|---|---|
  | `width`, `height` | `sizing.horizontal`·`vertical`이 FIXED일 때 `sizing.width`·`height` 변수 → 길이 | 이름 + 값 | `--spacing-<size 뒤 경로>`, px | 레이어 요소 | Flyout 루트 `size/flyout/width` → `--spacing-flyout-width`, `320px`. MenuItem `base/leading` `size/icon/16` → `--spacing-icon-16`, `16px` |
  | `min-width`, `max-width`, `min-height`, `max-height` | `sizing.minWidth`·`maxWidth`·`minHeight`·`maxHeight` 변수 → 길이 | 이름 + 값 | `--spacing-<size 뒤 경로>`, px | 레이어 요소 | Button 루트 `size/button/min-width` → `--spacing-button-min-width`, `120px` |
  | `padding-top`, `padding-right`, `padding-bottom`, `padding-left` | `layout.padding.top`·`right`·`bottom`·`left` 변수 → 길이 | 이름 + 값(변마다) | `--spacing-<경로>`, px | 레이어 요소 | Button 루트 `padding-left` `spacing/12` → `--spacing-12`, `12px`. `padding-top` `spacing/6` → `--spacing-6`, `6px` |
  | `column-gap`, `row-gap` | `layout.gap`(HORIZONTAL이면 `column-gap`, VERTICAL이면 `row-gap`), `layout.counterGap`(반대 축) 변수 → 길이 | 이름 + 값 | `--spacing-<경로>`, px | 레이어 요소 | MenuItem `base` `spacing/12` → `column-gap` `--spacing-12`, `12px` |
  | `border-top-left-radius`, `border-top-right-radius`, `border-bottom-right-radius`, `border-bottom-left-radius` | `radius.topLeft`·`topRight`·`bottomRight`·`bottomLeft` 변수 → 길이 | 이름 + 값(모서리마다) | `--radius-<경로>`, px | 레이어 요소(원 ELLIPSE는 보지 않음) | Button 루트 `radius/control` → `--radius-control`, `4px` |
  | 같은 네 모서리 | 반경 변수 없음 | 값 | `0px` | 레이어 요소 | MenuItem 루트 → `0px` |
  | `outline-width` | OUTSIDE `stroke.weight` 변수(네 변이 같아야 한다) → 길이 | 이름 + 값 | `--border-width-<경로>`·`--outline-width-<경로>`, px | 레이어 요소 | Button Focused 루트 `stroke-width/focus-outer` → `--outline-width-focus-outer`, `2px` |
  | `outline-offset` | OUTSIDE 선 | 값 | `0px` | 레이어 요소 | Button Focused 루트 → `0px` |
  | `border-top-width`, `border-right-width`, `border-bottom-width`, `border-left-width` | 레이아웃에 포함한 INSIDE `stroke.weight.top`·`right`·`bottom`·`left` 변수 → 길이 | 이름 + 값(변마다) | `--border-width-<경로>`, px | 레이어 요소 | Flyout 루트 `stroke-width/default` → `--border-width-default`, `1px` |
  | 같은 네 변 | 레이아웃에 포함한 INSIDE 선이 아님(선 없음, OUTSIDE, 포함하지 않은 INSIDE, CENTER) | 값 | `0px` | 레이어 요소 | Button 루트(포함하지 않은 INSIDE 선) → `0px` |

  선 모양, 효과, 불투명도, 회전, 자르기:

  | CSS 속성 | 피그마 | 비교 | 기대 | 읽는 곳 | 예 |
  |---|---|---|---|---|---|
  | `outline-style` | OUTSIDE 선 있음 / 없음 | 대응 | `solid` / `none` | 레이어 요소 | Button Focused 루트 → `solid`, Rest 루트 → `none` |
  | `border-top-style`, `border-right-style`, `border-bottom-style`, `border-left-style` | 레이아웃에 포함한 INSIDE 선 | 대응(변마다) | `solid` | 레이어 요소 | Flyout 루트 → `solid` |
  | `background-image` | `fill.style`이 그라데이션 칠 스타일 | 이름 | `--gradient-<스타일>` | 레이어 요소 | 네 컴포넌트에 쓰는 곳 없음. `Elevation/Control Border`를 칠로 쓰면 `--gradient-elevation-control-border` |
  | `background-image` | `fill` 없음 | 대응 | `none` | 레이어 요소 | MenuItem 루트 → `none` |
  | `backdrop-filter` | `effect` 스타일에 배경 흐림이 있음 | 이름 | `--backdrop-blur-<스타일>` | 레이어 요소 | Flyout 루트 `Surface/Flyout (Acrylic)` → `--backdrop-blur-surface-flyout-acrylic` |
  | `backdrop-filter` | `effect` 없음, 또는 배경 흐림이 없는 효과 스타일 | 대응 | `none` | 레이어 요소 | Button 루트 → `none` |
  | `opacity` | `opacity` 변수 → 0–100 숫자 | 이름 + 값 | `--opacity-<경로>`, ÷100 | 레이어 요소 | 네 컴포넌트에 쓰는 곳 없음. `opacity/cut` 50 → `--opacity-cut`, `0.5` |
  | `opacity` | `opacity` 없음 | 값 | `1` | 레이어 요소 | Button 루트 → `1` |
  | `rotate`·`transform`(함께) | `rotation`(0 또는 90° 배수, 없으면 0) | 값(각도) | 부호를 바꾼 각도 | 레이어 요소 | 아래 예 9. Button 루트 0° → `none`, `none` → 0° |
  | `overflow-x` | 자동 배치 레이어의 `clipsContent` 켬 / 끔 | 대응 | `hidden`·`clip` / `visible` | 레이어 요소 | Button 루트 끔 → `visible` |

  자동 배치(자동 배치 레이어만):

  | CSS 속성 | 피그마 | 비교 | 기대 | 예 |
  |---|---|---|---|---|
  | `display` | `layout.mode` HORIZONTAL·VERTICAL | 대응 | `flex`·`inline-flex` | Button 루트 → `inline-flex` 통과 |
  | `flex-direction` | `layout.mode` HORIZONTAL / VERTICAL | 대응 | `row` / `column` | Button 루트 HORIZONTAL → `row` |
  | `justify-content` | `layout.primaryAlign` MIN / CENTER / MAX / SPACE_BETWEEN | 대응 | `normal`·`flex-start`·`start` / `center` / `flex-end`·`end` / `space-between` | Button 루트 CENTER → `center` |
  | `align-items` | `layout.counterAlign` MIN / CENTER / MAX / BASELINE | 대응 | `flex-start`·`start` / `center` / `flex-end`·`end` / `baseline` | Button 루트 CENTER → `center` |
  | `flex-wrap` | `layout.wrap` WRAP / NO_WRAP | 대응 | `wrap` / `nowrap` | Button 루트 NO_WRAP → `nowrap` |

  글자:

  | 확인 | 피그마 | 비교 | 기대 | 읽는 곳 | 예 |
  |---|---|---|---|---|---|
  | `text-align` | `text.alignHorizontal` LEFT / CENTER / RIGHT / JUSTIFIED | 대응 | `start`·`left` / `center` / `right` / `justify` | 글자 레이어 요소(상속) | Button `label` LEFT → `start` |
  | `font-size` | 구간 `style.fontSize.variable` → 길이 | 이름 + 값 | `--text-<경로>`, px | 구간 글자를 담은 요소(상속) | `font/size/body` 14 → `--text-body`, `14px` |
  | `font-weight` | 구간 `style.fontWeight.variable` → 숫자 | 이름 + 값 | `--font-weight-<경로>`, 숫자 | 같음 | `font/weight/regular` 400 → `--font-weight-regular`, `400` |
  | `line-height` | 구간 `style.lineHeight.variable` → 길이 | 이름 + 값 | `--leading-<경로>`·`--text-<경로>--line-height`, px | 같음 | `font/line-height/body` 20 → `--leading-body`, `20px` |
  | `letter-spacing` | 구간 `style.letterSpacing.variable` → 길이 | 이름 + 값 | `--tracking-<경로>`, px | 같음 | 쓰는 곳 없음 |
  | `letter-spacing` | 구간 `style.letterSpacing.value`(%·px) | 값 | %는 글자 크기 × 값 ÷ 100 | 같음 | Button `label` `0%` → `0px`, 계산값 `normal` 통과 |
  | `color` | 구간 `fill.variable` | 이름 + 값 | 위 색 표 | 같음 | 위 색 표 |
  | `text-decoration-line` | 구간 `textDecoration` NONE / UNDERLINE / STRIKETHROUGH | 대응 | `none` / `underline` / `line-through` | 같음(placeholder면 의사 요소) | Button `label` NONE → `none` |
  | 글자 내용 | `text.characters` | 일치 | 같은 문자열 | 요소의 `textContent`, 입력 요소는 값(비었으면 `placeholder`) | Button `label` `버튼` |
  | 서체 | 구간 `fontFamily` | 일치 | 글자마다 그 구간의 서체 | 글자를 하나씩 임시로 감싼 요소의 CDP `CSS.getPlatformFontsForNode`. 공백 문자는 뺀다. 서체가 하나이고, 소문자·공백 제거 후 피그마 이름으로 시작해야 한다(`Pretendard SemiBold` ↔ `Pretendard` 통과) | `버`·`튼` → `Pretendard` |

  구간을 담은 요소: 글자 레이어 요소 안의 텍스트 노드를 앞에서부터 읽어, 구간 범위의 글자를 직접 담은 요소(텍스트 노드의 부모)마다 위 항목을 본다. 입력 요소는 요소 자신이다.

  상태 전환(도착 변형에서, [[피그마 일치 검사:상태 전환]]):

  | 확인 | 피그마 | 비교 | 기대 | 읽는 곳 | 예 |
  |---|---|---|---|---|---|
  | `transition-property` | 출발·도착 변형에서 바뀌는 역할(칠, 글자 색, 자산 색, 불투명도, 모서리 반경, 여백, 간격, 줄 간격, 너비, 높이, 바깥 선 색, 바깥 선 두께)의 CSS 속성 | 대응 | 목록에 그 속성, `all`, 또는 그 속성을 담는 단축 이름(`padding`, `border-radius`, `gap`, `outline`, `background`)이 있고 같은 자리의 시간이 `0s`가 아님 | 레이어 요소. 글자 색은 루트까지 조상도 | SearchBox Pill Rest → Focused에서 바뀌는 속성마다 |
  | `transition-duration` | 전환 `duration`(ms, 모션 변수 경로면 `tokens.json` 값) | 값 | 같은 ms | 위에서 찾은 요소의 같은 자리 | `motion/duration/fast` 167 → `0.167s` |
  | `transition-timing-function` | 전환 `easing` 베지어(모션 변수 경로면 `tokens.json` 값, 스프링이면 보지 않음) | 값 | 같은 네 값 | 같음 | `motion/easing/direct-entrance` `[0, 0, 0, 1]` → `cubic-bezier(0, 0, 0, 1)` |

  레이어와 자산:

  | 확인 | 피그마 | 비교 | 기대 | 읽는 곳 | 예 |
  |---|---|---|---|---|---|
  | 루트 | 컴포넌트 이름 | 일치 | `data-figma-root="<컴포넌트 이름>"` 요소가 하나 | 문서 | `data-figma-root="Button"` 하나 |
  | 레이어 | `layers[].path` | 일치 | 루트 안에서 `data-figma="<경로>"` 요소가 하나 | 루트 안(슬롯 안쪽 제외) | `label` 요소 하나 |
  | 피그마에 없는 표시 | `layers`·`hidden`에 없는 경로 | 일치 | 그 `data-figma` 요소가 없음 | 같음 | `data-figma="badge"`가 있으면 실패 |
  | 숨긴 레이어 | `hidden[]` | 일치 | 그 요소가 없거나 보이지 않음(`checkVisibility`와 상자 수) | 같음 | Button 기본 경우의 `icon` |
  | 자산 | `asset.file` | 일치 | 요소의 `data-asset`이 같은 파일 경로 | 자산 레이어 요소 | `icons/ic_fluent_add_20_regular.svg` |
  | 표시 없는 요소 | — | 이름 | 디자인 토큰 이름에 닿는 클래스 선언이 없음([[피그마 일치 검사:짝짓기]]) | 표시 없는 요소 | `<span class="bg-accent-fill-default">` 실패 |

  팝업 배치(`Placement` ↔ 팝업 요소의 `data-side`·`data-align`)는 [[피그마 일치 검사:팝업]]에서 정한 대응이지만, 비교 도구는 아직 보지 않는다.

  토큰 값 비교(`tokens.css`의 `@theme`, 토큰마다):

  | 토큰(`tokens.json` `$type`) | CSS 이름 | 비교 | 변환·조건 | 예 |
  |---|---|---|---|---|
  | 별칭(값이 `{경로}`인 모든 변수) | 이름 규칙 | 일치 | 값이 정확히 `var(<가리키는 변수 이름>)` | `accent-fill/default` = `{color.blue.dark-1}` → `--color-accent-fill-default: var(--color-blue-dark-1)` |
  | `color` | `--color-*` 등 | 값 | `tokens.css` 값의 `var()`를 `@theme` 안에서 끝까지 풀고 색 변환으로 비교 | `color/blue/dark-1` `#005fb8` → `--color-blue-dark-1: #005fb8` |
  | `dimension`(간격, 크기, 반경, 선 두께, 흐림, 글자 크기, 줄 높이, 자간) | `--spacing-*`, `--radius-*`, `--border-width-*`, `--blur-*`, `--text-*`, `--leading-*`, `--tracking-*` | 값 | px | `radius/control` 4 → `--radius-control: 4px` |
  | `number`(불투명도) | `--opacity-*` | 값 | ÷100, `tokens.css`의 `%`는 ÷100으로 읽음 | `opacity/cut` 50 → `--opacity-cut: 50%` |
  | `number`(그 밖) | `--motion-*` 등 | 값 | 그대로 | `motion/scale/window-enter` 0.96 → `0.96` |
  | `fontWeight` | `--font-weight-*` | 값 | 그대로 | `font/weight/regular` 400 → `400` |
  | `fontFamily` | `--font-*` | 일치 | 첫 서체 이름(따옴표 제외) | `font/family/korean` `Pretendard` → `--font-korean: "Pretendard", …` |
  | `duration` | `--motion-*` | 값 | ms(`tokens.css`는 ms나 s) | `motion/duration/faster` 83 → `83ms` |
  | `cubicBezier` | `--motion-*` | 값 | `cubic-bezier()` 네 값 | `motion/easing/fade` → `cubic-bezier(0, 0, 1, 1)` |
  | 덧붙는 이름(줄 높이 `--text-*--line-height`, 시간 `--transition-duration-*`, 이징 `--ease-*`, 선 두께 `--outline-width-*`) | 이름 규칙 | 일치 | 값이 정확히 `var(<변수 자신의 이름>)` | `--text-body--line-height: var(--leading-body)` |
  | 칠 스타일 `color`(단색) | `--color-<스타일>` | 값, 별칭이면 일치 | 색 변환 | — |
  | 칠 스타일 `gradient` | `--gradient-<스타일>` | 있는지만 | — | `--gradient-elevation-accent-control-border` |
  | 칠 스타일(재질, 층 여럿) | `@utility <스타일>` | 있는지만 | — | `@utility material-acrylic-default` |
  | 효과 스타일 `shadow` | `--shadow-<스타일>`·`--text-shadow-*`, 배경 흐림 `--backdrop-blur-<스타일>`, 레이어 흐림 `--blur-<스타일>` | 있는지만 | — | `--backdrop-blur-surface-flyout-acrylic` |
  | 글자 스타일 `typography` | `@utility type-<스타일>` | 있는지만 | 한글 스타일은 짝인 라틴 스타일의 유틸리티 | `@utility type-body` |
  | 양쪽 비교 | — | 일치 | `tokens.json`에만 있거나 `@theme`에만 있는 이름은 실패 | `--color-my-blue: #0000ff;` 실패 |

  비교 예시:
  비교 방식마다 하나씩, 피그마가 내보낸 것 → 비교 도구가 만든 기대 → 코드 → 브라우저에서 읽은 것 순서로 보인다. 예는 Button `Style=Accent, State=Rest`와 Flyout `Material=Acrylic` 변형이다.

  예 1. 칠 색 — 이름 + 값

  피그마가 내보낸 것:
  - `export.json` 루트 레이어: `"fill": { "variable": "accent-fill/default" }`
  - `tokens.json`: `accent-fill/default` = `{color.blue.dark-1}` = `#005fb8`

  비교 도구가 만든 기대:
  - 이름: `--color-accent-fill-default`(이름 규칙)
  - 값: `rgb(0, 95, 184)`(값 변환)

  코드: `<button className="bg-accent-fill-default …">`

  | 확인 | 기대 | 브라우저에서 읽은 것 | 결과 |
  |---|---|---|---|
  | 이름 | `--color-accent-fill-default` | `background-color`를 정한 선언 `var(--color-accent-fill-default)` | 통과 |
  | 값 | `rgb(0, 95, 184)` | 계산값 `rgb(0, 95, 184)` | 통과 |

  실패하는 경우:

  | 코드가 이렇다면 | 브라우저에서 읽은 것 | 결과 |
  |---|---|---|
  | 이웃 상태의 색 `bg-accent-fill-secondary`를 씀 | 선언 `var(--color-accent-fill-secondary)`, 계산값 `rgba(0, 95, 184, 0.898)` | 이름과 값이 달라 실패 |
  | `tokens.css`에 `--color-blue-dark-1: #005fb9`로 잘못 씀 | 선언은 맞고 계산값 `rgb(0, 95, 185)` | 값이 달라 실패 |
  | 전역 CSS가 `button { background: white }`로 덮음 | 이긴 선언이 `background: white` | 이름이 달라 실패 |
  | `--color-my-button: var(--color-accent-fill-default)`를 거쳐 씀 | 선언 `var(--color-my-button)`, 계산값 `rgb(0, 95, 184)` | `--tw-*`가 아닌 변수를 거쳐 이름 실패 |

  PR 댓글의 실패 줄(이웃 상태의 색):
  - `(루트) 채우기: 피그마 accent-fill/default → 코드 background-color: var(--color-accent-fill-secondary)`
  - `(루트) 채우기: 피그마 accent-fill/default → 코드 background-color rgba(0, 95, 184, 0.898) (기대 rgb(0, 95, 184))`

  예 2. 배경 흐림 — 이름

  피그마가 내보낸 것: Flyout `export.json` 루트 레이어 `"effect": "Surface/Flyout (Acrylic)"`. 이 효과 스타일에는 그림자와 배경 흐림이 있다.

  비교 도구가 만든 기대: `backdrop-filter` 선언이 `--backdrop-blur-surface-flyout-acrylic`에 닿는다. 그림자는 판정하지 않는다.

  코드: `<div className="shadow-surface-flyout-acrylic backdrop-blur-surface-flyout-acrylic …">`

  | 확인 | 기대 | 브라우저에서 읽은 것 | 결과 |
  |---|---|---|---|
  | 흐림 이름 | `--backdrop-blur-surface-flyout-acrylic` | 선언 `backdrop-filter: var(--tw-backdrop-blur,) …`, `--tw-backdrop-blur: blur(var(--backdrop-blur-surface-flyout-acrylic))` | 통과 |
  | 흐림 값, 그림자 | 보지 않음 | — | 캡처 표에서 사람이 봄 |

  실패하는 경우: 다른 흐림 `backdrop-blur-material-mica`를 씀 → 선언이 `--backdrop-blur-material-mica`에 닿아 실패(`(루트) 효과(배경 흐림): 피그마 Surface/Flyout (Acrylic) → 코드 backdrop-filter: blur(var(--backdrop-blur-material-mica))`). 흐림 클래스를 빼먹음 → 이긴 선언이 없어(`선언 없음`) 실패. 효과가 없는 Button에 흐림 클래스를 씀 → 계산값이 `none`이 아니라 실패.

  예 3. 전환 — 값(변수 없음)

  피그마가 내보낸 것: `export.json` `Rest` 변형 `"transitions": [{ "to": "style=accent,state=hover", "duration": 83, "easing": [0, 0, 1, 1] }]`. Rest와 Hover 레이어를 비교하면 루트의 칠이 바뀐다.

  비교 도구가 만든 기대(도착 변형 Hover에서, 마우스를 올린 뒤):
  - `transition-property`에 `background-color`(칠 → `background-color`)
  - `transition-duration` 83ms
  - `transition-timing-function` `cubic-bezier(0, 0, 1, 1)`

  코드: `transition-colors duration-faster ease-fade`

  | 확인 | 기대 | 브라우저에서 읽은 것 | 결과 |
  |---|---|---|---|
  | 전환 속성 | `background-color` 포함 | `color, background-color, …` | 통과 |
  | 시간 | 83ms | `0.083s` → 83ms | 통과 |
  | 이징 | `cubic-bezier(0, 0, 1, 1)` | `cubic-bezier(0, 0, 1, 1)` | 통과 |

  실패하는 경우: `duration-fast`를 씀 → `0.167s`라 실패. 전환 클래스를 빼먹음 → `transition-property: all`, `transition-duration: 0s`라 실패.

  예 4. 자동 배치 정렬 — 대응

  피그마가 내보낸 것: `export.json` 루트 `"layout": { "mode": "HORIZONTAL", "primaryAlign": "CENTER", "counterAlign": "CENTER" }`

  비교 도구가 만든 기대(대응표): `display`가 `flex`나 `inline-flex`, `flex-direction: row`, `justify-content: center`, `align-items: center`

  코드: `inline-flex items-center justify-center`

  | 확인 | 기대 | 브라우저에서 읽은 것 | 결과 |
  |---|---|---|---|
  | 자동 배치 | `flex`·`inline-flex`, `row` | `inline-flex`, `row` | 통과 |
  | 주축 정렬 | `center` | `center` | 통과 |
  | 교차축 정렬 | `center` | `center` | 통과 |

  실패하는 경우: `items-start`를 씀 → `align-items: flex-start`라 실패. `flex-col`을 씀 → `column`이라 실패.
  같은 뜻의 값은 모두 인정한다. 주축 정렬이 MIN이면 `normal`, `flex-start`, `start` 중 무엇이든 통과한다.

  예 5. 글자 — 일치

  피그마가 내보낸 것: `export.json` `label` 레이어 `"text": { "characters": "버튼", 구간: [{ 서체 "Pretendard" }] }`

  코드: `<span data-figma="label" className="type-body">{children}</span>`, 스토리는 `children: '버튼'`

  | 확인 | 기대 | 브라우저에서 읽은 것 | 결과 |
  |---|---|---|---|
  | 내용 | `버튼` | `textContent` `버튼` | 통과 |
  | 서체 | `버`·`튼` 모두 `Pretendard` | CDP로 읽은 실제 서체 `Pretendard`, `Pretendard` | 통과 |

  실패하는 경우: 스토리가 `'버튼 '`(뒤에 공백)을 넘김 → 내용이 달라 실패. 웹 폰트를 받지 못해 시스템 서체로 그림 → 실제 서체가 `Apple SD Gothic Neo` 등이라 실패.

  예 6. 레이어와 숨김 — 일치

  피그마가 내보낸 것: `Rest` 변형 `"layers"`에 `""`(루트), `"label"`, `"hidden": ["icon"]`(`Show icon` 기본값 false). `cases`의 `showIcon=true` 경우에는 `"icon"`이 보이는 레이어다.

  | 경우 | 기대 | 브라우저에서 읽은 것 | 결과 |
  |---|---|---|---|
  | 기본 | `data-figma="label"` 요소 하나, `icon` 요소는 보이지 않음 | `label` 하나, `icon` 없음 | 통과 |
  | `showIcon=true` | `label`, `icon` 요소가 하나씩 | 둘 다 하나씩 | 통과 |

  실패하는 경우: 아이콘을 항상 그림 → 기본 경우에 숨긴 레이어 `icon`이 보여 실패. `data-figma="label"`을 빼먹음 → `label`의 짝이 없어 실패. 피그마에 없는 배경을 `data-figma` 없는 요소에 줌(`<span class="bg-accent-fill-default">`) → 표시 없이 토큰을 쓴 요소라 실패.

  예 7. 자산 — 일치

  피그마가 내보낸 것: `showIcon=true` 경우의 `icon` 레이어 `"asset": { "file": "icons/ic_fluent_add_20_regular.svg" }`, 파일 `figma/assets/icons/ic_fluent_add_20_regular.svg`

  | 확인 | 기대 | 읽은 것 | 결과 |
  |---|---|---|---|
  | 어느 자산인가 | `icons/ic_fluent_add_20_regular.svg` | 요소의 `data-asset` 같은 값 | 통과 |
  | 파일이 같은가 | `figma/assets/`에서 다시 만든 결과 | `src/assets/`의 바이트 | 같으면 통과(`generate:assets --check`) |

  실패하는 경우: `ic_fluent_open_20_regular.svg`를 씀 → `data-asset`이 달라 실패. `src/assets/`의 SVG를 손으로 고침 → 다시 만든 결과와 바이트가 달라 실패.

  예 8. 토큰 값 비교 — `tokens.css`

  | `tokens.json` | 기대 | `tokens.css`에 쓴 것 | 결과 |
  |---|---|---|---|
  | `radius/control` = 4px | `--radius-control` 값 `4px` | `--radius-control: 4px;` | 통과 |
  | `radius/control` = 4px | 같음 | `--radius-control: 3px;` | 값이 달라 실패 |
  | `accent-fill/default` = `{color.blue.dark-1}` | `--color-accent-fill-default`가 `--color-blue-dark-1`을 가리킴 | `var(--color-blue-dark-1)` | 통과 |
  | 같음 | 같음 | `#005fb8`(값으로 풀어 씀) | 가리키는 이름이 없어 실패 |
  | `opacity/cut` = 50 | 값 `0.5` | `--opacity-cut: 50%;` | 통과 |
  | 효과 스타일 `Surface/Flyout (Acrylic)` | `--shadow-surface-flyout-acrylic`, `--backdrop-blur-surface-flyout-acrylic`이 있음 | 있음(값은 보지 않음) | 통과 |
  | 없음 | — | `--color-my-blue: #0000ff;` | `tokens.json`에 없는 토큰이라 실패 |

  예 9. 회전 — 값(각도)

  피그마가 내보낸 것: 레이어 `"rotation": -90`(피그마는 반시계 방향이 양수라 시계 방향 90° 회전이다)

  비교 도구가 만든 기대: 시계 방향 90°. 계산값 `rotate` 각도와 `transform` 행렬 각도를 더한 값이 90°(0–359로 맞춤)

  | 코드 | 브라우저에서 읽은 것(`rotate`, `transform`) | 결과 |
  |---|---|---|
  | `rotate-90` | `rotate: 90deg`, `transform: none` → 90° | 통과 |
  | `transform: rotate(90deg)` | `rotate: none`, `transform: matrix(0, 1, -1, 0, 0, 0)` → 90° | 통과 |
  | `-rotate-90` | `rotate: -90deg` → 270° | 실패 |
  | 회전 클래스를 빼먹음 | `none`, `none` → 0° | 실패 |

  피그마 회전이 0인 레이어도 확인한다. 피그마는 0°인데 코드에 `rotate-90`을 붙이면 `rotate: 90deg` → 90°라 실패한다.

  판정하지 않는 것:

  | 항목 | 이유 |
  |---|---|
  | 크기 방식 HUG·FILL, 자기 정렬 STRETCH | CSS에 같은 개념이 없어 여러 선언을 조합해 흉내 내야 한다 |
  | 레이아웃에 포함하지 않은 안쪽 선, 가운데 선 | CSS에 레이아웃을 차지하지 않는 안쪽 선이 없다. `::before` 고리는 구현 방식의 선택이다 |
  | 원(ELLIPSE) | `border-radius: 50%`와 완전히 둥근 모서리 중 무엇으로 그릴지가 선택이다 |
  | 그림자(`box-shadow`) | Tailwind `shadow-*` 유틸리티는 그림자 값을 펼쳐 써서 선언에 토큰 이름이 남지 않는다. 값으로만 판정하면 변수가 있는 속성은 이름과 값을 함께 본다는 규칙의 예외가 된다 |
  | 그라데이션·배경 흐림의 값과 모습 | 정지점 섞는 방식과 흐림 계산이 엔진마다 다르다. 이름만 판정한다 |
  | 재질 칠 스타일 | 층을 어떻게 겹칠지가 선택이다([[디자인 기반:재질 효과]]) |
  | 블렌드 모드 | 이름은 같아도 섞이는 대상(쌓임 맥락)이 달라 결과가 다르다 |
  | 줄 높이 AUTO, 글자 자동 크기, 말줄임, 최대 줄 수, 줄바꿈 결과 | 서체 측정에 따른 렌더링 결과다 |
  | 절대 위치(위치 방식, 붙는 변, 거리) | 어느 변에 붙는지는 `transform` 같은 다른 방법으로도 표현할 수 있어 완전히 판정할 수 없다. 거리는 부모 크기에서 나오는 측정값이다 |
  | 팝업의 실제 위치, FIXED가 아닌 너비·높이 | 위치·크기 측정값이다 |
  | 스프링 이징, 키프레임 애니메이션, 움직임 중간 모습 | CSS 전환에 같은 값이 없거나 엔진마다 다르게 그린다([[한계:애니메이션 비교 범위]]) |
  | 판정하지 않는 역할의 상태 전환(안쪽 선 색, 자산 바꿈, 배치 선택지 등) | 위 표의 판정 항목이 아니다 |
짝짓기: |
  피그마 레이어와 코드 요소를 짝짓는 규칙이다. 이긴 선언과 계산값은 짝지은 요소에서 읽는다.

  - 코드 요소에 `data-figma="<레이어 경로>"`를 단다. 레이어 경로는 export.json의 `path`이고 보통 레이어 이름 그대로다(`label`, `icon`, `bottom border`). 형제끼리 이름이 겹치면 경로가 모호해지므로 내보내기를 막는다([[피그마 일치 검사:구조 검사]]).
  - 변형 루트는 비교 요소다([[피그마 일치 검사:스토리 규칙]]). 비교 요소가 감싸는 요소이고 피그마 루트가 그 안에 있으면(예: 메뉴 팝업 안의 MenuItem 행) 루트 요소에 `data-figma-root`를 단다.
  - 다음은 실패다.
    - 피그마 레이어에 짝 요소가 없다.
    - 같은 레이어 경로를 단 요소가 둘 이상이다.
    - `data-figma`가 없는 요소에 걸린 클래스 선언 중 하나라도 디자인 토큰 이름에 닿는다(다른 선언에 덮여 화면에 보이지 않아도 실패). 글자 안 구간 요소, 자산 안쪽, 슬롯 내용은 뺀다. 피그마에 없는 모양을 코드가 그리는 경우를 잡는다.
      - 읽는 법: 요소 자신에게 맞는 규칙 가운데 출처가 일반 스타일시트이고 선택자에 클래스(`.`)가 있는 규칙의 선언을 모두 보고, `var()` 사슬을 끝까지 따라가 닿는 이름에 디자인 토큰의 CSS 이름(변수, 칠 스타일, 효과 스타일)이 있는지 본다.
      - 예: Button 루트 안에 `<span class="bg-accent-fill-default bg-transparent">`를 넣으면 화면의 배경은 투명이지만 `.bg-accent-fill-default`의 `background-color: var(--color-accent-fill-default)`가 토큰에 닿아 실패한다. 실패 줄은 `(루트) 표시 없는 요소: 피그마 data-figma 표시 → 코드 <span class="bg-accent-fill-default bg-transparent"> background-color: var(--color-accent-fill-default)`이다.
      - 통과하는 예: 글자 레이어 `label` 안의 `<strong class="type-body-strong">`(글자 안 구간 요소), `data-asset` 요소 안의 SVG 요소(자산 안쪽).
  - 칠·선·효과가 없는 레이어(배치만 하는 구조용 프레임)는 짝 요소가 없어도 된다. 다만 그 자리의 코드 요소가 여백·간격 같은 토큰 클래스를 쓰면 위 규칙대로 표시가 있어야 한다.
  - 레이어는 실제 요소로 그린다. `::before`·`::after`에는 `data-figma`를 달 수 없기 때문이다(예: SearchBox `bottom border`는 `<span>`이다). `@utility`가 안에서 의사 요소를 쓰는 것(`border-gradient-*`, `inner-border-*`)은 레이어가 아니라 그 요소의 선이라 괜찮다.
  - 글자 구간을 나누는 안쪽 요소(`<strong>` 등)에는 표시가 필요 없다([[피그마 일치 검사:글자]]).
스토리 규칙: |
  피그마 변형 하나를 Storybook 스토리와 args 하나로 짝짓는 규칙이다. 비교 도구는 이 규칙대로 스토리를 찾고, 맞지 않으면 실패한다.

  - 컴포넌트마다 `src/components/<컴포넌트>/<컴포넌트>.stories.tsx`에 이름이 `Parity`인 스토리를 하나 둔다. 변형마다 스토리를 만들지 않고 args로 변형을 고른다. 변형이 늘어도 스토리 파일을 고칠 일이 적게 하기 위해서다.
  - 피그마 변형 속성 이름은 camelCase arg 이름이 된다(`Style` → `style`). 값은 변형 파일 이름과 같은 규칙으로 정규화한 문자열이다(`Accent` → `accent`, `Chrome more (Mobile)` → `chrome-more-mobile`). `True`·`False`는 boolean이다.
  - BOOLEAN 컴포넌트 속성은 prop 이름 그대로 arg가 된다(`Show icon` → `showIcon`, [[피그마 일치 검사:숨김 레이어]]). export.json `cases`에 있는 경우(예: `showIcon=true`)도 같은 스토리에 args로 넘겨 비교한다.
  - Storybook은 argTypes `options`에 없는 URL args를 조용히 버린다. 그래서 도구는 렌더링 뒤 스토리에 실제로 적용된 args를 확인하고, 다르면 실패한다. `Parity` 스토리의 argTypes `options`에는 피그마 변형 값을 모두 넣는다.
  - 스토리의 글자는 피그마 예시 글자를 그대로 쓴다([[피그마 일치 검사:글자]]).
  - 상태 속성(`State`)도 args로 넘긴다. `Hover`·`Pressed`·`Focus`(`Hovered`·`Active`·`Focused`·`Focus visible`도 같다)는 컴포넌트에 강제로 상태를 주는 prop을 만들지 않고, 도구가 실제 마우스·키보드로 재현한다. Hover는 요소 가운데로 마우스를 옮기고, Pressed는 그 위에서 마우스 버튼을 누른 채 재고, Focus는 Tab 키로 포커스를 옮긴다(`:focus-visible`이 나오게). 실제 사용자가 보는 상태와 같은 코드 경로를 비교하기 위해서다.
  - `Rest`·`Disabled`·`Selected` 같은 나머지 상태는 args로만 재현한다. 스토리가 `state` arg를 `disabled` 같은 prop으로 옮긴다. 상호작용으로 재현하는 상태 값을 받으면 Rest와 같게 그린다.
  - 비교 요소는 `#storybook-root`의 첫 요소다. 포털로 그리는 컴포넌트나 감싸는 요소가 필요한 스토리는 비교할 요소에 `data-parity-target`을 단다.
글자: |
  글자 레이어는 내용, 구간별 서식, 실제 서체, 글자 스타일 변수를 비교한다.

  - 내용: 정확히 같아야 한다. 스토리는 피그마의 예시 글자(TEXT 컴포넌트 속성의 기본값 포함)를 그대로 쓴다. 문구가 다르면 줄바꿈과 말줄임이 달라져 같은 컴포넌트라고 말할 수 없기 때문이다.
  - 구간: 피그마는 글자 노드를 서식이 같은 연속 범위(`getStyledTextSegments`)로 나눠 내보낸다. 코드는 `data-figma` 요소 안의 글자를 앞에서부터 읽어 같은 토큰 클래스끼리 묶은 구간을 만들고, 두 구간 목록을 순서대로 비교한다. 안쪽 `<strong>` 같은 요소에는 표시가 필요 없다.
  - 서체: 글자 스타일 이름(`Body`, `Hangul/Body`)은 대응시키지 않는다. 글자마다 실제로 그린 서체를 비교한다. 피그마는 구간의 서체 이름(`fontName.family`)을, 브라우저는 테스트 중 글자를 하나씩 임시로 감싼 뒤 Chromium DevTools 프로토콜(CDP) `CSS.getPlatformFontsForNode`로 읽는다. 순서대로 같아야 하고, 공백 문자(유니코드 공백)는 모양이 없어 서체 비교에서 뺀다.
  - 크기·굵기·자간·줄 높이: 구간의 글자 스타일에 연결된 변수를, 그 요소의 `font-size`·`font-weight`·`letter-spacing`·`line-height`를 정한 선언의 변수 이름과 계산값으로 비교한다. 코드가 `type-*` 유틸리티로 쓰든 각각 쓰든 결과가 같으면 통과한다. `Body`와 `Hangul/Body`가 같은 변수에 연결되어 있으면 둘 다 `type-body`로 통과한다. 줄 높이가 AUTO면 서체 측정값이라 판정하지 않는다.
  - 코드는 `type-*` 하나로 쓰고 한글·영문을 span으로 쪼개지 않는다. 브라우저가 [[디자인 기반:서체]]의 서체 목록에서 글자마다 서체를 고르므로 피그마에서 구간을 나눈 결과와 같아지고, 서체 비교가 이것을 확인한다.
  - 웹 폰트를 모두 받을 때까지(`document.fonts.ready`) 기다리고, 받지 못했으면 실패한다.
숨김 레이어: |
  숨긴(visible=false) 레이어는 네 가지로 나눈다.

  | 종류 | 예 | 처리 |
  |---|---|---|
  | (a) BOOLEAN 컴포넌트 속성으로 켜고 끄는 레이어 | Button `Show icon`, MenuItem `Show shortcut`, BreadcrumbItem `Show separator`, ListGroup `Show header` | 정상이다. 아래처럼 속성을 바꾼 경우도 함께 비교한다 |
  | (b) 변형에 따라 보이고 안 보이는 레이어 | 없음 | 각 변형을 있는 그대로 비교한다. 새로 만들지 않는다(아래 원칙) |
  | (c) 모든 변형에서 숨겼고 속성도 없는 레이어 | 없음 | 쓰이지 않는 레이어라 막는다("지우세요") |
  | (d) 속성 없이 숨겼는데 파일의 인스턴스에서 손으로 켜서 쓰는 레이어 | 없음 | 막는다("컴포넌트 속성으로 연결하세요") |

  원칙(H4): 상태 때문에 안 보이는 것을 그려 놓고 숨기지 않는다.
  - 상태에 따라 있고 없는 것은 그 상태의 변형에만 그린다. 예: ColumnHeader 정렬 화살표는 `Sort=Ascending`·`Descending`에만 있고 `Sort=None`에는 없다. TaskbarPreview 닫기 버튼은 `State=Hover`에만 있다. SearchBox `bottom border`는 `Focused`·`Disabled`에만 있다.
  - 쓰는 곳이 켜고 끄는 것은 BOOLEAN 속성으로 연다(a). 예: `Show separator`, `Show close`, `Show subtitle`.
  - 어디서도 쓰지 않는 것은 지운다.
  - 칠 없이 자리만 차지해야 하는 것은 숨긴 레이어나 투명 아이콘이 아니라 칠 없는 빈 프레임으로 둔다. 예: NavigationItem `Expand=None`의 `chevron space`(16×16, `size/icon/16`). 코드는 빈 `<span>`이다.

  - 피그마 속성 이름과 React prop 이름을 맞춘다. 속성 키의 `#id`를 떼고 camelCase로 쓴다(`Show icon` → `showIcon`).
  - BOOLEAN 속성의 기본값은 컴포넌트 세트 전체가 하나를 쓴다. 변형마다 기본값을 다르게 둘 수 없다(예: BreadcrumbItem `Show separator`는 `Current=True`에서도 기본값 true다. 마지막 항목은 쓰는 곳이 false를 넘긴다).
  - 플러그인은 변형마다 BOOLEAN 속성을 하나씩 기본값과 반대로 바꾼 임시 인스턴스를 만들어 읽고, 그 레이어 정보를 export.json `cases`에 함께 넣는다. 임시 인스턴스는 읽은 뒤 지운다. 스토리도 같은 경우를 args로 두어 비교한다.
  - 어느 경우든 그 변형(또는 경우)에서 숨긴 레이어의 `data-figma` 요소가 화면에 보이면 실패다. 숨긴 레이어 경로는 export.json `hidden`에 있다.
  - 피그마 Components 페이지에는 사람이 볼 수 있게 속성을 켠 예시 인스턴스를 컴포넌트 세트 옆에 둔다.

  피그마 한계: 숨긴 노드는 자동 배치 자식이어도 크기 방식(`layoutSizing`)이 FIXED로 읽힌다(보이게 하면 HUG로 읽힌다). 그래서 플러그인은 숨긴 노드를 먼저 걸러 크기 검사 같은 구조 검사에 넣지 않는다. 처음 피그마를 정리할 때 숨긴 단축키 글자를 고정 크기로 잘못 보고 크기 변수를 만들었다가 되돌린 일이 있었다.
자산: |
  CSS로 그릴 수 없는 모양과 이미지는 Foundations의 이름 있는 자산 컴포넌트로 두고, 컴포넌트 안에서는 그 인스턴스를 쓴다. 묶음과 원본 위치는 [[디자인 기반:자산]]에서 정한다.

  | 묶음 | 내보내는 파일 | 코드 | 비교 |
  |---|---|---|---|
  | Icons, Shapes(한 가지 색) | SVG. id를 내용 기반 이름으로 바꾸고 색을 `currentColor`로 바꾼다 | 자산 이름 + 글자 색 | 파일 사슬 + 글자 색(이름 + 값) |
  | Illustrations(여러 색) | SVG. id만 바꾼다 | 자산 이름 | 파일 사슬 |
  | Images(래스터) | 이미지 칠 하나면 원본 바이트, 아니면 PNG(배율 1) | 자산 이름 | 파일 사슬 |

  자산은 픽셀로 비교하지 않는다. 피그마와 브라우저는 같은 SVG도 다르게 그리기 때문이다. 대신 두 고리로 100% 일치를 보장한다.
  1. 피그마와 코드 파일: CI가 `generate:assets --check`로 `figma/assets/`에서 다시 만들어 보고, `src/assets/`와 바이트가 다르면 실패한다.
  2. 컴포넌트와 파일: 요소의 `data-asset`이 피그마 레이어가 가리키는 자산 파일과 같아야 한다.
  크기와 색은 [[피그마 일치 검사:판정 항목]]대로 따로 본다.

  - 묶음은 원본 컴포넌트가 든 묶음 프레임(`group/<묶음>`)의 이름으로 정한다.
  - 플러그인은 내보내는 컴포넌트가 쓰는 자산을 `figma/assets/<묶음>/<자산>.<svg|png>`로 함께 내보낸다. SVG 안의 id는 내용으로 정해지는 이름으로 바꿔, 같은 모양이면 파일도 같게 한다.
  - 코드의 자산 파일(아이콘 SVG, 아크릴 노이즈 같은 이미지)은 손으로 복사하지 않고 이 파일에서 생성기가 만든다. 모양은 이 생성 사슬로 보장하므로 화면에서 모양을 비교하지 않는다. 아이콘 패키지(`@fluentui/react-icons`)를 따로 쓰지 않는 것도 이 때문이다. 피그마가 아이콘을 줄여 쓰거나 경로를 바꾸면 패키지 아이콘과 달라진다.
  - 여러 색 자산(Illustrations)의 SVG는 그라데이션(`linearGradient`, `radialGradient`)을 그대로 옮긴다. `Asset` 컴포넌트는 그라데이션 ID 앞에 요소마다 다른 접두어를 붙인다. 한 화면에 같은 자산이 둘 있어도 ID가 겹치지 않게 하기 위해서다(예: 검색 포커스 돋보기 `illustrations/icon-color-search.svg`).
  - 이미지는 이미지 해시로 자산 이름을 찾는다. 컴포넌트나 칠 스타일이 이름 있는 자산에 없는 이미지를 쓰면 막는다.
  - 컴포넌트 안에 자산이 아닌 호·별·다각형·선·불리언·벡터를 직접 그리면 막는다("Foundations 자산으로 만들어 인스턴스로 쓰세요"). 완전한 원과 사각형은 CSS(`rounded-*`)로 그리므로 허용한다.
겹쳐 놓기: |
  요소를 다른 요소 위에 겹쳐 놓는 경우를 넷으로 나눈다.

  1. 장식: 포커스 테두리처럼 컴포넌트 모양에 딸린 장식은 겹쳐 놓은 레이어로 그리지 않고 그 레이어의 선이나 효과 스타일로 표현한다. 버튼 포커스는 바깥쪽 선 한 겹이다([[디자인 기반:포커스 표현]]).
  2. 실행 중에 정해지는 값: 창과 바탕화면 아이콘의 위치, 선택 상자(SelectionMarquee)의 위치와 크기, 스크롤바 막대의 위치와 길이는 컴포넌트 비교 대상이 아니다. 앱 코드가 실행 중에 정한다. 컴포넌트 원본에는 기본값만 크기 변수로 두고(예: `size/scrollbar/thumb-length`, `size/selection-marquee/width`), Screens의 인스턴스는 그 값을 덮어써도 된다. 스크롤바 막대 길이는 Screens에서도 덮어쓰지 않는다.
  3. 진짜 겹침(배지, 검색창 밑줄 등): 자동 배치 안의 절대 위치(ABSOLUTE) 자식만 허용한다.
     - 절대 위치(위치 방식, 붙는 변, 거리)는 판정하지 않고 캡처 표에서 본다([[피그마 일치 검사:판정 항목]]). 어느 변에 붙는지는 `transform` 같은 다른 방법으로도 표현할 수 있어 완전히 판정할 수 없고, 거리는 피그마가 부모 크기에서 계산하는 값이다.
     - 피그마에서는 제약(constraints)으로 붙는 변을 정한다. 왼쪽·위(MIN), 오른쪽·아래(MAX), 양쪽 늘이기(STRETCH), 가운데(CENTER)를 쓰고, 비례(SCALE)는 막는다. 플러그인은 거리 값으로 토큰 이름을 찾지 않고, 거리 값을 막지도 않는다.
     - 양쪽 늘이기 축의 크기는 제약에서 나오는 크기라 고정 크기 변수 검사([[디자인 기반:크기 변수]])에서 뺀다. 피그마는 이 크기를 FIXED로 읽으므로, 플러그인이 제약 값으로 기계적으로 판단한다.
     - 예: SearchBox `bottom border`는 절대 위치이고, 제약은 가로 양쪽 늘이기와 세로 아래, 거리 0이다. 높이와 색은 변수에 연결한다. 루트는 내용 자르기를 켜 둥근 끝에서 밑줄이 일자로 잘린다. 코드는 `<span data-figma="bottom border" class="absolute inset-x-0 bottom-0 h-… bg-…">`와 루트 `overflow-hidden`이다.
  4. 트리거에 붙는 팝업: 메뉴·툴팁·플라이아웃처럼 버튼 옆에 뜨는 것은 좌표가 아니라 [[피그마 일치 검사:팝업]]의 배치 이름으로 판정하고, 실제 위치와 간격은 캡처 표에서 본다.

  자동 배치가 아닌 프레임 안에 자식을 두는 수동 배치는 막는다([[디자인 기반:레이아웃]]).
팝업: |
  트리거(버튼, 메뉴 항목, 입력창)와 그 옆에 뜨는 팝업(메뉴, 툴팁, 플라이아웃)은 `Popover` 컴포넌트 하나로 묶는다(H2). 팝업 위치를 좌표로 재지 않고 이름으로 비교하기 위해서다.

  - `Popover`는 `Trigger` 슬롯, `Popup` 슬롯, `Placement` 변형, `State=Closed`·`Open` 변형을 가진다. `Closed`는 트리거만 보인다.
  - `Placement`는 팝업이 트리거의 어느 쪽(side)에 어느 끝을 맞춰(align) 붙는지다. 지금 쓰는 값은 `Bottom-Start`, `Bottom-Center`, `Bottom-End`, `Top-Center`, `Top-End`, `Right-Start`이고, 필요할 때 더한다.
  - 트리거와 팝업 사이 간격은 `spacing/4` 하나로 통일한다(툴팁 포함).
  - 열린 팝업은 원래 떠 있는 요소라 `Popover` 안의 절대 위치 자식으로 둔다. 그래서 트리거를 담은 부모의 크기와 배치가 팝업 때문에 바뀌지 않는다.
  - `Placement` 변형 이름 ↔ 팝업 요소의 `data-side`·`data-align` 값을 대응으로 판정한다(`Bottom-Start` → `bottom`, `start`). 간격과 실제 위치는 캡처 표에서 본다([[피그마 일치 검사:판정 항목]]).
  - 인스턴스에서 팝업 위치를 덮어쓰면 플러그인이 막는다. 덮어썼는지는 인스턴스와 원본의 팝업 위치를 대조해 기계가 정한다. 위치를 바꾸려면 `Placement`를 바꾼다. 이름과 실제 모습이 어긋나지 않아야 `Placement` 판정을 믿을 수 있기 때문이다.
  - 트리거를 가진 부모 컴포넌트(예: StartMenuFooter의 PowerButton)는 닫힌 상태를 기본으로 두고, 열린 모습이 필요한 화면은 부모 안의 트리거 인스턴스를 바로 `Open`으로 바꾼다. 열린 Popover를 화면 위에 따로 겹쳐 놓지 않는다.
  - 팝업을 여는 트리거는 열려 있는 동안 `State=Open`이다([[컴포넌트 목록:상태]]).

  적용한 곳: Start 보기 메뉴, 탐색기 정렬 메뉴, Chrome ⋮ 메뉴(데스크톱·모바일), 작업 표시줄 점프 목록과 툴팁, 최대화 버튼의 스냅 레이아웃, 이름 바꾸기 오류 툴팁, 우클릭 메뉴의 하위 메뉴, Start 전원 메뉴(PowerButton, `Top-End`).

  지금 피그마의 `Popover Open`은 팝업을 자동 배치 안에 두고, Screens는 열린 Popover를 닫힌 부모 위에 겹쳐 놓았다. 절대 위치로 바꾸고 겹쳐 놓은 중복을 지우는 일, 플러그인의 위치 덮어쓰기 검사와 비교 도구의 `side`·`align` 대응은 아직 하지 않았다.
슬롯 내용: |
  컴포넌트 안에서 채운 슬롯의 내용은 채운 쪽(부모 컴포넌트)의 레이어로 보고 검사하고 비교한다(H1).
  예: ListGroup을 쓰는 StartMenu에서 `items` 슬롯에 넣은 ListItem, TileGrid `tiles` 슬롯에 넣은 PinnedTile은 StartMenu의 레이어로 구조 검사와 비교를 받는다. 슬롯을 쓰는 컴포넌트를 만들어도 그 안이 검사에서 빠지지 않게 하기 위해서다.

  - 슬롯을 가진 컴포넌트 자체(ListGroup 등)는 기본 내용을 비교하지 않는다. 기본 내용은 자리를 보여 주는 예시다.
  - Screens에서 채우는 슬롯(창의 앱 내용, Chrome 페이지, 탐색기 항목 등)은 지금처럼 비교 대상이 아니다. 화면 단위 검증은 [[미결 사항:화면 단위 시각 검증]]에 있다.

  지금 플러그인 내보내기·구조 검사와 비교 도구는 슬롯 안을 건너뛴다. 이 규칙대로 고치는 일은 묶음 작업보다 먼저 한다([[구현 순서:6단계 디자인 시스템 코드화]]). 고치면 슬롯 안에 숨어 있던 위반이 다시 드러난다.
아이콘 자리: |
  컴포넌트 안에서 쓰는 곳마다 바꿔 끼우는 아이콘은 INSTANCE_SWAP 속성으로 연다(H3).

  - 레이어 이름은 자리 이름이다(`icon`, `leading icon`, `item icon`, `app icon`, `favicon`, `chevron`, `location icon`, `preview icon` 등). 아이콘을 바꿔 끼워도 레이어 이름은 바뀐 자산 이름(`file/Folder` 등)이 아니라 자리 이름으로 둔다. 레이어 경로가 [[피그마 일치 검사:짝짓기]]의 `data-figma` 값이기 때문이다.
  - 버튼·창 버튼처럼 같은 컴포넌트를 여럿 담는 자리도 역할 이름을 쓴다(`minimize button`, `maximize button`, `close button`).
  - 속성 이름은 BOOLEAN처럼 `#id`를 떼고 camelCase로 코드 prop 이름이 된다(`Icon` → `icon`, `Close icon` → `closeIcon`, `Location icon` → `locationIcon`, `Chevron` → `chevron`).
  - 속성의 선호값(preferred values)에 그 자리에 쓸 수 있는 자산을 넣어 둔다.
  - 비교는 [[피그마 일치 검사:자산]]대로 자산 이름과 색 클래스로 한다.
  - 바꿔 끼운 아이콘의 크기 변수 연결은 피그마가 원본에서 물려주지 않는 경우가 있다([[한계:피그마 API 덮어쓰기 함정]]).
상태 전환: |
  피그마 변형 사이의 프로토타입 전환(Rest → Hover 등)을 코드의 CSS 전환과 값으로 비교한다(M1).

  - 플러그인은 같은 컴포넌트 세트의 다른 변형으로 바뀌는(CHANGE_TO) 반응만 읽고, 전환 시간과 이징 값을 그대로 내보낸다. 피그마 반응은 변수에 연결할 수 없어 이름으로 비교할 수 없기 때문이다. 값으로 모션 토큰 이름을 짐작하지 않는다.
    - Smart Animate·Dissolve가 아닌 전환 종류는 CSS 전환으로 옮길 수 없어 막는다.
    - 즉시 전환은 움직임이 없어 비교하지 않는다.
  - 비교 도구는 출발 변형과 도착 변형의 레이어를 비교해 바뀌는 역할을 찾고, 역할 → CSS 속성 표(`transitionProperties`)로 전환할 속성을 정한다. 표에는 1:1인 역할(칠 → `background-color`, 글자 색 → `color`, 불투명도 → `opacity` 등)만 넣는다. 그다음 짝 요소에서 다음을 확인한다.
    - `transition-property`에 그 속성이 있다.
    - `transition-duration`이 피그마 전환 시간과 같다.
    - `transition-timing-function`이 피그마 이징과 같다(이징 이름은 `cubic-bezier` 값으로 바꿔 비교한다).
  - 도착 상태에서 잰다. CSS는 바뀐 뒤 상태의 transition 값을 쓰기 때문이다. 글자 색은 상속되므로 조상 요소의 전환도 인정한다.
  - 1:1이 아닌 역할(안쪽 선, 자산 바꿈, 배치 선택지, 글자 스타일 등)은 표에 제외로 적고 판정하지 않는다. 표에 없는 역할이 바뀌면 실패한다.
  - 코드는 모션 토큰 클래스(`duration-fast`, `ease-direct-entrance`)를 쓴다. 판정은 값으로 하므로, 값이 같은 다른 모션 토큰을 써도 통과한다.

  비교하지 않는 움직임은 [[한계:애니메이션 비교 범위]]에 있다.
구조 검사: |
  플러그인은 내보내기 전에 변형마다 구조를 검사하고, 위반이 하나라도 있으면 그 컴포넌트를 내보내지 않는다. 코드와 같은 이름으로 비교할 수 없는 구조를 디자인 단계에서 고치게 하기 위해서다.

  막는 것:
  - 변수·스타일에 연결되지 않은 시각 값(칠, 선, 선 두께, 반경, 여백, 간격, 고정 크기, 불투명도, 글자 스타일). 효과는 효과 스타일로 묶어야 하고, 그라데이션·이미지 칠은 칠 스타일로만 쓴다. 칠 스타일 안의 층 색(재질 칠 스타일의 층 포함)도 색 변수에 연결되어 있어야 한다.
  - 수동 배치, GRID 자동 배치, 그룹, 자식 쌓임 순서 뒤집기([[디자인 기반:레이아웃]])
  - 슬롯(SLOT)에 넣은 칠·선·효과. 슬롯은 빈 자리다([[디자인 기반:레이아웃]]).
  - 비례 제약([[피그마 일치 검사:겹쳐 놓기]])
  - 90° 배수가 아닌 회전, 뒤집기·기울이기 변환([[디자인 기반:회전]])
  - 자산이 아닌 호·별·다각형·선·불리언·벡터, 이름 있는 자산에 없는 이미지([[피그마 일치 검사:자산]])
  - 쓰이지 않는 숨김 레이어, 속성 없이 인스턴스에서 켜는 레이어, 숨긴 칠·선·효과([[피그마 일치 검사:숨김 레이어]])
  - 투명한 부분 뒤에도 표시하는 그림자([[디자인 기반:그림자]]), CSS로 그릴 수 없는 효과(노이즈, 텍스처, 점진 블러 등), 블렌드가 들어간 효과
  - 점선, 가변 두께·브러시 선, 벡터가 아닌 노드의 MITER가 아닌 선 꺾임, 모서리 스무딩
  - 마스크, 노드에 따로 지정한 변수 모드, 섞인 칠
  - 글자: 글꼴 누락(대체 글꼴로 그려짐), 글자 스타일 없는 구간, 기본이 아닌 밑줄 모양, OpenType 기능, 부호·목록 걸기, 줄 수 없는 말줄임
  - 형제끼리 겹치는 레이어 이름, 빈 이름([[피그마 일치 검사:짝짓기]])
  - 인스턴스에서 덮어쓴 팝업 위치([[피그마 일치 검사:팝업]])
  - 분류표에 없는 속성이나 값([[피그마 일치 검사:전수성]])

  전체 목록과 각 이유는 분류표(`tools/figma-plugin/src/rules/figma-properties.json`)와 구조 검사 코드가 가진다.

  알림(막지 않음): 파일에서 사용처가 0인 변수·스타일을 알려 준다. 화면 비교와 관계없는 정리 알림이라 내보내기를 막지 않는다.

  메시지 원칙:
  - 위반마다 위치(컴포넌트 / 변형 / 레이어 경로), 이유, 고칠 방법을 쓴다. 디자이너가 메시지만 보고 피그마에서 고칠 수 있어야 한다.
  - 결정 사항에서 나온 규칙이면 이유에 그 번호를 붙인다(예: `(D1)`, [[피그마 일치 검사:결정 사항]]).
  - 한 컴포넌트의 위반은 모두 한 번에 보여 준다. 하나 고치고 다시 내보내기를 반복하지 않게 하기 위해서다.
전수성: |
  피그마 속성을 하나도 빠뜨리지 않고 다루는지 테스트로 지킨다. 빠진 속성은 비교도 막기도 하지 않아, 피그마와 코드가 달라도 아무도 모르게 되기 때문이다.

  - 분류표(`tools/figma-plugin/src/rules/figma-properties.json`)는 플러그인 타입 정의(`@figma/plugin-typings`)의 화면 노드 속성을 모두 담는다. 처음 분류할 때(1.142.0) 시각 속성은 171개였고, 각각 변수, 스타일, 선택지, 자산, 막음, 결정 사항 중 하나로 나눴다. 나머지는 시각과 관계없는 속성이다.
  - 분류표는 값 단위까지 나눈다(예: 칠 종류 SOLID는 변수, 그라데이션은 스타일, 동영상은 막음). 분류표에 없는 속성이나 값을 만나면 구조 검사가 막는다.
  - 시각 속성마다 구조 검사·내보내기 코드의 어디서 다루는지 적어 둔다(`property-handling.ts`). 분류만 하고 코드가 다루지 않는 일을 막기 위해서다.
  - 타입 정의 버전을 올리면 테스트가 분류표의 기록 버전과 다르다는 것과 분류되지 않은 새 속성·값을 찾아 실패한다. 새 항목을 분류하고 다루는 곳을 적어야 통과한다.
비교할 수 없으면 실패: |
  알림만 남기고 통과하는 경우는 없다. "확인하지 못함"이 "같음"처럼 보이면 검사를 믿을 수 없기 때문이다.

  - 플러그인: 분류되지 않은 값이나 이름으로 표현할 수 없는 구조는 막는다([[피그마 일치 검사:구조 검사]]).
  - 비교 도구: 짝 요소를 찾지 못하거나, 대응표에 없는 이름이거나, 계산값을 읽지 못하거나, 웹 폰트를 받지 못했거나, 내보내기 자료가 계약과 다르면 그 변형을 실패로 남긴다.
  - 재질 효과 변형도 건너뛰지 않고 다른 변형과 같이 이름으로 비교한다([[디자인 기반:재질 효과]]).

  사용처가 0인 변수·스타일 알림은 비교가 아니라 피그마 파일 정리 알림이라 이 원칙과 관계없다.

  캡처 표([[피그마 일치 검사:캡처 표]])는 판정이 아니라 사람이 보는 자료라 이 원칙과 관계없다. 판정하지 않는 항목([[피그마 일치 검사:판정 항목]])은 "확인하지 못함"이 아니라 "사람이 확인함"으로 다룬다.
결정 사항: |
  피그마 표현 가운데 어떻게 다룰지 사람이 정한 것들이다. 값은 `packages/design-system/scripts/parity/rules/decisions.ts` 한곳에 두고 플러그인 구조 검사와 비교 도구가 함께 읽는다. 결정이 바뀌면 그 파일만 고친다. 번호는 코드 주석과 위반 메시지가 같이 쓴다.

  | 번호 | 결정 | 규칙 |
  |---|---|---|
  | D1 | 겹쳐 놓기: 장식은 선·효과로, 실행 중 위치는 비교 밖, 진짜 겹침은 자동 배치 안 절대 위치만, 수동 배치는 막음 | [[피그마 일치 검사:겹쳐 놓기]] |
  | D2 | 한글 글자 스타일: 스타일 이름 대신 실제 서체와 글자 서식 속성별 이름·값으로 비교 | [[피그마 일치 검사:글자]] |
  | D3 | 글자 내용은 정확히 비교, 스토리는 피그마 예시 글자 | [[피그마 일치 검사:글자]] |
  | D4 | 숨김 레이어 네 종류 | [[피그마 일치 검사:숨김 레이어]] |
  | D5 | 그림자 투명 영역 뒤 표시 끔 | [[디자인 기반:그림자]] |
  | D6 | 그릴 수 없는 모양과 이미지는 자산 | [[피그마 일치 검사:자산]] |
  | D7 | GRID 자동 배치 막음 | [[디자인 기반:레이아웃]] |
  | D8 | 고정 크기는 크기 변수 | [[디자인 기반:크기 변수]] |
  | D9 | 회전은 90° 배수만 | [[디자인 기반:회전]] |
  | F1 | 버튼 포커스는 바깥쪽 선 한 겹(D1의 장식 표현을 고침) | [[디자인 기반:포커스 표현]] |
  | F2 | 검색창 밑줄은 진짜 겹침, 양쪽 늘이기 크기는 D8에서 뺌 | [[피그마 일치 검사:겹쳐 놓기]] |
  | G1 | 슬롯은 빈 자리(칠·선·효과 막음) | [[디자인 기반:레이아웃]] |
  | G2 | 사용처 0인 변수·스타일은 알림(막지 않음) | [[피그마 일치 검사:구조 검사]] |
  | G3 | FocusRect 컴포넌트를 지우고 IconButton도 바깥쪽 선 | [[디자인 기반:포커스 표현]] |
  | G4 | 이미지는 이름 있는 이미지 자산만, 코드 이미지는 생성 | [[피그마 일치 검사:자산]] |
  | M1 | 변형 사이 전환은 전환 시간·이징 값과 전환 속성으로 비교 | [[피그마 일치 검사:상태 전환]] |
  | H1 | 컴포넌트 안에서 채운 슬롯 내용은 부모의 레이어로 검사·비교 | [[피그마 일치 검사:슬롯 내용]] |
  | H2 | 팝업은 절대 위치, Placement 이름과 간격 토큰으로 비교, 인스턴스 위치 덮어쓰기 막음 | [[피그마 일치 검사:팝업]] |
  | H3 | 아이콘 자리는 INSTANCE_SWAP 속성, 레이어 이름은 자리 이름 | [[피그마 일치 검사:아이콘 자리]] |
  | H4 | 상태 때문에 안 보이는 것은 변형이나 BOOLEAN 속성으로(D4를 고침) | [[피그마 일치 검사:숨김 레이어]] |

  H1~H4는 아직 `decisions.ts`와 플러그인·비교 도구에 넣지 않았다. 묶음 작업에서 넣는다([[구현 순서:6단계 디자인 시스템 코드화]]).
피그마 플러그인: |
  비공개 개발용 플러그인으로 만들고 `tools/figma-plugin`에 둔다([[저장소 구성:구성]]).

  - 검사·내보내기 핵심(`src/core`)은 피그마 API만 쓰고 GitHub와 UI를 모른다. 플러그인 UI와 피그마 MCP(`use_figma`)가 같은 핵심을 쓰고, MCP에서는 핵심을 스크립트 하나로 묶어 실행한다. AI 작업 세션이 피그마를 고친 뒤 플러그인으로 내보낼 때와 같은 검사 결과를 바로 볼 수 있게 하기 위해서다.
  - 내보내기 전에 구조 검사를 한다([[피그마 일치 검사:구조 검사]]). 위반이 있는 컴포넌트는 파일을 만들지 않는다.
  - 컴포넌트마다 레이어 정보(export.json), 변형 PNG, 그 컴포넌트가 쓰는 자산을 내보낸다. 형식은 [[피그마 일치 검사:export.json 계약]]에서 정한다. 변형 PNG는 사람이 PR에서 바뀐 디자인을 보는 자료이고 판정에는 쓰지 않는다.
  - BOOLEAN 속성 경우를 읽을 때만 임시 인스턴스를 만들고 끝나면 반드시 지운다. 피그마 파일에 남는 변경은 없다.
  - Variables를 읽어 토큰 JSON으로 내보낸다. Figma REST API의 Variables 엔드포인트는 Enterprise 플랜 전용이지만, 플러그인 API는 플랜과 상관없이 Variables를 읽을 수 있다.
  - 토큰 JSON은 W3C 디자인 토큰 형식(DTCG)으로 쓴다. 토큰마다 `$value`와 `$type`을 두고, 다른 토큰을 가리키는 값은 `{color.gray.f9f9f9}`처럼 경로로 남긴다. 피그마 공식 예제 플러그인과 커뮤니티 내보내기 플러그인 대부분이 쓰는 형식이다.
  - 글자 스타일과 효과 스타일(재질, 그림자)은 Variables가 아니라 스타일이라 따로 읽어 같은 파일에 넣는다. 피그마 기본 내보내기 기능은 이런 묶음 토큰을 아직 다루지 못하고, 손으로 실행해야 해 자동화에도 맞지 않는다.
  - 컴포넌트마다 이름 정보 해시를 계산하고, 커밋할 브랜치의 그 컴포넌트 폴더와 비교해 해시가 바뀐 변형의 PNG와 export.json만 커밋한다. PNG는 사람이 보는 이미지이고, 피그마가 내보낼 때마다 바이트가 조금씩 달라져 해시에 넣지 않는다. 사라진 변형의 파일은 그 컴포넌트 폴더에서만 지운다.
  - 플러그인은 사용자가 실행했을 때만 동작하므로, 피그마 작업을 마치면 내보내기를 직접 실행한다.
  - 컴포넌트 하나마다 PR 하나를 연다. 여러 컴포넌트를 골라 내보내면 PR도 그 수만큼 생긴다. 브랜치 이름은 컴포넌트마다 고정(`feat/figma-<컴포넌트>`)이고, 같은 컴포넌트를 다시 내보내면 열린 PR의 브랜치에 이어서 커밋한다. 열린 PR이 없으면 `main`에서 새로 만든다.
  - 컴포넌트 PR은 `figma/components/<컴포넌트>/`와 그 컴포넌트가 쓰는 자산(`figma/assets/`)만 바꾼다. 같은 자산을 두 PR이 더해도 같은 바이트라 충돌하지 않는다.
  - 토큰은 내보낼 때마다 읽어 `main`의 `tokens.json`과 비교하고, 다르면 컴포넌트 PR에 넣지 않고 토큰 PR(`feat/figma-tokens`)을 열거나 갱신한다.
  - 토큰 PR에는 바뀐 토큰을 쓰는 컴포넌트의 변형 PNG도 다시 내보내 넣는다. 토큰 값만 바뀌면 `export.json` 해시가 그대로라 PNG가 갱신되지 않아, 캡처 표의 피그마 열이 옛 모습이 되기 때문이다. 같은 내보내기에 포함된 컴포넌트의 PNG는 그 컴포넌트 PR에만 넣는다.
  - PR 본문에는 바뀐 변형 목록과 `피그마 | 현재 구현` 표를 넣는다. 현재 구현은 `parity-captures` 브랜치의 캡처이고, 처음 구현하는 컴포넌트는 빈칸이다([[피그마 일치 검사:캡처 표]]).
  - 경우마다 PR이 어떻게 생기고 어떤 순서로 병합하는지는 [[피그마 일치 검사:경우별 흐름]]에 있다.
  - 이 저장소에만 권한이 있는 GitHub fine-grained 토큰을 플러그인 로컬 저장소에 보관한다.
  - 내보낸 자료는 `packages/design-system/figma/`에 둔다([[저장소 구성:디자인 시스템 패키지 구조]]).
export.json 계약: |
  플러그인이 쓰고 비교 도구가 읽는 파일이다. 손으로 고치지 않는다. 피그마 이름과 선택지만 담고, 위치 좌표나 측정값은 담지 않는다. 이름을 코드 클래스로 바꾸는 규칙은 비교 도구가 가진다([[피그마 일치 검사:비교 규칙]]).

  - `figma/figma.json`: 바뀌지 않는 전역 값 `{ fileKey, scale }`(PNG 배율).
  - `figma/components/<컴포넌트>/export.json`: `name`, `nodeId`, `hash`, `booleans`(prop 이름 → 피그마 속성 키와 기본값), `variants`. 변형마다 `nodeId`, `properties`, `hash`(비교에 쓰는 이름 정보 `properties`·`layers`·`hidden`·`cases`·`transitions`의 해시. PNG는 넣지 않는다), `layers`, `hidden`(숨긴 레이어 경로), `cases`(BOOLEAN 경우마다 `layers`와 `hidden`, 키는 `showIcon=true` 꼴), `transitions`(전환마다 `trigger`, `to`, `type`, `duration`(ms)·`easing`(베지어 네 값). 전환이 없으면 키를 두지 않는다, [[피그마 일치 검사:상태 전환]]).
  - 같은 폴더에 변형 PNG(`<변형>.png`)를 둔다. 다른 컴포넌트와 파일을 나눠 쓰지 않는다.
  - `figma/assets/<묶음>/<자산>.<svg|png>`: 자산 파일([[피그마 일치 검사:자산]]).
  - JSON은 키를 정렬해 쓴다. 같은 내용이면 파일도 같게 하기 위해서다.

  `layers`는 변형 루트(첫 항목, `path: ""`)와 그 아래 보이는 레이어를 문서 순서로 담는다. 레이어마다 다음을 담는다.
  - `path`(레이어 경로), `type`(노드 종류), `parentLayout`(부모 자동 배치 방향), `sizing`(가로·세로 크기 방식과 고정 크기의 변수 이름)
  - `fill`(칠 변수나 칠 스타일 이름), `stroke`(칠 이름, 정렬, 레이아웃 포함 여부, 변마다 두께 변수), `radius`(모서리마다 변수), `effect`(효과 스타일 이름), `opacity`(변수), `blendMode`, `rotation`, `clipsContent`
  - `layout`(방향, 줄바꿈, 정렬, 여백 변수, 간격 변수)
  - `self`(부모 안에서의 정렬, 절대 위치면 축마다 제약)
  - `text`(내용, 정렬, 자동 크기, 최대 줄 수, 구간마다 범위·서체·글자 스타일·연결 변수·칠·밑줄)
  - `asset`(자산 이름, 묶음, 처리 방식, 파일, 한 가지 색이면 색 변수). 자산 인스턴스는 자식을 담지 않는다.
토큰 작성: |
  `src/tokens.css`는 사람이나 에이전트가 `figma/tokens.json`과 피그마를 보고 직접 쓴다. 플러그인은 JSON만 올린다.
  생성기를 두지 않는다. 그라데이션, 재질, 안쪽 선처럼 피그마를 CSS로 옮기는 방법 자체가 판단인 부분은 어차피 사람이나 에이전트가 정해야 하고, 그 판단을 코드로 굳히면 번역 규칙이 계속 늘어나기 때문이다. 맞게 옮겼는지는 아래 토큰 값 비교와 컴포넌트 판정이 1:1인 부분만 확인하고, 나머지는 캡처 표에서 사람이 본다.

  이름 규칙:
  피그마 이름에서 CSS 이름을 만드는 규칙은 아래 표를 따른다. 토큰 값 비교와 컴포넌트 판정의 이름 비교가 이 규칙에 기댄다.

  | 피그마 이름 | CSS 이름 | Tailwind 유틸리티 |
  |---|---|---|
  | `color/gray/f9f9f9`(Primitive) | `--color-gray-f9f9f9` | `bg-gray-f9f9f9` 등(컴포넌트에서는 쓰지 않는다) |
  | `text-fill/primary` 등 Semantic·Component 색 | `--color-text-fill-primary` | `text-text-fill-primary`, `bg-*`, `border-*` |
  | `spacing/12` | `--spacing-12` | `p-12`, `gap-12` 등(값은 px) |
  | `size/control/height` | `--spacing-control-height` | `h-control-height`, `size-*`, `w-*` |
  | `radius/control` | `--radius-control` | `rounded-control` |
  | `stroke-width/default` | `--border-width-default` | `@utility`(선 두께, 바깥 선 두께) |
  | `blur/acrylic` | `--blur-acrylic` | `blur-acrylic`, `backdrop-blur-acrylic` |
  | `opacity/cut` (50) | `--opacity-cut: 50%` | `opacity-cut` |
  | `font/family/base` | `--font-base: 'Open Sans', var(--font-korean)` | `font-base` |
  | `font/family/korean` | `--font-korean: 'Pretendard'` | `font-korean` |
  | `font/weight/semibold` | `--font-weight-semibold` | `font-semibold` |
  | `font/size/body` | `--text-body` | `text-body`(같은 이름의 줄 높이를 함께 정한다) |
  | `font/line-height/body` | `--leading-body`, `--text-body--line-height` | `leading-body` |
  | `motion/duration/fast` | `--motion-duration-fast`, `--transition-duration-fast` | `duration-fast` |
  | `motion/easing/direct-entrance` | `--motion-easing-direct-entrance`, `--ease-direct-entrance` | `ease-direct-entrance` |
  | `motion/scale/*`, `motion/delay/*` | `--motion-scale-*`, `--motion-delay-*` | 없음(`var()`로 쓴다) |
  | 글자 스타일 `Body Strong` | 없음 | `type-body-strong`(서체·크기·굵기·줄 높이·자간) |
  | 글자 스타일 `Hangul/*` | 없음 | 만들지 않는다. 라틴 스타일과 같은 변수에 연결돼 있으면 같은 `type-*`로 본다([[피그마 일치 검사:글자]]) |
  | 효과 스타일 `Elevation/Flyout` | `--shadow-elevation-flyout` | `shadow-elevation-flyout` |
  | 효과 스타일 `Text/*` | `--text-shadow-*` | `text-shadow-*` |
  | 효과 스타일의 배경 블러(`Material/Acrylic`) | `--backdrop-blur-material-acrylic` | `backdrop-blur-material-acrylic` |
  | 효과 스타일의 레이어 블러 | `--blur-*` | `blur-*` |
  | 단색 칠 스타일 `Material/Fallback/Acrylic Default` | `--color-material-fallback-acrylic-default` | 색 유틸리티 |
  | 그라데이션 칠 스타일 `Elevation/Control Border` | `--gradient-elevation-control-border` | `border-gradient-elevation-control-border`([[디자인 기반:컨트롤 테두리]]) |
  | 재질 칠 스타일 `Material/Acrylic Default`, `Material/Acrylic Base`, `Material/Mica Base` | 층마다 색 변수 | `material-acrylic-default`, `material-acrylic-base`, `material-mica-base`(`@utility`, [[디자인 기반:재질 효과]]) |

  - 스타일 이름의 공백과 괄호는 `-`가 된다(`Surface/Flyout (Acrylic)` → `--shadow-surface-flyout-acrylic`).
  - 라틴 서체 변수에는 `font/family/korean`을 이어 붙인다([[디자인 기반:서체]]).
  - Motion 변수의 코드 이름은 `--motion-*`이고([[디자인 기반:모션]]), Tailwind 유틸리티가 읽는 이름은 그것을 참조한다.
  - 표에 규칙이 없는 변수 묶음(예: `font/stretch/*`)이 생기면 이 표에 규칙을 먼저 정한다.

  쓰는 방법:
  - 별칭은 실제 값으로 풀지 않고 `var()` 참조로 남긴다. Primitive → Semantic → Component 단계가 CSS에서도 보이게 하기 위해서다.
  - Tailwind에 이름공간이 없는 것(선 두께, 바깥 선 두께, 그라데이션 테두리, 재질)은 `@utility`로 만든다.
  - 그라데이션 정지점 사이 색은 피그마가 투명도를 곱하지 않고 섞고, CSS는 투명도를 곱한 값으로 섞는다. 투명도와 RGB가 모두 다른 두 정지점 사이(예: 흰색 8% → 검정 40%인 `Elevation/Accent Control Border`)는 피그마 방식으로 계산한 중간 정지점을 넣는다.
  - `tokens.css`에는 모든 토큰을 담은 `@theme static` 블록 하나와 `@utility`만 둔다. `static`은 유틸리티에서 쓰지 않은 변수도 CSS에 남겨, 손으로 쓴 CSS와 인라인 스타일이 `var()`로 참조할 수 있게 한다.
  - Tailwind 기본값 지우기(`--color-*: initial` 등)는 `theme.css`가 `tokens.css`보다 먼저 한다. Tailwind는 `initial`보다 앞에 정의된 같은 이름공간 변수를 지우므로 순서가 바뀌면 토큰이 사라진다.

  토큰 값 비교:
  `tokens.css`가 `tokens.json`과 맞는지 CI가 확인한다. 피그마 이름은 위 이름 규칙으로, 피그마 값은 CSS 형식으로 바꿔 `tokens.css`의 변수와 비교한다. Storybook 없이 `tokens.css`만 읽어 한다.

  토큰마다 무엇을 어떻게 비교하는지는 [[피그마 일치 검사:판정 항목]]의 "토큰 값 비교" 표를 따른다.

  - `tokens.json`에 있는데 `tokens.css`에 없는 토큰, `tokens.css`의 `@theme`에 있는데 `tokens.json`에 없는 토큰은 실패다. 피그마에 없는 값이 코드에 들어오지 않게 하기 위해서다.
  - 비교할 수 없는 토큰 종류(이름 규칙이 없는 묶음)를 만나면 실패한다([[피그마 일치 검사:비교할 수 없으면 실패]]).
  - `figma/tokens.json`이 아직 없으면 건너뛴다.
비교 범위: |
  - 컴포넌트 단위로 비교한다. 화면 단위는 비교하지 않는다([[미결 사항:화면 단위 시각 검증]]).
  - PR마다 바뀐 파일로 영향 범위를 자동으로 정한다. 사람이 라벨로 켜고 끄지 않는다. 라벨을 잊어 검사가 빠지는 일이 없게 하기 위해서다.
  - 영향 범위가 있으면 `figma` 라벨을 붙이고, 커밋이 더해져 범위가 사라지면 뗀다. 라벨은 실행 조건이 아니라 결과 표시다.

  범위는 위에서부터 먼저 맞는 규칙을 쓴다.

  | 바뀐 파일 | 범위 |
  |---|---|
  | 아래 어디에도 해당하지 않는 파일(블로그 앱, `.codocs`, README 등) | 없음 |
  | `src/components/<c>/*.test.tsx` | 없음 |
  | `src/components/<c>/`의 나머지(코드, `Parity` 스토리) | `<c>`와 그것을 담는 컴포넌트 |
  | `figma/components/<c>/` | `<c>`와 그것을 담는 컴포넌트 |
  | `figma/assets/<자산>`, `src/assets/` | 그 자산을 쓰는 컴포넌트(`export.json`의 `asset`) |
  | `figma/tokens.json`, `src/tokens.css` | 바뀐 토큰을 쓰는 컴포넌트(아래) |
  | `theme.css`, `fonts.css`, 웹 폰트 CSS, `.storybook/`, 패키지 `package.json`·`tsconfig.json`, `pnpm-lock.yaml`, `src/components/` 밖의 디자인 시스템 소스 | 전체 |
  | `scripts/parity/`, 일치 검사 워크플로 | 전체 + 증명 테스트 |

  - 담는 컴포넌트: 바뀐 컴포넌트를 상대 경로(`../menu-item/...`)로 import하는 컴포넌트를 거슬러 올라가며 함께 비교한다.
  - 토큰 범위: `tokens.json` 변경에서 바뀐 토큰 이름을 뽑고, 그 토큰을 가리키는 별칭까지 따라간 뒤, `export.json`에서 그 이름을 쓰는 컴포넌트를 찾는다. 이름으로 정할 수 없으면 전체로 한다.
  - 증명 테스트(일부러 틀린 코드가 실패하는지)는 비교 도구를 확인하는 테스트라 `scripts/parity/`가 바뀔 때만 돌린다.

  기준 커밋은 PR 대상 브랜치와의 merge-base이고, 로컬에서는 커밋하지 않은 변경과 추적하지 않는 새 파일도 포함한다(`test:parity --affected`).

  한계: 의존 관계는 컴포넌트 폴더 사이의 상대 import만 따라간다. 공개 진입점을 거친 import나 CSS를 통한 영향은 찾지 못해, 컴포넌트 폴더 밖의 소스 변경은 전체로 처리한다.
CI 비교: |
  비교 도구는 Playwright Test로 돈다. 저장소의 피그마 내보내기 자료와 Storybook 스토리를 비교하므로 CI에 피그마 토큰이 필요 없다.

  PR(초안 포함)에서 단계 순서:

  | 단계 | 내용 | 실패하면 |
  |---|---|---|
  | 0. 범위 | git diff로 [[피그마 일치 검사:비교 범위]]를 정하고 라벨을 붙이거나 뗀다. Chromium 설치나 Storybook 빌드 없이 한다 | 범위가 없으면 여기서 끝 |
  | 1. 토큰·자산 확인 | 토큰 값 비교([[피그마 일치 검사:토큰 작성]]), `generate:assets --check`(일반 CI에서 항상 돈다) | 막음 |
  | 2. 판정 | Storybook을 정적으로 빌드하고, 범위 안 컴포넌트를 [[피그마 일치 검사:비교 규칙]]대로 판정한다 | 막음. 실패 목록을 댓글로 |
  | 3. 캡처 | 1·2가 통과하면 범위 안 컴포넌트를 캡처해 `피그마 \| 코드` 표를 댓글로 남긴다([[피그마 일치 검사:캡처 표]]) | 작업 실패 |

  `main` 병합 때는 판정하지 않고, 범위 안 컴포넌트를 캡처해 `parity-captures` 브랜치에 덮어쓴다. 플러그인 PR 본문의 "현재 구현" 열이 이 캡처다.

  - Storybook은 정적으로 빌드(`storybook-static`)해 도구 안의 작은 정적 서버로 띄운다. 개발 서버보다 결과가 매번 같다.
  - 결과는 `parity-results/`에 남기고 CI 아티팩트로 올린다.

  실행: `pnpm --filter @seojaewan/design-system test:parity`. Storybook을 빌드한 뒤 비교한다.
  - `--affected [--base <브랜치>]`: 영향받는 컴포넌트만 비교한다.
  - `--component <폴더 이름>`: 그 컴포넌트만 비교한다(여러 번 쓸 수 있다).
  - `--no-build`: 이미 빌드한 `storybook-static`을 쓴다.
  - Chromium이 없으면 `pnpm --filter @seojaewan/design-system exec playwright install chromium`으로 설치한다.

  PR 댓글:
  - CI는 결과를 PR 댓글 하나로 남기고(숨은 표시 `<!-- figma-parity -->`), 실행할 때마다 그 댓글을 고친다.
  - 맨 위는 판정 결과다. 실패면 `피그마 일치 검사: N개 중 M개 실패`와 컴포넌트마다 접힌 블록에 실패를 한 줄씩(레이어, 역할, 피그마, 코드) 쓴다. 같은 실패 줄은 변형을 묶어 한 번만 쓰고, 실패는 하나도 빼지 않는다.
  - 통과면 그 아래에 캡처 표를 둔다.
  - 이미지는 `parity-report/pr-<번호>` 브랜치에 올리고 PR이 닫히면 지운다(`parity-report-cleanup` 워크플로). GitHub API로 댓글에 이미지를 직접 올릴 수 없기 때문이다.
  - 댓글이 길이 제한(65,536자, 여유를 두어 60,000자)을 넘으면 번호를 붙인 댓글로 이어 쓴다.
  - 권한은 `contents: write`(보고 브랜치, `parity-captures`)와 `pull-requests: write`(댓글, 라벨)만 준다. 포크에서 온 PR은 쓰기 토큰이 없어 판정만 하고 라벨과 댓글을 남기지 않는다.
  - CI는 PR 브랜치에 커밋하지 않는다. `tokens.css`나 코드 자산이 맞지 않으면 실패만 한다([[피그마 일치 검사:스킬]]).
경우별 흐름: |
  | 경우 | 생기는 PR | 병합 순서 |
  |---|---|---|
  | 컴포넌트만 바뀜 | 컴포넌트 PR 하나 | 상관없음 |
  | 토큰 값만 바뀜 | 토큰 PR 하나(영향 컴포넌트 PNG 포함) | 상관없음 |
  | 새 토큰을 쓰는 컴포넌트 | 토큰 PR + 컴포넌트 PR | 토큰 먼저 |
  | 토큰 값 변경 + 그 토큰을 쓰는 컴포넌트 구조 변경 | 토큰 PR + 컴포넌트 PR(그 컴포넌트 PNG는 컴포넌트 PR에만) | 토큰 먼저 |
  | 토큰 이름 변경·삭제 | 토큰 PR 두 개 + 컴포넌트 PR들 | 추가 → 옮기기 → 지우기 |

  - 컴포넌트 PR이 아직 없는 토큰을 쓰면 판정이 실패하고, 메시지가 "토큰 PR을 먼저 병합"이라고 알려 준다. 토큰 PR을 병합한 뒤 컴포넌트 PR에 `main`을 받아 온다.
  - 토큰 PR이 병합되기 전 컴포넌트 PR의 캡처 표는 코드 열이 옛 토큰 값으로 보일 수 있다. 판정은 이름으로 하므로 통과한다. 토큰 PR을 먼저 병합하면 맞춰진다.
  - 토큰 이름을 바꾸거나 지울 때 한 번에 하면, 토큰 PR은 옛 이름을 쓰는 `main` 코드 때문에, 컴포넌트 PR은 새 이름이 없어서 어느 쪽도 통과할 수 없다. 그래서 새 이름을 먼저 더하고(옛 이름 유지), 컴포넌트를 옮기고, 아무도 쓰지 않게 된 옛 이름을 지운다. 지울 시점은 플러그인의 사용처 0 알림으로 안다. 토큰 PR이 사라진 토큰을 쓰는 컴포넌트를 찾으면 "먼저 옮기세요"라고 실패한다.
  - 코드만 바뀐 PR은 영향받는 컴포넌트의 판정과 캡처 표를 받는다. 피그마 열은 저장소의 변형 PNG다.
캡처 표: |
  판정에 넣지 않은 것(크기 방식, 안쪽 선, 재질, 그림자, 줄바꿈, 위치)을 사람이 확인하는 자료다. 그림을 기계로 비교하지 않는다. 엔진 차이 때문에 기준값을 세울 수 없고, 기준값을 사람이 정하면 그것도 주관이기 때문이다.

  - 행은 변형과 상태, BOOLEAN 경우다. 열은 `피그마 | 코드`다.
  - 플러그인 PR 본문은 `피그마 | 현재 구현`이다. 현재 구현은 `parity-captures` 브랜치의 캡처이고, 처음 구현하는 컴포넌트는 빈칸이다. 이 표가 구현할 내용이다.

  같은 조건으로 캡처한다.

  | 조건 | 내용 |
  |---|---|
  | 배율 | `figma.json`의 `scale`과 같은 `deviceScaleFactor` |
  | 범위 | 피그마는 변형 노드, 코드는 비교 요소의 테두리 상자. 그림자가 잘리지 않게 같은 여백을 둔다 |
  | 배경 | 피그마 PNG는 배경이 투명이라 두 이미지를 같은 배경 위에 놓는다 |
  | 상태 | 판정과 같은 방법(실제 마우스·키보드)으로 재현한다([[피그마 일치 검사:스토리 규칙]]) |
  | 재질 | 뒤를 흐리는 재질은 같은 배경 이미지 위에서 캡처한다 |

  피그마 변형 PNG는 같은 디자인을 다시 내보내도 바이트가 달라 판정에 쓰지 않고 이 표에만 쓴다([[한계:피그마 PNG 판정 제외]]).
스킬: |
  플러그인 PR을 처리하는 일은 자동으로 돌리지 않고, 사람이 시점을 골라 AI에게 스킬로 맡긴다. 같은 절차와 같은 제한을 매번 지키게 하기 위해서다.

  | 스킬 | 쓰는 때 | 하는 일 |
  |---|---|---|
  | `figma-token-pr` | 토큰 PR | 바뀐 토큰 정리, 이름 변경·삭제 확인, `tokens.json`과 피그마를 보고 `tokens.css` 고치기, 토큰 값 비교 통과 확인 |
  | `figma-component-pr` | 컴포넌트 PR | 없는 토큰 확인, `generate:assets` 실행과 커밋, 판정 실패 목록대로 구현 |

  - 스킬은 `.claude/skills/<이름>/SKILL.md`에 둔다. 절차만 담고 규칙은 `@codocs \[[문서:섹션]]` 링크로 가리킨다([[codocs 연결 규칙]]). 실행할 때 링크된 섹션을 codocs로 읽는다.
  - 코드 자산(`src/assets/`)은 자산 생성기를 실행만 하고 직접 쓰지 않는다.
  - 다음은 하지 않는다: `figma/` 고치기, 코드 자산 손으로 고치기, 병합.
  - 다음이 필요하면 멈추고 보고한다: 판정 도구(`scripts/parity/`) 고치기, `.codocs` 고치기, 토큰 이름 변경·삭제, PR에 예상 밖 파일이 있음.
  - 끝나면 판정 밖이라 캡처 표에서 사람이 봐야 할 곳을 보고한다.
  - 코드만 바꾸는 PR은 일반 개발 작업이라 스킬을 두지 않는다.
검토한 대안: |
  2026-10-21~22에 Button, MenuItem, Flyout, SearchBox로 시험했다. 엔진 차이나 형식 번역이 끼는 방법은 모두 같은 벽에 부딪혀, 같은 이름을 썼는지로 비교하는 방식을 골랐다([[비교 원리]]).

  - 픽셀 비교(피그마 PNG ↔ Storybook 스크린샷, pixelmatch): 엄격한 기준(색 차이 0, 허용 픽셀 0)에서는 정상 48개 변형이 모두 실패했다. 피그마는 글리프를 소수 위치에 두고 Chromium은 정수에 맞추며, 모서리 안티앨리어싱과 그림자 경계도 엔진마다 다르기 때문이다. 정상이 통과하도록 느슨하게 하면 여백 +1px·반경 +1px 실수를 놓쳤다. 게다가 피그마 PNG는 같은 디자인을 다시 내보내도 48개 모두 바이트가 달랐고(최대 11,245픽셀), 기준 이미지가 고정되지 않았다.
  - 인지 비교(pixelmatch 문턱값과 안티앨리어싱 제외, SSIM, 차이 덩어리 크기): 2026-10-22에 Button 정상 18개와 일부러 틀린 버전 28개로 시험했다. 큰 실수 14개를 모두 잡으면서 정상을 모두 통과시키는 기준은 하나뿐이었고, 정상과 실수의 간격(SSIM 0.04, 회색 바탕 차이 0.26%p)이 글자 가장자리 번짐 정도라 운영체제나 브라우저 설정이 바뀌면 뒤집힌다. 반투명 배경 색 차이는 흰 바탕에서 보이지 않았고, 반경 +1·배경 한 단계·글자 하나 바꿈은 어떤 지표로도 잡지 못했다. 문턱값을 사람이 정해야 하는 점도 값 비교와 같은 문제라 판정에 쓰지 않는다.
  - 값 비교(피그마 레이어 속성 ↔ `getComputedStyle`·측정값): 위치·크기·여백·색을 숫자로 비교하는 방식은 동작했다. 그러나 피그마 속성과 CSS 값을 짝짓는 규칙(글자 상자 반올림, 잉크 영역, 반경 줄이기 등)이 주관적이고, 컴포넌트를 더할 때마다 예외가 늘어 유지할 수 없어 내려놓았다.
  - 피그마 SVG를 Chromium에서 그려 비교: 같은 엔진이라 엔진 차이는 없지만 49개 중 2개만 일치했다. 일부러 틀린 버전(그라데이션 선을 단색으로)이 차이 0으로 나와 맞는 버전과 구분되지 않았고, SVG로 표현할 수 없는 것(배경 블러, 밑줄 클립, 점선)도 있다.
  - Figma Sites로 내보낸 HTML을 기준으로 쓰기: 글자와 모서리는 완전히 일치했으나 그라데이션 테두리를 단색으로 바꾸고, 색을 소수 둘째 자리로 반올림하고, 글꼴을 포함하지 않아 기준으로 쓸 수 없다.
  - Dev Mode 코드 생성(MCP `get_design_context`)을 기준으로 쓰기: 그라데이션을 단색으로 바꾸고, 테두리가 크기를 차지해 버튼 높이가 34px이 되고, 색을 반올림해 맞지 않았다. Inspect CSS(`getCSSAsync`)는 MCP 환경에서 막혀 시험하지 못했다.
  - HTML을 피그마로 변환해 비교하거나 피그마 엔진으로 코드를 그리기: 변환에서 번역 손실이 생기고, 피그마 렌더러를 코드에 쓰는 공개 API가 없다.
  - 기존 도구: 값 단위로 비교하는 도구는 신생이고 범위가 좁다(변형·상태 미지원). 성숙한 도구는 이미지 비교(Percy, Applitools)와 토큰 동기화이고, 컴포넌트 수준의 디자인–코드 일치는 업계에서도 아직 풀지 못한 문제로 본다.
  - Figma REST API로 CI가 매번 자료를 받기: CI에 피그마 토큰이 필요하고, 피그마만 먼저 바뀌면 모든 PR이 실패한다. Variables는 Enterprise 플랜이 아니면 읽을 수 없다.
  - 별도 브랜치에 기준 자료를 계속 덮어쓰기: 어느 코드가 어느 시점의 피그마를 기준으로 했는지 연결이 끊기고, 디자인 변경과 상관없는 PR까지 실패한다.
  - 코드 기준 회귀 테스트 + 사람 리뷰(Chromatic 등 업계에서 흔한 방식): 기준이 피그마가 아니라 이전 코드라 처음 만든 컴포넌트가 피그마와 달라도 잡지 못한다.
  - 토큰도 플러그인 대신 피그마 MCP로만 읽기: MCP는 AI 작업 세션 안에서만 쓸 수 있어 토큰 변경이 PR에 남지 않고 CI가 검사할 수 없다. 그래서 MCP는 플러그인과 같은 내보내기 코드를 돌리는 데만 쓴다.
  - 하나의 `figma/export.json`에 모든 컴포넌트 기록: 서로 다른 컴포넌트를 내보낸 PR이 같은 파일을 고쳐 충돌하므로 컴포넌트마다 폴더로 나눴다.
  - 역할 → 클래스 번역표로 비교: 피그마 레이어에서 기대 클래스를 만들고 코드 요소가 그 클래스를 쓰는지 비교하는 방식이다. 그러나 HUG → `inline-flex`, 안쪽 선 → `::before` 고리처럼 기대 클래스 자체가 사람이 정한 구현 방식이라, 확인하는 것은 "피그마와 같다"가 아니라 "번역 규칙을 따랐다"가 된다. 컴포넌트가 늘 때마다 번역 규칙과 비교를 위한 피그마 제약이 쌓이고, 코드도 검사기에 맞춘 모양이 된다. 그래서 판정은 1:1 입력값만 하고 나머지는 캡처 표로 사람이 본다.
  - 러프한 픽셀 비교를 참고 알림으로: 정상 변형의 차이로 기준선을 정하면 큰 실수는 알릴 수 있지만, 기준선이 사람의 결정이고 알림이 잦으면 무시하게 된다. 컴포넌트 단위 PR이면 사람이 표 전체를 봐도 부담이 적어 쓰지 않는다.
  - 컴포넌트마다 `tokens.json`을 나누기: 여러 컴포넌트가 함께 쓰는 토큰이 여러 파일에 들어가, 한 컴포넌트만 다시 내보내면 이름 하나에 값이 둘이 된다. 결과 `tokens.css`도 하나라 충돌이 사라지지 않는다. 토큰은 전용 PR로 둔다.
  - 라벨로 CI를 켜기: 라벨을 잊으면 검사가 빠진다. 바뀐 파일로 범위를 정하고 라벨은 결과로 붙인다.
  - 생성기로 `tokens.css` 만들기: 이름과 단순 값은 기계적으로 옮길 수 있지만, 그라데이션 중간 정지점, 재질 층, 안쪽 선 고리, `type-*` 묶음처럼 CSS로 옮기는 방법 자체가 판단인 부분이 생성기 대부분을 차지한다. 이 판단은 어차피 사람이나 에이전트가 해야 하므로 생성기 없이 직접 쓰고, 1:1인 부분만 토큰 값 비교로 확인한다. 같은 이유로 Style Dictionary도 쓰지 않는다.
  - CI가 생성 파일을 PR에 자동 커밋: 기본 토큰으로 푸시한 커밋은 CI를 다시 깨우지 않아 별도 시크릿 토큰이 필요하다. 코드 자산 생성은 스킬로 사람이 시점을 골라 한다.
  - 자산을 픽셀 100% 일치로 비교: 피그마와 Chromium은 같은 SVG도 다르게 그려(49개 중 2개 일치) 정상도 실패한다. 파일 사슬로 바이트 일치를 본다.
