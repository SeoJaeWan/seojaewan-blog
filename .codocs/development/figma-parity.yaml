_codocs:
  id: figma-parity
  name: 피그마 일치 검사
  parent:
    - 개발 컨벤션
개요: |
  디자인 시스템 컴포넌트가 피그마 디자인과 같은지 자동으로 확인하는 방법이다.
  피그마가 디자인의 기준이라는 원칙을 테스트로 강제하고, 한번 맞춘 컴포넌트가 이후 변경으로 깨지지 않게 지킨다.

  그림(픽셀)이나 측정값을 비교하지 않고, 피그마와 코드가 같은 이름(변수, 스타일, 자동 배치 선택지, 자산)을 썼는지 비교한다.
  피그마 레이어가 어떤 역할(칠, 선, 반경, 여백 등)에 어떤 변수·스타일을 썼는지로 코드가 써야 할 클래스를 정하고, 짝지은 코드 요소가 그 클래스를 쓰는지와 브라우저 계산값이 그 토큰 값과 같은지 확인한다.
  두 렌더링 엔진의 차이나 형식 번역이 판정에 끼지 않기 때문이다. 다른 방법을 시험하고 내려놓은 이유는 [[피그마 일치 검사:검토한 대안]]에, 이 방식을 예시로 쉽게 풀어 쓴 설명은 [[비교 원리]]에 있다.

  이름이 같으면 값도 같다는 것은 두 사슬이 보장한다.
  - 피그마의 시각 값은 모두 변수나 스타일에 연결한다. 연결 안 된 값은 플러그인이 내보내기를 막는다([[피그마 일치 검사:구조 검사]]).
  - 변수·스타일의 값은 `figma/tokens.json` → `src/tokens.css` 생성으로, 아이콘·이미지는 피그마에서 내보낸 자산 파일로 코드에 옮긴다([[피그마 일치 검사:토큰 생성]], [[피그마 일치 검사:자산]]). CI는 다시 생성해 차이가 없는지 확인한다.
흐름: |
  1. 피그마 정리: 컴포넌트를 [[디자인 기반]]의 규칙(자동 배치, 간격 단계, 크기 변수, 효과 스타일, 자산)대로 만든다.
  2. 구조 검사와 내보내기: 피그마 플러그인이 컴포넌트를 검사하고, 통과하면 레이어 정보(이름과 선택지), 변형 PNG, 쓰는 자산, 토큰을 내보낸다. 위반이 하나라도 있으면 그 컴포넌트는 내보내지 않고 고칠 목록을 보여 준다. 플러그인 UI와 피그마 MCP가 같은 내보내기 코드를 쓴다([[피그마 일치 검사:피그마 플러그인]]). 플러그인은 브랜치에 커밋하고 PR을 연다.
  3. 생성: 같은 PR에서 `tokens.json`으로 `tokens.css`를, 내보낸 자산으로 코드가 쓰는 자산 파일을 만든다.
  4. 비교: CI가 Playwright Test로 Storybook 스토리를 열어, 피그마 레이어와 짝지은 요소의 클래스 이름을 기대 클래스와 비교하고 계산값이 토큰 값과 같은지 본다([[피그마 일치 검사:비교 규칙]]).
  5. PR 댓글: 결과를 PR 댓글로 남긴다([[피그마 일치 검사:CI 비교]]). 디자인만 바뀐 PR은 코드가 아직 그대로라 실패하고, 그 실패 목록이 구현할 목록이 된다. 같은 PR에서 코드를 고쳐 통과시킨 뒤 병합한다. 디자인 변경과 코드 변경이 한 PR에 남는다.

  코드가 바뀔 때는 병합된 내보내기 자료가 기준이다. 디자인 시스템 컴포넌트를 건드리는 PR은 영향받는 컴포넌트를 비교하고, 피그마와 달라졌는데 의도한 변경이면 피그마부터 고치고 1번부터 다시 탄다.

  피그마 쪽 변경은 항상 PR로만 들어오므로, 피그마만 바뀌고 코드가 모르는 상황이 생기지 않는다. 그래서 정기적인 전체 비교는 두지 않는다.
  컴포넌트마다 자료 폴더가 따로라, 서로 다른 컴포넌트를 내보낸 PR은 같은 파일을 건드리지 않고 순서와 상관없이 병합할 수 있다.
비교 규칙: |
  피그마 레이어 하나에서 기대 클래스 목록을 만들고, 짝지은 코드 요소([[피그마 일치 검사:짝짓기]])가 그 클래스를 모두 쓰는지 본다. 그다음 그 요소의 계산값을 확인한다.

  역할 + 토큰 = 클래스:
  - 레이어에 연결된 변수·스타일 이름과 그것을 쓴 역할(칠, 선, 선 두께, 반경, 효과, 글자 스타일, 여백, 간격, 크기, 불투명도)로 클래스 이름을 정한다. 접두어는 Tailwind 이름 규칙을 따르고, 토큰 부분은 [[피그마 일치 검사:토큰 생성]]의 CSS 이름 규칙과 같다.
  - 그리는 방법은 생성된 유틸리티 안에만 있고, 컴포넌트는 클래스만 쓴다. Tailwind에 없는 것(그라데이션 테두리, 선 두께, 바깥 선 두께, 재질)은 생성기가 `@utility`로 만든다. 그래서 비교는 "같은 이름을 썼는가"만 보면 되고, 유틸리티가 피그마처럼 그리는지는 생성기와 그 테스트가 맡는다.

  | 피그마 | 역할 | 기대 클래스 |
  |---|---|---|
  | 칠 변수 `accent-fill/default` | 배경 | `bg-accent-fill-default` |
  | 글자 칠 변수 `text-fill/primary` | 글자 색 | `text-text-fill-primary` |
  | 칠 스타일 `Elevation/Control Border` | 안쪽 선(레이아웃 제외) | `border-gradient-elevation-control-border` + `inner-border-w-<두께>` |
  | 단색 선 변수, 안쪽·레이아웃 제외 | 선 | `inner-border-<색>` + `inner-border-w-<두께>` |
  | 단색 선 변수, 안쪽·레이아웃 포함 | 선 | `border-<색>` + 선 두께 클래스 |
  | 단색 선 변수, 바깥쪽 | 선 | `outline-<색>` + `outline-<두께>`(Tailwind v4에는 `outline-w-*`가 없어 outline 유틸리티가 두께 토큰도 받는다. 예: `outline-focus-stroke-outer outline-focus-outer`) |
  | 반경 변수 `radius/control` | 모서리 | `rounded-control`(모서리별이면 `rounded-tl-*` 등) |
  | 효과 스타일 `Elevation/Flyout` | 그림자 | `shadow-elevation-flyout` |
  | 효과 스타일 `Surface/Flyout (Acrylic)` | 그림자와 배경 블러 | `shadow-surface-flyout-acrylic backdrop-blur-surface-flyout-acrylic` |
  | 칠 스타일 `Material/Acrylic Default` | 재질 | `material-acrylic-default` |
  | 글자 스타일 | 글자 | `type-body` 등([[피그마 일치 검사:글자]]) |
  | 여백 변수 `spacing/12` | 안쪽 여백 | `pl-12` 등(같은 값끼리 `px-*`·`py-*`·`p-*`로 묶어 비교) |
  | 간격 변수 `spacing/8` | 자식 사이 간격 | `gap-8`(줄바꿈이면 `gap-x-*`·`gap-y-*`) |
  | 크기 변수 `size/icon/16` | 고정 크기 | `w-icon-16`, `h-icon-16` |
  | 불투명도 변수 | 불투명도 | `opacity-<토큰>` |

  선택지 → 클래스:
  자동 배치와 글자 배치처럼 값이 정해진 선택지(열거 값)는 대응표로 클래스를 정한다. 위치 좌표는 재지 않는다. 주요 대응은 다음과 같고, 전체 대응표는 비교 도구의 데이터 파일 한곳(`packages/design-system/scripts/parity/rules/`)에 둔다.

  | 피그마 선택지 | 클래스 |
  |---|---|
  | 자동 배치 가로 / 세로 | `flex flex-row` / `flex flex-col` |
  | 줄바꿈 | `flex-wrap` |
  | 주축 정렬 MIN / CENTER / MAX / SPACE_BETWEEN | `justify-start` / `justify-center` / `justify-end` / `justify-between` |
  | 교차축 정렬 MIN / CENTER / MAX / BASELINE | `items-start` / `items-center` / `items-end` / `items-baseline` |
  | 크기 HUG | `w-fit` / `h-fit` |
  | 크기 FILL(부모 주축 방향) | `flex-1 min-w-0` / `flex-1 min-h-0` |
  | 크기 FILL(부모 교차축 방향), 자식 STRETCH | `self-stretch` |
  | 크기 FIXED | 크기 변수 클래스([[디자인 기반:크기 변수]]) |
  | 내용 자르기 켬 | `overflow-hidden` |
  | 절대 위치 | `absolute` + 위치 클래스([[피그마 일치 검사:겹쳐 놓기]]) |
  | 글자 가로 정렬 | `text-left` / `text-center` / `text-right` |
  | 글자 자동 크기 WIDTH_AND_HEIGHT | `whitespace-nowrap` |
  | 말줄임 1줄 / n줄 | `truncate` / `line-clamp-<n>` |
  | 회전 90° 배수 | `rotate-90`, `-rotate-90`, `rotate-180`([[디자인 기반:회전]]) |

  계산값:
  - 클래스가 맞아도 다른 CSS가 덮어쓰거나 상태 클래스가 적용되지 않으면 화면은 다르다. 그래서 짝지은 요소의 `getComputedStyle` 값이 그 토큰 값과 같은지 문자열로 비교한다. 기대값은 같은 브라우저가 그 토큰을 계산한 문자열이다. 픽셀이 아니라 같은 브라우저가 만든 문자열끼리 비교하므로 엔진 차이가 없다.
  - 상태(Hover, Pressed, Focused 등)는 [[피그마 일치 검사:스토리 규칙]]대로 실제 상호작용으로 재현한 상태에서 잰다.
  - 회전은 transform 행렬 문자열로 비교한다.
짝짓기: |
  피그마 레이어와 코드 요소를 짝짓는 규칙이다. 기대 클래스와 계산값은 짝지은 요소에서 읽는다.

  - 코드 요소에 `data-figma="<레이어 경로>"`를 단다. 레이어 경로는 export.json의 `path`이고 보통 레이어 이름 그대로다(`label`, `icon`, `bottom border`). 형제끼리 이름이 겹치면 경로가 모호해지므로 내보내기를 막는다([[피그마 일치 검사:구조 검사]]).
  - 변형 루트는 비교 요소다([[피그마 일치 검사:스토리 규칙]]). 비교 요소가 감싸는 요소이고 피그마 루트가 그 안에 있으면(예: 메뉴 팝업 안의 MenuItem 행) 루트 요소에 `data-figma-root`를 단다.
  - 다음은 실패다.
    - 피그마 레이어에 짝 요소가 없다.
    - 같은 레이어 경로를 단 요소가 둘 이상이다.
    - 디자인 토큰 클래스를 쓰는데 `data-figma`가 없는 요소가 있다. 피그마에 없는 모양을 코드가 그리는 경우를 잡는다.
  - 칠·선·효과가 없는 레이어(배치만 하는 구조용 프레임)는 짝 요소가 없어도 된다. 다만 그 자리의 코드 요소가 여백·간격 같은 토큰 클래스를 쓰면 위 규칙대로 표시가 있어야 한다.
  - 레이어는 실제 요소로 그린다. `::before`·`::after`에는 `data-figma`를 달 수 없기 때문이다(예: SearchBox `bottom border`는 `<span>`이다). 생성 유틸리티가 안에서 의사 요소를 쓰는 것(`border-gradient-*`, `inner-border-*`)은 레이어가 아니라 그 요소의 선이라 괜찮다.
  - 글자 구간을 나누는 안쪽 요소(`<strong>` 등)에는 표시가 필요 없다([[피그마 일치 검사:글자]]).
스토리 규칙: |
  피그마 변형 하나를 Storybook 스토리와 args 하나로 짝짓는 규칙이다. 비교 도구는 이 규칙대로 스토리를 찾고, 맞지 않으면 실패한다.

  - 컴포넌트마다 `src/components/<컴포넌트>/<컴포넌트>.stories.tsx`에 이름이 `Parity`인 스토리를 하나 둔다. 변형마다 스토리를 만들지 않고 args로 변형을 고른다. 변형이 늘어도 스토리 파일을 고칠 일이 적게 하기 위해서다.
  - 피그마 변형 속성 이름은 camelCase arg 이름이 된다(`Style` → `style`). 값은 변형 파일 이름과 같은 규칙으로 정규화한 문자열이다(`Accent` → `accent`, `Chrome more (Mobile)` → `chrome-more-mobile`). `True`·`False`는 boolean이다.
  - BOOLEAN 컴포넌트 속성은 prop 이름 그대로 arg가 된다(`Show icon` → `showIcon`, [[피그마 일치 검사:숨김 레이어]]). export.json `cases`에 있는 경우(예: `showIcon=true`)도 같은 스토리에 args로 넘겨 비교한다.
  - Storybook은 argTypes `options`에 없는 URL args를 조용히 버린다. 그래서 도구는 렌더링 뒤 스토리에 실제로 적용된 args를 확인하고, 다르면 실패한다. `Parity` 스토리의 argTypes `options`에는 피그마 변형 값을 모두 넣는다.
  - 스토리의 글자는 피그마 예시 글자를 그대로 쓴다([[피그마 일치 검사:글자]]).
  - 상태 속성(`State`)도 args로 넘긴다. `Hover`·`Pressed`·`Focus`(`Hovered`·`Active`·`Focused`·`Focus visible`도 같다)는 컴포넌트에 강제로 상태를 주는 prop을 만들지 않고, 도구가 실제 마우스·키보드로 재현한다. Hover는 요소 가운데로 마우스를 옮기고, Pressed는 그 위에서 마우스 버튼을 누른 채 재고, Focus는 Tab 키로 포커스를 옮긴다(`:focus-visible`이 나오게). 실제 사용자가 보는 상태와 같은 코드 경로를 비교하기 위해서다.
  - `Rest`·`Disabled`·`Selected` 같은 나머지 상태는 args로만 재현한다. 스토리가 `state` arg를 `disabled` 같은 prop으로 옮긴다. 상호작용으로 재현하는 상태 값을 받으면 Rest와 같게 그린다.
  - 비교 요소는 `#storybook-root`의 첫 요소다. 포털로 그리는 컴포넌트나 감싸는 요소가 필요한 스토리는 비교할 요소에 `data-parity-target`을 단다.
글자: |
  글자 레이어는 내용, 구간별 서식, 실제 서체, 글자 스타일 변수를 비교한다.

  - 내용: 정확히 같아야 한다. 스토리는 피그마의 예시 글자(TEXT 컴포넌트 속성의 기본값 포함)를 그대로 쓴다. 문구가 다르면 줄바꿈과 말줄임이 달라져 같은 컴포넌트라고 말할 수 없기 때문이다.
  - 구간: 피그마는 글자 노드를 서식이 같은 연속 범위(`getStyledTextSegments`)로 나눠 내보낸다. 코드는 `data-figma` 요소 안의 글자를 앞에서부터 읽어 같은 토큰 클래스끼리 묶은 구간을 만들고, 두 구간 목록을 순서대로 비교한다. 안쪽 `<strong>` 같은 요소에는 표시가 필요 없다.
  - 서체: 글자 스타일 이름(`Body`, `Hangul/Body`)은 대응시키지 않는다. 글자마다 실제로 그린 서체를 비교한다. 피그마는 구간의 서체 이름(`fontName.family`)을, 브라우저는 테스트 중 글자를 하나씩 임시로 감싼 뒤 Chromium DevTools 프로토콜(CDP) `CSS.getPlatformFontsForNode`로 읽는다. 순서대로 같아야 하고, 공백 문자(유니코드 공백)는 모양이 없어 서체 비교에서 뺀다.
  - 크기·줄 높이·굵기·자간: 구간의 글자 스타일에 연결된 변수 이름이 코드 `type-*` 유틸리티가 쓰는 변수와 같아야 한다. `Body`와 `Hangul/Body`가 같은 변수에 연결되어 있으면 둘 다 `type-body`와 일치한다. 계산값도 그 변수 값과 같아야 한다.
  - 코드는 `type-*` 하나로 쓰고 한글·영문을 span으로 쪼개지 않는다. 브라우저가 [[디자인 기반:서체]]의 서체 목록에서 글자마다 서체를 고르므로 피그마에서 구간을 나눈 결과와 같아지고, 서체 비교가 이것을 확인한다.
  - 웹 폰트를 모두 받을 때까지(`document.fonts.ready`) 기다리고, 받지 못했으면 실패한다.
숨김 레이어: |
  숨긴(visible=false) 레이어는 네 가지로 나눈다.

  | 종류 | 예 | 처리 |
  |---|---|---|
  | (a) BOOLEAN 컴포넌트 속성으로 켜고 끄는 레이어 | Button `Show icon`, MenuItem `Show shortcut` | 정상이다. 아래처럼 속성을 바꾼 경우도 함께 비교한다 |
  | (b) 변형에 따라 보이고 안 보이는 레이어 | SearchBox Pill의 `bottom border` | 각 변형을 있는 그대로 비교한다 |
  | (c) 모든 변형에서 숨겼고 속성도 없는 레이어 | 없음 | 쓰이지 않는 레이어라 막는다("지우세요") |
  | (d) 속성 없이 숨겼는데 파일의 인스턴스에서 손으로 켜서 쓰는 레이어 | 없음 | 막는다("컴포넌트 속성으로 연결하세요") |

  - 피그마 속성 이름과 React prop 이름을 맞춘다. 속성 키의 `#id`를 떼고 camelCase로 쓴다(`Show icon` → `showIcon`).
  - 플러그인은 변형마다 BOOLEAN 속성을 하나씩 기본값과 반대로 바꾼 임시 인스턴스를 만들어 읽고, 그 레이어 정보를 export.json `cases`에 함께 넣는다. 임시 인스턴스는 읽은 뒤 지운다. 스토리도 같은 경우를 args로 두어 비교한다.
  - 어느 경우든 그 변형(또는 경우)에서 숨긴 레이어의 `data-figma` 요소가 화면에 보이면 실패다. 숨긴 레이어 경로는 export.json `hidden`에 있다.
  - 피그마 Components 페이지에는 사람이 볼 수 있게 속성을 켠 예시 인스턴스를 컴포넌트 세트 옆에 둔다.

  피그마 한계: 숨긴 노드는 자동 배치 자식이어도 크기 방식(`layoutSizing`)이 FIXED로 읽힌다(보이게 하면 HUG로 읽힌다). 그래서 플러그인은 숨긴 노드를 먼저 걸러 크기 검사 같은 구조 검사에 넣지 않는다. 처음 피그마를 정리할 때 숨긴 단축키 글자를 고정 크기로 잘못 보고 크기 변수를 만들었다가 되돌린 일이 있었다.
자산: |
  CSS로 그릴 수 없는 모양과 이미지는 Foundations의 이름 있는 자산 컴포넌트로 두고, 컴포넌트 안에서는 그 인스턴스를 쓴다. 묶음과 원본 위치는 [[디자인 기반:자산]]에서 정한다.

  | 묶음 | 내보내는 파일 | 코드 | 비교 |
  |---|---|---|---|
  | Icons, Shapes(한 가지 색) | SVG. 색을 `currentColor`로 바꾸고 색 변수 이름을 기록한다 | 자산 이름 + `text-<색 토큰>` | 자산 이름과 글자 색 클래스(계산값 포함) |
  | Illustrations(여러 색) | SVG 그대로 | 자산 이름 | 자산 이름과 파일 해시 |
  | Images(래스터) | PNG(배율 1) | 자산 이름 | 자산 이름과 파일 해시 |

  - 묶음은 원본 컴포넌트가 든 묶음 프레임(`group/<묶음>`)의 이름으로 정한다.
  - 플러그인은 내보내는 컴포넌트가 쓰는 자산을 `figma/assets/<묶음>/<자산>.<svg|png>`로 함께 내보낸다. SVG 안의 id는 내용으로 정해지는 이름으로 바꿔, 같은 모양이면 파일도 같게 한다.
  - 코드의 자산 파일(아이콘 SVG, 아크릴 노이즈 같은 이미지)은 손으로 복사하지 않고 이 파일에서 생성기가 만든다. 모양은 이 생성 사슬로 보장하므로 화면에서 모양을 비교하지 않는다. 아이콘 패키지(`@fluentui/react-icons`)를 따로 쓰지 않는 것도 이 때문이다. 피그마가 아이콘을 줄여 쓰거나 경로를 바꾸면 패키지 아이콘과 달라진다.
  - 여러 색 자산(Illustrations)의 SVG는 그라데이션(`linearGradient`, `radialGradient`)을 그대로 옮긴다. `Asset` 컴포넌트는 그라데이션 ID 앞에 요소마다 다른 접두어를 붙인다. 한 화면에 같은 자산이 둘 있어도 ID가 겹치지 않게 하기 위해서다(예: 검색 포커스 돋보기 `illustrations/icon-color-search.svg`).
  - 이미지는 이미지 해시로 자산 이름을 찾는다. 컴포넌트나 칠 스타일이 이름 있는 자산에 없는 이미지를 쓰면 막는다.
  - 컴포넌트 안에 자산이 아닌 호·별·다각형·선·불리언·벡터를 직접 그리면 막는다("Foundations 자산으로 만들어 인스턴스로 쓰세요"). 완전한 원과 사각형은 CSS(`rounded-*`)로 그리므로 허용한다.
겹쳐 놓기: |
  요소를 다른 요소 위에 겹쳐 놓는 경우를 셋으로 나눈다.

  1. 장식: 포커스 테두리처럼 컴포넌트 모양에 딸린 장식은 겹쳐 놓은 레이어로 그리지 않고 그 레이어의 선이나 효과 스타일로 표현한다. 버튼 포커스는 바깥쪽 선 한 겹이다([[디자인 기반:포커스 표현]]).
  2. 실행 중에 정해지는 위치: 창, 바탕화면 아이콘, 선택 상자, 팝업 위치는 컴포넌트 비교 대상이 아니다. 앱 코드가 실행 중에 정한다.
  3. 진짜 겹침(배지, 검색창 밑줄 등): 자동 배치 안의 절대 위치(ABSOLUTE) 자식만 허용한다.
     - 제약(constraints)을 위치 클래스에 대응한다. 왼쪽·위(MIN)는 `left-*`·`top-*`, 오른쪽·아래(MAX)는 `right-*`·`bottom-*`, 양쪽 늘이기(STRETCH)는 `inset-x-*`·`inset-y-*`, 가운데(CENTER)는 가운데에서 벗어난 거리다. 비례(SCALE)는 대응이 없어 막는다.
     - 거리 값(음수 포함)은 기본 간격 단계의 숫자 이름 토큰(`spacing/<숫자>`) 중 하나여야 한다([[디자인 기반:간격 단계]]). 피그마는 절대 위치의 거리를 변수에 연결할 수 없어(플러그인 API의 변수 연결 필드에 x·y·제약 거리가 없다), 플러그인이 값으로 숫자 토큰 이름을 찾는다. 용도 이름 토큰은 찾지 않는다. 같은 값이 여러 용도 이름에 있으면 하나로 정할 수 없기 때문이다. 단계에 없는 값은 막는다.
     - 양쪽 늘이기 축의 크기는 제약에서 나오는 크기라 고정 크기 변수 검사([[디자인 기반:크기 변수]])에서 뺀다. 피그마는 이 크기를 FIXED로 읽으므로, 플러그인이 제약 값으로 기계적으로 판단한다.
     - 예: SearchBox `bottom border`는 절대 위치이고, 제약은 가로 양쪽 늘이기와 세로 아래, 거리 0이다. 높이와 색은 변수에 연결한다. 루트는 내용 자르기를 켜 둥근 끝에서 밑줄이 일자로 잘린다. 코드는 `<span data-figma="bottom border" class="absolute inset-x-0 bottom-0 h-… bg-…">`와 루트 `overflow-hidden`이다.

  자동 배치가 아닌 프레임 안에 자식을 두는 수동 배치는 막는다([[디자인 기반:레이아웃]]).
상태 전환: |
  피그마 변형 사이의 프로토타입 전환(Rest → Hover 등)을 코드의 CSS 전환과 같은 이름으로 비교한다(M1).

  - 플러그인은 같은 컴포넌트 세트의 다른 변형으로 바뀌는(CHANGE_TO) 반응만 읽는다. 전환 시간과 이징은 값으로 모션 토큰 이름(`motion/duration/*`, `motion/easing/*`)을 찾는다. 피그마 반응은 변수에 연결할 수 없기 때문이다.
    - 토큰에 없는 값은 막는다.
    - Smart Animate·Dissolve가 아닌 전환 종류는 CSS 전환으로 옮길 수 없어 막는다.
    - 즉시 전환은 움직임이 없어 비교하지 않는다.
  - 비교 도구는 출발 변형과 도착 변형의 레이어를 비교해 바뀌는 역할(칠, 글자 색, 불투명도 등)을 찾고, 역할 → CSS 속성 표(`class-rules.ts`의 `transitionProperties`)로 전환할 속성을 정한다. 그다음 짝 요소에서 다음을 확인한다.
    - `transition-property`에 그 속성이 있다.
    - 시간·이징 클래스(`duration-faster`, `ease-fade` 등)를 쓰고, 계산값이 그 토큰 값과 같다.
  - 도착 상태에서 잰다. CSS는 바뀐 뒤 상태의 transition 값을 쓰기 때문이다. 글자 색은 상속되므로 조상 요소의 전환도 인정한다.
  - CSS로 부드럽게 바뀌지 않는 역할(`::before` 고리로 그리는 안쪽 선, 자산 바꿈, 배치 선택지, 글자 스타일 등)은 표에 제외로 적고 비교하지 않는다. 표에 없는 역할이 바뀌면 실패한다.
  - 예: SearchBox Pill Rest → Focused는 배경 색이 `duration-fast ease-direct-entrance`로 바뀌어야 한다. 증명 테스트는 전환 없음, 시간 다름, 이징 다름, 바뀌는 속성 빠짐이 모두 실패하는지 확인한다.

  비교하지 않는 움직임은 [[한계:애니메이션 비교 범위]]에 있다.
구조 검사: |
  플러그인은 내보내기 전에 변형마다 구조를 검사하고, 위반이 하나라도 있으면 그 컴포넌트를 내보내지 않는다. 코드와 같은 이름으로 비교할 수 없는 구조를 디자인 단계에서 고치게 하기 위해서다.

  막는 것:
  - 변수·스타일에 연결되지 않은 시각 값(칠, 선, 선 두께, 반경, 여백, 간격, 고정 크기, 불투명도, 글자 스타일). 효과는 효과 스타일로 묶어야 하고, 그라데이션·이미지 칠은 칠 스타일로만 쓴다. 칠 스타일 안의 층 색(재질 칠 스타일의 층 포함)도 색 변수에 연결되어 있어야 한다.
  - 수동 배치, GRID 자동 배치, 그룹, 자식 쌓임 순서 뒤집기([[디자인 기반:레이아웃]])
  - 슬롯(SLOT)에 넣은 칠·선·효과. 슬롯은 빈 자리다([[디자인 기반:레이아웃]]).
  - 단계에 없는 절대 위치 거리, 비례 제약([[피그마 일치 검사:겹쳐 놓기]])
  - 90° 배수가 아닌 회전, 뒤집기·기울이기 변환([[디자인 기반:회전]])
  - 자산이 아닌 호·별·다각형·선·불리언·벡터, 이름 있는 자산에 없는 이미지([[피그마 일치 검사:자산]])
  - 쓰이지 않는 숨김 레이어, 속성 없이 인스턴스에서 켜는 레이어, 숨긴 칠·선·효과([[피그마 일치 검사:숨김 레이어]])
  - 투명한 부분 뒤에도 표시하는 그림자([[디자인 기반:그림자]]), CSS로 그릴 수 없는 효과(노이즈, 텍스처, 점진 블러 등), 블렌드가 들어간 효과
  - 점선, 가변 두께·브러시 선, 벡터가 아닌 노드의 MITER가 아닌 선 꺾임, 모서리 스무딩
  - 마스크, 노드에 따로 지정한 변수 모드, 섞인 칠
  - 글자: 글꼴 누락(대체 글꼴로 그려짐), 글자 스타일 없는 구간, 기본이 아닌 밑줄 모양, OpenType 기능, 부호·목록 걸기, 줄 수 없는 말줄임
  - 형제끼리 겹치는 레이어 이름, 빈 이름([[피그마 일치 검사:짝짓기]])
  - 분류표에 없는 속성이나 값([[피그마 일치 검사:전수성]])

  전체 목록과 각 이유는 분류표(`tools/figma-plugin/src/rules/figma-properties.json`)와 구조 검사 코드가 가진다.

  알림(막지 않음): 파일에서 사용처가 0인 변수·스타일을 알려 준다. 화면 비교와 관계없는 정리 알림이라 내보내기를 막지 않는다.

  메시지 원칙:
  - 위반마다 위치(컴포넌트 / 변형 / 레이어 경로), 이유, 고칠 방법을 쓴다. 디자이너가 메시지만 보고 피그마에서 고칠 수 있어야 한다.
  - 결정 사항에서 나온 규칙이면 이유에 그 번호를 붙인다(예: `(D1)`, [[피그마 일치 검사:결정 사항]]).
  - 한 컴포넌트의 위반은 모두 한 번에 보여 준다. 하나 고치고 다시 내보내기를 반복하지 않게 하기 위해서다.
전수성: |
  피그마 속성을 하나도 빠뜨리지 않고 다루는지 테스트로 지킨다. 빠진 속성은 비교도 막기도 하지 않아, 피그마와 코드가 달라도 아무도 모르게 되기 때문이다.

  - 분류표(`tools/figma-plugin/src/rules/figma-properties.json`)는 플러그인 타입 정의(`@figma/plugin-typings`)의 화면 노드 속성을 모두 담는다. 처음 분류할 때(1.142.0) 시각 속성은 171개였고, 각각 변수, 스타일, 선택지, 자산, 막음, 결정 사항 중 하나로 나눴다. 나머지는 시각과 관계없는 속성이다.
  - 분류표는 값 단위까지 나눈다(예: 칠 종류 SOLID는 변수, 그라데이션은 스타일, 동영상은 막음). 분류표에 없는 속성이나 값을 만나면 구조 검사가 막는다.
  - 시각 속성마다 구조 검사·내보내기 코드의 어디서 다루는지 적어 둔다(`property-handling.ts`). 분류만 하고 코드가 다루지 않는 일을 막기 위해서다.
  - 타입 정의 버전을 올리면 테스트가 분류표의 기록 버전과 다르다는 것과 분류되지 않은 새 속성·값을 찾아 실패한다. 새 항목을 분류하고 다루는 곳을 적어야 통과한다.
비교할 수 없으면 실패: |
  알림만 남기고 통과하는 경우는 없다. "확인하지 못함"이 "같음"처럼 보이면 검사를 믿을 수 없기 때문이다.

  - 플러그인: 분류되지 않은 값이나 이름으로 표현할 수 없는 구조는 막는다([[피그마 일치 검사:구조 검사]]).
  - 비교 도구: 짝 요소를 찾지 못하거나, 대응표에 없는 이름이거나, 계산값을 읽지 못하거나, 웹 폰트를 받지 못했거나, 내보내기 자료가 계약과 다르면 그 변형을 실패로 남긴다.
  - 재질 효과 변형도 건너뛰지 않고 다른 변형과 같이 이름으로 비교한다([[디자인 기반:재질 효과]]).

  사용처가 0인 변수·스타일 알림은 비교가 아니라 피그마 파일 정리 알림이라 이 원칙과 관계없다.
결정 사항: |
  피그마 표현 가운데 어떻게 다룰지 사람이 정한 것들이다. 값은 `packages/design-system/scripts/parity/rules/decisions.ts` 한곳에 두고 플러그인 구조 검사와 비교 도구가 함께 읽는다. 결정이 바뀌면 그 파일만 고친다. 번호는 코드 주석과 위반 메시지가 같이 쓴다.

  | 번호 | 결정 | 규칙 |
  |---|---|---|
  | D1 | 겹쳐 놓기: 장식은 선·효과로, 실행 중 위치는 비교 밖, 진짜 겹침은 자동 배치 안 절대 위치만, 수동 배치는 막음 | [[피그마 일치 검사:겹쳐 놓기]] |
  | D2 | 한글 글자 스타일: 스타일 이름 대신 실제 서체와 연결 변수로 비교 | [[피그마 일치 검사:글자]] |
  | D3 | 글자 내용은 정확히 비교, 스토리는 피그마 예시 글자 | [[피그마 일치 검사:글자]] |
  | D4 | 숨김 레이어 네 종류 | [[피그마 일치 검사:숨김 레이어]] |
  | D5 | 그림자 투명 영역 뒤 표시 끔 | [[디자인 기반:그림자]] |
  | D6 | 그릴 수 없는 모양과 이미지는 자산 | [[피그마 일치 검사:자산]] |
  | D7 | GRID 자동 배치 막음 | [[디자인 기반:레이아웃]] |
  | D8 | 고정 크기는 크기 변수 | [[디자인 기반:크기 변수]] |
  | D9 | 회전은 90° 배수만 | [[디자인 기반:회전]] |
  | F1 | 버튼 포커스는 바깥쪽 선 한 겹(D1의 장식 표현을 고침) | [[디자인 기반:포커스 표현]] |
  | F2 | 검색창 밑줄은 진짜 겹침, 양쪽 늘이기 크기는 D8에서 뺌 | [[피그마 일치 검사:겹쳐 놓기]] |
  | G1 | 슬롯은 빈 자리(칠·선·효과 막음) | [[디자인 기반:레이아웃]] |
  | G2 | 사용처 0인 변수·스타일은 알림(막지 않음) | [[피그마 일치 검사:구조 검사]] |
  | G3 | FocusRect 컴포넌트를 지우고 IconButton도 바깥쪽 선 | [[디자인 기반:포커스 표현]] |
  | G4 | 이미지는 이름 있는 이미지 자산만, 코드 이미지는 생성 | [[피그마 일치 검사:자산]] |
  | M1 | 변형 사이 전환은 모션 토큰 이름과 전환 속성으로 비교 | [[피그마 일치 검사:상태 전환]] |
피그마 플러그인: |
  비공개 개발용 플러그인으로 만들고 `tools/figma-plugin`에 둔다([[저장소 구성:구성]]).

  - 검사·내보내기 핵심(`src/core`)은 피그마 API만 쓰고 GitHub와 UI를 모른다. 플러그인 UI와 피그마 MCP(`use_figma`)가 같은 핵심을 쓰고, MCP에서는 핵심을 스크립트 하나로 묶어 실행한다. AI 작업 세션이 피그마를 고친 뒤 플러그인으로 내보낼 때와 같은 검사 결과를 바로 볼 수 있게 하기 위해서다.
  - 내보내기 전에 구조 검사를 한다([[피그마 일치 검사:구조 검사]]). 위반이 있는 컴포넌트는 파일을 만들지 않는다.
  - 컴포넌트마다 레이어 정보(export.json), 변형 PNG, 그 컴포넌트가 쓰는 자산을 내보낸다. 형식은 [[피그마 일치 검사:export.json 계약]]에서 정한다. 변형 PNG는 사람이 PR에서 바뀐 디자인을 보는 자료이고 판정에는 쓰지 않는다.
  - BOOLEAN 속성 경우를 읽을 때만 임시 인스턴스를 만들고 끝나면 반드시 지운다. 피그마 파일에 남는 변경은 없다.
  - Variables를 읽어 토큰 JSON으로 내보낸다. Figma REST API의 Variables 엔드포인트는 Enterprise 플랜 전용이지만, 플러그인 API는 플랜과 상관없이 Variables를 읽을 수 있다.
  - 토큰 JSON은 W3C 디자인 토큰 형식(DTCG)으로 쓴다. 토큰마다 `$value`와 `$type`을 두고, 다른 토큰을 가리키는 값은 `{color.gray.f9f9f9}`처럼 경로로 남긴다. 피그마 공식 예제 플러그인과 커뮤니티 내보내기 플러그인 대부분이 쓰는 형식이다.
  - 글자 스타일과 효과 스타일(재질, 그림자)은 Variables가 아니라 스타일이라 따로 읽어 같은 파일에 넣는다. 피그마 기본 내보내기 기능은 이런 묶음 토큰을 아직 다루지 못하고, 손으로 실행해야 해 자동화에도 맞지 않는다.
  - 컴포넌트마다 이름 정보 해시를 계산하고, 커밋할 브랜치의 그 컴포넌트 폴더와 비교해 해시가 바뀐 변형의 PNG와 export.json만 커밋한다. PNG는 사람이 보는 이미지이고, 피그마가 내보낼 때마다 바이트가 조금씩 달라져 해시에 넣지 않는다. 사라진 변형의 파일은 그 컴포넌트 폴더에서만 지운다.
  - 플러그인은 사용자가 실행했을 때만 동작하므로, 피그마 작업을 마치면 내보내기를 직접 실행한다.
  - 기본은 `main`에서 새 브랜치(`chore/figma-export-<날짜>-<시각>`)를 만들고 커밋해 PR을 연다. 기존 브랜치 이름을 넣으면 그 브랜치 끝에 이어서 커밋하고 PR을 새로 열지 않는다.
  - 이 저장소에만 권한이 있는 GitHub fine-grained 토큰과 마지막으로 쓴 기존 브랜치 이름을 플러그인 로컬 저장소에 보관한다.
  - 내보낸 자료는 `packages/design-system/figma/`에 둔다([[저장소 구성:디자인 시스템 패키지 구조]]).
export.json 계약: |
  플러그인이 쓰고 비교 도구가 읽는 파일이다. 손으로 고치지 않는다. 피그마 이름과 선택지만 담고, 위치 좌표나 측정값은 담지 않는다. 이름을 코드 클래스로 바꾸는 규칙은 비교 도구가 가진다([[피그마 일치 검사:비교 규칙]]).

  - `figma/figma.json`: 바뀌지 않는 전역 값 `{ fileKey, scale }`(PNG 배율).
  - `figma/components/<컴포넌트>/export.json`: `name`, `nodeId`, `hash`, `booleans`(prop 이름 → 피그마 속성 키와 기본값), `variants`. 변형마다 `nodeId`, `properties`, `hash`(비교에 쓰는 이름 정보 `properties`·`layers`·`hidden`·`cases`·`transitions`의 해시. PNG는 넣지 않는다), `layers`, `hidden`(숨긴 레이어 경로), `cases`(BOOLEAN 경우마다 `layers`와 `hidden`, 키는 `showIcon=true` 꼴), `transitions`(전환마다 `trigger`, `to`, `type`, `duration`·`easing` 토큰 이름. 전환이 없으면 키를 두지 않는다, [[피그마 일치 검사:상태 전환]]).
  - 같은 폴더에 변형 PNG(`<변형>.png`)를 둔다. 다른 컴포넌트와 파일을 나눠 쓰지 않는다.
  - `figma/assets/<묶음>/<자산>.<svg|png>`: 자산 파일([[피그마 일치 검사:자산]]).
  - JSON은 키를 정렬해 쓴다. 같은 내용이면 파일도 같게 하기 위해서다.

  `layers`는 변형 루트(첫 항목, `path: ""`)와 그 아래 보이는 레이어를 문서 순서로 담는다. 레이어마다 다음을 담는다.
  - `path`(레이어 경로), `type`(노드 종류), `parentLayout`(부모 자동 배치 방향), `sizing`(가로·세로 크기 방식과 고정 크기의 변수 이름)
  - `fill`(칠 변수나 칠 스타일 이름), `stroke`(칠 이름, 정렬, 레이아웃 포함 여부, 변마다 두께 변수), `radius`(모서리마다 변수), `effect`(효과 스타일 이름), `opacity`(변수), `blendMode`, `rotation`, `clipsContent`
  - `layout`(방향, 줄바꿈, 정렬, 여백 변수, 간격 변수)
  - `self`(부모 안에서의 정렬, 절대 위치면 축마다 제약과 거리 토큰)
  - `text`(내용, 정렬, 자동 크기, 최대 줄 수, 구간마다 범위·서체·글자 스타일·연결 변수·칠·밑줄)
  - `asset`(자산 이름, 묶음, 처리 방식, 파일, 한 가지 색이면 색 변수). 자산 인스턴스는 자식을 담지 않는다.
토큰 생성: |
  `figma/tokens.json`에서 `src/tokens.css`를 저장소의 스크립트로 만든다. 플러그인은 JSON만 올리고 CSS는 만들지 않는다.

  - WinUI 경로 이름을 Tailwind 이름으로 바꾼다(예: `text-fill/primary` → `--color-text-fill-primary`).
  - 별칭은 실제 값으로 풀지 않고 `var()` 참조로 남긴다. Primitive → Semantic → Component 단계가 CSS에서도 보이고, Primitive 값 하나만 바뀌면 생성 파일도 한 줄만 바뀐다.
  - 그라데이션 정지점 사이 색은 피그마가 투명도를 곱하지 않고 섞고, CSS는 투명도를 곱한 값으로 섞는다. 투명도와 RGB가 모두 다른 두 정지점 사이(예: 흰색 8% → 검정 40%인 `Elevation/Accent Control Border`)는 결과가 달라지므로, 피그마 방식으로 계산한 중간 정지점 4개를 실제 색 값으로 넣는다. 양 끝 정지점은 `var()` 참조로 남는다.
  - Tailwind에 이름공간이 없는 것(선 두께, 바깥 선 두께, 그라데이션 테두리, 재질)은 `@utility`로 만든다. 컴포넌트가 쓰는 클래스 이름이 [[피그마 일치 검사:비교 규칙]]의 기대 클래스와 같아야 하기 때문이다.
  - 스크립트는 직접 작성하고 Vitest 테스트를 붙인다. 출력 대상이 웹 CSS 하나뿐이고 이름 규칙이 이 프로젝트에만 있어, 범용 도구가 대신해 주는 부분이 적기 때문이다.
  - CI는 생성 파일이 `tokens.json`과 맞는지 검사한다. 플러그인 PR에서 토큰이 바뀌면 같은 PR에서 생성 파일도 함께 바뀐다.

  스크립트는 `packages/design-system/scripts/tokens/`에 있다. `pnpm --filter @seojaewan/design-system generate:tokens`로 만들고, `generate:tokens --check`는 파일을 쓰지 않고 다르면 실패한다. CI 검사는 단위 테스트(`pnpm test`)가 같은 비교를 한다. `figma/tokens.json`이 아직 없으면 둘 다 건너뛰고 커밋된 `tokens.css`를 그대로 쓴다.

  `tokens.css`에는 모든 토큰을 담은 `@theme static` 블록 하나와 생성 유틸리티(`@utility`)만 있다. `static`은 유틸리티에서 쓰지 않은 변수도 CSS에 남겨, 손으로 쓴 CSS와 인라인 스타일이 `var()`로 참조할 수 있게 한다.
  Tailwind 기본값 지우기(`--color-*: initial` 등)는 `theme.css`가 `tokens.css`보다 먼저 한다. Tailwind는 `initial`보다 앞에 정의된 같은 이름공간 변수를 지우므로 순서가 바뀌면 토큰이 사라진다.

  | 피그마 이름 | CSS 이름 | Tailwind 유틸리티 |
  |---|---|---|
  | `color/gray/f9f9f9`(Primitive) | `--color-gray-f9f9f9` | `bg-gray-f9f9f9` 등(컴포넌트에서는 쓰지 않는다) |
  | `text-fill/primary` 등 Semantic·Component 색 | `--color-text-fill-primary` | `text-text-fill-primary`, `bg-*`, `border-*` |
  | `spacing/12` | `--spacing-12` | `p-12`, `gap-12` 등(값은 px) |
  | `size/control/height` | `--spacing-control-height` | `h-control-height`, `size-*`, `w-*` |
  | `radius/control` | `--radius-control` | `rounded-control` |
  | `stroke-width/default` | `--border-width-default` | 생성 유틸리티(선 두께, 바깥 선 두께) |
  | `blur/acrylic` | `--blur-acrylic` | `blur-acrylic`, `backdrop-blur-acrylic` |
  | `opacity/cut` (50) | `--opacity-cut: 50%` | `opacity-cut` |
  | `font/family/base` | `--font-base: 'Open Sans', var(--font-korean)` | `font-base` |
  | `font/family/korean` | `--font-korean: 'Pretendard'` | `font-korean` |
  | `font/weight/semibold` | `--font-weight-semibold` | `font-semibold` |
  | `font/size/body` | `--text-body` | `text-body`(같은 이름의 줄 높이를 함께 정한다) |
  | `font/line-height/body` | `--leading-body`, `--text-body--line-height` | `leading-body` |
  | `motion/duration/fast` | `--motion-duration-fast`, `--transition-duration-fast` | `duration-fast` |
  | `motion/easing/direct-entrance` | `--motion-easing-direct-entrance`, `--ease-direct-entrance` | `ease-direct-entrance` |
  | `motion/scale/*`, `motion/delay/*` | `--motion-scale-*`, `--motion-delay-*` | 없음(`var()`로 쓴다) |
  | 글자 스타일 `Body Strong` | 없음 | `type-body-strong`(서체·크기·굵기·줄 높이·자간) |
  | 글자 스타일 `Hangul/*` | 없음 | 만들지 않는다. 라틴 스타일과 같은 변수에 연결돼 있으면 같은 `type-*`로 본다([[피그마 일치 검사:글자]]) |
  | 효과 스타일 `Elevation/Card` | `--shadow-elevation-card` | `shadow-elevation-card` |
  | 효과 스타일 `Text/*` | `--text-shadow-*` | `text-shadow-*` |
  | 효과 스타일의 배경 블러(`Material/Acrylic`) | `--backdrop-blur-material-acrylic` | `backdrop-blur-material-acrylic` |
  | 효과 스타일의 레이어 블러 | `--blur-*` | `blur-*` |
  | 단색 칠 스타일 `Material/Fallback/Acrylic Default` | `--color-material-fallback-acrylic-default` | 색 유틸리티 |
  | 그라데이션 칠 스타일 `Elevation/Control Border` | `--gradient-elevation-control-border` | `border-gradient-elevation-control-border`([[디자인 기반:컨트롤 테두리]]) |
  | 층이 여럿인 재질 칠 스타일 `Material/Acrylic Default`, `Material/Acrylic Base` | 층마다 색 변수 | `material-acrylic-default`, `material-acrylic-base`(생성 유틸리티, [[디자인 기반:재질 효과]]). `Material/Mica *`는 창 컴포넌트를 만들 때까지 만들지 않는다(이유는 `tokens.css` 주석) |

  피그마 블렌드 모드(LUMINOSITY, COLOR, NORMAL 등)를 CSS `mix-blend-mode` 값으로 옮기는 표는 `scripts/parity/rules/class-rules.ts`의 `FIGMA_BLEND_MODE_CSS` 한곳에 있고, 생성기와 비교 도구가 함께 쓴다.

  - 스타일 이름의 공백과 괄호는 `-`가 된다(`Surface/Flyout (Acrylic)` → `--shadow-surface-flyout-acrylic`, `--backdrop-blur-surface-flyout-acrylic`).
  - 라틴 서체 변수에는 `font/family/korean`을 이어 붙인다([[디자인 기반:서체]]).
  - Motion 변수의 코드 이름은 `--motion-*`이고([[디자인 기반:모션]]), Tailwind 유틸리티가 읽는 이름은 그것을 참조한다.
  - 피그마 배경 블러 값은 그대로 옮긴다.
  - 정해진 규칙이 없는 변수 묶음(예: `font/stretch/*`)이나, 서로 다른 토큰이 같은 CSS 이름이 되는 경우는 생성이 실패한다. 이름 규칙을 이 표에 먼저 정한다.
비교 범위: |
  - 컴포넌트 단위로 비교한다. 화면 단위는 비교하지 않는다([[미결 사항:화면 단위 시각 검증]]).
  - PR에서는 `main` 대비 바뀐 파일에 영향받는 컴포넌트만 비교한다. 플러그인이 바꾼 컴포넌트 폴더도 포함한다.
  - 토큰·전역 스타일이 바뀌면 모든 컴포넌트에 영향을 주므로 전체를 비교한다.

  영향 범위는 git diff로 단순하게 고른다(`test:parity --affected`). 기준 커밋은 기준 브랜치(CI는 PR의 대상 브랜치, 로컬은 `origin/main` 또는 `main`)와의 merge-base이고, 커밋하지 않은 변경과 추적하지 않는 새 파일도 포함한다.

  - 전체 비교: `src/theme.css`·`src/tokens.css`·`src/fonts.css`, `figma/tokens.json`·`figma/figma.json`, `.storybook/`, 패키지 `package.json`·`tsconfig.json`, 비교 스크립트(`scripts/parity/`), `pnpm-lock.yaml`, 그리고 `src/components/` 밖의 디자인 시스템 소스.
  - 컴포넌트 비교: `src/components/<컴포넌트>/`의 파일(테스트·fixture 제외), `figma/components/<컴포넌트>/`의 파일.
  - 바뀐 컴포넌트를 상대 경로(`../menu-item/...`)로 import하는 컴포넌트도 거슬러 올라가며 함께 비교한다.

  한계: 의존 관계는 컴포넌트 폴더 사이의 상대 import만 따라간다. 공개 진입점을 거쳐 import하거나, CSS·자산 파일을 통해 영향을 주는 경우는 찾지 못한다. 그래서 컴포넌트 폴더 밖의 소스 변경은 전체 비교로 처리한다. `main` 병합 뒤 전체 비교는 두지 않는다. 피그마 쪽 변경은 항상 PR로 들어오고, 넓은 영향을 주는 변경은 PR에서 이미 전체를 비교하기 때문이다.
CI 비교: |
  비교 도구는 Playwright Test로 돈다. 저장소의 피그마 내보내기 자료와 Storybook 스토리를 비교하므로 CI에 피그마 토큰이 필요 없다.

  - Storybook을 정적으로 빌드(`storybook-static`)하고 도구 안의 작은 정적 서버로 띄운다. 개발 서버보다 결과가 매번 같다.
  - Chromium에서 [[피그마 일치 검사:스토리 규칙]]대로 변형과 상태를 재현하고, [[피그마 일치 검사:짝짓기]]대로 요소를 찾아 클래스 이름과 계산값을 읽는다. 글자 서체는 CDP로 읽는다.
  - 판정은 [[피그마 일치 검사:비교 규칙]]을 따른다. 그림을 비교하지 않으므로 운영체제마다 다른 글자 렌더링이 결과를 바꾸지 않는다.
  - 결과는 `parity-results/`에 남기고 CI 아티팩트로 올린다.

  실행: `pnpm --filter @seojaewan/design-system test:parity`. Storybook을 빌드한 뒤 비교한다.
  - `--affected [--base <브랜치>]`: [[피그마 일치 검사:비교 범위]]대로 영향받는 컴포넌트만 비교한다.
  - `--component <폴더 이름>`: 그 컴포넌트만 비교한다(여러 번 쓸 수 있다).
  - `--no-build`: 이미 빌드한 `storybook-static`을 쓴다.
  - Chromium이 없으면 `pnpm --filter @seojaewan/design-system exec playwright install chromium`으로 설치한다.

  CI는 PR에서만 `Figma parity` 작업을 `--affected`로 돌린다. `main` push에서는 돌리지 않는다. `figma/figma.json`이 아직 없으면 설치 없이 건너뛴다.

  PR 댓글:
  - CI는 결과를 PR 댓글 하나로 남기고(숨은 표시 `<!-- figma-parity -->`), 실행할 때마다 그 댓글을 고친다. 모두 통과하면 한 줄 통과 메시지로 바꾼다.
  - 머리말은 `피그마 일치 검사: N개 중 M개 실패`이고, 컴포넌트마다 접힌 블록(`<details>`)에 실패를 한 줄씩 쓴다. 한 줄은 레이어, 역할, 피그마가 정한 이름, 코드에서 찾은 것이다. 같은 실패 줄은 변형을 묶어 한 번만 쓰고, 실패는 하나도 빼지 않는다.
  - 참고 이미지를 붙일 때는 그 이미지만 담은 브랜치 `parity-report/pr-<번호>`에 올리고 PR이 닫히면 지운다(`parity-report-cleanup` 워크플로). GitHub API로 댓글에 이미지를 직접 올릴 수 없기 때문이다.
  - 댓글이 길이 제한(65,536자, 여유를 두어 60,000자)을 넘으면 이미지를 먼저 빼고, 그래도 넘으면 번호를 붙인 댓글로 이어 쓴다.
  - 작업 권한은 `contents: write`(보고 브랜치)와 `pull-requests: write`(댓글)만 준다. 포크에서 온 PR은 쓰기 토큰이 없어 댓글을 남기지 않는다.
검토한 대안: |
  2026-10-21~22에 Button, MenuItem, Flyout, SearchBox로 시험했다. 엔진 차이나 형식 번역이 끼는 방법은 모두 같은 벽에 부딪혀, 같은 이름을 썼는지로 비교하는 방식을 골랐다([[비교 원리]]).

  - 픽셀 비교(피그마 PNG ↔ Storybook 스크린샷, pixelmatch): 엄격한 기준(색 차이 0, 허용 픽셀 0)에서는 정상 48개 변형이 모두 실패했다. 피그마는 글리프를 소수 위치에 두고 Chromium은 정수에 맞추며, 모서리 안티앨리어싱과 그림자 경계도 엔진마다 다르기 때문이다. 정상이 통과하도록 느슨하게 하면 여백 +1px·반경 +1px 실수를 놓쳤다. 게다가 피그마 PNG는 같은 디자인을 다시 내보내도 48개 모두 바이트가 달랐고(최대 11,245픽셀), 기준 이미지가 고정되지 않았다.
  - 인지 비교(pixelmatch 문턱값과 안티앨리어싱 제외, SSIM, 차이 덩어리 크기): 2026-10-22에 Button 정상 18개와 일부러 틀린 버전 28개로 시험했다. 큰 실수 14개를 모두 잡으면서 정상을 모두 통과시키는 기준은 하나뿐이었고, 정상과 실수의 간격(SSIM 0.04, 회색 바탕 차이 0.26%p)이 글자 가장자리 번짐 정도라 운영체제나 브라우저 설정이 바뀌면 뒤집힌다. 반투명 배경 색 차이는 흰 바탕에서 보이지 않았고, 반경 +1·배경 한 단계·글자 하나 바꿈은 어떤 지표로도 잡지 못했다. 문턱값을 사람이 정해야 하는 점도 값 비교와 같은 문제라 판정에 쓰지 않는다.
  - 값 비교(피그마 레이어 속성 ↔ `getComputedStyle`·측정값): 위치·크기·여백·색을 숫자로 비교하는 방식은 동작했다. 그러나 피그마 속성과 CSS 값을 짝짓는 규칙(글자 상자 반올림, 잉크 영역, 반경 줄이기 등)이 주관적이고, 컴포넌트를 더할 때마다 예외가 늘어 유지할 수 없어 내려놓았다.
  - 피그마 SVG를 Chromium에서 그려 비교: 같은 엔진이라 엔진 차이는 없지만 49개 중 2개만 일치했다. 일부러 틀린 버전(그라데이션 선을 단색으로)이 차이 0으로 나와 맞는 버전과 구분되지 않았고, SVG로 표현할 수 없는 것(배경 블러, 밑줄 클립, 점선)도 있다.
  - Figma Sites로 내보낸 HTML을 기준으로 쓰기: 글자와 모서리는 완전히 일치했으나 그라데이션 테두리를 단색으로 바꾸고, 색을 소수 둘째 자리로 반올림하고, 글꼴을 포함하지 않아 기준으로 쓸 수 없다.
  - Dev Mode 코드 생성(MCP `get_design_context`)을 기준으로 쓰기: 그라데이션을 단색으로 바꾸고, 테두리가 크기를 차지해 버튼 높이가 34px이 되고, 색을 반올림해 맞지 않았다. Inspect CSS(`getCSSAsync`)는 MCP 환경에서 막혀 시험하지 못했다.
  - HTML을 피그마로 변환해 비교하거나 피그마 엔진으로 코드를 그리기: 변환에서 번역 손실이 생기고, 피그마 렌더러를 코드에 쓰는 공개 API가 없다.
  - 기존 도구: 값 단위로 비교하는 도구는 신생이고 범위가 좁다(변형·상태 미지원). 성숙한 도구는 이미지 비교(Percy, Applitools)와 토큰 동기화이고, 컴포넌트 수준의 디자인–코드 일치는 업계에서도 아직 풀지 못한 문제로 본다.
  - Figma REST API로 CI가 매번 자료를 받기: CI에 피그마 토큰이 필요하고, 피그마만 먼저 바뀌면 모든 PR이 실패한다. Variables는 Enterprise 플랜이 아니면 읽을 수 없다.
  - 별도 브랜치에 기준 자료를 계속 덮어쓰기: 어느 코드가 어느 시점의 피그마를 기준으로 했는지 연결이 끊기고, 디자인 변경과 상관없는 PR까지 실패한다.
  - 코드 기준 회귀 테스트 + 사람 리뷰(Chromatic 등 업계에서 흔한 방식): 기준이 피그마가 아니라 이전 코드라 처음 만든 컴포넌트가 피그마와 달라도 잡지 못한다.
  - 토큰도 플러그인 대신 피그마 MCP로만 읽기: MCP는 AI 작업 세션 안에서만 쓸 수 있어 토큰 변경이 PR에 남지 않고 CI가 검사할 수 없다. 그래서 MCP는 플러그인과 같은 내보내기 코드를 돌리는 데만 쓴다.
  - 하나의 `figma/export.json`에 모든 컴포넌트 기록: 서로 다른 컴포넌트를 내보낸 PR이 같은 파일을 고쳐 충돌하므로 컴포넌트마다 폴더로 나눴다.
  - 토큰 생성에 Style Dictionary 쓰기: 토큰 JSON을 여러 플랫폼 코드로 바꾸는 업계 표준 도구다. 출력 대상이 웹 하나뿐이고 Tailwind v4 `@theme` 출력과 WinUI 이름 규칙은 어차피 직접 써야 해 고르지 않았다. 토큰이 복잡해지거나 다른 플랫폼이 생기면 다시 검토한다.
