_codocs:
  id: figma-parity
  name: 피그마 일치 검사
  parent:
    - 개발 컨벤션
개요: |
  디자인 시스템 컴포넌트가 피그마 디자인과 같은지 자동으로 확인하는 방법이다.
  피그마가 디자인의 기준이라는 원칙을 테스트로 강제하고, 한번 맞춘 컴포넌트가 이후 변경으로 깨지지 않게 지킨다.
흐름: |
  1. 디자인이 바뀔 때: 피그마에서 컴포넌트를 고친 뒤 전용 피그마 플러그인으로 내보낸다. 플러그인은 바뀐 컴포넌트 이미지와 토큰 JSON을 커밋해 PR을 연다.
  2. 그 PR의 CI는 바뀐 컴포넌트를 비교한다. 코드가 아직 그대로라 실패하며, 실패한 컴포넌트가 구현해야 할 목록이 된다.
  3. 같은 PR에서 컴포넌트 코드를 고쳐 비교를 통과시킨 뒤 병합한다. 디자인 변경과 코드 변경이 한 PR에 남는다.
  4. 코드가 바뀔 때: 병합된 피그마 이미지는 저장소의 기준 이미지가 된다. 이후 디자인 시스템 컴포넌트를 건드리는 PR은 영향받는 컴포넌트를 기준 이미지와 비교한다. 피그마와 달라졌는데 의도한 변경이면 피그마부터 고치고 1번 흐름을 탄다.

  피그마 쪽 변경은 항상 PR로만 들어오므로, 피그마만 바뀌고 코드가 모르는 상황이 생기지 않는다. 그래서 정기적인 전체 비교는 두지 않는다.
비교 범위: |
  - 컴포넌트 단위로 비교한다. 화면 단위는 비교하지 않는다([[미결 사항]]).
  - PR에서는 `main` 대비 바뀐 파일에 영향받는 스토리만 비교한다. 플러그인이 올린 기준 이미지가 바뀐 컴포넌트도 포함한다.
  - 토큰·전역 스타일이 바뀌면 모든 컴포넌트에 영향을 주므로 전체를 비교한다.

  영향 범위는 git diff로 단순하게 고른다(`test:parity --affected`). 기준 커밋은 기준 브랜치(CI는 PR의 대상 브랜치, 로컬은 `origin/main` 또는 `main`)와의 merge-base이고, 커밋하지 않은 변경과 추적하지 않는 새 파일도 포함한다.

  - 전체 비교: `src/theme.css`·`src/tokens.css`·`src/fonts.css`, `figma/tokens.json`, `.storybook/`, 패키지 `package.json`·`tsconfig.json`, 비교 스크립트(`scripts/parity/`), `pnpm-lock.yaml`, 그리고 `src/components/` 밖의 디자인 시스템 소스.
  - 컴포넌트 비교: `src/components/<컴포넌트>/`의 파일(테스트·fixture 제외), `figma/images/<컴포넌트>/`, `figma/export.json`에서 항목이 바뀐 컴포넌트.
  - 바뀐 컴포넌트를 상대 경로(`../menu-item/...`)로 import하는 컴포넌트도 거슬러 올라가며 함께 비교한다.

  한계: 의존 관계는 컴포넌트 폴더 사이의 상대 import만 따라간다. 공개 진입점을 거쳐 import하거나, CSS·자산 파일을 통해 영향을 주는 경우는 찾지 못한다. 그래서 컴포넌트 폴더 밖의 변경은 전체 비교로 처리한다. `main` push에서는 전체를 비교해 PR에서 놓친 영향을 잡는다.
스토리 규칙: |
  피그마 변형 하나를 Storybook 스토리와 args 하나로 짝짓는 규칙이다. 비교 스크립트는 이 규칙대로 스토리를 찾고, 맞지 않으면 실패한다.

  - 컴포넌트마다 `src/components/<컴포넌트>/<컴포넌트>.stories.tsx`에 이름이 `Parity`인 스토리를 하나 둔다. 변형마다 스토리를 만들지 않고 args로 변형을 고른다. 변형이 늘어도 스토리 파일을 고칠 일이 적게 하기 위해서다.
  - 피그마 변형 속성 이름은 camelCase arg 이름이 된다(`Variant` → `variant`, `Show Icon` → `showIcon`). 값은 이미지 파일 이름과 같은 규칙으로 정규화한 문자열이다(`Accent` → `accent`, `Chrome more (Mobile)` → `chrome-more-mobile`). `True`·`False`는 boolean이다.
  - Storybook은 argTypes `options`에 없는 URL args를 조용히 버린다. 그래서 스크립트는 렌더링 뒤 스토리에 실제로 적용된 args를 확인하고, 다르면 실패한다. `Parity` 스토리의 argTypes `options`에는 피그마 변형 값을 모두 넣는다.
  - 상태 속성(`State`)도 args로 넘긴다. `Hover`·`Pressed`·`Focus`(`Hovered`·`Active`·`Focused`·`Focus visible`도 같다)는 컴포넌트에 강제로 상태를 주는 prop을 만들지 않고, 스크립트가 실제 마우스·키보드로 재현한다. Hover는 요소 가운데로 마우스를 옮기고, Pressed는 그 위에서 마우스 버튼을 누른 채 찍고, Focus는 Tab 키로 포커스를 옮긴다(`:focus-visible`이 나오게). 실제 사용자가 보는 상태와 같은 코드 경로를 비교하기 위해서다.
  - `Rest`·`Disabled`·`Selected` 같은 나머지 상태는 args로만 재현한다. 스토리가 `state` arg를 `disabled` 같은 prop으로 옮긴다. 상호작용으로 재현하는 상태 값을 받으면 Rest와 같게 그린다.
  - 비교하는 요소는 `#storybook-root`의 첫 요소다. 포털로 그리는 컴포넌트나 감싸는 요소가 필요한 스토리는 비교할 요소에 `data-parity-target`을 단다.
  - 스크립트는 `#storybook-root`를 정수 위치에 두고 폭을 피그마 노드 폭으로 정한다. 부모 폭을 채우는 컴포넌트도 피그마와 같은 폭이 된다. 요소 크기가 피그마 노드 크기와 다르면 실패한다.
피그마 플러그인: |
  비공개 개발용 플러그인으로 만들고 `tools/figma-plugin`에 둔다([[저장소 구성:구성]]).
  플러그인은 기준 이미지와 토큰만 내보낸다. 컴포넌트의 구조와 값(패딩, 배치, 쓰는 토큰)은 코드로 옮길 때 피그마 MCP로 읽는다.

  - 컴포넌트를 일정한 배율과 배경으로 PNG로 내보낸다(`exportAsync`).
  - Variables를 읽어 토큰 JSON으로 내보낸다. Figma REST API의 Variables 엔드포인트는 Enterprise 플랜 전용이지만, 플러그인 API는 플랜과 상관없이 Variables를 읽을 수 있다.
  - 토큰 JSON은 W3C 디자인 토큰 형식(DTCG)으로 쓴다. 토큰마다 `$value`와 `$type`을 두고, 다른 토큰을 가리키는 값은 `{color.gray.f9f9f9}`처럼 경로로 남긴다. 피그마 공식 예제 플러그인과 커뮤니티 내보내기 플러그인 대부분이 쓰는 형식이다.
  - 글자 스타일과 효과 스타일(재질, 그림자)은 Variables가 아니라 스타일이라 따로 읽어 같은 파일에 넣는다. 피그마 기본 내보내기 기능은 이런 묶음 토큰을 아직 다루지 못하고, 손으로 실행해야 해 자동화에도 맞지 않는다.
  - 컴포넌트마다 내용 해시를 계산해 바뀐 컴포넌트만 다시 내보낸다.
  - 플러그인은 사용자가 실행했을 때만 동작하므로, 피그마 작업을 마치면 내보내기를 직접 실행한다.
  - 브랜치를 만들고 커밋해 PR을 연다. 이 저장소에만 권한이 있는 GitHub fine-grained 토큰을 플러그인 로컬 저장소에 보관한다.
  - 이미지와 토큰 JSON은 `packages/design-system/figma/`에 두고, 내보낸 피그마 파일 버전을 함께 기록한다([[저장소 구성:디자인 시스템 패키지 구조]]).
토큰 생성: |
  `figma/tokens.json`에서 `src/tokens.css`의 `@theme` 블록을 저장소의 스크립트로 만든다. 플러그인은 JSON만 올리고 CSS는 만들지 않는다.

  - WinUI 경로 이름을 Tailwind 이름으로 바꾼다(예: `text-fill/primary` → `--color-text-fill-primary`).
  - 별칭은 실제 값으로 풀지 않고 `var()` 참조로 남긴다. Primitive → Semantic → Component 단계가 CSS에서도 보이고, Primitive 값 하나만 바뀌면 생성 파일도 한 줄만 바뀐다.
  - 스크립트는 직접 작성하고 Vitest 테스트를 붙인다. 출력 대상이 웹 CSS 하나뿐이고 이름 규칙이 이 프로젝트에만 있어, 범용 도구가 대신해 주는 부분이 적기 때문이다.
  - CI는 생성 파일이 `tokens.json`과 맞는지 검사한다. 플러그인 PR에서 토큰이 바뀌면 같은 PR에서 생성 파일도 함께 바뀐다.

  스크립트는 `packages/design-system/scripts/tokens/`에 있다. `pnpm --filter @seojaewan/design-system generate:tokens`로 만들고, `generate:tokens --check`는 파일을 쓰지 않고 다르면 실패한다. CI 검사는 단위 테스트(`pnpm test`)가 같은 비교를 한다. `figma/tokens.json`이 아직 없으면 둘 다 건너뛰고 커밋된 `tokens.css`를 그대로 쓴다.

  `tokens.css`에는 모든 토큰을 담은 `@theme static` 블록 하나와 글자 스타일 `@utility`만 있다. `static`은 유틸리티에서 쓰지 않은 변수도 CSS에 남겨, 손으로 쓴 CSS와 인라인 스타일이 `var()`로 참조할 수 있게 한다.
  Tailwind 기본값 지우기(`--color-*: initial` 등)는 `theme.css`가 `tokens.css`보다 먼저 한다. Tailwind는 `initial`보다 앞에 정의된 같은 이름공간 변수를 지우므로 순서가 바뀌면 토큰이 사라진다.

  | 피그마 이름 | CSS 이름 | Tailwind 유틸리티 |
  |---|---|---|
  | `color/gray/f9f9f9`(Primitive) | `--color-gray-f9f9f9` | `bg-gray-f9f9f9` 등(컴포넌트에서는 쓰지 않는다) |
  | `text-fill/primary` 등 Semantic·Component 색 | `--color-text-fill-primary` | `text-text-fill-primary`, `bg-*`, `border-*` |
  | `spacing/12` | `--spacing-12` | `p-12`, `gap-12` 등(값은 px) |
  | `size/control/height` | `--spacing-control-height` | `h-control-height`, `size-*`, `w-*` |
  | `radius/control` | `--radius-control` | `rounded-control` |
  | `stroke-width/default` | `--border-width-default` | `border-default` |
  | `blur/acrylic` | `--blur-acrylic` | `blur-acrylic`, `backdrop-blur-acrylic` |
  | `opacity/cut` (50) | `--opacity-cut: 50%` | `opacity-cut` |
  | `font/family/base` | `--font-base: 'Open Sans', var(--font-korean)` | `font-base` |
  | `font/family/korean` | `--font-korean: 'Pretendard'` | `font-korean` |
  | `font/weight/semibold` | `--font-weight-semibold` | `font-semibold` |
  | `font/size/body` | `--text-body` | `text-body`(같은 이름의 줄 높이를 함께 정한다) |
  | `font/line-height/body` | `--leading-body`, `--text-body--line-height` | `leading-body` |
  | `motion/duration/fast` | `--motion-duration-fast`, `--transition-duration-fast` | `duration-fast` |
  | `motion/easing/direct-entrance` | `--motion-easing-direct-entrance`, `--ease-direct-entrance` | `ease-direct-entrance` |
  | `motion/scale/*`, `motion/delay/*` | `--motion-scale-*`, `--motion-delay-*` | 없음(`var()`로 쓴다) |
  | 글자 스타일 `Body Strong` | 없음 | `type-body-strong`(서체·크기·굵기·줄 높이·자간) |
  | 글자 스타일 `Hangul/*` | 없음 | 만들지 않는다. 라틴 스타일과 크기·굵기가 같은지만 확인한다 |
  | 효과 스타일 `Elevation/Card` | `--shadow-elevation-card` | `shadow-elevation-card` |
  | 효과 스타일 `Text/*` | `--text-shadow-*` | `text-shadow-*` |
  | 효과 스타일의 배경 블러(`Material/Acrylic`) | `--backdrop-blur-material-acrylic` | `backdrop-blur-material-acrylic` |
  | 효과 스타일의 레이어 블러 | `--blur-*` | `blur-*` |
  | 단색 칠 스타일 `Material/Fallback/Acrylic Default` | `--color-material-fallback-acrylic-default` | 색 유틸리티 |
  | 그라데이션 칠 스타일 `Elevation/Control Border` | `--gradient-elevation-control-border` | `border-gradient-elevation-control-border`([[디자인 기반:컨트롤 테두리]]) |
  | 층이 여럿인 재질 칠 스타일 `Material/Acrylic Default` | 만들지 않는다 | `theme.css`에서 손으로 쓴다([[디자인 기반:재질 효과]]) |

  - 스타일 이름의 공백과 괄호는 `-`가 된다(`Surface/Flyout (Acrylic)` → `--shadow-surface-flyout-acrylic`, `--backdrop-blur-surface-flyout-acrylic`).
  - 라틴 서체 변수에는 `font/family/korean`을 이어 붙인다([[디자인 기반:서체]]).
  - Motion 변수의 코드 이름은 `--motion-*`이고([[디자인 기반:모션]]), Tailwind 유틸리티가 읽는 이름은 그것을 참조한다.
  - 피그마 배경 블러 값은 그대로 옮긴다. 브라우저 `blur()`와 반경 정의가 같은지는 재질을 구현할 때 확인한다.
  - 정해진 규칙이 없는 변수 묶음(예: `font/stretch/*`)이나, 서로 다른 토큰이 같은 CSS 이름이 되는 경우는 생성이 실패한다. 이름 규칙을 이 표에 먼저 정한다.
CI 비교: |
  CI는 저장소에 있는 피그마 이미지와, 같은 크기로 렌더링한 Storybook 스토리의 스크린샷을 pixelmatch로 비교한다.
  이미지가 저장소에 있으므로 CI에 피그마 토큰이 필요 없다. 실패하면 차이 이미지를 남긴다.

  피그마와 브라우저는 렌더링 엔진이 달라 글자와 그림자 경계 픽셀이 완전히 같을 수 없다. 허용 오차와 비교 방식(픽셀만, 또는 픽셀에 색 차이·스타일 속성 비교를 더함)은 검증을 거쳐 정한다([[미결 사항]]).
  검증 중인 기준 세 값(`threshold`, `includeAA`, 허용 픽셀 수)은 `scripts/parity/parity-config.ts` 한곳에만 둔다.

  비교 방법:
  - `figma/export.json`의 변형마다 `figma/images/<컴포넌트>/<변형>.png`를 기준 이미지로 쓴다. export.json에 있는데 이미지가 없거나, 이미지가 있는데 export.json에 없으면 실패한다.
  - Storybook을 정적으로 빌드(`storybook-static`)하고 스크립트 안의 작은 정적 서버로 띄운다. 개발 서버보다 결과가 매번 같다.
  - Playwright Chromium에서 `deviceScaleFactor`를 export.json의 `scale`로 두고, [[피그마 일치 검사:스토리 규칙]]대로 스토리와 상태를 재현한다.
  - 웹 폰트를 모두 받을 때까지(`document.fonts.ready`) 기다리고, 보이는 글자가 웹 폰트가 아닌 서체로 그려졌거나 웹 폰트를 받지 못했으면 실패한다. 시스템 서체로 찍힌 스크린샷은 비교할 의미가 없기 때문이다.
  - 요소 위치에 `renderBounds`(그림자까지 포함한 영역)를 더한 영역을 투명 배경으로 찍는다. renderBounds가 소수이면 피그마처럼 왼쪽 위는 내리고 오른쪽 아래는 올려 픽셀 단위로 덮는다. 애니메이션은 끝난 상태로 찍는다.
  - 크기가 다르면 비교하지 않고 실패한다. 크기가 같으면 pixelmatch로 비교한다.
  - 실패한 변형은 `parity-results/<컴포넌트>/<변형>/`에 `expected.png`, `actual.png`, `diff.png`를 남기고 요약을 출력한다. CI는 이 폴더를 아티팩트로 올린다.

  실행: `pnpm --filter @seojaewan/design-system test:parity`. Storybook을 빌드한 뒤 비교한다.
  - `--affected [--base <브랜치>]`: [[피그마 일치 검사:비교 범위]]대로 영향받는 컴포넌트만 비교한다.
  - `--component <폴더 이름>`: 그 컴포넌트만 비교한다(여러 번 쓸 수 있다).
  - `--no-build`: 이미 빌드한 `storybook-static`을 쓴다.
  - Chromium이 없으면 `pnpm --filter @seojaewan/design-system exec playwright install chromium`으로 설치한다.

  CI는 `Figma parity` 작업에서 PR은 `--affected`, `main` push는 전체를 비교한다. `figma/export.json`이 아직 없으면 설치 없이 건너뛴다.
  글자 렌더링은 운영체제마다 달라, 로컬 Windows 결과와 CI(Linux) 결과가 다를 수 있다. 기준은 CI 결과다.
검토한 대안: |
  - Figma REST API로 CI가 매번 이미지를 받기: 이미지는 받을 수 있지만 CI에 피그마 토큰이 필요하고, 피그마만 먼저 바뀌면 모든 PR이 실패한다. Variables는 Enterprise 플랜이 아니면 읽을 수 없다.
  - 별도 브랜치에 이미지를 계속 덮어쓰기: 어느 코드가 어느 시점의 피그마를 기준으로 했는지 연결이 끊기고, 디자인 변경과 상관없는 PR까지 실패한다.
  - 코드 기준 회귀 테스트 + 사람 리뷰(Chromatic 등 업계에서 흔한 방식): 기준이 피그마가 아니라 이전 코드라 처음 만든 화면이 피그마와 달라도 잡지 못한다.
  - 토큰도 플러그인 대신 피그마 MCP로 읽기: 플러그인이 단순해지지만, MCP는 AI 작업 세션 안에서만 쓸 수 있어 토큰 변경이 PR에 남지 않고 CI가 검사할 수 없다. 추출 코드도 MCP와 같은 플러그인 API라 정확도가 나아지지 않는다.
  - 토큰 생성에 Style Dictionary 쓰기: 토큰 JSON을 여러 플랫폼(CSS, iOS, Android) 코드로 바꾸는 업계 표준 도구다. 별칭 풀기 같은 기본기는 갖췄지만, 출력 대상이 웹 하나뿐이고 Tailwind v4 `@theme` 출력과 WinUI 이름 규칙은 어차피 직접 써야 해 고르지 않았다. 최신 DTCG 형식(2025.10) 지원도 아직 진행 중이다. 토큰이 복잡해지거나 다른 플랫폼이 생기면 다시 검토한다.
