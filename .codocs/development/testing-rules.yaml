_codocs:
  id: testing-rules
  name: 테스트 작성 규칙
  parent:
    - 개발 컨벤션
개요: |
  무엇을 테스트하고, 테스트를 어떤 구조로 쓰며, 어느 시점에 어디서 실행하는지 정한다.
  도구 선택은 [[기술 스택:테스트 도구]]에서 확인한다.
테스트 지침: |
  확인하려는 것마다 맡는 층은 하나다. 같은 것을 두 층에서 보지 않는다.

  | 층 | 맡는 것 |
  |---|---|
  | 단위 | 훅·유틸·저장소의 계산과 규칙 |
  | 스토리 `play` | 부품(컴포넌트나 조립 하나)이 제대로 움직이는지. 동작, 부품을 잇는 배선, 접근성(이름·역할·포커스) |
  | axe | 접근성 규칙([[테스트 작성 규칙:스토리 테스트]]) |
  | 캡처 표 | 모양. 컴포넌트는 피그마 그림과, 조립은 이전 코드 그림과 비교한다([[피그마 연동:캡처 표]]) |
  | E2E | 사용자가 실제 앱에서 하는 행위와 그 경우의 수([[테스트 작성 규칙:E2E]]) |
  | 토큰 lint | 스타일 값은 토큰 클래스만 쓴다([[피그마 연동:토큰 사용 강제]]) |
  | 토큰 생성 확인 | `tokens.css`가 피그마 내보내기 자료에서 다시 만든 결과와 같다(`generate:tokens --check`, [[피그마 연동:토큰 검사]]) |

  모션 검사는 지금처럼 CI에서 돈다([[피그마 연동:모션]]). 층마다 쓰는 도구와 실행 시점은 [[테스트 작성 규칙:테스트 종류]]에 있다.

  `play`와 E2E는 보는 것이 다르다. `play`는 부품이 제대로 움직이는지를 본다. E2E는 사용자가 실제 앱에서 하는 행위(예: 항목 이름을 바꾼다, 검색해서 글을 연다)를 끝까지 해낼 수 있는지와 그 경우의 수를 본다. 한 영역 안의 행위도 E2E 케이스가 된다.

  어느 층에 둘지는 위에서부터 먼저 맞는 것으로 고른다.
  0. 스타일 값은 토큰 클래스만 쓴다. lint가 지킨다.
  1. 모양은 캡처가 맡는다.
  2. 계산과 규칙은 훅·유틸로 빼서 단위 테스트로 본다.
  3. 사용자가 실제 앱에서 하는 행위와 그 경우의 수는 E2E로 본다.
  4. 디자인 시스템 컴포넌트에 넘긴 값이 그대로 나오는지만 보는 검사는 쓰지 않는다.
  5. 나머지는 `play`로 본다.

  앱 층에서 부품을 잇는 결과가 실제 자리에 들어가는지는 `play`로 남긴다. 예: 미리보기 카드의 축소 화면에 실제 창 내용이 들어간다.
테스트 종류: |
  | 종류 | 확인하는 것 | 도구 | 실행 |
  |---|---|---|---|
  | 단위 | 상태 규칙, 순수 함수(`utils`), 훅 | Vitest(훅은 Testing Library의 `renderHook`) | pre-commit(영향받는 것만) + CI |
  | 스토리 | 스토리가 그려지는지, `play`로 키보드·포인터 조작과 상태 표시, axe 접근성 검사 | Vitest 브라우저 모드(Chromium) + Storybook | pre-commit(영향받는 것만) + CI |
  | E2E | 사용자가 실제 앱에서 하는 행위와 그 경우의 수([[테스트 작성 규칙:E2E]]) | Playwright, 스크린샷 없음 | 로컬(직접 실행) + CI |
  | 토큰·자산 생성 확인 | `tokens.css`와 코드 자산이 피그마 내보내기 자료에서 다시 만든 결과와 같은지 | 생성 스크립트 `--check` | CI |
  | 모션 | 모션 클래스의 시간·이징·지연·반복 횟수와 키프레임 값이 피그마에서 내보낸 값과 같은지([[피그마 연동:모션]]). 실제 움직임의 느낌은 사람이 Storybook 모션 스토리의 느리게 보기로 본다 | Playwright(모션 스토리) | CI |

  컴포넌트 테스트 파일(`*.test.tsx`)은 두지 않는다. 로직은 훅과 `utils`의 단위 테스트(`*.test.ts`)로, 컴포넌트의 UI 동작은 스토리 `play`로 확인한다. 상태는 클래스가 아니라 속성(`aria-*`, `data-*`)으로 확인하고, 고정된 모양(클래스, 크기, 색)은 테스트하지 않고 캡처가 맡는다.
  컴포넌트가 피그마와 같은지, 조립의 배치가 의도하지 않게 바뀌지 않았는지는 테스트가 아니라 PR마다 사람이 보는 캡처 표로 확인한다([[피그마 연동:캡처 표]]). 조립의 기능은 `play` 동작 스토리로 본다.
  화면 단위 시각 검증(회귀 테스트, Screens와의 비교)은 지금 두지 않는다. 화면을 구현할 때 필요성을 다시 판단한다([[미결 사항]]).
범위: |
  커버리지 기준은 두지 않는다. 대신 codocs 문서에 정한 규칙을 테스트로 옮긴다.
  규칙을 구현한 코드마다 그 규칙을 검증하는 테스트를 둔다. 연결 방법은 [[codocs 연결 규칙]]을 따른다.
  지나치기 쉬운 누락은 리뷰할 때 codocs 섹션에 표시되는 코드 참조 개수로 확인한다.
구조와 이름: |
  - `describe` 하나가 문서 섹션 하나에 대응하고, 바로 위에 `// @codocs \[[문서:섹션]]`을 단다.
  - `it` 하나가 그 섹션의 규칙 한 줄(조건 하나)을 검증한다.
  - E2E는 위 두 줄 대신 행위 정의를 따른다. 파일 하나가 행위 하나, 시험 하나가 케이스 하나다([[테스트 작성 규칙:E2E]]).
  - 테스트 이름은 한국어로 규칙을 그대로 쓴다. 예: `it('최소화된 창을 Taskbar에서 누르면 원래 위치로 복원하고 맨 앞으로 가져온다')`
  - 테스트 파일은 소스 옆에 둔다. `__tests__` 폴더는 쓰지 않는다. E2E만 `apps/web/e2e/`에 모은다.
  - 스토리에서는 역할과 이름으로 찾는다(`getByRole('button', { name: '닫기' })`). 클래스나 test-id로 찾는 것은 최후 수단이다. 접근성 이름이 없으면 찾을 수 없으므로 접근성 검사도 같이 된다.
  - 단위 테스트(`*.test.ts`)는 훅과 `utils`만 다룬다. 같은 폴더 옆 파일을 import한다. JSX가 없으므로 확장자는 `.ts`다.
테스트 데이터와 외부 호출: |
  - 테스트 데이터는 테스트 옆의 `*.fixture.ts`에 둔다.
  - 테스트에서 Notion API를 실제로 호출하지 않고 고정된 가짜 응답으로 대체한다. Notion 내용이 바뀌어도 테스트 결과가 바뀌지 않게 하기 위해서다.
실행 시점: |
  - pre-commit: 바뀐 파일에 영향받는 단위·스토리 테스트만 실행한다(`vitest related`). 바뀐 파일을 import하는 테스트까지 의존 관계를 따라 찾아야, 고친 파일과 깨지는 테스트가 다른 경우를 놓치지 않는다. 스토리도 vitest project라 같은 명령으로 찾는다.
  - 설정·전역 파일(`vitest.config`, `vitest.storybook.config`, `.storybook` 설정, Tailwind 테마, 전역 setup, `package.json`)은 import 관계로 연결되지 않으므로, 이런 파일이 바뀌면 전체 테스트를 실행한다.
  - CI: 단위·스토리 테스트 전체, E2E 전체, 토큰·자산 생성 확인, 바뀐 모션 클래스의 시간·키프레임 값 검사를 실행하고, 영향받는 컴포넌트와 조립의 캡처 표를 남긴다([[Git 작업 규칙:CI]], [[피그마 연동:캡처 범위]]).

  E2E는 스크린샷을 비교하지 않으므로 운영체제에 따른 렌더링 차이의 영향을 받지 않는다. 그래서 로컬 Windows에서도 그대로 실행할 수 있다.
E2E: |
  E2E는 사용자가 실제 앱에서 하는 행위(예: 항목 이름을 바꾼다, 검색해서 글을 연다)를 끝까지 해낼 수 있는지와 그 경우의 수를 본다. 부품이 제대로 움직이는지는 `play`가 본다([[테스트 작성 규칙:테스트 지침]]). `play`가 깨지면 그 부품을 쓰는 E2E도 깨지므로, 시나리오 케이스는 E2E만 담는다.

  행위 정의:
  - 행위마다 TS 정의 파일 하나가 원본이다(`apps/web/e2e/behaviors/`). Playwright 시험과 시나리오 케이스 화면이 모두 이 파일에서 만들어진다.
  - 정의 파일 이름은 `<행위 id>.behavior.ts`이고 행위 id는 파일 이름이다. 형식·읽기·공통 단계 도우미도 같은 폴더에 둔다(앱 lint가 `../` import를 막는다). 시나리오 케이스 도구가 Node로 정의를 바로 읽으므로(타입 지우기), 정의 쪽 import는 `.ts` 확장자를 쓰고(`apps/web/tsconfig.json`의 `allowImportingTsExtensions`) Node가 바로 읽지 못하는 패키지(`@seojaewan/design-system` 등)는 import하지 않는다.
  - 파일에는 조건(요인), 조건마다 가질 수 있는 값 전체, 기준값, 케이스 목록을 적는다. 조건 값 목록은 기능 문서의 규칙에서 빠짐없이 뽑는다(예: 화면 크기는 PC·노트북·모바일 모두). 문서에 없는 값이 필요하면 문서를 고친다. 조건 이름(`label`)은 사람이 읽는 말로 쓴다(예: 입력 방식, 붙일 자리, 화면 크기).
  - 실제 앱에서만 생기는 것도 행위 케이스로 다룬다. 예: '글 주소로 들어온다' 행위의 조건 값으로 없는 주소(404 응답), '홈을 연다' 행위에서 콘솔 오류가 없는지(수화 오류), 상태를 바꾸는 행위의 '그다음에' 조건 값으로 새로고침·다시 시작.
  - 1번 케이스는 모든 조건이 기준값이다. 나머지 케이스는 기준에서 조건 하나를 바꾼다(`change`에 조건 하나). 서로 독립인 조건 둘 이상을 바꾼 실행은 조건 하나씩으로 나눈다. 모바일에서만 있는 행위는 화면 크기의 기준값이 모바일이다.
  - 한 값이면 다른 조건 값도 함께 바뀌는 의존은 행위의 `requires`에 적는다(예: 입력 방식이 터치면 화면 크기는 모바일). 케이스는 바꾼 조건 하나만 적고, 의존이 채운 값은 표에서 함께 진하게 보이며, 그 값의 줄은 "‘터치’ 줄과 같은 케이스"로 따로 만들어진다.
  - 다른 조건과 엮어야만 확인할 수 있는 조합은 케이스의 `combine`에 엮은 값과 이유를 적는다. 엮은 값도 진하게 보이지만 같은 케이스가 되지 않아, 따로 케이스가 없으면 빠진 값으로 남는다.
  - 케이스마다 시나리오(`scenario`, 사용자가 하는 일 한 문장), 결과(`result`, 표의 결과 칸에 보이는 짧은 구), 기대 결과(`expected`, 되어야 하는 결과 목록), 문서 링크(`\[[문서:섹션]]` 형식), 실행 함수를 둔다. 실행 함수는 확인(`expect`)을 그 기대 결과 이름의 `test.step`으로 감싼다(`check`). 그래서 실패하면 어느 기대 결과가 깨졌는지 보고서에 나온다. 확인하지 않은 기대 결과가 있으면 시험이 실패한다.
  - 모바일 케이스는 터치 장치로 돌리고 마우스 클릭이 아니라 실제 터치(`tap`·`longPress`·`swipe`)로 조작한다.
  - 케이스를 두지 않는 값에 이유가 있으면 `noCase`에 값마다 이유와 근거 문서 링크를 적는다. 예: 모바일 전용 행위의 PC·노트북, 모바일에 없는 창 스냅의 모바일.
  - 빠진 값은 조건 값 가운데 기준값도 아니고, 그 값으로 바꾼 케이스도 의존으로 그 값이 된 케이스도 없고, 이유도 적지 않은 값이다. 빠진 값마다 사람과 논의해 케이스를 만들거나 케이스가 없는 이유를 적는다.
  - 코드 근거는 케이스의 문서 링크와 같은 `@codocs` 주석이 달린 제품 코드(스토리·테스트 제외)에서 자동으로 뽑아, 함수 이름과 위치(파일:줄)로 보인다.

  시나리오 케이스:
  - 정의 파일에서 만든 화면이다. 행위마다 "번호. 행위 → 확인하는 결과들"(`summary`) 카드에 표 하나를 둔다. 열은 번호, 조건들, 결과, 실행해보기, 근거이고, 줄은 "기준" 묶음과 조건마다 "○○ 다름" 묶음으로 나뉜다. 기준과 같은 값은 회색, 다른 값은 진하게 보인다. 값마다 케이스 줄, 이유 줄(회색, 결과 칸에 이유), 같은 케이스 줄(회색), 빠진 값 줄(옅은 빨강) 가운데 하나가 된다.
  - 근거를 펼치면 목적(시나리오와 기대 결과별 확인), 코드 근거, 문서 링크를 보이고, 실패한 케이스는 맨 위에 실패한 기대 결과와 오류 한 줄을 보인다. 실패한 행위는 왼쪽 목록에서 이름이 빨갛다.
  - 로컬에서는 `tools/scenario-cases`로 화면을 띄운다. "실행해보기"를 누르면 그 케이스를 그 자리에서 Playwright로 돌리고 Trace Viewer로 연다.
  - CI는 모든 케이스를 돌려 같은 화면에 결과(통과·실패), 기대 결과별 확인, trace를 붙여 GitHub Pages에 올린다(https://seojaewan.github.io/seojaewan-blog/). Pages의 "실행해보기"는 그 케이스의 trace를 trace.playwright.dev로 연다.

  보이기:
  - 마우스·키보드는 Playwright 기본 기능(`page.screencast.showActions`)으로 커서와 동작 이름을 보인다. `slowMo`는 실행해보기에서만 쓴다.
  - 터치는 Playwright에 표시가 없어 손가락 표시와 `tap`·`longPress`·`swipe` 함수를 직접 둔다. 모바일 실제 터치는 이 함수로 E2E에서 확인한다(CDP `Input.dispatchTouchEvent`).
  - CI에서도 같은 표시를 켠다.
  - 휠 스크롤은 나눠 굴린다.

  화면까지 가는 준비(예: 글이 열린 상태로 시작)는 공통 fixture로 묶는다.

  기본 화면은 PC 구간의 가장 작은 크기(1600×900)다. Playwright 기본 화면은 노트북 구간이라 설정에서 고정한다. 다른 구간은 시험이 `setViewportSize`로 고르고, 모바일은 터치 장치(`device`)로 고른다.

  Playwright는 기본으로 `reducedMotion: 'reduce'`로 돌려 동작 줄이기 상태에서 확인한다([[피그마 연동:모션 클래스]]). 애니메이션을 켜고 도는 것은 모션 검사(시간·키프레임 값)뿐이다([[피그마 연동:모션]]). Vitest(jsdom)에는 애니메이션이 없어 사라지는 요소가 바로 빠진다.
스토리 테스트: |
  `*.stories.tsx`의 스토리 하나가 테스트 하나다. 실제 Chromium에서 그려 오류가 없는지 보고, `play`가 있으면 돌리고, axe 접근성 검사를 오류로 돌린다.

  - 피그마와 맞추는 스토리(`Figma`)에는 `play`를 넣지 않는다. 동작 스토리는 쓰는 상황 하나에 하나를 만들어 같은 파일에 두고, 안에서 `step()`으로 나눈다.
  - 동작 스토리 이름은 피그마 이름이 아니라 상황 이름이다(`TwoWindows`, `CutAndPaste`, `SearchBox`). 캡처 도구는 제목이 같은 스토리가 여럿이면 `Figma`를 고르므로, `Patterns/` 조립이 있는 컴포넌트의 동작 스토리는 그 조립 파일에 함께 둔다. 조립이 없는 층 컴포넌트는 `Features/...`·`Shell/...` 제목을 쓰고, 그렇게 맞는 자리가 없는 새 파일은 `Behavior/...` 제목을 쓴다. 파일 이름에 `.behavior.stories.tsx`처럼 나누지 않는다.
  - 상태는 `aria-*`나 `data-*` 속성으로 확인한다. 접근성 속성으로 올릴 수 있는 상태는 그 속성을 쓴다. 상태 속성(`data-*`)은 남겨야 하는 검사([[테스트 작성 규칙:테스트 지침]])에 꼭 필요할 때만 컴포넌트에 더한다. 클래스 이름으로는 확인하지 않는다.
  - 도구는 `storybook/test`에서 가져온다(`expect`, `userEvent`, `fireEvent`, `waitFor`, `within`, `fn`). `vitest`는 스토리에서 가져오지 않는다. 스토리는 Storybook 화면에서도 돌아야 한다. `fireEvent`는 Promise를 돌려주므로 `await`한다.
  - 스토리의 핸들러는 앱 코드처럼 `onClick: handleClick`으로 바꿔 받는다.
  - 저장소는 스토리 meta의 `beforeEach`에서 처음 상태로 돌리고(`resetStoryStores`), 미리 열 창은 스토리의 `beforeEach`에서 연다(`openStoryWindows`).
  - 스토리 파일(디자인 시스템과 앱)은 `className`·`style`을 직접 주지 않는다(lint가 막는다). 크기와 배치는 `@seojaewan/design-system/story`의 도우미 둘로만 준다.
    - `FigmaFrame`(`figmaFrame` 데코레이터): 스토리가 그리는 컴포넌트·조립의 피그마 `export.json`을 받아, 스토리 args에 맞는 변형의 크기 방식(HUG·FIXED·FILL)과 `export.json`의 크기 숫자대로 감싼다. 크기를 손으로 고르지 않는다. 슬롯 안 자식처럼 안쪽 노드의 크기가 필요하면 그 노드 이름 경로(`node`, 이름에 `/`가 든 노드는 이름 배열)를 준다. 피그마 원본의 견본 크기([[디자인 기반:크기 변수]])도 변수 없는 숫자라 `export.json`의 숫자로 준다. 앱 스토리는 `@figma/*` 별칭으로 `apps/web/figma`의 export.json을 가져온다.
    - `StoryStage`: 메뉴·팝업이 뜰 공간이나 화면 가장자리에 붙는 층처럼 컴포넌트 밖의 배치를 이름(`fill`, `bottom`, `bottom-end`, `bottom-center`, `top-center`, `padded`)으로 고른다. `target`을 주면 대상 자리에 `data-parity-target`을 단다. 메뉴가 뜰 공간이 필요하면 스토리 캔버스 전체(`layout: 'fullscreen'`)와 함께 쓴다.
    - 가짜 상자나 빈 무대를 만들지 않는다. 슬롯에는 실제 컴포넌트를 넣는다. 슬롯 안 자식을 채우거나 아이콘 크기를 맞추는 것은 슬롯을 여는 컴포넌트가 하고, 쓰는 곳이 클래스로 맞추지 않는다.
    - 스토리에서만 쓰는 크기 토큰은 두지 않는다([[디자인 기반:크기 변수]]). 컴포넌트 스토리는 슬롯 기본 내용 규칙(실제 컴포넌트를 넣는다)과 `@sample-size` 견본 크기의 숫자로 크기를 정한다. 조립 스토리는 데이터를 피그마와 맞추지 않는다. 크기는 `FigmaFrame`이 `export.json` 숫자로 준다(메뉴·팝업 공간 등 컴포넌트 밖 배치는 `StoryStage`).
    - 예외는 lint 설정에서 경로 단위로 둔다. 모션 견본 스토리(`motion-story/*.stories.tsx`)는 모션 클래스를 컴포넌트에 거는 것 자체를 시험하므로 `motionClassName` 하나만 넘길 수 있다.
  - 뷰포트는 스토리의 `globals: { viewport: { value: 'mobile1', isRotated: false } }`로 고른다. 실제 브라우저 크기가 바뀌므로 `matchMedia`를 가짜로 두지 않는다. 기본은 `.storybook/preview.ts`의 `pc`(1600×900, PC 구간의 가장 작은 크기, 캡처 화면과 같다)이고, 노트북 값은 앱 스토리에서 `laptop`으로 본다. addon-vitest의 기본 화면은 노트북 구간이라 기본값을 두었다.
  - 끌기는 `dragStoryPointer`를 쓴다. 실제 브라우저의 `setPointerCapture`는 합성 포인터 id를 받지 않는다.
  - 마우스 올리기는 `userEvent.hover`나 `fireEvent.pointerOver`로 보낸다. React의 `onPointerEnter`는 `pointerover`로 동작해 `fireEvent.pointerEnter`로는 닿지 않는다.
  - 시간은 진짜로 기다리는 것(`waitFor`)이 먼저다. 지연 전후를 나눠 봐야 할 때만 `installStoryClock`으로 그 지연만 잡아 `play` 안에서 흘린다.
  - 실제 브라우저라 애니메이션이 돈다. 크기는 `getBoundingClientRect`(scale이 들어감) 대신 `offsetWidth`로 본다.
  - 앞 스토리의 포인터가 화면 위에 남을 수 있다. 마우스 올림에 따라 달라지는 요소(툴팁, 미리보기, hover 스타일)는 스토리 시작 때 포인터 위치를 가정하지 않고, 필요하면 `pointerOut`으로 먼저 치운다. 저장소·`localStorage`도 `beforeEach`에서 처음 상태로 돌려 앞 스토리가 남기지 않게 한다.
  - 뷰포트를 바꾼 뒤에는 크기를 바로 재지 않고 바뀐 값(`window.innerWidth`, 기대하는 요소)을 `waitFor`로 기다린 다음 잰다.

  axe 위반은 코드와 스토리를 고쳐 없앤다. 부모 역할이 필요한 컴포넌트의 스토리는 그 역할로 감싼다(`tablist`, `tree`, `menu`). 규칙을 끄는 것은 외부 라이브러리 때문일 때만 스토리별로 하고 이유를 주석으로 적는다. 색 대비 기준과 규칙을 끄는 예외는 [[접근성:색 대비]]에 있다.

  axe는 `resultTypes: ['violations']`로 위반만 보고하게 한다. 결과 전체를 보고하면 CPU가 부족할 때 브라우저와의 통신이 막혀 시간 초과가 나기 때문이다.

  실행 명령: `pnpm test`(전부, CI도 이것), `pnpm test:unit`, `pnpm test:storybook`. 패키지 폴더에서도 같은 이름으로 돈다. vitest project 이름은 `unit-*`, `storybook-*`로 시작해 `vitest run --project "storybook-*"`처럼 고른다. 처음 한 번 `pnpm --filter @seojaewan/web exec playwright install chromium`이 필요하다.
