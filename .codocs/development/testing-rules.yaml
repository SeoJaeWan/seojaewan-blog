_codocs:
  id: testing-rules
  name: 테스트 작성 규칙
  parent:
    - 개발 컨벤션
개요: |
  무엇을 테스트하고, 테스트를 어떤 구조로 쓰며, 어느 시점에 어디서 실행하는지 정한다.
  도구 선택은 [[기술 스택:테스트 도구]]에서 확인한다.
테스트 종류: |
  | 종류 | 확인하는 것 | 도구 | 실행 |
  |---|---|---|---|
  | 단위 | 상태 규칙, 순수 함수 | Vitest | pre-commit(영향받는 것만) + CI |
  | 컴포넌트 | 키보드 조작, 접근성, 상태 표시 | Vitest + Testing Library | pre-commit(영향받는 것만) + CI |
  | E2E | 기능이 연결됐을 때의 동작 | Playwright, 스크린샷 없음 | 로컬(직접 실행) + CI |
  | 피그마 일치 | 디자인 시스템 컴포넌트가 피그마와 같은 이름(토큰·스타일·선택지·자산)을 쓰는지 | Storybook + Playwright Test(클래스 이름·계산값 비교, CDP로 서체 확인) | CI |

  피그마 일치 검사의 흐름은 [[피그마 일치 검사]]에서 확인한다.
  화면 단위 시각 검증(회귀 테스트, 화면 단위 피그마 일치)은 지금 두지 않는다. 화면을 구현할 때 필요성을 다시 판단한다([[미결 사항]]).
범위: |
  커버리지 기준은 두지 않는다. 대신 codocs 문서에 정한 규칙을 테스트로 옮긴다.
  규칙을 구현한 코드마다 그 규칙을 검증하는 테스트를 둔다. 연결 방법은 [[codocs 연결 규칙]]을 따른다.
  지나치기 쉬운 누락은 리뷰할 때 codocs 섹션에 표시되는 코드 참조 개수로 확인한다.
구조와 이름: |
  - `describe` 하나가 문서 섹션 하나에 대응하고, 바로 위에 `// @codocs \[[문서:섹션]]`을 단다.
  - `it` 하나가 그 섹션의 규칙 한 줄(조건 하나)을 검증한다.
  - 테스트 이름은 한국어로 규칙을 그대로 쓴다. 예: `it('최소화된 창을 Taskbar에서 누르면 원래 위치로 복원하고 맨 앞으로 가져온다')`
  - 테스트 파일은 소스 옆에 둔다. `__tests__` 폴더는 쓰지 않는다. E2E만 `apps/web/e2e/`에 모은다.
  - 컴포넌트는 역할과 이름으로 찾는다(`getByRole('button', { name: '닫기' })`). 클래스나 test-id로 찾는 것은 최후 수단이다. 접근성 이름이 없으면 찾을 수 없으므로 접근성 검사도 같이 된다.
테스트 데이터와 외부 호출: |
  - 테스트 데이터는 테스트 옆의 `*.fixture.ts`에 둔다.
  - 테스트에서 Notion API를 실제로 호출하지 않고 고정된 가짜 응답으로 대체한다. Notion 내용이 바뀌어도 테스트 결과가 바뀌지 않게 하기 위해서다.
실행 시점: |
  - pre-commit: 바뀐 파일에 영향받는 테스트만 실행한다(`vitest related`). 바뀐 파일을 import하는 테스트까지 의존 관계를 따라 찾아야, 고친 파일과 깨지는 테스트가 다른 경우를 놓치지 않는다.
  - 설정·전역 파일(`vitest.config`, Tailwind 테마, 전역 setup, `package.json`)은 import 관계로 연결되지 않으므로, 이런 파일이 바뀌면 전체 테스트를 실행한다.
  - CI: 단위·컴포넌트 테스트 전체, E2E 전체, 피그마 일치 검사를 실행한다.

  E2E는 스크린샷을 비교하지 않으므로 운영체제에 따른 렌더링 차이의 영향을 받지 않는다. 그래서 로컬 Windows에서도 그대로 실행할 수 있다.
E2E: |
  E2E는 규칙을 다시 검사하지 않고, 기능들이 연결됐을 때 사용자 흐름이 동작하는지만 확인한다. 핵심 흐름 5~10개를 둔다.

  후보 흐름: 공유 링크로 들어오면 그 글이 Chrome 창에 열린 상태로 시작, 바탕화면 폴더 → 파일 탐색기 → 글 열기와 Taskbar 표시, 모바일 폭에서 창이 전체화면 하나로 바뀜, Notion 글이 ISR 페이지에서 그려짐.
  화면까지 가는 준비(예: 글이 열린 상태로 시작)는 공통 fixture로 묶는다.
