_codocs:
  id: coding-rules
  name: 코드 작성 규칙
  parent:
    - 개발 컨벤션
개요: |
  TypeScript·React 코드를 쓸 때 지키는 이름, 함수, import·export, JSDoc, 타입, 포맷, React·Next.js 사용 규칙이다.
  대부분 ESLint와 TypeScript가 강제하며, 도구로 강제하지 못하는 것은 항목마다 따로 적는다.
파일과 폴더 이름: |
  - 파일·폴더 이름은 kebab-case다. 컴포넌트 파일도 kebab-case다(예: `window-frame.tsx`). Next.js 예약 파일(`page.tsx`, `layout.tsx`)과 모양이 같고, 대소문자를 구분하지 않는 파일 시스템에서 이름 변경 문제가 없다.
  - 도구가 이름을 정하는 파일(`*.config.mjs`, `package.json` 등)은 그대로 둔다.
  - 역할은 이름 끝으로 드러낸다: 테스트 `*.test.ts(x)`, 스토리 `*.stories.tsx`, 훅 `use-*.ts`, 테스트 데이터 `*.fixture.ts`.
  - `utils`, `helpers`, `common`처럼 무엇이든 들어갈 수 있는 이름은 쓰지 않고 하는 일을 이름에 쓴다.
  - `index` 파일은 패키지 공개 진입점(`packages/design-system/src/index.ts`)에만 둔다. 앱 기능의 진입점은 기능 이름 파일이다([[저장소 구성:앱 폴더 구조]]).
식별자 이름: |
  | 대상 | 규칙 | 강제 |
  |---|---|---|
  | 변수·함수 | camelCase | `@typescript-eslint/naming-convention` |
  | 타입 | PascalCase, `I` 같은 접두사 없음 | 같은 규칙 |
  | React 컴포넌트 | PascalCase | TypeScript JSX 검사(소문자 태그는 HTML 태그로 해석돼 쓸 수 없다), `react-hooks/rules-of-hooks`, `react/jsx-pascal-case` |
  | 상수 | UPPER_SNAKE_CASE | `no-restricted-syntax` |
  | boolean 변수·매개변수 | `is`·`has`·`can`·`should`로 시작 | `naming-convention`의 타입 기반 검사 |
  | 이벤트 핸들러 | props는 `on*`, 내부 함수는 `handle*` | `react/jsx-handler-names` |
  | 훅 | `use*` | `react-hooks/rules-of-hooks` |

  상수는 모듈 최상위에서 리터럴(숫자·문자열 등)이나 `as const`로 초기화한 `const`다. 예: `TASKBAR_HEIGHT = 48`, `PINNED_APPS = ['chrome'] as const`.
  초기값의 모양으로 정의해야 lint가 설정 값과 계산 결과를 구분할 수 있다. 함수 호출 결과 같은 계산 값(`const store = createStore()`)은 camelCase이며, 계산 값에 UPPER_SNAKE_CASE를 쓰는 것도 lint가 막는다. `as const`가 아닌 타입 단언(`x as Foo`)은 상수로 보지 않는다.
  함수 안의 `const`는 초기값과 상관없이 camelCase다.

  boolean 접두사는 변수와 매개변수에만 강제한다. 컴포넌트 props와 타입 속성은 `open`, `disabled`처럼 HTML·Base UI와 같은 이름을 쓸 수 있게 검사하지 않는다.
함수: |
  이름 있는 함수는 `function` 선언으로 쓰고(컴포넌트 포함), 다른 함수에 넘기는 콜백은 화살표 함수로 쓴다.
  타입을 붙인 화살표 함수(`const handler: Handler = () => {}`)도 쓰지 않는다. Zustand의 `create((set) => ({ ... }))`처럼 라이브러리에 넘기는 함수는 콜백이다.

  선언 순서와 상관없이 호출할 수 있어서 파일 위쪽에 주요 함수(컴포넌트, 공개 함수), 아래쪽에 보조 함수를 두고 위에서 아래로 읽을 수 있다.
  `func-style: declaration`과 `prefer-arrow-callback`이 강제한다.
export와 import: |
  - named export만 쓴다. Next.js 예약 파일(`page.tsx`, `layout.tsx`, `not-found.tsx` 등)과 도구가 default export를 요구하는 설정 파일만 예외다.
  - import 순서는 외부 패키지 → `@seojaewan/design-system` → `@/` 별칭 → 상대 경로이며 `simple-import-sort`가 자동 정렬한다.
  - 앱 안에서 상위 폴더는 `@/`(`apps/web/src/`) 별칭으로 import하고 `../`는 쓰지 않는다. 같은 폴더·하위 폴더는 `./`를 쓴다.
  - 타입만 쓰는 import는 `import type`으로 쓴다.
  - 패키지와 기능 사이 경계는 [[저장소 구성:의존 방향]]을 따른다.
JSDoc: |
  - 함수와 메서드에는 한국어 설명을 단다. 5줄 이상인 콜백도 같다.
  - `@param`과 `@returns`에는 설명을 반드시 쓰고, 타입은 쓰지 않는다. TypeScript가 이미 갖고 있다.
  - 컴포넌트 props는 이름이 `Props`로 끝나는 타입의 각 속성에 설명을 달고, 컴포넌트 함수의 JSDoc에는 설명 없는 `@param props` 한 줄만 둔다. 사용하는 쪽 IDE에서 속성 설명이 보이기 때문이다. 이를 위해 첫 번째 매개변수 이름이 `props`인 경우 `@param` 설명 필수 규칙의 예외로 둔다.
  - 문서의 규칙을 구현한 함수에는 JSDoc 안에 `@codocs`를 단다([[codocs 연결 규칙]]).
  - 테스트·fixture·스토리 파일은 제외한다. 테스트 이름과 스토리 이름이 설명 역할을 한다.

  `eslint-plugin-jsdoc`이 강제한다.

  ```ts
  type WindowFrameProps = {
    /** 제목 표시줄에 보이는 창 이름 */
    title: string;
    /** 닫기 버튼을 눌렀을 때 호출 */
    onClose: () => void;
  };

  /**
   * 창 제목 표시줄과 본문 영역을 그린다.
   * @param props
   */
  export function WindowFrame(props: WindowFrameProps) {
  ```
타입: |
  - 타입은 `type`으로 쓴다. 유니언·교차 타입과 모양이 같고 선언 병합 같은 뜻밖의 동작이 없다(`consistent-type-definitions`).
  - `any`는 금지한다. 모르는 값은 `unknown`으로 받아 좁혀 쓴다.
  - 타입 단언(`as`)은 `as const` 외에는 피한다. Notion 응답 같은 외부 데이터는 단언하지 않고 Zod 스키마로 검증한다.
  - Promise는 반드시 처리한다. `void`로 무시하는 것도 허용하지 않는다(`no-floating-promises`).
  - 모듈 밖으로 내보내는 함수는 반환 타입을 명시한다(`explicit-module-boundary-types`).
포맷: |
  Prettier를 쓴다.
  - 작은따옴표, 세미콜론 사용, 끝 쉼표 항상(`trailingComma: all`), 줄 길이 100자, 공백 2칸 들여쓰기
  - 줄바꿈은 LF로 고정한다(`.gitattributes`). Windows에서 작업해도 CRLF가 섞이지 않게 하기 위해서다.
  - Tailwind 클래스는 `prettier-plugin-tailwindcss`로 정렬한다.
  - `.codocs` 문서는 codocs 도구가 쓰는 형식을 유지하기 위해 Prettier에서 제외한다.
React와 Next.js: |
  - Notion 데이터는 서버에서만 가져온다(`content/`와 `app/`의 서버 컴포넌트). `features/`는 데이터를 props로 받기만 하고 직접 가져오지 않는다. Notion 토큰이 브라우저로 나가지 않게 하기 위해서다.
  - Notion을 호출하는 파일에는 `import 'server-only'`를 넣어, 클라이언트에서 import하면 빌드가 실패하게 한다.
  - `'use client'`는 상호작용이 시작되는 경계 파일에만 붙인다.
  - 파일 하나에 공개 컴포넌트 하나다. 그 파일 안에서만 쓰는 작은 보조 컴포넌트는 같이 둘 수 있다.
  - 전역 화면 상태는 Zustand, 컴포넌트 안의 일시적 상태는 `useState`다. URL로 표현되는 상태(열린 글)는 URL이 기준이다.
  - React Compiler를 켜고 `useMemo`·`useCallback`·`memo`는 직접 쓰지 않는다. 성능 문제가 측정된 곳에서만 예외로 쓴다.
  - 환경 변수는 Zod로 검증하는 모듈 하나에서만 읽는다. 코드 곳곳에서 `process.env`를 직접 읽지 않는다.
