_codocs:
  id: codocs-linking
  name: codocs 연결 규칙
  parent:
    - 개발 컨벤션
개요: |
  코드와 codocs 문서를 `@codocs \[[문서:섹션]]` 표기로 어디서 잇는지 정한다.
  문서의 규칙이 바뀌었을 때, 그 섹션에서 고쳐야 할 구현과 테스트를 바로 찾기 위한 연결이다.
규칙: |
  - 문서의 정책·결정을 구현한 코드 지점과, 그 규칙을 검증하는 테스트에 섹션 단위로 단다.
  - 모든 파일에 달지 않는다. 규칙과 관계없는 코드에는 연결하지 않는다.
  - 컨벤션을 구현한 설정 파일(ESLint, commitlint 등)도 구현 지점이므로 해당 컨벤션 섹션에 연결한다.
  - 함수에는 JSDoc 안에, 테스트의 `describe`나 설정 블록에는 바로 위 `//` 주석으로 단다.
  - 작업 절차를 담은 스킬(`.claude/skills/`)도 그 절차가 따르는 섹션에 연결한다. 스킬 본문에서 규칙을 옮겨 적지 않고 `@codocs \[[문서:섹션]]`으로 가리킨다. 섹션을 바꿀 때 그 섹션에 기대는 스킬도 함께 찾기 위해서다.
