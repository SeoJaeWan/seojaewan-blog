_codocs:
  id: features
  name: 화면별 기능
  parent:
    - seojaewan 블로그
개요: |
  블로그 화면들이 무엇을 보여주고 방문자가 무엇을 할 수 있는지 안내하는 목차다.
  어떤 화면을 만드는지는 [[제품 정의:첫 공개 범위]]가 정하고, 각 화면의 세부 동작은 여기 연결한 문서가 정한다.
공통 기능: |
  `common/`. 둘 이상의 화면이 함께 따르는 규칙이다. 한 화면에서만 일어나는 일은 그 화면 문서에, 두 화면 이상에 걸치면 여기에 쓰고 화면 문서는 링크만 둔다.

  - 항목의 종류, 위치와 옮기기, 폴더 이름: [[항목과 폴더]]
  - 선택, 열기, 끌기, 잘라내기·붙여넣기, 단축키: [[항목 조작]]
  - 이름·유형·날짜 비교와 폴더 앞에 두기: [[항목 정렬]]
  - 휴지통의 제한, 복원, 비우기: [[휴지통]]
  - 방문자 브라우저에 저장하는 것: [[방문자 저장]]
  - 처음 상태로 되돌리기: [[다시 시작]]
  - Start와 작업 표시줄 고정: [[고정]]
  - 포커스, Tab, 이름, 역할: [[접근성]]
  - 모바일 기준과 입력 차이: [[반응형]]
바탕화면: |
  `desktop/`.

  - 표시하는 항목, 배경화면: [[바탕화면]]
  - 격자 자리, 자동 정렬, 칸 크기: [[바탕화면 아이콘]]
  - 빈 곳과 아이콘의 메뉴: [[바탕화면 우클릭 메뉴]]
작업 표시줄: |
  `taskbar/`.

  - 구성, 앱 버튼, 창 미리보기, 시계: [[작업 표시줄]]
  - Start 메뉴의 검색, 고정됨, 모두, 전원: [[Start 메뉴]]
  - 검색 대상, 일치 규칙, 결과 화면: [[검색]]
창: |
  `window/`.

  - 창의 열기, 조작, 브라우저 주소와 새로고침: [[창 동작]]
  - 끌어서 스냅, 스냅 레이아웃, Snap Assist: [[스냅]]
  - 폴더 탐색, 보기와 정렬, 탭, 폴더 안 검색, 휴지통 보기: [[파일 탐색기]]
  - 글 읽기 창, 새 탭, 주소창, 글 주소, 글 화면: [[Chrome]]
