_codocs:
  id: features
  name: 화면별 기능
  parent:
    - seojaewan 블로그
개요: |
  블로그 화면들이 무엇을 보여주고 방문자가 무엇을 할 수 있는지 안내하는 목차다.
  어떤 화면을 만드는지는 [[제품 정의:첫 공개 범위]]가 정하고, 각 화면의 세부 동작은 여기 연결한 문서가 정한다.
공통 개념: |
  모든 화면이 함께 쓰는 개념이다.

  - 바탕화면·탐색기·Start·검색에 나오는 항목의 종류와 열기: [[항목 모델]]
  - 항목이 어디에 놓이고, 방문자가 무엇을 바꿀 수 있는지: [[작업 공간]]
화면: |
  - 바탕화면 아이콘, 우클릭 메뉴, 배경화면: [[바탕화면]]
  - 작업 표시줄 구성, 앱 버튼, 창 미리보기, 고정, 시계: [[작업 표시줄]]
  - Start 메뉴의 고정됨, 모든 항목, 추천, 전원: [[Start 메뉴]]
  - 검색 대상, 일치 규칙, 결과 화면: [[검색]]
  - 창의 열기, 조작, 스냅, 브라우저 주소와 새로고침: [[창 동작]]
  - 폴더 탐색, 보기와 정렬, 탭, 폴더 안 검색, 휴지통 보기: [[파일 탐색기]]
  - 글 읽기 창, 새 탭, 주소창, 글 주소, 글 화면: [[Chrome]]
  - 좁은 화면에서 달라지는 동작: [[모바일]]
