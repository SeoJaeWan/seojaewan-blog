_codocs:
  id: start-menu
  name: Start 메뉴
  parent:
    - 화면별 기능
개요: |
  작업 표시줄의 Start 버튼으로 여는 Start 메뉴의 구성과 동작을 정한다.
  검색 결과의 규칙은 검색 문서에서 정한다. 모바일에서의 동작은 [[Start 메뉴:모바일]]에서 정한다.
  최신 Windows 11 Start 메뉴처럼 한 화면에서 아래로 스크롤한다. 고정됨 아래에 모두가 이어지고, 추천 영역은 두지 않는다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 위 | 검색 띠. 검색 입력칸([[Start 메뉴:검색]])이 있다 |
  | 고정됨 | 고정한 항목 그리드 |
  | 모두 | 모든 항목 목록과 `보기:` 전환([[Start 메뉴:모두]]) |
  | 아래 | 사용자 띠. 왼쪽에 블로그 주인의 이름과 사진(프로필), 오른쪽에 전원 버튼 |

  - 위쪽 검색 띠와 아래쪽 사용자 띠는 따로 둔 띠이고, 가운데 본문(고정됨·모두)과의 사이를 가로 구분선으로 나눈다. 두 띠는 셸 아크릴이고 본문은 그 위에 덧칠한다([[디자인 기반:재질 효과]]). 실제 Windows 11 Start와 같다.
  - 프로필은 눌러도 아무 동작을 하지 않는다. 소개 페이지는 [[항목과 폴더:나중에 검토할 것]]이다.
  - 전원 버튼에는 `다시 시작`만 있다([[다시 시작:개요]]).
  - 데스크톱에서 패널과 작업 표시줄 사이에는 틈을 둔다(Foundations `Spacing` 섹션의 여러 곳에 쓰는 간격). 모바일은 틈이 없다.
  - 패널의 기본 너비·높이는 `size/shell/*` 변수 값이다(실제 Windows 11 새 Start의 배율 100% 크기, Foundations `Size` 섹션). 화면이 작으면 작업 영역 안에 들어가게 줄인다. 높이는 `작업 영역 높이 - 틈`까지, 너비는 화면 너비에서 좌우 여백을 뺀 만큼까지 줄어든다. 위쪽 검색 띠와 아래쪽 사용자 띠는 그대로이고 가운데 본문만 줄며 스크롤된다. 검색 패널도 같은 크기와 규칙이다.
고정됨: |
  - 6열 × 3행(18개)을 한 화면에 보여주고, 넘치면 아래로 스크롤한다. Windows 11은 페이지 넘김 방식이지만 마우스 휠과 터치에서 스크롤이 더 자연스럽다.
  - 데스크톱에서는 칸을 끌어 순서를 바꾼다(마우스 왼쪽 버튼·펜, 4px 넘게 움직이면 시작). 끄는 동안의 모양과 움직임은 [[항목 조작:순서 바꾸기 끌기]]를 따르고(격자는 포인터를 따라 움직인다), 끈 뒤 따라오는 클릭은 항목을 열지 않는다.
  - 우클릭(모바일 길게 누르기) 메뉴: 열기 · 앞으로 이동 · 왼쪽으로 이동 · 오른쪽으로 이동 · 링크 복사(글·외부 링크만) · 시작 화면에서 고정 해제. 모바일 길게 누르기 메뉴도 같다.
    - 앞으로 이동은 그 칸을 화면 맨 앞 칸으로 옮기고, 왼쪽·오른쪽으로 이동은 옆 칸과 자리를 바꾼다.
    - 이동 메뉴는 칸의 위치에 따라 보인다. 고를 수 없는 메뉴는 흐리게 하지 않고 숨긴다(실제 Windows와 같다).

      | 칸 | 보이는 이동 메뉴 |
      |---|---|
      | 첫 칸 | 오른쪽으로 이동 |
      | 둘째 칸 | 왼쪽으로 이동 · 오른쪽으로 이동 |
      | 마지막 칸 | 앞으로 이동 · 왼쪽으로 이동. 마지막 칸이 둘째 칸이면 왼쪽으로 이동만 |
      | 그 밖의 칸 | 앞으로 이동 · 왼쪽으로 이동 · 오른쪽으로 이동 |

    - 위치는 화면에 보이는 순서로 판단한다. 휴지통에 있어 보이지 않는 항목은 건너뛰고, 옆에 보이는 칸과 자리를 바꾼다([[Start 메뉴:검토한 대안]]). 칸이 하나뿐이면 이동 메뉴가 없다.
    - 이동 메뉴를 누르면 메뉴는 그 순간 사라진다. 이어서 옮기는 칸이 제자리에서 조금 작아지며 사라지고, 나머지 칸은 미끄러지지 않고 자리를 바꾸며 교차 페이드한다(옛 자리에서 사라지고 새 자리에서 동시에 나타남). 마지막으로 옮기는 칸이 도착할 자리에서 나타난다. 세 단계는 겹치지 않고 이어진다. 실제 Windows 11과 같다. 값과 단계 사이 간격은 피그마의 움직임이 정한다([[디자인 기반:모션 견본]]).
    - 이동은 메뉴를 고른 순간 확정이다. 움직이는 도중 Start가 닫혀도 순서는 바뀐 대로 저장한다.
  - 고정할 수 있는 항목과 처음 고정 목록은 [[고정:시작 화면 고정]]에서 정한다.
모두: |
  고정됨 바로 아래에 모든 폴더·글·외부 링크·앱을 나열한다. Windows 11의 `모두`(모든 앱) 자리다. 휴지통에 들어간 항목은 뺀다.
  오른쪽 위 `보기:` 드롭다운으로 세 가지 보기를 바꾼다. 고른 보기는 브라우저에 저장된다. 처음 보기와 [[다시 시작:되돌리는 상태]] 뒤의 보기는 범주다.

  | 보기 | 모양 |
  |---|---|
  | 간단히 | 이름순 목록. 첫 글자별로 묶고(기호로 시작 `&`, 숫자로 시작 `#`, `A`, `B`, ..., `ㄱ`, `ㄴ`, ...), 글자 머리글을 누르면 그 글자로 이동한다 |
  | 그리드 | 이름순 아이콘 격자. 간단히와 같이 첫 글자별로 묶는다(기호로 시작 `&`, 숫자로 시작 `#`) |
  | 범주 | 항목 종류(폴더 / 글 / 외부 링크 / 앱)마다 카드 하나를 4열 격자로 놓는다. 카드 안은 이름순이다(아래 범주 카드) |

  - 목록의 줄은 클릭·Enter·Space로 연다.
  - 모두 목록의 항목(줄·칸, 범주 카드의 큰 아이콘과 펼침 팝업의 항목 포함) 우클릭(모바일 길게 누르기) 메뉴: 열기 · 시작 화면에 고정(이미 고정된 항목은 시작 화면에서 고정 해제) · 링크 복사(글·외부 링크만) · 작업 표시줄에 고정(앱만, 이미 고정된 앱은 작업 표시줄에서 고정 해제).
  - "고정됨"과 "모두" 영역은 화면 읽기 프로그램이 구분하도록 각각 이름을 가진다.

  범주 카드: 범주 보기는 머리글 대신 범주마다 카드 하나를 4열 격자로 놓고, 카드 아래에 범주 이름을 쓴다.
  - 카드 안은 2×2다. 큰 아이콘 3개(범주 안 이름순 앞 3개)와 나머지 항목을 작게 모은 묶음 하나가 놓인다. 큰 아이콘을 누르면 그 항목을 바로 연다([[창 동작:열기 규칙]]).
  - 작은 묶음이나 카드의 빈 곳을 누르면 펼침 팝업이 열린다. 바깥을 클릭하거나 Esc를 누르면 닫는다.
  - 항목이 3개 이하인 범주는 항목 수만큼 큰 아이콘을 앞에서부터 놓고, 남은 칸은 묶음 없이 비워 둔다. 빈 칸을 눌러도 카드의 빈 곳이라 펼침 팝업이 열린다. 항목이 없는 범주는 카드를 두지 않는다.
  - 카드와 큰 아이콘은 [[디자인 시스템:커서]]대로 화살표 커서이고, 누를 수 있다는 것은 호버 바탕으로 알린다.
  - 키보드: [[접근성:Tab]]대로 범주 격자는 Tab 한 번에 닿는 항목 하나다. 카드 하나가 항목 하나이고, 방향키로 4열 격자의 카드 사이를 옮긴다. Enter를 누르면 그 카드의 펼침 팝업을 연다. 큰 아이콘을 바로 여는 것은 마우스 지름길로만 둔다.

  펼침 팝업: 실제 Windows 11 Start의 범주 폴더와 같다.
  - 자리: Start 패널의 가로·세로 정가운데에 연다. 누른 카드의 위치와 상관없다.
  - 크기: 항목 수와 상관없이 고정이다. 모바일은 너비만 다르다. 크기는 피그마 `Start/CategoryFolder`(`Device=Desktop`·`Mobile`)에 있다.
  - 모양: 가운데 정렬한 범주 이름 아래에 항목(아이콘·이름)을 4열 × 3줄 격자로 놓는다. 재질은 플라이아웃이다([[디자인 기반:재질 효과]]). 모양은 피그마 `Start/CategoryFolder`에 있다.
  - 넘칠 때: 스크롤바 없이 한 쪽(3줄)씩 넘긴다. 휠을 한 번 굴리면 격자가 한 쪽만큼 위로 미끄러지고 다음 쪽이 아래에서 올라온다. 반대로 굴리면 한 쪽씩 되돌아간다. 마지막 쪽에서 더 넘기면 스크롤 끝처럼 움직이지 않는다. 제목과 쪽 표시 점은 제자리에 있고, 격자만 제목 아래 경계에서 잘린다. 오른쪽의 쪽 표시 점은 지금 쪽을 크게 보이고, 넘기기 시작하자마자 바뀐다.
  - 열기: 누른 카드의 아이콘과 이름의 가운데에서 팝업 전체가 한 장처럼 커지며 가운데 자리로 온다. 페이드는 없다.
  - 닫기: 그 카드 자리로 줄어들며 닫힌다. 끝까지 불투명하다.
  - 열린 채 다른 카드를 누르면 닫히기만 한다.
  - 팝업이 열려도 뒤의 Start는 어두워지거나 흐려지지 않는다.
  - 범주 안의 하위 폴더는 없다. 팝업 안에서 다른 폴더로 들어가는 이동은 두지 않는다.
  - 키보드: 팝업 안은 방향키로 항목 사이를 옮기고 Enter로 연다. Esc는 팝업을 닫고 포커스를 그 카드로 돌려준다.
  - 움직임의 시간·이징은 피그마의 움직임이 정한다([[디자인 기반:모션 견본]]).

  글자 머리글: 간단히·그리드 보기에서 누를 수 있는 머리글(`A`, `B`, ...)은 줄 전체 너비가 누르는 영역이다. 호버하면 목록 항목(`ListItem`)과 같은 호버 배경과 모션(`motion-control-state`)을 쓴다. 범주 보기는 카드라 머리글이 없다.

  글자로 이동하기: 목록의 첫 글자 머리글을 누르면 글자 격자가 열리고, 글자를 고르면 격자가 닫히며 목록이 그 글자로 이동한다. 글자 격자가 열리고 닫힐 때 움직임이 있다(`motion-start-jump-list-enter`·`motion-start-jump-list-exit`, [[디자인 기반:모션]]).
  글자 격자는 `&`(기호로 시작하는 항목) `#`(숫자로 시작하는 항목) `A`~`Z` `ㄱ`~`ㅎ` 순서의 4열 격자다. 항목이 없는 글자는 흐리게 보이고 누를 수 없다. Windows의 시계(최근 항목)·지구본(기타 문자) 칸은 우리 목록에 그 묶음이 없어 두지 않는다. 그래서 격자에 칸이 없는 문자(한글·라틴 밖의 문자)로 시작하는 항목은 `&`에 넣는다. 악센트가 붙은 라틴 글자는 악센트를 뗀 글자(`É` → `E`), 된소리는 예사소리(`ㄲ` → `ㄱ`)에 넣는다. 격자가 열리면 "모두" 제목 줄 오른쪽에 "뒤로" 버튼이 나온다.
  `보기:` 전환은 움직임 없이 바로 바뀐다. 실제 Windows 11 Start와 같다.
검색: |
  - 위쪽 검색 입력칸은 작업 표시줄 검색 입력칸과 같은 컴포넌트라 포커스할 때 돋보기 아이콘의 효과도 같다([[검색:입력칸]]). 접근성 이름은 `시작 메뉴 검색`이다. 작업 표시줄 검색칸과 이름이 겹치지 않게 하려는 것이다.
  - 글자를 입력하면 Start 메뉴 안이 검색 결과 화면으로 바뀐다. 결과의 규칙과 모양은 [[검색:결과 화면]]과 같다. 입력을 모두 지우면 원래 화면(고정됨, 모두)으로 돌아간다. 결과 화면으로 바뀔 때와 돌아갈 때는 움직임 없이 바로 바뀐다.
  - 이 검색칸의 검색어는 작업 표시줄 검색칸과 따로다([[검색:입력칸]]).
열기와 닫기: |
  - 고정됨·모두 목록·검색 결과에서 항목을 열면 바탕화면과 같은 규칙([[창 동작:열기 규칙]], [[항목과 폴더:종류]])으로 열고 Start 메뉴를 닫는다.
  - Start 버튼을 다시 누르거나, Esc를 누르거나, 바깥을 클릭하거나, 포커스가 밖으로 나가면 닫힌다.
  - Start 메뉴와 검색 패널은 함께 열리지 않는다. 하나를 열면 다른 하나는 닫힌다(Windows 11과 같다).
  - Start를 열면 첫 Tab 항목인 위쪽 검색칸에 포커스를 둔다. 검색 패널은 입력칸이 작업 표시줄에 있어 포커스를 옮기지 않고, 입력칸에서 Tab을 누르면 패널 안 첫 항목으로 간다.
  - 바깥을 클릭하면 버튼을 뗄 때 닫힌다(Base UI 기본).
검토한 대안: |
  - 앞으로 이동이 보이는지를 저장한 고정 목록의 첫 자리로 판단: 휴지통에 있어 보이지 않는 항목이 앞에 있으면 화면 맨 앞 칸에도 앞으로 이동이 보여서 고르지 않았다. 그래서 화면에 보이는 순서로 판단한다.
모바일: |
  패널 높이는 [[Start 메뉴:구성]]을 따른다. 배치는 `ShellSurface`·`Start/Menu`의 `Device=Mobile`이다.
