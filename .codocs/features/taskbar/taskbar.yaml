_codocs:
  id: taskbar
  name: 작업 표시줄
  parent:
    - 화면별 기능
개요: |
  화면 아래 작업 표시줄의 구성, 앱 버튼 동작, 고정, 시계를 정한다.
  Start 메뉴와 검색 패널의 내용은 각각의 문서에서 정한다. 모바일에서의 동작은 [[작업 표시줄:모바일]]에서 정한다.
구성: |
  영역 구성은 `Taskbar/Default`가 보여 준다. 검색 입력칸은 [[검색:입력칸]]을 따른다.

  작업 보기, 위젯, 채팅, 시스템 아이콘(와이파이, 소리, 배터리), 알림은 블로그에 필요하지 않아 두지 않는다.
앱 버튼: |
  앱 버튼은 앱 단위다. 같은 앱의 창이 여러 개여도 버튼은 하나다.

  | 상황 | 클릭하면 |
  |---|---|
  | 열린 창이 없음 | 앱을 새로 연다. 탐색기는 "바탕 화면" 위치([[창 동작:열기 규칙]]), Chrome은 새 탭 페이지로 연다 |
  | 창이 1개이고 맨 앞에 있음 | 최소화한다 |
  | 창이 1개이고 뒤에 있거나 최소화됨 | 복원하고 맨 앞으로 가져온다 |
  | 창이 여러 개 | 창 미리보기 목록을 띄우고, 고른 창을 맨 앞으로 가져온다 |

  열린 창이 있으면 `TaskbarButton` `Indicator=Running`, 맨 앞 창이 이 앱이면 `Indicator=Active`다.

  Chrome 새 탭 페이지의 내용은 Chrome 문서에서 정한다.
창 미리보기: |
  앱 버튼에 마우스를 올리거나 창이 여러 개일 때 클릭하면, 그 앱의 창별 미리보기를 띄운다.
  미리보기는 실제 창 내용을 작게 그린 축소 화면이며, 창 제목과 닫기 버튼을 함께 보여준다. 미리보기를 누르면 그 창을 맨 앞으로 가져오고, 닫기 버튼을 누르면 그 창을 닫는다.

  - 마우스를 올리면 400ms 뒤에 열리고, 마우스가 나가면 300ms 뒤에 닫힌다. 클릭으로 연 목록도 마우스가 나가면 300ms 뒤에 닫힌다. 터치로 연 목록은 마우스가 나가는 동작이 없어 그대로 둔다.
  - 마우스를 올려 연 목록에서 버튼을 누르면 닫지 않고 클릭으로 연 목록으로 바꾼다.
  - 다른 앱 버튼으로 마우스를 옮기면 그 버튼의 400ms 뒤에 목록이 바뀌고, 그동안 앞의 목록은 그대로 둔다.
  - 목록은 작업 표시줄 위 끝에서 12px(`spacing/md`) 띄워 연다.
  - 모바일 목록의 너비는 [[작업 표시줄:모바일]]에서 정한다.
  - 축소 화면 높이(`size/window-preview/thumbnail-height`)는 일정하고, 카드 폭은 창 비율(창이 화면에서 차지한 너비 ÷ 높이)을 따른다. 카드 폭 = 축소 화면 높이 × 창 비율 + 좌우 여백이고, 최대 `size/window-preview/width`다. 최대 폭보다 넓은 창은 축소 화면 폭에 맞춰 줄인다.
  - 미리보기 판에는 안쪽 여백을 두지 않는다. 카드가 판을 가장자리까지 채우고, 판 모서리 둥글기는 카드에 맞춘다. 카드가 여러 장이면 카드끼리 틈 없이 붙여, 호버한 카드 영역 전체가 칠해진다.
  - 키보드로 열면 첫 카드에 포커스를 둔다. 카드는 ←/→로 옮기고 Delete로 그 창을 닫는다.

  제목 카드(아이콘과 제목만)로 시작하는 방식도 검토했지만, Windows 11과 같은 실제 축소 화면을 골랐다. 창 축소 화면의 구성과 구현 방식은 [[디자인 시스템:조립]]을 따른다.
고정과 순서: |
  - 작업 표시줄에 보이는 앱은 고정한 앱과 창이 열린 앱이다. 고정한 앱을 고정 순서대로 두고, 그 뒤에 고정하지 않은 실행 중인 앱을 처음 연 차례로 둔다.
  - 고정을 해제한 앱은 창이 열려 있는 동안만 보이고, 창을 모두 닫으면 사라진다.
  - 데스크톱에서는 고정한 앱 버튼을 마우스 왼쪽 버튼·펜으로 4px 넘게 끌어 순서를 바꾼다. 끄는 동안의 모양과 움직임은 [[항목 조작:순서 바꾸기 끌기]]를 따르고(가로로만 움직인다), 끈 뒤 따라오는 클릭은 무시한다. 고정하지 않은 앱 버튼은 끌 수 없다.
  - 앱 버튼을 끄는 동안 그 앱의 실행 표시(아래 표시줄)를 숨기고, 놓으면 돌아온다.
  - 고정 대상과 처음 고정 목록은 [[고정:작업 표시줄 고정]]에서 정한다.
우클릭 메뉴: |
  - 앱 버튼: 앱 이름 · 작업 표시줄에 고정 또는 작업 표시줄에서 제거 · 창 닫기.
    - 점프 목록이 있는 앱은 이 앱 묶음 위에 점프 목록을 두고, 점프 목록과 앱 묶음 사이에만 구분선을 둔다. 점프 목록이 비면 구분선도 숨긴다.
    - Chrome 점프 목록: 머리글 "자주 방문" 아래 [[Chrome:새 탭 페이지]]와 같은 Blog 최신 글 6개(Project·About과 휴지통에 있는 글 제외, 휴지통에 넣으면 다음 글이 채운다)를 글 아이콘과 함께 보인다. 누르면 그 글을 Chrome 맨 앞 창의 새 탭으로 열고, 창이 없으면 새 창으로 연다. 고정·제거는 없고 보여 주기만 한다. 그 아래 머리글 "작업"에 "새 창"(앱 이름과 같은 동작) 하나만 둔다. 시크릿 창은 기능이 없어 두지 않는다.
    - 탐색기 점프 목록: 머리글 "고정됨" 아래 탐색기 즐겨찾기와 같은 목록([[고정:즐겨찾기 고정]], 휴지통에 있는 폴더는 숨긴다)을 폴더 아이콘과 이름으로 고정한 차례대로 보인다. 목록이 비면 머리글과 구분선을 함께 숨긴다.
      - 항목에 마우스를 올리면 줄 전체가 칠해지고 오른쪽 끝에 압정 해제 버튼이 따로 나온다. 버튼을 누르면 그 폴더를 목록에서 빼고 점프 목록은 열어 둔다. 버튼은 마우스 전용이고, 키보드는 항목 메뉴의 "이 목록에서 고정 해제"를 쓴다.
      - 항목을 누르면 그 폴더를 연 새 탐색기 창을 띄운다(탐색기 창이 열려 있어도 새 창).
      - 항목을 우클릭(키보드는 Shift+F10·메뉴 키)하면 그 자리에 항목 메뉴 "열기 / 구분선 / 이 목록에서 고정 해제"를 띄우고 점프 목록은 닫지 않는다. 열기는 항목을 누른 것과 같다. 고정 해제를 고르면 항목 메뉴만 닫고 포커스를 점프 목록으로 돌려준다.
      - Windows 11처럼 작업 표시줄 탐색기 버튼에 폴더를 끌어 놓아 고정할 수는 없다. 넣는 방법은 탐색 창 끌기와 폴더 우클릭 메뉴다([[파일 탐색기:탐색 창]], [[파일 탐색기:우클릭 메뉴]]).
    - 앱 메뉴와 점프 목록의 너비는 `size/menu/taskbar-width`다. 다른 메뉴는 `size/menu/width` 그대로다.
    - 앱 이름을 누르면 새 창을 연다. 탐색기는 "바탕 화면" 위치([[창 동작:열기 규칙]]), Chrome은 새 탭 페이지다.
    - 창이 둘 이상이면 창 닫기 대신 모든 창 닫기를 보이고, 창이 없으면 창 닫기를 숨긴다.
    - 메뉴는 작업 표시줄 위 끝에서 12px(`spacing/md`) 띄워 버튼 가운데 위에 연다. 모바일 길게 누르기는 누른 자리 근처에 띄운다([[반응형:입력 차이]]).
    - 메뉴가 열리면 창 미리보기를 닫는다.
  - 빈 곳: 메뉴가 없다. Windows 11에는 작업 표시줄 설정만 있어 두지 않는다.
시계: |
  방문자 기기의 현재 시간과 날짜를 보여주고 분이 바뀔 때마다 갱신한다. 예: `오후 3:24` / `2026-10-20`
  클릭해도 아무 동작을 하지 않는다. 달력 플라이아웃은 블로그 기능과 관계가 없어 두지 않는다.
모바일: |
  | 항목 | 모바일 |
  |---|---|
  | 창 전환 | 작업 표시줄의 앱 버튼. 창이 여러 개면 미리보기 목록([[작업 표시줄:창 미리보기]]) |
  | 검색 | 작업 표시줄이 좁아 검색 입력칸 대신 검색 버튼을 두고, 누르면 열리는 검색 패널 안에 입력칸이 있다 |
  | 창 미리보기 목록 | 목록 너비는 각 카드를 창 비율 폭([[작업 표시줄:창 미리보기]])으로 놓은 너비와 화면 폭에서 좌우 12px을 뺀 폭 중 작은 쪽이고, 넘치면 카드는 같은 너비로 줄어든다. 카드 안 축소 화면의 높이(`size/window-preview/thumbnail-height`)는 그대로다 |
