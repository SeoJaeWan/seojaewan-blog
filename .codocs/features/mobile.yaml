_codocs:
  id: mobile
  name: 모바일
  parent:
    - 화면별 기능
개요: |
  휴대폰처럼 좁은 화면에서 각 화면이 어떻게 달라지는지 정한다.
  진짜 Windows에는 모바일이 없으므로, Windows 11 느낌을 유지하되 휴대폰에서 쓸 수 있게 줄이는 방향이다. 여기서 정하지 않은 동작은 각 화면 문서를 따른다.
기준: |
  화면 폭이 768px 미만이면 모바일 방식으로 보여준다. 768px 이상(태블릿 포함)은 데스크톱 방식이다.
차이: |
  | 항목 | 모바일 |
  |---|---|
  | 바탕화면 아이콘 | 항상 자동 정렬. 드래그 이동은 없고 탭으로 연다 |
  | 창 | 항상 전체화면. 이동·크기 조절·스냅이 없다. 여러 개를 열 수 있지만 한 번에 하나만 보인다 |
  | 창 전환 | 작업 표시줄의 앱 버튼. 창이 여러 개면 미리보기 목록([[작업 표시줄:창 미리보기]]) |
  | 탭 | 탐색기와 Chrome 모두 탭 하나. 탭 표시줄을 숨기고, 새 글은 같은 탭에서 연다 |
  | 우클릭 메뉴 | 길게 누르기로 연다 |
  | 여러 개 선택, 드래그 이동, 창 사이 드래그 | 없다. 옮기기는 길게 누르기 메뉴의 잘라내기 → 붙여넣기로 한다 |
  | Start·검색 | 화면 아래에서 올라오는 전체 폭 패널 |

  탐색기 왼쪽 탐색 창, Chrome 도구 모음, 글 목차처럼 좁은 화면에서 자리가 부족한 요소의 세부 배치는 피그마 Screens를 만들 때 정한다([[구현 순서:5단계 피그마 Screens]]).
