_codocs:
  id: mobile
  name: 모바일
  parent:
    - 화면별 기능
개요: |
  휴대폰처럼 좁은 화면에서 각 화면이 어떻게 달라지는지 정한다.
  진짜 Windows에는 모바일이 없으므로, Windows 11 느낌을 유지하되 휴대폰에서 쓸 수 있게 줄이는 방향이다. 여기서 정하지 않은 동작은 각 화면 문서를 따른다.
기준: |
  화면 폭이 768px 미만이면 모바일 방식으로 보여준다. 768px 이상(태블릿 포함)은 데스크톱 방식이다.
차이: |
  | 항목 | 모바일 |
  |---|---|
  | 바탕화면 아이콘 | 항상 자동 정렬. 드래그 이동은 없고 탭으로 연다 |
  | 창 | 항상 전체화면. 이동·크기 조절·스냅이 없다. 여러 개를 열 수 있지만 한 번에 하나만 보인다 |
  | 창 전환 | 작업 표시줄의 앱 버튼. 창이 여러 개면 미리보기 목록([[작업 표시줄:창 미리보기]]) |
  | 탭 | 탐색기와 Chrome 모두 탭 하나. 탭 표시줄을 숨기고, 새 글은 같은 탭에서 연다 |
  | 우클릭 메뉴 | 길게 누르기로 연다 |
  | 여러 개 선택, 드래그 이동, 창 사이 드래그 | 없다. 옮기기는 길게 누르기 메뉴의 잘라내기 → 붙여넣기로 한다 |
  | Start·검색 | 화면 아래에서 올라오는 전체 폭 패널. 작업 표시줄이 좁아 검색 입력칸 대신 검색 버튼을 두고, 누르면 열리는 검색 패널 안에 입력칸이 있다 |

  좁은 화면의 세부 배치는 피그마 Screens(390×844 기준)에서 다음과 같이 정했다([[구현 순서:5단계 피그마 Screens]]).

  | 요소 | 모바일 배치 |
  |---|---|
  | 창 제목 표시줄 | 탭 표시줄 대신 32px 제목 표시줄(앱 아이콘, 제목, 최소화·닫기)만 둔다. 항상 전체화면이라 최대화·복원 버튼은 숨긴다 |
  | 탐색기 주소 표시줄 | 뒤로 버튼, 경로, 검색 버튼(누르면 검색 상자로 바뀜). 앞으로·위로·새로 고침은 두지 않는다 |
  | 탐색기 명령 모음 | 글자 없이 아이콘 버튼만 둔다(새 폴더, 잘라내기, 붙여넣기, 이름 바꾸기, 삭제, 정렬, 보기) |
  | 탐색기 왼쪽 탐색 창 | 숨긴다. 상위 폴더로는 경로나 뒤로 버튼으로 간다 |
  | Chrome 도구 모음 | 뒤로, 주소창, ⋮ 메뉴만 둔다. 앞으로·새로고침은 ⋮ 메뉴 맨 위로 옮긴다(휴대폰 Chrome과 같은 배치) |
  | 글 목차 | 제목 아래 접힌 목차([[Chrome:글 화면]]의 좁은 창과 같다) |
  | Start·검색 패널 | 화면 폭을 채우고 작업 표시줄 바로 위에 붙는 높이 640px 패널. 위쪽 모서리만 둥글다. Start 고정됨은 4열, 검색 패널 추천은 1열 3개 |
  | 검색 결과 | 최고 일치 카드를 맨 위에 두고 그 아래 나머지 결과를 둔다(데스크톱은 오른쪽에 둔다) |
  | 창 미리보기 목록 | 화면 폭(좌우 12px 여백)에 맞게 축소해 작업 표시줄 위 가운데에 띄운다 |
  | 길게 누르기 메뉴 | 데스크톱 우클릭 메뉴와 같은 메뉴를 누른 자리 근처에 띄운다 |
