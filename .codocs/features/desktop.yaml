_codocs:
  id: desktop
  name: 바탕화면
  parent:
    - 화면별 기능
개요: |
  바탕화면에 무엇이 보이고, 방문자가 아이콘을 어떻게 배치하고 조작하며, 우클릭 메뉴에 무엇이 있는지 정한다.
  모바일에서의 동작은 모바일 문서에서 따로 정한다.
표시하는 항목: |
  [[작업 공간:배치]]에서 상위 폴더가 없는 항목(폴더, 글, 외부 링크)과 휴지통을 보여준다.
  바탕화면에 별도의 고정 목록은 없다. 항목을 폴더 안으로 옮기면 바탕화면에서 사라지고, 바탕화면으로 옮기면 나타난다.
아이콘 배치: |
  아이콘은 항상 격자 위에 놓인다. 두 상태가 있다.

  - 자동 정렬 켜짐: 아이콘을 왼쪽 위부터 격자 순서대로 채운다. 드래그로 다른 칸에 옮길 수 없고, 놓으면 정렬된 자리로 돌아간다. 폴더나 휴지통 위에 놓는 것은 된다.
  - 자동 정렬 꺼짐: 아이콘을 드래그해 격자의 원하는 칸에 둔다.

  격자 순서는 위에서 아래로, 그다음 왼쪽에서 오른쪽으로 읽는다(열 우선). 자동 정렬이 채우는 순서, Shift 범위 선택, 새 항목이 놓이는 빈 칸을 찾는 순서가 모두 이 순서다.
  아이콘 크기는 큰 아이콘·보통 아이콘·작은 아이콘 세 단계다.

  아이콘 위치, 아이콘 크기, 자동 정렬 설정은 브라우저에 저장되며 [[작업 공간:다시 시작]]하면 처음 상태로 돌아간다.
아이콘 조작: |
  | 조작 | 동작 |
  |---|---|
  | 클릭 | 선택 |
  | 더블클릭, Enter | 열기([[창 동작:열기 규칙]]) |
  | Ctrl + 클릭 | 여러 개 선택에 추가·제외 |
  | Shift + 클릭 | 마지막으로 선택한 아이콘부터 클릭한 아이콘까지 격자 순서로 범위 선택 |
  | 빈 곳에서 드래그 | 사각형으로 여러 개 선택 |
  | 아이콘 드래그 | 다른 칸으로 옮기기. 여러 개를 선택했으면 같이 옮긴다 |
  | 폴더·휴지통 위로 드래그 | 그 폴더로 이동 / 휴지통으로 보내기 |
  | 탐색기 창 위로 드래그 | 그 창이 보고 있는 폴더로 이동([[파일 탐색기:조작]]) |
  | 방향키 | 격자에서 옆 칸의 아이콘으로 선택 이동 |
  | F2 | 이름 바꾸기(폴더만) |
  | Delete | 휴지통으로 보내기 |
  | Ctrl + A | 모두 선택 |

  휴지통과 `Blog` 폴더에 대한 제한(지울 수 없음 등)은 [[작업 공간:휴지통]]을 따른다. 이름 규칙은 [[작업 공간:폴더 이름]]을 따른다.
빈 곳 우클릭 메뉴: |
  | 메뉴 | 하위 항목 |
  |---|---|
  | 보기 | 큰 아이콘 · 보통 아이콘 · 작은 아이콘, 아이콘 자동 정렬 |
  | 정렬 기준 | 이름 · 항목 유형 · 수정한 날짜 |
  | 새로 고침 | |
  | 새로 만들기 | 폴더 |

  - 정렬 기준은 누른 순간 그 기준으로 한 번 정렬한다.
  - 새로 고침은 아이콘이 잠깐 깜빡이는 연출만 한다. 실제로 바뀌는 것은 없다.
  - 격자 맞춤은 항상 켜져 있으므로 메뉴에 두지 않는다.
  - 바탕화면 아이콘 표시, 개인 설정(배경화면 변경), 디스플레이 설정, 터미널에서 열기, 추가 옵션 표시는 두지 않는다. 바탕화면 아이콘 표시를 끄면 방문자가 빈 화면만 보게 되고, 나머지는 블로그에 필요하지 않다.
아이콘 우클릭 메뉴: |
  | 항목 종류 | 메뉴 |
  |---|---|
  | 폴더 | 열기 · 새 창에서 열기 · 시작 화면에 고정 · 이름 바꾸기 · 삭제 |
  | 글 | 열기 · 새 창에서 열기 · 링크 복사 · 시작 화면에 고정 · 삭제 |
  | 외부 링크 | 열기 · 링크 복사 · 시작 화면에 고정 · 삭제 |
  | 휴지통 | 열기 · 휴지통 비우기 |
  | 여러 개 선택 | 열기 · 삭제 |

  - 새 창에서 열기: 이미 열린 탐색기나 Chrome 창이 있어도 새 창으로 연다. 기본 열기가 기존 창의 새 탭인지 새 창인지는 탐색기·Chrome 문서에서 정한다.
  - 링크 복사: 글은 공유 링크([[제품 정의:블로그 기능]]), 외부 링크는 그 URL을 클립보드에 복사한다.
  - 시작 화면에 고정: Start 메뉴의 고정됨에 추가한다([[Start 메뉴:고정됨]]). 이미 고정된 항목이면 `시작 화면에서 고정 해제`로 바뀐다.
  - 이름 바꾸기는 폴더만 된다. 글과 외부 링크는 원본의 이름을 따른다.
  - 휴지통 비우기는 메시지 상자만 보여준다([[작업 공간:휴지통]]).
배경화면: |
  Windows 11 기본 배경(Bloom)을 쓴다. Microsoft 저작물이지만 앱 로고와 마찬가지로 화면 재현 용도로 쓴다.
  화면 비율이 다양하므로 화면을 꽉 채우고 넘치는 부분을 잘라낸다(`object-fit: cover`).
  같은 이미지를 창의 Mica 효과에도 쓴다([[디자인 기반:재질 효과]]).

  배경화면 변경 기능은 두지 않는다.
