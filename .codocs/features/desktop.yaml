_codocs:
  id: desktop
  name: 바탕화면
  parent:
    - 화면별 기능
개요: |
  바탕화면에 무엇이 보이고, 방문자가 아이콘을 어떻게 배치하고 조작하며, 우클릭 메뉴에 무엇이 있는지 정한다.
  모바일에서의 동작은 모바일 문서에서 따로 정한다.
표시하는 항목: |
  [[작업 공간:배치]]에서 상위 폴더가 없는 항목(폴더, 글, 외부 링크)과 휴지통을 보여준다.
  바탕화면에 별도의 고정 목록은 없다. 항목을 폴더 안으로 옮기면 바탕화면에서 사라지고, 바탕화면으로 옮기면 나타난다.
  휴지통에 항목이 하나라도 있으면 휴지통 아이콘은 가득 찬 모양이고, 모두 복원하면 빈 모양으로 돌아온다.
아이콘 배치: |
  아이콘은 항상 격자 위에 놓인다. 두 상태가 있다.

  - 자동 정렬 켜짐: 아이콘을 왼쪽 위부터 격자 순서대로 채운다. 드래그로 다른 칸에 옮길 수 없고, 놓으면 정렬된 자리로 돌아간다. 폴더나 휴지통 위에 놓는 것은 된다.
  - 자동 정렬 꺼짐: 아이콘을 드래그해 격자의 원하는 칸에 둔다. 끄는 순간 지금 자리를 모두 기억한다. 다른 아이콘이 있는 칸에 놓으면 가장 가까운 빈 칸으로 간다. 화면이 작아져 기억한 칸이 격자 밖이면 가장 가까운 빈 칸에 보이지만 기억한 칸은 그대로라, 화면이 다시 커지면 돌아간다. 끈 채 정렬 기준을 고르면 그 차례로 한 번 다시 놓는다.

  격자 순서는 위에서 아래로, 그다음 왼쪽에서 오른쪽으로 읽는다(열 우선). 자동 정렬이 채우는 순서, Shift 범위 선택, 새 항목이 놓이는 빈 칸을 찾는 순서가 모두 이 순서다.

  아이콘 크기는 큰 아이콘·보통 아이콘·작은 아이콘 세 단계다. 칸은 아이콘 너비(큰 112px·보통 76px·작은 76px)와 이름이 한 줄일 때의 높이(122px·74px·58px)에 간격 16px을 더한 크기이고, 가장자리 여백은 8px이다. 이름이 두 줄이어도 칸은 같다. 칸 수는 작업 영역에서 아이콘이 잘리지 않는 만큼이다.

  처음에는 보통 아이콘, 자동 정렬 켜짐, 정렬 기준 이름이다. 아이콘 위치, 아이콘 크기, 자동 정렬, 정렬 기준은 브라우저에 저장되며([[작업 공간:방문자별 저장]]) [[작업 공간:다시 시작]]하면 처음 상태로 돌아간다.
아이콘 조작: |
  | 조작 | 동작 |
  |---|---|
  | 클릭 | 선택. 누를 때 고르지 않은 아이콘은 그것만 고른다. 이미 고른 아이콘은 함께 끌 수 있게 그대로 두고, 끌지 않고 놓으면 그것만 고른다 |
  | 더블클릭, Enter | 열기([[창 동작:열기 규칙]]). 여러 개를 고른 채 Enter나 메뉴의 열기를 고르면 모두 열고, 더블클릭은 그 아이콘만 연다 |
  | Ctrl + 클릭 | 놓을 때 여러 개 선택에 추가·제외 |
  | Shift + 클릭 | 누를 때 마지막으로 선택한 아이콘부터 클릭한 아이콘까지 격자 순서로 범위 선택 |
  | 빈 곳에서 드래그 | 사각형으로 여러 개 선택. Ctrl을 누르고 시작하면 지금 선택에 더한다 |
  | 아이콘 드래그 | 누른 뒤 4px 넘게 움직이면 끌기를 시작한다(마우스 왼쪽 버튼과 펜). 다른 칸으로 옮기기. 여러 개를 선택했으면 같이 옮긴다. 끄는 동안 반투명한 복제본이 포인터를 따라가고, 원래 자리의 아이콘은 선택된 모습으로 남는다 |
  | 폴더·휴지통 위로 드래그 | 그 폴더로 이동 / 휴지통으로 보내기. 끌어서 폴더 위에 올리면 그 폴더가 강조되고 포인터 오른쪽 아래 16px에 `○○(으)로 이동` 툴팁이 나타나며, 놓으면 그 폴더로 들어간다. `(으)로`는 실제 Windows 표기다 |
  | 옮길 수 없는 곳 위로 드래그 | 옮길 수 없는 곳([[작업 공간:배치]]) 위에서는 강조와 툴팁 없이 커서가 `not-allowed`이고, 놓으면 제자리다. 놓을 곳이 아닌 곳(작업 표시줄, 창의 제목 표시줄 등)에 놓아도 아무것도 하지 않는다 |
  | 탐색기 창 위로 드래그 | 그 창이 보고 있는 폴더로 이동([[파일 탐색기:조작]]) |
  | 방향키 | 그 방향에서 가장 가까운 아이콘으로 선택 이동. 다른 축으로 벗어난 거리에 2배 무게를 줘 같은 줄을 먼저 고른다 |
  | Shift + 방향키 | 범위 선택을 넓힌다 |
  | 우클릭 | 빈 곳은 선택을 지우고, 고르지 않은 아이콘은 그것만 고른 뒤 메뉴를 연다 |
  | F2 | 이름 바꾸기(폴더만) |
  | Delete | 휴지통으로 보내기. 보낸 뒤 격자 순서에서 마지막으로 지운 아이콘의 다음 아이콘(없으면 앞의 가장 가까운 아이콘)을 고르고 포커스를 옮긴다. 남은 아이콘이 없으면 아이콘 영역에 포커스를 둔다. 메뉴의 삭제도 같다 |
  | Ctrl + A | 모두 선택 |

  휴지통에 대한 제한(옮기거나 지울 수 없음)은 [[작업 공간:휴지통]]을 따른다. 이름 규칙은 [[작업 공간:폴더 이름]]을 따른다.
빈 곳 우클릭 메뉴: |
  | 메뉴 | 하위 항목 |
  |---|---|
  | 보기 | 큰 아이콘 · 보통 아이콘 · 작은 아이콘, 아이콘 자동 정렬 |
  | 정렬 기준 | 이름 · 항목 유형 · 수정한 날짜 |
  | 새로 고침 | |
  | 붙여넣기 | |
  | 새로 만들기 | 폴더 |

  - 정렬 기준은 하나를 고르는 선택지이고 기본값은 `이름`이다. 고른 순간 그 기준으로 한 번 정렬하고, 메뉴에는 마지막으로 고른 기준을 표시한다. 자동 정렬이 켜져 있으면 고른 기준의 순서로 격자를 계속 채운다. Windows 11 바탕화면과 같다.
  - 정렬 차례: 휴지통은 늘 맨 앞이다. 이름은 폴더를 먼저 두고 이름순(숫자는 값으로 비교하고, 영어가 한글보다 앞)이다. 항목 유형은 폴더·글·외부 링크 차례다. 수정한 날짜는 최근 것을 먼저 두고, 날짜가 없는 항목(Notion 폴더, 외부 링크)은 뒤에 이름순으로 둔다.
  - 새로 고침은 아이콘을 83ms(`motion/duration/faster`) 동안 숨겼다가 다시 보이는 연출만 한다. 서서히 변하는 효과는 없고, 실제로 바뀌는 것은 없다.
  - 붙여넣기는 잘라낸 항목을 바탕화면으로 옮긴다([[작업 공간:배치]]).
  - 격자 맞춤은 항상 켜져 있으므로 메뉴에 두지 않는다.
  - 바탕화면 아이콘 표시, 개인 설정(배경화면 변경), 디스플레이 설정, 터미널에서 열기, 추가 옵션 표시는 두지 않는다. 바탕화면 아이콘 표시를 끄면 방문자가 빈 화면만 보게 되고, 나머지는 블로그에 필요하지 않다.
아이콘 우클릭 메뉴: |
  | 항목 종류 | 메뉴 |
  |---|---|
  | 폴더 | 열기 · 새 창에서 열기 · 시작 화면에 고정 · 잘라내기 · 이름 바꾸기 · 삭제 |
  | 글 | 열기 · 새 창에서 열기 · 링크 복사 · 시작 화면에 고정 · 잘라내기 · 삭제 |
  | 외부 링크 | 열기 · 링크 복사 · 시작 화면에 고정 · 잘라내기 · 삭제 |
  | 휴지통 | 열기 · 휴지통 비우기 |
  | 여러 개 선택 | 열기 · 잘라내기 · 삭제 |

  - 새 창에서 열기: 이미 열린 탐색기나 Chrome 창이 있어도 새 창으로 연다. 폴더는 새 탐색기 창, 글은 새 Chrome 창이다. 기본 열기가 기존 창의 새 탭인지 새 창인지는 탐색기·Chrome 문서에서 정한다.
  - 링크 복사: 글은 공유 링크([[제품 정의:블로그 기능]]), 외부 링크는 그 URL을 클립보드에 복사한다.
  - 시작 화면에 고정: Start 메뉴의 고정됨에 추가한다([[Start 메뉴:고정됨]]). 이미 고정된 항목의 메뉴는 `시작 화면에 고정` 대신 `시작 화면에서 고정 해제`를 보여 준다.
  - 잘라내기: 고른 항목을 잘라내 다른 위치에 붙여넣을 수 있게 한다([[작업 공간:배치]]). 데스크톱과 모바일이 같다.
  - 이름 바꾸기는 폴더만 된다. 글과 외부 링크는 원본의 이름을 따른다.
  - 휴지통 비우기는 메시지 상자만 보여준다([[작업 공간:휴지통]]).
배경화면: |
  Windows 11 기본 배경(Bloom)을 쓴다. Microsoft 저작물이지만 앱 로고와 마찬가지로 화면 재현 용도로 쓴다.
  화면 비율이 다양하므로 화면을 꽉 채우고 넘치는 부분을 잘라낸다(`object-fit: cover`).
  같은 이미지를 창의 Mica 효과에도 쓴다([[디자인 기반:재질 효과]]).

  배경화면 변경 기능은 두지 않는다.
