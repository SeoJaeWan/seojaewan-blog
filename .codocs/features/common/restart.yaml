_codocs:
  id: restart
  name: 다시 시작
  parent:
    - 화면별 기능
개요: |
  Start 메뉴의 전원 버튼에는 `다시 시작`만 둔다. 절전과 시스템 종료는 두지 않는다.
되돌리는 상태: |
  다시 시작을 누르면 재부팅 화면(Windows 로고와 로딩)을 보여준 뒤, 실행 중인 상태와 방문자의 브라우저에 저장된 상태를 전부 처음으로 되돌린다.
  - 폴더, 배치, 휴지통
  - 열린 창(모두 닫힘)
  - Start 메뉴와 작업 표시줄의 고정 목록·순서, 바탕화면 아이콘 정렬 같은 설정

  열린 창의 저장 여부와 새로고침 뒤 초기 상태는 [[창 동작:새로고침과 첫 진입]]에서 정한다.

  진짜 Windows는 다시 시작해도 설정이 남지만, 여기서는 처음 상태로 돌아가는 유일한 방법이라 전부 되돌린다. 별도의 "초기화" 메뉴는 두지 않는다.
순서: |
  1. 전원 메뉴에서 `다시 시작`을 누르면 메뉴와 Start가 닫힌다.
  2. 재부팅 화면이 지금 화면 전체를 덮으며 페이드 인한다(`motion-boot-screen-enter`).
  3. 화면을 완전히 덮은 뒤 상태를 지운다. 덮은 뒤 지워야 창이 닫히고 아이콘이 돌아가는 모습이 가려진다.
  4. 재부팅 화면을 정해진 시간(`motion/delay/boot-screen`) 동안 보여 주고, 그동안 ProgressRing이 돈다.
  5. 재부팅 화면이 페이드 아웃하며(`motion-boot-screen-exit`) 처음 상태의 바탕화면이 보인다.

  다시 시작하는 동안 바탕화면은 재부팅 화면 뒤에 있어 키보드와 포인터로 닿지 않고, 끝나면 포커스를 바탕화면에 둔다.

  움직임의 시간과 이징은 [[디자인 기반:모션]]에 있다.
초기화 방법: |
  초기화는 새로고침 없이 앱 안에서 한다. Zustand 저장소를 처음 값으로 되돌리고 `persist` 저장분을 지운 뒤, shell 아래 바탕화면 하위 트리의 `key`를 바꿔 다시 마운트한다. 재부팅 화면과 그 바깥 틀은 다시 마운트하지 않는다(연출이 끊기지 않게). 다시 마운트하면 저장소 밖의 상태도 사라진다. `location.reload()`는 연출이 끊기고 흰 화면이 끼어 쓰지 않는다.
