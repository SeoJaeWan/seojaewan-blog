_codocs:
  id: recycle-bin
  name: 휴지통
  parent:
    - 화면별 기능
개요: |
  휴지통의 제한, 보내기, 복원, 비우기를 정한다.
  탐색기에서 휴지통을 볼 때의 화면은 [[파일 탐색기:휴지통 보기]]에서 정한다.
기본 규칙: |
  - 휴지통은 바탕화면에 고정되며 옮기거나 이름을 바꾸거나 지울 수 없다.
  - 폴더, 글, 외부 링크를 모두 휴지통으로 보낼 수 있다. `Blog` 폴더도 보낼 수 있다. 폴더를 보내면 안의 항목도 함께 간다.
  - 휴지통 안의 항목은 바탕화면·탐색기·Start·검색 같은 목록에서 열 수 없고 복원만 된다. 주소로 열 때는 [[Chrome:휴지통에 있는 글]]을 따른다. 저장 여부는 [[방문자 저장:저장하지 않는 것]]에 있다.
복원: |
  - 복원은 고른 항목 가운데 휴지통에 바로 보낸 항목만 돌려놓고, 휴지통에 보낸 폴더 안의 항목은 그 폴더와 함께 돌아간다.
  - 휴지통에서 복원하면 원래 위치로 돌아간다. 원래 상위 폴더가 아직 휴지통에 있으면 바탕화면으로 간다. 함께 복원하는 폴더가 원래 상위 폴더면 그 폴더 안으로 돌아간다.
  - 복원할 자리에 같은 이름의 폴더가 있으면 합치지 않고 `React (2)`처럼 가장 작은 빈 번호를 붙여 복원한다.
비우기: |
  - 휴지통에 든 항목이 없으면 휴지통 비우기는 비활성이라 고를 수 없다. 탐색기와 바탕화면의 우클릭 메뉴, 탐색기 명령 모음이 모두 같다. 휴지통에 실제로 든 항목으로 판단한다.
  - 휴지통 비우기는 실제로 동작하지 않는다. 누르면 Windows 11 스타일 메시지 상자를 보여준다. 제목은 "휴지통 비우기", 본문은 "소중한 글이에요 지우지 말아주세요", 버튼은 "확인" 하나다. 그래서 휴지통의 항목은 언제든 복원할 수 있다. 메뉴로 연 상자를 닫으면 탐색기는 항목 자리, 바탕화면은 휴지통 아이콘에 포커스를 둔다. 명령 모음 버튼으로 연 상자는 그 버튼으로 돌아간다.

  브라우저 기본 `alert()`는 Windows 화면 안에서 웹 페이지 팝업이 떠 몰입감을 깨므로 쓰지 않는다.
