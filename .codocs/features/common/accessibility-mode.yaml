_codocs:
  id: accessibility-mode
  name: 접근성 모드
  parent:
    - 화면별 기능
개요: |
  우클릭 메뉴를 여는 길을 눈에 보이게 해 주는 접근성 모드와 접근성 패널을 정한다.
  꼭 있어야 하는 기능 가운데 우클릭 메뉴에만 있는 것(고정, 이동, 새 폴더, 정렬 등)을 마우스 오른쪽 버튼이나 써 본 사람만 아는 키 없이도 쓸 수 있게 하는 것이 목적이다([[접근성:원칙]]).
앱: |
  접근성 모드는 앱이고, 접근성 패널이 그 앱의 창이다. 켜고 끄는 것은 앱을 열고 닫는 것이다.

  | 켜는 곳 | 규칙 |
  |---|---|
  | 바탕화면 아이콘 | 이름은 `접근성 모드`다. 격자 순서에서 휴지통 바로 다음에 놓인다. 휴지통처럼 지울 수 없고 다른 폴더로 옮길 수 없고 이름을 바꿀 수 없다. 바탕화면 안에서 칸은 다른 아이콘처럼 옮긴다([[휴지통:기본 규칙]]). 메뉴는 열기와 이동 항목이고, 켜져 있으면 열기 대신 닫기와 `패널 자리`다([[바탕화면 우클릭 메뉴:아이콘]]) |
  | 작업 표시줄 | 처음부터 고정된 앱 버튼이다([[고정:작업 표시줄 고정]]). 다른 앱 버튼처럼 고정을 풀 수 있다. 켜져 있으면 메뉴에 `패널 자리`가 나온다([[작업 표시줄:우클릭 메뉴]]) |
  | Start | 모두 목록과 범주 보기의 앱에 나온다([[Start 메뉴:모두]]) |
  | 검색 | 이름으로 검색된다([[검색:검색 대상]]) |

  - 누르면 켜지고, 켜져 있을 때 다시 누르면 꺼진다.
  - 켜져 있는지는 앱 아이콘으로도 보인다. 작업 표시줄 버튼에는 다른 앱처럼 실행 중 표시(밑줄)가 붙는다([[작업 표시줄:앱 버튼]]).
  - 앱 아이콘은 사람 모양이고 다른 앱 아이콘과 같은 급의 자산이다.
  - 켜져 있을 때 바탕화면 아이콘과 작업 표시줄 앱 버튼의 메뉴에는 `패널 자리`가 있다. 하위 메뉴에서 `오른쪽 아래` · `왼쪽 아래` · `오른쪽 위` · `왼쪽 위`를 고르고, 지금 자리에 표시를 둔다. 키보드로는 여기서 패널의 자리를 옮긴다([[접근성 모드:패널]]).
  - 켜짐은 기억한다. 켜 둔 채 떠났으면 다음 방문에도 켜진 채로 뜬다([[방문자 저장:저장하는 것]]). 다시 시작을 눌러도 꺼지지 않는다([[다시 시작:되돌리는 상태]]).
패널: |
  접근성 패널은 우클릭을 대신 눌러 주는 단추만 갖는다. 우클릭 메뉴의 항목을 패널에 늘어놓지 않는다.

  | 단추 | 누르면 |
  |---|---|
  | 고른 것의 메뉴 | 지금 포커스가 있는 항목을 우클릭했을 때의 메뉴를 그 자리에 연다 |
  | 지금 있는 곳의 메뉴 | 그 항목이 놓인 곳의 빈 곳을 우클릭했을 때의 메뉴를 연다 |
  | 자리 옮기기 | 네 구석을 고르는 메뉴를 열고, 지금 자리에 표시를 둔다 |
  | 닫기 | 접근성 모드를 끈다 |

  - 단추에는 글자가 있다. 메뉴를 여는 단추의 단축키는 Shift+F10이고 단추에 적는다([[접근성:키]]). 키보드로는 패널까지 가지 않고 적힌 키를 그 자리에서 누른다.
  - 메뉴가 열리면 포커스가 메뉴 안으로 간다. 그 뒤는 그 메뉴 그대로다. 작업 표시줄 앱 버튼의 메뉴와 점프 목록 항목의 메뉴도 같은 방식으로 연다([[작업 표시줄:우클릭 메뉴]]).
  - 고른 것이 없어도 포커스는 있다. 바탕화면에 아무것도 고르지 않았으면 빈 곳의 메뉴가 열린다.
  - 포커스가 있는 곳에 열 메뉴가 없으면 그 단추를 흐리게 두고 누를 수 없게 한다. 단추를 빼지 않아 다른 단추의 자리가 바뀌지 않는다.
  - 접근성 패널은 부품(`AccessibilityPanel`)이고, 접근성 모드가 켜져 있는 동안 화면의 구석에 뜬다([[디자인 시스템:조립]]).
  - `자리 옮기기`와 `닫기` 단추는 마우스와 터치로 누른다. 키보드로는 접근성 모드 앱의 메뉴에서 같은 일을 한다([[접근성 모드:앱]]).
  - 자리는 화면의 네 구석 가운데 하나다(모바일은 [[접근성 모드:모바일]]). 처음은 오른쪽 아래이고 작업 표시줄 바로 위에 둔다. 고른 자리는 기억하고, 다시 시작을 눌러도 그대로다([[방문자 저장:저장하는 것]], [[다시 시작:되돌리는 상태]]).
  - 패널은 화면에서 늘 맨 위에 뜬다. 메뉴, Start, 검색 패널, 창, 메시지 상자와 겹치면 패널이 덮는다. 겹침을 막지 않는다. 가려지는 것이 불편하면 자리를 옮긴다.
  - 패널이 열릴 때 화면 읽기 프로그램에 패널이 열렸음을 알린다.
포커스: |
  - Tab은 패널이 없을 때와 똑같이 움직인다. 패널의 단추에는 Tab이 멈추지 않는다([[접근성:Tab]]).
  - 패널은 단추를 누르기 직전에 포커스가 있던 것에 대해 일한다.
  - 패널의 단추를 눌러도 열려 있던 것(메뉴, Start, 검색 패널, 창 미리보기)은 닫히지 않는다. 패널은 그것들의 "밖"이 아니다.
모바일: |
  | 항목 | 모바일 |
  |---|---|
  | 켜는 곳 | 데스크톱과 같이 넷이다([[접근성 모드:앱]]). 바탕화면 아이콘은 탭하면 켜지고 다시 탭하면 꺼진다 |
  | 패널의 모양 | 구석에 뜨는 상자가 아니라 화면 폭을 가득 채운 한 줄이다 |
  | 패널의 자리 | 위와 아래 둘이다. 처음은 아래이고 작업 표시줄 바로 위에 둔다 |
  | 단추 글자 | `메뉴` · `빈 곳 메뉴` · `자리` · `닫기`다. `메뉴` 옆에 Shift+F10을 적는다. 화면 읽기 프로그램이 읽는 이름은 데스크톱과 같다(`고른 것의 메뉴` 등) |
  | `자리` 단추 | 메뉴를 열지 않는다. 누를 때마다 위와 아래가 바뀐다 |
  | 접근성 모드 메뉴의 `패널 자리` | 하위 메뉴가 `위` · `아래` 둘이다 |

  단추의 종류와 하는 일은 데스크톱과 같다. 모바일에서도 패널을 두는 까닭은 길게 누르기도 화면 어디에도 적히지 않는 동작이기 때문이다.

  터치에서 `메뉴` 단추:
  - 터치에는 골라 둔 채 머무는 것이 없다. 항목을 탭하면 바로 열린다([[반응형:입력 차이]]). 그래서 `메뉴` 단추를 탭하면 "다음에 탭하는 것의 메뉴를 연다"로 바뀐다. 단추가 눌린 모습이 되고 패널에 "메뉴를 열 항목을 누르세요"를 보인다.
  - 그 상태에서 항목을 탭하면 항목이 열리지 않고, 그 자리에 길게 눌렀을 때와 같은 메뉴가 뜬다. 단추는 원래대로 돌아간다.
  - `메뉴` 단추를 다시 탭하거나 빈 곳을 탭하면 그만둔다.
  - `빈 곳 메뉴` 단추는 탭하면 바로 지금 화면의 빈 곳 메뉴를 연다.
  - 바깥 키보드를 쓸 때는 데스크톱과 같다. 포커스가 있는 것의 메뉴가 바로 열리고 Shift+F10도 듣는다.

  패널이 아래에 있으면 Start와 검색 패널의 아래쪽을 덮는다. 패널이 늘 맨 위라는 규칙 그대로이고([[접근성 모드:패널]]), 가려지는 것이 불편하면 `자리` 단추로 위로 옮긴다.
검토한 대안: |
  - 우클릭 메뉴의 항목을 패널에 아이콘 단추로 늘어놓기: 같은 항목을 메뉴와 패널 두 곳에 만들게 되고, 아이콘만으로는 터치에서 이름을 알릴 길이 없다.
  - Tab을 누르면 패널을 거쳐 가게 하기: 패널을 쓰지 않을 때도 Tab이 한 번씩 더 들어 불편하다.
  - 패널을 Tab 차례의 정해진 한 자리에 두고 거기서 메뉴를 열기: Tab으로 거쳐 가는 동안 포커스가 바뀌어 패널이 가리키는 대상이 바뀐다.
  - 패널 자체의 단추(자리 옮기기, 닫기)를 Tab 차례의 맨 끝에 두기: 메뉴를 여는 단추는 Shift+F10으로, 닫기는 앱을 다시 눌러서 할 수 있어 남는 것은 자리 옮기기뿐이다. 그것을 앱의 메뉴에 두면 Tab이 패널이 없을 때와 예외 없이 같아진다.
  - 패널로 바로 가는 키를 새로 정하기: 우클릭 메뉴를 그 자리에서 여는 Shift+F10이 이미 있다.
  - 작업 표시줄의 접근성 모드 버튼을 고정 해제할 수 없게 하기: 풀어도 지울 수 없는 바탕화면 아이콘과 Start, 검색으로 켤 수 있다.
