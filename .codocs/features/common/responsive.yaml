_codocs:
  id: responsive
  name: 반응형
  parent:
    - 화면별 기능
개요: |
  화면 크기에 따라 각 화면이 어떻게 달라지는지 정한다.
  진짜 Windows에는 모바일이 없으므로, Windows 11 느낌을 유지하되 휴대폰에서 쓸 수 있게 줄이는 방향이다. 여기서 정하지 않은 동작은 각 화면 문서를 따른다.
기준: |
  화면 구간은 PC·노트북·모바일 셋이다. 경계값은 피그마 Foundations의 코드 전용 변수(`breakpoint/*`)이고 코드는 생성된 상수(`BREAKPOINTS`)에서 읽는다([[피그마 연동:토큰 생성]]). 각 값은 "이 값 미만"이다.

  | 구간 | 조건 | 모양 |
  |---|---|---|
  | 모바일 | 폭이 `breakpoint/mobile/width` 미만. 이 판정이 먼저다 | 피그마 `Device=Mobile` 변형 |
  | 노트북 | 폭이 `breakpoint/laptop/width` 미만이거나 높이가 `breakpoint/laptop/height` 미만 | PC와 같은 `Device=Desktop` 변형. 변수 모드 Laptop 값(간격·크기·글자)만 다르다([[디자인 기반:모드]]) |
  | PC | 나머지 | `Device=Desktop` 변형 |

  - `use-device`가 `pc | laptop | mobile`을 돌려주고, 컴포넌트 props의 `desktop`·`mobile`은 피그마 변형 이름이라 층 컴포넌트가 바꿔 넘긴다.
  - 서버와 수화 첫 렌더는 화면 크기를 모르므로 PC로 그린다. 수화한 뒤 실제 구간으로 바뀌는 모습은 처음 불러올 때 덮는 재부팅 화면이 가린다([[창 동작:새로고침과 첫 진입]]).
  - 지원하는 가장 작은 크기는 320×568이다. 구간 안에서 작아질 때는 각 화면의 줄어드는 규칙(창은 작업 영역 안으로, 패널은 가운데 본문만 줄여 스크롤)을 따른다.
  - Chrome 글 화면의 넓은·좁은 모양은 화면 구간이 아니라 창 내용 너비를 따른다([[Chrome:글 화면]]).
입력 차이: |
  PC와 노트북은 입력이 같다. 모바일만 아래처럼 다르다.

  | 항목 | 모바일 |
  |---|---|
  | 우클릭 메뉴 | 길게 누르기로 연다. 길게 누른 뒤 따라오는 클릭은 무시한다(항목을 열지 않는다) |
  | 여러 개 선택, 끌기(항목 옮기기, 창 사이 이동, Start·작업 표시줄 순서 바꾸기) | 없다. 옮기기는 길게 누르기 메뉴의 잘라내기 → 붙여넣기로 하고, Start 고정됨의 순서는 길게 누르기 메뉴의 이동 항목으로 바꾼다([[Start 메뉴:고정됨]]) |
  | 탭 | 바탕화면 아이콘과 탐색기 항목은 탭하면 그 항목만 골라 연다. 데스크톱의 한 번 클릭은 선택이다 |
  | 길게 누르기 메뉴 | 데스크톱 우클릭 메뉴와 같은 메뉴를 누른 자리 근처에 띄운다 |
화면 채우기: |
  모바일의 부팅 화면(다시 시작 화면 포함, [[다시 시작]])은 고정 크기가 아니라 화면을 가득 채운다.

  - 화면 높이 기준은 동적 뷰포트(`dvh`)다. JS에서 높이를 읽을 때는 `visualViewport`를 쓰고 그 `resize`를 구독한다. 인앱 브라우저처럼 주소창이 접히며 높이가 바뀌는 경우에 대응하기 위해서다.
  - `html`과 `body`에 바탕색을 두어, 화면이 늘어나는 순간에도 흰 여백이 보이지 않게 한다.
  - 카카오톡 인앱 브라우저에서 오른쪽 여백과 아래 흰 여백이 보인다는 피드백에서 정했다.
화면별 차이: |
  화면별 동작 차이는 각 기능 문서의 `모바일` 섹션에 있고, 세부 배치는 피그마 `Device=Mobile` 변형과 Screens가 보여 준다.
