_codocs:
  id: responsive
  name: 반응형
  parent:
    - 화면별 기능
개요: |
  휴대폰처럼 좁은 화면에서 각 화면이 어떻게 달라지는지 정한다.
  진짜 Windows에는 모바일이 없으므로, Windows 11 느낌을 유지하되 휴대폰에서 쓸 수 있게 줄이는 방향이다. 여기서 정하지 않은 동작은 각 화면 문서를 따른다.
기준: |
  화면 폭이 768px 미만이면 모바일 방식으로 보여준다. 768px 이상(태블릿 포함)은 데스크톱 방식이다.
입력 차이: |
  | 항목 | 모바일 |
  |---|---|
  | 우클릭 메뉴 | 길게 누르기로 연다. 길게 누른 뒤 따라오는 클릭은 무시한다(항목을 열지 않는다) |
  | 여러 개 선택, 드래그 이동, 창 사이 드래그 | 없다. 옮기기는 길게 누르기 메뉴의 잘라내기 → 붙여넣기로 한다 |
  | 길게 누르기 메뉴 | 데스크톱 우클릭 메뉴와 같은 메뉴를 누른 자리 근처에 띄운다 |
화면별 차이: |
  화면별 차이는 각 기능 문서의 `모바일` 섹션에 있다.
  좁은 화면의 세부 배치는 피그마 Screens(390×844 기준)에서 정했다([[구현 순서:5단계 피그마 Screens]]).
