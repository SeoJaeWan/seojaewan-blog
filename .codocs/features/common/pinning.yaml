_codocs:
  id: pinning
  name: 고정
  parent:
    - 화면별 기능
개요: |
  Start 메뉴와 작업 표시줄에 무엇을 고정할 수 있고 처음에 무엇이 고정돼 있는지 정한다.
  고정한 항목을 그리고 순서를 바꾸는 방법은 [[Start 메뉴:고정됨]]과 [[작업 표시줄:고정과 순서]]에서 정한다.
  고정 목록과 순서의 저장은 [[방문자 저장:저장하는 것]], 초기화는 [[다시 시작:되돌리는 상태]]에서 정한다.
시작 화면 고정: |
  - 폴더, 글, 외부 링크, 앱을 고정할 수 있다. 바탕화면과 탐색기의 우클릭 메뉴 `시작 화면에 고정`으로 추가한다.
  - 시작 화면에 고정: Start 메뉴의 고정됨에 추가한다([[Start 메뉴:고정됨]]). 이미 고정된 항목의 메뉴는 `시작 화면에 고정` 대신 `시작 화면에서 고정 해제`를 보여 준다.
  - 처음에는 File Explorer, Chrome, `Blog` 폴더, 주요 외부 링크가 고정돼 있다. 어떤 외부 링크를 처음부터 고정할지는 외부 링크 설정 파일에서 정한다([[항목과 폴더:외부 링크]]).
  - 새로 고정한 항목은 맨 뒤에 추가한다.
  - 휴지통에 들어간 항목은 고정됨에서 보이지 않고, 복원하면 다시 보인다.

  작업 표시줄 고정은 앱만 대상으로 따로 관리한다([[고정:작업 표시줄 고정]]).
작업 표시줄 고정: |
  - 작업 표시줄에는 앱만 고정한다. 처음에는 File Explorer와 Chrome이 고정돼 있다. 폴더·글·외부 링크는 작업 표시줄이 아니라 Start 메뉴에 고정한다.

  이전 프로젝트는 외부 링크도 작업 표시줄에 고정할 수 있었지만, Windows 11처럼 앱만 고정한다.
