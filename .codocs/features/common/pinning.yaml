_codocs:
  id: pinning
  name: 고정
  parent:
    - 화면별 기능
개요: |
  Start 메뉴, 작업 표시줄, 탐색기 즐겨찾기에 무엇을 고정할 수 있고 처음에 무엇이 고정돼 있는지 정한다.
  고정한 항목을 그리고 순서를 바꾸는 방법은 [[Start 메뉴:고정됨]]과 [[작업 표시줄:고정과 순서]]에서 정한다.
  고정 목록과 순서의 저장은 [[방문자 저장:저장하는 것]], 초기화는 [[다시 시작:되돌리는 상태]]에서 정한다.
시작 화면 고정: |
  - 폴더, 글, 외부 링크, 앱을 고정할 수 있다. Start 메뉴의 고정됨에 추가한다([[Start 메뉴:고정됨]]).
  - 메뉴 항목은 `시작 화면에 고정`이다. 이미 고정된 항목은 같은 자리에 `시작 화면에서 고정 해제`를 보인다. 이 항목은 바탕화면과 탐색기의 우클릭 메뉴, Start 고정됨과 모두 목록의 우클릭 메뉴에 나온다.
  - 처음에는 File Explorer, Chrome, `Blog` 폴더, 주요 외부 링크가 고정돼 있다. 어떤 외부 링크를 처음부터 고정할지는 외부 링크 설정 파일에서 정한다([[항목과 폴더:외부 링크]]).
  - 새로 고정한 항목은 맨 뒤에 추가한다.
  - 휴지통에 들어간 항목은 고정됨에서 보이지 않고, 복원하면 다시 보인다.

  작업 표시줄 고정은 앱만 대상으로 따로 관리한다([[고정:작업 표시줄 고정]]).
작업 표시줄 고정: |
  - 작업 표시줄에는 앱만 고정한다. 처음에는 File Explorer와 Chrome이 고정돼 있다. 폴더·글·외부 링크는 작업 표시줄이 아니라 Start 메뉴에 고정한다.
  - 메뉴 항목은 `작업 표시줄에 고정`이다. 이미 고정된 앱은 같은 자리에 `작업 표시줄에서 제거`를 보인다. 이 항목은 Start 모두 목록의 앱과 작업 표시줄 앱 버튼의 우클릭 메뉴에 나온다.

  이전 프로젝트는 외부 링크도 작업 표시줄에 고정할 수 있었지만, Windows 11처럼 앱만 고정한다.
즐겨찾기 고정: |
  - 탐색기 탐색 창의 즐겨찾기와 작업 표시줄 탐색기 버튼의 "고정됨" 점프 목록은 같은 목록이다.
  - 폴더만 고정할 수 있다. 글, 외부 링크, 앱, 휴지통은 고정하지 않는다.
  - 메뉴 항목은 `즐겨찾기에 고정`이다. 이미 즐겨찾기에 있는 폴더는 같은 자리에 `즐겨찾기에서 제거`를 보인다. 이 항목은 바탕화면과 탐색기의 폴더 우클릭 메뉴에 나온다.
  - 처음에는 묶음 폴더 `Project`, `Blog`, `About`이 이 순서로 고정돼 있다.
  - 고정한 폴더는 id로 따라간다. 이름을 바꾸면 바뀐 이름으로 보이고, 다른 곳으로 옮겨도 목록에 남는다.
  - 새로 고정한 폴더는 맨 뒤에 추가한다. 방문자가 고정을 해제하거나 순서를 바꿀 수 있다.
  - 휴지통에 들어간 폴더(휴지통에 든 폴더 안의 폴더 포함)는 목록에서 보이지 않고, 복원하면 다시 보인다.
