_codocs:
  id: visitor-storage
  name: 방문자 저장
  parent:
    - 화면별 기능
개요: |
  방문자가 바꾼 상태는 방문자의 브라우저(localStorage)에만 저장된다.
  방문자 A가 만든 폴더는 방문자 B에게 보이지 않고, 사이트의 원래 구조(Notion 기준)는 바뀌지 않는다. 서버 저장소와 로그인은 두지 않는다.
저장하는 것: |
  - 항목 배치: 폴더 만들기, 이름 바꾸기, 항목 옮기기
  - 바탕화면 설정: 아이콘 크기, 자동 정렬, 정렬 기준, 아이콘 자리([[바탕화면 아이콘:격자 자리]])
  - Start 고정 목록과 순서, 모두 목록의 보기([[고정:시작 화면 고정]], [[Start 메뉴:모두]])
  - 작업 표시줄 고정과 순서([[고정:작업 표시줄 고정]])
  - 탐색기의 위치별 보기와 정렬([[파일 탐색기:보기와 정렬]])
  - 최근 연 항목([[검색:입력 전 화면]])
저장하지 않는 것: |
  글 제목·작성일과 외부 링크의 이름·주소·아이콘은 저장하지 않고 원본(Notion 글, 외부 링크 설정 파일)에서 다시 채운다. 방문자가 만든 폴더만 이름과 만든 날짜를 저장한다.

  휴지통은 저장하지 않는다. 휴지통 상태는 메모리에만 두어, 새로고침하거나 다시 들어오면 휴지통에 있던 항목은 모두 원래 자리로 돌아오고 휴지통은 빈다. 휴지통은 Windows를 재현하는 요소라 오래 기억할 필요가 없기 때문이다.
저장분 읽기: |
  저장분을 읽을 때:
  - 저장분이 깨졌거나(읽을 수 없거나 모양이 맞지 않음) 버전이 다르면 [[작업 공간 맞추기:초기 구조]]에서 다시 시작한다.
  - 일부 항목만 이상하면(상위 폴더가 없거나 폴더가 아님, 순환) 그 항목만 바탕화면으로 옮긴다.
  - `Blog` 폴더가 아예 없으면 바탕화면에 다시 만든다.
