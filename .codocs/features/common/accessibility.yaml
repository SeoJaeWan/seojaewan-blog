_codocs:
  id: accessibility
  name: 접근성
  parent:
    - 화면별 기능
개요: |
  모든 화면이 함께 따르는 키보드 원칙, 둘 수 있는 키, 포커스, Tab, 영역 이름, 버튼 이름, 역할 규칙을 정한다.
  화면에 적힌 키를 눈에 보이게 해 주는 접근성 패널은 [[접근성 모드]]에서 정한다.
원칙: |
  꼭 있어야 하는 기능은 바탕 키(Tab, 방향키, Enter, Space, Esc)나 화면에 적혀 있는 키만으로 할 수 있어야 한다. 써 본 사람만 아는 키를 몰라서 못 하는 일이 없게 하기 위해서다.

  - 다른 방법으로 같은 결과를 낼 수 없는 기능이 꼭 있어야 하는 기능이다. 되풀이하거나 돌아가면 같은 결과가 나오는 것은 편의다. 예: 아이콘 하나 고르기, 열기, 이름 바꾸기, 삭제, 옮기기, 정렬, 순서 바꾸기는 꼭 있어야 하고, 여러 개 한꺼번에 고르기와 끌어 놓기, 빠른 키는 편의다.
  - 끌어서만 할 수 있는 일은 두지 않는다. 자리와 순서를 바꾸는 일은 메뉴의 이동 항목으로도 한다([[바탕화면 우클릭 메뉴:아이콘]], [[작업 표시줄:우클릭 메뉴]], [[Start 메뉴:고정됨]]).
  - 편의 기능에는 키를 꼭 두지 않는다.
키: |
  둘 수 있는 키는 세 가지다.

  | 키 | 예 |
  |---|---|
  | 바탕 키 | Tab, 방향키, Enter, Space, Esc |
  | 알려 줄 자리가 있는 키 | 툴팁이나 메뉴에 적히는 F2, Delete, Ctrl+X, Ctrl+V, Ctrl+Shift+2·3·4. 접근성 패널의 단추에 적히는 Shift+F10 |
  | 어디서나 똑같이 쓰는 키 | Ctrl+A, Shift+방향키 |

  - 이 블로그에서만 통하고 화면 어디에도 적히지 않는 키는 만들지 않는다.
  - 키는 네 가지 방법으로 알린다. 메뉴 항목 옆의 단축키 글자, 단추의 툴팁(`이름 (단축키)`, 마우스를 올릴 때와 키보드 포커스가 갈 때 모두 뜬다), 화면 읽기 프로그램이 읽는 ARIA 속성(`aria-keyshortcuts`), 접근성 패널의 단추에 적힌 글자([[접근성 모드:패널]])다. 모바일에서 메뉴의 단축키 글자는 메뉴를 키보드로 열었을 때만 보인다([[반응형:입력 차이]]).
  - 창은 키보드로 끌어 옮기거나 크기를 바꾸지 않는다. 대신 최대화 버튼에 포커스가 가면 스냅 레이아웃이 뜨고, 거기서 칸을 골라 창을 놓는다([[스냅:스냅 레이아웃]]). 스냅 칸과 최대화로 창을 원하는 쪽에 원하는 크기로 둘 수 있어, 자유롭게 옮기는 것은 마우스의 편의로 둔다.
  - 우클릭 메뉴는 어디서나 포커스가 있는 것에서 Shift+F10이나 메뉴 키로 연다. 메뉴는 우클릭했을 때와 같은 자리에 같은 내용으로 열리고 포커스가 메뉴 안으로 간다. 메뉴 안은 ↑·↓로 옮기고 Enter로 고르며, →로 하위 메뉴를 열고 Esc로 닫는다.
포커스: |
  무언가를 열면 그 안에서 바로 쓸 곳에 둔다. 포커스를 가진 것이 사라지면 연 것 → 가장 가까운 내용 → 담은 창·화면 차례로 옮긴다. 겹쳐 뜨는 모달은 열려 있는 동안 포커스를 가둔다. 기능 문서에는 이 규칙과 다른 경우만 적는다.
  - 메시지 상자는 Tab으로 버튼 사이를 옮기고 Enter로 누른다. Esc는 아무것도 하지 않고 닫는 버튼을 누른 것과 같다. 버튼이 `확인` 하나면 닫히고, `복원`·`취소`면 취소다.
Tab: |
  여러 항목이 모인 묶음(목록·격자·탭 줄·트리·버튼 줄)은 Tab으로 한 번만 닿고(고른 항목, 없으면 첫 항목), 안에서는 방향키로 옮긴다.

  - 끝 항목에서는 멈춘다. 탭 줄만 Base UI 기본대로 돈다.
  - 바탕화면 아이콘 묶음에 고른 것 없이 들어올 때는 [[항목 조작:단축키]]를 따른다.
  - 탭 줄은 고른 탭에 닿은 뒤 Tab을 한 번 더 누르면 그 탭의 닫기 버튼(×)에 닿는다. 다른 탭을 닫으려면 ←·→로 그 탭을 고른 뒤 Tab을 누른다([[파일 탐색기:탭]]).
  - 탐색기의 주소창은 주소창 자체가 먼저 닿고, 그다음 Tab이 주소창 안의 마디·꺾쇠 묶음에 닿는다([[파일 탐색기:주소창 편집]]).
  - 명령 모음의 비활성 버튼은 건너뛴다.
  - 작업 표시줄 앱 버튼은 맨 앞 창의 앱이 처음 닿는 항목이다.
  - 검색 결과 줄과 주소창·새 탭 추천은 이 묶음이 아니라 Tab이 항목마다 걸린다.
  - 창 미리보기는 열려 있는 동안 Tab이 카드마다 여는 버튼과 닫는 버튼을 차례로 돌고, 끝에서 처음으로 돌아간다([[작업 표시줄:창 미리보기]]).
  - 눌러도 아무 일이 없는 것(작업 표시줄 시계, Start의 프로필)에는 Tab이 멈추지 않는다. 이런 것은 호버 모습도 두지 않는다.
  - 스크롤 영역은 내용이 넘치고 안에 포커스할 요소가 없을 때만 영역 자체가 Tab으로 닿는다(`tabIndex=0`). 안에 포커스할 항목이 있으면 그 항목이 받고, 영역은 Tab 차례에 들지 않는다.

  Tab이 멈추는 차례는 화면에 보이는 차례다. 위에서 아래로, 같은 높이면 왼쪽에서 오른쪽으로 간다.

  | 곳 | 차례 |
  |---|---|
  | 바탕화면 | 아이콘 묶음 |
  | 작업 표시줄 | 시작 버튼 → 검색 상자 → 앱 버튼 묶음 |
  | Start | 검색칸 → 고정됨 → 보기 버튼 → 모두 목록 → 전원 버튼 |
  | 검색 패널 | 결과 항목마다 → 카드의 열기 · 링크 복사 |
  | 메뉴 | Tab이 아니라 방향키로 옮긴다 |
  | Chrome 창 | 탭 검색 버튼 → 고른 탭 → 그 탭의 닫기 → 새 탭 버튼 → 창 버튼(최소화 · 최대화 · 닫기) → 뒤로 → 앞으로 → 새로고침 → 주소창 → ⋮ → 찾기 막대(열렸을 때. 입력칸 → 이전 → 다음 → 닫기) → 페이지 안 |
  | 탐색기 창 | 고른 탭 → 그 탭의 닫기 → 새 탭 버튼 → 창 버튼 → 뒤로 · 앞으로 · 위로 · 새로 고침 → 주소창 → 마디 · 꺾쇠 묶음 → 검색 상자 → 명령 모음 → 탐색 창 → 본문 → 상태 표시줄의 보기 버튼 |
  | 접근성 패널 | Tab 차례에 없다([[접근성 모드:포커스]]) |

  화면 전체의 차례는 바탕화면 아이콘 → 맨 앞 창 → 작업 표시줄이고, 끝에서 처음으로 돌아간다.

  - 창은 맨 앞 창 하나만 차례에 든다. 뒤에 있는 창과 최소화된 창에는 Tab이 들어가지 않는다.
  - 다른 창으로 가려면 작업 표시줄의 앱 버튼에서 Enter를 누른다. 그 창이 맨 앞으로 오고 포커스가 그 창 안으로 간다([[작업 표시줄:앱 버튼]]).
  - 창이 없으면 바탕화면 아이콘 → 작업 표시줄이다.
  - 모바일은 창이 화면을 다 가린다. 창이 있으면 맨 앞 창 → 작업 표시줄이고 바탕화면은 차례에 없다. 창이 없으면 바탕화면 아이콘 → 작업 표시줄이다. 작업 표시줄 안의 차례는 시작 버튼 → 검색 버튼 → 앱 버튼 묶음이다([[작업 표시줄:모바일]]).
영역 이름: |
  보이는 제목이 있으면 제목 태그로 그리고 `aria-labelledby`로 가리킨다. 보이는 제목이 없을 때만 `aria-label`. 창 영역은 `aria-label`이다. 데스크톱은 보이는 창 제목이 없고(탭 줄), 모바일의 제목은 탭 제목뿐이라 앱 이름이 빠지기 때문이다.
버튼 이름: |
  고른 값을 보여 주는 버튼은 이름을 `무엇: 값`으로 한다(`보기: 범주`).
역할: |
  WAI-ARIA APG 패턴을 따른다. Base UI에 있으면 Base UI를 쓰고, 없거나 Windows 동작을 맞출 수 없을 때만 직접 만들어 [[접근성:직접 만든 부품]] 표에 이유를 적는다. Base UI 부품의 역할은 탭·확대/축소 줄·버튼 역할 `div`·Start·검색 패널만 바꾼다. Start·검색 패널은 Base UI 기본대로 포커스가 밖에 나가면 닫는다. 접근성 패널은 밖으로 보지 않는다([[접근성 모드:패널]]). 탐색기 명령 모음은 Base UI Toolbar를 쓴다.

  Snap Assist 카드 안의 닫기 버튼은 마우스 전용(`aria-hidden`, Tab으로 닿지 않음)이고 키보드는 카드에서 Delete로 닫는다. 버튼 안에 버튼을 둘 수 없고 묶음은 Tab 한 번이기 때문이다.
  탭의 닫기 버튼은 키보드로도 닿는다([[접근성:Tab]]). `tablist`에는 탭만 있어야 하고 버튼 안에 버튼을 둘 수 없으므로, 닫기 버튼은 탭 요소 안이 아니라 옆에 둔다. Delete는 빠른 키로 남기고 닫기 버튼의 툴팁에 적는다(`닫기 (Delete)`).
  창 미리보기 카드는 여는 버튼과 닫는 버튼이 나란한 둘이고, 닫는 버튼에도 키보드로 닿는다([[접근성:Tab]]). Delete는 빠른 키로 남기고 닫는 버튼의 툴팁에 적는다.
  Delete로 닫는 탭·카드에는 `aria-keyshortcuts="Delete"`를 단다. 탭은 `role="tab"`인 요소(BrowserTab·ExplorerTab 안)에, 카드(창 미리보기·Snap Assist)는 포커스를 받는 여는 버튼에 단다.
색 대비: |
  일반 글자는 4.5:1(WCAG AA)을 지킨다. 값은 피그마 변수가 가진다. 코드 강조 색은 토큰이 아니라 강조기 테마 색이라, 모자란 색을 바꾸는 방법은 [[기술 스택:글 본문 처리]]에 있다.

  `color-contrast` 규칙은 바탕화면 아이콘 이름(배경 이미지 위의 흰 글자와 그림자)에서만 끈다. axe가 배경 이미지 위의 대비를 계산하지 못하기 때문이다. 끄는 스토리에는 이 이유를 주석으로 적는다.
직접 만든 부품: |
  | 부품 | 이유 |
  |---|---|
  | 주소창·새 탭 추천 | Base UI로 일부만 된다. 마지막 ↓, 한글 조합 중 키, Esc 되돌리기를 직접 해야 하고 SearchBox가 role을 덮는다 |
  | Snap Assist | Base UI로 일부만 된다. 카드 밖 누르기를 직접 해야 한다 |
  | 이미지 크게 보기 | Base UI로 일부만 된다. 밖이 `aria-hidden`이 되고 바깥 클릭에 포커스가 빠진다 |
  | 탐색 창 트리 | Base UI에 Tree가 없다 |
  | 바탕화면·탐색기 항목 목록 | Base UI에 없다 |
  | 툴팁 | Base UI에 없다. 트리거 없는 표시다 |
  | 체크박스 | Base UI에 없다. 글에 적힌 상태만 보여 주는 읽기 전용 표시다 |
  | Tab 묶음(`useRovingFocus`) | Base UI Toolbar는 항목마다 `Toolbar.Button`으로 감싸야 해 디자인 시스템 안쪽 버튼을 묶지 못하고, 격자의 위아래를 받지 않는다. Start 모두 목록·고정됨, 작업 표시줄 앱 버튼, 창 미리보기·Snap Assist 카드에 쓴다 |
