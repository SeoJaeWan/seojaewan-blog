_codocs:
  id: accessibility
  name: 접근성
  parent:
    - 화면별 기능
개요: |
  모든 화면이 함께 따르는 포커스, Tab, 영역 이름, 버튼 이름, 역할 규칙을 정한다.
  결정의 경위는 [[논의 2026-10-30 접근성]]에 있다.
포커스: |
  무언가를 열면 그 안에서 바로 쓸 곳에 둔다. 포커스를 가진 것이 사라지면 연 것 → 가장 가까운 내용 → 담은 창·화면 차례로 옮긴다. 겹쳐 뜨는 모달은 열려 있는 동안 포커스를 가둔다. 기능 문서에는 이 규칙과 다른 경우만 적는다.
Tab: |
  여러 항목이 모인 묶음(목록·격자·탭 줄·트리·버튼 줄)은 Tab으로 한 번만 닿고(고른 항목, 없으면 첫 항목), 안에서는 방향키로 옮긴다.
영역 이름: |
  보이는 제목이 있으면 제목 태그로 그리고 `aria-labelledby`로 가리킨다. 보이는 제목이 없을 때만 `aria-label`.
버튼 이름: |
  고른 값을 보여 주는 버튼은 이름을 `무엇: 값`으로 한다(`보기: 범주`).
역할: |
  WAI-ARIA APG 패턴을 따른다. Base UI에 있으면 Base UI를 쓰고, 없거나 Windows 동작을 맞출 수 없을 때만 직접 만들어 [[접근성:직접 만든 부품]] 표에 이유를 적는다. Base UI 1.9.0 시험 결과 바꿀 수 있는 탭·확대/축소 줄·버튼 역할 `div`·Start·검색 패널만 바꾼다. Start·검색 패널은 Base UI 기본대로 포커스가 밖에 나가면 닫는다. 일부만 되는 주소창·새 탭 추천, Snap Assist, 이미지 크게 보기와 Base UI에 없는 탐색 창 트리, 바탕화면·탐색기 항목 목록, 툴팁, 체크박스는 직접 유지하고 표에 올린다. 탐색기 명령 모음은 Base UI Toolbar를 쓴다.

  탭과 창 미리보기·Snap Assist 카드 안의 닫기 버튼은 마우스 전용(`aria-hidden`, Tab으로 닿지 않음)이고 키보드는 탭·카드에서 Delete로 닫는다. `tablist`에는 탭만 있어야 하고 버튼 안에 버튼을 둘 수 없으며, 묶음은 Tab 한 번이기 때문이다.
색 대비: |
  색은 바꾸지 않는다. Windows 모양을 유지하기로 했다. 그래서 대비가 모자란 스토리(`text-fill-tertiary` 보조 글자, `code-syntax-type`, 바탕화면 아이콘 이름, 비활성 창 제목, 잘라낸 항목 이름)는 `color-contrast` 규칙을 끄고 이 이유를 주석으로 적는다.
직접 만든 부품: |
  | 부품 | 이유 |
  |---|---|
  | 주소창·새 탭 추천 | Base UI로 일부만 된다. 마지막 ↓, 한글 조합 중 키, Esc 되돌리기를 직접 해야 하고 SearchBox가 role을 덮는다 |
  | Snap Assist | Base UI로 일부만 된다. 빈 곳 누르기를 직접 해야 한다 |
  | 이미지 크게 보기 | Base UI로 일부만 된다. 밖이 `aria-hidden`이 되고 바깥 클릭에 포커스가 빠진다 |
  | 탐색 창 트리 | Base UI에 Tree가 없다 |
  | 바탕화면·탐색기 항목 목록 | Base UI에 없다 |
  | 툴팁 | Base UI에 없다. 트리거 없는 표시다 |
  | 체크박스 | Base UI에 없다. 글에 적힌 상태만 보여 주는 읽기 전용 표시다 |
  | Tab 묶음(`useRovingFocus`) | Base UI Toolbar는 항목마다 `Toolbar.Button`으로 감싸야 해 디자인 시스템 안쪽 버튼을 묶지 못하고, 격자의 위아래를 받지 않는다. Start 모두 목록·고정됨, 작업 표시줄 앱 버튼, 창 미리보기·Snap Assist 카드에 쓴다 |
