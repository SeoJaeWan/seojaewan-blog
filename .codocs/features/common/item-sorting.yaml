_codocs:
  id: item-sorting
  name: 항목 정렬
  parent:
    - 화면별 기능
개요: |
  바탕화면과 탐색기가 항목을 늘어놓는 차례를 정한다.
  정렬 기준을 고르는 곳은 [[바탕화면 우클릭 메뉴:빈 곳]]과 [[파일 탐색기:보기와 정렬]]이다.
비교 규칙: |
  휴지통은 늘 맨 앞이다. 이름은 폴더를 먼저 두고 이름순(숫자는 값으로 비교하고, 영어가 한글보다 앞)이다. 항목 유형은 폴더·글·외부 링크 차례다. 수정한 날짜는 최근 것을 먼저 두고, 날짜가 없는 항목(Notion 폴더, 외부 링크)은 뒤에 이름순으로 둔다.
방향 정렬: |
  폴더는 정렬 방향과 상관없이 늘 앞에 두고, 값이 같으면 이름 오름차순이다. 이름·유형 비교는 바탕화면 정렬 차례([[항목 정렬:비교 규칙]])와 같다. 수정한 날짜는 글 작성일과 방문자 폴더를 만든 날이고, 오름차순은 오래된 것이 앞이며 날짜가 없는 항목(Notion 폴더, 외부 링크)은 방향과 상관없이 뒤다.
