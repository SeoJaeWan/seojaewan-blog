_codocs:
  id: items-and-folders
  name: 항목과 폴더
  parent:
    - 화면별 기능
개요: |
  바탕화면, 파일 탐색기, Start, 검색 결과에 나오는 항목의 종류와, 각 항목의 원본과 열기 방식을 정한다.
  항목이 어디에 놓이는지와 방문자가 폴더를 만들고 항목을 옮기는 규칙도 여기서 정한다.
종류: |
  | 종류 | 원본 | 열면 |
  |---|---|---|
  | 폴더 | Notion 글의 `폴더` 속성에서 만들어지거나 방문자가 만든다([[항목과 폴더:위치와 옮기기]]) | File Explorer에서 연다 |
  | 글 | Notion 글 하나([[콘텐츠 원천]]) | Chrome 창에서 연다 |
  | 외부 링크 | 저장소의 코드 설정 파일 | 실제 브라우저의 새 탭에서 연다. 블로그 안의 창을 만들지 않는다 |

  폴더와 글이 어느 창·탭으로 열리는지의 세부 규칙은 File Explorer와 Chrome 문서에서 정한다.
외부 링크: |
  외부 링크(GitHub, 이력서, 사이드 프로젝트 등)는 저장소의 코드 설정 파일에서 이름, URL, 아이콘, 초기 위치를 정의한다.
  자주 바뀌지 않고 아이콘이 중요하며, 변경이 PR로 리뷰되기 때문이다. Notion 데이터베이스로 관리하는 방식은 아이콘 관리가 번거롭고 수집 대상이 늘어 고르지 않았다.

  주소(URL)가 없는 외부 링크는 바탕화면·탐색기·Start·검색 어디에도 보이지 않는다. 이력서처럼 실제 주소를 아직 받지 못한 링크는 주소를 비워 두어 받을 때까지 숨긴다.
식별: |
  모든 항목은 종류와 상관없이 바뀌지 않는 고유 ID를 갖는다.
  이름이나 위치가 바뀌어도 같은 항목이다. 항목의 원본에는 위치를 저장하지 않는다.
  글과 폴더의 ID는 Notion의 `slug`와 `폴더` 경로에서 만든다.

  | 종류 | 형식 |
  |---|---|
  | Blog 글 | `post:<slug>` |
  | Project 글 | `project:<slug>` |
  | About 글 | `about:<slug>` |
  | Blog 하위 폴더 | `folder:<경로>` |
  | Project 하위 폴더 | `project-folder:<경로>` |
  | About 하위 폴더 | `about-folder:<경로>` |
  | 묶음 폴더 | `blog`, `project`, `about` |

  Blog는 예전 저장분과 맞도록 `post:`·`folder:`를 그대로 쓴다.
위치와 옮기기: |
  항목마다 놓인 위치(상위 폴더)가 하나 있다. 상위 폴더가 없으면 바탕화면에 놓인 것이다.
  폴더도 항목이므로 폴더 안에 폴더를 둘 수 있고, 글과 외부 링크도 바탕화면이나 어느 폴더에나 둘 수 있다.

  다음으로는 옮길 수 없다.
  - 폴더를 자기 자신이나 자기 하위 폴더 안으로
  - 같은 이름의 폴더가 이미 있는 위치로. 같은 이름 금지는 폴더끼리만 본다. 글·외부 링크는 같은 이름이 있어도 된다
  - 이미 그 항목이 있는 위치로
  - 휴지통 안으로. 휴지통 안의 항목도 옮길 수 없고 복원만 된다([[휴지통:복원]])

  여러 항목을 함께 옮길 때 하나라도 옮길 수 없으면 아무것도 옮기지 않는다. 휴지통 위로 옮기면 휴지통으로 보낸다. 끌어 옮길 때의 표시는 [[항목 조작:끌기]]에서 정한다.
폴더 이름: |
  이름은 폴더만 바꿀 수 있다. 글과 외부 링크는 원본의 이름을 따른다.
  폴더를 만들거나 이름을 바꿀 때 Windows 11 파일 이름 규칙을 따른다.

  - 길이는 UTF-16 단위로 세어 최대 255자다.
  - `< > : " / \ | ? *`와 제어 문자(문자 코드 0~31)를 쓸 수 없다.
  - `.`, `..`, `CON`, `PRN`, `AUX`, `NUL`, `COM1`~`COM9`, `LPT1`~`LPT9`는 쓸 수 없다. 이름의 첫 `.` 앞부분(끝 공백 제외)을 대소문자를 무시하고 비교하므로 확장자가 붙어도 쓸 수 없다.
  - 이름 끝에는 공백과 마침표를 두지 않는다.
  - 같은 위치에는 같은 이름의 폴더를 둘 수 없다. 비교할 때 대소문자와 유니코드 정규화 차이는 무시한다. 다른 위치에서는 같은 이름을 쓸 수 있다.
  - 새 폴더의 기본 이름은 `새 폴더`이고, 같은 위치에 이미 있으면 `새 폴더 (2)`, `새 폴더 (3)` 순서로 가장 작은 빈 번호를 쓴다.

  이름을 입력하고 확정할 때는 다음과 같이 한다.
  - 쓸 수 없는 문자는 입력하는 순간 막아 입력되지 않고, 말풍선으로 "파일 이름에는 다음 문자를 사용할 수 없습니다: \ / : * ? " < > |"를 보인다. 붙여넣은 글자에 섞여 있으면 그 문자만 뺀다. 말풍선은 다음에 쓸 수 있는 문자를 입력하면 사라진다.
  - 255자를 넘게는 입력되지 않는다. 자르는 자리가 서로게이트 쌍 가운데면 그 앞에서 자른다.
  - 비었거나 공백만 있으면 원래 이름으로 되돌린다. 끝의 공백과 마침표를 잘라내면 비는 이름(`...`)도 같다.
  - 끝의 공백과 마침표는 잘라내고 확정한다.
  - 예약 이름이면 메시지 상자(제목 "이름 바꾸기", 본문 "지정한 장치 이름이 잘못되었습니다.", 버튼 `확인`)를 보인 뒤 이름 바꾸기로 돌아간다.
  - 같은 위치에 같은 이름의 폴더가 있으면 합치지 않고 메시지 상자(제목 "이름 바꾸기", 본문 "이 위치에 같은 이름의 폴더가 이미 있습니다.", 버튼 `확인`)를 보인 뒤 이름 바꾸기로 돌아간다. 이때 입력한 값을 그대로 둔 입력창에 포커스를 돌려준다. 예약 이름도 같다.

  폴더 이름을 바꿔도 폴더의 고유 ID는 그대로다.
검토한 대안: |
  - 잘못된 폴더 이름을 모두 확정할 때 말풍선으로 알리고 입력값을 둔 채 다시 고치게 하기: 쓸 수 없는 문자를 입력할 때 막고, 빈 이름은 되돌리고, 그 밖은 메시지 상자로 알리는 Windows 11의 이름 바꾸기와 달라 고르지 않았다.
  - 같은 위치의 같은 이름 폴더를 합치기(이름 바꾸기와 복원 모두): 되돌릴 수 없고 하위 폴더까지 합치는 규칙이 복잡한데 드문 경우라 고르지 않았다.
나중에 검토할 것: |
  - 소개 페이지 같은 별도 앱
  - 사이드 프로젝트를 Chrome 창 안에서 iframe으로 여는 항목
