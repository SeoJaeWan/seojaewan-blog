_codocs:
  id: desktop-context-menu
  name: 바탕화면 우클릭 메뉴
  parent:
    - 화면별 기능
개요: |
  바탕화면 빈 곳과 아이콘의 우클릭 메뉴를 정한다.
빈 곳: |
  | 메뉴 | 하위 항목 |
  |---|---|
  | 보기 | 큰 아이콘 · 보통 아이콘 · 작은 아이콘, 아이콘 자동 정렬 |
  | 정렬 기준 | 이름 · 항목 유형 · 수정한 날짜 |
  | 새로 고침 | |
  | 붙여넣기 | |
  | 새로 만들기 | 폴더 |

  - 정렬 기준은 하나를 고르는 선택지이고 기본값은 `이름`이다. 고른 순간 그 기준으로 한 번 정렬하고, 메뉴에는 마지막으로 고른 기준을 표시한다. 자동 정렬이 켜져 있으면 고른 기준의 순서로 격자를 계속 채운다. Windows 11 바탕화면과 같다.
  - 정렬 차례는 [[항목 정렬:비교 규칙]]을 따른다.
  - 새로 고침은 아이콘을 `motion/duration/faster` 동안 숨겼다가 다시 보이는 연출만 한다. 서서히 변하는 효과는 없고, 실제로 바뀌는 것은 없다.
  - 붙여넣기는 잘라낸 항목을 바탕화면으로 옮긴다([[항목 조작:잘라내기와 붙여넣기]]). 붙여넣기는 붙여넣을 것이 있을 때만 단추 줄에 보인다.
  - 격자 맞춤은 항상 켜져 있으므로 메뉴에 두지 않는다.
  - 바탕화면 아이콘 표시, 개인 설정(배경화면 변경), 디스플레이 설정, 터미널에서 열기, 추가 옵션 표시는 두지 않는다. 바탕화면 아이콘 표시를 끄면 방문자가 빈 화면만 보게 되고, 나머지는 블로그에 필요하지 않다.
  - 실행 취소(Windows의 `이동 취소`·`이름 바꾸기 취소`·`삭제 취소`)는 두지 않는다. 모든 조작의 기록과 되돌리기가 필요하지만 블로그 방문에 필요하지 않다.
아이콘: |
  | 항목 종류 | 메뉴 |
  |---|---|
  | 폴더 | 열기 · 새 창에서 열기 · 시작 화면에 고정 · 잘라내기 · 이름 바꾸기 · 삭제 |
  | 글 | 열기 · 새 창에서 열기 · 링크 복사 · 시작 화면에 고정 · 잘라내기 · 삭제 |
  | 외부 링크 | 열기 · 링크 복사 · 시작 화면에 고정 · 잘라내기 · 삭제 |
  | 휴지통 | 열기 · 휴지통 비우기 |
  | 여러 개 선택 | 열기 · 잘라내기 · 삭제 |

  - 열기와 새 창에서 열기: [[창 동작:열기 규칙]]을 따른다.
  - 링크 복사: 글은 공유 링크([[제품 정의:블로그 기능]]), 외부 링크는 그 URL을 클립보드에 복사한다.
  - 시작 화면에 고정: [[고정:시작 화면 고정]]을 따른다.
  - 잘라내기: 고른 항목을 잘라내 다른 위치에 붙여넣을 수 있게 한다([[항목 조작:잘라내기와 붙여넣기]]). 데스크톱과 모바일이 같다.
  - 이름 바꾸기: [[항목과 폴더:폴더 이름]]을 따른다.
  - 휴지통 비우기의 비활성 조건과 동작은 [[휴지통:비우기]]를 따른다.
모바일: |
  길게 누르기로 연다([[반응형:입력 차이]]).
