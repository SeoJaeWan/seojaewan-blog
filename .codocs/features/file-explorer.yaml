_codocs:
  id: file-explorer
  name: 파일 탐색기
  parent:
    - 화면별 기능
개요: |
  폴더를 탐색하는 File Explorer 창의 구성, 보기와 정렬, 조작, 탭, 폴더 안 검색, 휴지통 보기를 정한다.
  창 자체의 열기·이동·크기·스냅은 [[창 동작]]을 따른다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 제목 표시줄 | 탭 + 새 탭 버튼 |
  | 주소 표시줄 | 뒤로 · 앞으로 · 위로 · 새로 고침, 경로(Breadcrumb), 폴더 안 검색 상자 |
  | 명령 모음 | 새로 만들기(폴더) · 잘라내기 · 붙여넣기 · 이름 바꾸기 · 삭제 · 정렬 · 보기 |
  | 왼쪽 탐색 창 | 바탕화면 아래의 폴더 트리, 휴지통 |
  | 본문 | 현재 폴더의 항목 |
  | 상태 표시줄 | 항목 개수, 선택 개수 |

  - 복사는 두지 않는다. 항목마다 위치가 하나뿐이라([[작업 공간:배치]]) 복사하면 같은 항목이 두 개가 되기 때문이다. 잘라내기 → 붙여넣기로 옮기기만 한다.
  - 공유 명령, 세부 정보 창, 홈·갤러리·내 PC는 두지 않는다.
보기와 정렬: |
  - 보기: 큰 아이콘 · 보통 아이콘 · 자세히. 자세히 보기는 이름 · 수정한 날짜 · 유형 열이 있는 표다.
  - 정렬: 이름 · 수정한 날짜 · 유형, 오름차순·내림차순. 자세히 보기에서는 열 제목을 눌러도 정렬된다.
  - 기본 보기는 `보통 아이콘`, 기본 정렬은 `이름, 오름차순`이다.
  - 보기와 정렬은 폴더마다 따로 기억하며, 브라우저에 저장되고 [[작업 공간:다시 시작]]하면 초기화된다.

  Windows 11의 아주 큰 아이콘, 작은 아이콘, 목록, 타일, 내용 보기는 블로그 항목에 필요하지 않아 두지 않는다.
조작: |
  | 조작 | 동작 |
  |---|---|
  | 선택 | 바탕화면과 같다([[바탕화면:아이콘 조작]]). Shift 범위는 현재 보기의 표시 순서를 따른다 |
  | 폴더 더블클릭 | 같은 탭에서 그 폴더로 이동 |
  | 글 더블클릭 | [[창 동작:열기 규칙]]대로 Chrome에서 연다 |
  | 외부 링크 더블클릭 | 실제 브라우저의 새 탭 |
  | Ctrl + X → Ctrl + V | 잘라내서 다른 폴더에 붙여넣기(이동) |
  | F2 / Delete | 이름 바꾸기(폴더만) / 휴지통으로 보내기 |
  | 드래그 | 같은 창의 폴더, 왼쪽 탐색 창의 폴더, 다른 탐색기 창, 바탕화면으로 옮기기 |
  | Backspace, Alt + ← / → | 뒤로 / 앞으로 |

  창 사이 드래그(탐색기 ↔ 바탕화면, 탐색기 ↔ 다른 탐색기 창)는 다른 창에 놓으면 그 창이 보고 있는 폴더로, 바탕화면에 놓으면 바탕화면으로 옮긴다. 폴더를 자기 자신이나 하위 폴더로 옮기는 것은 [[작업 공간:배치]]에 따라 막는다.
우클릭 메뉴: |
  | 위치 | 메뉴 |
  |---|---|
  | 폴더 | 열기 · 새 탭에서 열기 · 새 창에서 열기 · 시작 화면에 고정 · 잘라내기 · 이름 바꾸기 · 삭제 |
  | 글·외부 링크 | [[바탕화면:아이콘 우클릭 메뉴]]와 같고 잘라내기가 더 있다 |
  | 빈 곳 | 보기 · 정렬 기준 · 붙여넣기 · 새로 만들기(폴더) |

  이미 Start에 고정된 항목은 `시작 화면에 고정` 대신 `시작 화면에서 고정 해제`를 보여 준다([[바탕화면:아이콘 우클릭 메뉴]]).
탭: |
  - 새 탭(+ 버튼)은 `Blog` 폴더로 연다. Windows 11은 홈으로 열지만 블로그에는 홈 화면이 없다.
  - 탭 제목은 현재 폴더 이름이다. 바탕화면이면 "바탕 화면", 휴지통이면 "휴지통"이다.
  - 탭을 클릭해 전환하고, × 또는 가운데 클릭으로 닫고, 드래그로 순서를 바꾼다. 마지막 탭을 닫으면 창이 닫힌다.
  - 뒤로·앞으로 기록은 탭마다 따로 있다. 위로는 상위 폴더로 가며 바탕화면에서는 비활성이다.
  - 다른 창에서 지금 보는 폴더를 휴지통에 넣으면 이 탭은 상위 폴더로 이동한다.
  - 탭을 창 밖으로 끌어내 새 창으로 만드는 기능은 두지 않는다. 창 사이 항목 드래그와 겹쳐 조작이 헷갈릴 수 있다.
폴더 안 검색: |
  현재 폴더와 그 하위 폴더 전체에서 이름으로 검색한다. 일치 규칙(포함, 초성)은 [[검색:일치 규칙]]과 같다.
  결과는 자세히 보기로 보여주고, 각 항목이 어느 폴더에 있는지 위치 열을 더한다.
휴지통 보기: |
  휴지통을 탐색기에서 열면 지운 항목을 자세히 보기로 보여주고 열은 이름 · 원래 위치 · 삭제한 날짜다. 블로그 항목에는 크기가 없어 Windows의 다른 열은 두지 않는다. 명령 모음은 복원 · 휴지통 비우기로 바뀐다.
  휴지통 안의 항목은 열 수 없고 복원만 된다. 복원과 비우기 규칙은 [[작업 공간:휴지통]]을 따른다.
