_codocs:
  id: file-explorer
  name: 파일 탐색기
  parent:
    - 화면별 기능
개요: |
  폴더를 탐색하는 File Explorer 창의 구성, 보기와 정렬, 조작, 탭, 탐색 창, 폴더 안 검색, 휴지통 보기를 정한다.
  창 자체의 열기·이동·크기·스냅은 [[창 동작]]을 따른다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 제목 표시줄 | 탭 + 새 탭 버튼 |
  | 주소 표시줄 | 뒤로 · 앞으로 · 위로 · 새로 고침, 경로(Breadcrumb), 폴더 안 검색 상자 |
  | 명령 모음 | 새로 만들기(폴더) · 잘라내기 · 붙여넣기 · 이름 바꾸기 · 삭제 · 정렬 · 보기 |
  | 왼쪽 탐색 창 | 바탕화면 아래의 폴더 트리, 휴지통([[파일 탐색기:탐색 창]]) |
  | 본문 | 현재 폴더의 항목 |
  | 상태 표시줄 | 항목 개수, 선택 개수 |

  - 복사는 두지 않는다. 항목마다 위치가 하나뿐이라([[작업 공간:배치]]) 복사하면 같은 항목이 두 개가 되기 때문이다. 잘라내기 → 붙여넣기로 옮기기만 한다.
  - 공유 명령, 세부 정보 창, 홈·갤러리·내 PC는 두지 않는다.
  - 쓸 수 없는 명령은 비활성으로 둔다. 잘라내기는 고른 항목이 없을 때, 붙여넣기는 붙여넣을 수 없을 때, 이름 바꾸기는 폴더 하나를 고르지 않았을 때, 삭제는 휴지통으로 보낼 수 없을 때, 복원은 고른 항목 가운데 휴지통에 바로 보낸 항목이 없을 때, 휴지통 비우기는 휴지통이 비었을 때다.
보기와 정렬: |
  - 보기: 큰 아이콘 · 보통 아이콘 · 자세히. 자세히 보기는 이름 · 수정한 날짜 · 유형 열이 있는 표다. 유형 글자는 폴더 "파일 폴더", 글 "블로그 글", 외부 링크 "인터넷 바로 가기"다.
  - 정렬: 이름 · 수정한 날짜 · 유형, 오름차순·내림차순. 자세히 보기에서는 열 제목을 눌러도 정렬된다. 같은 열을 다시 누르면 방향을 뒤집고, 다른 열은 오름차순으로 시작한다.
  - 폴더는 정렬 방향과 상관없이 늘 앞에 두고, 값이 같으면 이름 오름차순이다. 이름·유형 비교는 바탕화면 정렬 차례([[바탕화면:빈 곳 우클릭 메뉴]])와 같다. 수정한 날짜는 글 작성일과 방문자 폴더를 만든 날이고, 오름차순은 오래된 것이 앞이며 날짜가 없는 항목(Notion 폴더, 외부 링크)은 방향과 상관없이 뒤다.
  - 기본 보기는 `보통 아이콘`, 기본 정렬은 `이름, 오름차순`이다.
  - 보기와 정렬은 위치(폴더, 바탕 화면, 휴지통)마다 따로 기억하며, 브라우저에 저장되고 [[작업 공간:다시 시작]]하면 초기화된다.
  - 상태 표시줄 오른쪽의 두 버튼은 자세히 보기와 큰 아이콘 보기다.
  - 휴지통은 늘 자세히 보기이고(보기 명령 비활성), 수정한 날짜 대신 삭제한 날짜, 유형 대신 원래 위치로 정렬한다([[파일 탐색기:휴지통 보기]]).

  Windows 11의 아주 큰 아이콘, 작은 아이콘, 목록, 타일, 내용 보기는 블로그 항목에 필요하지 않아 두지 않는다.
조작: |
  | 조작 | 동작 |
  |---|---|
  | 선택 | 바탕화면과 같다([[바탕화면:아이콘 조작]]). 표시 순서는 지금 보기의 정렬 차례이고, 방향키의 옆 항목은 그려진 자리로 찾는다(아이콘 보기는 격자, 자세히 보기는 위아래). 끄는 사각형은 항목 자리의 빈 곳에서 시작한다. 상태 표시줄에 "N개 항목 선택함"을 보인다 |
  | 폴더 더블클릭 | 같은 탭에서 그 폴더로 이동. 여러 개를 고른 채 열면 바탕화면처럼 모두 열고, 폴더는 새 탐색기 창으로 연다 |
  | 글 더블클릭 | [[창 동작:열기 규칙]]대로 Chrome에서 연다 |
  | 외부 링크 더블클릭 | 실제 브라우저의 새 탭 |
  | 새로 만들기 | 명령 모음의 새로 만들기는 바로 새 폴더를 만들고 이름 바꾸기를 시작한다. 이름 말풍선은 그 항목 아래 8px에 띄우고, Enter·Esc로 끝내면 그 항목에 포커스를 돌려준다 |
  | Ctrl + X → Ctrl + V | 잘라내서 다른 폴더에 붙여넣기(이동, [[작업 공간:배치]]) |
  | F2 / Delete | 이름 바꾸기(폴더만) / 휴지통으로 보내기 |
  | 드래그 | 같은 창의 폴더, 왼쪽 탐색 창의 폴더, 다른 탐색기 창, 바탕화면으로 옮기기. 끌기 시작 거리·툴팁·옮길 수 없는 곳의 표시는 바탕화면과 같다([[바탕화면:아이콘 조작]]) |
  | Backspace, Alt + ← / → | 뒤로 / 앞으로. 입력칸에서 누른 Backspace는 뒤로 가지 않고, Alt + ← / →는 입력칸에서도 뒤로·앞으로다 |
  | 새로 고침 | 바탕화면 새로 고침과 같다([[바탕화면:빈 곳 우클릭 메뉴]]) |
  | 탭(모바일) | 폴더를 탭하면 연다. 데스크톱의 한 번 클릭은 선택이다 |

  창 사이 드래그(탐색기 ↔ 바탕화면, 탐색기 ↔ 다른 탐색기 창)는 다른 창에 놓으면 그 창이 보고 있는 폴더로(그 창의 폴더 항목 위면 그 폴더로), 바탕화면(빈 곳·폴더·휴지통)에 놓으면 그곳으로 옮긴다. 바탕화면 아이콘도 탐색기 창 위에 놓으면 그 창이 보는 위치로 옮긴다. 창이 겹치면 포인터 아래 맨 위 창이 정한다.
  끄는 복제본은 자세히 보기여도 보통 아이콘 모양이다. 바탕화면에 놓으면 아이콘 칸은 정하지 않는다(자동 정렬이 꺼져 있으면 첫 빈 칸에 보인다). 휴지통 안의 항목은 끌 수 없고, 검색 중인 자기 창 본문은 놓을 곳이 아니다. 옮길 수 없는 곳은 [[작업 공간:배치]]에 따라 막는다. 모바일에는 끌기가 없다.
우클릭 메뉴: |
  | 위치 | 메뉴 |
  |---|---|
  | 폴더 | 열기 · 새 탭에서 열기 · 새 창에서 열기 · 시작 화면에 고정 · 잘라내기 · 이름 바꾸기 · 삭제 |
  | 글·외부 링크·여러 개 선택 | [[바탕화면:아이콘 우클릭 메뉴]]와 같다 |
  | 휴지통 안의 항목 | 복원 |
  | 빈 곳 | 보기 · 정렬 기준 · 붙여넣기 · 새로 만들기(폴더) |
  | 휴지통의 빈 곳 | 정렬 기준 · 새로 고침 · 휴지통 비우기 |

  - 이미 Start에 고정된 항목은 `시작 화면에 고정` 대신 `시작 화면에서 고정 해제`를 보여 준다([[바탕화면:아이콘 우클릭 메뉴]]).
  - 새 창에서 열기는 폴더도 새 탐색기 창으로 연다. 새 탭에서 열기는 그 폴더를 새 탭으로 열고 그 탭을 고른다. 모바일은 탭이 하나라 새 탭에서 열기가 없다.
탭: |
  - 새 탭(+ 버튼)은 "바탕 화면" 위치로 연다([[창 동작:열기 규칙]]).
  - 탭 제목은 현재 위치 이름이다. 바탕화면이면 "바탕 화면", 휴지통이면 "휴지통"이다. 창 제목, 위치 칸, 검색 상자의 안내 글자도 같은 이름을 쓴다.
  - 탭을 클릭해 전환하고, × 또는 가운데 클릭으로 닫고, 드래그로 순서를 바꾼다. 마지막 탭을 닫으면 창이 닫힌다. 뒤에 있는 창의 탭을 눌러도 그 창이 맨 앞으로 온다.
  - 고른 탭을 닫으면 오른쪽 탭(없으면 왼쪽 탭)을 고른다.
  - 탭은 최소 너비 120px까지 고르게 줄고, 넘치면 탭 줄을 가로로 스크롤한다. 고른 탭이 가려지면 보이게 스크롤한다. `+` 버튼은 늘 보인다.
  - 탭 순서 바꾸기: 탭을 누른 뒤 4px 넘게 움직이면 끌기를 시작하고, 끄는 동안 포인터 가로 자리의 탭 자리로 바로 옮긴다. 같은 창 안에서만 옮기고, 고른 탭은 그대로다.
  - 키보드: 고른 탭만 Tab으로 닿는다. 탭에서 ←/→는 앞뒤 탭(끝에서는 반대쪽 끝), Home/End는 처음·끝 탭을 고르고 그 탭에 포커스를 옮긴다.
  - 뒤로·앞으로 기록은 탭마다 따로 있다. 지금 위치와 같은 곳으로 가면 기록을 늘리지 않고, 뒤로 간 뒤 다른 곳으로 가면 앞으로 기록을 지운다. 폴더 더블클릭·위치 칸·탐색 창·위로가 모두 같은 탭의 기록에 남는다. 위로는 상위 폴더로 가며 바탕화면에서는 비활성이다.
  - 같은 탭에서 위치를 옮기면 항목 목록의 스크롤이 맨 위로 돌아간다. 탭을 바꿔도 처음부터 보인다.
  - 지금 보는 폴더(또는 그 상위 폴더)가 휴지통에 들어가면, 이 탭은 휴지통에 보낸 폴더의 원래 상위 위치(없으면 바탕화면)로 옮긴다. 지금 기록 칸을 바꾸고, 바로 앞·뒤 기록과 같아지면 합친다. 기록 속 다른 칸은 뒤로·앞으로로 갈 때 같은 규칙으로 바로잡는다.
  - 탭을 창 밖으로 끌어내 새 창으로 만드는 기능은 두지 않는다. 창 사이 항목 드래그와 겹쳐 조작이 헷갈릴 수 있다.
폴더 안 검색: |
  현재 폴더와 그 하위 폴더 전체에서 이름으로 검색한다. 일치 규칙(포함, 초성)은 [[검색:일치 규칙]]과 같다.
  결과는 자세히 보기로 보여주고, 각 항목이 어느 폴더에 있는지 위치 열을 더한다. 다른 위치로 가면(결과의 폴더를 열 때 포함) 검색을 끝내고 검색어를 비운다.

  모바일은 주소 줄의 검색 버튼으로 검색을 연다([[모바일:차이]]).
  - 누르면 줄 전체가 검색 줄(← 버튼 + 나머지 폭을 채우는 검색 상자)로 바뀌고 검색 상자에 포커스를 준다. 안내 글자는 데스크톱과 같다.
  - 입력이 비어 있으면 원래 폴더 내용을, 입력하면 데스크톱과 같은 결과를 보여 준다.
  - ← 버튼이나 외부 키보드의 Esc는 검색어를 지우고 원래 주소 줄(뒤로 · 경로 · 검색 버튼)로 돌아간다. 다른 위치로 가도 검색을 끝내고 원래 주소 줄로 돌아간다.
휴지통 보기: |
  휴지통을 탐색기에서 열면 지운 항목을 자세히 보기로 보여주고 열은 이름 · 원래 위치 · 삭제한 날짜다. 원래 위치는 `바탕 화면\Blog`처럼 `\`로 잇고, 삭제한 날짜는 방문자 시간대의 `YYYY-MM-DD`다. 블로그 항목에는 크기가 없어 Windows의 다른 열은 두지 않는다. 명령 모음은 복원 · 휴지통 비우기로 바뀐다.
  복원은 고른 항목 가운데 휴지통에 바로 보낸 항목만 돌려놓고, 휴지통에 보낸 폴더 안의 항목은 그 폴더와 함께 돌아간다.
  휴지통 안의 항목은 열 수 없고 복원만 된다. 복원과 비우기 규칙은 [[작업 공간:휴지통]]을 따른다.
탐색 창: |
  왼쪽 탐색 창은 바탕화면 아래의 폴더 트리와 휴지통이다.

  - 기본으로 바탕화면과 현재 위치, 그 조상(현재 폴더 포함)을 펼친다. 휴지통을 볼 때도 바탕화면은 펼친다.
  - 방문자가 펼치거나 접은 칸은 창 안에서 기억한다. 그 칸 안으로 가거나 탭을 고르면 그 경로의 기억을 지워 다시 펼친다.
  - 하위 폴더는 그 상위 위치(바탕화면 포함)에 기억한 정렬([[파일 탐색기:보기와 정렬]])로 늘어놓는다. 3단계보다 깊은 폴더는 3단계 모양으로 그린다.
  - 칸은 클릭·Enter·Space로 가고, 꺾쇠·→·←로 펼치고 접는다. Tab으로는 칸 하나만 닿는다. 고른 칸(현재 위치)이 보이면 그 칸, 조상을 접어 보이지 않으면 가장 가까운 보이는 조상, 그것도 없으면 첫 칸이다.
