_codocs:
  id: chrome
  name: Chrome
  parent:
    - 화면별 기능
개요: |
  글을 읽는 Chrome 창의 구성, 새 탭 페이지, 주소창, 글 주소, 글 화면을 정한다.
  창 자체의 열기·이동·크기·스냅은 [[창 동작]]을 따른다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 탭 표시줄 | 탭 + 새 탭 버튼 |
  | 도구 모음 | 뒤로 · 앞으로 · 새로고침, 주소창, ⋮ 메뉴 |
  | 본문 | 새 탭 페이지, 글, 검색 결과, 찾을 수 없음 화면 |

  - ⋮ 메뉴: 링크 복사 · 페이지에서 찾기 · 확대/축소. 링크 복사는 글을 보고 있을 때만 된다.
  - 북마크 별, 확장 프로그램, 프로필, 북마크 바는 두지 않는다.
  - 탭 제목은 글 제목(새 탭은 "새 탭")이다. 탭 전환·닫기·순서 변경은 [[파일 탐색기:탭]]과 같고, 마지막 탭을 닫으면 창이 닫힌다.
  - 뒤로·앞으로 기록은 탭마다 따로 있다. 탭 안에서 링크를 따라가거나 주소창으로 이동한 기록이 쌓인다.
새 탭 페이지: |
  새 탭 버튼을 누르거나 작업 표시줄에서 Chrome을 처음 열 때 보여준다.
  Google 새 탭처럼 가운데 검색창 하나와, 자주 가는 사이트 바로가기 자리에 최신 글을 보여준다. 검색창은 주소창과 같이 동작한다.
글 주소: |
  글 주소는 `/posts/<slug>`다. 예: `/posts/react-19-hooks`

  - slug는 Notion 글 데이터베이스의 `slug` 속성에 영어로 쓴다.
  - 공유 링크, SEO, 브라우저 주소([[창 동작:브라우저 주소]]), Chrome 주소창이 모두 이 주소를 쓴다.
  - 개인 블로그는 slug를 자주 바꾸지 않고, 짧은 주소가 공유와 검색 노출에 유리해 ID를 넣지 않는다. slug를 바꿔야 하면 예전 slug를 새 주소로 영구 이동(308)하는 방법을 그때 추가한다.
주소창: |
  | 상황 | 동작 |
  |---|---|
  | 평소 | `seojaewan.com/posts/react-19-hooks`처럼 글 주소를 보여준다. 새 탭 페이지에서는 비어 있다 |
  | 클릭 | 주소 전체가 선택된다 |
  | 입력 중 | 아래에 추천 목록을 띄운다. [[검색:일치 규칙]]으로 글을 찾는다 |
  | 추천을 고르고 Enter | 현재 탭에서 그 글로 이동 |
  | 블로그 글 주소를 입력하고 Enter | 그 글로 이동 |
  | 외부 주소를 입력하고 Enter | 실제 브라우저의 새 탭에서 연다 |
  | 그 밖의 글자를 입력하고 Enter | 탭 안에 검색 결과 페이지를 보여준다. 제목에 검색어가 들어간 글 목록이다 |
  | 없는 글 주소 | 탭 안에 Chrome 스타일의 "페이지를 찾을 수 없음" 화면 |
글 화면: |
  | 영역 | 내용 |
  |---|---|
  | 머리 | 제목, 작성일, 폴더(카테고리) |
  | 커버 이미지 | Notion 커버가 있으면 제목 위에 |
  | 목차 | 제목(Heading)이 3개 이상이면 넓은 창에서는 오른쪽에 고정 목차, 좁은 창에서는 제목 아래 접힌 목차. 지금 읽는 위치를 표시한다 |
  | 본문 폭 | 창을 넓혀도 읽기 좋은 폭(약 720px)을 넘지 않게 가운데 정렬 |
  | 코드 블록 | 언어별 문법 강조, 복사 버튼 |
  | 링크 | 다른 글 링크는 같은 탭에서 이동, 외부 링크는 실제 브라우저의 새 탭 |
  | 이미지 | [[Notion 이미지 제공]]의 주소로 보여주고, 클릭하면 크게 보기 |
  | 꼬리 | 이전 글 / 다음 글(작성일 기준) |

  기술 글 읽기가 [[제품 정의:목적]]의 하나이므로, Windows 재현보다 읽기 편한 타이포그래피와 폭을 우선한다.
Notion 블록: |
  지원하는 블록: 제목, 문단, 목록(글머리·번호·할 일), 인용, 콜아웃, 코드, 이미지, 구분선, 토글, 표, 북마크(링크 카드), 수식.

  지원하지 않는 블록이 글에 들어오면 그 자리에 "지원하지 않는 블록(유형 이름)" 안내 상자를 보여주고 서버 로그에 경고를 남긴다.
  조용히 버리면 빠진 내용을 알 수 없고, 오류로 멈추면 웹훅 기반 갱신([[콘텐츠 원천:갱신 방식]])이 실패해 새 글이 열리지 않기 때문이다.
