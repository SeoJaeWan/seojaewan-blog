_codocs:
  id: workspace
  name: 작업 공간
  parent:
    - 화면별 기능
개요: |
  항목이 바탕화면과 폴더 트리의 어디에 놓이는지, 방문자가 폴더를 만들고 항목을 옮기고 지우는 규칙, 그리고 이 상태를 어디에 저장하고 언제 초기화하는지를 정한다.
  항목의 종류는 [[항목 모델]]에서 확인한다.
방문자별 저장: |
  폴더 만들기, 이름 바꾸기, 항목 옮기기, 휴지통은 방문자의 브라우저(localStorage)에만 저장된다.
  방문자 A가 만든 폴더는 방문자 B에게 보이지 않고, 사이트의 원래 구조(Notion 기준)는 바뀌지 않는다. 서버 저장소와 로그인은 두지 않는다.
배치: |
  항목마다 놓인 위치(상위 폴더)가 하나 있다. 상위 폴더가 없으면 바탕화면에 놓인 것이다.
  폴더도 항목이므로 폴더 안에 폴더를 둘 수 있고, 글과 외부 링크도 바탕화면이나 어느 폴더에나 둘 수 있다.
  폴더를 자기 자신이나 자기 하위 폴더 안으로 옮길 수는 없다.
초기 구조: |
  브라우저에 저장된 상태가 없으면 Notion 구조에서 초기 구조를 만든다.

  - 바탕화면에 `Blog` 폴더와 휴지통을 둔다.
  - Notion 글 데이터베이스의 `폴더` 속성으로 `Blog` 아래에 폴더를 만들고 글을 넣는다. 하위 폴더는 `React/Hooks`처럼 경로로 쓴다.
  - `폴더` 속성이 비어 있는 글은 `Blog` 폴더에 넣는다.
  - 외부 링크는 코드 설정 파일에 정한 초기 위치에 둔다([[항목 모델:외부 링크]]).

  폴더 구조를 Notion 페이지 계층에서 가져오는 방식은 데이터베이스가 아니라 페이지 트리를 읽어야 해 수집이 복잡해지므로 고르지 않았다.
Notion과 맞추기: |
  방문할 때마다 저장된 상태를 현재 Notion 글 목록과 맞춘다.

  - 새 글은 그 글의 `폴더` 속성에 해당하는 폴더로 들어간다. 그 폴더가 휴지통에 있거나 없으면 `Blog` 폴더로 들어간다.
  - 폴더는 이름이 아니라 고유 ID로 찾는다. 방문자가 `React` 폴더의 이름을 바꾸거나 옮겨도 새 React 글은 그 폴더로 들어간다. 이름으로 찾으면 이름만 바꿔도 새 글이 `Blog`로 빠져 어색하기 때문이다.
  - 방문자가 옮겨 둔 기존 글은 Notion의 `폴더` 속성 위치로 되돌리지 않는다.
  - Notion에서 사라진 글과 설정 파일에서 사라진 외부 링크는 상태에서도 지운다.
  - 저장된 상태가 깨져 있어 읽을 수 없으면 초기 구조에서 다시 시작한다. 상위 폴더가 없는 항목은 바탕화면으로 옮긴다.
폴더 이름: |
  폴더를 만들거나 이름을 바꿀 때 Windows 11 파일 이름 규칙을 따른다.

  - 비어 있거나 공백만 있으면 안 되고, 최대 255자다.
  - `< > : " / \ | ? *`와 제어 문자를 쓸 수 없다.
  - `.`, `..`, `CON`, `PRN`, `AUX`, `NUL`, `COM1`~`COM9`, `LPT1`~`LPT9`는 대소문자와 확장자 유무에 관계없이 쓸 수 없다.
  - 이름 끝의 공백과 마침표는 쓸 수 없다.
  - 같은 위치에는 같은 이름의 폴더를 둘 수 없다. 비교할 때 대소문자와 유니코드 정규화 차이는 무시한다. 다른 위치에서는 같은 이름을 쓸 수 있다.
  - 새 폴더의 기본 이름은 `새 폴더`이고, 같은 위치에 이미 있으면 `새 폴더 (2)`, `새 폴더 (3)` 순서로 가장 작은 빈 번호를 쓴다.
  - 잘못된 이름을 입력하면 Windows처럼 말풍선으로 이유를 보여주고, 입력값을 유지한 채 다시 고칠 수 있게 한다.

  폴더 이름을 바꿔도 폴더의 고유 ID는 그대로다.
휴지통: |
  - 휴지통은 바탕화면에 고정되며 옮기거나 이름을 바꾸거나 지울 수 없다.
  - 폴더, 글, 외부 링크를 모두 휴지통으로 보낼 수 있다. 폴더를 보내면 안의 항목도 함께 간다.
  - `Blog` 폴더는 휴지통으로 보낼 수 없다. 새 글이 들어가는 기본 폴더라서, 없으면 새 글이 갈 곳이 없기 때문이다. 이름 변경과 이동은 된다.
  - 휴지통에서 복원하면 원래 위치로 돌아간다. 원래 상위 폴더도 휴지통에 있으면 바탕화면으로 간다.
  - 휴지통 비우기는 실제로 동작하지 않는다. 누르면 Windows 11 스타일 메시지 상자를 보여준다. 제목은 "휴지통 비우기", 본문은 "소중한 글이에요 지우지 말아주세요", 버튼은 "확인" 하나다. 그래서 휴지통의 항목은 언제든 복원할 수 있다.

  브라우저 기본 `alert()`는 Windows 화면 안에서 웹 페이지 팝업이 떠 몰입감을 깨므로 쓰지 않는다.
다시 시작: |
  Start 메뉴의 전원 버튼에는 `다시 시작`만 둔다. 절전과 시스템 종료는 두지 않는다.

  다시 시작을 누르면 재부팅 화면(Windows 로고와 로딩)을 보여준 뒤, 실행 중인 상태와 방문자의 브라우저에 저장된 상태를 전부 처음으로 되돌린다.
  - 폴더, 배치, 휴지통
  - 열린 창(모두 닫힘)
  - 작업 표시줄 고정 목록, 바탕화면 아이콘 정렬 같은 설정

  열린 창의 저장 여부와 새로고침 뒤 초기 상태는 [[창 동작:새로고침과 첫 진입]]에서 정한다.

  진짜 Windows는 다시 시작해도 설정이 남지만, 여기서는 처음 상태로 돌아가는 유일한 방법이라 전부 되돌린다. 별도의 "초기화" 메뉴는 두지 않는다.

  순서:
  1. 전원 메뉴에서 `다시 시작`을 누르면 메뉴와 Start가 닫힌다.
  2. 재부팅 화면이 지금 화면 전체를 덮으며 페이드 인한다(`motion-boot-screen-enter`).
  3. 화면을 완전히 덮은 뒤 상태를 지운다. 덮은 뒤 지워야 창이 닫히고 아이콘이 돌아가는 모습이 가려진다.
  4. 재부팅 화면을 정해진 시간(`motion/delay/boot-screen`) 동안 보여 주고, 그동안 ProgressRing이 돈다.
  5. 재부팅 화면이 페이드 아웃하며(`motion-boot-screen-exit`) 처음 상태의 바탕화면이 보인다.

  움직임의 시간과 이징은 [[디자인 기반:모션]]에 있다.

  초기화는 새로고침 없이 앱 안에서 한다. Zustand 저장소를 처음 값으로 되돌리고 `persist` 저장분을 지운 뒤, shell 아래 바탕화면 하위 트리의 `key`를 바꿔 다시 마운트한다. 재부팅 화면과 그 바깥 틀은 다시 마운트하지 않는다(연출이 끊기지 않게). 다시 마운트하면 저장소 밖의 상태도 사라진다. `location.reload()`는 연출이 끊기고 흰 화면이 끼어 쓰지 않는다.
