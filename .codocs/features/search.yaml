_codocs:
  id: search
  name: 검색
  parent:
    - 화면별 기능
개요: |
  검색 입력칸, 검색 대상, 일치 규칙, 결과 화면을 정한다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.

  - 작업 표시줄 검색 입력칸에 포커스하면 위에 검색 패널이 열린다. 글자는 작업 표시줄 입력칸에 입력하고 결과는 패널에 나온다. 패널 안에는 입력칸이 없다.
  - Start 메뉴 위쪽 검색 입력칸에 입력하면 Start 메뉴 안이 결과 화면으로 바뀐다([[Start 메뉴:검색]]).
  - 두 입구의 결과 규칙은 같고, 검색어는 따로다([[검색:입력칸]]).
입력칸: |
  작업 표시줄, Start 메뉴, 모바일 검색 패널의 검색 입력칸은 같은 컴포넌트(둥근 검색칸)다.

  - 호버하거나 포커스하면 돋보기 아이콘에 하늘색에서 파란색으로 이어지는 그라데이션이 나타나며 회전하고, 아이콘이 조금 커진다. 키보드로 포커스해도 같다. 누를 때 따로 작아지지 않는다. 밑줄은 생기지 않는다. Safari에서는 그라데이션 대신 단색 강조색으로 물든다.
  - 이 효과는 작업 표시줄 검색칸, Start 패널 검색칸, 모바일 검색 패널 검색칸에 모두 같다. 셋 다 같은 Windows 검색 기능이기 때문이다.
  - Chrome 새 탭 페이지의 검색칸은 웹페이지 안의 검색이라 다른 요소이며 이 효과가 없다([[Chrome:새 탭 페이지]]).
  - 시간과 이징은 모션 토큰과 피그마 견본이 정하므로 여기에 적지 않는다([[디자인 기반:모션]], [[디자인 기반:모션 견본]]).
  - 탐색기 주소 표시줄의 검색 상자는 일반 입력창이라 포커스 때 밑줄이 생긴다.

  검색어는 둘이다.
  - Start 위쪽 검색칸에 입력하면 Start 안에서만 결과를 보이고, 작업 표시줄 검색칸에는 나타나지 않는다.
  - 작업 표시줄 검색칸에 입력하면 Start가 닫히고 검색 패널이 열린다. 모바일 검색 패널의 입력칸도 검색 패널의 검색어다.
  - 각 검색어는 그 패널이 닫히면 지우고, [[작업 공간:다시 시작]]해도 지운다. 공백만 있으면 검색어가 없는 것으로 본다.
  - Esc로 검색 패널을 닫은 뒤 작업 표시줄 검색칸에 이어서 입력하면 검색 패널이 다시 열린다.
검색 대상: |
  폴더, 글, 외부 링크를 모두 이름으로만 검색한다. 글의 이름은 제목이다.
  Windows 파일 검색처럼 세 종류가 같은 기준이라 단순하고 일관된다.

  본문 전체 검색은 모든 글 본문으로 색인을 만들어 브라우저로 보내야 하고 글이 바뀔 때마다 다시 만들어야 해서 두지 않는다. 휴지통에 들어간 항목은 검색하지 않는다.
일치 규칙: |
  - 이름에 검색어가 포함되면 결과에 나온다. 대소문자와 앞뒤 공백은 무시한다.
  - 검색어가 한글 초성으로만 이루어져 있으면 이름의 초성과 비교한다. 예: `ㄹㅇㅌ` → "리액트". Windows에는 없는 기능이지만 한국어 블로그에서 찾기 편해 넣는다.
  - 순서: ① 이름 전체가 검색어와 같음 → ② 검색어로 시작 → ③ 중간에 포함. 같은 단계 안에서는 글은 최신순, 폴더와 외부 링크는 이름순이다.
결과 화면: |
  - 글자를 입력할 때마다 바로 결과가 바뀐다.
  - 데스크톱은 왼쪽에 결과 목록, 오른쪽에 고른 항목의 카드 1개를 크게 보여준다. 카드는 목록에서 고른 항목을 따라가고, 처음에는 최고 일치다.
  - 모바일은 최고 일치 카드를 맨 위에 두고, 그 아래에 결과 목록을 둔다.
  - 결과 목록에는 최고 일치 1개를 먼저 보여주고, 나머지 결과를 폴더 / 글 / 외부 링크로 묶어 보여준다.
  - 카드 안에 그 항목의 동작(열기, 글과 외부 링크는 링크 복사)을 둔다. 카드 내용은 고른 항목의 종류에 맞춘다.
  - 결과가 없으면 "검색 결과 없음"을 안내한다.
  - ↑·↓는 화면에 보이는 차례(최고 일치 → 폴더 → 글 → 외부 링크)로 고른 항목을 옮기고, 처음과 끝에서 멈춘다. 검색어가 바뀌면 최고 일치로 돌아간다. 한글을 조합하는 중의 키는 무시한다. Enter로 고른 항목을 연다.
  - Esc를 누르거나 바깥을 클릭하면 닫힌다. 메뉴가 열려 있으면 Esc는 그 메뉴만 먼저 닫는다.
  - 항목을 열면 바탕화면과 같이 동작하고([[창 동작:열기 규칙]]) 검색 패널은 닫힌다.
입력 전 화면: |
  검색어를 입력하기 전에는 두 영역을 보여준다.

  - 최근: 방문자가 최근에 연 항목 최대 5개. 검색으로 연 것뿐 아니라 바탕화면·탐색기·Start에서 연 항목도 기록한다. 최근 연 항목은 20개까지 기억하고, 그중 휴지통에 들어간 항목을 뺀 앞 5개를 보인다. 브라우저에 저장되며 [[작업 공간:다시 시작]]하면 초기화된다.
  - 추천: 최신 글 6개(모바일 3개)와 날짜. 사이트의 글 기준이며 방문자가 휴지통에 넣은 글은 빼고 보여준다.

  처음 방문한 사람은 최근 항목이 없으므로 추천만 본다.
