_codocs:
  id: window
  name: 창 동작
  parent:
    - 화면별 기능
개요: |
  File Explorer와 Chrome이 함께 따르는 창의 열기, 조작, 스냅, 그리고 브라우저 주소·새로고침과의 관계를 정한다.
  각 앱 창 안의 내용은 File Explorer와 Chrome 문서에서 정한다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.
열기 규칙: |
  바탕화면·Start·검색에서 항목을 열 때의 기본 동작이다. 실제 Windows 11과 같게 맞췄다.

  | 항목 | 열면 |
  |---|---|
  | 글 | 가장 최근에 쓴 Chrome 창이 있으면 그 창의 새 탭, 없으면 새 창. 같은 글이 이미 열려 있어도 새 탭을 연다 |
  | 폴더 | 새 탐색기 창 |
  | 외부 링크 | 실제 브라우저의 새 탭([[항목 모델:종류]]) |

  우클릭 메뉴의 `새 창에서 열기`는 항상 새 창을 연다. 탐색기 안에서 항목을 열 때의 동작은 File Explorer 문서에서 정한다.
창 조작: |
  | 조작 | 동작 |
  |---|---|
  | 처음 열 때 | 화면 가운데 근처에 앱별 기본 크기로 연다. 새 창은 조금씩 오른쪽 아래로 비켜서 겹친다(계단식) |
  | 이동 | 제목 표시줄을 드래그 |
  | 크기 조절 | 가장자리와 모서리를 드래그. 앱별 최소 크기가 있다 |
  | 최대화 | 최대화 버튼, 제목 표시줄 더블클릭. 다시 하면 원래 크기와 위치로 돌아간다 |
  | 최소화 | 최소화 버튼. 작업 표시줄 버튼 쪽으로 줄어드는 애니메이션을 보여준다 |
  | 닫기 | 닫기 버튼 |
  | 복원 | 최소화된 창을 작업 표시줄 버튼으로 복원하면, 최소화의 반대로 버튼 위치에서 커지며 나타난다 |
  | 순서 | 창을 클릭하면 맨 앞으로 온다. 맨 앞 창은 제목 표시줄이 진하고 나머지는 흐리다. 맨 앞 창을 닫으면 남은 창 가운데 가장 최근에 맨 앞이었던 창이 맨 앞으로 온다. 남은 창이 없으면 바탕화면만 보인다 |
  | 화면 밖 | 제목 표시줄 일부는 항상 화면 안에 남아 다시 잡을 수 있다 |
  | 열고 닫을 때 | Windows 11처럼 살짝 커지며 나타나고 작아지며 사라지는 애니메이션을 보여준다 |

  창은 작업 표시줄을 뺀 화면 영역 안에서 배치되며, 최대화하면 그 영역을 채운다.

  앱별 크기는 피그마 Screens(1920×1080 기준)에서 다음과 같이 정했다. 작업 영역이 기본 크기보다 작으면 작업 영역에 맞춰 줄인다.

  | 앱 | 기본 크기 | 최소 크기 | 이유 |
  |---|---|---|---|
  | File Explorer | 1024×640 | 500×340 | Windows 11 탐색기를 처음 열 때와 비슷한 비율. 최소 크기는 탐색 창과 항목 한 줄이 함께 보이는 크기 |
  | Chrome | 1280×800 | 500×400 | 글 본문(최대 720px)과 오른쪽 목차가 함께 들어가는 크기. 최소 크기는 Chrome의 최소 창 폭에 맞춤 |

  계단식으로 열 때 새 창은 앞 창보다 오른쪽 아래로 32px씩 비켜 놓는다. 여기서 앞 창은 앱과 관계없이 지금 맨 앞에 있는 창이다. 비켜 놓은 창이 작업 영역을 벗어나면 기본 위치(가운데)로 돌아간다.
  모션 값은 [[디자인 기반:모션]]을 따른다.
스냅: |
  - 끌어서 스냅: 창을 화면 왼쪽·오른쪽 끝으로 끌면 화면 절반, 모서리로 끌면 화면 4분의 1, 위쪽 끝으로 끌면 최대화된다. 끌고 있는 동안 채울 영역을 미리 보여준다(SnapPreview).
  - 스냅 레이아웃: 최대화 버튼에 마우스를 올리면 여러 칸 배치 선택지가 나타나고, 칸을 고르면 창이 그 자리를 채운다.
  - 스냅된 창을 끌어서 떼면 스냅하기 전 크기로 돌아간다.

  스냅 레이아웃의 칸 종류는 Windows 11이 일반 가로 화면에서 보여주는 4종으로 한다: 반반, 2:1, 반 + 4분의 1 두 칸, 4분할. 끌어서 스냅의 절반·4분의 1 영역과 같은 칸으로 구성돼 두 방식의 결과가 어긋나지 않는다. 넓은 화면에서 Windows가 더 보여주는 3열 배치는 창이 둘뿐인 블로그에서 쓸 일이 적어 두지 않는다.

  스냅 레이아웃 팝업의 접근성 이름은 "스냅 레이아웃"이다. 칸마다 접근성 이름이 있고, 같은 이름의 칸이 여러 레이아웃에 있어 칸 묶음(group)도 레이아웃 이름을 가진다.

  | 레이아웃(묶음 이름) | 칸 이름(칸 순서) |
  |---|---|
  | 반반 | 왼쪽 절반, 오른쪽 절반 |
  | 3분의 2와 3분의 1 | 왼쪽 3분의 2, 오른쪽 3분의 1 |
  | 절반과 4분의 1 두 칸 | 왼쪽 절반, 오른쪽 위 4분의 1, 오른쪽 아래 4분의 1 |
  | 4분할 | 왼쪽 위 4분의 1, 왼쪽 아래 4분의 1, 오른쪽 위 4분의 1, 오른쪽 아래 4분의 1 |

  Snap Assist(남은 칸을 다른 창으로 채우는 제안)를 둔다. 접근성 이름은 "Snap Assist"다. 창 하나를 스냅하면 남은 칸에 열려 있는 다른 창의 축소 화면(WindowPreview)을 보여주고, 고르면 그 창이 남은 칸을 채운다. Esc나 빈 곳을 누르면 제안을 닫는다. 열린 창이 하나뿐이면 보여주지 않는다.
  제안은 최근에 맨 앞에 있던 창부터 놓는다. 최소화된 창도 제안에 넣고, 고르면 복원해 그 칸에 놓는다. 카드의 닫기 버튼은 그 창을 닫는다.
  남은 칸이 둘 이상이면(반 + 4분의 1 두 칸, 4분할) 남은 칸을 칸 순서(왼쪽 열 위에서 아래, 오른쪽 열 위에서 아래)대로 하나씩 제안한다.
  스냅된 창을 최대화했다가 이전 크기로 복원하면 최대화하기 바로 앞 모습(그 스냅 칸)으로 돌아간다.
  스냅된 창은 최대화된 창처럼 모서리를 둥글게 하지 않고 그림자를 두지 않으며, 창 버튼은 최대화 모양을 유지한다.
브라우저 주소: |
  브라우저 주소창은 글만 따라간다.

  - 맨 앞 창이 글을 보는 Chrome 탭이면 그 글의 공유 링크 주소다([[제품 정의:블로그 기능]]). 그 밖의 경우는 `/`다.
  - 폴더는 방문자가 만들고 이름을 바꿀 수 있어 다른 사람에게 공유하면 열리지 않을 수 있다. 그래서 탐색기는 주소에 반영하지 않는다.
  - 주소만 바꾸고 브라우저 기록에는 쌓지 않는다. 브라우저의 뒤로 가기는 이 블로그에 들어오기 전 사이트로 나간다. 블로그 안의 앞뒤 이동은 Chrome·탐색기 창의 뒤로·앞으로 버튼이 맡는다. 창이 여러 개라 브라우저 뒤로 가기가 어떤 창을 바꿀지 애매해지기 때문이다.
새로고침과 첫 진입: |
  새로고침하거나 주소로 처음 들어오면, 주소에 해당하는 창 하나만 열린 상태로 시작한다.

  - 글 주소면 그 글이 열린 Chrome 창 하나가 뜨고, 다른 창은 모두 닫힌 상태다.
  - 주소에 해당하는 글이 없으면 `페이지를 찾을 수 없음` 화면이 열린 Chrome 창 하나만 뜬다.
  - `/`이면 바탕화면만 보인다.
  - 공유 링크로 처음 들어온 경우와 같은 동작이다.

  열린 창은 브라우저에 저장하지 않는다. 바탕화면 배치, 고정 목록 같은 상태는 새로고침 뒤에도 그대로다([[작업 공간:방문자별 저장]]).
