_codocs:
  id: window
  name: 창 동작
  parent:
    - 화면별 기능
개요: |
  File Explorer와 Chrome이 함께 따르는 창의 열기, 조작, 스냅, 그리고 브라우저 주소·새로고침과의 관계를 정한다.
  각 앱 창 안의 내용은 File Explorer와 Chrome 문서에서 정한다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.
열기 규칙: |
  바탕화면·Start·검색에서 항목을 열 때의 기본 동작이다. 실제 Windows 11과 같게 맞췄다.

  | 항목 | 열면 |
  |---|---|
  | 글 | 가장 최근에 쓴 Chrome 창이 있으면 그 창의 새 탭, 없으면 새 창. 같은 글이 이미 열려 있어도 새 탭을 연다 |
  | 폴더 | 새 탐색기 창 |
  | 외부 링크 | 실제 브라우저의 새 탭([[항목 모델:종류]]) |

  우클릭 메뉴의 `새 창에서 열기`는 항상 새 창을 연다. 탐색기 안에서 항목을 열 때의 동작은 File Explorer 문서에서 정한다.
창 조작: |
  | 조작 | 동작 |
  |---|---|
  | 처음 열 때 | 화면 가운데 근처에 앱별 기본 크기로 연다. 새 창은 조금씩 오른쪽 아래로 비켜서 겹친다(계단식) |
  | 이동 | 제목 표시줄을 드래그 |
  | 크기 조절 | 가장자리와 모서리를 드래그. 앱별 최소 크기가 있다 |
  | 최대화 | 최대화 버튼, 제목 표시줄 더블클릭. 다시 하면 원래 크기와 위치로 돌아간다 |
  | 최소화 | 최소화 버튼. 작업 표시줄 버튼 쪽으로 줄어드는 애니메이션을 보여준다 |
  | 닫기 | 닫기 버튼 |
  | 순서 | 창을 클릭하면 맨 앞으로 온다. 맨 앞 창은 제목 표시줄이 진하고 나머지는 흐리다 |
  | 화면 밖 | 제목 표시줄 일부는 항상 화면 안에 남아 다시 잡을 수 있다 |
  | 열고 닫을 때 | Windows 11처럼 살짝 커지며 나타나고 작아지며 사라지는 애니메이션을 보여준다 |

  창은 작업 표시줄을 뺀 화면 영역 안에서 배치되며, 최대화하면 그 영역을 채운다. 앱별 기본 크기와 최소 크기는 피그마 Screens를 만들 때 정한다.
스냅: |
  - 끌어서 스냅: 창을 화면 왼쪽·오른쪽 끝으로 끌면 화면 절반, 모서리로 끌면 화면 4분의 1, 위쪽 끝으로 끌면 최대화된다. 끌고 있는 동안 채울 영역을 미리 보여준다.
  - 스냅 레이아웃: 최대화 버튼에 마우스를 올리면 여러 칸 배치 선택지가 나타나고, 칸을 고르면 창이 그 자리를 채운다.
  - 스냅된 창을 끌어서 떼면 스냅하기 전 크기로 돌아간다.

  스냅 레이아웃의 칸 종류와 다른 창으로 나머지 칸을 채우는 제안(Snap Assist) 여부는 피그마 Screens를 만들 때 정한다.
브라우저 주소: |
  브라우저 주소창은 글만 따라간다.

  - 맨 앞 창이 글을 보는 Chrome 탭이면 그 글의 공유 링크 주소다([[제품 정의:블로그 기능]]). 그 밖의 경우는 `/`다.
  - 폴더는 방문자가 만들고 이름을 바꿀 수 있어 다른 사람에게 공유하면 열리지 않을 수 있다. 그래서 탐색기는 주소에 반영하지 않는다.
  - 주소만 바꾸고 브라우저 기록에는 쌓지 않는다. 브라우저의 뒤로 가기는 이 블로그에 들어오기 전 사이트로 나간다. 블로그 안의 앞뒤 이동은 Chrome·탐색기 창의 뒤로·앞으로 버튼이 맡는다. 창이 여러 개라 브라우저 뒤로 가기가 어떤 창을 바꿀지 애매해지기 때문이다.
새로고침과 첫 진입: |
  새로고침하거나 주소로 처음 들어오면, 주소에 해당하는 창 하나만 열린 상태로 시작한다.

  - 글 주소면 그 글이 열린 Chrome 창 하나가 뜨고, 다른 창은 모두 닫힌 상태다.
  - `/`이면 바탕화면만 보인다.
  - 공유 링크로 처음 들어온 경우와 같은 동작이다.

  열린 창은 브라우저에 저장하지 않는다. 바탕화면 배치, 고정 목록 같은 상태는 새로고침 뒤에도 그대로다([[작업 공간:방문자별 저장]]).
