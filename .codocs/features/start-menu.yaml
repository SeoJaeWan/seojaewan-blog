_codocs:
  id: start-menu
  name: Start 메뉴
  parent:
    - 화면별 기능
개요: |
  작업 표시줄의 Start 버튼으로 여는 Start 메뉴의 구성과 동작을 정한다.
  검색 상자를 눌렀을 때의 동작은 검색 문서에서 정한다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 위 | 검색 상자. 누르면 검색 패널로 바뀐다 |
  | 고정됨 | 고정한 항목 그리드와 `모든 항목` 버튼 |
  | 추천 | 최신 글과 `자세히` 버튼 |
  | 아래 | 왼쪽에 블로그 주인의 이름과 사진(프로필), 오른쪽에 전원 버튼 |

  - 프로필은 눌러도 아무 동작을 하지 않는다. 소개 페이지는 [[항목 모델:나중에 검토할 것]]이다.
  - 전원 버튼에는 `다시 시작`만 있다([[작업 공간:다시 시작]]).
고정됨: |
  - 폴더, 글, 외부 링크, 앱을 고정할 수 있다. 바탕화면과 탐색기의 우클릭 메뉴 `시작 화면에 고정`으로 추가한다.
  - 처음에는 File Explorer, Chrome, `Blog` 폴더, 주요 외부 링크가 고정돼 있다. 어떤 외부 링크를 처음부터 고정할지는 외부 링크 설정 파일에서 정한다([[항목 모델:외부 링크]]).
  - 6열 × 3행(18개)을 한 화면에 보여주고, 넘치면 아래로 스크롤한다. Windows 11은 페이지 넘김 방식이지만 마우스 휠과 터치에서 스크롤이 더 자연스럽다.
  - 새로 고정한 항목은 맨 뒤에 추가한다. 드래그로 순서를 바꿀 수 있다.
  - 우클릭 메뉴: 열기 · 맨 앞으로 이동 · 시작 화면에서 고정 해제. 글과 외부 링크는 링크 복사도 있다.
  - 휴지통에 들어간 항목은 고정됨에서 보이지 않고, 복원하면 다시 보인다.
  - 고정 목록과 순서는 브라우저에 저장되며 [[작업 공간:다시 시작]]하면 처음 상태로 돌아간다.

  작업 표시줄 고정은 앱만 대상으로 따로 관리한다([[작업 표시줄:고정과 순서]]).
모든 항목: |
  Windows 11의 `모든 앱` 자리에 `모든 항목` 버튼을 둔다. 블로그의 앱은 두 개뿐이라 앱 목록은 의미가 적기 때문이다.
  누르면 Start 메뉴 내용이 모든 폴더·글·외부 링크를 이름순으로 나열한 목록으로 바뀐다. Windows처럼 첫 글자별로 묶고(`A`, `B`, ..., `ㄱ`, `ㄴ`, ...), 글자를 누르면 그 글자로 이동한다. 휴지통에 들어간 항목은 빼고, 뒤로 버튼으로 고정됨 화면으로 돌아간다.

  추천의 `자세히`가 최신순 탐색이라면 `모든 항목`은 이름순 탐색이다.
추천: |
  - 최신 글 6개를 2열 × 3행으로 보여주고 제목과 날짜를 표시한다.
  - `자세히`를 누르면 모든 글을 최신순으로 보여주는 목록으로 바뀐다. 뒤로 버튼으로 돌아간다.
  - 추천은 사이트의 글 기준이다. 방문자가 휴지통에 넣은 글은 보여주지 않는다.
열기와 닫기: |
  - 항목을 열면 바탕화면과 같이 동작한다([[항목 모델:종류]]). 항목을 열면 Start 메뉴는 닫힌다.
  - Start 버튼을 다시 누르거나, Esc를 누르거나, 바깥을 클릭하면 닫힌다.
