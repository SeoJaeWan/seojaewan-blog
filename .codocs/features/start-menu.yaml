_codocs:
  id: start-menu
  name: Start 메뉴
  parent:
    - 화면별 기능
개요: |
  작업 표시줄의 Start 버튼으로 여는 Start 메뉴의 구성과 동작을 정한다.
  검색 결과의 규칙은 검색 문서에서 정한다. 모바일에서의 동작은 모바일 문서에서 따로 정한다.
  최신 Windows 11 Start 메뉴처럼 한 화면에서 아래로 스크롤한다. 고정됨 아래에 모두가 이어지고, 추천 영역은 두지 않는다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 위 | 검색 입력칸([[Start 메뉴:검색]]) |
  | 고정됨 | 고정한 항목 그리드 |
  | 모두 | 모든 항목 목록과 `보기:` 전환([[Start 메뉴:모두]]) |
  | 아래 | 왼쪽에 블로그 주인의 이름과 사진(프로필), 오른쪽에 전원 버튼 |

  - 프로필은 눌러도 아무 동작을 하지 않는다. 소개 페이지는 [[항목 모델:나중에 검토할 것]]이다.
  - 전원 버튼에는 `다시 시작`만 있다([[작업 공간:다시 시작]]).
  - 데스크톱에서 패널과 작업 표시줄 사이에는 12px 틈을 둔다. Windows 11 값이다.
  - 패널 높이는 피그마 값(데스크톱 720px, 모바일 640px)이 기본이다. 브라우저 화면이 낮으면 `작업 영역 높이 - 틈`(데스크톱 12px, 모바일 0)까지 줄어든다. 위쪽(검색칸)과 아래쪽(프로필·전원 줄)은 그대로이고 가운데 본문만 줄며 스크롤된다. 패널은 위쪽과 아래쪽을 더한 높이보다 작아지지 않는다. 검색 패널도 같은 규칙이다.
고정됨: |
  - 폴더, 글, 외부 링크, 앱을 고정할 수 있다. 바탕화면과 탐색기의 우클릭 메뉴 `시작 화면에 고정`으로 추가한다.
  - 처음에는 File Explorer, Chrome, `Blog` 폴더, 주요 외부 링크가 고정돼 있다. 어떤 외부 링크를 처음부터 고정할지는 외부 링크 설정 파일에서 정한다([[항목 모델:외부 링크]]).
  - 6열 × 3행(18개)을 한 화면에 보여주고, 넘치면 아래로 스크롤한다. Windows 11은 페이지 넘김 방식이지만 마우스 휠과 터치에서 스크롤이 더 자연스럽다.
  - 새로 고정한 항목은 맨 뒤에 추가한다.
  - 데스크톱에서는 칸을 끌어 순서를 바꾼다(마우스 왼쪽 버튼·펜, 4px 넘게 움직이면 시작). 끄는 동안 포인터 아래 칸 자리로 바로 옮기고, 끈 뒤 따라오는 클릭은 항목을 열지 않는다. 모바일에는 끌기가 없다.
  - 우클릭(모바일 길게 누르기) 메뉴: 열기 · 맨 앞으로 이동 · 링크 복사(글·외부 링크만) · 시작 화면에서 고정 해제. 맨 앞 항목에서는 맨 앞으로 이동을 고를 수 없다. 맨 앞은 저장한 고정 목록의 첫 자리다(휴지통에 있어 보이지 않는 항목도 순서에 남는다).
  - 휴지통에 들어간 항목은 고정됨에서 보이지 않고, 복원하면 다시 보인다.
  - 고정 목록과 순서의 저장은 [[작업 공간:방문자별 저장]], 초기화는 [[작업 공간:다시 시작]]에서 정한다.

  작업 표시줄 고정은 앱만 대상으로 따로 관리한다([[작업 표시줄:고정과 순서]]).
모두: |
  고정됨 바로 아래에 모든 폴더·글·외부 링크·앱을 나열한다. Windows 11의 `모두`(모든 앱) 자리다. 휴지통에 들어간 항목은 뺀다.
  오른쪽 위 `보기:` 드롭다운으로 세 가지 보기를 바꾼다. 고른 보기는 브라우저에 저장된다. 처음 보기와 [[작업 공간:다시 시작]] 뒤의 보기는 범주다.

  | 보기 | 모양 |
  |---|---|
  | 간단히 | 이름순 목록. 첫 글자별로 묶고(기호로 시작 `&`, 숫자로 시작 `#`, `A`, `B`, ..., `ㄱ`, `ㄴ`, ...), 글자 머리글을 누르면 그 글자로 이동한다 |
  | 그리드 | 이름순 아이콘 격자. 간단히와 같이 첫 글자별로 묶는다(기호로 시작 `&`, 숫자로 시작 `#`) |
  | 범주 | 항목 종류(폴더 / 글 / 외부 링크 / 앱) 차례로 묶고, 묶음 안은 이름순이다 |

  - 목록의 줄은 클릭·Enter·Space로 연다.
  - 줄 우클릭(모바일 길게 누르기) 메뉴: 열기 · 시작 화면에 고정(이미 고정된 항목은 시작 화면에서 고정 해제) · 링크 복사(글·외부 링크만) · 작업 표시줄에 고정(앱만, 이미 고정된 앱은 작업 표시줄에서 고정 해제).
  - "고정됨"과 "모두" 영역은 화면 읽기 프로그램이 구분하도록 각각 이름을 가진다.

  글자로 이동하기: 목록의 첫 글자 머리글을 누르면 글자 격자가 열리고, 글자를 고르면 격자가 닫히며 목록이 그 글자로 이동한다. 글자 격자가 열리고 닫힐 때 움직임이 있다(`motion-start-jump-list-enter`·`motion-start-jump-list-exit`, [[디자인 기반:모션]]).
  글자 격자는 `&`(기호로 시작하는 항목) `#`(숫자로 시작하는 항목) `A`~`Z` `ㄱ`~`ㅎ` 순서의 4열 격자다. 항목이 없는 글자는 흐리게 보이고 누를 수 없다. Windows의 시계(최근 항목)·지구본(기타 문자) 칸은 우리 목록에 그 묶음이 없어 두지 않는다. 그래서 격자에 칸이 없는 문자(한글·라틴 밖의 문자)로 시작하는 항목은 `&`에 넣는다. 악센트가 붙은 라틴 글자는 악센트를 뗀 글자(`É` → `E`), 된소리는 예사소리(`ㄲ` → `ㄱ`)에 넣는다. 격자가 열리면 "모두" 제목 줄 오른쪽에 "뒤로" 버튼이 나온다.
  `보기:` 전환은 움직임 없이 바로 바뀐다. 실제 Windows 11 Start와 같다.
검색: |
  - 위쪽 검색 입력칸은 작업 표시줄 검색 입력칸과 같은 컴포넌트라 포커스할 때 돋보기 아이콘의 효과도 같다([[검색:입력칸]]). 접근성 이름은 `시작 메뉴 검색`이다. 작업 표시줄 검색칸과 이름이 겹치지 않게 하려는 것이다.
  - 글자를 입력하면 Start 메뉴 안이 검색 결과 화면으로 바뀐다. 결과의 규칙과 모양은 [[검색:결과 화면]]과 같다. 입력을 모두 지우면 원래 화면(고정됨, 모두)으로 돌아간다. 결과 화면으로 바뀔 때와 돌아갈 때는 움직임 없이 바로 바뀐다.
  - 이 검색칸의 검색어는 작업 표시줄 검색칸과 따로다([[검색:입력칸]]).
열기와 닫기: |
  - 고정됨·모두 목록·검색 결과에서 항목을 열면 바탕화면과 같은 규칙([[창 동작:열기 규칙]], [[항목 모델:종류]])으로 열고 Start 메뉴를 닫는다.
  - Start 버튼을 다시 누르거나, Esc를 누르거나, 바깥을 클릭하면 닫힌다.
  - Start 메뉴와 검색 패널은 함께 열리지 않는다. 하나를 열면 다른 하나는 닫힌다(Windows 11과 같다).
