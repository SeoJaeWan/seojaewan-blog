_codocs:
  id: window
  name: 창 동작
  parent:
    - 화면별 기능
개요: |
  File Explorer와 Chrome이 함께 따르는 창의 열기, 조작, 그리고 브라우저 주소·새로고침과의 관계를 정한다.
  각 앱 창 안의 내용은 File Explorer와 Chrome 문서에서 정한다. 스냅은 [[스냅]]에서, 모바일에서의 동작은 [[창 동작:모바일]]에서 정한다.
열기 규칙: |
  바탕화면·Start·검색에서 항목을 열 때의 기본 동작이다. 실제 Windows 11과 같게 맞췄다.

  | 항목 | 열면 |
  |---|---|
  | 글 | 가장 최근에 쓴 Chrome 창이 있으면 그 창의 새 탭, 없으면 새 창. 최소화된 창도 가장 최근 창이 될 수 있고, 그 창을 복원해 맨 앞으로 가져온다. 같은 글이 이미 열려 있어도 새 탭을 연다 |
  | 폴더 | 새 탐색기 창 |
  | 외부 링크 | 실제 브라우저의 새 탭([[항목과 폴더:종류]]) |

  - 우클릭 메뉴의 `새 창에서 열기`는 항상 새 창을 연다. 탐색기 안에서 항목을 열 때의 동작은 File Explorer 문서에서 정한다.
  - 탐색기를 위치 없이 열 때는 늘 "바탕 화면" 위치를 연다. 작업 표시줄·Start의 File Explorer, 탐색기의 `+` 새 탭, 작업 표시줄 우클릭 메뉴의 새 창이 모두 같다. Windows 11은 홈을 열지만 블로그에는 홈 화면이 없다.
  - 모바일에서 글을 여는 방식은 [[창 동작:모바일]]에서 정한다.
  - 휴지통에 있는 글을 주소로 열 때는 [[Chrome:휴지통에 있는 글]]을 따른다.
창 조작: |
  | 조작 | 동작 |
  |---|---|
  | 처음 열 때 | 화면 가운데 근처에 앱별 기본 크기로 연다. 새 창은 조금씩 오른쪽 아래로 비켜서 겹친다(계단식) |
  | 이동 | 제목 표시줄을 누른 뒤 4px 넘게 움직이면 끌기를 시작한다(클릭·더블클릭과 구분). 마우스 왼쪽 버튼과 펜만 받고 터치는 받지 않는다 |
  | 크기 조절 | 가장자리(창 밖 8px 띠)와 모서리(창 모서리에 걸친 16px 칸)를 드래그한다. 누르자마자 따라간다. 앱별 최소 크기가 있고, 이미 최소 크기보다 작은 창은 그 크기까지만 줄인다 |
  | 최대화 | 최대화 버튼, 제목 표시줄 더블클릭. 다시 하면 원래 크기와 위치로 돌아간다 |
  | 최소화 | 최소화 버튼. 작업 표시줄 버튼 쪽으로 줄어드는 애니메이션을 보여준다 |
  | 닫기 | 닫기 버튼 |
  | 복원 | 최소화된 창을 작업 표시줄 버튼으로 복원하면, 최소화의 반대로 버튼 위치에서 커지며 나타난다 |
  | 순서 | 창을 클릭하면 맨 앞으로 온다. 맨 앞 창은 제목 표시줄이 진하고 나머지는 흐리다. 맨 앞 창을 닫으면 남은 창 가운데 가장 최근에 맨 앞이었던 창이 맨 앞으로 온다. 남은 창이 없으면 바탕화면만 보인다 |
  | 화면 밖 | 제목 표시줄의 가로 200px·세로 40px은 항상 작업 영역 안에 남아 다시 잡을 수 있다. 200px은 창 버튼 셋(138px)보다 넓어 버튼이 아닌 잡을 곳이 남는다. 제목 표시줄은 작업 영역 위로 나가지 않는다. 끌기와 크기 조절이 모두 이 제한을 지킨다 |
  | 브라우저 화면 크기 변경 | 창의 크기와 자리는 그대로 둔다. 제목 표시줄(200×40)이 화면 밖으로 나가게 될 때만 보이는 동안 당겨 보여 주고 원래 자리는 기억해, 화면이 다시 커지면 원래 자리로 돌아간다. 그 사이 끌어서 옮기면 새 자리를 기억한다. 창 크기는 줄이지 않는다. 바탕화면 아이콘 칸([[바탕화면 아이콘:격자 자리]])과 같은 방식이다 |
  | 열고 닫을 때 | Windows 11처럼 살짝 커지며 나타나고 작아지며 사라지는 애니메이션을 보여준다 |

  창은 작업 표시줄을 뺀 화면 영역 안에서 배치되며, 최대화하면 그 영역을 채운다.

  앱별 크기는 피그마 Screens(1920×1080 기준)에서 다음과 같이 정했다. 작업 영역이 기본 크기보다 작으면 작업 영역에 맞춰 줄인다.

  | 앱 | 기본 크기 | 최소 크기 | 이유 |
  |---|---|---|---|
  | File Explorer | 1024×640 | 500×340 | Windows 11 탐색기를 처음 열 때와 비슷한 비율. 최소 크기는 탐색 창과 항목 한 줄이 함께 보이는 크기 |
  | Chrome | 1280×800 | 500×400 | 글 본문(최대 720px)과 오른쪽 목차가 함께 들어가는 크기. 최소 크기는 Chrome의 최소 창 폭에 맞춤 |

  계단식으로 열 때 새 창은 앞 창보다 오른쪽 아래로 32px씩 비켜 놓는다. 여기서 앞 창은 앱과 관계없이 지금 맨 앞에 있는 창이다. 비켜 놓은 창이 작업 영역을 벗어나면 기본 위치(가운데)로 돌아간다.
  모션 값은 [[디자인 기반:모션]]을 따른다.
브라우저 주소: |
  브라우저 주소창은 글만 따라간다.

  - 맨 앞 창이 글을 보는 Chrome 탭이면 그 글의 공유 링크 주소다([[제품 정의:블로그 기능]]).
  - 없는 글 주소로 들어와 찾을 수 없음 화면을 보고 있으면 들어온 경로(예: `/posts/none`)를 그대로 둔다.
  - 그 밖의 경우(새 탭 페이지, 검색 결과 페이지, 탐색기, 열린 창 없음)는 `/`다.
  - 폴더는 방문자가 만들고 이름을 바꿀 수 있어 다른 사람에게 공유하면 열리지 않을 수 있다. 그래서 탐색기는 주소에 반영하지 않는다.
  - 주소만 바꾸고 브라우저 기록에는 쌓지 않는다. 브라우저의 뒤로 가기는 이 블로그에 들어오기 전 사이트로 나간다. 블로그 안의 앞뒤 이동은 Chrome·탐색기 창의 뒤로·앞으로 버튼이 맡는다. 창이 여러 개라 브라우저 뒤로 가기가 어떤 창을 바꿀지 애매해지기 때문이다.
새로고침과 첫 진입: |
  새로고침하거나 주소로 처음 들어오면, 주소에 해당하는 창 하나만 열린 상태로 시작한다.

  - 글 주소(`/posts/<slug>`)면 그 글이 열린 Chrome 창 하나가 뜨고, 다른 창은 모두 닫힌 상태다.
  - 주소에 해당하는 글이 없으면 404로 응답하고 `페이지를 찾을 수 없음` 화면이 열린 Chrome 창 하나만 뜬다. 브라우저 주소는 들어온 경로 그대로다([[창 동작:브라우저 주소]]).
  - `/`이면 바탕화면만 보인다.
  - 공유 링크로 처음 들어온 경우와 같은 동작이다.

  열린 창은 브라우저에 저장하지 않는다. 바탕화면 배치, 고정 목록 같은 상태는 새로고침 뒤에도 그대로다([[방문자 저장:저장하는 것]]).
모바일: |
  | 항목 | 모바일 |
  |---|---|
  | 창 | 항상 전체화면. 이동·크기 조절·스냅이 없다. 여러 개를 열 수 있지만 한 번에 하나만 보인다. 열고 닫을 때는 데스크톱과 같은 확대·축소 애니메이션으로 전체화면을 채우고 사라진다 |
  | 첫 진입 | 공유 링크로 처음 들어오면 그 글이 열린 전체화면 Chrome 창 하나만 뜬다([[창 동작:새로고침과 첫 진입]]) |
  | 탭 | 탐색기와 Chrome 모두 탭 하나. 탭 표시줄을 숨긴다. 다른 곳(바탕화면·탐색기·Start·검색)에서 연 글은 가장 최근 Chrome 창의 그 탭에서 기록에 쌓아 열어, 뒤로 가면 앞 페이지로 돌아간다. `새 창에서 열기`는 새 Chrome 창이다 |
  | 창 제목 표시줄 | 탭 표시줄 대신 32px 제목 표시줄(앱 아이콘, 제목, 최소화·닫기)만 둔다. 항상 전체화면이라 최대화·복원 버튼은 숨긴다 |
검토한 대안: |
  - 브라우저 화면 크기가 바뀌면 창 전체를 화면 안으로 옮기고, 화면보다 크면 줄이기: 방문자가 화면 가장자리에 걸쳐 둔 배치가 사라지고, 제목 표시줄 일부만 남기는 끌기 규칙([[창 동작:창 조작]]의 화면 밖)과 달라 고르지 않았다.
  - 브라우저 화면 크기가 바뀌면 창 크기와 자리를 화면 비율로 따라가기: Windows는 화면 크기가 바뀌어도 창의 픽셀 크기를 유지해 고르지 않았다.
