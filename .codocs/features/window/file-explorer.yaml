_codocs:
  id: file-explorer
  name: 파일 탐색기
  parent:
    - 화면별 기능
개요: |
  폴더를 탐색하는 File Explorer 창의 구성, 보기와 정렬, 조작, 탭, 탐색 창, 폴더 안 검색, 휴지통 보기를 정한다.
  창 자체의 열기·이동·크기·스냅은 [[창 동작]]을 따른다. 모바일에서의 동작은 [[파일 탐색기:모바일]]에서 정한다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 제목 표시줄 | 탭 + 새 탭 버튼 |
  | 주소 표시줄 | 뒤로 · 앞으로 · 위로 · 새로 고침, 경로(Breadcrumb, 직접 입력은 [[파일 탐색기:주소창 편집]]), 폴더 안 검색 상자 |
  | 명령 모음 | 새로 만들기(폴더) · 잘라내기 · 붙여넣기 · 이름 바꾸기 · 삭제 · 정렬 · 보기 |
  | 왼쪽 탐색 창 | 즐겨찾기, 바탕화면 아래의 폴더 트리, 휴지통([[파일 탐색기:탐색 창]]) |
  | 본문 | 현재 폴더의 항목 |
  | 상태 표시줄 | 항목 개수(`N개 항목`), 선택 개수(`N개 항목 선택함`), 자세히·큰 아이콘 보기 버튼 |

  - 복사는 두지 않는다. 항목마다 위치가 하나뿐이라([[항목과 폴더:위치와 옮기기]]) 복사하면 같은 항목이 두 개가 되기 때문이다. 잘라내기 → 붙여넣기로 옮기기만 한다.
  - 공유 명령, 세부 정보 창, 홈·갤러리·내 PC는 두지 않는다.
  - 경로 꺾쇠 목록: 경로의 꺾쇠(`>`)는 버튼이다. 누르면 `⌄`로 바뀌고, 왼쪽 마디 폴더의 하위 폴더를 그 위치에 기억한 정렬([[파일 탐색기:보기와 정렬]])로 목록에 보인다. 목록 줄마다 위치 아이콘(탭·탐색 창과 같은 아이콘)이 붙는다. 고르면 같은 탭에서 그 폴더로 가고 뒤로·앞으로 기록에 남는다([[파일 탐색기:탭]]).
    - 마지막 마디 뒤 꺾쇠는 그 위치에 하위 폴더가 있을 때만 있다. 휴지통 안의 폴더는 열 수 없어 휴지통 뒤에는 꺾쇠가 없다.
    - 맨 앞 위치 아이콘 뒤 꺾쇠는 탐색 창의 최상위 칸(바탕 화면, 휴지통)을 보인다.
    - 모바일은 경로를 한 칸으로만 보이므로 꺾쇠 목록이 없다([[파일 탐색기:모바일]]).
  - 상태 표시줄의 보기 버튼은 지금 보기인 버튼을 켜짐으로 그린다. 보통 아이콘 보기면 둘 다 꺼짐이다. 휴지통과 검색 결과는 자세히 보기라 자세히 버튼이 켜짐이다.
  - 쓸 수 없는 명령은 비활성으로 둔다. 잘라내기는 고른 항목이 없을 때, 붙여넣기는 붙여넣을 수 없을 때, 이름 바꾸기는 폴더 하나를 고르지 않았을 때, 삭제는 휴지통으로 보낼 수 없을 때, 복원은 고른 항목 가운데 휴지통에 바로 보낸 항목이 없을 때, 휴지통 비우기의 조건은 [[휴지통:비우기]]를 따른다.
보기와 정렬: |
  - 보기: 큰 아이콘 · 보통 아이콘 · 자세히. 자세히 보기는 이름 · 수정한 날짜 · 유형 열이 있는 표다. 유형 글자는 폴더 "파일 폴더", 글 "블로그 글", 외부 링크 "인터넷 바로 가기"다.
  - 자세히 보기의 행은 높이 28px이고, 열 너비는 열 제목 너비 토큰을 따른다. 칸 글자는 열 제목 글자와 같은 x에서 시작한다. 행 너비는 열 너비의 합이라 선택 바탕은 마지막 열 끝까지만 칠하고, 그 오른쪽 빈 곳을 누르면 빈 곳 누르기로 처리해 선택이 풀린다.
  - 보기 단축키: 큰 아이콘 `Ctrl + Shift + 2`, 보통 아이콘 `Ctrl + Shift + 3`, 자세히 `Ctrl + Shift + 6`. 그 창에 포커스가 있을 때만 동작한다. 보기 메뉴는 항목마다 이 단축키 글자를 보이고, 모바일 메뉴는 단축키 글자를 보이지 않는다.
  - 정렬: 이름 · 수정한 날짜 · 유형, 오름차순·내림차순. 자세히 보기에서는 열 제목을 눌러도 정렬된다. 같은 열을 다시 누르면 방향을 뒤집고, 다른 열은 오름차순으로 시작한다.
  - 정렬 차례는 [[항목 정렬:방향 정렬]]을 따른다.
  - 기본 보기는 `보통 아이콘`, 기본 정렬은 `이름, 오름차순`이다.
  - 보기와 정렬은 위치(폴더, 바탕 화면, 휴지통)마다 따로 기억하며, 브라우저에 저장되고 [[다시 시작:되돌리는 상태]]하면 초기화된다.
  - 상태 표시줄 오른쪽의 두 버튼은 자세히 보기와 큰 아이콘 보기다.
  - 휴지통은 늘 자세히 보기이고(보기 명령 비활성, 보기 단축키도 동작하지 않는다), 수정한 날짜 대신 삭제한 날짜, 유형 대신 원래 위치로 정렬한다([[파일 탐색기:휴지통 보기]]).

  Windows 11의 아주 큰 아이콘, 작은 아이콘, 목록, 타일, 내용 보기는 블로그 항목에 필요하지 않아 두지 않는다.
조작: |
  | 조작 | 동작 |
  |---|---|
  | 선택 | 바탕화면과 같다([[항목 조작:선택]]). 표시 순서는 지금 보기의 정렬 차례이고, 방향키의 옆 항목은 그려진 자리로 찾는다(아이콘 보기는 격자, 자세히 보기는 위아래). 끄는 사각형은 항목 자리의 빈 곳에서 시작한다. 상태 표시줄에 "N개 항목 선택함"을 보인다. 목록의 현재 항목(마지막으로 누르거나 키보드로 옮겨 간 항목, 고른 적이 없으면 첫 항목)에는 1px 진한 선을 늘 그린다. 마우스로 눌러도 보이고 포커스가 목록을 떠나도 남는다(아이콘 보기와 자세히 보기 모두). 항목 목록에 포커스가 없으면(같은 창의 주소창·검색창으로 포커스가 가거나, 다른 창이 앞에 오거나, 우클릭 메뉴가 열렸을 때) 선택 바탕과 현재 항목 선이 회색이 된다. 바탕화면 아이콘은 이 선을 그리지 않는다 |
  | 폴더 더블클릭 | 같은 탭에서 그 폴더로 이동. 여러 개를 고른 채 열면 바탕화면처럼 모두 열고, 폴더는 새 탐색기 창으로 연다 |
  | 글 더블클릭 | [[창 동작:열기 규칙]]대로 Chrome에서 연다 |
  | 새로 만들기 | 명령 모음의 새로 만들기는 바로 새 폴더를 만들고 이름 바꾸기를 시작한다. 이름 말풍선은 그 항목 아래 8px에 띄우고, Enter·Esc로 끝내면 그 항목에 포커스를 돌려준다 |
  | 단축키 | 바탕화면과 같다([[항목 조작:단축키]]) |
  | 드래그 | 같은 창의 폴더, 왼쪽 탐색 창의 폴더, 다른 탐색기 창, 바탕화면으로 옮기기. 끌기 시작 거리·툴팁·옮길 수 없는 곳의 표시는 바탕화면과 같다([[항목 조작:끌기]]) |
  | Backspace, Alt + ← / → | 뒤로 / 앞으로. 입력칸에서 누른 Backspace는 뒤로 가지 않고, Alt + ← / →는 입력칸에서도 뒤로·앞으로다 |
  | 새로 고침 | 바탕화면 새로 고침과 같다([[바탕화면 우클릭 메뉴:빈 곳]]) |

  끄는 복제본은 자세히 보기여도 보통 아이콘 모양이고, 목록 밖에 그려지므로 포커스와 상관없이 파란 선택 모습이다. 바탕화면에 놓으면 아이콘 칸은 정하지 않는다(자동 정렬이 꺼져 있으면 첫 빈 칸에 보인다). 휴지통 안의 항목은 끌 수 없고, 검색 중인 자기 창 본문은 놓을 곳이 아니다. 옮길 수 없는 곳은 [[항목과 폴더:위치와 옮기기]]에 따라 막는다.
우클릭 메뉴: |
  | 위치 | 메뉴 |
  |---|---|
  | 폴더 | 열기 · 새 탭에서 열기 · 새 창에서 열기 · 즐겨찾기 고정 항목 · 시작 화면 고정 항목 · 잘라내기 · 이름 바꾸기 · 삭제 |
  | 글·외부 링크·여러 개 선택 | [[바탕화면 우클릭 메뉴:아이콘]]와 같다 |
  | 휴지통 안의 항목 | 복원 |
  | 빈 곳 | 보기 · 정렬 기준 · 붙여넣기 · 새로 만들기(폴더) |
  | 휴지통의 빈 곳 | 정렬 기준 · 새로 고침 · 휴지통 비우기 |

  - 즐겨찾기 고정 항목은 폴더를 탐색 창 즐겨찾기 맨 뒤에 고정한다. 글과 외부 링크에는 두지 않는다([[고정:즐겨찾기 고정]]).
  - 시작 화면 고정 항목은 [[고정:시작 화면 고정]]을 따른다.
  - 새 창에서 열기는 [[창 동작:열기 규칙]]을 따른다. 새 탭에서 열기는 그 폴더를 새 탭으로 열고 그 탭을 고른다. 모바일에는 새 탭에서 열기가 없다([[창 동작:모바일]]).
  - 잘라내기 · 이름 바꾸기 · 삭제의 단추 줄 배치, 툴팁, 열기의 `Enter`는 [[바탕화면 우클릭 메뉴:아이콘]]과 같다. 휴지통 안의 항목 메뉴는 복원뿐이라 단추 줄이 없다.
  - 빈 곳 메뉴의 붙여넣기는 붙여넣을 것이 있을 때만 단추 줄에 보이고, 없으면 단추 줄이 없다([[바탕화면 우클릭 메뉴:빈 곳]]과 같다).
  - 실행 취소는 바탕화면처럼 두지 않는다([[바탕화면 우클릭 메뉴:빈 곳]]).
탭: |
  - 새 탭(+ 버튼)은 "바탕 화면" 위치로 연다([[창 동작:열기 규칙]]).
  - 탭 제목은 현재 위치 이름이다. 바탕화면이면 "바탕 화면", 휴지통이면 "휴지통"이다. 창 제목, 위치 칸, 검색 상자의 안내 글자도 같은 이름을 쓴다.
  - 탭을 눌러 전환하고(왼쪽 버튼을 누를 때 고른다. 실제 Chrome과 같다), × 또는 가운데 클릭으로 닫고, 드래그로 순서를 바꾼다. 마지막 탭을 닫으면 창이 닫힌다. 뒤에 있는 창의 탭을 눌러도 그 창이 맨 앞으로 온다.
  - 고른 탭을 닫으면 오른쪽 탭(없으면 왼쪽 탭)을 고른다.
  - 탭은 최소 너비 120px까지 고르게 줄고, 넘치면 탭 줄을 가로로 스크롤한다. 고른 탭이 가려지면 보이게 스크롤한다. `+` 버튼은 늘 보인다.
  - 탭 순서 바꾸기: 탭을 누른 뒤 4px 넘게 움직이면 끌기를 시작하고, 끄는 동안의 모양과 움직임은 [[항목 조작:순서 바꾸기 끌기]]를 따른다(가로로만 움직인다). 같은 창 안에서만 옮기고, 고른 탭은 그대로다. Chrome 탭도 같다([[Chrome:구성]]).
  - 키보드: 고른 탭만 Tab으로 닿는다. 탭에서 ←/→는 앞뒤 탭(끝에서는 반대쪽 끝), Home/End는 처음·끝 탭을 고르고 그 탭에 포커스를 옮긴다. Delete는 그 탭을 닫는다.
  - 뒤로·앞으로 기록은 탭마다 따로 있다. 지금 위치와 같은 곳으로 가면 기록을 늘리지 않고, 뒤로 간 뒤 다른 곳으로 가면 앞으로 기록을 지운다. 폴더 더블클릭·위치 칸·경로 꺾쇠 목록·탐색 창·위로가 모두 같은 탭의 기록에 남는다. 위로는 상위 폴더로 가며 바탕화면에서는 비활성이다.
  - 기록 칸마다 그 칸을 떠날 때의 항목 선택(고른 항목과 현재 항목)을 기억한다.
    - 뒤로·앞으로로 간 칸은 그 칸을 떠날 때의 선택을 되살린다.
    - 위로 간 칸은 방금 있던 폴더를 고르고 현재 항목으로 둔 채 보인다.
    - 새로 간 칸(폴더 더블클릭·위치 칸·주소창·탐색 창)은 선택 없이 보인다.
    - 탭을 바꾸고 돌아와도 그 탭의 지금 칸을 떠날 때의 선택을 되살린다.
  - 같은 탭에서 위치를 옮기면 항목 목록의 스크롤이 맨 위로 돌아간다. 탭을 바꿔도 처음부터 보인다.
  - 지금 보는 폴더(또는 그 상위 폴더)가 휴지통에 들어가면, 이 탭은 휴지통에 보낸 폴더의 원래 상위 위치(없으면 바탕화면)로 옮긴다. 지금 기록 칸을 바꾸고, 바로 앞·뒤 기록과 같아지면 합친다. 기록 속 다른 칸은 뒤로·앞으로로 갈 때 같은 규칙으로 바로잡는다.
  - 탭을 창 밖으로 끌어내 새 창으로 만드는 기능은 두지 않는다. 창 사이 항목 드래그와 겹쳐 조작이 헷갈릴 수 있다.
주소창 편집: |
  경로(Breadcrumb)에서 마디가 아닌 빈 곳을 누르면 경로가 텍스트 입력칸으로 바뀌고 경로 전체가 선택된다. 마디를 누르면 기존처럼 그 폴더로 이동한다.

  - 경로는 `바탕 화면\Blog\JavaScript`처럼 `\`로 잇는다. 휴지통의 원래 위치 표기와 같다([[파일 탐색기:휴지통 보기]]).
  - Enter를 누르면 이름을 따라 폴더를 찾아 이동한다. 대소문자는 구분하지 않고 `휴지통`도 받는다. 이동은 같은 탭의 뒤로·앞으로 기록에 남는다([[파일 탐색기:탭]]).
  - 첫 이름 `바탕 화면`은 적지 않아도 바탕 화면부터 찾는다. 같은 이름의 폴더가 여럿이면 앞의 것으로 간다. 빈 입력으로 Enter를 누르면 입력을 버린다.
  - 경로 끝이 글이나 외부 링크면 그 항목을 연다. 더블클릭과 같다([[파일 탐색기:조작]]).
  - 경로 끝이 휴지통에 있는 항목(글, 폴더, 외부 링크)이면 바로 열지 않고 [[Chrome:휴지통에 있는 글]]의 메시지 상자(`복원`·`취소`)를 띄운다. 폴더·외부 링크는 같은 상자의 문구만 그 종류로 바꾼다(예: "이 폴더는 휴지통에 있어요. 복원하고 열까요?"). 복원하면 복원 규칙([[휴지통:복원]])대로 돌려놓고 연다. 취소하면 주소창 편집 상태로 돌아간다.
  - 찾지 못하면 메시지 상자로 "'<입력>'을(를) 찾을 수 없습니다. 철자를 확인하고 다시 시도하세요."를 띄우고 입력칸은 그대로 둔다. 메시지 상자의 제목은 "파일 탐색기"이고 버튼은 `확인`이다.
  - 편집 중에는 위치 아이콘을 보이지 않는다. 입력이 있을 때만 오른쪽에 지우기 버튼(`×`)이 있고, 누르면 입력을 비우고 커서는 입력칸에 남는다. 비면 `×`가 사라진다.
  - Esc를 누르거나 포커스를 잃으면 입력을 버리고 마디 모양으로 돌아간다.
  - 입력하는 중의 추천 목록은 두지 않는다([[파일 탐색기:검토한 대안]]).
  - 모바일도 같다. 현재 위치 한 칸을 누르면 입력칸으로 바뀐다([[파일 탐색기:모바일]]).
폴더 안 검색: |
  현재 폴더와 그 하위 폴더 전체에서 이름으로 검색한다. 일치 규칙(포함, 초성)은 [[검색:일치 규칙]]과 같다.
  결과는 자세히 보기로 보여주고, 각 항목이 어느 폴더에 있는지 위치 열을 더한다. 다른 위치로 가면(결과의 폴더를 열 때 포함) 검색을 끝내고 검색어를 비운다.

  모바일은 주소 줄의 검색 버튼으로 검색을 연다([[파일 탐색기:모바일]]).
  - 누르면 줄 전체가 검색 줄(← 버튼 + 나머지 폭을 채우는 검색 상자)로 바뀌고 검색 상자에 포커스를 준다. 안내 글자는 데스크톱과 같다.
  - 입력이 비어 있으면 원래 폴더 내용을, 입력하면 데스크톱과 같은 결과를 보여 준다.
  - ← 버튼이나 외부 키보드의 Esc는 검색어를 지우고 원래 주소 줄(뒤로 · 경로 · 검색 버튼)로 돌아가며, 포커스는 항목 자리에 둔다. Esc는 검색 줄의 검색 상자에서 누를 때만 닫는다. 다른 위치로 가거나 새 폴더를 만들어도 검색을 끝내고 원래 주소 줄로 돌아간다.
  - 검색 줄이 닫혀 있으면 데스크톱 폭에서 입력한 검색어가 남아 있어도 원래 폴더 내용을 보인다.
휴지통 보기: |
  휴지통을 탐색기에서 열면 지운 항목을 자세히 보기로 보여주고 열은 이름 · 원래 위치 · 삭제한 날짜다. 원래 위치는 `바탕 화면\Blog`처럼 `\`로 잇고, 삭제한 날짜는 방문자 시간대의 `YYYY-MM-DD`다. 블로그 항목에는 크기가 없어 Windows의 다른 열은 두지 않는다. 명령 모음은 복원 · 휴지통 비우기로 바뀐다.
  열 수 있는지, 복원과 비우기 규칙은 [[휴지통]]을 따른다.
탐색 창: |
  왼쪽 탐색 창은 위에서부터 즐겨찾기, 구분선, 바탕화면 아래의 폴더 트리와 휴지통이다.

  - 즐겨찾기는 [[고정:즐겨찾기 고정]]의 폴더를 고정한 차례로 보인다. 칸마다 오른쪽에 압정 아이콘이 늘 보인다. 즐겨찾기가 비면 칸과 구분선을 숨긴다.
  - 즐겨찾기 칸을 누르면 그 폴더로 가고, 그 폴더를 보는 동안 그 즐겨찾기 칸이 선택된 칸이다(트리의 같은 폴더 칸은 고르지 않는다). 다른 방법으로 간 폴더는 트리 칸이 선택된 칸이다.
  - 즐겨찾기로 끌기: 끄는 모양은 [[항목 조작:끌기]]와 같다. 즐겨찾기 칸의 위·아래 끝(칸 높이의 1/4)이나 구분선 위가 칸 사이 놓을 자리다.
    - 놓을 자리에는 가로선과 `즐겨찾기에 고정` 툴팁을 보이고, 놓으면 이미 있는 폴더는 그 자리로 순서를 바꾸고 다른 폴더는 그 자리에 고정한다. 폴더를 옮기지는 않는다. 여러 폴더를 끌면 함께 고정한다.
    - 글·외부 링크(섞여 있어도)는 놓을 자리에서 가로선 없이 `not-allowed` 커서와 `즐겨찾기에 고정` 툴팁을 보이고, 놓아도 아무 일도 없다.
    - 즐겨찾기 칸 가운데에 놓으면 다른 폴더 칸처럼 그 폴더로 옮긴다(`○○(으)로 이동`).
    - 탐색기 내용 영역, 바탕화면, 다른 탐색기 창에서 끌어 올 수 있다.

  - 기본으로 바탕화면과 현재 위치, 그 조상(현재 폴더 포함)을 펼친다. 휴지통을 볼 때도 바탕화면은 펼친다.
  - 방문자가 펼치거나 접은 칸은 창 안에서 기억한다. 그 칸 안으로 가거나 탭을 고르면 그 경로의 기억을 지워 다시 펼친다.
  - 하위 폴더는 그 상위 위치(바탕화면 포함)에 기억한 정렬([[파일 탐색기:보기와 정렬]])로 늘어놓는다. 3단계보다 깊은 폴더는 3단계 모양으로 그린다.
  - 칸은 클릭·Enter·Space로 가고, 꺾쇠·→·←로 펼치고 접는다. ↑↓는 보이는 앞뒤 칸, Home/End는 처음·끝 칸, 펼친 칸의 →는 첫 자식, 펼치지 않은 칸의 ←는 부모로 포커스만 옮긴다. Tab으로는 칸 하나만 닿는다. 고른 칸(현재 위치)이 보이면 그 칸, 조상을 접어 보이지 않으면 가장 가까운 보이는 조상, 그것도 없으면 첫 칸이다. 키보드로 포커스를 옮기면 그 칸이 현재 칸이 되고, 위치가 바뀌면 다시 고른 칸이다.
  - 즐겨찾기 칸도 같은 트리의 칸이라 ↑↓·Home/End가 즐겨찾기 칸과 트리 칸을 이어서 오간다.
  - 선택 칸과 현재 칸의 모양은 트리에 포커스가 있으면 파랑 바탕과 진한 1px 선, 없으면 회색 바탕과 회색 선이다.
모바일: |
  왼쪽 탐색 창이 없어 상위 폴더로는 경로나 뒤로 버튼으로 간다. 검색은 [[파일 탐색기:폴더 안 검색]]을 따른다. 배치는 `ExplorerAddressRow`·`Explorer/Commands`·`Explorer/Content`의 `Device=Mobile`에 있다.
검토한 대안: |
  - 주소창 입력 중 추천 목록: 폴더 수가 적어 입력하며 고를 만큼 후보가 많지 않아 두지 않는다.
