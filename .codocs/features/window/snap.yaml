_codocs:
  id: snap
  name: 스냅
  parent:
    - 화면별 기능
개요: |
  창을 화면 절반이나 4분의 1 칸에 맞추는 끌어서 스냅, 스냅 레이아웃, Snap Assist를 정한다.
끌어서 스냅: |
  - 끌어서 스냅: 끄는 동안 포인터가 작업 영역 왼쪽·오른쪽·위쪽 끝에서 8px 안에 들어오면 스냅한다. 왼쪽·오른쪽 끝에서는 화면 절반이고, 위·아래 모서리에서 64px 안이면 그 4분의 1이다. 위쪽 끝에서는 왼쪽·오른쪽 모서리에서 64px 안이면 위쪽 4분의 1, 나머지는 최대화다. 포인터가 작업 영역 밖(작업 표시줄 위, 브라우저 밖)이어도 가장 가까운 끝으로 본다.
  - 끄는 동안 채울 영역을 미리 보여준다(SnapPreview). 미리 보기 판은 칸 자리를 그대로 채우고, 끄는 창 바로 아래에 움직임 없이 나타나고 사라진다.
  - 끌어서 칸에 스냅해도 스냅 레이아웃처럼 남은 칸이 있으면 Snap Assist를 연다. 최대화는 열지 않는다.
  - 끌어서 스냅·최대화해도 원래 크기(이전 크기로 복원할 때의 자리)는 끌기 전 자리다.
스냅 레이아웃: |
  - 스냅 레이아웃: 최대화 버튼에 마우스를 올리면 여러 칸 배치 선택지가 나타나고, 칸을 고르면 창이 그 자리를 채운다.

  스냅 레이아웃의 칸 종류는 Windows 11이 일반 가로 화면에서 보여주는 4종으로 한다: 반반, 2:1, 반 + 4분의 1 두 칸, 4분할. 끌어서 스냅의 절반·4분의 1 영역과 같은 칸으로 구성돼 두 방식의 결과가 어긋나지 않는다. 넓은 화면에서 Windows가 더 보여주는 3열 배치는 창이 둘뿐인 블로그에서 쓸 일이 적어 두지 않는다.

  스냅 레이아웃 팝업의 접근성 이름은 "스냅 레이아웃"이다. 칸마다 접근성 이름이 있고, 같은 이름의 칸이 여러 레이아웃에 있어 칸 묶음(group)도 레이아웃 이름을 가진다.

  | 레이아웃(묶음 이름) | 칸 이름(칸 순서) |
  |---|---|
  | 반반 | 왼쪽 절반, 오른쪽 절반 |
  | 3분의 2와 3분의 1 | 왼쪽 3분의 2, 오른쪽 3분의 1 |
  | 절반과 4분의 1 두 칸 | 왼쪽 절반, 오른쪽 위 4분의 1, 오른쪽 아래 4분의 1 |
  | 4분할 | 왼쪽 위 4분의 1, 왼쪽 아래 4분의 1, 오른쪽 위 4분의 1, 오른쪽 아래 4분의 1 |
Snap Assist: |
  Snap Assist(남은 칸을 다른 창으로 채우는 제안)를 둔다. 접근성 이름은 "Snap Assist"다. 창 하나를 스냅하면 남은 칸에 열려 있는 다른 창의 축소 화면(WindowPreview)을 보여주고, 고르면 그 창이 남은 칸을 채운다. Esc나 빈 곳을 누르면 제안을 닫는다. 열린 창이 하나뿐이면 보여주지 않는다.
  제안은 최근에 맨 앞에 있던 창부터 놓는다. 최소화된 창도 제안에 넣고, 고르면 복원해 그 칸에 놓는다. 카드의 닫기 버튼은 그 창을 닫는다.
  남은 칸이 둘 이상이면(반 + 4분의 1 두 칸, 4분할) 남은 칸을 칸 순서(왼쪽 열 위에서 아래, 오른쪽 열 위에서 아래)대로 하나씩 제안한다.
스냅된 창: |
  - 스냅·최대화한 창을 끌어서 떼면 끌기를 시작하는 순간 원래 크기로 돌아간다. 누른 자리의 가로 비율과 위쪽에서의 거리를 지켜 포인터 아래에 놓고, 그 자리가 새 원래 자리가 된다. 떼는 순간은 움직임 없이 바로 바뀐다.
  스냅된 창을 최대화했다가 이전 크기로 복원하면 최대화하기 바로 앞 모습(그 스냅 칸)으로 돌아간다.
  스냅된 창은 최대화된 창처럼 모서리를 둥글게 하지 않고 그림자를 두지 않으며, 창 버튼은 최대화 모양을 유지한다.
모바일: |
  스냅이 없다([[창 동작:모바일]]).
