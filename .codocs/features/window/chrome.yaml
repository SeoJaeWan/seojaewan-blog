  id: chrome
  name: Chrome
  parent:
    - 화면별 기능
개요: |
  글을 읽는 Chrome 창의 구성, 새 탭 페이지, 주소창, 페이지에서 찾기, 확대/축소, 글 주소, 글 화면, 휴지통에 있는 글을 주소로 열 때를 정한다.
  창 자체의 열기·이동·크기·스냅은 [[창 동작]]을 따른다. 글 본문의 블록은 [[Notion 블록]]에서, 모바일에서의 동작은 [[Chrome:모바일]]에서 정한다.
구성: |
  | 영역 | 내용 |
  |---|---|
  | 탭 표시줄 | 탭 + 새 탭 버튼 |
  | 도구 모음 | 뒤로 · 앞으로 · 새로고침, 주소창, ⋮ 메뉴 |
  | 본문 | 새 탭 페이지, 글, 검색 결과, 찾을 수 없음 화면 |

  - ⋮ 메뉴: 링크 복사 · 페이지에서 찾기 · 확대/축소. 링크 복사는 글을 보고 있을 때만 된다. 확대/축소는 누르는 항목이 아니라 배율을 바꾸는 한 줄 조절기다([[Chrome:확대/축소]]).
  - 북마크 별, 확장 프로그램, 프로필, 북마크 바는 두지 않는다.
  - 탭 제목은 새 탭 "새 탭", 글은 글 제목, 검색 결과 "<검색어> - 검색", 찾을 수 없음 화면 "페이지를 찾을 수 없음"이다. 창 제목은 고른 탭 제목 뒤에 " - Chrome"을 붙인다.
  - 탭 아이콘은 페이지와 상관없이 글 아이콘이다.
  - 탭 전환·닫기(고른 탭을 닫은 뒤 고르는 탭 포함)·순서 변경·넘침·키보드는 [[파일 탐색기:탭]]과 같고, 마지막 탭을 닫으면 창이 닫힌다.
  - 뒤로·앞으로 기록은 탭마다 따로 있다. 탭 안에서 링크를 따라가거나 주소창으로 이동한 기록이 쌓인다.
  - 새로고침은 지금 페이지를 다시 그리고 스크롤을 처음으로 돌린다.
새 탭 페이지: |
  새 탭 버튼을 누르거나 작업 표시줄에서 Chrome을 처음 열 때 보여준다.
  Google 새 탭처럼 가운데 검색창 하나와, 자주 가는 사이트 바로가기 자리에 Blog의 최신 글 6개(Project·About 항목과 휴지통에 있는 글 제외)를 보여준다. 검색창은 주소창과 같이 동작한다.
  Google 로고는 상표라 쓰지 않고, 로고 자리에 "seojaewan.com" 글자를 둔다.
글 주소: |
  항목의 주소는 어느 묶음(Notion 데이터베이스, [[콘텐츠 원천:데이터베이스]])에 속하는지에 따라 나뉜다.

  | 묶음 | 주소 | 예 |
  |---|---|---|
  | Blog | `/posts/<slug>` | `/posts/react-19-hooks` |
  | Project | `/projects/<slug>` | `/projects/this-blog` |
  | About | `/about/<slug>` | `/about/resume` |

  - slug는 Notion 데이터베이스의 `slug` 속성에 영어로 쓴다. 같은 묶음 안에서만 유일하면 되고, 묶음이 다르면 같은 slug를 써도 된다.
  - 공유 링크, SEO, 브라우저 주소([[창 동작:브라우저 주소]]), Chrome 주소창이 모두 이 주소를 쓴다. Project·About 항목도 글처럼 Chrome 창에서 열고, 주소로 들어왔을 때의 동작은 세 묶음이 같다([[창 동작:새로고침과 첫 진입]]).
  - 묶음 경로만(`/posts`, `/projects`, `/about`)은 해당하는 항목이 없으므로 404다.
  - 공개하지 않은 항목([[콘텐츠 원천:공개 여부]])의 주소도 404다.
  - 개인 블로그는 slug를 자주 바꾸지 않고, 짧은 주소가 공유와 검색 노출에 유리해 ID를 넣지 않는다. slug를 바꿔야 하면 예전 slug를 새 주소로 영구 이동(308)하는 방법을 그때 추가한다.
주소창: |
  | 상황 | 동작 |
  |---|---|
  | 평소 | `seojaewan.com/posts/react-19-hooks`처럼 글 주소를 보여준다. 새 탭 페이지에서는 비어 있다 |
  | 클릭 | 주소 전체가 선택된다 |
  | 입력 중 | 아래에 추천 목록을 띄운다(아래 추천 목록) |
  | 추천을 고르고 Enter | 현재 탭에서 그 글로 이동 |
  | 블로그 글 주소를 입력하고 Enter | 그 글로 이동 |
  | 외부 주소를 입력하고 Enter | 실제 브라우저의 새 탭에서 연다 |
  | 그 밖의 글자를 입력하고 Enter | 탭 안에 검색 결과 페이지를 보여준다. [[검색:일치 규칙]]으로 찾은 글 목록이다(휴지통에 있는 글 제외) |
  | 없는 글 주소 | 탭 안에 Chrome 스타일의 "페이지를 찾을 수 없음" 화면 |
  | 휴지통에 있는 글 주소 | 복원할지 묻는다([[Chrome:휴지통에 있는 글]]) |

  외부 주소는 `http://`·`https://`로 시작하거나, 끝이 com, net, org, io, dev, app, kr, co, me, ai, gg, xyz, info, edu, gov, blog, page, site인 도메인 꼴이거나 `localhost`인 입력이다. 그 밖의 입력은 블로그 검색이다. `Next.js`처럼 점이 든 글 제목을 외부 주소로 보내지 않으려고 흔한 최상위 도메인만 본다.

  추천 목록:
  - [[검색:일치 규칙]]으로 찾은 글 최대 5개(휴지통에 있는 글 제외)와 맨 끝의 "<입력> 검색" 줄(검색 결과 페이지로 간다)이다.
  - 처음에는 고른 줄이 없고 ↓·↑로 고른다. 줄을 눌러도 연다. 한글을 조합하는 중의 키는 받지 않는다.
  - Esc를 누르거나 주소창이 포커스를 잃으면 추천을 닫고 원래 주소로 돌린다. Esc는 돌린 주소 전체를 선택해 둔다.
글 화면: |
  | 영역 | 내용 |
  |---|---|
  | 머리 | 제목, 작성일, 폴더(카테고리) |
  | 커버 이미지 | Notion 커버가 있으면 제목 위에 |
  | 목차 | 제목(Heading)이 1개 이상이면 보인다. 지금 읽는 위치를 표시하고, 제목 단계에 따라 들여 쓴다(아래 목록). 넓은 창·좁은 창 모양은 Guide `Breakpoint` > Chrome 글 화면, `Chrome/Page` `Layout=Wide/Narrow`에 있다 |
  | 코드 블록 | 언어별 문법 강조, 복사 버튼 |
  | 링크 | 블로그 안 주소(주소창과 같은 규칙으로 판단)는 같은 탭에서 이동, 그 밖은 실제 브라우저의 새 탭 |
  | 이미지 | [[Notion 이미지 제공]]의 주소로 보여주고, 클릭하면 크게 보기(아래) |
  | 꼬리 | 이전 글 / 다음 글(작성일 기준). 같은 묶음 안에서만 찾고(Blog 글의 이전·다음은 Blog 글), 묶음에 항목이 하나뿐이면 꼬리를 보이지 않는다. 휴지통에 있는 글은 건너뛴다 |

  넓은 창과 좁은 창은 화면 구간이 아니라 창의 페이지 영역 너비로 가른다. `breakpoint/chrome-page/width` 미만이면 좁은 창이다. 창 크기 조절, 스냅, 최대화로 너비가 경계를 넘으면 같은 프레임에 모양이 바뀐다. 새 탭 페이지, 검색 결과, 찾을 수 없음 화면, 이미지 크게 보기도 같은 모양을 따른다. 찾기 막대는 화면 구간을 따른다([[반응형:기준]]). 숨긴 창은 너비가 0이라 모양을 그대로 둔다.

  지금 읽는 위치는 스크롤 영역 위쪽에서 32px 아래 선을 지난 마지막 제목이다. 끝까지 내리면 마지막 제목이다.

  - 목차의 들여 쓰기는 글에서 가장 높은 제목 단계를 들여 쓰지 않고, 그보다 낮은 단계마다 한 단계씩 더 들인다([[Notion 블록:모양]]의 단계 규칙과 같다).
  - 넓은 창의 목차가 페이지 영역 높이를 넘으면 목차 안에서 스크롤한다. 지금 읽는 위치 항목이 보이게 목차도 함께 스크롤한다.
  - 글 맨 아래(꼬리 아래)에 여백을 둔다. 넓은 창과 좁은 창 모두 두고, 값은 피그마 `Chrome/Page`에 있다.

  이미지 크게 보기:
  - 그 탭의 페이지 영역만 어둡게 덮는다. 글 속 웹 페이지의 기능이라 탭 표시줄·도구 모음·작업 표시줄은 그대로 보인다. 모바일도 같다.
  - 이미지는 페이지 영역 안에 여백을 두고 맞추되 원본보다 키우지 않는다. `sizes`는 `100vw`다.
  - 닫기 버튼, Esc, 이미지 밖 바탕을 누르면 닫힌다. 열 때 포커스는 대화 상자 자체에 둔다. 닫기 버튼에 주면 키보드로 열지 않아도 포커스 링이 보이기 때문이다. 열려 있는 동안 키보드 포커스는 그 안에만 머물고, 닫으면 원래 이미지로 돌아간다.
  - 확대·끌어 보기와 다른 이미지로 넘어가는 ←·→는 두지 않는다. 열고 닫을 때 움직임도 없다.
  - [[Chrome:확대/축소]] 배율과 상관없이 페이지 영역 크기에 맞추고, 찾기 막대가 열려 있으면 그 위를 덮는다.

  기술 글 읽기가 [[제품 정의:목적]]의 하나이므로, Windows 재현보다 읽기 편한 타이포그래피와 폭을 우선한다.
휴지통에 있는 글: |
  휴지통에 있는 글을 주소로 열면 바로 열지 않고 메시지 상자로 묻는다. 공유 링크로 들어올 때, 주소창에 입력할 때, 글 속 링크를 누를 때처럼 주소로 여는 모든 경우가 같다.

  - 제목은 "휴지통에 있는 글", 본문은 "이 글은 휴지통에 있어요. 복원하고 열까요?", 버튼은 `복원`(강조)과 `취소`다.
  - 복원: 그 글을 [[휴지통:복원]]의 복원 규칙대로 원래 위치로 돌려놓고 그 글을 연다. 휴지통에 든 폴더 안의 글이면 폴더는 그대로 두고 그 글만 바탕화면으로 복원한다.
  - 취소: 보던 페이지를 그대로 둔다. 보던 페이지가 없으면(첫 진입) 새 탭 페이지를 보인다.
  - 뒤로·앞으로는 주소로 여는 것이 아니라 기록 이동이라 묻지 않고 그대로 연다.

  새 방문은 빈 휴지통으로 시작하므로([[방문자 저장:저장하지 않는 것]]) 공유 링크로 처음 들어올 때는 이 상자가 나오지 않고, 같은 방문 안에서 휴지통에 넣은 글을 주소로 열 때만 나온다.
페이지에서 찾기: |
  실제 Chrome의 찾기 막대와 같다.

  - 여는 법: ⋮ 메뉴의 `페이지에서 찾기`, 또는 Chrome 창에 포커스가 있을 때 Ctrl+F. 이때 실제 브라우저의 찾기는 막는다. 이미 열려 있으면 입력칸에 포커스를 주고 글자를 모두 선택한다. 이미지 크게 보기가 열려 있는 동안 Ctrl+F는 막기만 하고 막대를 열지 않는다. Chrome 창의 포커스: 페이지 영역을 누르면 그 영역이 포커스를 받아 단축키가 닿는다(Tab 키 차례에는 들어가지 않는다).
  - 모양은 `Chrome/FindBar` `Device=Desktop/Mobile`에 있다.
  - 찾는 범위: 지금 탭의 페이지 본문 글자다. 대소문자를 구분하지 않는 포함 검색이고 초성 검색은 하지 않는다. 실제 Chrome과 같다. 서식으로 나뉜 글자는 같은 블록 안에서 이어 찾고 다른 블록끼리는 잇지 않는다. 입력칸 값과 숨긴 요소는 찾지 않는다.
  - 강조: 일치하는 곳을 모두 칠하고 지금 위치를 다른 색으로 칠한다(Guide `Color` > 컴포넌트 색). 지금 위치가 보이게 스크롤한다. DOM을 바꾸지 않도록 CSS Custom Highlight API로 칠해 React가 다시 그려도 어긋나지 않는다. 입력할 때마다 다시 찾는다. 일치가 없으면 개수는 `0/0`이다.
  - 이동: 입력칸에서 Enter는 다음, Shift+Enter는 이전이다. 이전(↑)·다음(↓) 버튼도 같다. 끝에 닿으면 처음(또는 끝)으로 돌아간다.
  - 닫기: Esc나 닫기 버튼. 강조와 찾던 글자를 지운다. 탭을 바꾸거나 다른 페이지로 가도 닫는다.
확대/축소: |
  ⋮ 메뉴의 `확대/축소` 줄에서 페이지 본문의 배율을 바꾼다. 실제 Chrome의 메뉴 줄을 따르되 전체 화면 버튼은 두지 않는다.

  - −·+를 눌러도 메뉴가 닫히지 않는다. 모양은 `MenuItem` `Variant=Zoom`에 있다.
  - 단계: 50 · 67 · 75 · 80 · 90 · 100 · 110 · 125 · 150 · 175 · 200%. 끝 단계에서는 그쪽 버튼이 비활성이다.
  - 적용 범위: 페이지 본문(새 탭·글·검색 결과·찾을 수 없음)만 키우고 탭 표시줄과 도구 모음은 그대로다. Chrome이 사이트마다 배율을 하나 기억하듯 모든 Chrome 창과 탭이 같은 배율을 쓴다. 스크롤 상자 안 본문에 CSS `zoom`을 건다. 스크롤 상자에 걸면 상자 크기까지 바뀌고, `transform: scale`은 배치 크기가 그대로라 스크롤이 맞지 않기 때문이다.
  - 기억: 메모리에만 둔다. 새 방문은 100%로 시작하고, 다시 시작하면 100%로 돌아간다([[방문자 저장:저장하는 것]]에 넣지 않는다. [[다시 시작:되돌리는 상태]]).
  - 키보드: Chrome 창에 포커스가 있을 때 Ctrl + `+` · `-` · `0`(100%)을 받고 실제 브라우저의 확대는 막는다. Ctrl+휠은 받지 않는다. 트랙패드 핀치와 구분하기 어렵고 실수로 바뀌기 쉽기 때문이다.
  - 주소창의 돋보기 아이콘과 배율 말풍선은 두지 않는다. 배율은 ⋮ 메뉴에서만 보이고 바꾼다.
  - 모바일: ⋮ 메뉴에 같은 줄을 둔다. 손가락 확대(핀치)는 브라우저 기본 동작에 맡긴다.
모바일: |
  탭 표시줄은 없다([[창 동작:모바일]]). 앞으로·새로고침은 ⋮ 메뉴로 옮긴다(휴대폰 Chrome과 같다). 배치는 `Window/Chrome` `Device=Mobile`, `Menu/ChromeMoreMobile`, `Chrome/Page` `Layout=Narrow`에 있다.
검토한 대안: |
  글 화면의 넓은·좁은 모양을 페이지 영역을 재는 `ResizeObserver`와 `flushSync`로 가른다. 그냥 `setState`는 경계를 넘을 때마다 옛 모양이 한 프레임 보였고(12번 중 12번), `flushSync`는 0번이었다.

  - 컨테이너 쿼리: 칠한 뒤 어긋남은 없었지만, 넓은·좁은 모양은 목차 자리와 prop, 글자 스타일이 달라 CSS만으로 바꾸려면 두 벌을 그려야 한다.
  - 창 저장소의 자리로 계산: 끄는 중 크기를 요소에 직접 넣는 경로와 축소 화면까지 따로 다뤄야 한다.
