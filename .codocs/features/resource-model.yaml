_codocs:
  id: resource-model
  name: 항목 모델
  parent:
    - 화면별 기능
개요: |
  바탕화면, 파일 탐색기, Start, 검색 결과에 나오는 항목의 종류와, 각 항목의 원본과 열기 방식을 정한다.
  항목이 어디에 놓이는지는 이 문서가 아니라 [[작업 공간]]이 정한다.
종류: |
  | 종류 | 원본 | 열면 |
  |---|---|---|
  | 폴더 | Notion 글의 `폴더` 속성에서 만들어지거나 방문자가 만든다([[작업 공간]]) | File Explorer에서 연다 |
  | 글 | Notion 글 하나([[콘텐츠 원천]]) | Chrome 창에서 연다 |
  | 외부 링크 | 저장소의 코드 설정 파일 | 실제 브라우저의 새 탭에서 연다. 블로그 안의 창을 만들지 않는다 |

  폴더와 글이 어느 창·탭으로 열리는지의 세부 규칙은 File Explorer와 Chrome 문서에서 정한다.
외부 링크: |
  외부 링크(GitHub, 이력서, 사이드 프로젝트 등)는 저장소의 코드 설정 파일에서 이름, URL, 아이콘, 초기 위치를 정의한다.
  자주 바뀌지 않고 아이콘이 중요하며, 변경이 PR로 리뷰되기 때문이다. Notion 데이터베이스로 관리하는 방식은 아이콘 관리가 번거롭고 수집 대상이 늘어 고르지 않았다.

  주소(URL)가 없는 외부 링크는 바탕화면·탐색기·Start·검색 어디에도 보이지 않는다. 이력서처럼 실제 주소를 아직 받지 못한 링크는 주소를 비워 두어 받을 때까지 숨긴다.
식별: |
  모든 항목은 종류와 상관없이 바뀌지 않는 고유 ID를 갖는다.
  이름이나 위치가 바뀌어도 같은 항목이다. 항목의 원본에는 위치를 저장하지 않는다.
  ID 형식과 발급 방법은 구현할 때 정한다.
나중에 검토할 것: |
  - 소개 페이지 같은 별도 앱
  - 사이드 프로젝트를 Chrome 창 안에서 iframe으로 여는 항목
