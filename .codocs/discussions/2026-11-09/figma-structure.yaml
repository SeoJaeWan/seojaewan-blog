_codocs:
  id: discussion-2026-11-09-figma-structure
  name: 논의 2026-11-09 피그마 파일 구조 정리
  parent:
    - 논의 기록
질문: |
  디자이너가 피그마 파일을 보고 세 가지를 피드백했다. 컴포넌트 페이지에는 진짜 재사용 컴포넌트만 두고, 블로그 정책과 개발자만 보는 요소(코드 생성용 메타, 규칙 설명, 내보내기용 견본)는 빼고, Guide 페이지는 지우자는 것이다. 피그마가 "개발자의 피그마"가 되지 않게 하면서 플러그인 내보내기와 1:1 연결을 지킬 수 있을까.
과정: |
  1. 지금 구조를 읽었다(피그마는 읽기만). 컴포넌트 페이지의 섹션마다 `.page_header`, 속성 표(`guide` 프레임), 축 이름표가 있었고, 개발자용 정보는 description의 `@` 줄, 모션 견본 프레임 주석, 코드 전용 변수, Foundations `Layout` 섹션의 클래스 대응표, Guide 전체에 있었다. `.codocs`에는 Guide 링크가 9개 문서에 34곳 있었다.
  2. 보는 사람별로 페이지를 나누는 초안(개발자 페이지)을 플러그인 코드로 시험했다. 이름에 `Components`가 든 두 번째 페이지는 플러그인을 고치지 않고 읽히지만, 조립과 모션 견본은 그대로 옮길 수 없었다(조립은 컴포넌트로 잘못 읽히고, 견본은 목록에서 사라진다).
  3. 컴포넌트 81개를 진짜 컴포넌트·화면 영역·기술 요소로 나눠 보고, 기준을 "디자이너가 시안을 그릴 때 직접 꺼내 놓고 상태를 바꿔 쓰는가"로 정했다.
  4. 원칙을 더했다. Figure 로딩 스켈레톤의 이미지 비율을 피그마 구조로 풀려다 되돌린 일에서, 피그마는 모양만 보이고 실행 중 크기는 코드가 맡기로 했다.
  5. `@` 줄과 견본 프레임을 피그마 기본 기능으로 대신할 수 있는지 시험했다. 노드 키프레임은 컴포넌트 원본에서 읽히고 인스턴스로 전파된다. 재생 설정 Loop는 읽히고 쓰기도 된다. 트리거는 프로토타입 `reactions`에만 있다. Dev Mode 주석은 카테고리를 가질 수 있고 `use_figma`로 읽힌다. 동작 줄이기는 피그마에 개념이 없다.
  6. 조립 흐름에 키프레임을 거는 시험을 했다. 자동 배치 안 인스턴스에 키프레임을 걸어 견본과 같은 모양으로 읽혔고, 원본과 다른 인스턴스로 번지지 않았으며, 프로토타입으로 이동하면 재생되는 것을 화면으로 확인했다.
  7. CI가 바뀐 범위와 상관없이 모든 PR에서 전체가 도는 것(설정 한 줄 PR 523초, 글 동기화 533초)을 함께 논의했다.
검토한 대안: |
  - 개발자 전용 페이지를 두고 화면 영역·기술 요소·조립·모션 견본을 옮기기: 조립과 견본을 옮기려면 플러그인을 크게 고쳐야 하고, 조립은 디자이너가 큰 UI의 모습들을 보는 단계라 디자이너 쪽에 있어야 한다. 페이지를 나누지 않고 묶음을 나누는 쪽으로 했다.
  - 한 곳에서만 쓰는 화면 부품을 조립으로 바꾸기: 바탕·테두리를 가진 것은 컴포넌트라는 경계와 구조 검사(조립 배치 프레임은 칠을 못 함)에 어긋난다.
  - 뜻이 겹치는 짝(SectionTitle·SectionHeader, ExplorerTab·BrowserTab) 합치기: 단계·크기·색·선택 표현이 다른 별개 컴포넌트라 합치지 않았다.
  - `@` 줄을 플러그인 데이터(`setSharedPluginData`)로 숨기기: 디자이너가 볼 수도 고칠 수도 없다.
  - 모션 견본 프레임을 그대로 두기: 견본은 디자이너가 늘 쓰는 피그마 흐름이 아니라 이 파일만의 장치이고, 피그마 자신의 도구(`get_motion_context`)도 한 번 도는 견본을 무한 반복으로 읽는다.
  - Guide를 남기고 계속 가리키기: 2026-10-30에 "피그마로 옮기고 Guide를 가리킨다"고 정했지만, Guide는 Foundations와 같은 주제를 한 번 더 다뤄 페이지가 둘로 나뉘고, 디자이너가 값을 고를 때 보는 곳(변수·스타일 description)과 떨어져 있었다.
결정: |
  - 분류: 기준은 "디자이너가 시안을 그릴 때 직접 꺼내 놓고 상태를 바꿔 쓰는가"다. 컴포넌트 페이지의 묶음을 기본 컨트롤·화면 영역·블로그로 나눈다. 모양 없는 기술 요소만 피그마에서 빼고 코드에만 둔다. 개발자 페이지는 만들지 않는다([[디자인 시스템:피그마 파일]]).
  - 설명 노드: 속성 표, 축 이름표, `.page_header`를 지우고 섹션 이름을 제목으로 쓴다. description에는 디자이너가 읽는 한두 줄만 둔다.
  - Guide 삭제(2026-10-30 결정을 바꿈): 값 하나의 뜻은 변수·스타일 description, 여러 값에 걸친 설명은 Foundations 해당 섹션의 짧은 글, Motion 조합 표는 없앤다(움직임의 자리로 대체), Assets 설명은 Foundations Assets 글과 자산 description, 구성 원칙은 `.codocs` [[디자인 시스템:피그마 파일]]로 옮긴다. `.codocs`는 Guide 대신 이 자리들을 가리킨다. 바꾼 이유는 위 검토한 대안의 마지막 항목이다.
  - Foundations `Layout` 섹션: 클래스 대응표와 회전을 지우고 크기 변수 목록만 남겨 `Size`로 이름을 바꾼다.
  - 트리거: 피그마에서 `@trigger`를 없애고, 언제 움직이는지는 조립의 프로토타입으로 눌러 볼 수 있게 한다. 플러그인은 트리거를 읽지 않는다. 정확한 조건은 기능 문서와 코드가 맡는다([[디자인 시스템:조립]]).
  - 동작 줄이기: 멈추면 정보가 사라지는 움직임만 남긴다(지금은 ProgressRing 회전). 남기는 움직임은 Accessibility 주석, 기준은 Foundations Motion 한 줄이다. `@reduced-motion`은 없앤다([[디자인 기반:동작 줄이기]]).
  - 실행 중 값: 말줄임·목록 스크롤·메뉴 열림은 피그마 기능(글자 말줄임, 프레임 스크롤, 프로토타입 오버레이)으로, 나머지는 Development 주석으로 옮긴다. `@runtime`은 없앤다.
  - 열린 팝업: 조립은 닫은 모양 그대로 두고 프로토타입 오버레이로 메뉴 조립을 띄운다. Screens는 열린 메뉴를 자동 배치 밖에 겹쳐 그릴 수 있다([[디자인 시스템:팝업]], [[디자인 시스템:Screens]]).
  - 견본 크기: `@sample-size`를 없애고 변수 연결 여부로 구분한다([[디자인 기반:크기 변수]]).
  - 반복: `@repeat`을 없애고 재생 설정 Loop로 읽는다.
  - 움직임의 자리: 안쪽 움직임은 컴포넌트 원본, 요소 전체와 공통 움직임은 조립 프로토타입 흐름 안 인스턴스에 둔다. Foundations에는 시간·이징 변수와 동작 줄이기 기준만 남기고 견본 프레임은 없앤다([[디자인 기반:모션 견본]]).
  - CI: 바뀐 범위를 보고 필요한 검사만 돌리고, `main` 병합 후에는 전체를 돈다([[피그마 연동:CI]]).
남은 일: |
  피그마 정리, 플러그인 재구성, CI 범위 작업은 [[남은 작업]]에 있다. 확인할 것: 모양 없는 기술 요소 목록과 그것을 피그마에서 뺐을 때 내보내기·캡처 검사·문서가 깨지지 않는지, 조립 흐름으로 옮긴 움직임의 모션 클래스 이름을 어디서 얻을지, `@hold`를 어디에 둘지, turbo `--affected`가 lock 파일 변화를 패키지별로 고르는지.
