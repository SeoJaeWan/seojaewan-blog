개요: |
  사람과 나눈 논의마다 질문, 과정(시험과 그 결과 포함), 검토한 대안, 결정, 남은 일을 남기는 이력이다.
  결정의 기준은 원래 문서(기획·정책·컨벤션)가 가진다. 여기는 그 결정에 이른 경위를 보관하는 곳이라 다른 문서와 내용이 겹쳐도 된다. 결정이 나중에 바뀌면 원래 문서를 고치고, 여기에는 새 날짜의 기록을 더한다.
  폴더는 `discussions/<날짜>/`이고 문서 하나가 논의 하나다. 결정은 각 문서에 반영하고, 남은 일은 [[남은 작업]]에 있다.
