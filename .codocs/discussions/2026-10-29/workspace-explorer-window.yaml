_codocs:
  id: discussion-2026-10-29-workspace-explorer-window
  name: 논의 2026-10-29 작업 공간·탐색기·창
  parent:
    - 논의 기록
질문: |
  [[임의 작업]]의 작업 공간·탐색기·창 묶음(작업 공간 PR, 탐색기·창 PR, 포커스 표시 PR, Chrome PR의 주소·휴지통 항목, MessageBox 조립) 항목을 유지·되돌림·문서 반영 중 무엇으로 할지. 항목 번호는 검토 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.
과정: |
  과정은 지난 세션 대화에만 있어 결과만 기록한다. 근거는 그 세션이 남긴 [[남은 작업]]의 `1. 임의 작업 검토 마무리` 섹션(처음 작성본)이다.
검토한 대안: |
  기록 없음.
결정: |
  - 46번(휴지통 글 묻기, 폴더째 버린 글 복원): [[Chrome:휴지통에 있는 글]]에 휴지통에 든 폴더 안의 글을 복원하면 그 글만 바탕화면으로 간다고 적는다.
  - 47번(브라우저 주소는 첫 진입한 찾을 수 없음 화면만 들어온 경로로): [[창 동작:브라우저 주소]]의 "들어와"가 첫 진입 주소임을 분명히 한다.
  - 58번(휴지통을 저장할 때 복원한 배치로 저장): [[작업 공간:Notion과 맞추기]]에서 맞출 때 휴지통은 늘 비어 있으므로 "휴지통에 있으면" 두 경우를 지운다.
  - 61번(not-allowed 커서, 지금 위치는 막힌 곳으로 보지 않음): [[바탕화면:아이콘 조작]]에 끄는 항목이 지금 있는 위치(바탕화면 빈 곳, 그 위치를 보는 탐색기 창의 빈 곳)는 옮길 수 없는 곳으로 보지 않는다고 적는다.
  - 71번(포커스 선을 `:focus-visible` 안쪽 고리로): [[컴포넌트 목록:상태]]의 FileItem·FileRow 포커스 모양 설명을 지우고 코드 정책 문장만 남긴다.
  - 미룬 것: 76번(휴지통 비우기 비활성 조건이 탐색기·바탕화면 문서에 겹침), 33번(메시지 상자 제목·본문 글자를 문서에 둘지), 68번(사라지는 요소의 포커스를 가까운 내용으로)은 다음 논의로 넘겼다.
  - 이 묶음의 나머지 항목은 유지로 보고 임의 작업에서 지운다.
남은 일: |
  68번은 [[논의 2026-10-30 접근성]]의 포커스 규칙으로 정리됐다. 76·33번은 [[논의 2026-10-30 문서 역할]]에 이어지는 문서 구조 논의에서 정한다.
