_codocs:
  id: discussion-2026-10-29-tokens-lint
  name: 논의 2026-10-29 토큰·lint
  parent:
    - 논의 기록
질문: |
  [[임의 작업]]의 토큰·lint 묶음 항목을 유지·되돌림·문서 반영 중 무엇으로 할지. 항목 번호는 검토 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.
과정: |
  과정은 지난 세션 대화에만 있어 결과만 기록한다. 근거는 그 세션이 남긴 [[남은 작업]]의 `1. 임의 작업 검토 마무리` 섹션(처음 작성본)이다.
검토한 대안: |
  기록 없음.
결정: |
  - 2번(#304 `cn.ts` 토큰 이름 목록에 size 712 추가): 손으로 관리하는 `TOKEN_NAMES`를 플러그인과 `generate:tokens`(`--check` 포함)가 토큰과 함께 생성하게 하고, 손 목록과 `cn.test.ts` 비교를 지운다. [[피그마 연동:토큰 생성]]에 적는다.
  - 이 묶음의 나머지 항목(1번 등)은 유지로 보고 임의 작업에서 지운다(미룬 세 항목 외 모두 지운다는 결정).
  - 다음 논의로 남긴 것: lint 구멍(`border-3` 같은 Tailwind 기본 숫자 클래스 통과, 객체 리터럴 안 클래스 미검사).
남은 일: |
  lint 구멍은 [[논의 2026-10-30 lint 구멍]]에서 정했다.
