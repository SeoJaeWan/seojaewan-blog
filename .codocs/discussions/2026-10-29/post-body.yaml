_codocs:
  id: discussion-2026-10-29-post-body
  name: 논의 2026-10-29 글 본문
  parent:
    - 논의 기록
질문: |
  [[임의 작업]]의 글 본문 묶음(글 본문 블록 컴포넌트, Chrome 조립, Chrome PR의 찾기·배율, 글 본문 PR) 항목을 유지·되돌림·문서 반영 중 무엇으로 할지. 항목 번호는 검토 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.
과정: |
  과정은 지난 세션 대화에만 있어 결과만 기록한다. 근거는 그 세션이 남긴 [[남은 작업]]의 `1. 임의 작업 검토 마무리` 섹션(처음 작성본)이다.
검토한 대안: |
  기록 없음.
결정: |
  - 10·27번(Figure 이미지 prop, Chrome 조립의 renderImage): 피그마 Figure 이미지 틀을 원본 비율로 하고, 스토리의 인라인 Figure 높이 420을 지운다(Figure, Chrome page, Window/Chrome, SnapAssist, PostBlocks). 2026-10-30에 "Foundations 자산의 원본 비율로 넣는다"로 구체화됐다([[논의 2026-10-30 플러그인 구조 검사]]).
  - 21·28번(TableCell 본문 SemiBold, 글자 서식 세부): 피그마 TableCell 본문을 Regular로 하고, 코드도 regular로 바꿔 조립의 `type-body` 덮어쓰기를 지운다. 글자 꾸밈을 Notion처럼 겹쳐 그린다(굵게+기울임 등). 피그마 글자 스타일을 먼저 확인한다.
  - 41번(찾기 강조): [[Chrome:페이지에서 찾기]]에서 ↓·↑ 방향키 문구를 지우고 Enter·Shift+Enter와 ↓·↑ 버튼만 남긴다.
  - 43번(배율은 CSS zoom, 다시 시작하면 100%): [[Chrome:확대/축소]]에 다시 시작하면 100%로 돌아간다고 적는다.
  - 63번(코드 강조 갈래의 scope 묶음): 피그마 `code-syntax/*`에 Light+ 색 7가지(정규식 `#811f3f`·`#d16969`, 이스케이프 `#ee0000`, 열거형 멤버·`const` 변수 `#0070c1`, JSON 키·CSS 값 `#0451a5`, 잘못된 문법 `#cd3131`, 남색 변수 `#000080`)를 변수로 더하고 CodeBlock 견본에 쓴다. [[기술 스택:글 본문 처리]]에 색 갈래를 더하고 Light+와 똑같이 칠한다(`const` 변수 포함). Shiki 테마를 새 갈래로 칠한다.
  - 이 묶음의 나머지 항목은 유지로 보고 임의 작업에서 지운다.
남은 일: |
  일괄 작업은 [[남은 작업]]에 있다.
