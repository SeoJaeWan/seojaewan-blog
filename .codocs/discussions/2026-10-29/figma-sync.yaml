_codocs:
  id: discussion-2026-10-29-figma-sync
  name: 논의 2026-10-29 피그마 연동
  parent:
    - 논의 기록
질문: |
  [[임의 작업]]의 피그마 연동 묶음(컴포넌트·조립 PR에서 정한 것) 항목을 유지·되돌림·문서 반영 중 무엇으로 할지. 항목 번호는 검토 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.
과정: |
  과정은 지난 세션 대화에만 있어 결과만 기록한다. 근거는 그 세션이 남긴 [[남은 작업]]의 `1. 임의 작업 검토 마무리` 섹션(처음 작성본)이다.
검토한 대안: |
  기록 없음.
결정: |
  - 4·9·25번(CodeBlock·Equation·Table의 빈 슬롯 100): [[피그마 연동:스토리 규칙]]에 빈 HUG 슬롯의 피그마 기본 100×100만 Parity 스토리 인라인으로 허용한다고 적는다. 이 결정은 2026-10-30에 바뀌었다([[논의 2026-10-30 플러그인 구조 검사]]).
  - 23·27번(UnsupportedBlock warning 자산, Chrome 조립의 이미지 자산): 아이콘·이미지 자산은 토큰 내보내기(기반 PR)로 내보내고, 새 자산을 쓰는 컴포넌트는 기반 PR을 먼저 병합한다([[피그마 연동:PR 흐름]]·[[피그마 연동:자산]]과 PR 스킬). 코드는 `generate:assets`가 이미지 주소·너비·높이 지도를 만들어 손으로 쓴 `IMAGE_ASSET_URLS`를 대신하고 `getImageAsset(name)`을 내보내며, 앱은 큰 이미지(바탕화면 배경)에 `next/image`를 쓴다.
  - 11·50번(ExplorerTab 구분선, Window 조립 탭 수): ExplorerTab에 `showSeparator` prop을 만들고, 탐색기·Chrome 창 모두 선택된 탭 바로 왼쪽 탭의 구분선을 끈다. 피그마 `Show separator`와 조립 값으로 확인했다.
  - 이 묶음의 나머지 항목은 유지로 보고 임의 작업에서 지운다.
  - 다음 논의로 남긴 것: 피그마 MCP 한계(아이콘 색 변수, Toggle `get_design_context` 오류. 컴포넌트 속성은 `use_figma`의 `componentPropertyDefinitions`로 읽힘), 플러그인 구조 검사 구멍(크기를 조절한 인스턴스, 빈 HUG 슬롯 100×100), 코드 구조와 피그마 조립의 경계.
남은 일: |
  MCP 한계는 [[논의 2026-10-30 피그마 단일 기준 체계]], 구조 검사는 [[논의 2026-10-30 플러그인 구조 검사]], 경계는 [[논의 2026-10-30 코드 구조]]로 이어졌다.
