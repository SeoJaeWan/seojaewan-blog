_codocs:
  id: discussion-2026-10-29-menu
  name: 논의 2026-10-29 메뉴
  parent:
    - 논의 기록
질문: |
  [[임의 작업]]의 메뉴 묶음(Menu 조립, MenuZoomItem, 메뉴 공유 PR) 항목을 유지·되돌림·문서 반영 중 무엇으로 할지. 항목 번호는 검토 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.
과정: |
  과정은 지난 세션 대화에만 있어 결과만 기록한다. 근거는 그 세션이 남긴 [[남은 작업]]의 `1. 임의 작업 검토 마무리` 섹션(처음 작성본)이다.
검토한 대안: |
  기록 없음.
결정: |
  - 16·34번(MenuZoomItem, MenuPopup의 zoom 항목 종류): 피그마에서 확대/축소 줄을 MenuItem의 `Kind=Zoom` 변형으로 합치고, 코드도 MenuZoomItem을 MenuItem의 `zoom` 종류로 합쳐 `MenuPopup`이 그것으로 그린다. 방향키로 −·+에 닿는지 시험한다(2026-10-30 시험으로 `Menu.Item` `closeOnClick={false}` 방식을 확인했다).
  - 17번(MenuZoomItem 루트 너비 240): MenuItem의 `w-240`을 지운다. 너비는 Menu(`w-250`)가 정한다.
  - 57번(Start 모두 목록 메뉴의 범위와 아이콘): 고정 해제 아이콘은 모두 `pin_off`다. 피그마 Menu/TaskbarApp의 "작업 표시줄에서 고정 해제" 아이콘을 `pin_off`로 바꾸고 코드도 바꾼다. `ItemListRow`가 받은 속성과 ref를 줄에 넘기게 하고 우클릭용으로 감싼 `div`를 지운다(우클릭·길게 누르기·Shift+F10 시험). [[Start 메뉴:모두]]의 우클릭 대상 "줄"을 "모두 목록의 항목(줄·칸)"으로 고친다.
  - 75번(Menu/Post 스토리만 잘라내기를 뺌): 피그마 Menu/Post에 `잘라내기`(Ctrl+X)를 다른 메뉴와 같은 자리로 더하고, 스토리의 잘라내기 거르기와 주석을 지운다.
  - 미룬 것: 73번(함께 쓰는 항목은 `shared/utils/menu-items`, 메뉴 함수는 각 기능의 utils), 76번(바탕화면 휴지통 아이콘 메뉴의 휴지통 비우기 비활성).
  - 이 묶음의 나머지 항목은 유지로 보고 임의 작업에서 지운다.
남은 일: |
  73번은 [[논의 2026-10-30 코드 구조]], 76번은 [[논의 2026-10-30 문서 역할]]에 이어지는 문서 구조 논의에서 정한다.
