_codocs:
  id: discussion-2026-10-29-tools-tests
  name: 논의 2026-10-29 도구·테스트
  parent:
    - 논의 기록
질문: |
  [[임의 작업]]의 도구·테스트 묶음(외부 링크·순환 검사 PR, 목차 테스트 수정 PR, Window 조립 PR의 내보내기) 항목을 유지·되돌림·문서 반영 중 무엇으로 할지. 항목 번호는 검토 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.
과정: |
  과정은 지난 세션 대화에만 있어 결과만 기록한다. 근거는 그 세션이 남긴 [[남은 작업]]의 `1. 임의 작업 검토 마무리` 섹션(처음 작성본)이다.
검토한 대안: |
  기록 없음.
결정: |
  - 미룬 것: #319 항목(Window 조립 PR에서 `PostBlocks`를 Chrome 공개 진입점으로 내보냄)은 코드 구조 논의로 넘겼다.
  - 이 묶음의 나머지 항목은 유지로 보고 임의 작업에서 지운다.
  - 다음 논의로 남긴 것: 캡처 보고서 그림 주소의 캐시(PR 댓글 그림이 같은 주소라 옛 그림이 보임).
  - 논의 기록 자체: `.codocs/discussions/<날짜>/<구분>`에 논의마다 질문·과정·대안·결정을 남기기로 했고 형식은 나중에 정하기로 했다.
남은 일: |
  #319는 [[논의 2026-10-30 코드 구조]], 캡처 캐시는 [[논의 2026-10-30 캡처 보고서 캐시]]로 이어졌다. 논의 기록 형식은 2026-10-30에 [[논의 기록]]으로 정했다.
