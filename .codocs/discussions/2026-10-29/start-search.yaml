_codocs:
  id: discussion-2026-10-29-start-search
  name: 논의 2026-10-29 Start·검색
  parent:
    - 논의 기록
질문: |
  [[임의 작업]]의 Start·검색 묶음(Start·Search 조립, Start·검색 PR) 항목을 유지·되돌림·문서 반영 중 무엇으로 할지. 항목 번호는 검토 때 `arbitrary-work.yaml`의 섹션 차례(1부터)다.
과정: |
  과정은 지난 세션 대화에만 있어 결과만 기록한다. 근거는 그 세션이 남긴 [[남은 작업]]의 `1. 임의 작업 검토 마무리` 섹션(처음 작성본)이다.
검토한 대안: |
  기록 없음.
결정: |
  - 53번(패널 높이 하한을 고정 값으로 둠): [[Start 메뉴:구성]]의 "위쪽과 아래쪽을 더한 높이보다 작아지지 않는다" 문장을 지우고, `panel-rules.ts`의 `panelMinHeights`와 하한 계산을 지운다.
  - 44번(새 탭 검색창이 주소창 입력 동작을 함께 씀): SearchBox가 넘겨받은 `role`을 따르게 한다(`role="searchbox"`를 펼치기 앞에).
  - 이 묶음의 나머지 항목은 유지로 보고 임의 작업에서 지운다.
  - 다음 논의로 남긴 것: 접근성 문서(영역 이름 다는 방식, 값을 고르는 버튼 이름 `보기: 범주`, 역할, Tab), 반응형(노트북을 세 번째 모양으로).
남은 일: |
  접근성은 [[논의 2026-10-30 접근성]], 반응형은 [[논의 2026-10-30 반응형]]에서 정했다.
