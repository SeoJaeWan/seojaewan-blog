_codocs:
  id: discussion-2026-11-01-code-structure
  name: 논의 2026-11-01 코드 폴더 구조
  parent:
    - 논의 기록
질문: |
  [[논의 2026-10-30 코드 구조]]에서 넓힌 "코드 폴더 구조 다시 짜기"다. 피그마 조립·스토리의 자리와 기능 폴더 경계가 맞지 않았다. 세부는 공개 진입점 기준, 여러 기능에 걸친 스토리의 자리, PostBlocks의 자리(#319), 메뉴 함수의 자리(73번), 스토리 데이터 폴더 이름이다.
과정: |
  1. 사람이 "조립은 하나의 feature 아래에서 구성되는 요소이고, 메뉴도 쓰는 기능 안에 있어야 하고, 스토리는 순환 import 조건에서 제외하자"고 제안했다. 스토리가 다른 기능 내부를 바로 import하는 lint 예외를 시험해 통과했다.
  2. `shared/stories`를 확인하니 스토리 파일은 없고 데이터와 도우미뿐이었다.
  3. 메뉴를 조사했다. `components/menu-*` 25개는 컴포넌트 없이 스토리만 있고, 실제 항목 함수는 `utils/*-menu-entries`, 공유 데이터는 `stories/*-data`에 흩어져 있었다. 메뉴마다 여는 곳은 하나다. 처음에 낸 `menus/` 종류 폴더와 컴포넌트 아래 안은 사람이 정한 원칙에서 벗어나 지적을 받고 고쳤다.
  4. `TaskbarAppMenu`를 조사했다. 앱 코드에서 쓰이지 않고 스토리만 쓴다. 실제 화면은 `TaskbarAppPreview`가 버튼·미리보기·메뉴를 모두 맡는다. 그래서 캡처 비교가 실제 화면과 다른 코드를 보고 있었다.
  5. 진입점 파일을 없애는 안을 검토했다. 앱 코드가 쓰는 것은 11개뿐이고 모두 shell이 쓴다. boundaries 설정으로 스코프 방식 import 범위를 표현할 수 있는지 시험했다. 3단계 이상 중첩한 가짜 기능으로 72가지 import를 확인했고 어긋난 것이 없다. 전체 lint도 통과했다.
  6. 실제 import를 스크립트로 읽어 컴포넌트마다 쓰는 곳의 공통 조상을 계산해 전체 나무를 뽑았다. 값 순환은 없고, `start-body`와 `start-tile` 사이에 타입 순환이 하나 있다.
  7. `content/`는 서버 쪽 코드이고 `app`만 쓴다. `PostBlocks`는 React 컴포넌트이고 앱 코드에서는 Chrome만 쓴다.
검토한 대안: |
  - 피그마에 맞춘 `patterns/<영역>/` 폴더: 기능 폴더 안에 조립을 중첩하는 쪽으로 정해 버렸다.
  - `menus/` 종류 폴더, 메뉴를 컴포넌트 폴더 아래에 두는 안: 조립은 하나의 기능이라는 원칙과 맞지 않아 버렸다.
  - 메뉴를 JSX 컴포넌트로 조립: 메뉴 규칙을 화면 없이 단위 테스트할 수 없어 버렸다. 지금의 항목 목록 함수를 유지한다.
  - 진입점 파일 유지: 이중 관리가 되고, 위치 기반 lint로 같은 경계를 지킬 수 있어 버렸다.
  - 커스텀 lint 규칙: boundaries로 표현되므로 쓰지 않는다.
  - PostBlocks를 `content/`로 옮김: 서버 층에 화면이 섞이고 새 의존이 생겨 버렸다.
  - Chrome을 `window` 아래로 옮김: `window`는 창 관리, Chrome은 창 안의 앱이라 형제 기능으로 둔다.
결정: |
  폴더:
  - React 컴포넌트는 그것을 쓰는 곳의 `components/` 안에 둔다. 쓰는 곳이 여럿이면 공통 조상의 `components/`에 둔다. 훅과 `utils`도 같은 기준이고, 여러 기능이 쓰면 `shared`로 간다.
  - 컴포넌트 폴더의 안쪽 구조는 기능과 같다(자기 파일, `components/`, `hooks/`, `utils/`, `stores/`, `data/`).
  - 컴포넌트가 없는 메뉴(항목 함수 + 스토리 + `story-data.ts`)는 `components/` 밖의 하위 폴더로 그 메뉴를 쓰는 곳 아래에 둔다. 하위 메뉴는 여는 메뉴 아래에 중첩한다. 같은 함수의 상태별 조립은 한 폴더에 스토리 파일만 여럿 둔다.
  - 메뉴 폴더 이름은 역할로 짓고(`empty-menu`, `item-menu`, `view-submenu`) 기능 이름을 붙이지 않는다. 로직 파일은 `-entries`로 짓는다. 스토리 제목은 피그마 이름 그대로다.
  - 모양이 같고 내용이 다른 하위 메뉴는 틀을 shared에 두고 값을 채운 함수를 기능에 둔다. 내용까지 같으면(새로 만들기) 메뉴와 스토리를 shared에 둔다. 메뉴는 항목 목록을 돌려주는 함수로 유지한다.
  - 스토리는 컴포넌트 옆에 둔다. 데이터는 그 데이터가 그리는 대상 폴더의 `story-data.ts`에 두고 다른 스토리가 바로 가져온다. `shared/stories`, 기능의 `stories/`, `shell/stories`는 없앤다. 메뉴 도우미는 `menu-popup` 옆으로, 저장소·창 도우미는 `stores`·`window-rules` 옆으로 옮긴다.
  - 스토리만 있던 shell의 snap-assist, taskbar-app-preview, taskbar-window-preview-list는 주인 기능으로 옮긴다. shell에는 여러 기능을 실제로 쌓는 화면만 둔다.
  - 다른 기능의 내용은 자리(`ReactNode`)로 받는다.

  경계:
  - 공개 진입점 파일(`<기능>.ts`)을 없앤다. 바깥(app, shell)은 기능 폴더 바로 아래 파일만 바로 가져온다. 앱 코드가 쓰는 11개(레이어 컴포넌트 7개, 훅 3개, `renderTaskbarAppIcon`)를 그 자리로 올린다. 최상위 기능끼리는 막는다.
  - import 범위는 변수의 스코프와 같다. 자기와 조상의 `components/` 바로 아래 컴포넌트 주 파일, 자기와 조상의 메뉴 폴더, 자기와 조상의 `hooks`·`utils`·`stores`·`data`를 가져올 수 있다. 다른 컴포넌트의 안쪽으로 들어가는 것과 부모 컴포넌트를 가져오는 것은 막는다. 스토리는 어디든 가져온다.
  - 넓게 쓰이는 타입이 컴포넌트 파일에 있으면 `utils`로 뺀다.
  - lint는 boundaries 설정으로 유지한다.

  이름과 개별 항목:
  - `TaskbarAppMenu`를 지운다. `TaskbarAppPreview`는 `TaskbarAppItem`으로 바꾼다(`app-item`). 피그마 `Taskbar/AppPreview`와 `Taskbar/AppMenu` 스토리를 둘 다 이 컴포넌트로 그린다.
  - `PostBlocks`는 `chrome/components/post-blocks/`에 둔다. `content/`는 `app`만 쓰는 층으로 둔다. Snap Assist 스토리는 `PostBlocks`를 바로 가져온다. #319와 73번은 이 결정으로 닫는다.
남은 일: |
  전체 나무의 원본은 일괄 작업 때 스크립트로 다시 계산한다(훅과 `utils` 자리 포함). 부모 import 금지, 조상 메뉴 보기, `hooks/` 안의 `utils/` 중첩은 시험 설정에 없어 일괄 작업 전에 확인한다. [[저장소 구성]] 등 문서 변경과 코드 작업은 모든 논의가 끝난 뒤 한다.
