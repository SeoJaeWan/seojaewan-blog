_codocs:
  id: discussion-2026-11-01-doc-structure
  name: 논의 2026-11-01 문서 구조
  parent:
    - 논의 기록
질문: |
  문서가 화면 단위·개념 단위·차이 모음으로 섞여 한 기능을 알려면 여러 문서를 건너야 한다. 가장 흩어진 개념은 휴지통(8개 문서), 방문자 저장·다시 시작, 모바일 차이, 우클릭 메뉴·고정, Notion이고, 같은 사실이 두 곳 이상에 적힌 중복이 20곳이다. 세부는 작업 공간 나누기, "배치"의 경계, Notion, 모바일, 접근성의 자리, 휴지통 비우기 조건(76번), 메시지 상자 글자(33번)다.
과정: |
  1. 화면 기능과 공통 기능으로 나누는 안을 냈다. 사람이 화면 기능은 내용이 커지니 desktop, taskbar, window로 나누고, 공통 기능도 주제 하나에 파일 하나로 하자고 했다.
  2. 작업 공간 "배치"(어느 폴더에 있는가)와 바탕화면 "아이콘 배치"(어느 칸에 있는가)를 나누려 했더니, 사람이 "배치가 폴더에서도 쓰이니 바탕화면 아래 두면 모호하다"고 지적했다. 문서를 대조하니 칸에 놓기·자동 정렬만 바탕화면 고유이고, 선택·끌기·정렬 비교·단축키는 탐색기가 "바탕화면과 같다"고 링크만 거는 공통 내용이었다.
  3. Notion 정보는 `foundation` 두 문서와 작업 공간, Chrome에 흩어져 있었다.
  4. `mobile.yaml`은 원칙, 화면별 동작 차이, 배치 세부가 섞여 있었다.
검토한 대안: |
  - 화면 문서를 평평하게 나열: 문서 하나가 커져서 영역 폴더로 묶는다.
  - 문서를 코드 `features/`와 똑같이 맞춤: 코드의 경계는 import 의존이고 문서의 경계는 사용자가 찾아가는 길이라 영역 아래에 둔다.
  - 공통 조작을 바탕화면 문서에 둠: 공통 내용이 "바탕화면"이라는 제목 아래 있어 모호해서 버렸다.
  - Notion을 문서 하나로 합침: 서로 다른 때 찾는 내용이라 폴더 하나에 주제별 파일로 둔다.
  - 모바일 문서 유지: 화면 일을 할 때 문서 두 개를 봐야 해서 버렸다.
  - 메시지 상자 글자를 문서에서 뺌: 어떤 상황에서 무슨 글자가 뜨는지는 기능 규칙이라 문서에 둔다.
결정: |
  구조:
  - `features/`를 `common/`, `desktop/`, `taskbar/`, `window/`로 나눈다. 폴더 안은 주제 하나에 파일 하나다.
  - `common/`: 휴지통, 항목과 폴더(자원 모델, 폴더 이름, 위치와 옮기기), 항목 조작(선택, 끌기, 열기, 잘라내기·붙여넣기, 단축키), 항목 정렬(비교 규칙), 방문자 저장, 다시 시작, 고정, 접근성, 반응형.
  - `desktop/`: 바탕화면, 아이콘(격자 자리, 자동 정렬, 칸 크기), 우클릭 메뉴.
  - `taskbar/`: 작업 표시줄, Start, 검색.
  - `window/`: 창, 스냅, 파일 탐색기, Chrome.
  - 위 목록은 초안이고 실제 문서를 볼 때 커질 만한 것만 더 나눈다.
  - `foundation/notion/`: 콘텐츠 원천(왜 Notion인가, 속성, 갱신), 이미지 제공, Notion 블록, 작업 공간 맞추기(초기 구조, 방문할 때 맞추기).
  - `작업 공간`, `자원 모델`, `모바일` 문서는 나뉘어 없어진다.

  규칙:
  - 사실 하나는 문서 하나에만 쓴다. 한 화면에서만 일어나는 일은 그 화면 문서에, 두 화면 이상에 걸치면 `common/`에 쓰고 화면 문서는 링크만 둔다. 화면 문서에는 그 화면에만 있는 것과 차이만 쓴다.
  - "옮길 수 있는가"는 항목과 폴더에, 끌 때 어떻게 보이는가는 항목 조작에 둔다.
  - `common/responsive`에는 모바일 자체의 원칙(구간, 입력 차이)만 두고 경계 숫자는 쓰지 않는다. 화면별 동작 차이는 각 기능 문서의 `모바일` 섹션에 쓴다. 배치 세부는 피그마 Screens로 넘기고 문서에서 지운다.
  - 접근성은 `common/accessibility`에 두고 화면 문서에는 다른 경우만 쓴다.
  - 휴지통 비우기 조건(76번)은 `common/recycle-bin`에 한 번만 쓰고, 화면 문서의 메뉴 항목은 그 섹션으로 링크한다.
  - 메시지 상자 글자(33번)는 그 동작을 정한 문서의 그 자리에 쓴다. 모양은 피그마가 가진다.
  - 중복 20곳은 위 규칙으로 일괄 작업 때 지우고, 끝난 뒤 다시 확인한다.
남은 일: |
  문서 변경은 코드 작업과 함께 일괄 작업에서 한다. 문서를 옮기면 `@codocs` 연결도 함께 고친다.
