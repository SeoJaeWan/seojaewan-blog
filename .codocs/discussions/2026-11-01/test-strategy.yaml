_codocs:
  id: discussion-2026-11-01-test-strategy
  name: 논의 2026-11-01 테스트 전략
  parent:
    - 논의 기록
질문: |
  코드 폴더 구조를 논의하다 나왔다. 사람이 "로직은 훅으로 빼서 테스트하고, UI는 스토리북으로 대체해 컴포넌트 테스트를 빼면 어떨까"라고 물었다. 컴포넌트 테스트(`*.test.tsx`)는 디자인 시스템 77개, 앱 20개이고 로직 테스트(`*.test.ts`)는 54개다. 키보드·포커스·접근성 확인은 지금 컴포넌트 테스트가 맡고, 스토리의 `play`는 0개다.
과정: |
  1. Storybook 상호작용 테스트 시험: 디자인 시스템과 `apps/web`에 `@storybook/addon-vitest`(Vitest 브라우저 모드, playwright chromium)를 별도 설정 파일로 붙였다. `DropDownButton` 키보드·포커스 테스트 2개를 `play`로 옮겨 통과했고, 틀린 기대값으로 실패하는 것도 확인했다. 디자인 시스템 92개 약 7초, `apps/web` 65개 약 8초다(`apps/web`에는 `play`를 넣어 보지 않았고 기존 스토리 그리기만 돌렸다). 기존 `pnpm test`는 그대로 통과했고, 캡처 비교는 대상 스토리 이름으로 고르므로 영향이 없다.
  2. 접근성 검사 시험: axe(`@storybook/addon-a11y`)를 오류로 켜면 디자인 시스템 스토리 8개가 실패했다. 모두 코드 쪽 문제이고 색 대비 위반은 없다. `ListItem`(role 없는 `aria-selected`, 스토리 3개), `Checkbox`(이름 없음), `BrowserTab`·`ExplorerTab`·`NavigationItem`(단독으로 그려 부모 role 없음), `MenuItem`(Base UI 포커스 가드). 기본 상태만 봤다.
  3. lint 시험: 사람이 "lint로 충분하지 않나"라고 물어 `eslint-plugin-jsx-a11y` strict를 붙였다. axe가 잡은 8건 중 lint가 잡은 것은 0건이다. 전체 5건이 나왔지만 의도된 구조에 걸린 오탐에 가깝다. props로 넘기는 role·aria, Base UI가 만드는 요소, 부모 관계는 lint가 볼 수 없다.
  4. 스토리 lint 시험: `onClick={args.onClick}`과 `onClick={onClick}`은 `react/jsx-handler-names`에 걸리고, `onClick: handleClick`으로 이름을 바꿔 받으면 통과한다. 컴포넌트 코드의 기존 방식과 같다.
검토한 대안: |
  - 컴포넌트 테스트 유지: UI 확인이 스토리와 테스트 두 곳으로 나뉜다.
  - `toHaveStyle`로 모양 확인: 캡처 비교와 겹쳐 쓰지 않는다.
  - axe를 경고로만 둠: 위반이 쌓인다.
  - lint만으로 접근성 확인: 시험에서 8건 중 0건이라 버렸다.
  - 테스트마다 스토리 하나: 스토리가 지나치게 늘어난다.
  - 스토리 lint 예외: 기존 방식으로 통과하므로 필요 없다.
결정: |
  - 컴포넌트 테스트 파일(`*.test.tsx`)을 없앤다. 로직은 훅과 `utils`로 빼서 단위 테스트하고, UI는 스토리 `play`로 확인한다.
  - 클래스 검사: 고정 모양(`w-258`, `px-16` 등) 검사는 뺀다(캡처 비교가 맡는다). 상태에 따라 바뀌는 모양은 `aria-*`·`data-state` 같은 상태 속성으로 확인하고, 그런 속성이 없으면 컴포넌트에 더한다. `toHaveStyle`은 쓰지 않는다.
  - 접근성: axe를 기준으로 한다. 8건을 고친 뒤 오류로 켠다. 부모 없는 스토리는 `tablist`·`tree`로 감싼다. 규칙을 끄는 것은 외부 라이브러리 때문일 때만 스토리별로 허용하고 이유를 적는다. `jsx-a11y`는 넣지 않는다.
  - 스토리 구성: 피그마와 맞추는 스토리는 `play`를 넣지 않는다. 동작 스토리는 쓰는 상황 하나에 하나를 만들고(`Default`, `Disabled`, `Selected`, `Open`) 안에서 `step()`으로 나눈다. 같은 `*.stories.tsx`에 둔다.
  - 이름: `Parity` 스토리를 `Figma`로 바꾼다. 도구 이름 `figma-parity`와 "캡처 비교"라는 말은 그대로 둔다.
  - 스토리의 핸들러는 앱 코드처럼 `handle…`로 바꿔 받는다. lint 예외를 두지 않는다.
  - 실행: `pnpm test`(전부, CI도 이것), `pnpm test:unit`, `pnpm test:storybook`을 vitest project로 나눈다. 패키지별로도 같은 이름의 명령을 둔다. CI 테스트 단계에 chromium을 설치한다.
남은 일: |
  [[테스트 작성 규칙]] 등 문서 변경과 코드 작업은 모든 논의가 끝난 뒤 일괄 작업에서 한다. 시험 변경은 worktree에만 있고 커밋하지 않았다.
