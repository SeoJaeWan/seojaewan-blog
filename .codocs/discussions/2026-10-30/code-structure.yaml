_codocs:
  id: discussion-2026-10-30-code-structure
  name: 논의 2026-10-30 코드 구조
  parent:
    - 논의 기록
질문: |
  원래 남은 논의 7번 "코드 구조와 피그마 조립의 경계"였다. 세부는 기능 공개 진입점에 내보낼 기준, 여러 기능에 걸친 스토리의 자리, PostBlocks를 `content/`로 옮길지(#319), 메뉴 항목 함수와 메뉴를 엮는 함수의 자리(73번), 스토리 데이터 폴더 이름(`desktop-submenu-data`·`explorer-submenu-data`)이다.
과정: |
  1. 7-1 공개 진입점: 기능마다 export를 밖에서 쓰는지 이름으로 셌다(주석에만 나오는 경우가 섞였을 수 있음). start-menu는 13개 중 12개, taskbar는 12개 중 6개, chrome은 10개 중 4개를 밖에서 쓰지 않았다. `PostBlocks`·`ChromePage`(shell의 SnapAssist 스토리), `ExplorerContent`·`ExplorerCommands`(shell의 미리보기 목록 스토리)는 스토리 때문에만 열려 있었다. "app·shell이 실제 화면을 조립할 때 쓰는 것만 내보낸다"는 기준을 냈다.
  2. 사람이 "폴더 구조부터 다시 결정하자, 스토리북이나 케이스 기준으로 폴더 구조를 개편하는 게 맞지 않냐"고 했다. 다섯 문제의 뿌리가 "피그마 조립·스토리의 자리와 기능 폴더 경계가 맞지 않는 것" 하나라고 정리하고, 7번을 "코드 폴더 구조 다시 짜기"로 넓혔다.
검토한 대안: |
  아직 고르지 않았다. 방향 후보: 피그마 쪽에 맞춤(조립과 Parity 스토리를 `patterns/<영역>/`에 모으고 기능 폴더는 동작·상태만), 기능 쪽에 맞춤(기능 폴더를 유지하고 경계를 넘는 규칙만 새로 정함).
결정: |
  7번을 "코드 폴더 구조 다시 짜기"로 넓혀 남은 논의의 첫 번째로 둔다. 시작 전에 코드 구조 지도(조립마다 컴포넌트·스토리·데이터·메뉴 함수의 자리, 스토리 때문에 생긴 import·export, 여러 기능을 엮는 그림, `content/`의 위치)를 뽑는다.
남은 일: |
  코드 구조 지도를 보고 방향을 고른 뒤 다섯 세부를 정한다. 기능 공개 진입점에서 밖에서 쓰지 않는 export를 지우는 일은 기준을 확정한 뒤 한다([[남은 작업]]).
