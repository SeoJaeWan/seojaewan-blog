_codocs:
  id: discussion-2026-10-30-plugin-check
  name: 논의 2026-10-30 플러그인 구조 검사
  parent:
    - 논의 기록
질문: |
  플러그인 구조 검사에 두 구멍이 있다. 크기를 조절한 인스턴스를 건너뛰어 Figure 이미지 높이 420이 토큰 없이 빠져나왔고, 빈 HUG 슬롯을 피그마가 100×100으로 그려 스토리가 맨숫자 상자를 넣었다.
과정: |
  1. 피그마 Figure 구조를 읽었다: Figure 720×448 > image frame 720×420 > image 인스턴스(wallpaper/Bloom) 720×420, caption 720×20. `size/420` 변수는 `tokens.json`에 없다. 칸은 HUG라 검사 대상이 아니고, 인스턴스는 배율 인스턴스라 "담는 칸이 지킨다"며 검사하지 않아 서로 상대에게 맡긴 틈으로 420이 빠졌다(플러그인 데이터로 확인하지 않은 추정). 그 결과 스토리 다섯 곳에 `420`·`212`가 인라인으로 남았다.
  2. 처음 제안은 "배율 인스턴스를 담는 칸이 HUG면 막기"였다. 사람이 "이미지는 내부적으로 Foundations 자산이니 크기를 따로 빼지 말고, 쓰는 곳에서 MCP로 보고 그 자산을 넣으면 된다"고 했다. 높이는 자산 원본 비율과 칸 너비에서 나오므로 숫자가 생기지 않는다.
  3. 빈 HUG 슬롯: Equation은 위아래 여백 8과 빈 Formula 슬롯이라 피그마 높이 116(8+100+8), 코드는 16이라 캡처 크기가 달라 스토리가 `style={{ width: 100, height: 100 }}`을 넣었다(CodeBlock, Table 등 6곳). 처음엔 코드 전용 변수 `size/slot/empty`와 `EmptySlot`을 제안했다.
  4. 사람이 "근본적으로 왜 필요한 행위인지 모르겠다", "피그마를 통과하기 위한 환경 구성이다", "이런 의미 없는 스토리는 빼는 게 맞다"고 했다. 실제 화면에서는 슬롯에 늘 내용이 들어가므로, 빈 컴포넌트 단독 비교 자체가 의미 없다고 정리했다.
검토한 대안: |
  - 담는 칸이 HUG인 배율 인스턴스를 막기: 이미지 쪽 문제가 자산 원본 비율로 사라져 필요 없어졌다(다른 배율 인스턴스에 같은 틈이 있는지는 작업 때 확인).
  - `size/slot/empty` 토큰과 `EmptySlot` 스토리 부품: 통과용 구성이라 고르지 않았다.
  - 스토리 안에서만 100 인라인 허용(지난 세션 안): 4번 원칙(숫자 값은 이름 있는 토큰으로)과 부딪혀 대신했다.
  - Equation 수식 자리를 인스턴스 교체 속성으로 바꾸기: 하지 않기로 했다.
결정: |
  - 5-1: 이미지는 Foundations 자산을 원본 비율로 넣는다. 플러그인은 이미지 자산 인스턴스의 비율이 바뀌면 막는다. 스토리의 420·212는 지운다.
  - 5-2: 빈 HUG 슬롯이 있는 컴포넌트는 `Parity` 스토리와 단독 캡처 비교를 없애고, 내용이 채워진 조립 캡처로 확인한다. 무엇을 뺄지는 플러그인이 `export.json`에 적고 캡처 도구가 따른다. 가짜 100 상자와 인라인 허용 문서 고침은 지운다.
남은 일: |
  조립에 한 번도 안 쓰이는 빈 슬롯 컴포넌트가 있는지 작업 때 확인해 보고한다. [[피그마 연동:스토리 규칙]] 고침.
