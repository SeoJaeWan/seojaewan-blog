_codocs:
  id: discussion-2026-10-30-lint
  name: 논의 2026-10-30 lint 구멍
  parent:
    - 논의 기록
질문: |
  토큰 클래스만 쓰게 하는 lint에 두 구멍이 있다. `border-3` 같은 Tailwind 기본 숫자 클래스가 통과하고, 객체 리터럴 안의 클래스 문자열을 검사하지 않는다. 어떻게 막을까.
과정: |
  1. 임시 파일로 실제 lint를 돌려 봤다(바로 지움). `--spacing`을 끈 간격·크기 계열(`w-13`, `p-13`, `gap-3`, `leading-7` 등)은 막히지만, 숫자를 그대로 값으로 쓰는 유틸리티는 통과했다.
     - 선 두께·간격: `border-3`, `outline-3`, `ring-2`, `ring-offset-2`, `stroke-2`, `decoration-2`, `divide-x-2`, `underline-offset-2`
     - 시각 효과: `opacity-37`, `scale-110`, `rotate-45`, `skew-x-3`, `brightness-50`, `aspect-3/2`, `mask-l-from-50%`
     - 배치 구조: `z-7`, `order-3`, `grid-cols-5`, `col-span-2`, `line-clamp-2`, `grow-2`, `shrink-2`
     지금 코드에서 쓰는 것은 `shrink-0` 132곳, `rotate-180`·`rotate-90` 8곳, `z-1`·`z-10` 7곳, `line-clamp-2` 3곳, `scale-50`·`scale-110` 각 1곳이다.
  2. 객체 클래스: `flyout.tsx`의 `materialClassNames`처럼 변형별 클래스를 객체에 담아 `cn(materialClassNames[material])`로 넘기는 곳이 19개 파일에 있다. lint는 식으로 넘어간 객체 안 문자열을 보지 않아 임의 값·모르는 클래스가 빠져나간다. [[피그마 연동:토큰 사용 강제]]의 "클래스 문자열은 `className`과 `cn` 인자에만"과도 실제가 어긋난다.
  3. 처음 제안은 디자인 값 숫자 클래스만 막고 `rotate-90·180·270`과 배치 구조 클래스는 허용하는 것이었다. 사람이 "숫자로 끝나지 못하게 하고 피그마 값도 다 명확한 이름으로"를 제안했다.
  4. 토큰 클래스 자체도 `p-16`처럼 숫자로 끝난다고 짚자, 사람이 "토큰 클래스도 숫자를 못 쓰게 하자"고 했다. 토큰 이름 체계를 바꾸는 일이라 [[논의 2026-10-30 피그마 단일 기준 체계]]로 넘겼다.
  5. `shrink-0` 예외 제안에 사람이 "값을 이름으로 줄 수 있지 않냐"고 했다. Tailwind의 `flex-none`(A)과 우리 이름 클래스를 새로 만드는 것(B)을 비교했고, 사람이 B를 골랐다. 정의 자리는 피그마 코드 전용 변수와 토큰 생성이다(손으로 쓴 CSS는 값이 피그마 밖에 생겨 고르지 않음).
검토한 대안: |
  - 디자인 값 숫자 클래스만 막고 회전 90° 배수·배치 구조는 허용: 이름 없는 숫자가 남아 고르지 않았다.
  - `shrink-0`만 예외, 또는 Tailwind `flex-none`으로 바꾸기: 값도 우리 이름으로 주자는 원칙과 달라 고르지 않았다.
  - 이름 규칙을 어긴 객체(`materialStyles` 등)까지 잡는 lint: "클래스처럼 보이는 문자열" 판정이 복잡하고 잘못 잡을 수 있으며, 지금 코드가 모두 `ClassNames` 이름을 지켜 만들지 않았다.
결정: |
  - 코드의 클래스 이름에는 숫자 값이 들어가지 않는다. 모든 값은 피그마 토큰이 붙인 이름으로 온다. `shrink-0`·`rotate-180`·`z-10`·`line-clamp-2`도 예외가 아니다. 숫자로 끝나는 클래스를 막는 lint는 토큰 이름 체계를 바꾼 뒤 켠다.
  - 이름이 `ClassNames`·`CLASS_NAMES`로 끝나는 변수의 객체 안 문자열도 클래스로 검사한다(better-tailwindcss `variables`). 문서 문장도 이에 맞게 고치고 테스트로 지킨다.
남은 일: |
  토큰 이름 체계는 [[논의 2026-10-30 피그마 단일 기준 체계]]에서 정했다. 일괄 작업은 [[남은 작업]]의 lint·클래스 이름 바꾸기 항목.
