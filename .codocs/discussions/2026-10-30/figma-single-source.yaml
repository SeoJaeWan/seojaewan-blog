_codocs:
  id: discussion-2026-10-30-figma-single-source
  name: 논의 2026-10-30 피그마 단일 기준 체계
  parent:
    - 논의 기록
질문: |
  디자인에 관한 값과 규칙을 `.codocs`나 코드에 나눠 적지 않고 피그마 한 곳에서 관리하고, 피그마가 기본으로 표현하지 못하는 것도 피그마에 적어 플러그인이 내보내게 할 수 있을까. 원래 남은 논의 2번 "피그마 MCP 한계"를 흡수했다.
과정: |
  1. 시작: 모양 설명 기준을 논의하다 사람이 Wanted 디자인 시스템 커뮤니티 파일을 예로 들며 "디자인 관련은 피그마로 통일하고, 플러그인으로 뽑을 수 없으면 플러그인을 개선하자"고 했다. Wanted 파일의 Foundation > Grid 페이지에는 아트보드 기준 크기, 브레이크포인트(xs~xl), 간격 규칙, 열 그리드, 최대 너비가 제목·설명·예시로 들어 있었다(Component 가이드는 "Coming Soon"). 사람이 "전체 디자인 시스템을 Wanted처럼 구성하자"고 했다.
  2. 사람이 모션·그라데이션도 플러그인으로 관리하자고 했고, 피그마 밖 디자인 정보 조사(81개)를 했다. 지금 플러그인이 못 뽑는 것은 모션 재생 조건·반복, 각도·방사형 그라데이션, 레이어 구조, 설명 글, 계산식, 경계값이었다.
  3. 사람이 "description 같은 데 적고 플러그인이 내보내면"이라고 방향을 좁혔다. 주석·플러그인 데이터·변수·description을 비교했다.
  4. 시험(우리 파일은 읽기만, 쓰기는 시험용 파일 https://www.figma.com/design/kAGzeg3UkhiIEk5326Redk):
     - description: 컴포넌트·변수·스타일 모두 여러 줄과 `@` 줄이 그대로 남는다. `descriptionMarkdown`은 변수·스타일에서 에러라 평문 기준. 지금 플러그인은 읽지 않는다.
     - 주석: 프레임·컴포넌트·인스턴스·키프레임 노드에 달리고 섹션에는 안 달린다. 플러그인은 읽지 않는다.
     - 코드 전용 변수: FLOAT 768은 통과, STRING `infinite`는 이름 규칙이 없어 내보내기 전체가 실패한다.
     - 변수 모드: 저장은 되지만 플러그인은 기본 모드만 읽고 나머지를 조용히 버린다.
     - 회전·겹침 순서·최대 줄 수·비율 고정은 변수 연결이 안 된다(`Unknown field`).
  5. 사람이 "어떤 원리로 어떤 값이 어떻게 나오는지" 흐름을 물어 ① 피그마에 적기 → ② 읽기 → ③ 검사 → ④ 파일과 PR → ⑤ 구현 → ⑥ CI로 설명했다. 사람이 이것을 "tokens.json으로 들어오지 못해 손으로 넣던 값이 자동으로 온다"는 뜻으로 확인했다.
  6. 애니메이션: 사람이 "피그마에서 동작은 되는데 속성으로 못 가져오니 description으로 하는 거냐"고 확인하고 "다 테스트해 보자"고 했다. 시험 결과, 키프레임과 변형 전환(`reactions`: 우리 파일 컴포넌트 70개에 185건, 호버 162·누름 19·클릭 4)은 읽히고, 반복·왕복·재생 시작 조건은 API가 주지 않으며, 피그마에 포커스 트리거가 없어 검색 상자 Focused 전환 4건이 `ON_CLICK`으로 들어 있다. 사람이 "description이 없는 건 플러그인이 막게 하자"고 했다.
  7. 파일 구성: 가이드 페이지를 두되 같은 내용을 두 곳에 적지 않는 안.
  8. 토큰 이름: 간격 Fluent 2 이름 안 → 사람이 "xs, xl 다음엔 앞에 숫자"(`2xs`·`2xl`)를 제안(시험으로 Tailwind 생성 확인) → 사람이 "spacing을 넣어 `p-spacing-sm`"을 제안해 모든 묶음을 "유틸리티 + 변수 경로 전체"로 통일, 단계 이름은 Tailwind식 `sm`·`md`·`lg`. 크기는 사람이 "같은 값이라도 역할이 다르면 다른 변수"를 확인. 노드에 연결할 수 없는 값은 같은 값의 코드 전용 변수와 짝짓기로 풀었다.
  9. 그라데이션: 칠 스타일 4개 모두 선형이고 이미 자동 변환된다. 빈틈은 선형 밖 종류뿐이었다.
  10. MCP 한계: 아이콘 색 변수가 `get_design_context`에 안 나오고 Toggle은 오류가 난다. 구현용 레이어 트리를 `export.json`에 담는 안을 냈고, 사람이 "실패·누락 없이 되냐"고 의문을 제기해 작은 실험을 했다. Bookmark·Toggle 뽑기는 오류 없이 됐고, 파일과 PNG만 보고 만든 Bookmark에 틀린 값이 없었으며 지금 코드의 링크 아이콘 색 오류(`primary`, 피그마는 `secondary`)를 찾았다. 짐작한 곳은 정보가 없어서였는데, 사람의 질문으로 HTML 요소·필수 prop·접근성은 피그마가 가질 정보가 아니라 `.codocs` 규칙임을 정리했다. 색 오류의 원인은 지금 방식의 MCP 짐작이라 새 방식에서는 생기지 않는다. 사람이 "export.json을 기본으로 보되 MCP도 함께 쓰자"고 했다.
  11. `.codocs` 경계: 사람이 "features에도 디자인 요소가 있다"고 해 기능 문서까지 나눴다. Chrome 글 화면의 목차 기준이 문서(창 폭)와 코드(`device === 'mobile'`)에서 달랐고, 사람이 "창 폭"의 뜻을 물어 Chrome 창 너비라고 설명했다.
검토한 대안: |
  - 플러그인 데이터(`setPluginData`)를 주 저장소로: 캔버스에 보이지 않아 "피그마에서 관리" 취지와 맞지 않았다.
  - 간격을 Fluent 2 이름 그대로(40·48은 역할 이름): 사람의 `2xl` 방식으로 대신했다.
  - 레이어 정보로 코드를 자동 판정([[피그마 연동:검토한 대안]]에서 이미 뺀 방식): 이번에는 구현 참고로만 쓴다.
  - 레이어별 토큰 대조, 토큰 집합 대조: 색 오류의 원인이 사라지고 남는 옮김 실수는 드물어 만들지 않는다.
결정: |
  - 적는 자리: 값 하나는 코드 전용 변수(범위 비움). 노드에 변수를 연결할 수 없는 값은 노드에 값으로 두고 같은 값의 코드 전용 변수와 짝지어 이름을 내보낸다(짝이 없으면 막음). 규칙 글은 컴포넌트·변수·스타일 description의 `@키 값` 줄, 컴포넌트가 아닌 레이어는 주석, 노트북 차이는 변수 모드. 피그마가 가진 정보는 속성으로 가져오고 가져올 수 없는 것만 `@` 줄에 적는다.
  - 파일 구성: `00 · Guide` 페이지를 두고 기존 페이지 번호를 민다. 가이드는 내보내지 않고, 가이드 안 값 글자는 변수에 연결한다(뒤에 Plugin API 제약으로 바뀌었고, 2026-11-09에 Guide를 지우기로 바꿨다. [[논의 2026-11-09 피그마 파일 구조 정리]]). 컴포넌트 하나에 딸린 것은 description에 둔다.
  - 토큰 이름: 클래스는 유틸리티 + 피그마 변수 경로 전체. 간격은 none·2xs·xs·sm-nudge·sm·md-nudge·md·lg·xl·2xl·3xl·4xl·5xl. 아이콘 크기는 단계 이름, 나머지 크기는 역할 이름이고 같은 값이라도 역할이 다르면 다른 변수. 기본 색은 클래스를 만들지 않는다. 코드 전용 묶음은 회전, 글자 최대 줄 수, 겹침 순서, 줄어들지 않음, 경계값.
  - 모션: 키프레임과 변형 전환을 읽고, 반복·왕복·재생 시작·유지 조건·포커스 트리거·실행 중 값·동작 줄이기는 `@` 줄로. 모션 견본은 `@repeat`·`@trigger`, Focused로 가는 전환이 있는 컴포넌트는 `@trigger focus-visible`이 없으면 막는다(2026-11-09에 피그마 기능과 주석으로 읽기로 바꿨다. [[논의 2026-11-09 피그마 파일 구조 정리]]).
  - 그라데이션: 방사형·각도형 변환 규칙과 테스트를 미리 만들고, 다이아몬드는 구조 검사가 막는다.
  - 구현 자료: 구현 참고용 레이어 트리를 `export.json`에 담고 판정에는 쓰지 않는다. `export.json`과 PNG가 기준, 동작·코드·접근성은 `.codocs`, 모르는 것만 MCP. 둘이 다르면 `export.json`을 따르고 차이와 MCP로 메운 것을 보고한다.
  - 경계: 피그마는 디자인이 어떻게 생겼는지, `.codocs`는 작성 규칙·결정·동작·접근성·절차. 기능 문서의 모양 설명도 피그마로 옮기고 동작·판정 문턱·실행 중 값만 남긴다. Chrome 글 화면은 Chrome 창 내용 너비로 넓은·좁은 모양을 가르고 경계는 피그마 변수로 둔다.
남은 일: |
  일괄 작업의 피그마 일·문서 고침·코드 작업은 [[남은 작업]]에 있다. 확인 필요: ProgressRing 예시값 불일치, 재부팅 견본 중첩 트랙, `playbackSettings.loop`의 뜻. 실험 파일은 `.claude/worktrees/agent-ae0358716d2e765f1/experiments/layer-tree/`.
