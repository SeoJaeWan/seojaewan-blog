_codocs:
  id: discussion-2026-10-30-capture-cache
  name: 논의 2026-10-30 캡처 보고서 캐시
  parent:
    - 논의 기록
질문: |
  PR 댓글의 캡처 표 그림이 고친 뒤에도 옛 그림으로 보인다. 왜 그렇고 어떻게 막을까.
과정: |
  - `tools/figma-parity/src/post-pr-comment.ts`를 읽었다. CI가 실행마다 그림만 담은 이력 없는 커밋을 `parity-report/pr-<번호>` 브랜치에 강제로 덮어쓰고, 댓글 그림 주소는 `.../blob/parity-report/pr-<번호>/<파일>?raw=true`로 브랜치 이름을 쓴다.
  - 그림 내용이 바뀌어도 주소가 같아, GitHub의 댓글 그림 프록시(camo)와 raw 주소 캐시가 옛 그림을 보여 준다.
검토한 대안: |
  - A 주소에 그 실행이 만든 보고 커밋 SHA를 넣는다: 실행마다 주소가 다르고 내용은 바뀌지 않는다. 같은 실행을 다시 돌려도 새 커밋이다.
  - B 브랜치 안 경로에 실행 번호를 넣는다: 같은 실행을 다시 돌리면 번호가 같아 시도 번호까지 넣어야 한다.
  - C 주소 끝에 `&v=<실행 번호>`를 붙인다: 고칠 곳은 가장 적지만 GitHub 캐시가 쿼리를 구분하는지 시험이 필요하다.
결정: |
  A. 그림을 먼저 커밋하고 SHA(`git rev-parse HEAD`)를 읽은 뒤 그 SHA로 주소를 만들어 댓글을 쓴다. 덮어써서 떨어져 나간 옛 커밋은 지워져도 댓글은 늘 마지막 실행 주소로 고쳐지므로 문제없다. PR이 닫히면 브랜치째 지우는 정리는 그대로다.
남은 일: |
  [[남은 작업]]의 문서 고침([[피그마 연동:CI]])과 코드 작업(캡처 도구). 한 PR에서 CI를 두 번 돌려 두 번째 댓글에 새 그림이 보이는지 확인한다.
