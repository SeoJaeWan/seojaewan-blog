_codocs:
  id: discussion-2026-10-30-doc-roles
  name: 논의 2026-10-30 문서 역할
  parent:
    - 논의 기록
질문: |
  원래 남은 논의 1번 "문서 역할 정리"(피그마와 겹치는 모양 설명 지우기, 컴포넌트 용도 표, 휴지통 비우기 조건 중복(76번), 메시지 상자 글자(33번))였다. 진행하며 문서 구조 전체의 문제로 넓어졌다.
과정: |
  1. 1-1 모양 설명 기준: 처음엔 "동작·계산·Windows 근거 값은 남기고 피그마가 보여 주는 크기·색만 지움"을 냈다. 사람이 "본문 폭 720, 목차 32, 경계 768도 피그마로 되지 않냐, 기능이 아닌 건 피그마로 충분하다"고 해 "피그마 그림으로 나타낼 수 없는 것만 문서"로 좁혔다. 사람이 "768은 foundation 값으로 둘 수 있지 않냐"고 해 경계값을 변수로 두는 방향이 나왔고, "최소·최대 크기를 피그마에서 못 가져오는 문제"를 물어 플러그인이 최소·최대 크기는 이미 읽음을 확인했다. 이어서 [[논의 2026-10-30 피그마 단일 기준 체계]]로 넓어졌다.
  2. 1-3 휴지통 비우기 조건: [[휴지통:비우기]]으로 옮기는 안을 내자, 사람이 작업 공간 문서가 어떤 문서인지 묻고 "개요와 섹션이 안 맞는 것 같다, 섹션들이 각각 문서가 되어야 하지 않냐"고 했다. 섹션별로 보니 방문자별 저장(사이트 전체 저장 규칙)과 다시 시작(기능 하나)이 개요와 맞지 않았다.
  3. 사람이 "배치는 바탕화면과 중복 아니냐", "Notion은 핵심 콘텐츠인데 정보가 흩어지지 않냐", "폴더 이름도 따로 있어야 하지 않냐, 등등"을 물었다. 확인하니 "배치"라는 말이 폴더 트리 위치와 바탕화면 격자 칸 두 개념에 쓰이고, Notion 정보는 다섯 문서에, 폴더 이름 규칙과 조작은 세 문서에 나뉘어 있었다.
  4. 사람이 "features뿐 아니라 문서들이 산재되어 구조가 모호하다, 기능 단위로 깔끔하게 정리할 수 있지 않냐"고 했다. 문서 개념 지도 조사를 했다(읽기만). 가장 흩어진 개념은 휴지통(8개 문서, 약 25개 섹션), 방문자 저장·다시 시작, 모바일 차이, 우클릭 메뉴·고정, Notion이고, 같은 사실이 두 곳 이상에 적힌 중복이 20곳(끌기 4px 다섯 곳, "이름 바꾸기는 폴더만" 네 곳 등), 성격이 섞인 문서가 작업 공간·Chrome·창 동작·검색·콘텐츠 원천 등 13개였다. 문서끼리 정면으로 어긋나는 규칙은 없었다.
  5. 사람이 "문서 구조 다시 짜기는 크니 마지막에 하자"고 했다.
검토한 대안: |
  - 휴지통 조건을 바탕화면 문서에도 적기, 바탕화면이 탐색기 문서를 가리키기: 중복이거나 방향이 어색해 고르지 않았다. 최종 자리는 문서 구조가 정해진 뒤 정한다.
  - 작업 공간의 모든 섹션을 각각 문서로: 배치·초기 구조·Notion과 맞추기·폴더 이름이 서로 엮여 있어 그대로 정하지 않고 문서 구조 논의로 넘겼다.
결정: |
  - 1-1: 피그마로 나타낼 수 있는 것은 피그마로 옮기고, 문서에는 동작과 입력·스크롤 판정 문턱, 실행 중 값만 둔다(세부 경계는 [[논의 2026-10-30 피그마 단일 기준 체계]]).
  - 1-2 용도 표: 피그마 description에 이미 있어 [[컴포넌트 목록]]의 표를 지운다.
  - 원래 1번을 "문서 구조 다시 짜기"로 넓혀 남은 논의의 마지막에 한다.
남은 일: |
  문서 구조 다시 짜기에서 정할 것: 기능 단위 문서 구성, 작업 공간 나누기, "배치"의 말과 경계, Notion 정보 모으기, 휴지통 비우기 조건의 자리(76번), 메시지 상자 글자(33번), 접근성 문서의 자리. 디자인 정보 조사와 개념 지도 조사의 결과를 바탕으로 한다.
