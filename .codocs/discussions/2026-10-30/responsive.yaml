_codocs:
  id: discussion-2026-10-30-responsive
  name: 논의 2026-10-30 반응형
  parent:
    - 논의 기록
질문: |
  지난 세션에서 모양은 PC·노트북·모바일 셋, 구간 셋, 어느 구간에서도 화면 전체가 보이게, PC와 노트북은 여백·글자 크기만 다르게 하기로 했다. 남은 것은 피그마 변형과 토큰을 어떻게 나눌지다.
과정: |
  1. 8-1 노트북 표현: 지금 피그마는 `Device=Desktop`(내보낸 그림 30개)·`Mobile`(26개) 변형이다. `Device=Laptop` 변형을 더하는 안과 변수 모드(PC·Laptop)로 값만 바꾸는 안을 비교했다.
  2. 8-2 경계값: 흔한 화면의 브라우저 안 크기(FHD 데스크톱 약 1920×950, Windows 노트북 125% 1536×약 730, HD 1366×약 640, MacBook Air 1440×약 800)를 보면 노트북은 폭보다 높이가 먼저 모자란다(Start 720, Chrome 기본 1280×800).
  3. 8-3: 처음에 "모바일보다 좁은 구간"으로 잘못 읽었다가, 구간 셋이 모양 셋과 짝이고 실제로 정할 것은 한 구간 안에서 크기가 넓게 변하는 점이라고 바로잡았다.
  4. 8-4: 경계값을 피그마 코드 전용 변수로 두고 토큰 생성이 만드는 안. 사람이 "시험부터 해 보고 결정하자", "확인하지 못한 것도 테스트할 수 있지 않냐"고 해 Tailwind 4.3.3 컴파일러와 실제 lint로 시험했다.
     - `@media` 안에서 `@theme` 변수 값을 바꾸면 클래스(`p-m` → `var(--spacing-m)`)가 따라간다.
     - 한 줄 짧은 형식 `@custom-variant laptop (@media (max-width: 1599px), (max-height: 899px))`은 쉼표에서 잘려 잘못된 CSS가 나온다. 블록 형식과 `or` 키워드는 정상이다(`or`는 새 문법이라 블록 형식을 고름).
     - `--breakpoint-*: initial`이면 `md:`·`sm:`이 만들어지지 않는다.
     - worktree에서 `tokens.css`에 변형을 넣고 lint를 돌리니 `laptop:`·`mobile:`은 통과, `md:`·`sm:`·`lg:`는 모르는 클래스로 막혔다.
검토한 대안: |
  - `Device=Laptop` 변형 추가: 여백·글자만 다른 같은 그림을 약 30개 두 벌 관리하게 되어 고르지 않았다.
  - 한 줄 형식 `@custom-variant`나 `or` 키워드: 앞은 깨지고 뒤는 오래된 브라우저 지원이 약하다.
결정: |
  - 8-1: 노트북은 변수 모드(PC·Laptop)로 간격·크기·글자 값만 바꾼다. 모바일은 지금처럼 `Device=Mobile` 변형이다. [[디자인 기반:모드]]의 "모드를 추가하지 않는다"는 다크 모드 이야기라 화면 크기 모드를 예외로 고친다.
  - 8-2: 노트북은 폭 1600 미만 또는 높이 900 미만, 모바일은 폭 768 미만(모바일 판정 먼저). 숫자는 Screens로 확인하며 조정한다.
  - 8-3: 지원하는 가장 작은 크기는 320×568. 구간 안에서 작아질 때는 이미 정한 줄어드는 규칙(창은 작업 영역 안으로, 패널은 가운데 본문만 줄여 스크롤, 탭 줄은 가로 스크롤)으로 맞추고, 구간마다 가장 작은 크기 Screens를 두어 잘리는 곳을 확인한다.
  - 8-4: 경계값은 피그마 코드 전용 변수 셋(`breakpoint/mobile/width`, `breakpoint/laptop/width`, `breakpoint/laptop/height`). 토큰 생성이 블록 형식 `@custom-variant`, 노트북 모드 값의 `@media`, `--breakpoint-*: initial`, TS 상수(`use-device`가 `pc | laptop | mobile`)를 만든다. `tokens.css` 밖의 `@custom-variant`는 stylelint로 막는다.
남은 일: |
  노트북 모드 값을 넣은 Screens로 경계값과 가장 작은 크기에서 잘리는 곳이 없는지 확인한다([[남은 작업]]의 시험·확인).
