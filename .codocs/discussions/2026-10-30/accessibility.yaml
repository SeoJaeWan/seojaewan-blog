_codocs:
  id: discussion-2026-10-30-accessibility
  name: 논의 2026-10-30 접근성
  parent:
    - 논의 기록
질문: |
  접근성 규칙이 문서 여러 곳에 흩어져 있고 공통 규칙이 없어 기능마다 작업자가 정해 왔다(68·56번 등). 포커스, Tab 순서, 영역 이름, 값을 고르는 버튼 이름, 역할의 공통 규칙을 정한다. 문서 자리는 문서 구조 논의에서 정한다.
과정: |
  1. 포커스: 처음엔 다섯 경우만 보였는데 사람이 "이게 다야?"라고 물어 문서와 코드를 다시 찾았다. 열 때 넣는 곳(찾기 막대, 새 탭 추천, 크게 보기, 모바일 검색 줄, 이름 바꾸기, Start 글자 격자, 메뉴·메시지 상자), 닫을 때 돌아가는 곳(크게 보기, ⋮ 메뉴, 우클릭 메뉴, 이름 오류 상자, 이름 바꾸기 끝, 모바일 검색 줄), 지운 뒤(바탕화면·탐색기 Delete), 화면 전체(다시 시작), 가두기·범위(크게 보기, 다시 시작 중 inert, Ctrl+F·배율 범위)가 있었다. 정한 것이 없는 곳은 창 열기·닫기·최소화, Start·검색 패널 닫기, 탭 닫기, 휴지통 비우기 상자였다. 설명이 길어지자 사람이 "뭐 어쩌자고"라고 해 규칙 세 줄로 줄였고 "딱 깔끔하다"고 했다.
  2. Tab: 바탕화면 아이콘, 탐색기 항목·탭, Chrome 탭, 탐색 창 트리, 메뉴는 묶음 한 번이고, Start 모두 목록 줄, Start 고정됨, 작업 표시줄 앱 버튼, 창 미리보기 카드, Snap Assist 목록, 탐색기 명령 모음은 항목마다 Tab이 걸린다.
  3. 영역 이름: Start "고정됨"·"모두"는 보이는 제목이 있는데 `aria-label`로 같은 글자를 또 적었다. 사람이 헷갈려 해 스크린 리더가 읽는 예와 코드 전후로 다시 설명했다.
  4. 값을 고르는 버튼: Start 모두 보기 버튼이 "범주, 버튼"으로만 들린다.
  5. 역할: [[기술 스택:동작 기반 라이브러리]]는 메뉴·다이얼로그·탭·툴팁을 Base UI에 맡긴다고 하는데, 코드는 탭·대화 상자 7곳·콤보박스·툴팁을 직접 만들었고 이유 기록은 거의 없었다(조사). 사람이 "직접 만든 게 진짜 필요했는지 확인", "시험이 필요한 건 시험까지 하고 오라"고 해 격리된 작업 공간에서 Base UI 1.9.0으로 jsdom·Chromium 시험을 했다.
     - 바꿀 수 있음: 탭(닫기 버튼 키 전파만 막으면 됨), 확대/축소 줄(`Menu.Item` `closeOnClick={false}`로 ↑↓에 닿음), 버튼 역할 `div`(`Button` `render`), Start·검색 패널(비모달 Dialog, Start 버튼·검색칸 누르기 거르기)
     - 일부만: 주소창·새 탭 추천(마지막 ↓, 한글 조합 중 키, Esc 되돌리기 직접, SearchBox가 role을 덮음), Snap Assist(빈 곳 누르기), 이미지 크게 보기(밖이 `aria-hidden`이 되고 바깥 클릭에 포커스가 빠짐)
     - 바꿀 수 없음: 탐색 창 트리(Base UI에 Tree 없음. 게다가 ↑↓·Home/End·부모/자식 이동이 구현돼 있지 않음을 시험으로 확인)
     - 직접이 맞음: 바탕화면·탐색기 항목 목록, 툴팁(트리거 없는 표시), 체크박스(기록된 이유 유효)
  6. 사람이 "일부만 가능한 것은 제외하고 바꿀 수 있는 것만 바꾸자"고 했다.
검토한 대안: |
  - 일부만 되는 부품까지 Base UI로 바꾸기: 직접 남는 동작이 많아 고르지 않았다.
  - Start·검색 패널을 지금처럼 포커스가 밖에 나가도 열어 두기: Windows 11 Start와 달라 고르지 않았다.
결정: |
  - 포커스: 무언가를 열면 그 안에서 바로 쓸 곳에 둔다. 포커스를 가진 것이 사라지면 연 것 → 가장 가까운 내용 → 담은 창·화면 차례로 옮긴다. 겹쳐 뜨는 모달은 열려 있는 동안 가둔다. 기능 문서에는 규칙과 다른 경우만 적는다. 68번은 규칙으로 정리돼 지운다.
  - Tab: 여러 항목이 모인 묶음은 Tab으로 한 번만 닿고(고른 항목, 없으면 첫 항목) 안에서는 방향키로 옮긴다.
  - 영역 이름: 보이는 제목이 있으면 제목 태그로 그리고 `aria-labelledby`로 가리킨다. 보이는 제목이 없을 때만 `aria-label`. 56번은 이것으로 정리돼 지운다.
  - 고른 값을 보여 주는 버튼은 이름을 `무엇: 값`으로 한다(`보기: 범주`).
  - 역할: WAI-ARIA APG 패턴을 따른다. Base UI에 있으면 쓰고, 없거나 Windows 동작을 맞출 수 없을 때만 직접 만들어 "직접 만든 부품" 표에 이유를 적는다. 바꾸는 것은 탭·확대/축소 줄·버튼 역할 `div`·Start·검색 패널이고, Start·검색 패널은 포커스가 밖에 나가면 닫는다(Base UI 기본).
  - 탐색 창 트리 키보드, 새 탭 검색 `combobox` 역할 덮임, 이름 오류 말풍선 읽기는 코드 작업에 넣는다.
남은 일: |
  접근성 문서의 자리는 [[논의 2026-10-30 문서 역할]]에 이어지는 문서 구조 논의에서 정한다. 시험 코드는 `.claude/worktrees/agent-a8bc86616dc00928e/apps/web/src/__experiments__/`에 있고 결정이 끝나면 worktree를 지운다.
